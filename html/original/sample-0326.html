<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Trim Feature Information</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e8e3;
      color: #19201b;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 30px 28px;
      background: #fbfcf8;
    }

    .feature {
      width: 100%;
    }

    .hero {
      width: 334px;
      height: 138px;
      margin: 0 0 24px;
      border-radius: 14px;
      object-fit: cover;
      display: block;
      background: #cad1c7;
    }

    .feature-label {
      margin: 0 0 7px;
      color: #247a48;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 310px;
      font-size: 31px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 12px 0 0;
      color: #4f5851;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
    }

    .detail {
      margin: 21px 0 24px;
      padding: 18px 0 0;
      border-top: 1px solid #d9ded8;
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .detail-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #dcefe2;
      color: #247a48;
    }

    .detail-copy {
      margin: 0;
      color: #39423b;
      font-size: 14px;
      line-height: 21px;
    }

    .detail-copy strong {
      display: block;
      color: #19201b;
      font-weight: 600;
    }

    .primary-action {
      width: 100%;
      min-height: 50px;
      padding: 13px 20px;
      border: 0;
      border-radius: 14px;
      background: #247a48;
      color: #ffffff;
      font: 600 16px/24px 'Source Serif 4', Georgia, serif;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="feature" aria-labelledby="feature-title">
      <img
        class="hero"
        src="https://loremflickr.com/334/138/studio?lock=4810"
        width="334"
        height="138"
        alt="Microphones and recording equipment in a podcast studio"
      >

      <p class="feature-label">Smart Trim</p>
      <h1 id="feature-title">Spend less time in silence</h1>
      <p class="description">
        Liltwave shortens long pauses in talk shows while keeping every spoken word and natural breath intact.
      </p>

      <div class="detail">
        <div class="detail-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 10h2m2-4v8m3-11v14m3-9v4m3-7v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="detail-copy">
          <strong>You stay in control</strong>
          Turn Smart Trim off anytime from the player menu.
        </p>
      </div>

      <button class="primary-action" type="button">Turn on Smart Trim</button>
    </article>
  </div>
</body>
</html>
