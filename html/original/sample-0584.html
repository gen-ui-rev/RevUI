<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Alderline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8e4;
      color: #20202a;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #d8d7d2;
    }

    .topbar {
      min-height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dedde4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #37317f;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand svg {
      width: 25px;
      height: 25px;
      flex: none;
    }

    .help-link,
    .text-link {
      color: #494197;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .help-link {
      font-size: 14px;
    }

    .hero {
      width: 390px;
      height: 116px;
      object-fit: cover;
      display: block;
      background: #d8d5cc;
    }

    .content {
      padding: 0 24px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #d9d8df;
    }

    .auth-tab {
      padding: 15px 8px 12px;
      color: #676672;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 3px solid transparent;
    }

    .auth-tab.active {
      color: #484091;
      border-bottom-color: #5146a5;
    }

    .intro {
      margin-top: 21px;
    }

    h1 {
      margin: 0;
      color: #262354;
      font-size: 30px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .intro p {
      margin: 7px 0 0;
      color: #62616b;
      font-size: 15px;
      line-height: 1.45;
    }

    .login-form {
      margin-top: 18px;
    }

    .field + .field {
      margin-top: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #34333d;
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid #aaa8b4;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #25242d;
      font-size: 15px;
    }

    .password-input {
      padding-right: 48px;
      letter-spacing: 2px;
    }

    .reveal-button {
      position: absolute;
      top: 0;
      right: 0;
      width: 46px;
      height: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #555360;
    }

    .reveal-button svg {
      width: 20px;
      height: 20px;
    }

    .forgot-row {
      margin-top: 8px;
      text-align: right;
      font-size: 14px;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      height: 48px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
    }

    .primary-button {
      margin-top: 18px;
      border: 1px solid #4c429d;
      background: #4c429d;
      color: #ffffff;
    }

    .divider {
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #787681;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #dedde3;
    }

    .secondary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #777384;
      background: #ffffff;
      color: #302e38;
    }

    .secondary-button svg {
      width: 19px;
      height: 19px;
      color: #4c429d;
    }

    .signup-note {
      margin: 19px 0 0;
      color: #575660;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .footer {
      margin-top: auto;
      padding: 14px 24px 15px;
      display: flex;
      justify-content: center;
      gap: 22px;
      border-top: 1px solid #e1e0e5;
      color: #686771;
      font-size: 12px;
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand" aria-label="Alderline Learning">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4.75c2.72-.56 5.2.06 8 1.85v12.2c-2.8-1.78-5.28-2.4-8-1.84V4.75Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M20 4.75c-2.72-.56-5.2.06-8 1.85v12.2c2.8-1.78 5.28-2.4 8-1.84V4.75Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Alderline</span>
      </div>
      <a class="help-link" href="#">Help</a>
    </header>

    <img class="hero" src="https://loremflickr.com/390/116/library?lock=7810" width="390" height="116" alt="Open books arranged on a library study table">

    <main class="content">
      <nav class="auth-tabs" aria-label="Account access">
        <a class="auth-tab active" href="#" aria-current="page">Sign in</a>
        <a class="auth-tab" href="#">Create account</a>
      </nav>

      <section class="intro">
        <h1>Continue learning</h1>
        <p>Sign in with the email and password for your existing Alderline account.</p>
      </section>

      <form class="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" value="alex.mercer@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" type="password" value="Fieldnotes27" autocomplete="current-password">
            <button class="reveal-button" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.8 12s3.3-5.1 9.2-5.1S21.2 12 21.2 12s-3.3 5.1-9.2 5.1S2.8 12 2.8 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-row">
          <a class="text-link" href="#">Forgot password?</a>
        </div>

        <button class="primary-button" type="submit">Sign in</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button class="secondary-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20h16M6.5 20V9.5m3.7 10.5V9.5M13.8 20V9.5m3.7 10.5V9.5M4.5 7.5 12 3l7.5 4.5v2H4.5v-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Use school single sign-on
      </button>

      <p class="signup-note">New to Alderline? <a class="text-link" href="#">Create a new account</a></p>
    </main>

    <footer class="footer">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Accessibility</a>
    </footer>
  </div>
</body>
</html>
