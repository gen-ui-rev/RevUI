<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern Miles Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9dbe1;
      color: #20212a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f7;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e3e4e9;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #28206f;
    }

    .brand svg {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
    }

    .brand-name {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
    }

    .sign-in {
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: #42369a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    main {
      flex: 1;
      padding: 72px 22px 24px;
    }

    .welcome-card {
      padding: 30px 26px 26px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(36, 38, 56, 0.09);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #5549aa;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 290px;
      color: #20212a;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 40px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 20px 0 0;
      color: #5f616d;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.55;
    }

    .primary-action {
      width: 100%;
      margin-top: 28px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 14px;
      background: #4438a1;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }

    .primary-action svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .tabbar {
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      padding: 9px 8px 12px;
      background: #ffffff;
      border-top: 1px solid #dedfe5;
    }

    .tab {
      min-width: 72px;
      padding: 4px 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #777985;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #4438a1;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand" aria-label="Lantern Miles">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <circle cx="13" cy="13" r="10.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16.9 8.2L14.6 14.5L8.3 16.8L10.6 10.5L16.9 8.2Z" fill="currentColor"/>
          <circle cx="12.6" cy="12.5" r="1.4" fill="#ffffff"/>
        </svg>
        <p class="brand-name">Lantern Miles</p>
      </div>
      <button class="sign-in" type="button">Sign in</button>
    </header>

    <main>
      <section class="welcome-card" aria-labelledby="welcome-title">
        <p class="eyebrow">Plan with a clear path</p>
        <h1 id="welcome-title">Your next trip, gathered in one place.</h1>
        <p class="intro">
          Compare stays, map each stop, and keep every booking detail ready for the road.
        </p>
        <button class="primary-action" type="button">
          Start planning
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3.75 9H14.25M10.25 5L14.25 9L10.25 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M15.5 8.5L13.4 13.4L8.5 15.5L10.6 10.6L15.5 8.5Z" fill="currentColor"/>
        </svg>
        <span>Explore</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 7.5H19.5V18.5H4.5V7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8.5 7.5V5.5C8.5 4.95 8.95 4.5 9.5 4.5H14.5C15.05 4.5 15.5 4.95 15.5 5.5V7.5M8 11V15M16 11V15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Trips</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 4.5H17.5V19.5L12 16.1L6.5 19.5V4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Saved</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 19C6.15 15.95 8.35 14.5 12 14.5C15.65 14.5 17.85 15.95 18.5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
