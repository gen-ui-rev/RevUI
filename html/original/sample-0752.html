<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save to collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8A7361;
    --accent-10:rgba(138,115,97,0.10);
    --accent-16:rgba(138,115,97,0.16);
    --ink:#231F1B;
    --muted:#7C736B;
  }
  html,body{margin:0;}
  body{
    background:#E7E4DF;
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:32px 24px;
    background:#E7E4DF;
  }
  .card{
    background:#FFFFFF;
    border-radius:10px;
    padding:24px 20px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 18px;
    line-height:1.25;
  }
  .item{
    display:flex;
    gap:12px;
    align-items:center;
    background:var(--accent-10);
    border-radius:10px;
    padding:12px;
  }
  .thumb{
    width:52px;
    height:52px;
    border-radius:10px;
    background:var(--accent-16);
    flex:none;
  }
  .item-body{min-width:0;}
  .item-title{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .section-label{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin:22px 0 10px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    border-radius:10px;
  }
  .row + .row{margin-top:6px;}
  .row.selected{background:var(--accent-10);}
  .swatch{
    width:32px;
    height:32px;
    border-radius:10px;
    background:var(--accent-16);
    flex:none;
  }
  .row-text{flex:1;min-width:0;}
  .row-name{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-count{
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .check{flex:none;}
  .new{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    margin-top:6px;
  }
  .new-icon{
    width:32px;height:32px;border-radius:10px;
    background:var(--accent-10);
    flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .new-label{
    font-size:15px;
    font-weight:500;
    color:var(--accent);
  }
  .save{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin-top:20px;
    padding:15px 16px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#FFFFFF;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Save</p>
      <h1>Save to a collection</h1>

      <div class="item">
        <div class="thumb"></div>
        <div class="item-body">
          <p class="item-title">Repotting a fiddle leaf fig</p>
          <p class="item-meta">Nadia Kellerman · Plant Corner</p>
        </div>
      </div>

      <p class="section-label">Collections</p>

      <div class="row selected">
        <div class="swatch"></div>
        <div class="row-text">
          <div class="row-name">Weekend reading</div>
          <div class="row-count">18 items · Private</div>
        </div>
        <svg class="check" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4.5 10.5l3.5 3.5 7.5-8" stroke="#8A7361" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="row">
        <div class="swatch"></div>
        <div class="row-text">
          <div class="row-name">Apartment plants</div>
          <div class="row-count">7 items · Shared with 3</div>
        </div>
      </div>

      <div class="row">
        <div class="swatch"></div>
        <div class="row-text">
          <div class="row-name">Ask the group later</div>
          <div class="row-count">2 items · Private</div>
        </div>
      </div>

      <div class="new">
        <div class="new-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9" stroke="#8A7361" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="new-label">New collection</div>
      </div>

      <div class="save">Save to Weekend reading</div>
    </div>
  </div>
</body>
</html>
