<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer in progress — Ledgerway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e8e9e6;
    font-family:'Roboto', system-ui, sans-serif;
    color:#1c1e1a;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:36px 24px;
    background:#f1f2ef;
  }
  .card{
    background:#ffffff;
    border-radius:6px;
    box-shadow:0 2px 10px rgba(28,30,26,0.10);
    padding:22px 20px 20px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#6d7268;
    margin:0 0 14px;
  }
  .file{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .file img{
    display:block;
    width:56px;
    height:56px;
    border-radius:6px;
    object-fit:cover;
    background:#dfe1dc;
    flex:none;
  }
  .file-meta{min-width:0;}
  .name{
    font-size:16px;
    font-weight:500;
    margin:0 0 4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sub{
    font-size:13px;
    color:#6d7268;
    margin:0;
  }
  .bar-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:24px 0 8px;
  }
  .pct{
    font-size:28px;
    font-weight:700;
    line-height:1;
  }
  .pct span{
    font-size:15px;
    font-weight:400;
    color:#6d7268;
    margin-left:2px;
  }
  .eta{
    font-size:13px;
    color:#6d7268;
  }
  .track{
    height:10px;
    border-radius:6px;
    background:#e8e9e6;
    overflow:hidden;
  }
  .fill{
    width:68%;
    height:100%;
    background:#c4e538;
    border-radius:6px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    margin:14px 0 0;
    font-size:14px;
    color:#3a3d36;
  }
  .status svg{flex:none;}
  .note{
    margin:18px 0 0;
    padding-top:16px;
    border-top:1px solid #e8e9e6;
    font-size:13px;
    line-height:1.5;
    color:#6d7268;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    text-align:center;
    font-size:14px;
    font-weight:500;
    border-radius:6px;
    padding:11px 0;
    box-sizing:border-box;
  }
  .btn-ghost{
    border:1px solid #cfd2cb;
    color:#3a3d36;
    background:#fff;
  }
  .btn-solid{
    background:#1c1e1a;
    color:#ffffff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Uploading to Ledgerway vault</p>

      <div class="file">
        <img src="https://loremflickr.com/56/56/chart?lock=6061" width="56" height="56" alt="Preview of the quarterly statement page showing a balance chart">
        <div class="file-meta">
          <p class="name">Q3-2025-Statement.pdf</p>
          <p class="sub">4.2 MB of 6.1 MB &middot; Checking 4471</p>
        </div>
      </div>

      <div class="bar-head">
        <div class="pct">68<span>%</span></div>
        <div class="eta">About 12 seconds left</div>
      </div>
      <div class="track"><div class="fill"></div></div>

      <p class="status">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="#3a3d36" stroke-width="1.4"/>
          <path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" stroke="#3a3d36" stroke-width="1.4"/>
        </svg>
        Encrypted before it leaves this device
      </p>

      <p class="note">This transfer lives here until it finishes. Files you keep for offline reading stay in Documents.</p>

      <div class="actions">
        <span class="btn btn-ghost">Cancel</span>
        <span class="btn btn-solid">Run in background</span>
      </div>
    </div>
  </div>
</body>
</html>
