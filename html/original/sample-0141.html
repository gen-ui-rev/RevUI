<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode Actions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e4e3;
      color: #292426;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f8f6f5;
    }

    .action-menu {
      width: 100%;
    }

    .service-name {
      margin: 0 0 8px;
      color: #766d70;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #b63862;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.28;
    }

    .episode-title {
      margin: 12px 0 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
    }

    .episode-meta {
      margin: 4px 0 24px;
      color: #766d70;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .action-list {
      border-top: 1px solid #d9d3d2;
    }

    .action {
      width: 100%;
      margin: 0;
      padding: 16px 0;
      display: block;
      border: 0;
      border-bottom: 1px solid #d9d3d2;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .action-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .action-detail {
      display: block;
      margin-top: 3px;
      color: #766d70;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-menu" aria-labelledby="action-title">
      <p class="service-name">Vela Audio</p>
      <h1 id="action-title">Choose an episode action</h1>
      <p class="episode-title">Why Familiar Songs Stay With Us</p>
      <p class="episode-meta">The Listening Lab · 38 min</p>

      <div class="action-list" role="menu" aria-label="Episode actions">
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Play next</span>
          <span class="action-detail">Start after the current episode</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Save to My List</span>
          <span class="action-detail">Keep this episode for later</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Remove download</span>
          <span class="action-detail">Free 48 MB on this device</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
