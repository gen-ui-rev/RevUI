<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Actions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 40px 0;
      background: #dedcdf;
      color: #29262a;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 22px;
      background: #efedef;
    }

    .action-sheet {
      width: 100%;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(42, 35, 40, 0.11);
    }

    .sheet-header {
      padding: 25px 24px 21px;
      border-bottom: 1px solid #e8e3e7;
    }

    .context {
      margin: 0 0 7px;
      color: #6d666b;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      color: #875f79;
      font-size: 23px;
      line-height: 1.35;
      font-weight: 600;
    }

    .note-name {
      margin: 9px 0 0;
      color: #504a4e;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      padding: 8px 0;
    }

    .action {
      display: block;
      width: 100%;
      padding: 15px 24px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .action + .action {
      border-top: 1px solid #eee9ec;
    }

    .action-title {
      display: block;
      margin-bottom: 3px;
      color: #302c2f;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
    }

    .action-description {
      display: block;
      color: #777075;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .action:focus-visible {
      outline: 2px solid #875f79;
      outline-offset: -4px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-sheet" aria-labelledby="action-title">
      <header class="sheet-header">
        <p class="context">Lattice Notes</p>
        <h1 id="action-title">Choose an action</h1>
        <p class="note-name">For “Weekly project planning”</p>
      </header>

      <div class="actions" role="menu" aria-label="Note actions">
        <button class="action" type="button" role="menuitem">
          <span class="action-title">Move to another project</span>
          <span class="action-description">Choose a different workspace location</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-title">Make a copy</span>
          <span class="action-description">Keep the original and create a duplicate</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-title">Archive note</span>
          <span class="action-description">Remove it from active project notes</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
