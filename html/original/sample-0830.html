<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avenfit Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9d5;
      color: #20201e;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 48px 20px;
      background: #f5f4f0;
    }

    .activity {
      width: 100%;
      padding: 20px;
      background: #fffefa;
      border: 1px solid #cecdc7;
      border-top: 4px solid #e96519;
      border-radius: 0;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .service {
      margin: 0;
      color: #55544f;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b8430b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #e96519;
    }

    .workout-name {
      margin: 0 0 6px;
      color: #20201e;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }

    .elapsed {
      margin: 0;
      color: #e05b13;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .elapsed-label {
      margin: 5px 0 20px;
      color: #6a6963;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      margin-bottom: 18px;
      background: #e5e3dc;
    }

    .progress-fill {
      width: 61%;
      height: 100%;
      background: #e96519;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid #deddd7;
      padding-top: 16px;
    }

    .metric + .metric {
      border-left: 1px solid #deddd7;
      padding-left: 20px;
    }

    .metric-value {
      margin: 0 0 3px;
      color: #20201e;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      margin: 0;
      color: #6a6963;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Live walking workout">
      <div class="activity-header">
        <p class="service">Avenfit Health</p>
        <div class="live" aria-label="Live activity">
          <span class="live-dot" aria-hidden="true"></span>
          <span>LIVE</span>
        </div>
      </div>

      <p class="workout-name">Outdoor walk</p>
      <p class="elapsed">24:18</p>
      <p class="elapsed-label">Elapsed time</p>

      <div class="progress-track" aria-label="61 percent of 40-minute goal complete">
        <div class="progress-fill"></div>
      </div>

      <div class="metrics">
        <div class="metric">
          <p class="metric-value">1.82 mi</p>
          <p class="metric-label">Distance</p>
        </div>
        <div class="metric">
          <p class="metric-value">126 bpm</p>
          <p class="metric-label">Heart rate</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
