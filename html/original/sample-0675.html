<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathnest Upload Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8e9;
      color: #272326;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f8f7f7;
    }

    .upload-panel {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #ded9dc;
      border-radius: 6px;
    }

    .heading-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .upload-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      color: #c92f72;
      background: #fbeaf2;
      border-radius: 6px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 5px 0 0;
      color: #70696d;
      font-size: 14px;
      line-height: 1.5;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .progress-value {
      color: #c92f72;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 9px;
      background: #eee9eb;
      border-radius: 6px;
    }

    .progress-fill {
      width: 68%;
      height: 6px;
      background: #d4377b;
      border-radius: 6px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      padding: 14px;
      border: 1px solid #e3dee0;
      border-radius: 6px;
    }

    .file-row img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      object-fit: cover;
      display: block;
      background: #e5e1e2;
      border-radius: 6px;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      margin: 0;
      overflow: hidden;
      color: #302b2e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-detail {
      margin: 5px 0 0;
      color: #766f73;
      font-size: 12px;
      line-height: 1.4;
    }

    .support-note {
      margin: 18px 0 0;
      color: #766f73;
      font-size: 12px;
      line-height: 1.55;
    }

    .cancel-button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 16px;
      border: 1px solid #d6cfd2;
      border-radius: 6px;
      background: #ffffff;
      color: #4f484c;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="upload-panel" aria-labelledby="upload-title">
      <div class="heading-row">
        <div class="upload-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4M12 4L7.5 8.5M12 4L16.5 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 14.5V18.5C5 19.3284 5.67157 20 6.5 20H17.5C18.3284 20 19 19.3284 19 18.5V14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1 id="upload-title">Uploading trip photos</h1>
          <p class="intro">Adding 3 files to your Lisbon itinerary in Pathnest.</p>
        </div>
      </div>

      <div class="progress-meta">
        <span>2 of 3 files</span>
        <span class="progress-value">68%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="progress-fill"></div>
      </div>

      <div class="file-row">
        <img src="https://loremflickr.com/72/72/cityscape?lock=8970" width="72" height="72" alt="Lisbon cityscape photo being uploaded">
        <div class="file-info">
          <p class="file-name">lisbon-overlook.jpg</p>
          <p class="file-detail">8.4 MB of 12.3 MB uploaded</p>
        </div>
      </div>

      <p class="support-note">Uploaded files are added to this trip. They are not saved to your offline downloads.</p>

      <button class="cancel-button" type="button">Cancel upload</button>
    </section>
  </div>
</body>
</html>
