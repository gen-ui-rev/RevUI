<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales by Category</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1da;
      color: #1d211b;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 20px;
      background: #f3f4ef;
    }

    .chart-card {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d7dbd0;
      border-radius: 4px;
    }

    .eyebrow {
      margin: 0;
      color: #65705b;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 26px;
    }

    .summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .total {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: -0.03em;
    }

    .period {
      margin: 0 0 3px;
      color: #687064;
      font-size: 12px;
      font-weight: 400;
      line-height: 17px;
      white-space: nowrap;
    }

    .divider {
      margin-top: 16px;
      border-top: 1px solid #e0e3da;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 14px;
      color: #555e50;
      font-size: 12px;
      line-height: 17px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .legend-current {
      width: 14px;
      height: 8px;
      background: #b8ef35;
      border: 1px solid #98c82c;
      border-radius: 4px;
    }

    .legend-prior {
      width: 14px;
      height: 8px;
      position: relative;
      border-bottom: 1px solid #d9ddd3;
    }

    .legend-prior::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      width: 2px;
      height: 10px;
      background: #596052;
    }

    .plot {
      margin-top: 18px;
    }

    .bar-row {
      margin-bottom: 14px;
    }

    .bar-row:last-of-type {
      margin-bottom: 0;
    }

    .bar-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      line-height: 20px;
    }

    .category {
      min-width: 0;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value {
      flex: none;
      font-weight: 700;
    }

    .track {
      position: relative;
      width: 100%;
      height: 8px;
      margin-top: 6px;
      background: #eaede5;
      border-radius: 4px;
    }

    .fill {
      height: 8px;
      background: #b8ef35;
      border: 1px solid #98c82c;
      border-radius: 4px;
    }

    .prior-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 14px;
      background: #596052;
    }

    .axis {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #737a6e;
      font-size: 12px;
      line-height: 17px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="chart-card" aria-labelledby="chart-title">
      <p class="eyebrow">Pinebasket seller report</p>
      <h1 id="chart-title">Net sales by category</h1>

      <div class="summary">
        <p class="total">$24,860</p>
        <p class="period">Mar 4–10, 2025</p>
      </div>

      <div class="divider"></div>

      <div class="legend" aria-label="Chart legend">
        <span class="legend-item">
          <span class="legend-current" aria-hidden="true"></span>
          Current week
        </span>
        <span class="legend-item">
          <span class="legend-prior" aria-hidden="true"></span>
          Prior week
        </span>
      </div>

      <div class="plot" role="img" aria-label="Horizontal bar chart comparing current and prior week net sales across six product categories">
        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Home goods</span>
            <span class="value">$6,320</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 98.8%;"></div>
            <span class="prior-marker" style="left: 85.9%;"></span>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Beauty</span>
            <span class="value">$4,980</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 77.8%;"></div>
            <span class="prior-marker" style="left: 74.2%;"></span>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Apparel</span>
            <span class="value">$4,310</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 67.3%;"></div>
            <span class="prior-marker" style="left: 75%;"></span>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Electronics</span>
            <span class="value">$3,820</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 59.7%;"></div>
            <span class="prior-marker" style="left: 54.3%;"></span>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Kitchen</span>
            <span class="value">$2,980</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 46.6%;"></div>
            <span class="prior-marker" style="left: 38.5%;"></span>
          </div>
        </div>

        <div class="bar-row">
          <div class="bar-label">
            <span class="category">Stationery</span>
            <span class="value">$2,450</span>
          </div>
          <div class="track">
            <div class="fill" style="width: 38.3%;"></div>
            <span class="prior-marker" style="left: 42.2%;"></span>
          </div>
        </div>

        <div class="axis" aria-hidden="true">
          <span>$0</span>
          <span>$3.2K</span>
          <span>$6.4K</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
