<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbay Invest — Portfolio</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 40px 0;
    background: #f2f2f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 40px 24px;
    background: #f2f2f0;
  }
  .card {
    box-sizing: border-box;
    width: 100%;
    background: #ffffff;
    border: 1px solid #dcdcd8;
    border-radius: 10px;
    padding: 20px;
  }
  .hero {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e4e4e0;
  }
  .hero img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: #dedede;
  }
  .eyebrow {
    margin: 18px 0 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #c62d1f;
  }
  h1 {
    margin: 8px 0 0;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 600;
  }
  .body {
    margin: 8px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: #5c5c58;
  }
  .cta {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin-top: 20px;
    padding: 14px 16px;
    border: 1px solid #c62d1f;
    border-radius: 10px;
    background: #c62d1f;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  .secondary {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin-top: 10px;
    padding: 14px 16px;
    border: 1px solid #dcdcd8;
    border-radius: 10px;
    background: #ffffff;
    color: #1a1a1a;
    font-family: inherit;
    font-size: 15px;
    font-weight: 400;
    text-align: center;
    text-decoration: none;
  }
  .note {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 1.4;
    color: #86867f;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/300/150/chart?lock=4683" width="300" height="150" alt="Printed performance chart on a desk, illustrating an empty portfolio">
      </div>
      <p class="eyebrow">Portfolio</p>
      <h1>No holdings tracked yet</h1>
      <p class="body">Add a stock, fund, or bond you already own and Northbay Invest will track its value, dividends, and cost basis from the purchase date forward.</p>
      <a class="cta" href="#">Add your first holding</a>
      <a class="secondary" href="#">Import from a brokerage</a>
      <p class="note">Importing pulls the last 24 months of trades. Takes about 2 minutes.</p>
    </div>
  </div>
</body>
</html>
