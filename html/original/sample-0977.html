<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidewater — Transfer complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:40px 0;margin:0;background:#4a4f55;
    font-family:'Source Serif 4',Georgia,serif;
  }
  .screen{
    width:390px;height:844px;background:#eceeef;position:relative;
    color:#22262a;
  }
  .topbar{
    height:58px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;background:#eceeef;
  }
  .topbar .label{font-size:15px;font-weight:600;letter-spacing:.02em;color:#5b636a;}
  .topbar .close{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    color:#5b636a;
  }
  .content{padding:0 20px;}
  .mark{
    margin:44px auto 0;width:92px;height:92px;border-radius:50%;
    background:#6e8ca0;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 12px #dde5ea;
  }
  h1{
    font-size:27px;font-weight:700;line-height:1.25;text-align:center;
    margin:30px 0 0;letter-spacing:-.01em;
  }
  .amount{
    text-align:center;font-size:38px;font-weight:600;margin:14px 0 0;
    letter-spacing:-.02em;color:#6e8ca0;
  }
  .sub{
    text-align:center;font-size:14px;line-height:1.5;color:#6b737a;
    margin:10px auto 0;max-width:264px;
  }
  .card{
    margin-top:34px;background:#ffffff;border-radius:4px;
    box-shadow:0 2px 10px rgba(34,38,42,.09);padding:6px 18px;
  }
  .row{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:15px 0;border-bottom:1px solid #eceeef;
  }
  .row:last-child{border-bottom:none;}
  .row .k{font-size:14px;color:#7a8288;flex:0 0 auto;}
  .row .v{
    font-size:15px;font-weight:600;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .actions{margin-top:26px;}
  .btn{
    display:block;width:100%;border-radius:4px;background:#6e8ca0;color:#ffffff;
    font-family:inherit;font-size:16px;font-weight:600;text-align:center;
    padding:15px 0;border:none;
  }
  .link{
    display:block;text-align:center;font-size:15px;font-weight:600;
    color:#6e8ca0;margin-top:18px;text-decoration:none;
  }
  .tabbar{
    position:absolute;left:0;bottom:0;width:100%;height:74px;
    background:#ffffff;border-top:1px solid #dfe3e5;
    display:flex;align-items:center;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
    font-size:12px;color:#8a9198;
  }
  .tab.on{color:#6e8ca0;font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="label">Transfer</span>
      <span class="close" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 4l10 10M14 4L4 14"/>
        </svg>
      </span>
    </div>

    <div class="content">
      <div class="mark">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 23.5l6.5 6.5L32 15"/>
        </svg>
      </div>

      <h1>Transfer complete</h1>
      <p class="amount">$1,250.00</p>
      <p class="sub">Sent from Everyday Checking. A receipt was saved to your activity.</p>

      <div class="card">
        <div class="row">
          <span class="k">Recipient</span>
          <span class="v">Marisol Vance</span>
        </div>
        <div class="row">
          <span class="k">Arrives</span>
          <span class="v">Today by 5:00 PM</span>
        </div>
        <div class="row">
          <span class="k">Reference</span>
          <span class="v">TW-90412-8837</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" type="button">Done</button>
        <a class="link" href="#">View receipt</a>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l8-6 8 6v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/>
        </svg>
        <span>Home</span>
      </div>
      <div class="tab on">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8h13M12 4l4 4-4 4M19 14H6M10 18l-4-4 4-4"/>
        </svg>
        <span>Move</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="5" width="17" height="12" rx="1.5"/>
          <path d="M2.5 9.5h17"/>
        </svg>
        <span>Cards</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="8" r="3.5"/>
          <path d="M4.5 18.5c1.3-3.2 3.7-4.6 6.5-4.6s5.2 1.4 6.5 4.6"/>
        </svg>
        <span>Profile</span>
      </div>
    </div>
  </div>
</body>
</html>
