<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e8e2;
      color: #20221d;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f7f8f3;
    }

    .delete-panel {
      width: 100%;
      padding: 22px 16px 18px;
      background: #ffffff;
      border: 1px solid #cfd2c8;
      border-top: 4px solid #b7e63c;
      border-radius: 4px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #596052;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.18;
      font-weight: 700;
    }

    .intro {
      margin: 10px 0 18px;
      color: #4d5249;
      font-size: 15px;
      line-height: 1.45;
    }

    .trip {
      display: flex;
      gap: 12px;
      padding: 10px;
      border: 1px solid #d8dbd2;
      border-radius: 4px;
      background: #fafbf7;
    }

    .trip img {
      width: 88px;
      height: 76px;
      flex: 0 0 auto;
      object-fit: cover;
      display: block;
      background: #d9ddd3;
      border-radius: 4px;
    }

    .trip-details {
      min-width: 0;
      padding-top: 2px;
    }

    .trip-name {
      margin: 0 0 3px;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
    }

    .trip-meta {
      margin: 0;
      color: #5b6057;
      font-size: 14px;
      line-height: 1.35;
    }

    .warning {
      margin: 16px 0 18px;
      padding-left: 12px;
      border-left: 3px solid #b7e63c;
      color: #383c35;
      font-size: 14px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border-radius: 4px;
      font: 600 15px/1.3 'Source Serif 4', Georgia, serif;
      cursor: pointer;
    }

    .delete-button {
      color: #1d2117;
      background: #b7e63c;
      border: 1px solid #94bd26;
    }

    .archive-button {
      color: #30342d;
      background: #ffffff;
      border: 1px solid #aeb3a7;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="delete-panel" aria-labelledby="delete-title">
      <p class="eyebrow">Northway trip</p>
      <h1 id="delete-title">Delete this trip?</h1>
      <p class="intro">This permanently removes the itinerary, notes, and saved places from your account.</p>

      <div class="trip">
        <img src="https://loremflickr.com/88/76/hotel?lock=10290" width="88" height="76" alt="Coastal hotel reserved for the Monterey trip">
        <div class="trip-details">
          <p class="trip-name">Monterey coast weekend</p>
          <p class="trip-meta">Tideglass Inn</p>
          <p class="trip-meta">May 16–18, 2026</p>
        </div>
      </div>

      <p class="warning">Deletion cannot be undone. Archiving hides this trip while keeping its details available later.</p>

      <div class="actions">
        <button class="delete-button" type="button">Delete permanently</button>
        <button class="archive-button" type="button">Archive instead</button>
      </div>
    </main>
  </div>
</body>
</html>
