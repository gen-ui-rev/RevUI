<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Cardio Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e6e9;
      color: #25282d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 20px;
      background: #f1f2f4;
    }

    .progress-card {
      width: 100%;
      padding: 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(28, 32, 38, 0.09);
    }

    .progress-card h1 {
      margin: 0;
      color: #bd3d43;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .date-range {
      margin: 5px 0 0;
      color: #72767d;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .progress-ring {
      position: relative;
      width: 164px;
      margin: 28px auto 22px;
    }

    .progress-ring svg {
      display: block;
      width: 164px;
      height: 164px;
    }

    .ring-track {
      fill: none;
      stroke: #eceef0;
      stroke-width: 12;
    }

    .ring-value {
      fill: none;
      stroke: #d94b52;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 68 100;
      transform: rotate(-90deg);
      transform-origin: 82px 82px;
    }

    .ring-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percentage {
      color: #25282d;
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
    }

    .complete-label {
      margin-top: 6px;
      color: #72767d;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.3;
    }

    .goal-progress {
      margin: 0;
      color: #30343a;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .remaining {
      margin: 5px 0 0;
      color: #72767d;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="progress-card" aria-labelledby="cardio-title">
      <h1 id="cardio-title">Weekly cardio goal</h1>
      <p class="date-range">March 9–15, 2026</p>

      <div class="progress-ring" role="img" aria-label="68 percent of weekly cardio goal completed">
        <svg viewBox="0 0 164 164" aria-hidden="true">
          <circle class="ring-track" cx="82" cy="82" r="64"></circle>
          <circle class="ring-value" cx="82" cy="82" r="64" pathLength="100"></circle>
        </svg>
        <div class="ring-copy">
          <span class="percentage">68%</span>
          <span class="complete-label">complete</span>
        </div>
      </div>

      <p class="goal-progress">102 of 150 active minutes</p>
      <p class="remaining">48 minutes remaining this week</p>
    </section>
  </div>
</body>
</html>
