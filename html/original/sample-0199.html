<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftone — Milestone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d7d74;
    --ink:#16191a;
    --mute:#6a7275;
    --line:#e0e3e2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceded;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:36px 28px;
  }
  .card{
    border:1px solid var(--line);
    border-radius:4px;
  }
  .hero{
    background:var(--teal);
    border-radius:4px 4px 0 0;
    padding:26px 22px 24px;
    text-align:center;
  }
  .kicker{
    margin:0 0 16px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:#a9dcd6;
  }
  .mark{
    display:block;
    margin:0 auto 16px;
  }
  .title{
    margin:0;
    font-size:22px;
    line-height:1.25;
    font-weight:700;
    color:#ffffff;
  }
  .tier{
    margin:6px 0 0;
    font-size:14px;
    font-weight:500;
    color:#bee5e0;
  }
  .body{
    padding:20px 22px 22px;
  }
  .desc{
    margin:0;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
  }
  .meta{
    margin:10px 0 0;
    font-size:12px;
    color:var(--mute);
  }
  .rule{
    height:1px;
    background:var(--line);
    margin:20px 0;
  }
  .next-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
  }
  .next-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .next-pct{
    font-size:12px;
    font-weight:600;
    color:var(--teal);
  }
  .next-name{
    margin:10px 0 12px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .bar{
    height:6px;
    width:100%;
    background:#e8ebea;
    border-radius:4px;
  }
  .bar span{
    display:block;
    height:100%;
    width:68%;
    background:var(--teal);
    border-radius:4px;
  }
  .bar-note{
    margin:10px 0 0;
    font-size:12px;
    color:var(--mute);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <p class="kicker">Milestone earned</p>
        <svg class="mark" width="72" height="72" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path d="M32 3 58 18v28L32 61 6 46V18L32 3z" fill="#0a6a62" stroke="#8fd0c9" stroke-width="1.5" stroke-linejoin="round"/>
          <g transform="translate(16,16) scale(1.3333)">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
          </g>
        </svg>
        <h1 class="title">Night Owl</h1>
        <p class="tier">Tier 3 of 5</p>
      </div>
      <div class="body">
        <p class="desc">500 hours of listening logged between midnight and 5:00 AM.</p>
        <p class="meta">Earned March 14, 2025 · Visible on your Halftone profile</p>
        <div class="rule"></div>
        <div class="next-head">
          <span class="next-label">Next tier</span>
          <span class="next-pct">68%</span>
        </div>
        <p class="next-name">Keeper of Small Hours</p>
        <div class="bar"><span></span></div>
        <p class="bar-note">512 of 750 hours</p>
      </div>
    </div>
  </div>
</body>
</html>
