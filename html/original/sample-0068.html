<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe0e3;
      color: #202126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 20px;
      background: #f1f1f3;
    }

    .save-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(28, 28, 33, 0.10);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #cc167f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .episode {
      margin: 8px 0 0;
      color: #5e6068;
      font-size: 14px;
      line-height: 1.5;
    }

    fieldset {
      min-width: 0;
      margin: 24px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 10px;
      padding: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .location-list {
      border: 1px solid #dedee3;
      border-radius: 4px;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      cursor: default;
    }

    .location + .location {
      border-top: 1px solid #e7e7eb;
    }

    .location input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border: 2px solid #a6a7ae;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .location input:checked + .radio {
      border-color: #cc167f;
    }

    .location input:checked + .radio::after {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cc167f;
      content: "";
    }

    .location-name {
      min-width: 0;
      color: #2d2e34;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .note {
      margin: 12px 0 0;
      color: #70717a;
      font-size: 12px;
      line-height: 1.5;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 4px;
      background: #cc167f;
      color: #ffffff;
      font: 600 14px/1.4 'Inter', system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="save-card" aria-labelledby="save-title">
      <p class="eyebrow">Fablewave</p>
      <h1 id="save-title">Save episode</h1>
      <p class="episode">“Signals After Dark” from The Quiet Frequency</p>

      <fieldset>
        <legend>Choose a listening list</legend>
        <div class="location-list">
          <label class="location">
            <input type="radio" name="save-location" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Listen later</span>
          </label>
          <label class="location">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Evening podcasts</span>
          </label>
          <label class="location">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Research interviews</span>
          </label>
        </div>
      </fieldset>

      <p class="note">Saving adds this episode to a list. It will not pin it to Home.</p>
      <button class="save-button" type="button">Save to Listen later</button>
    </main>
  </div>
</body>
</html>
