<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode Reminder — Wavecrest</title>
<style>
  :root{
    --accent:#8a7a6a;
    --accent-soft:#efeae4;
    --ink:#22201e;
    --mid:#6d6862;
    --line:#e7e4e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e4e3e1;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#e4e3e1;
    padding:28px 24px;
  }
  .card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(36,32,28,.10);
    padding:20px;
  }
  .show{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .art{
    width:52px;
    height:52px;
    border-radius:14px;
    background:#c9bcae;
    flex:none;
  }
  .show-name{
    font-size:16px;
    font-weight:600;
    line-height:1.25;
  }
  .show-sub{
    font-size:13px;
    color:var(--mid);
    margin-top:3px;
    line-height:1.3;
  }
  .time-block{
    margin-top:20px;
    background:var(--accent-soft);
    border-radius:14px;
    padding:16px 18px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .time-label{
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:.02em;
  }
  .time-value{
    font-size:34px;
    font-weight:600;
    color:var(--accent);
    line-height:1.05;
    margin-top:6px;
  }
  .time-tz{
    font-size:13px;
    color:var(--mid);
    padding-bottom:6px;
  }
  .section-title{
    font-size:13px;
    font-weight:600;
    color:var(--mid);
    margin:22px 0 10px;
  }
  .days{
    display:flex;
    justify-content:space-between;
  }
  .day{
    width:38px;
    height:38px;
    border-radius:14px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:var(--mid);
  }
  .day.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .rows{
    margin-top:20px;
    border-top:1px solid var(--line);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .row-label{
    font-size:14px;
  }
  .row-value{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--mid);
    max-width:190px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .chev{flex:none;}
  .switch{
    width:44px;
    height:26px;
    border-radius:14px;
    background:var(--accent);
    position:relative;
    flex:none;
  }
  .knob{
    position:absolute;
    top:3px;
    left:21px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
  }
  .next{
    margin-top:16px;
    font-size:13px;
    color:var(--mid);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .save{
    margin-top:18px;
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:14px 0;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="show">
        <div class="art"></div>
        <div>
          <div class="show-name">Deep Field Radio</div>
          <div class="show-sub">Episode reminder · Wavecrest</div>
        </div>
      </div>

      <div class="time-block">
        <div>
          <div class="time-label">Remind me at</div>
          <div class="time-value">7:30 AM</div>
        </div>
        <div class="time-tz">Central</div>
      </div>

      <div class="section-title">Repeats on</div>
      <div class="days">
        <div class="day">S</div>
        <div class="day on">M</div>
        <div class="day">T</div>
        <div class="day on">W</div>
        <div class="day">T</div>
        <div class="day on">F</div>
        <div class="day">S</div>
      </div>

      <div class="rows">
        <div class="row">
          <span class="row-label">Lead time</span>
          <span class="row-value">15 minutes before
            <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" aria-hidden="true">
              <path d="M1.5 1.5 L6.5 6.5 L1.5 11.5" stroke="#9a948d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="row">
          <span class="row-label">Skip when already played</span>
          <span class="switch"><span class="knob"></span></span>
        </div>
      </div>

      <div class="next">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.9" stroke="#8a7a6a" stroke-width="1.3"/>
          <path d="M7 4.1V7.2l2.2 1.3" stroke="#8a7a6a" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Next reminder: Monday, March 10
      </div>

      <button class="save" type="button">Save reminder</button>
    </div>
  </div>
</body>
</html>
