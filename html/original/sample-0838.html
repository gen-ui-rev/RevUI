<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circleloom Visual Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e5e8;
      color: #29252a;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 24px 16px;
      background: #f4f1f4;
    }

    .tray {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(41, 31, 38, 0.07);
    }

    .intro {
      padding: 16px;
      background: rgba(207, 20, 133, 0.10);
      border-radius: 10px;
    }

    .intro h1 {
      margin: 0;
      color: #b71375;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
    }

    .intro p {
      margin: 4px 0 0;
      color: #665d64;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    .type-section {
      margin-top: 16px;
    }

    .section-label {
      display: block;
      margin-bottom: 8px;
      color: #5f575e;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }

    .type-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .type-button {
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: #f2eff1;
      color: #686066;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }

    .type-button.active {
      background: rgba(207, 20, 133, 0.12);
      color: #b71375;
    }

    .sticker-section {
      margin-top: 18px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
    }

    .section-heading span {
      color: #81777f;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      white-space: nowrap;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .sticker {
      position: relative;
      padding: 12px 6px 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(207, 20, 133, 0.08);
      color: #a8106a;
      text-align: center;
    }

    .sticker.selected {
      background: rgba(207, 20, 133, 0.16);
    }

    .sticker svg {
      display: block;
      width: 42px;
      height: 42px;
      margin: 0 auto 6px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sticker-name {
      display: block;
      overflow: hidden;
      color: #40383e;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selected-mark {
      position: absolute;
      top: 7px;
      right: 7px;
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border-radius: 50%;
      background: #c8157d;
      color: #ffffff;
    }

    .selected-mark svg {
      width: 11px;
      height: 11px;
      margin: 0;
      stroke-width: 2.2;
    }

    .add-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #c8157d;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="tray" aria-label="Filter and sticker picker">
      <header class="intro">
        <h1>Choose a visual</h1>
        <p>For your Circleloom post.</p>
      </header>

      <section class="type-section" aria-labelledby="visual-type-label">
        <span class="section-label" id="visual-type-label">Visual type</span>
        <div class="type-options">
          <button class="type-button" type="button">Filters</button>
          <button class="type-button active" type="button" aria-pressed="true">Stickers</button>
        </div>
      </section>

      <section class="sticker-section" aria-labelledby="sticker-heading">
        <div class="section-heading">
          <h2 id="sticker-heading">Pick a sticker</h2>
          <span>6 available</span>
        </div>

        <div class="sticker-grid">
          <button class="sticker selected" type="button" aria-label="Smile, selected">
            <span class="selected-mark" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M3.5 8.2 6.4 11l6.1-6.3"></path>
              </svg>
            </span>
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="16"></circle>
              <path d="M18 21h.01M30 21h.01"></path>
              <path d="M17.5 28c1.8 3 4 4.4 6.5 4.4s4.7-1.4 6.5-4.4"></path>
              <path d="M10 13 7 10M38 13l3-3M24 6V2"></path>
            </svg>
            <span class="sticker-name">Smile</span>
          </button>

          <button class="sticker" type="button" aria-label="Celebrate">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="m12 36 8-23 15 15-23 8Z"></path>
              <path d="m18 30 11-4M16 24l7-7"></path>
              <path d="M31 9c0 3-2 5-5 5M38 16c-3 0-5 2-5 5"></path>
              <path d="m35 7 1 3M41 11l-3 1M28 5l1 3"></path>
            </svg>
            <span class="sticker-name">Celebrate</span>
          </button>

          <button class="sticker" type="button" aria-label="High five">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M15 27V15a3 3 0 0 1 6 0v8"></path>
              <path d="M21 22V11a3 3 0 0 1 6 0v11"></path>
              <path d="M27 22v-8a3 3 0 0 1 6 0v12"></path>
              <path d="m15 23-3-3a3 3 0 0 0-4 4l8 11c2 3 5 5 9 5h2c7 0 12-5 12-12v-7a3 3 0 0 0-6 0v5"></path>
            </svg>
            <span class="sticker-name">High five</span>
          </button>

          <button class="sticker" type="button" aria-label="Heart">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M24 39 9.8 25.5A9.2 9.2 0 0 1 23 12.7L24 14l1-1.3a9.2 9.2 0 0 1 13.2 12.8L24 39Z"></path>
              <path d="M16 19c1.1-1.8 3.1-2.5 4.8-1.8"></path>
            </svg>
            <span class="sticker-name">Heart</span>
          </button>

          <button class="sticker" type="button" aria-label="Good idea">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M15 21a9 9 0 1 1 18 0c0 4-2.3 6.1-4.7 8.5-1.2 1.2-1.3 2.2-1.3 3.5h-6c0-1.3-.2-2.4-1.4-3.6C17.2 27 15 25 15 21Z"></path>
              <path d="M21 37h6M22 41h4"></path>
              <path d="M24 5V2M9 20H5M43 20h-4M12.5 9.5l-2.8-2.8M35.5 9.5l2.8-2.8"></path>
            </svg>
            <span class="sticker-name">Good idea</span>
          </button>

          <button class="sticker" type="button" aria-label="Let's chat">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M8 10h25a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H20l-9 7v-7H8a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6Z"></path>
              <path d="M13 22h.01M21 22h.01M29 22h.01"></path>
            </svg>
            <span class="sticker-name">Let’s chat</span>
          </button>
        </div>
      </section>

      <button class="add-button" type="button">Add sticker</button>
    </main>
  </div>
</body>
</html>
