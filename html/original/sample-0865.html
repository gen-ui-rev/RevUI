<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Guide Achievement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e0;
      color: #302e2a;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f8f7f4;
    }

    .achievement {
      width: 100%;
      padding: 28px;
      text-align: center;
      background: rgba(91, 87, 80, 0.09);
      border-radius: 4px;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #625e57;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .badge-mark {
      width: 76px;
      margin: 0 auto 20px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(91, 87, 80, 0.13);
      border-radius: 4px;
      color: #5b5750;
    }

    .badge-mark svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    h1 {
      margin: 0;
      color: #302e2a;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.15;
    }

    .description {
      margin: 10px auto 24px;
      max-width: 270px;
      color: #595650;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    .milestone {
      padding: 16px;
      text-align: left;
      background: rgba(91, 87, 80, 0.08);
      border-radius: 4px;
    }

    .milestone-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .milestone-label,
    .milestone-value {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .milestone-label {
      color: #4f4c46;
      font-weight: 400;
    }

    .milestone-value {
      flex: none;
      color: #302e2a;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      padding: 3px;
      background: rgba(91, 87, 80, 0.12);
      border-radius: 4px;
    }

    .progress-fill {
      width: 100%;
      padding-top: 6px;
      background: #625e57;
      border-radius: 4px;
    }

    .earned-date {
      margin: 18px 0 0;
      color: #6a665f;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="achievement" aria-labelledby="achievement-title">
      <p class="eyebrow">Badge earned</p>

      <div class="badge-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 7H32V17C32 21.4183 28.4183 25 24 25C19.5817 25 16 21.4183 16 17V7Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M16 11H10V14C10 18.4183 13.5817 22 18 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 11H38V14C38 18.4183 34.4183 22 30 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 25V32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M18 40H30L28 32H20L18 40Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="achievement-title">Community Guide</h1>
      <p class="description">You helped new members feel at home with 25 replies marked helpful.</p>

      <div class="milestone" aria-label="Achievement requirement completed">
        <div class="milestone-row">
          <p class="milestone-label">Helpful replies</p>
          <p class="milestone-value">25 of 25</p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill"></div>
        </div>
      </div>

      <p class="earned-date">Earned on May 18, 2025 · Gatherline</p>
    </section>
  </div>
</body>
</html>
