<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherfield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e5e2;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      color: #292326;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffaf8;
    }

    .brand {
      width: 100%;
      margin-top: -42px;
      padding: 0 32px;
      text-align: center;
    }

    .mark {
      width: 96px;
      height: 96px;
      display: block;
      margin: 0 auto 30px;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -1px;
      color: #33272b;
    }

    p {
      margin: 13px 0 0;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 400;
      color: #76676c;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="brand" aria-label="Gatherfield">
      <svg class="mark" viewBox="0 0 96 96" role="img" aria-label="Gatherfield symbol">
        <rect x="6" y="6" width="56" height="56" fill="#bd526e" opacity="0.16"></rect>
        <rect x="34" y="34" width="56" height="56" fill="#bd526e" opacity="0.28"></rect>
        <rect x="34" y="6" width="28" height="56" fill="#bd526e" opacity="0.68"></rect>
      </svg>
      <h1>Gatherfield</h1>
      <p>Team notes and planning</p>
    </main>
  </div>
</body>
</html>
