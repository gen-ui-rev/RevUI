<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Focus Session Length</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8edeb;
      color: #172522;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 32px;
      background: #f7f9f8;
    }

    .component {
      width: 100%;
    }

    .context {
      margin: 0 0 10px;
      color: #087b74;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 10px 0 0;
      color: #5b6966;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
    }

    .value-control {
      margin-top: 24px;
      padding: 20px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 12px;
      background: #dcefed;
      border-radius: 4px;
    }

    .step-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: #b9dfdb;
      color: #086f69;
      cursor: pointer;
    }

    .step-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .current-value {
      min-width: 0;
      text-align: center;
    }

    .number {
      display: block;
      color: #076e68;
      font-size: 32px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .unit {
      display: block;
      margin-top: 2px;
      color: #356d68;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    .slider-area {
      margin-top: 24px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: #44534f;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .slider-label span:last-child {
      color: #087b74;
    }

    .slider {
      position: relative;
      height: 28px;
    }

    .track {
      position: absolute;
      top: 11px;
      right: 0;
      left: 0;
      height: 6px;
      background: #d8e0de;
      border-radius: 4px;
    }

    .track-fill {
      width: 46.67%;
      height: 6px;
      background: #0b8b83;
      border-radius: 4px;
    }

    .thumb {
      position: absolute;
      top: 4px;
      left: calc(46.67% - 10px);
      width: 20px;
      height: 20px;
      background: #087b74;
      border: 4px solid #f7f9f8;
      border-radius: 4px;
    }

    input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      color: #75817e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .session-end {
      margin: 20px 0 0;
      color: #44534f;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .session-end strong {
      color: #172522;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="component" aria-labelledby="session-title">
      <p class="context">Cedarflow focus block</p>
      <h1 id="session-title">Set session length</h1>
      <p class="description">Choose how long to protect your calendar from meetings and notifications.</p>

      <div class="value-control">
        <button class="step-button" type="button" aria-label="Decrease session by five minutes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </button>

        <div class="current-value" aria-live="polite">
          <span class="number">50</span>
          <span class="unit">minutes</span>
        </div>

        <button class="step-button" type="button" aria-label="Increase session by five minutes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </button>
      </div>

      <div class="slider-area">
        <label class="slider-label" for="duration">
          <span>Duration</span>
          <span>50 minutes</span>
        </label>
        <div class="slider">
          <div class="track" aria-hidden="true">
            <div class="track-fill"></div>
          </div>
          <div class="thumb" aria-hidden="true"></div>
          <input id="duration" type="range" min="15" max="90" step="5" value="50" aria-valuetext="50 minutes">
        </div>
        <div class="range-labels" aria-hidden="true">
          <span>15 min</span>
          <span>90 min</span>
        </div>
      </div>

      <p class="session-end">Starting at 2:30 PM · Ends at <strong>3:20 PM</strong></p>
    </section>
  </div>
</body>
</html>
