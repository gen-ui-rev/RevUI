<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Updates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8e3;
      color: #25241f;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f7f6f1;
    }

    .component {
      width: 100%;
      background: #ffffff;
    }

    .hero {
      padding: 24px;
      background: rgba(244, 196, 0, 0.18);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .monogram {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      background: rgba(244, 196, 0, 0.34);
      color: #4b3b00;
      font-size: 18px;
      font-weight: 600;
    }

    .service {
      margin: 0 0 3px;
      color: #716c5d;
      font-size: 12px;
      line-height: 1.4;
    }

    .name {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 0;
      color: #5f5b50;
      font-size: 14px;
      line-height: 1.6;
    }

    .settings {
      padding: 24px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .setting-row + .setting-row {
      margin-top: 24px;
      padding-top: 24px;
      background-image: linear-gradient(#ece9df, #ece9df);
      background-repeat: no-repeat;
      background-size: 100% 1px;
      background-position: top left;
    }

    .setting-copy {
      min-width: 0;
    }

    .setting-title {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 600;
    }

    .setting-detail {
      margin: 0;
      color: #777164;
      font-size: 12px;
      line-height: 1.5;
    }

    .follow-button {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 0;
      border-radius: 0;
      background: rgba(244, 196, 0, 0.24);
      color: #403500;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .switch {
      position: relative;
      flex: 0 0 48px;
      width: 48px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: rgba(244, 196, 0, 0.36);
    }

    .switch-thumb {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: #5d4a00;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="component" aria-labelledby="updates-title">
      <div class="hero">
        <div class="identity">
          <div class="monogram" aria-hidden="true">TM</div>
          <div>
            <p class="service">LumaLesson pronunciation coach</p>
            <p class="name">Tessa Morroway</p>
          </div>
        </div>
        <h1 id="updates-title">You’re following Tessa</h1>
        <p class="summary">Keep access to new speaking drills and choose whether lesson notes arrive by email.</p>
      </div>

      <div class="settings">
        <div class="setting-row">
          <div class="setting-copy">
            <p class="setting-title">Following status</p>
            <p class="setting-detail">New lessons appear in your learning feed.</p>
          </div>
          <button class="follow-button" type="button" aria-pressed="true">Following</button>
        </div>

        <div class="setting-row">
          <div class="setting-copy">
            <p class="setting-title">Weekly lesson notes</p>
            <p class="setting-detail">On · Fridays by email</p>
          </div>
          <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Weekly lesson notes">
            <span class="switch-thumb" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
