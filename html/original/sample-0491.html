<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E9E8EC;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#F2F1F4;
    padding:44px 0;
    box-sizing:border-box;
  }
  .wrap{
    width:326px;
    margin:0 auto;
  }
  .mark{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
  }
  .badge{
    width:68px;
    height:68px;
    border-radius:50%;
    background:#8C6C92;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .spark{position:absolute;top:0;left:0;width:100%;height:68px;}
  h1{
    font-size:23px;
    font-weight:700;
    color:#241F2A;
    letter-spacing:-0.2px;
    margin:22px 0 0;
    text-align:center;
  }
  .lede{
    font-size:14px;
    line-height:20px;
    font-weight:400;
    color:#6D6776;
    margin:8px 0 0;
    text-align:center;
  }
  .card{
    background:#FFFFFF;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(38,30,44,0.08);
    padding:18px;
    margin-top:26px;
    box-sizing:border-box;
  }
  .stay{
    display:flex;
    align-items:center;
    gap:13px;
  }
  .mono{
    width:46px;
    height:46px;
    border-radius:10px;
    background:#EFE7F0;
    color:#7C5D83;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .stay-name{
    font-size:16px;
    font-weight:700;
    color:#241F2A;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stay-sub{
    font-size:13px;
    font-weight:400;
    color:#7B7583;
    margin-top:3px;
  }
  .rule{
    height:1px;
    background:#EBE9EE;
    margin:16px 0 4px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:14px;
    padding:9px 0;
  }
  .k{
    font-size:13px;
    font-weight:400;
    color:#7B7583;
    flex:0 0 auto;
  }
  .v{
    font-size:14px;
    font-weight:500;
    color:#2C2632;
    text-align:right;
  }
  .code{
    color:#7C5D83;
    font-weight:700;
    letter-spacing:0.4px;
  }
  .cta{
    display:block;
    margin-top:22px;
    background:#8C6C92;
    color:#FFFFFF;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
    padding:15px 0;
    border-radius:10px;
  }
  .note{
    font-size:12px;
    font-weight:400;
    color:#8A8492;
    text-align:center;
    margin:14px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="wrap">

      <div class="mark">
        <svg class="spark" viewBox="0 0 326 68" aria-hidden="true">
          <rect x="86" y="12" width="7" height="3" rx="1.5" fill="#C3AAC6" transform="rotate(-24 89.5 13.5)"/>
          <circle cx="106" cy="46" r="3" fill="#D6C4D8"/>
          <rect x="228" y="20" width="3" height="8" rx="1.5" fill="#C3AAC6" transform="rotate(28 229.5 24)"/>
          <circle cx="212" cy="52" r="2.5" fill="#D6C4D8"/>
          <rect x="119" y="4" width="3" height="7" rx="1.5" fill="#DCCEDE"/>
          <circle cx="243" cy="6" r="2.5" fill="#C3AAC6"/>
        </svg>
        <div class="badge">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
            <path d="M8 15.4L12.9 20.2L22.4 10.4" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <h1>Booking confirmed</h1>
      <p class="lede">Your stay is held. We emailed the details to nora.whitfield@mailbox.com.</p>

      <div class="card">
        <div class="stay">
          <div class="mono">HH</div>
          <div>
            <div class="stay-name">Halden House</div>
            <div class="stay-sub">Bergen, Norway</div>
          </div>
        </div>

        <div class="rule"></div>

        <div class="row">
          <span class="k">Check-in</span>
          <span class="v">Fri, Mar 14 · 3:00 PM</span>
        </div>
        <div class="row">
          <span class="k">Check-out</span>
          <span class="v">Mon, Mar 17 · 11:00 AM</span>
        </div>
        <div class="row">
          <span class="k">Confirmation</span>
          <span class="v code">KH-48213</span>
        </div>
      </div>

      <a class="cta" href="#">View itinerary</a>
      <p class="note">Free cancellation through March 10.</p>

    </div>
  </div>
</body>
</html>
