<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reply Audience Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd7;
      color: #282321;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f7f5f3;
    }

    .picker {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 6px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #c83f3a;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #b8322e;
      font-size: 26px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .intro {
      margin: 8px 0 0;
      color: #6c6460;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    fieldset {
      min-width: 0;
      margin: 24px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .choice {
      position: relative;
    }

    .choice + .choice {
      margin-top: 8px;
    }

    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px;
      background: #f1efed;
      border-radius: 6px;
      cursor: pointer;
    }

    .choice input:checked + label {
      background: rgba(200, 63, 58, 0.12);
    }

    .choice input:focus-visible + label {
      box-shadow: 0 0 0 3px rgba(200, 63, 58, 0.18);
    }

    .choice-copy {
      min-width: 0;
      flex: 1;
    }

    .choice-title {
      display: block;
      color: #2d2826;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }

    .choice-description {
      display: block;
      margin-top: 2px;
      color: #716965;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 400;
    }

    .mark {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      background: #ded9d6;
      border-radius: 6px;
    }

    .mark svg {
      width: 16px;
      height: 16px;
      display: block;
      opacity: 0;
    }

    .choice input:checked + label .mark {
      background: #c83f3a;
    }

    .choice input:checked + label .mark svg {
      opacity: 1;
    }

    .note {
      margin: 18px 0 0;
      color: #746c68;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="reply-heading">
      <p class="eyebrow">Threadfolk reply settings</p>
      <h1 id="reply-heading">Who can reply?</h1>
      <p class="intro">Choose who can join the conversation on this post.</p>

      <fieldset>
        <legend>Reply audience</legend>

        <div class="choice">
          <input type="radio" id="reply-everyone" name="reply-audience">
          <label for="reply-everyone">
            <span class="choice-copy">
              <span class="choice-title">Everyone</span>
              <span class="choice-description">Any Threadfolk member can reply.</span>
            </span>
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </label>
        </div>

        <div class="choice">
          <input type="radio" id="reply-following" name="reply-audience" checked>
          <label for="reply-following">
            <span class="choice-copy">
              <span class="choice-title">People you follow</span>
              <span class="choice-description">Only accounts you follow can reply.</span>
            </span>
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </label>
        </div>

        <div class="choice">
          <input type="radio" id="reply-mentioned" name="reply-audience">
          <label for="reply-mentioned">
            <span class="choice-copy">
              <span class="choice-title">Mentioned people</span>
              <span class="choice-description">Only people named in the post can reply.</span>
            </span>
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </label>
        </div>
      </fieldset>

      <p class="note">This setting applies to this post only.</p>
    </main>
  </div>
</body>
</html>
