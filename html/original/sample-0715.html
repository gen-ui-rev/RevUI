<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Morrowlane Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e2;
      color: #24231f;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffef9;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      background: #fffef9;
    }

    .back-button {
      width: 30px;
      height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #24231f;
      background: #fff1a8;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f5cd28;
      color: #24231f;
      flex: 0 0 auto;
    }

    .brand-name {
      min-width: 0;
      flex: 1;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .sign-in {
      color: #6d5400;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-decoration: none;
    }

    main {
      flex: 1;
      padding: 12px 20px 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .intro {
      margin: 4px 0 0;
      max-width: 335px;
      color: #66635c;
      font-size: 14px;
      line-height: 20px;
    }

    .market-preview {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #fff4bd;
    }

    .market-preview p {
      margin: 0 0 8px;
      color: #51471e;
      font-size: 14px;
      line-height: 18px;
      font-weight: 500;
    }

    .product-row {
      display: flex;
      gap: 8px;
    }

    .product-row img {
      width: 104px;
      height: 54px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd8bf;
    }

    .social-options {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .social-button {
      width: 100%;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 10px;
      background: #f3f1e9;
      color: #292823;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .social-button.accent-soft {
      background: #fff1a8;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      color: #77736a;
      font-size: 12px;
      line-height: 17px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      content: "";
      background: #e7e3d7;
    }

    .signup-form {
      margin: 0;
    }

    .field-list {
      display: grid;
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #34332e;
      font-size: 14px;
      line-height: 17px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: 10px;
      outline: none;
      background: #f3f1e9;
      color: #24231f;
      font-size: 14px;
      line-height: 20px;
    }

    .field input::placeholder {
      color: #8a867c;
      opacity: 1;
    }

    .preference {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #514f48;
      font-size: 14px;
      line-height: 20px;
    }

    .check {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 10px;
      background: #f5cd28;
      color: #24231f;
    }

    .create-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: #f5cd28;
      color: #24231f;
      font-size: 15px;
      line-height: 21px;
      font-weight: 700;
    }

    .terms {
      margin: 10px 2px 0;
      color: #706d65;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
    }

    .terms a {
      color: #624d00;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M11.25 3.75L6 9l5.25 5.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="brand-mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
          <path d="M3 6.25h11l-.85 7.25H3.85L3 6.25Z" fill="currentColor"/>
          <path d="M6 6.25V5a2.5 2.5 0 0 1 5 0v1.25" stroke="#F5CD28" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="brand-name">Morrowlane</div>
      <a class="sign-in" href="#" aria-label="Sign in to an existing account">Sign in</a>
    </header>

    <main>
      <h1>Create your account</h1>
      <p class="intro">Save products, follow order updates, and check out with fewer steps.</p>

      <section class="market-preview" aria-label="Products available on Morrowlane">
        <p>Recent finds from the marketplace</p>
        <div class="product-row">
          <img src="https://loremflickr.com/104/54/sneakers?lock=9530" width="104" height="54" alt="Neutral sneakers listed in the marketplace">
          <img src="https://loremflickr.com/104/54/furniture?lock=9531" width="104" height="54" alt="Modern chair listed in the marketplace">
          <img src="https://loremflickr.com/104/54/fashion?lock=9532" width="104" height="54" alt="Folded clothing listed in the marketplace">
        </div>
      </section>

      <section class="social-options" aria-label="Social signup options">
        <button class="social-button accent-soft" type="button">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="14" height="14" rx="7" fill="#F5CD28"/>
            <path d="M7 10h6M10 7v6" stroke="#292823" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Continue with Parcel ID
        </button>

        <button class="social-button" type="button">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 2.75 16.25 6.5v7L10 17.25 3.75 13.5v-7L10 2.75Z" fill="#DDD9CC"/>
            <path d="m7.25 10 1.75 1.75 3.75-4" stroke="#292823" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Continue with Harbor Key
        </button>
      </section>

      <div class="divider">or use email</div>

      <form class="signup-form">
        <div class="field-list">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Morgan Ellis">
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="morgan@example.com">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          </div>
        </div>

        <label class="preference">
          <input type="checkbox" checked hidden>
          <span class="check" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="m2.5 6.5 2.4 2.4 5.6-5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          Email me about saved-item price drops
        </label>

        <button class="create-button" type="submit">Create account</button>

        <p class="terms">
          By creating an account, you agree to the
          <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.
        </p>
      </form>
    </main>
  </div>
</body>
</html>
