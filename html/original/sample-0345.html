<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #172033;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    .service {
      margin: 0 0 8px;
      color: #246bdb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .helper {
      margin: 9px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.55;
    }

    .current-item {
      margin-top: 22px;
      padding: 14px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #dfe4ea;
      border-bottom: 1px solid #dfe4ea;
    }

    .lesson-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #eaf2ff;
      color: #246bdb;
    }

    .item-copy,
    .folder-copy {
      min-width: 0;
    }

    .item-label {
      margin: 0 0 3px;
      color: #7b8494;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
    }

    .item-name {
      margin: 0;
      overflow: hidden;
      color: #172033;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    section {
      margin-top: 22px;
    }

    .section-label {
      margin: 0 0 10px;
      color: #344054;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .folder-list {
      border-top: 1px solid #dfe4ea;
      border-bottom: 1px solid #dfe4ea;
    }

    .folder-row {
      width: 100%;
      margin: 0;
      padding: 13px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid #e7ebf0;
      border-radius: 0;
      background: transparent;
      color: #172033;
      font: inherit;
      text-align: left;
    }

    .folder-row:last-child {
      border-bottom: 0;
    }

    .folder-row.selected {
      margin: -1px 0;
      padding-top: 14px;
      padding-bottom: 14px;
      border: 1px solid #246bdb;
      border-radius: 4px;
      background: #f2f7ff;
      color: #174f9f;
    }

    .folder-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      color: #667085;
    }

    .selected .folder-icon {
      color: #246bdb;
    }

    .folder-name {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }

    .folder-detail {
      margin: 3px 0 0;
      color: #7b8494;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 400;
    }

    .selected .folder-detail {
      color: #5575a3;
    }

    .check {
      width: 20px;
      height: 20px;
      margin-left: auto;
      flex: 0 0 20px;
      color: #246bdb;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
    }

    .action {
      padding: 13px 18px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .cancel {
      flex: 0 0 auto;
      border: 1px solid #cfd6df;
      background: #ffffff;
      color: #475467;
    }

    .move {
      flex: 1;
      border: 1px solid #246bdb;
      background: #246bdb;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="move-title">
      <header>
        <p class="service">Northstar Learning</p>
        <h1 id="move-title">Move lesson</h1>
        <p class="helper">Choose a new folder for this lesson. Its position within the lesson order will not change.</p>
      </header>

      <div class="current-item">
        <div class="lesson-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M5 4.75C5 3.78 5.78 3 6.75 3H19v15.5H7.25A2.25 2.25 0 0 0 5 20.75v-16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M7.25 18.5H19V21H7.25a2.25 2.25 0 1 1 0-4.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="item-copy">
          <p class="item-label">Moving from Beginner Spanish</p>
          <p class="item-name">Listening: Ordering at a Café</p>
        </div>
      </div>

      <section aria-labelledby="destination-label">
        <h2 class="section-label" id="destination-label">Destination folder</h2>
        <div class="folder-list" role="radiogroup" aria-label="Destination folder">
          <button class="folder-row" type="button" role="radio" aria-checked="false">
            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.5 7.25c0-.97.78-1.75 1.75-1.75h4.1l1.8 2h7.6c.97 0 1.75.78 1.75 1.75v8.5c0 .97-.78 1.75-1.75 1.75H5.25c-.97 0-1.75-.78-1.75-1.75V7.25Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            <span class="folder-copy">
              <span class="folder-name">Daily Practice</span>
              <span class="folder-detail">8 lessons</span>
            </span>
          </button>

          <button class="folder-row selected" type="button" role="radio" aria-checked="true">
            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.5 7.25c0-.97.78-1.75 1.75-1.75h4.1l1.8 2h7.6c.97 0 1.75.78 1.75 1.75v8.5c0 .97-.78 1.75-1.75 1.75H5.25c-.97 0-1.75-.78-1.75-1.75V7.25Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            <span class="folder-copy">
              <span class="folder-name">Conversation Skills</span>
              <span class="folder-detail">5 lessons</span>
            </span>
            <svg class="check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="currentColor"/>
              <path d="m8 12.2 2.55 2.55L16.5 8.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="folder-row" type="button" role="radio" aria-checked="false">
            <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.5 7.25c0-.97.78-1.75 1.75-1.75h4.1l1.8 2h7.6c.97 0 1.75.78 1.75 1.75v8.5c0 .97-.78 1.75-1.75 1.75H5.25c-.97 0-1.75-.78-1.75-1.75V7.25Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            <span class="folder-copy">
              <span class="folder-name">Review Later</span>
              <span class="folder-detail">3 lessons</span>
            </span>
          </button>
        </div>
      </section>

      <div class="actions">
        <button class="action cancel" type="button">Cancel</button>
        <button class="action move" type="button">Move here</button>
      </div>
    </main>
  </div>
</body>
</html>
