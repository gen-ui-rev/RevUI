<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Reservation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e8e5;
      color: #252523;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 28px;
      background: #fbfaf8;
    }

    .cancel-component {
      width: 100%;
    }

    .cancel-icon {
      width: 48px;
      margin-bottom: 20px;
      color: #b42318;
    }

    .cancel-icon svg {
      display: block;
      width: 48px;
      height: 48px;
    }

    h1 {
      margin: 0;
      color: #b42318;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.6px;
    }

    .intro {
      margin: 12px 0 26px;
      color: #5e5d58;
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
    }

    .details {
      margin: 0 0 26px;
      border-top: 1px solid #d8d6d1;
      border-bottom: 1px solid #d8d6d1;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      padding: 15px 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .detail-row + .detail-row {
      border-top: 1px solid #e4e2dd;
    }

    .detail-label {
      color: #73716c;
      font-weight: 400;
    }

    .detail-value {
      color: #252523;
      font-weight: 600;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      min-height: 48px;
      border-radius: 6px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      border: 1px solid #b42318;
      background: #b42318;
      color: #ffffff;
    }

    .secondary {
      border: 1px solid #cbc8c2;
      background: transparent;
      color: #343330;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="cancel-component" aria-labelledby="cancel-title">
      <div class="cancel-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="10" width="34" height="31" rx="6" stroke="currentColor" stroke-width="2"/>
          <path d="M15 7V14M33 7V14M7 19H41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 26L29 36M29 26L19 36" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="cancel-title">Cancel this stay?</h1>
      <p class="intro">
        The reservation will be canceled immediately. This does not delete your saved Roamstead trip, route, or notes.
      </p>

      <section class="details" aria-label="Cancellation details">
        <div class="detail-row">
          <div class="detail-label">Reservation</div>
          <div class="detail-value">Harbor Pine Lodge<br>September 18–21, 2026</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Refund</div>
          <div class="detail-value">$684.20 to Visa ending in 1842</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Timing</div>
          <div class="detail-value">5–7 business days</div>
        </div>
      </section>

      <div class="actions">
        <button class="primary" type="button">Cancel reservation</button>
        <button class="secondary" type="button">Keep reservation</button>
      </div>
    </main>
  </div>
</body>
</html>
