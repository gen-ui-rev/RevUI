<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save to list — Northlake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e9e9ec;
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:#16181d;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#f1f1f3;
    padding:26px 0;
  }
  .card{
    width:342px;
    margin:0 auto;
    background:#ffffff;
    border-radius:10px;
    box-shadow:0 8px 22px rgba(18,20,28,.10);
    padding:20px;
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .newlist{
    font-size:13px;
    font-weight:700;
    color:#d92a2a;
    white-space:nowrap;
  }
  .item{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    padding-bottom:16px;
    border-bottom:1px solid #ececef;
  }
  .item img{
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .item-name{
    font-size:16px;
    font-weight:700;
    line-height:1.25;
  }
  .item-meta{
    margin-top:4px;
    font-size:13px;
    color:#6b7280;
  }
  .item-meta b{
    color:#16181d;
    font-weight:600;
  }
  .label{
    margin:16px 0 10px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:#8a8f9a;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 0;
  }
  .row img{
    width:40px;
    height:40px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .row-text{
    flex:1 1 auto;
    min-width:0;
  }
  .row-name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-sub{
    margin-top:2px;
    font-size:12px;
    color:#7c818c;
  }
  .mark{flex:none;}
  .btn{
    margin-top:18px;
    width:100%;
    background:#d92a2a;
    color:#ffffff;
    border-radius:10px;
    padding:14px 0;
    text-align:center;
    font-size:15px;
    font-weight:700;
  }
  .foot{
    margin-top:10px;
    text-align:center;
    font-size:12px;
    color:#8a8f9a;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Save to list</h1>
        <span class="newlist">New list</span>
      </div>

      <div class="item">
        <img src="https://loremflickr.com/64/64/architecture?lock=3220" width="64" height="64" alt="Harbor District office tower held by the fund">
        <div>
          <div class="item-name">Harbor District REIT</div>
          <div class="item-meta"><b>$142.80</b> · NAV as of Mar 14</div>
        </div>
      </div>

      <div class="label">Choose a list</div>

      <div class="row">
        <img src="https://loremflickr.com/40/40/chart?lock=3221" width="40" height="40" alt="Cover thumbnail for the Watchlist" >
        <div class="row-text">
          <div class="row-name">Watchlist</div>
          <div class="row-sub">12 holdings · updated today</div>
        </div>
        <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle cx="11" cy="11" r="10" fill="#d92a2a"></circle>
          <path d="M6.5 11.3l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>

      <div class="row">
        <img src="https://loremflickr.com/40/40/city?lock=3222" width="40" height="40" alt="Cover thumbnail for the Long-term holds list">
        <div class="row-text">
          <div class="row-name">Long-term holds</div>
          <div class="row-sub">5 holdings · updated Mar 9</div>
        </div>
        <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle cx="11" cy="11" r="9.25" fill="none" stroke="#d3d5da" stroke-width="1.5"></circle>
        </svg>
      </div>

      <div class="row">
        <img src="https://loremflickr.com/40/40/office?lock=3223" width="40" height="40" alt="Cover thumbnail for the Dividend income list">
        <div class="row-text">
          <div class="row-name">Dividend income</div>
          <div class="row-sub">8 holdings · updated Feb 27</div>
        </div>
        <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle cx="11" cy="11" r="9.25" fill="none" stroke="#d3d5da" stroke-width="1.5"></circle>
        </svg>
      </div>

      <div class="btn">Save to Watchlist</div>
      <div class="foot">Saving does not place an order.</div>
    </div>
  </div>
</body>
</html>
