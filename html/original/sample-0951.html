<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Permission</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e7e7eb;
      color: #19191f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 44px 20px;
      background: #f5f5f7;
    }

    .permission-card {
      width: 100%;
      padding: 26px 24px 22px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #d9d9e1;
      border-radius: 10px;
    }

    .icon-wrap {
      width: 54px;
      height: 54px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      color: #4f46e5;
      background: #eeeeff;
      border-radius: 10px;
    }

    .icon-wrap svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .description {
      margin: 12px auto 0;
      max-width: 280px;
      color: #5d5d69;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 400;
    }

    .actions {
      margin-top: 24px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      color: #ffffff;
      background: #4f46e5;
      border: 1px solid #4f46e5;
    }

    .secondary {
      color: #373741;
      background: #ffffff;
      border: 1px solid #d4d4dc;
    }

    .note {
      margin: 16px 0 0;
      color: #777783;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission-card" aria-labelledby="permission-title">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M18 9.5a6 6 0 0 0-12 0c0 6-2.5 6-2.5 7.5h17C20.5 15.5 18 15.5 18 9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.75 20a2.5 2.5 0 0 0 4.5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="permission-title">Allow Velora Audio to send notifications?</h1>
      <p class="description">
        Get alerts when followed shows publish new episodes and offline downloads are ready.
      </p>

      <div class="actions">
        <button class="primary" type="button">Allow notifications</button>
        <button class="secondary" type="button">Not now</button>
      </div>

      <p class="note">You can change this permission anytime in your device settings.</p>
    </section>
  </div>
</body>
</html>
