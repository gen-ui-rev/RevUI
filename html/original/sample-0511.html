<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nourish Thread Subscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e6e6e3;
      color: #242726;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f8f8f6;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #6f7472;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 320px;
      color: #252827;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 10px 0 0;
      color: #606462;
      font-size: 14px;
      line-height: 1.55;
    }

    .subscription {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .subscription-copy {
      min-width: 0;
    }

    .subscription-title {
      margin: 0;
      color: #292c2b;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
    }

    .subscription-status {
      margin: 3px 0 0;
      color: #656a67;
      font-size: 14px;
      line-height: 1.45;
    }

    .toggle {
      width: 50px;
      height: 30px;
      flex: 0 0 50px;
      padding: 3px;
      border: 0;
      border-radius: 6px;
      background: #4f5452;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font: inherit;
      cursor: pointer;
    }

    .toggle-knob {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #f8f8f6;
      display: block;
    }

    .delivery {
      margin: 8px 0 0;
      color: #777b79;
      font-size: 12px;
      line-height: 1.5;
    }

    .rule {
      margin: 24px 0 20px;
      border: 0;
      border-top: 1px solid #d7d9d6;
    }

    .preview {
      margin: 0;
    }

    .preview img {
      width: 342px;
      height: 120px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #d5d6d2;
    }

    .preview figcaption {
      margin-top: 10px;
      color: #656966;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="subscription-heading">
      <p class="eyebrow">Nourish Thread Series</p>
      <h1 id="subscription-heading">Get Balanced Plate weekly</h1>
      <p class="intro">One practical meal guide and a seasonal recipe, delivered every Tuesday.</p>

      <section class="subscription" aria-label="Subscription preference">
        <div class="subscription-copy">
          <p class="subscription-title">Weekly email</p>
          <p class="subscription-status">Subscribed · Tuesdays</p>
        </div>
        <button class="toggle" type="button" role="switch" aria-checked="true" aria-label="Turn off weekly email subscription">
          <span class="toggle-knob" aria-hidden="true"></span>
        </button>
      </section>

      <p class="delivery">Sent to casey.arden@example.com</p>

      <hr class="rule">

      <figure class="preview">
        <img src="https://loremflickr.com/342/120/salad?lock=6950" width="342" height="120" alt="A colorful prepared salad featured in the weekly meal guide">
        <figcaption>This week’s guide: building a satisfying lunch.</figcaption>
      </figure>
    </main>
  </div>
</body>
</html>
