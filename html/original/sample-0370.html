<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Meal Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eaed;
      color: #20212a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 20px;
      background: #f5f5f7;
    }

    .meal-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d8d9df;
      border-radius: 4px;
    }

    .card-header {
      padding: 16px;
      border-bottom: 1px solid #dedfe4;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #4f46b8;
      font-size: 12px;
      font-weight: 700;
      line-height: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 29px;
      letter-spacing: -0.02em;
    }

    form {
      padding: 14px 16px 16px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #5f616c;
      font-size: 12px;
      font-weight: 500;
      line-height: 17px;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cfd0d7;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #24252d;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .foods-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 8px;
    }

    .foods-heading h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }

    .add-food {
      padding: 3px 8px;
      border: 1px solid #a9a6dc;
      border-radius: 4px;
      background: #ffffff;
      color: #4941a7;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
    }

    .food-list {
      border-top: 1px solid #dedfe4;
    }

    .food-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #dedfe4;
    }

    .food-row img {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: block;
      object-fit: cover;
      border-radius: 4px;
      background: #d9dae0;
    }

    .food-copy {
      min-width: 0;
      flex: 1;
    }

    .food-name {
      margin: 0;
      overflow: hidden;
      color: #25262e;
      font-size: 14px;
      font-weight: 500;
      line-height: 19px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .food-meta {
      margin: 2px 0 0;
      color: #71737e;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
    }

    .serving {
      flex: 0 0 62px;
      color: #4c4e58;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      text-align: right;
    }

    .meal-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 0;
    }

    .total-label {
      color: #555761;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    .total-value {
      color: #272837;
      font-size: 17px;
      font-weight: 700;
      line-height: 22px;
    }

    .create-button {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #4338a8;
      border-radius: 4px;
      background: #4f46b8;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="meal-card" aria-labelledby="meal-title">
      <header class="card-header">
        <p class="eyebrow">Nourish Ledger · New entry</p>
        <h1 id="meal-title">Log a new meal</h1>
      </header>

      <form>
        <div class="detail-grid">
          <div>
            <label for="meal-type">Meal type</label>
            <select id="meal-type" aria-label="Meal type">
              <option selected>Lunch</option>
              <option>Breakfast</option>
              <option>Dinner</option>
              <option>Snack</option>
            </select>
          </div>
          <div>
            <label for="meal-date">Date</label>
            <input id="meal-date" type="text" value="May 18, 2025" readonly>
          </div>
        </div>

        <div class="foods-heading">
          <h2>Foods added</h2>
          <button class="add-food" type="button">Add food</button>
        </div>

        <div class="food-list">
          <div class="food-row">
            <img src="https://loremflickr.com/40/40/salad?lock=5270" width="40" height="40" alt="Chicken and grain salad bowl">
            <div class="food-copy">
              <p class="food-name">Chicken grain bowl</p>
              <p class="food-meta">420 cal</p>
            </div>
            <span class="serving">1 bowl</span>
          </div>

          <div class="food-row">
            <img src="https://loremflickr.com/40/40/fruit?lock=5271" width="40" height="40" alt="Sliced red apple">
            <div class="food-copy">
              <p class="food-name">Red apple</p>
              <p class="food-meta">95 cal</p>
            </div>
            <span class="serving">1 medium</span>
          </div>

          <div class="food-row">
            <img src="https://loremflickr.com/40/40/fruit?lock=5272" width="40" height="40" alt="Berries served with yogurt">
            <div class="food-copy">
              <p class="food-name">Berries and yogurt</p>
              <p class="food-meta">140 cal</p>
            </div>
            <span class="serving">3/4 cup</span>
          </div>
        </div>

        <div class="meal-total">
          <span class="total-label">Estimated total</span>
          <span class="total-value">655 cal</span>
        </div>

        <button class="create-button" type="submit">Create meal entry</button>
      </form>
    </section>
  </div>
</body>
</html>
