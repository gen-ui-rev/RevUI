<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer failed — Marrow Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e7e7e9;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #27272a;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    background: #e7e7e9;
    padding: 36px 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 2px 10px rgba(24, 24, 27, 0.10);
    padding: 26px 22px 22px;
  }
  .mark {
    width: 44px;
    height: 44px;
    border-radius: 4px;
    background: #3f3f46;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 25px;
    line-height: 1.22;
    margin: 18px 0 0;
    letter-spacing: -0.2px;
  }
  .lede {
    font-size: 15px;
    line-height: 1.5;
    color: #52525b;
    margin: 10px 0 0;
  }
  .facts {
    margin-top: 20px;
    border-top: 1px solid #e4e4e7;
  }
  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid #e4e4e7;
  }
  .k {
    font-size: 14px;
    color: #71717a;
    white-space: nowrap;
  }
  .v {
    font-size: 14px;
    font-weight: 600;
    color: #27272a;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .actions {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: block;
    width: 100%;
    border-radius: 4px;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 14px;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary {
    background: #27272a;
    color: #fafafa;
    border: 1px solid #27272a;
  }
  .btn-secondary {
    background: #ffffff;
    color: #3f3f46;
    border: 1px solid #d4d4d8;
  }
  .code {
    margin: 16px 0 0;
    font-size: 12px;
    color: #a1a1aa;
    text-align: center;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="8.5"></circle>
          <path d="M12 7.6v5.2"></path>
          <path d="M12 16.3h0.01"></path>
        </svg>
      </div>

      <h1>Transfer could not be completed</h1>
      <p class="lede">Your bank declined the request because the account was temporarily locked. No money left your balance.</p>

      <div class="facts">
        <div class="row">
          <span class="k">Amount</span>
          <span class="v">$1,240.00</span>
        </div>
        <div class="row">
          <span class="k">To</span>
          <span class="v">Rosalind Meeker · 4417</span>
        </div>
        <div class="row">
          <span class="k">Attempted</span>
          <span class="v">Mar 14, 2024, 9:42 AM</span>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="#">Try transfer again</a>
        <a class="btn btn-secondary" href="#">Contact support</a>
      </div>

      <p class="code">Reference TR-90284-DL</p>
    </div>
  </div>
</body>
</html>
