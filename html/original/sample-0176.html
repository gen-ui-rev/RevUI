<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Shared — Dayweave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d5d1;
      color: #292725;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f2f1ef;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 18px 18px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e4e1dd;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 600;
      color: #2c2927;
    }

    .icon-button {
      width: 40px;
      padding: 8px;
      border: 0;
      background: transparent;
      color: #494541;
      line-height: 0;
      cursor: pointer;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
    }

    .topbar-spacer {
      width: 40px;
    }

    main {
      flex: 1;
      padding: 28px 24px 24px;
    }

    .success-card {
      padding: 28px 24px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(69, 62, 56, 0.09);
    }

    .celebration {
      display: block;
      width: 138px;
      height: 126px;
      margin: 0 auto 16px;
    }

    .success-title {
      margin: 0;
      color: #292725;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .success-copy {
      margin: 12px auto 0;
      max-width: 284px;
      color: #6b6661;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 400;
    }

    .details {
      margin: 24px 0 0;
      padding: 18px 0;
      border-top: 1px solid #ebe8e4;
      border-bottom: 1px solid #ebe8e4;
      text-align: left;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 12px;
      align-items: baseline;
    }

    .detail-row + .detail-row {
      margin-top: 12px;
    }

    .details dt,
    .details dd {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .details dt {
      color: #8a837d;
      font-weight: 400;
    }

    .details dd {
      color: #3d3936;
      font-weight: 500;
    }

    .primary-action {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px 18px;
      border-radius: 10px;
      background: #948172;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 10px 12px;
      background: #ffffff;
      border-top: 1px solid #e2dfdb;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 2px;
      color: #89837d;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #8f7b6c;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15.5 5L8.5 12L15.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="topbar-title">Dayweave</h1>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <main>
      <section class="success-card" aria-labelledby="success-title">
        <svg class="celebration" viewBox="0 0 138 126" fill="none" aria-hidden="true">
          <path d="M22 37L14 31" stroke="#B8AAA0" stroke-width="3" stroke-linecap="round"/>
          <path d="M116 37L124 30" stroke="#948172" stroke-width="3" stroke-linecap="round"/>
          <path d="M33 17L29 8" stroke="#948172" stroke-width="3" stroke-linecap="round"/>
          <path d="M103 17L108 8" stroke="#B8AAA0" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 66H6" stroke="#948172" stroke-width="3" stroke-linecap="round"/>
          <path d="M122 66H132" stroke="#B8AAA0" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="94" r="3" fill="#C9BDB4"/>
          <circle cx="121" cy="94" r="3" fill="#948172"/>
          <circle cx="68" cy="65" r="43" fill="#948172"/>
          <path d="M49 65.5L61.5 78L88.5 51" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h2 class="success-title" id="success-title">Update shared</h2>
        <p class="success-copy">
          Your weekly planning note is now visible to all 8 members of Product Planning.
        </p>

        <dl class="details">
          <div class="detail-row">
            <dt>Workspace</dt>
            <dd>Product Planning</dd>
          </div>
          <div class="detail-row">
            <dt>Shared</dt>
            <dd>Today, 2:36 PM</dd>
          </div>
        </dl>

        <a class="primary-action" href="#" aria-label="Return to updates">Return to updates</a>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.5V14H9.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>
      <a class="tab active" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 5H17C18.1 5 19 5.9 19 7V17C19 18.1 18.1 19 17 19H7C5.9 19 5 18.1 5 17V7C5 5.9 5.9 5 7 5Z" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.5 9H15.5M8.5 12H15.5M8.5 15H13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Updates</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 4V7M18 4V7M4.5 9H19.5M6.5 6H17.5C18.6 6 19.5 6.9 19.5 8V18C19.5 19.1 18.6 20 17.5 20H6.5C5.4 20 4.5 19.1 4.5 18V8C4.5 6.9 5.4 6 6.5 6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Schedule</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 20C5.9 16.7 8.4 14.5 12 14.5C15.6 14.5 18.1 16.7 18.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
