<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Goal — Northrest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#c026d3;
    --ink:#141416;
    --muted:#6c6c74;
    --line:#dcdcdf;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#efeeec;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:36px 24px;
  }
  .card{
    border:1px solid var(--line);
    padding:26px 22px 24px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 2px;
    line-height:1.3;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0;
    line-height:1.5;
  }
  .value{
    margin:22px 0 0;
    font-size:44px;
    font-weight:600;
    color:var(--ink);
    line-height:1.1;
    letter-spacing:-.01em;
  }
  .value span{
    font-size:20px;
    font-weight:500;
    color:var(--muted);
    margin-left:6px;
  }
  .slider{
    margin-top:24px;
    position:relative;
    height:28px;
  }
  .track{
    position:absolute;
    top:13px;
    left:0;
    right:0;
    height:2px;
    background:var(--line);
  }
  .fill{
    position:absolute;
    top:13px;
    left:0;
    width:55%;
    height:2px;
    background:var(--accent);
  }
  .knob{
    position:absolute;
    top:0;
    left:55%;
    width:4px;
    height:28px;
    margin-left:-2px;
    background:var(--accent);
  }
  .scale{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
  }
  .scale span{
    font-size:12px;
    color:var(--muted);
  }
  .stepper{
    margin-top:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:12px 0;
  }
  .step-btn{
    width:46px;
    height:40px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .step-label{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
  }
  .step-label em{
    display:block;
    font-style:normal;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .note{
    margin:18px 0 0;
    font-size:13px;
    line-height:1.55;
    color:var(--muted);
  }
  .confirm{
    margin-top:22px;
    display:block;
    width:100%;
    padding:14px 0;
    border:0;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Northrest</p>
      <h1>Nightly sleep goal</h1>
      <p class="sub">Used to score each night and set your wind-down reminder.</p>

      <p class="value">7h 45m<span>per night</span></p>

      <div class="slider">
        <div class="track"></div>
        <div class="fill"></div>
        <div class="knob"></div>
      </div>
      <div class="scale">
        <span>5h</span>
        <span>10h</span>
      </div>

      <div class="stepper">
        <div class="step-btn" role="img" aria-label="Decrease by 15 minutes">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 7h12" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
        <div class="step-label">15-minute steps<em>Range 5h 00m to 10h 00m</em></div>
        <div class="step-btn" role="img" aria-label="Increase by 15 minutes">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
      </div>

      <p class="note">Your last 30 nights averaged 7h 02m. A wind-down reminder will arrive at 10:15 PM.</p>

      <div class="confirm">Save goal</div>
    </div>
  </div>
</body>
</html>
