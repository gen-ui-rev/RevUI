<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Hold Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e7;
      color: #292426;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #f7f5f5;
    }

    .hold-card {
      width: 100%;
      padding: 22px;
      border: 1px solid #ddd6d8;
      border-radius: 10px;
      background: #ffffff;
    }

    .service {
      margin: 0 0 6px;
      color: #a43f60;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 0;
      color: #70676a;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    .timer {
      margin-top: 22px;
      text-align: center;
    }

    .timer-label {
      margin: 0;
      color: #70676a;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .timer-value {
      margin: 2px 0 0;
      color: #b43f65;
      font-size: 58px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
    }

    .timer-detail {
      margin: 3px 0 0;
      color: #70676a;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5dfe1;
    }

    .item img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e1df;
    }

    .item-copy {
      min-width: 0;
    }

    .item-name {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .item-meta {
      margin: 4px 0 0;
      color: #70676a;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
    }

    .item-price {
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .checkout {
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 1px solid #ad3d61;
      border-radius: 10px;
      background: #ad3d61;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .release {
      display: block;
      width: 100%;
      margin-top: 11px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #70676a;
      font: inherit;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 700;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="hold-card" aria-labelledby="hold-title">
      <p class="service">Nooklane Market</p>
      <h1 id="hold-title">Your cart is on hold</h1>
      <p class="intro">Complete checkout before the reserved item returns to the marketplace.</p>

      <div class="timer" aria-label="Eight minutes and forty-two seconds remaining">
        <p class="timer-label">Time remaining</p>
        <p class="timer-value">08:42</p>
        <p class="timer-detail">Hold ends at 3:18 PM</p>
      </div>

      <div class="item">
        <img src="https://loremflickr.com/72/72/furniture?lock=4870" width="72" height="72" alt="Cream upholstered lounge chair">
        <div class="item-copy">
          <p class="item-name">Cove Lounge Chair</p>
          <p class="item-meta">Natural linen · Local delivery</p>
          <p class="item-price">$184.00</p>
        </div>
      </div>

      <button class="checkout" type="button">Complete checkout</button>
      <button class="release" type="button">Release item now</button>
    </main>
  </div>
</body>
</html>
