<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm cancellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --zinc-900:#18181b;
    --zinc-700:#3f3f46;
    --zinc-500:#71717a;
    --accent-08:rgba(113,113,122,.10);
    --accent-16:rgba(113,113,122,.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e4e4e7;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:36px 24px;
  }
  .dialog{
    background:#ffffff;
    border-radius:6px;
    padding:24px;
  }
  .mark{
    width:34px;
    height:34px;
    border-radius:6px;
    background:var(--accent-16);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    margin:16px 0 0;
    font-size:20px;
    font-weight:700;
    line-height:1.3;
    color:var(--zinc-900);
    letter-spacing:-.01em;
  }
  .body{
    margin:8px 0 0;
    font-size:15px;
    font-weight:400;
    line-height:1.5;
    color:var(--zinc-500);
  }
  .item{
    margin-top:20px;
    background:var(--accent-08);
    border-radius:6px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mono{
    width:40px;
    height:40px;
    flex:none;
    border-radius:6px;
    background:var(--accent-16);
    color:var(--zinc-700);
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.02em;
  }
  .item-text{min-width:0;}
  .item-title{
    font-size:15px;
    font-weight:500;
    color:var(--zinc-900);
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    margin-top:3px;
    font-size:13px;
    font-weight:400;
    color:var(--zinc-500);
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .amount{
    margin-left:auto;
    flex:none;
    font-size:15px;
    font-weight:700;
    color:var(--zinc-900);
  }
  .actions{
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .btn{
    display:block;
    width:100%;
    border:0;
    border-radius:6px;
    padding:13px 16px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--zinc-900);
    color:#fafafa;
  }
  .btn-secondary{
    background:var(--accent-08);
    color:var(--zinc-700);
  }
  .note{
    margin:14px 0 0;
    font-size:12px;
    font-weight:400;
    line-height:1.45;
    color:var(--zinc-500);
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dialog">
      <div class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"></path>
          <path d="M12 17h.01"></path>
          <path d="M10.3 3.9 2.6 17.2a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
        </svg>
      </div>

      <h1>Cancel order 48-2071?</h1>
      <p class="body">The seller has not shipped yet, so this can still be stopped. Your refund returns to the card ending 4417 in 3–5 business days.</p>

      <div class="item">
        <div class="mono">MW</div>
        <div class="item-text">
          <div class="item-title">Speckled dinner plates, set of 4</div>
          <div class="item-meta">Maren Wolfe Ceramics · Ordered Mar 14</div>
        </div>
        <div class="amount">$84.50</div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary">Cancel this order</button>
        <button type="button" class="btn btn-secondary">Keep my order</button>
      </div>

      <p class="note">Once canceled, the order cannot be restored at this price.</p>
    </div>
  </div>
</body>
</html>
