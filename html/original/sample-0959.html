<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow status</title>
<style>
  :root{
    --accent:#6b3fd4;
    --accent-soft:#f1ecfd;
    --line:#e5e3ec;
    --ink:#181722;
    --muted:#6d6a7c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#f0eff2;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    padding:36px 20px;
    background:#f0eff2;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px 22px;
  }
  .who{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .avatar{
    width:56px;
    height:56px;
    border-radius:14px;
    background:var(--accent-soft);
    border:1px solid #e0d7fa;
    color:var(--accent);
    font-size:19px;
    font-weight:600;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .who .name{
    font-size:19px;
    font-weight:600;
    line-height:1.25;
  }
  .who .handle{
    font-size:14px;
    color:var(--muted);
    margin-top:3px;
  }
  .bio{
    margin:16px 0 0;
    font-size:14px;
    line-height:1.5;
    color:#3f3d4c;
  }
  .meta{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
  }
  .meta b{
    color:var(--ink);
    font-weight:600;
  }
  .action{
    margin-top:20px;
    width:100%;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .since{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  .rule{
    height:1px;
    background:var(--line);
    margin:20px 0 0;
  }
  .notify{
    display:flex;
    align-items:center;
    gap:14px;
    padding-top:18px;
  }
  .notify .label{
    font-size:14px;
    font-weight:500;
  }
  .notify .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    line-height:1.4;
  }
  .switch{
    flex:none;
    width:46px;
    height:28px;
    border-radius:14px;
    background:var(--accent);
    position:relative;
  }
  .switch span{
    position:absolute;
    top:3px;
    left:21px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="who">
        <div class="avatar">MT</div>
        <div>
          <div class="name">Marisol Trent</div>
          <div class="handle">@marisol · Northwind Studio</div>
        </div>
      </div>

      <p class="bio">Keeps the release calendar and weekly planning notes in Cadence. Shares a public digest every Friday.</p>

      <div class="meta"><b>1,248</b> followers · <b>7</b> shared boards</div>

      <button class="action" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        Following
      </button>
      <div class="since">Following since March 4, 2025</div>

      <div class="rule"></div>
      <div class="notify">
        <div>
          <div class="label">Notify me about new notes</div>
          <div class="sub">Pushes an alert when Marisol publishes to a shared board.</div>
        </div>
        <div class="switch"><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
