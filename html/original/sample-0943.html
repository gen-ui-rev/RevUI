<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Earned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ECEAE6;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 30px 32px;
    background: #FFFFFF;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #D9540B;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .eyebrow svg { display: block; }
  .hero {
    width: 326px;
    height: 150px;
    display: block;
    object-fit: cover;
    border-radius: 14px;
    background: #DDD8D1;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.22;
    color: #1B1917;
    margin: 20px 0 8px;
  }
  .detail {
    font-size: 14px;
    line-height: 1.5;
    color: #605A54;
    margin: 0;
  }
  .stamp {
    font-size: 14px;
    color: #8A837C;
    margin: 12px 0 0;
  }
  .rule {
    height: 1px;
    background: #E4E0DA;
    margin: 24px 0 20px;
  }
  .next-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8A837C;
    margin: 0 0 10px;
  }
  .next-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .next-name {
    font-size: 16px;
    font-weight: 600;
    color: #1B1917;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .next-count {
    font-size: 14px;
    color: #605A54;
    flex: none;
  }
  .track {
    width: 100%;
    height: 8px;
    border-radius: 14px;
    background: #EFEBE5;
    overflow: hidden;
  }
  .fill {
    width: 50%;
    height: 8px;
    border-radius: 14px;
    background: #E8600D;
  }
  .note {
    font-size: 13px;
    color: #8A837C;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M4 1.5h6v3.2a3 3 0 0 1-6 0V1.5Z" stroke="#D9540B" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M4 2.6H2v1.1a2.2 2.2 0 0 0 2 2.2M10 2.6h2v1.1a2.2 2.2 0 0 1-2 2.2" stroke="#D9540B" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M7 7.9v2.6M4.8 12.5h4.4" stroke="#D9540B" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Milestone earned
    </p>

    <img class="hero" src="https://loremflickr.com/326/150/study?lock=12483" width="326" height="150" alt="A desk with a Spanish workbook and notes from a daily study session">

    <h1>Thirty Days of Spanish</h1>
    <p class="detail">You finished a lesson every day from June 3 through July 2 — 42 lessons and 1,180 new words reviewed.</p>
    <p class="stamp">Awarded July 2, 2025 · Verbena Spanish, Level B1</p>

    <div class="rule"></div>

    <p class="next-label">Next milestone</p>
    <div class="next-row">
      <span class="next-name">Sixty Day Streak</span>
      <span class="next-count">30 of 60 days</span>
    </div>
    <div class="track"><div class="fill"></div></div>
    <p class="note">One lesson today keeps the streak going.</p>
  </div>
</body>
</html>
