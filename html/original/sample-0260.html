<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sleep Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e9e9ec;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:#1b1b1f;
  }
  .screen{
    width:390px;
    background:#f1f1f4;
    padding:36px 0;
    box-sizing:border-box;
  }
  .card{
    width:318px;
    margin:0 auto;
    background:#ffffff;
    border-radius:6px;
    box-shadow:0 6px 20px rgba(24,22,30,.10);
    padding:24px 22px 22px;
    box-sizing:border-box;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#84838d;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#c81e8f;
    display:inline-block;
  }
  .count{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:58px;
    line-height:1.05;
    letter-spacing:-.01em;
    margin:14px 0 2px;
  }
  .count small{
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:15px;
    font-weight:400;
    color:#84838d;
    letter-spacing:0;
    margin-left:8px;
  }
  .track{
    height:6px;
    border-radius:6px;
    background:#ececed;
    margin:18px 0 8px;
    overflow:hidden;
  }
  .fill{
    width:41%;
    height:100%;
    background:#c81e8f;
    border-radius:6px;
  }
  .ends{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#84838d;
  }
  .rule{
    height:1px;
    background:#ececef;
    margin:20px 0 16px;
  }
  .now{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .art{
    width:46px;height:46px;
    border-radius:6px;
    background:#f4d7ea;
    flex:none;
  }
  .now-text{min-width:0;}
  .now-title{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-sub{
    font-size:13px;
    color:#84838d;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    border-radius:6px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:11px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    box-sizing:border-box;
    cursor:default;
  }
  .btn-ghost{
    background:#ffffff;
    border:1px solid #d9d9de;
    color:#1b1b1f;
  }
  .btn-solid{
    background:#c81e8f;
    border:1px solid #c81e8f;
    color:#ffffff;
  }
  .cancel{
    display:block;
    width:100%;
    margin-top:14px;
    text-align:center;
    font-size:14px;
    color:#84838d;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="eyebrow"><span class="dot"></span>Sleep timer</div>

      <div class="count">26:41<small>remaining</small></div>

      <div class="track"><div class="fill"></div></div>
      <div class="ends">
        <span>Started 10:29 PM</span>
        <span>Fades out 11:14 PM</span>
      </div>

      <div class="rule"></div>

      <div class="now">
        <div class="art"></div>
        <div class="now-text">
          <div class="now-title">The Long Way Home</div>
          <div class="now-sub">Field Notes &middot; Episode 112</div>
        </div>
      </div>

      <div class="actions">
        <div class="btn btn-ghost">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M7 1.5v11M1.5 7h11" stroke="#1b1b1f" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          15 min
        </div>
        <div class="btn btn-solid">
          <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true">
            <rect x="1" y="1" width="3.4" height="12" rx="1" fill="#ffffff"/>
            <rect x="7.6" y="1" width="3.4" height="12" rx="1" fill="#ffffff"/>
          </svg>
          Pause
        </div>
      </div>

      <div class="cancel">Cancel timer</div>
    </div>
  </div>
</body>
</html>
