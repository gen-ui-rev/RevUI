<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Room Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7ec;
      color: #25212a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #f7f6f8;
    }

    .timer-card {
      width: 100%;
      padding: 24px;
      border: 1px solid #dcd7e1;
      border-radius: 14px;
      background: #ffffff;
    }

    .context {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .monogram {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #ede7f6;
      color: #6d3ba5;
      font-size: 15px;
      font-weight: 600;
    }

    .context-copy {
      min-width: 0;
    }

    .service {
      margin: 0 0 2px;
      color: #6d3ba5;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      color: #25212a;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer {
      padding: 32px 0 26px;
      text-align: center;
    }

    .timer-label {
      margin: 0 0 6px;
      color: #6b6570;
      font-size: 14px;
    }

    .time {
      margin: 0;
      color: #6d3ba5;
      font-size: 54px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }

    .duration {
      margin: 10px 0 0;
      color: #6b6570;
      font-size: 14px;
    }

    .progress {
      width: 100%;
      height: 8px;
      margin-top: 20px;
      border-radius: 14px;
      background: #ece9ef;
    }

    .progress-value {
      width: 59%;
      height: 100%;
      border-radius: 14px;
      background: #7540ac;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid #e5e1e8;
    }

    button {
      min-height: 46px;
      border-radius: 14px;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .secondary {
      border: 1px solid #cfc8d5;
      background: #ffffff;
      color: #39333e;
    }

    .primary {
      border: 1px solid #6d3ba5;
      background: #6d3ba5;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="timer-card" aria-labelledby="timer-title">
      <div class="context">
        <div class="monogram" aria-hidden="true">MC</div>
        <div class="context-copy">
          <p class="service">Threadwell group timer</p>
          <h1 id="timer-title">Morning Creators Circle</h1>
        </div>
      </div>

      <div class="timer">
        <p class="timer-label">Time remaining</p>
        <p class="time" aria-label="18 minutes and 24 seconds remaining">18:24</p>
        <p class="duration">26 minutes elapsed of 45</p>
        <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="45" aria-valuenow="26">
          <div class="progress-value"></div>
        </div>
      </div>

      <div class="controls">
        <button class="secondary" type="button">End timer</button>
        <button class="primary" type="button">Pause</button>
      </div>
    </section>
  </div>
</body>
</html>
