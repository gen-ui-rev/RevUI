<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Cash Flow Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7e4;
      color: #202223;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 44px 24px;
      background: #f4f4f2;
    }

    .share-sheet {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d4d5d3;
      border-radius: 10px;
    }

    .context {
      margin: 0 0 8px;
      color: #646968;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #343839;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 22px;
      color: #646968;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .section-label {
      margin: 0 0 10px;
      color: #424647;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .share-options {
      display: grid;
      gap: 8px;
    }

    .share-option {
      width: 100%;
      margin: 0;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid #d7d8d6;
      border-radius: 10px;
      background: #ffffff;
      color: #26292a;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .recipient {
      min-width: 0;
    }

    .recipient-name {
      display: block;
      overflow: hidden;
      color: #292c2d;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recipient-detail {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #747877;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .channel {
      flex: 0 0 auto;
      color: #555b5b;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .privacy-note {
      margin: 16px 0 0;
      color: #747877;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="share-sheet" aria-labelledby="share-title">
      <p class="context">Northwise Finance · November 2025</p>
      <h1 id="share-title">Share cash flow summary</h1>
      <p class="description">Choose a recipient and channel for a read-only view of your monthly totals.</p>

      <p class="section-label">Recent recipients</p>
      <div class="share-options">
        <button class="share-option" type="button">
          <span class="recipient">
            <span class="recipient-name">Avery Cole</span>
            <span class="recipient-detail">(415) 555-0138</span>
          </span>
          <span class="channel">Text</span>
        </button>

        <button class="share-option" type="button">
          <span class="recipient">
            <span class="recipient-name">Jordan Reed</span>
            <span class="recipient-detail">jordan.reed@example.com</span>
          </span>
          <span class="channel">Email</span>
        </button>

        <button class="share-option" type="button">
          <span class="recipient">
            <span class="recipient-name">Choose another person</span>
            <span class="recipient-detail">Enter a phone number or email</span>
          </span>
          <span class="channel">Select</span>
        </button>
      </div>

      <p class="privacy-note">Account numbers and individual transactions are not included.</p>
    </section>
  </div>
</body>
</html>
