<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateful — Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#c2405f;
    --rose-soft:rgba(194,64,95,0.11);
    --rose-softer:rgba(194,64,95,0.06);
    --ink:#221c1e;
    --muted:#6f676a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#eceae9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:34px 0;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:26px 28px;
    background:#eceae9;
  }
  .card{
    width:334px;
    background:#ffffff;
    border-radius:10px;
  }
  .hero{
    width:334px;
    height:132px;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:10px 10px 0 0;
  }
  .body{padding:16px 18px 18px;}
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--rose);
    margin:0;
  }
  .track{
    display:flex;
    gap:5px;
    margin:9px 0 15px;
  }
  .seg{height:5px;flex:1;border-radius:10px;background:var(--rose-soft);}
  .seg.on{background:var(--rose);}
  h2{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:23px;
    line-height:1.2;
    margin:0 0 7px;
  }
  .lede{
    font-size:15px;
    line-height:1.45;
    color:var(--muted);
    margin:0;
  }
  .next-label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 9px;
  }
  .thumbs{display:flex;gap:11px;}
  .thumb{width:92px;}
  .thumb img{
    width:92px;
    height:64px;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:10px;
  }
  .thumb span{
    display:block;
    margin-top:6px;
    font-size:12px;
    line-height:1.25;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    background:var(--rose-softer);
    border-radius:10px;
    padding:10px 14px;
  }
  .next{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    background:var(--rose);
    border-radius:10px;
    padding:11px 18px;
  }
  .count{
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/334/132/salad?lock=3380" width="334" height="132" alt="A plate of green salad with grains photographed from above">
      <div class="body">
        <p class="eyebrow">Step 2 of 4</p>
        <div class="track">
          <div class="seg on"></div>
          <div class="seg on"></div>
          <div class="seg"></div>
          <div class="seg"></div>
        </div>
        <h2>Log a meal from one photo</h2>
        <p class="lede">Point the camera at your plate. Plateful estimates each portion and fills in calories and protein — you only correct what looks off.</p>

        <p class="next-label">Coming up</p>
        <div class="thumbs">
          <div class="thumb">
            <img src="https://loremflickr.com/92/64/fruit?lock=3381" width="92" height="64" alt="Bowl of mixed fruit used for the barcode scanning step">
            <span>Scan groceries</span>
          </div>
          <div class="thumb">
            <img src="https://loremflickr.com/92/64/gym?lock=3382" width="92" height="64" alt="Gym weights for the workout syncing step">
            <span>Sync workouts</span>
          </div>
          <div class="thumb">
            <img src="https://loremflickr.com/92/64/running?lock=3383" width="92" height="64" alt="Runner on a path for the weekly goal step">
            <span>Set week goals</span>
          </div>
        </div>

        <div class="foot">
          <span class="back">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M8.5 3L4.5 7l4 4" stroke="#6f676a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
          </span>
          <span class="count">2 of 4 done</span>
          <span class="next">Next</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
