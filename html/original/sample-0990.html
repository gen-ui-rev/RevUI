<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8dcda;
      color: #17372e;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #eef1ef;
    }

    .splash {
      position: absolute;
      top: 260px;
      left: 48px;
      width: 294px;
      padding: 42px 34px 38px;
      text-align: center;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 9px 24px rgba(27, 54, 45, 0.11);
    }

    .brand-mark {
      display: block;
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
    }

    .brand-name {
      margin: 0;
      color: #123c30;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.6px;
    }

    .service-type {
      margin: 9px 0 0;
      color: #0b7b5a;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .divider {
      width: 36px;
      height: 2px;
      margin: 20px auto 18px;
      background: #15906b;
    }

    .description {
      margin: 0;
      color: #68766f;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="splash" aria-label="Gatherline team workspace">
      <svg class="brand-mark" viewBox="0 0 68 68" role="img" aria-label="Gatherline mark">
        <rect x="2" y="2" width="64" height="64" rx="6" fill="#0F8763"/>
        <circle cx="22" cy="24" r="6" fill="#FFFFFF"/>
        <circle cx="46" cy="24" r="6" fill="#FFFFFF"/>
        <circle cx="34" cy="45" r="6" fill="#FFFFFF"/>
        <path d="M27 27.5L31 39M41 27.5L37 39M28 24H40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <h1 class="brand-name">Gatherline</h1>
      <p class="service-type">Team workspace</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="description">Notes, decisions, and schedules in one shared place.</p>
    </main>
  </div>
</body>
</html>
