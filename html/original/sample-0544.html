<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Reminder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d8d4;
      color: #20211f;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 16px 20px;
      background: #ececea;
    }

    .reminder-card {
      width: 100%;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(31, 32, 29, 0.11);
    }

    .hero {
      position: relative;
      padding: 18px;
      background: #f4cf3e;
    }

    .service {
      margin: 0 0 6px;
      color: #59501e;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 245px;
      margin: 0;
      font-size: 23px;
      font-weight: 600;
      line-height: 31px;
      letter-spacing: -0.02em;
    }

    .context {
      margin: 5px 0 0;
      color: #4f481f;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
    }

    .hero-glyph {
      position: absolute;
      top: 20px;
      right: 18px;
      width: 42px;
      height: 42px;
      color: #292817;
    }

    .section {
      padding: 15px 18px;
      border-bottom: 1px solid #e7e7e2;
    }

    .section-title {
      margin: 0 0 8px;
      color: #676862;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .setting-row {
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid #ededE8;
    }

    .setting-row:first-of-type {
      border-top: 0;
    }

    .row-label {
      color: #282927;
      font-size: 14px;
      font-weight: 500;
      line-height: 21px;
    }

    .row-value {
      color: #555650;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
      text-align: right;
      white-space: nowrap;
    }

    .repeat-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .repeat-option {
      min-width: 0;
      padding: 9px 3px;
      border: 1px solid #d7d7d1;
      background: #ffffff;
      color: #555650;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      text-align: center;
    }

    .repeat-option.selected {
      border-color: #d4ac12;
      background: #f4cf3e;
      color: #242414;
    }

    .repeat-summary {
      margin: 10px 0 0;
      padding-top: 10px;
      border-top: 1px solid #ededE8;
      color: #555650;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
    }

    .repeat-summary strong {
      color: #282927;
      font-weight: 500;
    }

    .action {
      padding: 14px 18px;
    }

    .save-button {
      width: 100%;
      min-height: 46px;
      padding: 11px 16px;
      border: 1px solid #242522;
      background: #242522;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="reminder-card" aria-labelledby="reminder-title">
      <header class="hero">
        <p class="service">Commonway</p>
        <h1 id="reminder-title">Schedule reminder</h1>
        <p class="context">Reply in Harbor Street neighbors</p>
        <svg class="hero-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M14 7v7M34 7v7M9 18h30M12 11h24a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="2"/>
          <circle cx="29" cy="29" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M29 25v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
        </svg>
      </header>

      <section class="section" aria-labelledby="when-heading">
        <h2 class="section-title" id="when-heading">When</h2>
        <div class="setting-row">
          <span class="row-label">Date</span>
          <span class="row-value">Tuesday, June 24</span>
        </div>
        <div class="setting-row">
          <span class="row-label">Time</span>
          <span class="row-value">7:30 PM</span>
        </div>
      </section>

      <section class="section" aria-labelledby="repeat-heading">
        <h2 class="section-title" id="repeat-heading">Repeat</h2>
        <div class="repeat-options" role="group" aria-label="Repeat interval">
          <div class="repeat-option">Once</div>
          <div class="repeat-option">Daily</div>
          <div class="repeat-option selected" aria-current="true">Weekly</div>
          <div class="repeat-option">Monthly</div>
        </div>
        <p class="repeat-summary"><strong>Every Tuesday</strong> · Never ends</p>
      </section>

      <div class="action">
        <button class="save-button" type="button">Save reminder</button>
      </div>
    </main>
  </div>
</body>
</html>
