<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Sign-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e3;
      color: #20272c;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 42px 28px;
      background: #f8f8f5;
    }

    .service {
      margin: 0 0 12px;
      color: #526271;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #293845;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.12;
    }

    .intro {
      margin: 16px 0 0;
      color: #5c6469;
      font-size: 16px;
      line-height: 1.5;
    }

    form {
      margin-top: 28px;
    }

    .field-label {
      display: block;
      margin-bottom: 11px;
      color: #30383e;
      font-size: 15px;
      font-weight: 600;
    }

    .code-fields {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .code-fields input {
      width: 100%;
      padding: 11px 0 10px;
      border: 1px solid #9da5aa;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
      color: #293845;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      caret-color: #526271;
    }

    .code-fields input:focus {
      border-color: #526271;
      box-shadow: 0 0 0 1px #526271;
    }

    .expiry {
      margin: 12px 0 0;
      color: #6a7175;
      font-size: 14px;
      line-height: 1.4;
    }

    .primary-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 18px;
      border: 1px solid #465867;
      border-radius: 6px;
      background: #465867;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }

    .alternate {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #d3d6d6;
    }

    .alternate p {
      margin: 0;
      color: #596166;
      font-size: 14px;
      line-height: 1.45;
    }

    .text-button {
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #405565;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="verification-title">
      <p class="service">Northline Finance</p>
      <h1 id="verification-title">Verify your sign-in</h1>
      <p class="intro">Enter the 6-digit code sent to m•••••@harbormail.com to continue to your accounts.</p>

      <form>
        <label class="field-label" for="code-1">Verification code</label>
        <div class="code-fields" aria-label="Six-digit verification code">
          <input id="code-1" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2">
          <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 3">
          <input type="text" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 4">
          <input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 5">
          <input type="text" inputmode="numeric" maxlength="1" value="6" aria-label="Digit 6">
        </div>
        <p class="expiry">This code expires in 7 minutes.</p>
        <button class="primary-button" type="submit">Verify code</button>
      </form>

      <section class="alternate" aria-label="Alternate verification option">
        <p>Did not receive the email? Check your spam folder or request a new code.</p>
        <button class="text-button" type="button">Send a new code</button>
      </section>
    </main>
  </div>
</body>
</html>
