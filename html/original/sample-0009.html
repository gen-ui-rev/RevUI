<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster — Focus block activity</title>
<style>
  :root {
    --rose: #f4436f;
  }
  html, body {
    margin: 0;
    background: #ececeb;
  }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 92px 20px;
    background: #ececeb;
    display: flex;
    justify-content: center;
  }
  .island {
    width: 100%;
    max-width: 348px;
    box-sizing: border-box;
    background: #0b0b0c;
    color: #ffffff;
    padding: 18px 18px 16px;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .head img {
    display: block;
    width: 48px;
    height: 48px;
    object-fit: cover;
    background: #2a2a2c;
    flex: none;
  }
  .meta {
    min-width: 0;
    flex: 1;
  }
  .eyebrow {
    font-size: 12px;
    line-height: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--rose);
    font-weight: 600;
  }
  .title {
    margin-top: 3px;
    font-size: 17px;
    line-height: 22px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .time {
    flex: none;
    text-align: right;
    padding-left: 6px;
  }
  .clock {
    font-size: 22px;
    line-height: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .clabel {
    margin-top: 2px;
    font-size: 12px;
    line-height: 15px;
    color: rgba(255, 255, 255, 0.55);
  }
  .bar {
    margin-top: 16px;
    height: 4px;
    background: rgba(255, 255, 255, 0.16);
  }
  .bar span {
    display: block;
    width: 68%;
    height: 100%;
    background: var(--rose);
  }
  .foot {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 14px;
    line-height: 18px;
    color: rgba(255, 255, 255, 0.62);
  }
  .foot .who {
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .foot .ends {
    flex: none;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="head">
        <img src="https://loremflickr.com/48/48/meeting?lock=1203" width="48" height="48" alt="Team gathered around a table in the booked meeting room">
        <div class="meta">
          <div class="eyebrow">Aster · Focus block</div>
          <div class="title">Design review — Room 2</div>
        </div>
        <div class="time">
          <div class="clock">12:48</div>
          <div class="clabel">left</div>
        </div>
      </div>
      <div class="bar"><span></span></div>
      <div class="foot">
        <span class="who">Notes shared with Dana Whitlock</span>
        <span class="ends">Ends 2:15 PM</span>
      </div>
    </div>
  </div>
</body>
</html>
