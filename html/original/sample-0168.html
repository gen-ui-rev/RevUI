<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Avenfold Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e5;
      color: #20252b;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 16px 20px;
      background: #f2f4f5;
    }

    .icon-button {
      width: 32px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: #35414d;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 22px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #35414d;
      color: #ffffff;
    }

    .help-link {
      justify-self: end;
      color: #35414d;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-tabs {
      padding: 10px 20px;
      background: #ffffff;
    }

    .tab-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 6px;
      background: #eef0f2;
    }

    .tab {
      padding: 9px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #68717a;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .tab.active {
      background: #35414d;
      color: #ffffff;
    }

    main {
      padding: 18px 20px 20px;
    }

    .intro h1 {
      margin: 0;
      color: #20252b;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .intro p {
      margin: 7px 0 0;
      color: #69727b;
      font-size: 14px;
      line-height: 1.45;
    }

    .signup-form {
      margin-top: 18px;
    }

    .field + .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #3a424a;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 600;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 6px;
      background: #f0f2f3;
      color: #6a737c;
    }

    .input-wrap svg {
      flex: 0 0 auto;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #252b31;
      font-size: 14px;
      line-height: 20px;
    }

    .input-wrap input::placeholder {
      color: #899198;
      opacity: 1;
    }

    .password-rules {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 6px;
      background: #eef0f2;
    }

    .rules-title {
      margin: 0 0 7px;
      color: #4d5660;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
    }

    .rule-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rule-list li {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #667079;
      font-size: 12px;
      line-height: 1.4;
    }

    .rule-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #7c858d;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 15px;
      color: #5f6871;
      font-size: 12px;
      line-height: 1.5;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-top: 1px;
      border-radius: 4px;
      background: #e7eaec;
    }

    .terms a,
    .login-prompt a {
      color: #35414d;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 18px;
      border: 0;
      border-radius: 6px;
      background: #35414d;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 17px 0;
      color: #7b848c;
      font-size: 12px;
      line-height: 1.4;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e4e7e9;
    }

    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .social-button {
      min-width: 0;
      padding: 13px 10px;
      border: 0;
      border-radius: 6px;
      background: #eef0f2;
      color: #35414d;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .login-prompt {
      margin: 18px 0 0;
      color: #707981;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M12.75 4.5L7.25 10L12.75 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="brand" aria-label="Avenfold">
        <span class="brand-mark">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2.2 10.8L5.9 3.2C6.35 2.28 7.65 2.28 8.1 3.2L11.8 10.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M4.2 8H9.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Avenfold</span>
      </div>

      <a class="help-link" href="#">Help</a>
    </header>

    <nav class="auth-tabs" aria-label="Account access">
      <div class="tab-list" role="tablist">
        <button class="tab active" type="button" role="tab" aria-selected="true">Create account</button>
        <button class="tab" type="button" role="tab" aria-selected="false">Sign in</button>
      </div>
    </nav>

    <main>
      <section class="intro" aria-labelledby="signup-title">
        <h1 id="signup-title">Create your account</h1>
        <p>Use your email or a connected account.</p>
      </section>

      <form class="signup-form">
        <div class="field">
          <label for="full-name">Full name</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3.5 15C4.1 12.35 6.05 11 9 11C11.95 11 13.9 12.35 14.5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="Jordan Mercer">
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <rect x="2.25" y="3.75" width="13.5" height="10.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3.5 5L9 9L14.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="jordan@example.com">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <rect x="3" y="7.25" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5.75 7.25V5.5C5.75 3.7 7.2 2.25 9 2.25C10.8 2.25 12.25 3.7 12.25 5.5V7.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="9" cy="11.25" r="1" fill="currentColor"/>
            </svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a secure password">
          </div>
        </div>

        <div class="password-rules" aria-label="Password requirements">
          <p class="rules-title">Your password must include</p>
          <ul class="rule-list">
            <li><span class="rule-dot"></span>8 or more characters</li>
            <li><span class="rule-dot"></span>One number or symbol</li>
          </ul>
        </div>

        <div class="terms">
          <span class="checkbox" role="checkbox" aria-checked="false" aria-label="Accept terms"></span>
          <span>I agree to the <a href="#">Terms of Use</a> and acknowledge the <a href="#">Privacy Notice</a>.</span>
        </div>

        <button class="primary-button" type="submit">Create account</button>
      </form>

      <div class="divider"><span>Or continue with</span></div>

      <div class="social-row" aria-label="Connected account options">
        <button class="social-button" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 2.25L14.5 5.4V11.7L9 14.85L3.5 11.7V5.4L9 2.25Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M6.4 9L8.1 10.7L11.8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Arc ID
        </button>

        <button class="social-button" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5.5 10.6C6.2 12 7.35 12.7 9 12.7C11.05 12.7 12.5 11.25 12.5 9.2H9.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Cedar ID
        </button>
      </div>

      <p class="login-prompt">Already registered? <a href="#">Sign in</a></p>
    </main>
  </div>
</body>
</html>
