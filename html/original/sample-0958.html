<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9d5;
      color: #20221d;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 32px 20px;
      background: #eeeeeb;
    }

    .delete-card {
      width: 100%;
      padding: 26px 24px 24px;
      background: #ffffff;
      border-top: 4px solid #b7e633;
      border-radius: 4px;
      box-shadow: 0 8px 22px rgba(32, 34, 29, 0.1);
    }

    .service {
      margin: 0 0 8px;
      color: #676a60;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
    }

    .trip {
      margin: 22px 0 0;
      padding: 15px 0;
      border-top: 1px solid #ddded8;
      border-bottom: 1px solid #ddded8;
    }

    .trip-name {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
    }

    .trip-date {
      margin: 3px 0 0;
      color: #676a60;
      font-size: 14px;
      line-height: 1.4;
    }

    .warning {
      margin: 18px 0 0;
      font-size: 15px;
      line-height: 1.5;
    }

    .archive-note {
      margin: 12px 0 0;
      color: #55594f;
      font-size: 14px;
      line-height: 1.5;
    }

    .archive-note a {
      color: #303429;
      font-weight: 600;
      text-decoration-color: #8db820;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .actions {
      margin-top: 24px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      min-height: 46px;
      padding: 11px 16px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
    }

    .delete-button {
      border: 1px solid #9ecb26;
      background: #b7e633;
      color: #1d2115;
    }

    .cancel-button {
      border: 1px solid #cfd1ca;
      background: #ffffff;
      color: #30332d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="delete-card" aria-labelledby="delete-title">
      <p class="service">Roamory trip planner</p>
      <h1 id="delete-title">Delete this trip?</h1>

      <div class="trip">
        <p class="trip-name">Northern Coast Weekend</p>
        <p class="trip-date">September 12–15, 2025</p>
      </div>

      <p class="warning">
        This permanently deletes the itinerary, reservations, notes, and saved places. It cannot be undone.
      </p>

      <p class="archive-note">
        Need it out of your trip list without losing it? <a href="#">Move it to Archive</a> instead.
      </p>

      <div class="actions">
        <button class="delete-button" type="button">Delete trip permanently</button>
        <button class="cancel-button" type="button">Keep trip</button>
      </div>
    </main>
  </div>
</body>
</html>
