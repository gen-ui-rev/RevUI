<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Complete — Linden Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d8d2;
      color: #292a25;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f2f1ec;
    }

    .top-bar {
      min-height: 64px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 0 12px;
      background: #ffffff;
      border-bottom: 1px solid #deddd6;
    }

    .top-bar h1 {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 8px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #4a4b45;
      cursor: default;
    }

    .top-spacer {
      width: 40px;
      height: 40px;
    }

    .content {
      flex: 1;
      padding: 44px 24px 24px;
    }

    .success-card {
      padding: 28px 24px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(44, 45, 38, 0.09);
    }

    .celebration {
      position: relative;
      width: 160px;
      height: 112px;
      margin: 0 auto 16px;
    }

    .celebration-mark {
      position: absolute;
      inset: 0;
      width: 160px;
      height: 112px;
    }

    .check {
      position: absolute;
      top: 18px;
      left: 44px;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #737a3f;
      color: #ffffff;
    }

    .success-card h2 {
      margin: 0;
      color: #25271f;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
    }

    .message {
      margin: 12px auto 0;
      max-width: 270px;
      color: #66675f;
      font-size: 15px;
      line-height: 1.55;
    }

    .lesson {
      margin-top: 24px;
      padding: 16px;
      text-align: left;
      background: #f5f4ef;
      border: 1px solid #e2e0d8;
      border-radius: 4px;
    }

    .lesson-label {
      margin: 0 0 4px;
      color: #74766d;
      font-size: 12px;
      line-height: 1.4;
    }

    .lesson-title {
      margin: 0;
      color: #2d2e29;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 600;
    }

    .lesson-meta {
      margin: 7px 0 0;
      color: #66675f;
      font-size: 14px;
      line-height: 1.4;
    }

    .primary-action {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: 1px solid #687039;
      border-radius: 4px;
      background: #737a3f;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      cursor: default;
    }

    .secondary-action {
      margin-top: 12px;
      padding: 8px 12px;
      border: 0;
      background: transparent;
      color: #59602f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: default;
    }

    .tab-bar {
      min-height: 72px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #ffffff;
      border-top: 1px solid #deddd6;
    }

    .tab {
      position: relative;
      display: grid;
      place-items: center;
      padding: 13px 8px 11px;
      color: #74756e;
      font-size: 14px;
      line-height: 1.2;
      text-decoration: none;
    }

    .tab.active {
      color: #626a34;
      font-weight: 600;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 34px;
      right: 34px;
      height: 3px;
      background: #737a3f;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Close lesson summary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <h1>Linden Learning</h1>
      <div class="top-spacer" aria-hidden="true"></div>
    </header>

    <main class="content">
      <section class="success-card" aria-labelledby="completion-title">
        <div class="celebration" aria-hidden="true">
          <svg class="celebration-mark" viewBox="0 0 160 112" fill="none">
            <path d="M20 34L28 28" stroke="#737A3F" stroke-width="2" stroke-linecap="round"/>
            <path d="M132 29L140 35" stroke="#737A3F" stroke-width="2" stroke-linecap="round"/>
            <path d="M31 78L22 83" stroke="#737A3F" stroke-width="2" stroke-linecap="round"/>
            <path d="M129 79L138 85" stroke="#737A3F" stroke-width="2" stroke-linecap="round"/>
            <path d="M48 15L45 7" stroke="#9A9F70" stroke-width="2" stroke-linecap="round"/>
            <path d="M112 14L116 7" stroke="#9A9F70" stroke-width="2" stroke-linecap="round"/>
            <circle cx="23" cy="57" r="3" fill="#9A9F70"/>
            <circle cx="139" cy="58" r="3" fill="#9A9F70"/>
            <rect x="37" y="94" width="6" height="6" rx="1" transform="rotate(18 37 94)" fill="#737A3F"/>
            <rect x="119" y="93" width="6" height="6" rx="1" transform="rotate(-18 119 93)" fill="#737A3F"/>
          </svg>
          <div class="check">
            <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
              <path d="M10 20.5L17 27.5L30.5 13.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <h2 id="completion-title">Lesson complete</h2>
        <p class="message">Your progress is saved. You are ready to continue to the next lesson.</p>

        <div class="lesson">
          <p class="lesson-label">SPANISH FOUNDATIONS · LESSON 8</p>
          <p class="lesson-title">Planning a Weekend</p>
          <p class="lesson-meta">9 of 10 correct · 12 minutes</p>
        </div>

        <button class="primary-action" type="button">Continue to Lesson 9</button>
        <button class="secondary-action" type="button">Review answers</button>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <a class="tab active" href="#" aria-current="page">Learn</a>
      <a class="tab" href="#">Practice</a>
      <a class="tab" href="#">Library</a>
    </nav>
  </div>
</body>
</html>
