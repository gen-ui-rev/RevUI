<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microphone access — Larkspeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #eceae7;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    color: #1b1b1b;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 32px 24px;
    background: #ffffff;
  }
  .hero {
    display: block;
    width: 342px;
    height: 156px;
    object-fit: cover;
    background: #d5d2ce;
  }
  .eyebrow {
    margin: 22px 0 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #c8102e;
  }
  h1 {
    margin: 10px 0 0;
    font-size: 24px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .body {
    margin: 12px 0 0;
    font-size: 15px;
    line-height: 1.55;
    color: #4d4d4d;
  }
  .note {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #e2e0dd;
  }
  .note svg { flex: none; margin-top: 1px; }
  .note p {
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: #6b6b6b;
  }
  .actions {
    margin-top: 26px;
  }
  .btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 15px 12px;
    border: 0;
    border-radius: 0;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }
  .btn-primary {
    background: #c8102e;
    color: #ffffff;
  }
  .btn-secondary {
    margin-top: 6px;
    background: transparent;
    color: #4d4d4d;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="hero" src="https://loremflickr.com/342/156/study?lock=2463" width="342" height="156" alt="A learner practicing spoken English aloud at a desk with an open notebook">

    <p class="eyebrow">Microphone</p>
    <h1>Let Larkspeak hear you say it</h1>
    <p class="body">Speaking drills score your pronunciation as you talk. Without the microphone, Unit 4 stays in reading mode only.</p>

    <div class="note">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="3" y="7" width="10" height="7" stroke="#8d8d8d" stroke-width="1.3"/>
        <path d="M5.5 7V4.8a2.5 2.5 0 0 1 5 0V7" stroke="#8d8d8d" stroke-width="1.3"/>
      </svg>
      <p>Clips are scored on your device and deleted when the lesson ends.</p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" type="button">Allow microphone</button>
      <button class="btn btn-secondary" type="button">Not now</button>
    </div>
  </div>
</body>
</html>
