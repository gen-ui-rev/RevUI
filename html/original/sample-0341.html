<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Teammates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e9ec;
      color: #18202a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #ffffff;
    }

    .intro {
      margin-bottom: 26px;
    }

    .intro-icon {
      width: 42px;
      height: 42px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #334155;
      color: #ffffff;
    }

    .intro-icon svg {
      width: 22px;
      height: 22px;
    }

    h1 {
      margin: 0 0 8px;
      color: #27364a;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 0;
      color: #657080;
      font-size: 14px;
      line-height: 1.55;
    }

    .field {
      margin-bottom: 24px;
    }

    label,
    .section-label {
      display: block;
      margin: 0 0 9px;
      color: #26313e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border: 1px solid #cbd1d9;
      border-radius: 14px;
      background: #ffffff;
    }

    .input-wrap svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      color: #778291;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #18202a;
      font: 500 14px/1.4 'Manrope', system-ui, sans-serif;
    }

    input[type="email"]::placeholder {
      color: #929aa5;
      opacity: 1;
    }

    fieldset {
      margin: 0 0 24px;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      padding: 0;
    }

    .role-list {
      border-top: 1px solid #d9dde3;
    }

    .role-option {
      position: relative;
      display: grid;
      grid-template-columns: 28px 1fr 20px;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #d9dde3;
      cursor: pointer;
    }

    .role-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .role-icon {
      width: 28px;
      height: 28px;
      color: #647184;
    }

    .role-icon svg {
      width: 100%;
      height: 100%;
    }

    .role-copy {
      min-width: 0;
    }

    .role-name {
      display: block;
      margin-bottom: 2px;
      color: #202a36;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .role-description {
      display: block;
      color: #707a87;
      font-size: 12px;
      line-height: 1.45;
    }

    .radio-mark {
      width: 20px;
      height: 20px;
      border: 1.5px solid #aeb6c0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .radio-mark::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
    }

    .role-option input:checked + .role-icon {
      color: #334155;
    }

    .role-option input:checked ~ .radio-mark {
      border-color: #334155;
    }

    .role-option input:checked ~ .radio-mark::after {
      background: #334155;
    }

    .invite-button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #334155;
      color: #ffffff;
      font: 700 14px/1.4 'Manrope', system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    .helper {
      margin: 12px 0 0;
      color: #747e8b;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="invite-title">
      <header class="intro">
        <div class="intro-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M3.5 18c.5-3 2.4-4.7 5.5-4.7s5 1.7 5.5 4.7"></path>
            <path d="M17.5 8.5v6"></path>
            <path d="M14.5 11.5h6"></path>
          </svg>
        </div>
        <h1 id="invite-title">Invite a teammate</h1>
        <p>Add someone to your Streamfold workspace and choose what they can manage.</p>
      </header>

      <form>
        <div class="field">
          <label for="email">Work email</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5.5" width="18" height="13" rx="2"></rect>
              <path d="m4.5 7 7.5 6 7.5-6"></path>
            </svg>
            <input id="email" type="email" placeholder="name@studio.com" aria-label="Work email">
          </div>
        </div>

        <fieldset>
          <legend class="section-label">Workspace role</legend>
          <div class="role-list">
            <label class="role-option">
              <input type="radio" name="role" checked>
              <span class="role-icon" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="14" cy="9" r="3.5"></circle>
                  <path d="M7 22c.6-4 2.9-6.2 7-6.2s6.4 2.2 7 6.2"></path>
                </svg>
              </span>
              <span class="role-copy">
                <span class="role-name">Member</span>
                <span class="role-description">Create playlists and edit assigned shows.</span>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>

            <label class="role-option">
              <input type="radio" name="role">
              <span class="role-icon" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 3.8 22 7v5.8c0 5.1-3.1 8.8-8 11.4-4.9-2.6-8-6.3-8-11.4V7l8-3.2Z"></path>
                  <path d="m10.5 14 2.2 2.2 4.8-5"></path>
                </svg>
              </span>
              <span class="role-copy">
                <span class="role-name">Manager</span>
                <span class="role-description">Manage content, members, and publishing.</span>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <button class="invite-button" type="submit">Send workspace invite</button>
        <p class="helper">The invite expires in 7 days. You can change access later.</p>
      </form>
    </main>
  </div>
</body>
</html>
