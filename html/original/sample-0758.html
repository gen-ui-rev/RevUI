<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circleline Room Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9e6;
      color: #171714;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #fafaf7;
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid #d8d8d1;
    }

    .room-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #706f67;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      color: #171714;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .people {
      display: flex;
      flex-shrink: 0;
    }

    .monogram {
      width: 34px;
      height: 34px;
      margin-left: -7px;
      display: grid;
      place-items: center;
      border: 2px solid #fafaf7;
      border-radius: 4px;
      background: #2d2d29;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }

    .monogram:first-child {
      margin-left: 0;
      background: #6c634b;
    }

    .timer {
      padding: 28px 0 24px;
      text-align: center;
    }

    .timer-label {
      margin: 0 0 16px;
      color: #5f5e57;
      font-size: 14px;
      font-weight: 400;
    }

    .timer-ring {
      position: relative;
      width: 174px;
      height: 174px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      width: 174px;
      height: 174px;
      transform: rotate(-90deg);
    }

    .timer-value {
      position: relative;
      color: #171714;
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .timer-status {
      margin: 12px 0 0;
      color: #706f67;
      font-size: 12px;
      font-weight: 400;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 20px;
      border-top: 1px solid #d8d8d1;
    }

    button {
      min-height: 48px;
      border-radius: 4px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: default;
    }

    .pause {
      border: 1px solid #e2b600;
      background: #f4c62f;
      color: #171714;
    }

    .end {
      border: 1px solid #b9b8b0;
      background: transparent;
      color: #34342f;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="room-header">
      <div class="room-copy">
        <p class="eyebrow">Circleline room</p>
        <h1>Neighborhood introductions</h1>
      </div>
      <div class="people" aria-label="Hosted by Mara and Owen">
        <div class="monogram" aria-hidden="true">MR</div>
        <div class="monogram" aria-hidden="true">OK</div>
      </div>
    </header>

    <main class="timer">
      <p class="timer-label">Conversation ends in</p>
      <div class="timer-ring" role="img" aria-label="18 minutes and 24 seconds remaining, 68 percent">
        <svg viewBox="0 0 174 174" aria-hidden="true">
          <circle cx="87" cy="87" r="76" fill="none" stroke="#e2e1da" stroke-width="10"></circle>
          <circle cx="87" cy="87" r="76" fill="none" stroke="#f4c62f" stroke-width="10" stroke-linecap="butt" stroke-dasharray="324.7 477.5"></circle>
        </svg>
        <div class="timer-value">18:24</div>
      </div>
      <p class="timer-status">Started at 7:30 PM · 6 people joined</p>
    </main>

    <div class="controls" aria-label="Timer controls">
      <button class="pause" type="button">Pause timer</button>
      <button class="end" type="button">End session</button>
    </div>
  </div>
</body>
</html>
