<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark Workspace Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebee;
      color: #17232d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px 20px;
      background: #ffffff;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: rgba(41, 157, 218, 0.11);
      color: #147fb8;
    }

    .topbar-copy {
      min-width: 0;
      flex: 1;
    }

    .product-name {
      margin: 0 0 1px;
      color: #60717d;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      overflow: hidden;
      color: #17232d;
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .avatar {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      border-radius: 0;
      background: rgba(41, 157, 218, 0.14);
      color: #147fb8;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      flex: 1;
      padding: 105px 28px 100px;
    }

    .error-state {
      width: 100%;
      text-align: center;
    }

    .error-symbol {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border-radius: 0;
      background: rgba(41, 157, 218, 0.12);
      color: #168bc7;
    }

    .error-state h1 {
      max-width: 310px;
      margin: 0 auto 12px;
      color: #17232d;
      font-size: 28px;
      font-weight: 700;
      line-height: 35px;
    }

    .error-state p {
      max-width: 305px;
      margin: 0 auto;
      color: #60717d;
      font-size: 15px;
      font-weight: 400;
      line-height: 22px;
    }

    .retry-button {
      width: 100%;
      margin-top: 30px;
      padding: 15px 18px;
      border: 0;
      border-radius: 0;
      background: #168bc7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 22px;
      cursor: pointer;
    }

    .tabbar {
      width: 100%;
      display: flex;
      align-items: stretch;
      padding: 8px 12px 12px;
      background: #f8fafb;
    }

    .tab {
      min-width: 0;
      flex: 1;
      padding: 9px 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #73828c;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
    }

    .tab.active {
      background: rgba(41, 157, 218, 0.12);
      color: #147fb8;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>
      <div class="topbar-copy">
        <p class="product-name">Daymark</p>
        <p class="page-title">Northfield Planning</p>
      </div>
      <div class="avatar" aria-label="Morgan Lee profile">ML</div>
    </header>

    <main>
      <section class="error-state" aria-labelledby="error-title">
        <div class="error-symbol" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M15 34H34C39 34 42 31 42 26.5C42 22.4 39.1 19.4 35.2 19C34.2 13.8 30.1 10.5 25 10.5C20.2 10.5 16.3 13.3 14.8 17.6C10 17.8 6.5 21.2 6.5 25.8C6.5 30.5 10 34 15 34Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M18 39L30 27" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
            <path d="M18 27L30 39" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
          </svg>
        </div>
        <h1 id="error-title">We couldn’t open this workspace</h1>
        <p>Your connection was interrupted. Your recent edits are saved on this device.</p>
        <button class="retry-button" type="button">Try again</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5H19V19H5V5Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 9H16M8 13H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
        </svg>
        <span>Tasks</span>
      </button>
      <button class="tab active" type="button" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 4H18V20H6V4Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9 8H15M9 12H15M9 16H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
        </svg>
        <span>Notes</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 7H19V19H5V7Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 4V9M16 4V9M5 11H19" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Schedule</span>
      </button>
    </nav>
  </div>
</body>
</html>
