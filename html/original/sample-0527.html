<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7eb;
      color: #211d28;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #fcfbfd;
    }

    .component {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f3cc3;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 22px;
      color: #68616f;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    .trip {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 0 20px;
      border-bottom: 1px solid #dedbe2;
    }

    .trip img {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #d8d4dc;
    }

    .trip-copy {
      min-width: 0;
    }

    .trip-name {
      margin: 0 0 4px;
      overflow: hidden;
      color: #211d28;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trip-location {
      margin: 0;
      color: #77707e;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 400;
    }

    fieldset {
      min-width: 0;
      margin: 20px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      color: #211d28;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
    }

    .folder-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-top: 1px solid #e5e2e7;
      cursor: default;
    }

    .folder-option:last-of-type {
      border-bottom: 1px solid #e5e2e7;
    }

    .folder-option input {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      accent-color: #7040c7;
    }

    .folder-copy {
      min-width: 0;
    }

    .folder-name {
      display: block;
      margin-bottom: 2px;
      color: #29232f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .folder-meta {
      display: block;
      color: #7a7380;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    .folder-option input:checked + .folder-copy .folder-name {
      color: #6431b7;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      cursor: default;
    }

    .cancel {
      padding: 11px 14px;
      background: transparent;
      color: #625b69;
    }

    .move {
      padding: 11px 16px;
      background: #7040c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="move-title">
      <p class="eyebrow">Change collection</p>
      <h1 id="move-title">Move trip</h1>
      <p class="intro">Choose a new collection. This moves the whole trip without changing the order of its saved places.</p>

      <div class="trip">
        <img src="https://loremflickr.com/56/56/cityscape?lock=7130" width="56" height="56" alt="Lisbon rooftops beside the waterfront">
        <div class="trip-copy">
          <p class="trip-name">Lisbon Weekend</p>
          <p class="trip-location">Currently in Weekend Ideas</p>
        </div>
      </div>

      <fieldset>
        <legend>Move to</legend>

        <label class="folder-option">
          <input type="radio" name="destination" checked>
          <span class="folder-copy">
            <span class="folder-name">Coastal Plans</span>
            <span class="folder-meta">8 saved places</span>
          </span>
        </label>

        <label class="folder-option">
          <input type="radio" name="destination">
          <span class="folder-copy">
            <span class="folder-name">City Stops</span>
            <span class="folder-meta">12 saved places</span>
          </span>
        </label>

        <label class="folder-option">
          <input type="radio" name="destination">
          <span class="folder-copy">
            <span class="folder-name">Mountain Weekends</span>
            <span class="folder-meta">5 saved places</span>
          </span>
        </label>
      </fieldset>

      <div class="actions">
        <button class="cancel" type="button">Cancel</button>
        <button class="move" type="button">Move to Coastal Plans</button>
      </div>
    </main>
  </div>
</body>
</html>
