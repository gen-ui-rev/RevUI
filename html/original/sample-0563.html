<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Transfer — Ember Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e3;
      color: #24211e;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #f7f6f3;
    }

    .dialog {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d8d4ce;
      border-radius: 4px;
    }

    .accent-icon {
      width: 36px;
      height: 36px;
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      color: #c95616;
      background: #fff3eb;
      border: 1px solid #efb58f;
      border-radius: 4px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 10px 0 22px;
      color: #67615b;
      font-size: 14px;
      line-height: 1.55;
    }

    .transfer-details {
      margin: 0 0 24px;
      border-top: 1px solid #dedad4;
      border-bottom: 1px solid #dedad4;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px solid #ebe8e3;
    }

    dt {
      color: #716b65;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 400;
    }

    dd {
      margin: 0;
      color: #24211e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-align: right;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 10px;
    }

    button {
      min-width: 0;
      padding: 12px 10px;
      border-radius: 4px;
      font: 600 14px/1.3 'Plus Jakarta Sans', system-ui, sans-serif;
      cursor: pointer;
    }

    .secondary {
      color: #393531;
      background: #ffffff;
      border: 1px solid #cfcac3;
    }

    .primary {
      color: #ffffff;
      background: #c95616;
      border: 1px solid #c95616;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <div class="accent-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M7 7.5H17M17 7.5L13.5 4M17 7.5L13.5 11M17 16.5H7M7 16.5L10.5 13M7 16.5L10.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="confirm-title">Send this transfer?</h1>
      <p class="description" id="confirm-description">
        Ember Ledger will send the money immediately. This transfer cannot be canceled after it is sent.
      </p>

      <dl class="transfer-details">
        <div class="detail-row">
          <dt>Amount</dt>
          <dd>$1,250.00</dd>
        </div>
        <div class="detail-row">
          <dt>To</dt>
          <dd>Jordan Mercer</dd>
        </div>
        <div class="detail-row">
          <dt>From</dt>
          <dd>Everyday Checking · 4821</dd>
        </div>
      </dl>

      <div class="actions">
        <button class="secondary" type="button">No, go back</button>
        <button class="primary" type="button">Yes, send</button>
      </div>
    </section>
  </div>
</body>
</html>
