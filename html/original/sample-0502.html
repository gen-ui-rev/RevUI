<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinned Marketplace Item</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd5;
      color: #25231f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f2f0ec;
    }

    .pin-card {
      padding: 24px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(42, 37, 29, 0.09);
    }

    .service-name {
      margin: 0 0 10px;
      color: #766f64;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pin-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      color: #c77b00;
    }

    h1 {
      margin: 0;
      color: #25231f;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
    }

    .description {
      margin: 12px 0 22px;
      color: #625d54;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border: 1px solid #e3dfd7;
      border-radius: 10px;
      background: #faf9f7;
    }

    .product-visual {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #514c44;
    }

    .product-copy {
      min-width: 0;
    }

    .product-name {
      margin: 0 0 5px;
      overflow: hidden;
      color: #292722;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-detail {
      margin: 0 0 4px;
      color: #706a61;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .product-price {
      margin: 0;
      color: #292722;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .unpin-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 10px;
      background: #d88908;
      color: #251b0c;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .unpin-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    .boundary-note {
      margin: 14px 0 0;
      color: #777066;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pin-title">
      <p class="service-name">Lattice Market</p>

      <div class="title-row">
        <svg class="pin-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M12.2 5.5h7.6l-.8 7.1 3.7 4.2v2.1H9.3v-2.1l3.7-4.2-.8-7.1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 18.9v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1 id="pin-title">Pinned to the top</h1>
      </div>

      <p class="description">This listing stays first in your Recently viewed items for faster access.</p>

      <div class="product">
        <div class="product-visual" aria-hidden="true">
          <svg viewBox="0 0 76 76" width="76" height="76" fill="none">
            <path d="M23 37.5V26.8c0-3.2 2.5-5.8 5.7-5.8h18.6c3.2 0 5.7 2.6 5.7 5.8v10.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M19 35.5c0-2.2 1.8-4 4-4s4 1.8 4 4V42h22v-6.5c0-2.2 1.8-4 4-4s4 1.8 4 4V51H19V35.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M23 51v6M53 51v6M27 42h22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="product-copy">
          <p class="product-name">Oak Lounge Chair</p>
          <p class="product-detail">Pre-owned · Cedar Falls, IA</p>
          <p class="product-price">$185.00</p>
        </div>
      </div>

      <button class="unpin-button" type="button" aria-label="Remove pin from Oak Lounge Chair">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M7.6 3.2h4.8l-.5 4.4 2.3 2.6v1.3H5.8v-1.3l2.3-2.6-.5-4.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M10 11.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Remove pin
      </button>

      <p class="boundary-note">Pins are private. This item is not saved to a list, and no public reaction is posted.</p>
    </section>
  </div>
</body>
</html>
