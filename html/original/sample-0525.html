<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned — Marlowe Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#C8265C;
    --ink:#17181B;
    --mid:#6B6F76;
    --rule:#E3E4E7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#EFEFEC;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#FFFFFF;
    padding:32px;
  }

  .eyebrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--ink);
  }
  .eyebrow h1{
    margin:0;
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .eyebrow span{
    font-size:12px;
    font-weight:500;
    color:var(--mid);
  }

  .hero{padding:20px 0 22px;}
  .hero img{
    width:326px;
    height:150px;
    object-fit:cover;
    display:block;
    background:#D8D9D5;
    border-radius:4px;
  }
  .hero-body{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-top:16px;
  }
  .hero-body .txt{flex:1;min-width:0;}
  .hero-body h2{
    margin:0 0 5px;
    font-size:20px;
    font-weight:700;
    line-height:1.25;
    color:var(--ink);
  }
  .meta{
    margin:0;
    font-size:13px;
    font-weight:400;
    color:var(--mid);
  }
  .pin-on{
    flex:none;
    width:34px;height:34px;
    border-radius:4px;
    background:var(--rose);
    display:flex;align-items:center;justify-content:center;
  }
  .pin-off{
    flex:none;
    width:34px;height:34px;
    border-radius:4px;
    background:#FFFFFF;
    border:1px solid var(--rule);
    display:flex;align-items:center;justify-content:center;
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-top:1px solid var(--rule);
  }
  .row img{
    width:44px;height:44px;
    object-fit:cover;
    display:block;
    background:#D8D9D5;
    border-radius:4px;
    flex:none;
  }
  .row .txt{flex:1;min-width:0;}
  .row h3{
    margin:0 0 3px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .footer{
    border-top:1px solid var(--rule);
    padding-top:16px;
  }
  .footer p{
    margin:0 0 9px;
    font-size:13px;
    font-weight:500;
    color:var(--mid);
  }
  .bar{
    width:100%;
    height:4px;
    border-radius:4px;
    background:#EDEDEE;
  }
  .bar i{
    display:block;
    height:4px;
    width:25%;
    border-radius:4px;
    background:var(--rose);
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="eyebrow">
      <h1>Pinned to sidebar</h1>
      <span>1 of 4</span>
    </div>

    <div class="hero">
      <img src="https://loremflickr.com/326/150/workspace?lock=7100" width="326" height="150" alt="Overhead view of the launch team's shared workspace">
      <div class="hero-body">
        <div class="txt">
          <h2>Q3 Launch Runway</h2>
          <p class="meta">Board · 18 open tasks · Updated 2:14 PM</p>
        </div>
        <div class="pin-on" aria-label="Pinned">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3h6"/><path d="M10 3v6.2L7 12.4V14h10v-1.6l-3-3.2V3"/><path d="M12 14v6.5"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="row">
      <img src="https://loremflickr.com/44/44/notebook?lock=7101" width="44" height="44" alt="Notebook page from the design system archive">
      <div class="txt">
        <h3>Design System Notes</h3>
        <p class="meta">Note · Edited Mar 14</p>
      </div>
      <div class="pin-off" aria-label="Not pinned">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9EA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3h6"/><path d="M10 3v6.2L7 12.4V14h10v-1.6l-3-3.2V3"/><path d="M12 14v6.5"/>
        </svg>
      </div>
    </div>

    <div class="row">
      <img src="https://loremflickr.com/44/44/meeting?lock=7102" width="44" height="44" alt="Team gathered around a table during the weekly sync">
      <div class="txt">
        <h3>Weekly Sync Agenda</h3>
        <p class="meta">Doc · Edited Mar 12</p>
      </div>
      <div class="pin-off" aria-label="Not pinned">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9EA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3h6"/><path d="M10 3v6.2L7 12.4V14h10v-1.6l-3-3.2V3"/><path d="M12 14v6.5"/>
        </svg>
      </div>
    </div>

    <div class="footer">
      <p>1 of 4 sidebar pins used. Pins are private to you.</p>
      <div class="bar"><i></i></div>
    </div>

  </div>
</body>
</html>
