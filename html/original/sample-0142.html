<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketwell Radio — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#047857;
    --tint:rgba(4,120,87,0.10);
    --tint-soft:rgba(4,120,87,0.06);
    --ink:#14201c;
    --muted:#5f6b66;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#ececeb;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:28px;
    border-radius:14px;
  }

  /* ---- player ---- */
  .player{
    background:var(--tint);
    border-radius:14px;
    padding:16px;
  }
  .top{
    display:flex;
    gap:14px;
  }
  .art{
    width:132px;
    height:132px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#d5ded9;
    flex:0 0 132px;
  }
  .info{min-width:0;}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--emerald);
  }
  .title{
    margin:6px 0 0;
    font-size:19px;
    line-height:1.25;
    font-weight:700;
  }
  .meta{
    margin-top:8px;
    font-size:14px;
    line-height:1.4;
    color:var(--muted);
  }
  .meta strong{font-weight:700;color:var(--ink);}

  .bar{
    margin-top:16px;
    height:5px;
    border-radius:3px;
    background:rgba(4,120,87,0.18);
  }
  .bar > span{
    display:block;
    width:31%;
    height:5px;
    border-radius:3px;
    background:var(--emerald);
  }
  .times{
    margin-top:7px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
  }

  .controls{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .speed{
    font-size:14px;
    font-weight:700;
    color:var(--emerald);
    background:rgba(4,120,87,0.14);
    border-radius:14px;
    padding:6px 10px;
  }
  .transport{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .play{
    width:52px;
    height:52px;
    border-radius:52px;
    background:var(--emerald);
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step{color:var(--emerald);display:flex;}
  .save{
    width:36px;
    height:36px;
    border-radius:14px;
    background:rgba(4,120,87,0.14);
    color:var(--emerald);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- featured ---- */
  .sec{
    margin-top:20px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .sec h2{
    margin:0;
    font-size:15px;
    font-weight:700;
  }
  .sec span{
    font-size:12px;
    color:var(--muted);
  }
  .rows{margin-top:10px;}
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--tint-soft);
    border-radius:14px;
    padding:8px 12px;
  }
  .row + .row{margin-top:8px;}
  .row img{
    width:48px;
    height:48px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#d5ded9;
    flex:0 0 48px;
  }
  .rtext{min-width:0;flex:1;}
  .rname{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rtime{
    margin-top:2px;
    font-size:12px;
    color:var(--muted);
  }
  .price{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="player">
      <div class="top">
        <img class="art" src="https://loremflickr.com/132/132/product?lock=2680" width="132" height="132" alt="Cover art for The Wednesday Drop episode, a flat lay of the week's featured goods">
        <div class="info">
          <div class="eyebrow">Now playing</div>
          <h1 class="title">The Wednesday Drop</h1>
          <div class="meta">Episode 118<br><strong>Dana Whitlock</strong></div>
        </div>
      </div>

      <div class="bar"><span></span></div>
      <div class="times">
        <span>12:04</span>
        <span>38:20</span>
      </div>

      <div class="controls">
        <div class="speed">1.2&times;</div>
        <div class="transport">
          <span class="step">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 10 12l8 6z" fill="currentColor" stroke="none"/>
              <path d="M6 6v12"/>
            </svg>
          </span>
          <span class="play">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="7" y="5" width="3.6" height="14" rx="1"/>
              <rect x="13.4" y="5" width="3.6" height="14" rx="1"/>
            </svg>
          </span>
          <span class="step">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 6l8 6-8 6z" fill="currentColor" stroke="none"/>
              <path d="M18 6v12"/>
            </svg>
          </span>
        </div>
        <div class="save">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4h12v16l-6-4.5L6 20z"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="sec">
      <h2>Featured in this episode</h2>
      <span>3 items</span>
    </div>

    <div class="rows">
      <div class="row">
        <img src="https://loremflickr.com/48/48/sneakers?lock=2681" width="48" height="48" alt="Cloudline trail running shoe in gray and orange">
        <div class="rtext">
          <div class="rname">Cloudline Trail Runner</div>
          <div class="rtime">Mentioned at 06:12</div>
        </div>
        <div class="price">$128.00</div>
      </div>
      <div class="row">
        <img src="https://loremflickr.com/48/48/furniture?lock=2682" width="48" height="48" alt="Ashgrove oak side table with a round top">
        <div class="rtext">
          <div class="rname">Ashgrove Oak Side Table</div>
          <div class="rtime">Mentioned at 18:40</div>
        </div>
        <div class="price">$245.00</div>
      </div>
      <div class="row">
        <img src="https://loremflickr.com/48/48/fashion?lock=2683" width="48" height="48" alt="Halden wool overshirt folded on a shelf">
        <div class="rtext">
          <div class="rname">Halden Wool Overshirt</div>
          <div class="rtime">Mentioned at 27:05</div>
        </div>
        <div class="price">$89.00</div>
      </div>
    </div>

  </div>
</body>
</html>
