<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfare Atlas — Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#eceae5;
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:36px 32px;
    background:#eceae5;
  }
  .card{
    width:100%;
    background:#ffffff;
    border-radius:14px;
  }
  .hero{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    background:#cfd6d8;
    border-radius:14px 14px 0 0;
  }
  .body{
    padding:20px;
  }
  .ident{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mono{
    width:60px;
    height:60px;
    flex:none;
    border-radius:14px;
    background:rgba(8,145,178,0.14);
    color:#0b7c94;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .who{min-width:0;}
  .name{
    font-size:21px;
    font-weight:700;
    color:#15191b;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .role{
    margin-top:4px;
    font-size:14px;
    color:#5f6b6f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .counts{
    margin-top:14px;
    font-size:14px;
    color:#5f6b6f;
  }
  .counts b{
    color:#15191b;
    font-weight:600;
  }
  .toggle{
    margin-top:16px;
    width:100%;
    box-sizing:border-box;
    border-radius:14px;
    background:#0b7c94;
    color:#ffffff;
    padding:14px 16px;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }
  .toggle svg{display:block;}
  .status{
    margin-top:14px;
    border-radius:14px;
    background:rgba(8,145,178,0.12);
    padding:14px 16px;
  }
  .status .line{
    font-size:15px;
    color:#0a5f72;
    line-height:1.45;
  }
  .status .sub{
    margin-top:6px;
    font-size:13px;
    color:#4d7b87;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/326/150/cityscape?lock=1603" width="326" height="150" alt="Rooftops and river view of Lisbon from a hillside lookout">
      <div class="body">
        <div class="ident">
          <div class="mono">DM</div>
          <div class="who">
            <div class="name">Delia Moreau</div>
            <div class="role">Local guide &middot; Lisbon, Portugal</div>
          </div>
        </div>
        <div class="counts"><b>18</b> guides &middot; <b>4,210</b> followers</div>
        <div class="toggle">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3.5 9.5L7 13L14.5 5.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Following
        </div>
        <div class="status">
          <div class="line">Alerts on for new stays and route updates in Lisbon.</div>
          <div class="sub">Following since June 2024 &middot; Next guide March 12</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
