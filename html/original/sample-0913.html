<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Leaderboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e6e6e9;
      color: #202027;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 18px;
      background: #f2f2f5;
    }

    .leaderboard {
      width: 100%;
      padding: 20px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 28, 40, 0.09);
    }

    .heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: #6d3fd1;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .course {
      margin: 5px 0 0;
      color: #666570;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
    }

    .period {
      flex: 0 0 auto;
      margin: 3px 0 0;
      color: #74727c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
    }

    .rank-summary {
      margin-top: 16px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #f1ebff;
      border-radius: 14px;
    }

    .summary-label {
      display: block;
      color: #585460;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
    }

    .summary-rank {
      display: block;
      margin-top: 1px;
      color: #5c2dbb;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 700;
    }

    .summary-next {
      max-width: 130px;
      color: #585460;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 400;
      text-align: right;
    }

    .summary-next strong {
      color: #322f38;
      font-weight: 700;
    }

    .list-heading {
      margin: 18px 0 7px;
      display: grid;
      grid-template-columns: 28px 42px minmax(0, 1fr) auto;
      align-items: center;
      color: #85838c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .list-heading .score-label {
      grid-column: 4;
      text-align: right;
    }

    .rank-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rank-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: 28px 42px minmax(0, 1fr) auto;
      align-items: center;
      border-top: 1px solid #ecebf0;
    }

    .rank-row.current {
      margin: 0 -8px;
      padding: 0 8px;
      background: #f7f3ff;
      border-top-color: #e3d7ff;
    }

    .rank {
      color: #67646e;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
    }

    .monogram {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e7ec;
      border-radius: 14px;
      color: #4e4b55;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .current .monogram {
      background: #6d3fd1;
      color: #ffffff;
    }

    .name-wrap {
      min-width: 0;
      padding-right: 10px;
    }

    .name {
      display: block;
      overflow: hidden;
      color: #29272e;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .you {
      margin-left: 5px;
      color: #6d3fd1;
      font-size: 12px;
      font-weight: 700;
    }

    .score {
      color: #343139;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <div class="heading-row">
        <div>
          <h1 id="leaderboard-title">Weekly leaderboard</h1>
          <p class="course">Spanish Foundations</p>
        </div>
        <p class="period">Mar 3–9</p>
      </div>

      <div class="rank-summary">
        <div>
          <span class="summary-label">Your rank</span>
          <span class="summary-rank">#4</span>
        </div>
        <div class="summary-next"><strong>320 XP</strong> needed to move into third</div>
      </div>

      <div class="list-heading" aria-hidden="true">
        <span>Rank</span>
        <span class="score-label">Score</span>
      </div>

      <ol class="rank-list" aria-label="Learner rankings">
        <li class="rank-row">
          <span class="rank">1</span>
          <span class="monogram" aria-hidden="true">MV</span>
          <span class="name-wrap"><span class="name">Mara Venn</span></span>
          <span class="score">2,840 XP</span>
        </li>
        <li class="rank-row">
          <span class="rank">2</span>
          <span class="monogram" aria-hidden="true">ER</span>
          <span class="name-wrap"><span class="name">Ellis Rowe</span></span>
          <span class="score">2,510 XP</span>
        </li>
        <li class="rank-row">
          <span class="rank">3</span>
          <span class="monogram" aria-hidden="true">ND</span>
          <span class="name-wrap"><span class="name">Nolan Dune</span></span>
          <span class="score">2,280 XP</span>
        </li>
        <li class="rank-row current" aria-current="true">
          <span class="rank">4</span>
          <span class="monogram" aria-hidden="true">CS</span>
          <span class="name-wrap"><span class="name">Casey Stone <span class="you">You</span></span></span>
          <span class="score">1,960 XP</span>
        </li>
        <li class="rank-row">
          <span class="rank">5</span>
          <span class="monogram" aria-hidden="true">AL</span>
          <span class="name-wrap"><span class="name">Arden Lake</span></span>
          <span class="score">1,775 XP</span>
        </li>
      </ol>
    </section>
  </div>
</body>
</html>
