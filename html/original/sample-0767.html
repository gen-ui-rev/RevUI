<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Trip Widget</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e8e5e4;
      color: #252122;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f3f1f0;
    }

    .trip-widget {
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d9d3d2;
      border-radius: 10px;
    }

    .widget-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow,
    .countdown,
    .detail-label {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: #6d6566;
    }

    .countdown {
      color: #b73e60;
      white-space: nowrap;
    }

    h1 {
      margin: 11px 0 0;
      color: #b73e60;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .trip-date {
      margin: 3px 0 0;
      color: #514a4b;
      font-size: 14px;
      line-height: 1.45;
    }

    .trip-details {
      margin-top: 12px;
      border-top: 1px solid #e2dddc;
      border-bottom: 1px solid #e2dddc;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 8px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px solid #e2dddc;
    }

    .detail-group {
      min-width: 0;
    }

    .detail-group:last-child {
      text-align: right;
    }

    .detail-label {
      display: block;
      color: #8a8182;
    }

    .detail-value {
      display: block;
      margin-top: 1px;
      color: #2d292a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="trip-widget" aria-labelledby="trip-destination">
      <header class="widget-heading">
        <span class="eyebrow">Next trip</span>
        <span class="countdown">In 12 days</span>
      </header>

      <h1 id="trip-destination">Lisbon</h1>
      <p class="trip-date">May 18–22, 2026</p>

      <section class="trip-details" aria-label="Trip details">
        <div class="detail-row">
          <div class="detail-group">
            <span class="detail-label">Departure</span>
            <span class="detail-value">JFK · 8:40 PM</span>
          </div>
          <div class="detail-group">
            <span class="detail-label">Flight</span>
            <span class="detail-value">PV 218</span>
          </div>
        </div>

        <div class="detail-row">
          <div class="detail-group">
            <span class="detail-label">Stay</span>
            <span class="detail-value">Ribeira House</span>
          </div>
          <div class="detail-group">
            <span class="detail-label">Length</span>
            <span class="detail-value">4 nights</span>
          </div>
        </div>
      </section>
    </article>
  </div>
</body>
</html>
