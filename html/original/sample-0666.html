<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinpost Achievement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e4;
      color: #242629;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 34px 20px;
      background: #f2f3f4;
    }

    .achievement-card {
      width: 100%;
      padding: 28px 24px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(27, 31, 35, 0.09);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #9a6500;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-mark {
      width: 96px;
      margin: 0 auto 20px;
      color: #c47b00;
    }

    .badge-mark svg {
      display: block;
      width: 96px;
      height: 110px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 10px auto 0;
      max-width: 270px;
      color: #62676d;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .milestone {
      margin-top: 24px;
      padding: 16px;
      text-align: left;
      background: #fff8e8;
      border-left: 4px solid #d68a00;
      border-radius: 6px;
    }

    .milestone-label {
      margin: 0 0 5px;
      color: #78520b;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .milestone-value {
      margin: 0;
      color: #292a2c;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }

    .earned-date {
      margin: 18px 0 0;
      color: #7b8086;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="achievement-card" aria-labelledby="achievement-title">
      <p class="eyebrow">Achievement earned</p>

      <div class="badge-mark" aria-hidden="true">
        <svg viewBox="0 0 96 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M25 67L18 103L48 88L78 103L71 67" fill="#F4C65D" stroke="#B36F00" stroke-width="4" stroke-linejoin="round"/>
          <path d="M48 4L58.7 10.2L71 10.3L77.2 21L87.8 27.2L87.9 39.5L94 50.2L87.8 60.9L87.7 73.2L77 79.4L70.8 90.1L58.5 90.2L47.8 96.3L37.1 90.1L24.8 90L18.6 79.3L8 73.1L7.9 60.8L1.8 50.1L8 39.4L8.1 27.1L18.8 20.9L25 10.2L37.3 10.1L48 4Z" fill="#E7A827" stroke="#B36F00" stroke-width="4" stroke-linejoin="round"/>
          <path d="M48 27L54.2 39.5L68 41.5L58 51.2L60.4 65L48 58.5L35.6 65L38 51.2L28 41.5L41.8 39.5L48 27Z" fill="#FFF7DF" stroke="#9D6200" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="achievement-title">Community Guide</h1>
      <p class="description">You helped members find useful answers across Kinpost conversations.</p>

      <div class="milestone">
        <p class="milestone-label">Milestone completed</p>
        <p class="milestone-value">100 replies marked as helpful</p>
      </div>

      <p class="earned-date">Earned May 18, 2025</p>
    </section>
  </div>
</body>
</html>
