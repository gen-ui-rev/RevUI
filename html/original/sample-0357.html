<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Taskloom Account</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e6;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f6;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #dedfe2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: #252628;
      font-size: 17px;
      font-weight: 650;
      line-height: 28px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      color: #e85d18;
    }

    .help-link {
      color: #5c6066;
      font-size: 14px;
      font-weight: 500;
      line-height: 28px;
      text-decoration: none;
    }

    main {
      flex: 1;
      padding: 16px 16px 12px;
    }

    .intro h1 {
      margin: 0;
      color: #1f2022;
      font-size: 28px;
      font-weight: 700;
      line-height: 34px;
      letter-spacing: -0.45px;
    }

    .intro p {
      margin: 5px 0 0;
      color: #666a70;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .social-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .social-button {
      min-width: 0;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #303236;
      background: #ffffff;
      border: 1px solid #cfd2d6;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      white-space: nowrap;
    }

    .social-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: #7a7e84;
      font-size: 12px;
      line-height: 20px;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      background: #d8dade;
      content: "";
    }

    .signup-card {
      padding: 14px;
      background: #ffffff;
      border: 1px solid #e1e2e4;
      border-radius: 4px;
      box-shadow: 0 3px 12px rgba(24, 29, 35, 0.08);
    }

    .form-fields {
      display: grid;
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: #3b3d40;
      font-size: 14px;
      font-weight: 600;
      line-height: 19px;
    }

    .control {
      width: 100%;
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #bfc3c8;
      border-radius: 4px;
    }

    .control:focus-within {
      border-color: #e85d18;
      outline: 2px solid rgba(232, 93, 24, 0.14);
    }

    .control input {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 11px;
      color: #25272a;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 14px;
      line-height: 20px;
    }

    .password-control input {
      padding-right: 4px;
    }

    .visibility-button {
      width: 42px;
      height: 40px;
      padding: 10px;
      flex: 0 0 auto;
      color: #666b71;
      background: transparent;
      border: 0;
    }

    .visibility-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .criteria {
      display: grid;
      gap: 3px;
      margin-top: 8px;
    }

    .criterion {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #5d6268;
      font-size: 12px;
      line-height: 18px;
    }

    .criterion svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      color: #e85d18;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 12px;
      color: #55595f;
      font-size: 13px;
      line-height: 20px;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin: 2px 0 0;
      flex: 0 0 auto;
      border-radius: 4px;
      accent-color: #e85d18;
    }

    .terms a {
      color: #c84c10;
      font-weight: 600;
      text-decoration: none;
    }

    .primary-button {
      width: 100%;
      margin-top: 12px;
      padding: 11px 16px;
      color: #ffffff;
      background: #e85d18;
      border: 1px solid #e85d18;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .signin {
      margin: 12px 0 0;
      color: #64686e;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
    }

    .signin a {
      color: #c84c10;
      font-weight: 650;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <nav class="topbar" aria-label="Account navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="2" y="2" width="24" height="24" rx="4" fill="currentColor"></rect>
          <path d="M8 9.5h12M8 14h8M8 18.5h10" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
        <span>Taskloom</span>
      </div>
      <a class="help-link" href="#">Help</a>
    </nav>

    <main>
      <header class="intro">
        <h1>Create your account</h1>
        <p>Keep team notes, decisions, and weekly plans in one shared place.</p>
      </header>

      <section class="social-methods" aria-label="Social signup options">
        <button class="social-button" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true">
            <circle cx="9" cy="9" r="7" fill="none" stroke="#4e555d" stroke-width="1.6"></circle>
            <path d="M5.5 9.2 8 11.7l4.8-5.2" fill="none" stroke="#e85d18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span>Cedar ID</span>
        </button>
        <button class="social-button" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true">
            <rect x="2.5" y="3" width="13" height="11.5" rx="2" fill="none" stroke="#4e555d" stroke-width="1.5"></rect>
            <path d="M6 14.5v-2.2c0-1.2 1-2.2 2.2-2.2h1.6c1.2 0 2.2 1 2.2 2.2v2.2M9 7.7a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="none" stroke="#e85d18" stroke-width="1.4"></path>
          </svg>
          <span>Work SSO</span>
        </button>
      </section>

      <div class="divider"><span>or use email</span></div>

      <form class="signup-card">
        <div class="form-fields">
          <div class="field">
            <label for="full-name">Full name</label>
            <div class="control">
              <input id="full-name" name="full-name" type="text" value="Riley Bennett" autocomplete="name">
            </div>
          </div>

          <div class="field">
            <label for="work-email">Work email</label>
            <div class="control">
              <input id="work-email" name="work-email" type="email" value="riley@amberfield.example" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control password-control">
              <input id="password" name="password" type="password" value="MapleDesk27" autocomplete="new-password">
              <button class="visibility-button" type="button" aria-label="Show password">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M2.2 10s2.9-4.5 7.8-4.5 7.8 4.5 7.8 4.5-2.9 4.5-7.8 4.5S2.2 10 2.2 10Z" fill="none" stroke="currentColor" stroke-width="1.5"></path>
                  <circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
                </svg>
              </button>
            </div>
            <div class="criteria" aria-label="Password requirements">
              <div class="criterion">
                <svg viewBox="0 0 14 14" aria-hidden="true">
                  <circle cx="7" cy="7" r="6" fill="currentColor"></circle>
                  <path d="m4.2 7.1 1.7 1.7 3.8-3.7" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>At least 10 characters</span>
              </div>
              <div class="criterion">
                <svg viewBox="0 0 14 14" aria-hidden="true">
                  <circle cx="7" cy="7" r="6" fill="currentColor"></circle>
                  <path d="m4.2 7.1 1.7 1.7 3.8-3.7" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>One uppercase letter</span>
              </div>
              <div class="criterion">
                <svg viewBox="0 0 14 14" aria-hidden="true">
                  <circle cx="7" cy="7" r="6" fill="currentColor"></circle>
                  <path d="m4.2 7.1 1.7 1.7 3.8-3.7" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>One number</span>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="control password-control">
              <input id="confirm-password" name="confirm-password" type="password" value="MapleDesk27" autocomplete="new-password">
              <button class="visibility-button" type="button" aria-label="Show confirmed password">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M2.2 10s2.9-4.5 7.8-4.5 7.8 4.5 7.8 4.5-2.9 4.5-7.8 4.5S2.2 10 2.2 10Z" fill="none" stroke="currentColor" stroke-width="1.5"></path>
                  <circle cx="10" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" checked>
          <span>I agree to the <a href="#">Terms of Service</a> and acknowledge the <a href="#">Privacy Policy</a>.</span>
        </label>

        <button class="primary-button" type="submit">Create account</button>
      </form>

      <p class="signin">Already have an account? <a href="#">Sign in</a></p>
    </main>
  </div>
</body>
</html>
