<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reorder Study Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #202333;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 32px 22px;
      background: #f3f4f6;
    }

    .reorder-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e2e4ea;
      border-radius: 0;
      box-shadow: 0 10px 28px rgba(28, 31, 46, 0.09);
    }

    .service-label {
      margin: 0 0 7px;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #191b28;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .instruction {
      margin: 9px 0 21px;
      color: #626779;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    .lesson-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .lesson-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 12px;
      padding: 13px 12px;
      border: 1px solid #dfe1e8;
      background: #ffffff;
    }

    .lesson-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #c9c7f3;
      color: #4f46e5;
    }

    .lesson-icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lesson-copy {
      min-width: 0;
    }

    .lesson-title {
      margin: 0;
      overflow: hidden;
      color: #252836;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-meta {
      margin: 3px 0 0;
      color: #777c8d;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }

    .drag-handle {
      width: 28px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #595d6d;
      cursor: grab;
    }

    .drag-handle svg {
      width: 18px;
      height: 24px;
      fill: currentColor;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 1px solid #4338ca;
      border-radius: 0;
      background: #4f46e5;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="reorder-card" aria-labelledby="reorder-title">
      <p class="service-label">Phrasewell course</p>
      <h1 id="reorder-title">Reorder your study plan</h1>
      <p class="instruction">Drag each handle to set the order you want to study these lessons.</p>

      <ol class="lesson-list">
        <li class="lesson-row">
          <div class="lesson-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 5.5h11a3 3 0 0 1 3 3v7H8a4 4 0 0 0-4 4z"></path>
              <path d="M4 5.5v14"></path>
              <path d="M18 8.5h2v9H8a4 4 0 0 0-4 2"></path>
            </svg>
          </div>
          <div class="lesson-copy">
            <p class="lesson-title">Everyday introductions</p>
            <p class="lesson-meta">Lesson 1 · 12 minutes</p>
          </div>
          <button class="drag-handle" type="button" aria-label="Drag Everyday introductions">
            <svg viewBox="0 0 18 24" aria-hidden="true">
              <circle cx="6" cy="6" r="1.4"></circle>
              <circle cx="12" cy="6" r="1.4"></circle>
              <circle cx="6" cy="12" r="1.4"></circle>
              <circle cx="12" cy="12" r="1.4"></circle>
              <circle cx="6" cy="18" r="1.4"></circle>
              <circle cx="12" cy="18" r="1.4"></circle>
            </svg>
          </button>
        </li>

        <li class="lesson-row">
          <div class="lesson-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 6.5h14v9H9l-4 3z"></path>
              <path d="M8.5 10h7"></path>
              <path d="M8.5 12.5h4.5"></path>
            </svg>
          </div>
          <div class="lesson-copy">
            <p class="lesson-title">Asking clear questions</p>
            <p class="lesson-meta">Lesson 2 · 16 minutes</p>
          </div>
          <button class="drag-handle" type="button" aria-label="Drag Asking clear questions">
            <svg viewBox="0 0 18 24" aria-hidden="true">
              <circle cx="6" cy="6" r="1.4"></circle>
              <circle cx="12" cy="6" r="1.4"></circle>
              <circle cx="6" cy="12" r="1.4"></circle>
              <circle cx="12" cy="12" r="1.4"></circle>
              <circle cx="6" cy="18" r="1.4"></circle>
              <circle cx="12" cy="18" r="1.4"></circle>
            </svg>
          </button>
        </li>

        <li class="lesson-row">
          <div class="lesson-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7 5v14"></path>
              <path d="M17 5v14"></path>
              <path d="M7 8h10"></path>
              <path d="M7 16h10"></path>
              <path d="M10 8v8"></path>
              <path d="M14 8v8"></path>
            </svg>
          </div>
          <div class="lesson-copy">
            <p class="lesson-title">Ordering at a café</p>
            <p class="lesson-meta">Lesson 3 · 14 minutes</p>
          </div>
          <button class="drag-handle" type="button" aria-label="Drag Ordering at a café">
            <svg viewBox="0 0 18 24" aria-hidden="true">
              <circle cx="6" cy="6" r="1.4"></circle>
              <circle cx="12" cy="6" r="1.4"></circle>
              <circle cx="6" cy="12" r="1.4"></circle>
              <circle cx="12" cy="12" r="1.4"></circle>
              <circle cx="6" cy="18" r="1.4"></circle>
              <circle cx="12" cy="18" r="1.4"></circle>
            </svg>
          </button>
        </li>
      </ol>

      <button class="save-button" type="button">Save lesson order</button>
    </section>
  </div>
</body>
</html>
