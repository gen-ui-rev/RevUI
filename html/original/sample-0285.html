<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Havenrow</title>
<style>
  :root{
    --ground:#EDEBE8;
    --taupe:#9C8D7B;
    --taupe-deep:#7E7161;
    --ink:#2E2A26;
    --muted:#7C766E;
    --faint:#A9A29A;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#5C5750;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .screen{
    width:390px;
    height:844px;
    background:var(--ground);
    display:flex;
    flex-direction:column;
    color:var(--ink);
  }
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 40px;
  }
  .card{
    width:100%;
    background:#FFFFFF;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(60,52,44,0.08);
    padding:36px 28px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .mark{
    width:76px;
    height:76px;
    border-radius:14px;
    background:var(--taupe);
  }
  .brand{
    margin:22px 0 0;
    font-size:26px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .tagline{
    margin:8px 0 0;
    font-size:14px;
    color:var(--muted);
  }
  .rule{
    width:44px;
    height:2px;
    background:var(--taupe);
    margin:24px 0 0;
    border-radius:14px;
  }
  .boot{
    width:100%;
    margin-top:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .track{
    width:196px;
    height:4px;
    border-radius:14px;
    background:#DFDAD3;
  }
  .fill{
    width:68%;
    height:100%;
    border-radius:14px;
    background:var(--taupe-deep);
  }
  .boot-label{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
  }
  .footer{
    padding:0 40px 26px;
    text-align:center;
  }
  .footer p{
    margin:0;
    font-size:12px;
    color:var(--faint);
    line-height:1.6;
  }
  .tabbar{
    display:flex;
    background:#FFFFFF;
    border-top:1px solid #E1DDD7;
    padding:12px 12px 20px;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:#BDB6AD;
  }
  .tab span{
    font-size:12px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="stage">
      <div class="card">
        <div class="mark"></div>
        <h1 class="brand">Havenrow</h1>
        <p class="tagline">Banking and investing, one balance</p>
        <div class="rule"></div>
        <div class="boot">
          <div class="track"><div class="fill"></div></div>
          <p class="boot-label">Restoring your accounts</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>Version 5.2.0 (build 1148)</p>
      <p>Deposits held at Cardell Trust, Member FDIC</p>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg>
        <span>Spending</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 9.5 12l3.5 3.5L20 8"/><path d="M15.5 8H20v4.5"/></svg>
        <span>Invest</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5"/></svg>
        <span>Profile</span>
      </div>
    </nav>
  </div>
</body>
</html>
