<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a LumaTone account</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e8e5;
      color: #20211f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      grid-template-columns: 44px 1fr 52px;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #ddddda;
      background: #ffffff;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #252624;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      display: block;
    }

    .help-link {
      border: 0;
      padding: 10px 4px;
      background: transparent;
      color: #4b4d49;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-align: right;
      cursor: pointer;
    }

    .intro {
      padding: 17px 20px 18px;
      background: #242522;
      color: #ffffff;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #c9cac5;
      font-size: 12px;
      line-height: 17px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 35px;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .intro p {
      margin: 6px 0 0;
      max-width: 340px;
      color: #dedfda;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .media-image {
      width: 390px;
      height: 96px;
      object-fit: cover;
      display: block;
      background: #b7b7b2;
    }

    main {
      padding: 0 20px 15px;
    }

    .account-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #d9dad6;
    }

    .tab {
      min-height: 42px;
      padding: 11px 8px 9px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #737570;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      border-bottom-color: #242522;
      color: #242522;
    }

    .signup-form {
      margin-top: 13px;
    }

    .field {
      margin: 0;
    }

    .field + .field {
      margin-top: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #333431;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 43px;
      padding: 10px 12px;
      border: 1px solid #b9bbb6;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
      color: #20211f;
      font-size: 15px;
      line-height: 21px;
      font-weight: 400;
    }

    input::placeholder {
      color: #888a85;
      opacity: 1;
    }

    .password-input {
      padding-right: 52px;
    }

    .show-button {
      position: absolute;
      top: 0;
      right: 3px;
      height: 43px;
      padding: 0 9px;
      border: 0;
      background: transparent;
      color: #4f514d;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      margin: 5px 0 0;
      color: #696b66;
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
    }

    .primary-button {
      width: 100%;
      height: 46px;
      margin-top: 13px;
      padding: 0 16px;
      border: 1px solid #242522;
      border-radius: 6px;
      background: #242522;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .divider {
      height: 20px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #747671;
      font-size: 12px;
      line-height: 17px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #ddddda;
    }

    .social-list {
      display: grid;
      gap: 8px;
    }

    .social-button {
      width: 100%;
      height: 44px;
      padding: 0 42px;
      position: relative;
      border: 1px solid #b9bbb6;
      border-radius: 6px;
      background: #ffffff;
      color: #292a28;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .social-button svg {
      position: absolute;
      left: 14px;
      top: 11px;
      width: 20px;
      height: 20px;
      color: #343532;
    }

    .legal {
      margin: 11px 2px 0;
      color: #686a65;
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
      text-align: center;
    }

    .legal a {
      color: #31322f;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M14.5 4.5L8 11l6.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="brand" aria-label="LumaTone">
        <svg class="brand-mark" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="18" height="18" rx="6" fill="#242522"/>
          <path d="M6.5 12.5V9.5M10 15V7M13.5 13.5v-5M17 12v-2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>LumaTone</span>
      </div>

      <button class="help-link" type="button">Help</button>
    </header>

    <section class="intro" aria-labelledby="signup-heading">
      <p class="eyebrow">New listener account</p>
      <h1 id="signup-heading">Create your account</h1>
      <p>An account keeps subscriptions and playback history synced across devices.</p>
    </section>

    <img
      class="media-image"
      src="https://loremflickr.com/390/96/concert?lock=11010"
      width="390"
      height="96"
      alt="Concert audience facing a lit stage"
    >

    <main>
      <nav class="account-tabs" aria-label="Account access">
        <button class="tab active" type="button" aria-current="page">Create account</button>
        <button class="tab" type="button">Sign in</button>
      </nav>

      <form class="signup-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password">
            <button class="show-button" type="button">Show</button>
          </div>
          <p class="hint">Use at least 8 characters with a number.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input class="password-input" id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Enter your password again">
            <button class="show-button" type="button">Show</button>
          </div>
        </div>

        <button class="primary-button" type="submit">Create account</button>
      </form>

      <div class="divider">Or</div>

      <div class="social-list" aria-label="Social signup options">
        <button class="social-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="10" cy="7.2" r="2.2" fill="currentColor"/>
            <path d="M5.8 14.8c.8-2.2 2.2-3.2 4.2-3.2s3.4 1 4.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Continue with Northstar
        </button>

        <button class="social-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 2.5l2 4.1 4.5.7-3.2 3.2.7 4.5-4-2.1L6 15l.7-4.5-3.2-3.2 4.5-.7L10 2.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
          Continue with Cedar
        </button>
      </div>

      <p class="legal">
        By creating an account, you agree to the <a href="#">Terms of Use</a> and acknowledge the <a href="#">Privacy Policy</a>.
      </p>
    </main>
  </div>
</body>
</html>
