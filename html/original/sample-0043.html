<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Vocabulary Set</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e6e9;
      color: #29262b;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 20px;
      background: #f3f2f4;
    }

    .delete-card {
      width: 100%;
      padding: 26px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(40, 32, 42, 0.09);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d92f78;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #29262b;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
    }

    .item-name {
      margin: 10px 0 0;
      color: #514b53;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .warning {
      margin: 18px 0 0;
      color: #69636b;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.65;
    }

    .actions {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }

    .delete-button {
      border: 1px solid #d92f78;
      background: #d92f78;
      color: #ffffff;
    }

    .cancel-button {
      border: 1px solid #d8d4da;
      background: #ffffff;
      color: #4a454c;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="delete-card" aria-labelledby="delete-title">
      <p class="eyebrow">Permanent action</p>
      <h1 id="delete-title">Delete this vocabulary set?</h1>
      <p class="item-name">Travel Phrases · Spanish A2</p>
      <p class="warning">
        This will permanently remove all 42 terms and your review progress. The set will not be moved to Archive and cannot be restored.
      </p>
      <div class="actions">
        <button class="delete-button" type="button">Delete permanently</button>
        <button class="cancel-button" type="button">Cancel</button>
      </div>
    </section>
  </div>
</body>
</html>
