<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driftstay Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d8d5;
      color: #292a29;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f5f4f0;
      border: 1px solid #c7c7c2;
    }

    .top-bar {
      padding: 14px 16px 0;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      width: 100%;
    }

    .progress-segment {
      height: 3px;
      background: #d4d4cf;
      border-radius: 4px;
    }

    .progress-segment.complete {
      background: #555754;
    }

    .progress-segment.current {
      position: relative;
      background: #d4d4cf;
    }

    .progress-segment.current::before {
      content: "";
      display: block;
      width: 58%;
      height: 100%;
      background: #555754;
      border-radius: 4px;
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 15px;
    }

    .publisher {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .publisher-mark {
      width: 36px;
      height: 36px;
      margin-right: 10px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #aeadA8;
      border-radius: 4px;
      color: #4e504d;
      font-size: 14px;
      font-weight: 700;
    }

    .publisher-copy {
      min-width: 0;
    }

    .publisher-name {
      margin: 0;
      font-size: 15px;
      line-height: 19px;
      font-weight: 700;
    }

    .publisher-meta {
      margin: 1px 0 0;
      color: #747570;
      font-size: 12px;
      line-height: 16px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #40413f;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .story {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 112px 24px 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: #666864;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: #777975;
    }

    h1 {
      max-width: 330px;
      margin: 0;
      color: #292a29;
      font-size: 43px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .description {
      max-width: 315px;
      margin: 24px 0 0;
      color: #5e605d;
      font-size: 16px;
      line-height: 25px;
    }

    .stay-detail {
      margin-top: auto;
      padding-top: 22px;
      border-top: 1px solid #cdcdc8;
    }

    .stay-label {
      margin: 0 0 7px;
      color: #777975;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stay-name {
      margin: 0;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
    }

    .stay-meta {
      margin: 4px 0 18px;
      color: #676965;
      font-size: 14px;
      line-height: 20px;
    }

    .primary-action {
      width: 100%;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #555754;
      border-radius: 4px;
      background: #555754;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      text-align: left;
    }

    .primary-action svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <div class="progress" aria-label="Story 3 of 4">
        <span class="progress-segment complete"></span>
        <span class="progress-segment complete"></span>
        <span class="progress-segment current"></span>
        <span class="progress-segment"></span>
      </div>

      <div class="navigation">
        <div class="publisher">
          <div class="publisher-mark" aria-hidden="true">D</div>
          <div class="publisher-copy">
            <p class="publisher-name">Driftstay Guides</p>
            <p class="publisher-meta">Bar Harbor, Maine · 3 of 4</p>
          </div>
        </div>

        <div class="nav-actions">
          <button class="icon-button" type="button" aria-label="More options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5" cy="12" r="1"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="19" cy="12" r="1"></circle>
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="Close story">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5l14 14"></path>
              <path d="M19 5L5 19"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="story">
      <section aria-labelledby="story-title">
        <p class="eyebrow">A quiet coast weekend</p>
        <h1 id="story-title">Wake up close to Acadia’s first trails.</h1>
        <p class="description">
          Stay two blocks from the harbor, then reach Cadillac Mountain before the morning crowds.
        </p>
      </section>

      <div class="stay-detail">
        <p class="stay-label">Featured stay</p>
        <p class="stay-name">Harbor Pine Guesthouse</p>
        <p class="stay-meta">May 16–18 · 2 guests · From $184 per night</p>
        <button class="primary-action" type="button">
          <span>View available rooms</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="M14 7l5 5-5 5"></path>
          </svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
