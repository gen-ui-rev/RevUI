<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Discussion Content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7eaee;
      color: #182130;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 26px 24px;
      background: #f4f5f7;
    }

    .report-card {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 14px;
    }

    .context {
      margin: 0 0 6px;
      color: #2864dc;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #172033;
      font-size: 22px;
      font-weight: 700;
      line-height: 30px;
    }

    .intro {
      margin: 6px 0 0;
      color: #5b6472;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .boundary-note {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      padding: 12px;
      color: #344053;
      background: #f4f8ff;
      border: 1px solid #cddcff;
      border-radius: 14px;
      font-size: 14px;
      line-height: 19px;
    }

    .boundary-note svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-top: 1px;
      color: #2864dc;
    }

    fieldset {
      min-width: 0;
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      padding: 0;
      color: #263143;
      font-size: 14px;
      font-weight: 700;
      line-height: 19px;
    }

    .reason-list {
      margin-top: 10px;
      border: 1px solid #d9dee7;
      border-radius: 14px;
    }

    .reason {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      color: #263143;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .reason + .reason {
      border-top: 1px solid #e2e6ec;
    }

    .reason.selected {
      color: #174da8;
      background: #f1f6ff;
      font-weight: 700;
    }

    .reason input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 1.5px solid #98a2b2;
      border-radius: 50%;
      background: #ffffff;
    }

    .selected .radio {
      border: 5px solid #2864dc;
    }

    .continue-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 18px;
      color: #ffffff;
      background: #2864dc;
      border: 1px solid #2864dc;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      line-height: 22px;
      cursor: pointer;
    }

    .cancel-button {
      display: block;
      margin: 10px auto 0;
      padding: 0;
      color: #5b6472;
      background: transparent;
      border: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <form class="report-card">
      <p class="context">CloverSpeak discussion</p>
      <h1>Why are you reporting this reply?</h1>
      <p class="intro">Choose the reason that best helps the review team understand the issue.</p>

      <div class="boundary-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 10.5V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="7.4" r="1" fill="currentColor"/>
        </svg>
        <span>Reporting sends this reply for review. It does not block the learner.</span>
      </div>

      <fieldset>
        <legend>Select one reason</legend>
        <div class="reason-list">
          <label class="reason">
            <input type="radio" name="reason">
            <span class="radio" aria-hidden="true"></span>
            <span>Spam or misleading promotion</span>
          </label>
          <label class="reason selected">
            <input type="radio" name="reason" checked>
            <span class="radio" aria-hidden="true"></span>
            <span>Harassment or hateful language</span>
          </label>
          <label class="reason">
            <input type="radio" name="reason">
            <span class="radio" aria-hidden="true"></span>
            <span>Sexual or unsafe content</span>
          </label>
        </div>
      </fieldset>

      <button class="continue-button" type="submit">Continue</button>
      <button class="cancel-button" type="button">Cancel</button>
    </form>
  </div>
</body>
</html>
