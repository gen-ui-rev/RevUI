<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0a8f63;
    --accent-soft:rgba(10,143,99,.10);
    --accent-mid:rgba(10,143,99,.18);
    --ink:#15201b;
    --muted:#6b7a72;
  }
  html,body{margin:0;}
  body{
    font-family:'Nunito Sans', system-ui, sans-serif;
    background:#eceeec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:32px 0;
    background:#eceeec;
  }
  .sheet{
    width:326px;
    margin:0 auto;
    background:#ffffff;
    border-radius:10px;
    padding:20px;
    box-sizing:border-box;
  }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .art{
    width:56px;
    height:56px;
    border-radius:10px;
    background:var(--accent-mid);
    flex:none;
  }
  .item-text{min-width:0;}
  .title{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .primary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    height:48px;
    margin-top:20px;
    font-size:15px;
    font-weight:700;
  }
  .primary svg{display:block;}
  .rows{margin-top:8px;}
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--accent-soft);
    border-radius:10px;
    height:52px;
    padding:0 16px;
    box-sizing:border-box;
    margin-top:8px;
  }
  .row-label{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-value{
    font-size:13px;
    color:var(--muted);
    flex:none;
  }
  .cancel{
    text-align:center;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    padding-top:18px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="item">
        <div class="art"></div>
        <div class="item-text">
          <div class="title">The Long Way Around</div>
          <div class="meta">Field Notes · Ep. 112 · 48 min</div>
        </div>
      </div>

      <div class="primary">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1.6c0-.8.9-1.3 1.6-.9l9 6.4c.6.4.6 1.4 0 1.8l-9 6.4c-.7.4-1.6-.1-1.6-.9V1.6z" fill="#fff"/></svg>
        Play from start
      </div>

      <div class="rows">
        <div class="row">
          <div class="row-label">Download for offline</div>
          <div class="row-value">62 MB</div>
        </div>
        <div class="row">
          <div class="row-label">Add to queue</div>
          <div class="row-value">4 waiting</div>
        </div>
        <div class="row">
          <div class="row-label">Mark as played</div>
          <div class="row-value">31 min left</div>
        </div>
      </div>

      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
