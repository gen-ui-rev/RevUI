<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>March Budget Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ebe7;
      color: #17201c;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f4f5f2;
    }

    .budget-widget {
      width: 100%;
      aspect-ratio: 2 / 1;
      padding: 17px;
      border: 1px solid #cbd2cc;
      border-radius: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .widget-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .widget-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
    }

    .period {
      flex: none;
      color: #68716b;
      font-size: 12px;
      line-height: 1.4;
    }

    .balance {
      margin: 0;
      color: #087a55;
      font-size: 36px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .balance-label {
      margin: 4px 0 0;
      color: #59635d;
      font-size: 14px;
      line-height: 1.3;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 14px;
      background: #e1e6e2;
    }

    .progress-fill {
      width: 68%;
      height: 6px;
      border-radius: 14px;
      background: #087a55;
    }

    .progress-meta {
      margin-top: 7px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #59635d;
      font-size: 12px;
      line-height: 1.35;
    }

    .progress-meta span:last-child {
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="budget-widget" aria-labelledby="budget-title">
      <header class="widget-header">
        <h1 class="widget-title" id="budget-title">Left to spend in March</h1>
        <span class="period">12 days left</span>
      </header>

      <div>
        <p class="balance">$1,016</p>
        <p class="balance-label">Available in your monthly plan</p>
      </div>

      <div>
        <div class="progress-track" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
          <div class="progress-fill"></div>
        </div>
        <div class="progress-meta">
          <span>$2,184 spent</span>
          <span>$3,200 plan</span>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
