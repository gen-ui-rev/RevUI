<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Larkspur — Daily Practice Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6d28d9;
    --violet-soft:#efe9fb;
    --ink:#1c1a22;
    --muted:#6f6b7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eeeef1;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:36px 35px;
  }
  .widget{
    width:100%;
    background:#fff;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(24,20,40,.09);
    padding:24px 22px;
  }
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    line-height:1.25;
  }
  .head p{
    margin:3px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  .day{
    font-size:13px;
    font-weight:600;
    color:var(--violet);
    background:var(--violet-soft);
    border-radius:14px;
    padding:5px 10px;
    white-space:nowrap;
  }
  .ring-wrap{
    display:flex;
    justify-content:center;
    padding:20px 0 4px;
  }
  .ring{
    position:relative;
    width:146px;
    height:146px;
  }
  .ring svg{display:block;}
  .ring-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ring-text .big{
    font-size:38px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.5px;
  }
  .ring-text .sub{
    margin-top:5px;
    font-size:13px;
    color:var(--muted);
  }
  .goal{
    margin:14px 0 0;
    text-align:center;
    font-size:14px;
    color:var(--muted);
  }
  .rule{
    height:1px;
    background:#eceaf0;
    margin:20px 0 16px;
  }
  .tutor{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mono{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:14px;
    background:var(--violet);
    color:#fff;
    font-size:15px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.5px;
  }
  .tutor .name{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tutor .when{
    margin-top:2px;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tutor .info{min-width:0;}
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="head">
        <div>
          <h1>Daily practice</h1>
          <p>Spanish &middot; Level B1</p>
        </div>
        <span class="day">Day 12</span>
      </div>

      <div class="ring-wrap">
        <div class="ring">
          <svg width="146" height="146" viewBox="0 0 146 146" aria-hidden="true">
            <circle cx="73" cy="73" r="60" fill="none" stroke="#eceaf0" stroke-width="11"></circle>
            <circle cx="73" cy="73" r="60" fill="none" stroke="#6d28d9" stroke-width="11"
                    stroke-linecap="round" stroke-dasharray="263.9 377" transform="rotate(-90 73 73)"></circle>
          </svg>
          <div class="ring-text">
            <span class="big">14</span>
            <span class="sub">of 20 minutes</span>
          </div>
        </div>
      </div>

      <p class="goal">6 minutes left to keep the streak</p>

      <div class="rule"></div>

      <div class="tutor">
        <div class="mono">MV</div>
        <div class="info">
          <div class="name">Marisol Vega</div>
          <div class="when">Speaking session today, 4:30 PM</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
