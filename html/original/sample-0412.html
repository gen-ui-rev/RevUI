<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stridewell Location Permission</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #dde0da;
      color: #171a16;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #eff1ed;
    }

    .permission-card {
      width: 100%;
      padding: 28px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(25, 31, 22, 0.10);
    }

    .service-name {
      margin: 0 0 24px;
      color: #62685f;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .permission-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: 22px;
      border-radius: 4px;
      background: #c7f43d;
      color: #1c2512;
    }

    .permission-icon svg {
      width: 26px;
      height: 26px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 0 0 16px;
      color: #4f554c;
      font-size: 15px;
      line-height: 1.55;
    }

    .privacy-note {
      margin: 0 0 26px;
      color: #72776f;
      font-size: 13px;
      line-height: 1.45;
    }

    .primary-action,
    .secondary-action {
      width: 100%;
      border-radius: 4px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-action {
      padding: 13px 16px;
      border: 1px solid #add82d;
      background: #c7f43d;
      color: #17200e;
    }

    .secondary-action {
      margin-top: 10px;
      padding: 11px 16px;
      border: 0;
      background: transparent;
      color: #555b52;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission-card" aria-labelledby="permission-title">
      <p class="service-name">Stridewell</p>

      <div class="permission-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 21C12 21 18.5 15.2 18.5 9.5C18.5 5.91 15.59 3 12 3C8.41 3 5.5 5.91 5.5 9.5C5.5 15.2 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="9.5" r="2.25" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </div>

      <h1 id="permission-title">Allow location access</h1>
      <p class="description">
        Stridewell uses your location to map distance and pace during outdoor workouts.
      </p>
      <p class="privacy-note">
        Your location is collected only while a workout is active. You can change this permission in system settings.
      </p>

      <button class="primary-action" type="button">Continue</button>
      <button class="secondary-action" type="button">Not now</button>
    </section>
  </div>
</body>
</html>
