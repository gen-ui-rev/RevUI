<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketwell — Delivery Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1f5fff;
    --ink:#14161a;
    --muted:#6b7280;
    --rule:#e6e7ea;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#d8d9dd;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:44px 0;
    background:#d8d9dd;
  }
  .banner{
    width:342px;
    margin:0 auto;
    background:#ffffff;
    border-radius:14px;
    padding:16px;
  }
  .head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .brand svg{display:block;}
  .brand span{
    font-size:12px;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--muted);
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stamp{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .main{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .main img{
    display:block;
    width:56px;
    height:56px;
    border-radius:14px;
    object-fit:cover;
    background:#c9ccd2;
    flex:none;
  }
  .status{min-width:0;flex:1;}
  .status h1{
    margin:0;
    font-size:20px;
    font-weight:600;
    line-height:1.25;
    color:var(--accent);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .eta{
    text-align:right;
    flex:none;
  }
  .eta strong{
    display:block;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .eta span{
    display:block;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .track{
    margin-top:16px;
    height:6px;
    border-radius:3px;
    background:#e9ebef;
    overflow:hidden;
  }
  .track i{
    display:block;
    width:68%;
    height:100%;
    border-radius:3px;
    background:var(--accent);
  }
  .legend{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
  }
  .legend b{
    font-weight:500;
    color:var(--ink);
  }
  .courier{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .mono{
    width:34px;
    height:34px;
    border-radius:14px;
    background:#eaf0ff;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .who{min-width:0;flex:1;}
  .who strong{
    display:block;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .who span{
    display:block;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .drop{
    font-size:12px;
    color:var(--muted);
    text-align:right;
    white-space:nowrap;
    flex:none;
  }
  .drop b{
    display:block;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 3h1.9l1.7 7.2h6.1l1.3-5.1H5.2" stroke="#1f5fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6.9" cy="13" r="1.15" fill="#1f5fff"/>
            <circle cx="11.9" cy="13" r="1.15" fill="#1f5fff"/>
          </svg>
          <span>Marketwell Delivery</span>
        </div>
        <div class="stamp">Updated 3:12 PM</div>
      </div>

      <div class="main">
        <img src="https://loremflickr.com/56/56/sneakers?lock=1321" width="56" height="56" alt="Ridgeline trail running shoes in the arriving order">
        <div class="status">
          <h1>Out for delivery</h1>
          <p>Order #48211 &middot; 2 items</p>
        </div>
        <div class="eta">
          <strong>4:40 PM</strong>
          <span>Arrival</span>
        </div>
      </div>

      <div class="track"><i></i></div>
      <div class="legend">
        <div><b>Stop 4</b> of 6 on this route</div>
        <div>1.2 mi away</div>
      </div>

      <div class="courier">
        <div class="mono">DW</div>
        <div class="who">
          <strong>Dana Whitfield</strong>
          <span>Van 12 &middot; Leaves package at door</span>
        </div>
        <div class="drop">
          <b>418 Larkspur Ave</b>
          Apt 3R
        </div>
      </div>
    </div>
  </div>
</body>
</html>
