<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Episode</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e6e8;
      color: #242124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 36px 20px;
      background: #f5f3f4;
    }

    .share-sheet {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9d3d6;
      border-radius: 4px;
    }

    .sheet-header {
      padding: 23px 54px 22px 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #bc2865;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #bc2865;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
    }

    .helper {
      margin: 8px 0 0;
      color: #676066;
      font-size: 14px;
      line-height: 1.45;
    }

    .close-button {
      position: absolute;
      top: 17px;
      right: 17px;
      display: grid;
      width: 32px;
      height: 32px;
      padding: 0;
      place-items: center;
      color: #5d565b;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .close-button svg {
      width: 18px;
      height: 18px;
    }

    .episode-preview {
      display: flex;
      gap: 14px;
      align-items: center;
      margin: 0 22px 22px;
    }

    .cover {
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      background: #efd2de;
      border: 1px solid #e5bdce;
      border-radius: 4px;
    }

    .episode-copy {
      min-width: 0;
    }

    .episode-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }

    .episode-meta {
      margin: 4px 0 0;
      color: #746d72;
      font-size: 13px;
      line-height: 1.35;
    }

    .share-options {
      border-top: 1px solid #ddd7da;
    }

    .share-option {
      display: flex;
      width: 100%;
      padding: 14px 18px 14px 22px;
      align-items: center;
      gap: 14px;
      text-align: left;
      color: #242124;
      background: #ffffff;
      border: 0;
      border-bottom: 1px solid #e6e1e3;
      cursor: pointer;
    }

    .share-option:last-child {
      border-bottom: 0;
      border-radius: 0 0 4px 4px;
    }

    .option-copy {
      min-width: 0;
      flex: 1;
    }

    .option-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }

    .option-detail {
      display: block;
      margin-top: 2px;
      color: #746d72;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
    }

    .chevron {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: #9a9297;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="share-sheet" role="dialog" aria-labelledby="share-title" aria-describedby="share-help">
      <button class="close-button" type="button" aria-label="Close share sheet">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>

      <header class="sheet-header">
        <p class="eyebrow">Share from Morrow Play</p>
        <h1 id="share-title">Share this episode</h1>
        <p class="helper" id="share-help">Choose a person or a channel.</p>
      </header>

      <div class="episode-preview">
        <div class="cover" aria-hidden="true"></div>
        <div class="episode-copy">
          <p class="episode-title">The Quiet Work of Memory</p>
          <p class="episode-meta">Field Notes with Nora Vale · 38 min</p>
        </div>
      </div>

      <div class="share-options" aria-label="Share options">
        <button class="share-option" type="button">
          <span class="option-copy">
            <span class="option-title">Morrow Play listener</span>
            <span class="option-detail">Find someone by name</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="share-option" type="button">
          <span class="option-copy">
            <span class="option-title">Messages</span>
            <span class="option-detail">Send with your messaging app</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="share-option" type="button">
          <span class="option-copy">
            <span class="option-title">Copy link</span>
            <span class="option-detail">Share it anywhere</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
