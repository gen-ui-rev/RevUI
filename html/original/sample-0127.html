<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Location</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedad6;
      color: #2f2a27;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfaf8;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 17px 20px;
    }

    .back-button {
      width: 40px;
      padding: 3px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border: 0;
      background: transparent;
      cursor: default;
    }

    .back-button svg {
      width: 24px;
      height: 24px;
    }

    .top-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
    }

    main {
      padding: 14px 20px 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #78695f;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      max-width: 340px;
      margin: 7px 0 0;
      color: #665e58;
      font-size: 14px;
      line-height: 21px;
    }

    .address-search {
      margin-top: 20px;
      padding: 8px 8px 8px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 10px;
      background: rgba(137, 120, 108, 0.13);
    }

    .search-symbol {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #78695f;
    }

    .address-search input {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #2f2a27;
      font-size: 14px;
      line-height: 22px;
    }

    .address-search input::placeholder {
      color: #756d67;
      opacity: 1;
    }

    .search-submit {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: #89786c;
      color: #ffffff;
      cursor: default;
    }

    .search-submit svg {
      width: 18px;
      height: 18px;
    }

    .search-note {
      margin: 8px 2px 0;
      color: #786f69;
      font-size: 12px;
      line-height: 18px;
    }

    .section {
      margin-top: 24px;
    }

    .saved-section {
      margin-top: 26px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
    }

    .location-action {
      width: 100%;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      border: 0;
      border-radius: 10px;
      background: rgba(137, 120, 108, 0.16);
      cursor: default;
    }

    .location-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #89786c;
      color: #ffffff;
    }

    .location-icon svg {
      width: 19px;
      height: 19px;
    }

    .action-copy {
      min-width: 0;
    }

    .action-title {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .action-detail {
      display: block;
      color: #6e655f;
      font-size: 12px;
      line-height: 18px;
    }

    .saved-list {
      display: grid;
      gap: 8px;
    }

    .saved-row {
      width: 100%;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      border: 0;
      border-radius: 10px;
      background: rgba(137, 120, 108, 0.09);
      cursor: default;
    }

    .saved-copy {
      min-width: 0;
    }

    .saved-name {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .saved-address {
      display: block;
      max-width: 260px;
      color: #6b635d;
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selected-state {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #75655b;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .selected-state svg {
      width: 15px;
      height: 15px;
    }

    .tab-bar {
      margin-top: auto;
      padding: 10px 12px 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: rgba(137, 120, 108, 0.08);
    }

    .tab {
      padding: 10px 3px;
      border: 0;
      background: transparent;
      color: #69615c;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      cursor: default;
    }

    .tab.active {
      border-radius: 10px;
      background: rgba(137, 120, 108, 0.18);
      color: #4e433d;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="top-title">Listening location</p>
      <span aria-hidden="true"></span>
    </header>

    <main>
      <p class="eyebrow">Morrowcast account</p>
      <h1>Choose your location</h1>
      <p class="intro">Your address sets the regional audio catalog and nearby live session recommendations.</p>

      <form class="address-search" action="#">
        <svg class="search-symbol" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input type="text" aria-label="Search for an address" placeholder="Enter a street address or ZIP code">
        <button class="search-submit" type="submit" aria-label="Search address">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12H19M14 7L19 12L14 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="search-note">A full street address gives the most accurate results.</p>

      <section class="section" aria-labelledby="current-location-title">
        <h2 class="section-title" id="current-location-title">Current location</h2>
        <button class="location-action" type="button">
          <span class="location-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-title">Use my current location</span>
            <span class="action-detail">Allow location access for this visit</span>
          </span>
        </button>
      </section>

      <section class="saved-section" aria-labelledby="saved-locations-title">
        <h2 class="section-title" id="saved-locations-title">Saved locations</h2>
        <div class="saved-list">
          <button class="saved-row" type="button">
            <span class="saved-copy">
              <span class="saved-name">Home</span>
              <span class="saved-address">1847 Alder Lane, Portland, OR 97205</span>
            </span>
            <span class="selected-state">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="#89786c"/>
                <path d="M4.7 8.1L7 10.3L11.5 5.8" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Selected
            </span>
          </button>

          <button class="saved-row" type="button">
            <span class="saved-copy">
              <span class="saved-name">Studio</span>
              <span class="saved-address">620 Mercer Street, Seattle, WA 98109</span>
            </span>
          </button>

          <button class="saved-row" type="button">
            <span class="saved-copy">
              <span class="saved-name">Weekend place</span>
              <span class="saved-address">92 Harbor Road, Astoria, OR 97103</span>
            </span>
          </button>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab" type="button">Listen</button>
      <button class="tab" type="button">Discover</button>
      <button class="tab" type="button">Library</button>
      <button class="tab active" type="button" aria-current="page">Account</button>
    </nav>
  </div>
</body>
</html>
