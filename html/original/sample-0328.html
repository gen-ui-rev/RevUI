<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe4e2;
      color: #18302d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 20px;
      background: #f3f5f4;
    }

    .selector {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cdd7d4;
    }

    .selector-header {
      padding: 18px 20px 17px;
      border-bottom: 1px solid #d8e0de;
      border-left: 4px solid #087f75;
    }

    .context {
      margin: 0 0 5px;
      color: #087f75;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 6px;
      color: #18302d;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.3;
    }

    .description {
      margin: 0;
      color: #60716d;
      font-size: 14px;
      line-height: 1.5;
    }

    .list-heading {
      margin: 0;
      padding: 13px 16px 10px;
      color: #52635f;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .community-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #d8e0de;
    }

    .community-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 16px;
      border-bottom: 1px solid #d8e0de;
      background: #ffffff;
    }

    .community-row.selected {
      padding-left: 13px;
      border-left: 3px solid #087f75;
      background: #edf8f6;
    }

    .community-row img {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: block;
      object-fit: cover;
      background-color: #cbd7d4;
    }

    .community-copy {
      min-width: 0;
      flex: 1;
    }

    .community-name {
      display: block;
      color: #18302d;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .community-meta {
      display: block;
      margin-top: 2px;
      color: #697975;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .choice {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      color: #8b9996;
    }

    .selected .choice {
      color: #087f75;
    }

    .selector-footer {
      padding: 16px;
    }

    .confirm-button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #087f75;
      border-radius: 0;
      background: #087f75;
      color: #ffffff;
      font: 500 14px/1.4 'Poppins', system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="selector" aria-labelledby="community-title">
      <header class="selector-header">
        <p class="context">Gatherline post audience</p>
        <h1 id="community-title">Choose a community</h1>
        <p class="description">Your meetup post will appear in one community. Select where it belongs.</p>
      </header>

      <p class="list-heading">Available communities</p>

      <ul class="community-list" aria-label="Community choices">
        <li class="community-row selected" aria-current="true">
          <img src="https://loremflickr.com/48/48/cafe?lock=4830" width="48" height="48" alt="A café table representing Weekend Table">
          <div class="community-copy">
            <span class="community-name">Weekend Table</span>
            <span class="community-meta">Café meetups · 1,284 members</span>
          </div>
          <svg class="choice" viewBox="0 0 22 22" aria-label="Selected" role="img">
            <circle cx="11" cy="11" r="9.5" fill="currentColor"/>
            <path d="M6.8 11.2 9.5 14l5.8-6.1" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </li>

        <li class="community-row">
          <img src="https://loremflickr.com/48/48/street?lock=4831" width="48" height="48" alt="A city street representing City Walk Club">
          <div class="community-copy">
            <span class="community-name">City Walk Club</span>
            <span class="community-meta">Neighborhood walks · 862 members</span>
          </div>
          <svg class="choice" viewBox="0 0 22 22" aria-label="Not selected" role="img">
            <circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </li>

        <li class="community-row">
          <img src="https://loremflickr.com/48/48/party?lock=4832" width="48" height="48" alt="A social gathering representing After Hours Studio">
          <div class="community-copy">
            <span class="community-name">After Hours Studio</span>
            <span class="community-meta">Creative socials · 546 members</span>
          </div>
          <svg class="choice" viewBox="0 0 22 22" aria-label="Not selected" role="img">
            <circle cx="11" cy="11" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </li>
      </ul>

      <footer class="selector-footer">
        <button class="confirm-button" type="button">Confirm community</button>
      </footer>
    </section>
  </div>
</body>
</html>
