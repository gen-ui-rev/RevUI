<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markup — Return Request</title>
<style>
  html, body { margin:0; }
  body {
    background:#d8d8d6;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen {
    width:390px;
    box-sizing:border-box;
    background:#ffffff;
    padding:28px 28px;
  }
  .eyebrow {
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#8a8f95;
    margin:0 0 8px;
  }
  h1 {
    font-size:20px;
    font-weight:600;
    color:#1b1e21;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .sub {
    font-size:13px;
    color:#7c8187;
    margin:0 0 18px;
  }
  .canvas {
    display:block;
    width:100%;
    height:auto;
    background:#ececeb;
  }
  .toolrule {
    border-top:1px solid #dcdcda;
    margin-top:16px;
  }
  .tools {
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #dcdcda;
  }
  .tool {
    width:46px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5c6167;
    background:none;
    border:0;
    padding:0;
  }
  .tool.on {
    background:#3d4248;
    color:#ffffff;
  }
  .sect {
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:18px 0 6px;
  }
  .sect h2 {
    font-size:13px;
    font-weight:600;
    color:#1b1e21;
    margin:0;
  }
  .sect span {
    font-size:12px;
    color:#8a8f95;
  }
  .row {
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 0;
    border-top:1px solid #ebebe9;
  }
  .num {
    width:20px;
    height:20px;
    flex:0 0 20px;
    background:#3d4248;
    color:#fff;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row p {
    margin:0;
    font-size:14px;
    color:#22262a;
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .time {
    font-size:12px;
    color:#8a8f95;
    flex:0 0 auto;
  }
  .send {
    display:block;
    width:100%;
    margin-top:20px;
    padding:13px 10px;
    background:#3d4248;
    color:#ffffff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    border:0;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Return request</p>
    <h1>Mark the damage</h1>
    <p class="sub">Order #A-40821 &middot; Kettle, 1.7 L &middot; Photo 2 of 3</p>

    <svg class="canvas" viewBox="0 0 334 150" role="img" aria-label="Shipping box photo with three annotation marks">
      <rect x="0" y="0" width="334" height="150" fill="#ececeb"/>
      <g fill="none" stroke="#c6c6c3" stroke-width="2" stroke-linejoin="round">
        <path d="M96 56 H214 V132 H96 Z"/>
        <path d="M96 56 L134 30 H252 L214 56"/>
        <path d="M214 56 L252 30 V106 L214 132"/>
        <path d="M155 56 L193 30"/>
      </g>
      <g fill="none" stroke="#3d4248" stroke-width="2" stroke-linecap="round">
        <circle cx="243" cy="42" r="19"/>
        <path d="M132 48 C142 40 149 52 159 44 C167 38 172 50 181 43"/>
        <rect x="104" y="96" width="48" height="28"/>
      </g>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
        <rect x="262" y="14" width="18" height="18" fill="#3d4248"/>
        <text x="271" y="27" fill="#ffffff" text-anchor="middle">1</text>
        <rect x="118" y="22" width="18" height="18" fill="#3d4248"/>
        <text x="127" y="35" fill="#ffffff" text-anchor="middle">2</text>
        <rect x="82" y="88" width="18" height="18" fill="#3d4248"/>
        <text x="91" y="101" fill="#ffffff" text-anchor="middle">3</text>
      </g>
    </svg>

    <div class="toolrule"></div>
    <div class="tools">
      <button class="tool on" aria-label="Pen">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l1-4 9-9 3 3-9 9z"/><path d="M12.5 4.5l3 3"/></svg>
      </button>
      <button class="tool" aria-label="Arrow">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16L16 4"/><path d="M10 4h6v6"/></svg>
      </button>
      <button class="tool" aria-label="Rectangle">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="13" height="10"/></svg>
      </button>
      <button class="tool" aria-label="Ellipse">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/></svg>
      </button>
      <button class="tool" aria-label="Text">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5h12"/><path d="M10 5v11"/></svg>
      </button>
      <button class="tool" aria-label="Eraser">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 16H4l-1-3 8-8 4 4-5 5z"/><path d="M16 16h-8"/></svg>
      </button>
    </div>

    <div class="sect">
      <h2>Marks</h2>
      <span>3 of 6 used</span>
    </div>
    <div class="row">
      <span class="num">1</span>
      <p>Top right corner crushed</p>
      <span class="time">10:41 AM</span>
    </div>
    <div class="row">
      <span class="num">2</span>
      <p>Lid tape resealed</p>
      <span class="time">10:42 AM</span>
    </div>
    <div class="row">
      <span class="num">3</span>
      <p>Water stain on left panel</p>
      <span class="time">10:44 AM</span>
    </div>

    <button class="send">Attach 3 marks to return</button>
  </div>
</body>
</html>
