<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint progress — Draftline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e7e7e4;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #2b2b29;
  }
  .screen {
    width: 390px;
    padding: 28px;
    background: #e7e7e4;
  }
  .card {
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(30, 30, 28, 0.10);
    padding: 26px 24px 22px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a84;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
    margin: 0 0 2px;
  }
  .sub {
    font-size: 14px;
    color: #6f6f68;
    margin: 0;
  }
  .ringwrap {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 22px 0 24px;
  }
  .ring {
    position: relative;
    width: 132px;
    height: 132px;
    flex: none;
  }
  .ring svg { display: block; }
  .ring .val {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .pct {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    color: #2b2b29;
  }
  .pct span { font-size: 16px; }
  .pctlabel {
    font-size: 12px;
    color: #8a8a84;
    margin-top: 5px;
  }
  .facts { min-width: 0; }
  .fact + .fact { margin-top: 14px; }
  .fact .k {
    font-size: 12px;
    color: #8a8a84;
    margin: 0 0 2px;
  }
  .fact .v {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .steps {
    border-top: 1px solid #ebebe7;
    padding-top: 6px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
  }
  .step + .step { border-top: 1px solid #f2f2ee; }
  .step .mark { flex: none; display: block; }
  .step .name {
    font-size: 15px;
    flex: 1 1 auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .step .meta {
    flex: none;
    font-size: 13px;
    color: #8a8a84;
  }
  .step.now .name { font-weight: 600; }
  .step.now .meta { color: #4a4a45; font-weight: 600; }
  .step.todo .name { color: #8a8a84; }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Draftline · Sprint 14</p>
      <h1>Editor handoff</h1>
      <p class="sub">Closes Friday, March 21</p>

      <div class="ringwrap">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="54" fill="none" stroke="#ececE8" stroke-width="13"></circle>
            <circle cx="66" cy="66" r="54" fill="none" stroke="#4a4a45" stroke-width="13"
                    stroke-linecap="butt" stroke-dasharray="230.7 108.6"
                    transform="rotate(-90 66 66)"></circle>
          </svg>
          <div class="val">
            <div class="pct">68<span>%</span></div>
            <div class="pctlabel">17 of 25 tasks</div>
          </div>
        </div>
        <div class="facts">
          <div class="fact">
            <p class="k">Days left</p>
            <p class="v">4 of 14</p>
          </div>
          <div class="fact">
            <p class="k">Open review</p>
            <p class="v">3 documents</p>
          </div>
          <div class="fact">
            <p class="k">Owner</p>
            <p class="v">Marta Ellery</p>
          </div>
        </div>
      </div>

      <div class="steps">
        <div class="step done">
          <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7.5" fill="#4a4a45"></circle>
            <path d="M4.6 8.3l2.2 2.2 4.5-4.7" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="name">Outline approved</span>
          <span class="meta">Mar 6</span>
        </div>
        <div class="step now">
          <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7.5" fill="none" stroke="#4a4a45" stroke-width="1.6"></circle>
            <circle cx="8" cy="8" r="3.6" fill="#4a4a45"></circle>
          </svg>
          <span class="name">Drafting chapters</span>
          <span class="meta">In progress</span>
        </div>
        <div class="step todo">
          <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7.5" fill="none" stroke="#d5d5cf" stroke-width="1.6"></circle>
          </svg>
          <span class="name">Copy edit pass</span>
          <span class="meta">Mar 19</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
