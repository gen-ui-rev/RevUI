<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finding Available Stays</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7ea;
      color: #202024;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f3f3f5;
    }

    .loading-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 31, 35, 0.09);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d62f77;
      font-size: 12px;
      font-weight: 600;
      line-height: 17px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202024;
      font-size: 24px;
      font-weight: 600;
      line-height: 29px;
      letter-spacing: -0.02em;
    }

    .trip-details {
      margin: 10px 0 0;
      color: #66666d;
      font-size: 15px;
      font-weight: 400;
      line-height: 21px;
    }

    .destination-photo {
      width: 294px;
      height: 96px;
      margin-top: 20px;
      border-radius: 14px;
      object-fit: cover;
      display: block;
      background: #dedee2;
    }

    .loading-state {
      margin-top: 22px;
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      display: block;
      margin: 0 auto;
    }

    .status {
      margin: 14px 0 0;
      color: #2d2d32;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }

    .supporting-copy {
      margin: 6px 0 0;
      color: #727279;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
    }

    .cancel-button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 16px;
      border: 1px solid #dedee3;
      border-radius: 14px;
      background: #ffffff;
      color: #3d3d43;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="loading-card" aria-busy="true" aria-live="polite">
      <p class="eyebrow">Clovertrail stays</p>
      <h1>Finding stays in Santa Barbara</h1>
      <p class="trip-details">May 18–21 · 2 guests · 1 room</p>

      <img
        class="destination-photo"
        src="https://loremflickr.com/294/96/cityscape?lock=8450"
        width="294"
        height="96"
        alt="Coastal cityscape in Santa Barbara"
      >

      <div class="loading-state">
        <svg class="spinner" viewBox="0 0 44 44" role="img" aria-label="Searching">
          <circle cx="22" cy="22" r="18" fill="none" stroke="#f4d4e2" stroke-width="5"></circle>
          <path d="M22 4 A18 18 0 0 1 39.1 16.4" fill="none" stroke="#d62f77" stroke-width="5" stroke-linecap="round"></path>
        </svg>
        <p class="status">Checking live availability</p>
        <p class="supporting-copy">Comparing current rates and room options.</p>
      </div>

      <button class="cancel-button" type="button">Cancel search</button>
    </main>
  </div>
</body>
</html>
