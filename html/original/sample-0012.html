<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Savings Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9ece8;
      color: #172019;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f6f7f5;
    }

    .empty-state {
      width: 100%;
      padding: 32px 28px 28px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dce2dc;
      border-radius: 14px;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #17874d;
      background: #edf8f1;
      border: 1px solid #cce8d5;
      border-radius: 14px;
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      margin: 12px auto 24px;
      max-width: 260px;
      color: #657068;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
    }

    .primary-action {
      width: 100%;
      padding: 14px 18px;
      display: block;
      color: #ffffff;
      background: #17874d;
      border: 1px solid #17874d;
      border-radius: 14px;
      font: 600 15px/1.4 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 15.5H33C35.7614 15.5 38 17.7386 38 20.5V35.5C38 38.2614 35.7614 40.5 33 40.5H15C12.2386 40.5 10 38.2614 10 35.5V20.5C10 17.7386 12.2386 15.5 15 15.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 15.5V12.5C17 9.73858 19.2386 7.5 22 7.5H26C28.7614 7.5 31 9.73858 31 12.5V15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 26H29" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M24 21V31" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M14.5 36.5H17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M30.5 36.5H33.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="empty-title">No savings goals yet</h1>
      <p>Create a goal to track your progress and set money aside at your own pace.</p>
      <a class="primary-action" href="#" aria-label="Create your first savings goal">Create a savings goal</a>
    </section>
  </div>
</body>
</html>
