<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slateway Guided Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfdd;
      color: #242826;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 19px 22px 17px;
      border-bottom: 1px solid #e3e5e2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      color: #404743;
    }

    .brand-name {
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      white-space: nowrap;
    }

    .skip {
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: #5d635f;
      font-size: 14px;
      line-height: 22px;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 18px 24px 10px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #626864;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 4px;
      margin-top: 9px;
      background: #e5e7e4;
      border-radius: 14px;
    }

    .progress-fill {
      width: 50%;
      height: 4px;
      background: #454c48;
      border-radius: 14px;
    }

    .visual {
      height: 236px;
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #eff1ee;
    }

    .diagram {
      position: relative;
      width: 268px;
      height: 150px;
    }

    .note-shape {
      position: absolute;
      left: 4px;
      top: 19px;
      width: 106px;
      height: 112px;
      border: 2px solid #858b87;
      border-radius: 14px;
      background: #f8f9f7;
    }

    .note-line {
      position: absolute;
      left: 22px;
      height: 7px;
      border-radius: 7px;
      background: #c5c9c6;
    }

    .note-line.one {
      top: 27px;
      width: 61px;
    }

    .note-line.two {
      top: 49px;
      width: 47px;
    }

    .note-line.three {
      top: 71px;
      width: 66px;
    }

    .flow-line {
      position: absolute;
      left: 109px;
      top: 74px;
      width: 51px;
      height: 2px;
      background: #858b87;
    }

    .flow-arrow {
      position: absolute;
      left: 148px;
      top: 68px;
      width: 13px;
      height: 13px;
      border-top: 2px solid #858b87;
      border-right: 2px solid #858b87;
      transform: rotate(45deg);
    }

    .task-shape {
      position: absolute;
      right: 4px;
      top: 34px;
      width: 100px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #454c48;
    }

    .check-icon {
      width: 36px;
      height: 36px;
      color: #ffffff;
    }

    .copy {
      margin-top: 22px;
    }

    h1 {
      margin: 0;
      color: #222624;
      font-size: 28px;
      line-height: 35px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 9px 0 0;
      color: #5d635f;
      font-size: 15px;
      line-height: 23px;
      font-weight: 400;
    }

    .steps {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid #e3e5e2;
    }

    .steps h2 {
      margin: 0 0 7px;
      color: #363b38;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    .step-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      border-bottom: 1px solid #eceeeb;
    }

    .step-row:last-child {
      border-bottom: 0;
    }

    .step-number {
      color: #777d79;
      font-size: 13px;
      line-height: 20px;
      font-weight: 700;
    }

    .step-text {
      color: #414642;
      font-size: 14px;
      line-height: 21px;
      font-weight: 600;
    }

    .tour-nav {
      padding: 14px 24px 22px;
      border-top: 1px solid #e3e5e2;
      background: #ffffff;
    }

    .page-label {
      margin-bottom: 12px;
      color: #6a706c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 10px;
    }

    .button {
      height: 50px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    .button-secondary {
      border: 1px solid #cfd3cf;
      background: #ffffff;
      color: #444a46;
    }

    .button-primary {
      border: 1px solid #454c48;
      background: #454c48;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 4.75h10.5A3.5 3.5 0 0 1 19 8.25v8.5a2.5 2.5 0 0 1-2.5 2.5H8.25A3.25 3.25 0 0 1 5 16V4.75Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8.5 9h7M8.5 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Slateway Guide</span>
      </div>
      <button class="skip" type="button">Skip tour</button>
    </header>

    <main>
      <div class="progress-meta">
        <span>Step 2 of 4</span>
        <span>Create tasks</span>
      </div>
      <div class="progress-track" aria-label="Tour progress: 50 percent">
        <div class="progress-fill"></div>
      </div>

      <div class="visual" aria-hidden="true">
        <div class="diagram">
          <div class="note-shape">
            <div class="note-line one"></div>
            <div class="note-line two"></div>
            <div class="note-line three"></div>
          </div>
          <div class="flow-line"></div>
          <div class="flow-arrow"></div>
          <div class="task-shape">
            <svg class="check-icon" viewBox="0 0 36 36" fill="none">
              <path d="M9 18.5l6 6L27 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <section class="copy" aria-labelledby="tour-title">
        <h1 id="tour-title">Turn discussion into action</h1>
        <p class="description">Convert any note into an assigned task without leaving the conversation.</p>
      </section>

      <section class="steps" aria-labelledby="steps-title">
        <h2 id="steps-title">In this step</h2>
        <div class="step-row">
          <span class="step-number">01</span>
          <span class="step-text">Select a decision or next step.</span>
        </div>
        <div class="step-row">
          <span class="step-number">02</span>
          <span class="step-text">Choose Make task from the note tools.</span>
        </div>
        <div class="step-row">
          <span class="step-number">03</span>
          <span class="step-text">Add an owner and due date.</span>
        </div>
      </section>
    </main>

    <nav class="tour-nav" aria-label="Tour navigation">
      <div class="page-label">Next: Set a shared due date</div>
      <div class="actions">
        <button class="button button-secondary" type="button">Previous</button>
        <button class="button button-primary" type="button">Next step</button>
      </div>
    </nav>
  </div>
</body>
</html>
