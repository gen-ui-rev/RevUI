<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commonfold Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d4ce;
      color: #292724;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f8f6f2;
    }

    .top-bar {
      min-height: 68px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d8d3cb;
    }

    .brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sign-in {
      color: #665f56;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    main {
      flex: 1;
      padding: 24px;
    }

    .hero {
      margin: 0;
    }

    .hero-image {
      width: 342px;
      height: 280px;
      object-fit: cover;
      display: block;
      background: #c9c3bb;
      border-radius: 6px;
    }

    .eyebrow {
      margin: 28px 0 10px;
      color: #766e64;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 330px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .description {
      max-width: 328px;
      margin: 18px 0 0;
      color: #615d57;
      font-size: 17px;
      line-height: 1.5;
    }

    .primary-action {
      width: 100%;
      margin-top: 28px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 6px;
      background: #756d63;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
    }

    .primary-action svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .footer {
      padding: 17px 24px 20px;
      border-top: 1px solid #d8d3cb;
      color: #77716a;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .footer a {
      color: #5e5851;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <div class="brand">Commonfold</div>
      <a class="sign-in" href="#" aria-label="Sign in to Commonfold">Sign in</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="welcome-heading">
        <img
          class="hero-image"
          src="https://loremflickr.com/342/280/friends?lock=12030"
          width="342"
          height="280"
          alt="Friends gathering together at a neighborhood table"
        >
        <p class="eyebrow">Your local circle</p>
        <h1 id="welcome-heading">Find the people who make a place feel familiar.</h1>
        <p class="description">
          Join nearby conversations, make plans, and keep up with the communities you care about.
        </p>
        <a class="primary-action" href="#">
          Get started
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </section>
    </main>

    <footer class="footer">
      By continuing, you agree to the <a href="#">Terms</a> and acknowledge the <a href="#">Privacy Policy</a>.
    </footer>
  </div>
</body>
</html>
