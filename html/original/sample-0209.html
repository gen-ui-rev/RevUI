<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Permission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e6e8;
      color: #2e292d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 38px 36px;
      background: #fbf9fa;
    }

    .permission {
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #825b76;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .icon-block {
      width: 82px;
      margin: 0 auto 24px;
      padding: 19px;
      border-radius: 14px;
      background: #eadde6;
      color: #825b76;
    }

    .icon-block svg {
      display: block;
      width: 44px;
      height: 44px;
    }

    h1 {
      margin: 0;
      color: #2e292d;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 12px 0 0;
      color: #625a60;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
    }

    .privacy {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0 0;
      text-align: left;
      color: #6e666b;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    .privacy svg {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      flex: 0 0 auto;
      color: #825b76;
    }

    .rule {
      width: 100%;
      height: 1px;
      margin: 24px 0;
      background: #ded8dc;
    }

    .primary-action {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 14px;
      background: #825b76;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-action {
      margin-top: 14px;
      padding: 4px 10px;
      border: 0;
      background: transparent;
      color: #625a60;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission" aria-labelledby="permission-title">
      <p class="eyebrow">Mallow Language</p>

      <div class="icon-block" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <rect x="17" y="5" width="14" height="25" rx="7" stroke="currentColor" stroke-width="3"/>
          <path d="M11 23.5C11 30.68 16.82 36.5 24 36.5C31.18 36.5 37 30.68 37 23.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M24 36.5V43" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <path d="M18.5 43H29.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="permission-title">Allow microphone access</h1>
      <p class="description">Your microphone lets Mallow Language hear your pronunciation during speaking exercises.</p>

      <p class="privacy">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5.5 8V6.5C5.5 4.01 7.51 2 10 2C12.49 2 14.5 4.01 14.5 6.5V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="3.5" y="8" width="13" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="10" cy="13" r="1.2" fill="currentColor"/>
        </svg>
        <span>Audio is used only while a speaking exercise is open. You can change this permission in device settings.</span>
      </p>

      <div class="rule" aria-hidden="true"></div>

      <button class="primary-action" type="button">Allow microphone</button>
      <button class="secondary-action" type="button">Not now</button>
    </section>
  </div>
</body>
</html>
