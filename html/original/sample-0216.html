<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamlet Travel Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8e4;
      color: #20211f;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #d8d7d2;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e7e5df;
      background: #ffffff;
    }

    .top-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .icon-button {
      width: 40px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .main {
      flex: 1;
      padding: 20px 22px 24px;
    }

    .quiz-meta {
      padding-bottom: 20px;
      border-bottom: 1px solid #e7e5df;
    }

    .meta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 11px;
    }

    .eyebrow {
      margin: 0;
      color: #686963;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-copy {
      margin: 0;
      color: #555650;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #ecebe6;
      border-radius: 10px;
    }

    .progress-fill {
      width: 60%;
      height: 8px;
      background: #f2c600;
      border-radius: 10px;
    }

    .question {
      padding-top: 25px;
    }

    .question-count {
      margin: 0 0 8px;
      color: #6a6b65;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
    }

    .question-title {
      margin: 0;
      max-width: 330px;
      font-size: 26px;
      line-height: 35px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .instruction {
      margin: 10px 0 19px;
      color: #666760;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
    }

    .answers {
      margin: 0;
      padding: 0;
      border: 0;
    }

    .answer {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 62px;
      padding: 15px 10px;
      border-top: 1px solid #e7e5df;
      cursor: pointer;
    }

    .answer:last-of-type {
      border-bottom: 1px solid #e7e5df;
    }

    .answer input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      border: 2px solid #aaa9a2;
      border-radius: 50%;
      background: #ffffff;
    }

    .radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
    }

    .answer input:checked + .radio {
      border-color: #d5ad00;
      background: #fff7cf;
    }

    .answer input:checked + .radio::after {
      background: #e0b700;
    }

    .answer-text {
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
    }

    .answer input:checked ~ .answer-text {
      font-weight: 600;
    }

    .submit-button {
      width: 100%;
      margin-top: 27px;
      padding: 14px 18px;
      border: 1px solid #d8ad00;
      border-radius: 10px;
      background: #f2c600;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-note {
      margin: 11px 0 0;
      color: #777871;
      text-align: center;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 8px 12px;
      border-top: 1px solid #e4e3dd;
      background: #ffffff;
    }

    .tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 4px 2px;
      color: #777871;
      text-decoration: none;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .tab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab.active {
      color: #24251f;
      font-weight: 600;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -11px;
      width: 34px;
      height: 4px;
      border-radius: 10px;
      background: #f2c600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <h1 class="top-title">Travel quiz</h1>
      <button class="icon-button" type="button" aria-label="Close quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </header>

    <main class="main">
      <section class="quiz-meta" aria-label="Quiz progress">
        <div class="meta-row">
          <p class="eyebrow">Airport codes</p>
          <p class="progress-copy">6 of 10</p>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6">
          <div class="progress-fill"></div>
        </div>
      </section>

      <section class="question" aria-labelledby="question-title">
        <p class="question-count">Question 6</p>
        <h2 class="question-title" id="question-title">Which airport code belongs to Lisbon’s main airport?</h2>
        <p class="instruction">Choose one answer.</p>

        <form>
          <fieldset class="answers" aria-label="Answer choices">
            <label class="answer">
              <input type="radio" name="airport-code" value="LSN">
              <span class="radio" aria-hidden="true"></span>
              <span class="answer-text">LSN</span>
            </label>

            <label class="answer">
              <input type="radio" name="airport-code" value="LIS" checked>
              <span class="radio" aria-hidden="true"></span>
              <span class="answer-text">LIS</span>
            </label>

            <label class="answer">
              <input type="radio" name="airport-code" value="LSP">
              <span class="radio" aria-hidden="true"></span>
              <span class="answer-text">LSP</span>
            </label>

            <label class="answer">
              <input type="radio" name="airport-code" value="LIB">
              <span class="radio" aria-hidden="true"></span>
              <span class="answer-text">LIB</span>
            </label>
          </fieldset>

          <button class="submit-button" type="submit">Check answer</button>
          <p class="submit-note">Your answer is saved after you check it.</p>
        </form>
      </section>
    </main>

    <nav class="tab-bar" aria-label="App navigation">
      <a class="tab" href="#" aria-label="Explore">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.2 16.2L21 21"></path>
        </svg>
        <span>Explore</span>
      </a>

      <a class="tab" href="#" aria-label="Trips">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.5h16v12H4z"></path>
          <path d="M8 7.5V5.8C8 4.8 8.8 4 9.8 4h4.4c1 0 1.8.8 1.8 1.8v1.7M4 12h16"></path>
        </svg>
        <span>Trips</span>
      </a>

      <a class="tab active" href="#" aria-current="page" aria-label="Quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3.5h10a2 2 0 0 1 2 2v15l-7-3-7 3v-15a2 2 0 0 1 2-2z"></path>
          <path d="M9.5 8.5a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.1.8-1.1 1.7"></path>
          <path d="M12 15h.01"></path>
        </svg>
        <span>Quiz</span>
      </a>

      <a class="tab" href="#" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5.5 20c.5-3.3 3-5.2 6.5-5.2s6 1.9 6.5 5.2"></path>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
