<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Episodes Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #172033;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 44px 28px;
      background: #f8fafc;
    }

    .empty-state {
      width: 100%;
    }

    .context {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .rule {
      width: 100%;
      margin: 14px 0 24px;
      border: 0;
      border-top: 1px solid #cbd5e1;
    }

    h1 {
      margin: 0;
      color: #1e293b;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 12px 0 0;
      color: #64748b;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
    }

    .hero {
      width: 334px;
      height: 140px;
      margin: 26px 0 0;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      background: #cbd5e1;
    }

    .primary-action {
      width: 100%;
      margin-top: 24px;
      padding: 14px 18px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #475569;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <p class="context">Northline · Saved episodes</p>
      <hr class="rule">
      <h1 id="empty-title">Your listening list is empty</h1>
      <p class="description">Save podcast episodes to keep them ready for your next commute or quiet hour.</p>
      <img
        class="hero"
        src="https://loremflickr.com/334/140/studio?lock=12270"
        width="334"
        height="140"
        alt="Podcast microphones arranged in a recording studio"
      >
      <button class="primary-action" type="button">Browse podcasts</button>
    </section>
  </div>
</body>
</html>
