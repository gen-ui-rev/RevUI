<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile — Thornfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1b5fd0;
    --ink:#15181d;
    --muted:#666e79;
    --rule:#e0e3e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e9e9e7;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:34px 26px;
  }
  .id{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .avatar{
    width:72px;
    height:72px;
    border-radius:10px;
    background:#c3d4ee;
    flex:none;
  }
  .name{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:25px;
    line-height:1.15;
    margin:0;
  }
  .handle{
    font-size:14px;
    color:var(--muted);
    margin:3px 0 0;
  }
  .bio{
    font-size:15px;
    line-height:1.5;
    margin:18px 0 0;
    color:#33383f;
  }
  .meta{
    font-size:13px;
    color:var(--muted);
    margin:10px 0 0;
  }
  .action{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:13px 16px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:600;
    justify-content:center;
  }
  .action svg{flex:none;}
  .since{
    font-size:13px;
    color:var(--muted);
    text-align:center;
    margin:10px 0 0;
  }
  hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:24px 0 0;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:16px 0;
    border-bottom:1px solid var(--rule);
  }
  .row .label{
    font-size:15px;
    font-weight:600;
  }
  .row .sub{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .switch{
    width:44px;
    height:26px;
    border-radius:13px;
    background:var(--accent);
    flex:none;
    position:relative;
  }
  .switch span{
    position:absolute;
    top:3px;
    left:21px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
  }
  .switch.off{background:#d3d7de;}
  .switch.off span{left:3px;}
</style>
</head>
<body>
  <div class="screen">
    <div class="id">
      <div class="avatar"></div>
      <div>
        <h1 class="name">Marisol Danvers</h1>
        <p class="handle">@marisol · Thornfield</p>
      </div>
    </div>

    <p class="bio">Writes a weekly thread on urban gardens and the people who keep them going.</p>
    <p class="meta">3,482 followers · 6 mutual</p>

    <div class="action">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
        <path d="M3 9.2l3.4 3.4L14 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Following
    </div>
    <p class="since">Following since March 4, 2024</p>

    <hr>

    <div class="row">
      <div>
        <div class="label">Post notifications</div>
        <div class="sub">All posts and replies</div>
      </div>
      <div class="switch"><span></span></div>
    </div>

    <div class="row" style="border-bottom:0;">
      <div>
        <div class="label">Subscribed to Field Notes</div>
        <div class="sub">$4.00 per month · renews April 12</div>
      </div>
      <div class="switch"><span></span></div>
    </div>
  </div>
</body>
</html>
