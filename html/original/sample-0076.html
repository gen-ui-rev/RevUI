<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Lesson Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #eeebee;
      color: #29242a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 22px;
      background: #fcfafc;
    }

    .booking {
      width: 100%;
    }

    .intro h1 {
      margin: 0;
      color: #76506d;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 8px 0 0;
      color: #6e676d;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    .teacher {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding: 12px;
      background: rgba(151, 101, 137, 0.10);
      border-radius: 14px;
    }

    .monogram {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(151, 101, 137, 0.22);
      color: #6f4965;
      font-size: 16px;
      line-height: 1;
      font-weight: 600;
    }

    .teacher-copy {
      min-width: 0;
    }

    .teacher-name {
      margin: 0;
      color: #302a30;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
    }

    .teacher-detail {
      margin: 3px 0 0;
      color: #746c72;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }

    .selection {
      margin-top: 18px;
    }

    .field-label {
      margin: 0;
      color: #4b444a;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    .date-options,
    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .date-option,
    .time-option {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(151, 101, 137, 0.08);
      border-radius: 14px;
      color: #5f575d;
      text-align: center;
      font-size: 14px;
      font-weight: 400;
    }

    .date-option {
      min-height: 58px;
      flex-direction: column;
      gap: 3px;
      line-height: 1.2;
    }

    .date-option span {
      color: #7d747a;
      font-size: 12px;
    }

    .date-option.selected,
    .time-option.selected {
      background: rgba(151, 101, 137, 0.22);
      color: #68465f;
      font-weight: 600;
    }

    .time-field {
      margin-top: 16px;
    }

    .time-option {
      min-height: 44px;
      line-height: 1;
    }

    .confirmation {
      margin-top: 18px;
      padding: 14px;
      background: rgba(151, 101, 137, 0.10);
      border-radius: 14px;
    }

    .confirmation-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .confirmation-label {
      margin: 0;
      color: #786f75;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    .confirmation-value {
      margin: 2px 0 0;
      color: #322b31;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .duration {
      margin: 1px 0 0;
      color: #786f75;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      white-space: nowrap;
    }

    .confirm-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      border: 0;
      border-radius: 14px;
      background: #815a76;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="booking" aria-label="Lesson time booking">
      <header class="intro">
        <h1>Choose a lesson time</h1>
        <p>Book a 30-minute conversation lesson with your tutor.</p>
      </header>

      <section class="teacher" aria-label="Selected tutor">
        <div class="monogram" aria-hidden="true">MC</div>
        <div class="teacher-copy">
          <p class="teacher-name">Mara Collins</p>
          <p class="teacher-detail">Advanced English conversation</p>
        </div>
      </section>

      <section class="selection" aria-label="Available lesson times">
        <p class="field-label">Select a date</p>
        <div class="date-options">
          <div class="date-option">
            <span>Tue</span>
            May 14
          </div>
          <div class="date-option selected">
            <span>Wed</span>
            May 15
          </div>
          <div class="date-option">
            <span>Thu</span>
            May 16
          </div>
        </div>

        <div class="time-field">
          <p class="field-label">Select a time</p>
          <div class="time-options">
            <div class="time-option">9:30 AM</div>
            <div class="time-option selected">11:00 AM</div>
            <div class="time-option">2:30 PM</div>
          </div>
        </div>
      </section>

      <section class="confirmation" aria-label="Booking summary">
        <div class="confirmation-row">
          <div>
            <p class="confirmation-label">Your lesson</p>
            <p class="confirmation-value">Wed, May 15 at 11:00 AM</p>
          </div>
          <p class="duration">30 minutes</p>
        </div>
        <button class="confirm-button" type="button">Confirm lesson</button>
      </section>
    </main>
  </div>
</body>
</html>
