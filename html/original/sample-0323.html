<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtone widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e9eaec;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:40px 30px;
    background:#e9eaec;
  }
  .widget{
    box-sizing:border-box;
    width:100%;
    padding:18px;
    border-radius:14px;
    background:rgba(31,95,245,0.11);
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .head .now{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#1f5ff5;
  }
  .head .app{
    font-size:12px;
    font-weight:500;
    color:#6a7383;
  }
  .item{
    display:flex;
    gap:14px;
    align-items:center;
    margin-top:16px;
  }
  .item img{
    width:84px;
    height:84px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#c9ced6;
    flex:none;
  }
  .meta{min-width:0;}
  .title{
    font-size:18px;
    font-weight:700;
    color:#10141c;
    line-height:1.25;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sub{
    font-size:13px;
    font-weight:500;
    color:#5b6472;
    margin:5px 0 0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .show{
    font-size:12px;
    font-weight:400;
    color:#7a8290;
    margin:9px 0 0;
  }
  .track{
    margin-top:18px;
    height:6px;
    border-radius:3px;
    background:rgba(31,95,245,0.22);
  }
  .fill{
    width:68%;
    height:100%;
    border-radius:3px;
    background:#1f5ff5;
  }
  .times{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    font-weight:500;
    color:#6a7383;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
    margin-top:16px;
  }
  .ghost{
    width:34px;
    height:34px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2b3444;
  }
  .play{
    width:48px;
    height:48px;
    border-radius:24px;
    background:#1f5ff5;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="head">
        <span class="now">Now playing</span>
        <span class="app">Overtone</span>
      </div>

      <div class="item">
        <img src="https://loremflickr.com/84/84/studio?lock=4761" width="84" height="84" alt="Recording studio console, cover art for the episode">
        <div class="meta">
          <p class="title">The Long Way Around</p>
          <p class="sub">Episode 142 &middot; Marisol Vane</p>
          <p class="show">Paused Tuesday, 8:14 PM</p>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="times">
        <span>34:12</span>
        <span>16:05 left</span>
      </div>

      <div class="controls">
        <div class="ghost">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12a8 8 0 1 1 3.2 6.4"></path>
            <path d="M4 6.5V12h5.5"></path>
          </svg>
        </div>
        <div class="play">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5z"></path>
          </svg>
        </div>
        <div class="ghost">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 12a8 8 0 1 0-3.2 6.4"></path>
            <path d="M20 6.5V12h-5.5"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
