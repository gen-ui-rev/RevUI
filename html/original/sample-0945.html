<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ececf0;
      color: #202026;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    .intro h1 {
      margin: 0;
      color: #6840c6;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 7px 0 0;
      color: #686873;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .add-method {
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 6px;
      background: #6840c6;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      cursor: pointer;
    }

    .methods {
      margin-top: 26px;
    }

    .section-title {
      margin: 0 0 5px;
      color: #303038;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .method-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #dedee5;
    }

    .method-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #dedee5;
    }

    .method-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #f1edfb;
      color: #6840c6;
    }

    .method-icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .method-copy {
      min-width: 0;
      flex: 1;
    }

    .method-name {
      margin: 0;
      overflow: hidden;
      color: #24242a;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .method-meta {
      margin: 2px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #74747e;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }

    .default-label {
      padding: 2px 6px;
      border-radius: 6px;
      background: #f1edfb;
      color: #6840c6;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .more-button {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #777782;
      cursor: pointer;
    }

    .more-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="payment-title">
      <section class="intro">
        <h1 id="payment-title">Payment methods</h1>
        <p>Manage how you pay for stays and receive refunds from Wayfound.</p>
        <button class="add-method" type="button">Add card or bank account</button>
      </section>

      <section class="methods" aria-labelledby="saved-methods-title">
        <h2 class="section-title" id="saved-methods-title">Saved methods</h2>
        <ul class="method-list">
          <li class="method-row">
            <div class="method-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="2.5" y="5" width="19" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                <path d="M3 9H21" stroke="currentColor" stroke-width="1.7"/>
                <path d="M6 15H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="method-copy">
              <p class="method-name">Northline •••• 1842</p>
              <p class="method-meta">
                <span>Expires 08/27</span>
                <span class="default-label">Default</span>
              </p>
            </div>
            <button class="more-button" type="button" aria-label="Manage Northline card ending in 1842">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5" cy="12" r="1.5"/>
                <circle cx="12" cy="12" r="1.5"/>
                <circle cx="19" cy="12" r="1.5"/>
              </svg>
            </button>
          </li>

          <li class="method-row">
            <div class="method-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="2.5" y="5" width="19" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                <path d="M3 9H21" stroke="currentColor" stroke-width="1.7"/>
                <path d="M6 15H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="method-copy">
              <p class="method-name">Cedar Debit •••• 6071</p>
              <p class="method-meta">Expires 11/28</p>
            </div>
            <button class="more-button" type="button" aria-label="Manage Cedar debit card ending in 6071">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5" cy="12" r="1.5"/>
                <circle cx="12" cy="12" r="1.5"/>
                <circle cx="19" cy="12" r="1.5"/>
              </svg>
            </button>
          </li>

          <li class="method-row">
            <div class="method-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 9L12 4L21 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V18M9.5 10V18M14.5 10V18M19 10V18" stroke="currentColor" stroke-width="1.7"/>
                <path d="M3 20H21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="method-copy">
              <p class="method-name">Harbor Checking •••• 2910</p>
              <p class="method-meta">Verified bank account</p>
            </div>
            <button class="more-button" type="button" aria-label="Manage Harbor checking account ending in 2910">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5" cy="12" r="1.5"/>
                <circle cx="12" cy="12" r="1.5"/>
                <circle cx="19" cy="12" r="1.5"/>
              </svg>
            </button>
          </li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
