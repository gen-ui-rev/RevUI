<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal progress — Northlark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:#ececed;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:32px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#4338ca;
    margin:0 0 10px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    line-height:1.25;
    color:#141419;
    margin:0 0 18px;
  }
  img.hero{
    display:block;
    object-fit:cover;
    background:#d8d8dc;
    width:326px;
    height:132px;
  }
  .amounts{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:22px 0 0;
  }
  .saved{
    font-size:34px;
    font-weight:700;
    letter-spacing:-.02em;
    color:#141419;
    line-height:1;
  }
  .target{
    font-size:14px;
    font-weight:500;
    color:#6a6a74;
  }
  .track{
    margin-top:18px;
    height:12px;
    width:100%;
    background:#e6e6ea;
  }
  .fill{
    height:12px;
    width:57.5%;
    background:#4338ca;
  }
  .under{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:10px;
    font-size:13px;
    color:#6a6a74;
    font-weight:500;
  }
  .under strong{
    color:#141419;
    font-weight:700;
    font-size:13px;
  }
  .rule{
    border:0;
    border-top:1px solid #e0e0e4;
    margin:22px 0 0;
  }
  .detail{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 0;
    border-bottom:1px solid #e0e0e4;
  }
  .detail .label{
    font-size:14px;
    color:#6a6a74;
    font-weight:500;
  }
  .detail .value{
    font-size:14px;
    color:#141419;
    font-weight:700;
  }
  .note{
    margin:16px 0 0;
    font-size:12px;
    line-height:1.5;
    color:#83838d;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Savings goal</p>
    <h1>Down payment — Rowan Street loft</h1>
    <img class="hero" src="https://loremflickr.com/326/132/architecture?lock=10961" width="326" height="132" alt="Brick apartment building on Rowan Street, the home this goal is saving toward">

    <div class="amounts">
      <span class="saved">$18,400</span>
      <span class="target">of $32,000</span>
    </div>

    <div class="track"><div class="fill"></div></div>
    <div class="under">
      <span><strong>58% saved</strong></span>
      <span>$13,600 to go</span>
    </div>

    <hr class="rule">
    <div class="detail">
      <span class="label">Next transfer</span>
      <span class="value">$450 on Feb 3</span>
    </div>
    <div class="detail">
      <span class="label">Projected finish</span>
      <span class="value">March 2027</span>
    </div>

    <p class="note">Projection assumes the current monthly transfer continues. Deposits post one business day after transfer.</p>
  </div>
</body>
</html>
