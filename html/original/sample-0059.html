<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread reaction</title>
<style>
  :root{
    --accent:#6D3AE0;
    --ink:#16141C;
    --muted:#6B6676;
    --rule:#E4E1EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#EFEEF2;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#FFFFFF;
    padding:34px 26px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--accent);
    margin:0 0 12px;
  }
  .post{
    font-size:17px;
    line-height:1.45;
    margin:0;
    font-weight:400;
  }
  .byline{
    font-size:13px;
    color:var(--muted);
    margin:10px 0 0;
  }
  hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:22px 0;
  }
  .react{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .vote{
    width:60px;
    height:60px;
    border-radius:14px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .vote svg{display:block;}
  .count{
    font-size:30px;
    font-weight:600;
    line-height:1.05;
    letter-spacing:-.01em;
  }
  .count-label{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
  }
  .state{
    margin-left:auto;
    text-align:right;
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    line-height:1.3;
  }
  .who{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .faces{
    display:flex;
    flex:0 0 auto;
  }
  .face{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--rule);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:-8px;
  }
  .face:last-child{margin-right:0;}
  .who-text{
    font-size:14px;
    color:var(--muted);
    line-height:1.4;
  }
  .who-text b{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Design Systems</p>
    <p class="post">Renamed every spacing token to match the 4px grid. Review threads got shorter the same week.</p>
    <p class="byline">Marisol Vance · 4h ago</p>

    <hr>

    <div class="react">
      <div class="vote" aria-label="Upvoted">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/>
          <path d="M5 12l7-7 7 7"/>
        </svg>
      </div>
      <div>
        <div class="count">1,284</div>
        <div class="count-label">upvotes on this post</div>
      </div>
      <div class="state">Your vote<br>is public</div>
    </div>

    <hr>

    <div class="who">
      <div class="faces">
        <span class="face">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
          </svg>
        </span>
        <span class="face">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
          </svg>
        </span>
        <span class="face">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
          </svg>
        </span>
      </div>
      <div class="who-text"><b>You</b>, Dara Whitfield and 1,282 others upvoted</div>
    </div>
  </div>
</body>
</html>
