<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nookline Workflow Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8ed;
      color: #25232b;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #ffffff;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #ffffff;
    }

    .top-action {
      width: 34px;
      padding: 4px;
      border: 0;
      background: transparent;
      color: #403c49;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .exit-action {
      width: auto;
      justify-content: flex-end;
      color: #6f4bd8;
      font-size: 14px;
      font-weight: 500;
    }

    .top-title {
      margin: 0;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .content {
      padding: 15px 20px 96px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #716d79;
      font-size: 13px;
      line-height: 20px;
    }

    .progress-count {
      color: #6f4bd8;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      margin-bottom: 18px;
      border-radius: 6px;
      background: #eee9fb;
    }

    .progress-fill {
      width: 50%;
      height: 7px;
      border-radius: 6px;
      background: #6f4bd8;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: -0.35px;
    }

    .scenario-image {
      width: 350px;
      height: 126px;
      margin-top: 14px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      background: #dedbe5;
    }

    .answers {
      margin-top: 16px;
    }

    .answer-instruction {
      margin: 0 0 10px;
      color: #716d79;
      font-size: 13px;
      line-height: 20px;
    }

    .answer-list {
      display: grid;
      gap: 9px;
    }

    .answer {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f5f2fc;
      color: #302d37;
      text-align: left;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
    }

    .answer.selected {
      background: #e9e1ff;
      color: #5631bf;
    }

    .answer-marker {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e1f7;
      color: #655e70;
      font-size: 12px;
      font-weight: 600;
    }

    .selected .answer-marker {
      background: #6f4bd8;
      color: #ffffff;
    }

    .answer-text {
      flex: 1;
      min-width: 0;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #f0ebff;
    }

    .feedback-icon {
      flex: 0 0 auto;
      margin-top: 1px;
      color: #6f4bd8;
    }

    .feedback-title {
      margin: 0 0 2px;
      color: #5631bf;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .feedback-copy {
      margin: 0;
      color: #5f5969;
      font-size: 13px;
      line-height: 19px;
    }

    .next-button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 18px;
      border: 0;
      border-radius: 6px;
      background: #6f4bd8;
      color: #ffffff;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      text-align: center;
    }

    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      padding: 10px 10px 12px;
      background: #faf9fd;
    }

    .tab-item {
      min-width: 68px;
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: #85808c;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .tab-item.active {
      color: #6f4bd8;
    }

    .tab-icon {
      width: 22px;
      height: 22px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="top-action" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="top-title">Nookline Learn</p>
      <button class="top-action exit-action" type="button">Exit</button>
    </header>

    <main class="content">
      <section aria-labelledby="quiz-question">
        <div class="progress-meta">
          <span>Team workflows</span>
          <span class="progress-count">Question 3 of 6</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="3">
          <div class="progress-fill"></div>
        </div>

        <h1 id="quiz-question">Where should Maya save notes the whole project team needs?</h1>

        <img
          class="scenario-image"
          src="https://loremflickr.com/350/126/meeting?lock=10270"
          width="350"
          height="126"
          alt="A project team reviewing notes during a meeting"
        >

        <div class="answers">
          <p class="answer-instruction">Choose the best location.</p>
          <div class="answer-list">
            <button class="answer" type="button">
              <span class="answer-marker">A</span>
              <span class="answer-text">Her private notebook</span>
            </button>

            <button class="answer selected" type="button" aria-pressed="true">
              <span class="answer-marker">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4.5 10.2L8.2 13.8L15.6 6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="answer-text">The project’s shared team space</span>
            </button>

            <button class="answer" type="button">
              <span class="answer-marker">C</span>
              <span class="answer-text">A direct message to Jordan</span>
            </button>
          </div>
        </div>

        <div class="feedback" role="status">
          <svg class="feedback-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="currentColor"/>
            <path d="M8 12.2L10.7 14.8L16.2 9.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div>
            <p class="feedback-title">Correct</p>
            <p class="feedback-copy">Shared spaces keep decisions visible and easy for teammates to find later.</p>
          </div>
        </div>

        <button class="next-button" type="button">Next question</button>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab-item" type="button">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V19H14.8V14H9.2V19H4V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab-item" type="button">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="5" width="7" height="6" rx="1" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13" y="5" width="7" height="6" rx="1" stroke="currentColor" stroke-width="1.7"/>
          <rect x="4" y="13" width="7" height="6" rx="1" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13" y="13" width="7" height="6" rx="1" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Spaces</span>
      </button>

      <button class="tab-item active" type="button" aria-current="page">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5.5C7.8 5.1 10.1 5.8 12 7.5V19C10.1 17.3 7.8 16.6 5 17V5.5Z" fill="currentColor" opacity="0.22"/>
          <path d="M19 5.5C16.2 5.1 13.9 5.8 12 7.5V19C13.9 17.3 16.2 16.6 19 17V5.5Z" fill="currentColor" opacity="0.22"/>
          <path d="M5 5.5C7.8 5.1 10.1 5.8 12 7.5C13.9 5.8 16.2 5.1 19 5.5V17C16.2 16.6 13.9 17.3 12 19C10.1 17.3 7.8 16.6 5 17V5.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M12 7.5V19" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Learn</span>
      </button>

      <button class="tab-item" type="button">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 19C6.2 15.8 8.4 14.2 12 14.2C15.6 14.2 17.8 15.8 18.5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
