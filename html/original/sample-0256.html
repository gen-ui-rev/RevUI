<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrowdesk Followers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe3e8;
      color: #1f2937;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f6;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      padding: 14px 16px 12px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .icon-button {
      width: 42px;
      padding: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      background: transparent;
      border: 0;
      cursor: default;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .page-heading {
      min-width: 0;
      text-align: center;
    }

    .service-name {
      margin: 0 0 2px;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1f2937;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0 18px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab {
      position: relative;
      padding: 14px 8px 13px;
      color: #64748b;
      background: transparent;
      border: 0;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .tab.active {
      color: #334155;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      right: 22px;
      bottom: -1px;
      left: 22px;
      height: 3px;
      background: #475569;
      border-radius: 14px 14px 0 0;
    }

    .content {
      flex: 1;
      padding: 20px 18px 18px;
    }

    .intro {
      margin-bottom: 16px;
    }

    .intro p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      color: #64748b;
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      font-size: 14px;
    }

    .search-field svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-bar h2 {
      margin: 0;
      color: #1f2937;
      font-size: 16px;
      font-weight: 700;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 0;
      color: #64748b;
      background: transparent;
      border: 0;
      font-size: 13px;
      font-weight: 500;
    }

    .sort-button svg {
      width: 16px;
      height: 16px;
    }

    .people-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(51, 65, 85, 0.08);
    }

    .person-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px;
    }

    .person-row + .person-row {
      border-top: 1px solid #edf0f2;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      background: #eef1f4;
      border: 1px solid #dbe1e7;
      border-radius: 50%;
    }

    .avatar svg {
      width: 29px;
      height: 29px;
    }

    .identity {
      min-width: 0;
      flex: 1;
    }

    .person-name {
      margin: 0 0 4px;
      overflow: hidden;
      color: #1f2937;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .person-detail {
      margin: 0;
      overflow: hidden;
      color: #7b8492;
      font-size: 12px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .follow-button {
      width: 92px;
      flex: 0 0 92px;
      padding: 9px 8px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .follow-button.primary {
      color: #ffffff;
      background: #475569;
      border: 1px solid #475569;
    }

    .follow-button.secondary {
      color: #475569;
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 8px 10px;
      background: #ffffff;
      border-top: 1px solid #dfe3e8;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
      color: #8a94a3;
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 500;
    }

    .nav-item.active {
      color: #475569;
      font-weight: 600;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="page-heading">
        <p class="service-name">Morrowdesk</p>
        <h1>Followers</h1>
      </div>

      <button class="icon-button" aria-label="More options">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="5" cy="12" r="1.4" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
          <circle cx="19" cy="12" r="1.4" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <nav class="tabs" aria-label="Connection lists">
      <button class="tab active" aria-selected="true">Followers 248</button>
      <button class="tab" aria-selected="false">Following 96</button>
    </nav>

    <main class="content">
      <section class="intro" aria-label="Follower information">
        <p>People who follow your public notes and project updates.</p>
      </section>

      <div class="search-field" role="search" aria-label="Search followers">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Search followers</span>
      </div>

      <section aria-labelledby="followers-list-title">
        <div class="section-bar">
          <h2 id="followers-list-title">Recent followers</h2>
          <button class="sort-button">
            Newest
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="people-card">
          <div class="person-row">
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="11" r="5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7.5 26c.7-5 3.8-7.5 8.5-7.5s7.8 2.5 8.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M11 8.5c1.7-2.3 6.6-3.1 9.7.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="identity">
              <p class="person-name">Avery Quill</p>
              <p class="person-detail">Design lead · 12 shared notes</p>
            </div>
            <button class="follow-button primary">Follow back</button>
          </div>

          <div class="person-row">
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="11.5" r="5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7.5 26c.8-4.9 3.7-7.4 8.5-7.4s7.7 2.5 8.5 7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.5 10c.6-3.4 2.8-5 5.8-5 2.6 0 4.4 1.5 5.1 4.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="identity">
              <p class="person-name">Jordan Vale</p>
              <p class="person-detail">Project planner · 6 shared boards</p>
            </div>
            <button class="follow-button secondary">Following</button>
          </div>

          <div class="person-row">
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="11.5" r="5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7.5 26c.8-4.9 3.7-7.4 8.5-7.4s7.7 2.5 8.5 7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M10.8 9.2c2.8.1 5.7-1.1 7.5-3.1 1.7.7 2.7 2.1 3 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="identity">
              <p class="person-name">Casey Arden</p>
              <p class="person-detail">Researcher · 3 shared notes</p>
            </div>
            <button class="follow-button primary">Follow back</button>
          </div>

          <div class="person-row">
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="11.5" r="5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7.5 26c.8-4.9 3.7-7.4 8.5-7.4s7.7 2.5 8.5 7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M11.2 8.3c1-2 2.8-3.1 5.2-3.1 2.5 0 4.2 1.3 5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="identity">
              <p class="person-name">Morgan Haye</p>
              <p class="person-detail">Team coordinator · 9 shared boards</p>
            </div>
            <button class="follow-button secondary">Following</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4l8 6.5V20H4v-9.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M9.5 20v-6h5v6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="3.5" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.5 8h7M8.5 12h7M8.5 16h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Notes</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M7 3.5v4M17 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M8 14h3M14 14h2M8 17h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Schedule</span>
      </button>

      <button class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M3.5 20c.4-4 2.3-6.2 5.5-6.2s5.1 2.2 5.5 6.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="17.5" cy="9" r="2.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M16 14.5c2.8-.3 4.4 1.5 4.7 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>People</span>
      </button>
    </nav>
  </div>
</body>
</html>
