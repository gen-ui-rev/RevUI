<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods — Morrow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e4;
      color: #292524;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fafaf9;
      border: 1px solid #d6d3d1;
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #e7e5e4;
      background: #fafaf9;
    }

    .back-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #44403c;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .topbar-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;
      color: #292524;
    }

    main {
      flex: 1;
      padding: 24px 20px 20px;
    }

    .intro {
      margin: 0 0 18px;
      max-width: 320px;
      font-size: 14px;
      line-height: 1.55;
      color: #78716c;
    }

    .add-button {
      width: 100%;
      min-height: 52px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #57534e;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
      cursor: pointer;
    }

    .section {
      margin-top: 30px;
    }

    .section-heading {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      color: #44403c;
    }

    .method-list {
      border-top: 1px solid #d6d3d1;
    }

    .method-row {
      width: 100%;
      min-height: 88px;
      padding: 18px 0;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      color: inherit;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #e7e5e4;
      cursor: pointer;
    }

    .method-icon {
      width: 44px;
      height: 36px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #e7e5e4;
      color: #57534e;
    }

    .method-copy {
      min-width: 0;
      flex: 1;
    }

    .method-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .method-title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
      color: #292524;
    }

    .badge {
      flex: 0 0 auto;
      padding: 3px 8px;
      border-radius: 10px;
      background: #d6d3d1;
      color: #44403c;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
    }

    .method-meta {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.4;
      color: #78716c;
    }

    .chevron {
      flex: 0 0 auto;
      color: #a8a29e;
    }

    .preference-row {
      width: 100%;
      min-height: 70px;
      padding: 15px 0;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      color: inherit;
      background: transparent;
      border: 0;
      border-top: 1px solid #d6d3d1;
      border-bottom: 1px solid #e7e5e4;
      cursor: pointer;
    }

    .preference-copy {
      min-width: 0;
      flex: 1;
    }

    .preference-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
      color: #292524;
    }

    .preference-meta {
      margin: 3px 0 0;
      font-size: 13px;
      line-height: 1.4;
      color: #78716c;
    }

    .tabbar {
      min-height: 76px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #d6d3d1;
      background: #fafaf9;
    }

    .tab {
      padding: 11px 4px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #a8a29e;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .tab.active {
      color: #57534e;
    }

    .tab svg,
    .back-button svg,
    .method-icon svg,
    .chevron svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="topbar-title">Payment methods</h1>
    </header>

    <main>
      <p class="intro">Manage the cards and bank accounts saved to your Morrow Market account.</p>
      <button class="add-button" type="button">Add payment method</button>

      <section class="section" aria-labelledby="saved-heading">
        <h2 class="section-heading" id="saved-heading">Saved methods</h2>
        <div class="method-list">
          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="23" height="19" viewBox="0 0 24 20" fill="none">
                <rect x="1.5" y="2" width="21" height="16" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2 7H22" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 14H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Card ending in 1842</span>
                <span class="badge">Default</span>
              </span>
              <span class="method-meta">Debit card · Expires 08/28</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="23" height="21" viewBox="0 0 24 22" fill="none">
                <path d="M2 8L12 2L22 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 9H20M5.5 9V17M10 9V17M14 9V17M18.5 9V17M3 20H21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Checking account ending in 6021</span>
              </span>
              <span class="method-meta">Bank account · Verified</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="23" height="19" viewBox="0 0 24 20" fill="none">
                <rect x="1.5" y="2" width="21" height="16" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2 7H22" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 14H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Card ending in 7718</span>
              </span>
              <span class="method-meta">Credit card · Expires 11/27</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="settings-heading">
        <h2 class="section-heading" id="settings-heading">Payment settings</h2>
        <button class="preference-row" type="button">
          <span class="preference-copy">
            <span class="preference-title">Default payment method</span>
            <span class="preference-meta">Card ending in 1842</span>
          </span>
          <span class="chevron" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <a class="tab" href="#" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>
      <a class="tab" href="#" aria-label="Browse">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Browse</span>
      </a>
      <a class="tab" href="#" aria-label="Orders">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 4H19V21H5V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8 9H16M8 13H16M8 17H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Orders</span>
      </a>
      <a class="tab active" href="#" aria-current="page" aria-label="Account">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4.5 21C5.2 16.9 7.7 15 12 15C16.3 15 18.8 16.9 19.5 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Account</span>
      </a>
    </nav>
  </div>
</body>
</html>
