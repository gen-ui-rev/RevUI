<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store — Follow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#059669;
    --ink:#12161c;
    --muted:#6b7280;
    --line:#e8eaed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceef0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:30px 24px;
    background:#eceef0;
  }
  .card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(17,24,39,.09);
  }
  .hero{
    display:block;
    width:100%;
    height:120px;
    object-fit:cover;
    background:#dcdfe3;
    border-radius:14px 14px 0 0;
  }
  .body{padding:14px 16px;}
  .mono{
    width:62px;height:62px;
    margin-top:-40px;
    border-radius:14px;
    border:3px solid #fff;
    background:var(--emerald);
    color:#fff;
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    margin:10px 0 0;
    font-size:17px;
    line-height:24px;
    font-weight:700;
    color:var(--ink);
  }
  .meta{
    margin-top:3px;
    font-size:13px;
    line-height:18px;
    color:var(--muted);
  }
  .btn{
    margin-top:14px;
    height:46px;
    width:100%;
    border:0;
    border-radius:14px;
    background:var(--emerald);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn svg{display:block;}
  .row{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .row .label{
    font-size:14px;
    line-height:20px;
    font-weight:500;
    color:var(--ink);
  }
  .row .sub{
    font-size:12px;
    line-height:16px;
    color:var(--muted);
  }
  .switch{
    flex:0 0 auto;
    width:44px;height:26px;
    border-radius:13px;
    background:var(--emerald);
    position:relative;
  }
  .switch span{
    position:absolute;
    top:3px;left:21px;
    width:20px;height:20px;
    border-radius:10px;
    background:#fff;
  }
  .section{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .section h2{
    margin:0;
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .thumbs{
    margin-top:10px;
    display:flex;
    gap:11px;
  }
  .thumbs img{
    display:block;
    width:96px;
    height:76px;
    object-fit:cover;
    background:#dcdfe3;
    border-radius:14px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/342/120/furniture?lock=3400" width="342" height="120" alt="Walnut side table and linen chair from the store's workshop">
      <div class="body">
        <div class="mono">MF</div>
        <h1>Marlowe &amp; Field</h1>
        <p class="meta">Home goods · 12,480 followers</p>

        <button class="btn" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8.6l3.1 3.1L13 4.9" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Following
        </button>

        <div class="row">
          <div>
            <div class="label">New drop alerts</div>
            <div class="sub">Last notice sent April 3</div>
          </div>
          <div class="switch" role="img" aria-label="Alerts on"><span></span></div>
        </div>

        <div class="section">
          <h2>Recent items</h2>
          <div class="thumbs">
            <img src="https://loremflickr.com/96/76/furniture?lock=3401" width="96" height="76" alt="Oak stool with woven seat">
            <img src="https://loremflickr.com/96/76/product?lock=3402" width="96" height="76" alt="Stoneware serving bowl in sand glaze">
            <img src="https://loremflickr.com/96/76/product?lock=3403" width="96" height="76" alt="Brass reading lamp on a desk">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
