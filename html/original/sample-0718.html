<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery — Cadence Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd7;
      color: #292725;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #fcfbf9;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px 16px;
      background: #fcfbf9;
    }

    .back-button {
      width: 40px;
      padding: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      background: rgba(139, 119, 104, 0.12);
      color: #66574d;
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
    }

    .top-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
    }

    main {
      padding: 50px 24px 130px;
    }

    .recovery {
      max-width: 342px;
    }

    .recovery-icon {
      width: 76px;
      padding: 19px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: rgba(139, 119, 104, 0.14);
      color: #79675a;
    }

    .recovery-icon svg {
      width: 38px;
      height: 38px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .intro {
      margin: 0 0 32px;
      color: #6c6864;
      font-size: 14px;
      line-height: 1.65;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .email-input {
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 6px;
      outline: none;
      background: rgba(139, 119, 104, 0.11);
      color: #292725;
      font-size: 15px;
      line-height: 1.5;
      caret-color: #79675a;
    }

    .email-input::placeholder {
      color: #8b8580;
      opacity: 1;
    }

    .field-note {
      margin: 10px 0 24px;
      color: #77716c;
      font-size: 12px;
      line-height: 1.55;
    }

    .send-button {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 6px;
      background: #887466;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
      cursor: pointer;
    }

    .sign-in-link {
      display: block;
      width: max-content;
      margin: 21px auto 0;
      color: #6e5e53;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      text-decoration: none;
    }

    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 11px 18px 15px;
      background: #f4f1ee;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 6px 4px;
      color: #89827c;
      font-size: 12px;
      line-height: 1.3;
      text-decoration: none;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #756256;
      font-weight: 500;
    }

    .tab.active .tab-icon {
      padding: 5px 18px;
      border-radius: 6px;
      background: rgba(139, 119, 104, 0.16);
    }

    .tab-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 18px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18 9 12l6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="top-title">Account recovery</p>
    </header>

    <main>
      <section class="recovery" aria-labelledby="recovery-title">
        <div class="recovery-icon" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <rect x="5.5" y="10" width="29" height="21" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="m7.5 12 12.5 9 12.5-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="29.5" cy="27.5" r="6" fill="#f1edeb" stroke="currentColor" stroke-width="1.8"/>
            <path d="M29.5 25.2v4.6M27.2 27.5h4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>

        <h1 id="recovery-title">Reset your password</h1>
        <p class="intro">Enter the email connected to your Cadence Learning account. We will send you a secure reset link.</p>

        <form>
          <label class="field-label" for="email">Email address</label>
          <input class="email-input" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email">
          <p class="field-note">The link will expire 30 minutes after it is sent.</p>
          <button class="send-button" type="submit">Send reset link</button>
        </form>

        <a class="sign-in-link" href="#">Return to sign in</a>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <a class="tab" href="#">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
        Library
      </a>
      <a class="tab" href="#">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 18.5V15m4 3.5V11m4 7.5V7m4 11.5V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3.5 21h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        Practice
      </a>
      <a class="tab active" href="#" aria-current="page">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5.5 20c.5-4 2.65-6 6.5-6s6 2 6.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        Account
      </a>
    </nav>
  </div>
</body>
</html>
