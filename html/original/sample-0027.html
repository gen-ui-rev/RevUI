<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Morrowleaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ecea;
      color: #18201d;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #e3e8e5;
      background: #ffffff;
    }

    .top-bar h1 {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .icon-button {
      width: 44px;
      min-height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #18201d;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    main {
      flex: 1;
      padding: 40px 20px 24px;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-mark {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #087f5b;
      color: #ffffff;
    }

    .app-mark svg {
      width: 48px;
      height: 48px;
    }

    .identity h2 {
      margin: 22px 0 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .identity p {
      max-width: 300px;
      margin: 9px 0 0;
      color: #64706b;
      font-size: 15px;
      line-height: 22px;
    }

    .version {
      margin: 15px 0 0;
      color: #087f5b;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .info-section {
      margin-top: 40px;
      border: 1px solid #dfe5e2;
      border-radius: 14px;
      background: #ffffff;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 16px;
      font-size: 14px;
      line-height: 20px;
    }

    .info-row + .info-row {
      border-top: 1px solid #e5e9e7;
    }

    .row-label {
      color: #26302c;
      font-weight: 500;
    }

    .row-value {
      min-width: 0;
      color: #69746f;
      text-align: right;
      white-space: nowrap;
    }

    .row-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #087f5b;
      font-weight: 500;
    }

    .row-link svg {
      width: 16px;
      height: 16px;
      flex: none;
    }

    .copyright {
      margin: 20px 0 0;
      color: #87918d;
      text-align: center;
      font-size: 12px;
      line-height: 18px;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px 10px;
      border-top: 1px solid #dfe5e2;
      background: #ffffff;
    }

    .tab {
      min-width: 0;
      padding: 5px 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #7a8580;
      text-decoration: none;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab svg {
      width: 23px;
      height: 23px;
    }

    .tab.active {
      color: #087f5b;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18 9 12l6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>About</h1>
      <div aria-hidden="true"></div>
    </header>

    <main>
      <div class="identity">
        <div class="app-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M9 11.5c5.6 0 10.3 1.5 15 5.7v21.3c-4.7-4.2-9.4-5.7-15-5.7V11.5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M39 11.5c-5.6 0-10.3 1.5-15 5.7v21.3c4.7-4.2 9.4-5.7 15-5.7V11.5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M30.5 12.9c.6-3.1 2.6-5.2 6-6.4-.1 3.5-1.8 6-5.1 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>Morrowleaf</h2>
        <p>Language practice for clear, everyday conversations.</p>
        <div class="version">Version 4.8.2</div>
      </div>

      <section class="info-section" aria-label="App information">
        <div class="info-row">
          <span class="row-label">Released</span>
          <span class="row-value">February 18, 2025</span>
        </div>
        <div class="info-row">
          <span class="row-label">Created by</span>
          <span class="row-value">Morrowleaf Learning Team</span>
        </div>
        <div class="info-row">
          <span class="row-label">Open-source licenses</span>
          <span class="row-link">
            View notices
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="m6 3.5 4.5 4.5L6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </section>

      <p class="copyright">© 2025 Morrowleaf Learning. All rights reserved.</p>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <a class="tab" href="#" aria-label="Learn">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5c3.2 0 5.8.8 8 3.1v10.1c-2.2-2.3-4.8-3.1-8-3.1V5.5Zm16 0c-3.2 0-5.8.8-8 3.1v10.1c2.2-2.3 4.8-3.1 8-3.1V5.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Learn</span>
      </a>
      <a class="tab" href="#" aria-label="Practice">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7.5 9.5h9M7.5 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M5.5 4.5h13a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H12l-4.5 3v-3h-2a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Practice</span>
      </a>
      <a class="tab" href="#" aria-label="Progress">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V11m7 8V5m7 14v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Progress</span>
      </a>
      <a class="tab active" href="#" aria-current="page" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 19c.6-3.3 3-5 6.5-5s5.9 1.7 6.5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
