<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study reminder schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:#e9e9e5;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    color:#1c1d1a;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:24px;
    background:#e9e9e5;
  }
  .card{
    background:#ffffff;
    border-radius:6px;
    box-shadow:0 2px 10px rgba(30,31,26,.10);
  }
  .hero{
    display:block;
    width:100%;
    height:90px;
    object-fit:cover;
    background:#d6d7cf;
    border-radius:6px 6px 0 0;
  }
  .body{padding:18px;}
  .eyebrow{
    margin:0 0 4px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#5f6b33;
    font-weight:700;
  }
  h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    line-height:1.3;
  }
  .time-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
  }
  .time{
    font-size:34px;
    font-weight:700;
    line-height:1.1;
    color:#5f6b33;
  }
  .sub{
    margin:4px 0 0;
    font-size:12px;
    color:#767a6d;
  }
  .toggle{
    width:46px;
    height:26px;
    border-radius:6px;
    background:#5f6b33;
    padding:3px;
    box-sizing:border-box;
    display:flex;
    justify-content:flex-end;
    flex:none;
  }
  .knob{
    width:20px;
    height:20px;
    border-radius:6px;
    background:#ffffff;
  }
  .days{
    display:flex;
    gap:6px;
    margin-top:18px;
  }
  .day{
    flex:1 1 0;
    height:38px;
    border-radius:6px;
    background:#f2f3ee;
    color:#8a8d80;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .day.on{
    background:#5f6b33;
    color:#ffffff;
  }
  .note{
    margin:10px 0 16px;
    font-size:12px;
    color:#767a6d;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 0;
    border-top:1px solid #ebebe7;
    font-size:14px;
  }
  .row .val{
    color:#767a6d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .save{
    margin-top:16px;
    height:46px;
    border-radius:6px;
    background:#5f6b33;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/342/90/study?lock=9883" width="342" height="90" alt="Notebook and Spanish textbook open on a study desk">
      <div class="body">
        <p class="eyebrow">Reminder schedule</p>
        <h1>Spanish B1 — evening review</h1>

        <div class="time-row">
          <div>
            <div class="time">7:30 PM</div>
            <p class="sub">Local time · Chicago</p>
          </div>
          <div class="toggle"><div class="knob"></div></div>
        </div>

        <div class="days">
          <div class="day on">M</div>
          <div class="day on">T</div>
          <div class="day on">W</div>
          <div class="day on">T</div>
          <div class="day on">F</div>
          <div class="day">S</div>
          <div class="day">S</div>
        </div>
        <p class="note">Repeats weekdays · next reminder Wednesday, March 12</p>

        <div class="row">
          <span>Alert style</span>
          <span class="val">Push and email</span>
        </div>
        <div class="row">
          <span>Skip days I finish early</span>
          <span class="val">On</span>
        </div>

        <div class="save">Save schedule</div>
      </div>
    </div>
  </div>
</body>
</html>
