<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Notes — Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1a17;
    --muted:#6d675f;
    --line:#e0dbd3;
    --amber:#b45309;
    --amber-soft:#f6ecdd;
  }
  html,body{margin:0;}
  body{
    background:#f2f0ec;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:44px 0;
  }
  .screen{
    width:390px;
    background:#f2f0ec;
    padding:0 0;
    box-sizing:border-box;
  }
  .card{
    margin:0 24px;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px;
  }
  .head{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mono{
    width:40px;
    height:40px;
    border-radius:6px;
    background:var(--amber-soft);
    border:1px solid #ecdfcb;
    color:var(--amber);
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    letter-spacing:.02em;
  }
  .who{min-width:0;}
  .name{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
    margin-top:2px;
  }
  .body{
    font-size:17px;
    line-height:1.52;
    margin:16px 0 0;
  }
  .rule{
    height:1px;
    background:var(--line);
    margin:18px 0;
  }
  .vote{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .btn-up{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--amber);
    color:#fff;
    border:1px solid var(--amber);
    border-radius:6px;
    padding:11px 16px;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    line-height:1;
  }
  .btn-down{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:6px;
    padding:11px 14px;
    font-family:inherit;
    line-height:1;
  }
  .rank{
    margin-left:auto;
    font-size:12px;
    color:var(--muted);
    text-align:right;
    line-height:1.35;
  }
  .credit{
    font-size:13px;
    color:var(--muted);
    margin:12px 0 0;
    line-height:1.45;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <div class="mono">RC</div>
        <div class="who">
          <div class="name">Rowan Castellano</div>
          <div class="meta">Field Notes · 4h ago</div>
        </div>
      </div>

      <p class="body">The city archive digitized the 1974 transit maps. Two of the proposed lines were never built — you can still see where the tunnels stop.</p>

      <div class="rule"></div>

      <div class="vote">
        <button class="btn-up" type="button" aria-pressed="true" aria-label="Upvoted, 1,248 upvotes">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.2 13.2 9H10v3.8H6V9H2.8L8 3.2Z" fill="currentColor"/>
          </svg>
          1,248
        </button>
        <button class="btn-down" type="button" aria-label="Downvote">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 12.8 2.8 7H6V3.2h4V7h3.2L8 12.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="rank">Ranked 3rd<br>in Field Notes today</div>
      </div>

      <p class="credit">You, Mira Halloway, and 1,246 others upvoted this.</p>
    </div>
  </div>
</body>
</html>
