<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing — NurturePath</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ececef;
      color: #202024;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #ffffff;
      border: 1px solid #dedee3;
    }

    .topbar {
      height: 68px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ececf0;
    }

    .topbar-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.2px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #55555d;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      padding: 0 20px 88px;
    }

    .payment-summary {
      padding: 25px 0 24px;
      border-bottom: 1px solid #e6e6ea;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #6d6d75;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 500;
    }

    .amount {
      margin: 0;
      color: #d93876;
      font-size: 40px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: -1.2px;
    }

    .due-date {
      margin: 9px 0 21px;
      color: #4f4f57;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
    }

    .primary-button {
      width: 100%;
      min-height: 46px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #d93876;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
    }

    .section {
      padding-top: 22px;
    }

    .section + .section {
      margin-top: 3px;
      border-top: 1px solid #e6e6ea;
    }

    .section-heading {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 650;
    }

    .detail-row {
      min-height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid #f0f0f3;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      color: #696971;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
    }

    .detail-value {
      min-width: 0;
      color: #242429;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      text-align: right;
    }

    .payment-method {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .payment-method svg {
      flex: 0 0 auto;
      width: 23px;
      height: 17px;
      fill: none;
      stroke: #d93876;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .invoice-list {
      border-top: 1px solid #f0f0f3;
    }

    .invoice-row {
      min-height: 59px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #f0f0f3;
    }

    .invoice-icon {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid #e2e2e7;
      border-radius: 10px;
      color: #686870;
    }

    .invoice-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .invoice-copy {
      min-width: 0;
      flex: 1;
    }

    .invoice-date {
      margin: 0;
      color: #28282d;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 500;
    }

    .invoice-status {
      margin: 2px 0 0;
      color: #797981;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }

    .invoice-amount {
      flex: 0 0 auto;
      color: #28282d;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      padding: 8px 10px 10px;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      background: #ffffff;
      border-top: 1px solid #dedee3;
    }

    .tab {
      width: 80px;
      padding: 5px 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #76767e;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .tab.active {
      color: #d93876;
      background: #fff1f6;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <h1 class="topbar-title">Billing</h1>
      <button class="icon-button" type="button" aria-label="Billing help">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.7 9.1a2.5 2.5 0 0 1 4.8 1c0 1.9-2.5 2.1-2.5 3.8"></path>
          <path d="M12 17.4h.01"></path>
        </svg>
      </button>
    </header>

    <main>
      <section class="payment-summary" aria-labelledby="next-payment-label">
        <p class="eyebrow" id="next-payment-label">Next payment</p>
        <p class="amount">$24.00</p>
        <p class="due-date">Due April 18, 2025 for Recovery Plus</p>
        <button class="primary-button" type="button">Manage subscription</button>
      </section>

      <section class="section" aria-labelledby="subscription-heading">
        <h2 class="section-heading" id="subscription-heading">Subscription details</h2>
        <div class="detail-row">
          <span class="detail-label">Billing cycle</span>
          <span class="detail-value">Monthly</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Payment method</span>
          <span class="detail-value payment-method">
            <svg viewBox="0 0 24 18" aria-hidden="true">
              <rect x="1.5" y="2" width="21" height="14" rx="2"></rect>
              <path d="M1.5 6.5h21"></path>
              <path d="M5 12h4"></path>
            </svg>
            Card ending in 4821
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Renewal</span>
          <span class="detail-value">Automatic</span>
        </div>
      </section>

      <section class="section" aria-labelledby="invoices-heading">
        <h2 class="section-heading" id="invoices-heading">Invoice history</h2>
        <div class="invoice-list">
          <div class="invoice-row">
            <span class="invoice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 3h8l3 3v15H7z"></path>
                <path d="M15 3v4h4"></path>
                <path d="M10 11h5"></path>
                <path d="M10 15h5"></path>
              </svg>
            </span>
            <div class="invoice-copy">
              <p class="invoice-date">March 18, 2025</p>
              <p class="invoice-status">Paid</p>
            </div>
            <span class="invoice-amount">$24.00</span>
          </div>

          <div class="invoice-row">
            <span class="invoice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 3h8l3 3v15H7z"></path>
                <path d="M15 3v4h4"></path>
                <path d="M10 11h5"></path>
                <path d="M10 15h5"></path>
              </svg>
            </span>
            <div class="invoice-copy">
              <p class="invoice-date">February 18, 2025</p>
              <p class="invoice-status">Paid</p>
            </div>
            <span class="invoice-amount">$24.00</span>
          </div>

          <div class="invoice-row">
            <span class="invoice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 3h8l3 3v15H7z"></path>
                <path d="M15 3v4h4"></path>
                <path d="M10 11h5"></path>
                <path d="M10 15h5"></path>
              </svg>
            </span>
            <div class="invoice-copy">
              <p class="invoice-date">January 18, 2025</p>
              <p class="invoice-status">Paid</p>
            </div>
            <span class="invoice-amount">$24.00</span>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.5 12 5l8 6.5"></path>
          <path d="M6.5 10.5V20h11v-9.5"></path>
          <path d="M10 20v-5h4v5"></path>
        </svg>
        <span>Today</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 17V9"></path>
          <path d="M9.3 17V5"></path>
          <path d="M14.7 17v-4"></path>
          <path d="M20 17V7"></path>
          <path d="M3 20h18"></path>
        </svg>
        <span>Trends</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 9h18"></path>
          <path d="M7 15h4"></path>
        </svg>
        <span>Billing</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5.5 20c.6-3.5 3-5.5 6.5-5.5s5.9 2 6.5 5.5"></path>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
