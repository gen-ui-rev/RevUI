<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Practice Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfdb;
      color: #24261f;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 40px 20px;
      background: #f1f2ef;
    }

    .goal-card {
      padding: 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(37, 41, 30, 0.09);
    }

    .goal-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #eef0e7;
      color: #69754b;
    }

    .goal-icon svg {
      width: 25px;
      height: 25px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #69754b;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 9px 0 22px;
      color: #686b62;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    .stepper {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border-radius: 14px;
      background: #69754b;
    }

    .step-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 14px;
      background: transparent;
      color: #ffffff;
    }

    .step-button svg {
      width: 20px;
      height: 20px;
    }

    .value {
      min-width: 0;
      color: #ffffff;
      text-align: center;
    }

    .value-number {
      display: block;
      font-size: 36px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .value-unit {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .helper {
      margin: 13px 0 22px;
      color: #73766d;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .save-button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #252820;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <div class="goal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 7.5V12L15.2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.5 2.8H15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>

      <p class="eyebrow">Daily goal</p>
      <h1 id="goal-title">Set your practice time</h1>
      <p class="description">Choose how many minutes you want to spend on language lessons each day.</p>

      <div class="stepper" role="group" aria-label="Daily practice duration">
        <button class="step-button" type="button" aria-label="Decrease practice time">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="value" aria-live="polite">
          <span class="value-number">20</span>
          <span class="value-unit">Minutes</span>
        </div>

        <button class="step-button" type="button" aria-label="Increase practice time">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 6V18M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <p class="helper">Recommended for steady weekly progress</p>
      <button class="save-button" type="button">Set daily goal</button>
    </section>
  </div>
</body>
</html>
