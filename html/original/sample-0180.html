<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Weekly Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd4;
      color: #292823;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f7f5f0;
    }

    .share-sheet {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #746e63;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 9px 0 22px;
      color: #666158;
      font-size: 15px;
      line-height: 1.5;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #aaa59b;
      background: #f7f5f0;
      border-radius: 0;
    }

    .search svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #746e63;
    }

    .search input {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #292823;
      font: inherit;
      font-size: 15px;
    }

    .search input::placeholder {
      color: #8a857c;
      opacity: 1;
    }

    .section-label {
      margin: 24px 0 7px;
      color: #746e63;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .destinations {
      border-top: 1px solid #cbc7bf;
    }

    .destination {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #cbc7bf;
    }

    .portrait {
      width: 38px;
      height: 38px;
      background: #c8c1b4;
    }

    .portrait.cool {
      background: #b9c0bb;
    }

    .channel-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #9d978c;
      color: #716a5e;
    }

    .channel-mark svg {
      width: 19px;
      height: 19px;
    }

    .destination-copy {
      min-width: 0;
    }

    .destination-name {
      margin: 0;
      overflow: hidden;
      color: #292823;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination-detail {
      margin: 2px 0 0;
      overflow: hidden;
      color: #777168;
      font-size: 13px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .check {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: 1px solid #9d978c;
      background: transparent;
    }

    .check.selected {
      border-color: #716a5e;
      background: #716a5e;
      color: #ffffff;
    }

    .check svg {
      width: 13px;
      height: 13px;
    }

    .share-button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 16px;
      border: 1px solid #716a5e;
      border-radius: 0;
      background: #716a5e;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="share-sheet" aria-labelledby="share-title">
      <p class="eyebrow">Share note</p>
      <h1 id="share-title">Who should see the weekly plan?</h1>
      <p class="intro">Choose an existing teammate or workspace channel in Northline Notes.</p>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"></path>
        </svg>
        <input type="text" aria-label="Find a teammate or channel" placeholder="Find a teammate or channel">
      </label>

      <section aria-labelledby="destinations-title">
        <h2 class="section-label" id="destinations-title">Suggested destinations</h2>
        <div class="destinations">
          <div class="destination">
            <div class="portrait" aria-hidden="true"></div>
            <div class="destination-copy">
              <p class="destination-name">Mara Ellison</p>
              <p class="destination-detail">Product operations</p>
            </div>
            <div class="check selected" aria-label="Selected">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 8.2L6.3 11.3L13 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"></path>
              </svg>
            </div>
          </div>

          <div class="destination">
            <div class="channel-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 3L7 21M17 3L15 21M3.5 9H20.5M2.5 15H19.5" stroke="currentColor" stroke-width="1.6"></path>
              </svg>
            </div>
            <div class="destination-copy">
              <p class="destination-name">Planning Room</p>
              <p class="destination-detail">Workspace channel</p>
            </div>
            <div class="check" aria-label="Not selected"></div>
          </div>

          <div class="destination">
            <div class="portrait cool" aria-hidden="true"></div>
            <div class="destination-copy">
              <p class="destination-name">Calder Finch</p>
              <p class="destination-detail">Design systems</p>
            </div>
            <div class="check" aria-label="Not selected"></div>
          </div>
        </div>
      </section>

      <button class="share-button" type="button">Share with Mara</button>
    </main>
  </div>
</body>
</html>
