<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move to folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html { background: #eceef1; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #eceef1;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    padding: 28px 0;
    box-sizing: border-box;
  }
  .card {
    margin: 0 22px;
    background: #ffffff;
    border-radius: 4px;
    padding: 24px 22px 22px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7c8697;
    margin: 0 0 8px;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.25;
    color: #1d2430;
    margin: 0 0 6px;
  }
  .item {
    font-size: 14px;
    font-weight: 400;
    color: #5c6675;
    margin: 0 0 18px;
    line-height: 1.45;
  }
  .origin {
    background: rgba(71, 85, 105, 0.08);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 13px;
    color: #475569;
    font-weight: 500;
    margin-bottom: 22px;
  }
  .origin span {
    font-weight: 400;
    color: #6b7482;
  }
  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #7c8697;
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 12px;
    border-radius: 4px;
    background: rgba(71, 85, 105, 0.05);
    margin-bottom: 6px;
  }
  .row.selected {
    background: rgba(71, 85, 105, 0.18);
  }
  .row .name {
    font-size: 15px;
    font-weight: 500;
    color: #1d2430;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.selected .name { font-weight: 600; }
  .row .meta {
    font-size: 13px;
    color: #6b7482;
    flex: none;
  }
  .row .check {
    flex: none;
    display: block;
    color: #475569;
  }
  .note {
    font-size: 12px;
    color: #7c8697;
    line-height: 1.5;
    margin: 14px 0 20px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    border-radius: 4px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    text-align: center;
  }
  .btn-primary {
    flex: 1;
    background: #475569;
    color: #ffffff;
  }
  .btn-ghost {
    background: rgba(71, 85, 105, 0.08);
    color: #475569;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Move</p>
      <h1>Choose a destination</h1>
      <p class="item">Weekly sync notes — October 14</p>

      <div class="origin">Currently in <span>Inbox · added Oct 14, 2025</span></div>

      <p class="label">Folders</p>

      <div class="row selected">
        <span class="name">Team Notes</span>
        <svg class="check" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3.5 9.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="row">
        <span class="name">Product Planning</span>
        <span class="meta">24 notes</span>
      </div>
      <div class="row">
        <span class="name">Archive 2024</span>
        <span class="meta">108 notes</span>
      </div>

      <p class="note">Moving changes the folder only. The order of notes inside Team Notes stays as it is.</p>

      <div class="actions">
        <div class="btn btn-ghost">Cancel</div>
        <div class="btn btn-primary">Move to Team Notes</div>
      </div>
    </div>
  </div>
</body>
</html>
