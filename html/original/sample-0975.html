<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggested People</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eeed;
      color: #172221;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #ffffff;
    }

    .suggestions {
      width: 100%;
    }

    .section-label {
      margin: 0 0 8px;
      color: #087f78;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 22px;
      color: #63706e;
      font-size: 14px;
      line-height: 1.5;
    }

    .people-list {
      border-top: 1px solid #dce3e1;
    }

    .person {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #dce3e1;
    }

    .initials {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #dcefed;
      color: #086b66;
      font-size: 14px;
      font-weight: 600;
    }

    .person-copy {
      min-width: 0;
    }

    .name {
      margin: 0 0 3px;
      overflow: hidden;
      color: #172221;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context {
      margin: 0;
      overflow: hidden;
      color: #697573;
      font-size: 13px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .follow {
      min-width: 70px;
      padding: 8px 12px;
      border: 1px solid #0b8f86;
      border-radius: 6px;
      background: #ffffff;
      color: #087b74;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
    }

    .view-all {
      width: 100%;
      margin-top: 18px;
      padding: 11px 14px;
      border: 0;
      border-radius: 6px;
      background: #0b8f86;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="suggestions" aria-labelledby="suggestions-title">
      <p class="section-label">Suggested for you</p>
      <h1 id="suggestions-title">People worth following</h1>
      <p class="intro">Based on your conversations and communities on Commonly.</p>

      <div class="people-list">
        <article class="person">
          <div class="initials" aria-hidden="true">AM</div>
          <div class="person-copy">
            <p class="name">Avery Mercer</p>
            <p class="context">Followed by Rowan and 8 others</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </article>

        <article class="person">
          <div class="initials" aria-hidden="true">JL</div>
          <div class="person-copy">
            <p class="name">Jordan Lane</p>
            <p class="context">Active in Neighborhood Notes</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </article>

        <article class="person">
          <div class="initials" aria-hidden="true">SC</div>
          <div class="person-copy">
            <p class="name">Sydney Cole</p>
            <p class="context">Followed by Devon and 5 others</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </article>
      </div>

      <button class="view-all" type="button">See all suggestions</button>
    </section>
  </div>
</body>
</html>
