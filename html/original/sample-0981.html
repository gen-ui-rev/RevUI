<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save lesson to a list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e7e5e4;
      color: #292524;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #fafaf9;
    }

    .save-component {
      width: 100%;
    }

    .accent-line {
      width: 36px;
      height: 4px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #78716c;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .intro {
      margin: 8px 0 24px;
      color: #57534e;
      font-size: 14px;
      line-height: 1.5;
    }

    .lesson {
      padding: 16px 0;
      border-top: 1px solid #d6d3d1;
      border-bottom: 1px solid #d6d3d1;
    }

    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: #78716c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .lesson-title {
      display: block;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    fieldset {
      min-width: 0;
      margin: 24px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 8px;
      padding: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .location {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e7e5e4;
      cursor: pointer;
    }

    .location:first-of-type {
      border-top: 1px solid #e7e5e4;
    }

    .location input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      border: 1.5px solid #a8a29e;
      border-radius: 50%;
      background: #fafaf9;
    }

    .radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
    }

    .location input:checked + .radio {
      border-color: #78716c;
    }

    .location input:checked + .radio::after {
      background: #78716c;
    }

    .location-name {
      min-width: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .count {
      margin-left: auto;
      color: #78716c;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .save-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #78716c;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="save-component" aria-labelledby="save-title">
      <div class="accent-line" aria-hidden="true"></div>
      <h1 id="save-title">Save this lesson</h1>
      <p class="intro">Add it to a saved list so you can return to it later.</p>

      <div class="lesson">
        <span class="eyebrow">Current lesson</span>
        <span class="lesson-title">Talking About Weekend Plans</span>
      </div>

      <form>
        <fieldset>
          <legend>Choose a saved list</legend>

          <label class="location">
            <input type="radio" name="save-location" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Spanish practice</span>
            <span class="count">12 lessons</span>
          </label>

          <label class="location">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Review this week</span>
            <span class="count">5 lessons</span>
          </label>

          <label class="location">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="location-name">Conversation skills</span>
            <span class="count">8 lessons</span>
          </label>
        </fieldset>

        <button class="save-button" type="button">Save to Spanish practice</button>
      </form>
    </main>
  </div>
</body>
</html>
