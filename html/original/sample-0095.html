<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help &amp; Support — Noura Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d7d9dc;
      color: #25282b;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f0f1f2;
    }

    .topbar {
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid #e3e4e5;
    }

    .back-button {
      width: 34px;
      height: 34px;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: #f0f1f2;
      color: #464b4f;
    }

    .back-button svg {
      width: 19px;
      height: 19px;
    }

    .topbar-copy {
      min-width: 0;
    }

    .app-name {
      margin: 0 0 1px;
      color: #777c80;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 14px 16px 12px;
    }

    .search {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      margin-bottom: 17px;
      border: 1px solid #e5e6e7;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(28, 31, 33, 0.06);
      color: #74797d;
      font-size: 14px;
    }

    .search svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    section + section {
      margin-top: 15px;
    }

    .section-title {
      margin: 0 0 8px;
      color: #3c4043;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e6e7;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(28, 31, 33, 0.06);
    }

    .list-row {
      width: 100%;
      margin: 0;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-bottom: 1px solid #eceeef;
      background: transparent;
      color: #292c2f;
      font-family: inherit;
      text-align: left;
    }

    .list-row:last-child {
      border-bottom: 0;
    }

    .faq-row {
      min-height: 46px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.35;
    }

    .detail-row {
      min-height: 52px;
    }

    .row-copy {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      display: block;
      color: #292c2f;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
    }

    .row-meta {
      display: block;
      margin-top: 2px;
      color: #777c80;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .chevron {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #8a8f93;
    }

    .tabbar {
      flex: 0 0 68px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #ffffff;
      border-top: 1px solid #dfe1e2;
    }

    .tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #858a8e;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }

    .tab svg {
      width: 21px;
      height: 21px;
    }

    .tab.active {
      color: #4f5559;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: 0;
      width: 34px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: #5d6368;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-copy">
        <p class="app-name">Noura Health</p>
        <h1>Help &amp; Support</h1>
      </div>
    </header>

    <main>
      <div class="search" role="search" aria-label="Search help">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Search sleep, activity, or account help</span>
      </div>

      <section aria-labelledby="faq-title">
        <h2 class="section-title" id="faq-title">Frequently asked questions</h2>
        <div class="card">
          <button class="list-row faq-row" type="button">
            <span class="row-copy">Why is last night’s sleep data missing?</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row faq-row" type="button">
            <span class="row-copy">How do I change my daily step goal?</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row faq-row" type="button">
            <span class="row-copy">Can I edit a logged meal?</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row faq-row" type="button">
            <span class="row-copy">How is my recovery score calculated?</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row faq-row" type="button">
            <span class="row-copy">How do I connect a fitness tracker?</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section aria-labelledby="contact-title">
        <h2 class="section-title" id="contact-title">Contact support</h2>
        <div class="card">
          <button class="list-row detail-row" type="button">
            <span class="row-copy">
              <span class="row-title">Email the care team</span>
              <span class="row-meta">Replies within one business day</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row detail-row" type="button">
            <span class="row-copy">
              <span class="row-title">Call member support</span>
              <span class="row-meta">Mon–Fri, 8:00 AM–6:00 PM CT</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section aria-labelledby="guides-title">
        <h2 class="section-title" id="guides-title">Help guides</h2>
        <div class="card">
          <button class="list-row detail-row" type="button">
            <span class="row-copy">
              <span class="row-title">Getting started with Noura</span>
              <span class="row-meta">Account setup and health preferences</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row detail-row" type="button">
            <span class="row-copy">
              <span class="row-title">Understanding sleep insights</span>
              <span class="row-meta">Stages, trends, and sleep consistency</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="list-row detail-row" type="button">
            <span class="row-copy">
              <span class="row-title">Managing privacy and data</span>
              <span class="row-meta">Permissions, exports, and deletion</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.5V14H9.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Today</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V12M12 19V5M19 19V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Insights</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20C16.4 20 20 16.4 20 12C20 7.6 16.4 4 12 4C7.6 4 4 7.6 4 12C4 16.4 7.6 20 12 20Z" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 12H16M12 8V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Log</span>
      </div>
      <div class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/>
          <path d="M9.8 9.2C10 8 10.9 7.2 12.2 7.2C13.7 7.2 14.6 8.1 14.6 9.3C14.6 10.3 14.1 10.9 13.1 11.5C12.2 12 11.9 12.6 11.9 13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
        </svg>
        <span>Support</span>
      </div>
    </nav>
  </div>
</body>
</html>
