<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share lesson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --zinc-900:#18181b;
    --zinc-600:#52525b;
    --zinc-500:#71717a;
    --fill:rgba(63,63,70,0.07);
    --fill-strong:rgba(63,63,70,0.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e7e7ea;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    border-radius:6px;
    padding:26px 24px;
  }
  .handle{
    width:36px;
    height:4px;
    border-radius:6px;
    background:var(--fill-strong);
    margin:0 auto 22px;
  }
  h1{
    margin:0 0 4px;
    font-size:20px;
    font-weight:600;
    color:var(--zinc-900);
    letter-spacing:-0.01em;
  }
  .sub{
    margin:0 0 18px;
    font-size:13px;
    font-weight:400;
    color:var(--zinc-500);
  }
  .preview{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--fill);
    border-radius:6px;
    padding:12px;
    margin-bottom:24px;
  }
  .thumb{
    width:52px;
    height:52px;
    border-radius:6px;
    background:#a1a1aa;
    flex:none;
  }
  .preview-text{min-width:0;}
  .preview-title{
    font-size:14px;
    font-weight:600;
    color:var(--zinc-900);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .preview-meta{
    margin-top:3px;
    font-size:12px;
    font-weight:400;
    color:var(--zinc-500);
  }
  .label{
    font-size:12px;
    font-weight:600;
    color:var(--zinc-500);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 0;
  }
  .avatar{
    width:36px;
    height:36px;
    border-radius:6px;
    background:#c4c4c9;
    flex:none;
  }
  .who{flex:1;min-width:0;}
  .name{
    font-size:14px;
    font-weight:600;
    color:var(--zinc-900);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detail{
    margin-top:2px;
    font-size:12px;
    font-weight:400;
    color:var(--zinc-500);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .send{
    flex:none;
    font-size:13px;
    font-weight:600;
    color:var(--zinc-900);
    background:var(--fill);
    border-radius:6px;
    padding:7px 14px;
  }
  .sent{
    color:var(--zinc-500);
    background:transparent;
  }
  .link{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    background:var(--fill);
    border-radius:6px;
    padding:14px 14px;
  }
  .link svg{flex:none;color:var(--zinc-600);}
  .link-url{
    flex:1;
    min-width:0;
    font-size:13px;
    font-weight:400;
    color:var(--zinc-600);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .link-action{
    flex:none;
    font-size:13px;
    font-weight:600;
    color:var(--zinc-900);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="handle"></div>
    <h1>Share this lesson</h1>
    <p class="sub">Anyone with the link can preview the first two exercises.</p>

    <div class="preview">
      <div class="thumb"></div>
      <div class="preview-text">
        <div class="preview-title">Past Tense in Conversation</div>
        <div class="preview-meta">Spanish B1 · Unit 4 · 18 min</div>
      </div>
    </div>

    <div class="label">Send to</div>

    <div class="row">
      <div class="avatar"></div>
      <div class="who">
        <div class="name">Marta Delgado</div>
        <div class="detail">Study group · Tuesdays</div>
      </div>
      <div class="send">Send</div>
    </div>

    <div class="row">
      <div class="avatar"></div>
      <div class="who">
        <div class="name">Owen Brackett</div>
        <div class="detail">Sent a lesson March 2</div>
      </div>
      <div class="send sent">Sent</div>
    </div>

    <div class="row">
      <div class="avatar"></div>
      <div class="who">
        <div class="name">Priya Raman</div>
        <div class="detail">Tutor · Spanish B1</div>
      </div>
      <div class="send">Send</div>
    </div>

    <div class="link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path>
        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path>
      </svg>
      <div class="link-url">lumenpath.co/l/past-tense-4</div>
      <div class="link-action">Copy</div>
    </div>
  </div>
</body>
</html>
