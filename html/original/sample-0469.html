<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Return Items</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe5e3;
      color: #172321;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 20px;
      background: #f4f7f6;
    }

    .select-panel {
      width: 100%;
      background: #ffffff;
      border: 1px solid #bfcac7;
      border-radius: 0;
    }

    .panel-heading {
      padding: 20px;
      background: #087c74;
      color: #ffffff;
    }

    .panel-heading h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
    }

    .panel-heading p {
      margin: 6px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: #dff4f1;
    }

    .selection-control,
    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .selection-control {
      padding: 13px 16px;
      border-bottom: 1px solid #d8dfdd;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .item-row {
      padding: 14px 16px;
      border-bottom: 1px solid #d8dfdd;
    }

    .item-row.selected {
      background: #f0f8f7;
    }

    .selector {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #71817e;
      border-radius: 0;
      background: #ffffff;
      color: #ffffff;
    }

    .selector.checked {
      border-color: #087c74;
      background: #087c74;
    }

    .selector.indeterminate {
      border-color: #087c74;
      color: #087c74;
    }

    .selector svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .item-copy {
      min-width: 0;
    }

    .item-name {
      margin: 0;
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      color: #172321;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-detail {
      margin: 4px 0 0;
      font-size: 14px;
      line-height: 18px;
      color: #60706d;
    }

    .panel-footer {
      padding: 16px;
    }

    .selection-count {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      color: #4f605d;
    }

    .selection-count strong {
      color: #087c74;
      font-weight: 700;
    }

    .continue-button {
      width: 100%;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1px solid #087c74;
      border-radius: 0;
      background: #087c74;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="select-panel" aria-labelledby="return-title">
      <header class="panel-heading">
        <h1 id="return-title">Select items to return</h1>
        <p>Order CL-48271 · Delivered May 14</p>
      </header>

      <div class="selection-control">
        <span class="selector indeterminate" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </span>
        <span>Select all eligible items</span>
      </div>

      <div class="item-row selected">
        <span class="selector checked" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M3 8.2L6.3 11.3L13 4.7" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </span>
        <div class="item-copy">
          <p class="item-name">Linen Blend Overshirt</p>
          <p class="item-detail">Price $68.00 · Quantity 1</p>
        </div>
      </div>

      <div class="item-row selected">
        <span class="selector checked" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M3 8.2L6.3 11.3L13 4.7" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </span>
        <div class="item-copy">
          <p class="item-name">Stoneware Serving Bowl</p>
          <p class="item-detail">Price $34.00 · Quantity 1</p>
        </div>
      </div>

      <div class="item-row">
        <span class="selector" aria-hidden="true"></span>
        <div class="item-copy">
          <p class="item-name">Canvas Market Tote</p>
          <p class="item-detail">Price $22.00 · Quantity 1</p>
        </div>
      </div>

      <footer class="panel-footer">
        <p class="selection-count"><strong>2 of 3 items</strong> selected</p>
        <button class="continue-button" type="button">Choose return reason</button>
      </footer>
    </section>
  </div>
</body>
</html>
