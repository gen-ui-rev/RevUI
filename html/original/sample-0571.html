<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #ecebee;
    font-family: 'Poppins', system-ui, sans-serif;
    color: #1c1b20;
  }
  .screen {
    width: 390px;
    background: #ffffff;
    padding: 26px 20px;
  }
  .inner { width: 100%; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .title { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; }
  .count { font-size: 12px; color: #6d6b76; white-space: nowrap; }
  .sub {
    margin-top: 4px;
    font-size: 13px;
    color: #6d6b76;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rule { height: 1px; background: #e5e4e9; margin: 20px 0; }

  .grouplabel {
    font-size: 12px;
    font-weight: 500;
    color: #8a8894;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tiles { display: flex; gap: 12px; margin-top: 12px; }
  .tile {
    width: 76px;
    padding: 12px 6px 10px;
    border: 1px solid #e0dfe5;
    border-radius: 4px;
    text-align: center;
    color: #3d3b45;
  }
  .tile svg { display: block; margin: 0 auto 8px; }
  .tile span { display: block; font-size: 12px; font-weight: 500; }
  .tile.on {
    background: #6d28d9;
    border-color: #6d28d9;
    color: #ffffff;
  }

  .rows { margin-top: 8px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }
  .mono {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    background: #f0eef6;
    color: #4f3b8c;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .who { min-width: 0; flex: 1; }
  .name {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meta {
    font-size: 12px;
    color: #6d6b76;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .picked { flex: 0 0 auto; }

  .place {
    display: block;
    width: 100%;
    background: #6d28d9;
    color: #ffffff;
    border: 0;
    border-radius: 4px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }
  .hint { margin-top: 10px; font-size: 12px; color: #8a8894; text-align: center; }
</style>
</head>
<body>
  <div class="screen">
    <div class="inner">

      <div class="head">
        <div class="title">Stickers</div>
        <div class="count">2 placed</div>
      </div>
      <div class="sub">Board snapshot — Sprint 24 retro</div>

      <div class="rule"></div>

      <div class="grouplabel">Status stamps</div>
      <div class="tiles">
        <div class="tile on">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span>Approved</span>
        </div>
        <div class="tile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
          <span>Blocked</span>
        </div>
        <div class="tile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span>Review</span>
        </div>
        <div class="tile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-11.9 7.8L4 21l1.3-4.7A8.5 8.5 0 1 1 21 12z"/><path d="M12 14v-.6c0-1 1.6-1.3 1.6-2.6A1.7 1.7 0 0 0 10.5 10"/></svg>
          <span>Question</span>
        </div>
      </div>

      <div class="rule"></div>

      <div class="grouplabel">Tag a teammate</div>
      <div class="rows">
        <div class="row">
          <div class="mono">DW</div>
          <div class="who">
            <div class="name">Dana Whitfield</div>
            <div class="meta">Design lead · 4 open comments</div>
          </div>
          <div class="picked">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
        </div>
        <div class="row">
          <div class="mono">MO</div>
          <div class="who">
            <div class="name">Marcus Oyelaran</div>
            <div class="meta">Engineering · 1 open comment</div>
          </div>
        </div>
        <div class="row">
          <div class="mono">PR</div>
          <div class="who">
            <div class="name">Priya Raman</div>
            <div class="meta">Quality · no open comments</div>
          </div>
        </div>
      </div>

      <div class="rule"></div>

      <button class="place" type="button">Place approved stamp</button>
      <div class="hint">Drag on the snapshot to reposition</div>

    </div>
  </div>
</body>
</html>
