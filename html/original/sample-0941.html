<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1e3;
      color: #202225;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #eceeef;
    }

    .error-card {
      width: 100%;
      padding: 32px 24px 28px;
      text-align: center;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(31, 34, 38, 0.09);
    }

    .error-mark {
      width: 52px;
      margin: 0 auto 24px;
      color: #62676d;
    }

    .error-mark svg {
      display: block;
      width: 52px;
      height: 52px;
    }

    .label {
      margin: 0 0 8px;
      color: #62676d;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202225;
      font-size: 23px;
      font-weight: 700;
      line-height: 1.3;
    }

    .message {
      margin: 14px auto 0;
      max-width: 270px;
      color: #666b71;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    .retry-button {
      width: 100%;
      margin-top: 26px;
      padding: 13px 18px;
      border: 1px solid #34383d;
      border-radius: 4px;
      background: #34383d;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #555a60;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-mark" aria-hidden="true">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="50" height="50" rx="3" fill="#F1F2F3" stroke="#B7BBC0" stroke-width="2"/>
          <path d="M26 15V29" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="26" cy="37" r="2" fill="currentColor"/>
        </svg>
      </div>
      <p class="label">Threadwell message error</p>
      <h1 id="error-title">We couldn’t load this conversation</h1>
      <p class="message">A temporary connection issue stopped the messages from opening. Your conversation is still saved.</p>
      <button class="retry-button" type="button">Try again</button>
      <a class="back-link" href="#">Return to messages</a>
    </section>
  </div>
</body>
</html>
