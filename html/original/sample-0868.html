<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketmoor — Delivery Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#c8791a;
    --amber-soft:#f6e3c8;
    --ink:#1d1b18;
    --mute:#7a746c;
  }
  html,body{margin:0;}
  body{
    background:#e8e6e2;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#e8e6e2;
    padding:44px 0;
    box-sizing:border-box;
  }
  .banner{
    width:334px;
    margin:0 auto;
    background:#ffffff;
    border-radius:6px;
    box-shadow:0 6px 18px rgba(29,27,24,0.10);
    padding:18px 20px 20px;
    box-sizing:border-box;
  }
  .top{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mark{
    width:20px;height:20px;
    background:var(--amber);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .brand{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.10em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .stamp{
    margin-left:auto;
    font-size:12px;
    color:var(--mute);
  }
  .eyebrow{
    margin:16px 0 4px;
    font-size:13px;
    color:var(--mute);
  }
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:27px;
    line-height:1.15;
    margin:0;
    color:var(--ink);
  }
  .status{
    margin:7px 0 0;
    font-size:15px;
    color:var(--amber);
    font-weight:600;
  }
  .track{
    margin-top:18px;
    height:6px;
    width:100%;
    background:var(--amber-soft);
    border-radius:6px;
    overflow:hidden;
  }
  .track span{
    display:block;
    height:100%;
    width:72%;
    background:var(--amber);
    border-radius:6px;
  }
  .steps{
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--mute);
  }
  .steps .on{color:var(--ink);font-weight:600;}
  .foot{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid #eceae6;
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .foot .label{
    font-size:12px;
    color:var(--mute);
    display:block;
    margin-bottom:2px;
  }
  .foot .value{
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .foot .col{min-width:0;}
  .foot .right{margin-left:auto;text-align:right;flex:0 0 auto;}
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="top">
        <div class="mark" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h16l-1.4 12H5.4L4 8z"/>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
          </svg>
        </div>
        <div class="brand">Marketmoor</div>
        <div class="stamp">Updated 2 min ago</div>
      </div>

      <p class="eyebrow">Order 48-20713</p>
      <h1>Arriving by 3:40 PM</h1>
      <p class="status">Out for delivery — 4 stops away</p>

      <div class="track"><span></span></div>
      <div class="steps">
        <span>Packed</span>
        <span>Shipped</span>
        <span class="on">Out for delivery</span>
        <span>Delivered</span>
      </div>

      <div class="foot">
        <div class="col">
          <span class="label">Courier</span>
          <span class="value">Dana Ruskin</span>
        </div>
        <div class="col right">
          <span class="label">Items</span>
          <span class="value">3</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
