<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Fund Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfd9;
      color: #25271f;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 28px;
      background: #f5f4ef;
    }

    .progress-card {
      width: 100%;
      padding: 24px;
      border: 1px solid #d4d5cb;
      border-radius: 4px;
      background: #fbfaf6;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f762f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .goal-note {
      margin: 7px 0 0;
      color: #696b62;
      font-size: 14px;
      line-height: 1.45;
    }

    .ring-wrap {
      position: relative;
      width: 178px;
      margin: 24px auto 18px;
    }

    .ring-wrap svg {
      display: block;
      width: 178px;
      height: 178px;
    }

    .ring-track {
      fill: none;
      stroke: #e2e2d8;
      stroke-width: 10;
    }

    .ring-value {
      fill: none;
      stroke: #747b35;
      stroke-width: 10;
      stroke-linecap: butt;
      stroke-dasharray: 299 440;
      transform: rotate(-90deg);
      transform-origin: 89px 89px;
    }

    .ring-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percent {
      font-size: 36px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .percent-label {
      margin-top: 6px;
      color: #696b62;
      font-size: 12px;
      line-height: 1.2;
    }

    .amount {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .amount span {
      color: #696b62;
      font-weight: 400;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 22px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid #d4d5cb;
    }

    .detail-label {
      margin: 0 0 4px;
      color: #696b62;
      font-size: 12px;
      line-height: 1.3;
    }

    .detail-value {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="progress-card" aria-labelledby="goal-title">
      <p class="eyebrow">Cedar Ledger goal</p>
      <h1 id="goal-title">Emergency fund</h1>
      <p class="goal-note">Build six months of essential expenses.</p>

      <div class="ring-wrap" role="img" aria-label="Emergency fund is 68 percent complete">
        <svg viewBox="0 0 178 178" aria-hidden="true">
          <circle class="ring-track" cx="89" cy="89" r="70"></circle>
          <circle class="ring-value" cx="89" cy="89" r="70"></circle>
        </svg>
        <div class="ring-copy">
          <div class="percent">68%</div>
          <div class="percent-label">of goal saved</div>
        </div>
      </div>

      <p class="amount">$8,160 <span>of $12,000</span></p>

      <div class="details">
        <div>
          <p class="detail-label">Remaining</p>
          <p class="detail-value">$3,840</p>
        </div>
        <div>
          <p class="detail-label">Target date</p>
          <p class="detail-value">November 2026</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
