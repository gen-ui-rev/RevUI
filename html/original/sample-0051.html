<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamstead Booking Hold Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e3dd;
      color: #332f2b;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 24px 32px;
      background: #f6f3ee;
    }

    .booking-hold {
      width: 326px;
      background: #fffdf9;
      border-radius: 6px;
    }

    .hotel-photo {
      width: 326px;
      height: 96px;
      display: block;
      object-fit: cover;
      background: #d7d0c7;
      border-radius: 6px 6px 0 0;
    }

    .content {
      padding: 20px;
    }

    .service-label {
      margin: 0;
      color: #7c6958;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      color: #665243;
      font-size: 26px;
      line-height: 31px;
      font-weight: 600;
    }

    .intro {
      margin: 4px 0 0;
      font-size: 14px;
      line-height: 21px;
    }

    .timer {
      margin-top: 16px;
      padding: 14px 16px;
      text-align: center;
      background: rgba(143, 121, 101, 0.16);
      border-radius: 6px;
    }

    .timer-label,
    .timer-note {
      margin: 0;
      color: #665b51;
      font-size: 14px;
      line-height: 18px;
    }

    .timer-value {
      margin: 2px 0;
      color: #59483b;
      font-size: 52px;
      line-height: 62px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .stay-details {
      margin: 16px 0 0;
      font-size: 14px;
      line-height: 21px;
    }

    .primary-action,
    .secondary-action {
      width: 100%;
      border: 0;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }

    .primary-action {
      margin-top: 18px;
      padding: 12px 16px;
      background: rgba(143, 121, 101, 0.24);
      color: #493a30;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
    }

    .secondary-action {
      margin-top: 10px;
      padding: 0;
      background: transparent;
      color: #75685d;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="booking-hold" aria-labelledby="hold-title">
      <img
        class="hotel-photo"
        src="https://loremflickr.com/326/96/hotel?lock=1670"
        width="326"
        height="96"
        alt="Sunlit terrace at the Tidecourt Hotel in Lisbon"
      >
      <div class="content">
        <p class="service-label">Roamstead booking hold</p>
        <h1 id="hold-title">Keep your Lisbon room</h1>
        <p class="intro">Your selected room is held while you finish booking.</p>

        <div class="timer" role="timer" aria-label="18 minutes and 42 seconds remaining">
          <p class="timer-label">Time remaining</p>
          <p class="timer-value">18:42</p>
          <p class="timer-note">Hold expires at 4:30 PM</p>
        </div>

        <p class="stay-details">Tidecourt Hotel · May 18–21, 2026 · 2 guests</p>

        <button class="primary-action" type="button">Continue booking</button>
        <button class="secondary-action" type="button">Release this room</button>
      </div>
    </article>
  </div>
</body>
</html>
