<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Serevia Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eaf0;
      color: #202235;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      flex: 0 0 390px;
      background: #ffffff;
      border: 1px solid #d8dae4;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 24px 15px;
      border-bottom: 1px solid #e2e3ea;
    }

    .service-name {
      margin: 0;
      color: #27235f;
      font-size: 19px;
      line-height: 27px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .help-link {
      color: #4c46a8;
      font-size: 14px;
      line-height: 22px;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-tabs {
      display: flex;
      padding: 0 24px;
      border-bottom: 1px solid #e2e3ea;
    }

    .auth-tab {
      position: relative;
      flex: 1;
      padding: 14px 8px 13px;
      color: #686b7b;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }

    .auth-tab.active {
      color: #4338a3;
    }

    .auth-tab.active::after {
      position: absolute;
      right: 8px;
      bottom: -1px;
      left: 8px;
      height: 2px;
      background: #4b43ad;
      content: "";
    }

    main {
      padding: 36px 28px 72px;
    }

    h1 {
      margin: 0;
      color: #1f2131;
      font-size: 30px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .intro {
      margin: 10px 0 0;
      color: #626575;
      font-size: 15px;
      line-height: 22px;
      font-weight: 400;
    }

    .credentials {
      margin-top: 28px;
    }

    .field-group + .field-group {
      margin-top: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #323545;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .text-input,
    .password-wrap {
      width: 100%;
      border: 1px solid #cfd1dc;
      border-radius: 6px;
      background: #ffffff;
    }

    .text-input {
      padding: 13px 14px;
      color: #242634;
      font-size: 15px;
      line-height: 22px;
      outline: none;
    }

    .text-input:focus,
    .password-wrap:focus-within {
      border-color: #4b43ad;
    }

    .password-wrap {
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      min-width: 0;
      flex: 1;
      padding: 13px 8px 13px 14px;
      border: 0;
      outline: none;
      background: transparent;
      color: #242634;
      font-size: 15px;
      line-height: 22px;
    }

    .visibility-button {
      width: 43px;
      padding: 10px 13px 8px 8px;
      border: 0;
      background: transparent;
      color: #696c7d;
      cursor: pointer;
    }

    .visibility-button svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .forgot-row {
      margin-top: 9px;
      text-align: right;
    }

    .text-link {
      color: #4b43ad;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary-button {
      width: 100%;
      margin-top: 21px;
      padding: 14px 16px;
      border: 1px solid #433a9f;
      border-radius: 6px;
      background: #4b43ad;
      color: #ffffff;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 23px 0 20px;
      color: #797c8b;
      font-size: 12px;
      line-height: 18px;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      background: #e0e1e8;
      content: "";
    }

    .alternate-title {
      margin: 0 0 11px;
      color: #383a49;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .secondary-button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cfd1dc;
      border-radius: 6px;
      background: #ffffff;
      color: #343647;
      font-size: 14px;
      line-height: 22px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .secondary-button + .secondary-button {
      margin-top: 10px;
    }

    .account-note {
      margin: 22px 0 0;
      color: #666978;
      font-size: 14px;
      line-height: 21px;
      text-align: center;
    }

    .legal {
      position: absolute;
      right: 28px;
      bottom: 24px;
      left: 28px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }

    .legal a {
      color: #6f7280;
      font-size: 12px;
      line-height: 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <p class="service-name">Serevia Health</p>
      <a class="help-link" href="#">Help</a>
    </header>

    <nav class="auth-tabs" aria-label="Account access">
      <a class="auth-tab active" href="#" aria-current="page">Sign in</a>
      <a class="auth-tab" href="#">Create account</a>
    </nav>

    <main>
      <section aria-labelledby="sign-in-heading">
        <h1 id="sign-in-heading">Sign in</h1>
        <p class="intro">Access your recovery plan, sleep records, and activity history.</p>

        <form class="credentials">
          <div class="field-group">
            <label for="email">Email address</label>
            <input class="text-input" id="email" name="email" type="email" value="avery.holt@sereviamail.com" autocomplete="email">
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" value="Riverstone84" autocomplete="current-password">
              <button class="visibility-button" type="button" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.75 12s3.25-5 9.25-5 9.25 5 9.25 5-3.25 5-9.25 5-9.25-5-9.25-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot-row">
            <a class="text-link" href="#">Forgot password?</a>
          </div>

          <button class="primary-button" type="submit">Sign in</button>
        </form>
      </section>

      <div class="divider">Other sign-in options</div>

      <section aria-labelledby="alternate-heading">
        <h2 class="alternate-title" id="alternate-heading">Access an existing account</h2>
        <button class="secondary-button" type="button">Use a one-time email code</button>
        <button class="secondary-button" type="button">Use a member ID</button>
      </section>

      <p class="account-note">New to Serevia Health? <a class="text-link" href="#">Create an account</a></p>
    </main>

    <footer class="legal">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Accessibility</a>
    </footer>
  </div>
</body>
</html>
