<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Trailnest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ece9eb;
      color: #242126;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffdfd;
      border: 1px solid #d8d3d6;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #dfdadd;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #3b363b;
      background: transparent;
      border: 0;
      border-radius: 0;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      background: #a77590;
    }

    .help-link {
      justify-self: end;
      color: #6c4a5d;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #dfdadd;
    }

    .auth-tab {
      position: relative;
      padding: 17px 12px 15px;
      color: #716b70;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }

    .auth-tab.active {
      color: #7f4e68;
      font-weight: 700;
    }

    .auth-tab.active::after {
      content: "";
      position: absolute;
      right: 24px;
      bottom: -1px;
      left: 24px;
      height: 3px;
      background: #965f7d;
    }

    main {
      flex: 1;
      padding: 30px 24px 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #87566f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #262126;
      font-size: 31px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .intro {
      max-width: 320px;
      margin: 12px 0 28px;
      color: #686267;
      font-size: 15px;
      line-height: 1.55;
    }

    .field {
      margin-bottom: 20px;
    }

    .label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    label {
      color: #393439;
      font-size: 14px;
      font-weight: 700;
    }

    .text-link {
      color: #82516a;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      color: #2f2a2f;
      background: #fffdfd;
      border: 1px solid #aaa3a8;
      border-radius: 0;
      outline: none;
      font-size: 15px;
    }

    .password-input {
      padding-right: 52px;
      letter-spacing: 0.13em;
    }

    .reveal-button {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #625b60;
      background: transparent;
      border: 0;
      border-radius: 0;
      cursor: pointer;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      height: 52px;
      border-radius: 0;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      margin-top: 4px;
      color: #ffffff;
      background: #89566f;
      border: 1px solid #89566f;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 25px 0 21px;
      color: #817a7f;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #dfdadd;
    }

    .secondary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #4c454a;
      background: transparent;
      border: 1px solid #aaa3a8;
    }

    .signup-boundary {
      margin: 25px 0 0;
      padding-top: 21px;
      border-top: 1px solid #dfdadd;
      color: #655f63;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .signup-boundary a {
      margin-left: 4px;
      color: #7f4e68;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 18px 20px 20px;
      border-top: 1px solid #e4dfe2;
    }

    .footer a {
      color: #746e72;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>

      <div class="brand" aria-label="Trailnest">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Trailnest</span>
      </div>

      <a class="help-link" href="#">Help</a>
    </header>

    <nav class="auth-tabs" aria-label="Account access">
      <button class="auth-tab active" type="button" aria-current="page">Sign in</button>
      <button class="auth-tab" type="button">Create account</button>
    </nav>

    <main>
      <p class="eyebrow">Existing account</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to review your stays, saved routes, and upcoming reservations.</p>

      <form>
        <div class="field">
          <div class="label-row">
            <label for="email">Email address</label>
          </div>
          <input id="email" type="email" value="mara.holden@example.com" autocomplete="email">
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a class="text-link" href="#">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input class="password-input" id="password" type="text" value="••••••••••" aria-label="Password" autocomplete="current-password">
            <button class="reveal-button" type="button" aria-label="Show password">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3.5 12C5.4 8.7 8.2 7 12 7C15.8 7 18.6 8.7 20.5 12C18.6 15.3 15.8 17 12 17C8.2 17 5.4 15.3 3.5 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="primary-button" type="submit">Sign in</button>

        <div class="divider">Or</div>

        <button class="secondary-button" type="button">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="14" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 6L12 12.5L20 6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
          </svg>
          Use a one-time email code
        </button>
      </form>

      <p class="signup-boundary">
        New to Trailnest?
        <a href="#">Create an account</a>
      </p>
    </main>

    <footer class="footer">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Accessibility</a>
    </footer>
  </div>
</body>
</html>
