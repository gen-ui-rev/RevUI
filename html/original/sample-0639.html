<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #f8fafc;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 64px 24px;
      background: #f3f4f6;
    }

    .island {
      width: 100%;
      padding: 18px;
      background: #111418;
      border-radius: 4px;
    }

    .activity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
    }

    .service svg {
      flex: 0 0 auto;
      color: #38bdf8;
    }

    .service-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-label {
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-block {
      padding: 14px;
      background: rgba(56, 189, 248, 0.14);
      border-radius: 4px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .status-copy {
      min-width: 0;
    }

    .status-copy h1 {
      margin: 0 0 4px;
      color: #f8fafc;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 700;
    }

    .status-copy p {
      margin: 0;
      color: #bae6fd;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
    }

    .courier {
      flex: 0 0 auto;
      width: 38px;
      padding: 9px 0;
      background: rgba(56, 189, 248, 0.22);
      border-radius: 4px;
      color: #e0f2fe;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .progress {
      margin-top: 14px;
      background: rgba(125, 211, 252, 0.18);
      border-radius: 4px;
    }

    .progress-fill {
      width: 76%;
      padding-top: 4px;
      background: #38bdf8;
      border-radius: 4px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.4;
    }

    .detail-row span:last-child {
      color: #cbd5e1;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="island" aria-label="Expanded delivery activity">
      <div class="activity-head">
        <div class="service">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 8.5h14v10.25A1.25 1.25 0 0 1 17.75 20H6.25A1.25 1.25 0 0 1 5 18.75V8.5Z" fill="currentColor"/>
            <path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2" stroke="#111418" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="service-name">Clover Cart</span>
        </div>
        <span class="live-label">Live</span>
      </div>

      <div class="status-block">
        <div class="status-row">
          <div class="status-copy">
            <h1>Arriving in 18–24 min</h1>
            <p>Your order is 6 stops away</p>
          </div>
          <div class="courier" aria-label="Courier Mara Tate">MT</div>
        </div>

        <div class="progress" aria-label="Delivery progress: 76 percent">
          <div class="progress-fill"></div>
        </div>

        <div class="detail-row">
          <span>Order CC-4821</span>
          <span>Mara Tate</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
