<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select dates — Wayfare Stays</title>
<style>
  :root{
    --ink:#1c2024;
    --muted:#6b7280;
    --line:#e6e8eb;
    --band:#edeff1;
    --accent:#232a31;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#f0f1f3;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    padding:24px 20px;
    background:#f0f1f3;
  }
  .card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 20px rgba(20,24,28,.09);
    padding:20px 18px 18px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 4px;
  }
  h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 16px;
    letter-spacing:-.01em;
  }
  .range{
    display:flex;
    align-items:stretch;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .leg{
    flex:1 1 0;
    padding:10px 12px;
    min-width:0;
  }
  .leg + .leg{border-left:1px solid var(--line)}
  .leg .lbl{
    font-size:12px;
    color:var(--muted);
    margin:0 0 3px;
  }
  .leg .val{
    font-size:15px;
    font-weight:600;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .leg.active{background:#f7f8f9}
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 6px;
  }
  .month{
    font-size:15px;
    font-weight:600;
  }
  .navbtns{display:flex;gap:6px}
  .nb{
    width:30px;height:30px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .nb.off{color:#c3c7cc}
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .dow{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px 0 6px;
  }
  .cell{
    position:relative;
    height:42px;
  }
  .band{
    position:absolute;
    top:3px;bottom:3px;left:0;right:0;
    background:var(--band);
  }
  .cell.start .band{left:4px;border-radius:10px 0 0 10px}
  .cell.end .band{right:4px;border-radius:0 10px 10px 0}
  .num{
    position:absolute;
    top:3px;left:50%;
    transform:translateX(-50%);
    width:36px;height:36px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .cell.edge .num{
    background:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .cell.past .num{color:#c3c7cc}
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border-top:1px solid var(--line);
    margin-top:14px;
    padding-top:14px;
  }
  .nights{
    font-size:15px;
    font-weight:600;
    margin:0 0 3px;
  }
  .rate{
    font-size:12px;
    color:var(--muted);
    margin:0;
  }
  .cta{
    border:0;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    padding:12px 20px;
    border-radius:10px;
    font-family:inherit;
  }
  .note{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin:12px 4px 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Harbor Loft · Lisbon</p>
      <h1>Select your stay</h1>

      <div class="range">
        <div class="leg">
          <p class="lbl">Check-in</p>
          <p class="val">Fri, Apr 11</p>
        </div>
        <div class="leg active">
          <p class="lbl">Check-out</p>
          <p class="val">Tue, Apr 15</p>
        </div>
      </div>

      <div class="nav">
        <span class="month">April 2025</span>
        <div class="navbtns">
          <span class="nb off" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </span>
          <span class="nb" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </div>
      </div>

      <div class="grid">
        <div class="dow">Su</div><div class="dow">Mo</div><div class="dow">Tu</div>
        <div class="dow">We</div><div class="dow">Th</div><div class="dow">Fr</div><div class="dow">Sa</div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell past"><span class="num">1</span></div>
        <div class="cell past"><span class="num">2</span></div>
        <div class="cell"><span class="num">3</span></div>
        <div class="cell"><span class="num">4</span></div>
        <div class="cell"><span class="num">5</span></div>

        <div class="cell"><span class="num">6</span></div>
        <div class="cell"><span class="num">7</span></div>
        <div class="cell"><span class="num">8</span></div>
        <div class="cell"><span class="num">9</span></div>
        <div class="cell"><span class="num">10</span></div>
        <div class="cell start edge"><span class="band"></span><span class="num">11</span></div>
        <div class="cell"><span class="band"></span><span class="num">12</span></div>

        <div class="cell"><span class="band"></span><span class="num">13</span></div>
        <div class="cell"><span class="band"></span><span class="num">14</span></div>
        <div class="cell end edge"><span class="band"></span><span class="num">15</span></div>
        <div class="cell"><span class="num">16</span></div>
        <div class="cell"><span class="num">17</span></div>
        <div class="cell"><span class="num">18</span></div>
        <div class="cell"><span class="num">19</span></div>

        <div class="cell"><span class="num">20</span></div>
        <div class="cell"><span class="num">21</span></div>
        <div class="cell"><span class="num">22</span></div>
        <div class="cell"><span class="num">23</span></div>
        <div class="cell"><span class="num">24</span></div>
        <div class="cell"><span class="num">25</span></div>
        <div class="cell"><span class="num">26</span></div>

        <div class="cell"><span class="num">27</span></div>
        <div class="cell"><span class="num">28</span></div>
        <div class="cell"><span class="num">29</span></div>
        <div class="cell"><span class="num">30</span></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>

      <div class="foot">
        <div>
          <p class="nights">4 nights</p>
          <p class="rate">$149 per night · $596 before taxes</p>
        </div>
        <button class="cta" type="button">Confirm</button>
      </div>
    </div>
    <p class="note">Check-in from 3:00 PM. Minimum stay is 2 nights.</p>
  </div>
</body>
</html>
