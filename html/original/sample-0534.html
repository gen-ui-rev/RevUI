<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Plan Saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebeb;
      color: #193334;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f2f4f4;
    }

    .success-card {
      width: 100%;
      padding: 30px 26px 26px;
      text-align: center;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(27, 53, 54, 0.09);
    }

    .celebration {
      display: block;
      width: 112px;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      color: #123d3d;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -0.5px;
    }

    .message {
      margin: 12px auto 0;
      max-width: 270px;
      color: #5f7070;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .plan-detail {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e2e8e8;
    }

    .plan-label {
      margin: 0 0 5px;
      color: #758383;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .plan-value {
      margin: 0;
      color: #203b3c;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    .done-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 18px;
      border: 0;
      border-radius: 6px;
      background: #138b87;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="success-card" aria-labelledby="success-title">
      <svg class="celebration" viewBox="0 0 112 88" role="img" aria-label="Success">
        <path d="M18 27l-7-5" fill="none" stroke="#45aaa6" stroke-width="3" stroke-linecap="round"/>
        <path d="M25 14l-2-8" fill="none" stroke="#138b87" stroke-width="3" stroke-linecap="round"/>
        <path d="M94 27l7-5" fill="none" stroke="#45aaa6" stroke-width="3" stroke-linecap="round"/>
        <path d="M87 14l2-8" fill="none" stroke="#138b87" stroke-width="3" stroke-linecap="round"/>
        <path d="M10 48l-7 2" fill="none" stroke="#8cc9c6" stroke-width="3" stroke-linecap="round"/>
        <path d="M102 48l7 2" fill="none" stroke="#8cc9c6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="12" cy="11" r="3" fill="#138b87"/>
        <circle cx="100" cy="11" r="3" fill="#138b87"/>
        <rect x="18" y="65" width="6" height="6" rx="1" fill="#8cc9c6" transform="rotate(18 21 68)"/>
        <rect x="88" y="65" width="6" height="6" rx="1" fill="#8cc9c6" transform="rotate(-18 91 68)"/>
        <circle cx="56" cy="45" r="31" fill="#138b87"/>
        <path d="M42 45.5l9 9L70.5 35" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 id="success-title">Sleep plan saved</h1>
      <p class="message">Your new bedtime schedule is set and will begin with tonight’s reminder.</p>

      <div class="plan-detail">
        <p class="plan-label">Next reminder</p>
        <p class="plan-value">Tonight at 10:30 PM</p>
      </div>

      <button class="done-button" type="button">Done</button>
    </main>
  </div>
</body>
</html>
