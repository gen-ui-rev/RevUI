<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggested Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8eceb;
      color: #182321;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #fafcfb;
    }

    .suggestions {
      width: 100%;
    }

    .section-mark {
      width: 36px;
      height: 4px;
      margin-bottom: 14px;
      background: #087f75;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 8px 0 20px;
      color: #66736f;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .people {
      border-top: 1px solid #d5ddda;
    }

    .person {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #d5ddda;
    }

    .portrait {
      width: 48px;
      height: 48px;
      background: #c6ded9;
    }

    .person:nth-child(2) .portrait {
      background: #d8d5c8;
    }

    .person:nth-child(3) .portrait {
      background: #cbd7df;
    }

    .person:nth-child(4) .portrait {
      background: #dfd0d5;
    }

    .details {
      min-width: 0;
    }

    .name {
      margin: 0 0 4px;
      overflow: hidden;
      color: #182321;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context {
      margin: 0;
      overflow: hidden;
      color: #74807c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .follow {
      min-width: 70px;
      border: 1px solid #087f75;
      border-radius: 0;
      padding: 8px 11px;
      background: #087f75;
      color: #ffffff;
      font: 600 12px/1.2 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: center;
    }

    .view-all {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      color: #087f75;
      font: 600 14px/1.4 'Plus Jakarta Sans', system-ui, sans-serif;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="suggestions" aria-labelledby="suggestions-title">
      <div class="section-mark" aria-hidden="true"></div>
      <h1 id="suggestions-title">People you may know</h1>
      <p class="intro">Suggested from shared circles and recent conversations on Commonline.</p>

      <div class="people">
        <div class="person">
          <div class="portrait" role="img" aria-label="Profile picture placeholder"></div>
          <div class="details">
            <p class="name">Mara Venn</p>
            <p class="context">8 mutual connections</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </div>

        <div class="person">
          <div class="portrait" role="img" aria-label="Profile picture placeholder"></div>
          <div class="details">
            <p class="name">Elliot Mercer</p>
            <p class="context">In Local Makers</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </div>

        <div class="person">
          <div class="portrait" role="img" aria-label="Profile picture placeholder"></div>
          <div class="details">
            <p class="name">Tessa Rowan</p>
            <p class="context">5 mutual connections</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </div>

        <div class="person">
          <div class="portrait" role="img" aria-label="Profile picture placeholder"></div>
          <div class="details">
            <p class="name">Jonah Bell</p>
            <p class="context">In Weekend Walkers</p>
          </div>
          <button class="follow" type="button">Follow</button>
        </div>
      </div>

      <button class="view-all" type="button">View all suggestions</button>
    </section>
  </div>
</body>
</html>
