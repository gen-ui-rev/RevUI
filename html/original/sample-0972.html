<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    background:#f2f1ee;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    font-family:'Roboto', system-ui, sans-serif;
    color:#1c1917;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#f2f1ee;
    padding:36px 0;
    box-sizing:border-box;
  }
  .card{
    width:318px;
    margin:0 auto;
    background:#ffffff;
    border:1px solid #e0ddd7;
    border-radius:6px;
    padding:22px;
    box-sizing:border-box;
  }
  .title{
    font-size:20px;
    font-weight:500;
    letter-spacing:-0.2px;
    margin:0;
  }
  .sub{
    font-size:13px;
    line-height:18px;
    color:#78716c;
    margin:6px 0 0;
  }
  .valuerow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:26px;
  }
  .value{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .num{
    font-size:40px;
    font-weight:700;
    line-height:1;
    letter-spacing:-1px;
  }
  .unit{
    font-size:15px;
    color:#57534e;
  }
  .steps{display:flex;gap:8px;}
  .step{
    width:38px;height:38px;
    border:1px solid #d6d3ce;
    border-radius:6px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:#44403c;
  }
  .slider{
    margin-top:24px;
    position:relative;
    height:22px;
  }
  .track{
    position:absolute;
    top:9px;left:0;right:0;
    height:4px;
    border-radius:6px;
    background:#e7e5e1;
  }
  .fill{
    position:absolute;
    top:0;left:0;
    height:4px;
    width:26%;
    border-radius:6px;
    background:#57534e;
  }
  .thumb{
    position:absolute;
    top:0;
    left:26%;
    width:18px;height:22px;
    margin-left:-9px;
    border-radius:6px;
    background:#44403c;
  }
  .scale{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:12px;
    color:#8a827b;
  }
  .divider{
    height:1px;
    background:#e0ddd7;
    margin:22px 0 16px;
  }
  .track-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mono{
    width:40px;height:40px;
    border-radius:6px;
    background:#57534e;
    color:#fff;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.5px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .meta{min-width:0;}
  .meta .name{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta .line{
    font-size:12px;
    color:#8a827b;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="title">Sleep timer</p>
      <p class="sub">Playback fades out and stops when the timer ends.</p>

      <div class="valuerow">
        <div class="value">
          <span class="num">35</span>
          <span class="unit">minutes</span>
        </div>
        <div class="steps">
          <div class="step" role="img" aria-label="Decrease by five minutes">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="step" role="img" aria-label="Increase by five minutes">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>
      </div>

      <div class="slider">
        <div class="track"><div class="fill"></div></div>
        <div class="thumb"></div>
      </div>
      <div class="scale">
        <span>5 min</span>
        <span>2 hr</span>
      </div>

      <div class="divider"></div>

      <div class="track-row">
        <div class="mono">CT</div>
        <div class="meta">
          <div class="name">Cascade Theory</div>
          <div class="line">Ep. 112 · 48 min left</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
