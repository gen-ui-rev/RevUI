<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Session Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 48px 20px;
      background: #f3f4f6;
    }

    .activity {
      width: 100%;
      padding: 20px;
      background: rgba(14, 165, 233, 0.11);
      border-radius: 10px;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .service {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .service-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #0284c7;
      background: rgba(14, 165, 233, 0.17);
      border-radius: 10px;
    }

    .service-name {
      min-width: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-status {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      color: #0369a1;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #0ea5e9;
      border-radius: 50%;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #0369a1;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .time-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .remaining {
      margin: 0;
      color: #0c4a6e;
      font-size: 32px;
      line-height: 38px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .end-time {
      margin: 0;
      flex: 0 0 auto;
      color: #526072;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .task {
      margin: 8px 0 18px;
      color: #273448;
      font-size: 16px;
      line-height: 23px;
      font-weight: 400;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(14, 165, 233, 0.17);
      border-radius: 10px;
    }

    .progress-fill {
      width: 60%;
      height: 8px;
      background: #0ea5e9;
      border-radius: 10px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 9px;
      color: #526072;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Notefield focus session live activity">
      <div class="activity-header">
        <div class="service">
          <div class="service-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M5 3.5H13C13.8284 3.5 14.5 4.17157 14.5 5V13C14.5 13.8284 13.8284 14.5 13 14.5H5C4.17157 14.5 3.5 13.8284 3.5 13V5C3.5 4.17157 4.17157 3.5 5 3.5Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6.25 7H11.75M6.25 10H10.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="service-name">Notefield</span>
        </div>
        <div class="live-status">
          <span class="live-dot"></span>
          <span>Live</span>
        </div>
      </div>

      <p class="eyebrow">Focus session</p>
      <div class="time-row">
        <h1 class="remaining">24 min left</h1>
        <p class="end-time">Ends 3:30 PM</p>
      </div>
      <p class="task">Finalize sprint planning notes</p>

      <div class="progress-track" role="progressbar" aria-label="Focus session progress" aria-valuemin="0" aria-valuemax="60" aria-valuenow="36">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span>36 of 60 minutes</span>
        <span>Product workspace</span>
      </div>
    </section>
  </div>
</body>
</html>
