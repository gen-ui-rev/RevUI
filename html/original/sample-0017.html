<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markup — Q3 spending review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#00A5C4;
    --ink:#16181d;
    --muted:#6b7280;
    --line:#e5e7ea;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#eceef0;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:24px;
    background:#eceef0;
  }
  .card{
    background:#fff;
    border-radius:4px;
    box-shadow:0 6px 20px rgba(20,24,31,.10);
  }
  .head{
    padding:16px;
    border-bottom:1px solid var(--line);
  }
  .head h1{
    margin:0;
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .head p{
    margin:4px 0 0;
    font-size:12px;
    color:var(--muted);
  }
  .canvas-wrap{
    padding:16px;
  }
  .canvas-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .canvas-top span{font-size:12px;color:var(--muted);}
  .canvas-top .val{font-size:12px;font-weight:600;color:var(--ink);}
  .board{
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
  }
  .board svg{display:block;width:100%;height:auto;}

  .tools{
    display:flex;
    gap:6px;
    padding:10px 16px;
    border-top:1px solid var(--line);
  }
  .tool{
    width:44px;
    height:34px;
    border:1px solid var(--line);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#4b5158;
    background:#fff;
  }
  .tool.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .opts{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px 12px;
  }
  .swatches{display:flex;gap:9px;align-items:center;}
  .sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.10);}
  .sw.on{box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--accent);}
  .weights{display:flex;align-items:center;gap:8px;}
  .weights .lbl{font-size:12px;color:var(--muted);}
  .w{
    width:24px;height:24px;border:1px solid var(--line);border-radius:4px;
    display:flex;align-items:center;justify-content:center;
  }
  .w i{display:block;width:13px;background:#4b5158;border-radius:2px;}
  .w.on{border-color:var(--accent);}
  .w.on i{background:var(--accent);}

  .notes{border-top:1px solid var(--line);padding:12px 16px 4px;}
  .notes h2{
    margin:0 0 8px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .note{
    display:flex;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .note:last-child{border-bottom:0;}
  .pin{
    flex:none;
    width:20px;height:20px;border-radius:4px;
    background:var(--accent);
    color:#fff;
    font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .note .body{min-width:0;}
  .note .txt{font-size:14px;line-height:1.35;}
  .note .meta{font-size:12px;color:var(--muted);margin-top:3px;}

  .foot{
    display:flex;
    gap:8px;
    padding:12px 16px 16px;
  }
  .btn{
    height:40px;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .btn.ghost{
    border:1px solid var(--line);
    color:#4b5158;
    padding:0 16px;
  }
  .btn.primary{
    flex:1;
    background:var(--accent);
    color:#fff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Q3 spending review</h1>
        <p>Markup draft · shared with Marcus Denby · edited 2:14 PM</p>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-top">
          <span>Monthly card spend</span>
          <span class="val">Jul – Dec 2024</span>
        </div>
        <div class="board">
          <svg viewBox="0 0 308 176" role="img" aria-label="Bar chart of monthly card spend with two handwritten annotations">
            <line x1="10" y1="44" x2="298" y2="44" stroke="#f0f1f3" stroke-width="1"/>
            <line x1="10" y1="84" x2="298" y2="84" stroke="#f0f1f3" stroke-width="1"/>
            <line x1="10" y1="124" x2="298" y2="124" stroke="#f0f1f3" stroke-width="1"/>
            <line x1="10" y1="142" x2="298" y2="142" stroke="#e0e3e6" stroke-width="1"/>

            <rect x="26" y="90" width="28" height="52" fill="#d9dde2"/>
            <rect x="74" y="98" width="28" height="44" fill="#d9dde2"/>
            <rect x="122" y="76" width="28" height="66" fill="#d9dde2"/>
            <rect x="170" y="84" width="28" height="58" fill="#d9dde2"/>
            <rect x="218" y="50" width="28" height="92" fill="#d9dde2"/>
            <rect x="266" y="102" width="28" height="40" fill="#d9dde2"/>

            <text x="40" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Jul</text>
            <text x="88" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Aug</text>
            <text x="136" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Sep</text>
            <text x="184" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Oct</text>
            <text x="232" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Nov</text>
            <text x="280" y="160" font-family="Inter, sans-serif" font-size="11" fill="#9aa1a9" text-anchor="middle">Dec</text>

            <path d="M232,36 C252,37 260,58 258,90 C256,120 248,140 231,141 C213,142 206,120 206,90 C206,60 214,38 232,36 C236,36 240,38 242,40"
                  fill="none" stroke="#00A5C4" stroke-width="2.4" stroke-linecap="round"/>

            <path d="M150,58 C168,50 186,50 200,60" fill="none" stroke="#00A5C4" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M200,60 L192,55 M200,60 L193,64" fill="none" stroke="#00A5C4" stroke-width="2.2" stroke-linecap="round"/>
            <text x="146" y="54" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#00A5C4" text-anchor="end">$4,280</text>

            <rect x="250" y="24" width="18" height="18" rx="4" fill="#00A5C4"/>
            <text x="259" y="37" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>

            <path d="M136,68 L136,80" fill="none" stroke="#00A5C4" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="127" y="46" width="18" height="18" rx="4" fill="#00A5C4"/>
            <text x="136" y="59" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
          </svg>
        </div>
      </div>

      <div class="tools">
        <div class="tool on" aria-label="Pen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
        </div>
        <div class="tool" aria-label="Highlighter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-2 4h4l1-2"/><path d="M11 16l8-8-3-3-8 8z"/><path d="M4 21h16"/></svg>
        </div>
        <div class="tool" aria-label="Arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5"/><path d="M11 5h8v8"/></svg>
        </div>
        <div class="tool" aria-label="Rectangle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
        </div>
        <div class="tool" aria-label="Text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 6h14"/><path d="M12 6v13"/><path d="M9 19h6"/></svg>
        </div>
        <div class="tool" aria-label="Eraser">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19l-4-4 9-9 4 4-9 9z"/><path d="M11 19h9"/></svg>
        </div>
      </div>

      <div class="opts">
        <div class="swatches">
          <span class="sw on" style="background:#00A5C4"></span>
          <span class="sw" style="background:#16181d"></span>
          <span class="sw" style="background:#e0a021"></span>
          <span class="sw" style="background:#d4483f"></span>
        </div>
        <div class="weights">
          <span class="lbl">Weight</span>
          <span class="w"><i style="height:2px"></i></span>
          <span class="w on"><i style="height:4px"></i></span>
          <span class="w"><i style="height:7px"></i></span>
        </div>
      </div>

      <div class="notes">
        <h2>Notes on this chart</h2>
        <div class="note">
          <span class="pin">1</span>
          <span class="body">
            <span class="txt">Card spend up 38% in November — mostly travel.</span>
            <span class="meta">You · 2:12 PM</span>
          </span>
        </div>
        <div class="note">
          <span class="pin">2</span>
          <span class="body">
            <span class="txt">Confirm the $612 airline refund posted in September.</span>
            <span class="meta">You · 2:14 PM</span>
          </span>
        </div>
      </div>

      <div class="foot">
        <span class="btn ghost">Clear</span>
        <span class="btn primary">Save markup</span>
      </div>
    </div>
  </div>
</body>
</html>
