<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Error — Nivora Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d7d9dc;
      color: #202124;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f5;
    }

    .topbar {
      height: 72px;
      flex: 0 0 72px;
      padding: 13px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 1px solid #dedfe1;
    }

    .brand {
      margin: 0 0 2px;
      color: #6d7075;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .page-title {
      margin: 0;
      color: #202124;
      font-size: 20px;
      line-height: 24px;
      font-weight: 500;
    }

    .help-link {
      padding: 8px 0 8px 12px;
      color: #925700;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      text-decoration: none;
    }

    .content {
      flex: 1;
      padding: 44px 24px 24px;
    }

    .error-card {
      padding: 30px 28px 28px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 3px 14px rgba(32, 33, 36, 0.10);
    }

    .error-mark {
      width: 56px;
      height: 56px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a96200;
      background: #fff1d6;
      border-radius: 6px;
    }

    .error-mark svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .error-card h1 {
      margin: 0 0 12px;
      color: #202124;
      font-size: 24px;
      line-height: 30px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .error-card p {
      margin: 0;
      color: #5f6368;
      font-size: 15px;
      line-height: 22px;
      font-weight: 400;
    }

    .retry-button {
      width: 100%;
      height: 48px;
      margin-top: 28px;
      border: 0;
      border-radius: 6px;
      background: #a96200;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
    }

    .reference {
      margin-top: 18px;
      color: #777b80;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .tabbar {
      height: 76px;
      flex: 0 0 76px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #ffffff;
      border-top: 1px solid #dfe1e3;
    }

    .tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 3px 0;
      color: #6d7075;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      text-decoration: none;
    }

    .tab.active {
      color: #925700;
      font-weight: 500;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 24px;
      right: 24px;
      height: 3px;
      background: #b66c00;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div>
        <p class="brand">Nivora Finance</p>
        <p class="page-title">Portfolio</p>
      </div>
      <a class="help-link" href="#" aria-label="Open help">Help</a>
    </header>

    <main class="content">
      <section class="error-card" aria-labelledby="error-title">
        <div class="error-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 4.5L28 26.5H4L16 4.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M16 11.5V18.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="16" cy="23" r="1.35" fill="currentColor"/>
          </svg>
        </div>
        <h1 id="error-title">We couldn't load your portfolio</h1>
        <p>Your balance and holdings are temporarily unavailable. No changes were made to your accounts.</p>
        <button class="retry-button" type="button">Try again</button>
        <div class="reference">Error reference: PF-204</div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <a class="tab" href="#">Overview</a>
      <a class="tab" href="#">Accounts</a>
      <a class="tab active" href="#" aria-current="page">Invest</a>
      <a class="tab" href="#">Activity</a>
    </nav>
  </div>
</body>
</html>
