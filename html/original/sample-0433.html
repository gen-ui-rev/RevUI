<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eeee;
      color: #172326;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 42px 24px;
      background: #f8faf9;
    }

    .empty-state {
      width: 100%;
      padding: 30px 28px 28px;
      border: 1px solid #cbd5d6;
      border-top: 3px solid #007f98;
      border-radius: 0;
      background: #ffffff;
    }

    .section-label {
      margin: 0 0 18px;
      color: #007f98;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .empty-mark {
      width: 64px;
      padding: 14px;
      margin: 0 0 24px;
      border: 1px solid #9bcbd4;
      border-radius: 0;
      background: #edf9fb;
      color: #007f98;
    }

    .empty-mark svg {
      display: block;
      width: 34px;
      height: 34px;
    }

    h1 {
      margin: 0 0 12px;
      color: #172326;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.12;
    }

    .description {
      margin: 0 0 26px;
      color: #566366;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    .primary-action {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #007f98;
      border-radius: 0;
      background: #007f98;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <p class="section-label">Cove Ledger · Savings</p>

      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 27.5H29" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.5 27V18.5H14V27" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 27V11.5H25.5V27" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6.5 12.5L13 7L18 10L27.5 3.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M22.5 3.5H27.5V8.5" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </div>

      <h1 id="empty-title">Start your first savings goal</h1>
      <p class="description">You have no active goals. Set a target amount and date to begin tracking your deposits.</p>
      <a class="primary-action" href="#" aria-label="Create a savings goal">Create a savings goal</a>
    </section>
  </div>
</body>
</html>
