<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync interrupted — Nocturne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ECECEA;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #24262A;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    padding: 28px 24px;
    background: #ECECEA;
  }
  .card {
    background: rgba(88, 92, 99, 0.09);
    border-radius: 10px;
    padding: 26px 22px 24px;
  }
  .mark {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: rgba(88, 92, 99, 0.16);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 25px;
    line-height: 1.2;
    margin: 20px 0 0;
  }
  .body {
    font-size: 15px;
    line-height: 1.5;
    color: #4C5057;
    margin: 9px 0 0;
  }
  .facts {
    margin-top: 20px;
    background: rgba(88, 92, 99, 0.09);
    border-radius: 10px;
    padding: 4px 14px;
  }
  .fact {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    font-size: 14px;
  }
  .fact + .fact { border-top: 1px solid rgba(88, 92, 99, 0.14); }
  .fact .k { color: #62666D; }
  .fact .v {
    font-weight: 600;
    color: #24262A;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .actions { margin-top: 22px; }
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 12px;
  }
  .btn-primary { background: #3A3D42; color: #F4F4F2; }
  .btn-ghost {
    background: rgba(88, 92, 99, 0.12);
    color: #33363B;
    margin-top: 10px;
  }
  .code {
    margin: 16px 0 0;
    text-align: center;
    font-size: 12px;
    color: #74787E;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4C5057" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.7 17.7H6.6A3.6 3.6 0 0 1 6.1 10.6"/>
          <path d="M8.6 6.6A5.4 5.4 0 0 1 17.4 10.7h.5a3.6 3.6 0 0 1 2.7 6"/>
          <path d="M3.5 3.5 20.5 20.5"/>
        </svg>
      </div>
      <h1>Last night didn’t sync</h1>
      <p class="body">Your wristband lost the connection partway through the upload, so the sleep stages for March 8 are incomplete.</p>
      <div class="facts">
        <div class="fact">
          <span class="k">Last complete sync</span>
          <span class="v">Mar 7, 8:12 AM</span>
        </div>
        <div class="fact">
          <span class="k">Device</span>
          <span class="v">Rest Band 2</span>
        </div>
        <div class="fact">
          <span class="k">Stored on band</span>
          <span class="v">6 h 41 m</span>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="#">Retry sync</a>
        <a class="btn btn-ghost" href="#">Check band connection</a>
      </div>
      <p class="code">Error SYN-402 · 5:47 AM</p>
    </div>
  </div>
</body>
</html>
