<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select a Focus Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e5e7ea;
      color: #202124;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 28px 20px;
      background: #f2f3f5;
    }

    .picker {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(28, 31, 35, 0.09);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #c93636;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202124;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .summary {
      margin: 7px 0 0;
      color: #686d75;
      font-size: 14px;
      line-height: 1.5;
    }

    .section {
      margin-top: 22px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      margin: 0;
      color: #34373c;
      font-size: 14px;
      font-weight: 700;
    }

    .month {
      color: #747980;
      font-size: 12px;
      font-weight: 500;
    }

    .dates {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .date {
      padding: 9px 3px 10px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #4e535a;
      text-align: center;
      cursor: default;
    }

    .date .day {
      display: block;
      margin-bottom: 4px;
      color: inherit;
      font-size: 12px;
      font-weight: 500;
    }

    .date .number {
      display: block;
      color: inherit;
      font-size: 16px;
      font-weight: 700;
    }

    .date.selected {
      border-color: #c93636;
      background: #c93636;
      color: #ffffff;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .time {
      padding: 10px 8px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #3d4147;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      cursor: default;
    }

    .time.selected {
      border-color: #c93636;
      background: #fff5f5;
      color: #b82d2d;
    }

    .duration-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .duration {
      padding: 9px 4px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #555a61;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: default;
    }

    .duration.selected {
      border-color: #c93636;
      color: #b82d2d;
    }

    .timezone {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 16px 0 0;
      color: #747980;
      font-size: 12px;
      line-height: 1.4;
    }

    .timezone svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      stroke: currentColor;
    }

    .confirm {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid #c93636;
      border-radius: 6px;
      background: #c93636;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="picker-title">
      <header>
        <p class="eyebrow">Northstar Notes</p>
        <h1 id="picker-title">Choose a focus time</h1>
        <p class="summary">Set aside time to review the launch brief with your team.</p>
      </header>

      <section class="section" aria-labelledby="date-heading">
        <div class="section-heading">
          <h2 id="date-heading">Date</h2>
          <span class="month">April 2026</span>
        </div>
        <div class="dates" role="group" aria-label="Available dates">
          <button class="date" type="button" aria-label="Monday, April 13">
            <span class="day">Mon</span>
            <span class="number">13</span>
          </button>
          <button class="date" type="button" aria-label="Tuesday, April 14">
            <span class="day">Tue</span>
            <span class="number">14</span>
          </button>
          <button class="date selected" type="button" aria-pressed="true" aria-label="Wednesday, April 15, selected">
            <span class="day">Wed</span>
            <span class="number">15</span>
          </button>
          <button class="date" type="button" aria-label="Thursday, April 16">
            <span class="day">Thu</span>
            <span class="number">16</span>
          </button>
          <button class="date" type="button" aria-label="Friday, April 17">
            <span class="day">Fri</span>
            <span class="number">17</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="time-heading">
        <div class="section-heading">
          <h2 id="time-heading">Start time</h2>
        </div>
        <div class="times" role="group" aria-label="Available start times">
          <button class="time" type="button">9:30 AM</button>
          <button class="time selected" type="button" aria-pressed="true">10:00 AM</button>
          <button class="time" type="button">1:30 PM</button>
          <button class="time" type="button">3:00 PM</button>
        </div>
      </section>

      <section class="section" aria-labelledby="duration-heading">
        <div class="section-heading">
          <h2 id="duration-heading">Duration</h2>
        </div>
        <div class="duration-options" role="group" aria-label="Focus session duration">
          <button class="duration" type="button">30 min</button>
          <button class="duration selected" type="button" aria-pressed="true">45 min</button>
          <button class="duration" type="button">60 min</button>
        </div>
      </section>

      <p class="timezone">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke-width="1.7"></circle>
          <path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5M12 3.5C9.8 5.8 8.7 8.6 8.7 12s1.1 6.2 3.3 8.5" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
        Eastern Time (UTC−4)
      </p>

      <button class="confirm" type="button">Set focus time</button>
    </main>
  </div>
</body>
</html>
