<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Saved List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #eceee9;
      color: #20231d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 32px;
      background: #ffffff;
    }

    .empty-state {
      text-align: center;
    }

    .visual {
      padding: 34px 0;
      border-radius: 14px;
      background: rgba(181, 232, 62, 0.18);
    }

    .visual svg {
      display: block;
      width: 124px;
      height: 104px;
      margin: 0 auto;
    }

    h1 {
      margin: 26px 0 8px;
      font-size: 23px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    p {
      max-width: 292px;
      margin: 0 auto;
      color: #686e62;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 400;
    }

    .cta {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 15px 20px;
      border-radius: 14px;
      background: #b5e83e;
      color: #1d2411;
      text-decoration: none;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <div class="visual" aria-hidden="true">
        <svg viewBox="0 0 124 104" xmlns="http://www.w3.org/2000/svg">
          <rect x="23" y="31" width="78" height="66" rx="14" fill="#B5E83E"/>
          <path d="M43 36V27C43 16.5 51.5 8 62 8C72.5 8 81 16.5 81 27V36" fill="none" stroke="#242A1B" stroke-width="7" stroke-linecap="round"/>
          <circle cx="44" cy="56" r="5" fill="#242A1B"/>
          <circle cx="80" cy="56" r="5" fill="#242A1B"/>
          <path d="M49 70C52.5 75 56.8 78 62 78C67.2 78 71.5 75 75 70" fill="none" stroke="#242A1B" stroke-width="5" stroke-linecap="round"/>
          <circle cx="104" cy="25" r="11" fill="#FFFFFF"/>
          <path d="M104 19V31M98 25H110" stroke="#242A1B" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="empty-title">Your saved list is empty</h1>
      <p>Keep products you want to revisit in one place while you shop Morrow Market.</p>
      <a class="cta" href="#" aria-label="Browse products on Morrow Market">Browse products</a>
    </section>
  </div>
</body>
</html>
