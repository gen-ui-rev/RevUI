<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8edef;
      color: #142126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 18px;
      background: #f5f7f8;
    }

    .confirmation {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #dce4e7;
      border-radius: 14px;
    }

    .status-icon {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #087f92;
      background: #dff8fc;
      border: 1px solid #a9e7f0;
      border-radius: 50%;
    }

    .status-icon svg {
      width: 22px;
      height: 22px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 12px;
      font-size: 24px;
      line-height: 29px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin-top: 6px;
      color: #5c6b70;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
    }

    .amount {
      margin-top: 16px;
      color: #087f92;
      font-size: 28px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .investment {
      margin-top: 3px;
      color: #33454b;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .details {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #dce4e7;
    }

    h2 {
      font-size: 16px;
      line-height: 19px;
      font-weight: 600;
    }

    .detail-list {
      margin: 8px 0 0;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid #e7edef;
      font-size: 14px;
      line-height: 20px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    dt {
      color: #69777c;
      font-weight: 400;
    }

    dd {
      margin: 0;
      color: #1d2b30;
      font-weight: 600;
      text-align: right;
    }

    .next-step {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #dce4e7;
    }

    .next-step p {
      margin-top: 6px;
      color: #5c6b70;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="confirmation" aria-labelledby="confirmation-title">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5.5 12.5L9.5 16.5L18.5 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="confirmation-title">Order submitted</h1>
      <p class="intro">Your investment order has been received.</p>
      <p class="amount">$500.00</p>
      <p class="investment">Cedar Vale Balanced Fund</p>

      <section class="details" aria-labelledby="details-title">
        <h2 id="details-title">Order details</h2>
        <dl class="detail-list">
          <div class="detail-row">
            <dt>Account</dt>
            <dd>Investing •• 1842</dd>
          </div>
          <div class="detail-row">
            <dt>Order type</dt>
            <dd>Market buy</dd>
          </div>
          <div class="detail-row">
            <dt>Reference</dt>
            <dd>VL-603921</dd>
          </div>
        </dl>
      </section>

      <section class="next-step" aria-labelledby="next-title">
        <h2 id="next-title">What happens next</h2>
        <p>We’ll notify you after the market opens and the purchase is complete.</p>
      </section>
    </main>
  </div>
</body>
</html>
