<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerbaLane Study Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ece9e7;
      color: #29262b;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #f7f5f3;
    }

    .tour {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dcd6da;
      border-radius: 10px;
    }

    .tour-header {
      padding: 22px 22px 18px;
      border-bottom: 1px solid #e4dfe2;
    }

    .step-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: #766e74;
      font-size: 12px;
      font-weight: 700;
    }

    .step-line span:first-child {
      color: #825f79;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 18px;
    }

    .progress span {
      display: block;
      height: 3px;
      border-radius: 2px;
      background: #e5dfe3;
    }

    .progress .complete,
    .progress .current {
      background: #936b89;
    }

    h1 {
      margin: 0;
      color: #684c62;
      font-size: 22px;
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tour-body {
      padding: 20px 22px;
    }

    .illustration {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      margin-bottom: 18px;
      background: #f3edf1;
      border: 1px solid #ddcfd9;
      border-radius: 10px;
      color: #825f79;
    }

    .illustration svg {
      display: block;
      width: 174px;
      height: 118px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
    }

    .description {
      margin: 0;
      color: #625c61;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    .tip {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 16px;
      padding: 12px;
      background: #faf8f9;
      border: 1px solid #e3dde1;
      border-radius: 10px;
      color: #514b50;
      font-size: 14px;
      line-height: 1.45;
    }

    .tip svg {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      color: #825f79;
    }

    .tour-footer {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
      padding: 0 22px 22px;
    }

    button {
      appearance: none;
      border: 1px solid #936b89;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }

    .back {
      background: #ffffff;
      color: #684c62;
    }

    .next {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #825f79;
      color: #ffffff;
    }

    .next svg {
      width: 17px;
      height: 17px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="tour" aria-labelledby="tour-title">
      <header class="tour-header">
        <div class="step-line">
          <span>VerbaLane study guide</span>
          <span>Step 2 of 4</span>
        </div>

        <div class="progress" role="progressbar" aria-label="Tour progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2">
          <span class="complete"></span>
          <span class="current"></span>
          <span></span>
          <span></span>
        </div>

        <h1 id="tour-title">Review words before they fade</h1>
      </header>

      <div class="tour-body">
        <div class="illustration" aria-hidden="true">
          <svg viewBox="0 0 174 118" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M38 35C23 44 18 65 28 81C38 98 59 104 76 96" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M33 27L39 35L29 38" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M136 83C151 74 156 53 146 37C136 20 115 14 98 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M141 91L135 83L145 80" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="53" y="31" width="58" height="70" rx="8" fill="#FFFFFF" stroke="currentColor" stroke-width="2"/>
            <rect x="65" y="18" width="58" height="70" rx="8" fill="#F9F6F8" stroke="currentColor" stroke-width="2"/>
            <circle cx="94" cy="46" r="11" stroke="currentColor" stroke-width="2"/>
            <path d="M94 39V46L99 50" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M79 65H109" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M84 73H104" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M63 89L69 95L80 83" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h2>A short review keeps new vocabulary active</h2>
        <p class="description">VerbaLane schedules each word when it is most useful to practice. Finish the review deck to keep your daily lesson on track.</p>

        <div class="tip">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.7"/>
            <path d="M10 9V14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="10" cy="6.2" r="1" fill="currentColor"/>
          </svg>
          <span>Your first review appears after you complete one lesson.</span>
        </div>
      </div>

      <footer class="tour-footer">
        <button class="back" type="button">Back</button>
        <button class="next" type="button">
          <span>Next: Practice</span>
          <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M3.5 9H14.5M10 4.5L14.5 9L10 13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </footer>
    </section>
  </div>
</body>
</html>
