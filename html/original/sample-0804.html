<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share study set</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #e9e9ec;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1b1b1f;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 30px 24px;
    background: #f3f3f5;
  }
  .sheet {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(24, 24, 30, 0.10);
    padding: 22px 20px 20px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8b8b95;
    margin: 0 0 8px;
  }
  .title {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 6px;
  }
  .meta {
    font-size: 13px;
    color: #77777f;
    margin: 0;
  }
  .rule {
    height: 1px;
    background: #ececf0;
    margin: 18px 0 4px;
  }
  .list-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8b8b95;
    margin: 14px 0 6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #fce8ef;
    color: #d32a6c;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .who {
    flex: 1;
    min-width: 0;
  }
  .name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub {
    font-size: 13px;
    color: #77777f;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .pick {
    flex: none;
    width: 22px;
    height: 22px;
  }
  .ring {
    width: 20px;
    height: 20px;
    border: 1.5px solid #d3d3da;
    border-radius: 50%;
    box-sizing: border-box;
    margin: 1px;
  }
  .send {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 18px;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: #d32a6c;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .alt {
    margin: 12px 0 0;
    text-align: center;
    font-size: 14px;
    color: #d32a6c;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <p class="eyebrow">Share study set</p>
      <h1 class="title">Spanish B1 — Unit 4: Past Tenses</h1>
      <p class="meta">24 cards · Updated March 6</p>

      <div class="rule"></div>

      <p class="list-label">Send to</p>

      <div class="row">
        <div class="avatar">DR</div>
        <div class="who">
          <div class="name">Dana Reyes</div>
          <div class="sub">Study partner since January</div>
        </div>
        <div class="pick">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="10" fill="#d32a6c"></circle>
            <path d="M6.5 11.3l3 3 6-6.2" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar">TH</div>
        <div class="who">
          <div class="name">Theo Halvorsen</div>
          <div class="sub">Tuesday conversation group</div>
        </div>
        <div class="pick">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="10" fill="#d32a6c"></circle>
            <path d="M6.5 11.3l3 3 6-6.2" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <div class="row">
        <div class="avatar">MO</div>
        <div class="who">
          <div class="name">Marisol Ocampo</div>
          <div class="sub">Tutor · B1 track</div>
        </div>
        <div class="pick"><div class="ring"></div></div>
      </div>

      <button class="send" type="button">Send to 2 people</button>
      <p class="alt">Copy link instead</p>
    </div>
  </div>
</body>
</html>
