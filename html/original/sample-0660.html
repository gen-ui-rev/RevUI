<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e4;
      color: #25292d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 24px;
      background: #eceeef;
    }

    .style-panel {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d9dcde;
      border-radius: 0;
      box-shadow: 0 8px 22px rgba(34, 39, 43, 0.10);
    }

    .panel-header {
      margin-bottom: 14px;
    }

    .panel-header h1 {
      margin: 0 0 3px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .panel-header p {
      margin: 0;
      color: #687078;
      font-size: 14px;
      line-height: 1.4;
    }

    .preview {
      position: relative;
      width: 308px;
      margin-bottom: 16px;
      border: 1px solid #cfd3d6;
      background: #d5d8da;
    }

    .preview img {
      width: 306px;
      height: 126px;
      object-fit: cover;
      display: block;
      background: #d5d8da;
      filter: grayscale(18%) contrast(0.95);
    }

    .preview-sticker {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 9px;
      border: 2px solid #ffffff;
      background: #30343a;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .section {
      margin-bottom: 15px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
    }

    .section-heading span {
      color: #747b81;
      font-size: 12px;
      line-height: 1.3;
    }

    .option-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .option {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4d545a;
      text-align: center;
      cursor: default;
    }

    .filter-image,
    .sticker-tile {
      width: 71px;
      height: 44px;
      border: 1px solid #d5d8da;
      background: #eef0f1;
    }

    .option.selected .filter-image,
    .option.selected .sticker-tile {
      border: 2px solid #30343a;
    }

    .filter-image {
      object-fit: cover;
      display: block;
      background: #d5d8da;
    }

    .filter-soft {
      filter: saturate(0.75) brightness(1.08);
    }

    .filter-mono {
      filter: grayscale(1);
    }

    .filter-warm {
      filter: sepia(0.28) saturate(0.9);
    }

    .option-label {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: inherit;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option.selected .option-label {
      color: #25292d;
      font-weight: 700;
    }

    .sticker-tile {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-tile svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .apply-button {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid #30343a;
      border-radius: 0;
      background: #30343a;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="style-panel" aria-labelledby="style-title">
      <header class="panel-header">
        <h1 id="style-title">Style this update</h1>
        <p>Planstead update · Friday priorities</p>
      </header>

      <div class="preview" aria-label="Preview with Focus sticker applied">
        <img src="https://loremflickr.com/306/126/workspace?lock=8770" width="306" height="126" alt="Laptop and planning materials in a shared workspace">
        <div class="preview-sticker">FOCUS BLOCK</div>
      </div>

      <section class="section" aria-labelledby="filters-heading">
        <div class="section-heading">
          <h2 id="filters-heading">Photo filter</h2>
          <span>Mono selected</span>
        </div>
        <div class="option-row">
          <button class="option" type="button" aria-label="Choose Clear filter">
            <img class="filter-image" src="https://loremflickr.com/71/44/workspace?lock=8771" width="71" height="44" alt="Workspace preview with Clear filter">
            <span class="option-label">Clear</span>
          </button>
          <button class="option" type="button" aria-label="Choose Soft filter">
            <img class="filter-image filter-soft" src="https://loremflickr.com/71/44/workspace?lock=8772" width="71" height="44" alt="Workspace preview with Soft filter">
            <span class="option-label">Soft</span>
          </button>
          <button class="option selected" type="button" aria-label="Mono filter selected">
            <img class="filter-image filter-mono" src="https://loremflickr.com/71/44/workspace?lock=8773" width="71" height="44" alt="Workspace preview with Mono filter">
            <span class="option-label">Mono</span>
          </button>
          <button class="option" type="button" aria-label="Choose Warm filter">
            <img class="filter-image filter-warm" src="https://loremflickr.com/71/44/workspace?lock=8774" width="71" height="44" alt="Workspace preview with Warm filter">
            <span class="option-label">Warm</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="stickers-heading">
        <div class="section-heading">
          <h2 id="stickers-heading">Update sticker</h2>
          <span>Focus selected</span>
        </div>
        <div class="option-row">
          <button class="option selected" type="button" aria-label="Focus sticker selected">
            <span class="sticker-tile">
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <rect x="3" y="3" width="22" height="22" fill="#30343a"/>
                <path d="M9 14h10M14 9v10" stroke="#fff" stroke-width="2"/>
              </svg>
            </span>
            <span class="option-label">Focus</span>
          </button>
          <button class="option" type="button" aria-label="Done sticker">
            <span class="sticker-tile">
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <rect x="3.5" y="3.5" width="21" height="21" fill="#fff" stroke="#4d545a"/>
                <path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke="#30343a" stroke-width="2.2"/>
              </svg>
            </span>
            <span class="option-label">Done</span>
          </button>
          <button class="option" type="button" aria-label="Review sticker">
            <span class="sticker-tile">
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <path d="M4 5h20v15H13l-5 4v-4H4z" fill="#fff" stroke="#4d545a"/>
                <path d="M9 11h10M9 15h7" stroke="#30343a" stroke-width="1.7"/>
              </svg>
            </span>
            <span class="option-label">Review</span>
          </button>
          <button class="option" type="button" aria-label="Pinned sticker">
            <span class="sticker-tile">
              <svg viewBox="0 0 28 28" aria-hidden="true">
                <path d="M10 4h8l-1 7 3 4v2H8v-2l3-4z" fill="#fff" stroke="#4d545a" stroke-width="1.5"/>
                <path d="M14 17v7" stroke="#30343a" stroke-width="1.8"/>
              </svg>
            </span>
            <span class="option-label">Pinned</span>
          </button>
        </div>
      </section>

      <button class="apply-button" type="button">Apply to update</button>
    </main>
  </div>
</body>
</html>
