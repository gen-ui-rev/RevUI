<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby Circles — Uploading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0E8B82;
    --teal-soft:rgba(14,139,130,0.12);
    --teal-softer:rgba(14,139,130,0.07);
    --ink:#12171A;
    --mute:#6B7580;
    --line:#E7EAEC;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#DCDFE3;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:844px;
    position:relative;
    background:#FFFFFF;
    color:var(--ink);
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 20px 16px;
  }
  .topbar h1{
    font-size:16px;
    font-weight:600;
    margin:0;
    flex:1;
  }
  .iconbtn{
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .cancel{
    font-size:14px;
    font-weight:500;
    color:var(--teal);
  }

  /* main */
  .main{padding:8px 20px 0;}
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 10px;
  }
  h2{
    font-size:22px;
    font-weight:700;
    line-height:1.25;
    margin:0 0 6px;
  }
  .sub{
    font-size:14px;
    color:var(--mute);
    margin:0 0 20px;
  }

  .hero{
    width:350px;
    height:206px;
    object-fit:cover;
    display:block;
    background:#CFD4D8;
    border-radius:4px;
  }

  .panel{
    margin-top:20px;
    background:var(--teal-soft);
    border-radius:4px;
    padding:16px;
  }
  .track{
    width:100%;
    height:8px;
    border-radius:4px;
    background:rgba(14,139,130,0.18);
    overflow:hidden;
  }
  .fill{
    width:68%;
    height:100%;
    background:var(--teal);
    border-radius:4px;
  }
  .panel-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-top:12px;
  }
  .pct{
    font-size:16px;
    font-weight:600;
    color:var(--teal);
  }
  .eta{
    font-size:13px;
    color:#3F5B58;
  }
  .panel-note{
    font-size:13px;
    color:#3F5B58;
    margin:6px 0 0;
  }

  .thumbs-label{
    font-size:13px;
    font-weight:500;
    color:var(--mute);
    margin:26px 0 10px;
  }
  .thumbs{
    display:flex;
    gap:10px;
  }
  .thumbs img{
    width:76px;
    height:76px;
    object-fit:cover;
    display:block;
    background:#CFD4D8;
    border-radius:4px;
  }
  .thumb-more{
    width:76px;height:76px;
    border-radius:4px;
    background:var(--teal-softer);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:500;
    color:var(--teal);
  }

  .footnote{
    position:absolute;
    left:20px;
    right:20px;
    bottom:104px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .footnote span{
    font-size:13px;
    line-height:1.45;
    color:var(--mute);
  }
  .footnote svg{flex:none;color:var(--mute);margin-top:1px;}

  /* tab bar */
  .tabbar{
    position:absolute;
    left:0;right:0;bottom:0;
    height:76px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:flex-start;
    padding-top:12px;
    background:#fff;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:500;
    color:#9AA2AA;
  }
  .tab.active{color:var(--teal);}
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="iconbtn" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <h1>New Post</h1>
      <div class="cancel">Cancel</div>
    </div>

    <div class="main">
      <p class="eyebrow">Uploading</p>
      <h2>Sharing to Weekend Crew</h2>
      <p class="sub">4 photos · 4.3 MB of 6.3 MB sent</p>

      <img class="hero" src="https://loremflickr.com/350/206/party?lock=7520" width="350" height="206" alt="Cover photo of the post being uploaded: a rooftop gathering at dusk">

      <div class="panel">
        <div class="track"><div class="fill"></div></div>
        <div class="panel-row">
          <span class="pct">68%</span>
          <span class="eta">About 20 seconds left</span>
        </div>
        <p class="panel-note">Photo 3 of 4 · Wi-Fi</p>
      </div>

      <p class="thumbs-label">In this post</p>
      <div class="thumbs">
        <img src="https://loremflickr.com/76/76/friends?lock=7521" width="76" height="76" alt="Thumbnail of four friends at a table">
        <img src="https://loremflickr.com/76/76/cafe?lock=7522" width="76" height="76" alt="Thumbnail of a corner cafe counter">
        <img src="https://loremflickr.com/76/76/street?lock=7523" width="76" height="76" alt="Thumbnail of a lit street after the meetup">
        <div class="thumb-more">+1</div>
      </div>
    </div>

    <div class="footnote">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      <span>You can leave this screen. The upload finishes in the background, and the post appears in the circle when it is done.</span>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        Feed
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="5.2"/><circle cx="15.5" cy="12" r="5.2"/></svg>
        Circles
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>
        Post
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
        You
      </div>
    </nav>

  </div>
</body>
</html>
