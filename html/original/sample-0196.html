<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Arrival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdcd9;
      color: #242423;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 22px;
      background: #f4f4f2;
    }

    .picker {
      width: 100%;
    }

    .service-name {
      margin: 0 0 6px;
      color: #72726e;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #222220;
      font-size: 30px;
      font-weight: 700;
      line-height: 38px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 7px 0 0;
      color: #666663;
      font-size: 15px;
      font-weight: 400;
      line-height: 22px;
    }

    .section {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #c8c8c4;
    }

    .section.time-section {
      margin-top: 20px;
    }

    .section-heading {
      margin: 0;
      color: #30302e;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .section-note {
      margin: 3px 0 0;
      color: #777773;
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .date-option {
      margin: 0;
      padding: 8px 4px 9px;
      border: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #555552;
      font: inherit;
      text-align: center;
    }

    .date-option .day {
      display: block;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      text-transform: uppercase;
    }

    .date-option .date {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
    }

    .date-option.selected {
      border-color: #4d4d4a;
      background: #4d4d4a;
      color: #ffffff;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .time-option {
      padding: 10px 12px;
      border: 1px solid #c2c2be;
      border-radius: 0;
      background: transparent;
      color: #3d3d3a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
    }

    .time-option.selected {
      border-color: #4d4d4a;
      background: #4d4d4a;
      color: #ffffff;
    }

    .action {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #c8c8c4;
    }

    .continue-button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #393937;
      border-radius: 0;
      background: #393937;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="arrival-title">
      <header>
        <p class="service-name">Covepath Stays</p>
        <h1 id="arrival-title">Choose your arrival</h1>
        <p class="intro">Set check-in for Harbor House in Portland, Maine.</p>
      </header>

      <section class="section" aria-labelledby="date-heading">
        <h2 class="section-heading" id="date-heading">Arrival date</h2>
        <div class="date-options" role="group" aria-label="Available arrival dates">
          <button class="date-option" type="button" aria-pressed="false">
            <span class="day">Sun</span>
            <span class="date">Apr 20</span>
          </button>
          <button class="date-option selected" type="button" aria-pressed="true">
            <span class="day">Mon</span>
            <span class="date">Apr 21</span>
          </button>
          <button class="date-option" type="button" aria-pressed="false">
            <span class="day">Tue</span>
            <span class="date">Apr 22</span>
          </button>
          <button class="date-option" type="button" aria-pressed="false">
            <span class="day">Wed</span>
            <span class="date">Apr 23</span>
          </button>
        </div>
      </section>

      <section class="section time-section" aria-labelledby="time-heading">
        <h2 class="section-heading" id="time-heading">Estimated arrival time</h2>
        <p class="section-note">Local time in Portland</p>
        <div class="time-options" role="group" aria-label="Available arrival times">
          <button class="time-option" type="button" aria-pressed="false">3:00 PM</button>
          <button class="time-option selected" type="button" aria-pressed="true">4:00 PM</button>
          <button class="time-option" type="button" aria-pressed="false">5:00 PM</button>
          <button class="time-option" type="button" aria-pressed="false">6:00 PM</button>
        </div>
      </section>

      <footer class="action">
        <button class="continue-button" type="button">Continue with Apr 21, 4:00 PM</button>
      </footer>
    </main>
  </div>
</body>
</html>
