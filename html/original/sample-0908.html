<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Location — Ternway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e8;
      color: #202330;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f7;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 56px;
      align-items: center;
      padding: 13px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e8e9ee;
    }

    .icon-button,
    .text-button,
    .clear-button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .text-button {
      padding: 7px 0;
      text-align: right;
      color: #4f46c7;
      font-size: 14px;
      font-weight: 500;
    }

    .intro {
      padding: 15px 20px 16px;
      background: #ffffff;
    }

    .intro h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .intro p {
      margin: 4px 0 0;
      color: #666b78;
      font-size: 14px;
      line-height: 21px;
    }

    .content {
      flex: 1;
      min-height: 0;
      padding: 16px 18px;
    }

    .search-field {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: #ffffff;
      border: 2px solid #4f46c7;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(28, 31, 45, 0.08);
      color: #4f46c7;
    }

    .search-field svg {
      flex: 0 0 auto;
    }

    .search-field input {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202330;
      font-size: 15px;
      font-weight: 500;
    }

    .clear-button {
      width: 28px;
      height: 28px;
      padding: 5px;
      display: grid;
      place-items: center;
      color: #767b88;
    }

    .location-button {
      width: 100%;
      margin-top: 12px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dfe1e8;
      border-radius: 10px;
      background: #ffffff;
      color: #4f46c7;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      cursor: pointer;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      margin: 0 0 8px 2px;
      color: #555a67;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e7e8ed;
      border-radius: 10px;
    }

    .result-row,
    .saved-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #eceef2;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .result-row:last-child,
    .saved-row:last-child {
      border-bottom: 0;
    }

    .result-row {
      padding: 10px 14px;
    }

    .saved-row {
      padding: 10px 14px 11px;
    }

    .row-title {
      display: block;
      color: #252834;
      font-size: 14px;
      line-height: 21px;
      font-weight: 500;
    }

    .row-detail {
      display: block;
      margin-top: 1px;
      color: #747986;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .saved-label {
      display: block;
      margin-bottom: 1px;
      color: #4f46c7;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 10px 8px;
      background: #ffffff;
      border-top: 1px solid #dedfe5;
    }

    .tab {
      min-width: 0;
      padding: 1px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #7b808c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .tab.active {
      color: #4f46c7;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="topbar">
        <button class="icon-button" type="button" aria-label="Go back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="topbar-title">Choose a location</p>
        <button class="text-button" type="button">Cancel</button>
      </div>

      <div class="intro">
        <h1>Where are you going?</h1>
        <p>Search a city, neighborhood, airport, or address.</p>
      </div>
    </header>

    <main class="content">
      <label class="search-field">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20.2 20.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" value="Charleston" aria-label="Search location">
        <button class="clear-button" type="button" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="#E9EAF0"/>
            <path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </label>

      <button class="location-button" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.5V5M12 19V21.5M2.5 12H5M19 12H21.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Use my current location
      </button>

      <section class="section" aria-labelledby="matches-title">
        <h2 class="section-title" id="matches-title">Search results</h2>
        <div class="panel">
          <button class="result-row" type="button">
            <span class="row-title">Charleston, South Carolina</span>
            <span class="row-detail">City · United States</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Charleston Historic District</span>
            <span class="row-detail">Neighborhood · Charleston, SC</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Charleston International Airport</span>
            <span class="row-detail">Airport · North Charleston, SC</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="saved-title">
        <h2 class="section-title" id="saved-title">Saved locations</h2>
        <div class="panel">
          <button class="saved-row" type="button">
            <span class="saved-label">Next trip</span>
            <span class="row-title">450 Harbor Drive, San Diego, CA 92101</span>
          </button>
          <button class="saved-row" type="button">
            <span class="saved-label">Home</span>
            <span class="row-title">18 Willow Lane, Brookfield, IL 60513</span>
          </button>
          <button class="saved-row" type="button">
            <span class="saved-label">Weekend stay</span>
            <span class="row-title">72 Summit Road, Asheville, NC 28801</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Ternway navigation">
      <button class="tab active" type="button" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 11.5L12 5L20 11.5V20H14.8V15H9.2V20H4V11.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Stays</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="6.5" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M9 6.5V5.2C9 4.5 9.5 4 10.2 4H13.8C14.5 4 15 4.5 15 5.2V6.5M4 11H20" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Trips</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 20C6.2 16.8 8.6 15 12 15C15.4 15 17.8 16.8 18.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Account</span>
      </button>
    </nav>
  </div>
</body>
</html>
