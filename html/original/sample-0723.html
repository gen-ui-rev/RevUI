<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verba Daily — Listening Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --taupe:#8a7a६;
    --accent:#8a7a68;
    --ink:#26221e;
    --muted:#7c7670;
    --line:#e6e3df;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceae7;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:34px 0;
    background:#eceae7;
  }
  .card{
    width:326px;
    margin:0 auto;
    background:#fff;
    border-radius:4px;
    box-shadow:0 6px 20px rgba(38,34,30,0.10);
    padding:20px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 14px;
  }
  .head{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .art{
    width:132px;
    height:132px;
    flex:0 0 132px;
    border-radius:4px;
    object-fit:cover;
    display:block;
    background:#d8d4cf;
  }
  .meta{min-width:0;padding-top:2px;}
  .unit{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    margin:0 0 6px;
  }
  h1{
    font-size:19px;
    line-height:1.26;
    font-weight:700;
    margin:0 0 8px;
  }
  .course{
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    margin:0 0 12px;
  }
  .speaker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mono{
    width:26px;
    height:26px;
    border-radius:4px;
    background:#efece8;
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .speaker span{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
  }
  .progress{margin:22px 0 0;}
  .track{
    height:4px;
    border-radius:4px;
    background:#e6e3df;
    position:relative;
  }
  .fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:66%;
    background:var(--accent);
    border-radius:4px;
  }
  .knob{
    position:absolute;
    top:-3px;
    left:66%;
    margin-left:-5px;
    width:10px;height:10px;
    border-radius:4px;
    background:var(--accent);
  }
  .times{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    font-size:12px;
    font-weight:500;
    color:var(--muted);
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
  }
  .ghost{
    background:none;
    border:none;
    padding:0;
    color:var(--ink);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .speed{
    width:42px;
    height:26px;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--accent);
  }
  .play{
    width:56px;
    height:56px;
    border-radius:4px;
    background:var(--accent);
    color:#fff;
  }
  .up{
    width:326px;
    margin:22px auto 0;
  }
  .up h2{
    font-size:12px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    padding:0 2px;
  }
  .rows{
    background:#fff;
    border-radius:4px;
    box-shadow:0 6px 20px rgba(38,34,30,0.10);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .thumb{
    width:44px;height:44px;
    flex:0 0 44px;
    border-radius:4px;
    object-fit:cover;
    display:block;
    background:#d8d4cf;
  }
  .rtext{min-width:0;flex:1;}
  .rtitle{
    font-size:14px;
    font-weight:700;
    margin:0 0 3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rsub{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    margin:0;
  }
  .dur{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
    flex:0 0 auto;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Now playing</p>
      <div class="head">
        <img class="art" src="https://loremflickr.com/132/132/library?lock=9640" width="132" height="132" alt="Library reading room used as the lesson artwork">
        <div class="meta">
          <p class="unit">Unit 7 · Track 3 of 5</p>
          <h1>Ordering at the Market</h1>
          <p class="course">Spanish B1 · Listening Lab</p>
          <div class="speaker">
            <div class="mono">RC</div>
            <span>Rosa Calderón</span>
          </div>
        </div>
      </div>

      <div class="progress">
        <div class="track">
          <div class="fill"></div>
          <div class="knob"></div>
        </div>
        <div class="times">
          <span>12:04</span>
          <span>−6:11</span>
        </div>
      </div>

      <div class="controls">
        <button class="ghost speed" type="button">1.25x</button>
        <button class="ghost" type="button" aria-label="Back 15 seconds">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5v5h5"></path>
            <path d="M4.6 10a7.6 7.6 0 1 1 1.4 6.6"></path>
            <text x="12" y="15.5" font-family="Manrope, sans-serif" font-size="7" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <button class="ghost play" type="button" aria-label="Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="7" y="5" width="3.6" height="14" rx="1"></rect>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1"></rect>
          </svg>
        </button>
        <button class="ghost" type="button" aria-label="Forward 15 seconds">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 5v5h-5"></path>
            <path d="M19.4 10a7.6 7.6 0 1 0-1.4 6.6"></path>
            <text x="12" y="15.5" font-family="Manrope, sans-serif" font-size="7" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <button class="ghost" type="button" aria-label="Show transcript">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 6h16M4 11h16M4 16h10"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="up">
      <h2>Next in this unit</h2>
      <div class="rows">
        <div class="row">
          <img class="thumb" src="https://loremflickr.com/44/44/books?lock=9641" width="44" height="44" alt="Stack of workbooks for the vocabulary drill track">
          <div class="rtext">
            <p class="rtitle">Vocabulary Drill: Weights</p>
            <p class="rsub">Track 4 · Repeat after speaker</p>
          </div>
          <span class="dur">9:42</span>
        </div>
        <div class="row">
          <img class="thumb" src="https://loremflickr.com/44/44/study?lock=9642" width="44" height="44" alt="Desk with notes for the closing review track">
          <div class="rtext">
            <p class="rtitle">Review and Shadowing</p>
            <p class="rsub">Track 5 · Ends Unit 7</p>
          </div>
          <span class="dur">14:20</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
