<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievement — Northline Reserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d3202b;
    --ink:#16181c;
    --muted:#6b7280;
    --line:#e8e9ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#f1f2f4;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:28px 24px;
    background:#f1f2f4;
  }
  .card{
    background:#ffffff;
    border-radius:4px;
    box-shadow:0 4px 16px rgba(20,22,26,.10);
  }
  .hero{
    position:relative;
  }
  .hero img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    background:#cfd3d8;
    border-radius:4px 4px 0 0;
  }
  .medal{
    position:absolute;
    left:20px;
    bottom:-22px;
    width:44px;
    height:44px;
    background:var(--red);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .body{
    padding:38px 20px 22px;
  }
  .eyebrow{
    margin:0 0 8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--red);
  }
  h1{
    margin:0 0 8px;
    font-size:23px;
    line-height:1.2;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .desc{
    margin:0;
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
  }
  .meta{
    margin-top:20px;
    border-top:1px solid var(--line);
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    gap:16px;
  }
  .row .label{
    font-size:14px;
    color:var(--muted);
    font-weight:400;
  }
  .row .value{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }
  .next{
    padding-top:18px;
  }
  .next-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .next-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .next-count{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    white-space:nowrap;
  }
  .track{
    margin-top:10px;
    height:6px;
    width:100%;
    background:#ebecef;
    border-radius:4px;
  }
  .fill{
    height:6px;
    width:60%;
    background:var(--red);
    border-radius:4px;
  }
  .caption{
    margin:10px 0 0;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/342/160/architecture?lock=1122" width="342" height="160" alt="City towers at dusk, the artwork for the Skyline Saver badge">
        <div class="medal" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/>
            <path d="M7 5H4v2a3 3 0 0 0 3 3"/>
            <path d="M17 5h3v2a3 3 0 0 1-3 3"/>
            <path d="M12 13v4"/>
            <path d="M9 20h6"/>
          </svg>
        </div>
      </div>
      <div class="body">
        <p class="eyebrow">Milestone unlocked</p>
        <h1>Skyline Saver</h1>
        <p class="desc">You held your Reserve balance above $10,000 for six straight months without a withdrawal.</p>

        <div class="meta">
          <div class="row">
            <span class="label">Earned</span>
            <span class="value">March 14, 2025</span>
          </div>
          <div class="row">
            <span class="label">Streak kept</span>
            <span class="value">184 days</span>
          </div>
        </div>

        <div class="next">
          <div class="next-head">
            <span class="next-title">Next: Landmark Saver</span>
            <span class="next-count">Tier 3 of 5</span>
          </div>
          <div class="track"><div class="fill"></div></div>
          <p class="caption">$15,000 more in Reserve unlocks the next badge.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
