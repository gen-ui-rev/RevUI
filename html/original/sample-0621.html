<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#B45309;
    --ink:#1B1B1B;
    --muted:#767676;
    --rule:#E6E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#EFEDEA;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#FFFFFF;
    padding:26px 0;
  }
  .sheet{padding:0 24px;}

  .title{
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin:5px 0 0;
  }

  .list{
    margin-top:20px;
    border-top:1px solid var(--rule);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--rule);
  }
  .avatar{
    width:36px;
    height:36px;
    flex:0 0 36px;
    border:1px solid var(--rule);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .who{min-width:0;flex:1;}
  .name{
    font-size:15px;
    font-weight:500;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:13px;
    color:var(--muted);
    line-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pick{
    width:22px;
    height:22px;
    flex:0 0 22px;
    border-radius:50%;
    border:1.5px solid #C9C6C2;
  }
  .pick.on{
    border-color:var(--accent);
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .channels{
    display:flex;
    gap:8px;
    margin-top:22px;
  }
  .chan{
    flex:1;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:11px 6px 9px;
    text-align:center;
    color:var(--muted);
  }
  .chan span{
    display:block;
    font-size:12px;
    font-weight:500;
    margin-top:5px;
  }
  .chan.sel{
    border-color:var(--accent);
    background:#FDF6EC;
    color:var(--accent);
  }

  .send{
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px 0;
    border:0;
    border-radius:4px;
    background:var(--accent);
    color:#FFFFFF;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    text-align:center;
  }
  .note{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin:12px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <h1 class="title">Share note</h1>
      <p class="subtitle">Q3 Planning Retro &middot; Harbor Studio workspace</p>

      <div class="list">
        <div class="row">
          <div class="avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Dana Whitfield</div>
            <div class="meta">Can edit &middot; Design</div>
          </div>
          <div class="pick on">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Miles Okafor</div>
            <div class="meta">Can comment &middot; Engineering</div>
          </div>
          <div class="pick on">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><path d="M4 18.5c0-3.6 3.6-6 8-6s8 2.4 8 6"/><circle cx="12" cy="7" r="3.5"/><path d="M9 21h6"/></svg>
          </div>
          <div class="who">
            <div class="name">Product Guild</div>
            <div class="meta">Team &middot; 14 members</div>
          </div>
          <div class="pick"></div>
        </div>
      </div>

      <div class="channels">
        <div class="chan sel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          <span>Copy link</span>
        </div>
        <div class="chan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/></svg>
          <span>Email</span>
        </div>
        <div class="chan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.8-3.6 6.8-8 6.8-1 0-2-.2-2.9-.5L4.5 20l1.2-3.3A6.5 6.5 0 0 1 4 12.2C4 8.4 7.6 5.4 12 5.4s8 3 8 6.8Z"/></svg>
          <span>Message</span>
        </div>
      </div>

      <button class="send" type="button">Share with 2 recipients</button>
      <p class="note">Link opens in view mode until you grant access.</p>
    </div>
  </div>
</body>
</html>
