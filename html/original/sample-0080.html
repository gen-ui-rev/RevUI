<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#5533cc;
    --ink:#1a1720;
    --muted:#5d5866;
    --rule:#d9d5e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#eceaef;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#ffffff;
    padding:34px 24px;
  }
  .wrap{width:342px;margin:0 auto;}

  .eyebrow{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--violet);
    margin:0 0 14px;
  }
  .shot{
    width:342px;
    height:168px;
    display:block;
    object-fit:cover;
    background:#cfcbd6;
    border-radius:4px;
  }
  .meta{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0 16px;
  }
  .mono{
    width:30px;height:30px;
    border-radius:4px;
    background:#efecf8;
    color:var(--violet);
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .meta p{
    margin:0;
    font-size:14px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:0;
  }
  h1{
    font-size:24px;
    line-height:1.25;
    font-weight:700;
    margin:20px 0 8px;
  }
  .body{
    font-size:15px;
    line-height:1.5;
    color:var(--muted);
    margin:0 0 22px;
  }
  .actions{
    display:flex;
    gap:10px;
    padding-top:20px;
  }
  .btn{
    flex:1 1 0;
    border-radius:4px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:13px 8px;
    text-align:center;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--violet);
    color:#fff;
    border:1px solid var(--violet);
  }
  .btn-ghost{
    background:#fff;
    color:var(--ink);
    border:1px solid var(--rule);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="wrap">
      <p class="eyebrow">Shared post</p>

      <img class="shot" src="https://loremflickr.com/342/168/party?lock=2027" width="342" height="168" alt="Friends around a table at the rooftop dinner post being deleted">

      <div class="meta">
        <span class="mono" aria-hidden="true">MW</span>
        <p>Posted by Mara Whitfield &middot; March 4</p>
      </div>

      <hr>

      <h1>Delete this post?</h1>
      <p class="body">The photo, its caption, and 24 comments will be removed from the Rooftop Club circle for all 61 members. Deleting is permanent.</p>

      <hr>

      <div class="actions">
        <div class="btn btn-ghost" role="button" tabindex="0">Keep post</div>
        <div class="btn btn-primary" role="button" tabindex="0">Delete post</div>
      </div>
    </div>
  </div>
</body>
</html>
