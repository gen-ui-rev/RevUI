<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alder &amp; Oak — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #d9d6d1;
    font-family: 'Manrope', system-ui, sans-serif;
  }
  .screen {
    width: 390px;
    height: 844px;
    background: #121212;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* top bar */
  .topbar { padding: 14px 16px 14px; }
  .progress { display: flex; gap: 4px; }
  .seg { flex: 1; height: 3px; background: rgba(255,255,255,0.22); }
  .seg.done { background: #ffffff; }
  .seg.now { position: relative; }
  .seg.now i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: #ff6a1a; display: block; }

  .storyhead { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .mono {
    width: 36px; height: 36px; border-radius: 10px;
    background: #2b2b2b; color: #ffffff;
    font-size: 14px; font-weight: 700; letter-spacing: .02em;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .who { min-width: 0; flex: 1; }
  .who h1 {
    margin: 0; font-size: 15px; font-weight: 700; line-height: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who p {
    margin: 1px 0 0; font-size: 12px; font-weight: 400; line-height: 16px;
    color: #9b9b9b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .close { color: #ffffff; flex: 0 0 auto; line-height: 0; }

  /* hero */
  .hero { display: block; width: 390px; height: 460px; object-fit: cover; background: #262626; }

  /* info */
  .info { padding: 22px 20px 24px; }
  .kicker {
    margin: 0 0 10px; font-size: 12px; font-weight: 700; line-height: 16px;
    letter-spacing: .1em; text-transform: uppercase; color: #ff6a1a;
  }
  .item { display: flex; align-items: center; gap: 14px; }
  .item img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; display: block; background: #262626; flex: 0 0 auto; }
  .item .txt { min-width: 0; }
  .item h2 {
    margin: 0; font-size: 19px; font-weight: 700; line-height: 26px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .price { margin: 4px 0 0; font-size: 15px; line-height: 20px; font-weight: 700; }
  .price s { color: #8f8f8f; font-weight: 400; margin-left: 8px; text-decoration: line-through; }
  .rule { height: 1px; background: #2a2a2a; margin: 18px 0; }
  .cta {
    display: flex; align-items: center; justify-content: center;
    height: 52px; border-radius: 10px; background: #ff6a1a;
    color: #16120f; font-size: 15px; font-weight: 700;
  }

  /* tab bar */
  .tabs {
    margin-top: auto;
    display: flex;
    border-top: 1px solid #2a2a2a;
    padding: 10px 8px 12px;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #8f8f8f; font-size: 12px; font-weight: 500; line-height: 16px;
  }
  .tab.on { color: #ff6a1a; font-weight: 700; }
  .tab svg { display: block; }
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="progress">
        <span class="seg done"></span>
        <span class="seg now"><i></i></span>
        <span class="seg"></span>
      </div>
      <div class="storyhead">
        <div class="mono">AO</div>
        <div class="who">
          <h1>Alder &amp; Oak</h1>
          <p>Walnut studio drop &middot; 2h ago</p>
        </div>
        <a class="close" href="#" aria-label="Close story">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M5.5 5.5l11 11M16.5 5.5l-11 11"/>
          </svg>
        </a>
      </div>
    </div>

    <img class="hero" src="https://loremflickr.com/390/460/furniture?lock=8780" width="390" height="460" alt="Walnut lounge chair with cream cushion in a bright studio corner">

    <div class="info">
      <p class="kicker">In this story</p>
      <div class="item">
        <img src="https://loremflickr.com/56/56/product?lock=8783" width="56" height="56" alt="Product shot of the walnut lounge chair on a plain background">
        <div class="txt">
          <h2>Alder Lounge Chair</h2>
          <p class="price">$486.00 <s>$540.00</s></p>
        </div>
      </div>
      <div class="rule"></div>
      <a class="cta" href="#">View item</a>
    </div>

    <nav class="tabs">
      <a class="tab" href="#">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 9.2L11 3.5l7.5 5.7v8.3a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1V9.2z"/>
        </svg>
        Home
      </a>
      <a class="tab" href="#">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="10" cy="10" r="6.3"/>
          <path d="M14.6 14.6l3.4 3.4"/>
        </svg>
        Search
      </a>
      <a class="tab on" href="#">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="11" cy="11" r="7.6"/>
          <circle cx="11" cy="11" r="3.1"/>
        </svg>
        Stories
      </a>
      <a class="tab" href="#">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7h12l1 11.5H4L5 7z"/>
          <path d="M8.4 7V5.6a2.6 2.6 0 0 1 5.2 0V7"/>
        </svg>
        Bag
      </a>
    </nav>

  </div>
</body>
</html>
