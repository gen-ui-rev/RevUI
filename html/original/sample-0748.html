<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #d4d4d8;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    padding: 32px 20px;
    background: #e4e4e7;
  }
  .sheet {
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(24, 24, 27, 0.14);
  }
  .head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 20px 18px;
    border-bottom: 1px solid #e4e4e7;
  }
  .art {
    width: 52px;
    height: 52px;
    flex: 0 0 52px;
    background: #3f3f46;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .head-text { min-width: 0; }
  .title {
    font-size: 16px;
    font-weight: 500;
    color: #18181b;
    line-height: 1.3;
  }
  .meta {
    margin-top: 6px;
    font-size: 13px;
    color: #71717a;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .actions { padding: 6px 0; }
  .action {
    display: block;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 400;
    color: #18181b;
    line-height: 1.25;
  }
  .action .sub {
    display: block;
    margin-top: 3px;
    font-size: 13px;
    color: #71717a;
  }
  .cancel {
    margin-top: 8px;
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(24, 24, 27, 0.14);
    padding: 16px 20px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: #52525b;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="head">
        <div class="art" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
            <path d="M12 18v3.5"></path>
          </svg>
        </div>
        <div class="head-text">
          <div class="title">The Quiet Part of the Grid</div>
          <div class="meta">Field Notes &middot; Episode 142 &middot; 48 min</div>
        </div>
      </div>
      <div class="actions">
        <div class="action">Play next</div>
        <div class="action">Add to playlist</div>
        <div class="action">
          Download episode
          <span class="sub">62 MB over Wi-Fi</span>
        </div>
        <div class="action">Share episode</div>
      </div>
    </div>
    <div class="cancel">Cancel</div>
  </div>
</body>
</html>
