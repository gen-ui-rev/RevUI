<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Items — Northline Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e4e4e7;
      color: #18181b;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fafafa;
      border: 1px solid #d4d4d8;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 21px 24px 19px;
      border-bottom: 1px solid #d4d4d8;
    }

    .service-name {
      font-size: 17px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .bag-link {
      color: #3f3f46;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 600;
      text-decoration: none;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 0 24px;
    }

    .empty-state {
      padding-top: 67px;
    }

    .section-label {
      margin: 0 0 17px;
      color: #71717a;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 310px;
      margin: 0;
      color: #18181b;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      max-width: 310px;
      margin: 22px 0 0;
      color: #52525b;
      font-size: 16px;
      line-height: 1.55;
    }

    .action {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 33px;
      padding: 14px 20px;
      background: #27272a;
      color: #fafafa;
      border: 1px solid #27272a;
      border-radius: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      text-decoration: none;
    }

    .helper {
      margin: 14px 0 0;
      color: #71717a;
      font-size: 14px;
      line-height: 1.45;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #d4d4d8;
      background: #fafafa;
    }

    .tab {
      position: relative;
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: center;
      padding: 18px 4px 16px;
      color: #71717a;
      font-size: 14px;
      line-height: 1;
      font-weight: 600;
      text-decoration: none;
    }

    .tab.active {
      color: #18181b;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 18px;
      right: 18px;
      height: 3px;
      background: #27272a;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="service-name">Northline Market</div>
      <a class="bag-link" href="#" aria-label="Open bag with zero items">Bag (0)</a>
    </header>

    <main>
      <section class="empty-state" aria-labelledby="saved-heading">
        <p class="section-label">Saved items</p>
        <h1 id="saved-heading">Your saved list is empty.</h1>
        <p class="description">Keep products here while you compare details or decide what to buy.</p>
        <a class="action" href="#">Browse the marketplace</a>
        <p class="helper">Use “Save” on any product to add it to this list.</p>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <a class="tab" href="#">Home</a>
      <a class="tab" href="#">Shop</a>
      <a class="tab active" href="#" aria-current="page">Saved</a>
      <a class="tab" href="#">Account</a>
    </nav>
  </div>
</body>
</html>
