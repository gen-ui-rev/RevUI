<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrange Storefront Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deded8;
      color: #25271f;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f5f4ef;
    }

    .component {
      width: 100%;
    }

    .intro {
      padding: 24px 22px;
      background: rgba(105, 112, 55, 0.14);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #626a32;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #34391d;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 12px 0 0;
      color: #5e6155;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .reorder-list {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .reorder-item {
      min-width: 0;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(105, 112, 55, 0.09);
    }

    .drag-handle {
      width: 22px;
      flex: 0 0 22px;
      color: #697037;
      line-height: 0;
      cursor: grab;
    }

    .drag-handle svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    .item-copy {
      min-width: 0;
    }

    .item-name {
      margin: 0;
      color: #292c22;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .item-detail {
      margin: 3px 0 0;
      color: #6a6d61;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .save-button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 18px;
      border: 0;
      border-radius: 0;
      background: #697037;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="reorder-title">
      <header class="intro">
        <p class="eyebrow">Morrow Market storefront</p>
        <h1 id="reorder-title">Arrange collections</h1>
        <p class="description">Drag each handle to set the order shoppers see on your store page.</p>
      </header>

      <ol class="reorder-list" aria-label="Storefront collection order">
        <li class="reorder-item" draggable="true">
          <span class="drag-handle" aria-label="Drag New arrivals">
            <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <circle cx="7" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <div class="item-copy">
            <p class="item-name">New arrivals</p>
            <p class="item-detail">24 products</p>
          </div>
        </li>

        <li class="reorder-item" draggable="true">
          <span class="drag-handle" aria-label="Drag Home essentials">
            <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <circle cx="7" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <div class="item-copy">
            <p class="item-name">Home essentials</p>
            <p class="item-detail">18 products</p>
          </div>
        </li>

        <li class="reorder-item" draggable="true">
          <span class="drag-handle" aria-label="Drag Under $30">
            <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <circle cx="7" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="7" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
          <div class="item-copy">
            <p class="item-name">Under $30</p>
            <p class="item-detail">31 products</p>
          </div>
        </li>
      </ol>

      <button class="save-button" type="button">Save order</button>
    </main>
  </div>
</body>
</html>
