<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Booking Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e5;
      color: #252225;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f7f6f5;
    }

    .goal-card {
      padding: 24px;
      background: #ffffff;
      border: 1px solid #dedbdd;
      border-radius: 10px;
    }

    .service {
      margin: 0 0 18px;
      color: #777176;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;
    }

    .trip-date {
      margin: 5px 0 24px;
      color: #6f696e;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .progress-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .percentage {
      color: #c026a7;
      font-size: 32px;
      line-height: 1;
      font-weight: 600;
    }

    .amount {
      color: #4e494d;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
      text-align: right;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #eee9ed;
      border-radius: 10px;
    }

    .progress-fill {
      width: 68%;
      height: 10px;
      background: #c026a7;
      border-radius: 10px;
    }

    .remaining {
      margin: 16px 0 0;
      padding-top: 16px;
      border-top: 1px solid #e6e2e5;
      color: #4e494d;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .remaining strong {
      color: #252225;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <p class="service">Roamstead trips</p>
      <h1 id="goal-title">Lisbon booking goal</h1>
      <p class="trip-date">Stay planned for October 12–18, 2025</p>

      <div class="progress-summary">
        <span class="percentage">68%</span>
        <span class="amount">$1,360 of $2,000</span>
      </div>

      <div class="progress-track" role="progressbar" aria-label="Lisbon booking fund" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="1360">
        <div class="progress-fill"></div>
      </div>

      <p class="remaining"><strong>$640 remaining</strong> to reserve the stay.</p>
    </section>
  </div>
</body>
</html>
