<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavefold Notification Permission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dededb;
      color: #17191c;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #f7f7f4;
    }

    .permission {
      width: 100%;
      padding: 28px;
      border: 1px solid #c9cccf;
      border-top: 4px solid #1769c2;
      border-radius: 0;
      background: #ffffff;
    }

    .service {
      margin: 0 0 26px;
      color: #1769c2;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 260px;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 16px 0 0;
      color: #4c5157;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
    }

    .permission-note {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid #d9dbdd;
      color: #24282c;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      margin-top: 28px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 0;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .allow {
      border: 1px solid #1769c2;
      background: #1769c2;
      color: #ffffff;
    }

    .later {
      margin-top: 10px;
      border: 1px solid #bfc3c7;
      background: #ffffff;
      color: #353a3f;
    }

    button:focus-visible {
      outline: 2px solid #17191c;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission" aria-labelledby="permission-title">
      <p class="service">Wavefold Podcasts</p>
      <h1 id="permission-title">Allow episode notifications</h1>
      <p class="description">
        Get an alert when a show you follow releases a new episode. You can change this permission in your device settings.
      </p>
      <p class="permission-note">
        Wavefold will only notify you about followed shows and saved listening reminders.
      </p>
      <div class="actions">
        <button class="allow" type="button">Allow notifications</button>
        <button class="later" type="button">Not now</button>
      </div>
    </section>
  </div>
</body>
</html>
