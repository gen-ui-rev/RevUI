<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf0;
      color: #17232d;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 28px;
      background: #f8fafb;
    }

    .success-card {
      padding: 30px 26px 26px;
      text-align: center;
      background: rgba(49, 166, 222, 0.11);
      border-radius: 6px;
    }

    .celebration {
      display: block;
      width: 104px;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      color: #117fb5;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .message {
      margin: 12px 0 0;
      color: #4d5f6b;
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
    }

    .completion {
      margin-top: 22px;
      padding: 14px 16px;
      background: rgba(49, 166, 222, 0.13);
      border-radius: 6px;
      text-align: left;
    }

    .completion-label {
      display: block;
      margin-bottom: 4px;
      color: #62747f;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .completion-value {
      display: block;
      color: #233540;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .primary-action {
      width: 100%;
      margin-top: 22px;
      padding: 14px 18px;
      border: 0;
      border-radius: 6px;
      background: #188fc8;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="success-card" aria-labelledby="success-title">
      <svg class="celebration" viewBox="0 0 104 94" role="img" aria-label="Lesson completed successfully">
        <path d="M18 27L11 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M86 27L93 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M29 12L26 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M75 12L78 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <circle cx="8" cy="48" r="3" fill="#7DC9EB"/>
        <circle cx="96" cy="48" r="3" fill="#7DC9EB"/>
        <path d="M17 68L9 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
        <path d="M87 68L95 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
        <circle cx="52" cy="50" r="34" fill="#31A6DE"/>
        <path d="M36 50L47 61L69 38" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 id="success-title">Lesson complete</h1>
      <p class="message">You finished “Ordering at a Café.” Your progress has been saved to your Northword course.</p>

      <div class="completion">
        <span class="completion-label">Course progress</span>
        <span class="completion-value">8 of 10 lessons completed</span>
      </div>

      <button class="primary-action" type="button">Continue learning</button>
    </section>
  </main>
</body>
</html>
