<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e8e7;
      color: #273032;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 48px 24px;
      background: #eef0ef;
    }

    .loading-card {
      width: 100%;
      padding: 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 22px rgba(46, 58, 60, 0.09);
    }

    .service-name {
      margin: 0 0 10px;
      color: #71868a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #263033;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.2;
    }

    .spinner {
      display: block;
      width: 56px;
      margin: 26px auto 22px;
      color: #8fa8ad;
    }

    .spinner-track {
      stroke: #e1e8e9;
    }

    .spinner-mark {
      stroke: currentColor;
    }

    .description {
      margin: 0;
      color: #596467;
      font-size: 15px;
      line-height: 1.55;
    }

    .status {
      margin: 16px 0 0;
      color: #788285;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="loading-card" role="status" aria-live="polite" aria-label="Opening the project room">
      <p class="service-name">Northfold</p>
      <h1>Opening the project room</h1>

      <svg class="spinner" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="spinner-track" cx="28" cy="28" r="22" fill="none" stroke-width="5"></circle>
        <path class="spinner-mark" d="M28 6a22 22 0 0 1 20.9 15.2" fill="none" stroke-width="5" stroke-linecap="round"></path>
      </svg>

      <p class="description">We’re gathering shared notes and recent updates for the Atlas planning room.</p>
      <p class="status">This may take a moment.</p>
    </section>
  </div>
</body>
</html>
