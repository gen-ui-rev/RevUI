<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Collaborators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8e6;
      color: #262222;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 18px;
      background: #f5f4f2;
    }

    .selector {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9d5d2;
      border-radius: 6px;
    }

    .selector-header {
      padding: 18px 16px;
      border-bottom: 1px solid #e3dfdc;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #c93636;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
    }

    .description {
      margin: 0;
      color: #6d6662;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
    }

    .search-area {
      padding: 14px 16px;
      border-bottom: 1px solid #e3dfdc;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border: 1px solid #cbc6c3;
      border-radius: 6px;
      background: #ffffff;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #7a7470;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #262222;
      font: 400 14px/1.4 'Inter', system-ui, sans-serif;
    }

    .search-box input::placeholder {
      color: #89827e;
      opacity: 1;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 11px 16px 8px;
    }

    .list-title,
    .selected-count {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .list-title {
      color: #625b57;
    }

    .selected-count {
      color: #c93636;
    }

    .people-list {
      border-top: 1px solid #eeeae7;
    }

    .person {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #eeeae7;
    }

    .person.selected {
      background: #fff7f7;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 6px;
      background: #d9d3cf;
    }

    .avatar.rose {
      background: #e5c9c7;
    }

    .avatar.slate {
      background: #ccd2d4;
    }

    .avatar.sand {
      background: #ddd1bd;
    }

    .avatar.mauve {
      background: #d6ccd7;
    }

    .person-copy {
      min-width: 0;
      flex: 1;
    }

    .person-name,
    .person-role {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .person-name {
      color: #282322;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .person-role {
      margin-top: 2px;
      color: #746d69;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    .person input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #aaa39f;
      border-radius: 4px;
      background: #ffffff;
      color: transparent;
    }

    .person input:checked + .checkbox {
      border-color: #c93636;
      background: #c93636;
      color: #ffffff;
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
    }

    .selector-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 16px;
    }

    .selection-summary {
      margin: 0;
      color: #6d6662;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .add-button {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid #b92d2d;
      border-radius: 6px;
      background: #c93636;
      color: #ffffff;
      font: 600 14px/1.35 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="selector" aria-labelledby="selector-title">
      <header class="selector-header">
        <p class="eyebrow">Project access</p>
        <h1 id="selector-title">Choose collaborators</h1>
        <p class="description">Select the people who can edit the Horizon planning note.</p>
      </header>

      <div class="search-area">
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input type="text" aria-label="Search workspace members" placeholder="Search by name or role">
        </label>
      </div>

      <div class="list-heading">
        <p class="list-title">Workspace members</p>
        <p class="selected-count">2 selected</p>
      </div>

      <div class="people-list">
        <label class="person selected">
          <span class="avatar rose" aria-hidden="true"></span>
          <span class="person-copy">
            <span class="person-name">Liora Vale</span>
            <span class="person-role">Product design</span>
          </span>
          <input type="checkbox" checked aria-label="Select Liora Vale">
          <span class="checkbox" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
        </label>

        <label class="person">
          <span class="avatar slate" aria-hidden="true"></span>
          <span class="person-copy">
            <span class="person-name">Bren Orwin</span>
            <span class="person-role">Engineering</span>
          </span>
          <input type="checkbox" aria-label="Select Bren Orwin">
          <span class="checkbox" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
        </label>

        <label class="person selected">
          <span class="avatar sand" aria-hidden="true"></span>
          <span class="person-copy">
            <span class="person-name">Sela Marin</span>
            <span class="person-role">Project operations</span>
          </span>
          <input type="checkbox" checked aria-label="Select Sela Marin">
          <span class="checkbox" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
        </label>

        <label class="person">
          <span class="avatar mauve" aria-hidden="true"></span>
          <span class="person-copy">
            <span class="person-name">Daven Rook</span>
            <span class="person-role">User research</span>
          </span>
          <input type="checkbox" aria-label="Select Daven Rook">
          <span class="checkbox" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
        </label>
      </div>

      <footer class="selector-footer">
        <p class="selection-summary">Editors can update this note.</p>
        <button class="add-button" type="button">Add 2 people</button>
      </footer>
    </section>
  </div>
</body>
</html>
