<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Voice Visit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e9e8;
      color: #1e2927;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfcfb;
      border: 1px solid #d8dddb;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 20px;
      background: #fbfcfb;
      border-bottom: 1px solid #d9dfdd;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-button,
    .help-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #263431;
    }

    .back-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
    }

    .brand {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
    }

    .brand-context {
      margin: 2px 0 0;
      color: #687572;
      font-size: 12px;
      line-height: 16px;
    }

    .help-button {
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .call-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 24px 38px;
      text-align: center;
      background: #e3eeeb;
    }

    .visit-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
      color: #526561;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state-mark {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #688f87;
    }

    .clinician-image {
      width: 122px;
      height: 122px;
      margin-bottom: 24px;
      border: 1px solid #afc7c1;
      border-radius: 6px;
      background: #bfd4cf;
    }

    .call-stage h1 {
      margin: 0;
      color: #172321;
      font-size: 28px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .specialty {
      margin: 8px 0 0;
      color: #50615d;
      font-size: 14px;
      line-height: 20px;
    }

    .duration {
      margin: 20px 0 0;
      color: #1f3430;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .security {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 14px 0 0;
      color: #60716d;
      font-size: 12px;
      line-height: 16px;
    }

    .visit-details {
      padding: 16px 20px 14px;
      background: #fbfcfb;
      border-top: 1px solid #d4ddda;
    }

    .section-title {
      margin: 0 0 8px;
      color: #263431;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding: 9px 0;
      border-top: 1px solid #e1e5e4;
      font-size: 14px;
      line-height: 20px;
    }

    .detail-label {
      flex: 0 0 auto;
      color: #6b7774;
    }

    .detail-value {
      min-width: 0;
      color: #273330;
      font-weight: 500;
      text-align: right;
    }

    .stable {
      color: #4f776f;
    }

    .call-controls {
      padding: 15px 17px 19px;
      background: #f7f9f8;
      border-top: 1px solid #d4dbd9;
    }

    .controls-label {
      margin: 0 0 13px;
      color: #65716e;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #2b3835;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .control-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 1px solid #cdd6d3;
      border-radius: 6px;
      background: #ffffff;
      color: #2f403c;
    }

    .control.active .control-icon {
      border-color: #789b93;
      background: #dceae7;
    }

    .control.end {
      color: #8d3e3e;
    }

    .control.end .control-icon {
      border-color: #a44a4a;
      background: #a44a4a;
      color: #ffffff;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-button" type="button" aria-label="Leave call screen">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15.5 5L8.5 12L15.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="brand">
          <p class="brand-name">Avenlow Health</p>
          <p class="brand-context">Live voice visit</p>
        </div>
      </div>
      <button class="help-button" type="button">Help</button>
    </header>

    <main class="call-stage">
      <div class="visit-state">
        <span class="state-mark" aria-hidden="true"></span>
        Connected
      </div>

      <div class="clinician-image" role="img" aria-label="Clinician profile image"></div>

      <h1>Dr. Elara Finch</h1>
      <p class="specialty">Sleep medicine clinician</p>
      <p class="duration">08:42</p>

      <p class="security">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5.5" y="10.5" width="13" height="9" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.5 10.5V7.5C8.5 5.57 10.07 4 12 4C13.93 4 15.5 5.57 15.5 7.5V10.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Audio is encrypted
      </p>
    </main>

    <section class="visit-details" aria-labelledby="visit-details-title">
      <h2 class="section-title" id="visit-details-title">Visit details</h2>
      <div class="detail-row">
        <span class="detail-label">Connection</span>
        <span class="detail-value stable">Stable</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Scheduled</span>
        <span class="detail-value">Today, 2:30–3:00 PM</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Visit topic</span>
        <span class="detail-value">Sleep follow-up</span>
      </div>
    </section>

    <nav class="call-controls" aria-label="Call controls">
      <p class="controls-label">Call controls</p>
      <div class="control-grid">
        <button class="control" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8.5" y="3.5" width="7" height="11" rx="3.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5M12 18V21M9 21H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Mute</span>
        </button>

        <button class="control active" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 14.5H8.2L13 18.5V5.5L8.2 9.5H5V14.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M16 9C17.33 10.67 17.33 13.33 16 15M18.5 6.5C21.2 9.7 21.2 14.3 18.5 17.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Speaker</span>
        </button>

        <button class="control" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3.5" y="6.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M15.5 10L20.5 7.5V16.5L15.5 14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>Video</span>
        </button>

        <button class="control end" type="button">
          <span class="control-icon">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 15.5C8.9 12.17 15.1 12.17 19 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M7.5 13.9L6 17M16.5 13.9L18 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span>End</span>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
