<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9ece8;
      color: #1c211e;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 22px;
      background: #f4f6f3;
    }

    .delete-card {
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d8ded9;
      border-radius: 6px;
    }

    .icon-box {
      width: 46px;
      padding: 10px;
      margin-bottom: 18px;
      color: #278653;
      background: #edf7f0;
      border: 1px solid #cfe4d5;
      border-radius: 6px;
      line-height: 0;
    }

    .icon-box svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 0;
      color: #5c655f;
      font-size: 14px;
      line-height: 1.55;
    }

    .episode {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      padding: 12px;
      border: 1px solid #d8ded9;
      border-radius: 6px;
    }

    .episode-glyph {
      flex: 0 0 auto;
      width: 38px;
      padding: 8px;
      color: #4d5851;
      background: #f1f3f1;
      border-radius: 6px;
      line-height: 0;
    }

    .episode-glyph svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    .episode-copy {
      min-width: 0;
    }

    .episode-title {
      margin: 0;
      overflow: hidden;
      color: #202622;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .episode-meta {
      margin: 2px 0 0;
      color: #707872;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    .warning {
      margin: 0 0 20px;
      padding-left: 11px;
      color: #4f5952;
      border-left: 2px solid #278653;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 6px;
      font: 700 14px/1.4 'Manrope', system-ui, sans-serif;
      cursor: default;
    }

    .delete-button {
      color: #ffffff;
      background: #278653;
      border: 1px solid #278653;
    }

    .cancel-button {
      color: #303732;
      background: #ffffff;
      border: 1px solid #cfd5d0;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="delete-card" aria-labelledby="delete-title">
      <div class="icon-box" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M9 3.75H15L16 7H8L9 3.75Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M6.5 7L7.25 20.25H16.75L17.5 7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M10 10.5V16.75M14 10.5V16.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="delete-title">Delete this episode?</h1>
      <p class="description">The episode will be removed from Sound Harbor and will no longer be available to listeners.</p>

      <div class="episode">
        <div class="episode-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 15V9M9.5 18V6M14.5 16V8M19 14V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="episode-copy">
          <p class="episode-title">Night Signals: The Last Broadcast</p>
          <p class="episode-meta">Episode 42 · 38 min</p>
        </div>
      </div>

      <p class="warning">This will not move the episode to Archive. Deletion is permanent and cannot be undone.</p>

      <div class="actions">
        <button class="delete-button" type="button">Delete episode</button>
        <button class="cancel-button" type="button">Keep episode</button>
      </div>
    </article>
  </div>
</body>
</html>
