<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfarer Loft — Shuttle Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#C07310;
    --ink:#1E1A15;
    --muted:#7B7365;
    --line:#E4DFD4;
  }
  html,body{margin:0;}
  body{
    background:#F2F0EC;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:26px 0;
    box-sizing:border-box;
    background:#F2F0EC;
  }
  .card{
    width:334px;
    margin:0 auto;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:14px;
  }
  .card img{
    width:332px;
    height:148px;
    display:block;
    object-fit:cover;
    background:#DCD6CB;
    border-radius:13px 13px 0 0;
  }
  .body{padding:18px 20px 20px;}
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 6px;
  }
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:600;
    font-size:21px;
    line-height:1.25;
    margin:0 0 4px;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0 0 16px;
  }
  .clock{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:46px;
    line-height:1;
    letter-spacing:.01em;
    margin:0 0 4px;
    font-variant-numeric:tabular-nums;
  }
  .clock small{
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-left:8px;
    vertical-align:6px;
  }
  .track{
    height:6px;
    border-radius:999px;
    background:#EFEBE3;
    margin:16px 0 8px;
  }
  .fill{
    height:6px;
    width:62%;
    border-radius:999px;
    background:var(--amber);
  }
  .ends{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .controls{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    border:1px solid var(--amber);
    background:var(--amber);
    color:#fff;
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:15px;
    font-weight:600;
    border-radius:14px;
    padding:12px 0;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .icon-btn{
    width:48px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .foot{
    display:flex;
    align-items:center;
    gap:10px;
    border-top:1px solid var(--line);
    margin-top:18px;
    padding-top:14px;
  }
  .mono{
    width:34px;
    height:34px;
    border-radius:14px;
    border:1px solid var(--line);
    background:#F7F4EE;
    color:var(--amber);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .foot p{
    margin:0;
    font-size:13px;
    color:var(--muted);
    line-height:1.35;
  }
  .foot strong{
    color:var(--ink);
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img src="https://loremflickr.com/332/148/hotel?lock=5583" width="332" height="148" alt="Front drive of the Wayfarer Loft where the airport shuttle boards">
      <div class="body">
        <p class="eyebrow">Shuttle countdown</p>
        <h1>Terminal 2 airport shuttle</h1>
        <p class="sub">Wayfarer Loft · Lobby entrance, bay 3</p>

        <div class="clock">01:12:38<small>left</small></div>

        <div class="track"><div class="fill"></div></div>
        <div class="ends">
          <span>Started 3:32 PM</span>
          <span>Departs 4:45 PM</span>
        </div>

        <div class="controls">
          <div class="btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
              <rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
            </svg>
            Pause
          </div>
          <div class="icon-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.2 9a5.8 5.8 0 1 0 1.9-4.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M3 2.6V6h3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="foot">
          <div class="mono">DR</div>
          <p>Driver <strong>Della Roque</strong> confirmed the 4:45 PM run for 2 guests.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
