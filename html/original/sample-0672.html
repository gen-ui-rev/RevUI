<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel Pay — Transfer activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #E9EAEC;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .screen {
    width: 390px;
    background: #E9EAEC;
    padding: 60px 24px;
  }
  .island {
    width: 100%;
    background: #0B0C0F;
    border-radius: 28px;
    padding: 18px 20px 20px;
    box-shadow: 0 10px 28px rgba(17, 20, 28, 0.20);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .thumb {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #2F6BFF;
    flex: none;
  }
  .who {
    flex: 1;
    min-width: 0;
  }
  .kicker {
    font-size: 12px;
    line-height: 1.3;
    color: #8B909A;
    letter-spacing: 0.02em;
  }
  .name {
    font-size: 17px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.35;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .amount {
    flex: none;
    text-align: right;
    padding-left: 8px;
  }
  .amount .value {
    font-size: 17px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.35;
  }
  .amount .unit {
    font-size: 12px;
    color: #8B909A;
    line-height: 1.3;
    margin-top: 2px;
  }
  .track {
    margin-top: 20px;
    height: 6px;
    border-radius: 3px;
    background: #22252C;
    overflow: hidden;
  }
  .fill {
    width: 68%;
    height: 6px;
    border-radius: 3px;
    background: #2F6BFF;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 11px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    color: #E4E6EA;
    min-width: 0;
  }
  .step svg { display: block; flex: none; }
  .step span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .eta {
    font-size: 14px;
    color: #8B909A;
    white-space: nowrap;
    flex: none;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="head">
        <div class="thumb"></div>
        <div class="who">
          <div class="kicker">Kestrel Pay · Transfer</div>
          <div class="name">Maya Okonkwo</div>
        </div>
        <div class="amount">
          <div class="value">$1,240.00</div>
          <div class="unit">USD</div>
        </div>
      </div>
      <div class="track"><div class="fill"></div></div>
      <div class="foot">
        <div class="step">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <circle cx="7" cy="7" r="6" fill="none" stroke="#2F6BFF" stroke-width="2"></circle>
            <path d="M7 3.6V7l2.3 1.4" fill="none" stroke="#2F6BFF" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <span>Clearing · step 2 of 3</span>
        </div>
        <div class="eta">Arrives 3:42 PM</div>
      </div>
    </div>
  </div>
</body>
</html>
