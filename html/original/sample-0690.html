<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Followers — Perch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e9e9e6;
    font-family: 'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    padding: 24px 20px;
    background: #e9e9e6;
  }
  .card {
    background: #ffffff;
    border-radius: 4px;
    box-shadow: 0 2px 10px rgba(24, 24, 27, 0.08);
    overflow: hidden;
  }
  .head {
    padding: 20px 18px 0;
  }
  .head h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    color: #18181b;
    letter-spacing: -0.2px;
  }
  .head p {
    margin: 4px 0 0;
    font-size: 13px;
    font-weight: 400;
    color: #71717a;
  }
  .tabs {
    display: flex;
    gap: 22px;
    margin-top: 16px;
    border-bottom: 1px solid #ececec;
  }
  .tab {
    padding: 0 0 10px;
    font-size: 14px;
    font-weight: 500;
    color: #a1a1aa;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.on {
    color: #18181b;
    border-bottom-color: #f0a316;
  }
  .tab span {
    font-weight: 400;
    color: #a1a1aa;
  }
  .tab.on span { color: #b78018; }

  .list { padding: 4px 0 6px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
  }
  .av {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border-radius: 4px;
    background: #f4f4f5;
    color: #52525b;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.3px;
  }
  .who {
    min-width: 0;
    flex: 1;
  }
  .who .nm {
    font-size: 14px;
    font-weight: 500;
    color: #18181b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .who .sub {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 400;
    color: #8a8a93;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    flex: 0 0 auto;
    width: 92px;
    padding: 8px 0;
    text-align: center;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .btn.fill {
    background: #f0a316;
    color: #241a05;
  }
  .btn.ghost {
    background: #ffffff;
    color: #52525b;
    border-color: #dcdcde;
  }
  .foot {
    border-top: 1px solid #ececec;
    padding: 13px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: #8a6413;
  }
  .foot svg { display: block; }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Followers</h1>
        <p>1,284 people follow Perch Studio</p>
        <div class="tabs">
          <div class="tab on">Followers <span>1,284</span></div>
          <div class="tab">Following <span>312</span></div>
        </div>
      </div>

      <div class="list">
        <div class="row">
          <div class="av">MR</div>
          <div class="who">
            <div class="nm">Marisol Reyes</div>
            <div class="sub">@marisol · 12 mutual</div>
          </div>
          <div class="btn fill">Follow back</div>
        </div>

        <div class="row">
          <div class="av">DK</div>
          <div class="who">
            <div class="nm">Devin Kwan</div>
            <div class="sub">@dkwan · 4 mutual</div>
          </div>
          <div class="btn ghost">Following</div>
        </div>

        <div class="row">
          <div class="av">TA</div>
          <div class="who">
            <div class="nm">Theodora Ainsworth-Pyle</div>
            <div class="sub">@theo.ap · joined Mar 2024</div>
          </div>
          <div class="btn fill">Follow back</div>
        </div>

        <div class="row">
          <div class="av">JB</div>
          <div class="who">
            <div class="nm">Jonah Betts</div>
            <div class="sub">@jonahb · 27 mutual</div>
          </div>
          <div class="btn ghost">Following</div>
        </div>
      </div>

      <div class="foot">
        Show 1,280 more
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a6413" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  </div>
</body>
</html>
