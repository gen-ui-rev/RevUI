<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#5F7C8A;
    --accent-soft:rgba(95,124,138,0.12);
    --accent-softer:rgba(95,124,138,0.07);
    --ink:#1D2427;
    --muted:#6B767B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#ECEDEC;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#FFFFFF;
    padding:32px 28px;
  }
  .mark{
    width:56px;
    height:56px;
    border-radius:6px;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    font-size:22px;
    font-weight:700;
    line-height:1.25;
    margin:22px 0 0;
    letter-spacing:-0.2px;
  }
  .seller{
    font-size:14px;
    font-weight:500;
    color:var(--accent);
    margin:6px 0 0;
  }
  .body{
    font-size:14px;
    font-weight:400;
    line-height:1.55;
    color:var(--muted);
    margin:12px 0 0;
  }
  .panel{
    margin-top:22px;
    background:var(--accent-softer);
    border-radius:6px;
    padding:6px 16px;
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:12px 0;
  }
  .row + .row{
    box-shadow:inset 0 1px 0 rgba(95,124,138,0.14);
  }
  .row .label{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .value{
    font-size:14px;
    font-weight:400;
    color:var(--muted);
    white-space:nowrap;
  }
  .primary{
    display:block;
    width:100%;
    margin-top:24px;
    padding:15px 0;
    border-radius:6px;
    background:var(--accent);
    color:#FFFFFF;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
    border:0;
  }
  .secondary{
    display:block;
    width:100%;
    margin-top:6px;
    padding:13px 0;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    text-align:center;
    border:0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5F7C8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line>
      </svg>
    </div>

    <h1>Seller blocked</h1>
    <p class="seller">Harbor Row Goods</p>
    <p class="body">Their listings are out of your feed and search results, and they can no longer message you or make offers on your items.</p>

    <div class="panel">
      <div class="row">
        <span class="label">Their listings</span>
        <span class="value">Hidden</span>
      </div>
      <div class="row">
        <span class="label">Direct messages</span>
        <span class="value">Blocked</span>
      </div>
      <div class="row">
        <span class="label">Order 48-2210</span>
        <span class="value">Unaffected</span>
      </div>
    </div>

    <button class="primary" type="button">Done</button>
    <button class="secondary" type="button">Undo block</button>
  </div>
</body>
</html>
