<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e8e9ea;
    font-family:'Inter', system-ui, sans-serif;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:#1e2023;
    padding:44px 0;
  }
  .banner{
    width:326px;
    margin:0 auto;
    box-sizing:border-box;
    background:#272a2e;
    border:1px solid #3a3e44;
    border-radius:10px;
    padding:16px;
  }
  .head{
    display:flex;
    align-items:center;
    gap:8px;
    padding-bottom:14px;
    border-bottom:1px solid #34383e;
  }
  .head svg{display:block}
  .brand{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:#22d3ee;
  }
  .order{
    margin-left:auto;
    font-size:12px;
    font-weight:400;
    color:#9aa0a8;
  }
  .main{
    display:flex;
    gap:14px;
    align-items:center;
    padding:14px 0 18px;
  }
  .main img{
    display:block;
    width:64px;
    height:64px;
    object-fit:cover;
    background:#3a3e44;
    border-radius:10px;
  }
  .info{min-width:0}
  .stage{
    font-size:16px;
    font-weight:600;
    color:#f3f4f6;
    margin:0 0 5px;
  }
  .items{
    font-size:14px;
    font-weight:400;
    color:#9aa0a8;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track{
    height:6px;
    background:#3a3e44;
    border-radius:3px;
  }
  .fill{
    width:72%;
    height:6px;
    background:#22d3ee;
    border-radius:3px;
  }
  .meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-top:10px;
  }
  .meta .left{
    font-size:12px;
    font-weight:500;
    color:#22d3ee;
  }
  .meta .right{
    font-size:12px;
    font-weight:400;
    color:#9aa0a8;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4.5h11l-1 8.5h-9l-1-8.5Z" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M5.6 6.2V4.1a2.4 2.4 0 0 1 4.8 0v2.1" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="brand">Loop Market</span>
        <span class="order">Order 48120</span>
      </div>

      <div class="main">
        <img src="https://loremflickr.com/64/64/furniture?lock=6921" width="64" height="64" alt="Alder lounge chair being delivered">
        <div class="info">
          <p class="stage">Out for delivery</p>
          <p class="items">Alder Lounge Chair + 1 more item</p>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="meta">
        <span class="left">1 stop away</span>
        <span class="right">Arrives by 4:35 PM</span>
      </div>
    </div>
  </div>
</body>
</html>
