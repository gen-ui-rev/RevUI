<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinned Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe3df;
      color: #202621;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 20px;
      background: #eef1ef;
    }

    .pin-card {
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(31, 48, 37, 0.10);
    }

    .card-intro {
      padding: 24px;
      background: #247a4a;
      color: #ffffff;
      border-radius: 4px 4px 0 0;
    }

    .pin-mark {
      width: 42px;
      height: 42px;
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 4px;
    }

    .pin-mark svg {
      width: 22px;
      height: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .intro-copy {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: #e3f1e8;
    }

    .card-content {
      padding: 20px 20px 18px;
    }

    .list-heading {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
    }

    .pin-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .pin-row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #e5e9e6;
    }

    .pin-row:last-child {
      border-bottom: 1px solid #e5e9e6;
    }

    .pin-row img {
      width: 56px;
      height: 56px;
      display: block;
      object-fit: cover;
      background: #d8ded9;
      border-radius: 4px;
    }

    .item-copy {
      min-width: 0;
    }

    .item-title {
      margin: 0 0 4px;
      overflow: hidden;
      color: #202621;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      margin: 0;
      color: #707871;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    .unpin-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #cbd4cd;
      border-radius: 4px;
      background: #ffffff;
      color: #247a4a;
      font: inherit;
      cursor: pointer;
    }

    .unpin-button svg {
      width: 18px;
      height: 18px;
    }

    .boundary-note {
      margin: 16px 0 0;
      color: #687169;
      font-size: 12px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pinned-title">
      <div class="card-intro">
        <div class="pin-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8.4 3.75h7.2l-1.15 6.1 2.8 2.8v1.6H6.75v-1.6l2.8-2.8L8.4 3.75Z" fill="currentColor"/>
            <path d="M12 14.25v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="pinned-title">Pinned for you</h1>
        <p class="intro-copy">Keep the work you open most at the top of your Loomfield workspace.</p>
      </div>

      <div class="card-content">
        <h2 class="list-heading">2 pinned items</h2>

        <ul class="pin-list">
          <li class="pin-row">
            <img src="https://loremflickr.com/56/56/notebook?lock=4310" width="56" height="56" alt="Open notebook beside a project plan">
            <div class="item-copy">
              <p class="item-title">Weekly planning notes</p>
              <p class="item-meta">Updated May 14 by Nina Cole</p>
            </div>
            <button class="unpin-button" type="button" aria-label="Unpin Weekly planning notes" title="Unpin">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.4 3.75h7.2l-1.15 6.1 2.8 2.8v1.6H6.75v-1.6l2.8-2.8L8.4 3.75Z" fill="currentColor"/>
                <path d="M12 14.25v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </li>

          <li class="pin-row">
            <img src="https://loremflickr.com/56/56/meeting?lock=4311" width="56" height="56" alt="Team meeting around a shared table">
            <div class="item-copy">
              <p class="item-title">Launch review agenda</p>
              <p class="item-meta">Updated May 12 by Owen Hart</p>
            </div>
            <button class="unpin-button" type="button" aria-label="Unpin Launch review agenda" title="Unpin">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8.4 3.75h7.2l-1.15 6.1 2.8 2.8v1.6H6.75v-1.6l2.8-2.8L8.4 3.75Z" fill="currentColor"/>
                <path d="M12 14.25v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </li>
        </ul>

        <p class="boundary-note">Pins are private shortcuts. They do not save a copy or send a public reaction.</p>
      </div>
    </section>
  </div>
</body>
</html>
