<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Identity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9ede9;
      color: #17231c;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #fbfcfa;
    }

    .verification {
      width: 100%;
    }

    .verify-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #e3f2e8;
      color: #187448;
    }

    .verify-mark svg {
      width: 22px;
      height: 22px;
    }

    h1 {
      margin: 16px 0 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 0;
      color: #5d6a62;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .recipient {
      margin-top: 18px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 10px;
      background: #edf6f0;
    }

    .monogram {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #d6ebdd;
      color: #17653f;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
    }

    .recipient-copy {
      min-width: 0;
    }

    .recipient-name {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .recipient-email {
      margin: 2px 0 0;
      color: #5d6a62;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    form {
      margin-top: 22px;
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .code-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 7px;
    }

    .code-grid input {
      width: 100%;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      outline: none;
      background: #e3f2e8;
      color: #174c32;
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 20px;
      line-height: 48px;
      font-weight: 700;
      text-align: center;
      caret-color: #187448;
    }

    .primary-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #187448;
      color: #ffffff;
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .security-note {
      margin-top: 18px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-radius: 10px;
      background: #edf6f0;
      color: #4f5f55;
    }

    .security-note svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 1px;
      color: #187448;
    }

    .security-note p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
    }

    .resend {
      margin: 16px 0 0;
      color: #5d6a62;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
      text-align: center;
    }

    .resend button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #187448;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="verification" aria-labelledby="verification-title">
      <div class="verify-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 10V7.5a4 4 0 0 1 8 0V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 14v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="verification-title">Verify it’s you</h1>
      <p class="intro">Enter the 6-digit code Cedar Ledger sent to your account email.</p>

      <section class="recipient" aria-label="Code recipient">
        <div class="monogram" aria-hidden="true">ME</div>
        <div class="recipient-copy">
          <p class="recipient-name">Mara Ellison</p>
          <p class="recipient-email">m••••@northmail.com</p>
        </div>
      </section>

      <form>
        <label class="field-label" for="code-1">Verification code</label>
        <div class="code-grid" aria-label="6-digit verification code">
          <input id="code-1" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1">
          <input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2">
          <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 3">
          <input type="text" inputmode="numeric" maxlength="1" value="3" aria-label="Digit 4">
          <input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 5">
          <input type="text" inputmode="numeric" maxlength="1" value="6" aria-label="Digit 6">
        </div>
        <button class="primary-button" type="submit">Verify identity</button>
      </form>

      <section class="security-note" aria-label="Security information">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.5-7 9.3-4.2-1.8-7-4.9-7-9.3V6l7-2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="m9.2 12 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>This code expires in 8 minutes. Cedar Ledger will never ask you to share it.</p>
      </section>

      <p class="resend">Didn’t receive it? <button type="button">Send a new code</button></p>
    </main>
  </div>
</body>
</html>
