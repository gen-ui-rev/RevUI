<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violet Frame Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      margin: 0;
      background: #ecebef;
      color: #211f26;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 28px 16px;
      background: #f8f7fa;
    }

    .player {
      width: 100%;
    }

    .video-stage {
      position: relative;
      width: 358px;
      border-radius: 14px;
      overflow: hidden;
      background: #29262e;
    }

    .video-stage img {
      width: 358px;
      height: 201px;
      object-fit: cover;
      display: block;
      background: #302d35;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      background: rgba(20, 17, 24, 0.38);
    }

    .video-heading {
      min-width: 0;
      color: #ffffff;
    }

    .video-heading p {
      margin: 0 0 3px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
    }

    .video-heading h1 {
      margin: 0;
      overflow: hidden;
      font-size: 16px;
      line-height: 21px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .center-control {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: #7651d6;
      color: #ffffff;
      transform: translate(-50%, -50%);
    }

    .center-control svg {
      width: 24px;
      height: 24px;
      margin-left: 2px;
    }

    .playback {
      color: #ffffff;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 4px;
      margin-bottom: 9px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.38);
    }

    .progress-fill {
      width: 42%;
      height: 4px;
      border-radius: 2px;
      background: #9f7aea;
    }

    .progress-thumb {
      position: absolute;
      top: 50%;
      left: 42%;
      width: 10px;
      height: 10px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: #7651d6;
      transform: translate(-50%, -50%);
    }

    .playback-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .time {
      margin: 0;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .video-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-button {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ffffff;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
    }

    .now-playing {
      padding: 18px 2px 16px;
      border-bottom: 1px solid #dedbe4;
    }

    .now-playing-label {
      margin: 0 0 5px;
      color: #7651d6;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .now-playing h2 {
      margin: 0 0 5px;
      font-size: 19px;
      line-height: 25px;
      font-weight: 700;
    }

    .now-playing p {
      margin: 0;
      color: #6a6670;
      font-size: 14px;
      line-height: 20px;
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 16px;
    }

    .setting {
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid #dedbe4;
      border-radius: 14px;
      background: #ffffff;
    }

    .setting-label {
      display: block;
      margin-bottom: 3px;
      color: #77727e;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
    }

    .setting-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #29262e;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .setting-value span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .setting-value svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: #7651d6;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="player" aria-label="Violet Frame video player">
      <section class="video-stage" aria-label="Paused video">
        <img src="https://loremflickr.com/358/201/concert?lock=2970" width="358" height="201" alt="Musicians performing under stage lights during a live session">
        <div class="video-overlay">
          <div class="video-heading">
            <p>Violet Frame Original</p>
            <h1>The Quiet Frequency</h1>
          </div>

          <button class="center-control" type="button" aria-label="Play video">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.4v13.2c0 .75.82 1.2 1.45.8l10.1-6.6a.95.95 0 0 0 0-1.6L9.45 4.6A.95.95 0 0 0 8 5.4Z"/>
            </svg>
          </button>

          <div class="playback">
            <div class="progress-track" aria-label="42 percent played">
              <div class="progress-fill"></div>
              <div class="progress-thumb"></div>
            </div>
            <div class="playback-row">
              <p class="time">18:42 / 44:10</p>
              <div class="video-actions">
                <button class="icon-button" type="button" aria-label="Mute">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/>
                    <path d="M16 9.2c1.1 1.45 1.1 4.15 0 5.6M18.7 7c2.25 2.75 2.25 7.25 0 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  </svg>
                </button>
                <button class="icon-button" type="button" aria-label="Full screen">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M8.5 4.5h-4v4M15.5 4.5h4v4M8.5 19.5h-4v-4M15.5 19.5h4v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="now-playing" aria-labelledby="episode-title">
        <p class="now-playing-label">Now playing</p>
        <h2 id="episode-title">Episode 4: After the Last Set</h2>
        <p>Playback paused · 25 minutes remaining</p>
      </section>

      <section class="control-panel" aria-label="Playback preferences">
        <div class="setting">
          <span class="setting-label">Subtitles</span>
          <div class="setting-value">
            <span>English</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m8 10 4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="setting">
          <span class="setting-label">Playback speed</span>
          <div class="setting-value">
            <span>1×</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m8 10 4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
