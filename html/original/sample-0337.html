<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Recommendation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8e8;
      color: #292528;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f7f5f6;
    }

    .reaction-card {
      width: 100%;
      padding: 24px;
      border: 1px solid #d9d3d6;
      border-radius: 4px;
      background: #ffffff;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #c62f72;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #251f22;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 0;
      color: #696165;
      font-size: 14px;
      line-height: 1.55;
    }

    .insight {
      margin-top: 22px;
      padding: 16px 0;
      border-top: 1px solid #e5e0e2;
      border-bottom: 1px solid #e5e0e2;
    }

    .insight-title {
      margin: 0;
      color: #2e292b;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .insight-meta {
      margin: 5px 0 0;
      color: #7d7479;
      font-size: 12px;
      line-height: 1.4;
    }

    .recommend-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #c62f72;
      border-radius: 4px;
      background: #c62f72;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .recommend-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .public-count {
      margin: 12px 0 0;
      color: #6d6569;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .public-count strong {
      color: #40393d;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="reaction-card" aria-labelledby="reaction-title">
      <p class="eyebrow">Public recommendation</p>
      <h1 id="reaction-title">Recommend this market insight</h1>
      <p class="description">Your recommendation is visible to other ClearMint members and helps useful analysis rise.</p>

      <div class="insight">
        <p class="insight-title">When short-term bonds may beat idle cash</p>
        <p class="insight-meta">Cash strategy · Updated May 14, 2025</p>
      </div>

      <button class="recommend-button" type="button" aria-label="Recommend this market insight">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Recommend
      </button>

      <p class="public-count"><strong>1,284 members</strong> recommend this insight</p>
    </section>
  </div>
</body>
</html>
