<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinned stay — Wayfare Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    background:#E9EAEC;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    font-family:'Poppins', system-ui, sans-serif;
    color:#151A1E;
  }
  .screen{
    width:390px;
    background:#E9EAEC;
    padding:28px 0;
    box-sizing:border-box;
  }
  .card{
    width:330px;
    margin:0 auto;
    background:#fff;
    border-radius:4px;
    box-shadow:0 2px 8px rgba(16,24,40,.10);
  }
  .hero{
    position:relative;
  }
  .hero img{
    width:330px;
    height:160px;
    object-fit:cover;
    display:block;
    background:#CFD3D6;
    border-radius:4px 4px 0 0;
  }
  .chip{
    position:absolute;
    top:12px;
    left:12px;
    display:flex;
    align-items:center;
    gap:6px;
    background:#0891B2;
    color:#fff;
    border-radius:4px;
    padding:5px 9px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.02em;
  }
  .chip svg{width:13px;height:13px;display:block}

  .body{padding:16px}
  .title{
    font-size:18px;
    font-weight:600;
    line-height:1.3;
    margin:0;
  }
  .sub{
    font-size:13px;
    color:#5C666E;
    margin:4px 0 0;
  }
  .meta{
    font-size:12px;
    color:#7B858C;
    margin:10px 0 0;
  }
  .unpin{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    box-sizing:border-box;
    margin-top:14px;
    padding:11px 0;
    border:1px solid #0891B2;
    border-radius:4px;
    color:#0891B2;
    background:#fff;
    font-size:14px;
    font-weight:500;
  }
  .unpin svg{width:16px;height:16px;display:block}

  .rule{height:1px;background:#EBEDEF;margin:0 16px}

  .sectlabel{
    font-size:12px;
    font-weight:500;
    color:#7B858C;
    letter-spacing:.04em;
    padding:14px 16px 6px;
    margin:0;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
  }
  .row:last-child{padding-bottom:16px}
  .row img{
    width:48px;
    height:48px;
    object-fit:cover;
    display:block;
    background:#CFD3D6;
    border-radius:4px;
    flex:none;
  }
  .rowtext{min-width:0;flex:1}
  .rowname{
    font-size:14px;
    font-weight:500;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rowsub{
    font-size:12px;
    color:#7B858C;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pinbtn{
    flex:none;
    width:34px;
    height:34px;
    border:1px solid #DDE1E4;
    border-radius:4px;
    background:#fff;
    color:#8A9299;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pinbtn svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/330/160/hotel?lock=11860" width="330" height="160" alt="Rooftop terrace of Casa Verde Rooftop Suites in Lisbon">
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></svg>
          Pinned to top
        </div>
      </div>

      <div class="body">
        <h1 class="title">Casa Verde Rooftop Suites</h1>
        <p class="sub">Alfama, Lisbon · $164 per night</p>
        <p class="meta">Pinned March 14 · stays at the top of your Lisbon board for everyone on the trip</p>
        <div class="unpin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/><path d="M4 4l16 16"/></svg>
          Unpin from top
        </div>
      </div>

      <div class="rule"></div>

      <p class="sectlabel">ALSO ON THIS BOARD</p>

      <div class="row">
        <img src="https://loremflickr.com/48/48/beach?lock=11861" width="48" height="48" alt="Beach view from Miradouro Blue Rooms">
        <div class="rowtext">
          <div class="rowname">Miradouro Blue Rooms</div>
          <div class="rowsub">Bairro Alto · $128 per night</div>
        </div>
        <div class="pinbtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></svg>
        </div>
      </div>

      <div class="row">
        <img src="https://loremflickr.com/48/48/mountain?lock=11862" width="48" height="48" alt="Hillside view at Serra Ridge Lodge">
        <div class="rowtext">
          <div class="rowname">Serra Ridge Lodge</div>
          <div class="rowsub">Sintra · $96 per night</div>
        </div>
        <div class="pinbtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
