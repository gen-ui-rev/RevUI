<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopwell — Upload failed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Poppins', system-ui, sans-serif;
    background:#ececeb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:#ffffff;
    padding:36px 28px;
  }
  .mark{display:block;color:#d92c1f;}
  h1{
    font-size:22px;
    font-weight:600;
    line-height:1.3;
    color:#141414;
    margin:14px 0 0;
    letter-spacing:-0.2px;
  }
  .lede{
    font-size:14px;
    font-weight:400;
    line-height:1.55;
    color:#5c5c5c;
    margin:8px 0 0;
  }
  .rule{
    border:0;
    border-top:1px solid #e4e4e4;
    margin:22px 0;
  }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .item img{
    width:64px;
    height:64px;
    object-fit:cover;
    display:block;
    background:#d8d8d8;
    border-radius:4px;
    flex:none;
  }
  .item-body{min-width:0;flex:1;}
  .item-title{
    font-size:14px;
    font-weight:500;
    color:#141414;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    font-size:12px;
    font-weight:400;
    color:#8a8a8a;
    margin-top:2px;
  }
  .track{
    height:4px;
    background:#ededed;
    border-radius:4px;
    margin-top:10px;
  }
  .fill{
    height:4px;
    width:68%;
    background:#d92c1f;
    border-radius:4px;
  }
  .btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    text-decoration:none;
    border-radius:4px;
    font-size:15px;
    font-weight:500;
    padding:14px 0;
  }
  .btn-primary{background:#d92c1f;color:#ffffff;}
  .btn-secondary{color:#141414;padding:12px 0 0;}
  .note{
    font-size:12px;
    font-weight:400;
    color:#9a9a9a;
    text-align:center;
    margin:18px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <svg class="mark" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.3 3.9 1.8 18.4a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
      <line x1="12" y1="9.5" x2="12" y2="13.8"/>
      <line x1="12" y1="17.3" x2="12.01" y2="17.3"/>
    </svg>

    <h1>Your post didn't upload</h1>
    <p class="lede">The connection dropped partway through. Nothing was shared to Loopwell, and your photos are still on this device.</p>

    <hr class="rule">

    <div class="item">
      <img src="https://loremflickr.com/64/64/party?lock=2983" width="64" height="64" alt="Thumbnail of the rooftop party photo that failed to upload">
      <div class="item-body">
        <div class="item-title">Rooftop, Saturday — 3 photos</div>
        <div class="item-meta">Stopped at 68% · 12.4 MB of 18.2 MB</div>
        <div class="track"><div class="fill"></div></div>
      </div>
    </div>

    <hr class="rule">

    <a class="btn btn-primary" href="#">Try uploading again</a>
    <a class="btn btn-secondary" href="#">Save to drafts</a>

    <p class="note">Error 502 · 10:42 AM</p>
  </div>
</body>
</html>
