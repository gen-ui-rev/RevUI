<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Daily — Move Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E4610F;
    --accent-08:rgba(228,97,15,.09);
    --accent-20:rgba(228,97,15,.22);
    --ink:#241a14;
    --muted:#6d6058;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#e7e6e3;
    font-family:'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:40px 30px;
    display:flex;
    justify-content:center;
  }
  .widget{
    width:330px;
    display:flex;
    background:var(--accent-08);
    border-radius:0;
  }
  .panel{
    width:198px;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
  }
  .kicker{
    font-size:12px;
    line-height:16px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0;
  }
  .title{
    font-size:14px;
    line-height:20px;
    font-weight:600;
    color:var(--muted);
    margin:2px 0 0;
  }
  .value{
    font-size:42px;
    line-height:46px;
    font-weight:700;
    color:var(--ink);
    margin:8px 0 0;
    letter-spacing:-.02em;
  }
  .bar{
    margin-top:12px;
    height:8px;
    width:100%;
    background:var(--accent-20);
  }
  .bar span{
    display:block;
    height:8px;
    width:68%;
    background:var(--accent);
  }
  .meta{
    margin:9px 0 0;
    font-size:13px;
    line-height:18px;
    color:var(--muted);
  }
  .meta b{
    font-weight:700;
    color:var(--ink);
  }
  .foot{
    margin:14px 0 0;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    line-height:16px;
    color:var(--muted);
  }
  .foot svg{display:block;flex:none;}
  .shot{
    width:132px;
    height:165px;
    object-fit:cover;
    display:block;
    background:#d3cec9;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="panel">
        <p class="kicker">Stride Daily</p>
        <p class="title">Move goal</p>
        <p class="value">68%</p>
        <div class="bar"><span></span></div>
        <p class="meta"><b>1,360</b> of 2,000 cal</p>
        <p class="foot">
          <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5.5" fill="none" stroke="#E4610F" stroke-width="1.4"/>
            <path d="M6.5 3.6V6.7l2.2 1.3" fill="none" stroke="#E4610F" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Updated 4:12 PM
        </p>
      </div>
      <img class="shot" src="https://loremflickr.com/132/165/running?lock=11603" width="132" height="165" alt="Runner on a park path during an evening workout">
    </div>
  </div>
</body>
</html>
