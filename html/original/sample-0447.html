<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share request link</title>
<style>
  :root{
    --accent:#8A7A6D;
    --ink:#1F1C19;
    --muted:#7A736C;
    --rule:#E1DDD8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#EDEAE6;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#FFFFFF;
    padding:32px 32px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin:0 0 8px;
  }
  h1{
    font-size:22px;
    line-height:1.25;
    font-weight:600;
    margin:0 0 6px;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0 0 24px;
    line-height:1.4;
  }
  .group-label{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule);
    margin:0;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--rule);
  }
  .mono{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:600;
    letter-spacing:.02em;
    background:#F1EEEB;
    color:#6B635C;
  }
  .mono.on{background:var(--accent);color:#FFFFFF;}
  .who{min-width:0;flex:1;}
  .name{
    font-size:15px;
    font-weight:500;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detail{
    font-size:13px;
    color:var(--muted);
    line-height:1.35;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .box{
    width:20px;
    height:20px;
    flex:0 0 20px;
    border:1px solid #C9C3BC;
  }
  .box.on{background:var(--accent);border-color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .channels{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .chan{
    flex:1 1 0;
    min-width:0;
    border:1px solid var(--rule);
    padding:12px 4px 10px;
    text-align:center;
  }
  .chan svg{display:block;margin:0 auto 8px;}
  .chan span{
    display:block;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .send{
    margin-top:22px;
    background:var(--accent);
    color:#FFFFFF;
    font-size:15px;
    font-weight:600;
    text-align:center;
    padding:15px 12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note{
    margin:12px 0 0;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.4;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Share</p>
    <h1>Send the request link</h1>
    <p class="sub">Rent split &middot; $412.50 &middot; due March 14</p>

    <p class="group-label">Recipients</p>

    <div class="row">
      <div class="mono on">DW</div>
      <div class="who">
        <div class="name">Dana Whitfield</div>
        <div class="detail">(415) 555-0148</div>
      </div>
      <div class="box on">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6.2 4.4 9 10.5 3" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="square"/></svg>
      </div>
    </div>

    <div class="row">
      <div class="mono">MR</div>
      <div class="who">
        <div class="name">Marcus Reyes</div>
        <div class="detail">marcus.reyes@mailbox.com</div>
      </div>
      <div class="box"></div>
    </div>

    <div class="row">
      <div class="mono">PS</div>
      <div class="who">
        <div class="name">Priya Sandoval</div>
        <div class="detail">(206) 555-0192</div>
      </div>
      <div class="box"></div>
    </div>

    <div class="channels">
      <div class="chan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7A6D" stroke-width="1.6" aria-hidden="true">
          <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/>
          <path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.2-1.2"/>
        </svg>
        <span>Copy link</span>
      </div>
      <div class="chan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7A6D" stroke-width="1.6" aria-hidden="true">
          <path d="M4 5h16v11H9l-5 4V5Z"/>
        </svg>
        <span>Messages</span>
      </div>
      <div class="chan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7A6D" stroke-width="1.6" aria-hidden="true">
          <path d="M3 6h18v12H3z"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
        <span>Email</span>
      </div>
    </div>

    <div class="send">Send to Dana Whitfield</div>
    <p class="note">Anyone with the link can pay this request until March 21.</p>
  </div>
</body>
</html>
