<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Order Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddda;
      color: #25272b;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #f3f2ef;
    }

    .confirmation {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 10px;
    }

    .symbol {
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(47, 50, 56, 0.09);
      color: #2f3238;
    }

    .symbol svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    h1 {
      margin: 0;
      color: #2f3238;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .message {
      margin: 8px 0 20px;
      color: #62656b;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 400;
    }

    .order {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(47, 50, 56, 0.07);
    }

    .order img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #d8d7d3;
    }

    .order-copy {
      min-width: 0;
    }

    .order-number {
      margin: 0 0 3px;
      color: #73767b;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
    }

    .product-name {
      margin: 0 0 4px;
      color: #292c31;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }

    .product-detail {
      margin: 0;
      color: #62656b;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
    }

    .notice {
      margin: 16px 0 22px;
      color: #62656b;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-width: 0;
      padding: 13px 10px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .keep {
      background: rgba(47, 50, 56, 0.09);
      color: #2f3238;
    }

    .cancel {
      background: #2f3238;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="confirmation" aria-labelledby="confirmation-title">
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 8.25V12.75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 16.15V16.25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M10.2 3.85L2.65 17.1C1.88 18.45 2.85 20.13 4.4 20.13H19.6C21.15 20.13 22.12 18.45 21.35 17.1L13.8 3.85C13.02 2.48 10.98 2.48 10.2 3.85Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="confirmation-title">Cancel this order?</h1>
      <p class="message">Please confirm before Market Hollow stops processing your purchase.</p>

      <div class="order">
        <img src="https://loremflickr.com/72/72/sneakers?lock=5150" width="72" height="72" alt="Gray running shoes in the order">
        <div class="order-copy">
          <p class="order-number">Order #MH-28417</p>
          <p class="product-name">Harbor Running Shoes</p>
          <p class="product-detail">Stone gray · Size 9 · $84.00</p>
        </div>
      </div>

      <p class="notice">If canceled, the pending charge will be released within 3–5 business days.</p>

      <div class="actions">
        <button class="keep" type="button">No, keep it</button>
        <button class="cancel" type="button">Yes, cancel</button>
      </div>
    </section>
  </div>
</body>
</html>
