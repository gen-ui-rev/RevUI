<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9e6;
      color: #20211f;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #d8d8d3;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 17px 16px;
      border-bottom: 1px solid #e1e1dd;
    }

    .topbar h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .icon-button {
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: #20211f;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .main {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .event-context {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #e1e1dd;
    }

    .event-context img {
      width: 76px;
      height: 76px;
      flex: 0 0 76px;
      display: block;
      object-fit: cover;
      background: #d5d5d0;
    }

    .event-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #73736e;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .event-title {
      margin: 0;
      font-size: 17px;
      line-height: 23px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .event-meta {
      margin: 5px 0 0;
      color: #686863;
      font-size: 14px;
      line-height: 20px;
    }

    .date-section {
      padding: 18px 20px;
      border-bottom: 1px solid #e1e1dd;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2,
    .time-heading h2 {
      margin: 0;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #555651;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .month-control button {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555651;
    }

    .month-control svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .date-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 14px;
      border-top: 1px solid #d8d8d3;
      border-bottom: 1px solid #d8d8d3;
    }

    .date-option {
      padding: 10px 4px 11px;
      text-align: center;
      border-left: 1px solid #d8d8d3;
    }

    .date-option:last-child {
      border-right: 1px solid #d8d8d3;
    }

    .date-option .day-name {
      display: block;
      color: #74746f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .date-option .day-number {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
    }

    .date-option.selected {
      border-color: #20211f;
      background: #20211f;
      color: #ffffff;
    }

    .date-option.selected + .date-option {
      border-left-color: #20211f;
    }

    .date-option.selected .day-name {
      color: #d7d7d2;
    }

    .time-section {
      padding: 18px 20px 0;
      border-bottom: 1px solid #e1e1dd;
    }

    .time-note {
      margin: 5px 0 0;
      color: #73736e;
      font-size: 14px;
      line-height: 20px;
    }

    .time-list {
      margin-top: 14px;
      border-top: 1px solid #d8d8d3;
    }

    .time-option {
      width: 100%;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 14px 10px 14px 8px;
      border-bottom: 1px solid #d8d8d3;
      text-align: left;
    }

    .radio {
      width: 18px;
      height: 18px;
      border: 1.5px solid #989892;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radio::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
    }

    .time-option.selected {
      background: #f2f2ef;
    }

    .time-option.selected .radio {
      border-color: #20211f;
    }

    .time-option.selected .radio::after {
      background: #20211f;
    }

    .time-value {
      font-size: 15px;
      line-height: 21px;
      font-weight: 500;
    }

    .time-option.selected .time-value {
      font-weight: 600;
    }

    .availability {
      color: #73736e;
      font-size: 13px;
      line-height: 18px;
      white-space: nowrap;
    }

    .availability.limited {
      color: #504b43;
      font-weight: 600;
    }

    .confirmation {
      margin-top: auto;
      padding: 14px 20px 16px;
    }

    .confirmation-copy {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .confirmation-label {
      margin: 0 0 3px;
      color: #73736e;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .confirmation-value {
      margin: 0;
      font-size: 15px;
      line-height: 21px;
      font-weight: 600;
    }

    .seat-count {
      color: #686863;
      font-size: 13px;
      line-height: 18px;
      white-space: nowrap;
    }

    .confirm-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      background: #20211f;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      text-align: center;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 8px 10px;
      border-top: 1px solid #d8d8d3;
      background: #ffffff;
    }

    .tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #85857f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .tab.active {
      color: #20211f;
      font-weight: 600;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -10px;
      width: 30px;
      height: 2px;
      background: #20211f;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>
      <h1>Reserve a spot</h1>
      <div aria-hidden="true"></div>
    </header>

    <main class="main">
      <section class="event-context" aria-labelledby="event-name">
        <img src="https://loremflickr.com/76/76/cafe?lock=8170" width="76" height="76" alt="A café set up for a community gathering">
        <div class="event-copy">
          <p class="eyebrow">Gatherlane meetup</p>
          <h2 class="event-title" id="event-name">Saturday Social Table</h2>
          <p class="event-meta">Juniper Cafe · East Market</p>
        </div>
      </section>

      <section class="date-section" aria-labelledby="date-heading">
        <div class="section-heading">
          <h2 id="date-heading">Choose a date</h2>
          <div class="month-control">
            <button type="button" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M14.5 6L8.5 12L14.5 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
              </svg>
            </button>
            <span>June 2025</span>
            <button type="button" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9.5 6L15.5 12L9.5 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="date-strip" role="group" aria-label="Available dates">
          <button class="date-option" type="button">
            <span class="day-name">Thu</span>
            <span class="day-number">12</span>
          </button>
          <button class="date-option" type="button">
            <span class="day-name">Fri</span>
            <span class="day-number">13</span>
          </button>
          <button class="date-option selected" type="button" aria-pressed="true">
            <span class="day-name">Sat</span>
            <span class="day-number">14</span>
          </button>
          <button class="date-option" type="button">
            <span class="day-name">Sun</span>
            <span class="day-number">15</span>
          </button>
        </div>
      </section>

      <section class="time-section" aria-labelledby="time-heading">
        <div class="time-heading">
          <h2 id="time-heading">Choose a time</h2>
          <p class="time-note">Each gathering lasts 90 minutes.</p>
        </div>

        <div class="time-list" role="radiogroup" aria-label="Available reservation times">
          <button class="time-option" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span class="time-value">4:30 PM</span>
            <span class="availability">6 spots open</span>
          </button>
          <button class="time-option selected" type="button" role="radio" aria-checked="true">
            <span class="radio" aria-hidden="true"></span>
            <span class="time-value">6:00 PM</span>
            <span class="availability limited">1 spot left</span>
          </button>
          <button class="time-option" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span class="time-value">7:30 PM</span>
            <span class="availability">4 spots open</span>
          </button>
          <button class="time-option" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span class="time-value">9:00 PM</span>
            <span class="availability">8 spots open</span>
          </button>
        </div>
      </section>

      <section class="confirmation" aria-labelledby="confirmation-heading">
        <div class="confirmation-copy">
          <div>
            <p class="confirmation-label" id="confirmation-heading">Your reservation</p>
            <p class="confirmation-value">Sat, Jun 14 · 6:00 PM</p>
          </div>
          <span class="seat-count">1 seat</span>
        </div>
        <button class="confirm-button" type="button">Confirm reservation</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.5V14H9.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5H19V16H11L6.5 19V16H5V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
        </svg>
        <span>Messages</span>
      </button>
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 4V7M17 4V7M4.5 9H19.5M5 6H19V20H5V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
          <path d="M9 13H11V15H9V13ZM14 13H16V15H14V13Z" fill="currentColor"/>
        </svg>
        <span>Meetups</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5 20C5.7 16.7 8.1 15 12 15C15.9 15 18.3 16.7 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
