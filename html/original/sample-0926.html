<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval timer — Northline Run Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ebeceb;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #1b201d;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 32px 24px;
    background: #ebeceb;
  }
  .card {
    background: #ffffff;
    box-shadow: 0 6px 20px rgba(24, 40, 32, 0.12);
  }
  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    background: #d5d8d6;
  }
  .body {
    padding: 22px 22px 24px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #04795a;
    margin: 0 0 4px;
  }
  .session {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 18px;
    color: #1b201d;
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6d7671;
    margin: 0 0 2px;
  }
  .clock {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .track {
    height: 8px;
    background: #e4e7e5;
    margin: 18px 0 8px;
  }
  .fill {
    height: 8px;
    width: 30%;
    background: #04795a;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #5c655f;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .btn {
    flex: 1 1 0;
    box-sizing: border-box;
    padding: 14px 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    border: 1px solid #04795a;
    background: #ffffff;
    color: #04795a;
  }
  .btn.primary {
    background: #04795a;
    color: #ffffff;
  }
  .next {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid #e4e7e5;
    font-size: 14px;
    color: #5c655f;
  }
  .next strong {
    font-weight: 600;
    color: #1b201d;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img src="https://loremflickr.com/342/150/running?lock=12263" width="342" height="150" alt="Runner on a park path during a tempo interval">
      <div class="body">
        <p class="eyebrow">Interval 3 of 5</p>
        <h1 class="session">Tempo Ladder — Week 6</h1>
        <p class="label">Time remaining</p>
        <p class="clock">4:12</p>
        <div class="track"><div class="fill"></div></div>
        <div class="meta">
          <span>1:48 elapsed</span>
          <span>6:00 interval</span>
        </div>
        <div class="controls">
          <div class="btn primary">Pause</div>
          <div class="btn">Skip interval</div>
        </div>
        <p class="next">Up next: <strong>Recovery walk, 2:00</strong> at 7:24 p.m.</p>
      </div>
    </div>
  </div>
</body>
</html>
