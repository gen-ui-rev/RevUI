<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e9e2;
      color: #1d211b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 20px;
      background: #f3f4ef;
    }

    .share-sheet {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9ddd3;
      border-radius: 14px;
    }

    .sheet-header {
      padding: 24px 22px 22px;
      border-bottom: 1px solid #e2e5dd;
    }

    .share-mark {
      width: 52px;
      padding: 13px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #273015;
      background: #c9f35b;
      border: 1px solid #b6dd50;
      border-radius: 14px;
    }

    .share-mark svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .lesson-name {
      margin: 7px 0 0;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      color: #5d6458;
    }

    .sheet-label {
      margin: 0;
      padding: 17px 22px 8px;
      color: #737a6d;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .share-options {
      margin: 0;
      padding: 0 10px 12px;
      list-style: none;
    }

    .share-option {
      width: 100%;
      padding: 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid #e5e7e1;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: default;
    }

    .share-options li:last-child .share-option {
      border-bottom: 0;
    }

    .option-copy {
      min-width: 0;
      flex: 1;
    }

    .option-title {
      display: block;
      margin-bottom: 3px;
      color: #242921;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }

    .option-detail {
      display: block;
      color: #747b6e;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #8b9186;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="share-sheet" aria-labelledby="share-title">
      <header class="sheet-header">
        <div class="share-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8.5 12.2 15.7 8M8.5 12.2l7.2 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="6.3" cy="13.2" r="2.7" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.7" cy="6.8" r="2.7" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.7" cy="17.2" r="2.7" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </div>
        <h1 id="share-title">Share this lesson</h1>
        <p class="lesson-name">Ordering at a Café · Practical Spanish</p>
      </header>

      <p class="sheet-label">Choose a destination</p>

      <ul class="share-options">
        <li>
          <button class="share-option" type="button">
            <span class="option-copy">
              <span class="option-title">Study group</span>
              <span class="option-detail">Spanish Foundations · 8 learners</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
        <li>
          <button class="share-option" type="button">
            <span class="option-copy">
              <span class="option-title">Send to a learner</span>
              <span class="option-detail">Choose someone from your connections</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
        <li>
          <button class="share-option" type="button">
            <span class="option-copy">
              <span class="option-title">Copy lesson link</span>
              <span class="option-detail">Anyone with the link can view</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
      </ul>
    </section>
  </div>
</body>
</html>
