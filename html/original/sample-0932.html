<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Lesson Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddd9;
      color: #292c2e;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #f4f3f0;
    }

    .picker {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border-radius: 6px;
    }

    .picker-header {
      margin-bottom: 18px;
    }

    .picker-header h1 {
      margin: 0;
      color: #525b60;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.3px;
    }

    .picker-header p {
      margin: 7px 0 0;
      color: #686d70;
      font-size: 14px;
      line-height: 1.45;
    }

    .selection {
      margin-bottom: 20px;
      padding: 14px 15px;
      background: rgba(82, 91, 96, 0.11);
      border-radius: 6px;
    }

    .selection-label {
      display: block;
      margin-bottom: 3px;
      color: #6c7275;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .selection-value {
      display: block;
      color: #394044;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
    }

    .selection-detail {
      display: block;
      margin-top: 3px;
      color: #686d70;
      font-size: 14px;
      line-height: 1.4;
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset + fieldset {
      margin-top: 20px;
    }

    legend {
      width: 100%;
      margin: 0 0 10px;
      padding: 0;
      color: #353a3d;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .date-option,
    .time-option {
      border: 0;
      border-radius: 6px;
      background: rgba(82, 91, 96, 0.09);
      color: #444a4e;
      cursor: default;
    }

    .date-option {
      padding: 9px 4px;
      text-align: center;
    }

    .date-option span {
      display: block;
      font-size: 12px;
      line-height: 1.2;
    }

    .date-option strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
    }

    .date-option[aria-pressed="true"],
    .time-option[aria-pressed="true"] {
      background: #596267;
      color: #ffffff;
    }

    .time-note {
      margin: -4px 0 10px;
      color: #777c7f;
      font-size: 12px;
      line-height: 1.4;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .time-option {
      padding: 10px 5px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
    }

    .confirm {
      width: 100%;
      margin-top: 22px;
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: #596267;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="picker-title">
      <header class="picker-header">
        <h1 id="picker-title">Choose your lesson time</h1>
        <p>Schedule a 45-minute French conversation lesson with Rowan Hale.</p>
      </header>

      <section class="selection" aria-label="Selected lesson time">
        <span class="selection-label">Your selection</span>
        <span class="selection-value">Tuesday, April 22 · 6:30 PM</span>
        <span class="selection-detail">Eastern Time · Online classroom</span>
      </section>

      <form>
        <fieldset>
          <legend>Select a date</legend>
          <div class="date-options">
            <button class="date-option" type="button" aria-pressed="false">
              <span>Mon</span>
              <strong>Apr 21</strong>
            </button>
            <button class="date-option" type="button" aria-pressed="true">
              <span>Tue</span>
              <strong>Apr 22</strong>
            </button>
            <button class="date-option" type="button" aria-pressed="false">
              <span>Wed</span>
              <strong>Apr 23</strong>
            </button>
            <button class="date-option" type="button" aria-pressed="false">
              <span>Thu</span>
              <strong>Apr 24</strong>
            </button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Select a start time</legend>
          <p class="time-note">Available times are shown in Eastern Time.</p>
          <div class="time-options">
            <button class="time-option" type="button" aria-pressed="false">4:00 PM</button>
            <button class="time-option" type="button" aria-pressed="false">5:15 PM</button>
            <button class="time-option" type="button" aria-pressed="true">6:30 PM</button>
            <button class="time-option" type="button" aria-pressed="false">7:15 PM</button>
            <button class="time-option" type="button" aria-pressed="false">8:00 PM</button>
            <button class="time-option" type="button" aria-pressed="false">8:45 PM</button>
          </div>
        </fieldset>

        <button class="confirm" type="button">Confirm lesson time</button>
      </form>
    </main>
  </div>
</body>
</html>
