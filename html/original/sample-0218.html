<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commonly Nearby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8dcdd;
      color: #1e292d;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #eef0ef;
    }

    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      background: #ffffff;
      border-bottom: 1px solid #d8dddc;
    }

    .title-block {
      min-width: 0;
    }

    h1,
    h2 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
    }

    h1 {
      font-size: 24px;
      line-height: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 1px 0 0;
      color: #657176;
      font-size: 14px;
      line-height: 18px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #d2d8d8;
      background: #ffffff;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: #263438;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .map {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #e7e9e7;
    }

    .map-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-search {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }

    .search-field {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1px solid #cfd6d5;
      color: #425156;
      font-size: 14px;
      line-height: 20px;
    }

    .search-field svg,
    .filter-button svg,
    .locate-button svg {
      width: 19px;
      height: 19px;
      flex: none;
      fill: none;
      stroke: #334348;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .filter-button {
      width: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      background: #ffffff;
      border: 1px solid #cfd6d5;
    }

    .locate-button {
      position: absolute;
      top: 72px;
      right: 14px;
      z-index: 2;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      background: #ffffff;
      border: 1px solid #cfd6d5;
    }

    .map-marker {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 0;
      padding: 0;
      background: transparent;
    }

    .map-marker svg {
      width: 36px;
      height: 43px;
      display: block;
      overflow: visible;
    }

    .map-marker .marker-fill {
      fill: #ffffff;
      stroke: #718d94;
      stroke-width: 2;
    }

    .map-marker .marker-dot {
      fill: #718d94;
    }

    .map-marker.selected .marker-fill {
      fill: #8da8ae;
      stroke: #3d5a61;
    }

    .map-marker.selected .marker-dot {
      fill: #ffffff;
    }

    .marker-label {
      margin-top: 2px;
      padding: 3px 7px;
      background: #ffffff;
      border: 1px solid #cfd5d4;
      color: #2c3b3f;
      font-size: 12px;
      font-weight: 600;
      line-height: 15px;
      white-space: nowrap;
    }

    .marker-one {
      top: 154px;
      left: 164px;
    }

    .marker-two {
      top: 226px;
      left: 58px;
    }

    .marker-three {
      top: 126px;
      right: 53px;
    }

    .marker-four {
      top: 340px;
      right: 69px;
    }

    .gathering-card {
      position: absolute;
      z-index: 3;
      left: 14px;
      right: 14px;
      bottom: 14px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #d1d7d6;
      box-shadow: 0 8px 22px rgba(40, 53, 57, 0.14);
    }

    .card-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #58666a;
      font-size: 13px;
      line-height: 17px;
    }

    .live-note {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3d5960;
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #8da8ae;
    }

    .distance {
      font-weight: 600;
    }

    .event-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .event-photo {
      width: 112px;
      height: 86px;
      flex: none;
      display: block;
      object-fit: cover;
      background: #c9cecd;
    }

    .event-copy {
      min-width: 0;
      flex: 1;
    }

    h2 {
      font-size: 20px;
      line-height: 24px;
      font-weight: 700;
    }

    .event-meta {
      margin: 4px 0 0;
      color: #58666a;
      font-size: 14px;
      line-height: 18px;
    }

    .event-detail {
      margin: 5px 0 0;
      color: #2b393d;
      font-size: 14px;
      line-height: 18px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #e0e4e3;
    }

    .people {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .monogram {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      margin-right: -4px;
      border: 2px solid #ffffff;
      background: #d4dcdd;
      color: #314449;
      font-size: 12px;
      font-weight: 600;
    }

    .monogram.alt {
      background: #e3ded5;
      color: #51483d;
    }

    .people-count {
      margin-left: 10px;
      color: #59666a;
      font-size: 13px;
      white-space: nowrap;
    }

    .primary-action {
      flex: none;
      padding: 8px 13px;
      border: 1px solid #607f86;
      background: #8da8ae;
      color: #17262a;
      font-size: 14px;
      font-weight: 600;
      line-height: 18px;
    }

    .tabbar {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 4px 8px;
      background: #ffffff;
      border-top: 1px solid #d5dcda;
    }

    .tab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 2px 0;
      color: #687478;
      font-size: 12px;
      line-height: 15px;
      text-decoration: none;
    }

    .tab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab.active {
      color: #3f646d;
      font-weight: 600;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -9px;
      width: 42px;
      height: 3px;
      background: #8da8ae;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="title-block">
        <h1>Near you</h1>
        <p class="subtitle">Community gatherings within 1 mile</p>
      </div>
      <div class="top-actions">
        <button class="icon-button" aria-label="Open notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
          </svg>
        </button>
        <button class="icon-button" aria-label="Open profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="map" aria-label="Map of nearby community gatherings">
      <svg class="map-art" viewBox="0 0 390 719" preserveAspectRatio="none" aria-hidden="true">
        <rect width="390" height="719" fill="#e7e9e7"></rect>

        <path d="M0 102 C70 89 122 101 178 135 C233 168 302 170 390 138 L390 215 C302 238 229 224 169 188 C110 152 56 145 0 157 Z" fill="#d5dbd9"></path>
        <path d="M273 0 C261 82 256 152 266 223 C277 304 312 391 390 455 L390 0 Z" fill="#dde3e0"></path>
        <path d="M0 436 C73 413 132 415 195 448 C247 476 299 487 390 471 L390 557 C312 568 236 552 174 520 C112 489 54 489 0 506 Z" fill="#dbe1df"></path>

        <rect x="22" y="180" width="90" height="70" fill="#dfe2df"></rect>
        <rect x="119" y="205" width="87" height="57" fill="#dfe2df"></rect>
        <rect x="291" y="245" width="72" height="99" fill="#dfe2df"></rect>
        <rect x="43" y="326" width="87" height="76" fill="#dfe2df"></rect>
        <rect x="149" y="318" width="87" height="89" fill="#dfe2df"></rect>
        <rect x="252" y="376" width="79" height="61" fill="#dfe2df"></rect>

        <path d="M-18 303 C75 267 149 270 220 304 C290 337 344 336 408 310" fill="none" stroke="#ffffff" stroke-width="25"></path>
        <path d="M-18 303 C75 267 149 270 220 304 C290 337 344 336 408 310" fill="none" stroke="#c8cfcd" stroke-width="1.5"></path>

        <path d="M137 -20 C125 90 132 168 164 244 C191 309 202 381 179 466 C162 529 169 622 198 739" fill="none" stroke="#ffffff" stroke-width="20"></path>
        <path d="M137 -20 C125 90 132 168 164 244 C191 309 202 381 179 466 C162 529 169 622 198 739" fill="none" stroke="#c8cfcd" stroke-width="1.5"></path>

        <path d="M-12 557 C81 526 168 534 237 578 C286 609 339 621 404 602" fill="none" stroke="#ffffff" stroke-width="17"></path>
        <path d="M-12 557 C81 526 168 534 237 578 C286 609 339 621 404 602" fill="none" stroke="#c8cfcd" stroke-width="1.3"></path>

        <path d="M256 85 C219 134 206 189 215 249" fill="none" stroke="#ffffff" stroke-width="12"></path>
        <path d="M25 391 C93 368 147 366 203 386" fill="none" stroke="#ffffff" stroke-width="11"></path>
        <path d="M290 181 C316 226 325 276 321 335" fill="none" stroke="#ffffff" stroke-width="11"></path>

        <rect x="222" y="179" width="93" height="67" fill="#cfdad4"></rect>
        <path d="M231 230 C250 202 278 196 307 205" fill="none" stroke="#b9cbc1" stroke-width="4"></path>

        <text x="247" y="194" fill="#74817d" font-size="12" font-family="Source Sans 3, sans-serif">Willow Park</text>
        <text x="15" y="288" fill="#7a8583" font-size="12" font-family="Source Sans 3, sans-serif">Juniper Avenue</text>
        <text x="151" y="79" fill="#7a8583" font-size="12" font-family="Source Sans 3, sans-serif" transform="rotate(80 151 79)">North Lane</text>
        <text x="265" y="591" fill="#7a8583" font-size="12" font-family="Source Sans 3, sans-serif">Harbor Street</text>

        <circle cx="190" cy="281" r="26" fill="#8da8ae" opacity="0.18"></circle>
        <circle cx="190" cy="281" r="8" fill="#ffffff" stroke="#53737b" stroke-width="2"></circle>
        <circle cx="190" cy="281" r="3" fill="#53737b"></circle>
      </svg>

      <div class="map-search">
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <span>Search this area</span>
        </div>
        <button class="filter-button" aria-label="Filter gatherings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M7 12h10"></path>
            <path d="M10 17h4"></path>
          </svg>
        </button>
      </div>

      <button class="locate-button" aria-label="Center on my location">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path>
        </svg>
      </button>

      <button class="map-marker selected marker-one" aria-label="Coffee and New Neighbors gathering">
        <svg viewBox="0 0 36 43" aria-hidden="true">
          <path class="marker-fill" d="M18 1C8.8 1 2 7.8 2 16.4 2 27 18 41 18 41s16-14 16-24.6C34 7.8 27.2 1 18 1Z"></path>
          <circle class="marker-dot" cx="18" cy="16" r="5"></circle>
        </svg>
        <span class="marker-label">8 nearby</span>
      </button>

      <button class="map-marker marker-two" aria-label="Park sketch circle">
        <svg viewBox="0 0 36 43" aria-hidden="true">
          <path class="marker-fill" d="M18 1C8.8 1 2 7.8 2 16.4 2 27 18 41 18 41s16-14 16-24.6C34 7.8 27.2 1 18 1Z"></path>
          <circle class="marker-dot" cx="18" cy="16" r="5"></circle>
        </svg>
        <span class="marker-label">Sketching</span>
      </button>

      <button class="map-marker marker-three" aria-label="Weekend walkers gathering">
        <svg viewBox="0 0 36 43" aria-hidden="true">
          <path class="marker-fill" d="M18 1C8.8 1 2 7.8 2 16.4 2 27 18 41 18 41s16-14 16-24.6C34 7.8 27.2 1 18 1Z"></path>
          <circle class="marker-dot" cx="18" cy="16" r="5"></circle>
        </svg>
        <span class="marker-label">Walkers</span>
      </button>

      <button class="map-marker marker-four" aria-label="Local book exchange">
        <svg viewBox="0 0 36 43" aria-hidden="true">
          <path class="marker-fill" d="M18 1C8.8 1 2 7.8 2 16.4 2 27 18 41 18 41s16-14 16-24.6C34 7.8 27.2 1 18 1Z"></path>
          <circle class="marker-dot" cx="18" cy="16" r="5"></circle>
        </svg>
        <span class="marker-label">Book swap</span>
      </button>

      <article class="gathering-card">
        <div class="card-kicker">
          <span class="live-note"><span class="live-dot"></span>Starting at 6:30 PM</span>
          <span class="distance">0.3 mi away</span>
        </div>

        <div class="event-row">
          <img class="event-photo" src="https://loremflickr.com/112/86/cafe?lock=3570" width="112" height="86" alt="Tables and warm lights inside the gathering cafe">
          <div class="event-copy">
            <h2>Coffee and New Neighbors</h2>
            <p class="event-meta">Juniper Cafe · Today</p>
            <p class="event-detail">A casual table for people new to the area.</p>
          </div>
        </div>

        <div class="card-footer">
          <div class="people" aria-label="Hosted by Mara and joined by seven others">
            <span class="monogram">MS</span>
            <span class="monogram alt">JL</span>
            <span class="people-count">7 more joining</span>
          </div>
          <button class="primary-action">View circle</button>
        </div>
      </article>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <a class="tab active" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"></path>
          <circle cx="12" cy="9" r="2.5"></circle>
        </svg>
        <span>Nearby</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v11H8l-4 4Z"></path>
        </svg>
        <span>Messages</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="9" r="3"></circle>
          <circle cx="17" cy="10" r="2.5"></circle>
          <path d="M3.5 20c.5-4 2.2-6 5.5-6s5 2 5.5 6"></path>
          <path d="M15 15c3.1 0 4.8 1.7 5.3 5"></path>
        </svg>
        <span>Circles</span>
      </a>
      <a class="tab" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"></path>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
