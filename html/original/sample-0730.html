<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d6d3d1;
      color: #292524;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f5f5f4;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e7e5e4;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #44403c;
      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1;
      padding: 22px 20px 18px;
    }

    .intro {
      margin-bottom: 26px;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .intro p {
      margin: 0 0 18px;
      color: #78716c;
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-action {
      width: 100%;
      min-height: 50px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
      background: #78716c;
      border: 1px solid #78716c;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-heading {
      margin: 0 0 10px;
      color: #57534e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .method-card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 0;
      box-shadow: 0 4px 14px rgba(41, 37, 36, 0.06);
    }

    .method-row {
      width: 100%;
      min-height: 78px;
      padding: 15px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      color: #292524;
      background: transparent;
      border: 0;
      border-radius: 0;
      text-align: left;
    }

    .method-row + .method-row {
      border-top: 1px solid #e7e5e4;
    }

    .method-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #57534e;
      background: #f5f5f4;
      border: 1px solid #d6d3d1;
    }

    .method-copy {
      min-width: 0;
      flex: 1;
    }

    .method-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .method-title {
      min-width: 0;
      overflow: hidden;
      color: #292524;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .default-label {
      flex: 0 0 auto;
      padding: 2px 6px;
      color: #57534e;
      background: #e7e5e4;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
    }

    .method-detail {
      margin: 0;
      color: #78716c;
      font-size: 13px;
      line-height: 1.35;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: #a8a29e;
    }

    .note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 2px 0 0;
      color: #78716c;
      font-size: 13px;
      line-height: 1.5;
    }

    .note svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 1px;
      color: #78716c;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 9px 8px 11px;
      background: #ffffff;
      border-top: 1px solid #d6d3d1;
    }

    .tab {
      min-width: 0;
      padding: 2px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #a8a29e;
      background: transparent;
      border: 0;
      border-radius: 0;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 500;
    }

    .tab svg {
      width: 23px;
      height: 23px;
    }

    .tab.active {
      color: #57534e;
      font-weight: 600;
    }

    svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <h1>Payment methods</h1>
    </header>

    <main>
      <section class="intro" aria-labelledby="saved-heading">
        <h2 id="saved-heading">Manage your saved methods</h2>
        <p>Choose how you pay for community memberships and shared events in Commonly.</p>
        <button class="primary-action" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          Add payment method
        </button>
      </section>

      <section class="section" aria-labelledby="cards-heading">
        <h3 class="section-heading" id="cards-heading">Cards</h3>
        <div class="method-card">
          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14"></rect>
                <path d="M3 9h18M7 15h3"></path>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Debit card •••• 4821</span>
                <span class="default-label">Default</span>
              </span>
              <span class="method-detail">Expires 08/28</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </button>

          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14"></rect>
                <path d="M3 9h18M7 15h3"></path>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Credit card •••• 1764</span>
              </span>
              <span class="method-detail">Expires 11/27</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="accounts-heading">
        <h3 class="section-heading" id="accounts-heading">Bank accounts</h3>
        <div class="method-card">
          <button class="method-row" type="button">
            <span class="method-icon" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <path d="M4 10h16M5 10V8l7-4 7 4v2M6 10v7M10 10v7M14 10v7M18 10v7M4 20h16M3 17h18"></path>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-title">Checking account •••• 9084</span>
              </span>
              <span class="method-detail">Avery Morgan</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </section>

      <p class="note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10"></rect>
          <path d="M8 10V7a4 4 0 018 0v3"></path>
        </svg>
        Payment details are stored securely and are not shown to other members.
      </p>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11l9-7 9 7"></path>
          <path d="M5 10v10h14V10M9 20v-6h6v6"></path>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v12H8l-4 3V5z"></path>
          <path d="M8 9h8M8 13h5"></path>
        </svg>
        <span>Messages</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span>Create</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="8" cy="9" r="3"></circle>
          <circle cx="17" cy="8" r="2.5"></circle>
          <path d="M3 19c.4-3.3 2.1-5 5-5s4.6 1.7 5 5M14 14c2.9-.4 5.1 1.2 6 4"></path>
        </svg>
        <span>Groups</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c.6-4.5 3.3-7 8-7s7.4 2.5 8 7"></path>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
