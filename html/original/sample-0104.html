<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutriscope — Scan Meal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:40px 0;margin:0;background:#d8dadd;
    font-family:'Poppins',system-ui,sans-serif;color:#1c1e21;
  }
  .screen{
    position:relative;width:390px;height:844px;background:#f1f2f4;
  }

  /* top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 16px 14px;
  }
  .topbar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.1px;}
  .iconbtn{
    width:36px;height:36px;border-radius:10px;background:#ffffff;
    box-shadow:0 1px 3px rgba(16,18,20,.10);
    display:flex;align-items:center;justify-content:center;
  }

  /* viewfinder */
  .finder{
    position:relative;margin:2px 16px 0;height:400px;border-radius:10px;
    background:#6d7278;overflow:hidden;
  }
  .hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:#ffffff;border-radius:10px;padding:7px 12px;
    font-size:13px;font-weight:500;color:#1c1e21;white-space:nowrap;
  }
  .frame{position:absolute;left:44px;top:96px;width:262px;height:212px;}
  .c{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.92);}
  .c.tl{left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
  .c.tr{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
  .c.bl{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px;}
  .c.br{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0;}
  .plate{
    position:absolute;left:82px;top:150px;width:186px;height:112px;
    border-radius:10px;background:#83888e;
  }
  .status{
    position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;
    background:rgba(28,30,33,.62);border-radius:10px;padding:7px 11px;
  }
  .status span{font-size:12px;font-weight:500;color:#ffffff;}
  .dot{width:7px;height:7px;border-radius:50%;background:#ffffff;}

  /* modes */
  .modes{display:flex;gap:8px;padding:16px 16px 0;}
  .chip{
    border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;
    background:#ffffff;color:#6b7076;box-shadow:0 1px 3px rgba(16,18,20,.08);
  }
  .chip.on{background:#4b5058;color:#ffffff;box-shadow:none;}

  /* capture */
  .capture{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 40px 0;
  }
  .thumb{width:46px;height:46px;border-radius:10px;background:#c3c6ca;}
  .shutter{
    width:76px;height:76px;border-radius:50%;background:#ffffff;
    border:3px solid #4b5058;display:flex;align-items:center;justify-content:center;
  }
  .shutter i{display:block;width:58px;height:58px;border-radius:50%;background:#4b5058;}
  .flip{
    width:46px;height:46px;border-radius:10px;background:#ffffff;
    box-shadow:0 1px 3px rgba(16,18,20,.08);
    display:flex;align-items:center;justify-content:center;
  }

  /* progress card */
  .card{
    margin:22px 16px 0;background:#ffffff;border-radius:10px;padding:14px 16px 16px;
    box-shadow:0 1px 3px rgba(16,18,20,.08);
  }
  .cardtop{display:flex;align-items:baseline;justify-content:space-between;}
  .cardtop p{margin:0;font-size:14px;font-weight:500;}
  .cardtop b{font-size:14px;font-weight:600;color:#4b5058;}
  .bar{height:6px;border-radius:10px;background:#e6e7ea;margin:12px 0 10px;}
  .bar i{display:block;width:50%;height:100%;border-radius:10px;background:#4b5058;}
  .meta{margin:0;font-size:12px;color:#7a7f85;}

  /* tab bar */
  .tabs{
    position:absolute;left:0;bottom:0;width:100%;height:76px;
    background:#ffffff;border-top:1px solid #e4e5e8;
    display:flex;align-items:center;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#8d9298;}
  .tab span{font-size:12px;font-weight:500;}
  .tab.on{color:#4b5058;}
  .tab.on span{font-weight:600;}
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="iconbtn" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1e21" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <h1>Scan Meal</h1>
      <div class="iconbtn" aria-label="Flash off">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1e21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </div>
    </div>

    <div class="finder">
      <div class="hint">Center the full plate in the frame</div>
      <div class="plate"></div>
      <div class="frame">
        <div class="c tl"></div><div class="c tr"></div>
        <div class="c bl"></div><div class="c br"></div>
      </div>
      <div class="status"><i class="dot"></i><span>Focus locked · auto detect on</span></div>
    </div>

    <div class="modes">
      <div class="chip on">Meal</div>
      <div class="chip">Nutrition label</div>
      <div class="chip">Barcode</div>
    </div>

    <div class="capture">
      <div class="thumb" aria-label="Choose from library"></div>
      <div class="shutter" aria-label="Capture"><i></i></div>
      <div class="flip" aria-label="Switch camera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4b5058" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h3"/><path d="M20 16v2a2 2 0 0 1-2 2h-3"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><circle cx="12" cy="12" r="3.2"/></svg>
      </div>
    </div>

    <div class="card">
      <div class="cardtop">
        <p>Meals logged today</p>
        <b>2 of 4</b>
      </div>
      <div class="bar"><i></i></div>
      <p class="meta">1,240 kcal so far · last entry 12:40 PM, chicken bowl</p>
    </div>

    <div class="tabs">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
        <span>Today</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 12h14M5 19h9"/></svg>
        <span>Diary</span>
      </div>
      <div class="tab on">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2L9 5h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5V17a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17z"/><circle cx="12" cy="12.8" r="3"/></svg>
        <span>Scan</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V6M19 19v-5"/></svg>
        <span>Trends</span>
      </div>
    </div>

  </div>
</body>
</html>
