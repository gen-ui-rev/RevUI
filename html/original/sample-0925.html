<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eef1;
      color: #162630;
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfdfe;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 15px;
      background: rgba(72, 177, 230, 0.08);
    }

    .topbar h1 {
      flex: 1;
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }

    .icon-button {
      width: 34px;
      padding: 6px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.13);
      color: #1c789f;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    main {
      flex: 1;
      padding: 14px 20px 12px;
    }

    .amount-card {
      padding: 15px 16px;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.12);
    }

    .eyebrow {
      margin: 0;
      color: #53707f;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .amount-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
    }

    .amount {
      margin: 0;
      color: #123346;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .currency {
      color: #357d9f;
      font-size: 14px;
      font-weight: 700;
    }

    .balance {
      margin: 7px 0 0;
      color: #53707f;
      font-size: 14px;
      line-height: 1.45;
    }

    .section {
      margin-top: 16px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .recipient-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.09);
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.18);
      color: #237fa8;
    }

    .avatar svg {
      width: 27px;
      height: 27px;
    }

    .recipient-copy {
      min-width: 0;
      flex: 1;
    }

    .recipient-name {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    .recipient-meta {
      margin: 2px 0 0;
      color: #617885;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .change-button {
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.18);
      color: #176f98;
      font-size: 12px;
      font-weight: 700;
    }

    .note-row {
      width: 100%;
      margin-top: 12px;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.07);
      color: #415e6c;
      text-align: left;
    }

    .note-row svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: #3484a8;
    }

    .note-row span:first-of-type {
      flex: 1;
      font-size: 14px;
    }

    .optional {
      color: #718690;
      font-size: 12px;
    }

    .transfer-detail {
      margin: 10px 2px 0;
      color: #617885;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .keypad {
      margin-top: 13px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .key {
      padding: 13px 8px;
      border: 0;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.08);
      color: #183947;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
    }

    .key svg {
      width: 22px;
      height: 22px;
      vertical-align: middle;
    }

    .review-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #38a7dc;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 10px 10px;
      background: rgba(72, 177, 230, 0.06);
    }

    .tab {
      min-width: 0;
      padding: 5px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #6b7e87;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 500;
    }

    .tab svg {
      width: 21px;
      height: 21px;
    }

    .tab.active {
      color: #167ca9;
      font-weight: 700;
    }

    .tab.active .tab-icon {
      padding: 4px 14px;
      border-radius: 10px;
      background: rgba(72, 177, 230, 0.15);
    }

    .tab-icon {
      display: grid;
      place-items: center;
      padding: 4px 14px;
    }

    svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <h1>Send money</h1>
      <button class="icon-button" type="button" aria-label="Transfer history">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4.5v5h5"></path>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
      </button>
    </header>

    <main>
      <section class="amount-card" aria-label="Transfer amount">
        <p class="eyebrow">AMOUNT</p>
        <div class="amount-line">
          <p class="amount">$285.00</p>
          <span class="currency">USD</span>
        </div>
        <p class="balance">Workgrove balance · $1,840.50 available</p>
      </section>

      <section class="section" aria-labelledby="recipient-heading">
        <h2 class="section-title" id="recipient-heading">Recipient</h2>
        <div class="recipient-row">
          <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 28 28">
              <circle cx="14" cy="9" r="4"></circle>
              <path d="M6.5 23c.5-4.3 3.3-6.7 7.5-6.7s7 2.4 7.5 6.7"></path>
              <path d="M21.5 8.5c1.8.7 2.8 2 3 4"></path>
            </svg>
          </div>
          <div class="recipient-copy">
            <p class="recipient-name">Mara Bennett</p>
            <p class="recipient-meta">Design team · @mara.b</p>
          </div>
          <button class="change-button" type="button">Change</button>
        </div>
      </section>

      <button class="note-row" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v12H9l-4 4V4z"></path>
          <path d="M8.5 8h7"></path>
          <path d="M8.5 12h5"></path>
        </svg>
        <span>Add a note</span>
        <span class="optional">Optional</span>
      </button>

      <p class="transfer-detail">No transfer fee · Usually arrives instantly</p>

      <div class="keypad" aria-label="Amount keypad">
        <button class="key" type="button">1</button>
        <button class="key" type="button">2</button>
        <button class="key" type="button">3</button>
        <button class="key" type="button">4</button>
        <button class="key" type="button">5</button>
        <button class="key" type="button">6</button>
        <button class="key" type="button">7</button>
        <button class="key" type="button">8</button>
        <button class="key" type="button">9</button>
        <button class="key" type="button">.</button>
        <button class="key" type="button">0</button>
        <button class="key" type="button" aria-label="Delete digit">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 7h10v10H9l-5-5 5-5z"></path>
            <path d="M12 10l4 4"></path>
            <path d="M16 10l-4 4"></path>
          </svg>
        </button>
      </div>

      <button class="review-button" type="button">Review transfer</button>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10l8-6 8 6v9H4v-9z"></path>
            <path d="M9 19v-6h6v6"></path>
          </svg>
        </span>
        <span>Work</span>
      </button>
      <button class="tab" type="button">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h12v16H6z"></path>
            <path d="M9 8h6"></path>
            <path d="M9 12h6"></path>
            <path d="M9 16h4"></path>
          </svg>
        </span>
        <span>Notes</span>
      </button>
      <button class="tab active" type="button" aria-current="page">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h13"></path>
            <path d="M13 4l4 4-4 4"></path>
            <path d="M20 16H7"></path>
            <path d="M11 12l-4 4 4 4"></path>
          </svg>
        </span>
        <span>Send</span>
      </button>
      <button class="tab" type="button">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h14v15H5z"></path>
            <path d="M8 3v4"></path>
            <path d="M16 3v4"></path>
            <path d="M5 10h14"></path>
          </svg>
        </span>
        <span>Schedule</span>
      </button>
    </nav>
  </div>
</body>
</html>
