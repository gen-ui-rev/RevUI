<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Northpath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eceb;
      color: #1d2928;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #fbfcfb;
      border: 1px solid #d7dddc;
    }

    .topbar {
      min-height: 64px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      border-bottom: 1px solid #e1e5e4;
      background: #fbfcfb;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      margin: 0;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #263635;
      cursor: pointer;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      justify-self: end;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #dce9e7;
      color: #315451;
      font-size: 12px;
      font-weight: 700;
    }

    main {
      padding: 20px 24px 0;
    }

    .hero {
      position: relative;
      width: 342px;
      height: 128px;
      margin-bottom: 22px;
    }

    .hero img {
      width: 342px;
      height: 128px;
      display: block;
      object-fit: cover;
      border-radius: 14px;
      background: #d8e0df;
    }

    .hero-label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      margin: 0;
      padding: 7px 10px;
      border-radius: 14px;
      background: #eef5f3;
      color: #284744;
      font-size: 12px;
      font-weight: 700;
    }

    .intro {
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #57716f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 7px;
      color: #172322;
      font-size: 28px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .intro-copy {
      margin: 0;
      color: #64716f;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #293837;
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #cdd7d5;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #1d2928;
      font-size: 15px;
      font-weight: 500;
    }

    input::placeholder {
      color: #8a9694;
      opacity: 1;
    }

    .password-input {
      padding-right: 50px;
    }

    .field-icon {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #647573;
    }

    .form-tools {
      display: flex;
      justify-content: flex-end;
      margin: -3px 0 18px;
    }

    .text-link {
      color: #315f5b;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary-button {
      width: 100%;
      height: 52px;
      margin: 0;
      border: 1px solid #b9d2cf;
      border-radius: 14px;
      background: #dce9e7;
      color: #193c39;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 21px 0;
      color: #7b8785;
      font-size: 12px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #dfe4e3;
    }

    .secondary-button {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #ccd5d4;
      border-radius: 14px;
      background: #ffffff;
      color: #263635;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .signup-boundary {
      margin-top: 24px;
      padding-top: 20px;
      text-align: center;
      border-top: 1px solid #e1e5e4;
    }

    .signup-boundary p {
      margin: 0;
      color: #657270;
      font-size: 14px;
      line-height: 1.5;
    }

    .signup-boundary a {
      margin-left: 4px;
      color: #315f5b;
      font-weight: 700;
      text-decoration: none;
    }

    .footer {
      margin-top: auto;
      padding: 16px 24px 18px;
      display: flex;
      justify-content: center;
      gap: 24px;
      border-top: 1px solid #e1e5e4;
      background: #fbfcfb;
    }

    .footer a {
      color: #6a7775;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="topbar-title">Northpath</p>
      <div class="brand-mark" aria-label="Northpath mark">N</div>
    </header>

    <main>
      <div class="hero">
        <img src="https://loremflickr.com/342/128/mountain?lock=3850" width="342" height="128" alt="Mountain valley along a travel route">
        <p class="hero-label">Your saved trips are waiting</p>
      </div>

      <section class="intro" aria-labelledby="signin-title">
        <p class="eyebrow">Existing account</p>
        <h1 id="signin-title">Sign in to continue</h1>
        <p class="intro-copy">Access your bookings, saved stays, and trip plans.</p>
      </section>

      <form>
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="password-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
            <button class="field-icon" type="button" aria-label="Show password">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12C4.5 8.6 7.7 6.5 12 6.5C16.3 6.5 19.5 8.6 21.5 12C19.5 15.4 16.3 17.5 12 17.5C7.7 17.5 4.5 15.4 2.5 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-tools">
          <a class="text-link" href="#">Forgot password?</a>
        </div>

        <button class="primary-button" type="submit">Sign in</button>

        <div class="divider">or</div>

        <button class="secondary-button" type="button">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.5L14.1 8.2L19.2 8.8L15.4 12.3L16.4 17.3L12 14.7L7.6 17.3L8.6 12.3L4.8 8.8L9.9 8.2L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          Continue with travel pass
        </button>
      </form>

      <section class="signup-boundary" aria-label="New account">
        <p>New to Northpath?<a href="#">Create an account</a></p>
      </section>
    </main>

    <nav class="footer" aria-label="Support navigation">
      <a href="#">Help</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </nav>
  </div>
</body>
</html>
