<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Follow Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e4;
      color: #202528;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f8f7f5;
    }

    .follow-card {
      padding: 22px;
      background: #ffffff;
      border-radius: 14px;
    }

    .shop-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .monogram {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #dce1e3;
      color: #46535a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .shop-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #697277;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202528;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .category {
      margin: 4px 0 0;
      color: #697277;
      font-size: 14px;
      line-height: 1.4;
    }

    .follow-control {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      background: #edf0f1;
      border-radius: 14px;
    }

    .control-copy {
      min-width: 0;
      flex: 1;
    }

    .control-title {
      margin: 0 0 5px;
      color: #252b2e;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .control-description {
      margin: 0;
      color: #626c71;
      font-size: 14px;
      line-height: 1.5;
    }

    .switch {
      width: 50px;
      height: 30px;
      flex: 0 0 50px;
      padding: 4px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border: 0;
      border-radius: 14px;
      background: #526169;
      appearance: none;
      cursor: default;
    }

    .switch-knob {
      width: 22px;
      height: 22px;
      display: block;
      border-radius: 11px;
      background: #ffffff;
    }

    .status {
      margin: 14px 2px 0;
      color: #626c71;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="follow-card" aria-labelledby="shop-name">
      <div class="shop-identity">
        <div class="monogram" aria-hidden="true">HM</div>
        <div class="shop-copy">
          <p class="eyebrow">Shop on NookCart</p>
          <h1 id="shop-name">Harbor &amp; Main</h1>
          <p class="category">Home goods and storage</p>
        </div>
      </div>

      <div class="follow-control">
        <div class="control-copy">
          <p class="control-title">Follow this shop</p>
          <p class="control-description">New products and restocks will appear in your feed.</p>
        </div>
        <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Follow Harbor and Main">
          <span class="switch-knob"></span>
        </button>
      </div>

      <p class="status">Following since March 18, 2025</p>
    </section>
  </div>
</body>
</html>
