<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Lesson Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d8d5;
      color: #292724;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 38px 22px;
      background: #e9e8e5;
    }

    .activity {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(53, 48, 43, 0.11);
    }

    .activity-label {
      margin: 0 0 8px;
      color: #887667;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .service {
      margin: 5px 0 0;
      color: #6d6964;
      font-size: 14px;
      line-height: 1.4;
    }

    .teacher {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .monogram {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #887667;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
    }

    .teacher-copy {
      min-width: 0;
    }

    .teacher-name,
    .teacher-note {
      margin: 0;
    }

    .teacher-name {
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
    }

    .teacher-note {
      margin-top: 2px;
      color: #6d6964;
      font-size: 14px;
      line-height: 1.35;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
      color: #514d48;
      font-size: 14px;
      line-height: 1.4;
    }

    .progress-copy span:last-child {
      color: #76695f;
      white-space: nowrap;
    }

    .progress-track {
      margin-top: 8px;
      width: 100%;
      background: #e7e1dc;
      border-radius: 10px;
    }

    .progress-fill {
      width: 40%;
      padding-top: 7px;
      background: #887667;
      border-radius: 10px;
    }

    .return-button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #887667;
      color: #ffffff;
      font: 600 16px/1.35 'Source Serif 4', Georgia, serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-labelledby="lesson-title">
      <p class="activity-label">Live lesson</p>
      <h1 id="lesson-title">Spanish Conversation Lab</h1>
      <p class="service">Cedar Language</p>

      <div class="teacher">
        <div class="monogram" aria-hidden="true">AM</div>
        <div class="teacher-copy">
          <p class="teacher-name">Avery Moreno</p>
          <p class="teacher-note">Practicing travel conversations</p>
        </div>
      </div>

      <div class="progress-copy">
        <span>18 of 45 minutes</span>
        <span>27 minutes left</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="45" aria-valuenow="18">
        <div class="progress-fill"></div>
      </div>

      <button class="return-button" type="button">Return to lesson</button>
    </section>
  </div>
</body>
</html>
