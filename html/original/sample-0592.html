<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailmark — Badge Earned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e6e4e0;
    font-family: 'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    background: #fbfaf8;
    padding: 34px 0;
    box-sizing: border-box;
    color: #1c1c1a;
  }
  .pad { padding: 0 28px; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6f6f68;
    font-weight: 600;
    margin: 0 0 14px 0;
  }
  .hero {
    display: block;
    width: 334px;
    height: 180px;
    object-fit: cover;
    background: #d5d2cd;
  }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 20px 0 0 0;
    line-height: 1.15;
  }
  .meta {
    font-size: 14px;
    color: #6f6f68;
    margin: 6px 0 0 0;
  }
  .desc {
    font-size: 15px;
    line-height: 1.55;
    color: #35352f;
    margin: 12px 0 0 0;
  }
  hr {
    border: 0;
    border-top: 1px solid #ddd9d3;
    margin: 24px 0 22px 0;
  }
  .section-label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6f6f68;
    font-weight: 600;
    margin: 0 0 12px 0;
  }
  .next-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .next-name {
    font-size: 17px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .next-count {
    font-size: 14px;
    color: #6f6f68;
    flex: none;
  }
  .track {
    width: 100%;
    height: 8px;
    background: #e3e0da;
    margin-top: 12px;
  }
  .fill {
    width: 66.6%;
    height: 8px;
    background: #4a4a44;
  }
  .remain {
    font-size: 13px;
    color: #6f6f68;
    margin: 10px 0 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="pad">
      <p class="eyebrow">Milestone reached</p>
      <img class="hero" src="https://loremflickr.com/334/180/mountain?lock=7921" width="334" height="180" alt="Snow-covered ridgeline above the lodge where the badge was earned">
      <h1>Summit Seeker</h1>
      <p class="meta">Earned March 14, 2025 · Trailmark Passport</p>
      <p class="desc">Awarded for six completed stays at mountain lodges above 6,000 feet. Held by 2 percent of Trailmark travelers.</p>

      <hr>

      <p class="section-label">Next milestone</p>
      <div class="next-row">
        <span class="next-name">Continental Collector</span>
        <span class="next-count">4 of 6</span>
      </div>
      <div class="track"><div class="fill"></div></div>
      <p class="remain">Remaining: Africa, South America</p>
    </div>
  </div>
</body>
</html>
