<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinned Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dde1e5;
      color: #202328;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f1f3f5;
    }

    .pin-card {
      padding: 24px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(31, 35, 40, 0.09);
    }

    .context {
      margin: 0 0 18px;
      color: #6e737b;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: #a96100;
    }

    .status svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .status h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .stay {
      padding-bottom: 20px;
      border-bottom: 1px solid #e3e5e8;
    }

    .stay h2 {
      margin: 0 0 7px;
      color: #202328;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
    }

    .details {
      margin: 0;
      color: #656a72;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .note {
      margin: 18px 0 20px;
      color: #555b63;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .remove-button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d68a15;
      border-radius: 10px;
      background: #fff8eb;
      color: #8a5100;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pin-title">
      <p class="context">Northpath · Lisbon trip</p>

      <div class="status">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.2 3.75h7.6l-1.05 5.1 2.65 2.8v1.6H6.6v-1.6l2.65-2.8-1.05-5.1Z" fill="#E49A24" stroke="#A96100" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 13.25v7" stroke="#A96100" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <h1 id="pin-title">Pinned to the top</h1>
      </div>

      <div class="stay">
        <h2>Alder House Alfama</h2>
        <p class="details">Apartment · 2 guests · June 14–18<br>$684 total before taxes</p>
      </div>

      <p class="note">Only you can see this pin. It changes the order of your options without saving the stay or sending a public like.</p>

      <button class="remove-button" type="button">Remove pin</button>
    </section>
  </div>
</body>
</html>
