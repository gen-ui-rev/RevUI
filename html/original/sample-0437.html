<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Location</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7e4;
      color: #282926;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 20px;
      background: #f4f4f1;
    }

    .save-panel {
      padding: 20px;
      background: #fbfbf9;
      border-radius: 14px;
    }

    .intro {
      padding: 18px;
      background: #e7e7e2;
      border-radius: 14px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #686a65;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #30312e;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .note-name {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .note-thumbnail {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      background: #c9cac4;
      border-radius: 14px;
    }

    .note-copy {
      min-width: 0;
    }

    .note-title {
      margin: 0;
      overflow: hidden;
      color: #343532;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-meta {
      margin: 3px 0 0;
      color: #73756f;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
    }

    .location-heading {
      margin: 22px 0 10px;
      color: #4d4f4a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .locations {
      display: grid;
      gap: 8px;
    }

    .location {
      width: 100%;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 14px;
      background: #f0f0ed;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: default;
    }

    .location.selected {
      background: #deded8;
    }

    .location-text {
      min-width: 0;
      flex: 1;
    }

    .location-name {
      display: block;
      overflow: hidden;
      color: #323330;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .location-detail {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: #71736d;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selection-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f8f8f6;
      color: #555751;
    }

    .selection-placeholder {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 50%;
      background: #deded9;
    }

    .save-button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 16px;
      border: 0;
      border-radius: 14px;
      background: #555751;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: default;
    }

    .save-note {
      margin: 12px 2px 0;
      color: #747670;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="save-panel" aria-labelledby="save-title">
      <section class="intro">
        <p class="eyebrow">Save note</p>
        <h1 id="save-title">Choose a save location</h1>

        <div class="note-name">
          <div class="note-thumbnail" aria-hidden="true"></div>
          <div class="note-copy">
            <p class="note-title">Launch review decisions</p>
            <p class="note-meta">Edited today in Draftlane</p>
          </div>
        </div>
      </section>

      <p class="location-heading">Save to</p>

      <div class="locations" role="radiogroup" aria-label="Save location">
        <button class="location selected" type="button" role="radio" aria-checked="true">
          <span class="location-text">
            <span class="location-name">Project planning</span>
            <span class="location-detail">Cedar team workspace</span>
          </span>
          <span class="selection-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 7.2L5.55 9.6L11 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>

        <button class="location" type="button" role="radio" aria-checked="false">
          <span class="location-text">
            <span class="location-name">Weekly notes</span>
            <span class="location-detail">Private workspace</span>
          </span>
          <span class="selection-placeholder" aria-hidden="true"></span>
        </button>
      </div>

      <button class="save-button" type="button">Save to Project planning</button>
      <p class="save-note">This adds the note to the selected space. It does not pin or favorite the original.</p>
    </main>
  </div>
</body>
</html>
