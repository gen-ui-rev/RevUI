<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wanderline — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#2f6bff; }
  *{ box-sizing:border-box; }
  body{
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    padding:40px 0; margin:0; background:#e6e7ea;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px; height:844px; position:relative; background:#0d1116; color:#fff;
  }

  /* story surface */
  .story{ position:absolute; left:0; right:0; top:0; height:780px; }
  .story img.hero{
    position:absolute; inset:0; width:390px; height:780px;
    object-fit:cover; display:block; background:#1a2029;
  }
  .topscrim{
    position:absolute; left:0; right:0; top:0; height:104px;
    background:rgba(9,13,19,0.5);
  }

  /* progress */
  .progress{
    position:absolute; top:12px; left:14px; right:14px;
    display:flex; gap:4px;
  }
  .seg{ flex:1; height:2px; background:rgba(255,255,255,0.32); border-radius:4px; }
  .seg.done{ background:#fff; }
  .seg .fill{ display:block; height:2px; width:64%; background:var(--blue); border-radius:4px; }

  /* header */
  .head{
    position:absolute; top:26px; left:14px; right:14px;
    display:flex; align-items:center; gap:10px;
  }
  .mono{
    width:34px; height:34px; border-radius:4px; background:var(--blue);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; letter-spacing:.02em; flex:none;
  }
  .who{ min-width:0; flex:1; }
  .who .name{
    font-size:14px; font-weight:600; line-height:18px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .who .meta{
    font-size:12px; font-weight:400; line-height:16px; color:rgba(255,255,255,0.72);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .close{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:none; }

  /* caption + stay card */
  .foot{ position:absolute; left:14px; right:14px; bottom:16px; }
  .place{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:#fff; background:var(--blue);
    padding:4px 8px; border-radius:4px;
  }
  .caption{
    margin:12px 0 0; font-size:16px; font-weight:500; line-height:23px;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45);
  }
  .stay{
    margin-top:14px; display:flex; align-items:center; gap:12px;
    background:rgba(10,14,20,0.62); border:1px solid rgba(255,255,255,0.18);
    border-radius:4px; padding:10px;
  }
  .stay img{
    width:48px; height:48px; border-radius:4px; object-fit:cover; display:block;
    background:#1a2029; flex:none;
  }
  .stay .txt{ flex:1; min-width:0; }
  .stay .t1{
    font-size:14px; font-weight:600; line-height:19px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stay .t2{ font-size:12px; font-weight:400; line-height:16px; color:rgba(255,255,255,0.74); }
  .stay .cta{
    flex:none; background:var(--blue); color:#fff; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:4px;
  }

  /* tab bar */
  .tabs{
    position:absolute; left:0; right:0; bottom:0; height:64px;
    background:#0b0f14; border-top:1px solid rgba(255,255,255,0.14);
    display:flex; align-items:center;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:rgba(255,255,255,0.56); font-size:12px; font-weight:500;
  }
  .tab.on{ color:var(--blue); font-weight:600; }
  .tab svg{ display:block; }
</style>
</head>
<body>
  <div class="screen">
    <div class="story">
      <img class="hero" src="https://loremflickr.com/390/780/mountain?lock=11661" width="390" height="780" alt="Morning fog over the ridge trail above Halvard Fjord">
      <div class="topscrim"></div>

      <div class="progress">
        <div class="seg done"></div>
        <div class="seg"><span class="fill"></span></div>
        <div class="seg"></div>
      </div>

      <div class="head">
        <div class="mono">MK</div>
        <div class="who">
          <div class="name">Marisol Keane</div>
          <div class="meta">Halvard Fjord, Norway · 2h ago</div>
        </div>
        <div class="close" aria-label="Close story">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 4l10 10M14 4L4 14"/>
          </svg>
        </div>
      </div>

      <div class="foot">
        <span class="place">Day 2 of 5</span>
        <p class="caption">The ridge trail clears the fog around 7:40 a.m. Start from the lodge gate and allow three hours to the second overlook.</p>
        <div class="stay">
          <img src="https://loremflickr.com/48/48/hotel?lock=11664" width="48" height="48" alt="Vantia Ridge Lodge exterior">
          <div class="txt">
            <div class="t1">Vantia Ridge Lodge</div>
            <div class="t2">$168 / night · 1.2 mi from trailhead</div>
          </div>
          <div class="cta">View</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="M14.2 7.8l-1.7 4.7-4.7 1.7 1.7-4.7z"/>
        </svg>
        Explore
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15V6"/><path d="M3 11h11a5 5 0 015 5v-1"/><path d="M19 15v1"/><path d="M6.5 8.5h2"/>
        </svg>
        Stays
      </div>
      <div class="tab on">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="15" height="15" rx="4"/><path d="M9.5 8.2l4.3 2.8-4.3 2.8z"/>
        </svg>
        Stories
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6.5" width="16" height="12" rx="3"/><path d="M8.5 6.5V4.8a1.3 1.3 0 011.3-1.3h2.4a1.3 1.3 0 011.3 1.3v1.7"/>
        </svg>
        Trips
      </div>
    </div>
  </div>
</body>
</html>
