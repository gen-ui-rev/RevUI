<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options — Tidepool Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e6e5e2;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #15191b;
  }
  .screen {
    width: 390px;
    background: #ffffff;
    padding: 34px 22px;
  }
  .sheet { width: 100%; }

  .item {
    display: flex;
    gap: 16px;
    align-items: center;
    background: rgba(0, 160, 178, 0.13);
    padding: 18px;
  }
  .item img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    display: block;
    background: #cfd4d5;
    flex: none;
  }
  .item-text { min-width: 0; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #066975;
  }
  .item-text h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.2;
    margin: 0 0 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-text p.sub {
    margin: 0;
    font-size: 14px;
    color: #4d5658;
  }

  .actions {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
  }
  .actions li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 18px;
    font-size: 17px;
    font-weight: 600;
    border-top: 1px solid #eceae7;
  }
  .actions li:first-child { border-top: 0; }
  .actions li.primary {
    background: rgba(0, 160, 178, 0.13);
    color: #066975;
    border-top: 0;
  }
  .actions li .meta {
    font-size: 14px;
    font-weight: 400;
    color: #6b7477;
    flex: none;
  }
  .actions li.primary .meta { color: #0b7c8a; }

  .cancel {
    margin-top: 18px;
    padding: 16px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: #6b7477;
    background: #f2f1ee;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="item">
        <img src="https://loremflickr.com/72/72/vinyl?lock=4121" width="72" height="72" alt="Cover art for the episode: a record on a turntable">
        <div class="item-text">
          <p class="eyebrow">Episode · 48 min</p>
          <h1>The Analog Years</h1>
          <p class="sub">Studio Hours · Feb 14, 2025</p>
        </div>
      </div>

      <ul class="actions">
        <li class="primary">
          <span>Play next</span>
          <span class="meta">After current track</span>
        </li>
        <li>
          <span>Add to queue</span>
          <span class="meta">6 waiting</span>
        </li>
        <li>
          <span>Download episode</span>
          <span class="meta">62 MB</span>
        </li>
      </ul>

      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
