<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stonewell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #E7E5E4;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .screen {
    width: 390px;
    height: 844px;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    color: #1C1917;
  }

  .topbar {
    padding: 20px 24px 18px;
    border-bottom: 1px solid #F0EFEE;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wordmark {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: #78716C;
    text-transform: uppercase;
  }
  .region {
    font-size: 12px;
    font-weight: 400;
    color: #A8A29E;
    letter-spacing: 0.02em;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 40px 96px;
  }
  .mark { color: #059669; }
  .name {
    margin: 34px 0 0;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .tagline {
    margin: 10px 0 0;
    font-size: 15px;
    font-weight: 400;
    color: #78716C;
  }
  .divider {
    width: 40px;
    height: 2px;
    background: #059669;
    margin-top: 30px;
    border-radius: 4px;
  }

  .footer {
    padding: 0 24px 26px;
    text-align: center;
  }
  .footer-rule {
    height: 1px;
    background: #F0EFEE;
    margin-bottom: 20px;
  }
  .secure {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    color: #57534E;
  }
  .secure svg { color: #059669; }
  .build {
    margin: 8px 0 0;
    font-size: 12px;
    font-weight: 400;
    color: #A8A29E;
  }

  .tabbar {
    border-top: 1px solid #F0EFEE;
    display: flex;
    padding: 12px 8px 18px;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #D6D3D1;
  }
  .tab span {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="wordmark">Stonewell</div>
      <div class="region">United States</div>
    </div>

    <main>
      <div class="mark">
        <svg width="96" height="96" viewBox="0 0 64 64" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="32" cy="32" r="27"/>
          <path d="M17 40 L27 29 L35 35 L47 22"/>
          <path d="M47 30 L47 22 L39 22"/>
        </svg>
      </div>
      <h1 class="name">Stonewell</h1>
      <p class="tagline">Banking, saving, and investing</p>
      <div class="divider"></div>
    </main>

    <div class="footer">
      <div class="footer-rule"></div>
      <div class="secure">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        Encrypted connection verified
      </div>
      <p class="build">Version 4.2.1 · Build 8840</p>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11 12 4l8 7"/>
          <path d="M6 10v10h12V10"/>
        </svg>
        <span>Home</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2"/>
          <path d="M3 10h18"/>
        </svg>
        <span>Spend</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19h16"/>
          <path d="M7 19v-6M12 19V7M17 19v-9"/>
        </svg>
        <span>Invest</span>
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="9" r="3.5"/>
          <path d="M5 20c1.6-3.4 4-5 7-5s5.4 1.6 7 5"/>
        </svg>
        <span>Profile</span>
      </div>
    </nav>

  </div>
</body>
</html>
