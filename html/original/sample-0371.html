<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move to folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1a5fe0;
    --line:#e2e5ea;
    --ink:#141821;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#eceef1;
    font-family:'Roboto', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:28px 24px;
    background:#eceef1;
  }
  .card{
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  .subject{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
  }
  .subject img{
    width:52px;
    height:52px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#d6d9de;
  }
  .subject .name{
    font-size:15px;
    font-weight:500;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subject .meta{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    line-height:16px;
  }
  .subject .txt{min-width:0;}
  .label{
    margin:22px 0 8px;
    font-size:12px;
    font-weight:500;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .list{
    border:1px solid var(--line);
    border-radius:10px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row:first-child{border-radius:10px 10px 0 0;}
  .row:last-child{border-radius:0 0 10px 10px;}
  .row.selected{background:#f3f7fe;}
  .row .txt{flex:1;min-width:0;}
  .row .title{
    font-size:15px;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row.selected .title{font-weight:500;color:var(--accent);}
  .row .count{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    line-height:16px;
  }
  .mark{flex:none;width:20px;height:20px;}
  .footnote{
    margin:14px 2px 0;
    font-size:12px;
    line-height:16px;
    color:var(--muted);
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    padding:12px 8px;
    text-align:center;
  }
  .btn.ghost{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .btn.primary{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1>Move to folder</h1>

      <div class="subject">
        <img src="https://loremflickr.com/52/52/notebook?lock=5281" width="52" height="52" alt="Cover thumbnail of the note being moved, an open notebook on a desk">
        <div class="txt">
          <div class="name">Q3 Launch Retrospective</div>
          <div class="meta">Note &middot; Edited Mar 4, 2024</div>
        </div>
      </div>

      <div class="label">Destination</div>

      <div class="list">
        <div class="row">
          <div class="txt">
            <div class="title">Product Team</div>
            <div class="count">24 notes</div>
          </div>
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="8.5" fill="none" stroke="#c8ccd3" stroke-width="1"/>
          </svg>
        </div>
        <div class="row selected">
          <div class="txt">
            <div class="title">Design Reviews</div>
            <div class="count">8 notes</div>
          </div>
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="9" fill="#1a5fe0"/>
            <path d="M6 10.3l2.6 2.6L14.2 7.3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="row">
          <div class="txt">
            <div class="title">Personal Drafts</div>
            <div class="count">3 notes</div>
          </div>
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="8.5" fill="none" stroke="#c8ccd3" stroke-width="1"/>
          </svg>
        </div>
      </div>

      <p class="footnote">Currently in Inbox. Moving keeps sharing with Nadia Ellery and 4 others.</p>

      <div class="actions">
        <div class="btn ghost">Cancel</div>
        <div class="btn primary">Move</div>
      </div>
    </div>
  </div>
</body>
</html>
