<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledgerwave Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d6d3d1;
      color: #292524;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #e7e5e4;
    }

    .player {
      width: 100%;
      padding: 20px;
      background: #ffffff;
      border-radius: 0;
      box-shadow: 0 8px 24px rgba(41, 37, 36, 0.10);
    }

    .cover {
      width: 302px;
      height: 150px;
      display: block;
      object-fit: cover;
      background: #a8a29e;
    }

    .episode {
      margin-top: 18px;
    }

    .series {
      margin: 0 0 6px;
      color: #78716c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1c1917;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .byline {
      margin: 7px 0 0;
      color: #57534e;
      font-size: 14px;
      line-height: 1.45;
    }

    .progress-area {
      margin-top: 20px;
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 4px;
      background: #d6d3d1;
    }

    .progress-fill {
      width: 42%;
      height: 4px;
      background: #78716c;
    }

    .progress-thumb {
      position: absolute;
      top: 50%;
      left: 42%;
      width: 12px;
      height: 12px;
      background: #78716c;
      border: 2px solid #ffffff;
      border-radius: 0;
      transform: translate(-50%, -50%);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #78716c;
      font-size: 12px;
      line-height: 1.4;
    }

    .controls {
      display: grid;
      grid-template-columns: 44px 44px 56px 44px 44px;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
    }

    button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #44403c;
      font: inherit;
    }

    button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .speed {
      color: #57534e;
      font-size: 14px;
      font-weight: 500;
    }

    .play {
      width: 56px;
      height: 52px;
      background: #78716c;
      color: #ffffff;
    }

    .play svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
      stroke: none;
    }

    .queue {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e7e5e4;
    }

    .queue-label {
      margin: 0 0 4px;
      color: #78716c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .queue-title {
      margin: 0;
      color: #292524;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .queue-meta {
      margin: 3px 0 0;
      color: #78716c;
      font-size: 12px;
      line-height: 1.4;
    }

    .queue-duration {
      color: #57534e;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="player" aria-label="Ledgerwave audio player">
      <img
        class="cover"
        src="https://loremflickr.com/302/150/city?lock=3670"
        width="302"
        height="150"
        alt="Downtown office towers featured in the episode"
      >

      <section class="episode" aria-labelledby="episode-title">
        <p class="series">Ledgerwave Daily Brief</p>
        <h1 id="episode-title">What Lower Rates Mean for Your Savings</h1>
        <p class="byline">Hosted by Avery Stone · March 14, 2025</p>
      </section>

      <section class="progress-area" aria-label="Playback progress">
        <div class="progress-track">
          <div class="progress-fill"></div>
          <div class="progress-thumb"></div>
        </div>
        <div class="time-row">
          <span>12:18</span>
          <span>29:24</span>
        </div>
      </section>

      <div class="controls" aria-label="Playback controls">
        <button class="speed" type="button" aria-label="Playback speed">1×</button>

        <button type="button" aria-label="Rewind 15 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 7H4V3"></path>
            <path d="M4.5 7.5A8 8 0 1 1 4 16"></path>
            <path d="M9.5 10.5v4"></path>
            <path d="M14 11v3.5"></path>
          </svg>
        </button>

        <button class="play" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5z"></path>
          </svg>
        </button>

        <button type="button" aria-label="Forward 15 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 7h4V3"></path>
            <path d="M19.5 7.5A8 8 0 1 0 20 16"></path>
            <path d="M9.5 10.5v4"></path>
            <path d="M14 11v3.5"></path>
          </svg>
        </button>

        <button type="button" aria-label="Audio output">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5z"></path>
            <path d="M17 9a4 4 0 0 1 0 6"></path>
            <path d="M19.5 6.5a8 8 0 0 1 0 11"></path>
          </svg>
        </button>
      </div>

      <section class="queue" aria-label="Up next">
        <div>
          <p class="queue-label">Up next</p>
          <p class="queue-title">The New Rules of Credit Card Rewards</p>
          <p class="queue-meta">Ledgerwave Daily Brief</p>
        </div>
        <span class="queue-duration">18 min</span>
      </section>
    </main>
  </div>
</body>
</html>
