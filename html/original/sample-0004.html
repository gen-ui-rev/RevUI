<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Milestone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ecee;
      color: #132126;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 30px;
      background: #ffffff;
    }

    .achievement {
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #087f91;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-mark {
      width: 112px;
      margin: 0 auto 22px;
      padding: 24px;
      border-radius: 10px;
      background: #18c6de;
      color: #073d46;
    }

    .badge-mark svg {
      display: block;
      width: 64px;
      height: 64px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .summary {
      max-width: 300px;
      margin: 12px auto 0;
      color: #53636a;
      font-size: 15px;
      line-height: 1.55;
    }

    .details {
      margin-top: 28px;
      border-top: 1px solid #dce3e5;
      text-align: left;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #dce3e5;
      font-size: 14px;
      line-height: 1.4;
    }

    .detail-label {
      color: #66757b;
      font-weight: 400;
    }

    .detail-value {
      color: #132126;
      font-weight: 700;
      text-align: right;
    }

    .service-note {
      margin: 18px 0 0;
      color: #7a888d;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="achievement" aria-labelledby="achievement-title">
      <p class="eyebrow">Milestone earned</p>

      <div class="badge-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 10H46V22C46 30.837 39.837 38 32 38C24.163 38 18 30.837 18 22V10Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
          <path d="M18 15H10V20C10 27.18 14.825 32.581 21.5 33.75" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M46 15H54V20C54 27.18 49.175 32.581 42.5 33.75" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 38V48" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M22 54H42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M27 48H37" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <path d="M32 17L34.245 21.449L39 22.167L35.5 25.6L36.326 30.5L32 28.2L27.674 30.5L28.5 25.6L25 22.167L29.755 21.449L32 17Z" fill="currentColor"/>
        </svg>
      </div>

      <h1 id="achievement-title">250-Hour Listener</h1>
      <p class="summary">You reached 250 hours of music listening across your Waveframe library.</p>

      <section class="details" aria-label="Milestone details">
        <div class="detail-row">
          <span class="detail-label">Earned</span>
          <span class="detail-value">May 18, 2025</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Listening time</span>
          <span class="detail-value">250 hr 12 min</span>
        </div>
      </section>

      <p class="service-note">Recorded by Waveframe listening history</p>
    </main>
  </div>
</body>
</html>
