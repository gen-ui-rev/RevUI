<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddd9;
      color: #242321;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #fbfaf8;
    }

    header {
      margin: 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #d65300;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #242321;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .selection-summary {
      margin: 8px 0 0;
      color: #d65300;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
    }

    .rule {
      height: 1px;
      margin: 20px 0 18px;
      background: #d8d5d0;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0;
      padding: 0;
      color: #343230;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    input[type="radio"] {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .date-choice span {
      display: block;
      padding: 9px 6px 10px;
      border: 1px solid #cfcbc5;
      border-radius: 4px;
      background: transparent;
      color: #393735;
      text-align: center;
      cursor: pointer;
    }

    .date-choice .day {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
      color: #77726c;
    }

    .date-choice .date {
      display: block;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .date-choice input:checked + span {
      border-color: #d65300;
      background: #fff0e6;
      color: #b84600;
    }

    .date-choice input:checked + span .day {
      color: #b84600;
    }

    .date-choice input:focus-visible + span,
    .time-choice input:focus-visible + span {
      outline: 2px solid #242321;
      outline-offset: 2px;
    }

    .time-section {
      margin-top: 22px;
    }

    .time-options {
      margin-top: 8px;
      border-top: 1px solid #d8d5d0;
    }

    .time-choice {
      display: block;
    }

    .time-choice > span {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 10px;
      border-bottom: 1px solid #d8d5d0;
      color: #302e2c;
      cursor: pointer;
    }

    .time-value {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
    }

    .availability {
      color: #77726c;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    .time-choice input:checked + span {
      margin: -1px 0 0;
      border: 1px solid #d65300;
      border-radius: 4px;
      background: #fff0e6;
      color: #b84600;
    }

    .time-choice input:checked + span .availability {
      color: #b84600;
      font-weight: 500;
    }

    .note {
      margin: 14px 0 0;
      color: #6c6863;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }

    .primary-action {
      width: 100%;
      margin-top: 18px;
      padding: 14px 18px;
      border: 0;
      border-radius: 4px;
      background: #d65300;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }

    .primary-action:focus-visible {
      outline: 2px solid #242321;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <p class="eyebrow">Pineledger transfer</p>
      <h1>Choose transfer time</h1>
      <p class="selection-summary">Tuesday, June 17 at 10:30 AM</p>
    </header>

    <div class="rule"></div>

    <form>
      <fieldset>
        <legend>Delivery date</legend>
        <div class="date-options">
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="day">Monday</span>
              <span class="date">Jun 16</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date" checked>
            <span>
              <span class="day">Tuesday</span>
              <span class="date">Jun 17</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="day">Wednesday</span>
              <span class="date">Jun 18</span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="time-section">
        <legend>Delivery time</legend>
        <div class="time-options">
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>
              <span class="time-value">9:30 AM</span>
              <span class="availability">Available</span>
            </span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time" checked>
            <span>
              <span class="time-value">10:30 AM</span>
              <span class="availability">Selected</span>
            </span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>
              <span class="time-value">11:30 AM</span>
              <span class="availability">Available</span>
            </span>
          </label>
        </div>
      </fieldset>

      <p class="note">Times after 4:00 PM arrive the next business day.</p>
      <button class="primary-action" type="button">Schedule $1,250.00 transfer</button>
    </form>
  </div>
</body>
</html>
