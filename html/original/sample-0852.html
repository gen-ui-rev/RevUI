<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Care Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9ed;
      color: #202026;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 20px;
      background: #f6f6f8;
    }

    .pin-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d9d9e0;
      border-radius: 4px;
    }

    .pin-mark {
      width: 44px;
      height: 44px;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: #6d43c0;
      border-radius: 4px;
    }

    .pin-mark svg {
      width: 22px;
      height: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0 0 22px;
      color: #5f5f69;
      font-size: 14px;
      line-height: 1.55;
    }

    .plan {
      padding: 16px;
      border: 1px solid #d9d9e0;
      border-left: 3px solid #6d43c0;
      border-radius: 4px;
    }

    .plan-label {
      margin: 0 0 5px;
      color: #72727c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .plan-name {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
    }

    .plan-meta {
      margin: 0;
      color: #5f5f69;
      font-size: 14px;
      line-height: 1.45;
    }

    .privacy-note {
      margin: 18px 0 20px;
      color: #5f5f69;
      font-size: 13px;
      line-height: 1.5;
    }

    .pin-button {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 1px solid #6d43c0;
      border-radius: 4px;
      background: #6d43c0;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .pin-button svg {
      width: 17px;
      height: 17px;
      flex: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pin-title">
      <div class="pin-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
          <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="pin-title">Pin this care plan</h1>
      <p class="intro">Keep your current plan at the top of Home for quicker access.</p>

      <div class="plan">
        <p class="plan-label">Current care plan</p>
        <p class="plan-name">Lower back recovery</p>
        <p class="plan-meta">4 exercises · Next session June 18</p>
      </div>

      <p class="privacy-note">Pinning changes only your Home view. It does not save a copy or share a reaction with your care team.</p>

      <button class="pin-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
          <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Pin to Home
      </button>
    </section>
  </div>
</body>
</html>
