<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopside — Reminder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1B8A4B;
    --tint:rgba(27,138,75,0.10);
    --tint-strong:rgba(27,138,75,0.18);
    --ink:#13251C;
    --muted:#6C7C74;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E7E9E5;
    font-family:'Poppins', system-ui, sans-serif;
  }
  .screen{
    width:390px;
    height:844px;
    background:#FFFFFF;
    display:flex;
    flex-direction:column;
    color:var(--ink);
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px 12px;
  }
  .topbar .back{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    margin-left:-6px;
  }
  .topbar h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.1px;
  }
  .save{
    font-size:14px;
    font-weight:600;
    color:var(--green);
  }

  .content{
    flex:1;
    padding:4px 16px 0;
  }

  /* hero */
  .hero{
    background:var(--tint);
    border-radius:10px;
    overflow:hidden;
  }
  .hero img{
    display:block;
    width:358px;
    height:132px;
    object-fit:cover;
    background:#CBD5CE;
  }
  .hero-body{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px 14px;
  }
  .mono{
    width:40px;height:40px;
    border-radius:10px;
    background:var(--tint-strong);
    color:var(--green);
    font-size:14px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .hero-title{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
  }
  .hero-sub{
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:270px;
  }

  /* time block */
  .time{
    margin-top:16px;
    background:var(--tint);
    border-radius:10px;
    padding:16px 18px 18px;
  }
  .cap{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.2px;
  }
  .time .value{
    font-size:36px;
    font-weight:600;
    line-height:1.15;
    margin-top:2px;
    color:var(--green);
  }
  .time .detail{
    font-size:13px;
    color:var(--ink);
    margin-top:6px;
  }

  h2{
    font-size:14px;
    font-weight:600;
    margin:22px 0 10px;
  }

  .chips{
    display:flex;
    gap:8px;
  }
  .chip{
    font-size:13px;
    font-weight:500;
    padding:8px 13px;
    border-radius:10px;
    background:#F1F3F0;
    color:var(--muted);
  }
  .chip.on{
    background:var(--green);
    color:#fff;
  }

  .days{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
  }
  .day{
    width:40px;height:40px;
    border-radius:10px;
    background:#F1F3F0;
    color:var(--muted);
    font-size:13px;
    font-weight:500;
    display:flex;align-items:center;justify-content:center;
  }
  .day.on{
    background:var(--tint-strong);
    color:var(--green);
    font-weight:600;
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    border-radius:10px;
    background:#F7F8F6;
    margin-bottom:8px;
  }
  .row .date{
    font-size:14px;
    font-weight:500;
  }
  .row .right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .row .time-val{
    font-size:14px;
    color:var(--muted);
  }
  .tag{
    font-size:12px;
    font-weight:500;
    color:var(--green);
    background:var(--tint);
    border-radius:10px;
    padding:3px 9px;
  }

  /* tab bar */
  .tabs{
    display:flex;
    border-top:1px solid #EDEFEC;
    padding:9px 8px 16px;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#98A59E;
    font-size:12px;
  }
  .tab.on{color:var(--green);font-weight:500;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <span class="back" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#13251C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <h1>Reminder</h1>
    <span class="save">Save</span>
  </div>

  <div class="content">

    <div class="hero">
      <img src="https://loremflickr.com/358/132/cafe?lock=5321" width="358" height="132" alt="Corner table at the coffee shop where the club meets">
      <div class="hero-body">
        <div class="mono">TC</div>
        <div>
          <div class="hero-title">Thursday Coffee Club</div>
          <div class="hero-sub">Weekly meetup · Halstead Roasters, 4th St</div>
        </div>
      </div>
    </div>

    <div class="time">
      <div class="cap">Reminder time</div>
      <div class="value">7:30 PM</div>
      <div class="detail">30 minutes before the meetup starts</div>
    </div>

    <h2>Repeat</h2>
    <div class="chips">
      <span class="chip">Once</span>
      <span class="chip on">Weekly</span>
      <span class="chip">Biweekly</span>
      <span class="chip">Monthly</span>
    </div>
    <div class="days">
      <span class="day">S</span>
      <span class="day">M</span>
      <span class="day">T</span>
      <span class="day">W</span>
      <span class="day on">T</span>
      <span class="day">F</span>
      <span class="day">S</span>
    </div>

    <h2>Next three</h2>
    <div class="row">
      <span class="date">Thu, Jun 12</span>
      <span class="right"><span class="tag">Next</span><span class="time-val">7:30 PM</span></span>
    </div>
    <div class="row">
      <span class="date">Thu, Jun 19</span>
      <span class="right"><span class="time-val">7:30 PM</span></span>
    </div>
    <div class="row">
      <span class="date">Thu, Jun 26</span>
      <span class="right"><span class="time-val">7:30 PM</span></span>
    </div>

  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
      Feed
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.9-4.6 5.5-4.6S13.9 16 14.5 19"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M18 14.6c1.8.6 2.9 2.1 3.2 4.4"/></svg>
      Groups
    </div>
    <div class="tab on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.4 5.5 1.4 5.5H4.6S6 13 6 9z"/><path d="M10 18.5a2.2 2.2 0 0 0 4 0"/></svg>
      Reminders
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.8 20c.9-3.7 3.7-5.6 7.2-5.6s6.3 1.9 7.2 5.6"/></svg>
      You
    </div>
  </div>

</div>
</body>
</html>
