<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{
    background:#EDEFF1;
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 0;
    margin:0;
    color:#14181C;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:24px 0;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
  }
  .card{
    width:342px;
    background:#FFFFFF;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(20,24,28,0.08);
    padding:20px;
    box-sizing:border-box;
  }
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .eyebrow{font-size:12px;color:#6B7280;letter-spacing:.02em;}
  .big{font-size:28px;font-weight:600;line-height:1.15;margin-top:4px;}
  .sub{font-size:13px;color:#6B7280;margin-top:4px;}
  .sub b{color:#0284C7;font-weight:600;}
  .glyph{color:#0EA5E9;flex:none;margin-top:2px;}

  .chart{
    position:relative;
    height:120px;
    margin-top:22px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .goal{
    position:absolute;left:0;right:0;bottom:79px;
    border-top:1px dashed #9AA3AD;
  }
  .goal span{
    position:absolute;right:0;top:-16px;
    font-size:12px;color:#6B7280;background:#fff;padding-left:4px;
  }
  .bar{width:26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;}
  .seg-r{background:#BAE6FD;}
  .seg-l{background:#0EA5E9;}
  .days{display:flex;justify-content:space-between;margin-top:8px;}
  .days span{width:26px;text-align:center;font-size:12px;color:#6B7280;}
  .days span.on{color:#14181C;font-weight:600;}

  .legend{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:12px;color:#6B7280;}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;}
  .legend .dash{width:14px;height:0;border-top:1px dashed #9AA3AD;vertical-align:3px;}

  .rule{height:1px;background:#EAECEF;margin:18px 0 14px;}
  .sect{font-size:12px;color:#6B7280;margin-bottom:10px;}

  .row{display:flex;align-items:center;height:30px;}
  .row .name{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px;}
  .track{width:84px;height:6px;background:#EEF2F5;flex:none;}
  .fill{height:6px;background:#0EA5E9;}
  .val{width:56px;text-align:right;font-size:14px;color:#6B7280;}
  .val b{color:#14181C;font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <div>
          <div class="eyebrow">Practice time · Week of March 3</div>
          <div class="big">4 hr 44 min</div>
          <div class="sub"><b>79%</b> of your 6 hr weekly goal</div>
        </div>
        <svg class="glyph" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3.5 2"></path>
        </svg>
      </div>

      <div class="chart">
        <div class="goal"><span>40 min/day</span></div>
        <div class="bar"><div class="seg-r" style="height:24px"></div><div class="seg-l" style="height:59px"></div></div>
        <div class="bar"><div class="seg-r" style="height:16px"></div><div class="seg-l" style="height:39px"></div></div>
        <div class="bar"><div class="seg-r" style="height:33px"></div><div class="seg-l" style="height:75px"></div></div>
        <div class="bar"><div class="seg-r" style="height:16px"></div><div class="seg-l" style="height:51px"></div></div>
        <div class="bar"><div class="seg-r" style="height:33px"></div><div class="seg-l" style="height:87px"></div></div>
        <div class="bar"><div class="seg-r" style="height:11px"></div><div class="seg-l" style="height:24px"></div></div>
        <div class="bar"><div class="seg-r" style="height:31px"></div><div class="seg-l" style="height:59px"></div></div>
      </div>
      <div class="days">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span class="on">Fri</span><span>Sat</span><span>Sun</span>
      </div>

      <div class="legend">
        <span><i class="seg-l"></i>Lessons</span>
        <span><i class="seg-r"></i>Review</span>
        <span><i class="dash"></i>Daily goal</span>
      </div>

      <div class="rule"></div>

      <div class="sect">Minutes by skill</div>
      <div class="row">
        <div class="name">Speaking</div>
        <div class="track"><div class="fill" style="width:100%"></div></div>
        <div class="val"><b>74</b> min</div>
      </div>
      <div class="row">
        <div class="name">Listening</div>
        <div class="track"><div class="fill" style="width:89%"></div></div>
        <div class="val"><b>66</b> min</div>
      </div>
      <div class="row">
        <div class="name">Vocabulary</div>
        <div class="track"><div class="fill" style="width:78%"></div></div>
        <div class="val"><b>58</b> min</div>
      </div>
      <div class="row">
        <div class="name">Grammar</div>
        <div class="track"><div class="fill" style="width:65%"></div></div>
        <div class="val"><b>48</b> min</div>
      </div>
      <div class="row">
        <div class="name">Reading</div>
        <div class="track"><div class="fill" style="width:51%"></div></div>
        <div class="val"><b>38</b> min</div>
      </div>
    </div>
  </div>
</body>
</html>
