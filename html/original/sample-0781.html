<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ececf0;
      color: #24222a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 20px;
      background: #f7f7f9;
    }

    .report-card {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #dedce4;
      border-radius: 14px;
    }

    .flag-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      padding: 9px;
      margin-bottom: 14px;
      color: #7352c7;
      background: #f2eefc;
      border: 1px solid #ded3f5;
      border-radius: 14px;
    }

    .flag-icon svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 7px 0 18px;
      color: #66616d;
      font-size: 14px;
      line-height: 1.55;
    }

    fieldset {
      padding: 0;
      margin: 0;
      border: 0;
    }

    legend {
      margin-bottom: 9px;
      color: #4d4854;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .reason-list {
      border: 1px solid #dedce4;
      border-radius: 14px;
    }

    .reason {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      color: #312e36;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      cursor: default;
    }

    .reason + .reason {
      border-top: 1px solid #e6e4e9;
    }

    .reason input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      position: relative;
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border: 1.5px solid #a7a2ad;
      border-radius: 50%;
    }

    .reason input:checked + .radio {
      border-color: #7352c7;
    }

    .reason input:checked + .radio::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #7352c7;
      border-radius: 50%;
    }

    .submit-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      border: 1px solid #6847bb;
      border-radius: 14px;
      background: #7352c7;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: default;
    }

    .privacy-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 13px 1px 0;
      color: #706b76;
      font-size: 12px;
      line-height: 1.5;
    }

    .privacy-note svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      color: #7352c7;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="report-card" aria-labelledby="report-title">
      <div class="flag-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6 21V4.5M6 5.5C9.1 2.7 12.1 7.3 17.8 4.4V13.2C12.2 16.1 9.1 11.5 6 14.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="report-title">Why are you reporting this post?</h1>
      <p class="intro">Choose the reason that best describes the problem. Mingleaf will review your report.</p>

      <form>
        <fieldset>
          <legend>Select one reason</legend>
          <div class="reason-list">
            <label class="reason">
              <input type="radio" name="reason" checked>
              <span class="radio" aria-hidden="true"></span>
              <span>Harassment or bullying</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span class="radio" aria-hidden="true"></span>
              <span>Hate speech or harmful content</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span class="radio" aria-hidden="true"></span>
              <span>Spam or misleading information</span>
            </label>
          </div>
        </fieldset>

        <button class="submit-button" type="button">Continue</button>
      </form>

      <p class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 10.5V16M12 7.7V7.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <span>Your report is private. Reporting does not block Rowan Vale.</span>
      </p>
    </main>
  </div>
</body>
</html>
