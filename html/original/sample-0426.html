<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Photo — Roamstead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8dde3;
      color: #172033;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #ffffff;
      border: 1px solid #cbd2da;
    }

    .topbar {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
      padding: 16px 16px 15px;
      border-bottom: 1px solid #e3e7eb;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
      color: #172033;
    }

    .text-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #536174;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      cursor: default;
    }

    .text-button:first-child {
      text-align: left;
    }

    .text-button.save {
      text-align: right;
      color: #334155;
      font-weight: 700;
    }

    .asset-context {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 9px;
      border-bottom: 1px solid #e3e7eb;
      color: #526071;
      font-size: 12px;
      line-height: 18px;
    }

    .asset-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 500;
      color: #344154;
    }

    .asset-count {
      margin-left: 16px;
      flex: 0 0 auto;
      color: #788493;
    }

    .photo-stage {
      padding: 12px 24px;
      background: #202a38;
    }

    .photo-wrap {
      position: relative;
      width: 342px;
      height: 320px;
      background: #6b7280;
    }

    .photo-wrap img {
      width: 342px;
      height: 320px;
      display: block;
      object-fit: cover;
      background: #7a8490;
    }

    .shade {
      position: absolute;
      background: rgba(15, 23, 42, 0.56);
      pointer-events: none;
    }

    .shade-top {
      top: 0;
      left: 0;
      width: 342px;
      height: 24px;
    }

    .shade-bottom {
      top: 292px;
      left: 0;
      width: 342px;
      height: 28px;
    }

    .shade-left {
      top: 24px;
      left: 0;
      width: 37px;
      height: 268px;
    }

    .shade-right {
      top: 24px;
      left: 305px;
      width: 37px;
      height: 268px;
    }

    .crop-frame {
      position: absolute;
      top: 24px;
      left: 37px;
      width: 268px;
      height: 268px;
      border: 1px solid rgba(255, 255, 255, 0.92);
    }

    .grid-v,
    .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.46);
    }

    .grid-v {
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .grid-v.one {
      left: 33.333%;
    }

    .grid-v.two {
      left: 66.666%;
    }

    .grid-h {
      left: 0;
      right: 0;
      height: 1px;
    }

    .grid-h.one {
      top: 33.333%;
    }

    .grid-h.two {
      top: 66.666%;
    }

    .handle {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #ffffff;
      border-style: solid;
    }

    .handle.tl {
      top: -2px;
      left: -2px;
      border-width: 3px 0 0 3px;
    }

    .handle.tr {
      top: -2px;
      right: -2px;
      border-width: 3px 3px 0 0;
    }

    .handle.bl {
      bottom: -2px;
      left: -2px;
      border-width: 0 0 3px 3px;
    }

    .handle.br {
      right: -2px;
      bottom: -2px;
      border-width: 0 3px 3px 0;
    }

    .aspect-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid #e3e7eb;
    }

    .aspect-label {
      width: 50px;
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: #344154;
    }

    .aspect-options {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ratio {
      border: 1px solid #d8dee5;
      border-radius: 10px;
      padding: 7px 10px;
      background: #ffffff;
      color: #647184;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .ratio.active {
      border-color: #475569;
      background: #475569;
      color: #ffffff;
    }

    .control-list {
      border-bottom: 1px solid #e3e7eb;
    }

    .control-row {
      display: grid;
      grid-template-columns: 84px 1fr 49px;
      align-items: center;
      gap: 10px;
      min-height: 53px;
      padding: 12px 16px;
      border-bottom: 1px solid #edf0f3;
    }

    .control-row:last-child {
      border-bottom: 0;
    }

    .control-name {
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: #344154;
    }

    .control-value {
      text-align: right;
      color: #697587;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .slider {
      position: relative;
      height: 18px;
    }

    .slider-track {
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 2px;
      background: #d7dde4;
    }

    .slider-fill {
      position: absolute;
      top: 8px;
      left: 0;
      height: 2px;
      background: #475569;
    }

    .slider-center {
      position: absolute;
      top: 5px;
      left: 50%;
      width: 1px;
      height: 8px;
      background: #9da7b4;
    }

    .slider-knob {
      position: absolute;
      top: 2px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border: 2px solid #475569;
      border-radius: 50%;
      background: #ffffff;
    }

    .utility-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
    }

    .icon-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #d8dee5;
      border-radius: 10px;
      padding: 0;
      background: #ffffff;
      color: #536174;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reset-button {
      border: 0;
      padding: 8px 0;
      background: transparent;
      color: #475569;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .editor-tabs {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #ffffff;
      border-top: 1px solid #dfe4e9;
    }

    .editor-tab {
      position: relative;
      border: 0;
      padding: 18px 8px 17px;
      background: transparent;
      color: #7a8594;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .editor-tab.active {
      color: #334155;
      font-weight: 700;
    }

    .editor-tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      width: 42px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      transform: translateX(-50%);
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="text-button" type="button">Cancel</button>
      <h1 class="topbar-title">Crop Photo</h1>
      <button class="text-button save" type="button">Save</button>
    </header>

    <div class="asset-context">
      <span class="asset-name">Harborview Stay · Gallery photo</span>
      <span class="asset-count">2 of 6</span>
    </div>

    <main>
      <div class="photo-stage">
        <div class="photo-wrap">
          <img src="https://loremflickr.com/342/320/cityscape?lock=5930" width="342" height="320" alt="Waterfront city view selected for the Harborview Stay gallery">
          <div class="shade shade-top"></div>
          <div class="shade shade-bottom"></div>
          <div class="shade shade-left"></div>
          <div class="shade shade-right"></div>
          <div class="crop-frame" aria-hidden="true">
            <span class="grid-v one"></span>
            <span class="grid-v two"></span>
            <span class="grid-h one"></span>
            <span class="grid-h two"></span>
            <span class="handle tl"></span>
            <span class="handle tr"></span>
            <span class="handle bl"></span>
            <span class="handle br"></span>
          </div>
        </div>
      </div>

      <div class="aspect-row">
        <span class="aspect-label">Aspect</span>
        <div class="aspect-options">
          <button class="ratio" type="button">Free</button>
          <button class="ratio active" type="button">1:1</button>
          <button class="ratio" type="button">4:3</button>
          <button class="ratio" type="button">16:9</button>
        </div>
      </div>

      <div class="control-list">
        <div class="control-row">
          <span class="control-name">Straighten</span>
          <div class="slider" aria-label="Straighten set to negative 1.5 degrees">
            <span class="slider-track"></span>
            <span class="slider-fill" style="width:46%;"></span>
            <span class="slider-center"></span>
            <span class="slider-knob" style="left:46%;"></span>
          </div>
          <span class="control-value">−1.5°</span>
        </div>

        <div class="control-row">
          <span class="control-name">Zoom</span>
          <div class="slider" aria-label="Zoom set to 112 percent">
            <span class="slider-track"></span>
            <span class="slider-fill" style="width:38%;"></span>
            <span class="slider-knob" style="left:38%;"></span>
          </div>
          <span class="control-value">112%</span>
        </div>

        <div class="control-row">
          <span class="control-name">Vertical</span>
          <div class="slider" aria-label="Vertical perspective set to zero">
            <span class="slider-track"></span>
            <span class="slider-fill" style="width:50%;"></span>
            <span class="slider-center"></span>
            <span class="slider-knob" style="left:50%;"></span>
          </div>
          <span class="control-value">0</span>
        </div>

        <div class="control-row">
          <span class="control-name">Horizontal</span>
          <div class="slider" aria-label="Horizontal perspective set to positive 2">
            <span class="slider-track"></span>
            <span class="slider-fill" style="width:54%;"></span>
            <span class="slider-center"></span>
            <span class="slider-knob" style="left:54%;"></span>
          </div>
          <span class="control-value">+2</span>
        </div>
      </div>

      <div class="utility-row">
        <div class="icon-tools">
          <button class="icon-button" type="button" aria-label="Rotate left">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8V3m0 0h5M4 3l4 4"></path>
              <path d="M5.5 15.5a8 8 0 1 0 1.1-9.8"></path>
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="Rotate right">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 8V3m0 0h-5m5 0-4 4"></path>
              <path d="M18.5 15.5a8 8 0 1 1-1.1-9.8"></path>
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="Flip horizontally">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v18"></path>
              <path d="M9 6 3 12l6 6V6Z"></path>
              <path d="m15 6 6 6-6 6V6Z"></path>
            </svg>
          </button>
        </div>
        <button class="reset-button" type="button">Reset crop</button>
      </div>
    </main>

    <nav class="editor-tabs" aria-label="Photo editing tools">
      <button class="editor-tab active" type="button">Crop</button>
      <button class="editor-tab" type="button">Adjust</button>
      <button class="editor-tab" type="button">Perspective</button>
    </nav>
  </div>
</body>
</html>
