<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Sumleaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eef0;
      color: #172126;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 15px 16px 13px;
    }

    .back-button {
      width: 44px;
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: #172126;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
    }

    .back-button svg {
      width: 24px;
      height: 24px;
    }

    .top-bar h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
    }

    main {
      flex: 1;
      padding: 10px 20px 0;
    }

    .about-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .version-card {
      padding: 28px 24px 26px;
      border-radius: 14px;
      background: #e4f9fc;
    }

    .app-mark {
      width: 62px;
      height: 62px;
      margin-bottom: 22px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08b9d1;
      color: #ffffff;
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
    }

    .version-card h2 {
      margin: 0 0 5px;
      font-size: 28px;
      line-height: 36px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .version-number {
      margin: 0 0 16px;
      color: #3c5a62;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .version-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: #087d8d;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .version-status svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .description {
      margin: 0;
      color: #52636a;
      font-size: 15px;
      line-height: 23px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-row {
      min-width: 0;
      padding: 15px 16px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 20px;
      align-items: center;
      gap: 10px;
      color: #172126;
      background: #effbfd;
      text-decoration: none;
    }

    .row-label {
      min-width: 0;
      overflow: hidden;
      color: #223137;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-value {
      color: #68787e;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      white-space: nowrap;
    }

    .info-row svg {
      width: 20px;
      height: 20px;
      color: #5b737a;
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 10px 12px;
      background: #fbfcfc;
    }

    .nav-item {
      padding: 5px 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #718086;
      font-size: 12px;
      line-height: 17px;
      font-weight: 600;
      text-decoration: none;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
    }

    .nav-item.active {
      color: #069bb0;
      font-weight: 700;
    }

    button,
    a {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>About</h1>
      <span aria-hidden="true"></span>
    </header>

    <main>
      <section class="about-section" aria-labelledby="app-name">
        <div class="version-card">
          <div class="app-mark" aria-hidden="true">S</div>
          <h2 id="app-name">Sumleaf</h2>
          <p class="version-number">Version 4.8.2 · Build 4821</p>
          <p class="version-status">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="9" fill="currentColor"/>
              <path d="M6 10.2L8.7 13L14.2 7.4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            You have the latest version
          </p>
        </div>

        <p class="description">
          Sumleaf is built by an independent team creating tools for budgeting, saving, and long-term planning.
        </p>

        <div class="info-list">
          <a class="info-row" href="#" aria-label="Meet the team, 18 people">
            <span class="row-label">Meet the team</span>
            <span class="row-value">18 people</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>

          <a class="info-row" href="#" aria-label="Open-source licenses, 42 packages">
            <span class="row-label">Open-source licenses</span>
            <span class="row-value">42 packages</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>

          <a class="info-row" href="#" aria-label="Legal documents, updated January 8, 2025">
            <span class="row-label">Legal documents</span>
            <span class="row-value">Jan 8, 2025</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 5L12.5 10L7.5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.8V14.3H9.2V20H4V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </a>

      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 7H19M5 12H16M5 17H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Activity</span>
      </a>

      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V13M12 19V5M19 19V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Plan</span>
      </a>

      <a class="nav-item active" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5.5 20C5.9 16.7 8.3 14.7 12 14.7C15.7 14.7 18.1 16.7 18.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
