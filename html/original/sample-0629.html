<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip today's session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#D97706;
    --ink:#1B1917;
    --muted:#6E6862;
    --line:#E2DED8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#EFEDE9;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:24px 0;
    background:#EFEDE9;
    display:flex;
    justify-content:center;
  }
  .dialog{
    width:342px;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
  }
  .dialog img{
    width:100%;
    height:150px;
    display:block;
    object-fit:cover;
    background:#D8D3CC;
    border-radius:6px 6px 0 0;
  }
  .body{padding:20px;}
  .kicker{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber);
    margin:0 0 10px;
  }
  .kicker svg{display:block;}
  h1{
    margin:0 0 10px;
    font-size:21px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  p{
    margin:0;
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
  }
  .facts{
    margin:16px 0 0;
    border-top:1px solid var(--line);
  }
  .fact{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .fact dt{color:var(--muted);}
  .fact dd{margin:0;font-weight:600;}
  .actions{
    padding:16px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn{
    display:block;
    width:100%;
    padding:13px 16px;
    border-radius:6px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--amber);
    border:1px solid var(--amber);
    color:#FFFFFF;
  }
  .btn-secondary{
    background:#FFFFFF;
    border:1px solid var(--line);
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dialog">
      <img src="https://loremflickr.com/342/150/gym?lock=8381" width="342" height="150" alt="Barbell and weight rack in the gym where today's lower body session is scheduled">
      <div class="body">
        <p class="kicker">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="6" stroke="#D97706" stroke-width="1.4"/>
            <path d="M7 4v3.4l2.1 1.3" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Trailmark Coach
        </p>
        <h1>Skip today's lower body session?</h1>
        <p>Skipping ends your 12-day streak and this session won't be rescheduled this week.</p>
        <dl class="facts">
          <div class="fact"><dt>Scheduled</dt><dd>Tue, March 4 · 6:30 PM</dd></div>
          <div class="fact"><dt>Weekly goal</dt><dd>2 of 4 done</dd></div>
        </dl>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary">Yes, skip today</button>
        <button type="button" class="btn btn-secondary">No, keep it scheduled</button>
      </div>
    </div>
  </div>
</body>
</html>
