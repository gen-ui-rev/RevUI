<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Transfer — Luma Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d9de;
      color: #1d1c23;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f2f2f5;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 12px 14px;
      background: #ffffff;
      border-bottom: 1px solid #dedee5;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #313039;
    }

    .top-title {
      text-align: center;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
    }

    .top-action {
      color: #6d36c8;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 13px 14px 12px;
    }

    .intro {
      margin-bottom: 10px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #6d36c8;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #25232b;
      font-size: 23px;
      line-height: 29px;
      font-weight: 700;
    }

    .intro p {
      margin: 3px 0 0;
      color: #686671;
      font-size: 14px;
      line-height: 20px;
    }

    .form-card {
      background: #ffffff;
      border: 1px solid #e4e3e9;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(35, 28, 48, 0.08);
    }

    .card-heading {
      padding: 10px 13px 9px;
      border-bottom: 1px solid #e8e7ec;
    }

    .card-heading h2 {
      margin: 0;
      font-size: 15px;
      line-height: 21px;
      font-weight: 700;
    }

    .card-heading p {
      margin: 1px 0 0;
      color: #77747e;
      font-size: 12px;
      line-height: 17px;
    }

    .field-row {
      width: 100%;
      margin: 0;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #ecebf0;
    }

    .field-row:last-child {
      border-bottom: 0;
    }

    .field-content {
      min-width: 0;
      flex: 1;
    }

    .field-label {
      display: block;
      margin-bottom: 2px;
      color: #74717b;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .field-value {
      display: block;
      color: #25232b;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .field-detail {
      display: block;
      color: #74717b;
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
    }

    .monogram {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #eee6fa;
      color: #6430b9;
      font-size: 13px;
      font-weight: 700;
    }

    .chevron {
      flex: 0 0 auto;
      color: #8a8790;
    }

    .amount-row {
      padding-top: 8px;
      padding-bottom: 8px;
      align-items: flex-end;
    }

    .amount-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .currency {
      color: #5b5862;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
    }

    .amount-input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #6d36c8;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
    }

    .summary-card {
      margin-top: 10px;
      padding: 8px 13px;
      background: #ffffff;
      border: 1px solid #e2e1e7;
      border-radius: 4px;
    }

    .summary-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 3px 0;
      font-size: 13px;
      line-height: 19px;
    }

    .summary-line span {
      color: #6c6973;
    }

    .summary-line strong {
      color: #292730;
      font-size: 13px;
      font-weight: 600;
      text-align: right;
    }

    .primary-button {
      width: 100%;
      margin-top: 11px;
      padding: 13px 16px;
      border: 0;
      border-radius: 4px;
      background: #6d36c8;
      color: #ffffff;
      font-size: 15px;
      line-height: 21px;
      font-weight: 700;
    }

    .confirmation-note {
      margin: 6px 0 0;
      color: #74717b;
      font-size: 12px;
      line-height: 17px;
      text-align: center;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 6px 9px;
      background: #ffffff;
      border-top: 1px solid #dcdbe2;
    }

    .tab {
      position: relative;
      padding: 2px 1px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #77747d;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab svg {
      width: 21px;
      height: 21px;
    }

    .tab.active {
      color: #6d36c8;
      font-weight: 700;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      width: 30px;
      height: 3px;
      margin-left: -15px;
      background: #6d36c8;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="top-title">New transfer</div>
      <button class="icon-button top-action" type="button" aria-label="Get transfer help">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9.9 9.2C10.1 7.9 11 7.2 12.3 7.2C13.8 7.2 14.7 8.1 14.7 9.4C14.7 10.4 14.2 11 13.2 11.7C12.3 12.3 12 12.9 12 13.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="intro" aria-labelledby="transfer-title">
        <p class="eyebrow">Create payment</p>
        <h1 id="transfer-title">Send money</h1>
        <p>Set the recipient, amount, and delivery date.</p>
      </section>

      <form aria-label="New transfer form">
        <section class="form-card" aria-labelledby="details-heading">
          <div class="card-heading">
            <h2 id="details-heading">Transfer details</h2>
            <p>Review each field before continuing.</p>
          </div>

          <button class="field-row" type="button" aria-label="Recipient, Morgan Hale">
            <span class="monogram" aria-hidden="true">MH</span>
            <span class="field-content">
              <span class="field-label">Recipient</span>
              <span class="field-value">Morgan Hale</span>
              <span class="field-detail">Cedar Ledger Bank • 4418</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="field-row" type="button" aria-label="From Everyday checking ending in 2874">
            <span class="field-content">
              <span class="field-label">From account</span>
              <span class="field-value">Everyday checking • 2874</span>
              <span class="field-detail">$4,825.62 available</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <label class="field-row amount-row">
            <span class="field-content">
              <span class="field-label">Amount</span>
              <span class="amount-wrap">
                <span class="currency">$</span>
                <input class="amount-input" type="text" value="1,250.00" aria-label="Transfer amount">
              </span>
              <span class="field-detail">$3,575.62 remaining after transfer</span>
            </span>
          </label>

          <button class="field-row" type="button" aria-label="Send on June 18, 2026">
            <span class="field-content">
              <span class="field-label">Send on</span>
              <span class="field-value">June 18, 2026</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="field-row" type="button" aria-label="Frequency, one time">
            <span class="field-content">
              <span class="field-label">Frequency</span>
              <span class="field-value">One time</span>
            </span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <label class="field-row">
            <span class="field-content">
              <span class="field-label">Memo</span>
              <span class="field-value">June rent share</span>
              <span class="field-detail">15 of 60 characters</span>
            </span>
          </label>
        </section>

        <section class="summary-card" aria-label="Transfer estimate">
          <div class="summary-line">
            <span>Estimated delivery</span>
            <strong>June 19, 2026</strong>
          </div>
          <div class="summary-line">
            <span>Transfer fee</span>
            <strong>$0.00</strong>
          </div>
        </section>

        <button class="primary-button" type="submit">Continue to review</button>
        <p class="confirmation-note">Money will not be sent until you confirm.</p>
      </form>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.8V14.5H9.2V20H4V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 7H18M6 12H18M6 17H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="4" cy="7" r="1" fill="currentColor"/>
          <circle cx="4" cy="12" r="1" fill="currentColor"/>
          <circle cx="4" cy="17" r="1" fill="currentColor"/>
        </svg>
        <span>Activity</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 7H19M19 7L16 4M19 7L16 10M17 17H5M5 17L8 14M5 17L8 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Move money</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V13M10 19V9M15 19V5M20 19V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Plan</span>
      </button>
    </nav>
  </div>
</body>
</html>
