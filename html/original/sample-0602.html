<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e5;
      color: #24272b;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 20px;
      background: #eef0f2;
    }

    .delete-card {
      width: 100%;
      padding: 28px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(31, 35, 39, 0.1);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border-radius: 4px;
      background: #fff1e8;
      color: #c55212;
    }

    .icon-box svg {
      width: 24px;
      height: 24px;
    }

    h1 {
      margin: 0 0 10px;
      color: #1f2226;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
    }

    .description {
      margin: 0;
      color: #555b62;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.65;
    }

    .warning {
      margin: 18px 0 24px;
      padding-left: 12px;
      border-left: 3px solid #c55212;
      color: #35393e;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }

    .delete-button {
      border: 1px solid #b8480d;
      background: #c55212;
      color: #ffffff;
    }

    .cancel-button {
      border: 1px solid #d5d8dc;
      background: #ffffff;
      color: #35393e;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="delete-card" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-description delete-warning">
      <div class="icon-box" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4.5 7H19.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 3.75H15L16 7H8L9 3.75Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M6.75 7L7.45 19.25C7.5 20.1 8.2 20.75 9.05 20.75H14.95C15.8 20.75 16.5 20.1 16.55 19.25L17.25 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M10 10.5V17.25M14 10.5V17.25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="delete-title">Delete this project?</h1>
      <p class="description" id="delete-description">
        “Launch schedule” and its 8 tasks will be permanently deleted for everyone on the team.
      </p>

      <p class="warning" id="delete-warning">
        This does not move the project to Trash or Archive. Its content cannot be restored.
      </p>

      <div class="actions">
        <button class="delete-button" type="button">Delete project</button>
        <button class="cancel-button" type="button">Cancel</button>
      </div>
    </section>
  </div>
</body>
</html>
