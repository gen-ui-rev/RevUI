<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Removed items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16180F;
    --muted:#6E7166;
    --line:#E2E3DD;
    --lime:#C9F02B;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#EFEFEB;
    font-family:'Poppins', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:28px;
    background:#EFEFEB;
  }
  .card{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
  }
  .head{
    padding:18px 16px 16px;
    border-bottom:1px solid var(--line);
  }
  .head h1{
    margin:0;
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .head p{
    margin:6px 0 0;
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
  }
  .list{
    padding:0 16px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .thumb{
    width:48px;
    height:48px;
    border-radius:6px;
    flex:none;
    border:1px solid var(--line);
  }
  .t1{background:#DCE3D2;}
  .t2{background:#D6DCE4;}
  .t3{background:#E4DAD2;}
  .info{
    flex:1;
    min-width:0;
  }
  .name{
    font-size:14px;
    font-weight:500;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    margin-top:3px;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .expiring{
    margin-top:5px;
    display:inline-block;
    font-size:11.5px;
    font-weight:500;
    color:#8A5A12;
    background:#F7EEDC;
    border-radius:6px;
    padding:2px 7px;
  }
  .restore{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    height:30px;
    padding:0 12px;
    border:1px solid #B7DD1F;
    border-radius:6px;
    background:var(--lime);
    color:#1B2010;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
  }
  .restore svg{display:block;}
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    border-top:1px solid var(--line);
  }
  .count{
    font-size:12px;
    color:var(--muted);
  }
  .empty{
    font-family:inherit;
    font-size:12.5px;
    font-weight:500;
    color:#8C3A32;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 12px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Removed items</h1>
        <p>Restoring puts an item back in your saved list. Items left here are cleared 30 days after removal.</p>
      </div>

      <div class="list">
        <div class="row">
          <div class="thumb t1"></div>
          <div class="info">
            <div class="name">Ceramic Pour-Over Set</div>
            <div class="meta">$42.00 · Removed Mar 4</div>
          </div>
          <button class="restore" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1B2010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            Restore
          </button>
        </div>

        <div class="row">
          <div class="thumb t2"></div>
          <div class="info">
            <div class="name">Linen Duvet Cover, Fog</div>
            <div class="meta">$128.00 · Removed Mar 2</div>
          </div>
          <button class="restore" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1B2010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            Restore
          </button>
        </div>

        <div class="row">
          <div class="thumb t3"></div>
          <div class="info">
            <div class="name">Trail Runner GTX, Size 10</div>
            <div class="meta">$95.00 · Removed Feb 12</div>
            <span class="expiring">2 days left</span>
          </div>
          <button class="restore" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1B2010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            Restore
          </button>
        </div>
      </div>

      <div class="foot">
        <span class="count">3 items held</span>
        <button class="empty" type="button">Delete all permanently</button>
      </div>
    </div>
  </div>
</body>
</html>
