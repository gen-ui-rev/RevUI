<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddd9;
      color: #242220;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 48px 20px;
      background: #f4f3f0;
    }

    .live-activity {
      width: 100%;
      padding: 20px;
      background: #fbfaf8;
      border: 1px solid #c9c6c0;
      border-radius: 6px;
    }

    .activity-header,
    .activity-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .service-name {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
    }

    .live-label {
      margin: 0;
      color: #b3261e;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      margin-top: 24px;
    }

    .status-label {
      margin: 0 0 2px;
      color: #6b6761;
      font-size: 14px;
      line-height: 1.4;
    }

    .arrival-time {
      margin: 0;
      color: #b3261e;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-detail {
      margin: 10px 0 0;
      color: #45413d;
      font-size: 15px;
      line-height: 1.45;
    }

    .progress {
      width: 100%;
      height: 6px;
      margin-top: 20px;
      background: #dedbd5;
      border-radius: 6px;
    }

    .progress-value {
      width: 68%;
      height: 6px;
      background: #b3261e;
      border-radius: 6px;
    }

    .activity-footer {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #dedbd5;
      color: #6b6761;
      font-size: 13px;
      line-height: 1.35;
    }

    .activity-footer p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="live-activity" aria-label="Live order delivery status">
      <header class="activity-header">
        <p class="service-name">Mercantile Lane</p>
        <p class="live-label">Live</p>
      </header>

      <div class="status">
        <p class="status-label">Arriving in</p>
        <h1 class="arrival-time">12–18 min</h1>
        <p class="status-detail">Your courier has picked up the order and is heading to 84 Oak Street.</p>
      </div>

      <div class="progress" role="progressbar" aria-label="Delivery progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="progress-value"></div>
      </div>

      <footer class="activity-footer">
        <p>Order #ML-1842 · 3 items</p>
        <p>Updated 2:14 PM</p>
      </footer>
    </section>
  </div>
</body>
</html>
