<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Room Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d6cf;
      color: #f5f1e5;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 52px 24px;
      background: #eeece5;
    }

    .activity {
      width: 100%;
      padding: 16px;
      background: #24231f;
      border-radius: 0;
    }

    .activity-main {
      padding: 20px;
      background: rgba(237, 190, 28, 0.16);
      border-radius: 0;
    }

    .live-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: #f0c431;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      background: #f0c431;
      border-radius: 0;
    }

    h1 {
      margin: 0;
      color: #fffaf0;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.14;
      letter-spacing: -0.02em;
    }

    .speaker {
      margin: 14px 0 0;
      color: #f5f0e3;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.4;
    }

    .room-meta {
      margin: 6px 0 0;
      color: #c8c3b6;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }

    .activity-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 16px;
    }

    .service-meta {
      min-width: 0;
    }

    .service-name,
    .update-time {
      margin: 0;
      line-height: 1.35;
    }

    .service-name {
      color: #f1ede2;
      font-size: 15px;
      font-weight: 600;
    }

    .update-time {
      margin-top: 2px;
      color: #aaa69b;
      font-size: 12px;
      font-weight: 400;
    }

    .open-button {
      flex: 0 0 auto;
      margin: 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 0;
      background: #edbe1c;
      color: #24200f;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-labelledby="activity-title">
      <div class="activity-main">
        <p class="live-label"><span class="live-dot" aria-hidden="true"></span>Live room</p>
        <h1 id="activity-title">Neighborhood check-in</h1>
        <p class="speaker">Mara Ellison is speaking</p>
        <p class="room-meta">12 listening · Started at 8:42 PM</p>
      </div>
      <div class="activity-footer">
        <div class="service-meta">
          <p class="service-name">Commonroom</p>
          <p class="update-time">Updated now</p>
        </div>
        <button class="open-button" type="button">Open room</button>
      </div>
    </section>
  </div>
</body>
</html>
