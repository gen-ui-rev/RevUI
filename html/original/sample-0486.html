<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commonleaf — Sharing Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9ddde;
      color: #263238;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f2f4f4;
    }

    .top-bar {
      min-height: 68px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #e2e6e6;
    }

    .back-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #526166;
    }

    .brand {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .top-spacer {
      width: 40px;
    }

    main {
      flex: 1;
      padding: 56px 24px 24px;
    }

    .loading-card {
      width: 342px;
      padding: 16px 16px 24px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(49, 64, 68, 0.09);
      text-align: center;
    }

    .post-photo {
      width: 310px;
      height: 174px;
      display: block;
      object-fit: cover;
      background: #d6dfe1;
      border-radius: 6px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      display: block;
      margin: 28px auto 18px;
    }

    .loading-card h1 {
      margin: 0;
      color: #273438;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: -0.25px;
    }

    .loading-card p {
      max-width: 270px;
      margin: 9px auto 0;
      color: #68777b;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 400;
    }

    .loading-note {
      display: block;
      margin-top: 18px;
      color: #839095;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 500;
    }

    .tab-bar {
      min-height: 76px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: stretch;
      background: #ffffff;
      border-top: 1px solid #e1e5e5;
    }

    .tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7d898d;
      font-size: 13px;
      line-height: 1;
      font-weight: 500;
      text-decoration: none;
    }

    .tab.active {
      color: #587178;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 35px;
      right: 35px;
      height: 3px;
      background: #b7cdd2;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M13.75 4.5L7.25 11L13.75 17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="brand">Commonleaf</p>
      <span class="top-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <section class="loading-card" aria-labelledby="loading-title" aria-live="polite">
        <img
          class="post-photo"
          src="https://loremflickr.com/310/174/friends?lock=6630"
          width="310"
          height="174"
          alt="Friends talking together at an outdoor table"
        >

        <svg class="spinner" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="#E3EAEB" stroke-width="4"/>
          <path d="M24 6A18 18 0 0 1 41.12 18.44" stroke="#9FBEC5" stroke-width="4" stroke-linecap="round"/>
          <path d="M41.12 29.56A18 18 0 0 1 30.89 40.63" stroke="#B7CDD2" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <h1 id="loading-title">Sharing your post</h1>
        <p>We are preparing the photo and publishing it to your community.</p>
        <span class="loading-note">Keep Commonleaf open for a moment</span>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <a class="tab active" href="#" aria-current="page">Feed</a>
      <a class="tab" href="#">Messages</a>
      <a class="tab" href="#">Profile</a>
    </nav>
  </div>
</body>
</html>
