<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamstead Voice Call</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe4e1;
      color: #16221d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #ffffff;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #ffffff;
    }

    .top-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      line-height: 24px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 0;
      background: #f0f4f2;
      color: #24322c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button svg,
    .control svg,
    .end-call svg,
    .tab-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      padding: 6px 20px 92px;
    }

    .call-hero {
      padding: 24px;
      background: #e4f3ec;
      text-align: center;
    }

    .monogram {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #087a55;
      color: #ffffff;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .call-hero h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 30px;
    }

    .role {
      margin: 4px 0 0;
      color: #53655d;
      font-size: 14px;
      line-height: 20px;
    }

    .duration {
      margin: 14px 0 0;
      color: #086b4b;
      font-size: 18px;
      font-weight: 600;
      line-height: 24px;
      font-variant-numeric: tabular-nums;
    }

    .connection {
      margin: 14px auto 0;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(8, 122, 85, 0.1);
      color: #075f44;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #087a55;
    }

    .trip-card {
      margin-top: 16px;
      padding: 16px;
      background: #f0f7f4;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #64746d;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .trip-card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 22px;
    }

    .trip-meta {
      margin: 4px 0 0;
      color: #53635c;
      font-size: 14px;
      line-height: 20px;
    }

    .controls-section {
      margin-top: 20px;
    }

    .controls-section h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 22px;
    }

    .controls-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .control {
      padding: 14px 8px 12px;
      border: 0;
      border-radius: 0;
      background: #f1f4f2;
      color: #26362f;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
    }

    .control.active {
      background: #087a55;
      color: #ffffff;
    }

    .end-call {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 0;
      border-radius: 0;
      background: #1c2823;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
    }

    .call-note {
      margin: 10px 0 0;
      color: #6a7771;
      font-size: 12px;
      line-height: 17px;
      text-align: center;
    }

    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 72px;
      padding: 9px 12px 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #f5f7f6;
    }

    .tab-item {
      border: 0;
      border-radius: 0;
      padding: 3px 4px;
      background: transparent;
      color: #738079;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
    }

    .tab-item.active {
      color: #087a55;
      font-weight: 600;
      background: rgba(8, 122, 85, 0.08);
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" aria-label="Back to trip">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <div class="top-title">Voice call</div>
      <button class="icon-button" aria-label="More call options">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1"></circle>
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
        </svg>
      </button>
    </header>

    <main>
      <section class="call-hero" aria-labelledby="caller-name">
        <div class="monogram" aria-hidden="true">MV</div>
        <h1 id="caller-name">Mara Voss</h1>
        <p class="role">Host at Cedar Point Cabin</p>
        <p class="duration">08:42</p>
        <div class="connection">
          <span class="connection-dot" aria-hidden="true"></span>
          Connected · Clear audio
        </div>
      </section>

      <section class="trip-card" aria-labelledby="trip-title">
        <p class="eyebrow">Current reservation</p>
        <h2 id="trip-title">Cedar Point Cabin</h2>
        <p class="trip-meta">Aug 18–22 · Pinehaven, Oregon · Confirmation RS-4821</p>
      </section>

      <section class="controls-section" aria-labelledby="controls-title">
        <h2 id="controls-title">Call controls</h2>
        <div class="controls-grid">
          <button class="control active" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 5.2 2"></path>
              <path d="M15 9V6a3 3 0 0 0-4.7-2.5"></path>
              <path d="M5 10v1a7 7 0 0 0 11.4 5.4"></path>
              <path d="M19 10v1a7 7 0 0 1-.5 2.6"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
              <path d="M3 3l18 18"></path>
            </svg>
            Muted
          </button>

          <button class="control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
              <path d="M15 9a4 4 0 0 1 0 6"></path>
              <path d="M18 6a8 8 0 0 1 0 12"></path>
            </svg>
            Speaker
          </button>

          <button class="control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="7" cy="6" r="1"></circle>
              <circle cx="12" cy="6" r="1"></circle>
              <circle cx="17" cy="6" r="1"></circle>
              <circle cx="7" cy="11" r="1"></circle>
              <circle cx="12" cy="11" r="1"></circle>
              <circle cx="17" cy="11" r="1"></circle>
              <circle cx="7" cy="16" r="1"></circle>
              <circle cx="12" cy="16" r="1"></circle>
              <circle cx="17" cy="16" r="1"></circle>
            </svg>
            Keypad
          </button>

          <button class="control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="6" width="13" height="12"></rect>
              <path d="M16 10l5-3v10l-5-3"></path>
            </svg>
            Video
          </button>

          <button class="control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M3.5 19a5.5 5.5 0 0 1 11 0"></path>
              <path d="M18 8v6"></path>
              <path d="M15 11h6"></path>
            </svg>
            Add guest
          </button>

          <button class="control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16"></path>
              <path d="M7 10h10"></path>
              <path d="M9 14h6"></path>
              <path d="M11 18h2"></path>
            </svg>
            Audio
          </button>
        </div>
      </section>

      <button class="end-call">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.2 15.5c4.5-3.5 9.1-3.5 13.6 0"></path>
          <path d="M5.2 15.5l-1.7-2.4a2 2 0 0 1 .5-2.8l1.2-.8"></path>
          <path d="M18.8 15.5l1.7-2.4a2 2 0 0 0-.5-2.8l-1.2-.8"></path>
        </svg>
        End call
      </button>

      <p class="call-note">Call audio is not recorded by Roamstead.</p>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-4-4"></path>
        </svg>
        Explore
      </button>

      <button class="tab-item active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v16H5z"></path>
          <path d="M8 8h8"></path>
          <path d="M8 12h5"></path>
        </svg>
        Trips
      </button>

      <button class="tab-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v12H8l-4 3V5z"></path>
          <path d="M8 9h8"></path>
          <path d="M8 13h5"></path>
        </svg>
        Messages
      </button>

      <button class="tab-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3"></circle>
          <path d="M5 20a7 7 0 0 1 14 0"></path>
        </svg>
        Account
      </button>
    </nav>
  </div>
</body>
</html>
