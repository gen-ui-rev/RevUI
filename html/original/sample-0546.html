<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter and Sort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ecea;
      color: #17211d;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #dce3df;
    }

    .topbar {
      min-height: 64px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      border-bottom: 1px solid #e2e7e4;
      padding: 0 8px;
    }

    .icon-button,
    .reset-button {
      border: 0;
      background: transparent;
      color: #17211d;
      min-height: 44px;
      display: flex;
      align-items: center;
      cursor: default;
    }

    .icon-button {
      justify-content: center;
    }

    .reset-button {
      justify-content: center;
      color: #087a58;
      font-size: 14px;
      font-weight: 600;
      padding: 0;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
    }

    .content {
      flex: 1;
      min-height: 0;
      padding: 14px 20px 10px;
    }

    .intro {
      padding-bottom: 10px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #087a58;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .intro h1 {
      margin: 0;
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .match-count {
      margin: 4px 0 0;
      color: #69746f;
      font-size: 12px;
      line-height: 17px;
    }

    .filter-section {
      padding: 12px 0;
      border-top: 1px solid #e2e7e4;
    }

    .filter-section h2 {
      margin: 0;
      font-size: 14px;
      line-height: 19px;
      font-weight: 600;
    }

    .option-row {
      display: flex;
      gap: 7px;
      margin-top: 9px;
    }

    .choice {
      min-height: 38px;
      border: 1px solid #d6ded9;
      border-radius: 14px;
      background: #ffffff;
      color: #3f4a45;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      white-space: nowrap;
    }

    .choice.flexible {
      flex: 1;
      padding-left: 8px;
      padding-right: 8px;
    }

    .choice.selected {
      border-color: #087a58;
      background: #eaf6f1;
      color: #076b4e;
      font-weight: 600;
    }

    .price-fields {
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      gap: 8px;
      align-items: center;
      margin-top: 9px;
    }

    .price-box {
      min-height: 42px;
      display: flex;
      align-items: center;
      border: 1px solid #d6ded9;
      border-radius: 14px;
      padding: 0 12px;
      color: #17211d;
      font-size: 14px;
      line-height: 20px;
    }

    .price-box span {
      color: #79837e;
      margin-right: 3px;
    }

    .price-divider {
      text-align: center;
      color: #8a938f;
      font-size: 14px;
    }

    .price-range {
      margin: 8px 0 0;
      color: #69746f;
      font-size: 12px;
      line-height: 17px;
    }

    .toggle-row {
      margin-top: 9px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #d6ded9;
      border-radius: 14px;
      padding: 9px 12px;
    }

    .toggle-copy {
      min-width: 0;
    }

    .toggle-label {
      display: block;
      font-size: 14px;
      line-height: 19px;
      font-weight: 600;
    }

    .toggle-note {
      display: block;
      margin-top: 1px;
      color: #69746f;
      font-size: 12px;
      line-height: 16px;
    }

    .switch {
      width: 40px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-radius: 14px;
      background: #087a58;
      padding: 3px;
      margin-left: 12px;
    }

    .switch-knob {
      width: 18px;
      height: 18px;
      border-radius: 14px;
      background: #ffffff;
    }

    .apply-area {
      min-height: 78px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      border-top: 1px solid #e2e7e4;
      padding: 11px 20px 12px;
      background: #ffffff;
    }

    .apply-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid #087a58;
      border-radius: 14px;
      background: #087a58;
      color: #ffffff;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .tabbar {
      min-height: 68px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: stretch;
      border-top: 1px solid #e2e7e4;
      background: #ffffff;
    }

    .tab {
      border: 0;
      background: transparent;
      color: #737d78;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 0 6px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
    }

    .tab.active {
      color: #087a58;
      font-weight: 600;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="topbar-title">Filter &amp; sort</p>
      <button class="reset-button" type="button">Reset</button>
    </header>

    <main class="content">
      <section class="intro" aria-labelledby="screen-heading">
        <p class="eyebrow">Loomlane marketplace</p>
        <h1 id="screen-heading">Refine your results</h1>
        <p class="match-count">6 filters active · 246 matching items</p>
      </section>

      <section class="filter-section" aria-labelledby="sort-heading">
        <h2 id="sort-heading">Sort by</h2>
        <div class="option-row">
          <button class="choice flexible selected" type="button">Recommended</button>
          <button class="choice flexible" type="button">Newest</button>
          <button class="choice flexible" type="button">Price: low</button>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="price-heading">
        <h2 id="price-heading">Price range</h2>
        <div class="price-fields">
          <div class="price-box"><span>$</span>20</div>
          <div class="price-divider">to</div>
          <div class="price-box"><span>$</span>180</div>
        </div>
        <p class="price-range">Most items in this category are $35–$140</p>
      </section>

      <section class="filter-section" aria-labelledby="condition-heading">
        <h2 id="condition-heading">Condition</h2>
        <div class="option-row">
          <button class="choice flexible selected" type="button">New</button>
          <button class="choice flexible selected" type="button">Like new</button>
          <button class="choice flexible" type="button">Good</button>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="delivery-heading">
        <h2 id="delivery-heading">Delivery</h2>
        <div class="option-row">
          <button class="choice flexible selected" type="button">Free delivery</button>
          <button class="choice flexible" type="button">Pickup</button>
          <button class="choice flexible" type="button">2-day</button>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="rating-heading">
        <h2 id="rating-heading">Seller rating</h2>
        <div class="option-row">
          <button class="choice flexible selected" type="button">4+ stars</button>
          <button class="choice flexible" type="button">4.5+ stars</button>
          <button class="choice flexible" type="button">Any rating</button>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="availability-heading">
        <h2 id="availability-heading">Availability</h2>
        <div class="toggle-row">
          <div class="toggle-copy">
            <span class="toggle-label">In-stock items only</span>
            <span class="toggle-note">Hide preorders and reserved listings</span>
          </div>
          <div class="switch" aria-label="In-stock items only enabled">
            <span class="switch-knob"></span>
          </div>
        </div>
      </section>
    </main>

    <div class="apply-area">
      <button class="apply-button" type="button">Show 246 items</button>
    </div>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.5V14.5H9.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="tab active" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Browse</span>
      </button>
      <button class="tab" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20L4.8 12.8C2.7 10.7 2.7 7.3 4.8 5.2C6.9 3.1 10.3 3.1 12 5.4C13.7 3.1 17.1 3.1 19.2 5.2C21.3 7.3 21.3 10.7 19.2 12.8L12 20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Saved</span>
      </button>
      <button class="tab" type="button">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5H6L8.2 15H18.2L20 8H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9.5" cy="19" r="1.2" fill="currentColor"/>
          <circle cx="17" cy="19" r="1.2" fill="currentColor"/>
        </svg>
        <span>Cart</span>
      </button>
    </nav>
  </div>
</body>
</html>
