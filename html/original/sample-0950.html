<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Review Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ecef;
      color: #18303d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 20px 24px;
      background: #f5f7f8;
    }

    .booking {
      width: 100%;
      padding: 20px;
      background: #ffffff;
      border-radius: 4px;
    }

    .service-label {
      margin: 0;
      color: #0782b5;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      color: #152d39;
      font-size: 27px;
      font-weight: 600;
      line-height: 35px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 0;
      color: #62737c;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
    }

    .section {
      margin-top: 18px;
    }

    h2 {
      margin: 0;
      color: #29424e;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    button {
      font-family: inherit;
      cursor: default;
    }

    .date-option {
      padding: 9px 5px;
      border: 0;
      border-radius: 4px;
      background: #eef3f5;
      color: #4f626c;
      text-align: center;
    }

    .date-option.selected {
      background: #d9f1fb;
      color: #087dac;
    }

    .weekday {
      display: block;
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
    }

    .date {
      display: block;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .time-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 10px;
      border: 0;
      border-radius: 4px;
      background: #eef3f5;
      color: #415761;
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
    }

    .time-option.selected {
      background: #d9f1fb;
      color: #087dac;
    }

    .time-option svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .selection {
      margin-top: 18px;
      padding: 11px 12px;
      border-radius: 4px;
      background: #e8f6fc;
    }

    .selection-label {
      display: block;
      color: #4f7484;
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
    }

    .selection-value {
      display: block;
      margin-top: 2px;
      color: #17495e;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .confirm {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      border: 0;
      border-radius: 4px;
      background: #0787ba;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="booking" aria-labelledby="booking-title">
      <p class="service-label">Morrowmint Advisory</p>
      <h1 id="booking-title">Choose your review time</h1>
      <p class="intro">Book a 30-minute portfolio review with Dorian Hale.</p>

      <section class="section" aria-labelledby="date-heading">
        <h2 id="date-heading">Select a date</h2>
        <div class="date-options" role="group" aria-label="Available dates">
          <button class="date-option" type="button" aria-pressed="false">
            <span class="weekday">Wed</span>
            <span class="date">Jun 17</span>
          </button>
          <button class="date-option selected" type="button" aria-pressed="true">
            <span class="weekday">Thu</span>
            <span class="date">Jun 18</span>
          </button>
          <button class="date-option" type="button" aria-pressed="false">
            <span class="weekday">Fri</span>
            <span class="date">Jun 19</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="time-heading">
        <h2 id="time-heading">Available times</h2>
        <div class="time-options" role="group" aria-label="Available appointment times">
          <button class="time-option" type="button" aria-pressed="false">9:00 AM</button>
          <button class="time-option selected" type="button" aria-pressed="true">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10.5l3.5 3.5L16 5.5"></path>
            </svg>
            10:30 AM
          </button>
          <button class="time-option" type="button" aria-pressed="false">1:00 PM</button>
          <button class="time-option" type="button" aria-pressed="false">2:30 PM</button>
        </div>
      </section>

      <div class="selection">
        <span class="selection-label">Your appointment</span>
        <span class="selection-value">Jun 18, 2026 · 10:30 AM</span>
      </div>

      <button class="confirm" type="button">Confirm appointment</button>
    </main>
  </div>
</body>
</html>
