<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northpath Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9ed;
      color: #1d1920;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .top-bar {
      width: 100%;
      padding: 18px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #d20f8c;
    }

    .sign-in {
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: #6c626c;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .welcome {
      flex: 1;
      padding: 0 24px 28px;
      display: flex;
      flex-direction: column;
    }

    .hero {
      width: 342px;
      height: 322px;
      border-radius: 14px;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #d8d2d7;
    }

    .copy {
      padding-top: 32px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #d20f8c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 330px;
      margin: 0;
      color: #1d1920;
      font-size: 36px;
      line-height: 43px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .description {
      max-width: 326px;
      margin: 16px 0 0;
      color: #6c626c;
      font-size: 15px;
      line-height: 23px;
      font-weight: 400;
    }

    .actions {
      margin-top: auto;
    }

    .primary-button {
      width: 100%;
      min-height: 56px;
      padding: 15px 20px;
      border: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #d20f8c;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .supporting-note {
      margin: 12px 0 0;
      color: #817681;
      text-align: center;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar" aria-label="App navigation">
      <div class="brand" aria-label="Northpath">
        <span class="brand-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M15 3.5L19.1 10.9L26.5 15L19.1 19.1L15 26.5L10.9 19.1L3.5 15L10.9 10.9L15 3.5Z" fill="currentColor"/>
            <circle cx="15" cy="15" r="3.2" fill="white"/>
          </svg>
        </span>
        <span>Northpath</span>
      </div>
      <button class="sign-in" type="button">Sign in</button>
    </header>

    <main class="welcome">
      <img
        class="hero"
        src="https://loremflickr.com/342/322/hotel?lock=2250"
        width="342"
        height="322"
        alt="A quiet hotel overlooking the coast"
      >

      <section class="copy" aria-labelledby="welcome-title">
        <p class="eyebrow">Stays for every route</p>
        <h1 id="welcome-title">Find the right place for your next trip.</h1>
        <p class="description">Compare stays, save the ones that fit, and book when your plans are ready.</p>
      </section>

      <div class="actions">
        <button class="primary-button" type="button">
          <span>Explore stays</span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.5 10H15.5M11 5.5L15.5 10L11 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="supporting-note">No account needed to browse.</p>
      </div>
    </main>
  </div>
</body>
</html>
