<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e8e9e3;
      color: #20231d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfbf8;
      border: 1px solid #d7d9d0;
    }

    .top-bar {
      min-height: 64px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid #d9dbd2;
      background: #fbfbf8;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #30342b;
      background: transparent;
      border: 0;
    }

    .top-bar h1 {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    .top-spacer {
      width: 44px;
      height: 44px;
    }

    main {
      flex: 1;
      padding: 24px 20px 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #66733f;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .intro h2 {
      margin: 0;
      color: #1d201a;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
    }

    .intro-copy {
      margin: 9px 0 0;
      max-width: 330px;
      color: #62665b;
      font-size: 14px;
      line-height: 1.55;
    }

    .add-button {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      padding: 13px 18px;
      color: #ffffff;
      background: #66733f;
      border: 1px solid #66733f;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }

    .saved-section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
    }

    .section-count {
      flex: none;
      color: #777b70;
      font-size: 13px;
      line-height: 1.4;
    }

    .method-list {
      border: 1px solid #d9dbd2;
      background: #ffffff;
    }

    .method-row {
      width: 100%;
      min-height: 82px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 24px;
      align-items: center;
      gap: 13px;
      padding: 14px;
      color: inherit;
      text-align: left;
      background: #ffffff;
      border: 0;
      border-bottom: 1px solid #d9dbd2;
      border-radius: 0;
    }

    .method-row:last-child {
      border-bottom: 0;
    }

    .method-symbol {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #596536;
      background: #e5e8d8;
      border: 1px solid #d5d9c3;
    }

    .method-copy {
      min-width: 0;
    }

    .method-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .method-name {
      min-width: 0;
      overflow: hidden;
      color: #252920;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .default-label {
      flex: none;
      padding: 2px 6px;
      color: #596536;
      background: #f0f2e8;
      border: 1px solid #cfd4bb;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 700;
    }

    .method-detail {
      margin-top: 4px;
      color: #73776c;
      font-size: 13px;
      line-height: 1.35;
    }

    .chevron {
      color: #888c81;
      justify-self: end;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 15px 0 0;
      color: #707469;
      font-size: 13px;
      line-height: 1.45;
    }

    .security-note svg {
      flex: none;
      margin-top: 1px;
      color: #66733f;
    }

    .tab-bar {
      min-height: 73px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #d9dbd2;
      background: #fbfbf8;
    }

    .tab-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px 7px;
      color: #74786d;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
    }

    .tab-item.active {
      color: #596536;
      font-weight: 700;
    }

    .tab-item.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 25px;
      right: 25px;
      height: 2px;
      background: #66733f;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>
      <h1>Payment methods</h1>
      <div class="top-spacer" aria-hidden="true"></div>
    </header>

    <main>
      <section class="intro" aria-labelledby="ways-to-pay">
        <p class="eyebrow">Loopstead payments</p>
        <h2 id="ways-to-pay">Ways you pay</h2>
        <p class="intro-copy">Manage the cards and accounts used for group dues, event tickets, and community purchases.</p>
        <button class="add-button" type="button">Add payment method</button>
      </section>

      <section class="saved-section" aria-labelledby="saved-methods">
        <div class="section-heading">
          <h3 id="saved-methods">Saved methods</h3>
          <span class="section-count">3 methods</span>
        </div>

        <div class="method-list">
          <button class="method-row" type="button" aria-label="Manage Meadow Credit card ending in 4821">
            <span class="method-symbol" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" stroke="currentColor" stroke-width="1.6"/>
                <path d="M3 9H21" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7 15H11" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-name">Meadow Credit •••• 4821</span>
                <span class="default-label">Default</span>
              </span>
              <span class="method-detail">Credit card · Expires 08/28</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
          </button>

          <button class="method-row" type="button" aria-label="Manage Harborline Debit card ending in 1096">
            <span class="method-symbol" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" stroke="currentColor" stroke-width="1.6"/>
                <path d="M3 9H21" stroke="currentColor" stroke-width="1.6"/>
                <path d="M7 15H11" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-name">Harborline Debit •••• 1096</span>
              </span>
              <span class="method-detail">Debit card · Expires 11/27</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
          </button>

          <button class="method-row" type="button" aria-label="Manage North County Bank checking account ending in 7732">
            <span class="method-symbol" aria-hidden="true">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                <path d="M3 9L12 4L21 9" stroke="currentColor" stroke-width="1.6"/>
                <path d="M5 10H19" stroke="currentColor" stroke-width="1.6"/>
                <path d="M6 10V18M10 10V18M14 10V18M18 10V18" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 19H20" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="method-copy">
              <span class="method-title-line">
                <span class="method-name">North County Bank •••• 7732</span>
              </span>
              <span class="method-detail">Checking account</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
          </button>
        </div>

        <p class="security-note">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8 10V7.5C8 5.57 9.79 4 12 4C14.21 4 16 5.57 16 7.5V10" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <span>Your full card and account numbers are not shared with community organizers.</span>
        </p>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <a class="tab-item" href="#" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10L12 4L20 10V20H14V14H10V20H4V10Z" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span>Home</span>
      </a>
      <a class="tab-item" href="#" aria-label="Circles">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17" cy="10" r="2.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 19C3.8 15.9 5.7 14 9 14C12.3 14 14.2 15.9 14.5 19" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15 15C18.2 14.5 20.1 16 20.5 18.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span>Circles</span>
      </a>
      <a class="tab-item" href="#" aria-label="Messages">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5H20V17H10L5 21V17H4V5Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 9H16M8 13H14" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span>Messages</span>
      </a>
      <a class="tab-item active" href="#" aria-current="page" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5 20C5.4 15.9 7.7 14 12 14C16.3 14 18.6 15.9 19 20" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
