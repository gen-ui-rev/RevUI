<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halcyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E7E5DF;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .screen{
    width:390px;
    height:844px;
    background:#FCFBF7;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .hero{
    flex:1;
    background:rgba(242,194,48,0.16);
    border-radius:0 0 14px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 32px;
    box-sizing:border-box;
  }
  .mark{
    width:78px;
    height:78px;
    border-radius:14px;
    background:#F2C230;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wordmark{
    margin:28px 0 0;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.8px;
    color:#1A1915;
  }
  .tagline{
    margin:10px 0 0;
    font-size:15px;
    font-weight:500;
    color:#6E695B;
    text-align:center;
    line-height:1.5;
  }
  .foot{
    padding:32px 32px 44px;
  }
  .status{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }
  .status-label{
    font-size:14px;
    font-weight:500;
    color:#6E695B;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status-value{
    font-size:14px;
    font-weight:700;
    color:#1A1915;
  }
  .track{
    margin-top:12px;
    height:6px;
    border-radius:14px;
    background:rgba(242,194,48,0.28);
  }
  .fill{
    width:68%;
    height:6px;
    border-radius:14px;
    background:#F2C230;
  }
  .version{
    margin:26px 0 0;
    text-align:center;
    font-size:12px;
    font-weight:500;
    color:#9C978A;
    letter-spacing:0.2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="hero">
      <div class="mark">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M28.4 24.6a10.2 10.2 0 0 1-12.9-13 12.4 12.4 0 1 0 12.9 13Z" fill="#1A1915"/>
          <circle cx="29.2" cy="11.4" r="2.2" fill="#1A1915"/>
        </svg>
      </div>
      <h1 class="wordmark">Halcyon</h1>
      <p class="tagline">Sleep tracking and recovery<br>coaching, night after night.</p>
    </div>

    <div class="foot">
      <div class="status">
        <span class="status-label">Restoring your sleep history</span>
        <span class="status-value">68%</span>
      </div>
      <div class="track"><div class="fill"></div></div>
      <p class="version">Version 4.2.1 &nbsp;·&nbsp; Halcyon Health, Inc.</p>
    </div>
  </div>
</body>
</html>
