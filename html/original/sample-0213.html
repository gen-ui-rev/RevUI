<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Savings Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 20px;
      background: #f8fafc;
    }

    .edit-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 6px;
      background: rgba(36, 112, 232, 0.11);
    }

    .header-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(36, 112, 232, 0.15);
      color: #2470e8;
    }

    .header-icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: #195fc5;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #52627a;
      font-size: 14px;
      line-height: 1.35;
    }

    form {
      margin-top: 14px;
    }

    .field + .field {
      margin-top: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #536176;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 6px;
      background: rgba(36, 112, 232, 0.08);
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #172033;
      font: 500 14px/1.3 'Roboto', system-ui, sans-serif;
    }

    .with-prefix input {
      padding-left: 17px;
    }

    .with-icon input {
      padding-right: 28px;
    }

    .prefix {
      position: absolute;
      left: 12px;
      color: #52627a;
      font-size: 14px;
      font-weight: 500;
    }

    .control-icon {
      position: absolute;
      right: 12px;
      width: 18px;
      height: 18px;
      color: #4d6382;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .account-control {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      border-radius: 6px;
      background: rgba(36, 112, 232, 0.08);
      color: #172033;
      font: 500 14px/1.3 'Roboto', system-ui, sans-serif;
      text-align: left;
    }

    .account-name {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-control svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      fill: none;
      stroke: #4d6382;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 10px;
      margin-top: 14px;
    }

    .actions button {
      min-height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      font: 500 14px/1 'Roboto', system-ui, sans-serif;
    }

    .cancel {
      background: rgba(36, 112, 232, 0.09);
      color: #31547f;
    }

    .save {
      background: #2470e8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="edit-goal-title">
      <div class="edit-header">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7.5"></circle>
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2.5v2M21.5 12h-2M12 21.5v-2M2.5 12h2"></path>
          </svg>
        </div>
        <div class="header-copy">
          <h1 id="edit-goal-title">Edit emergency fund</h1>
          <p class="subtitle">Update this existing savings goal.</p>
        </div>
      </div>

      <form>
        <div class="field">
          <label for="goal-name">Goal name</label>
          <div class="control">
            <input id="goal-name" type="text" value="Emergency fund">
          </div>
        </div>

        <div class="field">
          <label for="target-amount">Target amount</label>
          <div class="control with-prefix">
            <span class="prefix" aria-hidden="true">$</span>
            <input id="target-amount" type="text" inputmode="decimal" value="18,000.00">
          </div>
        </div>

        <div class="field">
          <label for="target-date">Target date</label>
          <div class="control with-icon">
            <input id="target-date" type="text" value="September 30, 2026">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
              <path d="M8 3.5v4M16 3.5v4M3.5 10h17"></path>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="monthly-transfer">Monthly transfer</label>
          <div class="control with-prefix">
            <span class="prefix" aria-hidden="true">$</span>
            <input id="monthly-transfer" type="text" inputmode="decimal" value="450.00">
          </div>
        </div>

        <div class="field">
          <label id="funding-account-label">Funding account</label>
          <button class="account-control" type="button" aria-labelledby="funding-account-label">
            <span class="account-name">Everyday Checking · 1842</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 10 4 4 4-4"></path>
            </svg>
          </button>
        </div>

        <div class="actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="save" type="submit">Save changes</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
