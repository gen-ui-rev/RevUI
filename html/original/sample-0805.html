<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherline Nearby Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe4e0;
      color: #162019;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      height: 68px;
      flex: 0 0 68px;
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dce3dd;
    }

    .title-block {
      min-width: 0;
    }

    .service-name {
      margin: 0 0 2px;
      color: #398352;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .top-action {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #26372c;
      background: #ffffff;
      border: 1px solid #cfd8d1;
      border-radius: 4px;
    }

    .area-row {
      height: 56px;
      flex: 0 0 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid #cfd8d1;
      background: #ffffff;
    }

    .area-row svg {
      flex: 0 0 auto;
      color: #398352;
    }

    .area-copy {
      min-width: 0;
      flex: 1;
    }

    .area-label {
      display: block;
      margin-bottom: 2px;
      color: #69756c;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .area-name {
      display: block;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 600;
    }

    .change-area {
      padding: 6px 0 6px 12px;
      color: #327748;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      border: 0;
    }

    .map {
      position: relative;
      height: 650px;
      flex: 0 0 650px;
      background: #e8eee8;
    }

    .map-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .locate-button {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #233329;
      background: #ffffff;
      border: 1px solid #bfcac1;
      border-radius: 4px;
    }

    .marker {
      position: absolute;
      width: 42px;
      height: 50px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #ffffff;
    }

    .marker svg {
      width: 42px;
      height: 50px;
      display: block;
    }

    .marker-one {
      top: 108px;
      left: 76px;
    }

    .marker-two {
      top: 155px;
      right: 45px;
    }

    .marker-selected {
      top: 232px;
      left: 180px;
      width: 54px;
      height: 64px;
    }

    .marker-selected svg {
      width: 54px;
      height: 64px;
    }

    .marker-label {
      position: absolute;
      top: 280px;
      left: 166px;
      padding: 6px 9px;
      color: #ffffff;
      background: #2f7748;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .map-key {
      position: absolute;
      left: 14px;
      top: 16px;
      padding: 7px 9px;
      color: #4d5c51;
      background: #ffffff;
      border: 1px solid #c7d1c9;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .detail-sheet {
      position: absolute;
      right: 12px;
      bottom: 14px;
      left: 12px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #b9c6bc;
      border-top: 3px solid #398352;
      border-radius: 4px;
    }

    .detail-meta {
      margin: 0 0 6px;
      color: #398352;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .detail-sheet h2 {
      margin: 0 0 12px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .address-block {
      padding-bottom: 13px;
      border-bottom: 1px solid #d9e0da;
    }

    .address-label {
      display: block;
      margin-bottom: 4px;
      color: #69756c;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .address {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: #28372d;
      font-size: 14px;
      line-height: 1.45;
    }

    .address svg {
      flex: 0 0 auto;
      margin-top: 1px;
      color: #398352;
    }

    .host-row {
      padding-top: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .monogram {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      color: #245f39;
      background: #dcebdd;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .host-copy {
      min-width: 0;
      flex: 1;
    }

    .host-name,
    .host-note {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .host-name {
      margin-bottom: 2px;
      font-size: 14px;
      font-weight: 600;
    }

    .host-note {
      color: #69756c;
      font-size: 12px;
      line-height: 1.3;
    }

    .view-button {
      padding: 9px 12px;
      color: #ffffff;
      background: #398352;
      border: 1px solid #398352;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
    }

    .tabbar {
      height: 70px;
      flex: 0 0 70px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #ffffff;
      border-top: 1px solid #cfd8d1;
    }

    .tab {
      position: relative;
      padding: 9px 0 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #69756c;
      background: transparent;
      border: 0;
      font-size: 12px;
      line-height: 1;
      font-weight: 500;
    }

    .tab svg {
      width: 23px;
      height: 23px;
    }

    .tab.active {
      color: #2f7748;
      font-weight: 700;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      width: 38px;
      height: 3px;
      background: #398352;
    }

    .unread {
      position: absolute;
      top: 7px;
      left: calc(50% + 7px);
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: #398352;
      border: 2px solid #ffffff;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="title-block">
        <p class="service-name">Gatherline</p>
        <h1>Plans near you</h1>
      </div>
      <button class="top-action" aria-label="Map filters">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="14" cy="7" r="2.2" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="8" cy="17" r="2.2" fill="#ffffff" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </header>

    <section class="area-row" aria-label="Map area">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
        <path d="M12 21s6-5.7 6-11a6 6 0 1 0-12 0c0 5.3 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="10" r="2.3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <div class="area-copy">
        <span class="area-label">Viewing area</span>
        <span class="area-name">Oakwell neighborhood</span>
      </div>
      <button class="change-area">Change</button>
    </section>

    <main class="map" aria-label="Map of nearby community plans">
      <svg class="map-art" viewBox="0 0 390 650" preserveAspectRatio="none" aria-hidden="true">
        <rect width="390" height="650" fill="#e8eee8"/>
        <path d="M0 62C62 72 98 94 145 89C211 82 249 36 390 49V137C302 127 257 153 199 164C116 179 55 145 0 157Z" fill="#dce8dc"/>
        <path d="M-20 260C54 225 122 237 179 271C239 307 299 304 421 242" fill="none" stroke="#d4dfd6" stroke-width="48"/>
        <path d="M-20 260C54 225 122 237 179 271C239 307 299 304 421 242" fill="none" stroke="#ffffff" stroke-width="31"/>
        <path d="M-20 260C54 225 122 237 179 271C239 307 299 304 421 242" fill="none" stroke="#c8d1ca" stroke-width="2"/>
        <path d="M78 -20C87 81 111 150 129 222C149 303 136 394 151 687" fill="none" stroke="#d4dfd6" stroke-width="39"/>
        <path d="M78 -20C87 81 111 150 129 222C149 303 136 394 151 687" fill="none" stroke="#ffffff" stroke-width="24"/>
        <path d="M78 -20C87 81 111 150 129 222C149 303 136 394 151 687" fill="none" stroke="#c8d1ca" stroke-width="2"/>
        <path d="M294 -20C275 77 276 165 302 230C324 286 331 357 316 452C307 509 316 580 340 680" fill="none" stroke="#d4dfd6" stroke-width="34"/>
        <path d="M294 -20C275 77 276 165 302 230C324 286 331 357 316 452C307 509 316 580 340 680" fill="none" stroke="#ffffff" stroke-width="20"/>
        <path d="M294 -20C275 77 276 165 302 230C324 286 331 357 316 452C307 509 316 580 340 680" fill="none" stroke="#c8d1ca" stroke-width="2"/>
        <path d="M-18 420C63 398 129 409 189 444C249 478 313 486 414 448" fill="none" stroke="#d4dfd6" stroke-width="35"/>
        <path d="M-18 420C63 398 129 409 189 444C249 478 313 486 414 448" fill="none" stroke="#ffffff" stroke-width="21"/>
        <path d="M-18 420C63 398 129 409 189 444C249 478 313 486 414 448" fill="none" stroke="#c8d1ca" stroke-width="2"/>
        <rect x="170" y="76" width="75" height="59" rx="4" fill="#d1e3d2"/>
        <path d="M177 124L239 85M184 84L232 127" stroke="#b5d2b9" stroke-width="4"/>
        <rect x="19" y="310" width="72" height="54" rx="4" fill="#d1e3d2"/>
        <path d="M26 352L83 320M30 318L79 355" stroke="#b5d2b9" stroke-width="4"/>
        <text x="171" y="61" fill="#637067" font-size="12" font-family="Inter, sans-serif" font-weight="600">Oakwell Commons</text>
        <text x="18" y="389" fill="#6b776e" font-size="12" font-family="Inter, sans-serif" font-weight="500">Briar Street</text>
        <text x="213" y="338" fill="#6b776e" font-size="12" font-family="Inter, sans-serif" font-weight="500" transform="rotate(-8 213 338)">Alder Avenue</text>
        <text x="302" y="112" fill="#6b776e" font-size="12" font-family="Inter, sans-serif" font-weight="500" transform="rotate(80 302 112)">North Lane</text>
        <circle cx="155" cy="350" r="8" fill="#ffffff" stroke="#398352" stroke-width="3"/>
        <circle cx="155" cy="350" r="3" fill="#398352"/>
      </svg>

      <div class="map-key">4 plans today</div>

      <button class="locate-button" aria-label="Center on my location">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="1.8" fill="#398352"/>
        </svg>
      </button>

      <div class="marker marker-one" aria-label="Book exchange marker">
        <svg viewBox="0 0 42 50" fill="none" aria-hidden="true">
          <path d="M21 48C21 48 5 33.2 5 19C5 10.2 12.2 3 21 3s16 7.2 16 16c0 14.2-16 29-16 29Z" fill="#ffffff" stroke="#398352" stroke-width="2"/>
          <path d="M14 14.5h5.2c1.1 0 1.8.3 1.8.3s.7-.3 1.8-.3H28v12h-5.2c-1.1 0-1.8.7-1.8.7s-.7-.7-1.8-.7H14v-12Z" stroke="#398352" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M21 15v12" stroke="#398352" stroke-width="1.8"/>
        </svg>
      </div>

      <div class="marker marker-two" aria-label="Walking group marker">
        <svg viewBox="0 0 42 50" fill="none" aria-hidden="true">
          <path d="M21 48C21 48 5 33.2 5 19C5 10.2 12.2 3 21 3s16 7.2 16 16c0 14.2-16 29-16 29Z" fill="#ffffff" stroke="#398352" stroke-width="2"/>
          <circle cx="21" cy="15" r="3" stroke="#398352" stroke-width="1.8"/>
          <path d="M16 28v-4.5c0-2.7 2.2-4.8 5-4.8s5 2.1 5 4.8V28M18 28v-4M24 28v-4" stroke="#398352" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="marker marker-selected" aria-label="Selected cleanup marker">
        <svg viewBox="0 0 54 64" fill="none" aria-hidden="true">
          <path d="M27 61C27 61 7 42.8 7 25C7 14 16 5 27 5s20 9 20 20c0 17.8-20 36-20 36Z" fill="#398352" stroke="#ffffff" stroke-width="3"/>
          <path d="M18 23h18M21 23l1.4 15h9.2L33 23M23 19h8l1 4H22l1-4Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="marker-label">Park cleanup</div>

      <section class="detail-sheet" aria-labelledby="plan-title">
        <p class="detail-meta">Today · 5:30 PM</p>
        <h2 id="plan-title">Oakwell Commons cleanup</h2>

        <div class="address-block">
          <span class="address-label">Meeting address</span>
          <div class="address">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
              <path d="M12 21s6-5.7 6-11a6 6 0 1 0-12 0c0 5.3 6 11 6 11Z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>184 Alder Ave, Oakwell, OR 97035</span>
          </div>
        </div>

        <div class="host-row">
          <div class="monogram" aria-label="Nora Vale">NV</div>
          <div class="host-copy">
            <span class="host-name">Hosted by Nora Vale</span>
            <span class="host-note">8 neighbors are joining</span>
          </div>
          <button class="view-button">View plan</button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5 9 3l6 2.5L20 3v15.5L15 21l-6-2.5L4 21V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 3v15.5M15 5.5V21" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Map</span>
      </button>

      <button class="tab">
        <span class="unread">2</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 18.5 3.5 21v-5A8 8 0 1 1 7 19.2c-.7-.2-1.4-.4-2-.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Chats</span>
      </button>

      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17" cy="10" r="2.3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3.5 20v-2c0-3 2.4-5.4 5.5-5.4s5.5 2.4 5.5 5.4v2M15 14.2c2.9 0 5 2 5 4.6V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Groups</span>
      </button>

      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4.5 21c.5-4 3.4-6.5 7.5-6.5s7 2.5 7.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>You</span>
      </button>
    </nav>
  </div>
</body>
</html>
