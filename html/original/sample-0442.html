<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge earned — Fernwood Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#EDEDEF;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:#FFFFFF;
    padding:36px 28px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#1D4ED8;
    margin:0 0 20px;
  }
  .hero{
    display:flex;
    align-items:flex-start;
    gap:18px;
  }
  .art{
    width:84px;
    height:84px;
    flex:0 0 84px;
    border-radius:4px;
    background:#1D4ED8;
  }
  .hero-text{min-width:0;}
  h1{
    font-size:24px;
    line-height:1.2;
    font-weight:600;
    color:#101114;
    margin:2px 0 6px;
    letter-spacing:-.01em;
  }
  .meta{
    font-size:13px;
    font-weight:400;
    color:#6C6F76;
    margin:0;
  }
  .blurb{
    font-size:14px;
    line-height:1.5;
    color:#3D4046;
    margin:20px 0 0;
  }
  .rule{
    height:1px;
    background:#E3E4E7;
    margin:24px 0;
  }
  .next-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .next-label{
    font-size:14px;
    font-weight:500;
    color:#101114;
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .count{
    font-size:14px;
    font-weight:600;
    color:#1D4ED8;
    margin:0;
    flex:0 0 auto;
  }
  .track{
    height:6px;
    border-radius:4px;
    background:#E3E4E7;
    margin:12px 0 10px;
  }
  .fill{
    width:66.6%;
    height:100%;
    border-radius:4px;
    background:#1D4ED8;
  }
  .hint{
    font-size:12px;
    color:#6C6F76;
    margin:0;
  }
  .foot{
    display:flex;
    align-items:center;
    gap:6px;
    margin:24px 0 0;
    font-size:13px;
    font-weight:500;
    color:#1D4ED8;
  }
  .foot svg{flex:0 0 auto;}
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Badge earned</p>

    <div class="hero">
      <div class="art"></div>
      <div class="hero-text">
        <h1>Trusted Reviewer</h1>
        <p class="meta">Earned March 14, 2025</p>
      </div>
    </div>

    <p class="blurb">Given to shoppers whose reviews have been marked helpful 50 times by other buyers on Fernwood Market.</p>

    <div class="rule"></div>

    <div class="next-head">
      <p class="next-label">Next: Community Guide</p>
      <p class="count">4 of 6</p>
    </div>
    <div class="track"><div class="fill"></div></div>
    <p class="hint">Two more photo reviews to unlock.</p>

    <p class="foot">
      View all 11 badges
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M5 3l4 4-4 4" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </p>
  </div>
</body>
</html>
