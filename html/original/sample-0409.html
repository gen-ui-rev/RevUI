<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing — Northloom Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eceb;
      color: #243132;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px;
      background: #f8faf9;
    }

    .component {
      width: 100%;
    }

    .context {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 14px;
      background: #dce9e9;
      color: #36595b;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }

    .context svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    h1 {
      margin: 0;
      color: #1d292a;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.25;
    }

    .subtitle {
      margin: 5px 0 18px;
      color: #697576;
      font-size: 14px;
      line-height: 1.45;
    }

    form {
      margin: 0;
    }

    .field {
      margin-bottom: 13px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 13px;
    }

    .field-row .field {
      margin-bottom: 0;
    }

    label,
    .group-label {
      display: block;
      margin-bottom: 6px;
      color: #3e4b4c;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd5d4;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #253233;
      font: 400 14px/1.4 'Poppins', system-ui, sans-serif;
    }

    input,
    select {
      padding: 11px 13px;
    }

    select {
      appearance: none;
      padding-right: 38px;
      background-image: none;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap svg {
      position: absolute;
      top: 50%;
      right: 13px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      transform: translateY(-50%);
      color: #657374;
    }

    .money-wrap {
      position: relative;
    }

    .money-wrap span {
      position: absolute;
      top: 50%;
      left: 13px;
      color: #657374;
      font-size: 14px;
      transform: translateY(-50%);
    }

    .money-wrap input {
      padding-left: 27px;
    }

    textarea {
      min-height: 70px;
      padding: 11px 13px;
      resize: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #73999b;
      box-shadow: 0 0 0 3px #e1eded;
    }

    .condition {
      margin-bottom: 15px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      border-radius: 14px;
      background: #e9efee;
    }

    .option {
      position: relative;
    }

    .option input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .option label {
      margin: 0;
      padding: 8px 5px;
      border-radius: 10px;
      color: #657172;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }

    .option input:checked + label {
      background: #ffffff;
      color: #29494b;
      box-shadow: 0 1px 2px rgba(32, 52, 53, 0.08);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid #dce3e2;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 11px 14px;
      font: 500 14px/1.4 'Poppins', system-ui, sans-serif;
      cursor: pointer;
    }

    .cancel {
      background: #e8edec;
      color: #425051;
    }

    .save {
      background: #6f9698;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="edit-title">
      <div class="context">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 16.5V20h3.5L18.1 9.4l-3.5-3.5L4 16.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="m13.7 6.8 3.5 3.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Editing active listing
      </div>

      <h1 id="edit-title">Edit listing</h1>
      <p class="subtitle">Update the details buyers see on Northloom Market.</p>

      <form>
        <div class="field">
          <label for="listing-title">Listing title</label>
          <input id="listing-title" type="text" value="Stoneware Pour-Over Set">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <div class="select-wrap">
            <select id="category">
              <option selected>Kitchen &amp; Dining</option>
              <option>Home Decor</option>
              <option>Collectibles</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m7 9.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="price">Price</label>
            <div class="money-wrap">
              <span>$</span>
              <input id="price" type="text" inputmode="decimal" value="48.00">
            </div>
          </div>
          <div class="field">
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" value="6">
          </div>
        </div>

        <div class="condition">
          <span class="group-label">Condition</span>
          <div class="options" role="radiogroup" aria-label="Condition">
            <div class="option">
              <input id="new" name="condition" type="radio">
              <label for="new">New</label>
            </div>
            <div class="option">
              <input id="like-new" name="condition" type="radio" checked>
              <label for="like-new">Like new</label>
            </div>
            <div class="option">
              <input id="used" name="condition" type="radio">
              <label for="used">Used</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description">Hand-glazed dripper and matching cup in soft gray. Food-safe stoneware; minor variations are natural.</textarea>
        </div>

        <div class="actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="save" type="submit">Save changes</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
