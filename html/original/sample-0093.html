<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Delivery Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2dc;
      color: #171914;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #eef0eb;
    }

    .widget {
      width: 100%;
      aspect-ratio: 3 / 2;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d7dad2;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .service-name {
      margin: 0;
      color: #65695f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status {
      padding: 5px 9px;
      border-radius: 4px;
      background: #c9f43d;
      color: #202514;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .delivery {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .delivery img {
      width: 80px;
      height: 80px;
      display: block;
      object-fit: cover;
      background: #d9dbd4;
      border-radius: 4px;
    }

    .delivery-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #65695f;
      font-size: 13px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 23px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .product-name {
      margin: 0;
      color: #4f534a;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracking {
      padding-top: 14px;
      border-top: 1px solid #dfe2da;
    }

    .tracking-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
      color: #555a50;
      font-size: 13px;
      line-height: 1.3;
    }

    .tracking-meta strong {
      color: #252920;
      font-weight: 700;
    }

    .track {
      width: 100%;
      height: 5px;
      background: #e4e7df;
      border-radius: 4px;
    }

    .track-fill {
      width: 78%;
      height: 5px;
      background: #a9d900;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="widget" aria-label="Moss Market delivery summary">
      <div class="widget-header">
        <p class="service-name">Moss Market</p>
        <span class="status">Out for delivery</span>
      </div>

      <div class="delivery">
        <img src="https://loremflickr.com/80/80/sneakers?lock=2150" width="80" height="80" alt="Cream sneakers from the current order">
        <div class="delivery-copy">
          <p class="eyebrow">Order MM-48217</p>
          <h1>Arriving today</h1>
          <p class="product-name">Alder Court sneakers · Sand · Size 9</p>
        </div>
      </div>

      <div class="tracking">
        <div class="tracking-meta">
          <span>Estimated delivery</span>
          <strong>2:10–4:10 PM</strong>
        </div>
        <div class="track" aria-label="Delivery progress: 78 percent">
          <div class="track-fill"></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
