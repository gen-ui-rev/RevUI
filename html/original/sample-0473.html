<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morrow Help &amp; Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd7;
      color: #292524;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fcfbfa;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px 12px;
    }

    .topbar-title {
      flex: 1;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: rgba(120, 113, 108, 0.11);
      color: #57534e;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 0 18px 8px;
    }

    .hero h1 {
      margin: 0;
      color: #292524;
      font-size: 28px;
      line-height: 36px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .hero p {
      margin: 4px 0 0;
      color: #78716c;
      font-size: 14px;
      line-height: 20px;
    }

    .search {
      position: relative;
      margin: 14px 0 18px;
    }

    .search svg {
      position: absolute;
      top: 14px;
      left: 15px;
      width: 20px;
      height: 20px;
      color: #57534e;
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 45px;
      border: 0;
      border-radius: 10px;
      outline: none;
      background: rgba(120, 113, 108, 0.13);
      color: #292524;
      font-size: 14px;
      font-weight: 500;
    }

    .search input::placeholder {
      color: #6b6662;
      opacity: 1;
    }

    .section + .section {
      margin-top: 16px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      margin: 0;
      color: #44403c;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    .section-heading a {
      color: #6b625c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      text-decoration: none;
    }

    .row-list {
      display: grid;
      gap: 6px;
    }

    .faq-row,
    .guide-row {
      width: 100%;
      min-width: 0;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 10px;
      background: rgba(120, 113, 108, 0.09);
      text-align: left;
    }

    .faq-row span,
    .guide-title {
      flex: 1;
      min-width: 0;
      color: #3f3b38;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .faq-row svg,
    .guide-row svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #78716c;
    }

    .contact-row {
      width: 100%;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 10px;
      background: rgba(120, 113, 108, 0.11);
      text-align: left;
    }

    .contact-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(120, 113, 108, 0.16);
      color: #57534e;
    }

    .contact-icon svg {
      width: 17px;
      height: 17px;
    }

    .contact-copy {
      flex: 1;
      min-width: 0;
    }

    .contact-title {
      display: block;
      color: #3f3b38;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
    }

    .contact-meta {
      display: block;
      margin-top: 1px;
      overflow: hidden;
      color: #78716c;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-row > svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #78716c;
    }

    .guide-row {
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .guide-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .guide-meta {
      flex: 0 0 auto;
      color: #78716c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px 10px;
      background: #f4f2f0;
    }

    .tab {
      min-width: 0;
      padding: 2px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #8a837e;
    }

    .tab svg {
      width: 21px;
      height: 21px;
    }

    .tab span {
      font-size: 12px;
      line-height: 15px;
      font-weight: 500;
    }

    .tab.active {
      color: #57534e;
    }

    .tab.active span {
      font-weight: 700;
    }

    .active-icon {
      width: 34px;
      height: 26px;
      margin: -2px 0 -3px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(120, 113, 108, 0.16);
    }

    .active-icon svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">Morrow Support</div>
      <button class="icon-button" type="button" aria-label="View support requests">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 4.5h10a2 2 0 012 2v11a2 2 0 01-2 2H7a2 2 0 01-2-2v-11a2 2 0 012-2z" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.5 9h7M8.5 13h7M8.5 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="hero" aria-labelledby="help-title">
        <h1 id="help-title">What can we help with?</h1>
        <p>Search listening, billing, downloads, and account help.</p>
      </section>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="search" aria-label="Search help articles" placeholder="Search help articles">
      </div>

      <section class="section" aria-labelledby="popular-title">
        <div class="section-heading">
          <h2 id="popular-title">Popular questions</h2>
          <a href="#">View all</a>
        </div>
        <div class="row-list">
          <button class="faq-row" type="button">
            <span>Why won’t an episode play?</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="faq-row" type="button">
            <span>How do I change download quality?</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="faq-row" type="button">
            <span>Where can I manage my subscription?</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="faq-row" type="button">
            <span>How do I remove a connected device?</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="contact-title">
        <div class="section-heading">
          <h2 id="contact-title">Contact support</h2>
        </div>
        <div class="row-list">
          <button class="contact-row" type="button">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6.5h16v11H4v-11z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M5 7.5l7 5 7-5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="contact-copy">
              <span class="contact-title">Submit a support request</span>
              <span class="contact-meta">Replies within 1 business day</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="contact-row" type="button">
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7.2 4.5l2.4 4-2 1.7c1.2 2.5 3.3 4.6 5.8 5.8l1.7-2 4 2.4-.8 2.8c-.2.7-.9 1.2-1.6 1.1C9.8 19.5 4.5 14.2 3.7 7.3c-.1-.7.4-1.4 1.1-1.6l2.4-1.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="contact-copy">
              <span class="contact-title">Call listener support</span>
              <span class="contact-meta">Mon–Fri, 9:00 AM–6:00 PM ET</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="guides-title">
        <div class="section-heading">
          <h2 id="guides-title">Help guides</h2>
          <a href="#">Browse</a>
        </div>
        <div class="row-list">
          <button class="guide-row" type="button">
            <span class="guide-title">Getting started with offline listening</span>
            <span class="guide-meta">4 min</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="guide-row" type="button">
            <span class="guide-title">Supported devices</span>
            <span class="guide-meta">6 min</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="guide-row" type="button">
            <span class="guide-title">Privacy and playback history</span>
            <span class="guide-meta">5 min</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4v-9.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/>
          <path d="M15.5 8.5l-2.1 4.9-4.9 2.1 2.1-4.9 4.9-2.1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span>Browse</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5.5h4v13H5v-13zM10.5 5.5h4v13h-4v-13zM16 7l3-.8 2.8 11.8-3 .8L16 7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span>Library</span>
      </button>
      <button class="tab active" type="button" aria-current="page">
        <span class="active-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9.8 9.4a2.3 2.3 0 014.5.7c0 1.8-2.3 2-2.3 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="16.8" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span>Support</span>
      </button>
    </nav>
  </div>
</body>
</html>
