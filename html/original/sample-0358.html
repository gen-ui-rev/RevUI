<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserving your item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html { background: #EDEDEB; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #EDEDEB;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    padding: 32px 0;
    background: #EDEDEB;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 326px;
    box-sizing: border-box;
    background: #FFFFFF;
    border-radius: 6px;
    padding: 28px 24px 24px;
  }
  .spinner { display: block; margin: 0 0 18px; }
  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 500;
    color: #1A1E22;
    letter-spacing: -0.1px;
  }
  .sub {
    margin: 0;
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    color: #5D6771;
  }
  .bar {
    margin: 20px 0 22px;
    height: 6px;
    border-radius: 6px;
    background: rgba(140, 163, 183, 0.20);
    position: relative;
  }
  .bar span {
    position: absolute;
    top: 0;
    left: 14%;
    width: 40%;
    height: 6px;
    border-radius: 6px;
    background: #8CA3B7;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(140, 163, 183, 0.14);
    border-radius: 6px;
    padding: 12px;
  }
  .item img {
    display: block;
    width: 56px;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    background: #D9DDE1;
    flex: 0 0 auto;
  }
  .info { min-width: 0; flex: 1 1 auto; }
  .name {
    font-size: 14px;
    font-weight: 500;
    color: #1A1E22;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 400;
    color: #5D6771;
  }
  .price {
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 500;
    color: #1A1E22;
  }
  .note {
    margin: 14px 0 0;
    font-size: 12px;
    line-height: 17px;
    color: #737C86;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <svg class="spinner" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(140,163,183,0.22)" stroke-width="4"></circle>
        <circle cx="20" cy="20" r="17" fill="none" stroke="#8CA3B7" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="30 77" transform="rotate(-80 20 20)"></circle>
      </svg>
      <h1>Reserving your item</h1>
      <p class="sub">Confirming stock with Harbor Lane Supply. This usually takes about 20 seconds.</p>

      <div class="bar"><span></span></div>

      <div class="item">
        <img src="https://loremflickr.com/56/56/sneakers?lock=5142" width="56" height="56" alt="Low-top trail running sneaker in fog gray">
        <div class="info">
          <div class="name">Trail Runner Low</div>
          <div class="meta">Fog Gray · Size 9 · Qty 1</div>
        </div>
        <div class="price">$128.00</div>
      </div>

      <p class="note">Your cart is held until 3:24 PM. Keep this screen open.</p>
    </div>
  </div>
</body>
</html>
