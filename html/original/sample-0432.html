<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily protein target</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e9e7e4;
    font-family: 'Roboto', system-ui, sans-serif;
    color: #1c1917;
  }
  .screen {
    width: 390px;
    background: #ffffff;
    padding: 28px 32px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #78716c;
    margin: 0 0 6px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  .hero {
    width: 326px;
    height: 132px;
    object-fit: cover;
    display: block;
    background: #d6d3d1;
    border-radius: 4px;
  }
  .valuerow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 14px;
  }
  .value {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .value .num {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
  }
  .value .unit {
    font-size: 15px;
    font-weight: 500;
    color: #57534e;
  }
  .steps { display: flex; gap: 8px; }
  .step {
    width: 42px;
    height: 42px;
    border: 1px solid #d6d3d1;
    border-radius: 4px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #44403c;
  }
  .track {
    position: relative;
    height: 6px;
    border-radius: 4px;
    background: #e7e5e4;
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 46.9%;
    border-radius: 4px;
    background: #78716c;
  }
  .knob {
    position: absolute;
    top: -7px;
    left: 46.9%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: #57534e;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12px;
    color: #78716c;
  }
  hr {
    border: 0;
    border-top: 1px solid #e7e5e4;
    margin: 20px 0 14px;
  }
  .note {
    font-size: 14px;
    line-height: 1.45;
    color: #57534e;
    margin: 0 0 20px;
  }
  .note strong { font-weight: 500; color: #1c1917; }
  .save {
    width: 100%;
    border: 0;
    border-radius: 4px;
    background: #57534e;
    color: #fafaf9;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Marrow &middot; Nutrition plan</p>
    <h1>Set your daily protein target</h1>

    <img class="hero" src="https://loremflickr.com/326/132/salad?lock=6003" width="326" height="132" alt="Grain bowl with grilled chicken and greens from the plan library">

    <div class="valuerow">
      <div class="value">
        <span class="num">135</span>
        <span class="unit">grams per day</span>
      </div>
      <div class="steps">
        <span class="step" aria-label="Decrease by 5 grams">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9"/></svg>
        </span>
        <span class="step" aria-label="Increase by 5 grams">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9M7.5 3v9"/></svg>
        </span>
      </div>
    </div>

    <div class="track">
      <div class="fill"></div>
      <div class="knob"></div>
    </div>
    <div class="scale">
      <span>60 g</span>
      <span>220 g</span>
    </div>

    <hr>

    <p class="note">Suggested range for 154 lb and four strength sessions a week is <strong>120&ndash;150 g</strong>. Meals adjust the next morning.</p>

    <div class="save">Save target</div>
  </div>
</body>
</html>
