<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northnote Focus Activity</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdedb;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 56px 20px;
      background: #ececea;
    }

    .activity {
      width: 100%;
      background: #111211;
      border-top: 3px solid #f47721;
      border-radius: 0;
      padding: 16px 18px 18px;
    }

    .activity-header,
    .activity-main,
    .activity-footer {
      display: flex;
      align-items: center;
    }

    .activity-header {
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #353735;
    }

    .service {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .service-mark {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #f47721;
    }

    .service-name {
      margin: 0;
      overflow: hidden;
      color: #f0f1ef;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-state {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      color: #b8bbb7;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #f47721;
    }

    .activity-main {
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0;
    }

    .focus-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #a9aca8;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
    }

    .task-name {
      margin: 0;
      overflow: hidden;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      line-height: 23px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer {
      margin: 0;
      flex: 0 0 auto;
      color: #f47721;
      font-size: 38px;
      font-weight: 600;
      line-height: 42px;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: #393b39;
    }

    .progress-value {
      width: 68%;
      height: 3px;
      background: #f47721;
    }

    .activity-footer {
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
    }

    .end-time {
      margin: 0;
      color: #b8bbb7;
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
    }

    .pause-control {
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #5a5d59;
      border-radius: 0;
      background: transparent;
      color: #ffffff;
    }

    .pause-control svg {
      width: 14px;
      height: 14px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Expanded focus session activity">
      <header class="activity-header">
        <div class="service">
          <span class="service-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M4 3.5h12v3H7v3h7v3H7v4H4v-13Z" fill="currentColor"/>
            </svg>
          </span>
          <p class="service-name">Northnote Focus</p>
        </div>
        <div class="live-state">
          <span class="live-dot" aria-hidden="true"></span>
          Live
        </div>
      </header>

      <div class="activity-main">
        <div class="focus-copy">
          <p class="eyebrow">Current focus block</p>
          <h1 class="task-name">Draft project brief</h1>
        </div>
        <p class="timer" aria-label="24 minutes and 18 seconds remaining">24:18</p>
      </div>

      <div class="progress-track" role="progressbar" aria-label="Focus block progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="progress-value"></div>
      </div>

      <footer class="activity-footer">
        <p class="end-time">Ends at 3:30 PM</p>
        <button class="pause-control" type="button" aria-label="Pause focus block">
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="1.5" width="3.5" height="11" fill="currentColor"/>
            <rect x="8.5" y="1.5" width="3.5" height="11" fill="currentColor"/>
          </svg>
        </button>
      </footer>
    </section>
  </div>
</body>
</html>
