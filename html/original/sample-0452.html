<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refine results — Marlowe &amp; Fen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e9e7e3;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #16161a;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    background: #ffffff;
    padding: 22px;
  }

  /* header */
  .head h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 4px;
    margin-bottom: 14px;
  }
  .meta .count { font-size: 14px; color: #6d6d72; }
  .meta .reset {
    font-size: 14px;
    font-weight: 600;
    color: #16161a;
    border-bottom: 1px solid #16161a;
    padding-bottom: 1px;
  }

  /* sections */
  .sec {
    border-top: 1px solid #dedbd6;
    padding: 12px 0;
  }
  .lbl {
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #6d6d72;
    margin-bottom: 8px;
  }

  /* sort chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 14px;
    line-height: 18px;
    padding: 6px 12px;
    border: 1px solid #cfccc7;
    background: #fff;
    color: #16161a;
    white-space: nowrap;
  }
  .chip.on {
    background: #16161a;
    border-color: #16161a;
    color: #ffffff;
    font-weight: 600;
  }

  /* price */
  .priceline {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    line-height: 20px;
  }
  .priceline .k {
    font-size: 12px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #6d6d72;
  }
  .priceline .v { font-size: 15px; font-weight: 600; }
  .track {
    position: relative;
    height: 6px;
    background: #e4e1dc;
    margin-top: 14px;
  }
  .fill {
    position: absolute;
    top: 0;
    left: 8%;
    width: 54%;
    height: 6px;
    background: #16161a;
  }
  .knob {
    position: absolute;
    top: -3px;
    width: 4px;
    height: 12px;
    background: #16161a;
  }
  .knob.a { left: 8%; }
  .knob.b { left: 62%; margin-left: -4px; }

  /* category rows */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 0;
  }
  .box {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    border: 1px solid #a9a5a0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box.on { background: #16161a; border-color: #16161a; }
  .box svg { display: block; }
  .row img {
    display: block;
    object-fit: cover;
    background: #ddd9d4;
    flex: 0 0 40px;
  }
  .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 15px;
    line-height: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.on .name { font-weight: 600; }
  .num {
    flex: 0 0 auto;
    font-size: 13px;
    color: #6d6d72;
    font-variant-numeric: tabular-nums;
  }

  /* footer */
  .foot { border-top: 1px solid #dedbd6; padding-top: 12px; }
  .apply {
    display: block;
    width: 100%;
    background: #16161a;
    color: #ffffff;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    line-height: 44px;
    height: 44px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="head">
      <h1>Refine results</h1>
      <div class="meta">
        <span class="count">412 items match</span>
        <span class="reset">Reset all</span>
      </div>
    </div>

    <div class="sec">
      <div class="lbl">Sort by</div>
      <div class="chips">
        <span class="chip">Newest</span>
        <span class="chip on">Price: Low–High</span>
        <span class="chip">Top rated</span>
      </div>
    </div>

    <div class="sec">
      <div class="priceline">
        <span class="k">Price range</span>
        <span class="v">$40 – $180</span>
      </div>
      <div class="track">
        <div class="fill"></div>
        <div class="knob a"></div>
        <div class="knob b"></div>
      </div>
    </div>

    <div class="sec">
      <div class="lbl">Category</div>

      <div class="row on">
        <span class="box on">
          <svg width="11" height="9" viewBox="0 0 11 9" fill="none" aria-hidden="true">
            <path d="M1 4.6L4.1 7.6L10 1.4" stroke="#ffffff" stroke-width="1.6"/>
          </svg>
        </span>
        <img src="https://loremflickr.com/40/40/sneakers?lock=6240" width="40" height="40" alt="Low-top canvas sneakers from the sneakers category">
        <span class="name">Sneakers</span>
        <span class="num">128</span>
      </div>

      <div class="row on">
        <span class="box on">
          <svg width="11" height="9" viewBox="0 0 11 9" fill="none" aria-hidden="true">
            <path d="M1 4.6L4.1 7.6L10 1.4" stroke="#ffffff" stroke-width="1.6"/>
          </svg>
        </span>
        <img src="https://loremflickr.com/40/40/fashion?lock=6241" width="40" height="40" alt="Wool coat on a rail from the outerwear category">
        <span class="name">Outerwear</span>
        <span class="num">96</span>
      </div>

      <div class="row">
        <span class="box"></span>
        <img src="https://loremflickr.com/40/40/furniture?lock=6242" width="40" height="40" alt="Upholstered lounge chair from the seating category">
        <span class="name">Seating</span>
        <span class="num">54</span>
      </div>

      <div class="row">
        <span class="box"></span>
        <img src="https://loremflickr.com/40/40/product?lock=6243" width="40" height="40" alt="Ceramic desk tray from the desk objects category">
        <span class="name">Desk objects</span>
        <span class="num">41</span>
      </div>
    </div>

    <div class="foot">
      <span class="apply">Show 412 items</span>
    </div>
  </div>
</body>
</html>
