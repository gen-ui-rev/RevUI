<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrange Featured Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e8eb;
      color: #26212c;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 20px;
      background: #fbfafc;
    }

    .reorder-component {
      width: 100%;
    }

    .intro {
      padding: 18px;
      border-radius: 6px;
      background: rgba(111, 63, 166, 0.1);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #6f3fa6;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #5f3292;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .description {
      margin: 9px 0 0;
      color: #5e5765;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .product-list {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(111, 63, 166, 0.08);
    }

    .drag-handle {
      width: 20px;
      padding: 4px 2px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #76558f;
      cursor: grab;
    }

    .drag-handle svg {
      width: 16px;
      height: 22px;
      display: block;
    }

    .product-image {
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd8e2;
    }

    .product-copy {
      min-width: 0;
    }

    .product-name {
      margin: 0;
      overflow: hidden;
      color: #2d2732;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-position {
      margin: 4px 0 0;
      color: #776f7c;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
    }

    .save-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      border: 0;
      border-radius: 6px;
      background: #6f3fa6;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="reorder-component" aria-labelledby="reorder-title">
      <header class="intro">
        <p class="eyebrow">Morrow Market · Storefront</p>
        <h1 id="reorder-title">Arrange featured products</h1>
        <p class="description">Drag the handles to change the order customers see in your featured collection.</p>
      </header>

      <ol class="product-list" aria-label="Featured product order">
        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Cloudstep sneakers">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/sneakers?lock=5290" width="56" height="56" alt="Pair of Cloudstep sneakers">
          <div class="product-copy">
            <p class="product-name">Cloudstep Sneakers</p>
            <p class="product-position">Position 1 · Footwear</p>
          </div>
        </li>

        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Alder side table">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/furniture?lock=5291" width="56" height="56" alt="Alder wood side table">
          <div class="product-copy">
            <p class="product-name">Alder Side Table</p>
            <p class="product-position">Position 2 · Furniture</p>
          </div>
        </li>

        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Rowan canvas tote">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/fashion?lock=5292" width="56" height="56" alt="Rowan canvas tote bag">
          <div class="product-copy">
            <p class="product-name">Rowan Canvas Tote</p>
            <p class="product-position">Position 3 · Accessories</p>
          </div>
        </li>
      </ol>

      <button class="save-button" type="button">Save order</button>
    </main>
  </div>
</body>
</html>
