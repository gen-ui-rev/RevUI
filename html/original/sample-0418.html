<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e6e8;
      color: #2d2529;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 22px;
      background: #f6f3f5;
    }

    .report-card {
      padding: 24px;
      background: #ffffff;
      border-radius: 14px;
    }

    h1 {
      margin: 0;
      color: #c7286a;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .prompt {
      margin: 8px 0 0;
      color: #6f6469;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    fieldset {
      margin: 22px 0 0;
      padding: 0;
      border: 0;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(220, 56, 124, 0.09);
      border-radius: 14px;
      color: #3c3136;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
    }

    .option:has(input:checked) {
      background: rgba(220, 56, 124, 0.18);
      color: #8f1648;
      font-weight: 700;
    }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      position: relative;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      border-radius: 50%;
      background: rgba(220, 56, 124, 0.18);
    }

    .option input:checked + .radio {
      background: #d63376;
    }

    .option input:checked + .radio::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    .boundary-note {
      margin: 16px 0 0;
      padding: 14px 16px;
      background: rgba(220, 56, 124, 0.07);
      border-radius: 14px;
      color: #665a60;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 400;
    }

    .boundary-note strong {
      color: #43373c;
      font-weight: 700;
    }

    .continue-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #d63376;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <form class="report-card">
      <h1>Why are you reporting this post?</h1>
      <p class="prompt">Choose the reason that best describes the content.</p>

      <fieldset aria-label="Report reason">
        <div class="options">
          <label class="option">
            <input type="radio" name="reason" checked>
            <span class="radio" aria-hidden="true"></span>
            <span>Harassment or bullying</span>
          </label>

          <label class="option">
            <input type="radio" name="reason">
            <span class="radio" aria-hidden="true"></span>
            <span>Hate speech or hateful conduct</span>
          </label>

          <label class="option">
            <input type="radio" name="reason">
            <span class="radio" aria-hidden="true"></span>
            <span>Spam or misleading content</span>
          </label>
        </div>
      </fieldset>

      <p class="boundary-note"><strong>Reporting is separate from blocking.</strong> Nooksy will review the post, but the member will not be blocked.</p>

      <button class="continue-button" type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
