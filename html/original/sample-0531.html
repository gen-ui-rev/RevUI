<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Teammates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #27272a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px;
      background: #fafafa;
    }

    .invite-component {
      width: 100%;
    }

    .intro {
      margin-bottom: 20px;
    }

    h1,
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: #18181b;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .intro p {
      margin: 6px 0 0;
      color: #52525b;
      font-size: 15px;
      line-height: 1.45;
    }

    .field {
      margin: 0 0 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #3f3f46;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 42px;
      border-radius: 4px;
      font: inherit;
      font-size: 15px;
    }

    input,
    select {
      border: 1px solid #a1a1aa;
      background: #ffffff;
      color: #27272a;
      padding: 9px 11px;
      outline: none;
    }

    input::placeholder {
      color: #71717a;
    }

    input:focus,
    select:focus {
      border-color: #3f3f46;
      box-shadow: 0 0 0 1px #3f3f46;
    }

    .permission-note {
      margin: -6px 0 0;
      color: #71717a;
      font-size: 12px;
      line-height: 1.4;
    }

    .invite-button {
      margin-top: 16px;
      border: 1px solid #27272a;
      background: #27272a;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    .pending {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #d4d4d8;
    }

    .pending-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 600;
    }

    .count {
      color: #71717a;
      font-size: 12px;
      white-space: nowrap;
    }

    .invite-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #e4e4e7;
    }

    .invite-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .invite-details {
      min-width: 0;
    }

    .invite-email {
      margin: 0;
      overflow: hidden;
      color: #27272a;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .invite-meta {
      margin: 2px 0 0;
      color: #71717a;
      font-size: 12px;
      line-height: 1.35;
    }

    .resend {
      width: auto;
      min-height: auto;
      padding: 5px 8px;
      border: 1px solid #a1a1aa;
      background: transparent;
      color: #3f3f46;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="invite-component" aria-labelledby="invite-title">
      <section class="intro">
        <h1 id="invite-title">Invite a teammate</h1>
        <p>Invite collaborators to shared notes and schedules.</p>
      </section>

      <form>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" placeholder="name@company.com">
        </div>

        <div class="field">
          <label for="permission">Workspace role</label>
          <select id="permission" name="permission">
            <option selected>Member — can edit</option>
            <option>Viewer — can view</option>
            <option>Admin — can manage access</option>
          </select>
        </div>

        <p class="permission-note">Members edit content. Admins also manage access.</p>
        <button class="invite-button" type="submit">Send invitation</button>
      </form>

      <section class="pending" aria-labelledby="pending-title">
        <div class="pending-heading">
          <h2 id="pending-title">Pending invitations</h2>
          <span class="count">2 pending</span>
        </div>

        <div class="invite-row">
          <div class="invite-details">
            <p class="invite-email">mara.benson@northway.co</p>
            <p class="invite-meta">Member · Sent Apr 9, 2025</p>
          </div>
          <button class="resend" type="button">Resend</button>
        </div>

        <div class="invite-row">
          <div class="invite-details">
            <p class="invite-email">owen.hart@fielddesk.com</p>
            <p class="invite-meta">Viewer · Sent Apr 7, 2025</p>
          </div>
          <button class="resend" type="button">Resend</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
