<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm session cancellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1a17;
    --muted:#6c6a63;
    --rule:#e2e0d9;
    --accent:#f2c410;
    --paper:#ffffff;
  }
  html,body{margin:0;}
  body{
    background:#eceae4;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:var(--paper);
    padding:32px 0;
  }
  .inner{padding:0 28px;}

  .kicker{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .kicker .mark{
    width:22px;
    height:6px;
    border-radius:6px;
    background:var(--accent);
    display:block;
  }

  h1{
    margin:14px 0 0;
    font-size:24px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .lede{
    margin:10px 0 0;
    font-size:15px;
    line-height:1.55;
    color:var(--muted);
    font-weight:400;
  }

  hr{
    border:0;
    border-top:1px solid var(--rule);
    margin:24px 0;
  }

  .person{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mono{
    width:44px;
    height:44px;
    border-radius:6px;
    background:#f0eee7;
    color:var(--ink);
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .who{min-width:0;flex:1 1 auto;}
  .who .name{
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .who .role{
    font-size:13px;
    color:var(--muted);
    line-height:1.4;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .when{
    text-align:right;
    flex:0 0 auto;
  }
  .when .day{font-size:14px;font-weight:500;line-height:1.3;}
  .when .hour{font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px;}

  .note{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13px;
    line-height:1.55;
    color:var(--muted);
  }
  .note svg{flex:0 0 auto;margin-top:1px;}

  .actions{margin-top:24px;}
  .btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    border-radius:6px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
    padding:14px 16px;
    border:1px solid transparent;
    cursor:pointer;
  }
  .btn-primary{
    background:var(--accent);
    color:#1b1a17;
  }
  .btn-secondary{
    background:#fff;
    color:var(--ink);
    border-color:var(--rule);
    margin-top:10px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="inner">
      <div class="kicker"><span class="mark"></span>Booked session</div>

      <h1>Cancel your Thursday strength session?</h1>
      <p class="lede">Your coach will be notified right away, and the slot will be released to the waitlist.</p>

      <hr>

      <div class="person">
        <div class="mono">DR</div>
        <div class="who">
          <div class="name">Dana Reyes</div>
          <div class="role">Strength coach</div>
        </div>
        <div class="when">
          <div class="day">Thu, Mar 14</div>
          <div class="hour">7:30 AM · 45 min</div>
        </div>
      </div>

      <hr>

      <div class="note">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.6" stroke="#6c6a63" stroke-width="1.3"/>
          <path d="M8 4.6V8.4" stroke="#6c6a63" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="8" cy="11" r=".85" fill="#6c6a63"/>
        </svg>
        <div>You are 18 hours out, so no fee applies. Cancellations under 12 hours are charged $20.</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="button">Yes, cancel session</button>
        <button class="btn btn-secondary" type="button">No, keep it</button>
      </div>
    </div>
  </div>
</body>
</html>
