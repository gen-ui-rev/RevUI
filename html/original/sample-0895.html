<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Audio Recording</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7ea;
      color: #17151c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }

    .topbar {
      min-height: 64px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      border-bottom: 1px solid #e8e6eb;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #29262f;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
    }

    .content {
      flex: 1;
      padding: 20px 20px 0;
    }

    .recording-main {
      text-align: center;
    }

    .recording-state {
      margin: 0 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6d35b4;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6d35b4;
    }

    .recording-title {
      margin: 0;
      font-size: 24px;
      line-height: 31px;
      font-weight: 600;
    }

    .trip-name {
      margin: 5px 0 0;
      color: #706b76;
      font-size: 14px;
      line-height: 20px;
    }

    .timer {
      margin: 17px 0 0;
      color: #4f1d8c;
      font-size: 44px;
      line-height: 50px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .waveform {
      height: 116px;
      margin-top: 12px;
      padding: 0 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e8e6eb;
    }

    .waveform span {
      width: 4px;
      height: var(--h);
      min-height: 8px;
      border-radius: 2px;
      background: #7540b9;
    }

    .audio-caption {
      margin: 9px 0 0;
      color: #77717d;
      font-size: 13px;
      line-height: 18px;
    }

    .recording-controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
    }

    .control-button {
      min-height: 54px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 6px;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .control-button svg {
      width: 19px;
      height: 19px;
      flex: none;
    }

    .pause-button {
      border: 1px solid #c9c5ce;
      background: #ffffff;
      color: #302c35;
    }

    .finish-button {
      border: 1px solid #6830aa;
      background: #6830aa;
      color: #ffffff;
    }

    .section {
      margin-top: 24px;
      border-top: 1px solid #dedbe2;
      padding-top: 17px;
    }

    .section-header {
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      margin: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .text-action {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #6830aa;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .detail-row,
    .marker-row {
      min-height: 42px;
      display: grid;
      align-items: center;
      border-bottom: 1px solid #efedf1;
      font-size: 14px;
      line-height: 20px;
    }

    .detail-row {
      grid-template-columns: 88px 1fr;
      gap: 12px;
    }

    .detail-label {
      color: #77717d;
    }

    .detail-value {
      min-width: 0;
      overflow: hidden;
      color: #29262f;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .marker-row {
      grid-template-columns: 58px 1fr;
      gap: 12px;
    }

    .marker-time {
      color: #6830aa;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .marker-label {
      color: #29262f;
    }

    .tabbar {
      min-height: 74px;
      padding: 7px 8px 9px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: stretch;
      border-top: 1px solid #dedbe2;
      background: #ffffff;
    }

    .tab {
      min-width: 0;
      padding: 3px 2px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #77717d;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #6830aa;
      font-weight: 600;
    }

    .tab-active-mark {
      width: 22px;
      height: 3px;
      margin-bottom: 1px;
      border-radius: 2px;
      background: #6830aa;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="topbar-title">Trip audio</h1>
      <button class="icon-button" type="button" aria-label="More options">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="1.7"/>
          <circle cx="19" cy="12" r="1.7"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <section class="recording-main" aria-labelledby="recording-title">
        <p class="recording-state"><span class="state-dot"></span>Recording</p>
        <h2 class="recording-title" id="recording-title">Coastal trail note</h2>
        <p class="trip-name">Juniper Bay weekend</p>
        <p class="timer">04:18</p>

        <div class="waveform" role="img" aria-label="Live audio waveform">
          <span style="--h:20px"></span>
          <span style="--h:34px"></span>
          <span style="--h:48px"></span>
          <span style="--h:26px"></span>
          <span style="--h:62px"></span>
          <span style="--h:82px"></span>
          <span style="--h:42px"></span>
          <span style="--h:30px"></span>
          <span style="--h:70px"></span>
          <span style="--h:94px"></span>
          <span style="--h:54px"></span>
          <span style="--h:36px"></span>
          <span style="--h:74px"></span>
          <span style="--h:46px"></span>
          <span style="--h:28px"></span>
          <span style="--h:58px"></span>
          <span style="--h:88px"></span>
          <span style="--h:68px"></span>
          <span style="--h:40px"></span>
          <span style="--h:24px"></span>
          <span style="--h:50px"></span>
          <span style="--h:78px"></span>
          <span style="--h:102px"></span>
          <span style="--h:64px"></span>
          <span style="--h:38px"></span>
          <span style="--h:72px"></span>
          <span style="--h:90px"></span>
          <span style="--h:48px"></span>
          <span style="--h:32px"></span>
          <span style="--h:58px"></span>
          <span style="--h:84px"></span>
          <span style="--h:66px"></span>
          <span style="--h:44px"></span>
          <span style="--h:76px"></span>
          <span style="--h:52px"></span>
          <span style="--h:30px"></span>
          <span style="--h:62px"></span>
          <span style="--h:38px"></span>
          <span style="--h:24px"></span>
          <span style="--h:46px"></span>
        </div>

        <p class="audio-caption">Microphone audio · High quality</p>

        <div class="recording-controls">
          <button class="control-button pause-button" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1"/>
              <rect x="14" y="5" width="4" height="14" rx="1"/>
            </svg>
            Pause
          </button>
          <button class="control-button finish-button" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="1"/>
            </svg>
            Finish recording
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="details-heading">
        <div class="section-header">
          <h2 class="section-title" id="details-heading">Recording details</h2>
        </div>
        <div class="detail-row">
          <span class="detail-label">Trip</span>
          <span class="detail-value">Juniper Bay weekend</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Place</span>
          <span class="detail-value">North Bluff Trail</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Started</span>
          <span class="detail-value">May 18, 2025 at 2:36 PM</span>
        </div>
      </section>

      <section class="section" aria-labelledby="markers-heading">
        <div class="section-header">
          <h2 class="section-title" id="markers-heading">Markers</h2>
          <button class="text-action" type="button">Add marker</button>
        </div>
        <div class="marker-row">
          <span class="marker-time">01:12</span>
          <span class="marker-label">Trail junction</span>
        </div>
        <div class="marker-row">
          <span class="marker-time">03:47</span>
          <span class="marker-label">Viewpoint access</span>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7.5H10L12 9.5H20V18.5H4V7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4 7.5V5.5H9L11 7.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Trips
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6L9 4L15 6L20 4V18L15 20L9 18L4 20V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M9 4V18M15 6V20" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        Map
      </button>
      <button class="tab active" type="button" aria-current="page">
        <div class="tab-active-mark"></div>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="8" y="3.5" width="8" height="12" rx="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 11.5C5.5 15.1 8.4 18 12 18C15.6 18 18.5 15.1 18.5 11.5M12 18V21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Record
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 4.5H18V20L12 16.5L6 20V4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Saved
      </button>
    </nav>
  </div>
</body>
</html>
