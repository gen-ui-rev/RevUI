<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Course — Amberleaf Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d7d2;
      color: #24221f;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffdf9;
      border: 1px solid #c8c4bc;
    }

    .topbar {
      flex: 0 0 58px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      border-bottom: 1px solid #ded9cf;
      background: #fffdf9;
    }

    .icon-button {
      width: 48px;
      height: 57px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #292722;
      stroke-width: 1.8;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .topbar-title {
      min-width: 0;
      text-align: center;
    }

    .topbar-title strong {
      display: block;
      font-size: 17px;
      line-height: 21px;
      font-weight: 700;
    }

    .topbar-title span {
      display: block;
      margin-top: 1px;
      color: #746f66;
      font-size: 12px;
      line-height: 15px;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 13px 16px 12px;
      background: #fffdf9;
    }

    form {
      margin: 0;
    }

    .course-context {
      padding-bottom: 10px;
      border-bottom: 1px solid #ded9cf;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #a86500;
      font-size: 12px;
      line-height: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .context-line {
      margin: 0;
      color: #5f5a52;
      font-size: 14px;
      line-height: 19px;
    }

    .cover-row {
      display: grid;
      grid-template-columns: 104px 1fr;
      column-gap: 14px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #ded9cf;
    }

    .cover-row img {
      width: 104px;
      height: 72px;
      display: block;
      object-fit: cover;
      background: #d6d0c4;
    }

    .cover-details {
      min-width: 0;
    }

    .cover-details strong {
      display: block;
      margin-bottom: 3px;
      font-size: 14px;
      line-height: 18px;
      font-weight: 500;
    }

    .cover-details p {
      margin: 0 0 6px;
      color: #746f66;
      font-size: 12px;
      line-height: 16px;
    }

    .replace-button {
      padding: 0;
      border: 0;
      border-bottom: 1px solid #bd7800;
      border-radius: 0;
      background: transparent;
      color: #9b6200;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .field {
      padding: 9px 0 7px;
      border-bottom: 1px solid #ded9cf;
    }

    .field label,
    .field-label {
      display: block;
      margin-bottom: 3px;
      color: #746f66;
      font-size: 12px;
      line-height: 15px;
      font-weight: 500;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #24221f;
      font-size: 15px;
      line-height: 21px;
      font-weight: 400;
    }

    .field textarea {
      height: 40px;
      display: block;
      resize: none;
    }

    .field select {
      height: 22px;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #5d584f 50%),
        linear-gradient(135deg, #5d584f 50%, transparent 50%);
      background-position:
        calc(100% - 9px) 9px,
        calc(100% - 4px) 9px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .paired-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 18px;
      border-bottom: 1px solid #ded9cf;
    }

    .paired-fields .field {
      border-bottom: 0;
    }

    .settings-heading {
      margin: 12px 0 1px;
      color: #4a463f;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .setting-row {
      min-height: 49px;
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 16px;
      align-items: center;
      border-bottom: 1px solid #ded9cf;
    }

    .setting-copy {
      min-width: 0;
    }

    .setting-copy strong {
      display: block;
      font-size: 14px;
      line-height: 18px;
      font-weight: 500;
    }

    .setting-copy span {
      display: block;
      margin-top: 1px;
      color: #746f66;
      font-size: 12px;
      line-height: 15px;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      display: block;
      border: 1px solid #9d978d;
      border-radius: 0;
      background: #ebe7df;
    }

    .switch.checked {
      border-color: #c67d00;
      background: #e8a526;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 0;
      background: #ffffff;
      border: 1px solid #817b72;
    }

    .switch.checked::after {
      left: 19px;
      border-color: #8d5900;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
    }

    .save-button {
      width: 100%;
      height: 46px;
      margin-top: 13px;
      border: 1px solid #b97200;
      border-radius: 0;
      background: #e8a526;
      color: #2d210d;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
    }

    .tabbar {
      flex: 0 0 68px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #d8d3ca;
      background: #fffdf9;
    }

    .tab {
      position: relative;
      padding: 8px 2px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #746f66;
      font-size: 12px;
      line-height: 15px;
      font-weight: 500;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .tab.active {
      color: #9b6200;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 18px;
      right: 18px;
      height: 3px;
      background: #e8a526;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 4.5 8 12l7.5 7.5"></path>
        </svg>
      </button>
      <div class="topbar-title">
        <strong>Edit course</strong>
        <span>Amberleaf Learning</span>
      </div>
      <button class="icon-button" type="button" aria-label="More options">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1.2" fill="#292722" stroke="none"></circle>
          <circle cx="12" cy="12" r="1.2" fill="#292722" stroke="none"></circle>
          <circle cx="19" cy="12" r="1.2" fill="#292722" stroke="none"></circle>
        </svg>
      </button>
    </header>

    <main>
      <form>
        <section class="course-context" aria-label="Course status">
          <p class="eyebrow">Published course</p>
          <p class="context-line">Editing existing details · Last updated May 18, 2025</p>
        </section>

        <section class="cover-row" aria-label="Course cover">
          <img src="https://loremflickr.com/104/72/study?lock=10250" width="104" height="72" alt="Open study notebook and learning materials">
          <div class="cover-details">
            <strong>Course cover</strong>
            <p>Shown in search and learner libraries.</p>
            <button class="replace-button" type="button">Replace cover</button>
          </div>
        </section>

        <div class="field">
          <label for="course-title">Course title</label>
          <input id="course-title" type="text" value="Practical English for Work">
        </div>

        <div class="paired-fields">
          <div class="field">
            <label for="language">Language</label>
            <select id="language">
              <option selected>English</option>
              <option>French</option>
              <option>German</option>
            </select>
          </div>
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option>Beginner</option>
              <option selected>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="description">Course description</label>
          <textarea id="description">Build clear workplace speaking skills through short lessons, guided practice, and realistic conversations.</textarea>
        </div>

        <div class="field">
          <label for="instructor">Lead instructor</label>
          <input id="instructor" type="text" value="Riley Bennett">
        </div>

        <h2 class="settings-heading">Learner access</h2>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Course published</strong>
            <span>Available to enrolled learners</span>
          </span>
          <span class="switch checked" aria-hidden="true">
            <input type="checkbox" checked>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Allow lesson downloads</strong>
            <span>Learners can study offline</span>
          </span>
          <span class="switch checked" aria-hidden="true">
            <input type="checkbox" checked>
          </span>
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <strong>Completion certificate</strong>
            <span>Issued after all 12 lessons</span>
          </span>
          <span class="switch" aria-hidden="true">
            <input type="checkbox">
          </span>
        </label>

        <button class="save-button" type="submit">Save changes</button>
      </form>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5h6.5c1 0 1.5.6 1.5 1.5v12c0-.9-.6-1.5-1.5-1.5H4z"></path>
          <path d="M20 5.5h-6.5c-1 0-1.5.6-1.5 1.5v12c0-.9.6-1.5 1.5-1.5H20z"></path>
        </svg>
        <span>Learn</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v16H5z"></path>
          <path d="M8 8h8M8 12h8M8 16h5"></path>
        </svg>
        <span>Library</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 8.5 9-4 9 4-9 4z"></path>
          <path d="M6.5 10.2v5.3c2.8 2.3 8.2 2.3 11 0v-5.3"></path>
          <path d="M21 8.5v6"></path>
        </svg>
        <span>Teaching</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"></path>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
