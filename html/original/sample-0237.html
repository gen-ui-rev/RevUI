<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Workout Suggestions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e6e2;
      color: #302b2a;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 24px;
      background: #fbfaf8;
    }

    .suggestions {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #ad342f;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #a82f2b;
      font-size: 29px;
      font-weight: 700;
      line-height: 35px;
    }

    .intro {
      margin: 5px 0 0;
      color: #665d5a;
      font-size: 15px;
      line-height: 21px;
    }

    .primary-card {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: #f7e5e3;
    }

    .primary-card img {
      width: 318px;
      height: 112px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #dcc9c5;
    }

    .primary-copy {
      margin-top: 10px;
    }

    .primary-copy h2 {
      margin: 0;
      color: #322b2a;
      font-size: 21px;
      font-weight: 600;
      line-height: 27px;
    }

    .details {
      margin: 2px 0 0;
      color: #6c615f;
      font-size: 14px;
      line-height: 20px;
    }

    .session-link {
      display: inline-block;
      margin-top: 10px;
      color: #a82f2b;
      font-size: 15px;
      font-weight: 600;
      line-height: 21px;
      text-decoration: none;
    }

    .more {
      margin-top: 18px;
    }

    .more h2 {
      margin: 0;
      color: #3d3634;
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
    }

    .suggestion-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .suggestion-row {
      display: flex;
      align-items: center;
      border-radius: 6px;
      background: #faecea;
    }

    .suggestion-row img {
      width: 72px;
      height: 64px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #dcc9c5;
    }

    .row-copy {
      min-width: 0;
      padding: 8px 12px;
    }

    .row-title {
      margin: 0;
      overflow: hidden;
      color: #393230;
      font-size: 17px;
      font-weight: 600;
      line-height: 23px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-meta {
      margin: 1px 0 0;
      color: #746966;
      font-size: 14px;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="suggestions" aria-labelledby="recovery-title">
      <header>
        <p class="eyebrow">Cedar Pulse suggestion</p>
        <h1 id="recovery-title">Choose a gentle workout</h1>
        <p class="intro">Low-impact sessions for your recent training.</p>
      </header>

      <article class="primary-card">
        <img src="https://loremflickr.com/318/112/gym?lock=3770" width="318" height="112" alt="Exercise mat and light equipment in a quiet gym">
        <div class="primary-copy">
          <h2>Full-body mobility reset</h2>
          <p class="details">24 min · Easy pace · No equipment</p>
          <a class="session-link" href="#">View 24-minute session</a>
        </div>
      </article>

      <section class="more" aria-labelledby="more-title">
        <h2 id="more-title">More gentle options</h2>
        <div class="suggestion-list">
          <article class="suggestion-row">
            <img src="https://loremflickr.com/72/64/running?lock=3771" width="72" height="64" alt="Runner moving at an easy pace outdoors">
            <div class="row-copy">
              <p class="row-title">Easy walk and stretch</p>
              <p class="row-meta">18 min · Low impact</p>
            </div>
          </article>

          <article class="suggestion-row">
            <img src="https://loremflickr.com/72/64/gym?lock=3772" width="72" height="64" alt="Light weights arranged on a gym floor">
            <div class="row-copy">
              <p class="row-title">Light strength basics</p>
              <p class="row-meta">20 min · Light weights</p>
            </div>
          </article>
        </div>
      </section>
    </section>
  </div>
</body>
</html>
