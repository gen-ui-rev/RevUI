<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Listening Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8e8;
      color: #292427;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 22px;
      background: #f8f6f6;
    }

    .progress-card {
      width: 100%;
      padding: 24px;
      border: 1px solid #ded8da;
      border-radius: 6px;
      background: #ffffff;
    }

    .progress-card h1 {
      margin: 0;
      color: #2b2528;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .period {
      margin: 7px 0 0;
      color: #756c70;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .ring-wrap {
      position: relative;
      width: 164px;
      margin: 26px auto 24px;
    }

    .ring {
      display: block;
      width: 164px;
      height: 164px;
    }

    .ring-track {
      fill: none;
      stroke: #eee9eb;
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: #c94f6d;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 68 100;
      transform: rotate(-90deg);
      transform-origin: 82px 82px;
    }

    .ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .percentage {
      color: #c94f6d;
      font-size: 36px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .current-value {
      margin-top: 9px;
      color: #62595d;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
    }

    .goal-details {
      padding-top: 20px;
      border-top: 1px solid #e4dfe1;
      text-align: center;
    }

    .remaining {
      margin: 0;
      color: #332d30;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }

    .reset {
      margin: 5px 0 0;
      color: #7b7276;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="progress-card" aria-labelledby="goal-title">
      <h1 id="goal-title">Weekly listening goal</h1>
      <p class="period">Monday through Sunday</p>

      <div class="ring-wrap" role="progressbar" aria-label="Weekly listening goal progress" aria-valuemin="0" aria-valuemax="300" aria-valuenow="204" aria-valuetext="204 of 300 minutes">
        <svg class="ring" viewBox="0 0 164 164" aria-hidden="true">
          <circle class="ring-track" cx="82" cy="82" r="70"></circle>
          <circle class="ring-progress" cx="82" cy="82" r="70" pathLength="100"></circle>
        </svg>
        <div class="ring-content">
          <div class="percentage">68%</div>
          <div class="current-value">204 of 300 min</div>
        </div>
      </div>

      <div class="goal-details">
        <p class="remaining">96 minutes remaining</p>
        <p class="reset">Goal resets Sunday at 12:00 AM</p>
      </div>
    </main>
  </div>
</body>
</html>
