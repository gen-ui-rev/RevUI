<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transfer complete — Meridian Bank</title>
<style>
  html,body{margin:0;padding:0;}
  body{
    background:#d9dade;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    position:relative;
    width:390px;
    height:844px;
    background:#ffffff;
    color:#14161c;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px 16px;
    border-bottom:1px solid #e6e7eb;
  }
  .topbar .name{
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .topbar .done{
    font-size:15px;
    font-weight:600;
    color:#4338ca;
  }

  .hero{
    padding:44px 24px 0;
  }
  .mark{
    width:60px;
    height:60px;
    background:#4338ca;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    margin:24px 0 0;
    font-size:28px;
    line-height:34px;
    font-weight:600;
    letter-spacing:-.02em;
  }
  .sub{
    margin:10px 0 0;
    font-size:15px;
    line-height:22px;
    color:#6b7280;
    max-width:300px;
  }
  .sub strong{
    color:#14161c;
    font-weight:600;
  }

  .details{
    margin:32px 24px 0;
    border-top:1px solid #e6e7eb;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #e6e7eb;
  }
  .row .label{
    font-size:14px;
    color:#6b7280;
  }
  .row .value{
    font-size:14px;
    font-weight:600;
    max-width:210px;
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .goal{
    margin-top:36px;
  }
  .goal img{
    display:block;
    width:390px;
    height:150px;
    object-fit:cover;
    background:#c7c9d1;
  }
  .goal-body{
    padding:18px 24px 0;
  }
  .goal-kicker{
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#6b7280;
    font-weight:600;
  }
  .goal-name{
    margin-top:8px;
    font-size:17px;
    font-weight:600;
  }
  .bar{
    margin-top:14px;
    height:6px;
    width:100%;
    background:#e6e7eb;
  }
  .bar span{
    display:block;
    height:6px;
    width:68%;
    background:#4338ca;
  }
  .bar-meta{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#6b7280;
  }
  .bar-meta b{
    color:#14161c;
    font-weight:600;
  }

  .tabbar{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    display:flex;
    border-top:1px solid #e6e7eb;
    background:#ffffff;
  }
  .tab{
    flex:1;
    padding:12px 0 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:#8a8f9a;
  }
  .tab.active{
    color:#4338ca;
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="name">Meridian</div>
      <div class="done">Done</div>
    </div>

    <div class="hero">
      <div class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M4 12.5 L9.5 18 L20 6.5"/>
        </svg>
      </div>
      <h1>Transfer complete</h1>
      <p class="sub"><strong>$1,250.00</strong> moved from Everyday Checking to your down payment fund.</p>
    </div>

    <div class="details">
      <div class="row">
        <div class="label">Confirmation</div>
        <div class="value">MB-4820-7715</div>
      </div>
      <div class="row">
        <div class="label">From</div>
        <div class="value">Everyday Checking 4417</div>
      </div>
      <div class="row">
        <div class="label">Posted</div>
        <div class="value">March 14, 2024, 9:42 AM</div>
      </div>
    </div>

    <div class="goal">
      <img src="https://loremflickr.com/390/150/city?lock=10743" width="390" height="150" alt="Apartment buildings in the neighborhood saved for by this goal">
      <div class="goal-body">
        <div class="goal-kicker">Goal updated</div>
        <div class="goal-name">Apartment down payment</div>
        <div class="bar"><span></span></div>
        <div class="bar-meta">
          <div><b>$34,200</b> saved of $50,000</div>
          <div>68%</div>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square">
          <path d="M4 10.5 12 4l8 6.5V20H4z"/>
        </svg>
        Home
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square">
          <path d="M4 9h13M13 5l4 4-4 4"/>
          <path d="M20 15H7M11 19l-4-4 4-4"/>
        </svg>
        Move
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square">
          <path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/>
        </svg>
        Goals
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
          <path d="M4.5 20c1.6-3.3 4.3-5 7.5-5s5.9 1.7 7.5 5"/>
        </svg>
        Profile
      </div>
    </nav>

  </div>
</body>
</html>
