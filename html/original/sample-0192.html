<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8eae5;
      color: #1d211b;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 24px 18px;
      background: #f4f5f1;
    }

    .create-panel {
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d9ddd5;
      border-radius: 14px;
    }

    .header {
      margin-bottom: 20px;
    }

    .context {
      display: inline-block;
      margin-bottom: 7px;
      color: #5e741f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #687064;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .name-field {
      margin-bottom: 16px;
    }

    label,
    .row-label {
      color: #4f574c;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .name-input {
      width: 100%;
      margin-top: 6px;
      padding: 11px 13px;
      color: #20251e;
      background: #fbfcf9;
      border: 1px solid #9fcf3c;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
      line-height: 22px;
      font-weight: 400;
    }

    .settings {
      margin: 0;
      padding: 0;
      border: 1px solid #d9ddd5;
      border-radius: 14px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid #e3e6df;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .select-wrap {
      position: relative;
      min-width: 0;
    }

    .setting-select {
      width: 100%;
      margin: 0;
      padding: 0 22px 0 0;
      color: #20251e;
      background: transparent;
      border: 0;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      text-align: right;
      text-align-last: right;
      white-space: nowrap;
      cursor: pointer;
    }

    .select-wrap svg {
      position: absolute;
      top: 50%;
      right: 0;
      width: 16px;
      height: 16px;
      color: #7d8579;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .submit-button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 16px;
      color: #1b2312;
      background: #b9ed55;
      border: 1px solid #9dce3f;
      border-radius: 14px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <form class="create-panel">
      <header class="header">
        <span class="context">New project</span>
        <h1>Create a project</h1>
        <p class="subtitle">Set up a shared project for your team.</p>
      </header>

      <div class="name-field">
        <label for="project-name">Project name</label>
        <input class="name-input" id="project-name" name="project-name" type="text" value="Product launch plan">
      </div>

      <div class="settings">
        <div class="setting-row">
          <label class="row-label" for="workspace">Workspace</label>
          <div class="select-wrap">
            <select class="setting-select" id="workspace" name="workspace">
              <option selected>Northstar Team</option>
              <option>Research Group</option>
              <option>Operations Team</option>
            </select>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="setting-row">
          <label class="row-label" for="lead">Project lead</label>
          <div class="select-wrap">
            <select class="setting-select" id="lead" name="lead">
              <option selected>Jordan Vale</option>
              <option>Morgan Reed</option>
              <option>Casey North</option>
            </select>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="setting-row">
          <label class="row-label" for="visibility">Visibility</label>
          <div class="select-wrap">
            <select class="setting-select" id="visibility" name="visibility">
              <option selected>Workspace members</option>
              <option>Project members</option>
              <option>Private</option>
            </select>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="setting-row">
          <label class="row-label" for="start-date">Start date</label>
          <div class="select-wrap">
            <select class="setting-select" id="start-date" name="start-date">
              <option selected>Jun 16, 2025</option>
              <option>Jun 23, 2025</option>
              <option>Jul 1, 2025</option>
            </select>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>

      <button class="submit-button" type="submit">Create project</button>
    </form>
  </div>
</body>
</html>
