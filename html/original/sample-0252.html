<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Movement Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9ebef;
      color: #20212a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 28px;
      background: #fafafa;
    }

    .component {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5146d9;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #20212a;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 0;
      color: #676975;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.55;
    }

    .progress-wrap {
      position: relative;
      width: 184px;
      margin: 28px auto 0;
    }

    .progress-ring {
      display: block;
      width: 184px;
      height: 184px;
    }

    .track {
      fill: none;
      stroke: #e4e4eb;
      stroke-width: 12;
    }

    .value {
      fill: none;
      stroke: #5146d9;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 68 100;
    }

    .ring-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percentage {
      color: #20212a;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .ring-label {
      margin-top: 7px;
      color: #676975;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .goal-details {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #dedfe5;
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .detail {
      min-width: 0;
    }

    .detail:last-child {
      text-align: right;
    }

    .detail-label {
      margin: 0 0 4px;
      color: #777985;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .detail-value {
      margin: 0;
      color: #282934;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="goal-title">
      <header>
        <p class="eyebrow">Weekly activity</p>
        <h1 id="goal-title">Movement goal</h1>
        <p class="intro">102 of 150 active minutes completed.</p>
      </header>

      <div class="progress-wrap" role="img" aria-label="68 percent of weekly movement goal completed">
        <svg class="progress-ring" viewBox="0 0 184 184" aria-hidden="true">
          <circle class="track" cx="92" cy="92" r="78"></circle>
          <circle class="value" cx="92" cy="92" r="78" pathLength="100" transform="rotate(-90 92 92)"></circle>
        </svg>
        <div class="ring-copy">
          <span class="percentage">68%</span>
          <span class="ring-label">goal complete</span>
        </div>
      </div>

      <div class="goal-details">
        <div class="detail">
          <p class="detail-label">Remaining</p>
          <p class="detail-value">48 active min</p>
        </div>
        <div class="detail">
          <p class="detail-label">Goal ends</p>
          <p class="detail-value">Sunday</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
