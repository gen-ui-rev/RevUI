<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayloom Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedad5;
      color: #292724;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #faf9f7;
      border: 1px solid #cbc5be;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid #ded9d3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #292724;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      color: #8c7d70;
      flex: 0 0 auto;
    }

    .sign-in {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 15px;
      border: 1px solid #cfc8c1;
      border-radius: 14px;
      color: #4d4843;
      background: transparent;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    main {
      flex: 1;
      padding: 112px 28px 0;
    }

    .hero {
      max-width: 334px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #806f62;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #292724;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 24px 0 0;
      max-width: 318px;
      color: #68615b;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
    }

    .primary-action {
      width: 100%;
      min-height: 56px;
      margin-top: 34px;
      padding: 0 18px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #8c7d70;
      border-radius: 14px;
      background: #8c7d70;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .primary-action svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .setup-note {
      margin: 13px 0 0;
      color: #817a74;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .footer {
      padding: 20px 28px 24px;
      border-top: 1px solid #ded9d3;
      color: #7a746e;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .footer a {
      color: #5e5751;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <div class="brand" aria-label="Dayloom">
        <svg class="brand-mark" viewBox="0 0 25 25" fill="none" aria-hidden="true">
          <rect x="2.5" y="2.5" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <rect x="13.5" y="13.5" width="9" height="9" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M11.5 7H15.5C17.433 7 19 8.567 19 10.5V13.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Dayloom</span>
      </div>
      <a class="sign-in" href="#">Sign in</a>
    </header>

    <main>
      <section class="hero" aria-labelledby="welcome-title">
        <p class="eyebrow">Work, brought together</p>
        <h1 id="welcome-title">Your team’s next step, in one place.</h1>
        <p class="intro">Turn notes, decisions, and weekly priorities into a shared plan everyone can follow.</p>
        <a class="primary-action" href="#">
          <span>Create a workspace</span>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10H16M11.5 5.5L16 10L11.5 14.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <p class="setup-note">Free to start. No credit card required.</p>
      </section>
    </main>

    <footer class="footer">
      By continuing, you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </footer>
  </div>
</body>
</html>
