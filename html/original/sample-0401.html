<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Credit</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e7e9ec;
      color: #25282d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 18px;
      background: #eef0f2;
    }

    .rewards-card {
      width: 100%;
      padding: 14px 16px 16px;
      background: #ffffff;
      border-top: 4px solid #d99a18;
      border-radius: 6px;
      box-shadow: 0 5px 18px rgba(31, 35, 40, 0.09);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #9a6810;
      font-size: 12px;
      font-weight: 600;
      line-height: 17px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202328;
      font-size: 25px;
      font-weight: 600;
      line-height: 30px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 0;
      color: #62676f;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .hero {
      width: 322px;
      height: 82px;
      margin-top: 14px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      background: #d8dadd;
    }

    .credit-box {
      margin-top: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff5dd;
      border: 1px solid #efd59a;
      border-radius: 6px;
    }

    .credit-copy {
      min-width: 0;
    }

    .credit-amount {
      margin: 0;
      color: #6f4800;
      font-size: 28px;
      font-weight: 600;
      line-height: 31px;
    }

    .credit-label {
      margin: 2px 0 0;
      color: #705a31;
      font-size: 14px;
      font-weight: 400;
      line-height: 18px;
    }

    .apply-button {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid #bd7f08;
      border-radius: 6px;
      background: #d99a18;
      color: #2d2108;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 18px;
    }

    .offers {
      margin-top: 18px;
    }

    .offers h2 {
      margin: 0 0 7px;
      color: #30343a;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }

    .offer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-top: 1px solid #e3e5e8;
    }

    .offer-details {
      min-width: 0;
    }

    .offer-name {
      margin: 0;
      color: #30343a;
      font-size: 14px;
      font-weight: 600;
      line-height: 19px;
    }

    .offer-meta {
      margin: 2px 0 0;
      color: #777c84;
      font-size: 12px;
      font-weight: 400;
      line-height: 17px;
    }

    .offer-value {
      flex: 0 0 auto;
      margin: 0;
      color: #9a6810;
      font-size: 14px;
      font-weight: 600;
      line-height: 19px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="rewards-card" aria-labelledby="credit-title">
      <p class="eyebrow">Draftlane plan benefit</p>
      <h1 id="credit-title">Apply your renewal credit</h1>
      <p class="intro">Use it for your team’s annual plan before June 30, 2026.</p>

      <img
        class="hero"
        src="https://loremflickr.com/322/82/workspace?lock=5630"
        width="322"
        height="82"
        alt="A shared workspace with notebooks and planning materials"
      >

      <section class="credit-box" aria-label="Renewal credit">
        <div class="credit-copy">
          <p class="credit-amount">$24</p>
          <p class="credit-label">Annual plan credit</p>
        </div>
        <button class="apply-button" type="button">Apply credit</button>
      </section>

      <section class="offers" aria-labelledby="offers-title">
        <h2 id="offers-title">Other available offers</h2>

        <div class="offer-row">
          <div class="offer-details">
            <p class="offer-name">Meeting notes add-on</p>
            <p class="offer-meta">Code FOCUS8 · Expires July 15</p>
          </div>
          <p class="offer-value">$8 off</p>
        </div>

        <div class="offer-row">
          <div class="offer-details">
            <p class="offer-name">Guest collaborator seats</p>
            <p class="offer-meta">Applied automatically at checkout</p>
          </div>
          <p class="offer-value">15% off</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
