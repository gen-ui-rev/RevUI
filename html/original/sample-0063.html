<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Workout Photo — Pulseyard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e4e5;
      color: #231f21;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 0;
    }

    .topbar {
      min-height: 56px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      border-bottom: 1px solid #ded9db;
      background: #ffffff;
    }

    .topbar button {
      min-height: 44px;
      font-size: 14px;
      font-weight: 500;
    }

    .cancel {
      text-align: left;
      color: #60595c;
    }

    .done {
      text-align: right;
      color: #bd315d;
      font-weight: 700 !important;
    }

    .title-wrap {
      min-width: 0;
      text-align: center;
    }

    .title {
      margin: 0;
      overflow: hidden;
      color: #231f21;
      font-size: 16px;
      font-weight: 700;
      line-height: 22px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview {
      min-height: 378px;
      padding-top: 14px;
      background: #181617;
      color: #d8d2d4;
    }

    .image-stage {
      position: relative;
      width: 326px;
      height: 326px;
      margin: 0 auto;
      background: #393536;
    }

    .image-stage img {
      width: 326px;
      height: 326px;
      display: block;
      object-fit: cover;
      background: #393536;
    }

    .shade {
      position: absolute;
      background: rgba(15, 12, 13, 0.56);
      pointer-events: none;
    }

    .shade-top {
      top: 0;
      left: 0;
      width: 326px;
      height: 40px;
    }

    .shade-bottom {
      top: 286px;
      left: 0;
      width: 326px;
      height: 40px;
    }

    .shade-left {
      top: 40px;
      left: 0;
      width: 33px;
      height: 246px;
    }

    .shade-right {
      top: 40px;
      right: 0;
      width: 33px;
      height: 246px;
    }

    .crop-frame {
      position: absolute;
      top: 40px;
      left: 33px;
      width: 260px;
      height: 246px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    .grid-v,
    .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.46);
    }

    .grid-v {
      top: 0;
      width: 1px;
      height: 100%;
    }

    .grid-v.one {
      left: 33.333%;
    }

    .grid-v.two {
      left: 66.666%;
    }

    .grid-h {
      left: 0;
      width: 100%;
      height: 1px;
    }

    .grid-h.one {
      top: 33.333%;
    }

    .grid-h.two {
      top: 66.666%;
    }

    .handle {
      position: absolute;
      width: 20px;
      height: 20px;
    }

    .handle::before,
    .handle::after {
      position: absolute;
      content: "";
      background: #cf3d69;
    }

    .handle::before {
      width: 20px;
      height: 3px;
    }

    .handle::after {
      width: 3px;
      height: 20px;
    }

    .handle.tl {
      top: -2px;
      left: -2px;
    }

    .handle.tr {
      top: -2px;
      right: -2px;
      transform: rotate(90deg);
    }

    .handle.br {
      right: -2px;
      bottom: -2px;
      transform: rotate(180deg);
    }

    .handle.bl {
      bottom: -2px;
      left: -2px;
      transform: rotate(270deg);
    }

    .preview-help {
      margin: 0;
      padding: 10px 16px 0;
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
      text-align: center;
    }

    .crop-panel {
      min-height: 344px;
      background: #ffffff;
    }

    .panel-heading {
      min-height: 42px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e0e2;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
    }

    .reset {
      min-height: 40px;
      color: #8a8184;
      font-size: 13px;
      font-weight: 500;
    }

    .aspect-row {
      min-height: 62px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e5e0e2;
    }

    .row-label {
      width: 72px;
      flex: 0 0 72px;
      font-size: 14px;
      font-weight: 500;
    }

    .aspect-options {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .aspect-option {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #d6cfd2;
      color: #5d5558;
      font-size: 12px;
      font-weight: 500;
    }

    .aspect-option.selected {
      border-color: #bd315d;
      background: #bd315d;
      color: #ffffff;
      font-weight: 700;
    }

    .control-row {
      min-height: 56px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 108px 1fr 42px;
      align-items: center;
      column-gap: 10px;
      border-bottom: 1px solid #e5e0e2;
    }

    .control-name {
      font-size: 14px;
      font-weight: 500;
    }

    .control-value {
      color: #6f6669;
      font-size: 13px;
      font-weight: 500;
      text-align: right;
    }

    .slider {
      position: relative;
      height: 22px;
    }

    .slider-track {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #d8d1d4;
    }

    .slider-fill {
      position: absolute;
      top: 10px;
      left: 50%;
      height: 2px;
      background: #bd315d;
    }

    .slider-thumb {
      position: absolute;
      top: 4px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border: 3px solid #bd315d;
      border-radius: 0;
      background: #ffffff;
    }

    .straighten .slider-fill {
      width: 8%;
    }

    .straighten .slider-thumb {
      left: 58%;
    }

    .horizontal .slider-fill {
      width: 0;
    }

    .horizontal .slider-thumb {
      left: 50%;
    }

    .vertical .slider-fill {
      left: 44%;
      width: 6%;
    }

    .vertical .slider-thumb {
      left: 44%;
    }

    .transform-row {
      min-height: 72px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .transform-button {
      min-height: 72px;
      padding: 0 8px;
      border-right: 1px solid #e5e0e2;
      color: #4d4648;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      text-align: center;
    }

    .transform-button:last-child {
      border-right: 0;
    }

    .tool-tabs {
      min-height: 66px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid #d8d2d4;
      background: #fbfafb;
    }

    .tool-tab {
      position: relative;
      min-height: 66px;
      color: #746b6e;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    .tool-tab.active {
      color: #bd315d;
      font-weight: 700;
    }

    .tool-tab.active::before {
      position: absolute;
      top: -1px;
      left: 16px;
      right: 16px;
      height: 3px;
      content: "";
      background: #bd315d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="cancel" type="button">Cancel</button>
      <div class="title-wrap">
        <h1 class="title">Edit workout photo</h1>
      </div>
      <button class="done" type="button">Done</button>
    </header>

    <main>
      <section class="preview" aria-label="Workout photo crop preview">
        <div class="image-stage">
          <img src="https://loremflickr.com/326/326/running?lock=1810" width="326" height="326" alt="Runner training on an outdoor path">
          <div class="shade shade-top"></div>
          <div class="shade shade-bottom"></div>
          <div class="shade shade-left"></div>
          <div class="shade shade-right"></div>
          <div class="crop-frame" aria-hidden="true">
            <span class="grid-v one"></span>
            <span class="grid-v two"></span>
            <span class="grid-h one"></span>
            <span class="grid-h two"></span>
            <span class="handle tl"></span>
            <span class="handle tr"></span>
            <span class="handle br"></span>
            <span class="handle bl"></span>
          </div>
        </div>
        <p class="preview-help">Drag to reposition · Pinch to zoom</p>
      </section>

      <section class="crop-panel" aria-labelledby="crop-heading">
        <div class="panel-heading">
          <h2 id="crop-heading">Crop</h2>
          <button class="reset" type="button">Reset</button>
        </div>

        <div class="aspect-row">
          <span class="row-label">Aspect</span>
          <div class="aspect-options" aria-label="Aspect ratio">
            <button class="aspect-option" type="button">Original</button>
            <button class="aspect-option selected" type="button">1:1</button>
            <button class="aspect-option" type="button">4:5</button>
            <button class="aspect-option" type="button">16:9</button>
          </div>
        </div>

        <div class="control-row straighten">
          <span class="control-name">Straighten</span>
          <div class="slider" aria-label="Straighten set to positive 2.4 degrees">
            <span class="slider-track"></span>
            <span class="slider-fill"></span>
            <span class="slider-thumb"></span>
          </div>
          <span class="control-value">+2.4°</span>
        </div>

        <div class="control-row horizontal">
          <span class="control-name">Horizontal</span>
          <div class="slider" aria-label="Horizontal perspective set to zero">
            <span class="slider-track"></span>
            <span class="slider-fill"></span>
            <span class="slider-thumb"></span>
          </div>
          <span class="control-value">0</span>
        </div>

        <div class="control-row vertical">
          <span class="control-name">Vertical</span>
          <div class="slider" aria-label="Vertical perspective set to negative 6">
            <span class="slider-track"></span>
            <span class="slider-fill"></span>
            <span class="slider-thumb"></span>
          </div>
          <span class="control-value">−6</span>
        </div>

        <div class="transform-row" aria-label="Image orientation controls">
          <button class="transform-button" type="button">Rotate left</button>
          <button class="transform-button" type="button">Flip horizontal</button>
          <button class="transform-button" type="button">Flip vertical</button>
        </div>
      </section>
    </main>

    <nav class="tool-tabs" aria-label="Photo editing tools">
      <button class="tool-tab active" type="button" aria-current="page">Crop</button>
      <button class="tool-tab" type="button">Adjust</button>
      <button class="tool-tab" type="button">Filters</button>
      <button class="tool-tab" type="button">Stickers</button>
    </nav>
  </div>
</body>
</html>
