<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Kinfield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d8d1;
      color: #25261f;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfaf5;
      border: 1px solid #c9c8c0;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid #deddd5;
    }

    .back-button {
      width: 44px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #25261f;
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
    }

    .service-name {
      margin: 0;
      text-align: center;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .help-link {
      justify-self: end;
      color: #5e6524;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-decoration: none;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0 24px;
      border-bottom: 1px solid #deddd5;
    }

    .tab {
      position: relative;
      padding: 16px 8px 15px;
      color: #72736b;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .tab.active {
      color: #59601f;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: -1px;
      left: 18px;
      height: 3px;
      background: #747b2e;
    }

    main {
      flex: 1;
      padding: 46px 24px 24px;
    }

    .recovery-section {
      width: 100%;
    }

    h1 {
      max-width: 310px;
      margin: 0;
      color: #30331d;
      font-size: 36px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .intro {
      max-width: 326px;
      margin: 18px 0 34px;
      color: #65665e;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 400;
    }

    .form-group {
      margin: 0;
    }

    label {
      display: block;
      margin: 0 0 9px;
      color: #37382f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #a8aa9c;
      border-radius: 14px;
      outline: none;
      background: #fffef9;
      color: #25261f;
      font-size: 16px;
      line-height: 1.5;
    }

    input::placeholder {
      color: #8a8b82;
      opacity: 1;
    }

    .send-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: 1px solid #666d25;
      border-radius: 14px;
      background: #747b2e;
      color: #fffef7;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .note {
      margin: 15px 0 0;
      color: #74756d;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .footer {
      padding: 18px 24px 22px;
      border-top: 1px solid #deddd5;
      color: #686961;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .footer a {
      color: #59601f;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="service-name">Kinfield</p>
      <a class="help-link" href="#">Help</a>
    </header>

    <nav class="tab-bar" aria-label="Account access">
      <a class="tab" href="#">Sign in</a>
      <a class="tab active" href="#" aria-current="page">Reset password</a>
    </nav>

    <main>
      <section class="recovery-section" aria-labelledby="recovery-title">
        <h1 id="recovery-title">Reset your password</h1>
        <p class="intro">
          Enter the email linked to your Kinfield account. We’ll send a secure link to choose a new password.
        </p>

        <form>
          <div class="form-group">
            <label for="email">Account email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com">
          </div>
          <button class="send-button" type="submit">Send reset link</button>
          <p class="note">The link will expire 30 minutes after it is sent.</p>
        </form>
      </section>
    </main>

    <footer class="footer">
      Remembered your password? <a href="#">Return to sign in</a>
    </footer>
  </div>
</body>
</html>
