<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Movement Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd5;
      color: #292824;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #f1efe9;
    }

    .widget {
      width: 100%;
      aspect-ratio: 19 / 10;
      padding: 18px;
      border: 1px solid #d2cec5;
      border-radius: 4px;
      background: #fffefa;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .widget-header,
    .metric-row,
    .progress-notes {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .widget-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }

    .widget-date {
      color: #767168;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }

    .metric-row {
      align-items: flex-end;
    }

    .metric {
      color: #d95f16;
      font-size: 34px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -1.2px;
    }

    .metric-context {
      margin-top: 5px;
      color: #67635b;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 400;
    }

    .completion {
      padding-bottom: 3px;
      color: #d95f16;
      font-size: 18px;
      line-height: 1;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      margin-top: 13px;
      border-radius: 4px;
      background: #e6e2da;
    }

    .progress-fill {
      width: 80%;
      height: 100%;
      border-radius: 4px;
      background: #d95f16;
    }

    .progress-notes {
      margin-top: 7px;
      color: #767168;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="widget" aria-labelledby="movement-title">
      <div class="widget-header">
        <h1 class="widget-title" id="movement-title">Today’s movement</h1>
        <span class="widget-date">May 14</span>
      </div>

      <div>
        <div class="metric-row">
          <div>
            <div class="metric">6,420</div>
            <div class="metric-context">of 8,000 steps</div>
          </div>
          <div class="completion">80%</div>
        </div>

        <div class="progress-track" role="progressbar" aria-label="Daily step goal" aria-valuemin="0" aria-valuemax="8000" aria-valuenow="6420">
          <div class="progress-fill"></div>
        </div>

        <div class="progress-notes">
          <span>1,580 steps left</span>
          <span>Morrow Health</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
