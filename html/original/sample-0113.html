<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Gathering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e9e7;
      color: #17211d;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px;
      background: #fbfcfb;
    }

    .component {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #087a57;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .intro {
      margin: 12px 0 24px;
      color: #5c6762;
      font-size: 14px;
      line-height: 1.55;
    }

    .gathering {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 0;
      border-top: 1px solid #dce2df;
      border-bottom: 1px solid #dce2df;
    }

    .gathering img {
      width: 80px;
      height: 80px;
      flex: 0 0 80px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #d8dedb;
    }

    .gathering-copy {
      min-width: 0;
    }

    .gathering-title {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    .gathering-meta {
      margin: 0;
      color: #5c6762;
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      margin: 20px 0 0;
      color: #34413b;
      font-size: 14px;
      line-height: 1.55;
    }

    .notice strong {
      color: #087a57;
      font-weight: 700;
    }

    .actions {
      margin-top: 24px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }

    .primary {
      border: 1px solid #087a57;
      background: #087a57;
      color: #ffffff;
    }

    .secondary {
      border: 1px solid #cbd3cf;
      background: transparent;
      color: #26312c;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="cancel-title">
      <p class="eyebrow">Gathering scheduled</p>
      <h1 id="cancel-title">Cancel this gathering?</h1>
      <p class="intro">The 8 attending members will be notified that the plan has been canceled.</p>

      <div class="gathering">
        <img src="https://loremflickr.com/80/80/cafe?lock=2370" width="80" height="80" alt="A café table prepared for the neighborhood gathering">
        <div class="gathering-copy">
          <p class="gathering-title">Coffee and New Neighbors</p>
          <p class="gathering-meta">Saturday, June 21<br>10:30 AM · Juniper Café</p>
        </div>
      </div>

      <p class="notice"><strong>This will not delete it.</strong> The gathering will remain in Minglefield history with a canceled label.</p>

      <div class="actions">
        <button class="primary" type="button">Cancel gathering</button>
        <button class="secondary" type="button">Keep gathering</button>
      </div>
    </main>
  </div>
</body>
</html>
