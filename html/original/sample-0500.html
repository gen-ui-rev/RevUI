<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kernote Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e1;
      color: #292524;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      margin: 0;
      padding: 0;
      border-radius: 0;
      font: inherit;
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #faf9f7;
      border: 1px solid #d6d3cf;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid #dedbd6;
      background: #faf9f7;
    }

    .topbar-button {
      width: 32px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #57534e;
    }

    .topbar-button:last-child {
      justify-self: end;
    }

    .topbar-title {
      min-width: 0;
      text-align: center;
    }

    .product-name {
      margin: 0;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      color: #292524;
    }

    .view-name {
      margin: 1px 0 0;
      font-size: 12px;
      line-height: 16px;
      color: #78716c;
    }

    .topbar svg,
    .control-button svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    .call-content {
      flex: 1;
      min-height: 0;
      padding: 20px 20px 16px;
    }

    .call-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: #78716c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-mark {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      background: #78716c;
    }

    .call-title {
      margin: 0;
      font-size: 24px;
      line-height: 31px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #292524;
    }

    .call-meta {
      margin: 3px 0 0;
      font-size: 14px;
      line-height: 21px;
      color: #78716c;
    }

    .speaker-stage {
      width: 100%;
      height: 260px;
      margin-top: 16px;
      border: 2px solid #78716c;
      background: #cbc6bd;
    }

    .speaker-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid #dedbd6;
    }

    .speaker-info {
      min-width: 0;
    }

    .speaker-name {
      margin: 0;
      overflow: hidden;
      color: #292524;
      font-size: 15px;
      line-height: 21px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .speaker-role {
      margin: 1px 0 0;
      color: #78716c;
      font-size: 12px;
      line-height: 18px;
    }

    .speaking-label {
      flex: 0 0 auto;
      padding-left: 10px;
      border-left: 3px solid #78716c;
      color: #57534e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .participants {
      margin-top: 18px;
    }

    .section-heading {
      margin: 0;
      font-size: 14px;
      line-height: 21px;
      font-weight: 600;
      color: #44403c;
    }

    .participant-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 10px;
    }

    .participant {
      min-width: 0;
    }

    .participant-image {
      width: 62px;
      height: 62px;
      border: 1px solid #c9c5bf;
    }

    .tone-one {
      background: #ddd8cf;
    }

    .tone-two {
      background: #cfc9c0;
    }

    .tone-three {
      background: #e4e0da;
    }

    .participant-name {
      margin: 7px 0 0;
      overflow: hidden;
      color: #292524;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-state {
      margin: 0;
      color: #78716c;
      font-size: 12px;
      line-height: 18px;
    }

    .call-controls {
      padding: 16px 18px 18px;
      border-top: 1px solid #d6d3cf;
      background: #f4f2ef;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .control {
      min-width: 0;
      text-align: center;
    }

    .control-button {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      border: 1px solid #a8a29e;
      background: #faf9f7;
      color: #44403c;
    }

    .control-button.end {
      border-color: #57534e;
      background: #57534e;
      color: #faf9f7;
    }

    .control-label {
      margin: 7px 0 0;
      color: #57534e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="topbar-button" type="button" aria-label="Leave call view">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>

      <div class="topbar-title">
        <p class="product-name">Kernote</p>
        <p class="view-name">Current call</p>
      </div>

      <button class="topbar-button" type="button" aria-label="Add participant">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M2.5 20C2.5 16.9624 5.18629 14.5 8.5 14.5C10.2283 14.5 11.7859 15.1695 12.8807 16.2406" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
          <path d="M18 12V20M14 16H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
        </svg>
      </button>
    </header>

    <main class="call-content">
      <p class="call-status">
        <span class="status-mark" aria-hidden="true"></span>
        Live · 18:24
      </p>
      <h1 class="call-title">Launch review</h1>
      <p class="call-meta">4 participants · North workspace</p>

      <div class="speaker-stage" role="img" aria-label="Video feed for Mara Vale"></div>

      <div class="speaker-caption">
        <div class="speaker-info">
          <p class="speaker-name">Mara Vale</p>
          <p class="speaker-role">Project lead</p>
        </div>
        <span class="speaking-label">Speaking</span>
      </div>

      <section class="participants" aria-labelledby="participants-heading">
        <h2 class="section-heading" id="participants-heading">In this call</h2>
        <div class="participant-grid">
          <article class="participant">
            <div class="participant-image tone-one" role="img" aria-label="Video feed for Devon Pike"></div>
            <p class="participant-name">Devon Pike</p>
            <p class="participant-state">Listening</p>
          </article>

          <article class="participant">
            <div class="participant-image tone-two" role="img" aria-label="Video feed for Ellis North"></div>
            <p class="participant-name">Ellis North</p>
            <p class="participant-state">Muted</p>
          </article>

          <article class="participant">
            <div class="participant-image tone-three" role="img" aria-label="Your video feed"></div>
            <p class="participant-name">You</p>
            <p class="participant-state">Camera on</p>
          </article>
        </div>
      </section>
    </main>

    <nav class="call-controls" aria-label="Call controls">
      <div class="control-grid">
        <div class="control">
          <button class="control-button" type="button" aria-label="Mute microphone">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="3" width="8" height="12" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5 11V12C5 15.866 8.13401 19 12 19C15.866 19 19 15.866 19 12V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
              <path d="M12 19V22" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
          <p class="control-label">Mute</p>
        </div>

        <div class="control">
          <button class="control-button" type="button" aria-label="Turn camera off">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="6" width="13" height="12" stroke="currentColor" stroke-width="1.7"/>
              <path d="M16 10L21 7V17L16 14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter"/>
            </svg>
          </button>
          <p class="control-label">Camera</p>
        </div>

        <div class="control">
          <button class="control-button" type="button" aria-label="Share screen">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="4" width="18" height="13" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 21H16M12 17V21" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"/>
              <path d="M12 14V8M9 11L12 8L15 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
          </button>
          <p class="control-label">Share</p>
        </div>

        <div class="control">
          <button class="control-button end" type="button" aria-label="End call">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 15.5C5.8 13.2 8.6 12 12 12C15.4 12 18.2 13.2 20 15.5L17.5 19L14.5 17.5V14.8C12.9 14.3 11.1 14.3 9.5 14.8V17.5L6.5 19L4 15.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter"/>
            </svg>
          </button>
          <p class="control-label">End</p>
        </div>
      </div>
    </nav>
  </div>
</body>
</html>
