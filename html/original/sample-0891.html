<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order item actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:#eceeef;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:28px;
    background:#eceeef;
  }
  .sheet{
    width:100%;
    background:#ffffff;
    border:1px solid #d3d8da;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:20px;
    border-bottom:1px solid #d3d8da;
  }
  .thumb{
    width:60px;
    height:60px;
    flex:0 0 60px;
    background:#c6d3d8;
  }
  .item-text{min-width:0;}
  .item-title{
    font-size:15px;
    font-weight:600;
    color:#17222a;
    line-height:1.3;
    margin:0 0 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .item-meta{
    font-size:13px;
    font-weight:400;
    color:#6c777d;
    line-height:1.45;
    margin:0;
  }
  .actions{
    list-style:none;
    margin:0;
    padding:0;
  }
  .action{
    display:block;
    padding:17px 20px;
    border-bottom:1px solid #e2e6e8;
    font-size:15px;
    font-weight:500;
    color:#22303a;
    line-height:1.3;
  }
  .action:last-child{border-bottom:none;}
  .action.primary{
    background:#dbe6ea;
    font-weight:600;
    color:#152029;
    border-bottom-color:#cad7dc;
  }
  .action .note{
    display:block;
    margin-top:5px;
    font-size:13px;
    font-weight:400;
    color:#6c777d;
  }
  .action.primary .note{color:#4c6672;}
  .cancel{
    width:100%;
    margin-top:8px;
    background:#ffffff;
    border:1px solid #d3d8da;
    padding:16px 20px;
    text-align:center;
    font-size:15px;
    font-weight:500;
    color:#6c777d;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="item">
        <div class="thumb"></div>
        <div class="item-text">
          <p class="item-title">Ridgeline Canvas Duffel, Slate</p>
          <p class="item-meta">Order 4820-771 · $128.00<br>Delivered Saturday, March 8</p>
        </div>
      </div>
      <ul class="actions">
        <li class="action primary">
          Start a return
          <span class="note">Free pickup through March 22</span>
        </li>
        <li class="action">Message the seller</li>
        <li class="action">Buy this again</li>
        <li class="action">View receipt</li>
      </ul>
    </div>
    <div class="cancel">Close</div>
  </div>
</body>
</html>
