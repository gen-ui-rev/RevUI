<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northline Balance</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9e6;
      color: #1d2329;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #f7f7f5;
    }

    .balance-panel {
      width: 100%;
    }

    .balance-hero {
      padding: 24px;
      background: rgba(58, 69, 79, 0.10);
    }

    .service-name,
    .section-title,
    .account-label,
    .detail-label {
      margin: 0;
      font-weight: 600;
    }

    .service-name {
      color: #4b5863;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .balance-label {
      margin: 24px 0 6px;
      color: #59636b;
      font-size: 14px;
      line-height: 1.4;
    }

    .balance-amount {
      margin: 0;
      color: #26333d;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .balance-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: #4f5c65;
      font-size: 14px;
      line-height: 1.4;
    }

    .balance-meta svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: #3a4a55;
    }

    .details {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 16px;
      line-height: 1.4;
    }

    .section-caption {
      color: #747b80;
      font-size: 12px;
    }

    .account-list {
      background: rgba(58, 69, 79, 0.055);
    }

    .account-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 15px 16px;
    }

    .account-row + .account-row {
      box-shadow: inset 0 1px 0 rgba(58, 69, 79, 0.09);
    }

    .account-label {
      font-size: 14px;
      line-height: 1.35;
    }

    .account-caption {
      margin: 3px 0 0;
      color: #747b80;
      font-size: 12px;
      line-height: 1.35;
    }

    .account-value {
      margin: 0;
      align-self: center;
      color: #26333d;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .availability {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      margin-top: 16px;
      padding: 16px;
      background: rgba(58, 69, 79, 0.075);
    }

    .detail-label {
      font-size: 14px;
      line-height: 1.4;
    }

    .detail-note {
      margin: 4px 0 0;
      color: #687178;
      font-size: 12px;
      line-height: 1.4;
    }

    .detail-value {
      margin: 0;
      align-self: center;
      color: #26333d;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="balance-panel" aria-labelledby="balance-title">
      <section class="balance-hero">
        <p class="service-name">Northline Finance</p>
        <p class="balance-label" id="balance-title">Total balance</p>
        <h1 class="balance-amount">$24,680.42</h1>
        <div class="balance-meta">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 15.5l4-4 3 3L19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M14 7.5h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
          <span>Up $418.30 since May 1</span>
        </div>
      </section>

      <section class="details" aria-labelledby="accounts-title">
        <div class="section-heading">
          <h2 class="section-title" id="accounts-title">Balance by account</h2>
          <span class="section-caption">May 24, 2025</span>
        </div>

        <div class="account-list">
          <div class="account-row">
            <div>
              <p class="account-label">Everyday balance</p>
              <p class="account-caption">Available now</p>
            </div>
            <p class="account-value">$8,240.18</p>
          </div>

          <div class="account-row">
            <div>
              <p class="account-label">Reserve savings</p>
              <p class="account-caption">Earning 3.85% APY</p>
            </div>
            <p class="account-value">$12,915.60</p>
          </div>

          <div class="account-row">
            <div>
              <p class="account-label">Investment balance</p>
              <p class="account-caption">Market value</p>
            </div>
            <p class="account-value">$3,524.64</p>
          </div>
        </div>
      </section>

      <section class="availability" aria-label="Pending balance">
        <div>
          <p class="detail-label">Pending deposits</p>
          <p class="detail-note">Expected by May 27</p>
        </div>
        <p class="detail-value">$760.00</p>
      </section>
    </main>
  </div>
</body>
</html>
