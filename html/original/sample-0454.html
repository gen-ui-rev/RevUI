<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe6ea;
      color: #17232c;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      margin: 0;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 18px 16px;
      background: #ffffff;
    }

    .icon-button {
      width: 40px;
      padding: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      stroke: #17232c;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .topbar-spacer {
      width: 40px;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 14px;
    }

    .intro h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 6px 0 0;
      max-width: 330px;
      color: #62717b;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
    }

    .advisor {
      margin-top: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #e9f7fc;
      border-radius: 4px;
    }

    .monogram {
      width: 48px;
      flex: 0 0 48px;
      padding: 14px 0;
      border-radius: 4px;
      background: #bfeafa;
      color: #086c99;
      text-align: center;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .advisor-copy {
      min-width: 0;
      flex: 1;
    }

    .advisor-name {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .advisor-role {
      margin: 2px 0 0;
      color: #62717b;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .duration {
      flex: 0 0 auto;
      color: #086c99;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .section {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .section-note {
      color: #71808a;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
      white-space: nowrap;
    }

    .date-options {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .date-option {
      padding: 9px 4px 10px;
      background: #f1f5f7;
      border-radius: 4px;
      text-align: center;
    }

    .date-option .weekday {
      display: block;
      color: #71808a;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .date-option .date-number {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .date-option.selected {
      background: #1aa6df;
      color: #ffffff;
    }

    .date-option.selected .weekday {
      color: #ffffff;
    }

    .time-options {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .time-option {
      padding: 13px 8px;
      border-radius: 4px;
      background: #f1f5f7;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-align: center;
    }

    .time-option.selected {
      background: #dff3fb;
      color: #0879a9;
    }

    .confirmation {
      margin-top: auto;
      padding-top: 18px;
    }

    .selection-summary {
      margin-bottom: 12px;
    }

    .selection-label {
      margin: 0;
      color: #71808a;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .selection-value {
      margin: 3px 0 0;
      font-size: 14px;
      line-height: 21px;
      font-weight: 600;
    }

    .confirm-button {
      width: 100%;
      padding: 15px 16px;
      border-radius: 4px;
      background: #1aa6df;
      color: #ffffff;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      text-align: center;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 14px 12px;
      background: #f6f9fa;
    }

    .tab {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      color: #7a8790;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    .tab.active {
      color: #0788bd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <p class="topbar-title">Book a session</p>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <main>
      <section class="intro">
        <h1>Choose your time</h1>
        <p>Reserve a 30-minute portfolio check-in with your financial guide.</p>
      </section>

      <section class="advisor" aria-label="Selected financial guide">
        <div class="monogram" aria-hidden="true">LM</div>
        <div class="advisor-copy">
          <p class="advisor-name">Lena Marlow</p>
          <p class="advisor-role">Financial guide · Video session</p>
        </div>
        <span class="duration">30 min</span>
      </section>

      <section class="section" aria-labelledby="date-heading">
        <div class="section-heading">
          <h2 id="date-heading">August 2026</h2>
          <span class="section-note">Eastern Time</span>
        </div>
        <div class="date-options">
          <button class="date-option" type="button">
            <span class="weekday">Mon</span>
            <span class="date-number">17</span>
          </button>
          <button class="date-option" type="button">
            <span class="weekday">Tue</span>
            <span class="date-number">18</span>
          </button>
          <button class="date-option" type="button">
            <span class="weekday">Wed</span>
            <span class="date-number">19</span>
          </button>
          <button class="date-option selected" type="button" aria-pressed="true">
            <span class="weekday">Thu</span>
            <span class="date-number">20</span>
          </button>
          <button class="date-option" type="button">
            <span class="weekday">Fri</span>
            <span class="date-number">21</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="time-heading">
        <div class="section-heading">
          <h2 id="time-heading">Available times</h2>
          <span class="section-note">4 openings</span>
        </div>
        <div class="time-options">
          <button class="time-option" type="button">9:30 AM</button>
          <button class="time-option selected" type="button" aria-pressed="true">11:00 AM</button>
          <button class="time-option" type="button">1:30 PM</button>
          <button class="time-option" type="button">3:00 PM</button>
        </div>
      </section>

      <div class="confirmation">
        <div class="selection-summary">
          <p class="selection-label">Your selected session</p>
          <p class="selection-value">Thursday, August 20 · 11:00–11:30 AM</p>
        </div>
        <button class="confirm-button" type="button">Confirm session</button>
      </div>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 10.5L12 3.8l8.5 6.7"></path>
          <path d="M5.5 9.5V20h13V9.5"></path>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="13" rx="1"></rect>
          <path d="M3.5 9.5h17"></path>
          <path d="M7 14h3"></path>
        </svg>
        <span>Accounts</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5.5" width="16" height="15" rx="1"></rect>
          <path d="M8 3.5v4"></path>
          <path d="M16 3.5v4"></path>
          <path d="M4 10h16"></path>
          <path d="M8 14h3"></path>
        </svg>
        <span>Sessions</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5.5 20c.6-4 3-6 6.5-6s5.9 2 6.5 6"></path>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
</body>
</html>
