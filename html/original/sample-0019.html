<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select a Lesson Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e9ec;
      color: #172033;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 28px 20px;
      background: #f1f2f4;
    }

    .picker {
      width: 100%;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.1);
    }

    .picker-header {
      padding: 24px 24px 20px;
      border-top: 4px solid #2767d8;
      border-bottom: 1px solid #e3e6ea;
    }

    h1 {
      margin: 0;
      color: #14213a;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
    }

    .intro {
      margin: 8px 0 0;
      color: #5c6575;
      font-size: 15px;
      line-height: 1.45;
    }

    .picker-form {
      padding: 20px 24px 24px;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    fieldset + fieldset {
      margin-top: 20px;
    }

    legend {
      width: 100%;
      margin: 0 0 10px;
      padding: 0;
      color: #202b40;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .date-options,
    .time-options {
      display: grid;
      gap: 8px;
    }

    .date-options {
      grid-template-columns: repeat(3, 1fr);
    }

    .time-options {
      grid-template-columns: repeat(2, 1fr);
    }

    .choice {
      position: relative;
      display: block;
      min-width: 0;
      cursor: pointer;
    }

    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .choice-content {
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #cfd4dc;
      background: #ffffff;
      color: #354055;
      font-size: 14px;
      line-height: 1.25;
      text-align: center;
    }

    .date-options .choice-content {
      min-height: 56px;
      padding: 8px 5px;
      flex-direction: column;
    }

    .date-day {
      display: block;
      font-weight: 600;
    }

    .date-number {
      display: block;
      margin-top: 2px;
      color: #687184;
      font-size: 13px;
    }

    .time-options .choice-content {
      min-height: 42px;
      padding: 9px 12px;
      font-weight: 600;
    }

    .choice input:checked + .choice-content {
      border: 2px solid #2767d8;
      background: #edf4ff;
      color: #164fae;
    }

    .choice input:checked + .choice-content .date-number {
      color: #2767d8;
    }

    .timezone {
      margin: 10px 0 0;
      color: #6a7280;
      font-size: 13px;
      line-height: 1.35;
    }

    .summary {
      margin: 20px 0 0;
      padding: 12px 0;
      border-top: 1px solid #e3e6ea;
      border-bottom: 1px solid #e3e6ea;
      color: #354055;
      font-size: 14px;
      line-height: 1.4;
    }

    .summary strong {
      color: #172033;
      font-weight: 600;
    }

    .continue-button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 0;
      background: #2767d8;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      cursor: pointer;
    }

    .choice input:focus-visible + .choice-content,
    .continue-button:focus-visible {
      outline: 3px solid #9bbcf5;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="picker" aria-labelledby="picker-title">
      <header class="picker-header">
        <h1 id="picker-title">Choose your lesson time</h1>
        <p class="intro">Select a 30-minute speaking session with instructor Mara Ellison.</p>
      </header>

      <form class="picker-form">
        <fieldset>
          <legend>Select a date</legend>
          <div class="date-options">
            <label class="choice">
              <input type="radio" name="lesson-date">
              <span class="choice-content">
                <span class="date-day">Tuesday</span>
                <span class="date-number">May 12</span>
              </span>
            </label>
            <label class="choice">
              <input type="radio" name="lesson-date" checked>
              <span class="choice-content">
                <span class="date-day">Wednesday</span>
                <span class="date-number">May 13</span>
              </span>
            </label>
            <label class="choice">
              <input type="radio" name="lesson-date">
              <span class="choice-content">
                <span class="date-day">Thursday</span>
                <span class="date-number">May 14</span>
              </span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Select a start time</legend>
          <div class="time-options">
            <label class="choice">
              <input type="radio" name="lesson-time">
              <span class="choice-content">9:30 AM</span>
            </label>
            <label class="choice">
              <input type="radio" name="lesson-time" checked>
              <span class="choice-content">11:00 AM</span>
            </label>
            <label class="choice">
              <input type="radio" name="lesson-time">
              <span class="choice-content">2:30 PM</span>
            </label>
            <label class="choice">
              <input type="radio" name="lesson-time">
              <span class="choice-content">4:00 PM</span>
            </label>
          </div>
          <p class="timezone">Times shown in Eastern Time</p>
        </fieldset>

        <p class="summary"><strong>Selected:</strong> Wednesday, May 13 at 11:00 AM</p>
        <button class="continue-button" type="button">Continue with this time</button>
      </form>
    </section>
  </div>
</body>
</html>
