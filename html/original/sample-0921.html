<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Nightly Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #202124;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 24px;
      background: #f3f4f6;
    }

    .budget-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.10);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #a21caf;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202124;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
    }

    .description {
      margin: 8px 0 22px;
      color: #6b7280;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .value {
      margin: 0 0 18px;
      color: #c026d3;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.15;
    }

    .value span {
      color: #6b7280;
      font-size: 14px;
      font-weight: 400;
    }

    .slider-wrap {
      position: relative;
      width: 100%;
      padding: 10px 0;
    }

    .slider-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 4px;
    }

    .slider-fill {
      width: 62%;
      height: 6px;
      background: #c026d3;
      border-radius: 4px;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 62%;
      width: 22px;
      height: 22px;
      border: 4px solid #c026d3;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
    }

    .range-input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0.001;
      cursor: pointer;
    }

    .limits {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 400;
    }

    .apply-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 16px;
      border: 0;
      border-radius: 4px;
      background: #c026d3;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .note {
      margin: 12px 0 0;
      color: #6b7280;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="budget-card" aria-labelledby="budget-title">
      <p class="eyebrow">Northpath stays</p>
      <h1 id="budget-title">Set your nightly budget</h1>
      <p class="description">Choose the highest nightly rate shown in your stay results.</p>

      <p class="value">$240 <span>per night</span></p>

      <div class="slider-wrap">
        <div class="slider-track" aria-hidden="true">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
        </div>
        <input class="range-input" type="range" min="80" max="340" value="240" aria-label="Maximum nightly budget">
      </div>

      <div class="limits" aria-hidden="true">
        <span>$80</span>
        <span>$340+</span>
      </div>

      <button class="apply-button" type="button">Apply budget</button>
      <p class="note">Nightly rate before taxes and booking fees.</p>
    </section>
  </div>
</body>
</html>
