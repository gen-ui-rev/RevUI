<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item actions — Marketwell</title>
<style>
  html, body { margin:0; }
  body {
    background:#ecebe8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen {
    width:390px;
    box-sizing:border-box;
    background:#ecebe8;
    padding:26px 20px;
  }
  .sheet {
    background:#ffffff;
    border-radius:14px;
    padding:14px 20px 18px;
    box-sizing:border-box;
    width:100%;
  }
  .handle {
    width:36px; height:4px;
    border-radius:14px;
    background:#dcdad5;
    margin:0 auto 18px;
  }
  .item {
    display:flex;
    align-items:center;
    gap:14px;
  }
  .item img {
    width:72px; height:72px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#d8d5cf;
    flex:none;
  }
  .item-text { min-width:0; }
  .item-title {
    font-size:16px;
    font-weight:600;
    color:#1b1a18;
    line-height:1.3;
    margin:0 0 5px;
  }
  .item-meta {
    font-size:13px;
    color:#7c7871;
    line-height:1.35;
    margin:0;
  }
  .primary {
    display:block;
    margin:20px 0 6px;
    padding:15px 16px;
    border-radius:14px;
    background:#ef6c1f;
    color:#ffffff;
    font-size:16px;
    font-weight:600;
    text-align:center;
    text-decoration:none;
  }
  .actions { border-top:1px solid #e6e4df; margin-top:12px; }
  .action {
    display:block;
    padding:17px 0;
    border-bottom:1px solid #e6e4df;
    font-size:16px;
    color:#1b1a18;
    text-decoration:none;
    line-height:1.25;
  }
  .action .sub {
    display:block;
    font-size:13px;
    color:#7c7871;
    margin-top:3px;
  }
  .cancel {
    display:block;
    padding:17px 0 2px;
    text-align:center;
    font-size:15px;
    color:#7c7871;
    text-decoration:none;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="handle"></div>

      <div class="item">
        <img src="https://loremflickr.com/72/72/fashion?lock=5641" width="72" height="72" alt="Sand linen wide-leg trousers from the order">
        <div class="item-text">
          <p class="item-title">Linen Wide-Leg Trousers</p>
          <p class="item-meta">Sand, size M · $68.00<br>Order 4820-117 · Arrives Mar 14</p>
        </div>
      </div>

      <a class="primary" href="#">Track shipment</a>

      <div class="actions">
        <a class="action" href="#">
          Return this item
          <span class="sub">Free returns through Mar 28</span>
        </a>
        <a class="action" href="#">
          Message Hollis Dry Goods
          <span class="sub">Usually replies within a day</span>
        </a>
        <a class="action" href="#">Buy it again</a>
      </div>

      <a class="cancel" href="#">Cancel</a>
    </div>
  </div>
</body>
</html>
