<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Planning Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e6e1;
      color: #36332e;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 48px 24px;
      background: #f7f6f3;
    }

    .loading-panel {
      padding: 32px 28px;
      text-align: center;
      background: rgba(122, 115, 103, 0.11);
      border-radius: 14px;
    }

    .service {
      margin: 0 0 10px;
      color: #756e63;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #625c52;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.18;
    }

    .loader {
      width: 88px;
      margin: 28px auto 24px;
      padding: 18px;
      background: rgba(122, 115, 103, 0.12);
      border-radius: 14px;
    }

    .loader svg {
      display: block;
      width: 52px;
      height: 52px;
    }

    .message {
      margin: 0;
      color: #4d4942;
      font-size: 15px;
      line-height: 1.5;
    }

    .note {
      margin: 10px 0 0;
      color: #777168;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="loading-panel" role="status" aria-live="polite">
      <p class="service">Hearthwork</p>
      <h1>Opening your planning board</h1>

      <div class="loader" aria-hidden="true">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="20" fill="none" stroke="rgba(117,110,99,0.22)" stroke-width="7"/>
          <path d="M26 6 A20 20 0 0 1 45.6 22" fill="none" stroke="#756e63" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>

      <p class="message">Gathering the latest notes and assignments from your team.</p>
      <p class="note">This usually takes a few seconds.</p>
    </section>
  </div>
</body>
</html>
