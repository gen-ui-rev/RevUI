<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Teammates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ecebea;
      color: #252120;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 26px 28px;
      background: #ffffff;
    }

    .context {
      margin: 0 0 7px;
      color: #c72727;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 9px 0 0;
      color: #68615e;
      font-size: 15px;
      line-height: 1.45;
    }

    .invite-form {
      margin-top: 22px;
    }

    .field + .field {
      margin-top: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #302b29;
      font-size: 14px;
      font-weight: 600;
    }

    .text-input,
    .role-control {
      width: 100%;
      border: 1px solid #cfc9c6;
      border-radius: 10px;
      background: #ffffff;
      color: #252120;
      font-size: 15px;
    }

    .text-input {
      padding: 11px 13px;
      outline: none;
    }

    .text-input:focus {
      border-color: #c72727;
    }

    .role-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 10px 13px;
      text-align: left;
      cursor: default;
    }

    .role-copy {
      min-width: 0;
    }

    .role-name {
      display: block;
      font-weight: 600;
      line-height: 1.2;
    }

    .role-detail {
      display: block;
      margin-top: 2px;
      color: #77706d;
      font-size: 12px;
      line-height: 1.25;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-left: 12px;
      color: #6c6562;
    }

    .primary-action {
      width: 100%;
      margin-top: 18px;
      padding: 11px 16px;
      border: 1px solid #bd2323;
      border-radius: 10px;
      background: #c72727;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .pending {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #ded9d6;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 7px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 600;
    }

    .count {
      color: #827b78;
      font-size: 13px;
    }

    .invite-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 10px 0;
      border-bottom: 1px solid #ece8e6;
    }

    .invite-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .monogram {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f4e4e4;
      color: #a51f1f;
      font-size: 13px;
      font-weight: 600;
    }

    .person {
      min-width: 0;
    }

    .email {
      overflow: hidden;
      color: #302b29;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .permission {
      margin-top: 3px;
      color: #77706d;
      font-size: 12px;
      line-height: 1.2;
    }

    .sent-date {
      color: #77706d;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="invite-title">
      <header>
        <p class="context">Redgrove Market workspace</p>
        <h1 id="invite-title">Invite a teammate</h1>
        <p class="intro">Add someone to help manage products and storefront content. You can change their access later.</p>
      </header>

      <form class="invite-form">
        <div class="field">
          <label for="teammate-email">Work email</label>
          <input class="text-input" id="teammate-email" type="email" value="avery.chen@northrow.co" aria-label="Teammate work email">
        </div>

        <div class="field">
          <label id="role-label">Workspace role</label>
          <button class="role-control" type="button" aria-labelledby="role-label selected-role">
            <span class="role-copy">
              <span class="role-name" id="selected-role">Catalog manager</span>
              <span class="role-detail">Can edit products, collections, and inventory</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 9.5 12 14.5 17 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <button class="primary-action" type="button">Send invitation</button>
      </form>

      <section class="pending" aria-labelledby="pending-title">
        <div class="section-heading">
          <h2 id="pending-title">Pending invites</h2>
          <span class="count">2 open</span>
        </div>

        <div class="invite-row">
          <div class="monogram" aria-hidden="true">JM</div>
          <div class="person">
            <div class="email">jordan.mills@pinegoods.co</div>
            <div class="permission">Order manager</div>
          </div>
          <div class="sent-date">May 18</div>
        </div>

        <div class="invite-row">
          <div class="monogram" aria-hidden="true">SK</div>
          <div class="person">
            <div class="email">sloane.kent@harborlane.co</div>
            <div class="permission">Catalog manager</div>
          </div>
          <div class="sent-date">May 16</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
