<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #18181b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 64px 24px;
      background: #f4f4f5;
    }

    .activity {
      width: 100%;
      padding: 18px;
      border-radius: 6px;
      background: #18181b;
      box-shadow: 0 12px 28px rgba(24, 24, 27, 0.16);
    }

    .activity-header {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 48px;
      gap: 12px;
      align-items: center;
    }

    .service-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #3f3f46;
      color: #ffffff;
    }

    .service-mark svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .header-copy {
      min-width: 0;
    }

    .service-name {
      margin: 0 0 3px;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    .status-title {
      margin: 0;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .progress-ring {
      width: 48px;
      height: 48px;
      display: block;
    }

    .transfer-card {
      margin-top: 18px;
      padding: 16px;
      border-radius: 6px;
      background: #ffffff;
    }

    .transfer-label {
      margin: 0 0 4px;
      color: #71717a;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .amount {
      margin: 0;
      color: #18181b;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.7px;
      line-height: 1.2;
    }

    .recipient {
      margin: 5px 0 0;
      color: #52525b;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 16px;
      border-radius: 6px;
      background: #e4e4e7;
    }

    .progress-value {
      width: 68%;
      height: 6px;
      border-radius: 6px;
      background: #52525b;
    }

    .transfer-meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #71717a;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Expanded transfer activity">
      <div class="activity-header">
        <div class="service-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 8H17M14 5L17 8L14 11M19 16H7M10 13L7 16L10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="header-copy">
          <p class="service-name">Slate Ledger</p>
          <h1 class="status-title">Transfer in progress</h1>
        </div>

        <svg class="progress-ring" viewBox="0 0 48 48" role="img" aria-label="68 percent complete">
          <circle cx="24" cy="24" r="19" fill="none" stroke="#3f3f46" stroke-width="4"/>
          <circle cx="24" cy="24" r="19" fill="none" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round" stroke-dasharray="81.2 119.4" transform="rotate(-90 24 24)"/>
          <text x="24" y="27.5" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">68</text>
        </svg>
      </div>

      <div class="transfer-card">
        <p class="transfer-label">Sending</p>
        <p class="amount">$1,240.00</p>
        <p class="recipient">To Rowan Pierce · Harbor checking</p>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-value"></div>
        </div>

        <div class="transfer-meta">
          <span>68% complete</span>
          <span>About 2 min left</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
