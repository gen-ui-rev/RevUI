<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Sleep Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e6e8;
      color: #29252a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 28px;
      background: #faf8f9;
    }

    .progress-component {
      width: 100%;
      text-align: center;
    }

    .service-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: #76566f;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .service-label svg {
      width: 18px;
      height: 18px;
      flex: none;
      stroke: currentColor;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .summary {
      margin: 8px auto 0;
      max-width: 285px;
      color: #716a70;
      font-size: 14px;
      line-height: 1.55;
    }

    .ring-wrap {
      position: relative;
      width: 180px;
      margin: 28px auto 20px;
    }

    .ring-wrap svg {
      display: block;
      width: 180px;
      height: 180px;
    }

    .ring-track {
      fill: none;
      stroke: #e5dfe3;
      stroke-width: 12;
    }

    .ring-progress {
      fill: none;
      stroke: #9b6f8f;
      stroke-width: 12;
      stroke-linecap: butt;
      stroke-dasharray: 427.3;
      stroke-dashoffset: 123.9;
      transform: rotate(-90deg);
      transform-origin: 90px 90px;
    }

    .ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percent {
      color: #76566f;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .ring-label {
      margin-top: 8px;
      color: #716a70;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 500;
    }

    .detail-rule {
      border: 0;
      border-top: 1px solid #ddd7db;
      margin: 0;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 20px;
      text-align: left;
    }

    .detail {
      padding-right: 18px;
    }

    .detail + .detail {
      padding-right: 0;
      padding-left: 20px;
      border-left: 1px solid #ddd7db;
    }

    .detail-label {
      margin: 0 0 5px;
      color: #7b7479;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
    }

    .detail-value {
      margin: 0;
      color: #29252a;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="progress-component" aria-labelledby="goal-title">
      <p class="service-label">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M18.5 15.8A7.8 7.8 0 0 1 8.2 5.5a8.1 8.1 0 1 0 10.3 10.3Z" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
        Nightspring sleep plan
      </p>

      <h1 id="goal-title">Weekly sleep goal</h1>
      <p class="summary">Keep your bedtime within the planned 30-minute window on five nights.</p>

      <div class="ring-wrap" aria-label="71 percent complete">
        <svg viewBox="0 0 180 180" role="img" aria-hidden="true">
          <circle class="ring-track" cx="90" cy="90" r="68"/>
          <circle class="ring-progress" cx="90" cy="90" r="68"/>
        </svg>
        <div class="ring-content">
          <span class="percent">71%</span>
          <span class="ring-label">5 of 7 nights</span>
        </div>
      </div>

      <hr class="detail-rule">

      <section class="details" aria-label="Goal details">
        <div class="detail">
          <p class="detail-label">Goal period</p>
          <p class="detail-value">March 2–8</p>
        </div>
        <div class="detail">
          <p class="detail-label">Remaining</p>
          <p class="detail-value">2 nights</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
