<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d8d1;
      color: #282a23;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 28px;
      background: #f5f3eb;
    }

    .accent-rule {
      width: 44px;
      border-top: 3px solid #707744;
      margin-bottom: 17px;
    }

    h1,
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      margin: 0;
    }

    h1 {
      font-size: 29px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .intro {
      margin: 8px 0 0;
      max-width: 310px;
      color: #65675d;
      font-size: 15px;
      line-height: 1.45;
    }

    .episode {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .episode-glyph {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      display: grid;
      place-items: center;
      border: 1px solid #a9ad8b;
      border-radius: 4px;
      background: #ececdd;
      color: #707744;
    }

    .episode-glyph svg {
      width: 34px;
      height: 34px;
    }

    .episode-copy {
      min-width: 0;
    }

    .episode-title {
      margin: 0;
      color: #282a23;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 600;
    }

    .episode-meta {
      margin: 5px 0 0;
      color: #72746a;
      font-size: 13px;
      line-height: 1.3;
    }

    .destination {
      margin-top: 27px;
      border: 0;
      padding: 0;
    }

    .destination legend {
      width: 100%;
      padding: 0 0 9px;
      font-family: 'Playfair Display', Georgia, serif;
      color: #282a23;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
    }

    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 2px;
      border-top: 1px solid #d1d0c6;
      cursor: pointer;
    }

    .choice:last-child {
      border-bottom: 1px solid #d1d0c6;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border: 1.5px solid #8a8d7e;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .radio::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
    }

    .choice input:checked + .radio {
      border-color: #707744;
    }

    .choice input:checked + .radio::after {
      background: #707744;
    }

    .choice-name {
      color: #33352e;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 400;
    }

    .choice input:checked ~ .choice-name {
      color: #565d31;
      font-weight: 600;
    }

    .save-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px 18px;
      border: 1px solid #707744;
      border-radius: 4px;
      background: #707744;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="save-title">
      <div class="accent-rule" aria-hidden="true"></div>

      <header>
        <h1 id="save-title">Save this episode</h1>
        <p class="intro">Choose the collection where you want to keep it.</p>
      </header>

      <div class="episode" aria-label="Episode to save">
        <div class="episode-glyph" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="6" width="10" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10.5 18.5C10.5 24.2 14.6 28 20 28C25.4 28 29.5 24.2 29.5 18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M20 28V34M15.5 34H24.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M6 11C3.7 13.5 3.7 17.5 6 20M34 11C36.3 13.5 36.3 17.5 34 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="episode-copy">
          <p class="episode-title">Why Silence Shapes a Song</p>
          <p class="episode-meta">The Listening Room · 42 min</p>
        </div>
      </div>

      <form>
        <fieldset class="destination">
          <legend>Save to a collection</legend>

          <label class="choice">
            <input type="radio" name="collection" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Field Notes</span>
          </label>

          <label class="choice">
            <input type="radio" name="collection">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Sound and Memory</span>
          </label>

          <label class="choice">
            <input type="radio" name="collection">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Long Conversations</span>
          </label>
        </fieldset>

        <button class="save-button" type="button">Save to Field Notes</button>
      </form>
    </main>
  </div>
</body>
</html>
