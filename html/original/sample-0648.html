<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Liltroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e8;
      color: #252126;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fcfbfc;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid #ded9dd;
      background: #fcfbfc;
    }

    .back-button {
      width: 40px;
      padding: 8px;
      border: 0;
      background: transparent;
      color: #252126;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 20px 16px 0;
    }

    .about-panel {
      padding: 24px;
      border: 1px solid #c9afc0;
      border-radius: 4px;
      background: #f4edf2;
    }

    .brand-mark {
      width: 48px;
      margin-bottom: 24px;
      color: #8d5778;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #765066;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .service-name {
      margin: 0;
      font-size: 28px;
      line-height: 36px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .version {
      margin: 16px 0 0;
      color: #8d5778;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
    }

    .release {
      margin: 4px 0 0;
      color: #6c666b;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
    }

    .details {
      margin-top: 28px;
      border-top: 1px solid #ded9dd;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 4px;
      border-bottom: 1px solid #ded9dd;
    }

    .detail-copy {
      min-width: 0;
      flex: 1;
    }

    .detail-title {
      margin: 0 0 5px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .detail-text {
      margin: 0;
      color: #6c666b;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
    }

    .chevron {
      flex: 0 0 auto;
      color: #8a8488;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 8px 11px;
      border-top: 1px solid #ded9dd;
      background: #fcfbfc;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 3px 0;
      color: #777176;
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
    }

    .tab.active {
      color: #8d5778;
      font-weight: 600;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="top-title">About</h1>
      <span aria-hidden="true"></span>
    </header>

    <main>
      <section aria-labelledby="service-name">
        <div class="about-panel">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="46" height="46" rx="4" stroke="currentColor" stroke-width="2"/>
            <path d="M13 29V19M20 34V14M28 30V18M35 26V22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <p class="eyebrow">Audio for unhurried listening</p>
          <h2 class="service-name" id="service-name">Liltroom</h2>
          <p class="version">Version 4.8.2</p>
          <p class="release">Build 271 · Released May 14, 2025</p>
        </div>

        <div class="details">
          <div class="detail-row">
            <div class="detail-copy">
              <h3 class="detail-title">Our team</h3>
              <p class="detail-text">Built in Portland by Nora Bell, Adrian Moss, and Ellis Hart.</p>
            </div>
          </div>

          <div class="detail-row">
            <div class="detail-copy">
              <h3 class="detail-title">Open-source licenses</h3>
              <p class="detail-text">Software notices and attribution</p>
            </div>
            <svg class="chevron" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5L12 4L20 10.5V20H14.5V14H9.5V20H4V10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="1" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 5V20M12 9H17M12 13H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Library</span>
      </div>
      <div class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5 20C5.5 16.5 8 14.5 12 14.5C16 14.5 18.5 16.5 19 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>You</span>
      </div>
    </nav>
  </div>
</body>
</html>
