<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder stops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#EAE8E4;
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:#FFFFFF;
    padding:34px 26px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    font-weight:600;
    color:#4338CA;
    margin:0 0 8px;
  }
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:27px;
    line-height:1.15;
    color:#17171A;
    margin:0 0 8px;
  }
  .lede{
    font-size:14px;
    line-height:1.45;
    color:#63636B;
    margin:0 0 22px;
  }
  .list{
    border-top:1px solid #E2E1DE;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 10px;
    border-bottom:1px solid #E2E1DE;
    box-sizing:border-box;
  }
  .row.lifted{
    background:#F1F0FE;
    border-radius:10px;
    border-bottom-color:transparent;
    box-shadow:inset 3px 0 0 #4338CA;
  }
  .handle{display:block;flex:none;color:#A6A5A2;}
  .row.lifted .handle{color:#4338CA;}
  .idx{
    flex:none;
    width:20px;
    font-size:14px;
    font-weight:600;
    color:#9A9994;
    text-align:center;
  }
  .row.lifted .idx{color:#4338CA;}
  .body{min-width:0;flex:1;}
  .name{
    font-size:16px;
    font-weight:600;
    color:#17171A;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:13px;
    color:#6E6D74;
    margin-top:3px;
  }
  .divider-note{
    display:flex;
    justify-content:space-between;
    gap:16px;
    font-size:13px;
    color:#78777E;
    padding:14px 10px 0;
  }
  .divider-note strong{font-weight:600;color:#3B3B40;}
  .actions{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .save{
    flex:1;
    background:#4338CA;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    text-align:center;
  }
  .cancel{
    font-size:15px;
    font-weight:600;
    color:#6E6D74;
    padding:13px 4px;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Lisbon &middot; Day 2</p>
    <h1>Reorder stops</h1>
    <p class="lede">Hold a handle and drag a stop up or down. Arrival times recalculate when you save.</p>

    <div class="list">
      <div class="row">
        <svg class="handle" width="14" height="20" viewBox="0 0 14 20" aria-hidden="true">
          <circle cx="4" cy="5" r="1.6" fill="currentColor"/><circle cx="10" cy="5" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="15" r="1.6" fill="currentColor"/><circle cx="10" cy="15" r="1.6" fill="currentColor"/>
        </svg>
        <span class="idx">1</span>
        <div class="body">
          <div class="name">Alfama viewpoint walk</div>
          <div class="meta">9:00 AM &middot; 1 hr 30 min</div>
        </div>
      </div>

      <div class="row lifted">
        <svg class="handle" width="14" height="20" viewBox="0 0 14 20" aria-hidden="true">
          <circle cx="4" cy="5" r="1.6" fill="currentColor"/><circle cx="10" cy="5" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="15" r="1.6" fill="currentColor"/><circle cx="10" cy="15" r="1.6" fill="currentColor"/>
        </svg>
        <span class="idx">2</span>
        <div class="body">
          <div class="name">Lunch at Ribeira Market</div>
          <div class="meta">Moved up from position 3</div>
        </div>
      </div>

      <div class="row">
        <svg class="handle" width="14" height="20" viewBox="0 0 14 20" aria-hidden="true">
          <circle cx="4" cy="5" r="1.6" fill="currentColor"/><circle cx="10" cy="5" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/>
          <circle cx="4" cy="15" r="1.6" fill="currentColor"/><circle cx="10" cy="15" r="1.6" fill="currentColor"/>
        </svg>
        <span class="idx">3</span>
        <div class="body">
          <div class="name">Tram 28 to Estrela</div>
          <div class="meta">1:15 PM &middot; 45 min</div>
        </div>
      </div>
    </div>

    <div class="divider-note">
      <span>Ends at</span>
      <span><strong>2:00 PM</strong>, 20 min earlier</span>
    </div>

    <div class="actions">
      <div class="save">Save order</div>
      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
