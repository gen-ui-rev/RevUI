<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Grove Voice Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe3df;
      color: #172019;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f2f4f1;
      border: 1px solid #cfd5cf;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 12px 12px;
      background: #ffffff;
      border-bottom: 1px solid #dce1dc;
    }

    .top-title {
      text-align: center;
    }

    .top-title strong {
      display: block;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
    }

    .top-title span {
      display: block;
      margin-top: 1px;
      color: #647068;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .icon-button {
      width: 44px;
      padding: 10px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #253128;
    }

    .icon-button svg,
    .control svg,
    .tab svg,
    .order-link svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    main {
      flex: 1;
      padding: 16px;
    }

    .call-card {
      padding: 24px 20px 22px;
      text-align: center;
      background: #ffffff;
      border-top: 3px solid #198754;
      box-shadow: 0 5px 18px rgba(28, 43, 33, 0.09);
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #147347;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      background: #198754;
      border-radius: 50%;
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 20px auto 14px;
      display: grid;
      place-items: center;
      background: #e2f0e7;
      border: 1px solid #bfd8c8;
      color: #14643f;
      font-size: 28px;
      line-height: 34px;
      font-weight: 700;
    }

    .caller-name {
      margin: 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .shop-name {
      margin: 4px 0 0;
      color: #536059;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .call-time {
      margin: 15px 0 0;
      color: #26332b;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .call-purpose {
      margin: 5px 0 0;
      color: #6a746e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .order-card {
      margin-top: 12px;
      padding: 15px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 14px;
      align-items: center;
      background: #ffffff;
      border: 1px solid #d8ded8;
    }

    .section-label {
      grid-column: 1 / -1;
      margin: 0;
      color: #6b756f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .order-details {
      min-width: 0;
    }

    .order-name {
      margin: 0;
      overflow: hidden;
      color: #1d2821;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .order-meta {
      margin: 3px 0 0;
      color: #647068;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }

    .order-link {
      padding: 8px 0 8px 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 0;
      background: transparent;
      color: #147347;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .order-link svg {
      width: 18px;
      height: 18px;
    }

    .controls-card {
      margin-top: 12px;
      padding: 15px 16px 16px;
      background: #ffffff;
      border: 1px solid #d8ded8;
    }

    .controls-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .control {
      padding: 12px 5px 10px;
      display: grid;
      justify-items: center;
      gap: 7px;
      border: 1px solid #d5dbd5;
      background: #f8f9f8;
      color: #27332b;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .control.active {
      border-color: #7eb997;
      background: #e5f3ea;
      color: #116c40;
    }

    .end-call {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid #a6413d;
      background: #b54b46;
      color: #ffffff;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .end-call svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #ffffff;
      border-top: 1px solid #d7ddd7;
    }

    .tab {
      padding: 10px 4px 11px;
      display: grid;
      justify-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #6b756f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .tab.active {
      color: #147347;
      box-shadow: inset 0 3px 0 #198754;
    }

    .tab svg {
      width: 21px;
      height: 21px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 5 8.5 12l7 7"></path>
        </svg>
      </button>

      <div class="top-title">
        <strong>Voice call</strong>
        <span>Parcel Grove</span>
      </div>

      <button class="icon-button" type="button" aria-label="More call options">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"></circle>
          <circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </header>

    <main>
      <section class="call-card" aria-labelledby="caller-name">
        <div class="connection">
          <span class="connection-dot" aria-hidden="true"></span>
          Connected
        </div>

        <div class="avatar" aria-hidden="true">MB</div>

        <h1 class="caller-name" id="caller-name">Mara Bell</h1>
        <p class="shop-name">North Pine Goods · Seller</p>
        <p class="call-time">08:42</p>
        <p class="call-purpose">Order support voice call</p>
      </section>

      <section class="order-card" aria-labelledby="order-heading">
        <h2 class="section-label" id="order-heading">Order in this call</h2>
        <div class="order-details">
          <p class="order-name">Woven storage basket set</p>
          <p class="order-meta">Order PG-20481 · $68.00</p>
        </div>
        <button class="order-link" type="button">
          View
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 5 7 7-7 7"></path>
          </svg>
        </button>
      </section>

      <section class="controls-card" aria-labelledby="controls-heading">
        <h2 class="section-label" id="controls-heading">Call controls</h2>

        <div class="controls-grid">
          <button class="control" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 5v6a3 3 0 0 0 5.2 2"></path>
              <path d="M15 9V5a3 3 0 0 0-5.6-1.5"></path>
              <path d="M18.5 11.5A6.5 6.5 0 0 1 7.8 16"></path>
              <path d="M12 18v3"></path>
              <path d="M8.5 21h7"></path>
              <path d="M4 4l16 16"></path>
            </svg>
            Mute
          </button>

          <button class="control active" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 10v4h4l5 4V6l-5 4H5Z"></path>
              <path d="M17 9a4 4 0 0 1 0 6"></path>
              <path d="M19 6.5a8 8 0 0 1 0 11"></path>
            </svg>
            Speaker
          </button>

          <button class="control" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="7" cy="6" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="6" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="17" cy="6" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="7" cy="11" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="11" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="17" cy="11" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="7" cy="16" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"></circle>
              <circle cx="17" cy="16" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            Keypad
          </button>
        </div>

        <button class="end-call" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.2 15.8a11.6 11.6 0 0 1 13.6 0"></path>
            <path d="m7 14-1.5 4"></path>
            <path d="m17 14 1.5 4"></path>
          </svg>
          End call
        </button>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h16l-1 11H5L4 9Z"></path>
          <path d="M8 9V7a4 4 0 0 1 8 0v2"></path>
        </svg>
        Shop
      </button>

      <button class="tab active" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v16H5V4Z"></path>
          <path d="M8 8h8"></path>
          <path d="M8 12h8"></path>
          <path d="M8 16h5"></path>
        </svg>
        Orders
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8h16v12H4V8Z"></path>
          <path d="m3 8 2-4h14l2 4"></path>
          <path d="M9 20v-6h6v6"></path>
        </svg>
        Sell
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M5 21a7 7 0 0 1 14 0"></path>
        </svg>
        Account
      </button>
    </nav>
  </div>
</body>
</html>
