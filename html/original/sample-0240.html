<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kivoa Advisor Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9df;
      color: #20202a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f5f5f8;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e6e5eb;
    }

    .topbar-copy {
      min-width: 0;
      text-align: center;
    }

    .topbar-title {
      margin: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
    }

    .topbar-subtitle {
      margin: 2px 0 0;
      color: #74717d;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #393741;
    }

    .icon-button svg,
    .control-circle svg,
    .nav-item svg,
    .secure-line svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    main {
      flex: 1;
      padding: 14px 16px 12px;
    }

    .call-card {
      padding: 20px;
      text-align: center;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(36, 32, 53, 0.08);
    }

    .secure-line {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6752b5;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .secure-line svg {
      width: 16px;
      height: 16px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 16px auto 14px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #6d54c7;
      color: #ffffff;
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .caller-name {
      margin: 0;
      font-size: 22px;
      line-height: 29px;
      font-weight: 700;
    }

    .caller-role {
      margin: 4px 0 0;
      color: #6f6c78;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .call-time {
      margin: 10px 0 0;
      color: #5d43b8;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .call-status {
      margin: 8px 0 0;
      color: #77747f;
      font-size: 12px;
      line-height: 18px;
    }

    .controls-card,
    .details-card {
      margin-top: 12px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #e5e3ea;
      border-radius: 10px;
    }

    .section-title {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .control {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4c4954;
      text-align: center;
    }

    .control-circle {
      width: 50px;
      height: 50px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f0eff4;
      color: #36333d;
    }

    .control.end .control-circle {
      background: #d84e58;
      color: #ffffff;
    }

    .control-label {
      display: block;
      margin-top: 7px;
      color: #625f69;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      white-space: nowrap;
    }

    .control.end .control-label {
      color: #a5323c;
      font-weight: 600;
    }

    .detail-list {
      margin: 10px 0 0;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid #eceaf0;
      font-size: 14px;
      line-height: 20px;
    }

    .detail-label {
      color: #77747f;
      font-weight: 500;
    }

    .detail-value {
      min-width: 0;
      color: #2c2a32;
      font-weight: 600;
      text-align: right;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 10px 11px;
      background: #ffffff;
      border-top: 1px solid #e3e2e8;
    }

    .nav-item {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #85818d;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    .nav-item.active {
      color: #6549bd;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>

      <div class="topbar-copy">
        <h1 class="topbar-title">Kivoa advisor</h1>
        <p class="topbar-subtitle">Voice consultation</p>
      </div>

      <button class="icon-button" type="button" aria-label="Call security information">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l7 3v5c0 4.8-2.9 8.1-7 10-4.1-1.9-7-5.2-7-10V6l7-3z"></path>
          <path d="M9.5 12l1.7 1.7 3.5-3.7"></path>
        </svg>
      </button>
    </header>

    <main>
      <section class="call-card" aria-labelledby="caller-name">
        <div class="secure-line">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 018 0v3"></path>
          </svg>
          Secure Kivoa line
        </div>

        <div class="avatar" aria-label="Tessa Wren monogram">TW</div>
        <h2 class="caller-name" id="caller-name">Tessa Wren</h2>
        <p class="caller-role">Financial guide</p>
        <p class="call-time">12:48</p>
        <p class="call-status">Connected with clear audio</p>
      </section>

      <section class="controls-card" aria-labelledby="controls-title">
        <h2 class="section-title" id="controls-title">Call controls</h2>
        <div class="controls">
          <button class="control" type="button" aria-label="Mute microphone">
            <span class="control-circle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                <path d="M5 11a7 7 0 0012.2 4.7M19 11a7 7 0 01-.5 2.6M12 18v3M8 21h8M3 3l18 18"></path>
              </svg>
            </span>
            <span class="control-label">Mute</span>
          </button>

          <button class="control" type="button" aria-label="Turn on video">
            <span class="control-circle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="13" height="12" rx="2"></rect>
                <path d="M16 10l5-3v10l-5-3z"></path>
              </svg>
            </span>
            <span class="control-label">Video</span>
          </button>

          <button class="control" type="button" aria-label="Use speaker">
            <span class="control-circle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 9v6h4l5 4V5L9 9H5z"></path>
                <path d="M17 9a4 4 0 010 6M19.5 6.5a8 8 0 010 11"></path>
              </svg>
            </span>
            <span class="control-label">Speaker</span>
          </button>

          <button class="control" type="button" aria-label="Open keypad">
            <span class="control-circle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="7" cy="6" r="1"></circle>
                <circle cx="12" cy="6" r="1"></circle>
                <circle cx="17" cy="6" r="1"></circle>
                <circle cx="7" cy="11" r="1"></circle>
                <circle cx="12" cy="11" r="1"></circle>
                <circle cx="17" cy="11" r="1"></circle>
                <circle cx="7" cy="16" r="1"></circle>
                <circle cx="12" cy="16" r="1"></circle>
                <circle cx="17" cy="16" r="1"></circle>
              </svg>
            </span>
            <span class="control-label">Keypad</span>
          </button>

          <button class="control end" type="button" aria-label="End call">
            <span class="control-circle">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5.2 15.6l2.2-2.2c3-1.3 6.2-1.3 9.2 0l2.2 2.2"></path>
                <path d="M4 14.4l2.4 2.4M20 14.4l-2.4 2.4"></path>
              </svg>
            </span>
            <span class="control-label">End</span>
          </button>
        </div>
      </section>

      <section class="details-card" aria-labelledby="review-title">
        <h2 class="section-title" id="review-title">Reviewing now</h2>
        <div class="detail-list">
          <div class="detail-row">
            <span class="detail-label">Account</span>
            <span class="detail-value">Individual investing</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Focus</span>
            <span class="detail-value">2025 contribution plan</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Reference</span>
            <span class="detail-value">Account ending 1842</span>
          </div>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11l9-7 9 7"></path>
          <path d="M5 10v10h14V10M9 20v-6h6v6"></path>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 9h18M7 15h4"></path>
        </svg>
        <span>Accounts</span>
      </button>

      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path>
        </svg>
        <span>Invest</span>
      </button>

      <button class="nav-item active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.2 3.8l2.4 4.5-2.1 1.8a16.5 16.5 0 006.4 6.4l1.8-2.1 4.5 2.4-.8 3.1c-.3 1-1.2 1.7-2.3 1.6C9.4 20.7 3.3 14.6 2.5 6.9c-.1-1.1.6-2 1.6-2.3l3.1-.8z"></path>
        </svg>
        <span>Call</span>
      </button>
    </nav>
  </div>
</body>
</html>
