<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 40px 0;
      background: #e9e7e4;
      color: #2b2928;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 48px 24px;
      background: #f8f7f5;
    }

    .loading-panel {
      width: 100%;
      padding: 32px 28px 30px;
      text-align: center;
      background: rgba(190, 39, 45, 0.08);
      border-radius: 0;
    }

    .loading-visual {
      position: relative;
      width: 112px;
      margin: 0 auto 26px;
    }

    .loading-visual svg {
      display: block;
      width: 112px;
      height: 112px;
    }

    .package-mark {
      position: absolute;
      top: 34px;
      left: 34px;
      width: 44px;
      height: 44px;
      color: #be272d;
    }

    .package-mark svg {
      width: 44px;
      height: 44px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      color: #252322;
    }

    .description {
      margin: 12px auto 0;
      max-width: 260px;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 400;
      color: #625d5b;
    }

    .status {
      margin: 22px 0 0;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 500;
      color: #9b292d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="loading-panel" role="status" aria-live="polite" aria-label="Confirming cart availability">
      <div class="loading-visual" aria-hidden="true">
        <svg viewBox="0 0 112 112" fill="none">
          <circle cx="56" cy="56" r="48" stroke="#BE272D" stroke-opacity="0.16" stroke-width="8"/>
          <path d="M56 8A48 48 0 0 1 99.5 35.7" stroke="#BE272D" stroke-width="8" stroke-linecap="square"/>
        </svg>
        <div class="package-mark">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M7 14.5L22 7L37 14.5V30L22 37L7 30V14.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
            <path d="M7 14.5L22 22L37 14.5M22 22V37M15 10.5L30 18" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
          </svg>
        </div>
      </div>
      <h1>Confirming your cart</h1>
      <p class="description">Morrow Market is checking seller inventory and delivery availability.</p>
      <p class="status">Please keep this page open</p>
    </section>
  </div>
</body>
</html>
