<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save to a list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #E8E8E4;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1A1D12;
  }
  .screen {
    width: 390px;
    box-sizing: border-box;
    background: #FFFFFF;
    padding: 34px 26px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6C7060;
    margin: 0 0 10px;
  }
  h1 {
    font-size: 25px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 22px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(174, 215, 20, 0.18);
    padding: 12px;
    margin-bottom: 26px;
  }
  .thumb {
    width: 56px;
    height: 56px;
    flex: none;
    background: #B9C88E;
  }
  .item-text { min-width: 0; }
  .item-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 13px;
    color: #5D6154;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rows { margin-bottom: 24px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 14px;
    background: #F3F3F0;
    margin-bottom: 6px;
  }
  .row.on { background: rgba(174, 215, 20, 0.34); }
  .row-label {
    font-size: 16px;
    line-height: 1.25;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.on .row-label { font-weight: 600; }
  .row-count {
    font-size: 13px;
    color: #5D6154;
    flex: none;
  }
  .check { flex: none; display: block; }
  .save {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: 0;
    border-radius: 0;
    background: #C0DE2A;
    color: #191C10;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 15px 0;
    text-align: center;
  }
  .newlist {
    font-size: 14px;
    color: #4B4F42;
    text-align: center;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Save</p>
    <h1>Pick a list for this stay</h1>

    <div class="item">
      <div class="thumb"></div>
      <div class="item-text">
        <div class="item-name">Casa Marena Guesthouse</div>
        <div class="item-meta">Alfama, Lisbon &middot; $184 per night</div>
      </div>
    </div>

    <div class="rows">
      <div class="row on">
        <span class="row-label">Portugal in April</span>
        <svg class="check" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 10.6l4 4L16.2 5.8" fill="none" stroke="#191C10" stroke-width="2.2"/>
        </svg>
      </div>
      <div class="row">
        <span class="row-label">Coastal towns</span>
        <span class="row-count">12 places</span>
      </div>
      <div class="row">
        <span class="row-label">Long weekends</span>
        <span class="row-count">5 places</span>
      </div>
    </div>

    <button class="save" type="button">Save to Portugal in April</button>
    <p class="newlist">Or start a new list</p>
  </div>
</body>
</html>
