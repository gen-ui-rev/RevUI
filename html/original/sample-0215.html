<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement Earned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e6e9eb;
      color: #172126;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f7f8f8;
    }

    .achievement {
      width: 100%;
      border: 1px solid #cdd5d8;
      border-radius: 4px;
      background: #ffffff;
    }

    .achievement-hero {
      padding: 26px 24px 24px;
      border-radius: 3px 3px 0 0;
      background: #20c4d8;
      color: #07343b;
      text-align: center;
    }

    .badge-mark {
      display: block;
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .achievement-body {
      padding: 22px 24px 24px;
    }

    .description {
      margin: 0 0 21px;
      color: #435158;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .details {
      margin: 0;
      border-top: 1px solid #d9dfe1;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 0;
      border-bottom: 1px solid #d9dfe1;
    }

    .detail-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    dt,
    dd {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    dt {
      color: #68767c;
      font-weight: 400;
    }

    dd {
      color: #172126;
      font-weight: 600;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="achievement" aria-labelledby="achievement-title">
      <div class="achievement-hero">
        <svg class="badge-mark" viewBox="0 0 76 76" role="img" aria-label="Bridge Builder badge">
          <path d="M22 50L17 70L29 64L38 73L42 51Z" fill="#07343B"/>
          <path d="M54 50L59 70L47 64L38 73L34 51Z" fill="#0B5A65"/>
          <path d="M38 3L47 8L57 8L62 18L70 25L68 36L70 47L62 55L57 65L46 64L38 70L29 64L18 65L14 55L6 47L8 36L6 25L14 18L19 8L29 8Z" fill="#F7FCFD" stroke="#07343B" stroke-width="2"/>
          <path d="M20 46V39C20 29.1 28.1 21 38 21C47.9 21 56 29.1 56 39V46" fill="none" stroke="#07343B" stroke-width="4" stroke-linecap="square"/>
          <path d="M17 47H59M27 47V39M49 47V39" fill="none" stroke="#07343B" stroke-width="4"/>
        </svg>
        <p class="eyebrow">Achievement earned</p>
        <h1 id="achievement-title">Bridge Builder</h1>
      </div>

      <div class="achievement-body">
        <p class="description">
          You welcomed new members and helped ten community circles start meaningful conversations.
        </p>

        <dl class="details">
          <div class="detail-row">
            <dt>Milestone</dt>
            <dd>10 circles connected</dd>
          </div>
          <div class="detail-row">
            <dt>Earned</dt>
            <dd>May 18, 2025</dd>
          </div>
        </dl>
      </div>
    </article>
  </div>
</body>
</html>
