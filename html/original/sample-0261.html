<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebe9;
      color: #17211d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 24px 22px;
      background: #f4f6f5;
    }

    .verification-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d8dfdc;
      border-radius: 6px;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #176b4c;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .service-mark {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 26px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 0;
      color: #53615b;
      font-size: 14px;
      line-height: 20px;
    }

    .intro strong {
      color: #2e3b35;
      font-weight: 600;
    }

    .code-section {
      margin-top: 22px;
    }

    .code-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .code-inputs {
      display: flex;
      gap: 7px;
    }

    .code-inputs input {
      width: 43px;
      height: 50px;
      padding: 0;
      border: 1px solid #b9c5c0;
      border-radius: 6px;
      background: #ffffff;
      color: #17211d;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      line-height: 50px;
      outline: none;
      caret-color: #176b4c;
    }

    .code-inputs input:last-child {
      border: 2px solid #19865e;
      line-height: 48px;
    }

    .expiry {
      margin: 8px 0 0;
      color: #65736d;
      font-size: 12px;
      line-height: 18px;
    }

    .verify-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid #176b4c;
      border-radius: 6px;
      background: #176b4c;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
    }

    .delivery-help {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #e0e5e3;
    }

    .delivery-help h2 {
      margin: 0 0 5px;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }

    .delivery-help p {
      margin: 0;
      color: #65736d;
      font-size: 14px;
      line-height: 20px;
    }

    .help-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 14px;
    }

    .resend-button {
      padding: 9px 12px;
      border: 1px solid #9aaba3;
      border-radius: 6px;
      background: #ffffff;
      color: #26342e;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
    }

    .method-link {
      color: #176b4c;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="verification-card" aria-labelledby="verification-title">
      <div class="service">
        <svg class="service-mark" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3.5 4.5h13v8.2a2 2 0 0 1-2 2H9l-3.8 2.4v-2.4h-.7a1 1 0 0 1-1-1V4.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M7 8h6M7 11h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Gatherlane</span>
      </div>

      <h1 id="verification-title">Verify your email</h1>
      <p class="intro">
        Enter the six-digit code sent to <strong>avery.hill@example.com</strong>.
      </p>

      <section class="code-section" aria-labelledby="code-label">
        <span class="code-label" id="code-label">Verification code</span>
        <div class="code-inputs" role="group" aria-label="Six-digit verification code">
          <input type="text" inputmode="numeric" value="8" maxlength="1" aria-label="Digit 1">
          <input type="text" inputmode="numeric" value="2" maxlength="1" aria-label="Digit 2">
          <input type="text" inputmode="numeric" value="4" maxlength="1" aria-label="Digit 3">
          <input type="text" inputmode="numeric" value="1" maxlength="1" aria-label="Digit 4">
          <input type="text" inputmode="numeric" value="9" maxlength="1" aria-label="Digit 5">
          <input type="text" inputmode="numeric" value="3" maxlength="1" aria-label="Digit 6">
        </div>
        <p class="expiry">This code expires at 10:42 AM.</p>
      </section>

      <button class="verify-button" type="button">Verify and continue</button>

      <section class="delivery-help" aria-labelledby="delivery-title">
        <h2 id="delivery-title">Didn’t receive the email?</h2>
        <p>Check your spam folder or request another code.</p>
        <div class="help-actions">
          <button class="resend-button" type="button">Send new code</button>
          <a class="method-link" href="#">Use another method</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
