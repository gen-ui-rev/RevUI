<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loomside — Badge Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#0e9f6e;
    --ink:#15201b;
    --mute:#6d7a73;
    --rule:#e6eae8;
  }
  html{background:#eceeec;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#eceeec;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    background:#ffffff;
    padding:34px 28px;
  }
  .who{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mono{
    width:44px;
    height:44px;
    border-radius:14px;
    background:var(--emerald);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .who .name{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
  }
  .who .sub{
    font-size:12px;
    color:var(--mute);
    line-height:1.4;
    margin-top:2px;
  }
  h1{
    margin:26px 0 0;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    line-height:1.35;
  }
  .goal{
    margin:6px 0 0;
    font-size:14px;
    font-weight:400;
    color:var(--mute);
    line-height:1.45;
  }
  .ringwrap{
    position:relative;
    width:172px;
    height:172px;
    margin:24px auto 0;
  }
  .ringwrap svg{display:block;}
  .ringtext{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .pct{
    font-size:38px;
    font-weight:700;
    color:var(--ink);
    line-height:1;
    letter-spacing:-.02em;
  }
  .pts{
    margin-top:7px;
    font-size:12px;
    font-weight:500;
    color:var(--mute);
  }
  .steps{
    margin-top:28px;
    border-top:1px solid var(--rule);
  }
  .step{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--rule);
  }
  .step .label{
    flex:1;
    min-width:0;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .step .val{
    font-size:14px;
    font-weight:400;
    color:var(--mute);
    flex:none;
  }
  .step .val.active{
    color:var(--emerald);
    font-weight:700;
  }
  .check{flex:none;display:block;}
  .foot{
    margin-top:16px;
    font-size:12px;
    color:var(--mute);
    line-height:1.5;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="who">
      <div class="mono">ME</div>
      <div>
        <div class="name">Mara Ellison</div>
        <div class="sub">Loomside · Spring season</div>
      </div>
    </div>

    <h1>Community Builder badge</h1>
    <p class="goal">Earn 500 circle points before March 31 to unlock it.</p>

    <div class="ringwrap">
      <svg width="172" height="172" viewBox="0 0 172 172" aria-hidden="true">
        <circle cx="86" cy="86" r="72" fill="none" stroke="#e6eae8" stroke-width="13"></circle>
        <circle cx="86" cy="86" r="72" fill="none" stroke="#0e9f6e" stroke-width="13"
                stroke-linecap="round"
                stroke-dasharray="307.7 144.7"
                transform="rotate(-90 86 86)"></circle>
      </svg>
      <div class="ringtext">
        <div class="pct">68%</div>
        <div class="pts">340 of 500 points</div>
      </div>
    </div>

    <div class="steps">
      <div class="step">
        <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8.4L6.4 11.8L13 5.2" stroke="#0e9f6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">Join three circles</span>
        <span class="val">Done</span>
      </div>
      <div class="step">
        <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8.4L6.4 11.8L13 5.2" stroke="#0e9f6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">Reply in 25 threads</span>
        <span class="val">Done</span>
      </div>
      <div class="step">
        <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6" stroke="#c6cfca" stroke-width="2"/>
        </svg>
        <span class="label">Host a live room</span>
        <span class="val active">1 of 3</span>
      </div>
    </div>

    <p class="foot">Points update each night. 160 points left, 23 days to go.</p>
  </div>
</body>
</html>
