<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Subscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7ea;
      color: #242229;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 34px 24px;
      background: #f3f2f5;
    }

    .subscription-card {
      width: 342px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(37, 32, 45, 0.09);
    }

    .hero {
      width: 342px;
      height: 132px;
      object-fit: cover;
      display: block;
      background: #d8d4dc;
      border-radius: 6px 6px 0 0;
    }

    .card-content {
      padding: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #7150a3;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      line-height: 1.15;
      font-weight: 700;
      color: #252129;
    }

    .description {
      margin: 10px 0 16px;
      color: #605b66;
      font-size: 15px;
      line-height: 1.45;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 18px;
    }

    .monogram {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border-radius: 6px;
      background: #eee9f5;
      color: #674594;
      font-size: 14px;
      font-weight: 600;
    }

    .author-name,
    .author-role {
      margin: 0;
      line-height: 1.25;
    }

    .author-name {
      color: #302c34;
      font-size: 15px;
      font-weight: 600;
    }

    .author-role {
      margin-top: 2px;
      color: #77717c;
      font-size: 13px;
    }

    .subscribe-button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #7650a8;
      color: #ffffff;
      font: 600 15px 'Source Sans 3', system-ui, sans-serif;
    }

    .subscribe-button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .status {
      margin: 13px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #625d68;
      font-size: 13px;
      line-height: 1.35;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #7650a8;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="subscription-card" aria-labelledby="subscription-title">
      <img
        class="hero"
        src="https://loremflickr.com/342/132/salad?lock=2593"
        width="342"
        height="132"
        alt="A prepared salad for a weekly nutrition plan"
      >
      <div class="card-content">
        <p class="eyebrow">Weekly nutrition brief</p>
        <h1 id="subscription-title">The Sunday Plate</h1>
        <p class="description">Meal-planning notes and practical nutrition guidance delivered every Sunday.</p>

        <div class="author">
          <div class="monogram" aria-hidden="true">ME</div>
          <div>
            <p class="author-name">Mara Ellison</p>
            <p class="author-role">Registered dietitian</p>
          </div>
        </div>

        <button class="subscribe-button" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Subscribed
        </button>

        <p class="status">
          <span class="status-dot" aria-hidden="true"></span>
          Active since May 12, 2025
        </p>
      </div>
    </section>
  </div>
</body>
</html>
