<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Practice Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 32px 0;
      background: #d8dde3;
      color: #172033;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #eef1f4;
    }

    .topbar {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
      padding: 13px 14px;
      background: #ffffff;
      border-bottom: 1px solid #dfe4e9;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      color: #475569;
      background: transparent;
      border: 0;
      border-radius: 50%;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .heading {
      min-width: 0;
    }

    .heading h1 {
      margin: 0;
      font-size: 20px;
      line-height: 24px;
      font-weight: 700;
      color: #172033;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .heading p {
      margin: 2px 0 0;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
      color: #687386;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 12px 14px 10px;
    }

    .viewfinder {
      position: relative;
      height: 590px;
      background: #334155;
      border: 1px solid #435269;
      border-radius: 14px;
    }

    .camera-top {
      position: absolute;
      top: 15px;
      right: 15px;
      left: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
    }

    .mode-label {
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .auto-state {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      color: #f8fafc;
      background: #475569;
      border: 1px solid #64748b;
      border-radius: 14px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .auto-state svg {
      width: 15px;
      height: 15px;
    }

    .scan-frame {
      position: absolute;
      top: 64px;
      left: 35px;
      width: 290px;
      height: 380px;
      border: 2px solid #cbd5e1;
    }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #ffffff;
      border-style: solid;
    }

    .corner.tl {
      top: -3px;
      left: -3px;
      border-width: 4px 0 0 4px;
    }

    .corner.tr {
      top: -3px;
      right: -3px;
      border-width: 4px 4px 0 0;
    }

    .corner.bl {
      bottom: -3px;
      left: -3px;
      border-width: 0 0 4px 4px;
    }

    .corner.br {
      right: -3px;
      bottom: -3px;
      border-width: 0 4px 4px 0;
    }

    .worksheet {
      position: absolute;
      top: 18px;
      right: 18px;
      bottom: 18px;
      left: 18px;
      padding: 20px 18px;
      background: #ffffff;
      color: #344054;
    }

    .paper-kicker {
      margin: 0 0 4px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .worksheet h2 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 22px;
      font-weight: 700;
      color: #1e293b;
    }

    .worksheet p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 18px;
      font-weight: 600;
      color: #64748b;
    }

    .question {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    .question-number {
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      color: #475569;
    }

    .answer-lines {
      display: grid;
      gap: 7px;
    }

    .answer-line {
      height: 2px;
      background: #d6dce3;
    }

    .answer-line.short {
      width: 68%;
    }

    .detection {
      position: absolute;
      top: 458px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 7px;
      transform: translateX(-50%);
      color: #f8fafc;
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detection svg {
      width: 18px;
      height: 18px;
      color: #dbe5ef;
    }

    .capture-controls {
      position: absolute;
      right: 26px;
      bottom: 18px;
      left: 26px;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: end;
    }

    .control {
      display: grid;
      justify-items: center;
      gap: 5px;
      padding: 0;
      color: #ffffff;
      background: transparent;
      border: 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .control-box {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      background: #475569;
      border: 1px solid #64748b;
      border-radius: 14px;
    }

    .control-box svg {
      width: 22px;
      height: 22px;
    }

    .capture {
      display: grid;
      justify-items: center;
      gap: 5px;
      padding: 0;
      color: #ffffff;
      background: transparent;
      border: 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .capture-ring {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 4px solid #ffffff;
      border-radius: 50%;
    }

    .capture-core {
      width: 54px;
      height: 54px;
      background: #f8fafc;
      border-radius: 50%;
    }

    .scan-tip {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      margin-top: 10px;
      padding: 12px 14px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(30, 41, 59, 0.08);
    }

    .tip-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #475569;
      background: #e7ebef;
      border-radius: 14px;
    }

    .tip-icon svg {
      width: 21px;
      height: 21px;
    }

    .scan-tip h2 {
      margin: 0;
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      color: #253044;
    }

    .scan-tip p {
      margin: 2px 0 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: #687386;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 10px 9px;
      background: #ffffff;
      border-top: 1px solid #dfe4e9;
    }

    .tab {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 3px;
      padding: 4px 0 0;
      color: #7b8493;
      background: transparent;
      border: 0;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #475569;
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: -7px;
      width: 34px;
      height: 3px;
      background: #475569;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" aria-label="Close scanner">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="heading">
        <h1>Scan practice page</h1>
        <p>FluentArc · French Foundations</p>
      </div>

      <button class="icon-button" aria-label="Scanner help">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M9.8 9.2A2.45 2.45 0 0 1 12.2 7c1.55 0 2.7.9 2.7 2.3 0 1.15-.63 1.78-1.65 2.4-.9.55-1.25 1.04-1.25 1.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16.8" r="1" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="viewfinder" aria-label="Worksheet camera viewfinder">
        <div class="camera-top">
          <span class="mode-label">PAGE SCAN</span>
          <div class="auto-state">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4.5 10.2L8 13.5L15.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Auto capture
          </div>
        </div>

        <div class="scan-frame">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>

          <article class="worksheet">
            <p class="paper-kicker">LESSON 08</p>
            <h2>Vocabulary practice</h2>
            <p>Match each word with its meaning.</p>

            <div class="question">
              <span class="question-number">1.</span>
              <div class="answer-lines">
                <span class="answer-line"></span>
                <span class="answer-line short"></span>
              </div>
            </div>

            <div class="question">
              <span class="question-number">2.</span>
              <div class="answer-lines">
                <span class="answer-line"></span>
                <span class="answer-line short"></span>
              </div>
            </div>

            <div class="question">
              <span class="question-number">3.</span>
              <div class="answer-lines">
                <span class="answer-line"></span>
                <span class="answer-line short"></span>
              </div>
            </div>

            <div class="question">
              <span class="question-number">4.</span>
              <div class="answer-lines">
                <span class="answer-line"></span>
                <span class="answer-line short"></span>
              </div>
            </div>
          </article>
        </div>

        <div class="detection">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M6.5 10.2L8.8 12.5L13.8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          All page edges found
        </div>

        <div class="capture-controls">
          <button class="control" aria-label="Import a page">
            <span class="control-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="2"/>
                <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                <path d="M5.5 17L10 12.5L13 15L15.5 12.5L18.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            Import
          </button>

          <button class="capture" aria-label="Capture page">
            <span class="capture-ring">
              <span class="capture-core"></span>
            </span>
            Capture
          </button>

          <button class="control" aria-label="Turn flash on">
            <span class="control-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M13.5 2.8L5.8 13H11L10.5 21.2L18.2 11H13L13.5 2.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </span>
            Flash
          </button>
        </div>
      </section>

      <section class="scan-tip">
        <div class="tip-icon">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 3H5C3.9 3 3 3.9 3 5V8M16 3H19C20.1 3 21 3.9 21 5V8M8 21H5C3.9 21 3 20.1 3 19V16M16 21H19C20.1 21 21 20.1 21 19V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="7" y="6" width="10" height="12" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <h2>Keep the full page inside the frame</h2>
          <p>Hold steady to capture text clearly.</p>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5.5C4 4.67 4.67 4 5.5 4H10C11.1 4 12 4.9 12 6V20C12 18.9 11.1 18 10 18H5.5C4.67 18 4 17.33 4 16.5V5.5Z" stroke="currentColor" stroke-width="2"/>
          <path d="M20 5.5C20 4.67 19.33 4 18.5 4H14C12.9 4 12 4.9 12 6V20C12 18.9 12.9 18 14 18H18.5C19.33 18 20 17.33 20 16.5V5.5Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        Learn
      </button>

      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 12A8 8 0 1 1 17.66 6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 5V10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 8V12L14.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Review
      </button>

      <button class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 4H5C3.9 4 3 4.9 3 6V9M16 4H19C20.1 4 21 4.9 21 6V9M8 20H5C3.9 20 3 19.1 3 18V15M16 20H19C20.1 20 21 19.1 21 18V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="7" y="7" width="10" height="10" stroke="currentColor" stroke-width="2"/>
        </svg>
        Scan
      </button>

      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M5 20C5.6 16.7 8.1 15 12 15C15.9 15 18.4 16.7 19 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Profile
      </button>
    </nav>
  </div>
</body>
</html>
