<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Permission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eeee;
      color: #172024;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 30px 24px;
      background: #f5f7f7;
    }

    .permission {
      width: 100%;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #ced8da;
      border-radius: 0;
    }

    .permission-mark {
      width: 96px;
      height: 96px;
      margin-bottom: 26px;
      display: grid;
      place-items: center;
      color: #073840;
      background: #22d3ee;
      border: 1px solid #0fb8d1;
      border-radius: 0;
    }

    .permission-mark svg {
      width: 42px;
      height: 42px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #087f92;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 270px;
      color: #172024;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .description {
      margin: 14px 0 0;
      color: #536268;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    .privacy {
      margin: 14px 0 0;
      color: #6d7b80;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }

    .actions {
      margin-top: 26px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border-radius: 0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }

    .primary {
      color: #073840;
      background: #22d3ee;
      border: 1px solid #0fb8d1;
    }

    .secondary {
      color: #344247;
      background: #ffffff;
      border: 1px solid #ced8da;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission" aria-labelledby="permission-title">
      <div class="permission-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 16.5H14L17.5 11H30.5L34 16.5H41V38H7V16.5Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="24" cy="26.5" r="7.5" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </div>

      <p class="eyebrow">Visual search</p>
      <h1 id="permission-title">Let Nook Market use your camera</h1>
      <p class="description">Take a photo of an item to find similar products and compare current listings.</p>
      <p class="privacy">Camera access is used only while you scan. You can change this permission in device settings.</p>

      <div class="actions">
        <button class="primary" type="button">Allow camera access</button>
        <button class="secondary" type="button">Not now</button>
      </div>
    </section>
  </div>
</body>
</html>
