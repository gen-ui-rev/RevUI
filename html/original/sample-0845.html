<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Reservation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e0;
      color: #24221f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #fbfaf7;
    }

    .cancel-mark {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a65f00;
      background: #f4dfbd;
      border-radius: 4px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .intro {
      margin: 0;
      color: #66615a;
      font-size: 15px;
      line-height: 1.5;
    }

    .reservation {
      margin-top: 26px;
      padding: 18px 0;
      border-top: 1px solid #d8d4cd;
      border-bottom: 1px solid #d8d4cd;
    }

    .reservation-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .reservation img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      object-fit: cover;
      display: block;
      background: #d3cec5;
      border-radius: 4px;
    }

    .reservation-copy {
      min-width: 0;
    }

    .reservation-copy h2 {
      margin: 0 0 5px;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    .reservation-copy p {
      margin: 0;
      color: #66615a;
      font-size: 14px;
      line-height: 1.45;
    }

    .boundary-note {
      margin: 20px 0 0;
      color: #56514b;
      font-size: 14px;
      line-height: 1.5;
    }

    .boundary-note strong {
      color: #24221f;
      font-weight: 700;
    }

    .actions {
      margin-top: 24px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 4px;
      font: inherit;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      cursor: pointer;
    }

    .cancel-button {
      border: 1px solid #a65f00;
      background: #a65f00;
      color: #ffffff;
    }

    .keep-button {
      margin-top: 10px;
      border: 1px solid #bbb6ae;
      background: transparent;
      color: #34312d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="cancel-title">
      <div class="cancel-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M7 7L17 17M17 7L7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="cancel-title">Cancel this reservation?</h1>
      <p class="intro">Your spot in the Morrow listening room will be released immediately.</p>

      <section class="reservation" aria-label="Reserved listening room">
        <div class="reservation-row">
          <img src="https://loremflickr.com/72/72/concert?lock=11230" width="72" height="72" alt="Amber stage lights at a live concert">
          <div class="reservation-copy">
            <h2>Afterlight: Album Premiere</h2>
            <p>Hosted by Arden Cole</p>
            <p>October 18, 2026 at 8:00 PM</p>
          </div>
        </div>
      </section>

      <p class="boundary-note"><strong>This is not a deletion.</strong> The album and your saved music will remain in your library.</p>

      <div class="actions">
        <button class="cancel-button" type="button">Cancel reservation</button>
        <button class="keep-button" type="button">Keep reservation</button>
      </div>
    </main>
  </div>
</body>
</html>
