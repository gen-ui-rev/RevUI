<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Recommendation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #dededb;
      color: #26251f;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 40px 22px;
      background: #f1f1ee;
    }

    .reaction-card {
      padding: 26px 24px 24px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(42, 39, 29, 0.09);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a75d00;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .place {
      margin: 8px 0 0;
      color: #6b685e;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .count {
      margin: 26px 0 18px;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .count span {
      display: block;
      margin-top: 5px;
      color: #6b685e;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
      letter-spacing: 0;
    }

    .recommend-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: #e9a11b;
      color: #2d220d;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .recommend-button svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .privacy-note {
      margin: 13px 0 0;
      color: #77736a;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 400;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="reaction-card" aria-labelledby="reaction-title">
      <p class="eyebrow">Public recommendation</p>
      <h1 id="reaction-title">Would you recommend this viewpoint?</h1>
      <p class="place">Amber Ridge Overlook · North Coast</p>

      <p class="count">
        1,284
        <span>travelers recommend this stop</span>
      </p>

      <button class="recommend-button" type="button" aria-label="Recommend Amber Ridge Overlook">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7.5 10.25V20H4.75A1.75 1.75 0 0 1 3 18.25V12a1.75 1.75 0 0 1 1.75-1.75H7.5Z" fill="currentColor"/>
          <path d="M7.5 10.25 11.7 4.4c.47-.66 1.47-.48 1.7.3.25.86.25 1.77 0 2.63l-.44 1.52h5.19c1.78 0 3.11 1.63 2.76 3.38l-1.1 5.5A2.82 2.82 0 0 1 17.04 20H7.5v-9.75Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Recommend
      </button>

      <p class="privacy-note">Your recommendation and display name will be visible to travelers.</p>
    </section>
  </div>
</body>
</html>
