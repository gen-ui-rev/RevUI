<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quorum — New scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:40px 0;margin:0;background:#d9d8d2;
    font-family:'Nunito Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;height:844px;background:#f7f6f2;color:#1c1d18;
    display:flex;flex-direction:column;position:relative;
  }

  /* top bar */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:16px 18px;border-bottom:1px solid #dfded6;
  }
  .topbar .title{font-size:16px;font-weight:700;flex:1;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#3b3d34;}
  .flash{display:flex;align-items:center;gap:6px;color:#6f7d2c;font-size:13px;font-weight:600;}

  /* destination */
  .dest{
    display:flex;align-items:center;gap:14px;
    padding:12px 18px;border-bottom:1px solid #dfded6;
  }
  .dest .lines{flex:1;min-width:0;}
  .dest .k{font-size:12px;font-weight:600;color:#83857a;letter-spacing:.06em;text-transform:uppercase;}
  .dest .v{font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* viewfinder */
  .finder{height:400px;background:#22241e;position:relative;}
  .finder .stamp{
    position:absolute;left:18px;top:16px;font-size:12px;font-weight:600;
    color:#c9cdb4;letter-spacing:.08em;text-transform:uppercase;
  }
  .finder .zoom{
    position:absolute;right:18px;top:16px;font-size:12px;font-weight:600;color:#c9cdb4;
  }
  .finder .pageno{
    position:absolute;left:18px;bottom:16px;font-size:12px;font-weight:600;color:#c9cdb4;
  }

  /* hint strip */
  .hint{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;border-bottom:1px solid #dfded6;
  }
  .dot{width:9px;height:9px;background:#6f7d2c;flex:none;}
  .hint .main{font-size:14px;font-weight:600;flex:1;}
  .hint .sub{font-size:12px;color:#83857a;}

  /* modes */
  .modes{display:flex;border-bottom:1px solid #dfded6;}
  .modes span{
    flex:1;text-align:center;padding:16px 0 14px;font-size:14px;color:#6b6d62;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .modes span.on{color:#6f7d2c;font-weight:700;border-bottom-color:#6f7d2c;}

  /* capture */
  .capture{
    flex:1;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;
  }
  .side{width:78px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#3b3d34;}
  .side .lbl{font-size:12px;font-weight:600;color:#6b6d62;}
  .side.done{color:#6f7d2c;}
  .side.done .lbl{color:#6f7d2c;}
  .shutter{
    width:78px;height:78px;background:#6f7d2c;
    display:flex;align-items:center;justify-content:center;
  }
  .shutter i{display:block;width:52px;height:52px;border:2px solid #eef0e2;}

  /* tab bar */
  .tabs{
    height:72px;border-top:1px solid #dfded6;display:flex;
  }
  .tabs a{
    flex:1;text-decoration:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;
    color:#7b7d72;font-size:12px;font-weight:600;
  }
  .tabs a.on{color:#6f7d2c;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <span class="icon-btn" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l12 12M16 4L4 16"/></svg>
    </span>
    <span class="title">New scan</span>
    <span class="flash">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 2L5 11h4l-1 7 7-10h-4l1-6z"/></svg>
      Auto
    </span>
    <span class="icon-btn" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h14v14H3zM8 3v14M13 3v14M3 8h14M3 13h14"/></svg>
    </span>
  </div>

  <div class="dest">
    <span class="icon-btn" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 5.5h6l1.8 2.2h9.2v9.8H2.5z"/></svg>
    </span>
    <span class="lines">
      <span class="k">Saving to</span>
      <span class="v">Q3 Planning / Whiteboards</span>
    </span>
    <span class="icon-btn" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l6 6-6 6"/></svg>
    </span>
  </div>

  <div class="finder">
    <svg width="390" height="400" viewBox="0 0 390 400" fill="none" aria-hidden="true">
      <!-- detected surface -->
      <path d="M60 92 L332 80 L344 312 L52 300 Z" fill="#b0bb52" fill-opacity="0.07" stroke="#b0bb52" stroke-width="2"/>
      <!-- whiteboard line art -->
      <g stroke="#7e8272" stroke-width="1.6" stroke-linecap="round">
        <rect x="128" y="122" width="140" height="98"/>
        <path d="M150 152h64M150 170h96M150 188h44"/>
        <rect x="222" y="146" width="26" height="26"/>
        <path d="M198 220v40M156 268l42-8M240 268l-42-8"/>
      </g>
      <!-- corner brackets -->
      <g stroke="#b0bb52" stroke-width="3" stroke-linecap="square">
        <path d="M30 68v-24h24M360 68v-24h-24M30 332v24h24M360 332v24h-24"/>
      </g>
    </svg>
    <span class="stamp">Whiteboard</span>
    <span class="zoom">1.0x</span>
    <span class="pageno">Page 4</span>
  </div>

  <div class="hint">
    <span class="dot"></span>
    <span class="main">Edges locked — hold steady</span>
    <span class="sub">Auto crop on</span>
  </div>

  <div class="modes">
    <span>Document</span>
    <span class="on">Whiteboard</span>
    <span>Text</span>
    <span>Card</span>
  </div>

  <div class="capture">
    <span class="side">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M7 3h9l4 4v12H7z"/><path d="M4 7v12.5A2.5 2.5 0 006.5 22H17"/>
      </svg>
      <span class="lbl">3 pages</span>
    </span>

    <span class="shutter"><i></i></span>

    <span class="side done">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M4 14l6 6L22 7"/>
      </svg>
      <span class="lbl">Finish</span>
    </span>
  </div>

  <nav class="tabs">
    <a href="#">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5L11 3l8 6.5V19H3z"/></svg>
      Home
    </a>
    <a href="#">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h12v16H5zM8 7h6M8 11h6M8 15h4"/></svg>
      Notes
    </a>
    <a href="#" class="on">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h4l1.5-2h5L15 7h4v11H3z"/><circle cx="11" cy="12" r="3.4"/></svg>
      Capture
    </a>
    <a href="#">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l2.5 2.5L11 4M4 15l2.5 2.5L11 13M13 6h6M13 16h6"/></svg>
      Tasks
    </a>
  </nav>

</div>
</body>
</html>
