<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketplace — Order Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:40px 0;margin:0;background:#e9e7e2;
    font-family:'Poppins',system-ui,sans-serif;color:#15181a;
  }
  .screen{
    width:390px;height:844px;background:#ffffff;position:relative;
    display:flex;flex-direction:column;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 8px 20px;
  }
  .topbar .title{font-size:14px;font-weight:500;color:#6b7178;letter-spacing:.02em;}
  .iconbtn{
    width:34px;height:34px;border:1px solid #e3e2de;border-radius:14px;
    display:flex;align-items:center;justify-content:center;background:#fff;
  }
  .spacer34{width:34px;height:34px;}

  .hero{padding:34px 28px 0 28px;text-align:center;}
  .burst{position:relative;width:132px;height:132px;margin:0 auto;}
  .burst svg.confetti{position:absolute;inset:0;}
  .mark{
    position:absolute;left:24px;top:24px;width:84px;height:84px;border-radius:50%;
    background:#12894f;display:flex;align-items:center;justify-content:center;
  }
  h1{font-size:26px;font-weight:600;margin:22px 0 0 0;letter-spacing:-.01em;}
  .sub{font-size:14px;line-height:21px;color:#6b7178;margin:8px 0 0 0;}

  .card{
    margin:30px 20px 0 20px;border:1px solid #e3e2de;border-radius:14px;background:#fff;
  }
  .courier{display:flex;align-items:center;gap:14px;padding:16px;}
  .mono{
    width:48px;height:48px;border-radius:14px;background:#e8f2ec;color:#12894f;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;letter-spacing:.02em;flex-shrink:0;
  }
  .courier .who{min-width:0;}
  .courier .name{font-size:15px;font-weight:500;}
  .courier .role{font-size:12px;color:#6b7178;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .divider{height:1px;background:#e3e2de;}
  .row{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;}
  .row .label{font-size:14px;color:#6b7178;}
  .row .value{font-size:14px;font-weight:500;}
  .row .value.green{color:#12894f;}

  .actions{padding:20px;margin-top:auto;margin-bottom:14px;}
  .btn{
    display:block;border-radius:14px;text-align:center;font-size:15px;font-weight:500;
    padding:15px 16px;text-decoration:none;
  }
  .btn.primary{background:#12894f;color:#fff;border:1px solid #12894f;}
  .btn.ghost{background:#fff;color:#15181a;border:1px solid #e3e2de;margin-top:10px;}

  .tabbar{
    border-top:1px solid #e3e2de;display:flex;padding:10px 8px 16px 8px;background:#fff;
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
    font-size:12px;color:#9aa0a6;
  }
  .tab.active{color:#12894f;font-weight:500;}
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="iconbtn" role="img" aria-label="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15181a" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <div class="title">Order Confirmed</div>
      <div class="spacer34"></div>
    </div>

    <div class="hero">
      <div class="burst">
        <svg class="confetti" width="132" height="132" viewBox="0 0 132 132" fill="none" aria-hidden="true">
          <rect x="8" y="30" width="4" height="10" rx="2" transform="rotate(-24 8 30)" fill="#9dcfb4"/>
          <rect x="118" y="42" width="4" height="10" rx="2" transform="rotate(28 118 42)" fill="#9dcfb4"/>
          <rect x="30" y="8" width="4" height="9" rx="2" transform="rotate(16 30 8)" fill="#d7d5d0"/>
          <rect x="99" y="14" width="4" height="9" rx="2" transform="rotate(-38 99 14)" fill="#d7d5d0"/>
          <rect x="20" y="106" width="4" height="9" rx="2" transform="rotate(42 20 106)" fill="#d7d5d0"/>
          <rect x="110" y="98" width="4" height="10" rx="2" transform="rotate(-14 110 98)" fill="#9dcfb4"/>
          <circle cx="64" cy="4" r="2.5" fill="#12894f"/>
          <circle cx="4" cy="72" r="2.5" fill="#d7d5d0"/>
          <circle cx="128" cy="70" r="2.5" fill="#12894f"/>
          <circle cx="66" cy="128" r="2.5" fill="#9dcfb4"/>
        </svg>
        <div class="mark">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.8l4.4 4.4L19 7.6"/></svg>
        </div>
      </div>

      <h1>Your order is placed</h1>
      <p class="sub">We sent a receipt to hannah.beckett@mailbox.com.<br>Packing starts within two hours.</p>
    </div>

    <div class="card">
      <div class="courier">
        <div class="mono">RL</div>
        <div class="who">
          <div class="name">Rosa Lindqvist</div>
          <div class="role">Assigned courier · Northside route</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="label">Order number</span>
        <span class="value">KM-48210</span>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="label">Arrives</span>
        <span class="value green">Thu, Jun 12</span>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="label">Total paid</span>
        <span class="value">$128.40</span>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" href="#">Track order</a>
      <a class="btn ghost" href="#">Continue shopping</a>
    </div>

    <div class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"/></svg>
        Home
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        Search
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1 13H6z"/><path d="M9 7V5.5A3 3 0 0115 5.5V7"/></svg>
        Orders
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/></svg>
        Account
      </div>
    </div>

  </div>
</body>
</html>
