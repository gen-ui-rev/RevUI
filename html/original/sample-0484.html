<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Studyloom Account</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ece9ea;
      color: #211b1d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #ded9db;
    }

    .topbar {
      min-height: 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      border-bottom: 1px solid #eee8ea;
    }

    .back-button {
      width: 40px;
      height: 40px;
      margin-left: -8px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #2b2426;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    .brand-mark {
      width: 20px;
      height: 20px;
      border-radius: 7px;
      background: #c94068;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 10px;
      left: 7px;
      top: 5px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .help-link {
      color: #655b5e;
      font-size: 14px;
      font-weight: 600;
      text-align: right;
      text-decoration: none;
    }

    .auth-tabs {
      min-height: 46px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #eee8ea;
    }

    .auth-tab {
      position: relative;
      display: grid;
      place-items: center;
      color: #756b6e;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-tab.active {
      color: #b92f58;
    }

    .auth-tab.active::after {
      content: "";
      position: absolute;
      right: 34px;
      bottom: -1px;
      left: 34px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: #c94068;
    }

    main {
      flex: 1;
      padding: 18px 24px 20px;
    }

    h1 {
      margin: 0;
      color: #201a1c;
      font-size: 30px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .intro {
      margin: 5px 0 0;
      color: #6b6164;
      font-size: 14px;
      line-height: 20px;
    }

    .social-options {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .social-button {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 24px 1fr 24px;
      align-items: center;
      border: 1px solid #d9d1d4;
      border-radius: 14px;
      background: #ffffff;
      color: #2a2325;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .social-button svg {
      width: 20px;
      height: 20px;
      color: #8f4960;
    }

    .divider {
      margin: 16px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #8a8083;
      font-size: 12px;
      line-height: 18px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e6dfe1;
    }

    .signup-form {
      margin: 0;
    }

    .field {
      margin-bottom: 12px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #403739;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #cfc6c9;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #251f21;
      font-size: 15px;
    }

    input::placeholder {
      color: #958a8d;
      opacity: 1;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 64px;
    }

    .show-button {
      position: absolute;
      right: 5px;
      top: 5px;
      height: 38px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: #a62e52;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .requirements {
      margin: 9px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      list-style: none;
      color: #73696c;
      font-size: 12px;
      line-height: 18px;
    }

    .requirements li {
      position: relative;
      padding-left: 13px;
      white-space: nowrap;
    }

    .requirements li::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8adb0;
    }

    .consent {
      margin-top: 13px;
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 10px;
      align-items: start;
      color: #574e51;
      font-size: 13px;
      line-height: 19px;
    }

    .consent input {
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      accent-color: #c94068;
    }

    .consent a,
    .legal a {
      color: #a82f53;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .primary-button {
      width: 100%;
      height: 50px;
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      background: #c94068;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .legal {
      margin: 9px 4px 0;
      color: #7e7477;
      font-size: 12px;
      line-height: 17px;
      text-align: center;
    }

    svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>

      <div class="brand" aria-label="Studyloom">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Studyloom</span>
      </div>

      <a class="help-link" href="#">Help</a>
    </header>

    <nav class="auth-tabs" aria-label="Account access">
      <a class="auth-tab" href="#">Log in</a>
      <a class="auth-tab active" href="#" aria-current="page">Create account</a>
    </nav>

    <main>
      <h1>Start learning</h1>
      <p class="intro">Create an account to save lessons, practice sets, and course progress.</p>

      <section class="social-options" aria-label="Social signup options">
        <button class="social-button" type="button">
          <svg viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
            <circle cx="8" cy="8" r="3"></circle>
            <circle cx="17" cy="7" r="2.5"></circle>
            <path d="M3.5 18c.5-3.2 2.1-5 4.5-5s4 1.8 4.5 5"></path>
            <path d="M14 13c2.9 0 4.8 1.5 5.5 4.5"></path>
          </svg>
          <span>Continue with Learning Circle</span>
          <span></span>
        </button>

        <button class="social-button" type="button">
          <svg viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5.5 19c.7-4 2.9-6 6.5-6s5.8 2 6.5 6"></path>
          </svg>
          <span>Continue with Campus Connect</span>
          <span></span>
        </button>
      </section>

      <div class="divider">or sign up with email</div>

      <form class="signup-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="learner@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="Create a password" autocomplete="new-password">
            <button class="show-button" type="button">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="password-wrap">
            <input id="confirm-password" type="password" placeholder="Enter password again" autocomplete="new-password">
            <button class="show-button" type="button">Show</button>
          </div>
        </div>

        <ul class="requirements" aria-label="Password requirements">
          <li>8 or more characters</li>
          <li>One number or symbol</li>
        </ul>

        <label class="consent">
          <input type="checkbox">
          <span>I agree to the <a href="#">Terms of Use</a> and acknowledge the <a href="#">Privacy Notice</a>.</span>
        </label>

        <button class="primary-button" type="submit">Create account</button>

        <p class="legal">You must be at least 13 years old to create an individual account.</p>
      </form>
    </main>
  </div>
</body>
</html>
