<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellpath Nutrition Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe3e2;
      color: #20302f;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #fbfcfb;
    }

    .topbar {
      height: 68px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e1e7e5;
      background: #fbfcfb;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #20302f;
    }

    .topbar-title {
      flex: 1;
      margin-left: 10px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .exit-link {
      border: 0;
      padding: 8px 0 8px 12px;
      background: transparent;
      color: #526563;
      font-size: 13px;
      font-weight: 500;
    }

    main {
      padding: 19px 24px 88px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      line-height: 20px;
    }

    .progress-meta strong {
      font-weight: 600;
      color: #315f5b;
    }

    .progress-meta span {
      color: #6a7a78;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 10px;
      background: #e5ecea;
      border-radius: 6px;
    }

    .progress-fill {
      width: 50%;
      height: 6px;
      background: #82aaa6;
      border-radius: 6px;
    }

    .question {
      margin-top: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #66817e;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1e2d2c;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.36;
      letter-spacing: -0.02em;
    }

    .meal-photo {
      width: 342px;
      height: 132px;
      margin-top: 17px;
      display: block;
      object-fit: cover;
      background: #dce6e3;
      border-radius: 6px;
    }

    .answers {
      margin-top: 16px;
      border-top: 1px solid #dfe6e4;
    }

    .answer {
      width: 100%;
      min-height: 52px;
      padding: 10px 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid #dfe6e4;
      background: transparent;
      color: #293a38;
      text-align: left;
      font-size: 14px;
      font-weight: 400;
      line-height: 21px;
    }

    .answer.selected {
      margin-top: -1px;
      border: 1px solid #9bbab7;
      background: #e7f0ee;
      border-radius: 6px;
    }

    .radio {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      border: 1.5px solid #91a19f;
      border-radius: 50%;
      background: #fbfcfb;
    }

    .selected .radio {
      border-color: #467a75;
    }

    .selected .radio::after {
      width: 10px;
      height: 10px;
      content: "";
      display: block;
      border-radius: 50%;
      background: #467a75;
    }

    .check-answer {
      width: 100%;
      height: 50px;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: #315f5b;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
    }

    .tabbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 72px;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dfe6e4;
      background: #fbfcfb;
    }

    .tab {
      flex: 1;
      padding: 9px 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #778683;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
    }

    .tab.active {
      color: #315f5b;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="topbar-title">Nutrition quiz</div>
      <button class="exit-link" type="button">Save &amp; exit</button>
    </header>

    <main>
      <section aria-label="Quiz progress">
        <div class="progress-meta">
          <strong>Question 4 of 8</strong>
          <span>50% complete</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill"></div>
        </div>
      </section>

      <section class="question" aria-labelledby="question-title">
        <p class="eyebrow">Post-workout nutrition</p>
        <h1 id="question-title">What would make this salad a more complete post-workout meal?</h1>

        <img
          class="meal-photo"
          src="https://loremflickr.com/342/132/salad?lock=8470"
          width="342"
          height="132"
          alt="A fresh vegetable salad in a bowl"
        >

        <div class="answers" role="radiogroup" aria-label="Answer choices">
          <button class="answer selected" type="button" role="radio" aria-checked="true">
            <span class="radio" aria-hidden="true"></span>
            <span>Add grilled chicken and whole-grain bread</span>
          </button>
          <button class="answer" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span>Add a second serving of leafy greens</span>
          </button>
          <button class="answer" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span>Replace the dressing with lemon juice</span>
          </button>
          <button class="answer" type="button" role="radio" aria-checked="false">
            <span class="radio" aria-hidden="true"></span>
            <span>Add sliced cucumber and fresh herbs</span>
          </button>
        </div>

        <button class="check-answer" type="button">Check answer</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 11.5L12 5L20 11.5V20H14.5V14.5H9.5V20H4V11.5Z" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Today</span>
      </div>
      <div class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5.5C7.7 5.1 10 5.8 12 7.5V19C10 17.3 7.7 16.6 5 17V5.5Z" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M19 5.5C16.3 5.1 14 5.8 12 7.5V19C14 17.3 16.3 16.6 19 17V5.5Z" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Learn</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V13M12 19V5M19 19V9" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Progress</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.25" stroke-width="1.7"/>
          <path d="M5.5 19C6.2 15.7 8.4 14 12 14C15.6 14 17.8 15.7 18.5 19" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </div>
    </nav>
  </div>
</body>
</html>
