<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0AA3BE;
    --accent-deep:#0A5C6B;
    --ink:#14201F;
    --muted:#6C7A7D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#E7EBEC;
    font-family:'Poppins', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    background:#E7EBEC;
    padding:24px 16px;
  }
  .panel{
    width:100%;
    background:#FFFFFF;
    border-radius:4px;
    padding:18px;
  }
  .summary{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(10,163,190,0.11);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .summary svg{display:block;}
  .summary .count{
    font-size:16px;
    font-weight:600;
    line-height:22px;
    color:var(--accent-deep);
  }
  .summary .range{
    font-size:12px;
    line-height:17px;
    color:#4C7B85;
  }
  .group{margin-bottom:14px;}
  .label{
    font-size:12px;
    font-weight:500;
    line-height:16px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:10px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    font-size:13px;
    font-weight:400;
    line-height:18px;
    padding:7px 12px;
    border-radius:4px;
    background:#F0F2F3;
    color:#41504F;
  }
  .chip.on{
    background:rgba(10,163,190,0.15);
    color:var(--accent-deep);
    font-weight:500;
  }
  .toggles{margin-bottom:14px;}
  .trow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 0;
  }
  .trow + .trow{border-top:1px solid #EEF1F2;}
  .trow p{
    margin:0;
    font-size:14px;
    line-height:20px;
    font-weight:400;
  }
  .sw{
    flex:0 0 auto;
    width:36px;
    height:20px;
    border-radius:4px;
    background:#DCE1E2;
    position:relative;
  }
  .sw.on{background:var(--accent);}
  .sw i{
    position:absolute;
    top:3px;
    left:3px;
    width:14px;
    height:14px;
    border-radius:4px;
    background:#FFFFFF;
    display:block;
  }
  .sw.on i{left:19px;}
  .actions{
    display:flex;
    gap:10px;
  }
  .btn{
    border-radius:4px;
    font-size:14px;
    line-height:20px;
    font-weight:500;
    padding:13px 14px;
    text-align:center;
  }
  .btn.reset{
    background:#F0F2F3;
    color:#41504F;
    flex:0 0 96px;
  }
  .btn.apply{
    background:var(--accent);
    color:#FFFFFF;
    flex:1 1 auto;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="panel">

      <div class="summary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A5C6B" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 7h10"/><path d="M18 7h2"/>
          <path d="M4 12h4"/><path d="M12 12h8"/>
          <path d="M4 17h10"/><path d="M18 17h2"/>
          <circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/>
        </svg>
        <div>
          <div class="count">48 sessions match</div>
          <div class="range">Feb 9 – May 9, 2025 &middot; 126 total</div>
        </div>
      </div>

      <div class="group">
        <div class="label">Sort by</div>
        <div class="chips">
          <span class="chip on">Most recent</span>
          <span class="chip">Longest</span>
          <span class="chip">Best recovery</span>
        </div>
      </div>

      <div class="group">
        <div class="label">Activity</div>
        <div class="chips">
          <span class="chip on">Running</span>
          <span class="chip on">Cycling</span>
          <span class="chip">Strength</span>
          <span class="chip">Rowing</span>
          <span class="chip">Yoga</span>
          <span class="chip">Hiking</span>
        </div>
      </div>

      <div class="group">
        <div class="label">Intensity zone</div>
        <div class="chips">
          <span class="chip">Recovery</span>
          <span class="chip on">Aerobic</span>
          <span class="chip on">Threshold</span>
          <span class="chip">Peak</span>
        </div>
      </div>

      <div class="toggles">
        <div class="trow">
          <p>Only sessions with heart rate</p>
          <span class="sw on"><i></i></span>
        </div>
        <div class="trow">
          <p>Hide sessions under 10 minutes</p>
          <span class="sw"><i></i></span>
        </div>
      </div>

      <div class="actions">
        <div class="btn reset">Reset</div>
        <div class="btn apply">Show 48 sessions</div>
      </div>

    </div>
  </div>
</body>
</html>
