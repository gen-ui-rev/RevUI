<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedar Market Photo Style</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #171923;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 18px;
      background: #eef0f3;
    }

    .style-tray {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.10);
    }

    .tray-header h1 {
      margin: 0;
      color: #312e81;
      font-size: 22px;
      font-weight: 600;
      line-height: 26px;
    }

    .tray-header p {
      margin: 5px 0 0;
      color: #667085;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .preview {
      position: relative;
      margin-top: 14px;
      border-left: 4px solid #4f46e5;
      background: #d9dce2;
    }

    .preview img {
      width: 322px;
      height: 144px;
      object-fit: cover;
      display: block;
      background: #d9dce2;
    }

    .section {
      margin-top: 16px;
    }

    .section h2 {
      margin: 0;
      color: #252936;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }

    .filter-list {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 14px;
      margin-top: 8px;
    }

    .filter-option {
      width: 70px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #667085;
      text-align: center;
      cursor: default;
    }

    .filter-option img {
      width: 70px;
      height: 60px;
      object-fit: cover;
      display: block;
      background: #d9dce2;
    }

    .filter-option span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 400;
      line-height: 18px;
    }

    .filter-option.selected img {
      outline: 3px solid #4f46e5;
      outline-offset: -3px;
    }

    .filter-option.selected span {
      color: #4338ca;
      font-weight: 600;
    }

    .sticker-list {
      display: grid;
      grid-template-columns: repeat(3, 102px);
      gap: 8px;
      margin-top: 8px;
    }

    .sticker-option {
      height: 48px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #d5d9e2;
      background: #ffffff;
      color: #3d4351;
      font-size: 14px;
      font-weight: 400;
      cursor: default;
    }

    .sticker-option svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #4f46e5;
    }

    .apply-button {
      width: 100%;
      height: 42px;
      margin-top: 16px;
      border: 1px solid #4f46e5;
      background: #4f46e5;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="style-tray" aria-label="Cedar Market listing photo styles">
      <header class="tray-header">
        <h1>Cedar Market photo style</h1>
        <p>Styles only; crop and lighting stay unchanged.</p>
      </header>

      <div class="preview">
        <img src="https://loremflickr.com/322/144/sneakers?lock=4770" width="322" height="144" alt="Sneakers shown in the listing photo preview">
      </div>

      <section class="section" aria-labelledby="filters-heading">
        <h2 id="filters-heading">Filters</h2>
        <div class="filter-list">
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4771" width="70" height="60" alt="Original sneaker filter preview">
            <span>Original</span>
          </button>
          <button class="filter-option selected" type="button" aria-pressed="true">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4772" width="70" height="60" alt="Clean sneaker filter preview">
            <span>Clean</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4773" width="70" height="60" alt="Warm sneaker filter preview">
            <span>Warm</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4774" width="70" height="60" alt="Mono sneaker filter preview">
            <span>Mono</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="stickers-heading">
        <h2 id="stickers-heading">Stickers</h2>
        <div class="sticker-list">
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>New</span>
          </button>
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h10l6 6-8 8-8-8V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="9" cy="10" r="1.4" fill="currentColor"/>
            </svg>
            <span>Sale</span>
          </button>
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h11v9H3V7zm11 3h3l3 3v3h-6v-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="7" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>Free ship</span>
          </button>
        </div>
      </section>

      <button class="apply-button" type="button">Apply style</button>
    </main>
  </div>
</body>
</html>
