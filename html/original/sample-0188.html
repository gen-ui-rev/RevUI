<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Workout Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e5;
      color: #202124;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 44px 24px;
      background: #f1f2f3;
    }

    .confirmation {
      width: 100%;
      padding: 26px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(31, 35, 39, 0.1);
    }

    .warning-mark {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #fbe9e8;
      color: #bd2c26;
    }

    .warning-mark svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    h1 {
      margin: 0;
      color: #a82420;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.18;
    }

    .message {
      margin: 10px 0 0;
      color: #555b60;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    .workout {
      margin: 12px 0 0;
      color: #202124;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      margin: 0;
      padding: 12px 10px;
      border: 0;
      border-radius: 10px;
      font: 600 15px/1.4 'Source Sans 3', system-ui, sans-serif;
      cursor: default;
    }

    .keep {
      background: #eef0f1;
      color: #34383c;
    }

    .delete {
      background: #bd2c26;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="confirmation" role="alertdialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <div class="warning-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4.7 19h14.6c1.2 0 1.95-1.3 1.35-2.34L13.35 4a1.56 1.56 0 0 0-2.7 0l-7.3 12.66A1.56 1.56 0 0 0 4.7 19Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 8.3v4.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="16.1" r="1" fill="currentColor"/>
        </svg>
      </div>

      <h1 id="dialog-title">Delete this workout?</h1>
      <p class="message" id="dialog-message">This activity and its recorded metrics will be removed permanently.</p>
      <p class="workout">Evening Strength · June 18, 2025 · 42 minutes</p>

      <div class="actions" aria-label="Confirmation choices">
        <button class="keep" type="button">No, keep it</button>
        <button class="delete" type="button">Yes, delete</button>
      </div>
    </section>
  </div>
</body>
</html>
