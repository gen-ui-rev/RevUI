<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennyveil Account Error</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ecebef;
      color: #1f1c24;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #dcd9e1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #e9e7ec;
    }

    .service-name {
      margin: 0;
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .icon-button {
      margin: 0;
      padding: 2px;
      border: 0;
      background: transparent;
      color: #5f5a66;
      line-height: 0;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    main {
      flex: 1;
      padding: 102px 24px 24px;
    }

    .error-state {
      text-align: center;
    }

    .error-symbol {
      width: 72px;
      margin: 0 auto 24px;
      padding: 18px;
      border-radius: 14px;
      background: #f1ecfb;
      color: #7150a8;
    }

    .error-symbol svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #7150a8;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1f1c24;
      font-size: 28px;
      line-height: 34px;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .message {
      max-width: 326px;
      margin: 14px auto 0;
      color: #67616d;
      font-size: 14px;
      line-height: 21px;
    }

    .update-detail {
      margin: 26px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid #e9e7ec;
      color: #67616d;
      font-size: 14px;
      line-height: 20px;
    }

    .update-detail strong {
      display: block;
      margin-top: 2px;
      color: #302c35;
      font-weight: 600;
    }

    .primary-action {
      width: 100%;
      margin-top: 26px;
      padding: 15px 20px;
      border: 0;
      border-radius: 14px;
      background: #7150a8;
      color: #ffffff;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .secondary-action {
      margin: 12px 0 0;
      padding: 8px 14px;
      border: 0;
      background: transparent;
      color: #7150a8;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .tabbar {
      display: flex;
      justify-content: space-around;
      padding: 11px 8px 12px;
      border-top: 1px solid #e9e7ec;
      background: #ffffff;
    }

    .tab {
      width: 78px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #817b86;
      text-align: center;
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
    }

    .tab svg {
      width: 21px;
      height: 21px;
      display: block;
      margin: 0 auto 4px;
    }

    .tab.active {
      color: #7150a8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <p class="service-name">Pennyveil</p>
      <button class="icon-button" type="button" aria-label="Get help">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9.7 9.2a2.5 2.5 0 0 1 4.85.85c0 1.75-2.55 2.05-2.55 3.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="17.3" r="1" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="error-state" aria-labelledby="error-title">
        <div class="error-symbol" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <path d="M8.5 12.5A11.5 11.5 0 0 1 28 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M27.9 6.7v4.1h-4.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M27.5 23.5A11.5 11.5 0 0 1 8 26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M8.1 29.3v-4.1h4.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 13.2v5.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="18" cy="22.3" r="1.25" fill="currentColor"/>
          </svg>
        </div>

        <p class="eyebrow">Connection error</p>
        <h1 id="error-title">Account update failed</h1>
        <p class="message">
          We could not connect to your linked institutions. Saved balances remain available, and scheduled transfers were not changed.
        </p>

        <p class="update-detail">
          Last successful update
          <strong>June 18, 2025 at 9:42 AM</strong>
        </p>

        <button class="primary-action" type="button">Try again</button>
        <button class="secondary-action" type="button">Review connections</button>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9.5 20v-6h5v6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        Overview
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="4.5" cy="7" r="1" fill="currentColor"/>
          <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
          <circle cx="4.5" cy="17" r="1" fill="currentColor"/>
        </svg>
        Activity
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 9.5h17L12 4 3.5 9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M5.5 18.5h13M7 10v7M12 10v7M17 10v7M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Accounts
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19V9M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3.5 19.5h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Plan
      </button>
    </nav>
  </div>
</body>
</html>
