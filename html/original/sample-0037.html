<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Restwell — Sleep session options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E8A700;
    --accent-soft:rgba(232,167,0,0.14);
    --accent-softer:rgba(232,167,0,0.08);
    --ink:#1D1B16;
    --muted:#6E6A5F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#E6E4DF;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    background:#F4F3EF;
    padding:34px 20px;
  }
  .sheet{
    background:#FFFFFF;
    border-radius:10px;
    padding:22px 18px 18px;
  }
  .subject{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--accent-soft);
    border-radius:10px;
    padding:16px;
  }
  .subject .glyph{
    width:44px;
    height:44px;
    flex:0 0 44px;
    border-radius:10px;
    background:#FFFFFF;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .subject .meta{min-width:0;}
  .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#8A6A00;
    margin:0 0 4px;
  }
  .title{
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
    line-height:1.25;
  }
  .when{
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{margin:18px 0 0;}
  .action{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:var(--accent-softer);
    border-radius:10px;
    padding:15px 16px;
    text-decoration:none;
  }
  .action + .action{margin-top:8px;}
  .action .ic{
    width:22px;
    height:22px;
    flex:0 0 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .action .label{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .action .hint{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .action.danger .label{color:#8E2C1C;}
  .cancel{
    display:block;
    width:100%;
    text-align:center;
    margin-top:14px;
    padding:14px 0;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="subject">
        <span class="glyph" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8A700" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
            <path d="M16.6 4.2h3.2M18.2 2.6v3.2"/>
          </svg>
        </span>
        <div class="meta">
          <p class="eyebrow">Sleep session</p>
          <h1 class="title">6 h 42 m &middot; Restwell</h1>
          <p class="when">Tuesday, March 11 &middot; 11:24 PM – 6:06 AM</p>
        </div>
      </div>

      <div class="actions">
        <a class="action" href="#">
          <span class="ic" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h4l10-10-4-4L4 16v4z"/>
              <path d="M14.5 5.5l4 4"/>
            </svg>
          </span>
          <span class="label">Edit sleep times<span class="hint">Adjust bedtime or wake time</span></span>
        </a>

        <a class="action" href="#">
          <span class="ic" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1B16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h11l3 3v13H5z"/>
              <path d="M8.5 10.5h7M8.5 14.5h4.5"/>
            </svg>
          </span>
          <span class="label">Add a note<span class="hint">Caffeine, late meal, room noise</span></span>
        </a>

        <a class="action danger" href="#">
          <span class="ic" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E2C1C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13"/>
            </svg>
          </span>
          <span class="label">Delete session<span class="hint">Removes it from your weekly average</span></span>
        </a>
      </div>

      <a class="cancel" href="#">Cancel</a>
    </div>
  </div>
</body>
</html>
