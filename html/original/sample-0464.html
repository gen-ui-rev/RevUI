<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#DB3B76;
    --pink-soft:#FCEBF2;
    --line:#E4E2E4;
    --ink:#1B1A1C;
    --muted:#78757B;
  }
  html,body{margin:0;}
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:#F1F0F1;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:36px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    padding:0 32px;
    box-sizing:border-box;
  }
  .card{
    width:100%;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
  }
  .hero{
    display:block;
    width:100%;
    height:112px;
    object-fit:cover;
    background:#D9D7DA;
    border-radius:6px 6px 0 0;
  }
  .body{padding:14px 16px 16px;}
  .head{display:flex;gap:10px;align-items:flex-start;}
  .mono{
    width:36px;height:36px;flex:none;
    border-radius:6px;
    background:var(--pink-soft);
    color:var(--pink);
    font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:.02em;
  }
  h1{
    margin:0;
    font-size:17px;
    font-weight:700;
    line-height:1.25;
  }
  .sub{
    margin:3px 0 0;
    font-size:13px;
    font-weight:400;
    color:var(--muted);
    line-height:1.3;
  }
  .label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 8px;
  }
  .days{display:flex;gap:6px;}
  .day{
    flex:1;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 0 7px;
    text-align:center;
    background:#fff;
  }
  .day .dow{
    display:block;
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    line-height:1.2;
  }
  .day .num{
    display:block;
    font-size:15px;
    font-weight:700;
    margin-top:2px;
    line-height:1.2;
  }
  .day.off .dow,.day.off .num{color:#BFBCC1;}
  .day.on{background:var(--pink);border-color:var(--pink);}
  .day.on .dow{color:#F7CEDF;}
  .day.on .num{color:#fff;}
  .slots{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .slot{
    border:1px solid var(--line);
    border-radius:6px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:500;
    background:#fff;
  }
  .slot.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700;}
  .slot.gone{color:#BFBCC1;background:#FAFAFA;text-decoration:line-through;}
  .summary{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .summary svg{flex:none;}
  .sum-main{
    font-size:14px;
    font-weight:700;
    line-height:1.3;
  }
  .sum-sub{
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    line-height:1.35;
    margin-top:2px;
  }
  .cta{
    margin-top:14px;
    width:100%;
    height:44px;
    border:none;
    border-radius:6px;
    background:var(--pink);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/326/112/gym?lock=6383" width="326" height="112" alt="Small group strength training class in the studio">
      <div class="body">
        <div class="head">
          <div class="mono">DW</div>
          <div>
            <h1>Strength &amp; Mobility</h1>
            <p class="sub">50 min &middot; Coach Dana Whitfield &middot; 4 spots left</p>
          </div>
        </div>

        <p class="label">March 2026</p>
        <div class="days">
          <div class="day off"><span class="dow">Mon</span><span class="num">9</span></div>
          <div class="day"><span class="dow">Tue</span><span class="num">10</span></div>
          <div class="day"><span class="dow">Wed</span><span class="num">11</span></div>
          <div class="day on"><span class="dow">Thu</span><span class="num">12</span></div>
          <div class="day"><span class="dow">Fri</span><span class="num">13</span></div>
          <div class="day"><span class="dow">Sat</span><span class="num">14</span></div>
          <div class="day off"><span class="dow">Sun</span><span class="num">15</span></div>
        </div>

        <p class="label">Start time</p>
        <div class="slots">
          <div class="slot">6:30 AM</div>
          <div class="slot">7:15 AM</div>
          <div class="slot gone">8:00 AM</div>
          <div class="slot">5:45 PM</div>
          <div class="slot on">6:30 PM</div>
          <div class="slot">7:15 PM</div>
        </div>

        <div class="summary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DB3B76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M8 3v4M16 3v4M3 10h18"></path>
          </svg>
          <div>
            <div class="sum-main">Thursday, March 12 &middot; 6:30 PM</div>
            <div class="sum-sub">Studio B, 214 Larkin Street &middot; ends 7:20 PM</div>
          </div>
        </div>

        <div class="cta">Confirm booking</div>
      </div>
    </div>
  </div>
</body>
</html>
