<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tandem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E0356F;
    --ink:#16151A;
    --muted:#6E6B76;
    --rule:#E7E4EA;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#D9D6DC;
    font-family:'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:844px;
    background:#FFFFFF;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 24px;
    border-bottom:1px solid var(--rule);
  }
  .ws-mark{
    width:30px;
    height:30px;
    border-radius:10px;
    background:#FCE7EF;
    color:var(--pink);
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .ws-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ws-role{
    margin-left:auto;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  /* hero */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0 40px 70px;
    text-align:center;
  }
  .logo{
    width:76px;
    height:76px;
    border-radius:10px;
    background:var(--pink);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wordmark{
    margin-top:26px;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.1;
  }
  .tagline{
    margin-top:10px;
    font-size:15px;
    font-weight:400;
    color:var(--muted);
    line-height:1.5;
  }

  /* bottom block */
  .bottom{
    padding:0 24px 34px;
  }
  .status{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding-bottom:12px;
  }
  .status-label{
    font-size:14px;
    font-weight:600;
  }
  .status-value{
    font-size:14px;
    font-weight:600;
    color:var(--pink);
  }
  .track{
    height:6px;
    width:100%;
    border-radius:10px;
    background:#F0EDF1;
  }
  .fill{
    height:6px;
    width:68%;
    border-radius:10px;
    background:var(--pink);
  }
  .meta{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--rule);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    font-size:12px;
    color:var(--muted);
  }
  .meta span{white-space:nowrap;}
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="ws-mark">NS</div>
      <div class="ws-name">Northside Studio</div>
      <div class="ws-role">Dana Whitfield</div>
    </div>

    <div class="hero">
      <div class="logo" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="9" width="14" height="27" rx="4" fill="#FFFFFF"/>
          <rect x="22" y="4" width="14" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.62"/>
          <rect x="22" y="26" width="14" height="10" rx="4" fill="#FFFFFF" fill-opacity="0.62"/>
        </svg>
      </div>
      <div class="wordmark">Tandem</div>
      <div class="tagline">Shared schedules and notes<br>for small teams.</div>
    </div>

    <div class="bottom">
      <div class="status">
        <div class="status-label">Restoring your workspace</div>
        <div class="status-value">68%</div>
      </div>
      <div class="track"><div class="fill"></div></div>
      <div class="meta">
        <span>Last synced March 6, 2024 at 8:41 AM</span>
        <span>Version 3.2.1</span>
      </div>
    </div>

  </div>
</body>
</html>
