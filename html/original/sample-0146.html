<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rooftop Crew — Call</title>
<style>
  :root{
    --ink:#1b1a18;
    --sub:#79736b;
    --line:#e5e2dd;
    --accent:#e2661a;
    --tint:#fdf1e8;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#d7d4cf;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:844px;
    background:#ffffff;
    display:flex;
    flex-direction:column;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px;
    border-bottom:1px solid var(--line);
  }
  .iconbtn{
    width:34px;height:34px;
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
    background:#fff;
  }
  .titlewrap{flex:1 1 auto;min-width:0;}
  .title{
    font-size:16px;font-weight:600;line-height:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .subtitle{
    font-size:12px;color:var(--sub);line-height:16px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-right:5px;
  }

  /* hero video */
  .stage{padding:16px 16px 0;}
  .card{
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
  }
  .card img{
    width:356px;height:310px;
    display:block;object-fit:cover;
    background:#cfcac3;
    border-radius:9px 9px 0 0;
  }
  .caption{
    display:flex;align-items:center;gap:10px;
    padding:12px;
    border-top:1px solid var(--line);
  }
  .mono{
    border-radius:10px;
    background:#f3f1ee;
    color:#3a3833;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;
    flex:0 0 auto;
  }
  .caption .mono{width:36px;height:36px;font-size:13px;}
  .capname{font-size:14px;font-weight:600;line-height:18px;}
  .capsub{font-size:12px;color:var(--sub);line-height:16px;margin-top:1px;}
  .capmeta{
    margin-left:auto;font-size:12px;color:var(--sub);
    white-space:nowrap;
  }

  /* participants */
  .section{padding:20px 16px 0;}
  .sechead{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:10px;
  }
  .sectitle{font-size:13px;font-weight:600;letter-spacing:.02em;}
  .seccount{font-size:12px;color:var(--sub);}
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .tile .mono{width:100%;height:82px;font-size:20px;}
  .tile.self .mono{background:var(--tint);color:var(--accent);}
  .tname{
    display:flex;align-items:center;gap:4px;
    margin-top:6px;
    font-size:12px;color:var(--sub);line-height:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tname span{overflow:hidden;text-overflow:ellipsis;}

  /* controls */
  .controls{
    margin-top:auto;
    padding:18px 16px 24px;
    border-top:1px solid var(--line);
  }
  .ctrlrow{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:16px;
  }
  .ctrl{width:68px;text-align:center;}
  .circle{
    width:68px;height:68px;border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .circle.on{background:var(--tint);border-color:#f2d3b8;}
  .clabel{font-size:12px;color:var(--sub);margin-top:7px;line-height:15px;}
  .leave{
    display:block;
    width:100%;
    height:52px;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="topbar">
      <div class="iconbtn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </div>
      <div class="titlewrap">
        <div class="title">Rooftop Crew</div>
        <div class="subtitle"><span class="dot"></span>5 in call · 12:47</div>
      </div>
      <div class="iconbtn" aria-label="Invite someone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"></path><circle cx="9" cy="7.5" r="3.2"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>
      </div>
    </div>

    <div class="stage">
      <div class="card">
        <img src="https://loremflickr.com/356/310/street?lock=2741" width="356" height="310" alt="Live camera view of the evening street below the rooftop">
        <div class="caption">
          <div class="mono">NF</div>
          <div>
            <div class="capname">Nadia Ferreira</div>
            <div class="capsub">Sharing rear camera</div>
          </div>
          <div class="capmeta">1080p</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sechead">
        <div class="sectitle">In this call</div>
        <div class="seccount">5 people</div>
      </div>
      <div class="grid">
        <div class="tile">
          <div class="mono">TM</div>
          <div class="tname"><span>Theo M.</span></div>
        </div>
        <div class="tile">
          <div class="mono">PR</div>
          <div class="tname"><span>Priya R.</span></div>
        </div>
        <div class="tile">
          <div class="mono">CV</div>
          <div class="tname">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#79736b" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"></line><path d="M9 5a3 3 0 0 1 6 0v6"></path><path d="M5 11a7 7 0 0 0 10.5 6"></path><line x1="12" y1="18" x2="12" y2="21"></line></svg>
            <span>Colin V.</span>
          </div>
        </div>
        <div class="tile self">
          <div class="mono">YB</div>
          <div class="tname"><span>You</span></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrlrow">
        <div class="ctrl">
          <div class="circle on">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2661a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><line x1="12" y1="17.5" x2="12" y2="21"></line></svg>
          </div>
          <div class="clabel">Mic on</div>
        </div>
        <div class="ctrl">
          <div class="circle on">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2661a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"></rect><path d="M15.5 11l6-3.5v9L15.5 13z"></path></svg>
          </div>
          <div class="clabel">Camera on</div>
        </div>
        <div class="ctrl">
          <div class="circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path><path d="M16 9.5a4 4 0 0 1 0 5"></path><path d="M18.5 7a7.5 7.5 0 0 1 0 10"></path></svg>
          </div>
          <div class="clabel">Speaker</div>
        </div>
        <div class="ctrl">
          <div class="circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="1.8" stroke-linecap="round"><circle cx="5.5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18.5" cy="12" r="1.4"></circle></svg>
          </div>
          <div class="clabel">More</div>
        </div>
      </div>
      <div class="leave">Leave call</div>
    </div>

  </div>
</body>
</html>
