<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbound Stays — Check-in activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E7E6E9;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    box-sizing:border-box;
    padding:58px 30px;
    background:#E7E6E9;
  }
  .island{
    background:#0B0B0D;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:16px 18px 18px;
  }
  .head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark{
    width:30px;
    height:30px;
    border-radius:14px;
    background:#B183AE;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .head-text{min-width:0;flex:1;}
  .app{
    font-size:14px;
    font-weight:700;
    color:#F4F2F5;
    letter-spacing:-0.1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .app-sub{
    font-size:12px;
    font-weight:500;
    color:#8E8B93;
    margin-top:2px;
  }
  .count{text-align:right;flex:none;}
  .count-val{
    font-size:22px;
    font-weight:700;
    color:#D9B6D5;
    letter-spacing:-0.5px;
    line-height:1.1;
  }
  .count-lab{
    font-size:12px;
    font-weight:500;
    color:#8E8B93;
    margin-top:3px;
  }
  .stay{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.10);
  }
  .stay img{
    width:64px;
    height:64px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#26232A;
    flex:none;
  }
  .stay-text{min-width:0;}
  .hotel{
    font-size:16px;
    font-weight:700;
    color:#F4F2F5;
    letter-spacing:-0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .room{
    font-size:14px;
    font-weight:500;
    color:#A9A5AF;
    margin-top:5px;
  }
  .addr{
    font-size:12px;
    font-weight:500;
    color:#78757E;
    margin-top:4px;
  }
  .track{
    margin-top:18px;
    height:6px;
    border-radius:14px;
    background:rgba(255,255,255,0.13);
  }
  .fill{
    width:68%;
    height:6px;
    border-radius:14px;
    background:#B183AE;
  }
  .legend{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-top:9px;
  }
  .legend span{
    font-size:12px;
    font-weight:500;
    color:#8E8B93;
  }
  .legend .pct{
    color:#D9B6D5;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="head">
        <div class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17141A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
        </div>
        <div class="head-text">
          <div class="app">Northbound Stays</div>
          <div class="app-sub">Check-in today, Thu, May 8</div>
        </div>
        <div class="count">
          <div class="count-val">1h 24m</div>
          <div class="count-lab">until check-in</div>
        </div>
      </div>

      <div class="stay">
        <img src="https://loremflickr.com/64/64/hotel?lock=11441" width="64" height="64" alt="Cliffside Marina Hotel seen from the harbor">
        <div class="stay-text">
          <div class="hotel">Cliffside Marina Hotel</div>
          <div class="room">Room 412 · King, harbor view</div>
          <div class="addr">218 Wharf Street, Port Kell, ME</div>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="legend">
        <span>Housekeeping finishing · ready 3:00 PM</span>
        <span class="pct">68%</span>
      </div>
    </div>
  </div>
</body>
</html>
