<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer — Lingofield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #e8e8ea;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #18181b;
  }
  .screen {
    width: 390px;
    background: #fafafa;
    padding: 38px 0;
  }
  .block {
    padding: 0 30px;
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .kicker {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #71717a;
  }
  .round {
    font-size: 12px;
    font-weight: 400;
    color: #a1a1aa;
    white-space: nowrap;
  }
  .course {
    margin: 10px 0 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
  }
  .clock {
    margin: 26px 0 0;
    font-size: 66px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .clock-sub {
    margin: 10px 0 0;
    font-size: 14px;
    font-weight: 400;
    color: #71717a;
  }
  .bar {
    margin-top: 22px;
    height: 8px;
    border-radius: 10px;
    background: #e4e4e7;
  }
  .bar > span {
    display: block;
    width: 67%;
    height: 100%;
    border-radius: 10px;
    background: #3f3f46;
  }
  .meta {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 400;
    color: #a1a1aa;
  }
  hr {
    border: 0;
    border-top: 1px solid #e4e4e7;
    margin: 28px 0;
  }
  .controls {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    border-radius: 10px;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    text-align: center;
    border: 1px solid transparent;
  }
  .btn.primary {
    background: #3f3f46;
    color: #fafafa;
  }
  .btn.ghost {
    background: transparent;
    border-color: #d4d4d8;
    color: #3f3f46;
    font-weight: 400;
  }
  .footnote {
    margin: 20px 0 0;
    font-size: 12px;
    font-weight: 400;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="block">
      <div class="head">
        <div class="kicker">Focus block</div>
        <div class="round">Round 3 of 4</div>
      </div>
      <p class="course">Spanish B1 · Unit 4 Vocabulary</p>

      <div class="clock">08:18</div>
      <p class="clock-sub">Remaining in this block</p>

      <div class="bar"><span></span></div>
      <div class="meta">
        <span>16:42 elapsed</span>
        <span>25:00 total</span>
      </div>

      <hr>

      <div class="controls">
        <div class="btn primary">Pause</div>
        <div class="btn ghost">End block</div>
      </div>
      <p class="footnote">A 5-minute break starts on its own when the block ends.</p>
    </div>
  </div>
</body>
</html>
