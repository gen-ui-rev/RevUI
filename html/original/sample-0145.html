<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Recommendation Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8edef;
      color: #17252b;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 48px 30px;
      background: #fafcfc;
    }

    .reaction {
      width: 100%;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: #087e97;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #06b6d4;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      color: #14262d;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 12px 0 0;
      color: #5b6b71;
      font-size: 15px;
      line-height: 1.55;
    }

    .control-wrap {
      margin-top: 28px;
      padding: 20px 0;
      border-top: 1px solid #d8e1e3;
      border-bottom: 1px solid #d8e1e3;
    }

    .recommend-button {
      width: 100%;
      margin: 0;
      padding: 15px 17px;
      border: 1px solid #0798b4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #06b6d4;
      color: #073946;
      font: inherit;
      cursor: pointer;
    }

    .button-action,
    .button-count {
      display: flex;
      align-items: center;
    }

    .button-action {
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .button-count {
      padding-left: 15px;
      border-left: 1px solid rgba(7, 57, 70, 0.25);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .button-action svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .visibility {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 15px 0 0;
      color: #66767b;
      font-size: 13px;
      line-height: 1.45;
    }

    .visibility svg {
      width: 17px;
      height: 17px;
      margin-top: 1px;
      flex: 0 0 auto;
      color: #72858a;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="reaction" aria-labelledby="reaction-title">
      <p class="eyebrow">
        <span class="eyebrow-mark" aria-hidden="true"></span>
        Team reaction
      </p>

      <h1 id="reaction-title">Recommend this proposal</h1>

      <p class="description">
        Help the team prioritize “Quiet hours for project notifications” in the next planning cycle.
      </p>

      <div class="control-wrap">
        <button class="recommend-button" type="button" aria-pressed="false">
          <span class="button-action">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Recommend
          </span>
          <span class="button-count">27 recommendations</span>
        </button>

        <p class="visibility">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5C9.8 18.2 8.7 15.4 8.7 12S9.8 5.8 12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>Your recommendation will be visible to everyone in the Dayweave workspace.</span>
        </p>
      </div>
    </main>
  </div>
</body>
</html>
