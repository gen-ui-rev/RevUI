<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Goal Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #1e293b;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 44px 32px;
      background: #f8fafc;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #334155;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .rule {
      margin: 24px 0 28px;
      border: 0;
      border-top: 1px solid #cbd5e1;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .ring {
      width: 154px;
      height: 154px;
      flex: 0 0 auto;
    }

    .track {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 11;
    }

    .value {
      fill: none;
      stroke: #475569;
      stroke-width: 11;
      stroke-linecap: butt;
      stroke-dasharray: 289.52 425.74;
      transform: rotate(-90deg);
      transform-origin: 77px 77px;
    }

    .percent {
      fill: #334155;
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 34px;
      font-weight: 700;
      text-anchor: middle;
    }

    .complete {
      fill: #64748b;
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .details {
      min-width: 0;
    }

    .count {
      margin: 0;
      color: #334155;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .count-label {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;
    }

    .remaining {
      margin: 18px 0 0;
      padding-top: 16px;
      border-top: 1px solid #cbd5e1;
      color: #475569;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }

    .deadline {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="goal-title">
      <p class="eyebrow">Westhaven Circle</p>
      <h1 id="goal-title">Monthly member goal</h1>
      <p class="description">Track the community’s progress toward 1,500 active members.</p>

      <hr class="rule">

      <div class="progress">
        <svg class="ring" viewBox="0 0 154 154" role="img" aria-label="68 percent of the monthly member goal completed">
          <circle class="track" cx="77" cy="77" r="67.75"></circle>
          <circle class="value" cx="77" cy="77" r="67.75"></circle>
          <text class="percent" x="77" y="75">68%</text>
          <text class="complete" x="77" y="98">complete</text>
        </svg>

        <div class="details">
          <p class="count">1,020 of 1,500</p>
          <p class="count-label">active members</p>
          <p class="remaining">
            480 members to go
            <span class="deadline">Goal ends June 30</span>
          </p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
