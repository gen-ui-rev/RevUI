<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Listing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e9e8e4;
      color: #22211f;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 24px 20px;
      background: #f6f5f2;
    }

    .report-card {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #dedbd5;
      border-radius: 14px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flag-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #e96818;
      background: #fff3e9;
      border-radius: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .intro {
      margin: 7px 0 0;
      color: #66625c;
      font-size: 14px;
      line-height: 20px;
    }

    .listing {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    .listing img {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      object-fit: cover;
      display: block;
      background: #ddd8cf;
      border-radius: 14px;
    }

    .listing-copy {
      min-width: 0;
    }

    .listing-name {
      margin: 0;
      overflow: hidden;
      color: #292724;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .seller-name {
      margin: 2px 0 0;
      color: #77726b;
      font-size: 12px;
      line-height: 16px;
    }

    .divider {
      margin: 14px 0;
      border: 0;
      border-top: 1px solid #e5e2dc;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 10px;
      padding: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 500;
    }

    .reason-list {
      display: grid;
      gap: 8px;
    }

    .reason {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border: 1px solid #dedbd5;
      border-radius: 14px;
      color: #34312e;
      font-size: 14px;
      line-height: 20px;
      cursor: pointer;
    }

    .reason.selected {
      border-color: #e96818;
      background: #fff9f4;
    }

    .reason input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: #e96818;
    }

    .boundary-note {
      margin: 12px 0 0;
      color: #6d6862;
      font-size: 12px;
      line-height: 18px;
    }

    .submit-button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: 1px solid #e96818;
      border-radius: 14px;
      background: #e96818;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="report-card" aria-labelledby="report-title">
      <div class="title-row">
        <span class="flag-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 21V4.5M6 5H16.4C17.45 5 18.25 5.94 18.08 6.98L17.45 10.78C17.32 11.55 16.65 12.12 15.87 12.12H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h1 id="report-title">Report this listing</h1>
      </div>

      <p class="intro">Choose the issue that best describes it.</p>

      <div class="listing">
        <img src="https://loremflickr.com/48/48/furniture?lock=12770" width="48" height="48" alt="Oak side table listed for sale">
        <div class="listing-copy">
          <p class="listing-name">Oakline Side Table</p>
          <p class="seller-name">Cedar Lane Shop</p>
        </div>
      </div>

      <hr class="divider">

      <form>
        <fieldset>
          <legend>What is wrong with this listing?</legend>
          <div class="reason-list">
            <label class="reason selected">
              <input type="radio" name="reason" checked>
              <span>Counterfeit or misleading item</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span>Prohibited or unsafe item</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span>Spam or duplicate listing</span>
            </label>
          </div>
        </fieldset>

        <p class="boundary-note">A report requests a review. It does not block Cedar Lane Shop.</p>

        <button class="submit-button" type="button">Submit report</button>
      </form>
    </main>
  </div>
</body>
</html>
