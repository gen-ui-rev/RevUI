<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9e6;
      color: #242429;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      padding: 32px 24px;
      background: #f7f7f4;
    }

    .report-card {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d9d9d5;
      border-radius: 10px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #4f46a5;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.03em;
    }

    h1 {
      margin: 0;
      color: #37307e;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .intro {
      margin: 8px 0 18px;
      color: #57575f;
      font-size: 14px;
      line-height: 1.5;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 9px;
      padding: 0;
      color: #29292f;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .reason-list {
      border: 1px solid #d9d9d5;
      border-radius: 10px;
    }

    .reason {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      color: #303036;
      font-size: 15px;
      line-height: 1.4;
      cursor: pointer;
    }

    .reason + .reason {
      border-top: 1px solid #e1e1dd;
    }

    .reason input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: #4f46a5;
    }

    .boundary-note {
      margin: 14px 0 0;
      color: #68686f;
      font-size: 13px;
      line-height: 1.45;
    }

    .submit-button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 18px;
      border: 1px solid #433b91;
      border-radius: 10px;
      background: #4f46a5;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="report-card" aria-labelledby="report-title">
      <p class="eyebrow">Cloverline Safety</p>
      <h1 id="report-title">Report this post</h1>
      <p class="intro">Choose the reason that best explains why this content should be reviewed.</p>

      <form>
        <fieldset>
          <legend>Reason for reporting</legend>
          <div class="reason-list">
            <label class="reason">
              <input type="radio" name="reason" checked>
              <span>Harassment or bullying</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span>Hate speech or discrimination</span>
            </label>
            <label class="reason">
              <input type="radio" name="reason">
              <span>Spam or misleading content</span>
            </label>
          </div>
        </fieldset>

        <p class="boundary-note">Reporting sends this post to our review team. It does not block the account.</p>
        <button class="submit-button" type="submit">Submit report</button>
      </form>
    </main>
  </div>
</body>
</html>
