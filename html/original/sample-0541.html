<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reorder Trip Stops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9ed;
      color: #202027;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 36px 24px;
      background: #f8f8fa;
    }

    .reorder-panel {
      width: 100%;
      border: 1px solid #d8d7de;
      background: #ffffff;
    }

    .panel-header {
      padding: 24px 22px 20px;
      border-bottom: 1px solid #d8d7de;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #6d43c5;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #5e35b1;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 0;
      color: #62616a;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .stop-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stop {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 24px;
      gap: 12px;
      align-items: center;
      padding: 17px 22px;
      border-bottom: 1px solid #e2e1e6;
    }

    .order-number {
      color: #6d43c5;
      font-size: 14px;
      font-weight: 600;
    }

    .stop-details {
      min-width: 0;
    }

    .stop-name {
      margin: 0;
      color: #202027;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }

    .stop-meta {
      margin: 4px 0 0;
      color: #73717a;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.35;
    }

    .drag-handle {
      width: 24px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #77747e;
    }

    .drag-handle svg {
      width: 18px;
      height: 22px;
      display: block;
    }

    .panel-footer {
      padding: 18px 22px 22px;
    }

    .save-button {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #6338b6;
      border-radius: 0;
      background: #6338b6;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="reorder-panel" aria-labelledby="reorder-title">
      <header class="panel-header">
        <p class="eyebrow">Northline itinerary</p>
        <h1 id="reorder-title">Reorder trip stops</h1>
        <p class="description">Drag the handles to set your visit sequence. Every stop will remain on the route.</p>
      </header>

      <ol class="stop-list" aria-label="Trip stops in current order">
        <li class="stop">
          <span class="order-number">01</span>
          <div class="stop-details">
            <p class="stop-name">Juniper Harbor</p>
            <p class="stop-meta">May 14 · 2 nights</p>
          </div>
          <span class="drag-handle" aria-label="Drag Juniper Harbor to reorder">
            <svg viewBox="0 0 18 22" fill="none" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
        </li>

        <li class="stop">
          <span class="order-number">02</span>
          <div class="stop-details">
            <p class="stop-name">Cedar Vale</p>
            <p class="stop-meta">May 16 · 1 night</p>
          </div>
          <span class="drag-handle" aria-label="Drag Cedar Vale to reorder">
            <svg viewBox="0 0 18 22" fill="none" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
        </li>

        <li class="stop">
          <span class="order-number">03</span>
          <div class="stop-details">
            <p class="stop-name">Stonewater Point</p>
            <p class="stop-meta">May 17 · 3 nights</p>
          </div>
          <span class="drag-handle" aria-label="Drag Stonewater Point to reorder">
            <svg viewBox="0 0 18 22" fill="none" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="5" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="11" r="1.5" fill="currentColor"/>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="17" r="1.5" fill="currentColor"/>
            </svg>
          </span>
        </li>
      </ol>

      <footer class="panel-footer">
        <button class="save-button" type="button">Save stop order</button>
      </footer>
    </main>
  </div>
</body>
</html>
