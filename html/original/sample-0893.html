<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Saved Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfdf;
      color: #272929;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      padding: 28px 24px;
      background: #f5f5f3;
    }

    .move-panel {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border-radius: 14px;
    }

    .panel-heading {
      padding: 18px;
      background: #e8e9e8;
      border-radius: 14px;
    }

    .heading-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #676a69;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
    }

    .helper {
      margin: 10px 0 0;
      color: #5f6261;
      font-size: 14px;
      line-height: 1.5;
    }

    .close-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: #d9dbda;
      color: #454847;
    }

    .close-button svg {
      width: 18px;
      height: 18px;
    }

    .post-preview {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 14px;
      padding: 12px;
      background: #f0f1f0;
      border-radius: 14px;
    }

    .post-preview img {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      object-fit: cover;
      display: block;
      background: #d4d6d5;
      border-radius: 14px;
    }

    .post-copy {
      min-width: 0;
    }

    .post-title {
      margin: 0;
      overflow: hidden;
      color: #2d2f2e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-meta {
      margin: 5px 0 0;
      color: #737675;
      font-size: 12px;
      line-height: 1.4;
    }

    .destination-label {
      margin: 18px 2px 9px;
      color: #4e5150;
      font-size: 14px;
      font-weight: 600;
    }

    .destination-list {
      display: grid;
      gap: 8px;
    }

    .destination {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border: 0;
      border-radius: 14px;
      background: #f0f1f0;
      color: #2e302f;
      text-align: left;
      cursor: default;
    }

    .destination.selected {
      background: #dfe1e0;
    }

    .destination-name {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination-count {
      flex: 0 0 auto;
      color: #717473;
      font-size: 12px;
      font-weight: 500;
    }

    .selected-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #5d6160;
      color: #ffffff;
    }

    .selected-mark svg {
      width: 14px;
      height: 14px;
    }

    .move-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: #555958;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="move-panel" aria-labelledby="move-title">
      <header class="panel-heading">
        <div class="heading-top">
          <div>
            <p class="eyebrow">Commonroom saved posts</p>
            <h1 id="move-title">Move to another folder</h1>
          </div>
          <button class="close-button" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="helper">Choose a new folder for this post. Its position within the folder will not change.</p>
      </header>

      <div class="post-preview">
        <img src="https://loremflickr.com/64/64/street?lock=11830" width="64" height="64" alt="A city street featured in the saved post">
        <div class="post-copy">
          <p class="post-title">A quiet walk through North Market</p>
          <p class="post-meta">Saved from Rowan Mercer · May 18, 2025</p>
        </div>
      </div>

      <p class="destination-label">New folder</p>

      <div class="destination-list" role="listbox" aria-label="Choose a destination folder">
        <button class="destination selected" type="button" role="option" aria-selected="true">
          <span class="destination-name">Weekend plans</span>
          <span class="selected-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5L9.2 16.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
        <button class="destination" type="button" role="option" aria-selected="false">
          <span class="destination-name">Local places</span>
          <span class="destination-count">12 posts</span>
        </button>
        <button class="destination" type="button" role="option" aria-selected="false">
          <span class="destination-name">Ideas for later</span>
          <span class="destination-count">8 posts</span>
        </button>
      </div>

      <button class="move-button" type="button">Move post</button>
    </main>
  </div>
</body>
</html>
