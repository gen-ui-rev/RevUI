<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northpath Booking Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      background: #dcd8d1;
      color: #292724;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      margin: 0 auto;
      padding: 32px 24px;
      background: #f7f5f1;
    }

    .eyebrow {
      margin: 0;
      color: #716860;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      color: #272421;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      line-height: 40px;
    }

    .stay-date {
      margin: 6px 0 0;
      color: #625e59;
      font-size: 15px;
      line-height: 21px;
    }

    figure {
      margin: 20px 0 0;
    }

    figure img {
      width: 342px;
      height: 112px;
      border-radius: 10px;
      background: #c9c4bc;
      display: block;
      object-fit: cover;
    }

    figcaption {
      margin-top: 8px;
      color: #393633;
      font-size: 15px;
      font-weight: 600;
      line-height: 21px;
    }

    .timer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #d5d0c8;
    }

    .timer-label {
      margin: 0;
      color: #716860;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timer-value {
      margin: 2px 0 0;
      color: #6f655c;
      font-size: 54px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.08;
      letter-spacing: 0.02em;
    }

    .timer-note {
      margin: 0;
      color: #625e59;
      font-size: 14px;
      line-height: 20px;
    }

    .actions {
      margin-top: 20px;
    }

    button {
      width: 100%;
      border: 0;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: default;
    }

    .primary {
      padding: 13px 18px;
      border-radius: 10px;
      background: #6f655c;
      color: #ffffff;
      line-height: 22px;
    }

    .secondary {
      margin-top: 8px;
      padding: 0;
      background: transparent;
      color: #625e59;
      font-size: 14px;
      line-height: 21px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="hold-title">
      <p class="eyebrow">Northpath booking timer</p>
      <h1 id="hold-title">Your room is on hold</h1>
      <p class="stay-date">May 18–21 · One room, two guests</p>

      <figure>
        <img src="https://loremflickr.com/342/112/hotel?lock=11410" width="342" height="112" alt="Harbor House hotel overlooking the waterfront">
        <figcaption>Harbor House · Portland, Maine</figcaption>
      </figure>

      <section class="timer" aria-label="Booking hold countdown">
        <p class="timer-label">Time remaining</p>
        <p class="timer-value" aria-label="Nine minutes and forty-two seconds">09:42</p>
        <p class="timer-note">Current rate is held until time runs out.</p>
      </section>

      <div class="actions">
        <button class="primary" type="button">Complete booking</button>
        <button class="secondary" type="button">Release room</button>
      </div>
    </main>
  </div>
</body>
</html>
