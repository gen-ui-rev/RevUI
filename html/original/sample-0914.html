<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfare — Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 0;margin:0;background:#d9d5cd;font-family:'Source Serif 4',Georgia,serif;}
  .screen{width:390px;height:844px;background:#ffffff;color:#1b1a18;display:flex;flex-direction:column;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px;}
  .topbar span{font-size:15px;font-weight:600;letter-spacing:.01em;}
  .iconbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#3a3733;}
  .hero{padding:22px 16px 26px;}
  .mono{width:76px;height:76px;border-radius:10px;background:#e2600d;color:#fff;font-size:28px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;}
  .name{font-size:26px;font-weight:600;margin:18px 0 0;line-height:1.15;}
  .role{font-size:15px;color:#6f6a63;margin:5px 0 0;}
  .dur{font-size:15px;font-weight:600;color:#e2600d;margin:12px 0 0;display:flex;align-items:center;gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#e2600d;display:block;}
  .sect{border-top:1px solid #e6e2dc;padding:16px;}
  .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b857d;margin:0 0 12px;}
  .stay{display:flex;gap:12px;align-items:center;}
  .stay img,.shots img{object-fit:cover;display:block;background:#cdc8c0;border-radius:10px;}
  .stay .txt{min-width:0;flex:1;}
  .stay .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stay .m{font-size:14px;color:#6f6a63;margin-top:3px;}
  .amt{font-size:16px;font-weight:600;white-space:nowrap;}
  .shots{display:flex;gap:8px;}
  .spacer{flex:1;}
  .controls{display:flex;justify-content:space-between;padding:0 24px 4px;}
  .ctl{width:64px;text-align:center;}
  .ctl .circ{width:60px;height:60px;border-radius:10px;background:#f2efea;color:#33302c;display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .ctl.on .circ{background:#e2600d;color:#fff;}
  .ctl .cl{font-size:13px;color:#57534d;margin-top:8px;}
  .end{margin:20px 16px 18px;height:54px;border-radius:10px;background:#e2600d;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600;}
  .tabs{border-top:1px solid #e6e2dc;display:flex;padding:9px 8px 12px;}
  .tab{flex:1;text-align:center;color:#8b857d;}
  .tab.active{color:#e2600d;}
  .tab .tl{font-size:12px;margin-top:3px;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="iconbtn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span>Wayfare call</span>
    <div class="iconbtn" aria-label="Minimize call">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 14h6v6"/><path d="M19 10h-6V4"/></svg>
    </div>
  </div>

  <div class="hero">
    <div class="mono">MV</div>
    <h1 class="name">Marisol Vance</h1>
    <p class="role">Host · Cliffside Loft, Big Sur</p>
    <p class="dur"><span class="dot"></span>07:42 · Wi-Fi call</p>
  </div>

  <div class="sect">
    <p class="lbl">Reservation discussed</p>
    <div class="stay">
      <img src="https://loremflickr.com/64/64/hotel?lock=12080" width="64" height="64" alt="Cliffside Loft bedroom with ocean view">
      <div class="txt">
        <div class="t">Cliffside Loft · Big Sur</div>
        <div class="m">Mar 14–18 · 2 guests</div>
      </div>
      <div class="amt">$1,240</div>
    </div>
  </div>

  <div class="sect">
    <p class="lbl">Sent during this call</p>
    <div class="shots">
      <img src="https://loremflickr.com/114/76/beach?lock=12081" width="114" height="76" alt="Cove below the property at low tide">
      <img src="https://loremflickr.com/114/76/mountain?lock=12082" width="114" height="76" alt="Ridge trail behind the loft">
      <img src="https://loremflickr.com/114/76/cityscape?lock=12083" width="114" height="76" alt="Monterey waterfront, 40 minutes north">
    </div>
  </div>

  <div class="spacer"></div>

  <div class="controls">
    <div class="ctl">
      <div class="circ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/><path d="M4 4l16 16"/></svg>
      </div>
      <div class="cl">Muted</div>
    </div>
    <div class="ctl on">
      <div class="circ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 9H4v6h2.5L11 19V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>
      </div>
      <div class="cl">Speaker</div>
    </div>
    <div class="ctl">
      <div class="circ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      </div>
      <div class="cl">Keypad</div>
    </div>
    <div class="ctl">
      <div class="circ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="12" height="11" rx="2.5"/><path d="M15 11l6-3.5v9L15 13z"/></svg>
      </div>
      <div class="cl">Video</div>
    </div>
  </div>

  <div class="end">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5c5-3.5 11-3.5 16 0v3.2l-3.6.6-1-2.6a11 11 0 0 0-6.8 0l-1 2.6-3.6-.6z"/><path d="M19 17l2 2"/><path d="M21 17l-2 2"/></svg>
    End call
  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      <div class="tl">Explore</div>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V5.5h6v2"/></svg>
      <div class="tl">Trips</div>
    </div>
    <div class="tab active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>
      <div class="tl">Inbox</div>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.5-3.6 4-5.2 7-5.2s5.5 1.6 7 5.2"/></svg>
      <div class="tl">Account</div>
    </div>
  </div>

</div>
</body>
</html>
