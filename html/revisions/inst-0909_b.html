<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer failed — Marrow Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #dedfe1;
    color: #27272a;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 1024px;
    height: 768px;
    padding: 84px 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e9e9eb;
  }
  .card {
    width: 920px;
    background: #ffffff;
    border-radius: 7px;
    box-shadow: 0 14px 36px rgba(24, 24, 27, 0.11);
  }
  .content {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
  }
  .message {
    padding: 42px 40px 38px;
    border-radius: 7px 0 0 0;
    background: #303034;
    color: #fafafa;
  }
  .mark {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #71717a;
    border-radius: 50%;
  }
  h1 {
    margin: 22px 0 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 29px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.25px;
  }
  .lede {
    margin: 14px 0 0;
    color: #d4d4d8;
    font-size: 15px;
    line-height: 1.58;
  }
  .detail-panel {
    padding: 42px 42px 36px;
  }
  .eyebrow {
    margin: 0 0 14px;
    color: #71717a;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.9px;
    text-transform: uppercase;
  }
  .facts {
    border-top: 1px solid #d4d4d8;
  }
  .row {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr);
    gap: 20px;
    align-items: baseline;
    padding: 16px 0;
    border-bottom: 1px solid #e4e4e7;
  }
  .k {
    color: #71717a;
    font-size: 14px;
    white-space: nowrap;
  }
  .v {
    min-width: 0;
    color: #27272a;
    font-size: 15px;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .actions {
    margin-top: 28px;
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    display: block;
    padding: 12px 14px;
    border-radius: 4px;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-primary {
    border: 1px solid #27272a;
    background: #27272a;
    color: #fafafa;
  }
  .btn-secondary {
    border: 1px solid #d4d4d8;
    background: #ffffff;
    color: #3f3f46;
  }
  .reference {
    padding: 17px 24px 17px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-top: 1px solid #e4e4e7;
    border-radius: 0 0 7px 7px;
    background: #fafafa;
  }
  .code {
    margin: 0;
    color: #71717a;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .copy {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border: 0;
    background: transparent;
    color: #3f3f46;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="content">
        <section class="message" aria-labelledby="failure-title">
          <div class="mark" aria-hidden="true">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.6v5.2"></path>
              <path d="M12 16.3h0.01"></path>
            </svg>
          </div>
          <h1 id="failure-title">Transfer could not be completed</h1>
          <p class="lede">Your bank declined the request because the account was temporarily locked. No money left your balance.</p>
        </section>

        <section class="detail-panel" aria-label="Transfer details">
          <p class="eyebrow">Declined transfer</p>
          <div class="facts">
            <div class="row">
              <span class="k">Amount</span>
              <span class="v">$1,240.00</span>
            </div>
            <div class="row">
              <span class="k">To</span>
              <span class="v">Rosalind Meeker · 4417</span>
            </div>
            <div class="row">
              <span class="k">Attempted</span>
              <span class="v">Mar 14, 2024, 9:42 AM</span>
            </div>
          </div>

          <div class="actions">
            <a class="btn btn-primary" href="#">Try transfer again</a>
            <a class="btn btn-secondary" href="#">Contact support</a>
          </div>
        </section>
      </div>

      <div class="reference">
        <p class="code">Reference TR-90284-DL</p>
        <button class="copy" type="button" aria-label="Copy reference TR-90284-DL">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="11" height="11" rx="1.5"></rect>
            <path d="M16 8V6.5A1.5 1.5 0 0 0 14.5 5h-9A1.5 1.5 0 0 0 4 6.5v9A1.5 1.5 0 0 0 5.5 17H8"></path>
          </svg>
          Copy reference
        </button>
      </div>
    </div>
  </div>
</body>
</html>
