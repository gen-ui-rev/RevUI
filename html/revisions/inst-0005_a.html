<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Achievement — Capital Collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d3202b;
    --ink:#16181c;
    --muted:#6b7280;
    --line:#e8e9ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9ebee;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:28px 24px;
    background:#f1f2f4;
  }
  .card{
    background:#ffffff;
    border-radius:4px;
    box-shadow:0 4px 16px rgba(20,22,26,.10);
  }
  .hero{
    position:relative;
  }
  .hero img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    background:#cfd3d8;
    border-radius:4px 4px 0 0;
  }
  .medal{
    position:absolute;
    left:20px;
    bottom:-22px;
    width:44px;
    height:44px;
    background:var(--red);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px rgba(211,32,43,.22);
  }
  .body{
    padding:36px 20px 18px;
  }
  .eyebrow{
    margin:0 0 7px;
    font-size:12px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--red);
  }
  h1{
    margin:0 0 7px;
    font-size:23px;
    line-height:1.2;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .desc{
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:var(--muted);
  }
  .meta{
    margin-top:16px;
    border-top:1px solid var(--line);
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:16px;
  }
  .row .label{
    font-size:13px;
    color:var(--muted);
    font-weight:400;
  }
  .row .value{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
  }
  .next{
    padding-top:14px;
  }
  .next-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .next-title{
    min-width:0;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .next-count{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    white-space:nowrap;
  }
  .track{
    margin-top:9px;
    height:6px;
    width:100%;
    background:#ebecef;
    border-radius:4px;
  }
  .fill{
    height:6px;
    width:83%;
    background:var(--red);
    border-radius:4px;
  }
  .caption{
    margin:8px 0 0;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/342/160/architecture?lock=1122" width="342" height="160" alt="City towers at dusk, the artwork for the Capital Collector badge">
        <div class="medal" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"/>
            <path d="M14.8 9.2l-1.7 3.9-3.9 1.7 1.7-3.9 3.9-1.7z"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
          </svg>
        </div>
      </div>
      <div class="body">
        <p class="eyebrow">Travel badge earned</p>
        <h1>Capital Collector</h1>
        <p class="desc">You explored ten capital cities and checked in at a landmark in each one.</p>

        <div class="meta">
          <div class="row">
            <span class="label">Completed</span>
            <span class="value">March 14, 2025</span>
          </div>
          <div class="row">
            <span class="label">Capitals visited</span>
            <span class="value">10 cities</span>
          </div>
        </div>

        <div class="next">
          <div class="next-head">
            <span class="next-title">Next: Continental Explorer</span>
            <span class="next-count">10 of 12</span>
          </div>
          <div class="track"><div class="fill"></div></div>
          <p class="caption">Visit 2 more capitals to unlock your next badge.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
