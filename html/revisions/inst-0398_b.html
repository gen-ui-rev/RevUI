<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddd9;
      color: #20282a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 23px 22px;
      background: #f8f8f5;
      border-top: 5px solid #173f45;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin: 0;
      color: #536467;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .amount {
      margin: 0;
      color: #173f45;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    h1 {
      margin: 7px 0 0;
      color: #172729;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .status {
      margin: 6px 0 0;
      color: #647174;
      font-size: 12px;
      line-height: 1.4;
    }

    form {
      margin-top: 18px;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .legend-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #263638;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #dbe5e3;
      color: #173f45;
      font-size: 11px;
      font-weight: 700;
    }

    input[type="radio"] {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .time-options {
      display: flex;
      gap: 7px;
      margin-top: 9px;
      padding-left: 29px;
    }

    .time-choice {
      flex: 1;
    }

    .time-choice > span {
      display: block;
      padding: 9px 4px;
      border: 1px solid #cdd4d2;
      border-radius: 20px;
      background: #ffffff;
      color: #425053;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }

    .time-choice input:checked + span {
      border-color: #d36122;
      background: #fff4ed;
      color: #a7420c;
      box-shadow: inset 0 0 0 2px #d36122;
    }

    .date-section {
      margin-top: 20px;
    }

    .date-options {
      margin: 9px 0 0 29px;
      border-top: 1px solid #d4d9d7;
    }

    .date-choice {
      display: block;
    }

    .date-choice > span {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 9px 7px;
      border-bottom: 1px solid #d4d9d7;
      color: #2f3c3e;
      cursor: pointer;
    }

    .radio-mark {
      width: 18px;
      height: 18px;
      border: 1px solid #9ba7a5;
      border-radius: 50%;
      background: #ffffff;
    }

    .date-copy {
      min-width: 0;
    }

    .day {
      display: block;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
    }

    .full-date {
      display: block;
      margin-top: 2px;
      color: #758082;
      font-size: 11px;
      line-height: 1.25;
    }

    .date-status {
      color: #8a9495;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.25;
    }

    .date-choice input:checked + span {
      margin: 0 -5px;
      padding-right: 12px;
      padding-left: 12px;
      border-bottom-color: #c7d8d4;
      background: #e5efec;
      color: #173f45;
    }

    .date-choice input:checked + span .radio-mark {
      border: 5px solid #173f45;
    }

    .date-choice input:checked + span .date-status {
      color: #173f45;
      font-weight: 700;
    }

    .time-choice input:focus-visible + span,
    .date-choice input:focus-visible + span {
      outline: 2px solid #172729;
      outline-offset: 2px;
    }

    .receipt {
      margin: 16px 0 0;
      padding: 10px 11px;
      border-left: 3px solid #d36122;
      background: #fffaf5;
    }

    .receipt-label {
      display: block;
      color: #8b4c29;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .receipt-value {
      display: block;
      margin-top: 3px;
      color: #293638;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .primary-action {
      width: 100%;
      margin-top: 13px;
      padding: 13px 16px;
      border: 0;
      border-radius: 2px;
      background: #173f45;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
    }

    .primary-action:focus-visible {
      outline: 2px solid #d36122;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="topline">
        <p class="eyebrow">Transfer scheduling</p>
        <p class="amount">$1,250.00</p>
      </div>
      <h1>Set the delivery details</h1>
      <p class="status">Your funds are ready. Reserve a delivery time and day.</p>
    </header>

    <form>
      <fieldset>
        <legend>
          <span class="legend-line">
            <span class="step-number">1</span>
            Select a delivery time
          </span>
        </legend>
        <div class="time-options">
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>9:30 AM</span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time" checked>
            <span>10:30 AM</span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>11:30 AM</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="date-section">
        <legend>
          <span class="legend-line">
            <span class="step-number">2</span>
            Match it with a delivery day
          </span>
        </legend>
        <div class="date-options">
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="radio-mark"></span>
              <span class="date-copy">
                <span class="day">Monday</span>
                <span class="full-date">June 16</span>
              </span>
              <span class="date-status">Open</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date" checked>
            <span>
              <span class="radio-mark"></span>
              <span class="date-copy">
                <span class="day">Tuesday</span>
                <span class="full-date">June 17</span>
              </span>
              <span class="date-status">Selected</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="radio-mark"></span>
              <span class="date-copy">
                <span class="day">Wednesday</span>
                <span class="full-date">June 18</span>
              </span>
              <span class="date-status">Open</span>
            </span>
          </label>
        </div>
      </fieldset>

      <div class="receipt">
        <span class="receipt-label">Delivery reserved</span>
        <span class="receipt-value">Tuesday, June 17 at 10:30 AM</span>
      </div>

      <button class="primary-action" type="button">Schedule transfer</button>
    </form>
  </div>
</body>
</html>
