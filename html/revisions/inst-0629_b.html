<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancel physio appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#276758;
    --ink:#1B201E;
    --value:#444A47;
    --muted:#69716D;
    --panel:#ECEFED;
    --danger:#A33B31;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#E6E8E5;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:20px 24px;
    background:#F7F6F3;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .dialog{
    width:342px;
  }
  .photo-wrap{
    position:relative;
    width:342px;
  }
  .dialog img{
    width:342px;
    height:150px;
    display:block;
    object-fit:cover;
    background:#D8D3CC;
    border-radius:14px;
  }
  .clinic-label{
    position:absolute;
    left:12px;
    bottom:12px;
    margin:0;
    padding:7px 10px;
    border-radius:5px;
    background:#FFFFFF;
    color:var(--green);
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .body{padding:16px 4px 0;}
  h1{
    margin:0 0 7px;
    font-size:22px;
    line-height:1.24;
    font-weight:700;
    letter-spacing:-.015em;
  }
  .message{
    margin:0;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .facts{
    margin:14px 0 0;
    padding:11px 14px;
    background:var(--panel);
    border-radius:10px;
  }
  .fact{
    display:grid;
    grid-template-columns:1fr;
    gap:2px;
    padding:5px 0;
  }
  .fact dt{
    color:var(--muted);
    font-size:11px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .fact dd{
    margin:0;
    color:var(--value);
    font-size:14px;
    line-height:1.4;
    font-weight:600;
  }
  .actions{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    padding:12px 16px;
    border:1px solid var(--green);
    border-radius:8px;
    background:var(--green);
    color:#FFFFFF;
  }
  .btn-text{
    width:auto;
    padding:9px 7px;
    border:0;
    background:transparent;
    color:var(--danger);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dialog">
      <div class="photo-wrap">
        <img src="https://loremflickr.com/342/150/gym?lock=8381" width="342" height="150" alt="Exercise and rehabilitation area at the physio clinic">
        <p class="clinic-label">Harbor Physio Clinic</p>
      </div>
      <div class="body">
        <h1>Do you want to cancel this appointment?</h1>
        <p class="message">Your visit is within the clinic’s cancellation window, so a fee will be charged.</p>
        <dl class="facts">
          <div class="fact">
            <dt>Appointment time</dt>
            <dd>Tuesday, March 4 at 6:30 PM</dd>
          </div>
          <div class="fact">
            <dt>Late-cancellation fee</dt>
            <dd>$35.00</dd>
          </div>
        </dl>
        <div class="actions">
          <button type="button" class="btn btn-primary">Keep my appointment</button>
          <button type="button" class="btn btn-text">Cancel appointment</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
