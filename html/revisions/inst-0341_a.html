<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Teammates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e7e9ec;
      color: #18202a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 22px 24px;
      background: #ffffff;
    }

    .progress-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: #788392;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .progress-line strong {
      color: #334155;
    }

    .intro {
      margin-bottom: 17px;
    }

    h1 {
      margin: 0 0 5px;
      color: #243247;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .intro p {
      margin: 0;
      color: #687383;
      font-size: 13px;
      line-height: 1.5;
    }

    fieldset {
      margin: 0 0 17px;
      padding: 0;
      border: 0;
    }

    legend,
    label.field-label {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      color: #26313e;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .role-choice {
      position: relative;
      cursor: pointer;
    }

    .role-choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choice-shell {
      position: relative;
      padding: 13px 12px 12px;
      border: 1px solid #d3d8df;
      border-radius: 15px;
      background: #ffffff;
    }

    .choice-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .role-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f0f2f5;
      color: #657184;
    }

    .role-icon svg {
      width: 20px;
      height: 20px;
    }

    .radio-mark {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border: 1.5px solid #aeb6c0;
      border-radius: 50%;
      background: #ffffff;
    }

    .radio-mark::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: transparent;
    }

    .role-name {
      display: block;
      margin-bottom: 4px;
      color: #202a36;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .role-description {
      display: block;
      min-height: 51px;
      color: #6e7886;
      font-size: 11.5px;
      line-height: 1.45;
    }

    .role-fit {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 7px;
      border-radius: 7px;
      background: #f1f3f6;
      color: #697484;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
    }

    .role-choice input:checked + .choice-shell {
      border: 2px solid #334155;
      padding: 12px 11px 11px;
      background: #f3f6fa;
      box-shadow: 0 0 0 3px #e8edf3;
    }

    .role-choice input:checked + .choice-shell .role-icon {
      background: #334155;
      color: #ffffff;
    }

    .role-choice input:checked + .choice-shell .radio-mark {
      border-color: #334155;
    }

    .role-choice input:checked + .choice-shell .radio-mark::after {
      background: #334155;
    }

    .role-choice input:checked + .choice-shell .role-fit {
      background: #dfe6ee;
      color: #334155;
    }

    .email-field {
      margin-bottom: 17px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid #cbd1d9;
      border-radius: 13px;
      background: #ffffff;
    }

    .input-wrap svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #788392;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #18202a;
      font: 500 13px/1.4 'Manrope', system-ui, sans-serif;
    }

    input[type="email"]::placeholder {
      color: #929aa5;
      opacity: 1;
    }

    .invite-button {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 13px;
      background: #334155;
      color: #ffffff;
      font: 700 14px/1.4 'Manrope', system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    .helper {
      margin: 8px 0 0;
      color: #788290;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="invite-title">
      <div class="progress-line">
        <span>Team setup</span>
        <strong>Invite access</strong>
      </div>

      <header class="intro">
        <h1 id="invite-title">Choose their access</h1>
        <p>Pick the closest role first, then send the invite.</p>
      </header>

      <form>
        <fieldset>
          <legend>Compare workspace roles</legend>
          <div class="choice-grid">
            <label class="role-choice">
              <input type="radio" name="role">
              <span class="choice-shell">
                <span class="choice-top">
                  <span class="role-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="8" r="3"></circle>
                      <path d="M5.5 19c.5-3.5 2.7-5.5 6.5-5.5s6 2 6.5 5.5"></path>
                    </svg>
                  </span>
                  <span class="radio-mark" aria-hidden="true"></span>
                </span>
                <span class="role-name">Member</span>
                <span class="role-description">Creates playlists and edits shows assigned to them.</span>
                <span class="role-fit">Content work</span>
              </span>
            </label>

            <label class="role-choice">
              <input type="radio" name="role" checked>
              <span class="choice-shell">
                <span class="choice-top">
                  <span class="role-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m12 3 7 2.8v5.1c0 4.5-2.7 7.7-7 10.1-4.3-2.4-7-5.6-7-10.1V5.8L12 3Z"></path>
                      <path d="m9 12 2 2 4-4"></path>
                    </svg>
                  </span>
                  <span class="radio-mark" aria-hidden="true"></span>
                </span>
                <span class="role-name">Manager</span>
                <span class="role-description">Publishes content and manages workspace members.</span>
                <span class="role-fit">Team leads</span>
              </span>
            </label>
          </div>
        </fieldset>

        <div class="email-field">
          <label class="field-label" for="email-a">Who are you inviting?</label>
          <div class="input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5.5" width="18" height="13" rx="2"></rect>
              <path d="m4.5 7 7.5 6 7.5-6"></path>
            </svg>
            <input id="email-a" type="email" placeholder="name@studio.com" aria-label="Work email">
          </div>
        </div>

        <button class="invite-button" type="submit">Invite as Manager</button>
        <p class="helper">Access can be changed anytime from workspace settings.</p>
      </form>
    </main>
  </div>
</body>
</html>
