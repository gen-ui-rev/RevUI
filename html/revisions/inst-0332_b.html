<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Hold Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9e7e7;
      color: #292426;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 8px;
      border: 1px solid #d8d1d3;
      border-radius: 44px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(49, 39, 42, 0.12);
    }

    .watch-content {
      width: 100%;
    }

    .dial {
      width: 156px;
      margin: 0 auto;
      padding: 9px 8px 8px;
      border: 6px solid #efd9e0;
      border-top-color: #ad3d61;
      border-right-color: #ad3d61;
      border-radius: 50%;
      background: #faf7f8;
      text-align: center;
    }

    .service {
      margin: 0;
      color: #8c3451;
      font-size: 9px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .timer-label {
      margin: 2px 0 0;
      color: #70676a;
      font-size: 9px;
      line-height: 1.2;
      font-weight: 700;
      text-transform: uppercase;
    }

    .timer-value {
      margin: 0;
      color: #292426;
      font-size: 36px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
    }

    .dial img {
      width: 72px;
      height: 72px;
      display: block;
      margin: 1px auto 0;
      object-fit: cover;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #e5e1df;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 10px 4px;
      border-radius: 14px;
      font: inherit;
      font-size: 10px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout {
      border: 1px solid #ad3d61;
      background: #ad3d61;
      color: #ffffff;
    }

    .release {
      border: 1px solid #d8d1d3;
      background: #f7f5f5;
      color: #70676a;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="watch-content" aria-label="Nooklane Market cart hold">
      <section class="dial" aria-label="Eight minutes and forty-two seconds remaining">
        <p class="service">Nooklane Market</p>
        <p class="timer-label">Hold remaining</p>
        <p class="timer-value">08:42</p>
        <img src="https://loremflickr.com/72/72/furniture?lock=4870" width="72" height="72" alt="Cream upholstered lounge chair">
      </section>

      <div class="actions">
        <button class="release" type="button">Release</button>
        <button class="checkout" type="button">Checkout</button>
      </div>
    </main>
  </div>
</body>
</html>
