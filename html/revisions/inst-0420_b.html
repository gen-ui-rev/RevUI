<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1e3;
      color: #202124;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 22px 20px;
      background: #f2f3f4;
    }

    .verification-card {
      width: 100%;
      padding: 20px 22px;
      border-left: 4px solid #e85d04;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(28, 31, 35, 0.10);
    }

    .service-name {
      margin: 0 0 8px;
      color: #e85d04;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .recipient {
      margin: 0 0 14px;
      padding: 9px 11px;
      border: 1px solid #e1e3e5;
      background: #f7f8f8;
    }

    .recipient-label {
      display: block;
      margin-bottom: 2px;
      color: #777b80;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .email {
      display: block;
      color: #303134;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    h1 {
      margin: 0;
      color: #202124;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .intro {
      margin: 7px 0 0;
      color: #5f6368;
      font-size: 13px;
      line-height: 1.45;
    }

    .code-form {
      margin-top: 18px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: #303134;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
    }

    .code-fields {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .code-fields input {
      width: 100%;
      height: 46px;
      padding: 0;
      border: 1px solid #c9cdd1;
      border-radius: 0;
      outline: none;
      background: #ffffff;
      color: #202124;
      font-size: 20px;
      font-weight: 500;
      line-height: 46px;
      text-align: center;
      caret-color: #e85d04;
    }

    .code-fields input:first-child,
    .code-fields input:focus {
      border: 2px solid #e85d04;
    }

    .expires {
      margin: 8px 0 0;
      color: #777b80;
      font-size: 12px;
      line-height: 1.4;
    }

    .verify-button {
      width: 100%;
      height: 46px;
      margin-top: 15px;
      border: 1px solid #e85d04;
      border-radius: 0;
      background: #e85d04;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .support {
      margin-top: 17px;
      padding-top: 15px;
      border-top: 1px solid #e1e3e5;
    }

    .support-title {
      margin: 0;
      color: #303134;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
    }

    .support-actions {
      margin-top: 10px;
    }

    .method-button {
      width: 100%;
      height: 40px;
      border: 1px solid #e85d04;
      border-radius: 0;
      background: #fff8f3;
      color: #c94f00;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .resend-button {
      display: block;
      margin: 9px auto 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #6b7075;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="verification-card" aria-labelledby="verification-title">
      <header>
        <p class="service-name">Northline Market</p>
        <p class="recipient">
          <span class="recipient-label">Code sent to</span>
          <span class="email">morgan.lee@example.com</span>
        </p>
        <h1 id="verification-title">Confirm it’s you</h1>
        <p class="intro">Enter the 6-digit code to continue securely.</p>
      </header>

      <form class="code-form">
        <label class="field-label" for="code-b-1">Verification code</label>
        <div class="code-fields" aria-label="Six-digit verification code">
          <input id="code-b-1" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2">
          <input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 3">
          <input type="text" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 4">
          <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 5">
          <input type="text" inputmode="numeric" maxlength="1" value="5" aria-label="Digit 6">
        </div>
        <p class="expires">This code expires in 9 minutes.</p>
        <button class="verify-button" type="submit">Verify and continue</button>
      </form>

      <section class="support" aria-labelledby="support-title-b">
        <h2 class="support-title" id="support-title-b">Need help signing in?</h2>
        <div class="support-actions">
          <button class="method-button" type="button">Use another verification method</button>
          <button class="resend-button" type="button">Resend the email code</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
