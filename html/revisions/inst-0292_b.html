<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #18181b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 22px;
      background: #f4f4f5;
    }

    .activity {
      width: 100%;
      border: 1px solid #d4d4d8;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 12px 26px rgba(24, 24, 27, 0.1);
    }

    .status-panel {
      padding: 19px;
      border-radius: 11px 11px 0 0;
      background: #18181b;
    }

    .status-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .status-copy {
      min-width: 0;
    }

    .status-title {
      margin: 0;
      color: #ffffff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.7px;
      line-height: 1.16;
    }

    .status-detail {
      margin: 7px 0 0;
      color: #d4d4d8;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 7px 9px;
      border-radius: 999px;
      background: #ffedd5;
      color: #9a3412;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
      text-transform: uppercase;
    }

    .active-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f97316;
    }

    .step-progress {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .step {
      height: 6px;
      border-radius: 6px;
      background: #3f3f46;
    }

    .step.complete {
      background: #a1a1aa;
    }

    .step.active {
      background: #f97316;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
    }

    .transfer-card {
      padding: 18px 19px 19px;
    }

    .service-line {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .service-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 7px;
      background: #f4f4f5;
      color: #27272a;
    }

    .service-mark svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    .service-name {
      margin: 0;
      color: #52525b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .transfer-label {
      margin: 18px 0 4px;
      color: #71717a;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .amount {
      margin: 0;
      color: #18181b;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.9px;
      line-height: 1.2;
    }

    .recipient {
      margin: 5px 0 0;
      color: #52525b;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }

    .timing-row {
      margin-top: 17px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-left: 4px solid #f97316;
      border-radius: 6px;
      background: #fff7ed;
    }

    .timing-main {
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .timing-percent {
      color: #c2410c;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .reference {
      margin: 12px 0 0;
      color: #71717a;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
    }

    .reference strong {
      margin-left: 5px;
      color: #27272a;
      font-weight: 700;
      letter-spacing: 0.35px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Expanded transfer activity">
      <div class="status-panel">
        <div class="status-row">
          <div class="status-copy">
            <h1 class="status-title">Transfer in progress</h1>
            <p class="status-detail">Funds are moving securely to the recipient.</p>
          </div>

          <div class="active-badge">
            <span class="active-dot" aria-hidden="true"></span>
            Active
          </div>
        </div>

        <div class="step-progress" role="img" aria-label="Transfer is 68 percent complete">
          <span class="step complete"></span>
          <span class="step complete"></span>
          <span class="step active"></span>
          <span class="step"></span>
        </div>
      </div>

      <div class="transfer-card">
        <div class="service-line">
          <div class="service-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 8H17M14 5L17 8L14 11M19 16H7M10 13L7 16L10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <p class="service-name">Slate Ledger</p>
        </div>

        <p class="transfer-label">Sending</p>
        <p class="amount">$1,240.00</p>
        <p class="recipient">To Rowan Pierce · Harbor checking</p>

        <div class="timing-row">
          <span class="timing-main">About 2 min left</span>
          <span class="timing-percent">68% complete</span>
        </div>

        <p class="reference">Transfer reference <strong>SL-4827-1904</strong></p>
      </div>
    </section>
  </div>
</body>
</html>
