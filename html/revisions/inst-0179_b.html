<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filters &amp; Stickers</title>
<style>
  :root{
    --accent:#c026d3;
    --ink:#1c1c20;
    --muted:#6d6d78;
    --line:#e6e6ea;
    --tile:#eeeaf3;
    --tile-line:#d8d0e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#d9d9de;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .screen{
    width:390px;
    height:560px;
    padding:18px;
    background:#d9d9de;
  }
  .card{
    background:#fff;
    border:1px solid #ceced4;
    box-shadow:0 4px 12px rgba(28,28,32,0.08);
    padding:17px;
  }
  .head{
    padding-bottom:11px;
    border-bottom:1px solid var(--line);
  }
  .head h1{
    margin:0;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .head p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
  }
  .sec-label{
    margin:13px 0 8px;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.7px;
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .item{text-align:center;}
  .thumb{
    width:100%;
    height:68px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--tile);
    border:1px solid var(--tile-line);
    box-shadow:inset 0 -3px 0 rgba(86,69,98,0.08);
  }
  .thumb::before{
    content:"";
    width:44px;
    height:44px;
    position:absolute;
    background:#fff;
    border:1px solid #ddd8e2;
    border-radius:50%;
  }
  .thumb > svg{
    width:26px;
    height:26px;
    display:block;
    position:relative;
    z-index:1;
  }
  .item.on .thumb{
    background:#f5e7f7;
    border-color:var(--accent);
    box-shadow:inset 0 -4px 0 var(--accent);
  }
  .item.on .thumb::before{border-color:#e7b3ec;}
  .mark{
    position:absolute;
    z-index:2;
    top:5px;
    right:5px;
    width:16px;
    height:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent);
    border-radius:50%;
  }
  .mark svg{width:9px;height:9px;}
  .cap{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item.on .cap{
    color:var(--accent);
    font-weight:600;
  }
  .strength{
    margin-top:13px;
    padding-top:11px;
    border-top:1px solid var(--line);
  }
  .strength .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:14px;
  }
  .strength .row span:last-child{
    color:var(--accent);
    font-weight:600;
  }
  .slider-scale{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:8px;
    margin-top:9px;
  }
  .end{
    color:var(--muted);
    font-size:11px;
    font-weight:600;
  }
  .track{
    height:5px;
    position:relative;
    background:#ddd7e2;
  }
  .fill{
    position:absolute;
    top:0;
    left:0;
    width:65%;
    height:5px;
    background:var(--accent);
  }
  .knob{
    position:absolute;
    top:-5px;
    left:65%;
    width:15px;
    height:15px;
    margin-left:-7px;
    border:3px solid #fff;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 1px var(--accent);
  }
  .foot{
    display:flex;
    gap:10px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .btn{
    padding:10px 16px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    font:15px inherit;
  }
  .btn.primary{
    flex:1;
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
    font-weight:600;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Filters &amp; stickers</h1>
        <p>Clip from “The Long Signal”, Episode 42 · 0:18</p>
      </div>

      <div class="sec-label">Filters</div>
      <div class="grid">
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6.3 17.7 17.7 6.3"/></svg>
          </div>
          <div class="cap">None</div>
        </div>
        <div class="item on">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="1.4" stroke-linecap="round"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>
            <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg></span>
          </div>
          <div class="cap">Nightwave</div>
        </div>
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2"/><path d="M12 4v3M12 17v3"/></svg>
          </div>
          <div class="cap">Vinyl</div>
        </div>
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><path d="M3 18l5-6 4 4 3-4 6 6z"/><circle cx="8" cy="7" r="2"/></svg>
          </div>
          <div class="cap">Bloom</div>
        </div>
      </div>

      <div class="strength">
        <div class="row"><span>Filter strength</span><span>65%</span></div>
        <div class="slider-scale">
          <span class="end">Original</span>
          <div class="track"><span class="fill"></span><span class="knob"></span></div>
          <span class="end">Maximum</span>
        </div>
      </div>

      <div class="sec-label">Stickers</div>
      <div class="grid">
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4" height="6"/><rect x="17.5" y="13.5" width="4" height="6"/></svg>
          </div>
          <div class="cap">Headset</div>
        </div>
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><rect x="9.5" y="3" width="5" height="10"/><path d="M6 12a6 6 0 0 0 12 0M12 18v3M9 21h6"/></svg>
          </div>
          <div class="cap">Mic</div>
        </div>
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
          </div>
          <div class="cap">Waveform</div>
        </div>
        <div class="item">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.4" stroke-linecap="round"><path d="M12 20s-7-4.6-7-9.4A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.6C19 15.4 12 20 12 20z"/></svg>
          </div>
          <div class="cap">Loved</div>
        </div>
      </div>

      <div class="foot">
        <button class="btn" type="button">Reset</button>
        <button class="btn primary" type="button">Apply to clip</button>
      </div>
    </div>
  </div>
</body>
</html>
