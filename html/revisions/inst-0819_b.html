<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Filters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe3e7;
      color: #1f2933;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 18px 16px;
      background: #eef0f2;
    }

    .filter-card {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #e0e4e8;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(30, 41, 59, 0.10);
    }

    .filter-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: #263444;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .context {
      margin: 4px 0 0;
      color: #66727f;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .clear-button {
      flex: 0 0 auto;
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: #526273;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .filter-section,
    .filter-footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e5e8eb;
    }

    .section-title {
      margin: 0 0 9px;
      color: #2c3744;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .sort-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .sort-option {
      padding: 10px 5px;
      border: 1px solid #d9dee3;
      border-radius: 14px;
      background: #ffffff;
      color: #596572;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
    }

    .sort-option.selected {
      border-color: #526273;
      background: #526273;
      color: #ffffff;
    }

    .price-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .price-field {
      padding: 9px 12px;
      border: 1px solid #d9dee3;
      border-radius: 14px;
      background: #ffffff;
    }

    .price-field label {
      display: block;
      margin-bottom: 2px;
      color: #74808c;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 500;
    }

    .price-field input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #263444;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
    }

    .maximum-value {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .maximum-value input {
      flex: 1 1 auto;
    }

    .field-clear-text {
      flex: 0 0 auto;
      margin-left: 7px;
      padding: 2px 0 2px 8px;
      border: 0;
      border-left: 1px solid #d9dee3;
      background: transparent;
      color: #526273;
      font-size: 11px;
      line-height: 1.45;
      font-weight: 700;
      cursor: pointer;
    }

    .amenities {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px 12px;
    }

    .amenity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #3f4b57;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .check {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      border: 1.5px solid #bdc5cc;
      border-radius: 50%;
      background: #ffffff;
    }

    .check.checked {
      border-color: #526273;
      background: #526273;
    }

    .check svg {
      width: 12px;
      height: 12px;
      display: block;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .show-button {
      width: 100%;
      padding: 13px 16px;
      border: 0;
      border-radius: 14px;
      background: #344353;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }

    .result-note {
      margin: 7px 0 0;
      color: #75808b;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <form class="filter-card" aria-label="Filter Lisbon stays">
      <header class="filter-header">
        <div class="title-wrap">
          <h1>Filter stays</h1>
          <p class="context">Lisbon · May 12–16 · 2 guests</p>
        </div>
        <button class="clear-button" type="reset">Clear all</button>
      </header>

      <section class="filter-section" aria-labelledby="sort-heading-b">
        <h2 class="section-title" id="sort-heading-b">Sort by</h2>
        <div class="sort-options">
          <button class="sort-option selected" type="button" aria-pressed="true">Recommended</button>
          <button class="sort-option" type="button" aria-pressed="false">Lowest price</button>
          <button class="sort-option" type="button" aria-pressed="false">Top rated</button>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="price-heading-b">
        <h2 class="section-title" id="price-heading-b">Nightly price</h2>
        <div class="price-fields">
          <div class="price-field">
            <label for="minimum-price-b">Minimum</label>
            <input id="minimum-price-b" type="text" value="$80" aria-label="Minimum nightly price">
          </div>
          <div class="price-field">
            <label for="maximum-price-b">Maximum</label>
            <div class="maximum-value">
              <input id="maximum-price-b" type="text" value="$240" aria-label="Maximum nightly price">
              <button class="field-clear-text" type="button" aria-label="Clear maximum nightly price">Clear</button>
            </div>
          </div>
        </div>
      </section>

      <section class="filter-section" aria-labelledby="amenities-heading-b">
        <h2 class="section-title" id="amenities-heading-b">Amenities</h2>
        <div class="amenities">
          <div class="amenity">
            <span class="check checked" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M3.2 8.2 6.4 11.3 12.9 4.8"></path>
              </svg>
            </span>
            <span>Free Wi-Fi</span>
          </div>
          <div class="amenity">
            <span class="check" aria-hidden="true"></span>
            <span>Breakfast</span>
          </div>
          <div class="amenity">
            <span class="check checked" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M3.2 8.2 6.4 11.3 12.9 4.8"></path>
              </svg>
            </span>
            <span>Air conditioning</span>
          </div>
          <div class="amenity">
            <span class="check" aria-hidden="true"></span>
            <span>Free cancellation</span>
          </div>
        </div>
      </section>

      <footer class="filter-footer">
        <button class="show-button" type="button">Show 147 stays</button>
        <p class="result-note">Prices include taxes and booking fees.</p>
      </footer>
    </form>
  </div>
</body>
</html>
