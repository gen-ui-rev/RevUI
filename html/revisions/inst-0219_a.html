<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Member</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9ece8;
      color: #1c211e;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      background: #f4f6f3;
    }

    .remove-card {
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d8ded9;
      border-radius: 8px;
    }

    .icon-box {
      width: 44px;
      padding: 9px;
      margin-bottom: 14px;
      color: #a23c32;
      background: #fff3f1;
      border: 1px solid #edcec9;
      border-radius: 7px;
      line-height: 0;
    }

    .icon-box svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 0;
      color: #5c655f;
      font-size: 14px;
      line-height: 1.5;
    }

    .caution {
      margin: 15px 0 14px;
      padding: 11px 12px;
      color: #71332d;
      background: #fff6f4;
      border: 1px solid #efcfca;
      border-left: 3px solid #b94b40;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
    }

    .caution strong {
      display: block;
      margin-bottom: 2px;
      color: #842f27;
      font-size: 13px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      background: #fafbfa;
      border: 1px solid #d8ded9;
      border-radius: 6px;
    }

    .avatar {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: #225f42;
      background: #dceee3;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
    }

    .member-copy {
      min-width: 0;
    }

    .member-name {
      margin: 0;
      overflow: hidden;
      color: #202622;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-meta {
      margin: 2px 0 0;
      color: #707872;
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      gap: 9px;
    }

    button {
      width: 100%;
      padding: 11px 16px;
      border-radius: 6px;
      font: 700 14px/1.4 'Manrope', system-ui, sans-serif;
      cursor: default;
    }

    .safe-button {
      color: #ffffff;
      background: #278653;
      border: 1px solid #278653;
    }

    .remove-button {
      color: #9a3b32;
      background: #ffffff;
      border: 1px solid #d6aaa5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="remove-card" aria-labelledby="remove-title">
      <div class="icon-box" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 12.25C14.3472 12.25 16.25 10.3472 16.25 8C16.25 5.65279 14.3472 3.75 12 3.75C9.65279 3.75 7.75 5.65279 7.75 8C7.75 10.3472 9.65279 12.25 12 12.25Z" stroke="currentColor" stroke-width="1.7"/>
          <path d="M4.75 20C5.35 16.55 7.8 14.5 12 14.5C13.15 14.5 14.16 14.65 15.04 14.95" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M16.25 17.75H21.25" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="remove-title">Remove this member?</h1>
      <p class="description">You are about to remove Jordan Lee from the Sound Harbor workspace.</p>

      <div class="caution" role="note">
        <strong>This takes effect immediately.</strong>
        Jordan will lose workspace access and be removed from assigned projects. This action cannot be undone.
      </div>

      <div class="member">
        <div class="avatar" aria-hidden="true">JL</div>
        <div class="member-copy">
          <p class="member-name">Jordan Lee</p>
          <p class="member-meta">Editor · jordan.lee@example.com</p>
        </div>
      </div>

      <div class="actions">
        <button class="safe-button" type="button">Keep member</button>
        <button class="remove-button" type="button">Remove member</button>
      </div>
    </article>
  </div>
</body>
</html>
