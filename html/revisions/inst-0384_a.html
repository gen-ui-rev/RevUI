<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extend Parking Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8edeb;
      color: #172522;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      background: #f7f9f8;
    }

    .component {
      width: 100%;
    }

    .context {
      margin: 0 0 8px;
      color: #087b74;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .location-row {
      margin-top: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef3f2;
      border: 1px solid #dde5e3;
      border-radius: 4px;
    }

    .location-row svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: block;
      color: #087b74;
    }

    .location-row span {
      min-width: 0;
      color: #2f423e;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value-control {
      margin-top: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 12px;
      background: #dcefed;
      border-radius: 4px;
    }

    .step-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: #b9dfdb;
      color: #086f69;
      cursor: pointer;
    }

    .step-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .current-value {
      min-width: 0;
      text-align: center;
    }

    .number {
      display: block;
      color: #076e68;
      font-size: 32px;
      line-height: 38px;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .unit {
      display: block;
      margin-top: 2px;
      color: #356d68;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    .slider-area {
      margin-top: 16px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      color: #44534f;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .slider-label span:last-child {
      color: #087b74;
    }

    .slider {
      position: relative;
      height: 28px;
    }

    .track {
      position: absolute;
      top: 11px;
      right: 0;
      left: 0;
      height: 6px;
      background: #d8e0de;
      border-radius: 4px;
    }

    .track-fill {
      width: 28.57%;
      height: 6px;
      background: #0b8b83;
      border-radius: 4px;
    }

    .thumb {
      position: absolute;
      top: 4px;
      left: calc(28.57% - 10px);
      width: 20px;
      height: 20px;
      background: #087b74;
      border: 4px solid #f7f9f8;
      border-radius: 4px;
    }

    input[type="range"] {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .cost {
      margin-top: 14px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #dde5e3;
      border-radius: 4px;
    }

    .cost-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #5b6966;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
    }

    .cost-row span:last-child {
      color: #2f423e;
      font-weight: 600;
    }

    .cost-total {
      margin-top: 8px;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid #e4eae9;
      color: #172522;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    .cost-total span:last-child {
      color: #076e68;
    }

    .pay-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      padding: 0 16px;
      border: 0;
      border-radius: 4px;
      background: #087b74;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .pay-note {
      margin: 8px 0 0;
      text-align: center;
      color: #75817e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="component" aria-labelledby="session-title">
      <p class="context">Session ends 3:20 PM · $5.00/hr</p>
      <h1 id="session-title">Extend your parking</h1>

      <div class="location-row">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Riverside Parkade · Level 2, Bay 118</span>
      </div>

      <div class="value-control">
        <button class="step-button" type="button" aria-label="Decrease extension by fifteen minutes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </button>

        <div class="current-value" aria-live="polite">
          <span class="number">45</span>
          <span class="unit">minutes added</span>
        </div>

        <button class="step-button" type="button" aria-label="Increase extension by fifteen minutes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </button>
      </div>

      <div class="slider-area">
        <label class="slider-label" for="duration">
          <span>Extra time</span>
          <span>45 min · until 4:05 PM</span>
        </label>
        <div class="slider">
          <div class="track" aria-hidden="true">
            <div class="track-fill"></div>
          </div>
          <div class="thumb" aria-hidden="true"></div>
          <input id="duration" type="range" min="15" max="120" step="15" value="45" aria-valuetext="45 minutes added">
        </div>
      </div>

      <div class="cost">
        <div class="cost-row"><span>45 min extension</span><span>$3.75</span></div>
        <div class="cost-row"><span>Service fee</span><span>$0.35</span></div>
        <div class="cost-total"><span>Total due</span><span>$4.10</span></div>
      </div>

      <button class="pay-button" type="button">Confirm &amp; pay $4.10</button>
      <p class="pay-note">Charged to Visa ···· 4417</p>
    </section>
  </div>
</body>
</html>
