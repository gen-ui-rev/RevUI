<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Medication Adherence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e6e8;
      color: #29252a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px;
      background: #faf8f9;
    }

    .progress-component {
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .summary {
      margin: 7px auto 0;
      max-width: 300px;
      color: #716a70;
      font-size: 13px;
      line-height: 1.5;
    }

    .service-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 11px 0 0;
      color: #76566f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .service-label svg {
      width: 17px;
      height: 17px;
      flex: none;
      stroke: currentColor;
    }

    .ring-wrap {
      position: relative;
      width: 150px;
      margin: 18px auto 16px;
    }

    .ring-wrap svg {
      display: block;
      width: 150px;
      height: 150px;
    }

    .ring-track {
      fill: none;
      stroke: #e5dfe3;
      stroke-width: 11;
    }

    .ring-progress {
      fill: none;
      stroke: #8c6681;
      stroke-width: 11;
      stroke-linecap: butt;
      stroke-dasharray: 364.4;
      stroke-dashoffset: 51;
      transform: rotate(-90deg);
      transform-origin: 75px 75px;
    }

    .ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percent {
      color: #76566f;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .ring-label {
      margin-top: 7px;
      color: #716a70;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
    }

    .detail-rule {
      margin: 0;
      border: 0;
      border-top: 1px solid #ddd7db;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 13px;
      text-align: left;
    }

    .detail {
      padding-right: 18px;
    }

    .detail + .detail {
      padding-right: 0;
      padding-left: 20px;
      border-left: 1px solid #ddd7db;
    }

    .detail-label {
      margin: 0 0 3px;
      color: #7b7479;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 500;
    }

    .detail-value {
      margin: 0;
      color: #29252a;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .next-dose {
      margin-top: 16px;
      padding: 13px 14px 14px;
      border: 1px solid #ded5db;
      border-radius: 12px;
      background: #f3eef1;
      text-align: left;
    }

    .next-label {
      margin: 0;
      color: #76566f;
      font-size: 10px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dose-name {
      margin: 3px 0 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .dose-meta {
      margin: 2px 0 0;
      color: #716a70;
      font-size: 11px;
      line-height: 1.4;
    }

    .record-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #76566f;
      color: #ffffff;
      font: inherit;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="progress-component" aria-labelledby="adherence-title">
      <header>
        <h1 id="adherence-title">Weekly medication adherence</h1>
        <p class="summary">Follow your prescribed morning and evening dosing schedule.</p>
        <p class="service-label">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.2 5.5 18.5 15.8M6.4 17.6a4.5 4.5 0 0 1 0-6.4l4.8-4.8a4.5 4.5 0 0 1 6.4 6.4l-4.8 4.8a4.5 4.5 0 0 1-6.4 0Z" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
          Nightspring care plan
        </p>
      </header>

      <div class="ring-wrap" aria-label="86 percent of scheduled doses taken">
        <svg viewBox="0 0 150 150" role="img" aria-hidden="true">
          <circle class="ring-track" cx="75" cy="75" r="58"/>
          <circle class="ring-progress" cx="75" cy="75" r="58"/>
        </svg>
        <div class="ring-content">
          <span class="percent">86%</span>
          <span class="ring-label">12 of 14 doses</span>
        </div>
      </div>

      <hr class="detail-rule">

      <section class="details" aria-label="Adherence details">
        <div class="detail">
          <p class="detail-label">Week</p>
          <p class="detail-value">March 2–8</p>
        </div>
        <div class="detail">
          <p class="detail-label">Schedule</p>
          <p class="detail-value">Twice daily</p>
        </div>
      </section>

      <section class="next-dose" aria-labelledby="next-dose-title">
        <p class="next-label">Next prescribed dose</p>
        <p class="dose-name" id="next-dose-title">Metformin 500 mg · 8:00 PM</p>
        <p class="dose-meta">Take one tablet with your evening meal.</p>
        <button class="record-button" type="button">Record 8:00 PM dose</button>
      </section>
    </main>
  </div>
</body>
</html>
