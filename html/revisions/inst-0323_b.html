<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtone widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#dde0e4;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:50px 38px 50px 30px;
    background:#eceef1;
  }
  .lift{
    position:relative;
    width:100%;
  }
  .lift::before{
    content:"";
    position:absolute;
    top:10px;
    right:-8px;
    bottom:-10px;
    left:8px;
    border:1px solid rgba(31,95,245,0.18);
    border-radius:16px;
    background:#cbd8fa;
    box-shadow:0 16px 28px rgba(38,50,76,0.18);
  }
  .widget{
    position:relative;
    width:100%;
    padding:18px;
    border:1px solid rgba(31,95,245,0.26);
    border-radius:16px;
    background:#f7f9ff;
    box-shadow:0 7px 16px rgba(29,43,73,0.12);
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:12px;
    border-bottom:1px solid rgba(31,95,245,0.14);
  }
  .head .now{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#1f5ff5;
  }
  .head .app{
    padding:4px 8px;
    border-radius:10px;
    background:#e5ebfd;
    color:#52617a;
    font-size:11px;
    font-weight:700;
  }
  .item{
    display:flex;
    gap:14px;
    align-items:center;
    margin-top:16px;
  }
  .item img{
    width:84px;
    height:84px;
    display:block;
    flex:none;
    border:3px solid #ffffff;
    border-radius:14px;
    object-fit:cover;
    background:#c9ced6;
    box-shadow:0 5px 12px rgba(35,47,70,0.18);
  }
  .meta{min-width:0;}
  .title{
    margin:0;
    overflow:hidden;
    color:#10141c;
    font-size:18px;
    font-weight:700;
    line-height:1.25;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sub{
    margin:5px 0 0;
    overflow:hidden;
    color:#5b6472;
    font-size:13px;
    font-weight:500;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .show{
    margin:9px 0 0;
    color:#7a8290;
    font-size:12px;
    font-weight:400;
  }
  .track{
    height:7px;
    margin-top:18px;
    border:1px solid rgba(31,95,245,0.12);
    border-radius:4px;
    background:#dce5fc;
    box-shadow:inset 0 1px 2px rgba(35,49,80,0.1);
  }
  .fill{
    width:68%;
    height:100%;
    border-radius:4px;
    background:#1f5ff5;
  }
  .times{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    color:#6a7383;
    font-size:12px;
    font-weight:500;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    margin-top:16px;
  }
  .ghost{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(31,95,245,0.16);
    border-radius:12px;
    background:#ffffff;
    color:#2b3444;
    box-shadow:0 3px 7px rgba(40,52,78,0.09);
  }
  .play{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:3px solid #ffffff;
    border-radius:16px;
    background:#1f5ff5;
    box-shadow:0 7px 14px rgba(31,95,245,0.3);
    color:#ffffff;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="lift">
      <div class="widget">
        <div class="head">
          <span class="now">Now playing</span>
          <span class="app">Overtone</span>
        </div>

        <div class="item">
          <img src="https://loremflickr.com/84/84/studio?lock=4761" width="84" height="84" alt="Recording studio console, cover art for the episode">
          <div class="meta">
            <p class="title">The Long Way Around</p>
            <p class="sub">Episode 142 &middot; Marisol Vane</p>
            <p class="show">Paused Tuesday, 8:14 PM</p>
          </div>
        </div>

        <div class="track"><div class="fill"></div></div>
        <div class="times">
          <span>34:12</span>
          <span>16:05 left</span>
        </div>

        <div class="controls">
          <div class="ghost">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12a8 8 0 1 1 3.2 6.4"></path>
              <path d="M4 6.5V12h5.5"></path>
            </svg>
          </div>
          <div class="play">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M8 5.5v13l11-6.5z"></path>
            </svg>
          </div>
          <div class="ghost">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 0-3.2 6.4"></path>
              <path d="M20 6.5V12h-5.5"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
