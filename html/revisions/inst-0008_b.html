<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Room Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d3d1ca;
      color: #f5f1e5;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background:
        linear-gradient(90deg, rgba(36, 35, 31, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(36, 35, 31, 0.035) 1px, transparent 1px),
        #eeece5;
      background-size: 32px 32px;
      box-shadow: 0 18px 50px rgba(47, 44, 35, 0.12);
    }

    .activity {
      width: 840px;
      display: grid;
      grid-template-columns: minmax(0, 580px) minmax(0, 260px);
      border: 1px solid #24231f;
      background: #24231f;
      box-shadow: 12px 12px 0 rgba(36, 35, 31, 0.12);
    }

    .activity-main {
      padding: 52px 56px;
      background: #24231f;
    }

    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      padding: 7px 10px;
      background: rgba(237, 190, 28, 0.15);
      color: #f0c431;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      background: #f0c431;
    }

    h1 {
      max-width: 470px;
      margin: 0;
      color: #fffaf0;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .speaker {
      margin: 25px 0 0;
      color: #f5f0e3;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.4;
    }

    .room-meta {
      margin: 8px 0 0;
      color: #aaa69b;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    .activity-footer {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 32px 34px;
      background: #edbe1c;
      color: #24200f;
    }

    .service-meta {
      min-width: 0;
    }

    .service-kicker {
      margin: 0 0 9px;
      color: rgba(36, 32, 15, 0.72);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .service-name,
    .update-time {
      margin: 0;
      line-height: 1.35;
    }

    .service-name {
      color: #24200f;
      font-size: 24px;
      font-weight: 700;
    }

    .update-time {
      margin-top: 7px;
      color: rgba(36, 32, 15, 0.72);
      font-size: 14px;
      font-weight: 400;
    }

    .footer-action {
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid rgba(36, 32, 15, 0.25);
    }

    .open-button {
      width: 100%;
      margin: 0;
      padding: 15px 20px;
      border: 1px solid #24231f;
      background: #24231f;
      color: #fffaf0;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .open-button:focus-visible {
      outline: 3px solid #fffaf0;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-labelledby="activity-title">
      <div class="activity-main">
        <p class="live-label"><span class="live-dot" aria-hidden="true"></span>Live room</p>
        <h1 id="activity-title">Neighborhood check-in</h1>
        <p class="speaker">Mara Ellison is speaking</p>
        <p class="room-meta">12 listening · Started at 8:42 PM</p>
      </div>
      <div class="activity-footer">
        <div class="service-meta">
          <p class="service-kicker">Hosted on</p>
          <p class="service-name">Commonroom</p>
          <p class="update-time">Updated now</p>
        </div>
        <div class="footer-action">
          <button class="open-button" type="button">Open room</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
