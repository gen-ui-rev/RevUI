<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Project Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e1;
      color: #332d24;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 38px 38px;
      background: #fbf9f4;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .empty-state {
      width: 100%;
      text-align: center;
    }

    .empty-mark {
      width: 76px;
      margin: 0 auto 22px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: rgba(205, 132, 22, 0.16);
      color: #9a5d05;
    }

    .empty-mark svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    h1 {
      margin: 0;
      color: #8a5100;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.3px;
    }

    p.lede {
      max-width: 292px;
      margin: 10px auto 20px;
      color: #685f52;
      font-size: 15.5px;
      font-weight: 400;
      line-height: 1.45;
    }

    .topics-label {
      margin: 0 0 10px;
      color: #94795a;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0 0 20px;
    }

    .topic-chip {
      padding: 7px 12px;
      border: 1px solid #ddd0b6;
      border-radius: 999px;
      background: rgba(233, 201, 143, 0.24);
      color: #6b4508;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      text-decoration: none;
    }

    .topic-chip span {
      margin-right: 5px;
      color: #a97b2c;
      font-weight: 700;
    }

    .primary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 176px;
      padding: 13px 20px;
      border-radius: 4px;
      background: #e9c98f;
      color: #4f3000;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
    }

    .secondary-action {
      display: block;
      margin-top: 14px;
      color: #7a6a52;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.3;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="empty-state" aria-labelledby="empty-title">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 5.5H22.5L27 10V30.5H9V5.5Z" fill="currentColor" opacity="0.2"/>
          <path d="M22.5 5.5V10H27M9 5.5H22.5L27 10V30.5H9V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13.5 15H22.5M13.5 19.5H22.5M13.5 24H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="empty-title">Start your project notes</h1>
      <p class="lede">Tap a topic to open a note with that heading ready to fill in.</p>
      <p class="topics-label">Suggested topics</p>
      <div class="topics">
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Kickoff agenda</a>
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Decision log</a>
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Meeting notes</a>
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Risks &amp; blockers</a>
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Next steps</a>
        <a class="topic-chip" href="#"><span aria-hidden="true">+</span>Client feedback</a>
      </div>
      <a class="primary-action" href="#" aria-label="Create your first project note">Create blank note</a>
      <a class="secondary-action" href="#">Browse all note templates</a>
    </main>
  </div>
</body>
</html>
