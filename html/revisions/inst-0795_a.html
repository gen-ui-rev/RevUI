<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Tutoring Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 0;
      background: #e5e7ea;
      color: #202124;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 18px;
      background: #f2f3f5;
    }

    .picker {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(28, 31, 35, 0.09);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #c93636;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202124;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.3;
    }

    .summary {
      margin: 5px 0 0;
      color: #686d75;
      font-size: 13px;
      line-height: 1.45;
    }

    .student {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 0 0;
      color: #454950;
      font-size: 12px;
      font-weight: 600;
    }

    .student-icon {
      display: grid;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #fff0f0;
      color: #b82d2d;
      font-size: 10px;
      font-weight: 700;
    }

    .student span:last-child {
      color: #777c83;
      font-weight: 500;
    }

    .section {
      margin-top: 15px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .section-heading h2 {
      margin: 0;
      color: #34373c;
      font-size: 13px;
      font-weight: 700;
    }

    .month {
      color: #747980;
      font-size: 11px;
      font-weight: 500;
    }

    .dates {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .date {
      padding: 7px 2px 8px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #4e535a;
      text-align: center;
      cursor: default;
    }

    .date .day {
      display: block;
      margin-bottom: 2px;
      color: inherit;
      font-size: 10px;
      font-weight: 500;
    }

    .date .number {
      display: block;
      color: inherit;
      font-size: 15px;
      font-weight: 700;
    }

    .date.selected {
      border-color: #c93636;
      background: #c93636;
      color: #ffffff;
    }

    .duration-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .duration {
      padding: 8px 4px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #555a61;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: default;
    }

    .duration.selected {
      border-color: #c93636;
      background: #fff5f5;
      color: #b82d2d;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .time {
      padding: 8px 2px;
      border: 1px solid #dfe1e5;
      border-radius: 6px;
      background: #ffffff;
      color: #3d4147;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      cursor: default;
    }

    .time.selected {
      border-color: #c93636;
      background: #fff5f5;
      color: #b82d2d;
    }

    .timezone {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 14px 0 0;
      color: #747980;
      font-size: 11px;
      line-height: 1.4;
    }

    .timezone svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      stroke: currentColor;
    }

    .confirm {
      width: 100%;
      margin-top: 13px;
      padding: 10px 14px;
      border: 1px solid #c93636;
      border-radius: 6px;
      background: #c93636;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="picker-title">
      <header>
        <p class="eyebrow">Brightpath Tutoring</p>
        <h1 id="picker-title">Book a tutoring session</h1>
        <p class="summary">Choose a time for a one-on-one algebra lesson.</p>
        <p class="student">
          <span class="student-icon" aria-hidden="true">EM</span>
          Emily Morgan <span>• Grade 8</span>
        </p>
      </header>

      <section class="section" aria-labelledby="date-heading-a">
        <div class="section-heading">
          <h2 id="date-heading-a">Date</h2>
          <span class="month">May 2026</span>
        </div>
        <div class="dates" role="group" aria-label="Available tutoring dates">
          <button class="date" type="button" aria-label="Monday, May 18">
            <span class="day">Mon</span>
            <span class="number">18</span>
          </button>
          <button class="date selected" type="button" aria-pressed="true" aria-label="Tuesday, May 19, selected">
            <span class="day">Tue</span>
            <span class="number">19</span>
          </button>
          <button class="date" type="button" aria-label="Wednesday, May 20">
            <span class="day">Wed</span>
            <span class="number">20</span>
          </button>
          <button class="date" type="button" aria-label="Thursday, May 21">
            <span class="day">Thu</span>
            <span class="number">21</span>
          </button>
          <button class="date" type="button" aria-label="Friday, May 22">
            <span class="day">Fri</span>
            <span class="number">22</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="duration-heading-a">
        <div class="section-heading">
          <h2 id="duration-heading-a">Lesson length</h2>
        </div>
        <div class="duration-options" role="group" aria-label="Tutoring session duration">
          <button class="duration" type="button">30 min</button>
          <button class="duration selected" type="button" aria-pressed="true">60 min</button>
          <button class="duration" type="button">90 min</button>
        </div>
      </section>

      <section class="section" aria-labelledby="time-heading-a">
        <div class="section-heading">
          <h2 id="time-heading-a">Start time</h2>
        </div>
        <div class="times" role="group" aria-label="Available tutoring start times">
          <button class="time" type="button">3:30 PM</button>
          <button class="time selected" type="button" aria-pressed="true">4:30 PM</button>
          <button class="time" type="button">5:30 PM</button>
          <button class="time" type="button">6:30 PM</button>
        </div>
      </section>

      <p class="timezone">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke-width="1.7"></circle>
          <path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.3 5.1 3.3 8.5S14.2 18.2 12 20.5M12 3.5C9.8 5.8 8.7 8.6 8.7 12s1.1 6.2 3.3 8.5" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
        Eastern Time (UTC−4)
      </p>

      <button class="confirm" type="button">Continue to booking</button>
    </main>
  </div>
</body>
</html>
