<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumaudio Top Albums</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e9ee;
      color: #1d2230;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px 18px;
      background: #f1f2f5;
    }

    .chart-card {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #e5e7ec;
      border-radius: 10px;
      box-shadow: 0 5px 18px rgba(31, 35, 48, 0.08);
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -0.3px;
    }

    .period {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 9px;
      border: 1px solid #dfe1e7;
      border-radius: 10px;
      background: #ffffff;
      color: #555b69;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
    }

    .period svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
    }

    .summary {
      margin-top: 12px;
    }

    .total {
      color: #4f46c8;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.7px;
    }

    .summary-label {
      margin-top: 3px;
      color: #686e7c;
      font-size: 14px;
      line-height: 1.4;
    }

    .divider {
      height: 1px;
      margin: 14px 0;
      background: #e8e9ed;
    }

    figure {
      margin: 0;
    }

    figcaption {
      margin-bottom: 12px;
      color: #555b69;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    /* Featured cover banner */
    .hero {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #222733;
    }

    .hero img {
      width: 318px;
      height: 126px;
      display: block;
      object-fit: cover;
    }

    .hero-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(91, 82, 214, 0.92);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .hero-info {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 26px 12px 11px;
      background: linear-gradient(180deg, rgba(20, 22, 32, 0) 0%, rgba(20, 22, 32, 0.88) 62%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .hero-text {
      min-width: 0;
    }

    .hero-title {
      overflow: hidden;
      color: #ffffff;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: -0.2px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-artist {
      overflow: hidden;
      color: #cfd2dd;
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-time {
      flex: none;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 650;
      text-align: right;
      white-space: nowrap;
    }

    .hero-time small {
      display: block;
      margin-top: 2px;
      color: #b8bcc9;
      font-size: 10px;
      font-weight: 500;
    }

    /* Text-only ranked list of the rest */
    .rest-list {
      margin-top: 12px;
    }

    .rest-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) 46px;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid #eef0f4;
    }

    .rest-row:last-child {
      border-bottom: 0;
    }

    .rank {
      color: #9ba1ad;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .album-details {
      min-width: 0;
    }

    .album-copy {
      display: flex;
      align-items: baseline;
      gap: 5px;
      min-width: 0;
      line-height: 1.25;
    }

    .album-title {
      min-width: 0;
      overflow: hidden;
      color: #282d3a;
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .artist {
      flex: none;
      color: #777d89;
      font-size: 12px;
      font-weight: 400;
    }

    .bar-track {
      width: 100%;
      height: 5px;
      margin-top: 6px;
      border-radius: 10px;
      background: #e6e6f0;
    }

    .bar-fill {
      height: 5px;
      border-radius: 10px;
      background: #5b52d6;
    }

    .time {
      color: #3e4452;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }

    .chart-note {
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid #e8e9ed;
      color: #747a87;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="chart-card" aria-labelledby="chart-title">
      <header class="chart-header">
        <h1 id="chart-title">Your top albums</h1>
        <button class="period" type="button" aria-label="Selected period: Last 7 days">
          Last 7 days
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6.25 8 10l4-3.75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <div class="summary">
        <div class="total">14 hr 47 min</div>
        <div class="summary-label">Listening time across your five most-played albums</div>
      </div>

      <div class="divider"></div>

      <figure aria-labelledby="chart-caption">
        <figcaption id="chart-caption">Play time by album</figcaption>

        <div class="hero" aria-label="Number one album: Night Signal by Harbor Static, 4 hours 18 minutes">
          <img src="https://loremflickr.com/318/126/concert?lock=7730" width="318" height="126" alt="Purple concert lights for the album Night Signal">
          <div class="hero-badge">#1 this week</div>
          <div class="hero-info">
            <div class="hero-text">
              <div class="hero-title">Night Signal</div>
              <div class="hero-artist">Harbor Static</div>
            </div>
            <div class="hero-time">4h 18m<small>29% of total</small></div>
          </div>
        </div>

        <div class="rest-list">
          <div class="rest-row" aria-label="Soft Geometry by Mina Vale, 3 hours 44 minutes">
            <div class="rank">2</div>
            <div class="album-details">
              <div class="album-copy">
                <span class="album-title">Soft Geometry</span>
                <span class="artist">Mina Vale</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:87%"></div></div>
            </div>
            <div class="time">3h 44m</div>
          </div>

          <div class="rest-row" aria-label="Glass Weather by North Assembly, 2 hours 57 minutes">
            <div class="rank">3</div>
            <div class="album-details">
              <div class="album-copy">
                <span class="album-title">Glass Weather</span>
                <span class="artist">North Assembly</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:69%"></div></div>
            </div>
            <div class="time">2h 57m</div>
          </div>

          <div class="rest-row" aria-label="Juniper Lines by Ellis March, 2 hours 12 minutes">
            <div class="rank">4</div>
            <div class="album-details">
              <div class="album-copy">
                <span class="album-title">Juniper Lines</span>
                <span class="artist">Ellis March</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:51%"></div></div>
            </div>
            <div class="time">2h 12m</div>
          </div>

          <div class="rest-row" aria-label="After the Current by Cedar Frame, 1 hour 36 minutes">
            <div class="rank">5</div>
            <div class="album-details">
              <div class="album-copy">
                <span class="album-title">After the Current</span>
                <span class="artist">Cedar Frame</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:37%"></div></div>
            </div>
            <div class="time">1h 36m</div>
          </div>
        </div>
      </figure>

      <p class="chart-note">Lumaudio counts plays lasting longer than 30 seconds.</p>
    </section>
  </div>
</body>
</html>
