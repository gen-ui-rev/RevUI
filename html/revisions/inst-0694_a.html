<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Follow Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e7e4;
      color: #202528;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 24px;
      background: #f8f7f5;
    }

    .follow-card {
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e7e9e7;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 40, 35, 0.05);
    }

    .shop-identity {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .monogram {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #dce1e3;
      color: #46535a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .shop-copy {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #697277;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202528;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .category {
      margin: 4px 0 0;
      color: #697277;
      font-size: 14px;
      line-height: 1.4;
    }

    .follow-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 10px 0 0;
      color: #57645e;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .date-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 6px;
      border-radius: 50%;
      background: #38835c;
    }

    .follow-control {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      background: #e7f2eb;
      border: 1px solid #cce2d4;
      border-radius: 14px;
    }

    .state-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #26734a;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .control-copy {
      min-width: 0;
      flex: 1;
    }

    .control-title {
      margin: 0 0 4px;
      color: #1f5f3d;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .control-description {
      margin: 0;
      color: #50685a;
      font-size: 13px;
      line-height: 1.45;
    }

    .switch {
      width: 50px;
      height: 30px;
      flex: 0 0 50px;
      padding: 4px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border: 0;
      border-radius: 15px;
      background: #26734a;
      appearance: none;
      cursor: default;
    }

    .switch-knob {
      width: 22px;
      height: 22px;
      display: block;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(27, 47, 36, 0.25);
    }

    .feed-note {
      margin: 18px 2px 0;
      color: #626c71;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="follow-card" aria-labelledby="shop-name">
      <div class="shop-identity">
        <div class="monogram" aria-hidden="true">HM</div>
        <div class="shop-copy">
          <p class="eyebrow">Shop on NookCart</p>
          <h1 id="shop-name">Harbor &amp; Main</h1>
          <p class="category">Home goods and storage</p>
          <p class="follow-date"><span class="date-dot" aria-hidden="true"></span>Following since March 18, 2025</p>
        </div>
      </div>

      <div class="follow-control">
        <span class="state-icon" aria-hidden="true">✓</span>
        <div class="control-copy">
          <p class="control-title">Following</p>
          <p class="control-description">Products and restocks appear in your feed.</p>
        </div>
        <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Following Harbor and Main">
          <span class="switch-knob"></span>
        </button>
      </div>

      <p class="feed-note">You’ll see shop updates alongside other recommendations in your home feed.</p>
    </section>
  </div>
</body>
</html>
