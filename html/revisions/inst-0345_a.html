<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Support Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #172033;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    .service {
      margin: 0 0 6px;
      color: #246bdb;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .helper {
      margin: 7px 0 0;
      color: #667085;
      font-size: 13px;
      line-height: 1.45;
    }

    .current-ticket {
      margin-top: 15px;
      padding: 11px 0;
      display: flex;
      align-items: center;
      gap: 11px;
      border-top: 1px solid #dfe4ea;
      border-bottom: 1px solid #dfe4ea;
    }

    .ticket-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #eaf2ff;
      color: #246bdb;
    }

    .ticket-copy {
      min-width: 0;
      flex: 1;
    }

    .ticket-meta {
      margin: 0 0 3px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #7b8494;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 600;
    }

    .priority {
      padding: 2px 6px;
      border-radius: 999px;
      background: #fff0ed;
      color: #b42318;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ticket-name {
      margin: 0;
      overflow: hidden;
      color: #172033;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    section {
      margin-top: 15px;
    }

    .section-heading {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-label {
      margin: 0;
      color: #344054;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .create {
      padding: 0;
      border: 0;
      background: transparent;
      color: #246bdb;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .queue-list {
      border-top: 1px solid #dfe4ea;
      border-bottom: 1px solid #dfe4ea;
    }

    .queue-row {
      width: 100%;
      margin: 0;
      padding: 9px 9px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-bottom: 1px solid #e7ebf0;
      border-radius: 0;
      background: transparent;
      color: #172033;
      font: inherit;
      text-align: left;
    }

    .queue-row:last-child {
      border-bottom: 0;
    }

    .queue-row.selected {
      margin: -1px 0;
      padding-top: 10px;
      padding-bottom: 10px;
      border: 1px solid #246bdb;
      border-radius: 4px;
      background: #f2f7ff;
      color: #174f9f;
    }

    .queue-icon {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      color: #667085;
    }

    .selected .queue-icon {
      color: #246bdb;
    }

    .queue-copy {
      min-width: 0;
    }

    .queue-name {
      display: block;
      margin: 0;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 600;
    }

    .queue-detail {
      display: block;
      margin-top: 2px;
      color: #7b8494;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 400;
    }

    .selected .queue-detail {
      color: #5575a3;
    }

    .check {
      width: 19px;
      height: 19px;
      margin-left: auto;
      flex: 0 0 19px;
      color: #246bdb;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .action {
      width: 100%;
      padding: 10px 16px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .move {
      border: 1px solid #246bdb;
      background: #246bdb;
      color: #ffffff;
    }

    .cancel {
      border: 1px solid #cfd6df;
      background: #ffffff;
      color: #475467;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="route-title">
      <header>
        <p class="service">Northstar Support</p>
        <h1 id="route-title">Route ticket</h1>
        <p class="helper">Choose the queue best equipped to resolve this customer request.</p>
      </header>

      <div class="current-ticket">
        <div class="ticket-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M5 5.5h14v10H9l-4 3v-13Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M8.5 9h7M8.5 12h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="ticket-copy">
          <p class="ticket-meta">
            <span>Ticket #4821</span>
            <span class="priority">High priority</span>
          </p>
          <p class="ticket-name">Duplicate charge on annual subscription</p>
        </div>
      </div>

      <section aria-labelledby="queue-label">
        <div class="section-heading">
          <h2 class="section-label" id="queue-label">Destination queue</h2>
          <button class="create" type="button">+ Create queue</button>
        </div>

        <div class="queue-list" role="radiogroup" aria-label="Destination queue">
          <button class="queue-row" type="button" role="radio" aria-checked="false">
            <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 6.5h16v11H4v-11Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            <span class="queue-copy">
              <span class="queue-name">General Support</span>
              <span class="queue-detail">14 open tickets</span>
            </span>
          </button>

          <button class="queue-row selected" type="button" role="radio" aria-checked="true">
            <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <span class="queue-copy">
              <span class="queue-name">Billing &amp; Payments</span>
              <span class="queue-detail">6 open tickets</span>
            </span>
            <svg class="check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="currentColor"/>
              <path d="m8 12.2 2.55 2.55L16.5 8.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="queue-row" type="button" role="radio" aria-checked="false">
            <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.5 19 7v5c0 4.2-2.8 7.2-7 8.5-4.2-1.3-7-4.3-7-8.5V7l7-3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="queue-copy">
              <span class="queue-name">Account Security</span>
              <span class="queue-detail">3 open tickets</span>
            </span>
          </button>
        </div>
      </section>

      <div class="actions">
        <button class="action move" type="button">Move ticket</button>
        <button class="action cancel" type="button">Cancel</button>
      </div>
    </main>
  </div>
</body>
</html>
