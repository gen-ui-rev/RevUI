<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#B45309;
    --ink:#1B1B1B;
    --muted:#767676;
    --rule:#E6E4E1;
    --soft:#F8F7F5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#EFEDEA;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:560px;
    background:#FFFFFF;
    padding:24px 0;
  }
  .sheet{padding:0 24px;}
  .title{
    margin:0;
    font-size:20px;
    line-height:25px;
    font-weight:600;
    letter-spacing:-0.2px;
  }
  .subtitle{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:18px;
  }
  .search{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:16px;
    padding:10px 12px;
    border:1px solid #D9D6D2;
    border-radius:5px;
    background:#FFFFFF;
  }
  .search svg{flex:0 0 18px;}
  .search input{
    min-width:0;
    width:100%;
    padding:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--ink);
    font:400 14px/18px 'Inter',system-ui,sans-serif;
  }
  .search input::placeholder{color:#96918C;}
  .list{
    margin-top:13px;
    border-top:1px solid var(--rule);
  }
  .row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 0;
    border-bottom:1px solid var(--rule);
  }
  .avatar{
    width:34px;
    height:34px;
    flex:0 0 34px;
    border:1px solid var(--rule);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
  }
  .who{min-width:0;flex:1;}
  .name{
    font-size:14px;
    font-weight:500;
    line-height:19px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    color:var(--muted);
    font-size:12px;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pick{
    width:21px;
    height:21px;
    flex:0 0 21px;
    border:1.5px solid #C9C6C2;
    border-radius:50%;
  }
  .pick.on{
    display:flex;
    align-items:center;
    justify-content:center;
    border-color:var(--accent);
    background:var(--accent);
  }
  .send{
    display:block;
    width:100%;
    margin-top:16px;
    padding:13px 12px;
    border:0;
    border-radius:5px;
    background:var(--accent);
    color:#FFFFFF;
    font:600 15px/18px 'Inter',system-ui,sans-serif;
    text-align:center;
  }
  .secondary-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    color:var(--muted);
    font-size:11px;
    line-height:15px;
    text-transform:uppercase;
    letter-spacing:.6px;
  }
  .secondary-label::before,
  .secondary-label::after{
    content:"";
    height:1px;
    flex:1;
    background:var(--rule);
  }
  .channels{
    display:flex;
    gap:7px;
    margin-top:8px;
  }
  .chan{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px 5px;
    border:1px solid var(--rule);
    border-radius:4px;
    background:var(--soft);
    color:#66625E;
    font-size:12px;
    font-weight:500;
    line-height:16px;
  }
  .chan svg{flex:0 0 17px;}
  .note{
    margin:10px 0 0;
    color:var(--muted);
    font-size:11px;
    line-height:16px;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <h1 class="title">Share note</h1>
      <p class="subtitle">Q3 Planning Retro &middot; Harbor Studio workspace</p>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#85817D" stroke-width="1.7" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="5.8"></circle>
          <path d="M15 15l4.5 4.5"></path>
        </svg>
        <input type="search" aria-label="Search recipients" placeholder="Search people or teams">
      </label>

      <div class="list">
        <div class="row">
          <div class="avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Dana Whitfield</div>
            <div class="meta">Can edit &middot; Design</div>
          </div>
          <div class="pick on">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Miles Okafor</div>
            <div class="meta">Can comment &middot; Engineering</div>
          </div>
          <div class="pick on">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-linecap="round"><path d="M4 18.5c0-3.6 3.6-6 8-6s8 2.4 8 6"/><circle cx="12" cy="7" r="3.5"/><path d="M9 21h6"/></svg>
          </div>
          <div class="who">
            <div class="name">Product Guild</div>
            <div class="meta">Team &middot; 14 members</div>
          </div>
          <div class="pick"></div>
        </div>
      </div>

      <button class="send" type="button">Share with 2 recipients</button>

      <div class="secondary-label">Other ways to share</div>
      <div class="channels">
        <div class="chan">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          Copy link
        </div>
        <div class="chan">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/></svg>
          Email
        </div>
        <div class="chan">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.8-3.6 6.8-8 6.8-1 0-2-.2-2.9-.5L4.5 20l1.2-3.3A6.5 6.5 0 0 1 4 12.2C4 8.4 7.6 5.4 12 5.4s8 3 8 6.8Z"/></svg>
          Message
        </div>
      </div>
      <p class="note">Recipients receive access when you share.</p>
    </div>
  </div>
</body>
</html>
