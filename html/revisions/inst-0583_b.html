<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a New Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf1;
      color: #17212b;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    h1 {
      margin: 0;
      color: #1769d2;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.3px;
    }

    .intro {
      margin: 4px 0 0;
      color: #64717e;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .cover {
      position: relative;
      width: 342px;
      margin-top: 16px;
    }

    .cover img {
      width: 342px;
      height: 96px;
      display: block;
      object-fit: cover;
      border-radius: 4px;
      background: #cbd5df;
    }

    .cover-action {
      position: absolute;
      right: 10px;
      bottom: 10px;
      border: 1px solid #d3dbe3;
      border-radius: 4px;
      padding: 8px 10px;
      background: #ffffff;
      color: #263442;
      font: 500 12px/17px 'Roboto', system-ui, sans-serif;
      cursor: pointer;
    }

    form {
      margin-top: 14px;
    }

    .groups {
      border-bottom: 1px solid #dce2e8;
    }

    .group {
      display: flex;
      gap: 14px;
      padding: 10px 0;
      border-top: 1px solid #dce2e8;
    }

    .group-title {
      width: 88px;
      flex: none;
      margin: 0;
      padding-top: 8px;
      color: #7a8794;
      font: 700 11px/16px 'Roboto', system-ui, sans-serif;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .group-rows {
      flex: 1;
      min-width: 0;
    }

    .row {
      width: 100%;
      margin: 0;
      padding: 7px 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
    }

    .row + .row {
      border-top: 1px solid #eaeff4;
    }

    button.row {
      cursor: pointer;
    }

    .row-label {
      flex: none;
      color: #6b7783;
      font: 400 12px/20px 'Roboto', system-ui, sans-serif;
    }

    .row-value,
    .trip-input {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17212b;
      text-align: right;
      font: 400 15px/20px 'Roboto', system-ui, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-input {
      width: 165px;
    }

    .trip-input::placeholder {
      color: #87929d;
      opacity: 1;
    }

    .create-button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 18px;
      border: 0;
      border-radius: 4px;
      background: #1769d2;
      color: #ffffff;
      font: 500 15px/20px 'Roboto', system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="create-title">
      <header>
        <h1 id="create-title">Create a new trip</h1>
        <p class="intro">Add the basics for a new Northpath itinerary.</p>
      </header>

      <div class="cover">
        <img src="https://loremflickr.com/342/96/beach?lock=7790" width="342" height="96" alt="Rocky coastline selected as the trip cover">
        <button class="cover-action" type="button">Select cover</button>
      </div>

      <form>
        <div class="groups">
          <section class="group" aria-labelledby="grp-trip">
            <h2 class="group-title" id="grp-trip">Trip</h2>
            <div class="group-rows">
              <label class="row">
                <span class="row-label">Name</span>
                <input class="trip-input" type="text" value="Maine coast weekend" aria-label="Trip name">
              </label>
              <button class="row" type="button">
                <span class="row-label">Destination</span>
                <span class="row-value">Bar Harbor, Maine</span>
              </button>
            </div>
          </section>

          <section class="group" aria-labelledby="grp-when">
            <h2 class="group-title" id="grp-when">When</h2>
            <div class="group-rows">
              <button class="row" type="button">
                <span class="row-label">Dates</span>
                <span class="row-value">May 14–19, 2026</span>
              </button>
            </div>
          </section>

          <section class="group" aria-labelledby="grp-who">
            <h2 class="group-title" id="grp-who">Who</h2>
            <div class="group-rows">
              <button class="row" type="button">
                <span class="row-label">Travelers</span>
                <span class="row-value">2 adults</span>
              </button>
              <button class="row" type="button">
                <span class="row-label">Planning access</span>
                <span class="row-value">Only me</span>
              </button>
            </div>
          </section>
        </div>

        <button class="create-button" type="submit">Create trip</button>
      </form>
    </main>
  </div>
</body>
</html>
