<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charging Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e9e9ec;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:#1b1b1f;
  }
  .screen{
    width:390px;
    height:560px;
    background:#f1f1f4;
    padding:28px 0;
    box-sizing:border-box;
  }
  .card{
    width:318px;
    margin:0 auto;
    background:#ffffff;
    border-radius:6px;
    box-shadow:0 6px 20px rgba(24,22,30,.10);
    padding:24px 22px 22px;
    box-sizing:border-box;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#84838d;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#0f8a4f;
    display:inline-block;
  }
  .count{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:52px;
    line-height:1.05;
    letter-spacing:-.01em;
    margin:14px 0 2px;
  }
  .count small{
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:15px;
    font-weight:400;
    color:#84838d;
    letter-spacing:0;
    margin-left:8px;
  }
  .track{
    height:6px;
    border-radius:6px;
    background:#ececed;
    margin:18px 0 8px;
    overflow:hidden;
  }
  .fill{
    width:78%;
    height:100%;
    background:#0f8a4f;
    border-radius:6px;
  }
  .ends{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#84838d;
  }
  .rule{
    height:1px;
    background:#ececef;
    margin:20px 0 16px;
  }
  .meta .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13.5px;
    padding:6px 0;
  }
  .meta .row span{color:#84838d;}
  .meta .row strong{font-weight:600;}
  .meta .row.total{
    border-top:1px solid #ececef;
    margin-top:6px;
    padding-top:10px;
  }
  .meta .row.total strong{
    font-family:'Playfair Display', Georgia, serif;
    font-size:20px;
    color:#0f8a4f;
  }
  .now{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  .art{
    width:46px;height:46px;
    border-radius:6px;
    background:#dcf1e5;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .now-text{min-width:0;}
  .now-title{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-sub{
    font-size:13px;
    color:#84838d;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    border-radius:6px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:11px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    box-sizing:border-box;
    cursor:default;
  }
  .btn-ghost{
    background:#ffffff;
    border:1px solid #d9d9de;
    color:#1b1b1f;
  }
  .btn-solid{
    background:#0f8a4f;
    border:1px solid #0f8a4f;
    color:#ffffff;
  }
  .cancel{
    display:block;
    width:100%;
    margin-top:14px;
    text-align:center;
    font-size:14px;
    color:#84838d;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="eyebrow"><span class="dot"></span>Charging session</div>

      <div class="count">78%<small>charged</small></div>

      <div class="track"><div class="fill"></div></div>
      <div class="ends">
        <span>Plugged in 7:12 PM</span>
        <span>Full by 8:04 PM</span>
      </div>

      <div class="rule"></div>

      <div class="meta">
        <div class="row"><span>Energy delivered</span><strong>31.4 kWh</strong></div>
        <div class="row"><span>Rate &middot; 48 kW now</span><strong>$0.41 / kWh</strong></div>
        <div class="row total"><span>Session cost</span><strong>$12.86</strong></div>
      </div>

      <div class="now">
        <div class="art">
          <svg width="16" height="22" viewBox="0 0 16 22" aria-hidden="true">
            <path d="M9.5 1L2 12.5h4.5L6 21l8-11.5H9.2L9.5 1z" fill="#0f8a4f"/>
          </svg>
        </div>
        <div class="now-text">
          <div class="now-title">Riverside Garage &middot; Bay 04</div>
          <div class="now-sub">CCS fast charge &middot; 150 kW max</div>
        </div>
      </div>

      <div class="actions">
        <div class="btn btn-ghost">
          <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true">
            <rect x="1" y="1" width="3.4" height="12" rx="1" fill="#1b1b1f"/>
            <rect x="7.6" y="1" width="3.4" height="12" rx="1" fill="#1b1b1f"/>
          </svg>
          Pause
        </div>
        <div class="btn btn-solid">
          <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
            <rect x="1" y="1" width="11" height="11" rx="1.5" fill="#ffffff"/>
          </svg>
          Stop &amp; pay
        </div>
      </div>

      <div class="cancel">View session details</div>
    </div>
  </div>
</body>
</html>
