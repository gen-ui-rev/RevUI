<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verba Daily — Today's lesson widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C026D3;
    --accent-soft:#E879F9;
    --card:#16131c;
    --ink:#ffffff;
    --muted:#a9a2b4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceaee;
    font-family:'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:30px;
    background:#0b0910;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .widget{
    width:330px;
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    border-left:3px solid var(--accent);
  }
  .wtop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:15px 18px 13px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:.1px;
  }
  .brand svg{display:block;}
  .streak{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .shot{
    width:327px;
    height:138px;
    object-fit:cover;
    display:block;
    background:#221d2b;
  }
  .body{
    padding:16px 18px 18px;
  }
  .eyebrow{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.9px;
    text-transform:uppercase;
    color:var(--accent-soft);
    background:rgba(192,38,211,.16);
    border:1px solid rgba(232,121,249,.35);
    border-radius:999px;
    padding:4px 10px;
  }
  .title{
    margin:10px 0 0;
    font-size:21px;
    line-height:27px;
    font-weight:700;
    color:var(--ink);
  }
  .segments{
    margin-top:16px;
    display:flex;
    gap:6px;
  }
  .segments i{
    flex:1;
    height:8px;
    border-radius:4px;
    background:#2a2433;
  }
  .segments i.on{
    background:var(--accent);
  }
  .meta{
    margin-top:11px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:var(--muted);
  }
  .meta b{
    font-weight:700;
    color:var(--ink);
  }
  .next{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #241f2d;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    color:var(--muted);
  }
  .next span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .next em{
    font-style:normal;
    font-weight:500;
    color:var(--accent-soft);
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="wtop">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.2h4.1c.9 0 1.4.5 1.4 1.3v8.3c-.5-.6-1-.8-1.8-.8H2.5V3.2Z" fill="#C026D3"/>
            <path d="M13.5 3.2H9.4c-.9 0-1.4.5-1.4 1.3v8.3c.5-.6 1-.8 1.8-.8h3.7V3.2Z" fill="none" stroke="#efeaf4" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          Verba Daily
        </div>
        <div class="streak">Day 12 streak</div>
      </div>

      <img class="shot" src="https://loremflickr.com/327/138/study?lock=7163" width="327" height="138" alt="Open Spanish workbook and notebook on a desk for today's lesson">

      <div class="body">
        <div class="eyebrow">Today's lesson</div>
        <h1 class="title">Unit 4 · At the Market</h1>

        <div class="segments">
          <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i>
        </div>
        <div class="meta">
          <span><b>3 of 5</b> exercises done</span>
          <span>9 min left</span>
        </div>

        <div class="next">
          <span>Up next · Ordering fruit by the kilo</span>
          <em>Resume</em>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
