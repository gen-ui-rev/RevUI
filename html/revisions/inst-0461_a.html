<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #e9edef;
      color: #152126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 32px;
      background: #ffffff;
    }

    .result {
      width: 100%;
    }

    .status-mark {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      background: #fff1c7;
      color: #9b5700;
      border: 1px solid #f2cf77;
    }

    .status-mark svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #956000;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #152126;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 10px 0 0;
      color: #526168;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .details {
      margin-top: 20px;
      border-top: 1px solid #d9e0e3;
      border-bottom: 1px solid #d9e0e3;
    }

    .detail-row {
      padding: 12px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px solid #e5eaec;
    }

    .detail-label {
      margin: 0 0 4px;
      color: #152126;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .detail-text {
      margin: 0;
      color: #65737a;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .done-button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 20px;
      border: 1px solid #152126;
      border-radius: 0;
      background: #152126;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="result" aria-labelledby="block-title">
      <div class="status-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none">
          <path d="M18 4.5L32 30H4L18 4.5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter"/>
          <path d="M18 13V21" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/>
          <path d="M18 25.5H18.02" stroke="currentColor" stroke-width="3.4" stroke-linecap="square"/>
        </svg>
      </div>

      <p class="eyebrow">Contact blocked</p>
      <h1 id="block-title">Avery Brooks is blocked</h1>
      <p class="summary">They can no longer message you about stays or send new trip invitations on Northtrail.</p>

      <section class="details" aria-label="Blocking details">
        <div class="detail-row">
          <p class="detail-label">Reservations stay active</p>
          <p class="detail-text">Booking and support updates can still reach you.</p>
        </div>
        <div class="detail-row">
          <p class="detail-label">No report was submitted</p>
          <p class="detail-text">Blocking limits contact. Reporting is a separate action.</p>
        </div>
      </section>

      <button class="done-button" type="button">Done</button>
    </main>
  </div>
</body>
</html>
