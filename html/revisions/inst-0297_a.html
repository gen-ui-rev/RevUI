<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northline — Weekly Money Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#d8dde1;
    font-family:'Nunito Sans', system-ui, sans-serif;
  }
  .screen{
    position:relative;
    width:390px;
    height:844px;
    background:#0b0f12;
    color:#f2f5f7;
    display:flex;
    flex-direction:column;
  }

  .progress{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px 0;
  }
  .track{
    flex:1;
    display:flex;
    gap:4px;
  }
  .seg{
    flex:1;
    height:3px;
    border-radius:2px;
    background:rgba(255,255,255,.22);
  }
  .seg.done{background:#f59e42;}
  .seg .fill{
    display:block;
    width:68%;
    height:3px;
    border-radius:2px;
    background:#f59e42;
  }
  .counter{
    flex:none;
    color:#7f898f;
    font-size:10px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
  }

  .head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 16px 14px;
  }
  .mono{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#f59e42;
    color:#3b1d08;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.02em;
  }
  .head .who{flex:1; min-width:0;}
  .head .title{
    font-size:15px;
    font-weight:700;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .head .sub{
    font-size:12px;
    color:#8a959c;
    margin-top:2px;
  }
  .close{
    width:32px;
    height:32px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#c7d0d5;
  }

  .hero{
    width:390px;
    height:352px;
    object-fit:cover;
    display:block;
    background:#1b2226;
  }

  .story{
    padding:23px 20px 0;
  }
  .kicker{
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#f59e42;
    font-weight:700;
  }
  .amount{
    font-size:40px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.1;
    margin-top:8px;
  }
  .amount .unit{
    font-size:18px;
    color:#8a959c;
    font-weight:400;
    margin-left:6px;
  }
  .change{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    color:#f59e42;
    font-size:13px;
    font-weight:700;
  }
  .change svg{flex:none;}
  .change .compare{
    color:#8a959c;
    font-weight:400;
  }
  .line{
    font-size:15px;
    line-height:1.45;
    color:#c7d0d5;
    margin:8px 0 0;
    max-width:340px;
  }
  .cta{
    margin-top:16px;
    height:48px;
    border-radius:10px;
    background:#f59e42;
    color:#3b1d08;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .next{
    position:absolute;
    left:20px;
    right:20px;
    bottom:96px;
    display:flex;
    align-items:center;
    gap:12px;
    border-top:1px solid rgba(255,255,255,.12);
    padding-top:14px;
  }
  .next img{
    width:44px;
    height:44px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#1b2226;
  }
  .next .txt{flex:1; min-width:0;}
  .next .lbl{font-size:12px; color:#8a959c;}
  .next .nm{
    font-size:14px;
    font-weight:700;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .next .cnt{font-size:12px; color:#8a959c;}

  .tabs{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    border-top:1px solid rgba(255,255,255,.12);
    display:flex;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#7d878d;
    font-size:12px;
  }
  .tab.on{color:#f59e42; font-weight:700;}
</style>
</head>
<body>
  <div class="screen">

    <div class="progress">
      <div class="track">
        <span class="seg done"></span>
        <span class="seg done"></span>
        <span class="seg"><span class="fill"></span></span>
        <span class="seg"></span>
      </div>
      <span class="counter">3 of 4</span>
    </div>

    <div class="head">
      <div class="mono">NL</div>
      <div class="who">
        <div class="title">Your Week in Money</div>
        <div class="sub">Feb 12 – Feb 18</div>
      </div>
      <div class="close" aria-label="Close story">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
      </div>
    </div>

    <img class="hero" src="https://loremflickr.com/390/352/city?lock=4460" width="390" height="352" alt="Downtown skyline at dusk illustrating this week's spending recap">

    <div class="story">
      <div class="kicker">Set aside</div>
      <div class="amount">$1,284.50<span class="unit">this week</span></div>
      <div class="change">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11V2M2.8 5.7L6.5 2l3.7 3.7"/></svg>
        $186.20 <span class="compare">from last week</span>
      </div>
      <p class="line">Both transfers cleared, lifting savings again.</p>
      <div class="cta">See the full breakdown</div>
    </div>

    <div class="next">
      <img src="https://loremflickr.com/44/44/chart?lock=4461" width="44" height="44" alt="Chart thumbnail for the next story card">
      <div class="txt">
        <div class="lbl">Up next</div>
        <div class="nm">Where your dining budget went</div>
      </div>
      <div class="cnt">18s</div>
    </div>

    <nav class="tabs">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 9l8-6 8 6v9a1 1 0 0 1-1 1h-4v-6H8v6H4a1 1 0 0 1-1-1V9z"/></svg>
        Home
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5" width="17" height="12" rx="2.5"/><path d="M2.5 9.5h17"/></svg>
        Cards
      </div>
      <div class="tab on">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18V9M11 18V4M18 18v-6"/></svg>
        Insights
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="8" r="3.5"/><path d="M4.5 19c1.3-3.2 3.6-4.8 6.5-4.8s5.2 1.6 6.5 4.8"/></svg>
        Profile
      </div>
    </nav>

  </div>
</body>
</html>
