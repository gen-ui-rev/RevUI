<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete listing — Marketmoss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#334155;
    --slate-soft:#64748b;
    --rule:#d7dbe0;
    --ink:#1c2430;
    --soft:#f5f7f8;
    --live:#237a57;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceef0;
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#ffffff;
    padding:25px 28px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--slate);
  }
  .eyebrow svg{display:block;}
  h1{
    margin:9px 0 5px;
    font-size:24px;
    line-height:1.2;
    font-weight:700;
  }
  .lede{
    margin:0 0 13px;
    font-size:13px;
    line-height:1.45;
    color:var(--slate-soft);
  }
  .item{
    display:flex;
    gap:13px;
    align-items:flex-start;
    padding:11px 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .item img{
    display:block;
    width:72px;
    height:72px;
    object-fit:cover;
    background:#dfe3e7;
    flex:0 0 auto;
  }
  .item-body{
    min-width:0;
    padding-top:2px;
  }
  .item-title{
    font-size:14px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-price{
    font-size:14px;
    font-weight:600;
    color:var(--slate);
    margin:0 0 5px;
  }
  .item-meta{
    font-size:12px;
    line-height:1.4;
    color:var(--slate-soft);
    margin:0;
  }
  .interest{
    margin:12px 0;
    padding:10px 11px;
    background:var(--soft);
    border-left:3px solid var(--live);
  }
  .interest-title{
    display:flex;
    align-items:center;
    gap:7px;
    margin:0 0 2px;
    color:var(--live);
    font-size:12px;
    line-height:1.3;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--live);
    flex:0 0 auto;
  }
  .interest-copy{
    margin:0;
    font-size:13px;
    line-height:1.4;
    color:var(--ink);
  }
  .keep-option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin:0 0 12px;
    padding:10px 11px;
    border:1px solid var(--rule);
    background:#fff;
    cursor:pointer;
  }
  .keep-option input{
    width:16px;
    height:16px;
    margin:2px 0 0;
    accent-color:var(--slate);
    flex:0 0 auto;
  }
  .keep-title{
    display:block;
    margin-bottom:1px;
    font-size:13px;
    line-height:1.35;
    font-weight:700;
  }
  .keep-copy{
    display:block;
    font-size:12px;
    line-height:1.35;
    color:var(--slate-soft);
  }
  .actions{display:block;}
  .btn{
    display:block;
    width:100%;
    border:1px solid var(--slate);
    border-radius:0;
    font-family:inherit;
    font-size:14px;
    line-height:1.2;
    font-weight:700;
    padding:11px 10px;
    text-align:center;
    background:none;
    color:var(--slate);
    cursor:pointer;
  }
  .btn-danger{
    background:var(--slate);
    color:#ffffff;
    margin-bottom:8px;
  }
  .btn-cancel{
    display:block;
    width:100%;
    border:0;
    background:none;
    font-family:inherit;
    font-size:13px;
    line-height:1.2;
    font-weight:600;
    color:var(--slate-soft);
    padding:11px 0 0;
    text-align:center;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="eyebrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
      </svg>
      Seller tools
    </div>

    <h1>Delete this listing?</h1>
    <p class="lede">It will disappear from Marketmoss and any shared buyer links.</p>

    <div class="item">
      <img src="https://loremflickr.com/72/72/sneakers?lock=6981" width="72" height="72" alt="Gray low-top running sneaker listed for sale">
      <div class="item-body">
        <p class="item-title">Ash Gray Trail Runner, Size 9</p>
        <p class="item-price">$68.00</p>
        <p class="item-meta">Listed Mar 4 · 214 views · 12 saves</p>
      </div>
    </div>

    <div class="interest" aria-label="Live buyer interest">
      <p class="interest-title"><span class="live-dot"></span>Buyer interest now</p>
      <p class="interest-copy"><strong>3 buyers are viewing</strong> · 1 offer awaits your reply</p>
    </div>

    <label class="keep-option">
      <input type="checkbox" checked>
      <span>
        <span class="keep-title">Keep photos and price history</span>
        <span class="keep-copy">Save a private seller copy after the public listing is deleted.</span>
      </span>
    </label>

    <div class="actions">
      <button type="button" class="btn btn-danger">Delete listing and keep records</button>
      <button type="button" class="btn">Archive instead</button>
      <button type="button" class="btn-cancel">Keep listing active</button>
    </div>
  </div>
</body>
</html>
