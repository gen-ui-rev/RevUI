<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf0;
      color: #17232d;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px;
      background: #f8fafb;
    }

    .success-card {
      padding: 25px 24px 24px;
      background: #123f56;
      border-radius: 12px;
      box-shadow: 0 12px 26px rgba(18, 63, 86, 0.18);
      color: #ffffff;
    }

    .heading-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .illustration-wrap {
      flex: 0 0 auto;
      width: 70px;
      padding: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border-radius: 50%;
    }

    .celebration {
      display: block;
      width: 60px;
    }

    .heading-copy {
      min-width: 0;
    }

    .status-label {
      margin: 0 0 3px;
      color: #95dcf5;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.1px;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 26px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .message {
      margin: 22px 0 0;
      color: #d8edf5;
      font-size: 15px;
      line-height: 1.55;
      font-weight: 400;
    }

    .message strong {
      display: block;
      margin-bottom: 3px;
      color: #ffffff;
      font-size: 17px;
      line-height: 1.4;
      font-weight: 600;
    }

    .saved-state {
      margin-top: 18px;
      padding-top: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      color: #c7e4ef;
      font-size: 13px;
      line-height: 1.5;
    }

    .saved-icon {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #63c3e8;
      border-radius: 50%;
      color: #123f56;
      font-size: 12px;
      font-weight: 700;
    }

    .completion {
      margin-top: 20px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #ffffff;
      border: 1px solid #d4e4eb;
      border-radius: 8px;
    }

    .completion-label {
      display: block;
      color: #667984;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .completion-value {
      display: block;
      margin-top: 3px;
      color: #243b47;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .lesson-count {
      flex: 0 0 auto;
      color: #117fb5;
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .primary-action {
      width: 100%;
      margin-top: 20px;
      padding: 14px 18px;
      border: 0;
      border-radius: 7px;
      background: #188fc8;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="success-card" aria-labelledby="success-title">
      <div class="heading-row">
        <div class="illustration-wrap">
          <svg class="celebration" viewBox="0 0 104 94" role="img" aria-label="Lesson completed successfully">
            <path d="M18 27L11 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
            <path d="M86 27L93 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
            <path d="M29 12L26 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
            <path d="M75 12L78 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
            <circle cx="8" cy="48" r="3" fill="#7DC9EB"/>
            <circle cx="96" cy="48" r="3" fill="#7DC9EB"/>
            <path d="M17 68L9 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
            <path d="M87 68L95 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
            <circle cx="52" cy="50" r="34" fill="#31A6DE"/>
            <path d="M36 50L47 61L69 38" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="heading-copy">
          <p class="status-label">Success</p>
          <h1 id="success-title">Lesson complete</h1>
        </div>
      </div>

      <p class="message">
        <strong>Ordering at a Café</strong>
        You completed every activity in this lesson.
      </p>

      <div class="saved-state">
        <span class="saved-icon" aria-hidden="true">✓</span>
        <span>Saved to your Northword course record.</span>
      </div>

      <div class="completion">
        <div>
          <span class="completion-label">Course progress</span>
          <span class="completion-value">Lessons completed</span>
        </div>
        <span class="lesson-count">8/10</span>
      </div>

      <button class="primary-action" type="button">Continue learning</button>
    </section>
  </div>
</body>
</html>
