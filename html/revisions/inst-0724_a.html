<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vela Seller Hub Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --indigo: #4f46c8;
      --indigo-soft: #eeedff;
      --text: #202234;
      --muted: #6c7184;
      --line: #e6e7ed;
      --ground: #f4f5f8;
      --white: #ffffff;
      --shadow: 0 3px 12px rgba(32, 34, 52, 0.06);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1e7;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: var(--ground);
      box-shadow: 0 8px 24px rgba(32, 34, 52, 0.12);
    }

    .topbar {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .topbar h1 {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      background: transparent;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .main {
      flex: 1;
      padding: 14px 16px 12px;
    }

    .intro h2 {
      margin: 0;
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .search {
      width: 100%;
      margin-top: 12px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid #dcdeea;
      border-radius: 14px;
      background: var(--white);
      box-shadow: var(--shadow);
      color: var(--muted);
      text-align: left;
    }

    .search svg {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      fill: none;
      stroke: var(--indigo);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .search span {
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .section {
      margin-top: 14px;
    }

    .faq-section {
      margin-top: 16px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 21px;
      font-weight: 600;
    }

    .card {
      background: var(--white);
      border: 1px solid #e9eaf0;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .row {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .faq-head {
      width: 100%;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .faq-head span {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
    }

    .faq-item.is-open .faq-head {
      padding-bottom: 2px;
    }

    .faq-item.is-open .faq-head span {
      font-weight: 600;
    }

    .faq-answer {
      margin: 0 13px 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: #9a9dad;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chevron.is-open {
      stroke: var(--indigo);
      transform: rotate(90deg);
    }

    .channel-row,
    .document-row {
      padding: 8px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--indigo-soft);
      color: var(--indigo);
    }

    .channel-mark svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .row-copy {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .row-meta {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
    }

    .document-row {
      padding-left: 14px;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 7px 8px 9px;
      background: var(--white);
      border-top: 1px solid var(--line);
    }

    .tab {
      min-width: 0;
      padding: 1px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #777b8b;
    }

    .tab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab span {
      font-size: 12px;
      line-height: 16px;
      font-weight: 400;
    }

    .tab.active {
      color: var(--indigo);
    }

    .tab.active span {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <h1>Seller Hub Support</h1>
      <button class="icon-button" type="button" aria-label="View support tickets">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3.8h10a2 2 0 0 1 2 2v14.4l-3-2-4 2-4-2-3 2V5.8a2 2 0 0 1 2-2Z"></path>
          <path d="M8.5 8h7M8.5 12h5"></path>
        </svg>
      </button>
    </header>

    <main class="main">
      <section class="intro" aria-labelledby="help-heading">
        <h2 id="help-heading">Seller help center</h2>
        <p>Guidance on payouts, listings, fulfillment, and shop policy.</p>
        <button class="search" type="button" aria-label="Search seller guides">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.3 4.3"></path>
          </svg>
          <span>Search seller guides</span>
        </button>
      </section>

      <section class="section" aria-labelledby="contact-heading">
        <h3 class="section-title" id="contact-heading">Contact the seller team</h3>
        <div class="card">
          <button class="row channel-row" type="button">
            <span class="channel-mark">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
                <path d="m5 7 7 5 7-5"></path>
              </svg>
            </span>
            <span class="row-copy">
              <span class="row-title">Open a seller ticket</span>
              <span class="row-meta">First reply within 4 business hours</span>
            </span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
          </button>
          <button class="row channel-row" type="button">
            <span class="channel-mark">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.2 4.5 10 8.2 8.3 10a15.6 15.6 0 0 0 5.7 5.7l1.8-1.7 3.7 2.8-.9 2.4a2 2 0 0 1-2.1 1.3C9.7 19.5 4.5 14.3 3.5 7.5a2 2 0 0 1 1.3-2.1l2.4-.9Z"></path>
              </svg>
            </span>
            <span class="row-copy">
              <span class="row-title">Call seller support</span>
              <span class="row-meta">Monday–Friday, 8 AM–8 PM ET</span>
            </span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
          </button>
        </div>
      </section>

      <section class="section faq-section" aria-labelledby="faq-heading">
        <h3 class="section-title" id="faq-heading">Seller questions</h3>
        <div class="card">
          <div class="row faq-item is-open">
            <button class="faq-head" type="button" aria-expanded="true">
              <span>When are seller payouts released?</span>
              <svg class="chevron is-open" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
            </button>
            <p class="faq-answer">Payouts settle every Friday for orders delivered at least three days earlier.</p>
          </div>
          <div class="row faq-item">
            <button class="faq-head" type="button" aria-expanded="false">
              <span>How do I fix a rejected listing?</span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
            </button>
          </div>
          <div class="row faq-item">
            <button class="faq-head" type="button" aria-expanded="false">
              <span>What counts as a late shipment?</span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
            </button>
          </div>
          <div class="row faq-item">
            <button class="faq-head" type="button" aria-expanded="false">
              <span>Can I pause my shop for vacation?</span>
              <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="guides-heading">
        <h3 class="section-title" id="guides-heading">Operations guides</h3>
        <div class="card">
          <button class="row document-row" type="button">
            <span class="row-copy">
              <span class="row-title">Bulk listing upload checklist</span>
              <span class="row-meta">Listings · 6 min read</span>
            </span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
          </button>
          <button class="row document-row" type="button">
            <span class="row-copy">
              <span class="row-title">Shop performance standards</span>
              <span class="row-meta">Policy · 5 min read</span>
            </span>
            <svg class="chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5"></path></svg>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3.5 10 8.5-7 8.5 7"></path>
          <path d="M5.5 9v11h13V9M9.5 20v-6h5v6"></path>
        </svg>
        <span>Dashboard</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5.5h7v7H4zM13 5.5h7v7h-7zM4 14.5h7v4H4zM13 14.5h7v4h-7z"></path>
        </svg>
        <span>Listings</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 7.5h15v12h-15zM8 7.5V5h8v2.5M4.5 12h15"></path>
        </svg>
        <span>Orders</span>
      </button>
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="3.4"></circle>
        </svg>
        <span>Support</span>
      </button>
    </nav>
  </div>
</body>
</html>
