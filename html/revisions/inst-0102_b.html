<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northpath Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9ed;
      color: #1d1920;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      position: relative;
      width: 1024px;
      height: 768px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(29, 25, 32, 0.12);
    }

    .top-bar {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #d20f8c;
    }

    .bar-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .saved-button {
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fbe6f3;
      color: #a20a6c;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .saved-button span.label {
      letter-spacing: -0.1px;
    }

    .sign-in {
      padding: 10px 16px;
      border: 1px solid #e4dee2;
      border-radius: 999px;
      background: transparent;
      color: #433943;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .welcome {
      flex: 1;
      padding: 8px 32px 36px;
      display: flex;
      flex-direction: column;
    }

    .hero {
      width: 960px;
      height: 300px;
      border-radius: 18px;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #d8d2d7;
    }

    .split {
      margin-top: 30px;
      display: flex;
      align-items: flex-start;
      gap: 44px;
    }

    .copy {
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #d20f8c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 520px;
      margin: 0;
      color: #1d1920;
      font-size: 42px;
      line-height: 49px;
      font-weight: 700;
      letter-spacing: -1.4px;
    }

    .description {
      max-width: 500px;
      margin: 16px 0 0;
      color: #6c626c;
      font-size: 16px;
      line-height: 26px;
      font-weight: 400;
    }

    .next-step {
      width: 340px;
      padding: 24px;
      border: 1px solid #e6e1e5;
      border-radius: 16px;
      background: #fdfbfc;
    }

    .step-label {
      margin: 0 0 8px;
      color: #a20a6c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .step-text {
      margin: 0 0 18px;
      color: #433943;
      font-size: 15px;
      line-height: 24px;
      font-weight: 500;
    }

    .primary-button {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #d20f8c;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .supporting-note {
      margin: 12px 0 0;
      color: #817681;
      text-align: center;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar" aria-label="App navigation">
      <div class="brand" aria-label="Northpath">
        <span class="brand-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M15 3.5L19.1 10.9L26.5 15L19.1 19.1L15 26.5L10.9 19.1L3.5 15L10.9 10.9L15 3.5Z" fill="currentColor"/>
            <circle cx="15" cy="15" r="3.2" fill="white"/>
          </svg>
        </span>
        <span>Northpath</span>
      </div>
      <div class="bar-nav">
        <button class="saved-button" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 15.2C9 15.2 2.4 11.4 2.4 6.9C2.4 5 3.9 3.5 5.8 3.5C7 3.5 8.3 4.2 9 5.4C9.7 4.2 11 3.5 12.2 3.5C14.1 3.5 15.6 5 15.6 6.9C15.6 11.4 9 15.2 9 15.2Z" fill="currentColor"/>
          </svg>
          <span class="label">Saved stays (4)</span>
        </button>
        <button class="sign-in" type="button">Sign in</button>
      </div>
    </header>

    <main class="welcome">
      <img
        class="hero"
        src="https://loremflickr.com/960/300/hotel?lock=2250"
        width="960"
        height="300"
        alt="A quiet hotel overlooking the coast"
      >

      <div class="split">
        <section class="copy" aria-labelledby="welcome-title">
          <p class="eyebrow">Stays for every route</p>
          <h1 id="welcome-title">Find the right place for your next trip.</h1>
          <p class="description">Compare stays along your route, save the ones that fit, and book when your plans are ready.</p>
        </section>

        <aside class="next-step" aria-label="Next step">
          <p class="step-label">Next step</p>
          <p class="step-text">Open the map and browse 240 verified stays between Bergen and the north coast.</p>
          <button class="primary-button" type="button">
            <span>Explore stays</span>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4.5 10H15.5M11 5.5L15.5 10L11 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <p class="supporting-note">No account needed to browse.</p>
        </aside>
      </div>
    </main>
  </div>
</body>
</html>
