<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rovebook Stay Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7ea;
      font-family: 'Source Serif 4', Georgia, serif;
      color: #ffffff;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #72766d;
    }

    .story-photo {
      position: absolute;
      inset: 0;
      width: 390px;
      height: 844px;
      display: block;
      object-fit: cover;
      background: #72766d;
    }

    .story-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 14px 13px;
      background: rgba(24, 24, 55, 0.78);
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
    }

    .progress {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .progress-segment {
      position: relative;
      flex: 1;
      height: 4px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.34);
    }

    .progress-fill {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: #ffffff;
    }

    .progress-fill.current {
      width: 64%;
      right: auto;
    }

    .progress-fill.empty {
      width: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-top: 15px;
    }

    .service-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      background: #4f46a5;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    .story-source {
      min-width: 0;
      margin-left: 11px;
    }

    .service-name {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 20px;
    }

    .story-count {
      margin: 1px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      line-height: 16px;
    }

    .bookmark-button,
    .close-button {
      height: 38px;
      padding: 8px;
      display: grid;
      place-items: center;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      background: rgba(24, 24, 55, 0.36);
    }

    .bookmark-button {
      width: 34px;
      margin-left: auto;
      margin-right: 8px;
    }

    .close-button {
      width: 38px;
    }

    .bookmark-button svg,
    .close-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .story-caption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 21px 24px 22px;
      background: #302d73;
      border-top: 1px solid rgba(255, 255, 255, 0.42);
    }

    .location {
      margin: 0 0 7px;
      color: #d8d6ff;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .price-feature {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin: 0 0 12px;
      color: #ffffff;
    }

    .price-feature-label {
      color: #d8d6ff;
      font-size: 13px;
      line-height: 18px;
    }

    .price-feature-value {
      font-size: 38px;
      font-weight: 700;
      line-height: 42px;
      letter-spacing: -0.035em;
    }

    .price-feature-unit {
      color: #d8d6ff;
      font-size: 14px;
      line-height: 20px;
    }

    .story-title {
      max-width: 330px;
      margin: 0;
      font-size: 23px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.015em;
    }

    .story-copy {
      max-width: 330px;
      margin: 8px 0 0;
      color: #ecebff;
      font-size: 14px;
      line-height: 20px;
    }

    .booking-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 17px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    .availability {
      min-width: 0;
      margin: 0 auto 0 0;
      color: #d8d6ff;
      font-size: 13px;
      line-height: 18px;
    }

    .primary-action {
      min-height: 46px;
      padding: 11px 18px;
      flex: none;
      border: 1px solid #ffffff;
      border-radius: 6px;
      background: #ffffff;
      color: #302d73;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <img
      class="story-photo"
      src="https://loremflickr.com/390/844/mountain?lock=11110"
      width="390"
      height="844"
      alt="Mountain lake and pine-covered slopes near the featured lodge"
    >

    <header class="story-header">
      <div class="progress" role="progressbar" aria-label="Story progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2">
        <span class="progress-segment"><span class="progress-fill"></span></span>
        <span class="progress-segment"><span class="progress-fill current"></span></span>
        <span class="progress-segment"><span class="progress-fill empty"></span></span>
        <span class="progress-segment"><span class="progress-fill empty"></span></span>
      </div>

      <nav class="top-bar" aria-label="Story navigation">
        <div class="service-mark" aria-hidden="true">R</div>
        <div class="story-source">
          <p class="service-name">Rovebook</p>
          <p class="story-count">Stay story · 2 of 4</p>
        </div>
        <button class="bookmark-button" type="button" aria-label="Save this stay">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 4.5H17V20L12 16.7L7 20V4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="close-button" type="button" aria-label="Close story">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </nav>
    </header>

    <section class="story-caption" aria-labelledby="story-title">
      <p class="location">Juniper Fold Lodge · Silverthorne, Colorado</p>
      <p class="price-feature">
        <span class="price-feature-label">From</span>
        <strong class="price-feature-value">$228</strong>
        <span class="price-feature-unit">per night</span>
      </p>
      <h1 class="story-title" id="story-title">A quiet base above Lake Dillon</h1>
      <p class="story-copy">Walk straight to the trail, then reach the shoreline and town center in a short drive.</p>

      <div class="booking-row">
        <p class="availability">Flexible dates available</p>
        <button class="primary-action" type="button">View this stay</button>
      </div>
    </section>
  </div>
</body>
</html>
