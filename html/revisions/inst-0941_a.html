<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Booking Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1e3;
      color: #202225;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eceeef;
    }

    .error-card {
      width: 100%;
      padding: 28px 24px 24px;
      text-align: center;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(31, 34, 38, 0.09);
    }

    .error-mark {
      width: 52px;
      margin: 0 auto 20px;
      color: #62676d;
    }

    .error-mark svg {
      display: block;
      width: 52px;
      height: 52px;
    }

    .label {
      margin: 0 0 8px;
      color: #62676d;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202225;
      font-size: 23px;
      font-weight: 700;
      line-height: 1.3;
    }

    .message {
      margin: 12px auto 0;
      max-width: 282px;
      color: #666b71;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    .slot {
      margin-top: 18px;
      padding: 12px 14px;
      text-align: left;
      background: #f4f5f6;
      border: 1px solid #e0e2e4;
      border-radius: 4px;
    }

    .slot-title {
      margin: 0;
      color: #34383d;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slot-meta {
      margin: 4px 0 0;
      color: #6d7278;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }

    .retry-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 18px;
      border: 1px solid #34383d;
      border-radius: 4px;
      background: #34383d;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
    }

    .call-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      color: #555a60;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .call-link svg {
      display: block;
      width: 15px;
      height: 15px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-mark" aria-hidden="true">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="50" height="50" rx="3" fill="#F1F2F3" stroke="#B7BBC0" stroke-width="2"/>
          <path d="M26 15V29" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="26" cy="37" r="2" fill="currentColor"/>
        </svg>
      </div>
      <p class="label">Booking not completed</p>
      <h1 id="error-title">We couldn’t confirm your appointment</h1>
      <p class="message">The clinic’s scheduling system didn’t respond in time. No visit was reserved and your card was not charged.</p>
      <div class="slot">
        <p class="slot-title">Dr. Amara Osei — General Medicine</p>
        <p class="slot-meta">Thu, May 16 · 9:40 AM · Riverbend Clinic</p>
      </div>
      <button class="retry-button" type="button">Try booking again</button>
      <a class="call-link" href="#">
        <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 1.5H2.2C1.8 1.5 1.5 1.9 1.6 2.3c.5 3 2.9 8.2 7.6 10.6.4.2.9.1 1.2-.2l1.1-1.2c.3-.3.3-.8-.1-1l-2-1.2c-.3-.2-.6-.1-.8.1l-.7.7C6.9 9 5.9 7.7 5.3 6.1l.8-.5c.3-.2.4-.5.3-.8L4.7 2C4.6 1.7 4.3 1.5 4 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        Call the clinic — (415) 555-0182
      </a>
    </section>
  </div>
</body>
</html>
