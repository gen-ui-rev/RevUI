<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #dfe3e2;
      color: #273032;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      padding: 58px 72px;
      display: flex;
      flex-direction: column;
      background: #f1f3f2;
    }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid #d9dfde;
    }

    .brand {
      margin: 0;
      color: #425357;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .workspace-label {
      margin: 0;
      color: #7a8587;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    .card-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .loading-card {
      width: 100%;
      display: flex;
      align-items: stretch;
      background: #ffffff;
      border: 1px solid #e0e5e4;
      border-radius: 10px;
      box-shadow: 0 16px 42px rgba(46, 58, 60, 0.09);
    }

    .spinner-panel {
      flex: 0 0 220px;
      padding: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7edec;
      border-radius: 9px 0 0 9px;
    }

    .spinner-frame {
      width: 104px;
      padding: 20px;
      background: #f8faf9;
      border: 1px solid #d7e0df;
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(66, 84, 87, 0.08);
    }

    .spinner {
      display: block;
      width: 62px;
      color: #79979c;
    }

    .spinner-track {
      stroke: #dce5e5;
    }

    .spinner-mark {
      stroke: currentColor;
    }

    .content {
      min-width: 0;
      flex: 1;
      padding: 52px 58px;
    }

    .service-name {
      margin: 0 0 11px;
      color: #71868a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #263033;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.2;
    }

    .description {
      max-width: 500px;
      margin: 20px 0 0;
      color: #596467;
      font-size: 17px;
      line-height: 1.55;
    }

    .status {
      margin: 22px 0 0;
      padding-top: 16px;
      color: #788285;
      font-size: 14px;
      line-height: 1.4;
      border-top: 1px solid #e7ebea;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="workspace-header">
      <p class="brand">Northfold</p>
      <p class="workspace-label">Shared workspace</p>
    </header>

    <main class="card-wrap">
      <section class="loading-card" role="status" aria-live="polite" aria-label="Opening the project room">
        <div class="spinner-panel">
          <div class="spinner-frame">
            <svg class="spinner" viewBox="0 0 56 56" aria-hidden="true">
              <circle class="spinner-track" cx="28" cy="28" r="22" fill="none" stroke-width="5"></circle>
              <path class="spinner-mark" d="M28 6a22 22 0 0 1 20.9 15.2" fill="none" stroke-width="5" stroke-linecap="round"></path>
            </svg>
          </div>
        </div>

        <div class="content">
          <p class="service-name">Atlas planning room</p>
          <h1>Opening the project room</h1>
          <p class="description">We’re gathering shared notes and recent updates for the Atlas planning room.</p>
          <p class="status">This may take a moment.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
