<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e6e2;
      color: #242422;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f2f1ed;
    }

    .action-sheet {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d8d7d2;
      border-top: 4px solid #30312f;
      border-radius: 10px;
      padding: 22px 22px 8px;
    }

    .sheet-header {
      padding-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #85847e;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #55554f;
      font-size: 18px;
      line-height: 1.18;
      font-weight: 400;
    }

    .post-context {
      margin-top: 16px;
    }

    .post-context img {
      width: 100%;
      height: 112px;
      display: block;
      object-fit: cover;
      background: #d5d2ca;
      border-radius: 8px;
    }

    .post-copy {
      min-width: 0;
    }

    .post-title {
      margin: 12px 0 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .post-meta {
      margin: 4px 0 0;
      color: #8a8983;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .actions {
      border-top: 1px solid #d8d7d2;
    }

    .action {
      width: 100%;
      display: block;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid #deddd8;
      background: transparent;
      color: #242422;
      text-align: left;
      font: inherit;
      cursor: default;
    }

    .action:last-child {
      border-bottom: 0;
    }

    .action-name {
      display: block;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
    }

    .action-detail {
      display: block;
      margin-top: 2px;
      color: #6b6a65;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-sheet" aria-labelledby="post-options-title">
      <header class="sheet-header">
        <p class="eyebrow">Your post</p>
        <h1 id="post-options-title">Choose what to do</h1>
        <div class="post-context">
          <img src="https://loremflickr.com/296/112/cafe?lock=7410" width="296" height="112" alt="Coffee and notebooks on a cafe table">
          <div class="post-copy">
            <p class="post-title">Saturday at Willow Cafe</p>
            <p class="post-meta">Cedar Circle &middot; June 8</p>
          </div>
        </div>
      </header>

      <div class="actions" role="menu" aria-label="Available post actions">
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Edit post</span>
          <span class="action-detail">Update the text or photo</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Change audience</span>
          <span class="action-detail">Choose who can see this post</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Delete post</span>
          <span class="action-detail">Remove it from Cedar Circle</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
