<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save rental to list — Northlake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9e9ec;
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:#16181d;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#f1f1f3;
    padding:24px 0;
  }
  .card{
    width:342px;
    margin:0 auto;
    background:#ffffff;
    border-radius:10px;
    box-shadow:0 8px 22px rgba(18,20,28,.10);
    padding:20px;
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .newlist{
    font-size:13px;
    font-weight:700;
    color:#d92a2a;
    white-space:nowrap;
  }
  .property{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:15px;
    padding-bottom:16px;
    border-bottom:1px solid #ececef;
  }
  .property img{
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .property-copy{
    min-width:0;
  }
  .property-name{
    font-size:15px;
    font-weight:700;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rent{
    margin-top:3px;
    font-size:16px;
    font-weight:700;
    color:#16181d;
  }
  .rent span{
    font-size:12px;
    font-weight:600;
    color:#6b7280;
  }
  .property-details{
    margin-top:3px;
    font-size:11px;
    color:#737985;
    white-space:nowrap;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:15px 0 8px;
  }
  .section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:#8a8f9a;
  }
  .section-count{
    font-size:11px;
    color:#9a9fa9;
  }
  .list-box{
    border:1px solid #e4e5e9;
    border-radius:10px;
    padding:2px 12px;
  }
  .list-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 0;
    border-bottom:1px solid #ececef;
  }
  .list-row:last-child{
    border-bottom:0;
  }
  .list-row img{
    width:40px;
    height:40px;
    border-radius:9px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .list-copy{
    flex:1 1 auto;
    min-width:0;
  }
  .list-name{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list-sub{
    margin-top:1px;
    font-size:11px;
    color:#7c818c;
  }
  .mark{
    flex:none;
  }
  .btn{
    margin-top:17px;
    width:100%;
    background:#d92a2a;
    color:#ffffff;
    border-radius:10px;
    padding:13px 0;
    text-align:center;
    font-size:15px;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Save rental to list</h1>
        <span class="newlist">New list</span>
      </div>

      <div class="property">
        <img src="https://loremflickr.com/64/64/architecture?lock=3220" width="64" height="64" alt="Exterior of Alder House rental building">
        <div class="property-copy">
          <div class="property-name">Alder House, Unit 4B</div>
          <div class="rent">$2,480 <span>/ month</span></div>
          <div class="property-details">2 bd · 1 ba · 810 ft² · Harborview</div>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title">Your rental lists</div>
        <div class="section-count">3 lists</div>
      </div>

      <div class="list-box">
        <div class="list-row">
          <img src="https://loremflickr.com/40/40/chart?lock=3221" width="40" height="40" alt="Cover thumbnail for the Shortlist">
          <div class="list-copy">
            <div class="list-name">Shortlist</div>
            <div class="list-sub">6 rentals · updated today</div>
          </div>
          <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="10" fill="#d92a2a"></circle>
            <path d="M6.5 11.3l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>

        <div class="list-row">
          <img src="https://loremflickr.com/40/40/city?lock=3222" width="40" height="40" alt="Cover thumbnail for the Weekend tours list">
          <div class="list-copy">
            <div class="list-name">Weekend tours</div>
            <div class="list-sub">4 rentals · updated yesterday</div>
          </div>
          <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="9.25" fill="none" stroke="#d3d5da" stroke-width="1.5"></circle>
          </svg>
        </div>

        <div class="list-row">
          <img src="https://loremflickr.com/40/40/office?lock=3223" width="40" height="40" alt="Cover thumbnail for the Compare later list">
          <div class="list-copy">
            <div class="list-name">Compare later</div>
            <div class="list-sub">3 rentals · updated Mar 12</div>
          </div>
          <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="9.25" fill="none" stroke="#d3d5da" stroke-width="1.5"></circle>
          </svg>
        </div>
      </div>

      <div class="btn">Save to Shortlist</div>
    </div>
  </div>
</body>
</html>
