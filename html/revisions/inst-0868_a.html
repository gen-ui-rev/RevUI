<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketmoor — Delivery Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#b96f18;
    --paper:#f8f3e9;
    --ink:#24211d;
    --mute:#716b62;
    --rule:#cfc6b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#d9d7d2;
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#e8e6e2;
    padding:34px 0;
  }
  .slip{
    width:334px;
    margin:0 auto;
    padding:19px 20px 22px;
    background:var(--paper);
    border:1px solid var(--rule);
  }
  .top{
    display:flex;
    align-items:center;
    gap:8px;
    padding-bottom:14px;
    border-bottom:1px dashed var(--rule);
  }
  .mark{
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:var(--amber);
  }
  .brand{
    font-size:12px;
    font-weight:600;
    letter-spacing:.13em;
    text-transform:uppercase;
  }
  .copy{
    margin-left:auto;
    font-size:10px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .receipt-label{
    margin:13px 0 0;
    font-size:10px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .order-row{
    display:flex;
    justify-content:space-between;
    gap:14px;
    margin-top:9px;
    padding-bottom:13px;
    border-bottom:1px solid var(--rule);
  }
  .field-label{
    display:block;
    margin-bottom:2px;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .field-value{
    display:block;
    font-size:14px;
    font-weight:600;
  }
  .order-row .right{text-align:right;}
  .arrival{
    padding:18px 0 15px;
    border-bottom:1px dashed var(--rule);
  }
  .eyebrow{
    margin:0 0 4px;
    font-size:12px;
    color:var(--mute);
  }
  h1{
    margin:0;
    font-family:'Playfair Display', Georgia, serif;
    font-size:27px;
    line-height:1.12;
    font-weight:700;
  }
  .status{
    margin:7px 0 0;
    font-size:14px;
    font-weight:600;
    color:var(--amber);
  }
  .journey{
    padding:16px 0 15px;
    border-bottom:1px dashed var(--rule);
  }
  .journey-title{
    margin:0 0 11px;
    font-size:10px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .track{
    display:flex;
    align-items:center;
  }
  .node{
    width:9px;
    height:9px;
    border:1px solid var(--amber);
    border-radius:50%;
    background:var(--paper);
    flex:0 0 auto;
  }
  .node.done,.node.current{background:var(--amber);}
  .node.current{
    width:13px;
    height:13px;
    border:3px solid var(--paper);
    outline:1px solid var(--amber);
  }
  .line{
    height:1px;
    flex:1;
    background:var(--rule);
  }
  .line.done{background:var(--amber);}
  .steps{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:10px;
    color:var(--mute);
  }
  .steps .on{
    color:var(--ink);
    font-weight:600;
  }
  .foot{
    display:flex;
    gap:20px;
    padding-top:14px;
  }
  .foot .col{min-width:0;}
  .foot .right{
    margin-left:auto;
    text-align:right;
  }
  .foot .value{
    display:block;
    font-size:14px;
    white-space:nowrap;
  }
  .updated{
    margin:16px 0 0;
    padding-top:11px;
    border-top:1px solid var(--rule);
    text-align:center;
    font-size:10px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--mute);
  }
</style>
</head>
<body>
  <div class="screen">
    <main class="slip">
      <div class="top">
        <div class="mark" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h16l-1.4 12H5.4L4 8z"/>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
          </svg>
        </div>
        <div class="brand">Marketmoor</div>
        <div class="copy">Delivery slip</div>
      </div>

      <p class="receipt-label">Dispatch record</p>
      <div class="order-row">
        <div>
          <span class="field-label">Order</span>
          <span class="field-value">48-20713</span>
        </div>
        <div class="right">
          <span class="field-label">Items</span>
          <span class="field-value">3</span>
        </div>
      </div>

      <section class="arrival">
        <p class="eyebrow">Estimated arrival</p>
        <h1>By 3:40 PM</h1>
        <p class="status">Out for delivery — 4 stops away</p>
      </section>

      <section class="journey">
        <p class="journey-title">Delivery progress</p>
        <div class="track" aria-hidden="true">
          <span class="node done"></span>
          <span class="line done"></span>
          <span class="node done"></span>
          <span class="line done"></span>
          <span class="node current"></span>
          <span class="line"></span>
          <span class="node"></span>
        </div>
        <div class="steps">
          <span>Packed</span>
          <span>Shipped</span>
          <span class="on">On route</span>
          <span>Delivered</span>
        </div>
      </section>

      <div class="foot">
        <div class="col">
          <span class="field-label">Courier</span>
          <span class="value">Dana Ruskin</span>
        </div>
        <div class="col right">
          <span class="field-label">Route position</span>
          <span class="value">4 stops away</span>
        </div>
      </div>

      <p class="updated">Printed status · Updated 2 min ago</p>
    </main>
  </div>
</body>
</html>
