<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review and Share Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e7e9e2;
      color: #1d211b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px;
      background: #f3f4ef;
    }

    .share-sheet {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9ddd3;
      border-radius: 14px;
    }

    .sheet-header {
      padding: 18px 18px 16px;
      border-bottom: 1px solid #e2e5dd;
    }

    .share-mark {
      width: 42px;
      padding: 9px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #273015;
      background: #c9f35b;
      border: 1px solid #b6dd50;
      border-radius: 12px;
    }

    .share-mark svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.45px;
    }

    .header-copy {
      margin: 5px 0 0;
      color: #687064;
      font-size: 13px;
      line-height: 1.45;
    }

    .lesson-preview {
      margin: 14px 16px 0;
      padding: 14px;
      background: #f7f8f4;
      border: 1px solid #dfe3d9;
      border-radius: 11px;
    }

    .preview-top {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .lesson-badge {
      width: 38px;
      padding: 9px 0;
      flex: 0 0 auto;
      color: #334018;
      background: #e5f6b8;
      border-radius: 9px;
      font-size: 13px;
      line-height: 20px;
      font-weight: 700;
      text-align: center;
    }

    .preview-copy {
      min-width: 0;
      flex: 1;
    }

    .preview-eyebrow {
      display: block;
      margin-bottom: 3px;
      color: #777f71;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .lesson-title {
      margin: 0;
      color: #20251e;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }

    .lesson-course {
      margin: 2px 0 0;
      color: #687064;
      font-size: 12px;
      line-height: 1.4;
    }

    .lesson-facts {
      margin-top: 11px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fact {
      padding: 5px 8px;
      color: #596052;
      background: #ffffff;
      border: 1px solid #dde1d7;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
    }

    .sheet-label {
      margin: 0;
      padding: 14px 18px 6px;
      color: #737a6d;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .share-options {
      margin: 0;
      padding: 0 8px 8px;
      list-style: none;
    }

    .share-option {
      width: 100%;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-bottom: 1px solid #e5e7e1;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: default;
    }

    .share-options li:last-child .share-option {
      border-bottom: 0;
    }

    .option-icon {
      width: 32px;
      padding: 7px;
      flex: 0 0 auto;
      color: #4c5740;
      background: #f0f2eb;
      border-radius: 8px;
    }

    .option-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .option-copy {
      min-width: 0;
      flex: 1;
    }

    .option-title {
      display: block;
      margin-bottom: 2px;
      color: #242921;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    .option-detail {
      display: block;
      color: #747b6e;
      font-size: 11px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: #8b9186;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="share-sheet" aria-labelledby="share-title">
      <header class="sheet-header">
        <div class="share-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8.5 12.2 15.7 8M8.5 12.2l7.2 4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="6.3" cy="13.2" r="2.7" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.7" cy="6.8" r="2.7" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.7" cy="17.2" r="2.7" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </div>
        <h1 id="share-title">Review before sharing</h1>
        <p class="header-copy">Confirm the lesson details, then choose where to send it.</p>
      </header>

      <article class="lesson-preview" aria-label="Lesson preview">
        <div class="preview-top">
          <div class="lesson-badge" aria-hidden="true">ES</div>
          <div class="preview-copy">
            <span class="preview-eyebrow">Lesson to share</span>
            <h2 class="lesson-title">Ordering at a Café</h2>
            <p class="lesson-course">Practical Spanish · Spanish Foundations</p>
          </div>
        </div>
        <div class="lesson-facts" aria-label="Lesson details">
          <span class="fact">Beginner</span>
          <span class="fact">12 min</span>
          <span class="fact">8 phrases</span>
        </div>
      </article>

      <p class="sheet-label">Share with</p>

      <ul class="share-options">
        <li>
          <button class="share-option" type="button">
            <span class="option-icon" aria-hidden="true">
              <svg viewBox="0 0 18 18" fill="none">
                <circle cx="6.2" cy="6.1" r="2.4" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="12.4" cy="7" r="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2.7 14c.4-2.3 1.7-3.5 3.8-3.5s3.5 1.2 3.8 3.5M10.1 11.1c.7-.4 1.5-.6 2.4-.5 1.7.1 2.7 1.2 2.9 3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="option-copy">
              <span class="option-title">Spanish Foundations</span>
              <span class="option-detail">Study group · 8 learners</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
        <li>
          <button class="share-option" type="button">
            <span class="option-icon" aria-hidden="true">
              <svg viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="6" r="2.7" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4.2 14.2c.4-2.7 2-4 4.8-4s4.4 1.3 4.8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="option-copy">
              <span class="option-title">Send to a learner</span>
              <span class="option-detail">Choose from your connections</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
        <li>
          <button class="share-option" type="button">
            <span class="option-icon" aria-hidden="true">
              <svg viewBox="0 0 18 18" fill="none">
                <path d="M7.2 10.8 10.8 7.2M6.1 12.9l-1 .9a2.6 2.6 0 0 1-3.7-3.7l2.8-2.8A2.6 2.6 0 0 1 7.9 7M11.9 5.1l1-.9a2.6 2.6 0 0 1 3.7 3.7l-2.8 2.8a2.6 2.6 0 0 1-3.7.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="option-copy">
              <span class="option-title">Copy lesson link</span>
              <span class="option-detail">Anyone with the link can view</span>
            </span>
            <svg class="chevron" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="m7 4.5 4.5 4.5L7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
      </ul>
    </section>
  </div>
</body>
</html>
