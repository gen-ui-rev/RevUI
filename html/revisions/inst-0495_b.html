<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loopframe Clip Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #dcdadd;
      color: #262328;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 560px;
      background: #1a1017;
    }

    /* ---- full-bleed preview stage ---- */
    .stage-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 330px;
      display: block;
      object-fit: cover;
      background: #2a1d24;
      filter: saturate(0.86) sepia(0.12) hue-rotate(300deg);
    }

    .stage-scrim {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 330px;
      background: linear-gradient(180deg, rgba(22, 12, 18, 0.6) 0%, rgba(22, 12, 18, 0.05) 34%, rgba(22, 12, 18, 0.78) 100%);
    }

    .stage-top {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-label {
      padding: 6px 11px;
      border-radius: 14px;
      background: #c43d69;
      color: #ffffff;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .stage-time {
      padding: 6px 11px;
      border-radius: 14px;
      background: rgba(18, 10, 14, 0.55);
      color: #f2ebee;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .stage-caption {
      position: absolute;
      top: 152px;
      left: 20px;
      right: 20px;
    }

    .panel-heading {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      line-height: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel-copy {
      margin: 4px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
    }

    /* ---- docked control sheet ---- */
    .control-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 16px 16px;
      background: #ffffff;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -12px 30px rgba(20, 11, 16, 0.35);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      margin: 0 auto 12px;
      border-radius: 2px;
      background: #dcd6da;
    }

    .choice-section + .choice-section {
      margin-top: 12px;
    }

    .section-title {
      margin: 0;
      color: #302c32;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .filter-option {
      width: 112px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #625c65;
      cursor: default;
    }

    .filter-option img {
      width: 112px;
      height: 62px;
      display: block;
      object-fit: cover;
      background: #d8d3d6;
      border-radius: 12px;
    }

    .filter-option.selected img {
      outline: 3px solid #c43d69;
      outline-offset: 2px;
      filter: saturate(0.86) sepia(0.12) hue-rotate(300deg);
    }

    .filter-option:nth-child(2) img {
      filter: saturate(0.75) contrast(1.05);
    }

    .filter-option:nth-child(3) img {
      filter: grayscale(1) contrast(1.1);
    }

    .filter-name {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      text-align: center;
    }

    .filter-option.selected .filter-name {
      color: #b4315d;
      font-weight: 600;
    }

    .sticker-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .sticker-option {
      width: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 6px;
      border: 1px solid #ded9de;
      border-radius: 12px;
      background: #ffffff;
      color: #5d5760;
      cursor: default;
    }

    .sticker-option.selected {
      border-color: #c43d69;
      background: #fff1f5;
      color: #ae2d58;
    }

    .sticker-option svg {
      width: 16px;
      height: 16px;
      display: block;
      flex: none;
    }

    .sticker-name {
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .apply-button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 0;
      border-radius: 14px;
      background: #c43d69;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <img class="stage-photo" src="https://loremflickr.com/390/330/concert?lock=6770" width="390" height="330" alt="Concert stage preview with rose-toned lighting">
    <span class="stage-scrim"></span>

    <div class="stage-top">
      <span class="preview-label">Roselight preview</span>
      <span class="stage-time">0:14 clip</span>
    </div>

    <div class="stage-caption">
      <h1 class="panel-heading">Choose a clip style</h1>
      <p class="panel-copy">Roselight filter with the On Air sticker.</p>
    </div>

    <section class="control-sheet" aria-label="Clip style options">
      <span class="sheet-handle"></span>

      <section class="choice-section" aria-labelledby="filters-title">
        <h2 class="section-title" id="filters-title">Filters</h2>
        <div class="filter-row">
          <button class="filter-option selected" type="button" aria-pressed="true">
            <img src="https://loremflickr.com/112/62/concert?lock=6771" width="112" height="62" alt="Roselight concert filter preview">
            <span class="filter-name">Roselight</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/112/62/studio?lock=6772" width="112" height="62" alt="Soft studio filter preview">
            <span class="filter-name">Soft Fade</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/112/62/vinyl?lock=6773" width="112" height="62" alt="Black and white vinyl filter preview">
            <span class="filter-name">Monochrome</span>
          </button>
        </div>
      </section>

      <section class="choice-section" aria-labelledby="stickers-title">
        <h2 class="section-title" id="stickers-title">Stickers</h2>
        <div class="sticker-row">
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/>
              <path d="M6.4 17.6 17.6 6.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="sticker-name">None</span>
          </button>
          <button class="sticker-option selected" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 8.5A2.5 2.5 0 0 1 7.5 6h9A2.5 2.5 0 0 1 19 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 15.5v-7Z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
              <path d="M8.4 9.1a5.2 5.2 0 0 0 0 5.8M15.6 9.1a5.2 5.2 0 0 1 0 5.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="sticker-name">On Air</span>
          </button>
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m12 4 2.1 4.4 4.9.7-3.6 3.4.9 4.9-4.3-2.3-4.3 2.3.9-4.9L5 9.1l4.9-.7L12 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span class="sticker-name">Encore</span>
          </button>
        </div>
      </section>

      <button class="apply-button" type="button">Apply style</button>
    </section>
  </div>
</body>
</html>
