<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval timer — Northline Run Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ebeceb;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #e6efe9;
  }
  .screen {
    width: 184px;
    height: 224px;
    box-sizing: border-box;
    background: #0d1512;
    border-radius: 26px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 22px rgba(10, 20, 16, 0.35);
  }
  .banner {
    position: relative;
    flex: none;
  }
  .banner img {
    display: block;
    width: 100%;
    height: 52px;
    object-fit: cover;
    opacity: 0.5;
    background: #17211c;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,21,18,0.25) 0%, rgba(13,21,18,0.92) 100%);
  }
  .banner-text {
    position: absolute;
    left: 12px;
    right: 10px;
    bottom: 5px;
  }
  .eyebrow {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #4fd6a0;
    margin: 0 0 1px;
  }
  .session {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1.15;
    margin: 0;
    color: #e6efe9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .body {
    padding: 8px 12px 9px;
  }
  .label {
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7f938b;
    margin: 0 0 2px;
  }
  .clock {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0;
    color: #f2fbf6;
  }
  .track {
    height: 4px;
    background: #26332d;
    border-radius: 2px;
    margin: 7px 0 5px;
    overflow: hidden;
  }
  .fill {
    height: 4px;
    width: 30%;
    background: #4fd6a0;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: #8fa39a;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .btn {
    box-sizing: border-box;
    font-family: inherit;
    text-align: center;
    border-radius: 999px;
  }
  .btn.primary {
    flex: 2 1 0;
    padding: 9px 4px;
    font-size: 13px;
    font-weight: 600;
    background: #4fd6a0;
    color: #08211a;
    border: none;
  }
  .btn.minor {
    flex: 1 1 0;
    padding: 6px 3px;
    font-size: 9.5px;
    font-weight: 600;
    color: #4fd6a0;
    background: transparent;
    border: 1px solid #2f4a3f;
  }
  .next {
    margin: 8px 0 0;
    padding-top: 7px;
    border-top: 1px solid #22302a;
    font-size: 9px;
    line-height: 1.35;
    color: #8fa39a;
  }
  .next strong {
    font-weight: 600;
    color: #dbe8e1;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <img src="https://loremflickr.com/184/52/running?lock=12263" width="184" height="52" alt="Runner on a park path during a tempo interval">
      <div class="scrim"></div>
      <div class="banner-text">
        <p class="eyebrow">Interval 3 of 5</p>
        <h1 class="session">Tempo Ladder — Wk 6</h1>
      </div>
    </div>
    <div class="body">
      <p class="label">Remaining</p>
      <p class="clock">4:12</p>
      <div class="track"><div class="fill"></div></div>
      <div class="meta">
        <span>1:48 elapsed</span>
        <span>6:00 rep</span>
      </div>
      <div class="controls">
        <div class="btn primary">Pause</div>
        <div class="btn minor">Skip</div>
      </div>
      <p class="next">Next: <strong>Recovery walk 2:00</strong></p>
    </div>
  </div>
</body>
</html>
