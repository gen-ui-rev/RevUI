<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #d4d4d8;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    background: #e4e4e7;
  }
  .sheet {
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(24, 24, 27, 0.14);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 19px 20px 17px;
    border-bottom: 1px solid #e4e4e7;
  }
  .episode-number {
    flex: 0 0 58px;
    color: #18181b;
    text-align: center;
  }
  .episode-number strong {
    display: block;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
  }
  .episode-number span {
    display: block;
    margin-top: 5px;
    color: #a1a1aa;
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1.2px;
  }
  .head-text {
    min-width: 0;
    padding-left: 16px;
    border-left: 1px solid #d4d4d8;
  }
  .title {
    color: #18181b;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
  }
  .meta {
    margin-top: 5px;
    color: #71717a;
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .actions {
    padding: 4px 0 8px;
  }
  .group-label {
    padding: 11px 20px 7px;
    color: #a1a1aa;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 1.3px;
    text-transform: uppercase;
  }
  .action {
    padding: 12px 20px;
    color: #18181b;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.3;
  }
  .action .sub {
    display: block;
    margin-top: 3px;
    color: #71717a;
    font-size: 13px;
    line-height: 1.3;
  }
  .group-divider {
    margin: 4px 20px 0;
    border-top: 1px solid #e4e4e7;
  }
  .cancel {
    margin-top: auto;
    padding: 15px 20px;
    background: #27272a;
    box-shadow: 0 4px 14px rgba(24, 24, 27, 0.18);
    color: #ffffff;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="head">
        <div class="episode-number">
          <strong>142</strong>
          <span>EPISODE</span>
        </div>
        <div class="head-text">
          <div class="title">The Quiet Part of the Grid</div>
          <div class="meta">Field Notes &middot; 48 min</div>
        </div>
      </div>

      <div class="actions">
        <div class="group">
          <div class="group-label">Playback</div>
          <div class="action">Play next</div>
          <div class="action">Add to playlist</div>
        </div>

        <div class="group-divider"></div>

        <div class="group">
          <div class="group-label">Save</div>
          <div class="action">
            Download episode
            <span class="sub">62 MB over Wi-Fi</span>
          </div>
          <div class="action">Share episode</div>
        </div>
      </div>
    </div>

    <div class="cancel">Cancel</div>
  </div>
</body>
</html>
