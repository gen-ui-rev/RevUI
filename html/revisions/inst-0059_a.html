<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread reaction</title>
<style>
  :root{
    --accent:#8B5CF6;
    --ink:#F5F3FA;
    --muted:#9A93AC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#DCDAE2;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:184px;
    height:224px;
    background:#14121A;
    border-radius:34px;
    padding:14px;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:8px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--accent);
    line-height:1;
    margin:0 0 4px;
  }
  .post{
    font-size:11px;
    line-height:1.35;
    font-weight:500;
    margin:0 0 2px;
  }
  .byline{
    font-size:8.5px;
    line-height:1.2;
    color:var(--muted);
    margin:0 0 10px;
  }
  .hero{
    display:flex;
    align-items:baseline;
    gap:5px;
    margin:0 0 10px;
  }
  .num{
    font-size:30px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
  }
  .unit{
    font-size:8.5px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
  }
  .group{margin-bottom:8px;}
  .group:last-child{margin-bottom:0;}
  .glabel{
    font-size:7.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-weight:700;
    color:var(--muted);
    line-height:1;
    margin:0 0 4px;
  }
  .grow{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .vote{
    width:26px;
    height:26px;
    border-radius:9px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .vote svg{display:block;}
  .gtext{
    font-size:9.5px;
    line-height:1.25;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gtext span{color:var(--muted);}
  .faces{display:flex;flex:0 0 auto;}
  .face{
    width:20px;
    height:20px;
    border-radius:50%;
    background:#241F30;
    border:1px solid #332C44;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:-6px;
  }
  .face:last-child{margin-right:0;}
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Design Systems</p>
    <p class="post">Spacing tokens now match the 4px grid.</p>
    <p class="byline">Marisol Vance · 4h</p>

    <div class="hero">
      <span class="num">1,284</span>
      <span class="unit">upvotes</span>
    </div>

    <div class="group">
      <p class="glabel">My vote</p>
      <div class="grow">
        <span class="vote" aria-label="Upvoted">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
        </span>
        <span class="gtext">Upvoted <span>· public</span></span>
      </div>
    </div>

    <div class="group">
      <p class="glabel">Everyone else</p>
      <div class="grow">
        <span class="faces">
          <span class="face">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9A93AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
            </svg>
          </span>
          <span class="face">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9A93AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
            </svg>
          </span>
          <span class="face">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9A93AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
            </svg>
          </span>
        </span>
        <span class="gtext">1,283 others</span>
      </div>
    </div>
  </div>
</body>
</html>
