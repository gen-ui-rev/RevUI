<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delivery Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8E6284;
    --ink:#211D24;
    --muted:#746E78;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#D4D1D6;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    display:flex;
    flex-direction:column;
    background:#F5F3F5;
    color:var(--ink);
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 10px;
  }
  .back{
    width:28px;
    height:28px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#FFFFFF;
    color:var(--ink);
    box-shadow:0 1px 3px rgba(33,29,36,.10);
  }
  .title{
    min-width:0;
  }
  .title h1{
    margin:0;
    font-size:12px;
    line-height:15px;
    font-weight:700;
    letter-spacing:-.1px;
  }
  .title p{
    margin:1px 0 0;
    font-size:8px;
    line-height:10px;
    color:var(--muted);
  }
  .status{
    width:100%;
    background:var(--accent);
    color:#FFFFFF;
    padding:11px 12px 10px;
    box-shadow:0 -1px 3px rgba(33,29,36,.08);
  }
  .state{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    line-height:14px;
    font-weight:700;
  }
  .status h2{
    margin:4px 0 0;
    font-size:15px;
    line-height:19px;
    letter-spacing:-.25px;
  }
  .tracking{
    margin-top:3px;
    font-size:8px;
    line-height:11px;
    color:rgba(255,255,255,.76);
  }
  .steps{
    margin-top:12px;
  }
  .rail{
    position:relative;
    height:9px;
  }
  .base,
  .done{
    position:absolute;
    left:4px;
    top:3px;
    height:2px;
  }
  .base{
    right:4px;
    background:rgba(255,255,255,.32);
  }
  .done{
    width:66%;
    background:#FFFFFF;
  }
  .dots{
    position:relative;
    display:flex;
    justify-content:space-between;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#FFFFFF;
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
  }
  .dot.pending{
    background:var(--accent);
    border:2px solid rgba(255,255,255,.62);
  }
  .labels{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    margin-top:5px;
    font-size:7px;
    line-height:9px;
    color:rgba(255,255,255,.62);
  }
  .labels span{
    text-align:center;
    white-space:nowrap;
  }
  .labels span:first-child{text-align:left;}
  .labels span:last-child{text-align:right;}
  .labels .active{
    color:#FFFFFF;
    font-weight:700;
  }
  .update{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:9px;
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,.18);
    font-size:8px;
    line-height:11px;
    color:rgba(255,255,255,.82);
  }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <div class="back" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
    </div>
    <div class="title">
      <h1>Order Detail</h1>
      <p>#VL-48210 · Mar 12</p>
    </div>
  </div>

  <section class="status" aria-label="Delivery status">
    <div class="state">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h10v9H3z"/><path d="M13 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      In transit
    </div>
    <h2>Arriving today by 6:00 PM</h2>
    <div class="tracking">Tracking 9241 8830 4471<br>Northline Courier</div>

    <div class="steps">
      <div class="rail">
        <div class="base"></div>
        <div class="done"></div>
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot pending"></div>
        </div>
      </div>
      <div class="labels">
        <span class="active">Ordered</span>
        <span class="active">Packed</span>
        <span class="active">Transit</span>
        <span>Delivered</span>
      </div>
    </div>

    <div class="update">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Updated 2:18 PM
    </div>
  </section>
</div>
</body>
</html>
