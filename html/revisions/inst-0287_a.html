<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circleside — Community created</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:40px 0;margin:0;background:#d4d4d8;
    font-family:'Manrope',system-ui,sans-serif;
  }
  .screen{
    width:390px;height:844px;background:#ffffff;position:relative;
    display:flex;flex-direction:column;color:#18181b;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 8px 20px;
  }
  .topbar .label{font-size:14px;font-weight:700;letter-spacing:.01em;color:#3f3f46;}
  .icon-btn{width:24px;height:24px;display:block;color:#71717a;}
  .spacer24{width:24px;height:24px;}

  .content{padding:0 24px;display:flex;flex-direction:column;flex:1;}

  .hero{position:relative;padding:52px 0 0 0;display:flex;justify-content:center;}
  .mark{
    width:92px;height:92px;border-radius:46px;background:rgba(16,185,129,.14);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 12px rgba(16,185,129,.06);
  }
  .mark svg{width:44px;height:44px;color:#059669;}
  .confetti span{position:absolute;display:block;border-radius:1px;}
  .c1{left:56px;top:60px;width:4px;height:14px;background:#10b981;transform:rotate(22deg);}
  .c2{left:96px;top:112px;width:4px;height:10px;background:#f59e0b;transform:rotate(-38deg);}
  .c3{left:38px;top:126px;width:10px;height:4px;background:#0ea5e9;}
  .c4{right:60px;top:52px;width:4px;height:16px;background:#f43f5e;transform:rotate(-20deg);}
  .c5{right:34px;top:118px;width:4px;height:11px;background:#8b5cf6;transform:rotate(40deg);}
  .c6{right:98px;top:104px;width:9px;height:4px;background:#10b981;}

  h1{
    margin:34px 0 0 0;font-size:27px;line-height:1.2;font-weight:700;
    text-align:center;letter-spacing:-.02em;
  }
  .sub{
    margin:12px 0 0 0;font-size:15px;line-height:1.5;color:#71717a;
    text-align:center;font-weight:400;
  }

  .link-row{
    margin-top:36px;background:rgba(82,82,91,.07);border-radius:4px;padding:14px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .link-row .cap{font-size:12px;color:#71717a;letter-spacing:.02em;}
  .link-row .val{
    font-size:15px;font-weight:700;margin-top:4px;color:#27272a;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .link-text{min-width:0;flex:1;}
  .copy{width:20px;height:20px;color:#52525b;flex:none;}

  .block{
    margin-top:10px;background:rgba(82,82,91,.07);border-radius:4px;padding:16px;
    display:flex;flex-direction:column;
  }
  .block .head{display:flex;align-items:center;gap:14px;}
  .glyph{
    width:44px;height:44px;border-radius:4px;background:rgba(82,82,91,.12);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .glyph svg{width:24px;height:24px;color:#3f3f46;}
  .block .name{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .block .meta{font-size:13px;color:#71717a;margin-top:3px;}

  .owner{
    display:flex;align-items:center;gap:12px;
    margin-top:14px;padding-top:14px;border-top:1px solid rgba(82,82,91,.16);
  }
  .owner img{border-radius:20px;display:block;flex:none;}
  .owner .who{font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .owner .role{font-size:12px;color:#71717a;margin-top:2px;}

  .actions{margin-top:auto;padding-bottom:22px;}
  .primary{
    display:block;width:100%;box-sizing:border-box;background:#27272a;color:#fafafa;
    border-radius:4px;padding:16px 0;text-align:center;font-size:16px;font-weight:700;
    text-decoration:none;
  }
  .ghost{
    display:block;width:100%;box-sizing:border-box;margin-top:8px;color:#52525b;
    border-radius:4px;padding:14px 0;text-align:center;font-size:15px;font-weight:700;
    text-decoration:none;
  }

  .tabbar{
    display:flex;border-top:1px solid #f4f4f5;padding:10px 8px 16px 8px;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#a1a1aa;}
  .tab svg{width:23px;height:23px;}
  .tab span{font-size:12px;font-weight:400;}
  .tab.on{color:#27272a;}
  .tab.on span{font-weight:700;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <svg class="icon-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
    <div class="label">New community</div>
    <div class="spacer24"></div>
  </div>

  <div class="content">

    <div class="hero">
      <div class="confetti">
        <span class="c1"></span><span class="c2"></span><span class="c3"></span>
        <span class="c4"></span><span class="c5"></span><span class="c6"></span>
      </div>
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.8l4.7 4.7L19.5 7.2"/>
        </svg>
      </div>
    </div>

    <h1>Foldover is live</h1>
    <p class="sub">Invitations went out to 14 people. You can post as soon as the first member joins.</p>

    <div class="link-row">
      <div class="link-text">
        <div class="cap">Invite link</div>
        <div class="val">circleside.app/foldover</div>
      </div>
      <svg class="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="1.5"/>
        <path d="M15 5.5H5.5A1.5 1.5 0 004 7v9"/>
      </svg>
    </div>

    <div class="block">
      <div class="head">
        <div class="glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7.5 4.3v8.6L12 20.6 4.5 15.9V7.3z"/>
            <circle cx="12" cy="11.8" r="2.6"/>
          </svg>
        </div>
        <div>
          <div class="name">Foldover</div>
          <div class="meta">Private community · 14 invited</div>
        </div>
      </div>
      <div class="owner">
        <img src="https://loremflickr.com/40/40/portrait" width="40" height="40" alt="Maya Ellison">
        <div>
          <div class="who">Maya Ellison</div>
          <div class="role">Owner · Full admin rights</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <a class="primary" href="#">Open Foldover</a>
      <a class="ghost" href="#">Invite more people</a>
    </div>

  </div>

  <div class="tabbar">
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10.5L12 4l8 6.5V20H4z"/>
      </svg>
      <span>Home</span>
    </div>
    <div class="tab on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="9.5" r="3.2"/>
        <circle cx="16.5" cy="11" r="2.4"/>
        <path d="M3.5 19c.6-2.6 2.8-4 5.5-4s4.9 1.4 5.5 4"/>
        <path d="M16 15.4c2 .2 3.6 1.4 4.1 3.6"/>
      </svg>
      <span>Circles</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16v11H12l-4 3.2V17H4z"/>
      </svg>
      <span>Messages</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.6"/>
        <path d="M5 20c.8-3.5 3.5-5.2 7-5.2s6.2 1.7 7 5.2"/>
      </svg>
      <span>You</span>
    </div>
  </div>

</div>
</body>
</html>
