<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a New Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf1;
      color: #17212b;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    h1 {
      margin: 0;
      color: #1769d2;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.3px;
    }

    .intro {
      margin: 4px 0 0;
      color: #64717e;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .cover {
      position: relative;
      width: 342px;
      margin-top: 16px;
    }

    .cover img {
      width: 342px;
      height: 72px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #cbd5df;
    }

    .cover-action {
      position: absolute;
      right: 8px;
      bottom: 8px;
      border: 1px solid #d3dbe3;
      border-radius: 4px;
      padding: 6px 9px;
      background: #ffffff;
      color: #263442;
      font: 500 11px/15px 'Roboto', system-ui, sans-serif;
      cursor: pointer;
    }

    form {
      margin-top: 14px;
    }

    .group + .group {
      margin-top: 12px;
    }

    .group-title {
      margin: 0 0 6px;
      color: #7a8794;
      font: 700 11px/14px 'Roboto', system-ui, sans-serif;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .card {
      border: 1px solid #dce2e8;
      border-radius: 6px;
      background: #fafbfc;
    }

    .field {
      width: 100%;
      margin: 0;
      padding: 5px 12px;
      display: block;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font-family: inherit;
    }

    .field + .field {
      border-top: 1px solid #e4eaf0;
    }

    button.field {
      cursor: pointer;
    }

    .field-label {
      display: block;
      margin-bottom: 2px;
      color: #6b7783;
      font-size: 11px;
      font-weight: 400;
      line-height: 14px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .field-value,
    .trip-input {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #17212b;
      font: 400 15px/20px 'Roboto', system-ui, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trip-input {
      width: 100%;
    }

    .trip-input::placeholder {
      color: #87929d;
      opacity: 1;
    }

    .chevron {
      flex: none;
      color: #9aa5b1;
      font: 400 16px/20px 'Roboto', system-ui, sans-serif;
    }

    .create-button {
      width: 100%;
      margin-top: 16px;
      padding: 13px 18px;
      border: 0;
      border-radius: 4px;
      background: #1769d2;
      color: #ffffff;
      font: 500 15px/20px 'Roboto', system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="create-title">
      <header>
        <h1 id="create-title">Create a new trip</h1>
        <p class="intro">Add the basics for a new Northpath itinerary.</p>
      </header>

      <div class="cover">
        <img src="https://loremflickr.com/342/72/beach?lock=7790" width="342" height="72" alt="Rocky coastline selected as the trip cover">
        <button class="cover-action" type="button">Select cover</button>
      </div>

      <form>
        <section class="group" aria-labelledby="group-trip">
          <h2 class="group-title" id="group-trip">Trip details</h2>
          <div class="card">
            <label class="field">
              <span class="field-label">Trip name</span>
              <span class="field-row">
                <input class="trip-input" type="text" value="Maine coast weekend" aria-label="Trip name">
              </span>
            </label>

            <button class="field" type="button">
              <span class="field-label">Destination</span>
              <span class="field-row">
                <span class="field-value">Bar Harbor, Maine</span>
                <span class="chevron" aria-hidden="true">›</span>
              </span>
            </button>

            <button class="field" type="button">
              <span class="field-label">Dates</span>
              <span class="field-row">
                <span class="field-value">May 14–19, 2026</span>
                <span class="chevron" aria-hidden="true">›</span>
              </span>
            </button>
          </div>
        </section>

        <section class="group" aria-labelledby="group-people">
          <h2 class="group-title" id="group-people">Who's going</h2>
          <div class="card">
            <button class="field" type="button">
              <span class="field-label">Travelers</span>
              <span class="field-row">
                <span class="field-value">2 adults</span>
                <span class="chevron" aria-hidden="true">›</span>
              </span>
            </button>

            <button class="field" type="button">
              <span class="field-label">Planning access</span>
              <span class="field-row">
                <span class="field-value">Only me</span>
                <span class="chevron" aria-hidden="true">›</span>
              </span>
            </button>
          </div>
        </section>

        <button class="create-button" type="submit">Create trip</button>
      </form>
    </main>
  </div>
</body>
</html>
