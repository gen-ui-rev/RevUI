<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlowe &amp; Field Kitchen — Following</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#059669;
    --ink:#12161c;
    --muted:#6b7280;
    --line:#e8eaed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 0;
    background:#eceef0;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:1024px;
    height:768px;
    padding:28px 0;
    background:#eceef0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .card{
    width:880px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 14px 38px rgba(17,24,39,.12);
    overflow:hidden;
  }
  .hero{
    display:block;
    width:100%;
    height:180px;
    object-fit:cover;
    background:#dcdfe3;
  }
  .body{padding:0 36px 32px;}
  .mono{
    width:84px;height:84px;
    margin-top:-46px;
    border-radius:18px;
    border:4px solid #fff;
    background:var(--emerald);
    color:#fff;
    font-size:26px;
    font-weight:700;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .head{
    margin-top:12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
  }
  h1{
    margin:0;
    font-size:24px;
    line-height:32px;
    font-weight:700;
    color:var(--ink);
  }
  .meta{
    margin:3px 0 0;
    font-size:14px;
    line-height:20px;
    color:var(--muted);
  }
  .controls{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    line-height:18px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .switch{
    width:44px;height:26px;
    border-radius:13px;
    background:var(--emerald);
    position:relative;
  }
  .switch span{
    position:absolute;
    top:3px;left:21px;
    width:20px;height:20px;
    border-radius:10px;
    background:#fff;
  }
  .btn{
    height:44px;
    width:172px;
    border:0;
    border-radius:12px;
    background:var(--emerald);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .btn svg{display:block;}
  .stats{
    margin-top:22px;
    padding:20px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    display:flex;
    gap:56px;
  }
  .stats .k{
    font-size:11.5px;
    line-height:16px;
    font-weight:600;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .stats .v{
    margin-top:2px;
    font-size:16px;
    line-height:22px;
    font-weight:700;
    color:var(--ink);
  }
  .section{margin-top:24px;}
  .section .bar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .section h2{
    margin:0;
    font-size:12px;
    line-height:16px;
    font-weight:600;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .section .note{
    font-size:12.5px;
    line-height:16px;
    color:var(--muted);
  }
  .thumbs{
    margin-top:14px;
    display:flex;
    gap:20px;
  }
  .dish{
    margin:0;
    width:256px;
    cursor:pointer;
  }
  .shot{position:relative;}
  .dish img{
    display:block;
    width:256px;
    height:160px;
    object-fit:cover;
    background:#dcdfe3;
    border-radius:12px;
  }
  .tag{
    position:absolute;
    right:10px;
    bottom:10px;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(18,22,28,.86);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
  }
  .dish figcaption{margin-top:9px;}
  .dish .name{
    display:block;
    font-size:14.5px;
    line-height:20px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dish .sub{
    display:block;
    margin-top:2px;
    font-size:12.5px;
    line-height:17px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/880/180/furniture?lock=3400" width="880" height="180" alt="Walnut communal table set for the evening dinner service">
      <div class="body">
        <div class="mono">MF</div>

        <div class="head">
          <div>
            <h1>Marlowe &amp; Field Kitchen</h1>
            <p class="meta">Farm kitchen · Ridgewood · Twelve seats, one seasonal menu</p>
          </div>
          <div class="controls">
            <label class="toggle">
              <span class="switch" role="img" aria-label="Menu alerts on"><span></span></span>
              Menu alerts
            </label>
            <button class="btn" type="button">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 8.6l3.1 3.1L13 4.9" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Following
            </button>
          </div>
        </div>

        <div class="stats">
          <div>
            <div class="k">Followers</div>
            <div class="v">12,480</div>
          </div>
          <div>
            <div class="k">Diner rating</div>
            <div class="v">4.8 / 5</div>
          </div>
          <div>
            <div class="k">Menu posted</div>
            <div class="v">April 3</div>
          </div>
          <div>
            <div class="k">Tonight</div>
            <div class="v">Tasting, 7 courses</div>
          </div>
        </div>

        <div class="section">
          <div class="bar">
            <h2>Dishes this week</h2>
            <span class="note">Board changes every Friday morning</span>
          </div>
          <div class="thumbs">
            <figure class="dish">
              <div class="shot">
                <img src="https://loremflickr.com/256/160/furniture?lock=3401" width="256" height="160" alt="Charred farro bowl with roasted carrots">
                <span class="tag">$16</span>
              </div>
              <figcaption>
                <span class="name">Charred Farro Bowl</span>
                <span class="sub">Market carrots, dill, aged sheep cheese</span>
              </figcaption>
            </figure>
            <figure class="dish">
              <div class="shot">
                <img src="https://loremflickr.com/256/160/product?lock=3402" width="256" height="160" alt="Squash toast with whipped ricotta on stoneware">
                <span class="tag">$14</span>
              </div>
              <figcaption>
                <span class="name">Squash Toast</span>
                <span class="sub">Whipped ricotta, sage, hazelnut</span>
              </figcaption>
            </figure>
            <figure class="dish">
              <div class="shot">
                <img src="https://loremflickr.com/256/160/product?lock=3403" width="256" height="160" alt="Brown butter apple tart with cream">
                <span class="tag">$9</span>
              </div>
              <figcaption>
                <span class="name">Brown Butter Apple Tart</span>
                <span class="sub">Orchard apples, cider cream</span>
              </figcaption>
            </figure>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
