<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in to Lingoak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7e2;
      color: #20221d;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfbf8;
      border: 1px solid #d4d5cd;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 20px;
      border-bottom: 1px solid #d9dad2;
      background: #fbfbf8;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #343a22;
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
    }

    .service-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #68723d;
    }

    .help-link {
      color: #55594c;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    main {
      width: 100%;
      padding: 30px 28px 0;
    }

    .intro {
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 10px;
      color: #25291d;
      font-size: 28px;
      font-weight: 700;
      line-height: 35px;
      letter-spacing: -0.3px;
    }

    .intro p {
      margin: 0;
      color: #62655c;
      font-size: 15px;
      line-height: 22px;
    }

    .path-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .path-tab {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 11px 12px;
      text-align: left;
      background: #ffffff;
      border: 1px solid #c6c8bc;
      border-radius: 8px;
      cursor: pointer;
    }

    .path-tab.is-active {
      background: #eef1e2;
      border-color: #68723d;
      box-shadow: inset 0 0 0 1px #68723d;
    }

    .tab-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      flex: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid #a9ac9d;
    }

    .is-active .dot {
      background: #68723d;
      border-color: #68723d;
      box-shadow: inset 0 0 0 3px #eef1e2;
    }

    .tab-title {
      overflow: hidden;
      color: #4a4e40;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .is-active .tab-title {
      color: #3b4324;
    }

    .tab-sub {
      color: #7b7e73;
      font-size: 11px;
      line-height: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #34372f;
      font-size: 14px;
      font-weight: 500;
      line-height: 18px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 13px;
      color: #20221d;
      font-size: 16px;
      line-height: 20px;
      background: #ffffff;
      border: 1px solid #bfc1b6;
      border-radius: 6px;
      outline: none;
    }

    input::placeholder {
      color: #898c82;
      opacity: 1;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1px 0 24px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: #55594f;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .remember input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: #68723d;
    }

    .forgot {
      color: #596333;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .primary-button,
    .signup-button {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
    }

    .primary-button {
      padding: 15px 18px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 20px;
      background: #68723d;
      border: 1px solid #68723d;
    }

    .path-hint {
      display: flex;
      gap: 11px;
      margin-top: 20px;
      padding: 13px 14px;
      background: #f2f3ec;
      border: 1px solid #dcded5;
      border-radius: 8px;
    }

    .path-hint svg {
      flex: none;
      margin-top: 2px;
    }

    .path-hint h2 {
      margin: 0 0 3px;
      color: #343a22;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    .path-hint p {
      margin: 0;
      color: #6a6d63;
      font-size: 12.5px;
      line-height: 18px;
    }

    .signup-area {
      margin-top: auto;
      padding: 22px 28px 26px;
      border-top: 1px solid #d9dad2;
      background: #f6f6f1;
    }

    .signup-copy {
      margin: 0 0 13px;
      color: #4e5149;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
    }

    .signup-copy strong {
      color: #292c25;
      font-weight: 500;
    }

    .signup-button {
      padding: 13px 18px;
      color: #596333;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      background: transparent;
      border: 1px solid #68723d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="service" aria-label="Lingoak">
        <span class="service-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 3.25C4.7 3.25 6.15 3.72 7.25 4.57V12.55C6.18 11.8 4.75 11.4 3 11.4V3.25Z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M13 3.25C11.3 3.25 9.85 3.72 8.75 4.57V12.55C9.82 11.8 11.25 11.4 13 11.4V3.25Z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Lingoak</span>
      </div>
      <a class="help-link" href="#">Help</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="login-title">
        <h1 id="login-title">Log in to Lingoak</h1>
        <p>Choose how you sign in, then enter your details.</p>
      </section>

      <div class="path-tabs" role="tablist" aria-label="Login type">
        <button class="path-tab is-active" type="button" role="tab" aria-selected="true">
          <span class="tab-head">
            <span class="dot" aria-hidden="true"></span>
            <span class="tab-title">Personal account</span>
          </span>
          <span class="tab-sub">Email &amp; password</span>
        </button>
        <button class="path-tab" type="button" role="tab" aria-selected="false">
          <span class="tab-head">
            <span class="dot" aria-hidden="true"></span>
            <span class="tab-title">School account</span>
          </span>
          <span class="tab-sub">District sign-in</span>
        </button>
      </div>

      <form>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password">
        </div>

        <div class="form-options">
          <label class="remember" for="remember">
            <input id="remember" type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button class="primary-button" type="submit">Log in to personal account</button>
      </form>

      <section class="path-hint">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 7.25L9 3L15.5 7.25L9 11.5L2.5 7.25Z" stroke="#596333" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M5 9V12.7C6.05 13.55 7.4 14 9 14C10.6 14 11.95 13.55 13 12.7V9" stroke="#596333" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <div>
          <h2>Does your school manage your access?</h2>
          <p>Pick the School account tab and continue through your district's sign-in page.</p>
        </div>
      </section>
    </main>

    <footer class="signup-area">
      <p class="signup-copy"><strong>New to Lingoak?</strong> Personal accounts are free to set up.</p>
      <button class="signup-button" type="button">Create a personal account</button>
    </footer>
  </div>
</body>
</html>
