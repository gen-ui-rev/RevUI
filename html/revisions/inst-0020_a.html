<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketwell — Delivery Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#1f5fff;
    --ink:#14161a;
    --muted:#6b7280;
    --rule:#e6e7ea;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#cfd1d5;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:44px 24px;
    background:#d8d9dd;
  }
  .banner{
    width:342px;
    margin:0 auto;
    padding:16px;
    border-radius:14px;
    background:#fff;
  }
  .head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .brand svg{display:block;flex:none;}
  .brand span{
    color:var(--muted);
    font-size:12px;
    font-weight:500;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stamp{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
  }
  .main{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .main img{
    display:block;
    width:56px;
    height:56px;
    border-radius:14px;
    object-fit:cover;
    background:#c9ccd2;
    flex:none;
  }
  .status{min-width:0;flex:1;}
  .status h1{
    margin:0;
    color:var(--accent);
    font-size:20px;
    font-weight:600;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status p{
    margin:2px 0 0;
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .eta{
    text-align:right;
    flex:none;
  }
  .eta strong{
    display:block;
    color:var(--ink);
    font-size:16px;
    font-weight:600;
    line-height:1.3;
  }
  .eta span{
    display:block;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.04em;
  }
  .progress-panel{
    margin-top:18px;
    padding:13px 12px 11px;
    border-radius:12px;
    background:#f6f8ff;
  }
  .progress-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
    font-size:12px;
  }
  .progress-title strong{
    color:var(--ink);
    font-weight:500;
  }
  .progress-title span{
    color:var(--muted);
    white-space:nowrap;
  }
  .stops{
    position:relative;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    align-items:center;
  }
  .stops::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:6px;
    height:3px;
    border-radius:2px;
    background:linear-gradient(to right, var(--accent) 0 68%, #dfe3ec 68% 100%);
  }
  .stop{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .stop i{
    position:relative;
    z-index:1;
    display:block;
    width:12px;
    height:12px;
    border:2px solid var(--accent);
    border-radius:50%;
    background:var(--accent);
  }
  .stop.done i::after{
    content:"";
    position:absolute;
    left:3px;
    top:1px;
    width:3px;
    height:5px;
    border-right:1.5px solid #fff;
    border-bottom:1.5px solid #fff;
    transform:rotate(45deg);
  }
  .stop.current i{
    width:16px;
    height:16px;
    margin-top:-2px;
    border:4px solid #cddaff;
    background:var(--accent);
    box-shadow:0 0 0 2px #fff;
  }
  .stop.upcoming i{
    border-color:#cbd0da;
    background:#fff;
  }
  .stop-labels{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    color:var(--muted);
    font-size:11px;
  }
  .stop-labels strong{
    color:var(--accent);
    font-weight:500;
  }
  .courier{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .mono{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#eaf0ff;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    flex:none;
  }
  .who{min-width:0;flex:1;}
  .who strong{
    display:block;
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .who span{
    display:block;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .drop{
    color:var(--muted);
    font-size:12px;
    text-align:right;
    white-space:nowrap;
    flex:none;
  }
  .drop b{
    display:block;
    color:var(--ink);
    font-size:13px;
    font-weight:500;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 3h1.9l1.7 7.2h6.1l1.3-5.1H5.2" stroke="#1f5fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6.9" cy="13" r="1.15" fill="#1f5fff"/>
            <circle cx="11.9" cy="13" r="1.15" fill="#1f5fff"/>
          </svg>
          <span>Marketwell Delivery</span>
        </div>
        <div class="stamp">Updated 3:12 PM</div>
      </div>

      <div class="main">
        <img src="https://loremflickr.com/56/56/sneakers?lock=1321" width="56" height="56" alt="Ridgeline trail running shoes in the arriving order">
        <div class="status">
          <h1>Out for delivery</h1>
          <p>Order #48211 &middot; 2 items</p>
        </div>
        <div class="eta">
          <strong>4:40 PM</strong>
          <span>Arrival</span>
        </div>
      </div>

      <div class="progress-panel" aria-label="Delivery route progress: stop 4 of 6">
        <div class="progress-title">
          <strong>Route progress</strong>
          <span>1.2 mi remaining</span>
        </div>
        <div class="stops">
          <div class="stop done"><i></i></div>
          <div class="stop done"><i></i></div>
          <div class="stop done"><i></i></div>
          <div class="stop current"><i></i></div>
          <div class="stop upcoming"><i></i></div>
          <div class="stop upcoming"><i></i></div>
        </div>
        <div class="stop-labels">
          <span>Departed</span>
          <strong>Stop 4 of 6</strong>
          <span>Your door</span>
        </div>
      </div>

      <div class="courier">
        <div class="mono">DW</div>
        <div class="who">
          <strong>Dana Whitfield</strong>
          <span>Van 12 &middot; Leaves package at door</span>
        </div>
        <div class="drop">
          <b>418 Larkspur Ave</b>
          Apt 3R
        </div>
      </div>
    </div>
  </div>
</body>
</html>
