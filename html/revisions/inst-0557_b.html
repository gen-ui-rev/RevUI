<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Practice Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dedfdb;
      color: #24261f;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .screen {
      width: 1024px;
      height: 768px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: #f1f2ef;
    }

    .goal-card {
      width: 820px;
      padding: 54px 58px 50px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(37, 41, 30, 0.1);
    }

    .goal-heading {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 22px;
      align-items: center;
      padding-bottom: 32px;
      border-bottom: 1px solid #e8e9e4;
    }

    .goal-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 19px;
      background: #eef0e7;
      color: #69754b;
    }

    .goal-icon svg {
      width: 31px;
      height: 31px;
    }

    .heading-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #69754b;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.24;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 11px 0 0;
      color: #686b62;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
    }

    .goal-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 24px;
      align-items: end;
      padding-top: 32px;
    }

    .duration-area {
      min-width: 0;
    }

    .editor-label {
      margin: 0 0 11px;
      color: #5f6259;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .stepper {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 18px;
      padding: 15px;
      border: 1px solid #dfe2d8;
      border-radius: 17px;
      background: #f5f6f2;
    }

    .step-button {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #d5d9cd;
      border-radius: 13px;
      background: #ffffff;
      color: #4f5937;
      box-shadow: 0 2px 7px rgba(37, 41, 30, 0.06);
    }

    .step-button svg {
      width: 21px;
      height: 21px;
    }

    .value {
      min-width: 0;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      color: #252820;
      text-align: center;
    }

    .value-number {
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .value-unit {
      color: #69754b;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .action-area {
      min-width: 0;
    }

    .save-button {
      width: 100%;
      padding: 18px 20px;
      border: 0;
      border-radius: 14px;
      background: #69754b;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }

    .helper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 0;
      color: #73766d;
      font-size: 12px;
      line-height: 1.5;
    }

    .helper-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #eef0e7;
      color: #69754b;
      font-size: 12px;
      font-weight: 700;
    }

    .step-button:focus-visible,
    .save-button:focus-visible {
      outline: 3px solid rgba(105, 117, 75, 0.3);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <div class="goal-heading">
        <div class="goal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 7.5V12L15.2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 2.8H15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="heading-copy">
          <p class="eyebrow">Daily goal</p>
          <h1 id="goal-title">Set your practice time</h1>
          <p class="description">Choose how many minutes you want to spend on language lessons each day.</p>
        </div>
      </div>

      <div class="goal-editor">
        <div class="duration-area">
          <p class="editor-label">Daily practice duration</p>

          <div class="stepper" role="group" aria-label="Daily practice duration">
            <button class="step-button" type="button" aria-label="Decrease practice time">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>

            <div class="value" aria-live="polite">
              <span class="value-number">20</span>
              <span class="value-unit">Minutes</span>
            </div>

            <button class="step-button" type="button" aria-label="Increase practice time">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 6V18M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="action-area">
          <button class="save-button" type="button">Set daily goal</button>
        </div>
      </div>

      <p class="helper">
        <span class="helper-icon" aria-hidden="true">✓</span>
        Recommended for steady weekly progress
      </p>
    </section>
  </div>
</body>
</html>
