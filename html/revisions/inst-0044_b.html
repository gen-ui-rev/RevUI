<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfare Atlas — Tutor Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{
    box-sizing:border-box;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#e8e7e2;
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:28px 32px;
    background:#eceae5;
  }
  .card{
    width:100%;
    background:#ffffff;
    border-radius:14px;
    box-shadow:0 1px 0 rgba(20,30,33,0.05);
  }
  .hero-wrap{
    position:relative;
  }
  .hero{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    background:#cfd6d8;
    border-radius:14px 14px 0 0;
  }
  .mono{
    position:absolute;
    left:20px;
    bottom:-27px;
    width:58px;
    height:58px;
    border:4px solid #ffffff;
    border-radius:50%;
    background:#0b7c94;
    color:#ffffff;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .profile-body{
    padding:35px 20px 20px;
  }
  .name{
    color:#15191b;
    font-size:22px;
    font-weight:700;
    line-height:1.2;
  }
  .role{
    margin-top:3px;
    color:#5f6b6f;
    font-size:14px;
    line-height:1.35;
  }
  .rating{
    margin-top:4px;
    color:#36484d;
    font-size:13px;
    line-height:1.35;
  }
  .star{
    color:#d58b16;
  }
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
  }
  .stat{
    padding:10px 12px;
    border:1px solid #dbe3e3;
    border-radius:12px;
    background:#f8faf9;
  }
  .value{
    color:#15191b;
    font-size:19px;
    font-weight:700;
    line-height:1.1;
  }
  .label{
    margin-top:3px;
    color:#687276;
    font-size:12px;
    line-height:1.25;
  }
  .specialty{
    margin-top:13px;
    color:#425256;
    font-size:13px;
    line-height:1.4;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .primary,
  .secondary{
    flex:1;
    border-radius:12px;
    padding:11px 8px;
    font-size:14px;
    font-weight:600;
    text-align:center;
  }
  .primary{
    background:#0b7c94;
    color:#ffffff;
  }
  .secondary{
    border:1px solid #0b7c94;
    background:#ffffff;
    color:#0b6e84;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero-wrap">
        <img class="hero" src="https://loremflickr.com/326/150/cityscape?lock=1603" width="326" height="150" alt="Rooftops and river view of Lisbon from a hillside lookout">
        <div class="mono">DM</div>
      </div>
      <div class="profile-body">
        <div class="name">Delia Moreau</div>
        <div class="role">European Portuguese tutor &middot; Lisbon</div>
        <div class="rating"><span class="star">★</span> 4.9 out of 5 &middot; 126 learner reviews</div>

        <div class="stats">
          <div class="stat">
            <div class="value">3</div>
            <div class="label">Languages taught</div>
          </div>
          <div class="stat">
            <div class="value">9</div>
            <div class="label">Years teaching</div>
          </div>
        </div>

        <div class="specialty">Patient, practical lessons for beginners and confident travelers.</div>

        <div class="actions">
          <div class="primary">View lessons</div>
          <div class="secondary">Message Delia</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
