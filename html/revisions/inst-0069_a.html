<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #EFEEF0;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #2B2630;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 24px;
    background: #EFEEF0;
  }
  .card {
    background: #FFFFFF;
    border-radius: 4px;
    box-shadow: 0 2px 10px rgba(43, 38, 48, 0.10);
    padding: 24px 22px 22px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #8C6A8E;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.2;
    margin: 0 0 18px;
  }
  .value {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    color: #2B2630;
    margin: 0;
  }
  .time-fields {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-top: 10px;
  }
  .time-field {
    flex: 1;
    min-width: 0;
  }
  .time-field label {
    display: block;
    margin-bottom: 4px;
    color: #6E6873;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .time-field input {
    display: block;
    width: 100%;
    border: 1px solid #DDD8E0;
    border-radius: 4px;
    background: #FAF9FA;
    padding: 8px 9px;
    color: #2B2630;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    outline: none;
  }
  .time-field input:focus {
    border-color: #8C6A8E;
    box-shadow: 0 0 0 2px rgba(140, 106, 142, 0.14);
    background: #FFFFFF;
  }
  .time-separator {
    padding-bottom: 8px;
    color: #A39DA7;
    font-size: 15px;
  }
  .slider {
    margin: 20px 0 0;
  }
  .track {
    position: relative;
    height: 6px;
    background: #E7E3E9;
    border-radius: 4px;
  }
  .fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 55%;
    height: 6px;
    background: #8C6A8E;
    border-radius: 4px;
  }
  .thumb {
    position: absolute;
    top: -8px;
    left: 55%;
    margin-left: -11px;
    width: 22px;
    height: 22px;
    background: #FFFFFF;
    border: 3px solid #8C6A8E;
    border-radius: 4px;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12px;
    color: #8B858F;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #EBE8EC;
  }
  .stepper-label {
    font-size: 14px;
    color: #6E6873;
  }
  .buttons {
    display: flex;
    gap: 10px;
  }
  .step-btn {
    width: 44px;
    height: 44px;
    border: 1px solid #DDD8E0;
    border-radius: 4px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5B5462;
  }
  .save {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px 0;
    border: 0;
    border-radius: 4px;
    background: #8C6A8E;
    color: #FFFFFF;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .note {
    font-size: 12px;
    color: #8B858F;
    text-align: center;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Nightly target</p>
      <h1>Sleep goal</h1>

      <p class="value">7h 45m</p>

      <div class="time-fields" aria-label="Sleep schedule">
        <div class="time-field">
          <label for="bedtime-a">Bedtime</label>
          <input id="bedtime-a" type="text" value="10:45 PM" aria-label="Bedtime">
        </div>
        <span class="time-separator" aria-hidden="true">&middot;</span>
        <div class="time-field">
          <label for="wake-a">Wake</label>
          <input id="wake-a" type="text" value="6:30 AM" aria-label="Wake time">
        </div>
      </div>

      <div class="slider">
        <div class="track">
          <div class="fill"></div>
          <div class="thumb"></div>
        </div>
        <div class="scale">
          <span>5h</span>
          <span>10h</span>
        </div>
      </div>

      <div class="stepper">
        <span class="stepper-label">Adjust by 15 minutes</span>
        <div class="buttons">
          <div class="step-btn" role="button" aria-label="Decrease by 15 minutes">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="7.25" width="12" height="1.5" fill="currentColor"></rect>
            </svg>
          </div>
          <div class="step-btn" role="button" aria-label="Increase by 15 minutes">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="7.25" width="12" height="1.5" fill="currentColor"></rect>
              <rect x="7.25" y="2" width="1.5" height="12" fill="currentColor"></rect>
            </svg>
          </div>
        </div>
      </div>

      <div class="save" role="button">Save goal</div>
      <p class="note">Applies to tonight and every night after.</p>
    </div>
  </div>
</body>
</html>
