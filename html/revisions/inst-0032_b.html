<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elsepath</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e9e9ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #d8d8e2;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -34px;
      color: #17172a;
    }

    /* Brand mark reworked: tilted tile with a dashed two-stop route */
    .mark-stage {
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
    }

    .brand-mark {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(150deg, #6a5fe0 0%, #4f46b8 52%, #2f2a80 100%);
      transform: rotate(-12deg);
      box-shadow: 0 14px 26px rgba(47, 42, 128, 0.24);
    }

    .brand-mark svg {
      width: 50px;
      height: 50px;
      display: block;
      transform: rotate(12deg);
    }

    .brand-name {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .brand-category {
      margin: 9px 0 0;
      color: #69697a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="brand" aria-label="Elsepath travel app">
      <div class="mark-stage" aria-hidden="true">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 36.5C15 33 17.5 31.5 20 30.4" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M24.5 28.4C27 27 29.2 25.4 30.8 23.4" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M33.4 19.4C34.4 17.3 34.9 15 35 12.4" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="12" cy="36.5" r="5" fill="#FFFFFF"/>
            <circle cx="12" cy="36.5" r="2" fill="#4F46B8"/>
            <path d="M35 6.5C30.6 6.5 27 10 27 14.4C27 20 35 27.5 35 27.5C35 27.5 43 20 43 14.4C43 10 39.4 6.5 35 6.5Z" fill="#FFFFFF"/>
            <circle cx="35" cy="14.4" r="3" fill="#4F46B8"/>
          </svg>
        </div>
      </div>
      <h1 class="brand-name">Elsepath</h1>
      <p class="brand-category">Travel planning</p>
    </main>
  </div>
</body>
</html>
