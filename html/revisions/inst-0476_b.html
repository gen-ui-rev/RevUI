<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #deddd9;
      color: #f4f3f0;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 12px;
      background: #100f0f;
      border-radius: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
    }

    .activity-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #8d877f;
      font-size: 9px;
      line-height: 1.3;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .activity-header p {
      margin: 0;
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-label {
      color: #ff5b4f;
      font-weight: 700;
    }

    .dial {
      width: 122px;
      height: 122px;
      border-radius: 50%;
      background: conic-gradient(#ff5b4f 0 68%, #302e2c 68% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .dial-face {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #100f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status-label {
      margin: 0 0 2px;
      color: #8d877f;
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .arrival-time {
      margin: 0;
      color: #f4f3f0;
      font-size: 25px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .arrival-unit {
      display: block;
      margin-top: 1px;
      color: #8d877f;
      font-size: 9px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stage {
      margin: 0;
      padding: 4px 11px;
      background: #ff5b4f;
      border-radius: 999px;
      color: #1a0705;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .destination {
      margin: 0;
      max-width: 100%;
      color: #8d877f;
      font-size: 10px;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="live-activity" aria-label="Live order delivery status" style="display:contents">
      <header class="activity-header">
        <p>Mercantile Lane</p>
        <p class="live-label">Live</p>
      </header>

      <div class="dial" role="progressbar" aria-label="Delivery progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="dial-face">
          <p class="status-label">Arriving</p>
          <h1 class="arrival-time">12–18<span class="arrival-unit">min</span></h1>
        </div>
      </div>

      <p class="stage">Picked up · en route</p>
      <p class="destination">Drop-off · 84 Oak Street</p>
    </section>
  </div>
</body>
</html>
