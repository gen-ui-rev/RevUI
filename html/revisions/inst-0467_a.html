<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Community Voice Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #d9d9d7;
      color: #f4f4f3;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 10px;
      background: #ececea;
      border-radius: 28px;
    }

    .island {
      width: 100%;
      padding: 11px;
      background: #111212;
      border-radius: 22px;
    }

    .activity {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
    }

    .activity-glyph {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(185, 189, 192, 0.16);
      color: #c8cbcd;
    }

    .activity-glyph svg {
      width: 20px;
      height: 20px;
    }

    .activity-copy {
      min-width: 0;
    }

    .service {
      margin: 0;
      color: #aeb1b3;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.25;
    }

    .title {
      margin: 1px 0 0;
      overflow: hidden;
      color: #f5f5f4;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .duration {
      margin: 2px 0 0;
      color: #b9bcbe;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
    }

    .details {
      margin-top: 8px;
      padding: 9px;
      border-radius: 16px;
      background: rgba(185, 189, 192, 0.12);
    }

    .participants {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
    }

    .faces {
      display: flex;
      flex-shrink: 0;
    }

    .face {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      margin-left: -6px;
      border: 2px solid #292a2a;
      border-radius: 11px;
      background: #484b4d;
      color: #d0d2d3;
    }

    .face:first-child {
      margin-left: 0;
      background: #55595b;
    }

    .face svg {
      width: 16px;
      height: 16px;
    }

    .participant-copy {
      min-width: 0;
    }

    .participant-name {
      margin: 0;
      overflow: hidden;
      color: #eeeeed;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-count {
      margin: 2px 0 0;
      color: #aeb1b3;
      font-size: 9px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      font: inherit;
      cursor: default;
    }

    .mute {
      width: 42px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      padding: 0;
      border-radius: 14px;
      background: rgba(185, 189, 192, 0.18);
      color: #d8dadb;
    }

    .mute svg {
      width: 19px;
      height: 19px;
    }

    .leave {
      min-width: 0;
      flex: 1;
      padding: 0 10px;
      border-radius: 14px;
      background: #d0d2d3;
      color: #1d1e1e;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="island" aria-label="Expanded live voice activity">
      <div class="activity">
        <div class="activity-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 14v-4M8 17V7M12 20V4M16 17V7M20 14v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="activity-copy">
          <p class="service">Hearthline Voice</p>
          <h1 class="title">Neighborhood catch-up</h1>
          <p class="duration">12:48 elapsed</p>
        </div>
      </div>

      <div class="details">
        <div class="participants">
          <div class="faces" aria-hidden="true">
            <span class="face">
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4.5 16c.7-3 2.6-4.5 5.5-4.5s4.8 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="face">
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4.5 16c.7-3 2.6-4.5 5.5-4.5s4.8 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
          <div class="participant-copy">
            <p class="participant-name">Mira Collins and Devon Hale</p>
            <p class="participant-count">6 people listening</p>
          </div>
        </div>

        <div class="controls">
          <button class="mute" type="button" aria-label="Mute microphone">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 10V6a3 3 0 0 1 5.8-1M15 9v2a3 3 0 0 1-4.9 2.3M6 10v1a6 6 0 0 0 9.4 5M18 10v1a6 6 0 0 1-.5 2.4M12 17v3M9 20h6M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="leave" type="button">Leave</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
