<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Plan Saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebeb;
      color: #193334;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      display: flex;
      align-items: center;
      background: #0d2527;
    }

    .success-card {
      width: 100%;
      padding: 26px 22px 22px;
      text-align: center;
      background: #133638;
      border: 1px solid #1e4a4b;
      border-radius: 20px;
      box-shadow: 0 18px 34px rgba(4, 18, 19, 0.45);
    }

    .celebration {
      display: block;
      width: 96px;
      margin: 0 auto 16px;
    }

    h1 {
      margin: 0;
      color: #f1fbfa;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .message {
      margin: 10px auto 0;
      max-width: 262px;
      color: #93b3b1;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.55;
    }

    .plan-panel {
      margin-top: 18px;
      padding: 4px 14px;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }

    .plan-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .plan-row:last-child {
      border-bottom: 0;
    }

    .plan-label {
      margin: 0;
      color: #7fa2a1;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .plan-value {
      margin: 0;
      color: #eaf6f5;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .done-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #35c2b6;
      color: #06282a;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
    }

    .edit-button {
      display: block;
      width: 100%;
      margin-top: 9px;
      padding: 12px 18px;
      border: 1px solid #2c5150;
      border-radius: 10px;
      background: transparent;
      color: #b9d6d4;
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="success-card" aria-labelledby="success-title">
      <svg class="celebration" viewBox="0 0 112 88" role="img" aria-label="Success">
        <path d="M18 27l-7-5" fill="none" stroke="#4fd3c6" stroke-width="3" stroke-linecap="round"/>
        <path d="M25 14l-2-8" fill="none" stroke="#35c2b6" stroke-width="3" stroke-linecap="round"/>
        <path d="M94 27l7-5" fill="none" stroke="#4fd3c6" stroke-width="3" stroke-linecap="round"/>
        <path d="M87 14l2-8" fill="none" stroke="#35c2b6" stroke-width="3" stroke-linecap="round"/>
        <path d="M10 48l-7 2" fill="none" stroke="#2c7d7a" stroke-width="3" stroke-linecap="round"/>
        <path d="M102 48l7 2" fill="none" stroke="#2c7d7a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="12" cy="11" r="3" fill="#35c2b6"/>
        <circle cx="100" cy="11" r="3" fill="#35c2b6"/>
        <rect x="18" y="65" width="6" height="6" rx="1" fill="#2c7d7a" transform="rotate(18 21 68)"/>
        <rect x="88" y="65" width="6" height="6" rx="1" fill="#2c7d7a" transform="rotate(-18 91 68)"/>
        <circle cx="56" cy="45" r="31" fill="#35c2b6"/>
        <path d="M42 45.5l9 9L70.5 35" fill="none" stroke="#06282a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 id="success-title">Sleep plan saved</h1>
      <p class="message">Your bedtime schedule is set and starts with tonight’s reminder.</p>

      <div class="plan-panel">
        <div class="plan-row">
          <p class="plan-label">Next reminder</p>
          <p class="plan-value">Tonight, 10:30 PM</p>
        </div>
        <div class="plan-row">
          <p class="plan-label">Wake-up</p>
          <p class="plan-value">6:45 AM</p>
        </div>
        <div class="plan-row">
          <p class="plan-label">Wind-down</p>
          <p class="plan-value">30 minutes</p>
        </div>
      </div>

      <button class="done-button" type="button">Done</button>
      <button class="edit-button" type="button">Edit saved plan</button>
    </main>
  </div>
</body>
</html>
