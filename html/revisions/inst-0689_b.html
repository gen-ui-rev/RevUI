<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Followers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e1;
      color: #292524;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px 22px;
      background: #fafaf9;
    }

    .header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: #44403c;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #78716c;
      font-size: 13px;
      line-height: 20px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
      padding: 4px;
      border: 1px solid #dedbd7;
      border-radius: 8px;
      background: #f0eeeb;
    }

    .tab {
      padding: 8px 6px;
      border-radius: 5px;
      color: #78716c;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      text-align: center;
    }

    .tab.active {
      background: #ffffff;
      color: #3f3b38;
      box-shadow: 0 1px 2px rgba(41, 37, 36, 0.08);
    }

    .count {
      margin-left: 4px;
      color: #a8a29e;
      font-weight: 500;
    }

    .people {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .person {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 14px 2px;
      border-bottom: 1px solid #e7e5e4;
    }

    .person:last-child {
      border-bottom: 0;
    }

    .monogram {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #dedbd7;
      border-radius: 50%;
      background: #f1efec;
      color: #57534e;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
    }

    .details {
      min-width: 0;
    }

    .name {
      margin: 0;
      overflow: hidden;
      color: #292524;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account {
      margin: 2px 0 0;
      overflow: hidden;
      color: #78716c;
      font-size: 12px;
      line-height: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-label {
      color: #a8a29e;
    }

    .follow-button {
      min-width: 84px;
      padding: 7px 10px;
      border: 1px solid #57534e;
      border-radius: 999px;
      background: #57534e;
      color: #ffffff;
      font-family: inherit;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
    }

    .follow-button.following {
      border-color: #d6d3d1;
      background: #ffffff;
      color: #57534e;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="followers-heading">
      <header class="header">
        <h1 id="followers-heading">Connections</h1>
        <p class="subtitle">Manage who you connect with on Daymark.</p>
      </header>

      <nav class="tabs" aria-label="Connection lists">
        <div class="tab active" aria-current="page">84 Followers</div>
        <div class="tab">128 Following</div>
      </nav>

      <ul class="people">
        <li class="person">
          <div class="monogram" aria-hidden="true">AK</div>
          <div class="details">
            <p class="name">Avery Kim</p>
            <p class="account"><span class="account-label">Daymark ID</span> · avery.kim</p>
          </div>
          <button class="follow-button" type="button">Follow back</button>
        </li>

        <li class="person">
          <div class="monogram" aria-hidden="true">ML</div>
          <div class="details">
            <p class="name">Morgan Lee</p>
            <p class="account"><span class="account-label">Daymark ID</span> · morgan.lee</p>
          </div>
          <button class="follow-button" type="button">Follow back</button>
        </li>

        <li class="person">
          <div class="monogram" aria-hidden="true">JS</div>
          <div class="details">
            <p class="name">Jordan Shaw</p>
            <p class="account"><span class="account-label">Daymark ID</span> · jordan.shaw</p>
          </div>
          <button class="follow-button following" type="button">Following</button>
        </li>

        <li class="person">
          <div class="monogram" aria-hidden="true">RP</div>
          <div class="details">
            <p class="name">Riley Parker</p>
            <p class="account"><span class="account-label">Daymark ID</span> · riley.parker</p>
          </div>
          <button class="follow-button" type="button">Follow back</button>
        </li>
      </ul>
    </section>
  </div>
</body>
</html>
