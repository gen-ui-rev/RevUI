<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    background:#dedcd8;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Roboto', system-ui, sans-serif;
    color:#f5f4f1;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#100e0d;
    border-radius:46px;
    padding:12px 12px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  .eyebrow{
    margin:0;
    font-size:9px;
    line-height:11px;
    font-weight:700;
    letter-spacing:1.6px;
    color:#9a918a;
    text-transform:uppercase;
  }
  .dial{
    margin-top:8px;
    width:92px;
    height:92px;
    border-radius:50%;
    background:conic-gradient(#e8b04b 0 26%, #2c2825 26% 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .inner{
    width:74px;
    height:74px;
    border-radius:50%;
    background:#100e0d;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .num{
    font-size:30px;
    font-weight:700;
    line-height:30px;
    letter-spacing:-1px;
  }
  .unit{
    font-size:9px;
    line-height:11px;
    letter-spacing:1px;
    color:#a29a92;
    text-transform:uppercase;
  }
  .steps{
    margin-top:8px;
    display:flex;
    gap:14px;
  }
  .step{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#221f1d;
    border:1px solid #35312d;
    color:#f0eeea;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .caption{
    margin:7px 0 0;
    font-size:9px;
    line-height:11px;
    color:#8b837c;
  }
  .now{
    margin-top:8px;
    width:100%;
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .mono{
    width:20px;
    height:20px;
    border-radius:6px;
    background:#e8b04b;
    color:#231f1b;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.4px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .name{
    font-size:9px;
    line-height:12px;
    color:#b6ada6;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Sleep timer</p>

    <div class="dial">
      <div class="inner">
        <span class="num">35</span>
        <span class="unit">min</span>
      </div>
    </div>

    <div class="steps">
      <div class="step" role="img" aria-label="Decrease by five minutes">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <div class="step" role="img" aria-label="Increase by five minutes">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
    </div>

    <p class="caption">Fades out, then stops</p>

    <div class="now">
      <div class="mono">CT</div>
      <div class="name">Cascade Theory · 48 min left</div>
    </div>
  </div>
</body>
</html>
