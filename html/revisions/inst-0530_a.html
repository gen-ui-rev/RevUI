<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verba Daily — Today's lesson widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C026D3;
    --accent-soft:#D946EF;
    --card:#131017;
    --ink:#ffffff;
    --muted:#b4aebd;
    --line:#2a2532;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceaee;
    font-family:'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:34px 30px;
    background:#eceaee;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .widget{
    width:330px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .wtop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:.1px;
  }
  .brand svg{display:block;}
  .streak{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .shot{
    margin-top:14px;
    width:296px;
    height:126px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#211d29;
  }
  .eyebrow{
    margin-top:16px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:var(--accent-soft);
  }
  .title{
    margin:6px 0 0;
    font-size:20px;
    line-height:26px;
    font-weight:700;
    color:var(--ink);
  }
  .meter{
    margin-top:16px;
    height:6px;
    border-radius:14px;
    background:#26212e;
  }
  .meter span{
    display:block;
    width:60%;
    height:6px;
    border-radius:14px;
    background:var(--accent);
  }
  .meta{
    margin-top:10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:var(--muted);
  }
  .meta b{
    font-weight:500;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="wtop">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 3.2h4.1c.9 0 1.4.5 1.4 1.3v8.3c-.5-.6-1-.8-1.8-.8H2.5V3.2Z" fill="#C026D3"/>
            <path d="M13.5 3.2H9.4c-.9 0-1.4.5-1.4 1.3v8.3c.5-.6 1-.8 1.8-.8h3.7V3.2Z" fill="none" stroke="#f2eef6" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          Verba Daily
        </div>
        <div class="streak">Day 12 streak</div>
      </div>

      <img class="shot" src="https://loremflickr.com/296/126/study?lock=7163" width="296" height="126" alt="Open Spanish workbook and notebook on a desk for today's lesson">

      <div class="eyebrow">Today's lesson</div>
      <h1 class="title">Unit 4 · At the Market</h1>

      <div class="meter"><span></span></div>
      <div class="meta">
        <span><b>3 of 5</b> exercises done</span>
        <span>9 min left</span>
      </div>
    </div>
  </div>
</body>
</html>
