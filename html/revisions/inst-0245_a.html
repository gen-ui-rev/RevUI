<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark Workspace Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebee;
      color: #17232d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 768px;
      height: 1024px;
      display: flex;
      flex-direction: column;
      background: #f7f9fa;
      box-shadow: 0 18px 50px rgba(23, 35, 45, 0.13);
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 26px;
      border-bottom: 1px solid #dce3e7;
      background: #ffffff;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      border: 1px solid #cbdce5;
      border-radius: 10px;
      background: #edf7fc;
      color: #147fb8;
      cursor: pointer;
    }

    .topbar-copy {
      min-width: 0;
      flex: 1;
    }

    .product-name {
      margin: 0 0 2px;
      color: #60717d;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      overflow: hidden;
      color: #17232d;
      font-size: 20px;
      font-weight: 700;
      line-height: 26px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
      color: #697984;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #df5a4f;
    }

    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      border-radius: 12px;
      background: #dceff8;
      color: #147fb8;
      font-size: 15px;
      font-weight: 700;
    }

    .workspace-shell {
      min-height: 0;
      flex: 1;
      display: flex;
    }

    .sidebar {
      width: 184px;
      flex: 0 0 184px;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dce3e7;
      background: #ffffff;
    }

    .nav-label {
      margin: 0 12px 12px;
      color: #8a979f;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .tab {
      width: 100%;
      min-height: 54px;
      margin: 0 0 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #60717d;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      text-align: left;
      cursor: pointer;
    }

    .tab.active {
      background: #e6f3f9;
      color: #126f9f;
      font-weight: 700;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 12px 0;
      border-top: 1px solid #e3e8eb;
      color: #76858f;
      font-size: 12px;
      line-height: 18px;
    }

    main {
      min-width: 0;
      flex: 1;
      padding: 54px 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-card {
      width: 100%;
      max-width: 480px;
      padding: 46px 48px 42px;
      border: 1px solid #efc4bf;
      border-top: 7px solid #d94f43;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 14px 34px rgba(80, 50, 46, 0.1);
      text-align: center;
    }

    .error-symbol {
      width: 108px;
      height: 108px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff0ee;
      color: #d94f43;
    }

    .error-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 12px;
      color: #b33d34;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d94f43;
    }

    .error-card h1 {
      margin: 0 0 14px;
      color: #17232d;
      font-size: 30px;
      font-weight: 700;
      line-height: 38px;
    }

    .error-card p {
      margin: 0 auto;
      color: #60717d;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
    }

    .saved-note {
      margin-top: 22px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 8px;
      background: #f1f6f3;
      color: #3e6f52;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    .retry-button {
      width: 100%;
      min-height: 52px;
      margin-top: 24px;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      background: #168bc7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 22px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(22, 139, 199, 0.22);
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </button>
      <div class="topbar-copy">
        <p class="product-name">Daymark</p>
        <p class="page-title">Northfield Planning</p>
      </div>
      <div class="sync-status" aria-label="Workspace is offline">
        <span class="sync-dot" aria-hidden="true"></span>
        Offline
      </div>
      <div class="avatar" aria-label="Morgan Lee profile">ML</div>
    </header>

    <div class="workspace-shell">
      <nav class="sidebar" aria-label="Primary navigation">
        <p class="nav-label">Workspace</p>
        <button class="tab" type="button">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 5H19V19H5V5Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 9H16M8 13H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
          </svg>
          <span>Tasks</span>
        </button>
        <button class="tab active" type="button" aria-current="page">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 4H18V20H6V4Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9 8H15M9 12H15M9 16H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
          </svg>
          <span>Notes</span>
        </button>
        <button class="tab" type="button">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 7H19V19H5V7Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 4V9M16 4V9M5 11H19" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>Schedule</span>
        </button>
        <p class="sidebar-footer">Recent changes are stored locally until the connection returns.</p>
      </nav>

      <main>
        <section class="error-card" aria-labelledby="error-title-a">
          <div class="error-symbol" aria-hidden="true">
            <svg width="54" height="54" viewBox="0 0 48 48" fill="none">
              <path d="M15 34H34C39 34 42 31 42 26.5C42 22.4 39.1 19.4 35.2 19C34.2 13.8 30.1 10.5 25 10.5C20.2 10.5 16.3 13.3 14.8 17.6C10 17.8 6.5 21.2 6.5 25.8C6.5 30.5 10 34 15 34Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
              <path d="M18 39L30 27" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
              <path d="M18 27L30 39" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/>
            </svg>
          </div>
          <p class="error-label">Connection interrupted</p>
          <h1 id="error-title-a">We couldn’t open this workspace</h1>
          <p>Your connection was interrupted. Your recent edits are saved on this device.</p>
          <div class="saved-note">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12L10 17L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
            </svg>
            Your work is safe
          </div>
          <button class="retry-button" type="button">Try again</button>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
