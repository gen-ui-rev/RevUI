<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateful — Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#c2405f;
    --rose-dark:#a93450;
    --rose-soft:rgba(194,64,95,0.11);
    --rose-softer:rgba(194,64,95,0.06);
    --ink:#221c1e;
    --muted:#6f676a;
    --line:#e8dfe1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    padding:28px 0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#dedbd9;
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:768px;
    height:1024px;
    padding:32px;
    background:#f1efee;
  }
  .card{
    width:704px;
    background:#fff;
    border:1px solid rgba(34,28,30,.05);
    border-radius:18px;
    box-shadow:0 12px 34px rgba(50,39,42,.08);
  }
  .hero{
    width:704px;
    height:300px;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:18px 18px 0 0;
  }
  .body{padding:28px 32px 30px;}
  .eyebrow{
    margin:0;
    color:var(--rose);
    font-size:13px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .track{
    display:flex;
    gap:7px;
    margin:10px 0 20px;
  }
  .seg{
    height:6px;
    flex:1;
    border-radius:10px;
    background:var(--rose-soft);
  }
  .seg.on{background:var(--rose);}
  h2{
    margin:0 0 9px;
    font-family:'Playfair Display', Georgia, serif;
    font-size:31px;
    font-weight:700;
    line-height:1.18;
  }
  .lede{
    max-width:610px;
    margin:0;
    color:var(--muted);
    font-size:17px;
    line-height:1.5;
  }
  .next-label{
    margin:25px 0 11px;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .thumbs{
    display:flex;
    align-items:flex-end;
    gap:16px;
  }
  .thumb{min-width:0;}
  .thumb.next-step{width:280px;}
  .thumb.later-step{width:164px;}
  .thumb img{
    display:block;
    width:100%;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:12px;
  }
  .thumb.next-step img{
    width:280px;
    height:160px;
  }
  .thumb.later-step img{
    width:164px;
    height:108px;
  }
  .thumb span{
    display:block;
    margin-top:7px;
    color:var(--muted);
    font-size:14px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .thumb.next-step span{
    color:var(--ink);
    font-size:16px;
    font-weight:600;
  }
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  button{
    appearance:none;
    border:0;
    font:inherit;
    cursor:default;
  }
  .back{
    min-height:48px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:0 18px;
    color:var(--rose-dark);
    background:#fff;
    border:1px solid rgba(194,64,95,.38);
    border-radius:12px;
    box-shadow:0 2px 5px rgba(66,40,47,.08);
    font-size:15px;
    font-weight:600;
  }
  .next{
    min-height:50px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:0 24px;
    color:#fff;
    background:var(--rose);
    border-radius:12px;
    box-shadow:0 5px 12px rgba(194,64,95,.22);
    font-size:16px;
    font-weight:600;
  }
  .count{
    color:var(--muted);
    font-size:14px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/704/300/salad?lock=3380" width="704" height="300" alt="A plate of green salad with grains photographed from above">
      <div class="body">
        <p class="eyebrow">Step 2 of 4</p>
        <div class="track" aria-label="Tour progress: step 2 of 4">
          <div class="seg on"></div>
          <div class="seg on"></div>
          <div class="seg"></div>
          <div class="seg"></div>
        </div>

        <h2>Log a meal from one photo</h2>
        <p class="lede">Point the camera at your plate. Plateful estimates each portion and fills in calories and protein — you only correct what looks off.</p>

        <p class="next-label">Coming up</p>
        <div class="thumbs">
          <div class="thumb next-step">
            <img src="https://loremflickr.com/280/160/fruit?lock=3381" width="280" height="160" alt="Bowl of mixed fruit used for the barcode scanning step">
            <span>Next: Scan groceries</span>
          </div>
          <div class="thumb later-step">
            <img src="https://loremflickr.com/164/108/gym?lock=3382" width="164" height="108" alt="Gym weights for the workout syncing step">
            <span>Sync workouts</span>
          </div>
          <div class="thumb later-step">
            <img src="https://loremflickr.com/164/108/running?lock=3383" width="164" height="108" alt="Runner on a path for the weekly goal step">
            <span>Set week goals</span>
          </div>
        </div>

        <div class="foot">
          <button class="back" type="button">
            <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M8.5 3L4.5 7l4 4" stroke="#a93450" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
          </button>
          <span class="count">2 of 4 done</span>
          <button class="next" type="button">
            Next
            <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M5.5 3l4 4-4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
