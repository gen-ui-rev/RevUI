<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #e9e7e4;
      color: #2b2928;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      display: flex;
      align-items: center;
      padding: 40px 24px;
      background: #f5f3f0;
    }

    .confirmation-card {
      width: 100%;
      padding: 30px 28px 28px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dedad5;
      border-top: 4px solid #be272d;
      box-shadow: 0 10px 26px rgba(55, 47, 43, 0.08);
    }

    .package-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      color: #be272d;
      background: #f7eeee;
      border: 1px solid #ecd3d4;
      border-radius: 50%;
    }

    .package-mark svg {
      display: block;
      width: 38px;
      height: 38px;
    }

    h1 {
      margin: 0;
      color: #252322;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
    }

    .description {
      max-width: 260px;
      margin: 12px auto 0;
      color: #625d5b;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 400;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 0;
      color: #9b292d;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      background: #be272d;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="confirmation-card" role="status" aria-live="polite" aria-label="Confirming cart availability">
      <div class="package-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44" fill="none">
          <path d="M7 14.5L22 7L37 14.5V30L22 37L7 30V14.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
          <path d="M7 14.5L22 22L37 14.5M22 22V37M15 10.5L30 18" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
        </svg>
      </div>
      <h1>Confirming your cart</h1>
      <p class="description">Morrow Market is checking seller inventory and delivery availability.</p>
      <p class="status"><span class="status-dot" aria-hidden="true"></span>Availability check in progress</p>
    </section>
  </div>
</body>
</html>
