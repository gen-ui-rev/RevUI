<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Photo Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #27272a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      padding: 20px;
      background: #f8f8f8;
    }

    .transfer-card {
      padding: 24px;
      background: #ffffff;
      border-radius: 10px;
    }

    .transfer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(82, 82, 91, 0.14);
    }

    .header-lead {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: #27272a;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .order-reference {
      margin: 4px 0 0;
      overflow: hidden;
      color: #71717a;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.3px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-glyph {
      width: 44px;
      min-width: 44px;
      height: 44px;
      padding: 11px;
      display: grid;
      place-items: center;
      color: #52525b;
      background: rgba(82, 82, 91, 0.09);
      border-radius: 10px;
    }

    .upload-glyph svg {
      width: 22px;
      display: block;
    }

    .progress-block {
      margin-top: 20px;
      padding: 18px;
      background: rgba(82, 82, 91, 0.07);
      border-radius: 10px;
    }

    .progress-copy {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-value {
      margin: 0;
      color: #3f3f46;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
    }

    .progress-detail {
      margin: 0 0 3px;
      color: #71717a;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
    }

    .progress-track {
      margin-top: 14px;
      background: rgba(82, 82, 91, 0.14);
      border-radius: 10px;
    }

    .progress-fill {
      width: 68%;
      padding-top: 8px;
      background: #52525b;
      border-radius: 10px;
    }

    .file-list {
      margin-top: 20px;
    }

    .file-list-title {
      margin: 0 0 10px;
      color: #52525b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      background: rgba(82, 82, 91, 0.06);
      border-radius: 10px;
    }

    .file-row + .file-row {
      margin-top: 8px;
    }

    .file-details {
      min-width: 0;
    }

    .file-name {
      margin: 0;
      overflow: hidden;
      color: #3f3f46;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      margin: 2px 0 0;
      color: #71717a;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .file-status {
      margin: 0;
      flex-shrink: 0;
      color: #52525b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .upload-note {
      margin: 16px 0 0;
      color: #71717a;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
    }

    .cancel-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: rgba(82, 82, 91, 0.09);
      color: #52525b;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="transfer-card" aria-labelledby="upload-title">
      <header class="transfer-header">
        <div class="header-lead">
          <h1 id="upload-title">Uploading photos</h1>
          <p class="order-reference">Pinewell Market &middot; Return #PW-2841</p>
        </div>
        <div class="upload-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 17.5H5.75A3.75 3.75 0 0 1 5.2 10a6 6 0 0 1 11.67-1.35A4.5 4.5 0 0 1 17.5 17.5H17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 19V10.5M8.75 13.75 12 10.5l3.25 3.25" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </header>

      <div class="progress-block">
        <div class="progress-copy">
          <p class="progress-value">68%</p>
          <p class="progress-detail">1 of 2 uploaded</p>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Return photo upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="file-list" aria-label="Upload files">
        <p class="file-list-title">Files</p>

        <div class="file-row">
          <div class="file-details">
            <p class="file-name">item-front.jpg</p>
            <p class="file-size">1.8 MB</p>
          </div>
          <p class="file-status">Uploaded</p>
        </div>

        <div class="file-row">
          <div class="file-details">
            <p class="file-name">item-side.jpg</p>
            <p class="file-size">2.4 MB</p>
          </div>
          <p class="file-status">36%</p>
        </div>
      </div>

      <p class="upload-note">Don't close this page while uploading.</p>
      <button class="cancel-button" type="button">Cancel upload</button>
    </main>
  </div>
</body>
</html>
