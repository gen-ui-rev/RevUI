<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily protein target</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 24px 0;
    background: #e9e7e4;
    font-family: 'Roboto', system-ui, sans-serif;
    color: #1c1917;
  }
  .screen {
    width: 184px;
    height: 224px;
    background: #ffffff;
    border-radius: 22px;
    border: 1px solid #e7e5e4;
    padding: 12px 13px 12px;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 7px;
    border-bottom: 1px solid #e7e5e4;
  }
  .topbar .brand {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #78716c;
  }
  .topbar .day {
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #a8a29e;
  }
  .caption {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #78716c;
    margin: 10px 0 8px;
    text-align: center;
  }
  .dial {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .step {
    flex: none;
    width: 32px;
    height: 32px;
    border: 1px solid #d6d3d1;
    border-radius: 7px;
    background: #fafaf9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #44403c;
  }
  .value {
    text-align: center;
    padding: 0 4px;
  }
  .value .num {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.03em;
  }
  .value .unit {
    font-size: 12px;
    font-weight: 500;
    color: #57534e;
    margin-left: 2px;
  }
  .meter {
    display: flex;
    gap: 3px;
    margin-top: 14px;
  }
  .seg {
    flex: 1;
    height: 12px;
    border-radius: 2px;
    background: #ededeb;
  }
  .seg.on { background: #57534e; }
  .seg.edge { background: #b9b5b0; }
  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 8px;
    letter-spacing: .06em;
    color: #a8a29e;
  }
  .note {
    margin: 9px 0 0;
    font-size: 10px;
    line-height: 1.2;
    color: #57534e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note strong { font-weight: 700; color: #1c1917; }
  .save {
    margin-top: auto;
    border-radius: 8px;
    background: #57534e;
    color: #fafaf9;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="brand">Marrow</span>
      <span class="day">Wed</span>
    </div>

    <p class="caption">Daily protein</p>

    <div class="dial">
      <span class="step" aria-label="Decrease by 5 grams">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9"/></svg>
      </span>
      <span class="value"><span class="num">135</span><span class="unit">g</span></span>
      <span class="step" aria-label="Increase by 5 grams">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9M7.5 3v9"/></svg>
      </span>
    </div>

    <div class="meter">
      <span class="seg on"></span>
      <span class="seg on"></span>
      <span class="seg on"></span>
      <span class="seg on"></span>
      <span class="seg on"></span>
      <span class="seg edge"></span>
      <span class="seg"></span>
      <span class="seg"></span>
      <span class="seg"></span>
      <span class="seg"></span>
    </div>
    <div class="scale">
      <span>60 g</span>
      <span>220 g</span>
    </div>

    <p class="note">Suggested today: <strong>120&ndash;150 g</strong></p>

    <div class="save">Save target</div>
  </div>
</body>
</html>
