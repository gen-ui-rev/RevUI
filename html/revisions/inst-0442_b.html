<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge earned — Fernwood Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#DCDDE0;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#0B0C0E;
    border-radius:26px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .banner{
    background:#1D4ED8;
    padding:14px 14px 13px;
  }
  .eyebrow{
    font-size:8px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#BFD0FF;
    margin:0 0 5px;
    line-height:1;
  }
  h1{
    font-size:15px;
    line-height:1.15;
    font-weight:700;
    color:#FFFFFF;
    margin:0 0 9px;
    letter-spacing:-.01em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .art{
    display:flex;
    align-items:center;
    gap:8px;
    background:#123AAE;
    border-radius:8px;
    padding:6px 9px;
  }
  .art .glyph{
    width:18px;
    height:18px;
    flex:0 0 18px;
    border-radius:50%;
    background:#FFFFFF;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .art p{
    margin:0;
    font-size:9.5px;
    font-weight:600;
    color:#DCE5FF;
    line-height:1.2;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .body{
    flex:1 1 auto;
    box-sizing:border-box;
    padding:13px 14px 13px;
    display:flex;
    flex-direction:column;
  }
  .stat{
    font-size:9.5px;
    font-weight:500;
    color:#8A8F98;
    margin:0 0 11px;
    line-height:1.2;
  }
  .stat b{color:#FFFFFF;font-weight:700;}
  .next-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .next-label{
    font-size:10.5px;
    font-weight:600;
    color:#F2F3F5;
    margin:0;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .count{
    font-size:10.5px;
    font-weight:700;
    color:#7FA0FF;
    margin:0;
    flex:0 0 auto;
  }
  .track{
    height:5px;
    border-radius:3px;
    background:#22242A;
    margin:8px 0 7px;
  }
  .fill{
    width:66.6%;
    height:100%;
    border-radius:3px;
    background:#4C7BFF;
  }
  .hint{
    font-size:9px;
    line-height:1.3;
    color:#8A8F98;
    margin:0;
  }
  .foot{
    margin-top:auto;
    box-sizing:border-box;
    height:32px;
    border-radius:10px;
    background:#181A1F;
    border:1px solid #262930;
    color:#9CB6FF;
    font-size:10.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px;
  }
  .foot svg{flex:0 0 auto;}
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <p class="eyebrow">Badge earned</p>
      <h1>Trusted Reviewer</h1>
      <div class="art">
        <span class="glyph">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.4 6.3l2.2 2.2 4.8-4.8" stroke="#1D4ED8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <p>Earned Mar 14, 2025</p>
      </div>
    </div>

    <div class="body">
      <p class="stat"><b>50</b> reviews marked helpful</p>

      <div class="next-head">
        <p class="next-label">Next: Community Guide</p>
        <p class="count">4/6</p>
      </div>
      <div class="track"><div class="fill"></div></div>
      <p class="hint">2 photo reviews to unlock</p>

      <div class="foot">
        All 11 badges
        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 3l4 4-4 4" stroke="#9CB6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
