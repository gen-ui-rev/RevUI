<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extend Parking Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8edeb;
      color: #172522;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      background: #f7f9f8;
    }

    .component {
      width: 100%;
    }

    .context {
      margin: 0 0 8px;
      color: #087b74;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .spot-card {
      margin-top: 14px;
      padding: 14px;
      background: #dcefed;
      border: 1px solid #c3e2de;
      border-radius: 4px;
    }

    .spot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .spot-name {
      min-width: 0;
      color: #0c453f;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expires-tag {
      flex: 0 0 auto;
      padding: 0 8px;
      background: #087b74;
      border-radius: 4px;
      color: #ffffff;
      font-size: 11px;
      line-height: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .spot-meta {
      margin: 0;
      color: #356d68;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-label {
      margin: 16px 0 0;
      color: #44534f;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .options {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option {
      position: relative;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #dde5e3;
      border-radius: 4px;
      cursor: pointer;
    }

    .option.is-selected {
      background: #f0faf8;
      border-color: #087b74;
      box-shadow: inset 0 0 0 1px #087b74;
    }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mark {
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 2px solid #c4cfcc;
      border-radius: 4px;
      color: #ffffff;
    }

    .option.is-selected .mark {
      background: #087b74;
      border-color: #087b74;
    }

    .mark svg {
      width: 12px;
      height: 12px;
      display: block;
      visibility: hidden;
    }

    .option.is-selected .mark svg {
      visibility: visible;
    }

    .opt-text {
      flex: 1 1 auto;
      min-width: 0;
      color: #172522;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .opt-sub {
      color: #75817e;
      font-size: 13px;
      font-weight: 500;
    }

    .opt-price {
      flex: 0 0 auto;
      color: #076e68;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .total-card {
      margin-top: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #dde5e3;
      border-radius: 4px;
    }

    .total-card .label {
      color: #44534f;
      font-size: 14px;
      line-height: 24px;
      font-weight: 600;
    }

    .total-card .amount {
      color: #172522;
      font-size: 20px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .pay-button {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      padding: 0 16px;
      border: 0;
      border-radius: 4px;
      background: #087b74;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      line-height: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
    }

    .pay-note {
      margin: 8px 0 0;
      text-align: center;
      color: #75817e;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="component" aria-labelledby="extend-title">
      <p class="context">Street parking · Zone 402</p>
      <h1 id="extend-title">Extend parking</h1>

      <div class="spot-card">
        <div class="spot-head">
          <span class="spot-name">240 Harbour St · Bay 118</span>
          <span class="expires-tag">ENDS 3:20 PM</span>
        </div>
        <p class="spot-meta">Silver Mazda 3 · Plate KJ7 2LP · $5.00/hr</p>
      </div>

      <p class="list-label">Choose how much time to add</p>

      <div class="options" role="radiogroup" aria-label="Extension length">
        <label class="option">
          <input type="radio" name="extension">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
          </span>
          <span class="opt-text">+30 min <span class="opt-sub">· until 3:50 PM</span></span>
          <span class="opt-price">$2.85</span>
        </label>

        <label class="option is-selected">
          <input type="radio" name="extension" checked>
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
          </span>
          <span class="opt-text">+45 min <span class="opt-sub">· until 4:05 PM</span></span>
          <span class="opt-price">$4.10</span>
        </label>

        <label class="option">
          <input type="radio" name="extension">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
          </span>
          <span class="opt-text">+1 hr 30 min <span class="opt-sub">· until 4:50 PM</span></span>
          <span class="opt-price">$7.85</span>
        </label>
      </div>

      <div class="total-card">
        <span class="label">Total due</span>
        <span class="amount">$4.10</span>
      </div>

      <button class="pay-button" type="button">Confirm &amp; pay $4.10</button>
      <p class="pay-note">Includes $0.35 service fee · Visa ···· 4417</p>
    </section>
  </div>
</body>
</html>
