<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Recipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfdf;
      color: #272929;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      background: #f5f5f3;
    }

    .move-panel {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
    }

    .panel-heading {
      padding: 14px 16px;
      background: #e8e9e8;
      border-radius: 14px;
    }

    .heading-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #676a69;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
    }

    .helper {
      margin: 7px 0 0;
      overflow: hidden;
      color: #5f6261;
      font-size: 12.5px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .close-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: #d9dbda;
      color: #454847;
    }

    .close-button svg {
      width: 18px;
      height: 18px;
    }

    .recipe-card {
      margin-top: 12px;
      padding: 12px;
      background: #f0f1f0;
      border-radius: 14px;
    }

    .recipe-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recipe-top img {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      object-fit: cover;
      display: block;
      background: #d4d6d5;
      border-radius: 14px;
    }

    .recipe-copy {
      min-width: 0;
    }

    .recipe-title {
      margin: 0;
      overflow: hidden;
      color: #2d2f2e;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recipe-meta {
      margin: 4px 0 0;
      overflow: hidden;
      color: #737675;
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e0e2e1;
    }

    .time {
      padding: 0 8px;
      border-left: 1px solid #e0e2e1;
      text-align: center;
    }

    .time:first-child {
      border-left: 0;
    }

    .time-label {
      display: block;
      color: #838685;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .time-value {
      display: block;
      margin-top: 2px;
      color: #333635;
      font-size: 13px;
      font-weight: 700;
    }

    .field-label {
      margin: 12px 2px 8px;
      color: #4e5150;
      font-size: 12px
      ;font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .day-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      padding: 7px 0;
      border: 0;
      border-radius: 11px;
      background: #f0f1f0;
      color: #4d5150;
      text-align: center;
      cursor: default;
    }

    .day.active {
      background: #555958;
      color: #ffffff;
    }

    .day-name {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .day-date {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 700;
    }

    .meal-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .meal {
      padding: 11px 6px;
      border: 0;
      border-radius: 12px;
      background: #f0f1f0;
      color: #4d5150;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      cursor: default;
    }

    .meal.active {
      background: #dfe1e0;
      color: #2b2d2c;
      box-shadow: inset 0 0 0 2px #9ea1a0;
    }

    .move-button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #555958;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="move-panel" aria-labelledby="move-title">
      <header class="panel-heading">
        <div class="heading-top">
          <div>
            <p class="eyebrow">Commonroom recipes</p>
            <h1 id="move-title">Schedule this recipe</h1>
          </div>
          <button class="close-button" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="helper">Choose the day and meal in your plan.</p>
      </header>

      <section class="recipe-card">
        <div class="recipe-top">
          <img src="https://loremflickr.com/64/64/pasta?lock=11830" width="64" height="64" alt="Bowl of lemon garlic pasta from the saved recipe">
          <div class="recipe-copy">
            <p class="recipe-title">Lemon garlic butter pasta</p>
            <p class="recipe-meta">By Rowan Mercer · Serves 4</p>
          </div>
        </div>
        <div class="times">
          <div class="time">
            <span class="time-label">Prep</span>
            <span class="time-value">15 min</span>
          </div>
          <div class="time">
            <span class="time-label">Cook</span>
            <span class="time-value">40 min</span>
          </div>
          <div class="time">
            <span class="time-label">Total</span>
            <span class="time-value">55 min</span>
          </div>
        </div>
      </section>

      <p class="field-label">Day · week of May 19</p>
      <div class="day-row" role="listbox" aria-label="Choose a day">
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Mon</span><span class="day-date">19</span></button>
        <button class="day active" type="button" role="option" aria-selected="true"><span class="day-name">Tue</span><span class="day-date">20</span></button>
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Wed</span><span class="day-date">21</span></button>
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Thu</span><span class="day-date">22</span></button>
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Fri</span><span class="day-date">23</span></button>
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Sat</span><span class="day-date">24</span></button>
        <button class="day" type="button" role="option" aria-selected="false"><span class="day-name">Sun</span><span class="day-date">25</span></button>
      </div>

      <p class="field-label">Meal</p>
      <div class="meal-row" role="listbox" aria-label="Choose a meal">
        <button class="meal" type="button" role="option" aria-selected="false">Breakfast</button>
        <button class="meal" type="button" role="option" aria-selected="false">Lunch</button>
        <button class="meal active" type="button" role="option" aria-selected="true">Dinner</button>
      </div>

      <button class="move-button" type="button">Add to Tuesday dinner</button>
    </main>
  </div>
</body>
</html>
