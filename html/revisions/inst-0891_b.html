<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order item actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:#dcdfe1;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    border-radius:40px;
    background:#f4f6f7;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 0 6px #c3c8ca, 0 10px 22px rgba(20,28,33,.24);
  }
  .bar{
    padding:11px 16px 8px;
    background:#e3e9eb;
    border-bottom:1px solid #d0d6d9;
    text-align:center;
  }
  .bar-title{
    font-size:11px;
    font-weight:600;
    color:#17222a;
    line-height:1.25;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .bar-sub{
    font-size:9px;
    font-weight:400;
    color:#6c777d;
    margin:2px 0 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list{
    list-style:none;
    margin:0;
    padding:0;
    flex:1;
  }
  .row{
    padding:7px 22px 7px 14px;
    border-bottom:1px solid #e3e8ea;
    font-size:11px;
    font-weight:500;
    color:#98a3a8;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row:last-child{border-bottom:none;}
  .row.focus{
    background:#ffffff;
    border-left:3px solid #2f6d86;
    padding:10px 22px 11px 13px;
    font-size:14px;
    font-weight:600;
    color:#152029;
    white-space:normal;
  }
  .row.focus .note{
    display:block;
    margin-top:3px;
    font-size:10px;
    font-weight:400;
    color:#6c777d;
    line-height:1.3;
  }
  .crown{
    position:absolute;
    top:52px;
    bottom:16px;
    right:6px;
    width:3px;
    border-radius:2px;
    background:#d7dcde;
  }
  .crown-thumb{
    width:3px;
    height:44px;
    border-radius:2px;
    background:#2f6d86;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="bar">
      <p class="bar-title">Ridgeline Canvas Duffel</p>
      <p class="bar-sub">4820-771 &middot; $128.00 &middot; Delivered</p>
    </div>
    <ul class="list">
      <li class="row focus">
        Start a return
        <span class="note">Free pickup through Mar 22</span>
      </li>
      <li class="row">Message the seller</li>
      <li class="row">Buy this again</li>
      <li class="row">View receipt</li>
      <li class="row">Close</li>
    </ul>
    <div class="crown"><div class="crown-thumb"></div></div>
  </div>
</body>
</html>
