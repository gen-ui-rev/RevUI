<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Community Voice Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #d9d9d7;
      color: #f4f4f3;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 10px;
      background: #111212;
      border: 4px solid #ececea;
      border-radius: 36px;
    }

    .island {
      width: 100%;
      padding: 8px;
    }

    .activity {
      min-width: 0;
    }

    .service-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .activity-glyph {
      width: 26px;
      height: 26px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      border-radius: 10px;
      background: rgba(185, 189, 192, 0.16);
      color: #c8cbcd;
    }

    .activity-glyph svg {
      width: 16px;
      height: 16px;
    }

    .service {
      min-width: 0;
      flex: 1;
      margin: 0;
      overflow: hidden;
      color: #aeb1b3;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #d0d2d3;
      box-shadow: 0 0 0 3px rgba(208, 210, 211, 0.13);
    }

    .title {
      margin: 5px 0 0;
      overflow: hidden;
      color: #f5f5f4;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .duration {
      margin: 8px 0 0;
      color: #f2f2f1;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .elapsed {
      margin: 1px 0 0;
      color: #8f9395;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .participants {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 14px;
      background: rgba(185, 189, 192, 0.11);
    }

    .faces {
      display: flex;
      flex-shrink: 0;
    }

    .face {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      margin-left: -7px;
      border: 2px solid #292a2a;
      border-radius: 50%;
      background: #484b4d;
      color: #d0d2d3;
    }

    .face:first-child {
      margin-left: 0;
      background: #55595b;
    }

    .face svg {
      width: 15px;
      height: 15px;
    }

    .participant-copy {
      min-width: 0;
    }

    .participant-name {
      margin: 0;
      overflow: hidden;
      color: #eeeeed;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-count {
      margin: 2px 0 0;
      color: #aeb1b3;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 8px;
      margin-top: 9px;
    }

    button {
      min-height: 42px;
      border: 0;
      font: inherit;
      cursor: default;
    }

    .mute {
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      background: #303233;
      color: #d8dadb;
    }

    .mute svg {
      width: 19px;
      height: 19px;
    }

    .leave {
      min-width: 0;
      padding: 0 12px;
      border-radius: 21px;
      background: #d0d2d3;
      color: #1d1e1e;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="island" aria-label="Expanded live voice activity">
      <div class="activity">
        <div class="service-row">
          <div class="activity-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M4 14v-4M8 17V7M12 20V4M16 17V7M20 14v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="service">Hearthline Voice</p>
          <span class="live-dot" aria-hidden="true"></span>
        </div>

        <h1 class="title">Neighborhood catch-up</h1>
        <p class="duration">12:48</p>
        <p class="elapsed">Elapsed</p>
      </div>

      <div class="participants">
        <div class="faces" aria-hidden="true">
          <span class="face">
            <svg viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4.5 16c.7-3 2.6-4.5 5.5-4.5s4.8 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="face">
            <svg viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4.5 16c.7-3 2.6-4.5 5.5-4.5s4.8 1.5 5.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
        <div class="participant-copy">
          <p class="participant-name">Mira Collins and Devon Hale</p>
          <p class="participant-count">6 people listening</p>
        </div>
      </div>

      <div class="controls">
        <button class="mute" type="button" aria-label="Mute microphone">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 10V6a3 3 0 0 1 5.8-1M15 9v2a3 3 0 0 1-4.9 2.3M6 10v1a6 6 0 0 0 9.4 5M18 10v1a6 6 0 0 1-.5 2.4M12 17v3M9 20h6M4 4l16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="leave" type="button">Leave chat</button>
      </div>
    </section>
  </div>
</body>
</html>
