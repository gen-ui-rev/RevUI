<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode reaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    background: #eceded;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 32px 24px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(24, 24, 27, 0.08);
    padding: 22px 20px 20px;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .glyph {
    width: 54px;
    height: 54px;
    flex: none;
    border-radius: 14px;
    background: #f4f4f5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glyph svg { stroke: #6b7280; }
  .meta { min-width: 0; }
  .title {
    font-size: 17px;
    font-weight: 700;
    color: #1c1c1f;
    line-height: 1.3;
  }
  .sub {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 400;
    color: #74747c;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rule {
    height: 1px;
    background: #ececee;
    margin: 20px 0;
  }
  .vote {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 1px solid #cbd3dd;
    border-radius: 14px;
    background: #f5f7fa;
    color: #465466;
    padding: 13px 17px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }
  .vote svg {
    flex: none;
    stroke: #607086;
  }
  .count {
    margin-left: auto;
    color: #607086;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .note {
    margin: 14px 2px 0;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.45;
    color: #74747c;
  }
  .who {
    color: #1c1c1f;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <div class="glyph">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 10v4"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/>
          </svg>
        </div>
        <div class="meta">
          <div class="title">The Long Way Home</div>
          <div class="sub">Field Notes &middot; Episode 42 &middot; 48 min</div>
        </div>
      </div>

      <div class="rule"></div>

      <button class="vote" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V6"/><path d="M6 12l6-6 6 6"/>
        </svg>
        Recommended
        <span class="count">2,481</span>
      </button>

      <p class="note"><span class="who">You</span> and 2,480 listeners recommend this episode. Your name appears on the public episode page.</p>
    </div>
  </div>
</body>
</html>
