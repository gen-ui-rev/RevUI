<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel Pay — Transfer activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin: 0;
    padding: 0;
    background: #DEE0E4;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .screen {
    width: 768px;
    height: 1024px;
    background: #E9EAEC;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 154px;
  }
  .page-label {
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8B909A;
    margin-bottom: 22px;
  }
  .island {
    width: 100%;
    background: #0B0C0F;
    border-radius: 32px;
    padding: 34px 34px 30px;
    box-shadow: 0 18px 44px rgba(17, 20, 28, 0.22);
  }
  .head {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .thumb {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: #2F6BFF;
    flex: none;
  }
  .who {
    flex: 1;
    min-width: 0;
  }
  .kicker {
    font-size: 13px;
    line-height: 1.3;
    color: #8B909A;
    letter-spacing: 0.03em;
  }
  .name {
    font-size: 24px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .account {
    font-size: 15px;
    color: #9AA0AA;
    line-height: 1.4;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag {
    flex: none;
    font-size: 13px;
    color: #9CC0FF;
    border: 1px solid #23324F;
    background: #131A28;
    border-radius: 999px;
    padding: 7px 14px;
    white-space: nowrap;
  }
  .amount {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-top: 30px;
  }
  .amount .value {
    font-size: 56px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .amount .unit {
    font-size: 19px;
    font-weight: 600;
    color: #8B909A;
    line-height: 1.2;
  }
  .track {
    margin-top: 30px;
    height: 8px;
    border-radius: 4px;
    background: #22252C;
    overflow: hidden;
  }
  .fill {
    width: 68%;
    height: 8px;
    border-radius: 4px;
    background: #2F6BFF;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 14px;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 16px;
    color: #E4E6EA;
    min-width: 0;
  }
  .step svg { display: block; flex: none; }
  .step span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .eta {
    font-size: 16px;
    color: #8B909A;
    white-space: nowrap;
    flex: none;
  }
  .actions {
    display: flex;
    gap: 14px;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #1C1F26;
  }
  .btn {
    flex: 1;
    height: 54px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .btn.primary {
    background: #2F6BFF;
    color: #FFFFFF;
  }
  .btn.ghost {
    border: 1px solid #2A2E37;
    color: #D8DBE1;
  }
  .note {
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #8B909A;
    margin-top: 22px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="page-label">Transfer activity</div>
    <div class="island">
      <div class="head">
        <div class="thumb"></div>
        <div class="who">
          <div class="kicker">Kestrel Pay · Transfer</div>
          <div class="name">Maya Okonkwo</div>
          <div class="account">Chase Total Checking ···· 4821</div>
        </div>
        <div class="tag">In progress</div>
      </div>
      <div class="amount">
        <div class="value">$1,240.00</div>
        <div class="unit">USD</div>
      </div>
      <div class="track"><div class="fill"></div></div>
      <div class="foot">
        <div class="step">
          <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true">
            <circle cx="7" cy="7" r="6" fill="none" stroke="#2F6BFF" stroke-width="2"></circle>
            <path d="M7 3.6V7l2.3 1.4" fill="none" stroke="#2F6BFF" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <span>Clearing · step 2 of 3</span>
        </div>
        <div class="eta">Arrives 3:42 PM</div>
      </div>
      <div class="actions">
        <div class="btn ghost">View receipt</div>
        <div class="btn primary">Share status</div>
      </div>
    </div>
    <div class="note">Reference KP-77104 · Sent today at 3:12 PM</div>
  </div>
</body>
</html>
