<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d8d1;
      color: #282a23;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 560px;
      padding: 28px 28px 112px;
      background: #f5f3eb;
    }

    .accent-rule {
      width: 44px;
      border-top: 3px solid #a33d29;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 29px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .intro {
      max-width: 310px;
      margin: 6px 0 0;
      color: #65675d;
      font-size: 14px;
      line-height: 1.4;
    }

    .episode {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 18px;
      padding: 11px;
      border: 1px solid #d8d5ca;
      background: #eeece3;
    }

    .episode-glyph {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      background: #282a23;
      color: #ffffff;
    }

    .episode-glyph svg {
      width: 30px;
      height: 30px;
    }

    .episode-copy {
      min-width: 0;
    }

    .episode-title {
      margin: 0;
      color: #282a23;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
    }

    .episode-meta {
      margin: 4px 0 0;
      color: #72746a;
      font-size: 13px;
      line-height: 1.3;
    }

    .destination {
      margin-top: 19px;
      padding: 0;
      border: 0;
    }

    .destination legend {
      width: 100%;
      padding: 0 0 8px;
      font-family: 'Playfair Display', Georgia, serif;
      color: #282a23;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 600;
    }

    .choice {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 7px;
      padding: 9px 11px;
      border: 1px solid #d1d0c6;
      background: #faf9f4;
      cursor: pointer;
    }

    .choice:first-of-type {
      margin-top: 0;
    }

    .choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: grid;
      place-items: center;
      border: 1.5px solid #8a8d7e;
      border-radius: 50%;
      background: #ffffff;
    }

    .radio::after {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      content: "";
    }

    .choice:has(input:checked) {
      border: 2px solid #282a23;
      padding: 8px 10px;
      background: #ffffff;
    }

    .choice input:checked + .radio {
      border-color: #a33d29;
    }

    .choice input:checked + .radio::after {
      background: #a33d29;
    }

    .choice-name {
      color: #33352e;
      font-size: 14px;
      line-height: 1.3;
    }

    .choice input:checked ~ .choice-name {
      color: #282a23;
      font-weight: 600;
    }

    .action-wrap {
      position: absolute;
      right: 28px;
      bottom: 24px;
      left: 28px;
    }

    .action-note {
      margin: 0 0 7px;
      color: #65675d;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0.45px;
      text-transform: uppercase;
    }

    .save-button {
      width: 100%;
      padding: 15px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #7e2c1d;
      border-radius: 4px;
      background: #a33d29;
      box-shadow: 4px 4px 0 #282a23;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .confirm-mark {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      color: #a33d29;
      font-size: 17px;
      line-height: 1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="save-title">
      <div class="accent-rule" aria-hidden="true"></div>

      <header>
        <h1 id="save-title">Save this episode</h1>
        <p class="intro">Choose one collection, then confirm your choice.</p>
      </header>

      <div class="episode" aria-label="Episode to save">
        <div class="episode-glyph" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="15" y="6" width="10" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10.5 18.5C10.5 24.2 14.6 28 20 28C25.4 28 29.5 24.2 29.5 18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M20 28V34M15.5 34H24.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M6 11C3.7 13.5 3.7 17.5 6 20M34 11C36.3 13.5 36.3 17.5 34 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="episode-copy">
          <p class="episode-title">Why Silence Shapes a Song</p>
          <p class="episode-meta">The Listening Room · 42 min</p>
        </div>
      </div>

      <form>
        <fieldset class="destination">
          <legend>Choose a collection</legend>

          <label class="choice">
            <input type="radio" name="collection" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Field Notes</span>
          </label>

          <label class="choice">
            <input type="radio" name="collection">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Sound and Memory</span>
          </label>

          <label class="choice">
            <input type="radio" name="collection">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-name">Long Conversations</span>
          </label>
        </fieldset>

        <div class="action-wrap">
          <p class="action-note">Selected: Field Notes</p>
          <button class="save-button" type="button">
            <span>Confirm and save</span>
            <span class="confirm-mark" aria-hidden="true">✓</span>
          </button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
