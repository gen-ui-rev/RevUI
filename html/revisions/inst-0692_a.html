<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightwave — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { background: #e6e7ea; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 0;
    margin: 0;
    background: #e6e7ea;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 46px 24px;
    background: #e6e7ea;
  }
  .banner {
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10);
    padding: 16px 18px 18px;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .head .mark {
    display: block;
    flex: none;
  }
  .head .app {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #0369a1;
  }
  .head .state {
    margin-left: auto;
    font-size: 12px;
    color: #78808c;
  }
  .body {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-top: 16px;
  }
  .art {
    width: 76px;
    height: 76px;
    border-radius: 6px;
    object-fit: cover;
    display: block;
    background: #d4d6db;
    flex: none;
  }
  .meta {
    min-width: 0;
    padding-top: 1px;
  }
  .title {
    margin: 0;
    color: #14181f;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.2;
  }
  .show {
    margin: 6px 0 0;
    color: #5d6570;
    font-size: 14px;
    line-height: 1.35;
  }
  .summary {
    margin: 4px 0 0;
    color: #78808c;
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .host {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .mono {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .host span {
    min-width: 0;
    color: #78808c;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track {
    height: 5px;
    margin-top: 20px;
    border-radius: 6px;
    background: #e4e6ea;
  }
  .fill {
    width: 58%;
    height: 5px;
    border-radius: 6px;
    background: #0284c7;
  }
  .times {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 9px;
    color: #78808c;
    font-size: 12px;
  }
  .remaining {
    padding: 3px 8px;
    border-radius: 999px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="7" fill="none" stroke="#0284c7" stroke-width="1.5"/>
          <circle cx="8" cy="8" r="2" fill="#0284c7"/>
        </svg>
        <span class="app">Nightwave</span>
        <span class="state">Now playing</span>
      </div>

      <div class="body">
        <img class="art" src="https://loremflickr.com/76/76/vinyl?lock=9261" width="76" height="76" alt="Episode artwork: a record spinning on a turntable">
        <div class="meta">
          <h1 class="title">The Long Way Around</h1>
          <p class="show">Slow Static · Season 3, Episode 8</p>
          <p class="summary">A midnight drive reveals the hidden history of a forgotten coastal road.</p>
          <div class="host">
            <div class="mono">MH</div>
            <span>Hosted by Marta Held</span>
          </div>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="times">
        <span>24:18 elapsed</span>
        <strong class="remaining">17:34 left</strong>
      </div>
    </div>
  </div>
</body>
</html>
