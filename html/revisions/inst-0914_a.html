<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfare Health — Telehealth Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 0;margin:0;background:#d9d5cd;font-family:'Source Serif 4',Georgia,serif;}
  .screen{width:390px;height:844px;background:#fff;color:#18201e;display:flex;flex-direction:column;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;}
  .topbar span{font-size:15px;font-weight:600;letter-spacing:.01em;}
  .iconbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#343d3a;}
  .hero{padding:15px 16px 18px;}
  .mono{width:66px;height:66px;border-radius:14px;background:#16766d;color:#fff;font-size:23px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;}
  .name{font-size:25px;font-weight:600;margin:13px 0 0;line-height:1.15;}
  .role{font-size:15px;color:#66716d;margin:4px 0 0;}
  .dur{font-size:14px;font-weight:600;color:#16766d;margin:9px 0 0;display:flex;align-items:center;gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#16766d;display:block;}
  .sect{border-top:1px solid #e1e7e4;padding:13px 16px;}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#7b8581;margin:0 0 9px;}
  .stay{display:flex;gap:11px;align-items:center;}
  .stay img,.shots img{object-fit:cover;display:block;background:#cbd2cf;border-radius:10px;}
  .stay .txt{min-width:0;flex:1;}
  .stay .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stay .m{font-size:13px;color:#66716d;margin-top:3px;line-height:1.25;}
  .status{font-size:12px;font-weight:600;color:#16766d;background:#e7f3f0;border-radius:12px;padding:5px 8px;white-space:nowrap;}
  .shots{display:flex;gap:8px;}
  .spacer{flex:1;}
  .controls{display:flex;justify-content:space-between;padding:0 10px 3px;}
  .ctl{width:68px;text-align:center;}
  .ctl .circ{width:52px;height:52px;border-radius:12px;background:#edf1ef;color:#303936;display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .ctl.on .circ{background:#16766d;color:#fff;}
  .ctl.note .circ{background:#e7f3f0;color:#11665e;border:1px solid #c9e1dc;box-sizing:border-box;}
  .ctl .cl{font-size:12px;color:#505b57;margin-top:6px;}
  .end{margin:14px 16px 13px;height:52px;border-radius:12px;background:#b64038;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;}
  .tabs{border-top:1px solid #e1e7e4;display:flex;padding:8px 8px 11px;}
  .tab{flex:1;text-align:center;color:#818a86;}
  .tab.active{color:#16766d;}
  .tab .tl{font-size:12px;margin-top:2px;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="iconbtn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span>Telehealth visit</span>
    <div class="iconbtn" aria-label="Minimize call">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 14h6v6"/><path d="M19 10h-6V4"/></svg>
    </div>
  </div>

  <div class="hero">
    <div class="mono">DR</div>
    <h1 class="name">Dr. Rowan Ellis</h1>
    <p class="role">Family medicine · Harbor Health Clinic</p>
    <p class="dur"><span class="dot"></span>07:42 · Secure audio call</p>
  </div>

  <div class="sect">
    <p class="lbl">Today’s appointment</p>
    <div class="stay">
      <img src="https://loremflickr.com/64/64/hotel?lock=12080" width="64" height="64" alt="Harbor Health Clinic consultation room">
      <div class="txt">
        <div class="t">Follow-up consultation</div>
        <div class="m">Mar 18 · 10:30 AM</div>
      </div>
      <div class="status">In visit</div>
    </div>
  </div>

  <div class="sect">
    <p class="lbl">Mobility photos shared</p>
    <div class="shots">
      <img src="https://loremflickr.com/114/76/beach?lock=12081" width="114" height="76" alt="Walking route along the cove">
      <img src="https://loremflickr.com/114/76/mountain?lock=12082" width="114" height="76" alt="Inclined trail used during recovery">
      <img src="https://loremflickr.com/114/76/cityscape?lock=12083" width="114" height="76" alt="Waterfront walking route">
    </div>
  </div>

  <div class="spacer"></div>

  <div class="controls">
    <div class="ctl">
      <div class="circ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/><path d="M4 4l16 16"/></svg>
      </div>
      <div class="cl">Muted</div>
    </div>
    <div class="ctl on">
      <div class="circ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 9H4v6h2.5L11 19V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>
      </div>
      <div class="cl">Speaker</div>
    </div>
    <div class="ctl">
      <div class="circ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="6" r="1.5"/><circle cx="12" cy="6" r="1.5"/><circle cx="17" cy="6" r="1.5"/><circle cx="7" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="7" cy="18" r="1.5"/><circle cx="12" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
      </div>
      <div class="cl">Keypad</div>
    </div>
    <div class="ctl">
      <div class="circ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="12" height="11" rx="2.5"/><path d="M15 11l6-3.5v9L15 13z"/></svg>
      </div>
      <div class="cl">Video</div>
    </div>
    <div class="ctl note">
      <div class="circ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M16 4v4h3"/><path d="M8 12h8M8 16h6"/></svg>
      </div>
      <div class="cl">Note</div>
    </div>
  </div>

  <div class="end">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5c5-3.5 11-3.5 16 0v3.2l-3.6.6-1-2.6a11 11 0 0 0-6.8 0l-1 2.6-3.6-.6z"/><path d="M19 17l2 2"/><path d="M21 17l-2 2"/></svg>
    End visit
  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-4.4 7-10V5l-7-2-7 2v6c0 5.6 7 10 7 10z"/><path d="M9 12h6M12 9v6"/></svg>
      <div class="tl">Care</div>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="15" rx="2.5"/><path d="M7 3v5M17 3v5M3 10h18"/></svg>
      <div class="tl">Visits</div>
    </div>
    <div class="tab active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>
      <div class="tl">Messages</div>
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.5-3.6 4-5.2 7-5.2s5.5 1.6 7 5.2"/></svg>
      <div class="tl">Profile</div>
    </div>
  </div>

</div>
</body>
</html>
