<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trash &amp; Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ece8;
      color: #202622;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 24px;
      background: #fbfcfa;
    }

    .component {
      width: 100%;
    }

    .heading {
      margin: 0;
      font-size: 25px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 7px 0 0;
      color: #68716a;
      font-size: 14px;
      line-height: 1.55;
    }

    .tabs {
      display: flex;
      gap: 26px;
      margin-top: 21px;
      border-bottom: 1px solid #dce2dd;
    }

    .tab {
      position: relative;
      padding: 0 0 11px;
      border: 0;
      background: transparent;
      color: #7a827c;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .tab.active {
      color: #176b42;
      font-weight: 600;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 3px;
      border-radius: 10px 10px 0 0;
      background: #218653;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-bottom: 6px;
    }

    .list-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
    }

    .sort-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid #dce2dd;
      border-radius: 999px;
      background: #f2f5f2;
      color: #4b534d;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 500;
      white-space: nowrap;
    }

    .sort-control svg {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      color: #7a827c;
    }

    .item-list {
      border-top: 1px solid #dce2dd;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #dce2dd;
    }

    .thumbnail {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #d8ded9;
    }

    .item-copy {
      min-width: 0;
      flex: 1;
    }

    .item-name {
      margin: 0;
      overflow: hidden;
      color: #252b27;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-meta {
      margin: 4px 0 0;
      overflow: hidden;
      color: #7a827c;
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .restore {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #218653;
      border-radius: 10px;
      background: transparent;
      color: #176b42;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
    }

    .danger-action {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #a01f17;
      border-radius: 12px;
      background: #b3261e;
      color: #fff;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
      text-align: center;
    }

    .boundary-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 10px;
      color: #68716a;
      font-size: 12px;
      line-height: 1.5;
    }

    .boundary-note svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      margin-top: 1px;
      color: #b3261e;
    }

    .boundary-note p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="page-title">
      <header>
        <h1 class="heading" id="page-title">Trash &amp; Archive</h1>
        <p class="intro">Restore work, or clear the trash for good.</p>
      </header>

      <nav class="tabs" aria-label="Removed item categories">
        <button class="tab" type="button">Archived 2</button>
        <button class="tab active" type="button" aria-current="page">Trash 3</button>
      </nav>

      <section aria-labelledby="recently-removed-title">
        <div class="list-header">
          <h2 class="list-title" id="recently-removed-title">Recently removed</h2>
          <button class="sort-control" type="button">
            Oldest first
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="item-list">
          <article class="item">
            <img class="thumbnail" src="https://loremflickr.com/52/52/notebook?lock=7692" width="52" height="52" alt="Notebook cover for product research">
            <div class="item-copy">
              <h3 class="item-name">Product research log</h3>
              <p class="item-meta">Removed Jun 8 · 8 days left</p>
            </div>
            <button class="restore" type="button">Restore</button>
          </article>

          <article class="item">
            <img class="thumbnail" src="https://loremflickr.com/52/52/meeting?lock=7691" width="52" height="52" alt="Team meeting cover for the client workshop">
            <div class="item-copy">
              <h3 class="item-name">Client workshop notes</h3>
              <p class="item-meta">Removed Jun 14 · 14 days left</p>
            </div>
            <button class="restore" type="button">Restore</button>
          </article>

          <article class="item">
            <img class="thumbnail" src="https://loremflickr.com/52/52/desk?lock=7690" width="52" height="52" alt="Desk cover for the launch plan">
            <div class="item-copy">
              <h3 class="item-name">Summer launch plan</h3>
              <p class="item-meta">Removed Jun 17 · 17 days left</p>
            </div>
            <button class="restore" type="button">Restore</button>
          </article>
        </div>

        <button class="danger-action" type="button">Empty trash · Delete all 3 items</button>

        <div class="boundary-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 10.6V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7.6" r="1" fill="currentColor"/>
          </svg>
          <p>Emptying the trash cannot be undone.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
