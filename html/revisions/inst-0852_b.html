<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Care Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e9ed;
      color: #202026;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      display: flex;
      flex-direction: column;
      background: #f6f6f8;
    }

    .top-bar {
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      border-bottom: 1px solid #ddddE4;
    }

    .top-bar-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
    }

    .skip-button {
      padding: 7px 10px;
      border: 1px solid #d8ccef;
      border-radius: 5px;
      background: #ffffff;
      color: #6037b1;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .content {
      padding: 24px 20px 22px;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .prompt {
      padding: 22px 20px;
      border: 1px solid #d7c8f1;
      border-radius: 10px;
      background: #f0eafd;
      box-shadow: inset 0 4px 0 #6d43c0;
    }

    .prompt-heading {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .pin-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: none;
      color: #ffffff;
      background: #6d43c0;
      border-radius: 50%;
    }

    .pin-mark svg {
      width: 21px;
      height: 21px;
    }

    h1 {
      margin: 0 0 2px;
      color: #4f2a9a;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .eyebrow {
      margin: 0;
      color: #7657ae;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
    }

    .intro {
      margin: 0 0 18px;
      color: #514b5b;
      font-size: 14px;
      line-height: 1.5;
    }

    .plan {
      padding: 14px 15px;
      background: #ffffff;
      border: 1px solid #d7c8f1;
      border-radius: 6px;
    }

    .plan-name {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
    }

    .plan-meta {
      margin: 0;
      color: #62606a;
      font-size: 13px;
      line-height: 1.45;
    }

    .privacy-note {
      margin: 15px 2px 0;
      color: #625d6b;
      font-size: 12px;
      line-height: 1.5;
    }

    .actions {
      margin-top: auto;
      padding-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 10px;
    }

    .secondary-button,
    .pin-button {
      padding: 11px 12px;
      border-radius: 5px;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .secondary-button {
      border: 1px solid #cfcfd7;
      background: #ffffff;
      color: #4f4f58;
    }

    .pin-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      border: 1px solid #6d43c0;
      background: #6d43c0;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(109, 67, 192, 0.18);
    }

    .pin-button svg {
      width: 16px;
      height: 16px;
      flex: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <p class="top-bar-title">Care plan</p>
      <button class="skip-button" type="button" aria-label="Skip pinning this care plan">Skip</button>
    </header>

    <main class="content">
      <section class="prompt" aria-labelledby="pin-title">
        <div class="prompt-heading">
          <div class="pin-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
              <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h1 id="pin-title">Pin for easy access</h1>
            <p class="eyebrow">Optional</p>
          </div>
        </div>

        <p class="intro">Place this plan at the top of Home so your next exercise session is easy to find.</p>

        <div class="plan">
          <p class="plan-name">Lower back recovery</p>
          <p class="plan-meta">4 exercises · Next session June 18</p>
        </div>

        <p class="privacy-note">Only your Home layout changes. Your care team will not be notified.</p>
      </section>

      <div class="actions" aria-label="Pinning choices">
        <button class="secondary-button" type="button">Leave as is</button>
        <button class="pin-button" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
            <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Pin to Home
        </button>
      </div>
    </main>
  </div>
</body>
</html>
