<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northpath Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e9ed;
      color: #1d1920;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      position: relative;
      width: 1024px;
      height: 768px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(29, 25, 32, 0.12);
    }

    .top-bar {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #efebee;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #d20f8c;
    }

    .bar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .saved-button {
      padding: 9px 16px 9px 12px;
      border: 1px solid #e4dee2;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #433943;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .saved-button svg {
      color: #d20f8c;
    }

    .saved-count {
      padding: 1px 7px;
      border-radius: 999px;
      background: #fbe6f3;
      color: #a20a6c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
    }

    .sign-in {
      padding: 9px 14px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #6c626c;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .welcome {
      flex: 1;
      display: flex;
      align-items: stretch;
    }

    .pane {
      flex: 1;
      padding: 48px 44px 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #d20f8c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 460px;
      margin: 0;
      color: #1d1920;
      font-size: 48px;
      line-height: 55px;
      font-weight: 700;
      letter-spacing: -1.6px;
    }

    .description {
      max-width: 430px;
      margin: 18px 0 0;
      color: #6c626c;
      font-size: 16px;
      line-height: 26px;
      font-weight: 400;
    }

    .facts {
      margin: 26px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
    }

    .facts li {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #433943;
      font-size: 13px;
      line-height: 20px;
      font-weight: 700;
    }

    .facts li::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d20f8c;
    }

    .actions {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .primary-button {
      min-width: 210px;
      min-height: 52px;
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #d20f8c;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .secondary-button {
      min-height: 52px;
      padding: 14px 22px;
      border: 1px solid #ddd5da;
      border-radius: 12px;
      background: #ffffff;
      color: #433943;
      font: inherit;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .supporting-note {
      margin: 14px 0 0;
      color: #817681;
      font-size: 13px;
      line-height: 20px;
      font-weight: 500;
    }

    .visual {
      padding: 40px 40px 40px 0;
    }

    .hero {
      width: 460px;
      height: 616px;
      border-radius: 18px;
      object-fit: cover;
      object-position: center;
      display: block;
      background: #d8d2d7;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar" aria-label="App navigation">
      <div class="brand" aria-label="Northpath">
        <span class="brand-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M15 3.5L19.1 10.9L26.5 15L19.1 19.1L15 26.5L10.9 19.1L3.5 15L10.9 10.9L15 3.5Z" fill="currentColor"/>
            <circle cx="15" cy="15" r="3.2" fill="white"/>
          </svg>
        </span>
        <span>Northpath</span>
      </div>
      <div class="bar-nav">
        <button class="saved-button" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M9 15.2C9 15.2 2.4 11.4 2.4 6.9C2.4 5 3.9 3.5 5.8 3.5C7 3.5 8.3 4.2 9 5.4C9.7 4.2 11 3.5 12.2 3.5C14.1 3.5 15.6 5 15.6 6.9C15.6 11.4 9 15.2 9 15.2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Saved stays</span>
          <span class="saved-count">4</span>
        </button>
        <button class="sign-in" type="button">Sign in</button>
      </div>
    </header>

    <main class="welcome">
      <div class="pane">
        <section class="copy" aria-labelledby="welcome-title">
          <p class="eyebrow">Stays for every route</p>
          <h1 id="welcome-title">Find the right place for your next trip.</h1>
          <p class="description">Compare stays along your route, save the ones that fit, and book when your plans are ready.</p>
          <ul class="facts">
            <li>Free cancellation filters</li>
            <li>Verified guest reviews</li>
            <li>Prices with taxes shown</li>
          </ul>
        </section>

        <div class="actions">
          <button class="primary-button" type="button">
            <span>Explore stays</span>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4.5 10H15.5M11 5.5L15.5 10L11 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="secondary-button" type="button">View saved stays</button>
        </div>
        <p class="supporting-note">No account needed to browse.</p>
      </div>

      <div class="visual">
        <img
          class="hero"
          src="https://loremflickr.com/460/616/hotel?lock=2250"
          width="460"
          height="616"
          alt="A quiet hotel overlooking the coast"
        >
      </div>
    </main>
  </div>
</body>
</html>
