<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Comment Permissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd7;
      color: #282321;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px;
      background: #f7f5f3;
    }

    .picker {
      width: 100%;
      padding: 20px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 1px 0 rgba(45, 40, 38, 0.06);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #b8322e;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #2d2826;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .intro {
      margin: 6px 0 0;
      color: #6c6460;
      font-size: 13px;
      line-height: 1.45;
    }

    .scope {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 14px;
      padding: 11px 12px;
      background: #f4efeb;
      border-left: 3px solid #c83f3a;
      border-radius: 5px;
    }

    .scope-icon {
      width: 28px;
      height: 32px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      color: #b8322e;
      background: #ffffff;
      border: 1px solid #ded7d2;
      border-radius: 4px;
    }

    .scope-icon svg {
      width: 15px;
      height: 17px;
      display: block;
    }

    .scope-copy {
      min-width: 0;
    }

    .scope-label {
      display: block;
      color: #807570;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scope-name {
      display: block;
      margin-top: 1px;
      overflow: hidden;
      color: #302a28;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    fieldset {
      min-width: 0;
      margin: 16px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 8px;
      padding: 0;
      color: #4d4642;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .choice {
      position: relative;
    }

    .choice + .choice {
      margin-top: 7px;
    }

    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 11px;
      background: #f3f1ef;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .choice input:checked + label {
      background: rgba(200, 63, 58, 0.09);
      border-color: rgba(200, 63, 58, 0.32);
    }

    .choice input:focus-visible + label {
      box-shadow: 0 0 0 3px rgba(200, 63, 58, 0.18);
    }

    .choice-copy {
      min-width: 0;
      flex: 1;
    }

    .choice-title {
      display: block;
      color: #2d2826;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .choice-description {
      display: block;
      margin-top: 1px;
      color: #716965;
      font-size: 11px;
      line-height: 1.4;
    }

    .mark {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      background: #ded9d6;
      border-radius: 50%;
    }

    .mark svg {
      width: 14px;
      height: 14px;
      display: block;
      opacity: 0;
    }

    .choice input:checked + label .mark {
      background: #c83f3a;
    }

    .choice input:checked + label .mark svg {
      opacity: 1;
    }

    .apply {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: #b8322e;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .apply:focus-visible {
      outline: 3px solid rgba(200, 63, 58, 0.24);
      outline-offset: 2px;
    }

    .note {
      margin: 8px 0 0;
      color: #746c68;
      font-size: 10px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="permission-heading">
      <p class="eyebrow">Comment settings</p>
      <h1 id="permission-heading">Who can comment?</h1>
      <p class="intro">Choose who can start or join comment threads.</p>

      <section class="scope" aria-label="Permission scope">
        <span class="scope-icon" aria-hidden="true">
          <svg viewBox="0 0 15 17" fill="none">
            <path d="M3 1.5h6l3 3V15.5H3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M9 1.5v3h3M5.3 8h4.4M5.3 10.8h4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="scope-copy">
          <span class="scope-label">Applies to this document</span>
          <span class="scope-name">Q3 Product Launch Brief</span>
        </span>
      </section>

      <form>
        <fieldset>
          <legend>Select comment access</legend>

          <div class="choice">
            <input type="radio" id="comment-workspace" name="comment-permission">
            <label for="comment-workspace">
              <span class="choice-copy">
                <span class="choice-title">Everyone in the workspace</span>
                <span class="choice-description">Any workspace member can comment.</span>
              </span>
              <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>
          </div>

          <div class="choice">
            <input type="radio" id="comment-editors" name="comment-permission" checked>
            <label for="comment-editors">
              <span class="choice-copy">
                <span class="choice-title">Editors and invited commenters</span>
                <span class="choice-description">Only people with explicit access.</span>
              </span>
              <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>
          </div>

          <div class="choice">
            <input type="radio" id="comment-managers" name="comment-permission">
            <label for="comment-managers">
              <span class="choice-copy">
                <span class="choice-title">Workspace managers only</span>
                <span class="choice-description">Restrict comments to managers.</span>
              </span>
              <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                  <path d="M3.25 8.2 6.45 11.25 12.75 4.9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </label>
          </div>
        </fieldset>

        <button class="apply" type="submit">Apply comment permissions</button>
      </form>

      <p class="note">Existing comments will remain visible.</p>
    </main>
  </div>
</body>
</html>
