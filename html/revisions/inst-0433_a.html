<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Reserve Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eeee;
      color: #172326;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 42px 24px;
      background: #f8faf9;
    }

    .empty-state {
      width: 100%;
      padding: 26px 28px 28px;
      border: 1px solid #cbd5d6;
      border-top: 3px solid #007f98;
      border-radius: 0;
      background: #ffffff;
    }

    .section-label {
      margin: 0 0 16px;
      color: #007f98;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .estimate-notice {
      padding: 11px 13px;
      margin: 0 0 20px;
      border: 1px solid #d4dce6;
      border-left: 3px solid #1b2a5e;
      background: #f2f5fa;
    }

    .estimate-notice .notice-head {
      display: block;
      margin-bottom: 3px;
      color: #1b2a5e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .estimate-notice p {
      margin: 0;
      color: #3f4c54;
      font-size: 13.5px;
      line-height: 1.45;
    }

    .empty-mark {
      width: 60px;
      padding: 13px;
      margin: 0 0 22px;
      border: 1px solid #9bcbd4;
      border-radius: 0;
      background: #edf9fb;
      color: #007f98;
    }

    .empty-mark svg {
      display: block;
      width: 32px;
      height: 32px;
    }

    h1 {
      margin: 0 0 11px;
      color: #172326;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .description {
      margin: 0 0 22px;
      color: #566366;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
    }

    .primary-action {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #1b2a5e;
      border-radius: 6px;
      background: #1b2a5e;
      color: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <p class="section-label">Cove Ledger · Tax Reserves</p>

      <div class="estimate-notice">
        <span class="notice-head">Estimate schedule</span>
        <p>Your quarterly tax estimate now registers on Apr 1, the first business day of the quarter.</p>
      </div>

      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.5 3.5H25.5V30.5L22.7 28.4L19.8 30.5L17 28.4L14.2 30.5L11.3 28.4L8.5 30.5V3.5Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12.5 11.5H21.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12.5 17.5H21.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12.5 23H18" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </div>

      <h1 id="empty-title">Reserve for self-employed taxes</h1>
      <p class="description">Set aside a share of each client payment for quarterly taxes.</p>
      <a class="primary-action" href="#" aria-label="Set up a tax reserve">Set up a tax reserve</a>
    </section>
  </div>
</body>
</html>
