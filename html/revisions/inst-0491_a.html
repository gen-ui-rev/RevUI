<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E9E8EC;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    background:#1B1620;
    border-radius:36px;
    box-sizing:border-box;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
  }
  .badge{
    width:30px;
    height:30px;
    border-radius:50%;
    background:#8C6C92;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .status{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:#E7DCE9;
    margin-top:7px;
  }
  .stay{
    font-size:15px;
    font-weight:700;
    color:#FFFFFF;
    margin-top:3px;
    max-width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dates{
    font-size:19px;
    font-weight:700;
    color:#D8C2DB;
    letter-spacing:-0.2px;
    margin-top:8px;
  }
  .times{
    font-size:10.5px;
    font-weight:400;
    color:#948C9E;
    margin-top:3px;
  }
  .code{
    margin-top:9px;
    background:rgba(140,108,146,0.24);
    color:#D3BAD7;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:4px 10px;
    border-radius:999px;
  }
  .cta{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin-top:11px;
    background:#8C6C92;
    color:#FFFFFF;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
    padding:9px 0;
    border-radius:15px;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="badge">
      <svg width="17" height="17" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M8 15.4L12.9 20.2L22.4 10.4" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="status">Confirmed</div>
    <div class="stay">Halden House</div>

    <div class="dates">Mar 14 – 17</div>
    <div class="times">In 3:00 PM · Out 11:00 AM</div>

    <div class="code">KH-48213</div>

    <a class="cta" href="#">Itinerary</a>

  </div>
</body>
</html>
