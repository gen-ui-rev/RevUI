<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e8e2;
      color: #20221d;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #f7f8f3;
    }

    .delete-panel {
      width: 100%;
      padding: 18px 16px;
      background: #ffffff;
      border: 1px solid #cfd2c8;
      border-radius: 4px;
    }

    .trip {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid #e0e3da;
    }

    .trip img {
      width: 88px;
      height: 76px;
      flex: 0 0 auto;
      object-fit: cover;
      display: block;
      background: #d9ddd3;
      border-radius: 4px;
    }

    .trip-details {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #596052;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .trip-name {
      margin: 0 0 3px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .trip-meta {
      margin: 0;
      color: #5b6057;
      font-size: 13.5px;
      line-height: 1.35;
    }

    h1 {
      margin: 14px 0 4px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .intro {
      margin: 0 0 12px;
      color: #4d5249;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .option {
      border-radius: 4px;
    }

    .option-primary {
      padding: 14px;
      background: #f6fbe7;
      border: 1px solid #94bd26;
    }

    .badge {
      display: inline-block;
      margin: 0 0 8px;
      padding: 2px 8px;
      background: #b7e63c;
      border-radius: 999px;
      color: #23290f;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .option-title {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
    }

    .option-copy {
      margin: 0;
      color: #454a41;
      font-size: 13.5px;
      line-height: 1.4;
    }

    button {
      margin: 0;
      border-radius: 4px;
      font: 600 15px/1.3 'Source Serif 4', Georgia, serif;
      cursor: pointer;
    }

    .archive-button {
      width: 100%;
      margin-top: 12px;
      padding: 12px 14px;
      color: #1d2117;
      background: #b7e63c;
      border: 1px solid #94bd26;
      font-size: 16px;
    }

    .option-secondary {
      margin-top: 10px;
      padding: 12px 14px;
      background: #fafbf7;
      border: 1px solid #d8dbd2;
    }

    .option-secondary .option-title {
      font-size: 15px;
      font-weight: 600;
    }

    .option-secondary .option-copy {
      color: #5b6057;
      font-size: 13px;
    }

    .delete-button {
      margin-top: 10px;
      padding: 8px 14px;
      color: #4f4038;
      background: #ffffff;
      border: 1px solid #b9b2a8;
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="delete-panel" aria-labelledby="remove-title">
      <div class="trip">
        <img src="https://loremflickr.com/88/76/hotel?lock=10290" width="88" height="76" alt="Coastal hotel reserved for the Monterey trip">
        <div class="trip-details">
          <p class="eyebrow">Northway trip</p>
          <p class="trip-name">Monterey coast weekend</p>
          <p class="trip-meta">Tideglass Inn</p>
          <p class="trip-meta">May 16–18, 2026</p>
        </div>
      </div>

      <h1 id="remove-title">Remove this trip</h1>
      <p class="intro">Choose what happens to the itinerary, notes, and saved places.</p>

      <section class="option option-primary">
        <span class="badge">Recommended</span>
        <p class="option-title">Archive</p>
        <p class="option-copy">Hides the trip and keeps every detail available.</p>
        <button class="archive-button" type="button">Archive trip</button>
      </section>

      <section class="option option-secondary">
        <p class="option-title">Delete permanently</p>
        <p class="option-copy">Erases everything. This cannot be undone.</p>
        <button class="delete-button" type="button">Delete permanently</button>
      </section>
    </main>
  </div>
</body>
</html>
