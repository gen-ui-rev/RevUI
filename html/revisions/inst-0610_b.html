<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Booking Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e5;
      color: #252225;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f7f6f5;
    }

    .goal-card {
      padding: 26px 24px 22px;
      background: #ffffff;
      border: 1px solid #dedbdd;
      border-radius: 10px;
    }

    .service {
      margin: 0 0 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e6e2e5;
      color: #777176;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card-body {
      display: flex;
      align-items: stretch;
      gap: 22px;
    }

    .gauge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .percentage {
      color: #c026a7;
      font-size: 26px;
      line-height: 1;
      font-weight: 600;
    }

    .gauge-track {
      position: relative;
      width: 14px;
      height: 214px;
      background: #eee9ed;
      border-radius: 10px;
      overflow: hidden;
    }

    .gauge-fill {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 68%;
      background: #c026a7;
      border-radius: 10px;
    }

    .gauge-foot {
      color: #777176;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .details {
      flex: 1;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 600;
    }

    .trip-date {
      margin: 6px 0 18px;
      color: #6f696e;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 400;
    }

    .ledger {
      margin: 0;
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-top: 1px solid #e6e2e5;
    }

    .row:last-child {
      border-bottom: 1px solid #e6e2e5;
    }

    .row dt {
      color: #777176;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .row dd {
      margin: 0;
      color: #252225;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 600;
      white-space: nowrap;
    }

    .row.highlight dt,
    .row.highlight dd {
      color: #c026a7;
    }

    .note {
      margin: 20px 0 0;
      padding-top: 16px;
      border-top: 1px solid #e6e2e5;
      color: #4e494d;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 400;
    }

    .note strong {
      color: #252225;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <p class="service">Roamstead trips</p>

      <div class="card-body">
        <div class="gauge">
          <span class="percentage">68%</span>
          <div class="gauge-track" role="progressbar" aria-label="Lisbon booking fund" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="1360">
            <div class="gauge-fill"></div>
          </div>
          <span class="gauge-foot">Funded</span>
        </div>

        <div class="details">
          <h1 id="goal-title">Lisbon booking goal</h1>
          <p class="trip-date">Stay planned for October 12–18, 2025</p>

          <dl class="ledger">
            <div class="row">
              <dt>Saved so far</dt>
              <dd>$1,360</dd>
            </div>
            <div class="row">
              <dt>Booking goal</dt>
              <dd>$2,000</dd>
            </div>
            <div class="row highlight">
              <dt>Still to go</dt>
              <dd>$640</dd>
            </div>
          </dl>
        </div>
      </div>

      <p class="note">Set aside <strong>$160 a week</strong> to reserve the stay before rates rise on September 5.</p>
    </section>
  </div>
</body>
</html>
