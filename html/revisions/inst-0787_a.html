<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Listening Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8e8;
      color: #292427;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 22px;
      background: #f8f6f6;
    }

    .progress-card {
      width: 100%;
      padding: 22px 24px 20px;
      border: 1px solid #ded8da;
      border-radius: 6px;
      background: #ffffff;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-card h1 {
      margin: 0;
      color: #2b2528;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .period {
      margin: 6px 0 0;
      color: #756c70;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .edit-btn {
      flex: none;
      margin-top: 2px;
      padding: 7px 14px;
      border: 1px solid #e6ccd4;
      border-radius: 999px;
      background: #ffffff;
      color: #c94f6d;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      cursor: pointer;
    }

    .ring-wrap {
      position: relative;
      width: 164px;
      margin: 22px auto 20px;
    }

    .ring {
      display: block;
      width: 164px;
      height: 164px;
    }

    .tick-track {
      fill: none;
      stroke: #ece7e9;
      stroke-width: 14;
      stroke-dasharray: 3 2;
      transform: rotate(-90deg);
      transform-origin: 82px 82px;
    }

    .tick-filled {
      fill: none;
      stroke: #c94f6d;
      stroke-width: 14;
      stroke-dasharray: 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 2 3 37;
      transform: rotate(-90deg);
      transform-origin: 82px 82px;
    }

    .inner-hair {
      fill: none;
      stroke: #f1ebed;
      stroke-width: 1;
    }

    .ring-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pct-chip {
      padding: 3px 9px;
      border-radius: 999px;
      background: #fdeef2;
      color: #c94f6d;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .minutes {
      margin-top: 8px;
      color: #2b2528;
      font-size: 34px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .minutes-label {
      margin-top: 6px;
      color: #62595d;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
    }

    .goal-details {
      padding-top: 16px;
      border-top: 1px solid #e4dfe1;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px dashed #efe9eb;
    }

    .detail-label {
      color: #7b7276;
      font-size: 12px;
      font-weight: 400;
    }

    .detail-value {
      color: #332d30;
      font-size: 13px;
      font-weight: 600;
    }

    .segment-note {
      margin: 14px 0 0;
      color: #8d8488;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="progress-card" aria-labelledby="goal-title">
      <div class="card-head">
        <div>
          <h1 id="goal-title">Weekly listening goal</h1>
          <p class="period">Monday through Sunday</p>
        </div>
        <button class="edit-btn" type="button">Edit goal</button>
      </div>

      <div class="ring-wrap" role="progressbar" aria-label="Weekly listening goal progress" aria-valuemin="0" aria-valuemax="300" aria-valuenow="204" aria-valuetext="204 of 300 minutes">
        <svg class="ring" viewBox="0 0 164 164" aria-hidden="true">
          <circle class="tick-track" cx="82" cy="82" r="70" pathLength="100"></circle>
          <circle class="tick-filled" cx="82" cy="82" r="70" pathLength="100"></circle>
          <circle class="inner-hair" cx="82" cy="82" r="60"></circle>
        </svg>
        <div class="ring-content">
          <div class="pct-chip">68% done</div>
          <div class="minutes">204</div>
          <div class="minutes-label">of 300 minutes</div>
        </div>
      </div>

      <div class="goal-details">
        <div class="detail-row">
          <span class="detail-label">Remaining this week</span>
          <span class="detail-value">96 minutes</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Goal resets</span>
          <span class="detail-value">Sunday, 12:00 AM</span>
        </div>
      </div>

      <p class="segment-note">Each segment marks 15 minutes of listening</p>
    </main>
  </div>
</body>
</html>
