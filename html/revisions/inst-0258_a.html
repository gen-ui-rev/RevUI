<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e8e6;
      color: #252729;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f5f5f3;
    }

    .block-result {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d7d8d6;
      border-radius: 10px;
    }

    /* Contact identity leads the card — it is the first thing read. */
    .person-lead {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px;
      border: 1px solid #d3dbd6;
      border-radius: 10px;
      background: #f4f8f5;
    }

    .avatar-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
    }

    .monogram {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #dedfdd;
      color: #3e4143;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .result-mark {
      position: absolute;
      right: -7px;
      bottom: -7px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background: #2e7d5b;
      color: #ffffff;
    }

    .result-mark svg {
      width: 15px;
      height: 15px;
    }

    .person-copy {
      min-width: 0;
    }

    .person-name {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 600;
    }

    .person-detail {
      margin: 3px 0 0;
      color: #6c7371;
      font-size: 14px;
      line-height: 1.25;
    }

    h1 {
      margin: 20px 0 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 29px;
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .summary {
      margin: 10px 0 0;
      color: #5f6264;
      font-size: 16px;
      line-height: 1.45;
    }

    .boundary-note {
      margin: 18px 0 0;
      padding-top: 17px;
      border-top: 1px solid #e0e1df;
      color: #5f6264;
      font-size: 14px;
      line-height: 1.45;
    }

    .boundary-note strong {
      color: #343638;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .secondary {
      border: 1px solid #cfd0ce;
      background: #ffffff;
      color: #3f4244;
    }

    .primary {
      border: 1px solid #4e5255;
      background: #4e5255;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="block-result" aria-labelledby="result-title">
      <header class="person-lead">
        <div class="avatar-wrap">
          <div class="monogram" aria-hidden="true">MQ</div>
          <span class="result-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M6.5 12.2 10.1 16l7.4-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <div class="person-copy">
          <p class="person-name">Maren Quill</p>
          <p class="person-detail">Contact ending in 1842</p>
        </div>
      </header>

      <h1 id="result-title">Block confirmed</h1>
      <p class="summary">Maren can no longer send you payment requests or messages in Northline. Past transfers remain in your activity.</p>

      <p class="boundary-note"><strong>Blocking is not a report.</strong> If a transfer looks unfamiliar, open that transfer and choose Get help.</p>

      <div class="actions">
        <button class="secondary" type="button">Unblock</button>
        <button class="primary" type="button">Done</button>
      </div>
    </main>
  </div>
</body>
</html>
