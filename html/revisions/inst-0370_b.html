<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Meal Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eaed;
      color: #20212a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px;
      background: #f5f5f7;
    }

    .meal-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d8d9df;
      border-radius: 4px;
    }

    .card-header {
      padding: 10px 14px;
      border-bottom: 1px solid #dedfe4;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #4f46b8;
      font-size: 11px;
      font-weight: 700;
      line-height: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      line-height: 24px;
      letter-spacing: -0.02em;
    }

    .running-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 7px 10px;
      border: 1px solid #cfcbe9;
      border-radius: 4px;
      background: #efedfb;
    }

    .rt-label {
      color: #56537f;
      font-size: 11px;
      font-weight: 600;
      line-height: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .rt-value {
      color: #322b6e;
      font-size: 18px;
      font-weight: 700;
      line-height: 22px;
      letter-spacing: -0.01em;
    }

    form {
      padding: 10px 14px 12px;
    }

    .step {
      position: relative;
      padding-left: 30px;
      padding-bottom: 12px;
    }

    .step::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 24px;
      bottom: 4px;
      width: 2px;
      background: #e6e4f4;
    }

    .step:last-child {
      padding-bottom: 0;
    }

    .step:last-child::before {
      display: none;
    }

    .step-num {
      position: absolute;
      left: 0;
      top: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #4f46b8;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .step-head h2 {
      flex: 1;
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 20px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #5f616c;
      font-size: 11px;
      font-weight: 500;
      line-height: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #cfd0d7;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #24252d;
      font-size: 13px;
      font-weight: 400;
      line-height: 20px;
    }

    .add-food {
      padding: 2px 8px;
      border: 1px solid #a9a6dc;
      border-radius: 4px;
      background: #ffffff;
      color: #4941a7;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
    }

    .food-list {
      border-top: 1px solid #dedfe4;
    }

    .food-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid #dedfe4;
    }

    .food-row img {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: block;
      object-fit: cover;
      border-radius: 4px;
      background: #d9dae0;
    }

    .food-copy {
      min-width: 0;
      flex: 1;
    }

    .food-name {
      margin: 0;
      overflow: hidden;
      color: #25262e;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .food-meta {
      margin: 0;
      color: #4f46b8;
      font-size: 11px;
      font-weight: 600;
      line-height: 15px;
    }

    .serving {
      flex: 0 0 58px;
      color: #71737e;
      font-size: 11px;
      font-weight: 500;
      line-height: 15px;
      text-align: right;
    }

    .review-line {
      margin: 0;
      overflow: hidden;
      padding: 8px 10px;
      border: 1px solid #dfe0e6;
      border-radius: 4px;
      background: #fafafc;
      color: #4c4e58;
      font-size: 12px;
      font-weight: 500;
      line-height: 17px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-line .check {
      color: #2f8a5b;
      font-weight: 700;
    }

    .create-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid #4338a8;
      border-radius: 4px;
      background: #4f46b8;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="meal-card" aria-labelledby="meal-title">
      <header class="card-header">
        <p class="eyebrow">Nourish Ledger · New entry</p>
        <h1 id="meal-title">Log a new meal</h1>
        <div class="running-total">
          <span class="rt-label">Running total · 3 foods</span>
          <span class="rt-value">655 cal</span>
        </div>
      </header>

      <form>
        <section class="step">
          <span class="step-num">1</span>
          <div class="step-head">
            <h2>Meal details</h2>
          </div>
          <div class="detail-grid">
            <div>
              <label for="meal-type">Meal type</label>
              <select id="meal-type" aria-label="Meal type">
                <option selected>Lunch</option>
                <option>Breakfast</option>
                <option>Dinner</option>
                <option>Snack</option>
              </select>
            </div>
            <div>
              <label for="meal-date">Date</label>
              <input id="meal-date" type="text" value="May 18, 2025" readonly>
            </div>
          </div>
        </section>

        <section class="step">
          <span class="step-num">2</span>
          <div class="step-head">
            <h2>Foods</h2>
            <button class="add-food" type="button">Add food</button>
          </div>
          <div class="food-list">
            <div class="food-row">
              <img src="https://loremflickr.com/32/32/salad?lock=5270" width="32" height="32" alt="Chicken and grain salad bowl">
              <div class="food-copy">
                <p class="food-name">Chicken grain bowl</p>
                <p class="food-meta">+420 cal</p>
              </div>
              <span class="serving">1 bowl</span>
            </div>

            <div class="food-row">
              <img src="https://loremflickr.com/32/32/fruit?lock=5271" width="32" height="32" alt="Sliced red apple">
              <div class="food-copy">
                <p class="food-name">Red apple</p>
                <p class="food-meta">+95 cal</p>
              </div>
              <span class="serving">1 medium</span>
            </div>

            <div class="food-row">
              <img src="https://loremflickr.com/32/32/fruit?lock=5272" width="32" height="32" alt="Berries served with yogurt">
              <div class="food-copy">
                <p class="food-name">Berries and yogurt</p>
                <p class="food-meta">+140 cal</p>
              </div>
              <span class="serving">3/4 cup</span>
            </div>
          </div>
        </section>

        <section class="step">
          <span class="step-num">3</span>
          <div class="step-head">
            <h2>Review and save</h2>
          </div>
          <p class="review-line"><span class="check">✓</span> Lunch · May 18 · 3 foods · 655 cal counted</p>
          <button class="create-button" type="submit">Create meal entry</button>
        </section>
      </form>
    </section>
  </div>
</body>
</html>
