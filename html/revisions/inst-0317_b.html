<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbay Invest — Portfolio</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 40px 0;
    background: #f2f2f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }
  .screen {
    width: 390px;
    height: 560px;
    box-sizing: border-box;
    padding: 40px 24px;
    background: #f2f2f0;
  }
  .card {
    box-sizing: border-box;
    width: 100%;
    background: #ffffff;
    border: 1px solid #dcdcd8;
    border-radius: 10px;
    padding: 20px;
  }
  .hero {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e4e4e0;
  }
  .hero img {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: cover;
    background: #dedede;
  }
  .eyebrow {
    margin: 18px 0 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b7570;
  }
  h1 {
    margin: 8px 0 0;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .body {
    margin: 8px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: #5c5c58;
  }
  .panel {
    box-sizing: border-box;
    margin-top: 18px;
    padding: 14px;
    border: 1px solid #e2e5e1;
    border-radius: 9px;
    background: #f7f8f6;
  }
  .panel-label {
    margin: 0 0 10px;
    font-size: 11px
    ;font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #85908a;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .cta {
    flex: 1.35;
    box-sizing: border-box;
    padding: 13px 10px;
    border: 1px solid #0f4d3f;
    border-radius: 8px;
    background: #0f4d3f;
    color: #ffffff;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-align: center;
    text-decoration: none;
  }
  .secondary {
    flex: 1;
    box-sizing: border-box;
    padding: 13px 8px;
    border: 1px solid #cfd6d1;
    border-radius: 8px;
    background: #ffffff;
    color: #33403a;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    text-decoration: none;
  }
  .note {
    margin: 12px 0 0;
    font-size: 11.5px;
    line-height: 1.45;
    color: #85908a;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/300/120/chart?lock=4683" width="300" height="120" alt="Printed performance chart on a desk, illustrating an empty portfolio">
      </div>
      <p class="eyebrow">Portfolio</p>
      <h1>No holdings tracked yet</h1>
      <p class="body">Add a stock, fund, or bond you own and we'll track value, dividends, and cost basis from the purchase date.</p>
      <div class="panel">
        <p class="panel-label">Two ways to begin</p>
        <div class="row">
          <a class="cta" href="#">Add holding</a>
          <a class="secondary" href="#">Import trades</a>
        </div>
        <p class="note">Importing pulls the last 24 months of trades from your brokerage — about 2 minutes.</p>
      </div>
    </div>
  </div>
</body>
</html>
