<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherly Shuttle Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e6e5;
      color: #29252b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    button { font: inherit; }
    .screen {
      width: 390px;
      height: 844px;
      position: relative;
      background: #fbfaf9;
    }
    .top-bar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 5;
      padding: 16px 16px 13px;
      background: #fbfaf9;
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .eyebrow {
      margin: 0 0 3px;
      color: #80617f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .status-button {
      height: 38px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: 11px;
      color: #37664d;
      background: #e3f0e8;
      font-size: 12px;
      font-weight: 700;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4b8a66;
    }
    .route-tabs {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
      margin-top: 14px;
    }
    .route-filter {
      height: 36px;
      padding: 0 8px;
      border: 1px solid #e3dfe0;
      border-radius: 10px;
      color: #625c63;
      background: #f7f5f4;
      font-size: 12px;
      font-weight: 700;
    }
    .route-filter.active {
      border-color: #7d5a7c;
      color: #fff;
      background: #7d5a7c;
    }
    .map-area {
      position: absolute;
      top: 116px;
      right: 0;
      bottom: 76px;
      left: 0;
      background: #ece9e6;
    }
    .map-drawing {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .map-tools {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .map-tool {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #604e60;
      background: #fbfaf9;
      box-shadow: 0 2px 8px rgba(49,40,49,.12);
    }
    .map-tool svg { width: 19px; height: 19px; }
    .route-key {
      position: absolute;
      top: 15px;
      left: 14px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-radius: 10px;
      color: #594f58;
      background: rgba(251,250,249,.96);
      box-shadow: 0 2px 8px rgba(49,40,49,.1);
      font-size: 11px;
      font-weight: 700;
    }
    .route-line-key {
      width: 20px;
      height: 4px;
      border-radius: 4px;
      background: #4d7281;
    }
    .stop {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stop-dot {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 4px solid #fbfaf9;
      border-radius: 50%;
      background: #4d7281;
      box-shadow: 0 2px 6px rgba(48,39,48,.18);
    }
    .stop-name {
      padding: 5px 7px;
      border-radius: 8px;
      color: #514951;
      background: rgba(251,250,249,.96);
      box-shadow: 0 2px 6px rgba(48,39,48,.1);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .stop.one { top: 112px; left: 34px; }
    .stop.two { top: 214px; left: 238px; }
    .stop.three { top: 332px; left: 45px; }
    .stop.four { top: 388px; left: 250px; }
    .selected-stop {
      position: absolute;
      top: 255px;
      left: 149px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .selected-dot {
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 4px solid #fbfaf9;
      border-radius: 50%;
      color: #fff;
      background: #d4784f;
      box-shadow: 0 3px 8px rgba(92,57,40,.22);
    }
    .selected-dot svg { width: 16px; height: 16px; }
    .selected-name {
      padding: 7px 9px;
      border-radius: 9px;
      color: #fff;
      background: #d4784f;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .stop-card {
      position: absolute;
      right: 14px;
      bottom: 16px;
      left: 14px;
      z-index: 4;
      padding: 15px;
      border-radius: 14px;
      background: #fbfaf9;
      box-shadow: 0 6px 18px rgba(48,39,48,.17);
    }
    .card-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .card-heading h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
    }
    .card-heading p {
      margin: 3px 0 0;
      color: #756f76;
      font-size: 12px;
      line-height: 1.35;
    }
    .walk-chip {
      flex: 0 0 auto;
      padding: 6px 8px;
      border-radius: 9px;
      color: #755a32;
      background: #f2e7d5;
      font-size: 11px;
      font-weight: 700;
    }
    .departures {
      margin-top: 12px;
      border-top: 1px solid #ebe7e6;
      border-bottom: 1px solid #ebe7e6;
    }
    .departure-row {
      padding: 9px 0;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 9px;
    }
    .departure-row + .departure-row { border-top: 1px solid #ebe7e6; }
    .route-badge {
      width: 32px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #4d7281;
      font-size: 11px;
      font-weight: 700;
    }
    .route-badge.orange { background: #d4784f; }
    .route-copy strong, .route-copy span { display: block; }
    .route-copy strong {
      font-size: 12px;
      line-height: 1.2;
    }
    .route-copy span {
      margin-top: 2px;
      color: #7b747b;
      font-size: 10px;
    }
    .time {
      color: #3f5f6c;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }
    .time.scheduled { color: #6f686f; }
    .time span {
      display: block;
      margin-top: 2px;
      color: #898289;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .card-footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .accessibility {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #706970;
      font-size: 11px;
      font-weight: 600;
    }
    .accessibility svg {
      width: 16px;
      height: 16px;
      color: #4d7281;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .primary-action {
      height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #4d7281;
      font-size: 12px;
      font-weight: 700;
    }
    .bell-button {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #b9cbd2;
      border-radius: 10px;
      color: #3f6473;
      background: #eaf1f3;
    }
    .bell-button svg { width: 18px; height: 18px; }
    .tab-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 6;
      height: 76px;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      padding: 9px 8px 8px;
      background: #fbfaf9;
      box-shadow: 0 -2px 10px rgba(48,39,48,.08);
    }
    .tab {
      padding: 3px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 0;
      color: #898389;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }
    .tab svg { width: 21px; height: 21px; }
    .tab.active { color: #3f6473; }
    .active-mark {
      width: 28px;
      height: 3px;
      margin-top: 1px;
      border-radius: 10px;
      background: #4d7281;
    }
    .tab:not(.active) .active-mark { background: transparent; }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <div class="title-row">
        <div>
          <p class="eyebrow">Campus transit</p>
          <h1>Shuttle tracker</h1>
        </div>
        <button class="status-button" aria-label="Shuttle service status">
          <span class="status-dot"></span>
          Service normal
        </button>
      </div>
      <div class="route-tabs" aria-label="Route filters">
        <button class="route-filter active">Nearby</button>
        <button class="route-filter">Blue Loop</button>
        <button class="route-filter">Orange Line</button>
      </div>
    </header>

    <main class="map-area" aria-label="Live campus shuttle map">
      <svg class="map-drawing" viewBox="0 0 390 652" preserveAspectRatio="none" aria-hidden="true">
        <rect width="390" height="652" fill="#ece9e6"/>
        <path d="M0 70L82 42L150 67L220 36L390 70V137L316 121L226 151L136 124L55 151L0 132Z" fill="#e1ddda"/>
        <path d="M0 343L72 310L141 334L207 309L274 331L390 291V385L302 410L224 381L145 414L69 387L0 411Z" fill="#e3dfdc"/>
        <path d="M37 0C57 79 46 141 78 213C107 278 100 351 71 430C54 476 59 565 86 652" fill="none" stroke="#faf9f8" stroke-width="22"/>
        <path d="M0 186C81 176 141 200 208 187C285 172 326 122 390 115" fill="none" stroke="#faf9f8" stroke-width="18"/>
        <path d="M0 505C84 476 134 477 205 497C274 517 328 509 390 468" fill="none" stroke="#faf9f8" stroke-width="22"/>
        <path d="M165 0C179 70 166 135 183 202C200 269 253 313 257 395C261 482 227 554 239 652" fill="none" stroke="#f8f6f5" stroke-width="16"/>
        <path d="M292 0C272 86 304 145 318 212C334 289 314 359 341 431C363 490 353 572 336 652" fill="none" stroke="#f8f6f5" stroke-width="18"/>
        <path d="M44 121C91 146 134 183 181 221C231 261 287 245 321 196C344 163 336 121 304 100" fill="none" stroke="#c5d2d7" stroke-width="10" stroke-linecap="round"/>
        <path d="M44 121C91 146 134 183 181 221C231 261 287 245 321 196C344 163 336 121 304 100" fill="none" stroke="#4d7281" stroke-width="4" stroke-linecap="round"/>
        <path d="M54 341C102 309 143 288 181 273C229 254 273 278 296 325C319 372 294 409 259 427" fill="none" stroke="#edc8b7" stroke-width="10" stroke-linecap="round"/>
        <path d="M54 341C102 309 143 288 181 273C229 254 273 278 296 325C319 372 294 409 259 427" fill="none" stroke="#d4784f" stroke-width="4" stroke-linecap="round"/>
        <rect x="18" y="18" width="86" height="43" rx="8" fill="#d9d5d2"/>
        <rect x="232" y="63" width="78" height="56" rx="8" fill="#ddd9d6"/>
        <rect x="91" y="213" width="55" height="67" rx="8" fill="#dad6d3"/>
        <rect x="279" y="188" width="82" height="48" rx="8" fill="#dedad7"/>
        <rect x="18" y="289" width="61" height="54" rx="8" fill="#dad6d3"/>
        <rect x="277" y="354" width="78" height="61" rx="8" fill="#dad6d3"/>
        <text x="18" y="94" fill="#928c91" font-size="11" font-weight="600">NORTH GATE</text>
        <text x="242" y="141" fill="#928c91" font-size="11" font-weight="600">ENGINEERING</text>
        <text x="281" y="254" fill="#928c91" font-size="11" font-weight="600">MAIN LIBRARY</text>
        <text x="19" y="368" fill="#928c91" font-size="11" font-weight="600">REC CENTER</text>
        <text x="280" y="437" fill="#928c91" font-size="11" font-weight="600">SOUTH GARAGE</text>
      </svg>

      <div class="route-key"><span class="route-line-key"></span>Blue Loop</div>

      <div class="map-tools">
        <button class="map-tool" aria-label="Center map on your location">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="map-tool" aria-label="Show map layers">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m4 8 8-4 8 4-8 4-8-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m4 12 8 4 8-4M4 16l8 4 8-4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="stop one">
        <button class="stop-dot" aria-label="North Gate stop"></button>
        <span class="stop-name">North Gate</span>
      </div>
      <div class="stop two">
        <button class="stop-dot" aria-label="Engineering stop"></button>
        <span class="stop-name">Engineering</span>
      </div>
      <div class="stop three">
        <button class="stop-dot" aria-label="Recreation Center stop"></button>
        <span class="stop-name">Rec Center</span>
      </div>
      <div class="stop four">
        <button class="stop-dot" aria-label="South Garage stop"></button>
        <span class="stop-name">South Garage</span>
      </div>

      <div class="selected-stop">
        <button class="selected-dot" aria-label="Selected stop: Main Library">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="5" width="14" height="13" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 18v2M16 18v2M7.5 9h9M8 14h.01M16 14h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="selected-name">Main Library</span>
      </div>

      <section class="stop-card" aria-labelledby="stop-title">
        <div class="card-heading">
          <div>
            <h2 id="stop-title">Main Library</h2>
            <p>Stop B · Outside the east entrance</p>
          </div>
          <span class="walk-chip">2 min walk</span>
        </div>

        <div class="departures" aria-label="Upcoming shuttle departures">
          <div class="departure-row">
            <span class="route-badge">BL</span>
            <div class="route-copy">
              <strong>Blue Loop</strong>
              <span>North Gate via Engineering</span>
            </div>
            <div class="time">4 min<span>Live</span></div>
          </div>
          <div class="departure-row">
            <span class="route-badge orange">OL</span>
            <div class="route-copy">
              <strong>Orange Line</strong>
              <span>South Garage express</span>
            </div>
            <div class="time scheduled">10:42<span>Scheduled</span></div>
          </div>
        </div>

        <div class="card-footer">
          <div class="accessibility">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M10.5 8.5h4l1.2 4H12l-1 3.5M9.5 11a5 5 0 1 0 7.8 4.1M15.5 9.5l2.5 1.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Accessible stop
          </div>
          <div class="actions">
            <button class="primary-action">Stop details</button>
            <button class="bell-button" aria-label="Set a reminder for the next departure">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6.5 16.5h11l-1.4-2.1V10a4.1 4.1 0 0 0-8.2 0v4.4l-1.4 2.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M10 19a2.2 2.2 0 0 0 4 0M12 4V2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab active">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6.5 9 4l6 2.5L20 4v13.5L15 20l-6-2.5L4 20V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Tracker
        <span class="active-mark"></span>
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="4" width="14" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 19v2M16 19v2M7.5 9h9M8 14h.01M16 14h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Routes
        <span class="active-mark"></span>
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Stops
        <span class="active-mark"></span>
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 16.5h11l-1.4-2.1V10a4.1 4.1 0 0 0-8.2 0v4.4l-1.4 2.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10 19a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Reminders
        <span class="active-mark"></span>
      </button>
    </nav>
  </div>
</body>
</html>
