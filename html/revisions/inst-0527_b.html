<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7eb;
      color: #211d28;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #fcfbfd;
    }

    .component {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f3cc3;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 14px;
      color: #68616f;
      font-size: 13.5px;
      line-height: 1.5;
      font-weight: 400;
    }

    /* ---- trip banner ---- */
    .trip-banner {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #d8d4dc;
    }

    .trip-banner img {
      display: block;
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .banner-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20, 15, 30, 0.55) 0%, rgba(20, 15, 30, 0.1) 42%, rgba(20, 15, 30, 0.78) 100%);
    }

    .banner-tag {
      position: absolute;
      top: 10px;
      left: 12px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(252, 251, 253, 0.92);
      color: #5d31ad;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
    }

    .banner-copy {
      position: absolute;
      right: 12px;
      bottom: 10px;
      left: 12px;
    }

    .trip-name {
      margin: 0;
      overflow: hidden;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trip-location {
      margin: 1px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
    }

    /* ---- destination list ---- */
    fieldset {
      min-width: 0;
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      color: #211d28;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .folder-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 10px;
      border-top: 1px solid #e5e2e7;
      border-left: 3px solid transparent;
      cursor: default;
    }

    .folder-option:last-of-type {
      border-bottom: 1px solid #e5e2e7;
    }

    .folder-option input {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 0;
      accent-color: #7040c7;
    }

    .folder-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      color: #29232f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-count {
      flex: 0 0 auto;
      padding: 3px 9px;
      border-radius: 20px;
      background: #efecf3;
      color: #6c6474;
      font-size: 11.5px;
      line-height: 1.2;
      font-weight: 600;
    }

    .folder-option.is-selected {
      border-left-color: #7040c7;
      background: #f5f0ff;
    }

    .folder-option.is-selected .folder-name {
      color: #5a2ea9;
    }

    .folder-option.is-selected .folder-count {
      background: #e2d6fa;
      color: #55299f;
    }

    /* ---- review strip ---- */
    .review {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px dashed #d6cfe4;
      border-radius: 10px;
      background: #faf8fd;
      font-size: 12.5px;
      line-height: 1.35;
      font-weight: 600;
    }

    .review .label {
      color: #8a8392;
      font-weight: 500;
    }

    .review .from {
      color: #6c6474;
    }

    .review .arrow {
      color: #a49bb0;
    }

    .review .to {
      color: #5a2ea9;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      cursor: default;
    }

    .cancel {
      padding: 11px 14px;
      background: transparent;
      color: #625b69;
    }

    .move {
      padding: 11px 18px;
      background: #7040c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="move-title">
      <p class="eyebrow">Change collection</p>
      <h1 id="move-title">Move trip</h1>
      <p class="intro">Pick a new collection. Saved places keep their current order.</p>

      <div class="trip-banner">
        <img src="https://loremflickr.com/342/100/cityscape?lock=7130" width="342" height="100" alt="Lisbon rooftops beside the waterfront">
        <span class="banner-shade"></span>
        <span class="banner-tag">Weekend Ideas</span>
        <div class="banner-copy">
          <p class="trip-name">Lisbon Weekend</p>
          <p class="trip-location">Lisbon, Portugal · 3 nights · 6 places</p>
        </div>
      </div>

      <fieldset>
        <legend>Choose a destination</legend>

        <label class="folder-option is-selected">
          <input type="radio" name="destination" checked>
          <span class="folder-name">Coastal Plans</span>
          <span class="folder-count">8 places</span>
        </label>

        <label class="folder-option">
          <input type="radio" name="destination">
          <span class="folder-name">City Stops</span>
          <span class="folder-count">12 places</span>
        </label>

        <label class="folder-option">
          <input type="radio" name="destination">
          <span class="folder-name">Mountain Weekends</span>
          <span class="folder-count">5 places</span>
        </label>
      </fieldset>

      <div class="review">
        <span class="label">Moving</span>
        <span class="from">Weekend Ideas</span>
        <span class="arrow">&rarr;</span>
        <span class="to">Coastal Plans</span>
      </div>

      <div class="actions">
        <button class="cancel" type="button">Cancel</button>
        <button class="move" type="button">Move trip</button>
      </div>
    </main>
  </div>
</body>
</html>
