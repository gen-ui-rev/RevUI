<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northline Fitness Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e9e6;
      color: #252b27;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fbfcf9;
      border: 1px solid #d8dcd4;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 20px;
      background: #fbfcf9;
      border-bottom: 1px solid #dce0d8;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .back-button,
    .help-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #293229;
    }

    .back-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
    }

    .brand {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 16px;
      line-height: 20px;
      font-weight: 700;
    }

    .brand-context {
      margin: 2px 0 0;
      color: #687167;
      font-size: 12px;
      line-height: 16px;
    }

    .help-button {
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .class-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 30px;
      text-align: center;
      background: #e9efdf;
    }

    .class-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: #586453;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #66834e;
    }

    .coach-avatar {
      width: 116px;
      height: 116px;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
      border: 1px solid #b7c7a8;
      border-radius: 50%;
      background: #d5e0c8;
      color: #45583a;
      font-size: 30px;
      line-height: 36px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .class-stage h1 {
      margin: 0;
      color: #1e271d;
      font-size: 27px;
      line-height: 33px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .coach-role {
      margin: 7px 0 0;
      color: #5b6757;
      font-size: 14px;
      line-height: 20px;
    }

    .duration {
      margin: 17px 0 0;
      color: #2d3b28;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .session-note {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 12px 0 0;
      color: #687364;
      font-size: 12px;
      line-height: 16px;
    }

    .class-details {
      padding: 15px 20px 13px;
      background: #fbfcf9;
      border-top: 1px solid #d8ddd2;
    }

    .section-title {
      margin: 0 0 7px;
      color: #293128;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
      border-top: 1px solid #e3e6df;
      font-size: 14px;
      line-height: 20px;
    }

    .detail-label {
      flex: 0 0 auto;
      color: #71786e;
    }

    .detail-value {
      min-width: 0;
      color: #2b332a;
      font-weight: 500;
      text-align: right;
    }

    .live-value {
      color: #547343;
    }

    .class-controls {
      padding: 14px 17px 18px;
      background: #f7f8f5;
      border-top: 1px solid #d7dcd3;
    }

    .controls-label {
      margin: 0 0 12px;
      color: #697068;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #30382f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .control-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 1px solid #cfd5ca;
      border-radius: 50%;
      background: #ffffff;
      color: #344030;
    }

    .control.active .control-icon {
      border-color: #829a6f;
      background: #e3ecd9;
    }

    .control.leave {
      color: #914440;
    }

    .control.leave .control-icon {
      border-color: #a94e48;
      background: #a94e48;
      color: #ffffff;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <button class="back-button" type="button" aria-label="Leave class screen">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15.5 5L8.5 12L15.5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="brand">
          <p class="brand-name">Northline Fitness</p>
          <p class="brand-context">Live coaching class</p>
        </div>
      </div>
      <button class="help-button" type="button">Support</button>
    </header>

    <main class="class-stage">
      <div class="class-state">
        <span class="state-mark" aria-hidden="true"></span>
        Class in progress
      </div>

      <div class="coach-avatar" role="img" aria-label="Coach Mara Voss profile">MV</div>

      <h1>Mara Voss</h1>
      <p class="coach-role">Strength and mobility coach</p>
      <p class="duration">18:24 elapsed</p>

      <p class="session-note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 14.5H8.2L13 18.5V5.5L8.2 9.5H5V14.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M16 9C17.33 10.67 17.33 13.33 16 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Coach audio is live
      </p>
    </main>

    <section class="class-details" aria-labelledby="class-details-title">
      <h2 class="section-title" id="class-details-title">Class details</h2>
      <div class="detail-row">
        <span class="detail-label">Class</span>
        <span class="detail-value">Core strength reset</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Scheduled</span>
        <span class="detail-value">Today, 6:00–6:45 PM</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Stream</span>
        <span class="detail-value live-value">Strong</span>
      </div>
    </section>

    <nav class="class-controls" aria-label="Class controls">
      <p class="controls-label">Class controls</p>
      <div class="control-grid">
        <button class="control" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8.5" y="3.5" width="7" height="11" rx="3.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5M12 18V21M9 21H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Mute</span>
        </button>

        <button class="control active" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 14.5H8.2L13 18.5V5.5L8.2 9.5H5V14.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M16 9C17.33 10.67 17.33 13.33 16 15M18.5 6.5C21.2 9.7 21.2 14.3 18.5 17.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Audio</span>
        </button>

        <button class="control" type="button">
          <span class="control-icon">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3.5" y="6.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M15.5 10L20.5 7.5V16.5L15.5 14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>Camera</span>
        </button>

        <button class="control leave" type="button">
          <span class="control-icon">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 15.5C8.9 12.17 15.1 12.17 19 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M7.5 13.9L6 17M16.5 13.9L18 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Leave</span>
        </button>
      </div>
    </nav>
  </div>
</body>
</html>
