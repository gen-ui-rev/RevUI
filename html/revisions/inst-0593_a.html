<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayfold Meeting Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e2e6e9;
      color: #1f2b33;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 42px 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #eef1f3;
    }

    .widget {
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 20px 22px;
      background: #ffffff;
      border-top: 4px solid #56afe0;
      border-radius: 4px;
      box-shadow: 0 10px 26px rgba(31, 43, 51, 0.12);
    }

    .widget-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .service-name {
      margin: 0;
      color: #283740;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .date {
      margin: 0;
      color: #71808a;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .meeting {
      margin-top: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #258fc9;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      color: #17242c;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.18;
    }

    .meeting-time {
      margin: 7px 0 0;
      color: #52616b;
      font-size: 15px;
      font-weight: 600;
    }

    .widget-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e4e8eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .attendees {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .monograms {
      display: flex;
      flex-shrink: 0;
    }

    .monogram {
      width: 30px;
      padding: 6px 0;
      border: 2px solid #ffffff;
      border-radius: 4px;
      background: #dfe9ee;
      color: #42545f;
      font-size: 12px;
      font-weight: 700;
      line-height: 14px;
      text-align: center;
    }

    .monogram + .monogram {
      margin-left: -6px;
      background: #e8e3dc;
      color: #65584c;
    }

    .attendee-count {
      margin-left: 8px;
      color: #687781;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .action {
      flex-shrink: 0;
      padding: 9px 13px;
      border-radius: 4px;
      background: #56afe0;
      color: #102c3b;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-secondary {
      flex-shrink: 0;
      padding: 8px 12px;
      border: 1px solid #ccd7dd;
      border-radius: 4px;
      background: #ffffff;
      color: #3d4d57;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      text-decoration: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="widget" aria-label="Dayfold next meeting summary">
      <header class="widget-header">
        <p class="service-name">Dayfold</p>
        <p class="date">Tue, June 17</p>
      </header>

      <section class="meeting" aria-labelledby="meeting-title">
        <p class="eyebrow">Next meeting · in 24 min</p>
        <h1 id="meeting-title">Weekly planning</h1>
        <p class="meeting-time">10:30–11:15 AM · Cedar Room · video ready</p>
      </section>

      <footer class="widget-footer">
        <div class="attendees" aria-label="Mara Ellis, Owen Hart, and two others">
          <div class="monograms" aria-hidden="true">
            <span class="monogram">ME</span>
            <span class="monogram">OH</span>
          </div>
          <span class="attendee-count">+2</span>
        </div>
        <div class="actions">
          <a class="action-secondary" href="#" aria-label="View the weekly planning agenda">Agenda</a>
          <a class="action" href="#" aria-label="Join the weekly planning video call now">Join call</a>
        </div>
      </footer>
    </article>
  </div>
</body>
</html>
