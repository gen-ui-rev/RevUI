<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Larkspur — Daily Practice Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6d28d9;
    --violet-soft:#efe9fb;
    --ink:#1c1a22;
    --muted:#6f6b7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eeeef1;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:36px 35px;
  }
  .widget{
    width:100%;
    background:#fff;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(24,20,40,.09);
    padding:24px 22px;
  }
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    line-height:1.25;
  }
  .head p{
    margin:3px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  .day{
    font-size:13px;
    font-weight:600;
    color:var(--violet);
    background:var(--violet-soft);
    border-radius:14px;
    padding:5px 10px;
    white-space:nowrap;
  }
  .ring-wrap{
    display:flex;
    justify-content:center;
    padding:14px 0 0;
  }
  .ring{
    position:relative;
    width:138px;
    height:138px;
  }
  .ring svg{display:block;}
  .ring-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ring-text .big{
    font-size:34px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.5px;
  }
  .ring-text .sub{
    margin-top:5px;
    font-size:13px;
    color:var(--muted);
  }
  .lead{
    margin:12px 0 0;
    text-align:center;
    font-size:20px;
    font-weight:600;
    line-height:1.35;
    letter-spacing:-.2px;
    color:var(--ink);
  }
  .start{
    display:block;
    width:100%;
    margin-top:16px;
    height:46px;
    border:0;
    border-radius:12px;
    background:var(--violet);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
  }
  .rule{
    height:1px;
    background:#eceaf0;
    margin:18px 0 14px;
  }
  .next{
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid #eceaf0;
    background:#faf9fc;
    border-radius:12px;
    padding:11px 12px;
  }
  .mono{
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:13px;
    background:var(--violet);
    color:#fff;
    font-size:15px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:.5px;
  }
  .next .info{min-width:0;}
  .next .name{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .next .when{
    margin-top:2px;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="head">
        <div>
          <h1>Daily practice</h1>
          <p>Spanish &middot; Level B1</p>
        </div>
        <span class="day">Day 12</span>
      </div>

      <div class="ring-wrap">
        <div class="ring">
          <svg width="138" height="138" viewBox="0 0 138 138" aria-hidden="true">
            <circle cx="69" cy="69" r="57" fill="none" stroke="#eceaf0" stroke-width="11"></circle>
            <circle cx="69" cy="69" r="57" fill="none" stroke="#6d28d9" stroke-width="11"
                    stroke-linecap="round" stroke-dasharray="250.7 358.1" transform="rotate(-90 69 69)"></circle>
          </svg>
          <div class="ring-text">
            <span class="big">14</span>
            <span class="sub">of 20 minutes</span>
          </div>
        </div>
      </div>

      <p class="lead">6 minutes left to keep the streak</p>

      <button class="start" type="button">Start practice</button>

      <div class="rule"></div>

      <div class="next">
        <div class="mono">MV</div>
        <div class="info">
          <div class="name">Marisol Vega</div>
          <div class="when">Speaking session &middot; Today 4:30 PM</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
