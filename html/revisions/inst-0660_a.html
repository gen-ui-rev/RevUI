<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e4;
      color: #25292d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #eceeef;
    }

    .style-panel {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d9dcde;
      border-radius: 0;
      box-shadow: 0 8px 22px rgba(34, 39, 43, 0.10);
    }

    .panel-header {
      margin-bottom: 12px;
    }

    .panel-header h1 {
      margin: 0 0 3px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .panel-header p {
      margin: 0;
      color: #687078;
      font-size: 14px;
      line-height: 1.4;
    }

    .steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 12px;
      padding: 0;
      list-style: none;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 7px;
      border-top: 3px solid #dcdfe1;
      color: #8a9198;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step .num {
      flex: none;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #c6cacd;
      color: #8a9198;
      font-size: 11px;
      line-height: 1;
    }

    .step.current {
      border-top-color: #30343a;
      color: #25292d;
    }

    .step.current .num {
      border-color: #30343a;
      background: #30343a;
      color: #ffffff;
    }

    .preview {
      position: relative;
      width: 308px;
      margin-bottom: 16px;
      border: 1px solid #cfd3d6;
      background: #d5d8da;
    }

    .preview img {
      width: 306px;
      height: 126px;
      object-fit: cover;
      display: block;
      background: #d5d8da;
      filter: grayscale(1) contrast(0.95);
    }

    .sticker-slot {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 9px;
      border: 2px dashed #ffffff;
      background: rgba(48, 52, 58, 0.6);
      color: #ffffff;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .section {
      margin-bottom: 15px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
    }

    .section-heading span {
      color: #747b81;
      font-size: 12px;
      line-height: 1.3;
    }

    .option-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .option {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4d545a;
      text-align: center;
      cursor: default;
    }

    .filter-image {
      width: 71px;
      height: 44px;
      border: 1px solid #d5d8da;
      object-fit: cover;
      display: block;
      background: #d5d8da;
    }

    .option.selected .filter-image {
      border: 2px solid #30343a;
    }

    .filter-soft {
      filter: saturate(0.75) brightness(1.08);
    }

    .filter-mono {
      filter: grayscale(1);
    }

    .filter-warm {
      filter: sepia(0.28) saturate(0.9);
    }

    .option-label {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: inherit;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option.selected .option-label {
      color: #25292d;
      font-weight: 700;
    }

    .next-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px dashed #cfd3d6;
      background: #f6f7f8;
    }

    .next-step svg {
      flex: none;
      width: 24px;
      height: 24px;
      display: block;
      opacity: 0.55;
    }

    .next-step h3 {
      margin: 0;
      color: #4d545a;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
    }

    .next-step p {
      margin: 3px 0 0;
      color: #7b8288;
      font-size: 13px;
      line-height: 1.4;
    }

    .apply-button {
      width: 100%;
      padding: 11px 16px;
      border: 1px solid #30343a;
      border-radius: 0;
      background: #30343a;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="style-panel" aria-labelledby="style-title">
      <header class="panel-header">
        <h1 id="style-title">Style this update</h1>
        <p>Planstead update · Friday priorities</p>
      </header>

      <ol class="steps" aria-label="Styling steps">
        <li class="step current"><span class="num">1</span>Photo filter</li>
        <li class="step"><span class="num">2</span>Update sticker</li>
      </ol>

      <div class="preview" aria-label="Preview with Mono filter applied, sticker not chosen yet">
        <img src="https://loremflickr.com/306/126/workspace?lock=8770" width="306" height="126" alt="Laptop and planning materials in a shared workspace">
        <div class="sticker-slot">STICKER · STEP 2</div>
      </div>

      <section class="section" aria-labelledby="filters-heading">
        <div class="section-heading">
          <h2 id="filters-heading">Step 1 · Photo filter</h2>
          <span>Mono selected</span>
        </div>
        <div class="option-row">
          <button class="option" type="button" aria-label="Choose Clear filter">
            <img class="filter-image" src="https://loremflickr.com/71/44/workspace?lock=8771" width="71" height="44" alt="Workspace preview with Clear filter">
            <span class="option-label">Clear</span>
          </button>
          <button class="option" type="button" aria-label="Choose Soft filter">
            <img class="filter-image filter-soft" src="https://loremflickr.com/71/44/workspace?lock=8772" width="71" height="44" alt="Workspace preview with Soft filter">
            <span class="option-label">Soft</span>
          </button>
          <button class="option selected" type="button" aria-label="Mono filter selected">
            <img class="filter-image filter-mono" src="https://loremflickr.com/71/44/workspace?lock=8773" width="71" height="44" alt="Workspace preview with Mono filter">
            <span class="option-label">Mono</span>
          </button>
          <button class="option" type="button" aria-label="Choose Warm filter">
            <img class="filter-image filter-warm" src="https://loremflickr.com/71/44/workspace?lock=8774" width="71" height="44" alt="Workspace preview with Warm filter">
            <span class="option-label">Warm</span>
          </button>
        </div>
      </section>

      <div class="next-step">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <rect x="3" y="3" width="22" height="22" fill="#30343a"/>
          <path d="M9 14h10M14 9v10" stroke="#fff" stroke-width="2"/>
        </svg>
        <div>
          <h3>Step 2 · Update sticker</h3>
          <p>Choose a label such as Focus or Review once the filter is set.</p>
        </div>
      </div>

      <button class="apply-button" type="button">Continue to sticker</button>
    </main>
  </div>
</body>
</html>
