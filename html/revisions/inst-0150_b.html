<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf1;
      color: #172231;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 20px;
      background: #fbfcfd;
    }

    .intro {
      padding: 18px;
      background: rgba(39, 111, 198, 0.10);
      border-radius: 14px;
    }

    .charge-strip {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(39, 111, 198, 0.20);
    }

    .charge-label {
      margin: 0;
      color: #276fc6;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .charge-amount {
      margin: 0;
      color: #1f62b1;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.15;
    }

    .charge-due {
      flex: none;
      padding: 4px 10px;
      background: rgba(39, 111, 198, 0.16);
      border-radius: 14px;
      color: #1f62b1;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      color: #1f62b1;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 29px;
      font-weight: 700;
      line-height: 1.18;
    }

    .workspace-meta {
      margin: 4px 0 0;
      overflow: hidden;
      color: #526173;
      font-size: 14px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .methods {
      margin-top: 22px;
    }

    .section-label {
      margin: 0 0 10px;
      color: #334154;
      font-size: 15px;
      font-weight: 600;
    }

    .method-list {
      display: grid;
      gap: 10px;
    }

    .method-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 14px 16px;
      background: rgba(39, 111, 198, 0.07);
      border-radius: 14px;
    }

    .method-main {
      min-width: 0;
    }

    .method-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .method-name {
      overflow: hidden;
      color: #172231;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .default-badge {
      flex: none;
      padding: 2px 8px;
      background: rgba(39, 111, 198, 0.14);
      border-radius: 14px;
      color: #1f62b1;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .method-detail {
      margin: 4px 0 0;
      overflow: hidden;
      color: #667487;
      font-size: 14px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-button {
      width: 32px;
      padding: 6px;
      border: 0;
      background: transparent;
      color: #68778a;
      cursor: pointer;
    }

    .menu-button svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .add-button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 14px;
      background: rgba(39, 111, 198, 0.15);
      color: #1f62b1;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-button svg {
      width: 20px;
      height: 20px;
      flex: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="payment-title">
      <header class="intro">
        <div class="charge-strip">
          <div>
            <p class="charge-label">Next charge</p>
            <p class="charge-amount">$148.00</p>
          </div>
          <span class="charge-due">Due May 12</span>
        </div>
        <h1 id="payment-title">Payment methods</h1>
        <p class="workspace-meta">FolioNest workspace · Team plan</p>
      </header>

      <section class="methods" aria-labelledby="saved-methods">
        <p class="section-label" id="saved-methods">Saved methods</p>

        <div class="method-list">
          <article class="method-row">
            <div class="method-main">
              <div class="method-heading">
                <span class="method-name">Corporate card</span>
                <span class="default-badge">Default</span>
              </div>
              <p class="method-detail">Ending in 4827 · Expires 09/27</p>
            </div>
            <button class="menu-button" type="button" aria-label="Manage corporate card ending in 4827">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <circle cx="10" cy="4" r="1.5"></circle>
                <circle cx="10" cy="10" r="1.5"></circle>
                <circle cx="10" cy="16" r="1.5"></circle>
              </svg>
            </button>
          </article>

          <article class="method-row">
            <div class="method-main">
              <div class="method-heading">
                <span class="method-name">Project card</span>
              </div>
              <p class="method-detail">Ending in 1936 · Expires 02/28</p>
            </div>
            <button class="menu-button" type="button" aria-label="Manage project card ending in 1936">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <circle cx="10" cy="4" r="1.5"></circle>
                <circle cx="10" cy="10" r="1.5"></circle>
                <circle cx="10" cy="16" r="1.5"></circle>
              </svg>
            </button>
          </article>

          <article class="method-row">
            <div class="method-main">
              <div class="method-heading">
                <span class="method-name">Team checking</span>
              </div>
              <p class="method-detail">Ending in 7051 · ACH transfer</p>
            </div>
            <button class="menu-button" type="button" aria-label="Manage checking account ending in 7051">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <circle cx="10" cy="4" r="1.5"></circle>
                <circle cx="10" cy="10" r="1.5"></circle>
                <circle cx="10" cy="16" r="1.5"></circle>
              </svg>
            </button>
          </article>
        </div>

        <button class="add-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M10 4v12M4 10h12"></path>
          </svg>
          <span>Add payment method</span>
        </button>
      </section>
    </main>
  </div>
</body>
</html>
