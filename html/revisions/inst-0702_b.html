<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Session Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f3f8fc;
      border-radius: 34px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0 0 2px;
      color: #0369a1;
      font-size: 10px;
      line-height: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: #0ea5e9;
      border-radius: 50%;
    }

    .remaining {
      margin: 0;
      color: #0c4a6e;
      font-size: 40px;
      line-height: 44px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .end-time {
      margin: 2px 0 0;
      color: #56677c;
      font-size: 11px;
      line-height: 15px;
      font-weight: 400;
    }

    .task {
      margin: 10px 0 0;
      color: #273448;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 12px;
      background: rgba(14, 165, 233, 0.2);
      border-radius: 10px;
    }

    .progress-fill {
      width: 60%;
      height: 6px;
      background: #0ea5e9;
      border-radius: 10px;
    }

    .progress-meta {
      margin: 6px 0 0;
      color: #56677c;
      font-size: 10px;
      line-height: 14px;
      font-weight: 400;
    }

    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      margin-top: 12px;
      color: #ffffff;
      background: #0284c7;
      border-radius: 17px;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Focus session live activity">
      <p class="eyebrow"><span class="live-dot"></span>Focus</p>
      <h1 class="remaining">24 min</h1>
      <p class="end-time">Ends 3:30 PM</p>
      <p class="task">Sprint planning notes</p>

      <div class="progress-track" role="progressbar" aria-label="Focus session progress" aria-valuemin="0" aria-valuemax="60" aria-valuenow="36">
        <div class="progress-fill"></div>
      </div>
      <p class="progress-meta">36 of 60 minutes</p>

      <div class="action" role="button" tabindex="0">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M4 2.5V9.5M8 2.5V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>Pause session</span>
      </div>
    </section>
  </div>
</body>
</html>
