<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finding Available Stays</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e4e8;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px 20px;
      background: #efedf1;
    }

    .loading-card {
      width: 100%;
      padding: 18px;
      background: #20202b;
      border: 1px solid #30303d;
      border-radius: 24px;
      box-shadow: 0 16px 34px rgba(31, 28, 38, 0.18);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #f58fbb;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 650;
      line-height: 28px;
      letter-spacing: -0.025em;
    }

    .trip-details {
      margin: 8px 0 0;
      color: #b7b6c2;
      font-size: 14px;
      line-height: 20px;
    }

    .progress-area {
      margin-top: 16px;
      padding: 14px;
      background: #2c2937;
      border: 1px solid #3c3748;
      border-radius: 16px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #c9c7d1;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
    }

    .step-count {
      flex: 0 0 auto;
      padding: 2px 8px;
      border-radius: 999px;
      background: #443044;
      color: #ffadd0;
    }

    .status {
      margin: 5px 0 0;
      color: #ffffff;
      font-size: 15px;
      font-weight: 650;
      line-height: 20px;
    }

    .stages {
      position: relative;
      display: flex;
      margin-top: 12px;
    }

    .stages::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 16.66%;
      right: 16.66%;
      height: 2px;
      background: #4a4653;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 33.33%;
      text-align: center;
      color: #85828e;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
    }

    .stage-dot {
      width: 18px;
      height: 18px;
      display: block;
      margin: 0 auto 6px;
      border: 4px solid #2c2937;
      border-radius: 50%;
      background: #5a5662;
      box-shadow: 0 0 0 1px #5a5662;
    }

    .stage.active {
      color: #ffb1d2;
    }

    .stage.active .stage-dot {
      background: #e33b83;
      box-shadow: 0 0 0 1px #e33b83;
    }

    .destination-photo {
      width: 294px;
      height: 96px;
      margin: 14px auto 0;
      border-radius: 16px;
      object-fit: cover;
      display: block;
      background: #3b3a44;
    }

    .supporting-copy {
      margin: 10px 0 0;
      color: #b7b6c2;
      font-size: 13px;
      line-height: 20px;
      text-align: center;
    }

    .cancel-button {
      width: 100%;
      margin-top: 14px;
      padding: 10px 16px;
      border: 1px solid #4b4855;
      border-radius: 13px;
      background: #292934;
      color: #e7e6eb;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      line-height: 20px;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="loading-card" aria-busy="true" aria-live="polite">
      <p class="eyebrow">Clovertrail stays</p>
      <h1>Finding stays in Santa Barbara</h1>
      <p class="trip-details">May 18–21 · 2 guests · 1 room</p>

      <section class="progress-area" aria-label="Search progress">
        <div class="progress-meta">
          <span>Search underway</span>
          <span class="step-count">Step 1 of 3</span>
        </div>
        <p class="status">Scanning available stays</p>
        <div class="stages" aria-label="Search, compare, and verify">
          <div class="stage active" aria-current="step">
            <span class="stage-dot"></span>
            Search
          </div>
          <div class="stage">
            <span class="stage-dot"></span>
            Compare
          </div>
          <div class="stage">
            <span class="stage-dot"></span>
            Verify
          </div>
        </div>
      </section>

      <img
        class="destination-photo"
        src="https://loremflickr.com/294/96/cityscape?lock=8450"
        width="294"
        height="96"
        alt="Coastal cityscape in Santa Barbara"
      >

      <p class="supporting-copy">Checking live rates and room options across Santa Barbara.</p>
      <button class="cancel-button" type="button">Cancel search</button>
    </main>
  </div>
</body>
</html>
