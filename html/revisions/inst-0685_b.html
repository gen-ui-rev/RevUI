<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #171923;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f1f2f4;
    }

    .dialog {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #dfe1e6;
      border-radius: 0;
      box-shadow: 0 12px 28px rgba(30, 35, 55, 0.12);
    }

    .accent {
      width: 40px;
      border-top: 4px solid #4f46e5;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .message {
      margin: 9px 0 20px;
      color: #5c6270;
      font-size: 15px;
      line-height: 1.5;
    }

    .summary {
      padding: 12px 0 14px;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-label {
      min-width: 0;
      overflow: hidden;
      color: #6b7280;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .edit-order {
      flex: 0 0 auto;
      padding: 5px 11px;
      border: 1px solid #c9ccd4;
      background: #ffffff;
      color: #343844;
      font: inherit;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .order {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .order img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      background: #d7d9df;
      border-radius: 0;
    }

    .order-details {
      min-width: 0;
    }

    .product-name {
      margin: 0 0 5px;
      overflow: hidden;
      color: #20232c;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .order-meta {
      margin: 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
    }

    .order-total {
      margin: 6px 0 0;
      color: #20232c;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-width: 0;
      font: inherit;
      cursor: pointer;
    }

    .actions button {
      padding: 13px 12px;
      border-radius: 0;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    .secondary {
      border: 1px solid #c9ccd4;
      background: #ffffff;
      color: #343844;
    }

    .primary {
      border: 1px solid #4f46e5;
      background: #4f46e5;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
      <div class="accent" aria-hidden="true"></div>
      <h1 id="confirmation-title">Place this order?</h1>
      <p class="message" id="confirmation-message">Northlane Market will charge your Visa ending in 1842. You can review the order before confirming.</p>

      <div class="summary">
        <div class="summary-head">
          <span class="summary-label">Order summary</span>
          <button class="edit-order" type="button">Edit order</button>
        </div>
        <div class="order">
          <img src="https://loremflickr.com/72/72/sneakers?lock=9130" width="72" height="72" alt="Pair of slate running sneakers">
          <div class="order-details">
            <p class="product-name">Slate Runner Sneakers</p>
            <p class="order-meta">Size 9 · Quantity 1</p>
            <p class="order-total">Order total · $86.40</p>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="secondary" type="button">No, go back</button>
        <button class="primary" type="button">Yes, place order</button>
      </div>
    </section>
  </div>
</body>
</html>
