<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Photo Estimates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e3;
      color: #25292d;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #f5f4f1;
    }

    .feature-card {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 6px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #5d6770;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #4f5962;
      font-size: 26px;
      font-weight: 700;
      line-height: 32px;
    }

    .intro {
      margin: 8px 0 14px;
      color: #555b60;
      font-size: 15px;
      font-weight: 400;
      line-height: 21px;
    }

    .hero {
      width: 310px;
      height: 104px;
      display: block;
      object-fit: cover;
      background: #d8dbdc;
      border-radius: 6px;
    }

    .recents {
      margin-top: 12px;
    }

    .recents h2 {
      margin: 0 0 8px;
      color: #353b40;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .thumb-row {
      display: flex;
      gap: 7px;
    }

    .thumb {
      width: 72px;
      height: 72px;
      display: block;
      object-fit: cover;
      background: #d8dbdc;
      border-radius: 5px;
    }

    .thumb.picked {
      outline: 2px solid #5d6770;
      outline-offset: -2px;
    }

    .confirm {
      width: 100%;
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #5d6770;
      color: #ffffff;
      font: 500 15px/20px 'Roboto', system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    .alt-action {
      width: 100%;
      margin-top: 8px;
      padding: 0;
      border: 0;
      background: none;
      color: #4f5962;
      font: 500 14px/20px 'Roboto', system-ui, sans-serif;
      text-align: center;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="feature-card" aria-labelledby="feature-title">
      <p class="eyebrow">Meal photo estimates</p>
      <h1 id="feature-title">Estimate nutrition from a photo</h1>
      <p class="intro">Pick a meal photo you already have and Nourish Lane drafts the estimate.</p>

      <img
        class="hero"
        src="https://loremflickr.com/310/104/salad?lock=6790"
        width="310"
        height="104"
        alt="A prepared salad with vegetables ready to be photographed"
      >

      <section class="recents">
        <h2>Recent photos</h2>
        <div class="thumb-row">
          <img class="thumb picked" src="https://loremflickr.com/72/72/breakfast?lock=1204" width="72" height="72" alt="Oatmeal bowl with berries">
          <img class="thumb" src="https://loremflickr.com/72/72/sandwich?lock=3318" width="72" height="72" alt="Turkey sandwich on a plate">
          <img class="thumb" src="https://loremflickr.com/72/72/pasta?lock=4471" width="72" height="72" alt="Pasta with tomato sauce">
          <img class="thumb" src="https://loremflickr.com/72/72/soup?lock=5590" width="72" height="72" alt="Bowl of lentil soup">
        </div>
      </section>

      <button class="confirm" type="button">Import from photo library</button>
      <button class="alt-action" type="button">Use the camera instead</button>
    </article>
  </div>
</body>
</html>
