<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halfmoon — Milestone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#eceae6;
    font-family:'Roboto', system-ui, sans-serif;
    color:#1d1a15;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    padding:32px;
    background:#eceae6;
  }
  .card{
    background:rgba(217,138,10,0.13);
    border-radius:6px;
    padding:16px;
  }
  .kicker{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 0 6px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#8a5a04;
  }
  .kicker svg{display:block}
  h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    line-height:1.15;
  }
  .card img{
    display:block;
    width:294px;
    height:148px;
    object-fit:cover;
    background:#d8d3cb;
    border-radius:6px;
    margin-top:14px;
  }
  .desc{
    margin:12px 0 0;
    font-size:14px;
    line-height:1.5;
    color:#4a443a;
  }
  .meta{
    margin:10px 0 0;
    font-size:12px;
    color:#6d6659;
  }
  .next{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(138,90,4,0.18);
  }
  .next-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
  }
  .next-label{
    font-size:14px;
    font-weight:700;
  }
  .next-value{
    font-size:14px;
    color:#8a5a04;
    font-weight:700;
    white-space:nowrap;
  }
  .track{
    margin-top:10px;
    height:8px;
    border-radius:6px;
    background:rgba(138,90,4,0.16);
  }
  .fill{
    width:66.6%;
    height:8px;
    border-radius:6px;
    background:#d98a0a;
  }
  .eta{
    display:flex;
    align-items:center;
    gap:6px;
    margin:10px 0 0;
    font-size:13px;
    font-weight:500;
    color:#8a5a04;
  }
  .eta svg{display:block;flex:none}
  .note{
    margin:6px 0 0;
    font-size:12px;
    color:#6d6659;
  }
  .share{
    display:block;
    width:100%;
    box-sizing:border-box;
    margin-top:16px;
    padding:13px 12px;
    border:0;
    border-radius:6px;
    background:#d98a0a;
    color:#ffffff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.01em;
    text-align:center;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="kicker">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#8a5a04" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6-5.9-3.2-5.9 3.2 1.2-6.6L2.5 9l6.6-.9z"/></svg>
        Milestone earned
      </div>
      <h1>Circle Keeper</h1>
      <img src="https://loremflickr.com/294/148/party?lock=10603" width="294" height="148" alt="Members of the Nightshift Crew group at their hundredth meetup">
      <p class="desc">You showed up in Nightshift Crew every day for 100 days straight — the longest run in the group.</p>
      <p class="meta">Earned June 14, 2025 · Shared with 42 members</p>
      <div class="next">
        <div class="next-head">
          <span class="next-label">Next: Circle Anchor</span>
          <span class="next-value">100 / 150</span>
        </div>
        <div class="track"><div class="fill"></div></div>
        <p class="eta">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#8a5a04" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 5h-2v6l5 3 1-1.7-4-2.3z"/></svg>
          At this pace, you'll earn it around Aug 3, 2025
        </p>
        <p class="note">50 more days of activity — about 7 weeks.</p>
      </div>
      <button class="share" type="button">Share this milestone</button>
    </div>
  </div>
</body>
</html>
