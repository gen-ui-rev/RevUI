<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserving your item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html { background: #D9DCDA; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #D9DCDA;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 1024px;
    height: 768px;
    background: #EFF0EE;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 800px;
    background: #FFFFFF;
    border: 1px solid #DEE3E6;
    border-radius: 10px;
    box-shadow: 0 14px 42px rgba(26, 30, 34, 0.09);
  }

  .progress-area {
    padding: 26px 32px 0;
  }

  .progress-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 9px;
  }

  .progress-label,
  .progress-value {
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    color: #68747E;
  }

  .bar {
    height: 14px;
    border-radius: 8px;
    background: rgba(140, 163, 183, 0.20);
    position: relative;
  }

  .bar span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 46%;
    border-radius: 8px;
    background: #8CA3B7;
  }

  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 42px;
    padding: 34px 32px 32px;
    align-items: center;
  }

  .message {
    min-width: 0;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .spinner {
    display: block;
    flex: 0 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 30px;
    font-weight: 500;
    color: #1A1E22;
    letter-spacing: -0.2px;
  }

  .sub {
    margin: 16px 0 0;
    font-size: 15px;
    line-height: 23px;
    color: #5D6771;
  }

  .note {
    margin: 15px 0 0;
    font-size: 13px;
    line-height: 19px;
    color: #737C86;
  }

  .item-panel {
    padding: 20px;
    border: 1px solid rgba(140, 163, 183, 0.28);
    border-radius: 9px;
    background: rgba(140, 163, 183, 0.10);
  }

  .item-label {
    margin-bottom: 13px;
    font-size: 11px;
    line-height: 15px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: #77838D;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .item img {
    display: block;
    width: 56px;
    height: 56px;
    border-radius: 7px;
    object-fit: cover;
    background: #D9DDE1;
    flex: 0 0 auto;
  }

  .info {
    min-width: 0;
    flex: 1 1 auto;
  }

  .name {
    font-size: 14px;
    line-height: 19px;
    font-weight: 500;
    color: #1A1E22;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    margin-top: 3px;
    font-size: 12px;
    line-height: 17px;
    color: #5D6771;
  }

  .price {
    margin-top: 15px;
    padding-top: 14px;
    border-top: 1px solid rgba(140, 163, 183, 0.25);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 14px;
    line-height: 20px;
    color: #5D6771;
  }

  .price strong {
    font-weight: 500;
    color: #1A1E22;
  }

  .footer {
    display: flex;
    justify-content: flex-end;
    padding: 20px 32px;
    border-top: 1px solid #E5E8EA;
    background: #FAFBFB;
    border-radius: 0 0 10px 10px;
  }

  .cancel {
    min-width: 170px;
    padding: 10px 20px;
    border: 1px solid #AEB8C0;
    border-radius: 7px;
    background: #FFFFFF;
    color: #35404A;
    font: 500 14px/20px 'Roboto', system-ui, sans-serif;
    cursor: pointer;
  }

  .cancel:focus-visible {
    outline: 3px solid rgba(140, 163, 183, 0.35);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <main class="card" aria-labelledby="page-title">
      <div class="progress-area">
        <div class="progress-heading">
          <span class="progress-label">Checking availability</span>
          <span class="progress-value">In progress</span>
        </div>
        <div class="bar" aria-label="Reservation progress"><span></span></div>
      </div>

      <div class="main">
        <section class="message">
          <div class="title-row">
            <svg class="spinner" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(140,163,183,0.22)" stroke-width="4"></circle>
              <circle cx="20" cy="20" r="17" fill="none" stroke="#8CA3B7" stroke-width="4"
                      stroke-linecap="round" stroke-dasharray="30 77" transform="rotate(-80 20 20)"></circle>
            </svg>
            <h1 id="page-title">Reserving your item</h1>
          </div>

          <p class="sub">Confirming stock with Harbor Lane Supply. This usually takes about 20 seconds.</p>
          <p class="note">Your cart is held until 3:24 PM. Keep this screen open.</p>
        </section>

        <section class="item-panel" aria-label="Item being reserved">
          <div class="item-label">Reservation item</div>
          <div class="item">
            <img src="https://loremflickr.com/56/56/sneakers?lock=5142" width="56" height="56" alt="Low-top trail running sneaker in fog gray">
            <div class="info">
              <div class="name">Trail Runner Low</div>
              <div class="meta">Fog Gray · Size 9 · Qty 1</div>
            </div>
          </div>
          <div class="price">
            <span>Total</span>
            <strong>$128.00</strong>
          </div>
        </section>
      </div>

      <footer class="footer">
        <button class="cancel" type="button">Cancel reservation</button>
      </footer>
    </main>
  </div>
</body>
</html>
