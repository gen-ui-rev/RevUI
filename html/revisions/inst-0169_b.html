<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delivery Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#8E6284;
    --deep:#75506D;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#D4D1D6;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--accent);
    color:var(--white);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px 5px;
  }
  .back{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#FFFFFF;
    background:rgba(255,255,255,.13);
  }
  .order{
    text-align:right;
  }
  .order strong{
    display:block;
    font-size:9px;
    line-height:12px;
    font-weight:700;
  }
  .order span{
    display:block;
    font-size:7px;
    line-height:9px;
    color:rgba(255,255,255,.66);
  }
  .summary{
    padding:4px 14px 10px;
    text-align:center;
  }
  .truck{
    width:31px;
    height:31px;
    margin:0 auto 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#FFFFFF;
    color:var(--accent);
  }
  .eyebrow{
    font-size:8px;
    line-height:10px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:rgba(255,255,255,.72);
  }
  .summary h1{
    margin:3px auto 0;
    font-size:17px;
    line-height:20px;
    letter-spacing:-.35px;
  }
  .courier{
    margin-top:4px;
    font-size:8px;
    line-height:11px;
    color:rgba(255,255,255,.72);
  }
  .stepstrip{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    margin-top:auto;
    border-top:1px solid rgba(255,255,255,.2);
    border-bottom:1px solid rgba(255,255,255,.2);
    background:var(--deep);
  }
  .step{
    position:relative;
    padding:8px 1px 7px;
    text-align:center;
    color:rgba(255,255,255,.48);
    border-right:1px solid rgba(255,255,255,.10);
  }
  .step:last-child{border-right:0;}
  .step.current{
    color:#FFFFFF;
    background:rgba(255,255,255,.10);
  }
  .mark{
    width:16px;
    height:16px;
    margin:0 auto 4px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.38);
    font-size:8px;
    line-height:1;
    font-weight:700;
  }
  .complete{
    color:#FFFFFF;
  }
  .complete .mark{
    color:var(--deep);
    background:#FFFFFF;
    border-color:#FFFFFF;
  }
  .current .mark{
    border:2px solid #FFFFFF;
    background:var(--deep);
  }
  .step span{
    display:block;
    font-size:6.5px;
    line-height:8px;
    font-weight:600;
    white-space:nowrap;
  }
  .footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:7px 8px;
    font-size:7px;
    line-height:9px;
    color:rgba(255,255,255,.72);
  }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <div class="back" aria-label="Back">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
    </div>
    <div class="order">
      <strong>Order #VL-48210</strong>
      <span>Placed March 12</span>
    </div>
  </div>

  <main class="summary">
    <div class="truck">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h10v9H3z"/><path d="M13 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
    </div>
    <div class="eyebrow">In transit</div>
    <h1>Today by 6:00 PM</h1>
    <div class="courier">Northline Courier · 9241 8830 4471</div>
  </main>

  <div class="stepstrip" aria-label="Delivery progress">
    <div class="step complete">
      <div class="mark">✓</div>
      <span>Ordered</span>
    </div>
    <div class="step complete">
      <div class="mark">✓</div>
      <span>Packed</span>
    </div>
    <div class="step current">
      <div class="mark"></div>
      <span>Transit</span>
    </div>
    <div class="step">
      <div class="mark"></div>
      <span>Delivered</span>
    </div>
  </div>

  <div class="footer">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    Last update 2:18 PM
  </div>
</div>
</body>
</html>
