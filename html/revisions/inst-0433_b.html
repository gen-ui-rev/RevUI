<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Reserve Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eeee;
      color: #172326;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 42px 24px;
      background: #f8faf9;
    }

    .empty-state {
      width: 100%;
      padding: 28px 28px 24px;
      border: 1px solid #cbd5d6;
      border-top: 3px solid #007f98;
      border-radius: 0;
      background: #ffffff;
    }

    .section-label {
      margin: 0 0 18px;
      color: #007f98;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .empty-mark {
      width: 64px;
      padding: 14px;
      margin: 0 0 22px;
      border: 1px solid #9bcbd4;
      border-radius: 0;
      background: #edf9fb;
      color: #007f98;
    }

    .empty-mark svg {
      display: block;
      width: 34px;
      height: 34px;
    }

    h1 {
      margin: 0 0 12px;
      color: #172326;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.12;
    }

    .description {
      margin: 0 0 24px;
      color: #566366;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
    }

    .primary-action {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #16264f;
      border-radius: 8px;
      background: #16264f;
      color: #ffffff;
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
    }

    .estimate-footnote {
      padding: 14px 0 0;
      margin: 18px 0 0;
      border-top: 1px solid #dde4e5;
      color: #6a777b;
      font-size: 13px;
      line-height: 1.5;
    }

    .estimate-footnote strong {
      color: #16264f;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <p class="section-label">Cove Ledger · Tax Reserves</p>

      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 3.5L28.5 7.2V17C28.5 23.6 23.7 28.4 17 30.5C10.3 28.4 5.5 23.6 5.5 17V7.2L17 3.5Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13 21L21 12" stroke="currentColor" stroke-width="1.5"/>
          <path d="M13.5 14.5H14.5" stroke="currentColor" stroke-width="2.4"/>
          <path d="M19.5 19.5H20.5" stroke="currentColor" stroke-width="2.4"/>
        </svg>
      </div>

      <h1 id="empty-title">Hold back your tax share</h1>
      <p class="description">No reserve is open yet. Choose a share of each client payment and we'll set it aside for quarterly taxes.</p>
      <a class="primary-action" href="#" aria-label="Open a tax reserve">Open a tax reserve</a>

      <p class="estimate-footnote"><strong>Tax estimate note</strong> — registers two business days after your first deposit clears.</p>
    </section>
  </div>
</body>
</html>
