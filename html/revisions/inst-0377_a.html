<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wanderline — Lisbon on Foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#d8241d;
    --ink:#15171a;
    --gray:#6d7278;
    --rule:#e4e4e6;
    --soft:#f5f5f6;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#d5d6d8;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  .screen{
    width:184px;
    height:224px;
    position:relative;
    background:#fff;
    color:var(--ink);
    padding:0 10px 9px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0 3px;
  }
  .iconbtn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .type{
    color:var(--gray);
    font-size:8px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .heading h1{
    margin:0;
    font-size:17px;
    line-height:21px;
    letter-spacing:-.02em;
  }
  .heading p{
    margin:1px 0 0;
    color:var(--gray);
    font-size:9px;
    font-weight:500;
    line-height:12px;
  }
  .current{
    margin-top:6px;
    padding:7px 8px;
    border-left:3px solid var(--accent);
    background:var(--soft);
  }
  .eyebrow{
    color:var(--accent);
    font-size:8px;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
  }
  .current h2{
    margin:2px 0 1px;
    font-size:12px;
    line-height:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .current p{
    margin:0;
    color:var(--gray);
    font-size:9px;
    font-weight:500;
    line-height:12px;
  }
  .play{
    width:100%;
    height:34px;
    margin-top:6px;
    border:0;
    border-radius:17px;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font:700 11px 'Plus Jakarta Sans',system-ui,sans-serif;
  }
  .next{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
    padding-top:6px;
    border-top:1px solid var(--rule);
  }
  .nextnum{
    color:var(--gray);
    font-size:9px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .nextbody{
    flex:1;
    min-width:0;
  }
  .nextlabel{
    color:var(--gray);
    font-size:8px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .nexttitle{
    margin-top:1px;
    font-size:9px;
    line-height:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .time{
    color:var(--gray);
    font-size:9px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-label="Back">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div class="type">Audio walk</div>
      <div class="iconbtn" aria-label="More options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
      </div>
    </div>

    <div class="heading">
      <h1>Lisbon on Foot</h1>
      <p>Stop 3 of 8 · Mara Reis</p>
    </div>

    <div class="current">
      <div class="eyebrow">Current stop · 03</div>
      <h2>The grid the earthquake built</h2>
      <p>3:15 played · 3:49 remaining</p>
    </div>

    <button class="play">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>
      Resume walk
    </button>

    <div class="next">
      <div class="nextnum">04</div>
      <div class="nextbody">
        <div class="nextlabel">Up next</div>
        <div class="nexttitle">Riding the Santa Justa lift</div>
      </div>
      <div class="time">5:47</div>
    </div>
  </div>
</body>
</html>
