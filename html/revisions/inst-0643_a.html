<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Collaborators</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e8e6;
      color: #262222;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      padding: 48px;
      display: flex;
      align-items: center;
      background: #f5f4f2;
    }

    .selector {
      width: 100%;
      display: grid;
      grid-template-columns: 340px 1fr;
      background: #ffffff;
      border: 1px solid #d9d5d2;
      border-radius: 10px;
    }

    /* ---------- left brief column ---------- */

    .brief {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 32px 30px;
      background: #fbfaf8;
      border-right: 1px solid #e3dfdc;
      border-radius: 10px 0 0 10px;
    }

    .eyebrow {
      margin: 0;
      color: #c93636;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: -8px 0 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.2;
    }

    .description {
      margin: 0;
      color: #6d6662;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 12px;
      border: 1px solid #cbc6c3;
      border-radius: 6px;
      background: #ffffff;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #7a7470;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #262222;
      font: 400 14px/1.4 'Inter', system-ui, sans-serif;
    }

    .search-box input::placeholder {
      color: #89827e;
      opacity: 1;
    }

    .brief-foot {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid #e8e3e0;
    }

    .selection-summary {
      margin: 0;
      color: #5f5854;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
    }

    .add-button {
      width: 100%;
      margin: 14px 0 9px;
      padding: 12px 16px;
      border: 1px solid #b92d2d;
      border-radius: 6px;
      background: #c93636;
      color: #ffffff;
      cursor: pointer;
      font: 600 14px/1.35 'Inter', system-ui, sans-serif;
    }

    .hint {
      margin: 0;
      color: #8a827e;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }

    /* ---------- right roster column ---------- */

    .roster {
      padding: 26px 30px 30px;
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid #eeeae7;
    }

    .list-title,
    .selected-count {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .list-title {
      color: #625b57;
    }

    .selected-count {
      color: #c93636;
    }

    .select-all-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 16px 0;
      padding: 13px 14px;
      background: #faf8f7;
      border: 1px dashed #d5cfcb;
      border-radius: 8px;
    }

    .select-all {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .select-all-copy {
      min-width: 0;
    }

    .select-all-title {
      display: block;
      color: #282322;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .select-all-note {
      display: block;
      margin-top: 2px;
      color: #77706c;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    .text-button {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid #d5cfcb;
      border-radius: 6px;
      background: #ffffff;
      color: #6d6662;
      cursor: pointer;
      font: 600 12px/1.2 'Inter', system-ui, sans-serif;
    }

    .people-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .person {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #e3dfdc;
      border-radius: 8px;
      cursor: pointer;
    }

    .person.selected {
      background: #fff7f7;
      border-color: #e7b9b9;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #d9d3cf;
      color: #56504b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .avatar.rose {
      background: #e5c9c7;
    }

    .avatar.slate {
      background: #ccd2d4;
    }

    .avatar.sand {
      background: #ddd1bd;
    }

    .avatar.mauve {
      background: #d6ccd7;
    }

    .avatar.moss {
      background: #cdd6c6;
    }

    .avatar.clay {
      background: #e0cdc2;
    }

    .person-copy {
      min-width: 0;
      flex: 1;
    }

    .person-name,
    .person-role {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .person-name {
      color: #282322;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .person-role {
      margin-top: 2px;
      color: #746d69;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.35;
    }

    .person input,
    .select-all input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #aaa39f;
      border-radius: 4px;
      background: #ffffff;
      color: transparent;
    }

    .person input:checked + .checkbox {
      border-color: #c93636;
      background: #c93636;
      color: #ffffff;
    }

    .checkbox.mixed {
      border-color: #c93636;
      background: #ffffff;
      color: #c93636;
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="selector" aria-labelledby="selector-title">
      <aside class="brief">
        <p class="eyebrow">Project access</p>
        <h1 id="selector-title">Choose collaborators</h1>
        <p class="description">Select the people who can edit the Horizon planning note. Editors can rename it, add sections and invite others.</p>

        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input type="text" aria-label="Search workspace members" placeholder="Search by name or role">
        </label>

        <div class="brief-foot">
          <p class="selection-summary">2 of 6 members selected as editors of this note.</p>
          <button class="add-button" type="button">Add 2 people</button>
          <p class="hint">Everyone else in the workspace keeps view-only access.</p>
        </div>
      </aside>

      <div class="roster">
        <div class="list-heading">
          <p class="list-title">Workspace members</p>
          <p class="selected-count">2 selected</p>
        </div>

        <div class="select-all-row">
          <label class="select-all">
            <input type="checkbox" aria-label="Select all six workspace members">
            <span class="checkbox mixed" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M4 8H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </span>
            <span class="select-all-copy">
              <span class="select-all-title">Select all 6 members</span>
              <span class="select-all-note">Adds everyone in the workspace as an editor</span>
            </span>
          </label>
          <button class="text-button" type="button">Clear selection</button>
        </div>

        <div class="people-grid">
          <label class="person selected">
            <span class="avatar rose" aria-hidden="true">LV</span>
            <span class="person-copy">
              <span class="person-name">Liora Vale</span>
              <span class="person-role">Product design</span>
            </span>
            <input type="checkbox" checked aria-label="Select Liora Vale">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>

          <label class="person">
            <span class="avatar slate" aria-hidden="true">BO</span>
            <span class="person-copy">
              <span class="person-name">Bren Orwin</span>
              <span class="person-role">Platform engineering</span>
            </span>
            <input type="checkbox" aria-label="Select Bren Orwin">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>

          <label class="person selected">
            <span class="avatar sand" aria-hidden="true">SM</span>
            <span class="person-copy">
              <span class="person-name">Sela Marin</span>
              <span class="person-role">Project operations</span>
            </span>
            <input type="checkbox" checked aria-label="Select Sela Marin">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>

          <label class="person">
            <span class="avatar mauve" aria-hidden="true">DR</span>
            <span class="person-copy">
              <span class="person-name">Daven Rook</span>
              <span class="person-role">User research</span>
            </span>
            <input type="checkbox" aria-label="Select Daven Rook">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>

          <label class="person">
            <span class="avatar moss" aria-hidden="true">AC</span>
            <span class="person-copy">
              <span class="person-name">Anwen Cole</span>
              <span class="person-role">Brand design</span>
            </span>
            <input type="checkbox" aria-label="Select Anwen Cole">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>

          <label class="person">
            <span class="avatar clay" aria-hidden="true">IT</span>
            <span class="person-copy">
              <span class="person-name">Ivo Tanaka</span>
              <span class="person-role">Frontend engineering</span>
            </span>
            <input type="checkbox" aria-label="Select Ivo Tanaka">
            <span class="checkbox" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.2L6.5 11L12.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </span>
          </label>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
