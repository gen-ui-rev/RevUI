<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Loading Error — Milehaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9dcdf;
      color: #202124;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #f4f5f6;
      border: 1px solid #cfd2d5;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e3e5e7;
    }

    .service-name {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .help-button {
      min-width: 44px;
      min-height: 36px;
      padding: 7px 10px;
      border: 0;
      background: transparent;
      color: #555b61;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    main {
      flex: 1;
      padding: 80px 20px 32px;
    }

    .error-card {
      width: 100%;
      padding: 30px 24px 24px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(28, 34, 39, 0.09);
      text-align: center;
    }

    .error-icon {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 22px;
      color: #d83b3b;
    }

    .error-card h1 {
      margin: 0;
      color: #202124;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: -0.35px;
    }

    .error-card p {
      margin: 12px auto 0;
      max-width: 280px;
      color: #60666c;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 400;
    }

    .card-actions {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .retry-button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #d83b3b;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .saved-button {
      width: 100%;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1.5px solid #c9ced3;
      border-radius: 10px;
      background: #ffffff;
      color: #23282d;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .saved-button svg {
      display: block;
      width: 18px;
      height: 18px;
      color: #4b5257;
    }

    .actions-note {
      margin: 4px auto 0;
      max-width: 268px;
      color: #7b8187;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 500;
    }

    .tab-bar {
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      padding: 10px 8px 12px;
      background: #ffffff;
      border-top: 1px solid #dfe2e4;
    }

    .tab {
      width: 82px;
      padding: 3px 0 0;
      border: 0;
      background: transparent;
      color: #747a80;
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
      cursor: pointer;
    }

    .tab svg {
      display: block;
      width: 23px;
      height: 23px;
      margin: 0 auto 5px;
    }

    .tab.active {
      color: #d83b3b;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <p class="service-name">Milehaven</p>
      <button class="help-button" type="button">Help</button>
    </header>

    <main>
      <section class="error-card" aria-labelledby="error-title">
        <svg class="error-icon" viewBox="0 0 52 52" fill="none" aria-hidden="true">
          <path d="M26 5.5L47 43H5L26 5.5Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M26 19V30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="26" cy="37" r="2" fill="currentColor"/>
        </svg>

        <h1 id="error-title">We couldn’t load your trip</h1>
        <p>Your booking is still saved. Check your connection, then try loading the itinerary again.</p>

        <div class="card-actions">
          <button class="retry-button" type="button">Try again</button>
          <button class="saved-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 3.5H19V20.5L12 16L5 20.5V3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            Open saved booking
          </button>
          <p class="actions-note">Your confirmation and boarding passes work without a connection.</p>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 10.5L12 3.5L20.5 10.5V20H14.5V14H9.5V20H3.5V10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        Explore
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Search
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 4H17V7.5C17 8.33 17.67 9 18.5 9H20V20H4V9H5.5C6.33 9 7 8.33 7 7.5V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9 4V7M15 4V7M8 13H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Trips
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4.5 20C5.3 16.5 8 14.5 12 14.5C16 14.5 18.7 16.5 19.5 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Account
      </button>
    </nav>
  </div>
</body>
</html>
