<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elsepath</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e9e9ee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #d8d8e2;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -34px;
      color: #17172a;
    }

    /* Brand mark reworked: inverted circular emblem inside a soft halo ring */
    .brand-halo {
      width: 116px;
      height: 116px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 50%;
      background: #f2f1fb;
    }

    .brand-mark {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #4f46b8;
    }

    .brand-mark svg {
      width: 48px;
      height: 48px;
      display: block;
    }

    .brand-name {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .brand-category {
      margin: 9px 0 0;
      color: #69697a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="brand" aria-label="Elsepath travel app">
      <div class="brand-halo" aria-hidden="true">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 37C17 31.5 20.5 29.5 25 27C30.5 23.9 34 19.8 35 12" stroke="#4F46B8" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="13" cy="37" r="4.5" fill="#4F46B8"/>
            <path d="M35 7.5C30.9 7.5 27.5 10.8 27.5 15C27.5 20.3 35 27.5 35 27.5C35 27.5 42.5 20.3 42.5 15C42.5 10.8 39.1 7.5 35 7.5Z" fill="#4F46B8"/>
            <circle cx="35" cy="15" r="2.5" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>
      <h1 class="brand-name">Elsepath</h1>
      <p class="brand-category">Travel planning</p>
    </main>
  </div>
</body>
</html>
