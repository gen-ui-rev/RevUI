<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Trip Widget</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e8e5e4;
      color: #252122;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f3f1f0;
    }

    .trip-widget {
      width: 100%;
      background: #ffffff;
      border: 1px solid #ded7d6;
      border-radius: 6px;
      overflow: hidden;
    }

    .card-top {
      padding: 18px 20px 16px;
      background: #fbeaee;
      border-bottom: 1px solid #f0d5dc;
    }

    .widget-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow,
    .countdown,
    .detail-label {
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: #a4767f;
    }

    .countdown {
      color: #98314f;
      white-space: nowrap;
    }

    h1 {
      margin: 10px 0 0;
      color: #8e2b47;
      font-size: 33px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .trip-date {
      margin: 3px 0 0;
      color: #6b5257;
      font-size: 14px;
      line-height: 1.45;
    }

    .status-line {
      margin: 12px 0 0;
      padding-top: 10px;
      border-top: 1px dashed #eccdd5;
      color: #5c5052;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mark {
      color: #35784f;
      font-weight: 700;
    }

    .mark.pending {
      color: #a97614;
    }

    .sep {
      margin: 0 7px;
      color: #d3b7be;
    }

    .trip-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      padding: 16px 20px 18px;
    }

    .detail-group {
      min-width: 0;
      padding-left: 9px;
      border-left: 2px solid #ecdfe2;
    }

    .detail-label {
      display: block;
      color: #948a8c;
    }

    .detail-value {
      display: block;
      margin-top: 2px;
      color: #2d292a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="trip-widget" aria-labelledby="trip-destination">
      <div class="card-top">
        <header class="widget-heading">
          <span class="eyebrow">Next trip</span>
          <span class="countdown">In 12 days</span>
        </header>

        <h1 id="trip-destination">Lisbon</h1>
        <p class="trip-date">May 18–22, 2026</p>

        <p class="status-line">
          <span class="mark" aria-hidden="true">✓</span> Flight confirmed
          <span class="sep" aria-hidden="true">|</span>
          <span class="mark pending" aria-hidden="true">!</span> Stay awaiting confirmation
        </p>
      </div>

      <section class="trip-details" aria-label="Trip details">
        <div class="detail-group">
          <span class="detail-label">Departure</span>
          <span class="detail-value">JFK · 8:40 PM</span>
        </div>
        <div class="detail-group">
          <span class="detail-label">Flight</span>
          <span class="detail-value">PV 218</span>
        </div>
        <div class="detail-group">
          <span class="detail-label">Stay</span>
          <span class="detail-value">Ribeira House</span>
        </div>
        <div class="detail-group">
          <span class="detail-label">Length</span>
          <span class="detail-value">4 nights</span>
        </div>
      </section>
    </article>
  </div>
</body>
</html>
