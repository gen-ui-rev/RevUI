<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfare Atlas — Tutor Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{
    box-sizing:border-box;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#e8e7e2;
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:30px 32px;
    background:#eceae5;
  }
  .card{
    width:100%;
    background:#ffffff;
    border-radius:14px;
  }
  .hero{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    background:#cfd6d8;
    border-radius:14px 14px 0 0;
  }
  .profile-body{
    padding:18px 20px 20px;
  }
  .ident{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mono{
    width:60px;
    height:60px;
    flex:none;
    border-radius:14px;
    background:rgba(8,145,178,0.14);
    color:#0b7c94;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .who{
    min-width:0;
  }
  .name{
    color:#15191b;
    font-size:21px;
    font-weight:700;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .role{
    margin-top:3px;
    color:#5f6b6f;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rating{
    margin-top:3px;
    color:#425256;
    font-size:13px;
    line-height:1.3;
  }
  .star{
    color:#d58b16;
  }
  .counts{
    margin-top:14px;
    color:#5f6b6f;
    font-size:14px;
  }
  .counts b{
    color:#15191b;
    font-weight:600;
  }
  .action{
    margin-top:15px;
    width:100%;
    border-radius:14px;
    background:#0b7c94;
    color:#ffffff;
    padding:13px 16px;
    font-size:16px;
    font-weight:600;
    text-align:center;
  }
  .availability{
    margin-top:13px;
    border-radius:14px;
    background:rgba(8,145,178,0.12);
    padding:12px 15px;
  }
  .availability .line{
    color:#0a5f72;
    font-size:14px;
    font-weight:600;
    line-height:1.4;
  }
  .availability .sub{
    margin-top:4px;
    color:#4d7b87;
    font-size:13px;
    line-height:1.35;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/326/150/cityscape?lock=1603" width="326" height="150" alt="Rooftops and river view of Lisbon from a hillside lookout">
      <div class="profile-body">
        <div class="ident">
          <div class="mono">DM</div>
          <div class="who">
            <div class="name">Delia Moreau</div>
            <div class="role">Portuguese tutor &middot; Lisbon, Portugal</div>
            <div class="rating"><span class="star">★</span> 4.9 rating &middot; 126 reviews</div>
          </div>
        </div>
        <div class="counts"><b>3</b> languages taught &middot; <b>9</b> years teaching</div>
        <div class="action">Book a trial lesson</div>
        <div class="availability">
          <div class="line">Next lesson available Thursday at 10:00</div>
          <div class="sub">Portuguese for travel, work, and conversation</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
