<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Delivery Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #dfe2dc;
      color: #171914;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      flex: 0 0 auto;
      padding: 28px 22px;
      display: flex;
      align-items: center;
      background: #eef0eb;
    }

    .widget {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d9ddd4;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(37, 49, 40, 0.07);
    }

    .widget-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .brand-copy {
      min-width: 0;
    }

    .service-name {
      margin: 0 0 3px;
      color: #26372d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .order-number {
      margin: 0;
      color: #777c73;
      font-size: 12px;
      line-height: 1.3;
    }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      background: #123f2c;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .delivery {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .delivery img {
      width: 56px;
      height: 56px;
      display: block;
      object-fit: cover;
      background: #d9dbd4;
      border-radius: 10px;
    }

    .delivery-copy {
      min-width: 0;
      padding-left: 15px;
      border-left: 2px solid #b8ca9e;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #687067;
      font-size: 12px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .product-name {
      margin: 0;
      color: #555c53;
      font-size: 13px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracking {
      padding: 15px;
      background: #f2f5ed;
      border: 1px solid #e0e6d9;
      border-radius: 10px;
    }

    .tracking-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      color: #596158;
      font-size: 12px;
      line-height: 1.3;
    }

    .tracking-meta strong {
      color: #1f3327;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .delivery-address {
      width: 100%;
      margin: 0;
      color: #737970;
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track {
      width: 100%;
      height: 6px;
      margin-top: 13px;
      background: #dce3d5;
      border-radius: 999px;
    }

    .track-fill {
      width: 78%;
      height: 6px;
      background: #246044;
      border-radius: 999px;
    }

    .progress-note {
      margin: 8px 0 0;
      color: #526157;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="widget" aria-label="Moss Market delivery summary">
      <div class="widget-header">
        <div class="brand-copy">
          <p class="service-name">Moss Market</p>
          <p class="order-number">Order MM-48217</p>
        </div>
        <span class="status">Out for delivery</span>
      </div>

      <div class="delivery">
        <img src="https://loremflickr.com/56/56/sneakers?lock=2150" width="56" height="56" alt="Cream sneakers from the current order">
        <div class="delivery-copy">
          <p class="eyebrow">Your order is close</p>
          <h1>Arriving today</h1>
          <p class="product-name">Alder Court sneakers · Sand · Size 9</p>
        </div>
      </div>

      <div class="tracking">
        <div class="tracking-meta">
          <span>Estimated delivery</span>
          <strong>2:10–4:10 PM</strong>
        </div>
        <p class="delivery-address" title="1847 Willow Park Avenue, Apartment 5B, Portland, OR 97205">1847 Willow Park Avenue, Apartment 5B, Portland, OR 97205</p>
        <div class="track" aria-label="Delivery progress: 78 percent">
          <div class="track-fill"></div>
        </div>
        <p class="progress-note">Courier is on the final delivery route</p>
      </div>
    </main>
  </div>
</body>
</html>
