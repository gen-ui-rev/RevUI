<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rovebook Stay Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7ea;
      font-family: 'Source Serif 4', Georgia, serif;
      color: #ffffff;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #72766d;
    }

    .story-photo {
      position: absolute;
      inset: 0;
      width: 390px;
      height: 844px;
      display: block;
      object-fit: cover;
      background: #72766d;
    }

    .story-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 14px 13px;
      background: rgba(24, 24, 55, 0.78);
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
    }

    .progress {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .progress-segment {
      position: relative;
      flex: 1;
      height: 4px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.34);
    }

    .progress-fill {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      background: #ffffff;
    }

    .progress-fill.current {
      width: 64%;
      right: auto;
    }

    .progress-fill.empty {
      width: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      margin-top: 15px;
    }

    .service-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      background: #4f46a5;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    .story-source {
      min-width: 0;
      margin-left: 11px;
    }

    .service-name {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 20px;
    }

    .story-count {
      margin: 1px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      line-height: 16px;
    }

    .bookmark-button,
    .close-button {
      height: 38px;
      padding: 8px;
      display: grid;
      place-items: center;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      background: rgba(24, 24, 55, 0.36);
    }

    .bookmark-button {
      width: 34px;
      margin-left: auto;
      margin-right: 8px;
    }

    .close-button {
      width: 38px;
    }

    .bookmark-button svg,
    .close-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .story-caption {
      position: absolute;
      right: 14px;
      bottom: 14px;
      left: 14px;
      padding: 22px;
      color: #262354;
      background: rgba(250, 248, 241, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(18, 17, 43, 0.24);
    }

    .caption-label {
      display: inline-block;
      margin: 0 0 8px;
      padding: 4px 8px;
      color: #514aa1;
      background: #e7e4ff;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .destination {
      margin: 0;
      color: #302d73;
      font-size: 34px;
      font-weight: 700;
      line-height: 37px;
      letter-spacing: -0.03em;
    }

    .property-name {
      margin: 5px 0 0;
      color: #635f78;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .caption-divider {
      width: 44px;
      margin: 15px 0 13px;
      border: 0;
      border-top: 2px solid #7169c6;
    }

    .story-title {
      max-width: 310px;
      margin: 0;
      color: #262354;
      font-size: 21px;
      font-weight: 600;
      line-height: 27px;
    }

    .story-copy {
      max-width: 310px;
      margin: 7px 0 0;
      color: #5c596d;
      font-size: 14px;
      line-height: 20px;
    }

    .booking-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 17px;
      padding-top: 15px;
      border-top: 1px solid #d8d5e4;
    }

    .price {
      min-width: 0;
      margin-right: auto;
    }

    .price-label {
      display: block;
      color: #77738a;
      font-size: 12px;
      line-height: 16px;
    }

    .price-value {
      display: block;
      margin-top: 1px;
      color: #302d73;
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
      white-space: nowrap;
    }

    .primary-action {
      min-height: 46px;
      padding: 11px 17px;
      flex: none;
      border: 1px solid #302d73;
      border-radius: 6px;
      background: #302d73;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <img
      class="story-photo"
      src="https://loremflickr.com/390/844/mountain?lock=11110"
      width="390"
      height="844"
      alt="Mountain lake and pine-covered slopes near the featured lodge"
    >

    <header class="story-header">
      <div class="progress" role="progressbar" aria-label="Story progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2">
        <span class="progress-segment"><span class="progress-fill"></span></span>
        <span class="progress-segment"><span class="progress-fill current"></span></span>
        <span class="progress-segment"><span class="progress-fill empty"></span></span>
        <span class="progress-segment"><span class="progress-fill empty"></span></span>
      </div>

      <nav class="top-bar" aria-label="Story navigation">
        <div class="service-mark" aria-hidden="true">R</div>
        <div class="story-source">
          <p class="service-name">Rovebook</p>
          <p class="story-count">Stay story · 2 of 4</p>
        </div>
        <button class="bookmark-button" type="button" aria-label="Save this stay">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 4.5H17V20L12 16.7L7 20V4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="close-button" type="button" aria-label="Close story">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </nav>
    </header>

    <section class="story-caption" aria-labelledby="destination-title">
      <p class="caption-label">Colorado mountain stay</p>
      <h1 class="destination" id="destination-title">Silverthorne</h1>
      <p class="property-name">Juniper Fold Lodge · Above Lake Dillon</p>
      <hr class="caption-divider">
      <h2 class="story-title">A quiet base with trails at the back door</h2>
      <p class="story-copy">The shoreline and town center are both a short drive from the lodge.</p>

      <div class="booking-row">
        <div class="price">
          <span class="price-label">From</span>
          <span class="price-value">$228 per night</span>
        </div>
        <button class="primary-action" type="button">View this stay</button>
      </div>
    </section>
  </div>
</body>
</html>
