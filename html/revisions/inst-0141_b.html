<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiobook Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e4e3;
      color: #292426;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 22px;
      background: #f8f6f5;
    }

    .service-name {
      margin: 0 0 8px;
      color: #766d70;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #292426;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.28;
    }

    .book-card {
      margin-top: 18px;
      padding: 15px;
      display: flex;
      gap: 14px;
      border-radius: 14px;
      background: #eee4e7;
    }

    .book-cover {
      width: 76px;
      height: 112px;
      flex: 0 0 76px;
      padding: 13px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 6px 10px 10px 6px;
      background: #9f3155;
      color: #ffffff;
      box-shadow: inset 5px 0 0 rgba(75, 17, 37, 0.18);
    }

    .cover-mark {
      font-size: 18px;
      line-height: 1;
    }

    .cover-title {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .book-info {
      min-width: 0;
      flex: 1;
    }

    .book-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .book-author {
      margin: 3px 0 0;
      color: #766d70;
      font-size: 12px;
      line-height: 1.4;
    }

    .chapter-label {
      margin: 13px 0 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .chapter-time {
      margin: 2px 0 0;
      color: #766d70;
      font-size: 11px;
      line-height: 1.4;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      margin-top: 8px;
      border-radius: 99px;
      background: rgba(159, 49, 85, 0.16);
    }

    .progress-value {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #9f3155;
    }

    .menu-heading {
      margin: 18px 0 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .menu-copy {
      margin: 3px 0 0;
      color: #766d70;
      font-size: 12px;
      line-height: 1.45;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .primary-action {
      width: 100%;
      margin-top: 11px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #9f3155;
      color: #ffffff;
      text-align: left;
    }

    .primary-name,
    .secondary-name {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .primary-detail,
    .secondary-detail {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.4;
    }

    .primary-detail {
      color: #f1dfe5;
    }

    .secondary-actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .secondary-action {
      padding: 10px 11px;
      border: 1px solid #d9d3d2;
      border-radius: 10px;
      background: #ffffff;
      color: #292426;
      text-align: left;
    }

    .secondary-detail {
      color: #766d70;
    }

    .chapters-action {
      width: 100%;
      margin-top: 9px;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #9f3155;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="menu-title">
      <p class="service-name">Vela Audio</p>
      <h1 id="menu-title">Your audiobook</h1>

      <section class="book-card" aria-label="Current audiobook and chapter progress">
        <div class="book-cover" aria-hidden="true">
          <span class="cover-mark">✦</span>
          <span class="cover-title">The Cartographer's Daughter</span>
        </div>
        <div class="book-info">
          <p class="book-title">The Cartographer's Daughter</p>
          <p class="book-author">Eliza Hart</p>
          <p class="chapter-label">Chapter 7 of 18</p>
          <p class="chapter-time">18:42 listened · 12 min left</p>
          <div class="progress-track" role="progressbar" aria-label="Audiobook progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">
            <div class="progress-value"></div>
          </div>
        </div>
      </section>

      <p class="menu-heading">What would you like to do?</p>
      <p class="menu-copy">Pick up where you left off or manage the book.</p>

      <div role="menu" aria-label="Audiobook menu">
        <button class="primary-action" type="button" role="menuitem">
          <span class="primary-name">Continue Chapter 7</span>
          <span class="primary-detail">Resume from 18:42</span>
        </button>

        <div class="secondary-actions">
          <button class="secondary-action" type="button" role="menuitem">
            <span class="secondary-name">Add bookmark</span>
            <span class="secondary-detail">Save this moment</span>
          </button>
          <button class="secondary-action" type="button" role="menuitem">
            <span class="secondary-name">Save offline</span>
            <span class="secondary-detail">Download the book</span>
          </button>
        </div>

        <button class="chapters-action" type="button" role="menuitem">Browse all chapters</button>
      </div>
    </main>
  </div>
</body>
</html>
