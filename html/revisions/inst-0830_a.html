<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avenfit Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9d5;
      color: #20201e;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 44px 20px;
      background: #f5f4f0;
    }

    .activity {
      width: 100%;
      padding: 18px;
      background: #fffefa;
      border: 1px solid #cecdc7;
      border-top: 4px solid #e96519;
      border-radius: 0;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .service {
      margin: 0;
      color: #55544f;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      background: #e96519;
      color: #fffefa;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.12em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #fffefa;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #deddd7;
    }

    .workout-name {
      margin: 0;
      color: #20201e;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
    }

    .route {
      margin: 0;
      color: #6a6963;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timing {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 0 12px;
    }

    .elapsed-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .elapsed {
      margin: 0;
      color: #e05b13;
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .micro-label {
      margin: 0;
      color: #6a6963;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .split {
      text-align: right;
    }

    .split-value {
      margin: 0 0 3px;
      color: #20201e;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #e5e3dc;
    }

    .progress-fill {
      width: 61%;
      height: 100%;
      background: #e96519;
    }

    .progress-scale {
      display: flex;
      justify-content: space-between;
      margin: 6px 0 14px;
      color: #8a8982;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #deddd7;
      padding-top: 14px;
    }

    .metric + .metric {
      border-left: 1px solid #deddd7;
      padding-left: 14px;
    }

    .metric-value {
      margin: 0 0 2px;
      color: #20201e;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      margin: 0;
      color: #6a6963;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }

    .chips {
      display: flex;
      gap: 6px;
      margin-top: 14px;
    }

    .chip {
      padding: 4px 8px;
      border: 1px solid #deddd7;
      color: #55544f;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Live walking workout">
      <div class="activity-header">
        <p class="service">Avenfit Health</p>
        <div class="live" aria-label="Live activity">
          <span class="live-dot" aria-hidden="true"></span>
          <span>LIVE</span>
        </div>
      </div>

      <div class="title-row">
        <p class="workout-name">Outdoor walk</p>
        <p class="route">Riverside Loop</p>
      </div>

      <div class="timing">
        <div class="elapsed-block">
          <p class="elapsed">24:18</p>
          <p class="micro-label">Elapsed</p>
        </div>
        <div class="split">
          <p class="split-value">15:42</p>
          <p class="micro-label">Remaining</p>
        </div>
      </div>

      <div class="progress-track" aria-label="61 percent of 40-minute goal complete">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-scale">
        <span>0:00</span>
        <span>61% of 40:00 goal</span>
      </div>

      <div class="metrics">
        <div class="metric">
          <p class="metric-value">1.82 mi</p>
          <p class="metric-label">Distance</p>
        </div>
        <div class="metric">
          <p class="metric-value">126</p>
          <p class="metric-label">Heart rate</p>
        </div>
        <div class="metric">
          <p class="metric-value">13:21</p>
          <p class="metric-label">Avg pace</p>
        </div>
      </div>

      <div class="chips">
        <span class="chip">58&deg;F clear</span>
        <span class="chip">Started 7:42 AM</span>
        <span class="chip">Auto-pause on</span>
      </div>
    </section>
  </div>
</body>
</html>
