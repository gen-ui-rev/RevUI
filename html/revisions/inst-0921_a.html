<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Nightly Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #1f2933;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f4f6f5;
    }

    .budget-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e4e9e8;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(31, 47, 45, 0.06);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #4b6b67;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1f2933;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
    }

    .description {
      margin: 8px 0 20px;
      color: #6b7a78;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .value {
      margin: 0 0 16px;
      color: #1f2933;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.15;
    }

    .value span {
      color: #6b7a78;
      font-size: 14px;
      font-weight: 400;
    }

    .slider-wrap {
      position: relative;
      width: 100%;
      padding: 10px 0;
    }

    .slider-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: #e3e8e7;
      border-radius: 4px;
    }

    .slider-fill {
      width: 62%;
      height: 6px;
      background: #0f766e;
      border-radius: 4px;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 62%;
      width: 22px;
      height: 22px;
      border: 4px solid #0f766e;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(15, 118, 110, 0.25);
    }

    .range-input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0.001;
      cursor: pointer;
    }

    .limits {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #7b8886;
      font-size: 12px;
      font-weight: 400;
    }

    .assurance {
      display: flex;
      gap: 18px;
      margin: 14px 0 0;
      padding: 14px 0 0;
      border-top: 1px solid #edf1f0;
      list-style: none;
    }

    .assurance li {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #475856;
      font-size: 12px;
      font-weight: 500;
    }

    .tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e2efed;
      color: #0f766e;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }

    .apply-button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 15px 16px;
      border: 0;
      border-radius: 10px;
      background: #0f766e;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.22);
    }

    .note {
      margin: 12px 0 0;
      color: #7b8886;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="budget-card" aria-labelledby="budget-title">
      <p class="eyebrow">Northpath stays</p>
      <h1 id="budget-title">Set your nightly budget</h1>
      <p class="description">Choose the highest nightly rate shown in your stay results.</p>

      <p class="value">$240 <span>per night</span></p>

      <div class="slider-wrap">
        <div class="slider-track" aria-hidden="true">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
        </div>
        <input class="range-input" type="range" min="80" max="340" value="240" aria-label="Maximum nightly budget">
      </div>

      <div class="limits" aria-hidden="true">
        <span>$80</span>
        <span>$340+</span>
      </div>

      <ul class="assurance">
        <li><span class="tick" aria-hidden="true">&#10003;</span>Free cancellation</li>
        <li><span class="tick" aria-hidden="true">&#10003;</span>No booking fees</li>
      </ul>

      <button class="apply-button" type="button">Apply budget</button>
      <p class="note">You won't be charged &mdash; this only filters the rates you see.</p>
    </section>
  </div>
</body>
</html>
