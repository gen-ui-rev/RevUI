<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Saved List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e7e9e5;
      color: #20231d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 768px;
      height: 1024px;
      padding: 46px 48px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(26, 31, 39, 0.08);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      border-bottom: 1px solid #e8eae5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #172132;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #b5e83e;
      color: #172132;
      font-size: 19px;
      font-weight: 600;
    }

    .section-label {
      color: #686e62;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .empty-state {
      width: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      align-items: center;
      gap: 48px;
    }

    .visual {
      padding: 86px 28px;
      border-radius: 24px;
      background: #172132;
    }

    .visual svg {
      display: block;
      width: 190px;
      height: 160px;
      margin: 0 auto;
    }

    .content {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #668c0c;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: #172132;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.8px;
    }

    .description {
      margin: 0;
      color: #686e62;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 400;
    }

    .search-form {
      margin-top: 30px;
    }

    .search-form label {
      display: block;
      margin-bottom: 9px;
      color: #32382e;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    .search-field {
      width: 100%;
      min-height: 56px;
      padding: 0 16px;
      border: 1px solid #d9ddd4;
      border-radius: 14px;
      outline: none;
      background: #fafbf9;
      color: #20231d;
      font: inherit;
      font-size: 14px;
    }

    .search-field::placeholder {
      color: #92988d;
    }

    .search-field:focus {
      border-color: #7fa91b;
      box-shadow: 0 0 0 3px rgba(181, 232, 62, 0.22);
    }

    .cta {
      width: 100%;
      min-height: 56px;
      margin-top: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 14px;
      background: #b5e83e;
      color: #1d2411;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .cta svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .footer-note {
      margin: 0;
      padding-top: 20px;
      border-top: 1px solid #e8eae5;
      color: #858b80;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Morrow Market</span>
      </div>
      <span class="section-label">Saved products</span>
    </header>

    <main>
      <section class="empty-state" aria-labelledby="empty-title">
        <div class="visual" aria-hidden="true">
          <svg viewBox="0 0 190 160" xmlns="http://www.w3.org/2000/svg">
            <rect x="34" y="50" width="122" height="100" rx="22" fill="#B5E83E"/>
            <path d="M65 57V42C65 25.4 78.4 12 95 12C111.6 12 125 25.4 125 42V57" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
            <circle cx="67" cy="88" r="7" fill="#FFFFFF"/>
            <circle cx="123" cy="88" r="7" fill="#FFFFFF"/>
            <path d="M75 108C80.5 116 87 120 95 120C103 120 109.5 116 115 108" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
            <circle cx="159" cy="40" r="18" fill="#FFFFFF"/>
            <path d="M159 31V49M150 40H168" stroke="#172132" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="content">
          <p class="eyebrow">Your collection</p>
          <h1 id="empty-title">Your saved list is empty</h1>
          <p class="description">Keep products you want to revisit in one place while you shop Morrow Market.</p>

          <form class="search-form" action="#" method="get" role="search">
            <label for="product-search-a">Search for a product</label>
            <input class="search-field" id="product-search-a" name="query" type="search" placeholder="Product name or category">
            <button class="cta" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
                <path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
              Browse products
            </button>
          </form>
        </div>
      </section>
    </main>

    <p class="footer-note">Saved products will appear here for quick access.</p>
  </div>
</body>
</html>
