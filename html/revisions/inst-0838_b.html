<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circleloom Badge Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e5e8;
      color: #29252a;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 16px;
      background: #f4f1f4;
    }

    .tray {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(41, 31, 38, 0.07);
    }

    .intro {
      padding: 14px;
      background: rgba(207, 20, 133, 0.10);
      border-radius: 10px;
    }

    .intro h1 {
      margin: 0;
      color: #b71375;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
    }

    .intro p {
      margin: 4px 0 0;
      color: #665d64;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .scope-section,
    .picker-section {
      margin-top: 14px;
    }

    .section-label {
      display: block;
      margin-bottom: 6px;
      color: #5f575e;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
    }

    .scope-row {
      display: grid
      ;grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .scope-button {
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: #f2eff1;
      color: #686066;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }

    .scope-button.active {
      background: rgba(207, 20, 133, 0.12);
      color: #b71375;
    }

    .badge-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .strip-badge {
      padding: 8px 4px;
      border: 0;
      border-radius: 10px;
      background: #f6f2f5;
      color: #9a8f96;
      text-align: center;
    }

    .strip-badge.selected {
      background: rgba(207, 20, 133, 0.14);
      color: #a8106a;
      box-shadow: inset 0 0 0 2px #c8157d;
    }

    .strip-badge svg {
      display: block;
      width: 30px;
      height: 30px;
      margin: 0 auto 5px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .strip-name {
      display: block;
      overflow: hidden;
      color: #564d53;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .strip-badge.selected .strip-name {
      color: #a8106a;
    }

    .detail-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 12px;
      padding: 14px;
      background: rgba(207, 20, 133, 0.08);
      border-radius: 10px;
    }

    .detail-icon {
      display: grid;
      flex: 0 0 auto;
      width: 56px;
      height: 56px;
      place-items: center;
      border-radius: 10px;
      background: #ffffff;
      color: #a8106a;
    }

    .detail-icon svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .detail-text {
      min-width: 0;
    }

    .detail-text h2 {
      margin: 0;
      color: #3a3238;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    .detail-meaning {
      margin: 4px 0 0;
      color: #6f6570;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
    }

    .detail-meta {
      margin: 10px 0 0;
      padding-top: 8px;
      border-top: 1px solid rgba(168, 16, 106, 0.16);
      color: #857b83;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 400;
    }

    .add-button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #c8157d;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="tray" aria-label="Classroom feedback badge picker">
      <header class="intro">
        <h1>Send feedback</h1>
        <p>Grade 4 reading group · Term 2</p>
      </header>

      <section class="scope-section" aria-labelledby="scope-label">
        <span class="section-label" id="scope-label">Who receives this badge</span>
        <div class="scope-row">
          <button class="scope-button" type="button">Whole class</button>
          <button class="scope-button active" type="button" aria-pressed="true">Maya R.</button>
        </div>
      </section>

      <section class="picker-section" aria-labelledby="strip-label">
        <span class="section-label" id="strip-label">Browse badges</span>
        <div class="badge-strip">
          <button class="strip-badge" type="button" aria-label="Effort badge">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="18" r="11"></circle>
              <path d="M17 27 13 42l11-6 11 6-4-15"></path>
            </svg>
            <span class="strip-name">Effort</span>
          </button>

          <button class="strip-badge selected" type="button" aria-label="Focus badge, selected">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="15"></circle>
              <circle cx="24" cy="24" r="8"></circle>
              <circle cx="24" cy="24" r="2"></circle>
            </svg>
            <span class="strip-name">Focus</span>
          </button>

          <button class="strip-badge" type="button" aria-label="Kindness badge">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M24 39 9.8 25.5A9.2 9.2 0 0 1 23 12.7L24 14l1-1.3a9.2 9.2 0 0 1 13.2 12.8L24 39Z"></path>
            </svg>
            <span class="strip-name">Kindness</span>
          </button>

          <button class="strip-badge" type="button" aria-label="Growth badge">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M24 42V20"></path>
              <path d="M24 22c-8 0-12-5-12-13 8 0 12 5 12 13Z"></path>
              <path d="M24 26c8 0 12-5 12-13-8 0-12 5-12 13Z"></path>
            </svg>
            <span class="strip-name">Growth</span>
          </button>

          <button class="strip-badge" type="button" aria-label="Curiosity badge">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M15 21a9 9 0 1 1 18 0c0 4-2.3 6.1-4.7 8.5-1.2 1.2-1.3 2.2-1.3 3.5h-6c0-1.3-.2-2.4-1.4-3.6C17.2 27 15 25 15 21Z"></path>
              <path d="M21 37h6M22 41h4"></path>
            </svg>
            <span class="strip-name">Curious</span>
          </button>
        </div>

        <div class="detail-card">
          <span class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="15"></circle>
              <circle cx="24" cy="24" r="8"></circle>
              <circle cx="24" cy="24" r="2"></circle>
            </svg>
          </span>
          <div class="detail-text">
            <h2>Deep Focus</h2>
            <p class="detail-meaning">Student sees: “You stayed with your reading and finished strong.”</p>
            <p class="detail-meta">Saved to Maya's portfolio · Included in the Friday family digest</p>
          </div>
        </div>
      </section>

      <button class="add-button" type="button">Award Deep Focus to Maya R.</button>
    </main>
  </div>
</body>
</html>
