<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e8e9ea;
    font-family:'Inter', system-ui, sans-serif;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#1e2023;
    border-radius:30px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  .ring{
    position:relative;
    width:96px;
    height:96px;
  }
  .ring svg{display:block}
  .ring-core{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .count{
    font-size:26px;
    font-weight:700;
    line-height:1;
    color:#f3f4f6;
    letter-spacing:-0.01em;
  }
  .count span{
    font-size:15px;
    font-weight:500;
    color:#9aa0a8;
  }
  .count-label{
    margin-top:3px;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9aa0a8;
  }
  .status{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
    line-height:15px;
    color:#22d3ee;
  }
  .eta{
    font-size:26px;
    font-weight:700;
    line-height:30px;
    color:#f3f4f6;
    letter-spacing:-0.01em;
  }
  .eta em{
    font-style:normal;
    font-size:11px;
    font-weight:500;
    color:#9aa0a8;
    margin-left:2px;
  }
  .next{
    margin-top:6px;
    width:100%;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:7px;
    background:#272a2e;
    border:1px solid #3a3e44;
    border-radius:10px;
    padding:4px 6px;
  }
  .next img{
    display:block;
    width:28px;
    height:28px;
    object-fit:cover;
    background:#3a3e44;
    border-radius:7px;
    flex:none;
  }
  .next .text{min-width:0}
  .next .name{
    margin:0;
    font-size:11px;
    font-weight:600;
    color:#f3f4f6;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .next .addr{
    margin:1px 0 0;
    font-size:10px;
    font-weight:400;
    color:#9aa0a8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" aria-hidden="true">
        <circle cx="48" cy="48" r="42" stroke="#3a3e44" stroke-width="7"/>
        <circle cx="48" cy="48" r="42" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-dasharray="176 264" transform="rotate(-90 48 48)"/>
      </svg>
      <div class="ring-core">
        <div class="count">6<span>/9</span></div>
        <div class="count-label">Stops done</div>
      </div>
    </div>

    <div class="status">On route</div>
    <div class="eta">4:35<em>PM</em></div>

    <div class="next">
      <img src="https://loremflickr.com/28/28/furniture?lock=6921" width="28" height="28" alt="Alder lounge chair on the delivery van">
      <div class="text">
        <p class="name">Alder Lounge Chair</p>
        <p class="addr">12 Rowan St, Apt 4</p>
      </div>
    </div>
  </div>
</body>
</html>
