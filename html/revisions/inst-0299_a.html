<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home exercise minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    background:#EDEFF1;
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    color:#17201D;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:18px 24px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .card{
    width:342px;
    background:#FFFFFF;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(20,32,28,.08);
    padding:18px;
  }
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .eyebrow{
    font-size:12px;
    color:#68736F;
    letter-spacing:.02em;
  }
  .big{
    font-size:27px;
    font-weight:600;
    line-height:1.1;
    margin-top:3px;
  }
  .therapist{
    font-size:13px;
    color:#44524D;
    margin-top:4px;
  }
  .sub{
    font-size:12px;
    color:#68736F;
    margin-top:2px;
  }
  .sub b{color:#087F5B;font-weight:600;}
  .glyph{color:#159A72;flex:none;margin-top:2px;}

  .start{
    width:100%;
    border:0;
    border-radius:9px;
    background:#087F5B;
    color:#FFFFFF;
    font:600 15px 'Source Serif 4', Georgia, serif;
    padding:10px 14px;
    margin-top:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .start svg{flex:none;}

  .chart{
    position:relative;
    height:99px;
    margin-top:17px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .goal{
    position:absolute;
    left:0;
    right:0;
    bottom:64px;
    border-top:1px dashed #9AA3AD;
  }
  .goal span{
    position:absolute;
    right:0;
    top:-16px;
    padding-left:4px;
    background:#FFFFFF;
    color:#68736F;
    font-size:11px;
  }
  .bar{
    width:25px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
  }
  .seg-a{background:#159A72;}
  .seg-b{background:#BFE7DA;}
  .days{
    display:flex;
    justify-content:space-between;
    margin-top:6px;
  }
  .days span{
    width:25px;
    text-align:center;
    font-size:11px;
    color:#727C78;
  }
  .days .on{
    color:#17201D;
    font-weight:700;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:10px;
    font-size:11px;
    color:#68736F;
    white-space:nowrap;
  }
  .legend i{
    display:inline-block;
    width:9px;
    height:9px;
    margin-right:5px;
    vertical-align:-1px;
  }
  .legend .dash{
    width:12px;
    height:0;
    border-top:1px dashed #9AA3AD;
    vertical-align:3px;
  }
  .rule{
    height:1px;
    background:#E7EBE9;
    margin:14px 0 11px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .sect{
    font-size:12px;
    color:#68736F;
  }
  .detail{
    font-size:11px;
    color:#8A938F;
  }
  .row{
    display:flex;
    align-items:center;
    padding:5px 0;
  }
  .name{
    flex:1;
    min-width:0;
    padding-right:8px;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track{
    width:76px;
    height:6px;
    background:#EDF2F0;
    flex:none;
    border-radius:4px;
  }
  .fill{
    height:6px;
    background:#159A72;
    border-radius:4px;
  }
  .val{
    width:51px;
    text-align:right;
    font-size:13px;
    color:#68736F;
  }
  .val b{color:#17201D;font-weight:600;}
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <div>
          <div class="eyebrow">Home exercise · Week of March 3</div>
          <div class="big">4 hr 44 min</div>
          <div class="therapist">Prescribed by Maya Chen, PT</div>
          <div class="sub"><b>79%</b> of your 6 hr weekly plan</div>
        </div>
        <svg class="glyph" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h3l2-4 3.5 8 2-4H19"></path>
          <circle cx="12" cy="12" r="9"></circle>
        </svg>
      </div>

      <button class="start" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        Start today’s exercise record
      </button>

      <div class="chart">
        <div class="goal"><span>40 min/day</span></div>
        <div class="bar"><div class="seg-b" style="height:18px"></div><div class="seg-a" style="height:47px"></div></div>
        <div class="bar"><div class="seg-b" style="height:12px"></div><div class="seg-a" style="height:31px"></div></div>
        <div class="bar"><div class="seg-b" style="height:25px"></div><div class="seg-a" style="height:60px"></div></div>
        <div class="bar"><div class="seg-b" style="height:12px"></div><div class="seg-a" style="height:41px"></div></div>
        <div class="bar"><div class="seg-b" style="height:25px"></div><div class="seg-a" style="height:70px"></div></div>
        <div class="bar"><div class="seg-b" style="height:8px"></div><div class="seg-a" style="height:19px"></div></div>
        <div class="bar"><div class="seg-b" style="height:23px"></div><div class="seg-a" style="height:47px"></div></div>
      </div>

      <div class="days">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span class="on">Fri</span><span>Sat</span><span>Sun</span>
      </div>

      <div class="legend">
        <span><i class="seg-a"></i>Completed</span>
        <span><i class="seg-b"></i>Assisted</span>
        <span><i class="dash"></i>Daily plan</span>
      </div>

      <div class="rule"></div>

      <div class="section-head">
        <div class="sect">Minutes by exercise group</div>
        <div class="detail">This week</div>
      </div>

      <div class="row">
        <div class="name">Lower-body strength</div>
        <div class="track"><div class="fill" style="width:100%"></div></div>
        <div class="val"><b>82</b> min</div>
      </div>
      <div class="row">
        <div class="name">Mobility</div>
        <div class="track"><div class="fill" style="width:85%"></div></div>
        <div class="val"><b>70</b> min</div>
      </div>
      <div class="row">
        <div class="name">Balance</div>
        <div class="track"><div class="fill" style="width:73%"></div></div>
        <div class="val"><b>60</b> min</div>
      </div>
      <div class="row">
        <div class="name">Stretching</div>
        <div class="track"><div class="fill" style="width:63%"></div></div>
        <div class="val"><b>52</b> min</div>
      </div>
    </div>
  </div>
</body>
</html>
