<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Comment Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedbd7;
      color: #282321;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(47, 40, 37, 0.08);
    }

    .top {
      padding: 22px 24px 18px;
      background: #39322f;
      border-radius: 8px 8px 0 0;
      color: #ffffff;
    }

    .top-label {
      margin: 0 0 6px;
      color: #e6c8c5;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .scope {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 6px;
    }

    .scope-copy {
      min-width: 0;
    }

    .scope-label {
      display: block;
      color: #cfc5c1;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 500;
    }

    .scope-name {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: #ffffff;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scope-badge {
      padding: 5px 8px;
      color: #ffffff;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      background: #b8322e;
      border-radius: 999px;
      white-space: nowrap;
    }

    .content {
      padding: 18px 24px 20px;
    }

    .instruction {
      margin: 0;
      color: #5f5753;
      font-size: 13px;
      line-height: 1.45;
    }

    fieldset {
      min-width: 0;
      margin: 15px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .choice {
      position: relative;
      border-top: 1px solid #e8e3e0;
    }

    .choice:last-child {
      border-bottom: 1px solid #e8e3e0;
    }

    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
      opacity: 0;
      pointer-events: none;
    }

    .choice label {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px 4px;
      cursor: pointer;
    }

    .radio {
      width: 20px;
      height: 20px;
      margin-top: 1px;
      display: grid;
      place-items: center;
      border: 2px solid #b9b0ab;
      border-radius: 50%;
    }

    .radio::after {
      width: 8px;
      height: 8px;
      content: "";
      background: #ffffff;
      border-radius: 50%;
    }

    .choice input:checked + label .radio {
      border-color: #b8322e;
      background: #b8322e;
    }

    .choice input:checked + label .choice-title {
      color: #b8322e;
    }

    .choice input:focus-visible + label {
      outline: 3px solid rgba(200, 63, 58, 0.18);
      outline-offset: -2px;
    }

    .choice-copy {
      min-width: 0;
    }

    .choice-title {
      display: block;
      color: #302a28;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .choice-description {
      display: block;
      margin-top: 2px;
      color: #746c68;
      font-size: 11px;
      line-height: 1.45;
    }

    .review {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 10px 12px;
      background: #f5f2f0;
      border-radius: 5px;
      color: #5f5753;
      font-size: 11px;
      line-height: 1.4;
    }

    .review strong {
      color: #302a28;
      text-align: right;
    }

    .apply {
      width: 100%;
      margin-top: 13px;
      padding: 12px 16px;
      border: 0;
      border-radius: 6px;
      background: #b8322e;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      cursor: pointer;
    }

    .apply:focus-visible {
      outline: 3px solid rgba(200, 63, 58, 0.24);
      outline-offset: 2px;
    }

    .note {
      margin: 7px 0 0;
      color: #827873;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="permission-heading">
      <header class="top">
        <p class="top-label">Workspace controls</p>
        <h1 id="permission-heading">Set comment access</h1>

        <section class="scope" aria-label="Permission scope">
          <span class="scope-copy">
            <span class="scope-label">Changing permissions for</span>
            <span class="scope-name">Q3 Product Launch Brief</span>
          </span>
          <span class="scope-badge">This document</span>
        </section>
      </header>

      <div class="content">
        <p class="instruction">Review the choices below, then apply your selection to this document.</p>

        <form>
          <fieldset>
            <legend>Choose who can comment</legend>

            <div class="choice">
              <input type="radio" id="access-members" name="comment-access">
              <label for="access-members">
                <span class="radio" aria-hidden="true"></span>
                <span class="choice-copy">
                  <span class="choice-title">All workspace members</span>
                  <span class="choice-description">Anyone in Northstar Studio can comment.</span>
                </span>
              </label>
            </div>

            <div class="choice">
              <input type="radio" id="access-document" name="comment-access" checked>
              <label for="access-document">
                <span class="radio" aria-hidden="true"></span>
                <span class="choice-copy">
                  <span class="choice-title">People with document access</span>
                  <span class="choice-description">Editors, viewers, and invited commenters.</span>
                </span>
              </label>
            </div>

            <div class="choice">
              <input type="radio" id="access-managers" name="comment-access">
              <label for="access-managers">
                <span class="radio" aria-hidden="true"></span>
                <span class="choice-copy">
                  <span class="choice-title">Workspace managers</span>
                  <span class="choice-description">Only managers can add or reply to comments.</span>
                </span>
              </label>
            </div>
          </fieldset>

          <div class="review" aria-label="Pending selection">
            <span>Pending selection</span>
            <strong>People with document access</strong>
          </div>

          <button class="apply" type="submit">Apply to this document</button>
        </form>

        <p class="note">No changes are made until you apply.</p>
      </div>
    </main>
  </div>
</body>
</html>
