<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    background:#dedcd8;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Roboto', system-ui, sans-serif;
    color:#1c1917;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#ffffff;
    border-radius:30px;
    border:1px solid #e0ddd7;
    padding:11px 10px 10px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .head{
    text-align:center;
    padding:0 2px 8px;
    border-bottom:1px solid #e6e3de;
  }
  .head .title{
    margin:0;
    font-size:12px;
    font-weight:700;
    line-height:14px;
    letter-spacing:-0.1px;
  }
  .head .sub{
    margin:3px 0 0;
    font-size:8.5px;
    line-height:10px;
    color:#8a827b;
  }
  .list{
    margin-top:6px;
  }
  .opt{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:7px 10px;
    border-radius:8px;
    background:#f4f3f0;
    margin-bottom:5px;
    min-width:0;
  }
  .opt:last-child{margin-bottom:0;}
  .opt .lbl{
    font-size:11px;
    line-height:13px;
    font-weight:500;
    color:#2b2724;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .opt .hint{
    font-size:8.5px;
    line-height:10px;
    color:#8a827b;
    flex:0 0 auto;
  }
  .opt.on{
    background:#2f2b28;
  }
  .opt.on .lbl{color:#ffffff;}
  .opt.on .hint{color:#d8cfc2;}
  .check{
    flex:0 0 auto;
    color:#e8b04b;
    display:flex;
    align-items:center;
  }
  .foot{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #e6e3de;
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
  }
  .mono{
    width:22px;
    height:22px;
    border-radius:6px;
    background:#57534e;
    color:#fff;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.4px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .meta{min-width:0;}
  .meta .name{
    font-size:10px;
    line-height:12px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta .line{
    font-size:8.5px;
    line-height:10px;
    color:#8a827b;
    margin-top:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="head">
      <p class="title">Sleep timer</p>
      <p class="sub">Fades out, then stops</p>
    </div>

    <div class="list">
      <div class="opt">
        <span class="lbl">20 min</span>
        <span class="hint">ends 11:04</span>
      </div>
      <div class="opt on">
        <span class="lbl">35 min</span>
        <span class="check" role="img" aria-label="Selected">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.4l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <div class="opt">
        <span class="lbl">50 min</span>
        <span class="hint">ends 11:34</span>
      </div>
      <div class="opt">
        <span class="lbl">End of episode</span>
        <span class="hint">48 min</span>
      </div>
    </div>

    <div class="foot">
      <div class="mono">CT</div>
      <div class="meta">
        <div class="name">Cascade Theory</div>
        <div class="line">Ep. 112 · 48 min left</div>
      </div>
    </div>
  </div>
</body>
</html>
