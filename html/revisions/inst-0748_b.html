<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #d4d4d8;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    background: #e4e4e7;
  }
  .sheet {
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(24, 24, 27, 0.14);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px;
    border-bottom: 1px solid #e4e4e7;
  }
  .head-text {
    min-width: 0;
    flex: 1 1 auto;
  }
  .series {
    color: #18181b;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.3px;
  }
  .title {
    margin-top: 5px;
    color: #52525b;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.35;
  }
  .meta {
    margin-top: 5px;
    color: #a1a1aa;
    font-size: 12px;
    line-height: 1.3;
  }
  .art {
    width: 54px;
    height: 54px;
    flex: 0 0 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #3f3f46;
  }
  .groups {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 18px 0 20px;
  }
  .group {
    min-width: 0;
    padding: 0 18px;
  }
  .group + .group {
    border-left: 1px solid #e4e4e7;
  }
  .group-label {
    margin-bottom: 13px;
    color: #a1a1aa;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 1.3px;
    text-transform: uppercase;
  }
  .action {
    color: #18181b;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.3;
  }
  .action + .action {
    margin-top: 22px;
  }
  .action .sub {
    display: block;
    margin-top: 4px;
    color: #71717a;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.35;
  }
  .cancel-wrap {
    margin-top: auto;
    text-align: center;
  }
  .cancel {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border: 1px solid #a1a1aa;
    border-radius: 24px;
    background: transparent;
    color: #52525b;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
  }
  .cancel-mark {
    color: #71717a;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="head">
        <div class="head-text">
          <div class="series">Field Notes</div>
          <div class="title">The Quiet Part of the Grid</div>
          <div class="meta">Episode 142 &middot; 48 min</div>
        </div>
        <div class="art" aria-hidden="true">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path>
            <path d="M12 18v3.5"></path>
          </svg>
        </div>
      </div>

      <div class="groups">
        <div class="group">
          <div class="group-label">Playback</div>
          <div class="action">Play next</div>
          <div class="action">Add to playlist</div>
        </div>

        <div class="group">
          <div class="group-label">Save</div>
          <div class="action">
            Download episode
            <span class="sub">62 MB over Wi-Fi</span>
          </div>
          <div class="action">Share episode</div>
        </div>
      </div>
    </div>

    <div class="cancel-wrap">
      <div class="cancel"><span class="cancel-mark">&times;</span> Cancel</div>
    </div>
  </div>
</body>
</html>
