<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonalyn Listening Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e4df;
      color: #302b27;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 18px;
      background: #f5f1ec;
    }

    .chart-card {
      width: 100%;
      padding: 16px;
      background: #fffdfb;
      border-radius: 14px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 13px;
      border-bottom: 1px solid #eadfd7;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow,
    .period-month,
    .period-year,
    .axis-note,
    .legend,
    .chart-value {
      font-size: 12px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #8b7769;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 600;
    }

    .period-card {
      flex: 0 0 auto;
      min-width: 82px;
      padding: 8px 10px;
      border-left: 3px solid #e6671f;
      background: rgba(230, 103, 31, 0.08);
      border-radius: 0 10px 10px 0;
    }

    .period-month,
    .period-year {
      margin: 0;
    }

    .period-month {
      color: #514943;
      font-weight: 600;
      white-space: nowrap;
    }

    .period-year {
      margin-top: 1px;
      color: #82766f;
    }

    .summary {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(230, 103, 31, 0.11);
      border-radius: 12px;
    }

    .summary-label {
      margin: 0;
      color: #765f50;
      font-size: 13px;
    }

    .summary-value {
      margin: 1px 0 0;
      color: #d95f1b;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 600;
    }

    .summary-note {
      margin: 4px 0 0;
      color: #6e625b;
      font-size: 12px;
    }

    figure {
      margin: 14px 0 0;
    }

    .chart-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .chart-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .axis-note {
      margin: 0;
      color: #82766f;
      white-space: nowrap;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 8px;
      min-height: 27px;
    }

    .chart-day {
      color: #665c55;
      font-size: 13px;
      font-weight: 600;
    }

    .bar-track {
      display: flex;
      width: 100%;
      height: 11px;
      background: rgba(230, 103, 31, 0.08);
      border-radius: 14px;
    }

    .bar-music,
    .bar-podcast {
      height: 11px;
    }

    .bar-music {
      background: #e6671f;
    }

    .bar-podcast {
      background: rgba(230, 103, 31, 0.36);
    }

    .bar-track span:first-child {
      border-radius: 14px 0 0 14px;
    }

    .bar-track span:last-child {
      border-radius: 0 14px 14px 0;
    }

    .chart-value {
      color: #514943;
      text-align: right;
      white-space: nowrap;
    }

    figcaption {
      margin-top: 9px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #665c55;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      background: #e6671f;
    }

    .swatch.podcast {
      background: rgba(230, 103, 31, 0.36);
    }

    .insight {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid #eee5de;
      color: #685d56;
      font-size: 13px;
    }

    .insight p {
      margin: 0;
    }

    .insight strong {
      color: #332d29;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="chart-card" aria-labelledby="chart-title">
      <header class="page-header">
        <div class="header-copy">
          <p class="eyebrow">Tonalyn activity</p>
          <h1 id="chart-title">Your listening time</h1>
        </div>
        <div class="period-card" aria-label="January 6 through 12, 2025">
          <p class="period-month">Jan 6–12</p>
          <p class="period-year">2025</p>
        </div>
      </header>

      <div class="summary">
        <p class="summary-label">Total this week</p>
        <p class="summary-value">12 hr 48 min</p>
        <p class="summary-note">1 hr 50 min per day on average</p>
      </div>

      <figure aria-labelledby="daily-title">
        <div class="chart-heading">
          <h2 id="daily-title">Daily minutes</h2>
          <p class="axis-note">Peak: 148 min</p>
        </div>

        <div class="chart-row">
          <span class="chart-day">Mon</span>
          <div class="bar-track" aria-label="Monday: 61 minutes of music and 21 minutes of podcasts">
            <span class="bar-music" style="width:41.2%"></span>
            <span class="bar-podcast" style="width:14.2%"></span>
          </div>
          <span class="chart-value">82 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Tue</span>
          <div class="bar-track" aria-label="Tuesday: 100 minutes of music and 26 minutes of podcasts">
            <span class="bar-music" style="width:67.6%"></span>
            <span class="bar-podcast" style="width:17.5%"></span>
          </div>
          <span class="chart-value">126 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Wed</span>
          <div class="bar-track" aria-label="Wednesday: 54 minutes of music and 40 minutes of podcasts">
            <span class="bar-music" style="width:36.5%"></span>
            <span class="bar-podcast" style="width:27%"></span>
          </div>
          <span class="chart-value">94 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Thu</span>
          <div class="bar-track" aria-label="Thursday: 121 minutes of music and 27 minutes of podcasts">
            <span class="bar-music" style="width:81.8%"></span>
            <span class="bar-podcast" style="width:18.2%"></span>
          </div>
          <span class="chart-value">148 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Fri</span>
          <div class="bar-track" aria-label="Friday: 89 minutes of music and 23 minutes of podcasts">
            <span class="bar-music" style="width:60.1%"></span>
            <span class="bar-podcast" style="width:15.6%"></span>
          </div>
          <span class="chart-value">112 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Sat</span>
          <div class="bar-track" aria-label="Saturday: 72 minutes of music and 32 minutes of podcasts">
            <span class="bar-music" style="width:48.6%"></span>
            <span class="bar-podcast" style="width:21.7%"></span>
          </div>
          <span class="chart-value">104 min</span>
        </div>

        <div class="chart-row">
          <span class="chart-day">Sun</span>
          <div class="bar-track" aria-label="Sunday: 81 minutes of music and 21 minutes of podcasts">
            <span class="bar-music" style="width:54.7%"></span>
            <span class="bar-podcast" style="width:14.2%"></span>
          </div>
          <span class="chart-value">102 min</span>
        </div>

        <figcaption>
          <div class="legend" aria-label="Chart legend">
            <span class="legend-item"><span class="swatch"></span>Music</span>
            <span class="legend-item"><span class="swatch podcast"></span>Podcasts</span>
          </div>
          <div class="insight">
            <p>Most active day</p>
            <p><strong>Thursday, 148 min</strong></p>
          </div>
        </figcaption>
      </figure>
    </section>
  </div>
</body>
</html>
