<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    background: #EFEEF0;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #2B2630;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 24px;
    background: #EFEEF0;
  }
  .card {
    background: #FFFFFF;
    border-radius: 4px;
    box-shadow: 0 2px 10px rgba(43, 38, 48, 0.10);
    padding: 24px 22px 22px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #8C6A8E;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.2;
    margin: 0 0 18px;
  }
  .value {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1;
    color: #2B2630;
    margin: 0;
  }
  .schedule-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    color: #6E6873;
    font-size: 13px;
    white-space: nowrap;
  }
  .schedule-label {
    flex: 0 0 auto;
  }
  .clock-control {
    display: flex;
    align-items: center;
    min-width: 0;
    border-bottom: 1px solid #BFB6C2;
    padding-bottom: 2px;
  }
  .clock-control:focus-within {
    border-color: #8C6A8E;
    box-shadow: 0 2px 0 rgba(140, 106, 142, 0.16);
  }
  .clock-control input {
    width: 37px;
    border: 0;
    padding: 0;
    background: transparent;
    color: #2B2630;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    outline: none;
  }
  .clock-control select {
    width: 31px;
    margin-left: 1px;
    border: 0;
    padding: 0;
    background: transparent;
    color: #5B5462;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    outline: none;
  }
  .overnight-arrow {
    flex: 0 0 auto;
    color: #9A919D;
    font-size: 14px;
  }
  .slider {
    margin: 22px 0 0;
  }
  .track {
    position: relative;
    height: 6px;
    background: #E7E3E9;
    border-radius: 4px;
  }
  .fill {
    position: absolute;
    top: 0;
    left: 0;
    width: 55%;
    height: 6px;
    background: #8C6A8E;
    border-radius: 4px;
  }
  .thumb {
    position: absolute;
    top: -8px;
    left: 55%;
    margin-left: -11px;
    width: 22px;
    height: 22px;
    background: #FFFFFF;
    border: 3px solid #8C6A8E;
    border-radius: 4px;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 12px;
    color: #8B858F;
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #EBE8EC;
  }
  .stepper-label {
    font-size: 14px;
    color: #6E6873;
  }
  .buttons {
    display: flex;
    gap: 10px;
  }
  .step-btn {
    width: 44px;
    height: 44px;
    border: 1px solid #DDD8E0;
    border-radius: 4px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5B5462;
  }
  .save {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px 0;
    border: 0;
    border-radius: 4px;
    background: #8C6A8E;
    color: #FFFFFF;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .note {
    font-size: 12px;
    color: #8B858F;
    text-align: center;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Nightly target</p>
      <h1>Sleep goal</h1>

      <p class="value">7h 45m</p>

      <div class="schedule-line" aria-label="Editable sleep schedule">
        <span class="schedule-label">Bedtime</span>
        <span class="clock-control">
          <input type="text" value="10:45" aria-label="Bedtime">
          <select aria-label="Bedtime period">
            <option>AM</option>
            <option selected>PM</option>
          </select>
        </span>
        <span class="overnight-arrow" aria-hidden="true">&rarr;</span>
        <span class="schedule-label">Wake</span>
        <span class="clock-control">
          <input type="text" value="6:30" aria-label="Wake time">
          <select aria-label="Wake time period">
            <option selected>AM</option>
            <option>PM</option>
          </select>
        </span>
      </div>

      <div class="slider">
        <div class="track">
          <div class="fill"></div>
          <div class="thumb"></div>
        </div>
        <div class="scale">
          <span>5h</span>
          <span>10h</span>
        </div>
      </div>

      <div class="stepper">
        <span class="stepper-label">Adjust by 15 minutes</span>
        <div class="buttons">
          <div class="step-btn" role="button" aria-label="Decrease by 15 minutes">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="7.25" width="12" height="1.5" fill="currentColor"></rect>
            </svg>
          </div>
          <div class="step-btn" role="button" aria-label="Increase by 15 minutes">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="7.25" width="12" height="1.5" fill="currentColor"></rect>
              <rect x="7.25" y="2" width="1.5" height="12" fill="currentColor"></rect>
            </svg>
          </div>
        </div>
      </div>

      <div class="save" role="button">Save goal</div>
      <p class="note">Applies to tonight and every night after.</p>
    </div>
  </div>
</body>
</html>
