<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E9E6E2;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    padding:26px 0;
    background:#E9E6E2;
  }
  .card{
    margin:0 24px;
    background:#FFFFFF;
    border-radius:4px;
    padding:18px;
  }
  .head{
    background:rgba(138,121,104,0.13);
    border-radius:4px;
    padding:14px;
  }
  .eyebrow{
    margin:0;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:#7A6A5C;
  }
  .title{
    margin:6px 0 0;
    font-size:22px;
    line-height:28px;
    font-weight:600;
    color:#2B2724;
  }
  .meta{
    margin:7px 0 0;
    font-size:14px;
    line-height:18px;
    color:#6E645B;
  }
  .meta b{font-weight:600;color:#4A423B;}
  .section{margin-top:16px;}
  .label{
    margin:0 0 8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:#948A80;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(138,121,104,0.07);
    border-radius:4px;
    padding:9px 12px;
    margin-bottom:6px;
  }
  .row:last-child{margin-bottom:0;}
  .box{
    flex:none;
    width:20px;
    height:20px;
    border-radius:4px;
    background:rgba(138,121,104,0.20);
  }
  .box.done{
    background:#8A7968;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .name{
    flex:1 1 auto;
    min-width:0;
    font-size:15px;
    line-height:20px;
    font-weight:500;
    color:#2B2724;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row.done .name{font-weight:400;color:#8B837B;}
  .time{
    flex:none;
    font-size:13px;
    line-height:20px;
    color:#8B837B;
    font-variant-numeric:tabular-nums;
  }

  /* focus footer at the bottom of the card */
  .footer{
    margin-top:16px;
    background:rgba(138,121,104,0.13);
    border-radius:4px;
    padding:14px;
  }
  .frow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .flabel{
    font-size:12px;
    font-weight:600;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:#7A6A5C;
  }
  .fcount{
    font-size:12px;
    font-weight:600;
    color:#4A423B;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    display:flex;
    gap:4px;
    margin-top:10px;
  }
  .bar i{
    flex:1 1 0;
    height:6px;
    border-radius:3px;
    background:rgba(138,121,104,0.22);
  }
  .bar i.on{background:#8A7968;}
  .divide{
    height:1px;
    background:rgba(138,121,104,0.22);
    margin:12px 0;
  }
  .nexteyebrow{
    margin:0;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#948A80;
  }
  .nextname{
    margin:3px 0 0;
    font-size:16px;
    line-height:21px;
    font-weight:600;
    color:#2B2724;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .acts{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .btn{
    flex:1 1 0;
    box-sizing:border-box;
    text-align:center;
    font-size:13px;
    line-height:18px;
    font-weight:600;
    border-radius:4px;
  }
  .btn.primary{
    background:#8A7968;
    color:#FFFFFF;
    padding:10px 0;
  }
  .btn.ghost{
    background:transparent;
    border:1px solid rgba(138,121,104,0.38);
    color:#5A5049;
    padding:9px 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <p class="eyebrow">Ridgeline Care &middot; Week 3</p>
        <h1 class="title">Today's tasks</h1>
        <p class="meta"><b>2 of 6 done</b> &middot; Tuesday, March 4</p>
      </div>

      <div class="section">
        <p class="label">Morning</p>
        <div class="row done">
          <span class="box done">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M2.5 6.3L4.8 8.6L9.5 3.6" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="name">Metformin 500 mg &middot; breakfast</span>
          <span class="time">7:30 AM</span>
        </div>
        <div class="row done">
          <span class="box done">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M2.5 6.3L4.8 8.6L9.5 3.6" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="name">Blood pressure reading</span>
          <span class="time">8:05 AM</span>
        </div>
        <div class="row">
          <span class="box"></span>
          <span class="name">Knee mobility set, 8 minutes</span>
          <span class="time">9:30 AM</span>
        </div>
      </div>

      <div class="footer">
        <div class="frow">
          <span class="flabel">Remaining today</span>
          <span class="fcount">4 tasks</span>
        </div>
        <div class="bar">
          <i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="divide"></div>
        <p class="nexteyebrow">Up next &middot; 1:00 PM</p>
        <p class="nextname">Walk 20 minutes, flat route</p>
        <div class="acts">
          <span class="btn primary">Mark done</span>
          <span class="btn ghost">Snooze 30 min</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
