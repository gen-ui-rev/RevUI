<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Planning Tutorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e8e3;
      color: #1e2923;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 20px;
      background: #f4f5f2;
    }

    .tour {
      width: 100%;
      border: 1px solid #cdd4ce;
      border-radius: 10px;
      background: #ffffff;
    }

    .tour-header {
      padding: 20px 20px 22px;
      border-radius: 9px 9px 0 0;
      background: #176b46;
      color: #ffffff;
    }

    .step-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .step-label {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .progress {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .progress span {
      display: block;
      width: 24px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.35);
    }

    .progress .done,
    .progress .current {
      background: #ffffff;
    }

    h1 {
      margin: 0 0 8px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .intro {
      margin: 0;
      max-width: 292px;
      color: #e3f0e9;
      font-size: 15px;
      line-height: 1.45;
    }

    .tour-body {
      padding: 18px 20px 20px;
    }

    .map-preview {
      margin: 0;
      border: 1px solid #d5d5d0;
      border-radius: 10px;
      background: #faf8f2;
    }

    .map-preview svg {
      display: block;
      width: 100%;
      height: 132px;
      border-radius: 10px;
    }

    .instruction {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
    }

    .instruction-copy {
      min-width: 0;
    }

    .instruction-number {
      display: flex;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      border-radius: 50%;
      background: #176b46;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    .instruction h2 {
      margin: 0 0 3px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 600;
    }

    .instruction p {
      margin: 0;
      color: #5c675f;
      font-size: 14px;
      line-height: 1.4;
    }

    .tour-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-top: 1px solid #d8ddd9;
    }

    .back-button,
    .next-button {
      min-width: 82px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .back-button {
      border: 1px solid #c8cfca;
      background: #ffffff;
      color: #354039;
    }

    .next-button {
      border: 1px solid #176b46;
      background: #176b46;
      color: #ffffff;
    }

    .skip-button {
      border: 0;
      padding: 8px 4px;
      background: transparent;
      color: #667169;
      font-size: 14px;
      font-weight: 600;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="tour" aria-labelledby="tour-title">
      <header class="tour-header">
        <div class="step-row">
          <p class="step-label">Step 2 of 3</p>
          <div class="progress" aria-label="Tutorial progress: step 2 of 3">
            <span class="done"></span>
            <span class="current"></span>
            <span></span>
          </div>
        </div>
        <h1 id="tour-title">Build your day route</h1>
        <p class="intro">Turn saved places into an ordered route before you leave for the day.</p>
      </header>

      <div class="tour-body">
        <figure class="map-preview" aria-label="Example route connecting three saved places">
          <svg viewBox="0 0 308 132" role="img" aria-hidden="true">
            <rect width="308" height="132" rx="10" fill="#faf8f2"/>
            <path d="M0 35 C42 25 67 42 99 29 C137 14 171 31 204 20 C242 8 276 22 308 10" fill="none" stroke="#d7d8d5" stroke-width="12"/>
            <path d="M20 108 C62 94 93 105 130 91 C170 76 198 89 230 74 C260 60 283 64 308 53" fill="none" stroke="#dedfdb" stroke-width="9"/>
            <path d="M0 75 C39 68 66 74 92 65 C129 53 163 66 194 56 C232 44 271 50 308 38" fill="none" stroke="#d1d3d0" stroke-width="3"/>
            <path d="M57 91 C76 84 81 57 108 52 C140 46 153 90 186 83 C214 77 221 47 252 39" fill="none" stroke="#176b46" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
            <circle cx="57" cy="91" r="10" fill="#176b46"/>
            <circle cx="57" cy="91" r="3" fill="#ffffff"/>
            <circle cx="155" cy="76" r="10" fill="#176b46"/>
            <circle cx="155" cy="76" r="3" fill="#ffffff"/>
            <circle cx="252" cy="39" r="10" fill="#176b46"/>
            <path d="M248 39 L251 42 L257 35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="25" y="18" width="84" height="26" rx="10" fill="#fffdfa" stroke="#d1d2ce"/>
            <text x="67" y="35" text-anchor="middle" fill="#33443a" font-family="Source Sans 3, sans-serif" font-size="12">3 stops · 2.4 mi</text>
          </svg>
        </figure>

        <div class="instruction">
          <div class="instruction-copy">
            <h2>Drag to change the order</h2>
            <p>Place nearby stops together to reduce walking and keep your day flexible.</p>
          </div>
          <div class="instruction-number" aria-label="Instruction 2">2</div>
        </div>
      </div>

      <footer class="tour-footer">
        <button class="back-button" type="button">Back</button>
        <button class="skip-button" type="button">Skip tour</button>
        <button class="next-button" type="button">Next</button>
      </footer>
    </section>
  </div>
</body>
</html>
