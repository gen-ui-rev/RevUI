<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Update</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e4;
      color: #25292d;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #eceeef;
    }

    .style-panel {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border: 1px solid #d9dcde;
      border-radius: 0;
      box-shadow: 0 8px 22px rgba(34, 39, 43, 0.10);
    }

    .panel-header {
      margin-bottom: 14px;
    }

    .panel-header h1 {
      margin: 0 0 3px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .panel-header p {
      margin: 0;
      color: #687078;
      font-size: 14px;
      line-height: 1.4;
    }

    .preview {
      position: relative;
      width: 308px;
      margin-bottom: 16px;
      border: 1px solid #cfd3d6;
      background: #d5d8da;
    }

    .preview img {
      width: 306px;
      height: 126px;
      object-fit: cover;
      display: block;
      background: #d5d8da;
      filter: grayscale(1) contrast(0.95);
    }

    .preview-sticker {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 6px 9px;
      border: 2px solid #ffffff;
      background: #30343a;
      color: #ffffff;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .flow {
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
    }

    .flow-step {
      position: relative;
      padding: 0 0 0 32px;
    }

    .flow-step.done {
      padding-bottom: 14px;
    }

    .flow-step.done::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 26px;
      bottom: 0;
      width: 1px;
      background: #d9dcde;
    }

    .marker {
      position: absolute;
      left: 0;
      top: 0;
      width: 21px;
      height: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #c6cacd;
      background: #ffffff;
      color: #7b8288;
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .flow-step.done .marker {
      border-color: #30343a;
      background: #30343a;
    }

    .flow-step.done .marker svg {
      width: 13px;
      height: 13px;
      display: block;
    }

    .flow-step.active .marker {
      border-color: #30343a;
      color: #25292d;
    }

    .flow-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .flow-top h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
    }

    .flow-step.done .flow-top h2 {
      color: #4d545a;
    }

    .change-link {
      padding: 0;
      border: 0;
      background: transparent;
      color: #30343a;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      text-decoration: underline;
      cursor: default;
    }

    .step-tag {
      color: #747b81;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      white-space: nowrap;
    }

    .flow-hint {
      margin: 4px 0 0;
      color: #7b8288;
      font-size: 13px;
      line-height: 1.35;
    }

    .recap-strip {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .filter-image {
      width: 63px;
      height: 40px;
      border: 1px solid #d5d8da;
      object-fit: cover;
      display: block;
      background: #d5d8da;
      opacity: 0.5;
    }

    .filter-image.chosen {
      border: 2px solid #30343a;
      opacity: 1;
    }

    .filter-soft {
      filter: saturate(0.75) brightness(1.08);
    }

    .filter-mono {
      filter: grayscale(1);
    }

    .filter-warm {
      filter: sepia(0.28) saturate(0.9);
    }

    .option-row {
      display: grid;
      grid-template-columns: repeat(4, 63px);
      gap: 7px;
      margin-top: 8px;
    }

    .option {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4d545a;
      text-align: center;
      cursor: default;
    }

    .sticker-tile {
      width: 63px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d5d8da;
      background: #eef0f1;
    }

    .option.selected .sticker-tile {
      border: 2px solid #30343a;
    }

    .sticker-tile svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .option-label {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: inherit;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option.selected .option-label {
      color: #25292d;
      font-weight: 700;
    }

    .footer {
      display: flex;
      gap: 10px;
    }

    .back-button,
    .apply-button {
      padding: 11px 12px;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
      text-align: center;
      cursor: default;
    }

    .back-button {
      flex: 1;
      border: 1px solid #b9bec2;
      background: #ffffff;
      color: #4d545a;
    }

    .apply-button {
      flex: 2;
      border: 1px solid #30343a;
      background: #30343a;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="style-panel" aria-labelledby="style-title">
      <header class="panel-header">
        <h1 id="style-title">Style this update</h1>
        <p>Planstead update · Friday priorities</p>
      </header>

      <div class="preview" aria-label="Preview with Mono filter and Focus sticker applied">
        <img src="https://loremflickr.com/306/126/workspace?lock=8770" width="306" height="126" alt="Laptop and planning materials in a shared workspace">
        <div class="preview-sticker">FOCUS BLOCK</div>
      </div>

      <ol class="flow">
        <li class="flow-step done">
          <span class="marker" aria-hidden="true">
            <svg viewBox="0 0 14 14">
              <path d="M2 7.5l3.2 3.2L12 3.8" fill="none" stroke="#fff" stroke-width="2.2"/>
            </svg>
          </span>
          <div class="flow-top">
            <h2>Photo filter · Mono</h2>
            <button class="change-link" type="button">Change</button>
          </div>
          <div class="recap-strip" aria-label="Filter options, Mono chosen">
            <img class="filter-image" src="https://loremflickr.com/63/40/workspace?lock=8771" width="63" height="40" alt="Workspace preview with Clear filter">
            <img class="filter-image filter-soft" src="https://loremflickr.com/63/40/workspace?lock=8772" width="63" height="40" alt="Workspace preview with Soft filter">
            <img class="filter-image filter-mono chosen" src="https://loremflickr.com/63/40/workspace?lock=8773" width="63" height="40" alt="Workspace preview with Mono filter, chosen">
            <img class="filter-image filter-warm" src="https://loremflickr.com/63/40/workspace?lock=8774" width="63" height="40" alt="Workspace preview with Warm filter">
          </div>
        </li>

        <li class="flow-step active">
          <span class="marker" aria-hidden="true">2</span>
          <div class="flow-top">
            <h2>Update sticker</h2>
            <span class="step-tag">Step 2 of 2</span>
          </div>
          <p class="flow-hint">Pick the label that sits on the photo above.</p>
          <div class="option-row">
            <button class="option selected" type="button" aria-label="Focus sticker selected">
              <span class="sticker-tile">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                  <rect x="3" y="3" width="22" height="22" fill="#30343a"/>
                  <path d="M9 14h10M14 9v10" stroke="#fff" stroke-width="2"/>
                </svg>
              </span>
              <span class="option-label">Focus</span>
            </button>
            <button class="option" type="button" aria-label="Done sticker">
              <span class="sticker-tile">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                  <rect x="3.5" y="3.5" width="21" height="21" fill="#fff" stroke="#4d545a"/>
                  <path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke="#30343a" stroke-width="2.2"/>
                </svg>
              </span>
              <span class="option-label">Done</span>
            </button>
            <button class="option" type="button" aria-label="Review sticker">
              <span class="sticker-tile">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                  <path d="M4 5h20v15H13l-5 4v-4H4z" fill="#fff" stroke="#4d545a"/>
                  <path d="M9 11h10M9 15h7" stroke="#30343a" stroke-width="1.7"/>
                </svg>
              </span>
              <span class="option-label">Review</span>
            </button>
            <button class="option" type="button" aria-label="Pinned sticker">
              <span class="sticker-tile">
                <svg viewBox="0 0 28 28" aria-hidden="true">
                  <path d="M10 4h8l-1 7 3 4v2H8v-2l3-4z" fill="#fff" stroke="#4d545a" stroke-width="1.5"/>
                  <path d="M14 17v7" stroke="#30343a" stroke-width="1.8"/>
                </svg>
              </span>
              <span class="option-label">Pinned</span>
            </button>
          </div>
        </li>
      </ol>

      <div class="footer">
        <button class="back-button" type="button">Back</button>
        <button class="apply-button" type="button">Apply to update</button>
      </div>
    </main>
  </div>
</body>
</html>
