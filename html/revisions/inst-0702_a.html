<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Session Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      border-radius: 40px;
      color: #e2f2fd;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #7dd3fc;
      font-size: 9px;
      line-height: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
    }

    .dial {
      position: relative;
      width: 118px;
      height: 118px;
      margin-top: 8px;
      flex: 0 0 auto;
    }

    .dial svg {
      display: block;
    }

    .dial-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .remaining {
      margin: 0;
      color: #f0f9ff;
      font-size: 38px;
      line-height: 40px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .remaining-unit {
      margin: 1px 0 0;
      color: #7dd3fc;
      font-size: 9px;
      line-height: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .task {
      width: 100%;
      margin: 12px 0 0;
      color: #cfe4f5;
      font-size: 11px;
      line-height: 15px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .end-time {
      margin: 4px 0 0;
      color: #7f92a8;
      font-size: 10px;
      line-height: 14px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Focus session live activity" style="display:flex;flex-direction:column;align-items:center;width:100%;">
      <div class="live-status">
        <span class="live-dot"></span>
        <span>Live</span>
      </div>

      <div class="dial" role="progressbar" aria-label="Focus session progress" aria-valuemin="0" aria-valuemax="60" aria-valuenow="36">
        <svg width="118" height="118" viewBox="0 0 118 118" fill="none">
          <circle cx="59" cy="59" r="54" stroke="rgba(56, 189, 248, 0.2)" stroke-width="7"/>
          <circle cx="59" cy="59" r="54" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"
                  stroke-dasharray="203.6 339.3" transform="rotate(-90 59 59)"/>
        </svg>
        <div class="dial-center">
          <p class="remaining">24</p>
          <p class="remaining-unit">min left</p>
        </div>
      </div>

      <p class="task">Sprint planning notes</p>
      <p class="end-time">Ends 3:30 PM</p>
    </section>
  </div>
</body>
</html>
