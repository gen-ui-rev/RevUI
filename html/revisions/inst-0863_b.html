<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbound Stays — Check-in activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E7E6E9;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:48px 30px;
    background:#E7E6E9;
  }
  .island{
    background:#0B0B0D;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    padding:17px 18px 18px;
  }
  .head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark{
    width:30px;
    height:30px;
    border-radius:14px;
    background:#B183AE;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .head-text{
    min-width:0;
    flex:1;
  }
  .app{
    font-size:13px;
    font-weight:700;
    color:#F4F2F5;
    letter-spacing:-0.1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .app-sub{
    font-size:12px;
    font-weight:500;
    color:#8E8B93;
    margin-top:2px;
  }
  .countdown{
    margin-top:17px;
    padding:15px 16px;
    border-radius:14px;
    background:#19171C;
    border:1px solid rgba(217,182,213,0.16);
  }
  .count-label{
    font-size:11px;
    font-weight:600;
    color:#9B96A0;
    text-transform:uppercase;
    letter-spacing:0.7px;
  }
  .count-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-top:5px;
  }
  .count-val{
    font-size:40px;
    line-height:1;
    font-weight:700;
    color:#F4F2F5;
    letter-spacing:-1.5px;
    white-space:nowrap;
  }
  .ready-time{
    padding-bottom:3px;
    font-size:11px;
    line-height:1.35;
    font-weight:600;
    text-align:right;
    color:#D9B6D5;
  }
  .stay{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:17px;
  }
  .stay img{
    width:64px;
    height:64px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#26232A;
    flex:none;
  }
  .stay-text{
    min-width:0;
    flex:1;
  }
  .hotel{
    font-size:15px;
    font-weight:700;
    color:#F4F2F5;
    letter-spacing:-0.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .room{
    font-size:13px;
    font-weight:500;
    color:#A9A5AF;
    margin-top:4px;
  }
  .addr,
  .dates{
    font-size:11px;
    line-height:1.25;
    font-weight:500;
    color:#78757E;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .addr{margin-top:4px;}
  .dates{margin-top:3px;}
  .status{
    margin-top:17px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,0.10);
  }
  .status-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .status-title{
    font-size:12px;
    font-weight:600;
    color:#B6B1BB;
  }
  .pct{
    font-size:12px;
    font-weight:700;
    color:#D9B6D5;
  }
  .track{
    margin-top:8px;
    height:6px;
    border-radius:14px;
    background:rgba(255,255,255,0.13);
  }
  .fill{
    width:68%;
    height:6px;
    border-radius:14px;
    background:#B183AE;
  }
  .action{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:17px;
    padding:13px 14px;
    border-radius:14px;
    background:#F1EDF1;
  }
  .action-copy{
    min-width:0;
  }
  .action-title{
    font-size:13px;
    font-weight:700;
    color:#201C22;
  }
  .action-sub{
    margin-top:3px;
    font-size:11px;
    font-weight:500;
    color:#736D77;
  }
  .checkin{
    flex:none;
    padding:10px 13px;
    border:0;
    border-radius:10px;
    background:#171419;
    color:#F5F1F4;
    font:700 12px 'Inter', system-ui, sans-serif;
    cursor:pointer;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="head">
        <div class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17141A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
        </div>
        <div class="head-text">
          <div class="app">Northbound Stays</div>
          <div class="app-sub">Check-in today, Thu, May 8</div>
        </div>
      </div>

      <div class="countdown">
        <div class="count-label">Until check-in</div>
        <div class="count-row">
          <div class="count-val">1h 24m</div>
          <div class="ready-time">Ready at<br>3:00 PM</div>
        </div>
      </div>

      <div class="stay">
        <img src="https://loremflickr.com/64/64/hotel?lock=11441" width="64" height="64" alt="Cliffside Marina Hotel seen from the harbor">
        <div class="stay-text">
          <div class="hotel">Cliffside Marina Hotel</div>
          <div class="room">Room 412 · King, harbor view</div>
          <div class="addr">218 Wharf Street, Port Kell, ME</div>
          <div class="dates">3 nights · Check-out Sun, May 11</div>
        </div>
      </div>

      <div class="status">
        <div class="status-head">
          <div class="status-title">Housekeeping finishing</div>
          <div class="pct">68% ready</div>
        </div>
        <div class="track"><div class="fill"></div></div>
      </div>

      <div class="action">
        <div class="action-copy">
          <div class="action-title">Save time on arrival</div>
          <div class="action-sub">Confirm guest details now</div>
        </div>
        <button class="checkin" type="button">Check in</button>
      </div>
    </div>
  </div>
</body>
</html>
