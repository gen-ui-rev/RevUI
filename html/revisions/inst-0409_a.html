<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Workshop — Northloom Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eceb;
      color: #243132;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px;
      background: #f8faf9;
    }

    .component {
      width: 100%;
    }

    .context {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      padding: 5px 10px;
      border-radius: 14px;
      background: #dce9e9;
      color: #36595b;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.2;
    }

    .context svg {
      width: 14px;
      height: 14px;
      flex: none;
    }

    h1 {
      margin: 0;
      color: #1d292a;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.25;
    }

    .subtitle {
      margin: 4px 0 12px;
      color: #697576;
      font-size: 13px;
      line-height: 1.4;
    }

    form {
      margin: 0;
    }

    .field {
      margin-bottom: 10px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .field-row .field {
      margin-bottom: 0;
    }

    label,
    .group-label {
      display: block;
      margin-bottom: 4px;
      color: #3e4b4c;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd5d4;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #253233;
      font: 400 14px/1.4 'Poppins', system-ui, sans-serif;
    }

    input,
    select {
      padding: 9px 12px;
    }

    select {
      appearance: none;
      padding-right: 34px;
      background-image: none;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap svg {
      position: absolute;
      top: 50%;
      right: 12px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      transform: translateY(-50%);
      color: #657374;
    }

    .money-wrap,
    .icon-wrap {
      position: relative;
    }

    .money-wrap span {
      position: absolute;
      top: 50%;
      left: 12px;
      color: #657374;
      font-size: 14px;
      transform: translateY(-50%);
    }

    .money-wrap input {
      padding-left: 26px;
    }

    .icon-wrap svg {
      position: absolute;
      top: 50%;
      left: 12px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      transform: translateY(-50%);
      color: #657374;
    }

    .icon-wrap input {
      padding-left: 34px;
    }

    textarea {
      min-height: 60px;
      padding: 9px 12px;
      resize: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #73999b;
      box-shadow: 0 0 0 3px #e1eded;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #dce3e2;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 9px 14px;
      font: 500 14px/1.4 'Poppins', system-ui, sans-serif;
      cursor: pointer;
    }

    .cancel {
      background: #e8edec;
      color: #425051;
    }

    .save {
      background: #6f9698;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="edit-title">
      <div class="context">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 16.5V20h3.5L18.1 9.4l-3.5-3.5L4 16.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="m13.7 6.8 3.5 3.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        Editing published workshop
      </div>

      <h1 id="edit-title">Edit workshop</h1>
      <p class="subtitle">Update what attendees see before they book.</p>

      <form>
        <div class="field">
          <label for="workshop-title">Workshop title</label>
          <input id="workshop-title" type="text" value="Stoneware Pour-Over Basics">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <div class="select-wrap">
            <select id="category">
              <option selected>Ceramics &amp; Pottery</option>
              <option>Coffee &amp; Brewing</option>
              <option>Textiles &amp; Weaving</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m7 9.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date">Date</label>
            <div class="icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/>
                <path d="M3.5 10h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <input id="date" type="text" value="Sat, Mar 15">
            </div>
          </div>
          <div class="field">
            <label for="start-time">Start time</label>
            <div class="select-wrap">
              <select id="start-time">
                <option selected>10:00 AM</option>
                <option>1:00 PM</option>
                <option>4:30 PM</option>
              </select>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m7 9.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="price">Ticket price</label>
            <div class="money-wrap">
              <span>$</span>
              <input id="price" type="text" inputmode="decimal" value="48.00">
            </div>
          </div>
          <div class="field">
            <label for="seats">Seats</label>
            <input id="seats" type="number" value="12">
          </div>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description">Three-hour hand-building session. Clay, tools, and glaze firing are included.</textarea>
        </div>

        <div class="actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="save" type="submit">Save changes</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
