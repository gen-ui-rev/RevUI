<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Avenlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ece9eb;
      color: #242126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffdfd;
    }

    .topbar {
      width: 100%;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      padding: 12px 16px;
      background: #343238;
      color: #ffffff;
    }

    .back-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      border: 0;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .service-name {
      margin: 0;
      text-align: center;
      color: #ffffff;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .help-link {
      justify-self: end;
      color: #ffffff;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      text-decoration: none;
    }

    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 54px 24px 28px;
    }

    .recovery {
      width: 100%;
    }

    .accent-mark {
      width: 36px;
      height: 3px;
      margin-bottom: 22px;
      background: #9a6f86;
    }

    h1 {
      margin: 0;
      max-width: 320px;
      color: #211e22;
      font-size: 30px;
      line-height: 38px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .intro {
      margin: 14px 0 34px;
      max-width: 330px;
      color: #686168;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: #353036;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .email-field {
      position: relative;
      width: 100%;
    }

    .email-input {
      width: 100%;
      height: 50px;
      padding: 0 50px 0 14px;
      border: 1px solid #9a6f86;
      border-radius: 4px;
      outline: none;
      background: #fffdfd;
      color: #242126;
      font-size: 16px;
      line-height: 24px;
      font-weight: 400;
    }

    .clear-button {
      position: absolute;
      top: 50%;
      right: 11px;
      width: 28px;
      height: 28px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: #eee8eb;
      color: #665d63;
      cursor: pointer;
    }

    .clear-button svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .field-note {
      margin: 9px 0 24px;
      color: #7a7479;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .submit-button {
      width: 100%;
      height: 50px;
      padding: 0 18px;
      border: 1px solid #8f657d;
      border-radius: 4px;
      background: #9a6f86;
      color: #ffffff;
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .signin-copy {
      margin: auto 0 0;
      padding-top: 24px;
      text-align: center;
      color: #6d666c;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
    }

    .signin-link {
      color: #79566a;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="service-name">Avenlo</p>
      <a class="help-link" href="#">Help</a>
    </header>

    <main>
      <section class="recovery" aria-labelledby="recovery-title">
        <div class="accent-mark" aria-hidden="true"></div>
        <h1 id="recovery-title">Reset your password</h1>
        <p class="intro">Enter the email address used for your bookings. We’ll send a secure link to create a new password.</p>

        <form>
          <label class="field-label" for="email-a">Email address</label>
          <div class="email-field">
            <input class="email-input" id="email-a" name="email" type="email" value="clara.mercer@example.com" autocomplete="email">
            <button class="clear-button" type="button" aria-label="Clear email address">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="field-note">The reset link expires after 30 minutes.</p>
          <button class="submit-button" type="submit">Send reset link</button>
        </form>
      </section>

      <p class="signin-copy">Remember your password? <a class="signin-link" href="#">Sign in</a></p>
    </main>
  </div>
</body>
</html>
