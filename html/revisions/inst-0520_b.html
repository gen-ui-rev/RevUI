<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskgrove Recommendation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9dad6;
      color: #252620;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px 20px;
      background: #e8e9e6;
    }

    .recommendation {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dedfd9;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(31, 33, 27, 0.09);
    }

    .audience-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 20px;
      background: #3f4430;
      color: #ffffff;
    }

    .audience-bar .label {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #cdd2b4;
    }

    .audience-bar .value {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-body {
      padding: 20px;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .monogram {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #e4e5df;
      color: #515347;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .author-details {
      min-width: 0;
    }

    .author-name {
      margin: 0 0 3px;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    .author-meta {
      margin: 0;
      color: #707268;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      margin: 14px 0 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 8px 0 0;
      color: #55574e;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .figure {
      position: relative;
      margin: 16px 0 0;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(31, 33, 27, 0.22);
    }

    .media {
      width: 310px;
      height: 160px;
      display: block;
      object-fit: cover;
      background: #d7d8d2;
    }

    .figure-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 8px;
      border-radius: 3px;
      background: #ffffff;
      color: #4a4f36;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0;
      padding: 10px 12px;
      background: rgba(22, 24, 18, 0.82);
      color: #ffffff;
      font-size: 12.5px;
      line-height: 1.45;
      font-weight: 500;
    }

    .reaction-area {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e4e5df;
    }

    .public-reactions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reaction-faces {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .reaction-faces .monogram {
      width: 28px;
      height: 28px;
      flex-basis: 28px;
      font-size: 12px;
    }

    .reaction-copy {
      min-width: 0;
      margin: 0;
      color: #55574e;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 400;
    }

    .reaction-copy strong {
      color: #303129;
      font-weight: 600;
    }

    .recommend-button {
      width: 100%;
      margin-top: 14px;
      padding: 0;
      display: flex;
      align-items: stretch;
      border: 0;
      border-radius: 4px;
      background: #6f773f;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
    }

    .button-label {
      min-height: 46px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
    }

    .button-label svg,
    .button-comment svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      stroke: currentColor;
    }

    .button-comment {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border-left: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 14px;
    }

    .button-count {
      min-width: 48px;
      display: grid;
      place-items: center;
      padding: 0 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="recommendation" aria-labelledby="proposal-title">
      <div class="audience-bar">
        <span class="label">Audience</span>
        <span class="value">Regional store managers</span>
      </div>

      <div class="card-body">
        <div class="author">
          <div class="monogram" aria-hidden="true">MV</div>
          <div class="author-details">
            <p class="author-name">Mara Venn</p>
            <p class="author-meta">Taskgrove Planning · Today, 10:42 AM</p>
          </div>
        </div>

        <h1 id="proposal-title">One shared agenda for every regional call</h1>
        <p class="summary">Fewer duplicate notes, and each store keeps the same owners and follow-ups in view.</p>

        <figure class="figure">
          <img
            class="media"
            src="https://loremflickr.com/310/160/notebook?lock=7050"
            width="310"
            height="160"
            alt="Open planning notebook beside a laptop on a desk"
          >
          <span class="figure-tag">Attachment</span>
          <figcaption class="caption">Draft agenda from Monday's planning note — decisions and owners in one view.</figcaption>
        </figure>

        <div class="reaction-area">
          <div class="public-reactions">
            <div class="reaction-faces" aria-hidden="true">
              <div class="monogram">PR</div>
              <div class="monogram">TD</div>
            </div>
            <p class="reaction-copy"><strong>9 store managers recommend this</strong><br>Priya Raman and 8 others</p>
          </div>

          <button class="recommend-button" type="button" aria-label="Recommend this proposal, 9 recommendations, or add a comment for store managers">
            <span class="button-label">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="m6.5 10.5 5.5-5.5 5.5 5.5"></path>
              </svg>
              Recommend
            </span>
            <span class="button-comment">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a8 8 0 0 1-8 8H8l-4 2.5V12a8 8 0 0 1 8-8h1a8 8 0 0 1 8 8z"></path>
              </svg>
              Comment
            </span>
            <span class="button-count">9</span>
          </button>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
