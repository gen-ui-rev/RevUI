<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annual funding level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#F2F0ED;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    padding:32px 24px;
    background:#FBFAF8;
  }
  .card{
    border:1px solid #DFD9D1;
    border-radius:4px;
    background:#FFFFFF;
    padding:24px 20px 18px;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8A8378;
    margin:0;
  }
  h1{
    font-size:19px;
    font-weight:700;
    color:#211E1A;
    margin:8px 0 0;
    line-height:1.3;
  }
  .amount{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin-top:18px;
  }
  .amount .value{
    font-size:44px;
    font-weight:700;
    color:#8A7A66;
    line-height:1;
    letter-spacing:-.02em;
  }
  .amount .per{
    font-size:14px;
    font-weight:500;
    color:#8A8378;
  }
  .yearly-row{
    margin-top:16px;
    border:1px solid #E2DCD3;
    border-radius:4px;
    background:#F6F3EE;
    padding:9px 12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .yearly-row .label{
    font-size:12px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#8A8378;
  }
  .yearly-row .total{
    font-size:16px;
    font-weight:700;
    color:#211E1A;
    line-height:1.1;
  }
  .slider{
    margin-top:22px;
    position:relative;
    height:20px;
  }
  .track{
    position:absolute;
    top:8px;
    left:0;
    right:0;
    height:4px;
    border-radius:4px;
    background:#E7E2DB;
  }
  .fill{
    position:absolute;
    top:8px;
    left:0;
    width:42%;
    height:4px;
    border-radius:4px;
    background:#8A7A66;
  }
  .thumb{
    position:absolute;
    top:0;
    left:42%;
    width:20px;
    height:20px;
    margin-left:-10px;
    border-radius:50%;
    background:#FFFFFF;
    border:2px solid #8A7A66;
    box-sizing:border-box;
  }
  .scale{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:12px;
    font-weight:500;
    color:#8A8378;
  }
  .stepper{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:22px;
    border:1px solid #DFD9D1;
    border-radius:4px;
    padding:6px 12px 6px 6px;
  }
  .step-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-btn{
    width:44px;
    height:40px;
    border:1px solid #DFD9D1;
    border-radius:4px;
    background:#FBFAF8;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
  }
  .step-label{
    font-size:14px;
    font-weight:500;
    color:#4A443C;
    text-align:right;
  }
  .note{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid #EDE9E3;
  }
  .note p{
    margin:0;
    font-size:14px;
    font-weight:400;
    color:#6B655C;
    line-height:1.45;
  }
  .note strong{
    font-weight:700;
    color:#211E1A;
  }
  .confirm{
    margin-top:16px;
    width:100%;
    box-sizing:border-box;
    border:1px solid #8A7A66;
    border-radius:4px;
    background:#8A7A66;
    color:#FFFFFF;
    font-size:15px;
    font-weight:700;
    text-align:center;
    padding:14px 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Growth Portfolio</p>
      <h1>How much you fund each year</h1>

      <div class="amount">
        <span class="value">$450</span>
        <span class="per">per month</span>
      </div>

      <div class="yearly-row">
        <span class="label">Invested per year</span>
        <span class="total">$5,400</span>
      </div>

      <div class="slider">
        <div class="track"></div>
        <div class="fill"></div>
        <div class="thumb"></div>
      </div>
      <div class="scale">
        <span>$50</span>
        <span>$1,000</span>
      </div>

      <div class="stepper">
        <div class="step-group">
          <div class="step-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8h10" stroke="#4A443C" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="step-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke="#4A443C" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <span class="step-label">$25 steps</span>
      </div>

      <div class="note">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" style="flex:none;margin-top:2px">
          <circle cx="9" cy="9" r="6.75" stroke="#A79C8D" stroke-width="1.3"/>
          <path d="M9 5.4V9l2.4 1.6" stroke="#A79C8D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Funded monthly from Checking 4402, starting <strong>March 1</strong>.</p>
      </div>

      <div class="confirm">Set funding level</div>
    </div>
  </div>
</body>
</html>
