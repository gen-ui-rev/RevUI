<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Patient Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e1e3e8;
      color: #25273f;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      background: #f3f1f7;
      box-shadow: 0 14px 36px rgba(42, 41, 70, 0.14);
    }

    .portal-header {
      padding: 29px 26px 24px;
      background: #31385e;
      color: #ffffff;
    }

    .service {
      margin: 0 0 9px;
      color: #d8dbef;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
    }

    .intro {
      margin: 12px 0 0;
      color: #e0e3f1;
      font-size: 15px;
      line-height: 1.45;
    }

    .portal-body {
      padding: 20px 24px 22px;
    }

    form {
      padding: 17px 18px 18px;
      border: 1px solid #d5d3df;
      border-radius: 9px;
      background: #ffffff;
      box-shadow: 0 5px 15px rgba(49, 56, 94, 0.06);
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #373956;
      font-size: 14px;
      font-weight: 600;
    }

    .code-fields {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .code-fields input {
      width: 100%;
      padding: 8px 0;
      border: 1px solid #aaa9bd;
      border-radius: 7px;
      outline: none;
      background: #faf9fc;
      color: #303658;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      caret-color: #67568a;
    }

    .code-fields input:focus {
      border-color: #67568a;
      box-shadow: 0 0 0 2px rgba(103, 86, 138, 0.16);
    }

    .form-footer {
      margin-top: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .expiry {
      flex: 1;
      margin: 0;
      color: #6d6b7b;
      font-size: 12px;
      line-height: 1.35;
    }

    .primary-button {
      flex: 0 0 auto;
      padding: 10px 17px;
      border: 1px solid #705081;
      border-radius: 6px;
      background: #705081;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }

    .alternate {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #cbc8d5;
    }

    .alternate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .alternate p {
      flex: 1;
      margin: 0;
      color: #666477;
      font-size: 13px;
      line-height: 1.35;
    }

    .text-button {
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-bottom: 1px solid #705081;
      background: transparent;
      color: #624475;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="verification-title">
      <header class="portal-header">
        <p class="service">Everwell Patient Records · Secure Access</p>
        <h1 id="verification-title">Confirm it is you</h1>
        <p class="intro">We protect your test results, visit summaries, and care messages with an extra identity check.</p>
      </header>

      <div class="portal-body">
        <form>
          <label class="field-label" for="code-b-1">Code sent to your email</label>
          <div class="code-fields" aria-label="Six-digit verification code">
            <input id="code-b-1" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2">
            <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 3">
            <input type="text" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 4">
            <input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 5">
            <input type="text" inputmode="numeric" maxlength="1" value="6" aria-label="Digit 6">
          </div>
          <div class="form-footer">
            <p class="expiry">Expires in 7 minutes</p>
            <button class="primary-button" type="submit">Continue securely</button>
          </div>
        </form>

        <section class="alternate" aria-label="Alternate verification option">
          <div class="alternate-row">
            <p>Did not receive the message? We can email a fresh code.</p>
            <button class="text-button" type="button">Send again</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
