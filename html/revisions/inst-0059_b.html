<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread reaction</title>
<style>
  :root{
    --accent:#6D3AE0;
    --ink:#16141C;
    --muted:#6B6676;
    --tint:#F2EFFB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#E7E5EC;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:184px;
    height:224px;
    background:#FFFFFF;
    border-radius:26px;
    padding:13px 12px;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:8px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--accent);
    line-height:1;
    margin:0 0 4px;
  }
  .post{
    font-size:11px;
    line-height:1.3;
    margin:0 0 2px;
  }
  .byline{
    font-size:8.5px;
    line-height:1.2;
    color:var(--muted);
    margin:0 0 8px;
  }
  .hero{
    background:var(--tint);
    border-radius:14px;
    padding:8px 6px;
    text-align:center;
    margin-bottom:8px;
  }
  .num{
    font-size:28px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
    color:var(--accent);
  }
  .unit{
    font-size:8px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    margin-top:3px;
  }
  .split{
    display:flex;
    gap:6px;
  }
  .col{
    flex:1 1 0;
    min-width:0;
    border:1px solid #E4E1EA;
    border-radius:12px;
    padding:8px 6px;
    text-align:center;
  }
  .col.mine{
    border-color:var(--accent);
    background:#FBF9FF;
  }
  .clabel{
    font-size:7px;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-weight:700;
    color:var(--muted);
    line-height:1;
    margin:0 0 5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .col.mine .clabel{color:var(--accent);}
  .chip{
    width:22px;
    height:22px;
    border-radius:8px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto;
  }
  .chip svg{display:block;}
  .faces{
    display:flex;
    justify-content:center;
    height:22px;
    align-items:center;
  }
  .face{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid #E4E1EA;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:-6px;
  }
  .face:last-child{margin-right:0;}
  .cval{
    font-size:9px;
    line-height:1.2;
    margin:5px 0 0;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cval em{
    font-style:normal;
    font-weight:400;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Design Systems</p>
    <p class="post">Spacing tokens now match the 4px grid.</p>
    <p class="byline">Marisol Vance · 4h</p>

    <div class="hero">
      <div class="num">1,284</div>
      <div class="unit">Upvotes</div>
    </div>

    <div class="split">
      <div class="col mine">
        <p class="clabel">My vote</p>
        <div class="chip" aria-label="Upvoted">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
        </div>
        <p class="cval">Public</p>
      </div>
      <div class="col">
        <p class="clabel">Others</p>
        <div class="faces">
          <span class="face">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#6B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
            </svg>
          </span>
          <span class="face">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#6B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M4.5 20c1.3-3.6 4.1-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/>
            </svg>
          </span>
        </div>
        <p class="cval">1,283</p>
      </div>
    </div>
  </div>
</body>
</html>
