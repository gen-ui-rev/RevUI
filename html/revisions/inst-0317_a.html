<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northbay Invest — Portfolio</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 40px 0;
    background: #f2f2f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }
  .screen {
    width: 390px;
    height: 560px;
    box-sizing: border-box;
    padding: 40px 24px;
    background: #f2f2f0;
  }
  .card {
    box-sizing: border-box;
    width: 100%;
    background: #ffffff;
    border: 1px solid #dcdcd8;
    border-radius: 10px;
    padding: 20px;
  }
  .hero {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e4e4e0;
  }
  .hero img {
    display: block;
    width: 100%;
    height: 130px;
    object-fit: cover;
    background: #dedede;
  }
  .eyebrow {
    margin: 18px 0 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6d7480;
  }
  h1 {
    margin: 8px 0 0;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .body {
    margin: 8px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: #5c5c58;
  }
  .actions {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid #e8e8e4;
  }
  .actions-label {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #9a9a93;
  }
  .cta {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #1d3a5f;
    border-radius: 8px;
    background: #1d3a5f;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-align: center;
    text-decoration: none;
  }
  .linkrow {
    margin-top: 14px;
    text-align: center;
  }
  .textlink {
    font-size: 13.5px;
    font-weight: 600;
    color: #1d3a5f;
    text-decoration: none;
    border-bottom: 1px solid rgba(29, 58, 95, 0.35);
    padding-bottom: 2px;
  }
  .note {
    margin: 14px 0 0;
    font-size: 11.5px;
    line-height: 1.4;
    color: #8a8a83;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/300/130/chart?lock=4683" width="300" height="130" alt="Printed performance chart on a desk, illustrating an empty portfolio">
      </div>
      <p class="eyebrow">Portfolio</p>
      <h1>No holdings tracked yet</h1>
      <p class="body">Add a stock, fund, or bond you own and we'll track value, dividends, and cost basis from the purchase date.</p>
      <div class="actions">
        <p class="actions-label">Start tracking</p>
        <a class="cta" href="#">Add your first holding</a>
        <p class="linkrow"><a class="textlink" href="#">Import from a brokerage &rarr;</a></p>
        <p class="note">Imports pull the last 24 months of trades.</p>
      </div>
    </div>
  </div>
</body>
</html>
