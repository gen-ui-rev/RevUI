<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E9E8EC;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    background:#F2F1F4;
    border-radius:36px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .top{
    background:#8C6C92;
    padding:13px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .badge{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#FFFFFF;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .head-txt{
    min-width:0;
  }
  .head-txt .t{
    font-size:12px;
    font-weight:700;
    color:#FFFFFF;
    letter-spacing:0.2px;
  }
  .head-txt .s{
    font-size:9.5px;
    font-weight:400;
    color:rgba(255,255,255,0.75);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .body{
    flex:1;
    padding:2px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding:7px 0;
  }
  .k{
    font-size:10px;
    font-weight:500;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:#8A8492;
    flex:0 0 auto;
  }
  .v{
    font-size:11.5px;
    font-weight:700;
    color:#2C2632;
    text-align:right;
  }
  .v.code{
    color:#7C5D83;
    letter-spacing:0.4px;
  }
  .rule{
    height:1px;
    background:#E3E0E7;
  }
  .foot{
    padding:0 14px 13px;
  }
  .note{
    font-size:9px;
    font-weight:400;
    color:#8A8492;
    text-align:center;
    margin:0 0 5px;
  }
  .cta{
    display:block;
    background:#2C2632;
    color:#FFFFFF;
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
    padding:9px 0;
    border-radius:14px;
  }
</style>
</head>
<body>
  <div class="screen">

    <div class="top">
      <div class="badge">
        <svg width="13" height="13" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M8 15.4L12.9 20.2L22.4 10.4" stroke="#8C6C92" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="head-txt">
        <div class="t">Confirmed</div>
        <div class="s">Halden House · Bergen</div>
      </div>
    </div>

    <div class="body">
      <div class="row">
        <span class="k">In</span>
        <span class="v">Mar 14 · 3:00 PM</span>
      </div>
      <div class="rule"></div>
      <div class="row">
        <span class="k">Out</span>
        <span class="v">Mar 17 · 11:00 AM</span>
      </div>
      <div class="rule"></div>
      <div class="row">
        <span class="k">Code</span>
        <span class="v code">KH-48213</span>
      </div>
    </div>

    <div class="foot">
      <p class="note">Free cancellation to Mar 10</p>
      <a class="cta" href="#">View itinerary</a>
    </div>

  </div>
</body>
</html>
