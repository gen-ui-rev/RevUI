<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Project Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e1;
      color: #332d24;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 34px 30px;
      background: #fbf9f4;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .empty-state {
      width: 100%;
      text-align: center;
    }

    .empty-mark {
      width: 64px;
      margin: 0 auto 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: rgba(205, 132, 22, 0.16);
      color: #9a5d05;
    }

    .empty-mark svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    h1 {
      margin: 0;
      color: #8a5100;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.3px;
    }

    p.lede {
      max-width: 290px;
      margin: 8px auto 16px;
      color: #685f52;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.45;
    }

    .suggest-label {
      margin: 0 0 10px;
      color: #94795a;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      text-align: left;
    }

    .suggest-list {
      margin: 0 0 18px;
      padding: 0;
      list-style: none;
    }

    .suggest-list li + li {
      margin-top: 8px;
    }

    .suggest-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid #e4dbc9;
      border-radius: 4px;
      background: #ffffff;
      color: inherit;
      text-align: left;
      text-decoration: none;
    }

    .suggest-copy {
      min-width: 0;
      flex: 1;
    }

    .suggest-title {
      display: block;
      color: #3d3327;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggest-hint {
      display: block;
      color: #7c7263;
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggest-arrow {
      flex: none;
      color: #b1874a;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }

    .primary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 176px;
      padding: 13px 20px;
      border-radius: 4px;
      background: #e9c98f;
      color: #4f3000;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="empty-state" aria-labelledby="empty-title">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 5.5H22.5L27 10V30.5H9V5.5Z" fill="currentColor" opacity="0.2"/>
          <path d="M22.5 5.5V10H27M9 5.5H22.5L27 10V30.5H9V5.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13.5 15H22.5M13.5 19.5H22.5M13.5 24H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="empty-title">Start your project notes</h1>
      <p class="lede">Not sure where to begin? Pick one of these starters.</p>
      <p class="suggest-label">Suggested first notes</p>
      <ul class="suggest-list">
        <li>
          <a class="suggest-item" href="#">
            <span class="suggest-copy">
              <span class="suggest-title">Kickoff decisions</span>
              <span class="suggest-hint">Scope, owners, and agreed dates.</span>
            </span>
            <span class="suggest-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a class="suggest-item" href="#">
            <span class="suggest-copy">
              <span class="suggest-title">Weekly meeting notes</span>
              <span class="suggest-hint">Talking points and follow-ups.</span>
            </span>
            <span class="suggest-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a class="suggest-item" href="#">
            <span class="suggest-copy">
              <span class="suggest-title">Open questions</span>
              <span class="suggest-hint">Blockers waiting on someone else.</span>
            </span>
            <span class="suggest-arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
      </ul>
      <a class="primary-action" href="#" aria-label="Create your first project note">Create first note</a>
    </main>
  </div>
</body>
</html>
