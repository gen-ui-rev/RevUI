<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #deddd9;
      color: #242220;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 13px 14px 15px;
      background: #f4f3f0;
      border-radius: 30px;
      border: 1px solid #c9c6c0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .service-name {
      margin: 0;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #b3261e;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex: none;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #b3261e;
    }

    .status {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .status-label {
      margin: 0 0 1px;
      color: #6b6761;
      font-size: 10px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .arrival-time {
      margin: 0;
      color: #b3261e;
      font-size: 34px;
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .arrival-unit {
      display: block;
      margin-top: 2px;
      color: #45413d;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .progress {
      width: 100%;
      height: 5px;
      margin: 14px 0 4px;
      background: #dedbd5;
      border-radius: 5px;
    }

    .progress-value {
      width: 68%;
      height: 5px;
      background: #b3261e;
      border-radius: 5px;
    }

    .progress-note {
      margin: 0;
      color: #8a857e;
      font-size: 9px;
      line-height: 1.3;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .status-detail {
      margin: 0;
      color: #8a857e;
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
    }

    .status-detail .destination {
      display: block;
      color: #242220;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="live-activity" aria-label="Live order delivery status" style="display:contents">
      <header class="activity-header">
        <p class="service-name">Mercantile Lane</p>
        <p class="live-label"><span class="live-dot"></span>Live</p>
      </header>

      <div class="status">
        <p class="status-label">Arriving in</p>
        <h1 class="arrival-time">12–18<span class="arrival-unit">minutes</span></h1>

        <div class="progress" role="progressbar" aria-label="Delivery progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
          <div class="progress-value"></div>
        </div>
        <p class="progress-note">2 stops away</p>
      </div>

      <p class="status-detail">
        <span class="destination">84 Oak Street</span>
        courier on the way
      </p>
    </section>
  </div>
</body>
</html>
