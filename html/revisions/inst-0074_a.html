<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Fund Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfd9;
      color: #25271f;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      background: #f5f4ef;
    }

    .progress-card {
      width: 100%;
      padding: 24px;
      border: 1px solid #d4d5cb;
      border-radius: 4px;
      background: #fbfaf6;
    }

    .target-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 18px;
      border-bottom: 1px solid #d4d5cb;
    }

    .target-label {
      color: #6f762f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .target-value {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ring-wrap {
      position: relative;
      flex: 0 0 120px;
      width: 120px;
    }

    .ring-wrap svg {
      display: block;
      width: 120px;
      height: 120px;
    }

    .ring-track {
      fill: none;
      stroke: #e2e2d8;
      stroke-width: 9;
    }

    .ring-value {
      fill: none;
      stroke: #747b35;
      stroke-width: 9;
      stroke-linecap: butt;
      stroke-dasharray: 205 302;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
    }

    .ring-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .percent {
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .percent-label {
      margin-top: 4px;
      color: #696b62;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f762f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .goal-note {
      margin: 16px 0 0;
      color: #696b62;
      font-size: 14px;
      line-height: 1.45;
    }

    .hero {
      margin: 20px 0 0;
      padding: 14px 16px;
      border-left: 3px solid #747b35;
      background: #f0f1e4;
    }

    .hero-amount {
      margin: 0;
      font-size: 34px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .hero-sub {
      margin: 7px 0 0;
      color: #565849;
      font-size: 13px;
      line-height: 1.35;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0 0;
      padding: 18px 0 0;
      border-top: 1px solid #d4d5cb;
    }

    .detail-label {
      margin: 0 0 4px;
      color: #696b62;
      font-size: 12px;
      line-height: 1.3;
    }

    .detail-value {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .stamp {
      margin: 16px 0 0;
      color: #7d7f74;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="progress-card" aria-labelledby="goal-title">
      <div class="target-row">
        <span class="target-label">Target date</span>
        <span class="target-value">November 2026</span>
      </div>

      <div class="head">
        <div class="ring-wrap" role="img" aria-label="Emergency fund is 68 percent complete">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="48"></circle>
            <circle class="ring-value" cx="60" cy="60" r="48"></circle>
          </svg>
          <div class="ring-copy">
            <div class="percent">68%</div>
            <div class="percent-label">funded</div>
          </div>
        </div>
        <div class="head-copy">
          <p class="eyebrow">Cedar Ledger goal</p>
          <h1 id="goal-title">Emergency fund</h1>
        </div>
      </div>

      <p class="goal-note">Build six months of essential expenses.</p>

      <div class="hero">
        <p class="hero-amount">$8,160</p>
        <p class="hero-sub">saved of your $12,000 goal</p>
      </div>

      <div class="details">
        <div>
          <p class="detail-label">Remaining</p>
          <p class="detail-value">$3,840</p>
        </div>
        <div>
          <p class="detail-label">Monthly transfer</p>
          <p class="detail-value">$320</p>
        </div>
      </div>
    </section>
    <p class="stamp">Balance updated today at 9:14 AM</p>
  </div>
</body>
</html>
