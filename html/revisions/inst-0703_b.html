<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0f7d78;
    --teal-8:rgba(15,125,120,.08);
    --teal-14:rgba(15,125,120,.14);
    --ink:#16201f;
    --muted:#5d6b6a;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#eceeed;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#eceeed;
    padding:28px 20px;
  }
  .card{
    background:#ffffff;
    border-radius:4px;
    padding:24px 22px 22px;
  }
  .glyph{
    width:48px;
    height:48px;
    border-radius:4px;
    background:var(--teal-14);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    font-size:20px;
    font-weight:600;
    line-height:1.3;
    color:var(--ink);
    margin:18px 0 0;
    letter-spacing:-.2px;
  }
  .body{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin:8px 0 0;
  }
  .summary{
    background:var(--teal-8);
    border-radius:4px;
    padding:14px 16px;
    margin-top:20px;
  }
  .summary .name{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    line-height:1.4;
  }
  .summary .meta{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
    line-height:1.5;
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    width:100%;
    border-radius:4px;
    padding:13px 10px;
    text-align:center;
    font-size:14px;
    font-weight:500;
    line-height:1.2;
  }
  .btn.delete{
    background:var(--teal);
    color:#ffffff;
  }
  .btn.keep{
    background:#ffffff;
    color:var(--teal);
    border:1px solid var(--teal-14);
  }
  .foot{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin:14px 0 0;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="glyph" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f7d78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"/>
          <path d="M9.5 7V4.8h5V7"/>
          <path d="M6 7l1 12.2h10L18 7"/>
          <path d="M10.2 10.6v5.6M13.8 10.6v5.6"/>
        </svg>
      </div>

      <h1>Delete this trip permanently?</h1>
      <p class="body">The itinerary, saved stays, and map pins go with it. Deleted trips are not kept in your Archive and cannot be restored.</p>

      <div class="summary">
        <div class="name">Lisbon Spring Trip</div>
        <div class="meta">Apr 12–19, 2025 · 3 saved stays · 8 map pins</div>
      </div>

      <div class="actions">
        <div class="btn delete">Delete trip</div>
        <div class="btn keep">Keep trip</div>
      </div>

      <p class="foot">To hide it instead, move the trip to Archive.</p>
    </div>
  </div>
</body>
</html>
