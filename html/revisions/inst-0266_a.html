<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options — Tidepool Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 0;
    margin: 0;
    background: #d8d8d5;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #f4f7f8;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 30px 22px;
    background: #0c141b;
  }
  .sheet { width: 100%; }

  .item {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 18px;
    background: #14232c;
    border: 1px solid #203641;
  }
  .item img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    display: block;
    background: #29343a;
    flex: none;
  }
  .item-text {
    min-width: 0;
    flex: 1;
  }
  .eyebrow {
    margin: 0 0 3px;
    color: #66d5df;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .item-text h1 {
    margin: 0 0 4px;
    overflow: hidden;
    color: #ffffff;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub {
    margin: 0;
    color: #a5b1b7;
    font-size: 13px;
  }
  .progress {
    margin-top: 11px;
  }
  .progress-track {
    width: 100%;
    height: 5px;
    background: #34434b;
  }
  .progress-fill {
    width: 66%;
    height: 100%;
    background: #50d1dd;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: #b9c4c8;
    font-size: 12px;
  }
  .progress-meta strong {
    color: #e7fbfd;
    font-weight: 600;
  }

  .actions {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    border: 1px solid #22313a;
  }
  .actions li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 18px;
    border-top: 1px solid #22313a;
    background: #111b22;
    color: #e7ecee;
    font-size: 17px;
    font-weight: 600;
  }
  .actions li:first-child { border-top: 0; }
  .actions li.primary {
    background: #123039;
    color: #7fe6ee;
  }
  .actions .meta {
    flex: none;
    color: #849299;
    font-size: 13px;
    font-weight: 400;
  }
  .actions li.primary .meta { color: #8acbd1; }

  .cancel {
    margin-top: 18px;
    padding: 15px;
    border: 1px solid #25343c;
    background: #172129;
    color: #aab4b9;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="item">
        <img src="https://loremflickr.com/72/72/vinyl?lock=4121" width="72" height="72" alt="Cover art for the episode: a record on a turntable">
        <div class="item-text">
          <p class="eyebrow">Episode · 48 min</p>
          <h1>The Analog Years</h1>
          <p class="sub">Studio Hours · Feb 14, 2025</p>
          <div class="progress" aria-label="31 minutes 42 seconds listened out of 48 minutes">
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
            <div class="progress-meta">
              <strong>31:42 listened</strong>
              <span>16:18 left</span>
            </div>
          </div>
        </div>
      </div>

      <ul class="actions">
        <li class="primary">
          <span>Resume episode</span>
          <span class="meta">From 31:42</span>
        </li>
        <li>
          <span>Play next</span>
          <span class="meta">After current</span>
        </li>
        <li>
          <span>Download episode</span>
          <span class="meta">62 MB</span>
        </li>
      </ul>

      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
