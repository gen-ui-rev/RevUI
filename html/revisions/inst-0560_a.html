<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby Circles — Uploading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0E8B82;
    --teal-dark:#086D66;
    --ink:#12171A;
    --mute:#6B7580;
    --line:#E7EAEC;
    --soft:#F1F7F6;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#DCDFE3;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:844px;
    position:relative;
    background:#FFFFFF;
    color:var(--ink);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 20px 16px;
  }
  .topbar h1{
    flex:1;
    margin:0;
    font-size:16px;
    font-weight:600;
  }
  .iconbtn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .cancel{
    color:var(--teal);
    font-size:14px;
    font-weight:500;
  }

  .main{padding:4px 20px 0;}

  .status-card{
    padding:18px;
    border-radius:8px;
    background:var(--teal);
    color:#FFFFFF;
  }
  .status-label{
    margin:0 0 7px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    opacity:.82;
  }
  .status-primary{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  .percentage{
    margin:0;
    font-size:68px;
    font-weight:700;
    line-height:.94;
    letter-spacing:-.06em;
  }
  .status-copy{
    margin:0 0 6px;
    text-align:right;
    font-size:15px;
    font-weight:600;
    line-height:1.3;
  }
  .track{
    width:100%;
    height:10px;
    margin-top:15px;
    border-radius:5px;
    background:rgba(255,255,255,.25);
  }
  .fill{
    width:68%;
    height:10px;
    border-radius:5px;
    background:#FFFFFF;
  }
  .status-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
    font-size:12px;
    font-weight:500;
    color:rgba(255,255,255,.86);
  }

  .post-meta{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin:14px 0 10px;
  }
  .post-meta h2{
    margin:0 0 3px;
    font-size:17px;
    line-height:1.25;
  }
  .post-meta p{
    margin:0;
    color:var(--mute);
    font-size:12px;
  }
  .wifi{
    flex:none;
    padding:6px 8px;
    border-radius:4px;
    background:var(--soft);
    color:var(--teal-dark);
    font-size:11px;
    font-weight:600;
  }

  .hero{
    width:350px;
    height:206px;
    display:block;
    object-fit:cover;
    border-radius:5px;
    background:#CFD4D8;
  }

  .thumbs-label{
    margin:15px 0 8px;
    color:var(--mute);
    font-size:12px;
    font-weight:500;
  }
  .thumbs{
    display:flex;
    gap:10px;
  }
  .thumbs img{
    width:76px;
    height:76px;
    display:block;
    object-fit:cover;
    border-radius:4px;
    background:#CFD4D8;
  }
  .thumb-more{
    width:76px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    background:var(--soft);
    color:var(--teal);
    font-size:13px;
    font-weight:600;
  }

  .footnote{
    position:absolute;
    right:20px;
    bottom:96px;
    left:20px;
    display:flex;
    align-items:flex-start;
    gap:9px;
  }
  .footnote svg{
    flex:none;
    margin-top:1px;
    color:var(--mute);
  }
  .footnote span{
    color:var(--mute);
    font-size:12px;
    line-height:1.45;
  }

  .tabbar{
    position:absolute;
    right:0;
    bottom:0;
    left:0;
    height:76px;
    display:flex;
    align-items:flex-start;
    padding-top:12px;
    border-top:1px solid var(--line);
    background:#FFFFFF;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#9AA2AA;
    font-size:12px;
    font-weight:500;
  }
  .tab.active{color:var(--teal);}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <h1>New Post</h1>
      <div class="cancel">Cancel</div>
    </div>

    <main class="main">
      <section class="status-card" aria-label="Upload progress">
        <p class="status-label">Uploading now</p>
        <div class="status-primary">
          <p class="percentage">68%</p>
          <p class="status-copy">About 20<br>seconds left</p>
        </div>
        <div class="track" aria-hidden="true"><div class="fill"></div></div>
        <div class="status-meta">
          <span>4.3 MB of 6.3 MB</span>
          <span>Photo 3 of 4</span>
        </div>
      </section>

      <div class="post-meta">
        <div>
          <h2>Weekend Crew</h2>
          <p>Your post will appear when complete</p>
        </div>
        <span class="wifi">Wi-Fi</span>
      </div>

      <img class="hero" src="https://loremflickr.com/350/206/party?lock=7520" width="350" height="206" alt="Cover photo of the post being uploaded: a rooftop gathering at dusk">

      <p class="thumbs-label">4 photos in this post</p>
      <div class="thumbs">
        <img src="https://loremflickr.com/76/76/friends?lock=7521" width="76" height="76" alt="Thumbnail of four friends at a table">
        <img src="https://loremflickr.com/76/76/cafe?lock=7522" width="76" height="76" alt="Thumbnail of a corner cafe counter">
        <img src="https://loremflickr.com/76/76/street?lock=7523" width="76" height="76" alt="Thumbnail of a lit street after the meetup">
        <div class="thumb-more">+1</div>
      </div>
    </main>

    <div class="footnote">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      <span>You can leave this screen. Uploading continues in the background.</span>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        Feed
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="5.2"/><circle cx="15.5" cy="12" r="5.2"/></svg>
        Circles
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>
        Post
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
        You
      </div>
    </nav>
  </div>
</body>
</html>
