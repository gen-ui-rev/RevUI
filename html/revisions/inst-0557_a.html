<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Practice Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dfe1dc;
      color: #24261f;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .screen {
      width: 1024px;
      height: 768px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px;
      background:
        radial-gradient(circle at 10% 18%, rgba(105, 117, 75, 0.08), transparent 29%),
        #f1f2ef;
    }

    .goal-card {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 68px;
      align-items: center;
      padding: 64px;
      background: #ffffff;
      border: 1px solid #e5e7e1;
      border-radius: 22px;
      box-shadow: 0 20px 52px rgba(37, 41, 30, 0.1);
    }

    .goal-copy {
      min-width: 0;
    }

    .goal-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      border-radius: 17px;
      background: #eef0e7;
      color: #69754b;
    }

    .goal-icon svg {
      width: 29px;
      height: 29px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #69754b;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 380px;
      margin: 0;
      font-size: 36px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .description {
      max-width: 430px;
      margin: 17px 0 0;
      color: #686b62;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 400;
    }

    .goal-controls {
      padding: 28px;
      border-radius: 19px;
      background: #f5f6f2;
      border: 1px solid #e5e8de;
    }

    .control-label {
      margin: 0 0 12px;
      color: #686b62;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .stepper {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 52px;
      align-items: center;
      gap: 15px;
      padding: 22px;
      border-radius: 17px;
      background: #69754b;
    }

    .step-button {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .step-button svg {
      width: 21px;
      height: 21px;
    }

    .value {
      min-width: 0;
      color: #ffffff;
      text-align: center;
    }

    .value-number {
      display: block;
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .value-unit {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .helper {
      margin: 15px 0 22px;
      color: #73766d;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .save-button {
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 13px;
      background: #252820;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-align: center;
    }

    .step-button:focus-visible,
    .save-button:focus-visible {
      outline: 3px solid rgba(105, 117, 75, 0.3);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <div class="goal-copy">
        <div class="goal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 7.5V12L15.2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 2.8H15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>

        <p class="eyebrow">Daily goal</p>
        <h1 id="goal-title">Set your practice time</h1>
        <p class="description">Choose how many minutes you want to spend on language lessons each day.</p>
      </div>

      <div class="goal-controls">
        <p class="control-label">Practice duration</p>

        <div class="stepper" role="group" aria-label="Daily practice duration">
          <button class="step-button" type="button" aria-label="Decrease practice time">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>

          <div class="value" aria-live="polite">
            <span class="value-number">20</span>
            <span class="value-unit">Minutes</span>
          </div>

          <button class="step-button" type="button" aria-label="Increase practice time">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 6V18M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <p class="helper">Recommended for steady weekly progress</p>
        <button class="save-button" type="button">Set daily goal</button>
      </div>
    </section>
  </div>
</body>
</html>
