<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Nightly Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #1c2536;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #eef1f5;
    }

    .budget-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(28, 37, 54, 0.07);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5a6b86;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #1c2536;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
    }

    .description {
      margin: 6px 0 18px;
      color: #6d7a8f;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.55;
    }

    .value {
      margin: 0 0 16px;
      color: #23395b;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.15;
    }

    .value span {
      color: #6d7a8f;
      font-size: 14px;
      font-weight: 400;
    }

    .slider-wrap {
      position: relative;
      width: 100%;
      padding: 10px 0;
    }

    .slider-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: #e2e6ee;
      border-radius: 4px;
    }

    .slider-fill {
      width: 62%;
      height: 6px;
      background: #4f6690;
      border-radius: 4px;
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 62%;
      width: 22px;
      height: 22px;
      border: 4px solid #4f6690;
      border-radius: 50%;
      background: #ffffff;
      transform: translate(-50%, -50%);
    }

    .range-input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0.001;
      cursor: pointer;
    }

    .limits {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #7d889b;
      font-size: 12px;
      font-weight: 400;
    }

    .confirm {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #dde3ec;
      border-radius: 6px;
      background: #f7f9fc;
    }

    .confirm-icon {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #e5eaf3;
      color: #23395b;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .confirm-title {
      margin: 0;
      color: #23395b;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
    }

    .confirm-sub {
      margin: 3px 0 0;
      color: #6d7a8f;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }

    .apply-button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 0;
      border-radius: 6px;
      background: #23395b;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      cursor: pointer;
    }

    .ghost-button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 9px 16px;
      border: 1px solid #dde3ec;
      border-radius: 6px;
      background: #ffffff;
      color: #4f6690;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      cursor: pointer;
    }

    .note {
      margin: 10px 0 0;
      color: #7d889b;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="budget-card" aria-labelledby="budget-title">
      <p class="eyebrow">Northpath stays</p>
      <h1 id="budget-title">Set your nightly budget</h1>
      <p class="description">Choose the highest nightly rate to show.</p>

      <p class="value">$240 <span>per night</span></p>

      <div class="slider-wrap">
        <div class="slider-track" aria-hidden="true">
          <div class="slider-fill"></div>
          <div class="slider-thumb"></div>
        </div>
        <input class="range-input" type="range" min="80" max="340" value="240" aria-label="Maximum nightly budget">
      </div>

      <div class="limits" aria-hidden="true">
        <span>$80</span>
        <span>$340+</span>
      </div>

      <div class="confirm">
        <span class="confirm-icon" aria-hidden="true">&#10003;</span>
        <div>
          <p class="confirm-title">214 stays at $240 or less</p>
          <p class="confirm-sub">Saving a budget only filters results. Nothing is booked and no card is charged.</p>
        </div>
      </div>

      <button class="apply-button" type="button">Save budget</button>
      <button class="ghost-button" type="button">Keep browsing all rates</button>
      <p class="note">Rates shown before taxes and fees.</p>
    </section>
  </div>
</body>
</html>
