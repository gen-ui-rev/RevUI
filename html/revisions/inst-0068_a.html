<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe0e3;
      color: #202126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 20px;
      background: #f1f1f3;
    }

    .save-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(28, 28, 33, 0.10);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #cc167f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .episode {
      margin: 8px 0 0;
      color: #5e6068;
      font-size: 14px;
      line-height: 1.5;
    }

    .list-label {
      margin: 22px 0 10px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .location-list {
      border: 1px solid #dedee3;
      border-radius: 4px;
      overflow: hidden;
    }

    .location {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 0;
      background: #ffffff;
      text-align: left;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .location + .location {
      border-top: 1px solid #e7e7eb;
    }

    .row-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 4px;
      background: #fbe8f3;
      color: #cc167f;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
    }

    .row-icon.new {
      background: #ffffff;
      border: 1px dashed #c9cad1;
      color: #70717a;
      font-size: 18px;
      font-weight: 500;
    }

    .row-body {
      flex: 1;
      min-width: 0;
    }

    .location-name {
      display: block;
      color: #2d2e34;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-meta {
      display: block;
      margin-top: 2px;
      color: #70717a;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-action {
      flex: 0 0 auto;
      color: #cc167f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .note {
      margin: 14px 0 0;
      color: #70717a;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="save-card" aria-labelledby="save-title">
      <p class="eyebrow">Fablewave</p>
      <h1 id="save-title">Save episode</h1>
      <p class="episode">“Signals After Dark” from The Quiet Frequency</p>

      <p class="list-label">Tap a list to save it there</p>
      <div class="location-list">
        <button class="location" type="button">
          <span class="row-icon" aria-hidden="true">★</span>
          <span class="row-body">
            <span class="location-name">Listen later</span>
            <span class="location-meta">12 episodes · 4 hr 20 min</span>
          </span>
          <span class="row-action">Save</span>
        </button>
        <button class="location" type="button">
          <span class="row-icon" aria-hidden="true">◐</span>
          <span class="row-body">
            <span class="location-name">Evening podcasts</span>
            <span class="location-meta">8 episodes · added Tuesday</span>
          </span>
          <span class="row-action">Save</span>
        </button>
        <button class="location" type="button">
          <span class="row-icon" aria-hidden="true">✎</span>
          <span class="row-body">
            <span class="location-name">Research interviews</span>
            <span class="location-meta">23 episodes · 15 hr 05 min</span>
          </span>
          <span class="row-action">Save</span>
        </button>
        <button class="location" type="button">
          <span class="row-icon new" aria-hidden="true">+</span>
          <span class="row-body">
            <span class="location-name">New list</span>
            <span class="location-meta">Name it and save in one step</span>
          </span>
          <span class="row-action">Create</span>
        </button>
      </div>

      <p class="note">Saves happen instantly — no extra step.</p>
    </main>
  </div>
</body>
</html>
