<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move to folder — Mealmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #eceae5;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1c1d19;
  }
  .screen {
    width: 390px;
    height: 560px;
    background: #fbfaf7;
    padding: 26px 24px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7433;
    margin: 0 0 8px;
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 14px;
    color: #6d6f66;
    margin: 0;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    margin-top: 14px;
    border-top: 1px solid #e2e0d9;
    border-bottom: 1px solid #e2e0d9;
  }
  .item img {
    width: 56px;
    height: 56px;
    border-radius: 4px;
    object-fit: cover;
    display: block;
    background: #d8d6cd;
    flex: none;
  }
  .item-name {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 12px;
    color: #6d6f66;
    margin: 0;
  }
  .item-text { min-width: 0; }
  .list-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8a8c81;
    margin: 20px 0 6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid #eae8e1;
  }
  .row img {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    display: block;
    background: #d8d6cd;
    flex: none;
  }
  .row-text { flex: 1; min-width: 0; }
  .row-name {
    font-size: 15px;
    line-height: 1.3;
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-count {
    font-size: 12px;
    color: #6d6f66;
    margin: 0;
  }
  .row.selected .row-name { font-weight: 600; color: #4f5726; }
  .mark { flex: none; display: block; }

  /* Primary action owns the bottom of the screen */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin-top: 20px;
  }
  .btn {
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fbfaf7;
    background: #6b7433;
    border: 1px solid #5c6529;
    border-radius: 6px;
    padding: 17px 18px;
    box-shadow: 0 8px 18px rgba(84, 92, 38, 0.26);
  }
  .btn-quiet {
    align-self: center;
    margin-top: 12px;
    background: none;
    border: none;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 500;
    color: #8a8c81;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Move item</p>
    <h1>Choose a destination folder</h1>
    <p class="sub">Order inside folders stays as it is.</p>

    <div class="item">
      <img src="https://loremflickr.com/56/56/salad?lock=12140" width="56" height="56" alt="Miso salmon grain bowl being moved">
      <div class="item-text">
        <p class="item-name">Miso Salmon Grain Bowl</p>
        <p class="item-meta">Saved Mar 4, 2024 &middot; now in Breakfast Ideas</p>
      </div>
    </div>

    <p class="list-label">Your folders</p>

    <div class="row">
      <img src="https://loremflickr.com/40/40/fruit?lock=12141" width="40" height="40" alt="Fruit plate cover for Lunch Prep folder">
      <div class="row-text">
        <p class="row-name">Lunch Prep</p>
        <p class="row-count">24 recipes</p>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="9.5" fill="none" stroke="#c9c7bd" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="row selected">
      <img src="https://loremflickr.com/40/40/running?lock=12142" width="40" height="40" alt="Runner cover for Post-Workout Fuel folder">
      <div class="row-text">
        <p class="row-name">Post-Workout Fuel</p>
        <p class="row-count">11 recipes</p>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="10" fill="#6b7433"/>
        <path d="M6.5 11.4l3.1 3.1 5.9-6.4" fill="none" stroke="#fbfaf7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="row">
      <img src="https://loremflickr.com/40/40/gym?lock=12143" width="40" height="40" alt="Gym cover for High-Protein Snacks folder">
      <div class="row-text">
        <p class="row-name">High-Protein Snacks</p>
        <p class="row-count">7 recipes</p>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="9.5" fill="none" stroke="#c9c7bd" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="actions">
      <button class="btn btn-primary" type="button">Move to Post-Workout Fuel</button>
      <button class="btn btn-quiet" type="button">Keep it in Breakfast Ideas</button>
    </div>
  </div>
</body>
</html>
