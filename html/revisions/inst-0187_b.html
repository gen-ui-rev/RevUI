<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add rental to collection — Northlake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9e9ec;
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:#16181d;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#f1f1f3;
    padding:24px 0;
  }
  .card{
    width:342px;
    margin:0 auto;
    background:#ffffff;
    border-radius:12px;
    box-shadow:0 8px 22px rgba(18,20,28,.10);
    padding:20px;
  }
  .head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:19px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .newlist{
    border:1px solid #e7bcbc;
    border-radius:16px;
    padding:5px 9px;
    font-size:12px;
    font-weight:700;
    color:#c92727;
    white-space:nowrap;
  }
  .property{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
    padding:12px;
    background:#f6f6f8;
    border-radius:11px;
  }
  .property img{
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .property-copy{
    min-width:0;
  }
  .property-name{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rent{
    margin-top:3px;
    font-size:18px;
    line-height:1.15;
    font-weight:700;
  }
  .rent span{
    font-size:12px;
    font-weight:600;
    color:#6b7280;
  }
  .property-details{
    margin-top:4px;
    font-size:11px;
    color:#737985;
    white-space:nowrap;
  }
  .collection-head{
    margin-top:17px;
  }
  .collection-title{
    font-size:15px;
    font-weight:700;
  }
  .collection-help{
    margin-top:2px;
    font-size:12px;
    color:#7c818c;
  }
  .collection-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:10px;
  }
  .collection{
    position:relative;
    border:1px solid #e2e3e7;
    border-radius:10px;
    padding:11px;
    background:#fff;
  }
  .collection.selected{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    gap:11px;
    border-color:#d92a2a;
    background:#fff8f8;
  }
  .collection img{
    width:40px;
    height:40px;
    border-radius:9px;
    object-fit:cover;
    display:block;
    background:#dfe1e5;
    flex:none;
  }
  .collection-copy{
    min-width:0;
  }
  .selected .collection-copy{
    flex:1 1 auto;
  }
  .collection-name{
    margin-top:8px;
    font-size:14px;
    line-height:1.2;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .selected .collection-name{
    margin-top:0;
  }
  .collection-sub{
    margin-top:2px;
    font-size:11px;
    color:#7c818c;
    white-space:nowrap;
  }
  .check{
    flex:none;
  }
  .empty-mark{
    position:absolute;
    top:11px;
    right:11px;
    width:18px;
    height:18px;
    border:1.5px solid #d3d5da;
    border-radius:50%;
    background:#fff;
  }
  .btn{
    margin-top:17px;
    width:100%;
    background:#d92a2a;
    color:#ffffff;
    border-radius:10px;
    padding:13px 0;
    text-align:center;
    font-size:15px;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="head">
        <h1>Add to a collection</h1>
        <span class="newlist">Create new</span>
      </div>

      <div class="property">
        <img src="https://loremflickr.com/64/64/architecture?lock=3220" width="64" height="64" alt="Exterior of the rental at 12 Alder Lane">
        <div class="property-copy">
          <div class="property-name">12 Alder Lane, Unit 4B</div>
          <div class="rent">$2,480 <span>/ month</span></div>
          <div class="property-details">2 bd · 1 ba · 810 ft² · Northlake</div>
        </div>
      </div>

      <div class="collection-head">
        <div class="collection-title">Where should it go?</div>
        <div class="collection-help">Choose one collection for this rental.</div>
      </div>

      <div class="collection-grid">
        <div class="collection selected">
          <img src="https://loremflickr.com/40/40/chart?lock=3221" width="40" height="40" alt="Cover thumbnail for the Tour favorites collection">
          <div class="collection-copy">
            <div class="collection-name">Tour favorites</div>
            <div class="collection-sub">6 rentals · updated today</div>
          </div>
          <svg class="check" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="10" fill="#d92a2a"></circle>
            <path d="M6.5 11.3l3 3 6-6.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>

        <div class="collection">
          <span class="empty-mark" aria-hidden="true"></span>
          <img src="https://loremflickr.com/40/40/city?lock=3222" width="40" height="40" alt="Cover thumbnail for the Pet-friendly collection">
          <div class="collection-name">Pet-friendly</div>
          <div class="collection-sub">4 rentals</div>
        </div>

        <div class="collection">
          <span class="empty-mark" aria-hidden="true"></span>
          <img src="https://loremflickr.com/40/40/office?lock=3223" width="40" height="40" alt="Cover thumbnail for the Compare later collection">
          <div class="collection-name">Compare later</div>
          <div class="collection-sub">3 rentals</div>
        </div>
      </div>

      <div class="btn">Add to Tour favorites</div>
    </div>
  </div>
</body>
</html>
