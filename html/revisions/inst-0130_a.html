<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint progress — Draftline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #d8d8d4;
    color: #292927;
    font-family: 'Source Sans 3', system-ui, sans-serif;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 8px;
    background: #e7e7e4;
  }
  .card {
    padding: 11px 11px 10px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 2px 9px rgba(30, 30, 28, 0.12);
  }
  .eyebrow {
    margin: 0 0 2px;
    color: #85857f;
    font-size: 9px;
    line-height: 1.2;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 1px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.15;
  }
  .sub {
    margin: 0;
    color: #6f6f69;
    font-size: 10px;
    line-height: 1.3;
  }
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }
  .ring {
    position: relative;
    width: 74px;
    height: 74px;
    flex: none;
  }
  .ring svg { display: block; }
  .value {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .pct {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
  }
  .pct span { font-size: 11px; }
  .complete {
    margin-top: 2px;
    color: #85857f;
    font-size: 8px;
    line-height: 1;
  }
  .facts {
    min-width: 0;
    flex: 1;
  }
  .fact + .fact { margin-top: 8px; }
  .key {
    margin: 0;
    color: #85857f;
    font-size: 9px;
    line-height: 1.1;
  }
  .val {
    margin: 1px 0 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.15;
    white-space: nowrap;
  }
  .focus {
    padding-top: 7px;
    border-top: 1px solid #e9e9e5;
  }
  .focus-label {
    margin: 0 0 3px;
    color: #85857f;
    font-size: 9px;
    line-height: 1.1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .focus-row {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .mark {
    position: relative;
    width: 15px;
    height: 15px;
    flex: none;
    border: 1.5px solid #4a4a45;
    border-radius: 50%;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #4a4a45;
  }
  .task {
    min-width: 0;
    overflow: hidden;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <main class="card">
      <header>
        <p class="eyebrow">Draftline · Sprint 14</p>
        <h1>Editor handoff</h1>
        <p class="sub">Closes Friday, March 21</p>
      </header>

      <section class="progress" aria-label="Sprint progress">
        <div class="ring">
          <svg width="74" height="74" viewBox="0 0 74 74" aria-hidden="true">
            <circle cx="37" cy="37" r="29" fill="none" stroke="#ecece8" stroke-width="8"></circle>
            <circle cx="37" cy="37" r="29" fill="none" stroke="#4a4a45" stroke-width="8"
                    stroke-dasharray="123.9 58.3" transform="rotate(-90 37 37)"></circle>
          </svg>
          <div class="value">
            <div class="pct">68<span>%</span></div>
            <div class="complete">17 / 25</div>
          </div>
        </div>
        <div class="facts">
          <div class="fact">
            <p class="key">Days left</p>
            <p class="val">4 days</p>
          </div>
          <div class="fact">
            <p class="key">Open review</p>
            <p class="val">3 docs</p>
          </div>
        </div>
      </section>

      <section class="focus" aria-label="Current sprint task">
        <p class="focus-label">In progress</p>
        <div class="focus-row">
          <span class="mark" aria-hidden="true"></span>
          <span class="task">Drafting chapters</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
