<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Larkspur — Daily Practice Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6d28d9;
    --violet-soft:#efe9fb;
    --ink:#1c1a22;
    --muted:#6f6b7a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eeeef1;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:36px 35px;
  }
  .widget{
    width:100%;
    background:#fff;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(24,20,40,.09);
    padding:24px 22px;
  }
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .head h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    line-height:1.25;
  }
  .head p{
    margin:3px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  .day{
    font-size:13px;
    font-weight:600;
    color:var(--violet);
    background:var(--violet-soft);
    border-radius:14px;
    padding:5px 10px;
    white-space:nowrap;
  }
  .ring-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 0;
  }
  .ring{
    position:relative;
    width:132px;
    height:132px;
  }
  .ring svg{display:block;}
  .ring-text{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ring-text .big{
    font-size:34px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.5px;
  }
  .ring-text .sub{
    margin-top:4px;
    font-size:13px;
    color:var(--muted);
  }
  .cta{
    margin-top:14px;
    background:var(--violet-soft);
    border-radius:14px;
    padding:14px 16px;
  }
  .cta .lead{
    margin:0;
    font-size:19px;
    font-weight:700;
    line-height:1.3;
    letter-spacing:-.2px;
    color:#3b1d84;
  }
  .cta .row{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    height:44px;
    border-radius:11px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:0;
  }
  .btn-primary{
    flex:1 1 auto;
    background:var(--violet);
    color:#fff;
    letter-spacing:.2px;
  }
  .btn-ghost{
    flex:0 0 84px;
    background:transparent;
    border:1px solid #d6cbef;
    color:var(--violet);
  }
  .rule{
    height:1px;
    background:#eceaf0;
    margin:14px 0 10px;
  }
  .meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:4px 0;
  }
  .meta .k{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .meta .v{
    font-size:14px;
    font-weight:600;
    min-width:0;
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="head">
        <div>
          <h1>Daily practice</h1>
          <p>Spanish &middot; Level B1</p>
        </div>
        <span class="day">Day 12</span>
      </div>

      <div class="ring-wrap">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="54" fill="none" stroke="#eceaf0" stroke-width="10"></circle>
            <circle cx="66" cy="66" r="54" fill="none" stroke="#6d28d9" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="237.5 339.3" transform="rotate(-90 66 66)"></circle>
          </svg>
          <div class="ring-text">
            <span class="big">14</span>
            <span class="sub">of 20 minutes</span>
          </div>
        </div>
      </div>

      <div class="cta">
        <p class="lead">6 minutes left to keep the streak</p>
        <div class="row">
          <button class="btn btn-primary" type="button">Start practice</button>
          <button class="btn btn-ghost" type="button">Later</button>
        </div>
      </div>

      <div class="rule"></div>

      <div class="meta">
        <span class="k">Tutor</span>
        <span class="v">Marisol Vega</span>
      </div>
      <div class="meta">
        <span class="k">Speaking session</span>
        <span class="v">Today 4:30 PM</span>
      </div>
    </div>
  </div>
</body>
</html>
