<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline map pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#6b3bd1;
    --ink:#1c1a22;
    --muted:#6c6878;
    --ground:#eeeef1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#e2e2e6;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:var(--ground);
    padding:36px 24px;
  }
  .card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 20px rgba(28,26,34,.08);
    padding:24px 22px 20px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin:0 0 8px;
  }
  h1{
    font-size:24px;
    font-weight:700;
    line-height:1.2;
    margin:0 0 4px;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .pctrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .pct{
    font-size:34px;
    font-weight:700;
    line-height:1;
    color:var(--accent);
  }
  .state{
    font-size:14px;
    color:var(--muted);
  }
  .bar{
    width:100%;
    height:10px;
    border-radius:10px;
    background:#e8e5f2;
  }
  .bar > span{
    display:block;
    width:68%;
    height:100%;
    border-radius:10px;
    background:var(--accent);
  }
  .meta{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-top:13px;
    color:var(--muted);
  }
  .size-detail{
    min-width:0;
    font-size:14px;
    line-height:1.4;
  }
  .size-detail strong{
    color:var(--ink);
    font-weight:600;
  }
  .free-space{
    display:block;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
  }
  .time-detail{
    flex:0 0 auto;
    padding-top:1px;
    color:var(--muted);
    font-size:14px;
    line-height:1.4;
    text-align:right;
  }
  .time-detail strong{
    display:block;
    color:var(--ink);
    font-weight:600;
  }
  .note{
    margin:18px 0 0;
    padding-top:16px;
    border-top:1px solid #eceaf1;
    font-size:14px;
    line-height:1.5;
    color:var(--muted);
  }
  .note b{
    color:var(--ink);
    font-weight:600;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    padding:12px 0;
    text-align:center;
  }
  .btn.primary{
    background:var(--accent);
    color:#fff;
  }
  .btn.ghost{
    background:#fff;
    color:var(--ink);
    border:1px solid #dedbe6;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Offline map pack</p>
      <h1>Lisbon &amp; the Coast</h1>
      <p class="sub">Streets, transit lines, and 14 saved places</p>

      <div class="pctrow">
        <div class="pct">68%</div>
        <div class="state">Downloading over Wi‑Fi</div>
      </div>

      <div class="bar"><span></span></div>

      <div class="meta">
        <div class="size-detail">
          <strong>412 MB</strong> of 605 MB
          <span class="free-space">3.8 GB free after install</span>
        </div>
        <div class="time-detail">
          <strong>About 2 min</strong>
          remaining
        </div>
      </div>

      <p class="note">Stays here until it finishes. Once complete it moves to <b>Offline Library</b>, where you can open or remove it.</p>

      <div class="actions">
        <div class="btn primary">Pause</div>
        <div class="btn ghost">Cancel</div>
      </div>
    </div>
  </div>
</body>
</html>
