<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save to collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#EDECEA;
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#FFFFFF;
    padding:28px;
  }
  .kicker{
    font-size:12px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#E11D48;
    margin:0 0 14px;
  }
  .item{
    display:flex;
    gap:14px;
    align-items:center;
    background:#EDECEA;
    border-radius:10px;
    padding:12px;
  }
  .item img{
    width:72px;
    height:72px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#DDD9D6;
    flex:none;
  }
  .item .txt{min-width:0;}
  .item h1{
    font-size:17px;
    font-weight:700;
    color:#1B1A19;
    margin:0 0 5px;
    line-height:1.25;
  }
  .item p{
    font-size:13px;
    font-weight:500;
    color:#6B6663;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .label{
    font-size:13px;
    font-weight:700;
    color:#6B6663;
    margin:24px 0 8px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
  }
  .row.on{background:rgba(225,29,72,.09);}
  .row img{
    width:40px;
    height:40px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    background:#DDD9D6;
    flex:none;
  }
  .row .meta{
    flex:1;
    min-width:0;
  }
  .row .name{
    font-size:15px;
    font-weight:700;
    color:#1B1A19;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .sub{
    font-size:12px;
    font-weight:500;
    color:#7A7471;
    margin-top:2px;
  }
  .mark{
    flex:none;
    display:block;
  }
  .save{
    display:block;
    width:100%;
    margin-top:22px;
    background:#E11D48;
    color:#FFFFFF;
    border:0;
    border-radius:10px;
    padding:15px 16px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="kicker">Save item</p>

    <div class="item">
      <img src="https://loremflickr.com/72/72/salad?lock=7680" width="72" height="72" alt="Grain bowl with greens, salmon and avocado">
      <div class="txt">
        <h1>Farro Bowl with Salmon</h1>
        <p>540 cal &middot; 38 g protein &middot; 12 min</p>
      </div>
    </div>

    <p class="label">Save to</p>

    <div class="row on">
      <img src="https://loremflickr.com/40/40/salad?lock=7681" width="40" height="40" alt="Cover photo for the High Protein Lunches collection">
      <div class="meta">
        <div class="name">High Protein Lunches</div>
        <div class="sub">14 items &middot; updated Mar 3</div>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="11" fill="#E11D48"></circle>
        <path d="M6.4 11.3l3.1 3.1 6.1-6.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>

    <div class="row">
      <img src="https://loremflickr.com/40/40/fruit?lock=7682" width="40" height="40" alt="Cover photo for the Breakfast Ideas collection">
      <div class="meta">
        <div class="name">Breakfast Ideas</div>
        <div class="sub">9 items &middot; updated Feb 27</div>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="10" fill="none" stroke="#D9D4D1" stroke-width="2"></circle>
      </svg>
    </div>

    <div class="row">
      <img src="https://loremflickr.com/40/40/running?lock=7683" width="40" height="40" alt="Cover photo for the Post-Run Meals collection">
      <div class="meta">
        <div class="name">Post-Run Meals</div>
        <div class="sub">6 items &middot; updated Jan 18</div>
      </div>
      <svg class="mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="11" cy="11" r="10" fill="none" stroke="#D9D4D1" stroke-width="2"></circle>
      </svg>
    </div>

    <button class="save" type="button">Save to High Protein Lunches</button>
  </div>
</body>
</html>
