<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Meal Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9eaed;
      color: #20212a;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px;
      background: #f5f5f7;
    }

    .meal-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d8d9df;
      border-radius: 4px;
    }

    .card-header {
      padding: 12px 14px;
      border-bottom: 1px solid #dedfe4;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #4f46b8;
      font-size: 11px;
      font-weight: 700;
      line-height: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 25px;
      letter-spacing: -0.02em;
    }

    form {
      padding: 10px 14px 12px;
    }

    .step + .step {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e3e4e9;
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .step-num {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #ece9fa;
      color: #4941a7;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
    }

    .step-head h2 {
      flex: 1;
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.01em;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #5f616c;
      font-size: 11px;
      font-weight: 500;
      line-height: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #cfd0d7;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #24252d;
      font-size: 13px;
      font-weight: 400;
      line-height: 20px;
    }

    .add-food {
      padding: 2px 8px;
      border: 1px solid #a9a6dc;
      border-radius: 4px;
      background: #ffffff;
      color: #4941a7;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
    }

    .food-list {
      border-top: 1px solid #dedfe4;
    }

    .food-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid #dedfe4;
    }

    .food-row img {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: block;
      object-fit: cover;
      border-radius: 4px;
      background: #d9dae0;
    }

    .food-copy {
      min-width: 0;
      flex: 1;
    }

    .food-name {
      margin: 0;
      overflow: hidden;
      color: #25262e;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .food-meta {
      margin: 1px 0 0;
      overflow: hidden;
      color: #71737e;
      font-size: 11px;
      font-weight: 400;
      line-height: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .serving {
      flex: 0 0 58px;
      color: #4c4e58;
      font-size: 11px;
      font-weight: 500;
      line-height: 15px;
      text-align: right;
    }

    .total-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #d5d2ee;
      border-radius: 4px;
      background: #f3f1fc;
    }

    .total-label {
      margin: 0;
      color: #5b5885;
      font-size: 11px;
      font-weight: 600;
      line-height: 15px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .total-sub {
      margin: 2px 0 0;
      color: #74768a;
      font-size: 11px;
      font-weight: 400;
      line-height: 15px;
    }

    .total-value {
      color: #272837;
      font-size: 24px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: -0.02em;
    }

    .create-button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid #4338a8;
      border-radius: 4px;
      background: #4f46b8;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="meal-card" aria-labelledby="meal-title">
      <header class="card-header">
        <p class="eyebrow">Nourish Ledger · New entry</p>
        <h1 id="meal-title">Log a new meal</h1>
      </header>

      <form>
        <section class="step">
          <div class="step-head">
            <span class="step-num">1</span>
            <h2>Meal details</h2>
          </div>
          <div class="detail-grid">
            <div>
              <label for="meal-type">Meal type</label>
              <select id="meal-type" aria-label="Meal type">
                <option selected>Lunch</option>
                <option>Breakfast</option>
                <option>Dinner</option>
                <option>Snack</option>
              </select>
            </div>
            <div>
              <label for="meal-date">Date</label>
              <input id="meal-date" type="text" value="May 18, 2025" readonly>
            </div>
          </div>
        </section>

        <section class="step">
          <div class="step-head">
            <span class="step-num">2</span>
            <h2>Foods</h2>
            <button class="add-food" type="button">Add food</button>
          </div>
          <div class="food-list">
            <div class="food-row">
              <img src="https://loremflickr.com/36/36/salad?lock=5270" width="36" height="36" alt="Chicken and grain salad bowl">
              <div class="food-copy">
                <p class="food-name">Chicken grain bowl</p>
                <p class="food-meta">Grilled chicken, quinoa, greens</p>
              </div>
              <span class="serving">1 bowl</span>
            </div>

            <div class="food-row">
              <img src="https://loremflickr.com/36/36/fruit?lock=5271" width="36" height="36" alt="Sliced red apple">
              <div class="food-copy">
                <p class="food-name">Red apple</p>
                <p class="food-meta">Fresh, with skin</p>
              </div>
              <span class="serving">1 medium</span>
            </div>

            <div class="food-row">
              <img src="https://loremflickr.com/36/36/fruit?lock=5272" width="36" height="36" alt="Berries served with yogurt">
              <div class="food-copy">
                <p class="food-name">Berries and yogurt</p>
                <p class="food-meta">Plain Greek yogurt</p>
              </div>
              <span class="serving">3/4 cup</span>
            </div>
          </div>
        </section>

        <section class="step">
          <div class="step-head">
            <span class="step-num">3</span>
            <h2>Review and save</h2>
          </div>
          <div class="total-panel">
            <div>
              <p class="total-label">Estimated total</p>
              <p class="total-sub">Tallied from 3 foods · Lunch</p>
            </div>
            <span class="total-value">655 cal</span>
          </div>
          <button class="create-button" type="submit">Create meal entry</button>
        </section>
      </form>
    </section>
  </div>
</body>
</html>
