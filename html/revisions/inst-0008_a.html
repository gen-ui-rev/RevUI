<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Room Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d8d6cf;
      color: #f5f1e5;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px;
      background: #eeece5;
      box-shadow: 0 18px 50px rgba(47, 44, 35, 0.12);
    }

    .activity {
      width: 800px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
      background: #24231f;
      box-shadow: 0 20px 42px rgba(36, 35, 31, 0.18);
    }

    .activity-main {
      padding: 42px 46px;
      background: rgba(237, 190, 28, 0.16);
    }

    .live-label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: #f0c431;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      background: #f0c431;
    }

    h1 {
      margin: 0;
      color: #fffaf0;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .speaker {
      margin: 20px 0 0;
      color: #f5f0e3;
      font-size: 19px;
      font-weight: 400;
      line-height: 1.4;
    }

    .room-meta {
      margin: 7px 0 0;
      color: #c8c3b6;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    .activity-footer {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      padding: 36px 32px;
      border-left: 1px solid rgba(245, 241, 229, 0.12);
    }

    .service-meta {
      min-width: 0;
      margin-bottom: 28px;
    }

    .service-name,
    .update-time {
      margin: 0;
      line-height: 1.35;
    }

    .service-name {
      color: #f1ede2;
      font-size: 18px;
      font-weight: 600;
    }

    .update-time {
      margin-top: 4px;
      color: #aaa69b;
      font-size: 13px;
      font-weight: 400;
    }

    .open-button {
      width: 100%;
      margin: 0;
      padding: 14px 20px;
      border: 0;
      background: #edbe1c;
      color: #24200f;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .open-button:focus-visible {
      outline: 3px solid #fffaf0;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-labelledby="activity-title">
      <div class="activity-main">
        <p class="live-label"><span class="live-dot" aria-hidden="true"></span>Live room</p>
        <h1 id="activity-title">Neighborhood check-in</h1>
        <p class="speaker">Mara Ellison is speaking</p>
        <p class="room-meta">12 listening · Started at 8:42 PM</p>
      </div>
      <div class="activity-footer">
        <div class="service-meta">
          <p class="service-name">Commonroom</p>
          <p class="update-time">Updated now</p>
        </div>
        <button class="open-button" type="button">Open room</button>
      </div>
    </section>
  </div>
</body>
</html>
