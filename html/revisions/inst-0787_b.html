<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Listening Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8e8;
      color: #292427;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 22px;
      background: #f8f6f6;
    }

    .progress-card {
      width: 100%;
      padding: 20px 24px 22px;
      border: 1px solid #ded8da;
      border-radius: 6px;
      background: #ffffff;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e4dfe1;
    }

    .progress-card h1 {
      margin: 0;
      color: #2b2528;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .period {
      margin: 5px 0 0;
      color: #756c70;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
    }

    .edit-btn {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border: 0;
      border-radius: 5px;
      background: #2b2528;
      color: #ffffff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .edit-btn span {
      font-size: 13px;
      line-height: 1;
    }

    .gauge-wrap {
      position: relative;
      width: 220px;
      margin: 22px auto 0;
    }

    .gauge {
      display: block;
      width: 220px;
      height: 130px;
    }

    .gauge-track {
      fill: none;
      stroke: #ece7e9;
      stroke-width: 18;
      stroke-linecap: round;
    }

    .gauge-fill {
      fill: none;
      stroke: #c94f6d;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-dasharray: 68 100;
    }

    .gauge-center {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      text-align: center;
    }

    .percentage {
      color: #c94f6d;
      font-size: 34px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .current-value {
      margin-top: 7px;
      color: #62595d;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.4;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      margin: 4px auto 0;
      width: 220px;
      color: #9a9195;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .stats {
      display: flex;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e4dfe1;
    }

    .stat {
      flex: 1;
      text-align: center;
    }

    .stat + .stat {
      border-left: 1px solid #eae4e6;
    }

    .stat-value {
      color: #332d30;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .stat-label {
      margin-top: 5px;
      color: #7b7276;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.35;
    }

    .reset {
      margin: 18px 0 0;
      color: #7b7276;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="progress-card" aria-labelledby="goal-title">
      <div class="card-head">
        <div>
          <h1 id="goal-title">Weekly listening goal</h1>
          <p class="period">Monday through Sunday</p>
        </div>
        <button class="edit-btn" type="button"><span aria-hidden="true">✎</span>Edit goal</button>
      </div>

      <div class="gauge-wrap" role="progressbar" aria-label="Weekly listening goal progress" aria-valuemin="0" aria-valuemax="300" aria-valuenow="204" aria-valuetext="204 of 300 minutes">
        <svg class="gauge" viewBox="0 0 220 130" aria-hidden="true">
          <path class="gauge-track" d="M 20 115 A 90 90 0 0 1 200 115" pathLength="100"></path>
          <path class="gauge-fill" d="M 20 115 A 90 90 0 0 1 200 115" pathLength="100"></path>
        </svg>
        <div class="gauge-center">
          <div class="percentage">68%</div>
          <div class="current-value">204 of 300 min</div>
        </div>
      </div>
      <div class="scale">
        <span>0 min</span>
        <span>300 min</span>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-value">96 min</div>
          <div class="stat-label">Still to go</div>
        </div>
        <div class="stat">
          <div class="stat-value">32 min</div>
          <div class="stat-label">Daily pace needed</div>
        </div>
      </div>

      <p class="reset">Goal resets Sunday at 12:00 AM</p>
    </main>
  </div>
</body>
</html>
