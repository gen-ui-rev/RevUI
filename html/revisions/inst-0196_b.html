<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Arrival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdcd9;
      color: #242423;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      display: flex;
      background: #f4f4f2;
    }

    .picker {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .service-name {
      margin: 0 0 6px;
      color: #72726e;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #222220;
      font-size: 30px;
      font-weight: 700;
      line-height: 38px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 7px 0 0;
      color: #666663;
      font-size: 15px;
      font-weight: 400;
      line-height: 22px;
    }

    .step-block {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #c8c8c4;
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-num {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      background: #4d4d4a;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .step-heading {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: #30302e;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .step-state {
      flex: none;
      color: #7b7b77;
      font-size: 11px;
      font-weight: 700;
      line-height: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-note {
      margin: 3px 0 0 32px;
      color: #777773;
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 10px 0 0 32px;
    }

    .date-option {
      margin: 0;
      padding: 9px 4px;
      border: 1px solid #c2c2be;
      border-radius: 0;
      background: transparent;
      color: #4d4d4a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-align: center;
    }

    .date-option.selected {
      border-color: #4d4d4a;
      background: #4d4d4a;
      color: #ffffff;
    }

    .time-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0 0 32px;
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #c2c2be;
      border-radius: 0;
      background: transparent;
      color: #3d3d3a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      text-align: left;
    }

    .time-row .meta {
      color: #85857f;
      font-size: 12px;
      font-weight: 600;
      line-height: 22px;
    }

    .time-row.selected {
      border-color: #4d4d4a;
      background: #4d4d4a;
      color: #ffffff;
    }

    .time-row.selected .meta {
      color: #d6d6ce;
    }

    .action {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid #c8c8c4;
    }

    .summary-line {
      margin: 0 0 10px;
      color: #55554f;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
    }

    .continue-button {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #393937;
      border-radius: 0;
      background: #393937;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 20px;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="arrival-title">
      <header>
        <p class="service-name">Covepath Stays</p>
        <h1 id="arrival-title">Choose your arrival</h1>
        <p class="intro">Check-in at Harbor House, Portland.</p>
      </header>

      <section class="step-block" aria-labelledby="date-heading">
        <div class="step-head">
          <span class="step-num" aria-hidden="true">1</span>
          <h2 class="step-heading" id="date-heading">Select arrival date</h2>
          <span class="step-state">Complete</span>
        </div>
        <p class="section-note">All dates in April 2025</p>
        <div class="date-options" role="group" aria-label="Available arrival dates">
          <button class="date-option" type="button" aria-pressed="false">Sun 20</button>
          <button class="date-option selected" type="button" aria-pressed="true">Mon 21</button>
          <button class="date-option" type="button" aria-pressed="false">Tue 22</button>
          <button class="date-option" type="button" aria-pressed="false">Wed 23</button>
        </div>
      </section>

      <section class="step-block" aria-labelledby="time-heading">
        <div class="step-head">
          <span class="step-num" aria-hidden="true">2</span>
          <h2 class="step-heading" id="time-heading">Select arrival time</h2>
          <span class="step-state">Current</span>
        </div>
        <p class="section-note">Local time in Portland</p>
        <div class="time-list" role="group" aria-label="Available arrival times">
          <button class="time-row" type="button" aria-pressed="false">
            <span>3:00 PM</span><span class="meta">Host on site</span>
          </button>
          <button class="time-row selected" type="button" aria-pressed="true">
            <span>4:00 PM</span><span class="meta">Host on site</span>
          </button>
          <button class="time-row" type="button" aria-pressed="false">
            <span>5:00 PM</span><span class="meta">Self check-in</span>
          </button>
        </div>
      </section>

      <footer class="action">
        <p class="summary-line">Mon, Apr 21 &middot; 4:00 PM &middot; Harbor House</p>
        <button class="continue-button" type="button">Confirm arrival details</button>
      </footer>
    </main>
  </div>
</body>
</html>
