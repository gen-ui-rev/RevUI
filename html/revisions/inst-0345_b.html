<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Ticket Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #182230;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    .topline {
      margin: 0 0 6px;
      color: #6941c6;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .helper {
      margin: 7px 0 0;
      color: #667085;
      font-size: 13px;
      line-height: 1.45;
    }

    .ticket-card {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      background: #f8fafc;
    }

    .ticket-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ticket-number {
      margin: 0;
      color: #667085;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
    }

    .priority {
      padding: 3px 7px;
      border: 1px solid #fecdca;
      border-radius: 999px;
      background: #fff6f5;
      color: #b42318;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
    }

    .ticket-subject {
      margin: 6px 0 0;
      overflow: hidden;
      color: #182230;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .customer {
      margin: 3px 0 0;
      color: #667085;
      font-size: 11px;
      line-height: 1.35;
    }

    section {
      margin-top: 15px;
    }

    .queue-header {
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .queue-title {
      margin: 0;
      color: #344054;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .create-queue {
      padding: 5px 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #d6d0e8;
      border-radius: 5px;
      background: #ffffff;
      color: #6941c6;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
    }

    .queue-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .queue-card {
      min-width: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      border: 1px solid #dfe3e8;
      border-radius: 7px;
      background: #ffffff;
      color: #344054;
      font: inherit;
      text-align: left;
    }

    .queue-card.selected {
      border: 2px solid #6941c6;
      padding: 9px;
      background: #f8f5ff;
      color: #53389e;
    }

    .queue-card-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .queue-icon {
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      color: #667085;
    }

    .selected .queue-icon {
      color: #6941c6;
    }

    .selected-mark {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: #6941c6;
    }

    .queue-name {
      width: 100%;
      margin-top: 7px;
      overflow: hidden;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-status {
      margin-top: 3px;
      color: #7b8494;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 500;
    }

    .selected .queue-status {
      color: #765fa8;
    }

    .routing-note {
      margin: 9px 0 0;
      color: #667085;
      font-size: 11px;
      line-height: 1.4;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .action {
      width: 100%;
      padding: 10px 16px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .move {
      border: 1px solid #6941c6;
      background: #6941c6;
      color: #ffffff;
    }

    .cancel {
      border: 1px solid #d0d5dd;
      background: #ffffff;
      color: #475467;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="assign-title">
      <header>
        <p class="topline">Support workspace</p>
        <h1 id="assign-title">Assign ticket queue</h1>
        <p class="helper">Move this request to the team with the right expertise.</p>
      </header>

      <article class="ticket-card" aria-label="Current ticket summary">
        <div class="ticket-card-top">
          <p class="ticket-number">#7318 · Current ticket</p>
          <span class="priority">Urgent priority</span>
        </div>
        <p class="ticket-subject">Unable to access workspace after upgrade</p>
        <p class="customer">Submitted by Maya Chen · 18 minutes ago</p>
      </article>

      <section aria-labelledby="queue-title">
        <div class="queue-header">
          <h2 class="queue-title" id="queue-title">Available queues</h2>
          <button class="create-queue" type="button" aria-label="Create a new queue">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            New queue
          </button>
        </div>

        <div class="queue-grid" role="radiogroup" aria-label="Available support queues">
          <button class="queue-card selected" type="button" role="radio" aria-checked="true">
            <span class="queue-card-top">
              <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3.5 19 7v5c0 4.2-2.8 7.2-7 8.5-4.2-1.3-7-4.3-7-8.5V7l7-3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M9.5 12h5M12 9.5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              <svg class="selected-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="currentColor"/>
                <path d="m8 12.2 2.55 2.55L16.5 8.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="queue-name">Account Access</span>
            <span class="queue-status">2 agents online</span>
          </button>

          <button class="queue-card" type="button" role="radio" aria-checked="false">
            <span class="queue-card-top">
              <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                <path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="queue-name">Billing</span>
            <span class="queue-status">5 agents online</span>
          </button>

          <button class="queue-card" type="button" role="radio" aria-checked="false">
            <span class="queue-card-top">
              <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 5.5h14v10H9l-4 3v-13Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M9 9.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="queue-name">General Help</span>
            <span class="queue-status">8 agents online</span>
          </button>

          <button class="queue-card" type="button" role="radio" aria-checked="false">
            <span class="queue-card-top">
              <svg class="queue-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="queue-name">Technical Issues</span>
            <span class="queue-status">3 agents online</span>
          </button>
        </div>

        <p class="routing-note">Selected queue usually replies within 30 minutes.</p>
      </section>

      <div class="actions">
        <button class="action move" type="button">Move to Account Access</button>
        <button class="action cancel" type="button">Cancel</button>
      </div>
    </main>
  </div>
</body>
</html>
