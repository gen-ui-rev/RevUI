<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby Circles — Uploading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0E8B82;
    --teal-soft:rgba(14,139,130,.11);
    --ink:#12171A;
    --mute:#6B7580;
    --line:#E7EAEC;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#DCDFE3;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:844px;
    position:relative;
    background:#FFFFFF;
    color:var(--ink);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 20px 16px;
  }
  .topbar h1{
    flex:1;
    margin:0;
    font-size:16px;
    font-weight:600;
  }
  .iconbtn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cancel{
    color:var(--teal);
    font-size:14px;
    font-weight:500;
  }

  .main{padding:3px 20px 0;}
  .intro{
    text-align:center;
  }
  .eyebrow{
    margin:0 0 5px;
    color:var(--teal);
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .intro h2{
    margin:0;
    font-size:22px;
    line-height:1.25;
  }

  .meter-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin:15px 0 14px;
  }
  .dial{
    width:158px;
    flex:none;
    padding:10px;
    border-radius:50%;
    background:conic-gradient(var(--teal) 0 68%, #DCE9E7 68% 100%);
  }
  .dial-core{
    padding:31px 10px;
    border-radius:50%;
    background:#FFFFFF;
    text-align:center;
  }
  .dial-number{
    display:block;
    color:var(--teal);
    font-size:45px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.05em;
  }
  .dial-label{
    display:block;
    margin-top:5px;
    color:var(--mute);
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .upload-details{
    width:145px;
  }
  .upload-details strong{
    display:block;
    margin-bottom:7px;
    font-size:18px;
    line-height:1.25;
  }
  .upload-details p{
    margin:0 0 8px;
    color:var(--mute);
    font-size:12px;
    line-height:1.45;
  }
  .network{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 7px;
    border-radius:4px;
    background:var(--teal-soft);
    color:var(--teal);
    font-size:11px;
    font-weight:600;
  }

  .photo-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:8px;
  }
  .photo-heading strong{
    font-size:14px;
    font-weight:600;
  }
  .photo-heading span{
    color:var(--mute);
    font-size:12px;
  }
  .hero{
    width:350px;
    height:206px;
    display:block;
    object-fit:cover;
    border-radius:5px;
    background:#CFD4D8;
  }

  .thumbs{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .thumbs img{
    width:76px;
    height:76px;
    display:block;
    object-fit:cover;
    border-radius:4px;
    background:#CFD4D8;
  }
  .thumb-more{
    width:76px;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(14,139,130,.18);
    border-radius:4px;
    background:#FFFFFF;
    color:var(--teal);
    font-size:13px;
    font-weight:600;
  }

  .footnote{
    position:absolute;
    right:20px;
    bottom:96px;
    left:20px;
    display:flex;
    align-items:flex-start;
    gap:9px;
  }
  .footnote svg{
    flex:none;
    margin-top:1px;
    color:var(--mute);
  }
  .footnote span{
    color:var(--mute);
    font-size:12px;
    line-height:1.45;
  }

  .tabbar{
    position:absolute;
    right:0;
    bottom:0;
    left:0;
    height:76px;
    display:flex;
    align-items:flex-start;
    padding-top:12px;
    border-top:1px solid var(--line);
    background:#FFFFFF;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    color:#9AA2AA;
    font-size:12px;
    font-weight:500;
  }
  .tab.active{color:var(--teal);}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <h1>New Post</h1>
      <div class="cancel">Cancel</div>
    </div>

    <main class="main">
      <div class="intro">
        <p class="eyebrow">Upload in progress</p>
        <h2>Sharing to Weekend Crew</h2>
      </div>

      <section class="meter-wrap" aria-label="Upload progress: 68 percent">
        <div class="dial">
          <div class="dial-core">
            <span class="dial-number">68%</span>
            <span class="dial-label">Uploaded</span>
          </div>
        </div>
        <div class="upload-details">
          <strong>20 seconds left</strong>
          <p>Photo 3 of 4<br>4.3 MB of 6.3 MB</p>
          <span class="network">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 10a11 11 0 0 1 14 0"/><path d="M8 14a6 6 0 0 1 8 0"/><path d="M11 18a2 2 0 0 1 2 0"/></svg>
            Wi-Fi
          </span>
        </div>
      </section>

      <div class="photo-heading">
        <strong>Post preview</strong>
        <span>4 photos</span>
      </div>

      <img class="hero" src="https://loremflickr.com/350/206/party?lock=7520" width="350" height="206" alt="Cover photo of the post being uploaded: a rooftop gathering at dusk">

      <div class="thumbs">
        <img src="https://loremflickr.com/76/76/friends?lock=7521" width="76" height="76" alt="Thumbnail of four friends at a table">
        <img src="https://loremflickr.com/76/76/cafe?lock=7522" width="76" height="76" alt="Thumbnail of a corner cafe counter">
        <img src="https://loremflickr.com/76/76/street?lock=7523" width="76" height="76" alt="Thumbnail of a lit street after the meetup">
        <div class="thumb-more">+1</div>
      </div>
    </main>

    <div class="footnote">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      <span>It is safe to leave. Your upload will continue in the background.</span>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
        Feed
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="5.2"/><circle cx="15.5" cy="12" r="5.2"/></svg>
        Circles
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>
        Post
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
        You
      </div>
    </nav>
  </div>
</body>
</html>
