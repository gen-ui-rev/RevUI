<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charging Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#e9e9ec;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:#17201b;
  }
  .screen{
    width:390px;
    height:560px;
    background:#eef0ec;
    box-sizing:border-box;
    padding:18px 0 22px;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    padding:0 20px 14px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .station{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:20px;
    line-height:1.2;
  }
  .loc{
    font-size:12.5px;
    color:#7d857c;
    margin-top:3px;
  }
  .chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:#ffffff;
    border:1px solid #dfe3de;
    border-radius:20px;
    padding:5px 11px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#33613f;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#5ec46a;
    display:inline-block;
  }
  .hero{
    margin:0 20px;
    background:#17201b;
    border-radius:10px;
    padding:18px 20px 20px;
    box-sizing:border-box;
    color:#ffffff;
  }
  .split{
    display:flex;
    align-items:flex-start;
  }
  .half{flex:1;min-width:0;}
  .half.right{
    border-left:1px solid rgba(255,255,255,.14);
    padding-left:18px;
  }
  .half:first-child{padding-right:18px;}
  .lbl{
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
  }
  .val{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:42px;
    line-height:1.1;
    margin-top:6px;
  }
  .val.lime{color:#b8f24a;}
  .sub{
    font-size:12.5px;
    color:rgba(255,255,255,.6);
    margin-top:4px;
  }
  .segs{
    display:flex;
    gap:4px;
    margin-top:18px;
  }
  .segs span{
    flex:1;
    height:8px;
    border-radius:2px;
    background:rgba(255,255,255,.14);
  }
  .segs span.on{background:#b8f24a;}
  .grid{
    margin:12px 20px 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    background:#ffffff;
    border-radius:8px;
    padding:12px 14px;
    box-sizing:border-box;
  }
  .k{
    font-size:11px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8a918a;
  }
  .v{
    font-size:17px;
    font-weight:600;
    margin-top:3px;
  }
  .pay{
    margin:10px 20px 0;
    background:#ffffff;
    border-radius:8px;
    padding:12px 14px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:11px;
  }
  .pay-icon{
    width:34px;height:24px;
    border-radius:4px;
    background:#e6ebe5;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pay-text{min-width:0;}
  .pay-title{
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pay-sub{
    font-size:12px;
    color:#8a918a;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .foot{
    margin:18px 20px 0;
  }
  .btn{
    background:#17201b;
    color:#b8f24a;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    padding:13px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-sizing:border-box;
    cursor:default;
  }
  .link{
    display:block;
    text-align:center;
    font-size:13.5px;
    color:#7d857c;
    margin-top:12px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <div class="station">Riverside Garage</div>
        <div class="loc">Level 2 &middot; Bay 04 &middot; CCS 150 kW</div>
      </div>
      <div class="chip"><span class="dot"></span>Charging</div>
    </div>

    <div class="hero">
      <div class="split">
        <div class="half">
          <div class="lbl">Charge</div>
          <div class="val">82%</div>
          <div class="sub">24 min to full</div>
        </div>
        <div class="half right">
          <div class="lbl">Cost so far</div>
          <div class="val lime">$14.20</div>
          <div class="sub">$0.41 / kWh</div>
        </div>
      </div>
      <div class="segs">
        <span class="on"></span><span class="on"></span><span class="on"></span>
        <span class="on"></span><span class="on"></span><span class="on"></span>
        <span class="on"></span><span class="on"></span><span class="on"></span>
        <span class="on"></span><span class="on"></span><span></span>
        <span></span><span></span>
      </div>
    </div>

    <div class="grid">
      <div class="tile"><div class="k">Power now</div><div class="v">48 kW</div></div>
      <div class="tile"><div class="k">Delivered</div><div class="v">34.6 kWh</div></div>
      <div class="tile"><div class="k">Elapsed</div><div class="v">41 min</div></div>
      <div class="tile"><div class="k">Plugged in</div><div class="v">7:12 PM</div></div>
    </div>

    <div class="pay">
      <div class="pay-icon">
        <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
          <rect x="0.5" y="0.5" width="17" height="11" rx="2" fill="none" stroke="#5c665c"/>
          <rect x="0.5" y="3" width="17" height="2.4" fill="#5c665c"/>
        </svg>
      </div>
      <div class="pay-text">
        <div class="pay-title">Visa &bull;&bull;&bull;&bull; 4417</div>
        <div class="pay-sub">Charged automatically when you unplug</div>
      </div>
    </div>

    <div class="foot">
      <div class="btn">
        <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
          <rect x="1" y="1" width="11" height="11" rx="1.5" fill="#b8f24a"/>
        </svg>
        Stop charging
      </div>
      <div class="link">Payment method &amp; receipt</div>
    </div>
  </div>
</body>
</html>
