<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trim Your Photo — Pulseyard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e4e5;
      color: #231f21;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: default;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      min-height: 60px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: center;
      border-bottom: 1px solid #ded9db;
      background: #ffffff;
    }

    .topbar button {
      min-height: 44px;
      font-size: 15px;
      font-weight: 500;
    }

    .cancel {
      text-align: left;
      color: #60595c;
    }

    .done {
      text-align: right;
      color: #bd315d;
      font-weight: 700 !important;
    }

    .title-wrap {
      min-width: 0;
      text-align: center;
    }

    .title {
      margin: 0;
      overflow: hidden;
      color: #231f21;
      font-size: 17px;
      font-weight: 700;
      line-height: 24px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview {
      padding: 14px 0 12px;
      background: #181617;
      color: #ded8da;
    }

    .image-stage {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background: #393536;
    }

    .image-stage img {
      width: 300px;
      height: 300px;
      display: block;
      object-fit: cover;
      background: #393536;
    }

    .shade {
      position: absolute;
      background: rgba(15, 12, 13, 0.6);
      pointer-events: none;
    }

    .shade-top {
      top: 0;
      left: 0;
      width: 300px;
      height: 30px;
    }

    .shade-bottom {
      top: 270px;
      left: 0;
      width: 300px;
      height: 30px;
    }

    .shade-left {
      top: 30px;
      left: 0;
      width: 30px;
      height: 240px;
    }

    .shade-right {
      top: 30px;
      right: 0;
      width: 30px;
      height: 240px;
    }

    .crop-frame {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 240px;
      height: 240px;
      border: 2px solid #ffffff;
      pointer-events: none;
    }

    .grid-v,
    .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
    }

    .grid-v {
      top: 0;
      width: 1px;
      height: 100%;
    }

    .grid-v.one {
      left: 33.333%;
    }

    .grid-v.two {
      left: 66.666%;
    }

    .grid-h {
      left: 0;
      width: 100%;
      height: 1px;
    }

    .grid-h.one {
      top: 33.333%;
    }

    .grid-h.two {
      top: 66.666%;
    }

    .handle {
      position: absolute;
      width: 24px;
      height: 24px;
    }

    .handle::before,
    .handle::after {
      position: absolute;
      content: "";
      background: #cf3d69;
    }

    .handle::before {
      width: 24px;
      height: 4px;
    }

    .handle::after {
      width: 4px;
      height: 24px;
    }

    .handle.tl {
      top: -3px;
      left: -3px;
    }

    .handle.tr {
      top: -3px;
      right: -3px;
      transform: rotate(90deg);
    }

    .handle.br {
      right: -3px;
      bottom: -3px;
      transform: rotate(180deg);
    }

    .handle.bl {
      bottom: -3px;
      left: -3px;
      transform: rotate(270deg);
    }

    .preview-help {
      margin: 0;
      padding: 10px 16px 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .crop-panel {
      background: #ffffff;
    }

    .step-head {
      min-height: 36px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e0e2;
      background: #f7f5f6;
    }

    .step-head h2 {
      margin: 0;
      color: #6b6265;
      font-size: 11px;
      font-weight: 700;
      line-height: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .start-over {
      min-height: 34px;
      color: #8a8184;
      font-size: 12px;
      font-weight: 500;
    }

    .shape-row {
      min-height: 96px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid #e5e0e2;
    }

    .shape-card {
      min-height: 96px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e5e0e2;
      text-align: center;
    }

    .shape-card:last-child {
      border-right: 0;
    }

    .shape-card.selected {
      background: #fdf0f4;
    }

    .thumb-box {
      height: 30px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shape-thumb {
      display: block;
      border: 2px solid #b9b1b4;
    }

    .shape-card.selected .shape-thumb {
      border-color: #bd315d;
    }

    .shape-thumb.sq {
      width: 30px;
      height: 30px;
    }

    .shape-thumb.tall {
      width: 24px;
      height: 30px;
    }

    .shape-thumb.wide {
      width: 30px;
      height: 18px;
    }

    .shape-name {
      display: block;
      color: #322c2e;
      font-size: 14px;
      font-weight: 700;
      line-height: 18px;
    }

    .shape-card.selected .shape-name {
      color: #bd315d;
    }

    .shape-hint {
      display: block;
      color: #7d7477;
      font-size: 11px;
      font-weight: 500;
      line-height: 14px;
    }

    .tilt-row {
      min-height: 78px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e0e2;
    }

    .tilt-head {
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tilt-name {
      color: #231f21;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .tilt-value {
      color: #bd315d;
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
    }

    .slider {
      position: relative;
      height: 22px;
      margin-top: 10px;
    }

    .slider-track {
      position: absolute;
      top: 9px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ded7da;
    }

    .slider-fill {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 7%;
      height: 4px;
      background: #bd315d;
    }

    .slider-thumb {
      position: absolute;
      top: 0;
      left: 57%;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      border: 4px solid #bd315d;
      background: #ffffff;
    }

    .tip {
      min-height: 40px;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e0e2;
      color: #6b6265;
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
    }

    .turn-row {
      min-height: 78px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }

    .turn-button {
      min-height: 78px;
      padding: 0 8px;
      border-right: 1px solid #e5e0e2;
      color: #322c2e;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-align: center;
    }

    .turn-button:last-child {
      border-right: 0;
    }

    .tool-tabs {
      min-height: 66px;
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #d8d2d4;
      background: #fbfafb;
    }

    .tool-tab {
      position: relative;
      min-height: 66px;
      color: #746b6e;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .tool-tab.active {
      color: #bd315d;
      font-weight: 700;
    }

    .tool-tab.active::before {
      position: absolute;
      top: -1px;
      left: 20px;
      right: 20px;
      height: 3px;
      content: "";
      background: #bd315d;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="cancel" type="button">Back</button>
      <div class="title-wrap">
        <h1 class="title">Trim your photo</h1>
      </div>
      <button class="done" type="button">Save</button>
    </header>

    <main>
      <section class="preview" aria-label="Photo trim preview">
        <div class="image-stage">
          <img src="https://loremflickr.com/300/300/running?lock=1810" width="300" height="300" alt="Runner training on an outdoor path">
          <div class="shade shade-top"></div>
          <div class="shade shade-bottom"></div>
          <div class="shade shade-left"></div>
          <div class="shade shade-right"></div>
          <div class="crop-frame" aria-hidden="true">
            <span class="grid-v one"></span>
            <span class="grid-v two"></span>
            <span class="grid-h one"></span>
            <span class="grid-h two"></span>
            <span class="handle tl"></span>
            <span class="handle tr"></span>
            <span class="handle br"></span>
            <span class="handle bl"></span>
          </div>
        </div>
        <p class="preview-help">Drag the photo to move it</p>
      </section>

      <section class="crop-panel" aria-label="Trim controls">
        <div class="step-head">
          <h2>Step 1 · Pick a shape</h2>
          <button class="start-over" type="button">Start over</button>
        </div>

        <div class="shape-row" aria-label="Photo shape">
          <button class="shape-card selected" type="button">
            <span class="thumb-box"><span class="shape-thumb sq"></span></span>
            <span class="shape-name">Square</span>
            <span class="shape-hint">Fits anywhere</span>
          </button>
          <button class="shape-card" type="button">
            <span class="thumb-box"><span class="shape-thumb tall"></span></span>
            <span class="shape-name">Tall</span>
            <span class="shape-hint">Fills the feed</span>
          </button>
          <button class="shape-card" type="button">
            <span class="thumb-box"><span class="shape-thumb wide"></span></span>
            <span class="shape-name">Wide</span>
            <span class="shape-hint">Whole gym</span>
          </button>
        </div>

        <div class="step-head">
          <h2>Step 2 · Straighten it</h2>
        </div>

        <div class="tilt-row">
          <div class="tilt-head">
            <span class="tilt-name">Tilt</span>
            <span class="tilt-value">Tilted right 2°</span>
          </div>
          <div class="slider" aria-label="Tilt set to 2 degrees right">
            <span class="slider-track"></span>
            <span class="slider-fill"></span>
            <span class="slider-thumb"></span>
          </div>
        </div>

        <p class="tip">Line the floor up with a white guide line.</p>

        <div class="turn-row" aria-label="Turn the photo">
          <button class="turn-button" type="button">Turn left</button>
          <button class="turn-button" type="button">Turn right</button>
          <button class="turn-button" type="button">Mirror</button>
        </div>
      </section>
    </main>

    <nav class="tool-tabs" aria-label="Photo editing tools">
      <button class="tool-tab active" type="button" aria-current="page">Shape</button>
      <button class="tool-tab" type="button">Brightness</button>
      <button class="tool-tab" type="button">Looks</button>
    </nav>
  </div>
</body>
</html>
