<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #18181b;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 42px 22px;
      background: #f4f4f5;
    }

    .activity {
      width: 100%;
      padding: 20px;
      border-radius: 10px;
      background: #18181b;
      box-shadow: 0 14px 30px rgba(24, 24, 27, 0.18);
    }

    .activity-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 14px;
      align-items: center;
    }

    .status-kicker {
      margin: 0 0 5px;
      color: #86efac;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.1px;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .status-title {
      margin: 0;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.12;
    }

    .service-line {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .service-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 6px;
      background: #3f3f46;
      color: #ffffff;
    }

    .service-mark svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .service-name {
      margin: 0;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .progress-ring {
      width: 58px;
      height: 58px;
      display: block;
    }

    .transfer-card {
      margin-top: 20px;
      padding: 17px;
      border-radius: 8px;
      background: #ffffff;
    }

    .transfer-label {
      margin: 0 0 4px;
      color: #71717a;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .amount {
      margin: 0;
      color: #18181b;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.2;
    }

    .recipient {
      margin: 5px 0 0;
      color: #52525b;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      margin-top: 17px;
      border-radius: 8px;
      background: #dcfce7;
    }

    .progress-value {
      width: 68%;
      height: 8px;
      border-radius: 8px;
      background: #16a34a;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.12);
    }

    .transfer-meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: #52525b;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
    }

    .active-progress {
      color: #15803d;
    }

    .reference {
      margin: 13px 0 0;
      padding-top: 12px;
      border-top: 1px solid #e4e4e7;
      color: #71717a;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
    }

    .reference strong {
      margin-left: 5px;
      color: #27272a;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Expanded transfer activity">
      <div class="activity-header">
        <div>
          <p class="status-kicker">Active transfer</p>
          <h1 class="status-title">Transfer in progress</h1>

          <div class="service-line">
            <div class="service-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 8H17M14 5L17 8L14 11M19 16H7M10 13L7 16L10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="service-name">Slate Ledger</p>
          </div>
        </div>

        <svg class="progress-ring" viewBox="0 0 58 58" role="img" aria-label="68 percent complete">
          <circle cx="29" cy="29" r="23" fill="#27272a" stroke="#3f3f46" stroke-width="5"/>
          <circle cx="29" cy="29" r="23" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-dasharray="98.3 144.5" transform="rotate(-90 29 29)"/>
          <text x="29" y="33" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">68%</text>
        </svg>
      </div>

      <div class="transfer-card">
        <p class="transfer-label">Sending</p>
        <p class="amount">$1,240.00</p>
        <p class="recipient">To Rowan Pierce · Harbor checking</p>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-value"></div>
        </div>

        <div class="transfer-meta">
          <span class="active-progress">68% complete</span>
          <span>About 2 min left</span>
        </div>

        <p class="reference">Transfer reference <strong>SL-4827-1904</strong></p>
      </div>
    </section>
  </div>
</body>
</html>
