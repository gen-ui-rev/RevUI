<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#5F7C8A;
    --accent-dark:#4E6976;
    --accent-soft:rgba(95,124,138,0.12);
    --accent-softer:rgba(95,124,138,0.07);
    --line:rgba(95,124,138,0.17);
    --ink:#1D2427;
    --muted:#6B767B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:#E7E9E8;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:1024px;
    height:768px;
    padding:48px 64px 44px;
    background:#FFFFFF;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:22px;
    border-bottom:1px solid #E4E8E8;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.1px;
  }
  .context{
    color:var(--muted);
    font-size:13px;
    font-weight:500;
  }
  .main{
    display:grid;
    grid-template-columns:minmax(0, 1fr) 400px;
    gap:88px;
    align-items:start;
    margin-top:72px;
  }
  .mark{
    width:62px;
    height:62px;
    border-radius:8px;
    background:var(--accent-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  h1{
    margin:26px 0 0;
    font-size:30px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:-0.5px;
  }
  .seller{
    margin:8px 0 0;
    color:var(--accent);
    font-size:15px;
    font-weight:700;
  }
  .body{
    max-width:440px;
    margin:18px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
  }
  .summary-title{
    margin:0 0 14px;
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .panel{
    padding:8px 22px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--accent-softer);
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:22px;
    padding:19px 0;
  }
  .row + .row{
    border-top:1px solid var(--line);
  }
  .label{
    min-width:0;
    overflow:hidden;
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .value{
    color:var(--muted);
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
  }
  .actions{
    margin-top:auto;
    padding-top:28px;
    border-top:1px solid #E4E8E8;
    display:grid;
    grid-template-columns:1fr 1fr 1.15fr;
    gap:12px;
  }
  button{
    padding:14px 20px;
    border-radius:7px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .tertiary{
    border:1px solid #D7DEDF;
    background:#FFFFFF;
    color:var(--muted);
  }
  .secondary{
    border:1px solid var(--accent);
    background:#FFFFFF;
    color:var(--accent-dark);
  }
  .primary{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#FFFFFF;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Marketplace safety</div>
      <div class="context">Privacy and blocking</div>
    </div>

    <main class="main">
      <section class="intro">
        <div class="mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5F7C8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line>
          </svg>
        </div>
        <h1>Seller blocked</h1>
        <p class="seller">Harbor Row Goods</p>
        <p class="body">Their listings are out of your feed and search results, and they can no longer message you or make offers on your items.</p>
      </section>

      <section class="summary" aria-label="Blocking summary">
        <p class="summary-title">What changed</p>
        <div class="panel">
          <div class="row">
            <span class="label">Their listings</span>
            <span class="value">Hidden</span>
          </div>
          <div class="row">
            <span class="label">Direct messages</span>
            <span class="value">Blocked</span>
          </div>
          <div class="row">
            <span class="label">Order 48-2210</span>
            <span class="value">Unaffected</span>
          </div>
        </div>
      </section>
    </main>

    <div class="actions">
      <button class="tertiary" type="button">View blocked sellers</button>
      <button class="secondary" type="button">Undo block</button>
      <button class="primary" type="button">Done</button>
    </div>
  </div>
</body>
</html>
