<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserving your item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html { background: #DADDDC; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #DADDDC;
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 1024px;
    height: 768px;
    background: #F1F2F0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 620px;
    background: #FFFFFF;
    border: 1px solid #E1E5E8;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(29, 37, 44, 0.10);
  }

  .bar {
    height: 12px;
    background: rgba(140, 163, 183, 0.20);
    border-radius: 11px 11px 0 0;
    position: relative;
  }

  .bar span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 46%;
    border-radius: 11px 6px 6px 0;
    background: #8CA3B7;
  }

  .content {
    padding: 34px 40px 36px;
  }

  .status {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }

  .spinner {
    display: block;
    flex: 0 0 auto;
    margin-top: 1px;
  }

  .status-copy {
    min-width: 0;
  }

  h1 {
    margin: 0 0 7px;
    font-size: 24px;
    line-height: 30px;
    font-weight: 500;
    color: #1A1E22;
    letter-spacing: -0.2px;
  }

  .sub {
    margin: 0;
    max-width: 455px;
    font-size: 15px;
    line-height: 22px;
    color: #5D6771;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 30px;
    padding: 16px;
    background: rgba(140, 163, 183, 0.13);
    border: 1px solid rgba(140, 163, 183, 0.18);
    border-radius: 9px;
  }

  .item img {
    display: block;
    width: 56px;
    height: 56px;
    border-radius: 7px;
    object-fit: cover;
    background: #D9DDE1;
    flex: 0 0 auto;
  }

  .info {
    min-width: 0;
    flex: 1 1 auto;
  }

  .name {
    font-size: 15px;
    line-height: 20px;
    font-weight: 500;
    color: #1A1E22;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    margin-top: 4px;
    font-size: 13px;
    line-height: 18px;
    color: #5D6771;
  }

  .price {
    flex: 0 0 auto;
    font-size: 15px;
    font-weight: 500;
    color: #1A1E22;
  }

  .note {
    margin: 18px 0 0;
    font-size: 13px;
    line-height: 19px;
    color: #737C86;
  }

  .cancel {
    display: block;
    width: 100%;
    margin-top: 26px;
    padding: 11px 18px;
    border: 1px solid #BCC5CD;
    border-radius: 7px;
    background: #FFFFFF;
    color: #3E4852;
    font: 500 14px/20px 'Roboto', system-ui, sans-serif;
    text-align: center;
    cursor: pointer;
  }

  .cancel:focus-visible {
    outline: 3px solid rgba(140, 163, 183, 0.35);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <main class="card" aria-labelledby="page-title">
      <div class="bar" aria-label="Reservation progress"><span></span></div>

      <div class="content">
        <div class="status">
          <svg class="spinner" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(140,163,183,0.22)" stroke-width="4"></circle>
            <circle cx="20" cy="20" r="17" fill="none" stroke="#8CA3B7" stroke-width="4"
                    stroke-linecap="round" stroke-dasharray="30 77" transform="rotate(-80 20 20)"></circle>
          </svg>

          <div class="status-copy">
            <h1 id="page-title">Reserving your item</h1>
            <p class="sub">Confirming stock with Harbor Lane Supply. This usually takes about 20 seconds.</p>
          </div>
        </div>

        <div class="item">
          <img src="https://loremflickr.com/56/56/sneakers?lock=5142" width="56" height="56" alt="Low-top trail running sneaker in fog gray">
          <div class="info">
            <div class="name">Trail Runner Low</div>
            <div class="meta">Fog Gray · Size 9 · Qty 1</div>
          </div>
          <div class="price">$128.00</div>
        </div>

        <p class="note">Your cart is held until 3:24 PM. Keep this screen open.</p>
        <button class="cancel" type="button">Cancel reservation</button>
      </div>
    </main>
  </div>
</body>
</html>
