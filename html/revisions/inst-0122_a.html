<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice picking microphone access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dededb;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    color: #171b1d;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 16px;
    background: #f8f7f3;
    border: 1px solid #c9c8c2;
    box-shadow: 0 8px 24px rgba(23, 27, 29, 0.14);
  }
  .hero {
    display: none;
    width: 342px;
    height: 156px;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.14;
    font-weight: 700;
    letter-spacing: -0.025em;
  }
  .body {
    margin: 8px 0 0;
    color: #596064;
    font-size: 12px;
    line-height: 16px;
    white-space: nowrap;
  }
  .actions {
    margin-top: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    border: 0;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary {
    padding: 19px 7px;
    background: #f1b51c;
    color: #171b1d;
    border-bottom: 4px solid #c58d00;
    font-size: 18px;
    line-height: 20px;
    font-weight: 700;
    text-align: center;
  }
  .btn-secondary {
    width: auto;
    margin: 14px auto 0;
    padding: 0;
    background: transparent;
    color: #62686b;
    font-size: 11px;
    line-height: 14px;
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="hero" src="https://loremflickr.com/342/156/study?lock=2463" width="342" height="156" alt="A learner practicing spoken English aloud at a desk with an open notebook">

    <h1>Pick hands-free with voice</h1>
    <p class="body">Confirm picks hands-free.</p>

    <div class="actions">
      <button class="btn btn-primary" type="button">Allow microphone</button>
      <button class="btn btn-secondary" type="button">Not now</button>
    </div>
  </div>
</body>
</html>
