<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avenfit Live Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9d5;
      color: #20201e;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 44px 20px;
      background: #f5f4f0;
    }

    .activity {
      width: 100%;
      padding: 16px;
      background: #fffefa;
      border: 1px solid #cecdc7;
      border-top: 4px solid #e96519;
      border-radius: 0;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 8px 3px 7px;
      border: 1px solid #e96519;
      color: #b8430b;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.14em;
    }

    .live-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 9px;
    }

    .live-bars span {
      width: 2px;
      background: #e96519;
    }

    .bar-a { height: 4px; }
    .bar-b { height: 9px; }
    .bar-c { height: 6px; }

    .service {
      margin: 0;
      color: #55544f;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .timing-band {
      display: flex;
      align-items: stretch;
      background: #20201e;
      color: #fffefa;
    }

    .band-cell {
      flex: 1;
      padding: 14px 14px 13px;
    }

    .band-cell + .band-cell {
      flex: 0 0 42%;
      border-left: 1px solid #3c3b38;
    }

    .band-label {
      margin: 0 0 5px;
      color: #a3a19a;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .band-primary {
      margin: 0;
      color: #ff8a3d;
      font-size: 38px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .band-secondary {
      margin: 0;
      color: #fffefa;
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .band-note {
      margin: 8px 0 0;
      color: #a3a19a;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: #e5e3dc;
    }

    .progress-fill {
      width: 61%;
      height: 100%;
      background: #e96519;
    }

    .facts {
      margin: 14px 0 0;
    }

    .fact {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-top: 1px solid #deddd7;
    }

    .fact-label {
      color: #6a6963;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      white-space: nowrap;
    }

    .fact-value {
      color: #20201e;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .metrics {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      padding-top: 13px;
      border-top: 1px solid #deddd7;
    }

    .metric {
      flex: 1;
    }

    .metric-value {
      margin: 0 0 2px;
      color: #20201e;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      margin: 0;
      color: #6a6963;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="activity" aria-label="Live walking workout">
      <div class="activity-header">
        <div class="live" aria-label="Live activity">
          <span class="live-bars" aria-hidden="true">
            <span class="bar-a"></span>
            <span class="bar-b"></span>
            <span class="bar-c"></span>
          </span>
          <span>LIVE</span>
        </div>
        <p class="service">Avenfit Health</p>
      </div>

      <div class="timing-band">
        <div class="band-cell">
          <p class="band-label">Elapsed</p>
          <p class="band-primary">24:18</p>
        </div>
        <div class="band-cell">
          <p class="band-label">Remaining</p>
          <p class="band-secondary">15:42</p>
          <p class="band-note">61% of 40:00 goal</p>
        </div>
      </div>

      <div class="progress-track" aria-label="61 percent of 40-minute goal complete">
        <div class="progress-fill"></div>
      </div>

      <div class="facts">
        <div class="fact">
          <span class="fact-label">Workout</span>
          <span class="fact-value">Outdoor walk</span>
        </div>
        <div class="fact">
          <span class="fact-label">Route</span>
          <span class="fact-value">Riverside Loop</span>
        </div>
        <div class="fact">
          <span class="fact-label">Started</span>
          <span class="fact-value">7:42 AM &middot; 58&deg;F clear</span>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <p class="metric-value">1.82 mi</p>
          <p class="metric-label">Distance</p>
        </div>
        <div class="metric">
          <p class="metric-value">126 bpm</p>
          <p class="metric-label">Heart rate</p>
        </div>
        <div class="metric">
          <p class="metric-value">13:21</p>
          <p class="metric-label">Avg pace</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
