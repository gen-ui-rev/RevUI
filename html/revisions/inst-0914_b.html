<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfare Health — Video Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 0;margin:0;background:#d9d5cd;font-family:'Source Serif 4',Georgia,serif;}
  .screen{width:390px;height:844px;background:#f8faf9;color:#17201f;display:flex;flex-direction:column;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #e2e7e5;}
  .topbar span{font-size:15px;font-weight:600;letter-spacing:.01em;}
  .iconbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#35413f;}
  .hero{text-align:center;padding:13px 16px 14px;background:#fff;}
  .mono{width:58px;height:58px;border-radius:50%;background:#315f72;color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;margin:0 auto;}
  .name{font-size:23px;font-weight:600;margin:9px 0 0;line-height:1.15;}
  .role{font-size:14px;color:#66716f;margin:3px 0 0;}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#276b5e;background:#e7f3ef;border-radius:13px;padding:5px 9px;margin-top:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#27806f;display:block;}
  .content{padding:11px 14px 0;}
  .visitcard{background:#fff;border:1px solid #dfe6e3;border-radius:14px;padding:11px;}
  .lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#7b8582;margin:0 0 8px;}
  .stay{display:flex;gap:10px;align-items:center;}
  .stay img,.shots img{object-fit:cover;display:block;background:#cbd2cf;border-radius:9px;}
  .stay .txt{min-width:0;flex:1;}
  .stay .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stay .m{font-size:13px;color:#66716f;margin-top:2px;}
  .reason{font-size:12px;color:#315f72;font-weight:600;background:#edf4f6;border-radius:10px;padding:5px 7px;white-space:nowrap;}
  .media{padding:11px 14px 0;}
  .mediahead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .mediahead .lbl{margin:0;}
  .count{font-size:12px;color:#747e7b;}
  .shots{display:flex;gap:8px;}
  .spacer{flex:1;}
  .controlpanel{background:#fff;border-top:1px solid #dfe6e3;padding:10px 14px 0;}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .ctl{min-width:0;border:1px solid #dfe6e3;border-radius:11px;background:#f3f6f5;color:#34403d;display:flex;align-items:center;gap:7px;padding:8px 9px;font-size:12px;font-weight:600;}
  .ctl.on{background:#315f72;border-color:#315f72;color:#fff;}
  .ctl.note{grid-column:span 2;background:#edf4f6;border-color:#cbdde3;color:#284f5f;}
  .ctl svg{flex:0 0 auto;}
  .end{margin:10px 14px 11px;height:48px;border-radius:11px;background:#b13e3a;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:600;}
  .tabs{background:#fff;border-top:1px solid #dfe6e3;display:flex;padding:8px 8px 10px;}
  .tab{flex:1;text-align:center;color:#818a87;}
  .tab.active{color:#315f72;}
  .tab .tl{font-size:11px;margin-top:2px;}
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <div class="iconbtn" aria-label="Return to messages">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>
    <span>Secure video visit</span>
    <div class="iconbtn" aria-label="Minimize visit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 14h6v6"/><path d="M19 10h-6V4"/></svg>
    </div>
  </div>

  <div class="hero">
    <div class="mono">PN</div>
    <h1 class="name">Dr. Priya Nair</h1>
    <p class="role">Internal medicine · Northshore Medical</p>
    <div class="live"><span class="dot"></span>Connected securely · 07:42</div>
  </div>

  <div class="content">
    <div class="visitcard">
      <p class="lbl">Visit details</p>
      <div class="stay">
        <img src="https://loremflickr.com/64/64/hotel?lock=12080" width="64" height="64" alt="Northshore Medical consultation office">
        <div class="txt">
          <div class="t">Medication follow-up</div>
          <div class="m">Today · 10:30 AM</div>
        </div>
        <div class="reason">Routine</div>
      </div>
    </div>
  </div>

  <div class="media">
    <div class="mediahead">
      <p class="lbl">Lifestyle photos reviewed</p>
      <span class="count">3 files</span>
    </div>
    <div class="shots">
      <img src="https://loremflickr.com/114/76/beach?lock=12081" width="114" height="76" alt="Coastal walking route shared with the clinician">
      <img src="https://loremflickr.com/114/76/mountain?lock=12082" width="114" height="76" alt="Hiking route shared with the clinician">
      <img src="https://loremflickr.com/114/76/cityscape?lock=12083" width="114" height="76" alt="Daily waterfront route shared with the clinician">
    </div>
  </div>

  <div class="spacer"></div>

  <div class="controlpanel">
    <div class="controls">
      <div class="ctl">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V7a3 3 0 0 1 3-3z"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/><path d="M4 4l16 16"/></svg>
        <span>Muted</span>
      </div>
      <div class="ctl on">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6.5 9H4v6h2.5L11 19V5z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>
        <span>Speaker</span>
      </div>
      <div class="ctl">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="6" r="1.5"/><circle cx="12" cy="6" r="1.5"/><circle cx="17" cy="6" r="1.5"/><circle cx="7" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="7" cy="18" r="1.5"/><circle cx="12" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
        <span>Keypad</span>
      </div>
      <div class="ctl">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="12" height="11" rx="2.5"/><path d="M15 11l6-3.5v9L15 13z"/><path d="M4 4l16 16"/></svg>
        <span>Camera off</span>
      </div>
      <div class="ctl note">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M16 4v4h3"/><path d="M8 12h8M8 16h5"/></svg>
        <span>Add private note</span>
      </div>
    </div>
  </div>

  <div class="end">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5c5-3.5 11-3.5 16 0v3.2l-3.6.6-1-2.6a11 11 0 0 0-6.8 0l-1 2.6-3.6-.6z"/><path d="M19 17l2 2"/><path d="M21 17l-2 2"/></svg>
    Leave visit
  </div>

  <div class="tabs">
    <div class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-4.4 7-10V5l-7-2-7 2v6c0 5.6 7 10 7 10z"/><path d="M9 12h6M12 9v6"/></svg>
      <div class="tl">Health</div>
    </div>
    <div class="tab active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="15" rx="2.5"/><path d="M7 3v5M17 3v5M3 10h18"/></svg>
      <div class="tl">Visits</div>
    </div>
    <div class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"/></svg>
      <div class="tl">Messages</div>
    </div>
    <div class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.5-3.6 4-5.2 7-5.2s5.5 1.6 7 5.2"/></svg>
      <div class="tl">Account</div>
    </div>
  </div>

</div>
</body>
</html>
