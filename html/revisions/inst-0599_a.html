<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0a8f63;
    --accent-soft:rgba(10,143,99,.10);
    --accent-mid:rgba(10,143,99,.18);
    --ink:#15201b;
    --muted:#6b7a72;
    --line:#dfe6e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:'Nunito Sans', system-ui, sans-serif;
    background:#e4e7e5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .screen{
    width:390px;
    height:560px;
    padding:24px 0;
    background:#eceeec;
  }
  .sheet{
    width:342px;
    margin:0 auto;
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 12px rgba(21,32,27,.05);
  }
  .episode{
    display:flex;
    align-items:flex-start;
    gap:14px;
  }
  .art{
    width:64px;
    height:64px;
    border-radius:11px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.28), transparent 48%),
      var(--accent-mid);
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
  }
  .episode-copy{min-width:0; flex:1;}
  .eyebrow{
    color:var(--accent);
    font-size:10px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .title{
    color:var(--ink);
    font-size:17px;
    font-weight:700;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    color:var(--muted);
    font-size:12px;
    line-height:1.35;
    margin-top:3px;
  }
  .episode-facts{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.2;
  }
  .fact-dot{
    width:3px;
    height:3px;
    border-radius:50%;
    background:#a6b2ac;
    flex:none;
  }
  .primary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--accent);
    color:#fff;
    border-radius:10px;
    min-height:44px;
    padding:11px 16px;
    margin-top:16px;
    font-size:15px;
    line-height:1.25;
    font-weight:700;
  }
  .primary svg{display:block; flex:none;}
  .option-group{margin-top:12px;}
  .group-label{
    color:var(--muted);
    font-size:10px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    margin:0 2px 5px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--accent-soft);
    border-radius:9px;
    padding:10px 13px;
  }
  .row-main{
    display:flex;
    align-items:center;
    min-width:0;
    gap:10px;
  }
  .row-icon{
    width:26px;
    height:26px;
    border-radius:7px;
    background:#fff;
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .row-label{
    color:var(--ink);
    font-size:14px;
    line-height:1.25;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-value{
    color:var(--muted);
    font-size:12px;
    line-height:1.2;
    white-space:nowrap;
    flex:none;
  }
  .cancel{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.25;
    font-weight:600;
    padding-top:15px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="episode">
        <div class="art" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26">
            <circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M10.5 8.8v8.4l7-4.2-7-4.2z" fill="currentColor"/>
          </svg>
        </div>
        <div class="episode-copy">
          <div class="eyebrow">Field Notes · Episode 112</div>
          <div class="title">The Long Way Around</div>
          <div class="meta">A journey through remote coastal roads</div>
          <div class="episode-facts">
            <span>Jun 18, 2024</span>
            <span class="fact-dot"></span>
            <span>48 min</span>
            <span class="fact-dot"></span>
            <span>Travel</span>
          </div>
        </div>
      </div>

      <div class="primary">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1.6c0-.8.9-1.3 1.6-.9l9 6.4c.6.4.6 1.4 0 1.8l-9 6.4c-.7.4-1.6-.1-1.6-.9V1.6z" fill="#fff"/></svg>
        Play from start
      </div>

      <div class="option-group">
        <div class="group-label">Offline listening</div>
        <div class="row">
          <div class="row-main">
            <div class="row-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14">
                <path d="M7 1.5v7M4.3 6.2 7 8.9l2.7-2.7M2 11.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="row-label">Download episode</div>
          </div>
          <div class="row-value">62 MB</div>
        </div>
      </div>

      <div class="option-group">
        <div class="group-label">Up next</div>
        <div class="row">
          <div class="row-main">
            <div class="row-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14">
                <path d="M2 3h7M2 7h7M2 11h5M11 8v4M9 10h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="row-label">Add to queue</div>
          </div>
          <div class="row-value">4 waiting</div>
        </div>
      </div>

      <div class="option-group">
        <div class="group-label">Listening status</div>
        <div class="row">
          <div class="row-main">
            <div class="row-icon" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14">
                <path d="m2.2 7.3 3 3 6.6-6.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="row-label">Mark as played</div>
          </div>
          <div class="row-value">31 min left</div>
        </div>
      </div>

      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
