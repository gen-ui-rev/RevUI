<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved places</title>
<style>
  :root{
    --ink:#18181b;
    --muted:#6b7280;
    --line:#e0e0dd;
    --accent:#1f2937;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#dedeDB;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:184px;
    height:224px;
    border-radius:26px;
    background:#f7f7f5;
    padding:12px 12px 10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:6px;
  }
  .bar h1{
    font-size:13px;
    font-weight:700;
    margin:0;
    line-height:1.2;
    letter-spacing:-.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .count{
    flex:none;
    font-size:9px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .item{
    display:flex;
    align-items:center;
    gap:8px;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px 8px 8px 10px;
  }
  .item.pinned{
    background:var(--accent);
    border-color:var(--accent);
    color:#ffffff;
  }
  .rank{
    flex:none;
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    width:10px;
    text-align:center;
  }
  .item.pinned .rank{color:rgba(255,255,255,.65);}
  .name{
    flex:1;
    min-width:0;
    font-size:12px;
    font-weight:600;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pin{
    flex:none;
    width:26px;
    height:26px;
    border-radius:13px;
    border:1px solid var(--line);
    background:#f7f7f5;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .item.pinned .pin{
    background:#ffffff;
    border-color:#ffffff;
    color:var(--accent);
  }
  .hint{
    margin-top:auto;
    text-align:center;
    font-size:9px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="bar">
      <h1>Saved · Lisbon</h1>
      <span class="count">1 pin</span>
    </div>

    <div class="list">
      <div class="item pinned">
        <span class="rank">1</span>
        <div class="name">Alfama Terrace</div>
        <div class="pin" aria-label="Unpin Alfama Terrace">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z" fill="currentColor"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>

      <div class="item">
        <span class="rank">2</span>
        <div class="name">Casa Belém</div>
        <div class="pin" aria-label="Pin Casa Belém">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>

      <div class="item">
        <span class="rank">3</span>
        <div class="name">Estrela Flat</div>
        <div class="pin" aria-label="Pin Estrela Flat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="hint">Tap a pin to reorder</div>
  </div>
</body>
</html>
