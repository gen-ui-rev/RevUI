<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pin Care Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e9ed;
      color: #202026;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 20px;
      background: #f6f6f8;
    }

    .pin-card {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d9d9e0;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(32, 32, 38, 0.05);
    }

    .card-header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .pin-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: none;
      color: #ffffff;
      background: #6d43c0;
      border-radius: 6px;
      box-shadow: 0 5px 12px rgba(109, 67, 192, 0.22);
    }

    .pin-mark svg {
      width: 22px;
      height: 22px;
    }

    .leave-button {
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #5f5f69;
      font: inherit;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 7px;
      color: #4f2a9a;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0 0 18px;
      color: #5f5f69;
      font-size: 14px;
      line-height: 1.5;
    }

    .plan {
      padding: 15px 16px;
      border: 1px solid #d8ccef;
      border-left: 4px solid #6d43c0;
      border-radius: 6px;
      background: #faf8ff;
    }

    .plan-label {
      margin: 0 0 5px;
      color: #6d43c0;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .plan-name {
      margin: 0 0 5px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 600;
    }

    .plan-meta {
      margin: 0;
      color: #5f5f69;
      font-size: 13px;
      line-height: 1.45;
    }

    .privacy-note {
      margin: 16px 0 18px;
      color: #666670;
      font-size: 12px;
      line-height: 1.5;
    }

    .pin-button {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 1px solid #6d43c0;
      border-radius: 5px;
      background: #6d43c0;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(109, 67, 192, 0.18);
    }

    .pin-button svg {
      width: 17px;
      height: 17px;
      flex: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pin-title">
      <header class="card-header">
        <div class="pin-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
            <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <button class="leave-button" type="button" aria-label="Leave without pinning">Not now</button>
      </header>

      <h1 id="pin-title">Keep this plan close</h1>
      <p class="intro">Pin your current care plan to the top of Home for quicker access.</p>

      <div class="plan">
        <p class="plan-label">Ready to pin</p>
        <p class="plan-name">Lower back recovery</p>
        <p class="plan-meta">4 exercises · Next session June 18</p>
      </div>

      <p class="privacy-note">This changes only your Home view. It does not copy the plan or notify your care team.</p>

      <button class="pin-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.2 3.5h7.6l-1.1 5.1 2.8 3v1.9H6.5v-1.9l2.8-3-1.1-5.1Z" fill="currentColor"/>
          <path d="M12 13.5v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Pin to Home
      </button>
    </section>
  </div>
</body>
</html>
