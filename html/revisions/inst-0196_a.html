<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Arrival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdcd9;
      color: #242423;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      display: flex;
      background: #f4f4f2;
    }

    .picker {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .service-name {
      margin: 0 0 6px;
      color: #72726e;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #222220;
      font-size: 30px;
      font-weight: 700;
      line-height: 38px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 7px 0 0;
      color: #666663;
      font-size: 15px;
      font-weight: 400;
      line-height: 22px;
    }

    .steps {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .step {
      display: flex;
      gap: 14px;
    }

    .step-marker {
      display: flex;
      flex: none;
      flex-direction: column;
      align-items: center;
      width: 26px;
    }

    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid #4d4d4a;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .badge.done {
      background: #4d4d4a;
      color: #ffffff;
    }

    .badge.current {
      background: #ffffff;
      color: #30302e;
    }

    .rail {
      flex: 1;
      width: 1px;
      margin: 6px 0 0;
      background: #c8c8c4;
    }

    .step-body {
      flex: 1;
      min-width: 0;
      padding-bottom: 20px;
    }

    .step.last .step-body {
      padding-bottom: 0;
    }

    .step-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .step-heading {
      margin: 0;
      color: #30302e;
      font-size: 15px;
      font-weight: 700;
      line-height: 26px;
    }

    .step-edit {
      color: #6a6a66;
      font-size: 13px;
      font-weight: 600;
      line-height: 26px;
      text-decoration: underline;
    }

    .step-summary {
      margin: 2px 0 0;
      color: #3d3d3a;
      font-size: 19px;
      font-weight: 700;
      line-height: 26px;
      letter-spacing: -0.01em;
    }

    .section-note {
      margin: 2px 0 0;
      color: #777773;
      font-size: 13px;
      font-weight: 400;
      line-height: 18px;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .time-option {
      padding: 10px 12px;
      border: 1px solid #c2c2be;
      border-radius: 22px;
      background: transparent;
      color: #3d3d3a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
    }

    .time-option.selected {
      border-color: #4d4d4a;
      background: #4d4d4a;
      color: #ffffff;
    }

    .time-option.wide {
      grid-column: 1 / -1;
      color: #6a6a66;
      font-size: 14px;
      font-weight: 600;
    }

    .action {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid #c8c8c4;
    }

    .continue-button {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #3f5c4a;
      border-radius: 26px;
      background: #3f5c4a;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
    }

    .action-note {
      margin: 8px 0 0;
      color: #7b7b77;
      font-size: 12px;
      font-weight: 400;
      line-height: 17px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="picker" aria-labelledby="arrival-title">
      <header>
        <p class="service-name">Covepath Stays</p>
        <h1 id="arrival-title">Choose your arrival</h1>
        <p class="intro">Two quick steps for Harbor House, Portland.</p>
      </header>

      <ol class="steps">
        <li class="step">
          <div class="step-marker">
            <span class="badge done" aria-hidden="true">1</span>
            <span class="rail" aria-hidden="true"></span>
          </div>
          <div class="step-body">
            <div class="step-top">
              <h2 class="step-heading">Step 1 &middot; Arrival date</h2>
              <span class="step-edit">Change</span>
            </div>
            <p class="step-summary">Monday, April 21</p>
          </div>
        </li>

        <li class="step last">
          <div class="step-marker">
            <span class="badge current" aria-hidden="true">2</span>
          </div>
          <div class="step-body">
            <h2 class="step-heading">Step 2 &middot; Arrival time</h2>
            <p class="section-note">Local time in Portland</p>
            <div class="time-options" role="group" aria-label="Available arrival times">
              <button class="time-option" type="button" aria-pressed="false">3:00 PM</button>
              <button class="time-option selected" type="button" aria-pressed="true">4:00 PM</button>
              <button class="time-option" type="button" aria-pressed="false">5:00 PM</button>
              <button class="time-option" type="button" aria-pressed="false">6:00 PM</button>
              <button class="time-option wide" type="button" aria-pressed="false">Not sure yet &mdash; I'll text the host</button>
            </div>
          </div>
        </li>
      </ol>

      <footer class="action">
        <button class="continue-button" type="button">Sounds good &mdash; hold my room</button>
        <p class="action-note">Nothing is charged until your host says yes.</p>
      </footer>
    </main>
  </div>
</body>
</html>
