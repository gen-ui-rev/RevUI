<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order item actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:#dcdfe1;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    border-radius:40px;
    background:#0d1418;
    padding:12px 16px 14px;
    display:flex;
    flex-direction:column;
    color:#e9eef0;
    box-shadow:0 0 0 6px #c3c8ca, 0 10px 22px rgba(20,28,33,.28);
    overflow:hidden;
  }
  .statusbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:10px;
    font-weight:600;
    letter-spacing:.03em;
    color:#7fa3b0;
  }
  .dismiss{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#1c282e;
    color:#8fa4ad;
    font-size:10px;
    font-weight:600;
    line-height:18px;
    text-align:center;
  }
  .context{
    margin-top:9px;
    text-align:center;
  }
  .eyebrow{
    font-size:8px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#6f8e9a;
    margin:0;
  }
  .title{
    font-size:13px;
    font-weight:600;
    line-height:1.22;
    color:#f2f6f7;
    margin:4px 0 0;
  }
  .meta{
    font-size:10px;
    font-weight:400;
    color:#87949a;
    margin:4px 0 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cta{
    margin-top:auto;
    background:#2f6d86;
    border-radius:999px;
    padding:11px 12px 12px;
    text-align:center;
  }
  .cta-label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:#ffffff;
    line-height:1.2;
  }
  .cta-note{
    display:block;
    margin-top:3px;
    font-size:9px;
    font-weight:400;
    color:#cbe2ea;
  }
  .footer{
    margin-top:10px;
    text-align:center;
  }
  .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
  }
  .dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#2c3a41;
  }
  .dot.on{
    width:14px;
    border-radius:3px;
    background:#7fa3b0;
  }
  .hint{
    font-size:9px;
    font-weight:500;
    color:#6b787e;
    margin:6px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="statusbar">
      <span class="dismiss">&#10005;</span>
      <span>9:41</span>
    </div>
    <div class="context">
      <p class="eyebrow">Delivered Mar 8</p>
      <p class="title">Ridgeline Canvas Duffel</p>
      <p class="meta">Order 4820-771 &middot; $128.00</p>
    </div>
    <div class="cta">
      <span class="cta-label">Start a return</span>
      <span class="cta-note">Free pickup through Mar 22</span>
    </div>
    <div class="footer">
      <div class="dots">
        <span class="dot on"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p class="hint">3 more actions &middot; swipe up</p>
    </div>
  </div>
</body>
</html>
