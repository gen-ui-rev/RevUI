<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Table Is Held</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e0;
      color: #24221f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      background: #fbfaf7;
    }

    .banner img {
      display: block;
      width: 390px;
      height: 96px;
      object-fit: cover;
      background: #d3cec5;
    }

    .body {
      padding: 18px 22px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 6px 0 0;
      color: #66615a;
      font-size: 13px;
      line-height: 1.5;
    }

    .hold-card {
      margin-top: 16px;
      padding: 15px;
      border: 1px solid #b8d3c2;
      border-radius: 6px;
      background: #eef6f0;
    }

    .who {
      margin: 0;
      color: #4d6a58;
      font-size: 12.5px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .when {
      margin: 4px 0 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .keep {
      width: 100%;
      margin-top: 12px;
      padding: 14px 16px;
      border: 0;
      border-radius: 4px;
      background: #1f5c3d;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .fine {
      margin: 8px 0 0;
      text-align: center;
      color: #55705f;
      font-size: 11.5px;
      line-height: 1.4;
    }

    .label {
      margin: 18px 0 0;
      color: #7a746c;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .chips {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      flex: 1 1 0;
      padding: 10px 4px;
      border: 1px solid #cdc7be;
      border-radius: 4px;
      background: #ffffff;
      color: #34312d;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .secondary {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      border: 1px solid #bbb6ae;
      border-radius: 4px;
      background: transparent;
      color: #34312d;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
    }

    .cancel {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #8a5b4b;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="hold-title">
      <div class="banner">
        <img src="https://loremflickr.com/390/96/restaurant?lock=11230" width="390" height="96" alt="Candlelit terrace tables at Morrow Kitchen">
      </div>

      <div class="body">
        <h1 id="hold-title">Your table is still held</h1>
        <p class="intro">We'll keep it until 8:20 PM if you're running late.</p>

        <section class="hold-card" aria-label="Held reservation">
          <p class="who">Morrow Kitchen · Terrace · Table for 4</p>
          <p class="when">Sun, Oct 18 · 8:00 PM</p>
          <button class="keep" type="button">Keep this table</button>
          <p class="fine">Free to change up to 2 hours before dinner.</p>
        </section>

        <p class="label">Move to another time</p>
        <div class="chips">
          <button class="chip" type="button">7:15 PM</button>
          <button class="chip" type="button">8:30 PM</button>
          <button class="chip" type="button">9:00 PM</button>
        </div>

        <button class="secondary" type="button">Change party size or add a note</button>
        <button class="cancel" type="button">Cancel reservation instead</button>
      </div>
    </main>
  </div>
</body>
</html>
