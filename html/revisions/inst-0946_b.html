<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Goal Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #1e293b;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 28px;
      background: #f8fafc;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #334155;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .description {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .rule {
      margin: 22px 0 24px;
      border: 0;
      border-top: 1px solid #cbd5e1;
    }

    .progress {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .ring {
      width: 132px;
      height: 132px;
      flex: 0 0 auto;
    }

    .track {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 11;
    }

    .value {
      fill: none;
      stroke: #475569;
      stroke-width: 11;
      stroke-linecap: butt;
      stroke-dasharray: 276.6 425.74;
      transform: rotate(-90deg);
      transform-origin: 77px 77px;
    }

    .percent {
      fill: #334155;
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 32px;
      font-weight: 700;
      text-anchor: middle;
    }

    .complete {
      fill: #64748b;
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-anchor: middle;
      text-transform: uppercase;
    }

    .details {
      width: 100%;
      min-width: 0;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
    }

    .stats {
      display: flex;
      align-items: stretch;
      text-align: center;
    }

    .stat {
      flex: 1 1 0;
      min-width: 0;
    }

    .stat + .stat {
      border-left: 1px solid #e2e8f0;
    }

    .count {
      margin: 0;
      color: #334155;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .count-label {
      margin: 3px 0 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .remaining {
      margin: 14px 0 0;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .deadline {
      display: block;
      color: #64748b;
      font-weight: 400;
    }

    .dropoff {
      display: block;
      margin-top: 4px;
      color: #475569;
      font-weight: 500;
    }

    .dropoff span {
      display: block;
      color: #64748b;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="goal-title">
      <p class="eyebrow">Westhaven Circle</p>
      <h1 id="goal-title">Neighborhood food drive</h1>
      <p class="description">Track the community’s progress toward 5,000 donated items for the Westhaven pantry.</p>

      <hr class="rule">

      <div class="progress">
        <svg class="ring" viewBox="0 0 154 154" role="img" aria-label="65 percent of the food drive goal collected">
          <circle class="track" cx="77" cy="77" r="67.75"></circle>
          <circle class="value" cx="77" cy="77" r="67.75"></circle>
          <text class="percent" x="77" y="75">65%</text>
          <text class="complete" x="77" y="98">collected</text>
        </svg>

        <div class="details">
          <div class="stats">
            <div class="stat">
              <p class="count">3,240</p>
              <p class="count-label">items donated</p>
            </div>
            <div class="stat">
              <p class="count">1,760</p>
              <p class="count-label">items to go</p>
            </div>
          </div>
          <p class="remaining">
            <span class="deadline">Drive ends June 30 · goal 5,000 items</span>
            <span class="dropoff">Drop-off: Westhaven Community Center
              <span>12 Larch Road, daily 9am – 7pm</span>
            </span>
          </p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
