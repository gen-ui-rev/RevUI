<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrange Featured Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e8eb;
      color: #26212c;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button {
      font-family: inherit;
    }

    .screen {
      width: 1024px;
      height: 768px;
      padding: 38px 48px;
      background: #f5f4f6;
    }

    .workspace-header {
      width: 100%;
      padding-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dedbe1;
    }

    .brand {
      margin: 0;
      color: #403947;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
    }

    .workspace-label {
      margin: 0;
      color: #7a727f;
      font-size: 13px;
      line-height: 1.4;
    }

    .reorder-component {
      width: 520px;
      margin: 30px auto 0;
      padding: 24px;
      border: 1px solid #e1dee4;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(43, 32, 51, 0.06);
    }

    .intro {
      padding-bottom: 18px;
      border-bottom: 1px solid #ebe8ed;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f3fa6;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #302735;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .description {
      margin: 8px 0 0;
      color: #6a626f;
      font-size: 13px;
      line-height: 1.5;
    }

    .product-list {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #e8e3eb;
      border-radius: 7px;
      background: #fbfafc;
    }

    .drag-handle {
      width: 28px;
      padding: 5px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #76558f;
      cursor: grab;
    }

    .drag-handle:hover {
      border-color: #d9cce5;
      background: #f2edf7;
    }

    .drag-handle svg {
      width: 16px;
      height: 22px;
      display: block;
    }

    .product-image {
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd8e2;
    }

    .product-copy {
      min-width: 0;
      flex: 1;
    }

    .product-name {
      margin: 0;
      overflow: hidden;
      color: #2d2732;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .product-position {
      margin: 4px 0 0;
      color: #776f7c;
      font-size: 12px;
      line-height: 1.4;
    }

    .order-number {
      min-width: 26px;
      color: #8b8390;
      font-size: 12px;
      font-weight: 500;
      text-align: right;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .reverse-button,
    .save-button {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
    }

    .reverse-button {
      border: 1px solid #cfc4d8;
      background: #ffffff;
      color: #633794;
    }

    .save-button {
      min-width: 110px;
      border: 1px solid #6f3fa6;
      background: #6f3fa6;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="workspace-header">
      <p class="brand">Morrow Market</p>
      <p class="workspace-label">Storefront editor</p>
    </header>

    <main class="reorder-component" aria-labelledby="reorder-title">
      <header class="intro">
        <p class="eyebrow">Featured collection</p>
        <h1 id="reorder-title">Arrange featured products</h1>
        <p class="description">Drag a handle to change the order customers see on your storefront.</p>
      </header>

      <ol class="product-list" aria-label="Featured product order">
        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Cloudstep sneakers">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/sneakers?lock=5290" width="56" height="56" alt="Pair of Cloudstep sneakers">
          <div class="product-copy">
            <p class="product-name">Cloudstep Sneakers</p>
            <p class="product-position">Footwear</p>
          </div>
          <span class="order-number" aria-label="Position 1">01</span>
        </li>

        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Alder side table">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/furniture?lock=5291" width="56" height="56" alt="Alder wood side table">
          <div class="product-copy">
            <p class="product-name">Alder Side Table</p>
            <p class="product-position">Furniture</p>
          </div>
          <span class="order-number" aria-label="Position 2">02</span>
        </li>

        <li class="product-row">
          <button class="drag-handle" type="button" aria-label="Drag Rowan canvas tote">
            <svg viewBox="0 0 16 22" aria-hidden="true">
              <circle cx="5" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="5" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="11" r="1.5" fill="currentColor"></circle>
              <circle cx="5" cy="17" r="1.5" fill="currentColor"></circle>
              <circle cx="11" cy="17" r="1.5" fill="currentColor"></circle>
            </svg>
          </button>
          <img class="product-image" src="https://loremflickr.com/56/56/fashion?lock=5292" width="56" height="56" alt="Rowan canvas tote bag">
          <div class="product-copy">
            <p class="product-name">Rowan Canvas Tote</p>
            <p class="product-position">Accessories</p>
          </div>
          <span class="order-number" aria-label="Position 3">03</span>
        </li>
      </ol>

      <div class="actions" aria-label="Order actions">
        <button class="reverse-button" type="button">Reverse order</button>
        <button class="save-button" type="button">Save order</button>
      </div>
    </main>
  </div>
</body>
</html>
