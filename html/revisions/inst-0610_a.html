<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Booking Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e5;
      color: #252225;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f7f6f5;
    }

    .goal-card {
      padding: 28px 24px 26px;
      background: #ffffff;
      border: 1px solid #dedbdd;
      border-radius: 14px;
      text-align: center;
    }

    .service {
      margin: 0 0 16px;
      color: #777176;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 600;
    }

    .trip-date {
      margin: 6px 0 22px;
      color: #6f696e;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 400;
    }

    .dial {
      width: 176px;
      height: 176px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: conic-gradient(#c026a7 0 68%, #eee9ed 68% 100%);
    }

    .dial-inner {
      width: 132px;
      height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: #ffffff;
      border-radius: 50%;
    }

    .percentage {
      color: #c026a7;
      font-size: 34px;
      line-height: 1;
      font-weight: 600;
    }

    .dial-label {
      color: #777176;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      padding: 18px 0;
      border-top: 1px solid #e6e2e5;
      border-bottom: 1px solid #e6e2e5;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat + .stat {
      border-left: 1px solid #e6e2e5;
    }

    .stat-label {
      color: #777176;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .stat-value {
      color: #252225;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 600;
    }

    .remaining {
      margin: 18px 0 0;
      color: #4e494d;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .remaining strong {
      color: #252225;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="goal-card" aria-labelledby="goal-title">
      <p class="service">Roamstead trips</p>
      <h1 id="goal-title">Lisbon booking goal</h1>
      <p class="trip-date">Stay planned for October 12–18, 2025</p>

      <div class="dial" role="img" aria-label="Lisbon booking fund is 68 percent funded">
        <div class="dial-inner">
          <span class="percentage">68%</span>
          <span class="dial-label">Funded</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Saved</span>
          <span class="stat-value">$1,360</span>
        </div>
        <div class="stat">
          <span class="stat-label">Goal</span>
          <span class="stat-value">$2,000</span>
        </div>
      </div>

      <p class="remaining"><strong>$640 remaining</strong> to reserve the stay.</p>
    </section>
  </div>
</body>
</html>
