<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightform — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    background: #b8bbbf;
    font-family: 'Nunito Sans', system-ui, sans-serif;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 24px;
    background: #c8cacd;
  }
  .banner {
    background: #262c33;
    color: #f2f4f6;
    padding: 18px 20px 20px;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(242,244,246,0.16);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .brand svg {
    display: block;
    flex: none;
  }
  .brand span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #f2f4f6;
  }
  .device {
    font-size: 12px;
    font-weight: 400;
    color: #98a1ab;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .body {
    display: flex;
    gap: 16px;
    padding: 16px 0 18px;
  }
  .body img {
    display: block;
    width: 72px;
    height: 72px;
    object-fit: cover;
    background: #3a424b;
    flex: none;
  }
  .meta {
    min-width: 0;
    padding-top: 2px;
  }
  .title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.28;
    margin: 0 0 6px;
    color: #ffffff;
  }
  .show {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.35;
    margin: 0 0 6px;
    color: #b6bec7;
  }
  .ep {
    font-size: 12px;
    font-weight: 400;
    color: #8b939d;
    margin: 0;
  }
  .track {
    height: 4px;
    width: 100%;
    background: rgba(242,244,246,0.20);
  }
  .fill {
    height: 4px;
    width: 41%;
    background: #dbe1e7;
  }
  .times {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    gap: 12px;
    margin-top: 12px;
  }
  .time-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .time-block:last-child {
    text-align: right;
  }
  .time-block .label,
  .total .label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #747e88;
  }
  .time-block .value {
    font-size: 13px;
    font-weight: 700;
    color: #dbe1e7;
  }
  .time-block:last-child .value {
    color: #a3acb6;
  }
  .total {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 0 12px;
    border-left: 1px solid rgba(242,244,246,0.12);
    border-right: 1px solid rgba(242,244,246,0.12);
  }
  .total .value {
    font-size: 13px;
    font-weight: 600;
    color: #98a1ab;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <div class="brand">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <rect x="1" y="5" width="2" height="4" fill="#dbe1e7"></rect>
            <rect x="4.5" y="2" width="2" height="10" fill="#dbe1e7"></rect>
            <rect x="8" y="4" width="2" height="6" fill="#dbe1e7"></rect>
            <rect x="11.5" y="6" width="2" height="2" fill="#dbe1e7"></rect>
          </svg>
          <span>Nightform</span>
        </div>
        <div class="device">Kitchen Speaker</div>
      </div>

      <div class="body">
        <img src="https://loremflickr.com/72/72/studio?lock=4283" width="72" height="72" alt="Recording studio console, cover art for the episode now playing">
        <div class="meta">
          <p class="title">The Room Where Tape Still Wins</p>
          <p class="show">Long Signal, with Marisol Deene</p>
          <p class="ep">Episode 112 · March 4, 2024</p>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="times">
        <div class="time-block">
          <span class="label">Elapsed</span>
          <span class="value">24:18</span>
        </div>
        <div class="total">
          <span class="label">Total</span>
          <span class="value">59:10</span>
        </div>
        <div class="time-block">
          <span class="label">Remaining</span>
          <span class="value">34:52</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
