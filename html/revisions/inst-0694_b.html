<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Follow Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e7e4;
      color: #202528;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 24px;
      background: #f8f7f5;
    }

    .follow-card {
      background: #ffffff;
      border: 1px solid #e4e7e5;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(31, 40, 35, 0.05);
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: #2f6849;
      border-radius: 15px 15px 0 0;
      color: #ffffff;
    }

    .status-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .checkmark {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      color: #2f6849;
      font-size: 14px;
      font-weight: 700;
    }

    .follow-date {
      margin: 0;
      color: #dcebe2;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      text-align: right;
    }

    .card-body {
      padding: 22px;
    }

    .shop-identity {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 22px;
      border-bottom: 1px solid #eceeec;
    }

    .monogram {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dce1e3;
      color: #46535a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .shop-copy {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #697277;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202528;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .category {
      margin: 4px 0 0;
      color: #697277;
      font-size: 14px;
      line-height: 1.4;
    }

    .preference {
      padding-top: 20px;
    }

    .preference-label {
      margin: 0 0 6px;
      color: #252b2e;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }

    .preference-copy {
      margin: 0 0 16px;
      color: #626c71;
      font-size: 13px;
      line-height: 1.5;
    }

    .following-button {
      width: 100%;
      padding: 13px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      border: 1px solid #aac8b6;
      border-radius: 10px;
      background: #eef6f1;
      color: #245a3d;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      cursor: default;
    }

    .button-check {
      font-size: 16px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="follow-card" aria-labelledby="shop-name">
      <header class="status-header">
        <p class="status-label"><span class="checkmark" aria-hidden="true">✓</span>Following</p>
        <p class="follow-date">Since Mar 18, 2025</p>
      </header>

      <div class="card-body">
        <div class="shop-identity">
          <div class="monogram" aria-hidden="true">HM</div>
          <div class="shop-copy">
            <p class="eyebrow">Shop on NookCart</p>
            <h1 id="shop-name">Harbor &amp; Main</h1>
            <p class="category">Home goods and storage</p>
          </div>
        </div>

        <div class="preference">
          <p class="preference-label">Shop updates are on</p>
          <p class="preference-copy">New products and restocks from this shop will appear in your feed.</p>
          <button class="following-button" type="button" aria-pressed="true" aria-label="Following Harbor and Main">
            <span class="button-check" aria-hidden="true">✓</span>
            Following this shop
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
