<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7eb;
      color: #211d28;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #fcfbfd;
    }

    .component {
      width: 100%;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f3cc3;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 14px;
      color: #68616f;
      font-size: 13.5px;
      line-height: 1.5;
      font-weight: 400;
    }

    /* ---- trip summary card ---- */
    .trip-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e2ddec;
      border-radius: 12px;
      background: #f7f4fc;
    }

    .trip-card img {
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      background: #d8d4dc;
    }

    .trip-copy {
      min-width: 0;
    }

    .trip-name {
      margin: 0;
      overflow: hidden;
      color: #211d28;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trip-location {
      margin: 1px 0 0;
      color: #77707e;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 400;
    }

    .trip-chip {
      display: inline-block;
      margin-top: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #ece4fb;
      color: #5d31ad;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
    }

    /* ---- destination cards ---- */
    fieldset {
      min-width: 0;
      margin: 18px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      color: #211d28;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .folder-option {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px;
      border: 1px solid #e5e2e7;
      border-radius: 12px;
      background: #ffffff;
      cursor: default;
    }

    .folder-badge {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: #efecf4;
      color: #635b6d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .folder-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .folder-name {
      display: block;
      overflow: hidden;
      color: #29232f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-meta {
      display: block;
      color: #7a7380;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
    }

    .folder-option input {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid #cec8d7;
      border-radius: 50%;
      background: #ffffff;
    }

    .folder-option input:checked {
      border: 6px solid #7040c7;
    }

    .folder-option.is-selected {
      border-color: #7040c7;
      background: #f5f0ff;
      box-shadow: inset 0 0 0 1px #7040c7;
    }

    .folder-option.is-selected .folder-name {
      color: #5a2ea9;
    }

    .folder-option.is-selected .folder-badge {
      background: #e2d6fa;
      color: #55299f;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      cursor: default;
    }

    .cancel {
      padding: 11px 14px;
      background: transparent;
      color: #625b69;
    }

    .move {
      padding: 11px 16px;
      background: #7040c7;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="move-title">
      <p class="eyebrow">Change collection</p>
      <h1 id="move-title">Move trip</h1>
      <p class="intro">Pick a new collection. Saved places keep their current order.</p>

      <div class="trip-card">
        <img src="https://loremflickr.com/60/60/cityscape?lock=7130" width="60" height="60" alt="Lisbon rooftops beside the waterfront">
        <div class="trip-copy">
          <p class="trip-name">Lisbon Weekend</p>
          <p class="trip-location">Lisbon, Portugal · 3 nights</p>
          <span class="trip-chip">Now in Weekend Ideas</span>
        </div>
      </div>

      <fieldset>
        <legend>Move to</legend>

        <div class="folder-list">
          <label class="folder-option is-selected">
            <span class="folder-badge">CP</span>
            <span class="folder-copy">
              <span class="folder-name">Coastal Plans</span>
              <span class="folder-meta">8 saved places · Shared</span>
            </span>
            <input type="radio" name="destination" checked>
          </label>

          <label class="folder-option">
            <span class="folder-badge">CS</span>
            <span class="folder-copy">
              <span class="folder-name">City Stops</span>
              <span class="folder-meta">12 saved places · Private</span>
            </span>
            <input type="radio" name="destination">
          </label>

          <label class="folder-option">
            <span class="folder-badge">MW</span>
            <span class="folder-copy">
              <span class="folder-name">Mountain Weekends</span>
              <span class="folder-meta">5 saved places · Private</span>
            </span>
            <input type="radio" name="destination">
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <button class="cancel" type="button">Cancel</button>
        <button class="move" type="button">Move to Coastal Plans</button>
      </div>
    </main>
  </div>
</body>
</html>
