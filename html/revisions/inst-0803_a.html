<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Item</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e1e4;
      color: #262126;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px 24px;
      background: linear-gradient(180deg, #f7f5f7 0%, #eeebee 100%);
    }

    .save-panel {
      width: 100%;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #e1dce1;
      border-radius: 12px;
      box-shadow:
        0 18px 36px rgba(52, 35, 48, 0.13),
        0 4px 10px rgba(52, 35, 48, 0.08);
    }

    .save-panel h1 {
      margin: 0;
      color: #c21878;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .intro {
      margin: 4px 0 0;
      color: #665f66;
      font-size: 14px;
      line-height: 1.45;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      padding: 10px;
      background: #faf8fa;
      border: 1px solid #ebe6eb;
      border-radius: 8px;
    }

    .product img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      background: #dedade;
      border: 1px solid #d8d3d8;
      border-radius: 6px;
      box-shadow: 0 3px 8px rgba(48, 34, 45, 0.12);
    }

    .product-copy {
      min-width: 0;
    }

    .product-name {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
    }

    .product-variant {
      margin: 3px 0 0;
      color: #665f66;
      font-size: 13px;
      line-height: 1.3;
    }

    .product-price {
      margin: 4px 0 0;
      color: #262126;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    fieldset {
      margin: 16px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0 0 8px;
      padding: 0;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .list-options {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #d8d3d8;
      border-radius: 8px;
      box-shadow: 0 3px 9px rgba(48, 34, 45, 0.06);
    }

    .list-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      cursor: default;
    }

    .list-option + .list-option {
      border-top: 1px solid #e3dee3;
    }

    .list-option.selected {
      background: #fff2f8;
      box-shadow: inset 3px 0 0 #c21878;
    }

    .list-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: grid;
      place-items: center;
      border: 1px solid #aaa2aa;
      border-radius: 50%;
      background: #ffffff;
    }

    .selected .radio {
      border-color: #c21878;
    }

    .selected .radio::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c21878;
    }

    .list-copy {
      min-width: 0;
    }

    .list-name {
      display: block;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
    }

    .list-count {
      display: block;
      margin-top: 1px;
      color: #756e75;
      font-size: 12px;
      line-height: 1.25;
    }

    .save-button {
      width: 100%;
      margin-top: 16px;
      padding: 11px 16px;
      border: 1px solid #a90f66;
      border-radius: 8px;
      background: #c21878;
      box-shadow: 0 5px 10px rgba(194, 24, 120, 0.22);
      color: #ffffff;
      font: 700 15px/1.35 'Nunito Sans', system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <form class="save-panel">
      <h1>Save item</h1>
      <p class="intro">Choose where you want to keep this item.</p>

      <div class="product">
        <img src="https://loremflickr.com/72/72/fashion?lock=10690" width="72" height="72" alt="Sand-colored linen utility overshirt">
        <div class="product-copy">
          <p class="product-name">Linen utility overshirt</p>
          <p class="product-variant">Sandstone · Size M</p>
          <p class="product-price">$68.00</p>
        </div>
      </div>

      <fieldset>
        <legend>Save to</legend>
        <div class="list-options">
          <label class="list-option">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="list-copy">
              <span class="list-name">For later</span>
              <span class="list-count">12 saved items</span>
            </span>
          </label>

          <label class="list-option selected">
            <input type="radio" name="save-location" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="list-copy">
              <span class="list-name">Summer outfits</span>
              <span class="list-count">7 saved items</span>
            </span>
          </label>

          <label class="list-option">
            <input type="radio" name="save-location">
            <span class="radio" aria-hidden="true"></span>
            <span class="list-copy">
              <span class="list-name">Gift ideas</span>
              <span class="list-count">4 saved items</span>
            </span>
          </label>
        </div>
      </fieldset>

      <button class="save-button" type="button">Save to Summer outfits</button>
    </form>
  </div>
</body>
</html>
