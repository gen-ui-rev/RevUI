<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Room Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e7ec;
      color: #25212a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      padding: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f6f8;
      border: 1px solid #dcd7e1;
    }

    .timer-card {
      width: 100%;
      padding: 34px 40px 30px;
      border: 1px solid #dcd7e1;
      border-radius: 20px;
      background: #ffffff;
    }

    /* ---------- card header ---------- */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e1e8;
    }

    .context {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .monogram {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #ede7f6;
      color: #6d3ba5;
      font-size: 16px;
      font-weight: 600;
    }

    .context-copy {
      min-width: 0;
    }

    .service {
      margin: 0 0 3px;
      color: #6d3ba5;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      color: #25212a;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .head-meta {
      flex: 0 0 auto;
      text-align: right;
    }

    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ede7f6;
      color: #5b2f8d;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .head-note {
      margin: 8px 0 0;
      color: #6b6570;
      font-size: 13px;
    }

    /* ---------- status strip ---------- */
    .status-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 24px 0 0;
    }

    .tile {
      padding: 14px 16px;
      border: 1px solid #e5e1e8;
      border-radius: 14px;
      background: #faf9fb;
    }

    .tile dt {
      color: #6b6570;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .tile dd {
      margin: 6px 0 0;
      color: #25212a;
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- timer band ---------- */
    .timer {
      padding: 34px 0 8px;
      text-align: center;
    }

    .timer-label {
      margin: 0 0 8px;
      color: #6b6570;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .time {
      margin: 0;
      color: #6d3ba5;
      font-size: 112px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
    }

    .duration {
      margin: 14px 0 0;
      color: #6b6570;
      font-size: 15px;
    }

    .progress {
      width: 100%;
      height: 10px;
      margin-top: 24px;
      border-radius: 14px;
      background: #ece9ef;
    }

    .progress-value {
      width: 59%;
      height: 100%;
      border-radius: 14px;
      background: #7540ac;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      margin: 10px 0 0;
      color: #8a8391;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- action bar ---------- */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #e5e1e8;
    }

    .adjust {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .adjust-label {
      color: #6b6570;
      font-size: 13.5px;
    }

    .segment {
      display: flex;
      border: 1px solid #cfc8d5;
      border-radius: 12px;
      overflow: hidden;
    }

    .segment button {
      border: 0;
      border-radius: 0;
      background: #ffffff;
      color: #39333e;
      padding: 0 18px;
    }

    .segment button + button {
      border-left: 1px solid #e0dae6;
    }

    .action-group {
      display: flex;
      gap: 12px;
      flex: 0 0 auto;
    }

    button {
      min-height: 46px;
      border-radius: 12px;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .secondary {
      border: 1px solid #cfc8d5;
      background: #ffffff;
      color: #39333e;
      padding: 0 22px;
    }

    .primary {
      border: 1px solid #6d3ba5;
      background: #6d3ba5;
      color: #ffffff;
      padding: 0 34px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="timer-card" aria-labelledby="timer-title">
      <div class="card-head">
        <div class="context">
          <div class="monogram" aria-hidden="true">MC</div>
          <div class="context-copy">
            <p class="service">Threadwell group timer</p>
            <h1 id="timer-title">Morning Creators Circle</h1>
          </div>
        </div>
        <div class="head-meta">
          <span class="pill">Running</span>
          <p class="head-note">Room 4 · 6 people joined · Host Dana Reyes</p>
        </div>
      </div>

      <dl class="status-strip">
        <div class="tile"><dt>Elapsed</dt><dd>26:36</dd></div>
        <div class="tile"><dt>Remaining</dt><dd>18:24</dd></div>
        <div class="tile"><dt>Ends at</dt><dd>10:45 AM</dd></div>
        <div class="tile"><dt>Extensions</dt><dd>1 of 3</dd></div>
      </dl>

      <div class="timer">
        <p class="timer-label">Time remaining</p>
        <p class="time" aria-label="18 minutes and 24 seconds remaining">18:24</p>
        <p class="duration">26 minutes elapsed of 45 · Sprint 2 in progress</p>
        <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="45" aria-valuenow="26">
          <div class="progress-value"></div>
        </div>
        <p class="scale"><span>0:00</span><span>45:00</span></p>
      </div>

      <div class="action-bar">
        <div class="adjust">
          <span class="adjust-label">Adjust session length</span>
          <div class="segment">
            <button type="button">Remove 5 min</button>
            <button type="button">Add 5 min</button>
          </div>
        </div>
        <div class="action-group">
          <button class="secondary" type="button">End timer</button>
          <button class="primary" type="button">Pause</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
