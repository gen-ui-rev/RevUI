<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketwell delivery widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E0417C;
    --pink-deep:#C21659;
    --ink:#191A1D;
    --mute:#83848C;
    --rule:#E6E6EA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#E9E9EC;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .widget{
    width:330px;
    background:#FFFFFF;
    border-radius:10px;
    padding:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .brand svg{display:block;}
  .headline{
    margin:14px 0 0;
    font-size:21px;
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.2;
  }
  .subline{
    margin:4px 0 0;
    font-size:14px;
    font-weight:500;
    color:var(--mute);
  }
  .item{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:18px;
  }
  .item img{
    display:block;
    object-fit:cover;
    background:#DCDCE1;
    border-radius:10px;
    flex:0 0 auto;
  }
  .item-text{min-width:0;}
  .item-name{
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    margin-top:3px;
    font-size:12px;
    font-weight:500;
    color:var(--mute);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track{margin-top:22px;}
  .bar{
    position:relative;
    height:12px;
    border-radius:99px;
    background:#F5EFF2;
    box-shadow:inset 0 0 0 1px #EBDFE5;
  }
  .fill{
    position:relative;
    width:75%;
    height:12px;
    border-radius:99px;
    background:linear-gradient(90deg,#FF7EAC 0%, var(--pink) 45%, var(--pink-deep) 100%);
    box-shadow:0 4px 12px rgba(224,65,124,.45);
  }
  .fill::after{
    content:"";
    position:absolute;
    right:-3px;
    top:50%;
    transform:translateY(-50%);
    width:20px;
    height:20px;
    border-radius:50%;
    background:#FFFFFF;
    border:5px solid var(--pink-deep);
    box-shadow:0 2px 7px rgba(25,26,29,.22);
  }
  .track-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .stage{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:99px;
    background:#FCE9F0;
    font-size:13px;
    font-weight:700;
    color:var(--pink-deep);
    white-space:nowrap;
  }
  .stage svg{display:block;}
  .step{
    font-size:12px;
    font-weight:600;
    color:var(--mute);
    white-space:nowrap;
  }
  .divider{
    height:1px;
    background:var(--rule);
    margin:18px 0;
  }
  .next{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .next img{
    display:block;
    object-fit:cover;
    background:#DCDCE1;
    border-radius:10px;
    flex:0 0 auto;
  }
  .next-text{min-width:0;flex:1;}
  .next-label{
    font-size:12px;
    font-weight:500;
    color:var(--mute);
  }
  .next-name{
    margin-top:2px;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .next-date{
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <div class="brand">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <circle cx="6" cy="6" r="6" fill="#E0417C"></circle>
        </svg>
        Marketwell
      </div>

      <h1 class="headline">Arriving today</h1>
      <p class="subline">Estimated between 4:15 and 6:30 PM</p>

      <div class="item">
        <img src="https://loremflickr.com/64/64/fashion?lock=1660" width="64" height="64" alt="Folded sand-colored linen shirt in the arriving order">
        <div class="item-text">
          <div class="item-name">Linen Weekend Shirt, Sand</div>
          <div class="item-meta">Order 48-2207 · 2 items · Carla Denney</div>
        </div>
      </div>

      <div class="track">
        <div class="bar"><div class="fill"></div></div>
        <div class="track-row">
          <span class="stage">
            <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true">
              <circle cx="4" cy="4" r="4" fill="#C21659"></circle>
            </svg>
            Out for delivery
          </span>
          <span class="step">Step 3 of 4 · 75%</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="next">
        <img src="https://loremflickr.com/40/40/sneakers?lock=1663" width="40" height="40" alt="Gray trail running sneakers shipping next">
        <div class="next-text">
          <div class="next-label">Next shipment</div>
          <div class="next-name">Trail Runner 4 Sneakers</div>
        </div>
        <span class="next-date">Fri, Jun 6</span>
      </div>
    </div>
  </div>
</body>
</html>
