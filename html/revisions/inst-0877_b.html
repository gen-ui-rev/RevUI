<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Daily — Workplace Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E4610F;
    --accent-soft:#ffb27f;
    --surface:#241d19;
    --panel:#342923;
    --track:#58443a;
    --white:#fffaf6;
    --muted:#cbbdb4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e7e6e3;
    font-family:'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    padding:12px 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface);
    border:2px solid #4b403a;
    border-radius:38px;
    box-shadow:0 9px 24px rgba(25,18,14,.24);
  }
  .widget{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  .kicker{
    margin:0;
    color:var(--accent-soft);
    font-size:10px;
    line-height:13px;
    font-weight:700;
    letter-spacing:.1em;
    text-align:center;
    text-transform:uppercase;
  }
  .title{
    margin:2px 0 0;
    color:var(--white);
    font-size:12px;
    line-height:16px;
    font-weight:600;
    text-align:center;
  }
  .value{
    margin:5px 0 0;
    color:var(--white);
    font-size:37px;
    line-height:40px;
    font-weight:700;
    letter-spacing:-.03em;
    text-align:center;
  }
  .value small{
    color:var(--muted);
    font-size:10px;
    line-height:14px;
    font-weight:600;
    letter-spacing:0;
  }
  .bar{
    width:100%;
    height:7px;
    margin-top:4px;
    overflow:hidden;
    border-radius:999px;
    background:var(--track);
  }
  .bar span{
    display:block;
    width:68%;
    height:7px;
    border-radius:999px;
    background:var(--accent);
  }
  .rank{
    margin:7px 0 0;
    padding:5px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    border-radius:10px;
    background:var(--panel);
    color:var(--muted);
    font-size:10px;
    line-height:15px;
  }
  .rank b{
    color:var(--white);
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }
  .foot{
    margin:5px 0 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:9px;
    line-height:13px;
  }
  .foot svg{
    display:block;
    flex:none;
  }
  .standings{
    width:100%;
    margin-top:7px;
    padding:8px 9px;
    display:block;
    border:1px solid var(--accent);
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    line-height:15px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
  }
  .shot{display:none;}
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <p class="kicker">Stride Daily</p>
      <p class="title">Workplace Step Challenge</p>
      <p class="value">68% <small>of goal</small></p>
      <div class="bar" aria-label="Team goal 68 percent complete"><span></span></div>
      <p class="rank"><span>Your team rank</span><b>3rd / 12</b></p>
      <p class="foot">
        <svg width="11" height="11" viewBox="0 0 13 13" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5.5" fill="none" stroke="#FFB27F" stroke-width="1.4"/>
          <path d="M6.5 3.6V6.7l2.2 1.3" fill="none" stroke="#FFB27F" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Updated 4:12 PM
      </p>
      <a class="standings" href="/standings">Open full standings</a>
      <img class="shot" src="https://loremflickr.com/132/165/running?lock=11603" width="132" height="165" alt="Runner on a park path during an evening workout">
    </div>
  </div>
</body>
</html>
