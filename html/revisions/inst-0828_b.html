<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halcyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#E7E5DF;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
  }
  .screen{
    width:390px;
    height:844px;
    background:#FCFBF7;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:48px 32px;
    box-sizing:border-box;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .mark{
    width:64px;
    height:64px;
    flex:0 0 auto;
    border-radius:14px;
    background:#F2C230;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wordmark{
    margin:0;
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.8px;
    color:#1A1915;
  }
  .tagline{
    margin:38px 0 0;
    font-size:22px;
    font-weight:700;
    color:#1A1915;
    line-height:1.35;
    letter-spacing:-0.35px;
  }
  .role{
    display:inline-flex;
    align-items:center;
    margin-top:16px;
    padding:9px 13px;
    border-radius:9px;
    background:rgba(242,194,48,0.18);
    color:#6E5820;
    font-size:13px;
    font-weight:700;
  }
  .context{
    margin:22px 0 0;
    font-size:14px;
    font-weight:500;
    color:#6E695B;
    line-height:1.55;
  }
  .foot{
    margin:0 18px 18px;
    padding:24px 20px 22px;
    border:1px solid #E5E0D2;
    border-radius:14px;
    background:#F5F2E9;
  }
  .status-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
  }
  .status-copy{
    min-width:0;
  }
  .status-kicker{
    margin:0;
    font-size:11px;
    font-weight:700;
    color:#9C978A;
    letter-spacing:0.8px;
    text-transform:uppercase;
  }
  .status-label{
    margin:7px 0 0;
    font-size:15px;
    font-weight:700;
    color:#1A1915;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status-value{
    flex:0 0 auto;
    padding:6px 9px;
    border-radius:8px;
    background:#F2C230;
    color:#1A1915;
    font-size:12px;
    font-weight:700;
  }
  .segments{
    display:flex;
    gap:5px;
    margin-top:18px;
  }
  .segment{
    flex:1;
    height:7px;
    border-radius:7px;
    background:#DDD7C6;
  }
  .segment.ready{
    background:#F2C230;
  }
  .detail{
    margin:12px 0 0;
    font-size:12px;
    font-weight:500;
    color:#6E695B;
  }
  .version{
    margin:22px 0 0;
    text-align:center;
    font-size:11px;
    font-weight:500;
    color:#9C978A;
    letter-spacing:0.2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="hero">
      <div class="brand-row">
        <div class="mark">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M28.4 24.6a10.2 10.2 0 0 1-12.9-13 12.4 12.4 0 1 0 12.9 13Z" fill="#1A1915"/>
            <circle cx="29.2" cy="11.4" r="2.2" fill="#1A1915"/>
          </svg>
        </div>
        <h1 class="wordmark">Halcyon</h1>
      </div>

      <p class="tagline">Cedar Grove<br>Sleep Center</p>
      <div class="role">Clinical Sleep Technologist</div>
      <p class="context">Night shift workspace for Room 4 monitoring and equipment checks.</p>
    </div>

    <div class="foot">
      <div class="status-top">
        <div class="status-copy">
          <p class="status-kicker">Room 4 equipment</p>
          <p class="status-label">Bedside system readiness</p>
        </div>
        <span class="status-value">6 / 8 ready</span>
      </div>

      <div class="segments" role="meter" aria-label="Room 4 equipment readiness" aria-valuemin="0" aria-valuemax="8" aria-valuenow="6">
        <span class="segment ready"></span>
        <span class="segment ready"></span>
        <span class="segment ready"></span>
        <span class="segment ready"></span>
        <span class="segment ready"></span>
        <span class="segment ready"></span>
        <span class="segment"></span>
        <span class="segment"></span>
      </div>
      <p class="detail">Six devices online; two require a connection check.</p>
      <p class="version">Version 4.2.1 &nbsp;·&nbsp; Halcyon Health, Inc.</p>
    </div>
  </div>
</body>
</html>
