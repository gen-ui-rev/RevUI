<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster — Focus block activity</title>
<style>
  :root {
    --rose: #f4436f;
    --ink: #171719;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dededc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 12px;
    border: 5px solid #171719;
    border-radius: 44px;
    background: #f5f3f1;
    color: var(--ink);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
  }
  .source-image {
    display: none;
  }
  .timer {
    padding: 10px 12px 11px;
    border-radius: 28px 28px 17px 17px;
    background: var(--rose);
    color: #fff;
    text-align: center;
  }
  .remaining-label {
    font-size: 10px;
    line-height: 13px;
    font-weight: 750;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .clock {
    margin-top: 1px;
    font-size: 43px;
    line-height: 47px;
    font-weight: 750;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
  }
  .left {
    font-size: 11px;
    line-height: 14px;
    color: rgba(255, 255, 255, 0.8);
  }
  .progress {
    height: 4px;
    margin: 9px 5px 0;
    border-radius: 4px;
    background: rgba(23, 23, 25, 0.12);
  }
  .progress span {
    display: block;
    width: 68%;
    height: 100%;
    border-radius: inherit;
    background: var(--rose);
  }
  .event {
    margin-top: 9px;
    padding: 9px 9px 8px;
    border: 1px solid rgba(23, 23, 25, 0.1);
    border-radius: 15px;
    background: #fff;
  }
  .eyebrow {
    color: var(--rose);
    font-size: 9px;
    line-height: 12px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .title {
    margin-top: 2px;
    font-size: 14px;
    line-height: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .schedule,
  .shared {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    font-size: 10px;
    line-height: 14px;
  }
  .schedule {
    margin-top: 5px;
    color: #59595d;
  }
  .schedule strong {
    color: var(--ink);
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .shared {
    margin-top: 2px;
    color: #77777b;
  }
  .shared span:last-child {
    min-width: 0;
    color: #3b3b3e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="source-image" src="https://loremflickr.com/48/48/meeting?lock=1203" width="48" height="48" alt="">
    <main>
      <section class="timer">
        <div class="remaining-label">Time remaining</div>
        <div class="clock">12:48</div>
        <div class="left">in this focus block</div>
      </section>

      <div class="progress" aria-label="Focus block progress"><span></span></div>

      <section class="event">
        <div class="eyebrow">Aster · Focus block</div>
        <div class="title">Design review — Room 2</div>
        <div class="schedule">
          <span>Ends</span>
          <strong>2:15 PM</strong>
        </div>
        <div class="shared">
          <span>Notes</span>
          <span>Dana Whitlock</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
