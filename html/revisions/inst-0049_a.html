<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonant Music Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #18181b;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e4e4e7;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      color: #27272a;
    }

    .exit-button {
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: #52525b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 16px 20px 14px;
    }

    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 14px;
    }

    .progress-label {
      font-weight: 700;
      color: #27272a;
    }

    .progress-count {
      color: #71717a;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 8px;
      background: #e4e4e7;
      border-radius: 10px;
    }

    .progress-fill {
      width: 40%;
      height: 6px;
      background: #27272a;
      border-radius: 10px;
    }

    .quiz-image {
      width: 350px;
      height: 150px;
      margin-top: 20px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      background: #d4d4d8;
    }

    .question {
      margin-top: 18px;
    }

    .topic {
      margin: 0 0 4px;
      color: #71717a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #18181b;
      font-size: 24px;
      line-height: 1.22;
      font-weight: 700;
      letter-spacing: -0.45px;
    }

    .answers {
      margin: 16px 0 0;
      padding: 0;
      border: 0;
    }

    .answer {
      position: relative;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-top: 1px solid #e4e4e7;
      color: #27272a;
      font-size: 16px;
      cursor: pointer;
    }

    .answer:last-child {
      border-bottom: 1px solid #e4e4e7;
    }

    .answer input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .radio {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: grid;
      place-items: center;
      border: 1.5px solid #a1a1aa;
      border-radius: 50%;
    }

    .radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
    }

    .answer input:checked + .radio {
      border-color: #27272a;
    }

    .answer input:checked + .radio::after {
      background: #27272a;
    }

    .answer input:focus-visible + .radio {
      outline: 2px solid #71717a;
      outline-offset: 3px;
    }

    .answer-text {
      font-weight: 400;
    }

    .answer input:checked ~ .answer-text {
      font-weight: 700;
    }

    .helper {
      margin: 12px 0 0;
      color: #71717a;
      font-size: 14px;
      line-height: 1.35;
    }

    .check-button {
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      padding: 0 18px;
      border: 1px solid #18181b;
      border-radius: 10px;
      background: #27272a;
      box-shadow: 0 4px 0 #09090b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1px;
      cursor: pointer;
    }

    .check-button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #09090b;
    }

    .check-button:focus-visible {
      outline: 3px solid #a1a1aa;
      outline-offset: 3px;
    }

    .button-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #ffffff;
      color: #18181b;
    }

    .button-icon svg {
      width: 16px;
      height: 16px;
    }

    .tabbar {
      height: 72px;
      flex: 0 0 72px;
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      padding: 8px 12px 7px;
      border-top: 1px solid #e4e4e7;
      background: #ffffff;
    }

    .tab {
      width: 76px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #a1a1aa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      color: #27272a;
    }

    .tab svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 14V10M8 18V6M12 15V9M16 20V4M20 14V10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <span>Resonant Quiz</span>
      </div>
      <button class="exit-button" type="button">Exit quiz</button>
    </header>

    <main>
      <div class="progress-row">
        <span class="progress-label">Vinyl essentials</span>
        <span class="progress-count">Question 4 of 10</span>
      </div>

      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="4">
        <div class="progress-fill"></div>
      </div>

      <img
        class="quiz-image"
        src="https://loremflickr.com/350/150/vinyl?lock=1650"
        width="350"
        height="150"
        alt="A vinyl record prepared for playback"
      >

      <section class="question" aria-labelledby="question-title">
        <p class="topic">Playback speed</p>
        <h1 id="question-title">At what speed is a standard 12-inch album usually played?</h1>
      </section>

      <form>
        <fieldset class="answers" aria-label="Answer choices">
          <label class="answer">
            <input type="radio" name="speed" value="16">
            <span class="radio" aria-hidden="true"></span>
            <span class="answer-text">16⅔ RPM</span>
          </label>

          <label class="answer">
            <input type="radio" name="speed" value="33" checked>
            <span class="radio" aria-hidden="true"></span>
            <span class="answer-text">33⅓ RPM</span>
          </label>

          <label class="answer">
            <input type="radio" name="speed" value="45">
            <span class="radio" aria-hidden="true"></span>
            <span class="answer-text">45 RPM</span>
          </label>

          <label class="answer">
            <input type="radio" name="speed" value="78">
            <span class="radio" aria-hidden="true"></span>
            <span class="answer-text">78 RPM</span>
          </label>
        </fieldset>

        <p class="helper">Choose one answer before checking your result.</p>
        <button class="check-button" type="button">
          <span>Check answer</span>
          <span class="button-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m7 12 3.2 3.2L17.5 8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </form>
    </main>

    <nav class="tabbar" aria-label="Primary navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 10.5 12 3.8l8.5 6.7V20H15v-6H9v6H3.5v-9.5Z" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke-width="1.8"/>
          <path d="m16 16 4 4" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Browse</span>
      </button>

      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.5 8.2a3.6 3.6 0 0 1 7 1.2c0 2.6-3.5 2.8-3.5 5.1" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 18.7h.01" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="9" stroke-width="1.8"/>
        </svg>
        <span>Quiz</span>
      </button>

      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 4.5h12a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2V4.5Z" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7 16.5h12M9 8h6M9 11.5h5" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Library</span>
      </button>
    </nav>
  </div>
</body>
</html>
