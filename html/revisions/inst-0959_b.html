<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow status</title>
<style>
  :root{
    --accent:#6b3fd4;
    --accent-soft:#f1ecfd;
    --line:#e5e3ec;
    --ink:#181722;
    --muted:#6d6a7c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e8e7eb;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:560px;
    padding:30px 20px;
    background:#f0eff2;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
  }
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    padding-bottom:15px;
    border-bottom:1px solid var(--line);
  }
  .stat{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    color:var(--muted);
    font-size:12px;
  }
  .stat + .stat{
    border-left:1px solid var(--line);
  }
  .stat strong{
    color:var(--ink);
    font-size:17px;
    font-weight:650;
  }
  .who{
    display:flex;
    align-items:center;
    gap:13px;
    margin-top:18px;
  }
  .avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--accent-soft);
    border:1px solid #e0d7fa;
    color:var(--accent);
    font-size:18px;
    font-weight:650;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .name{
    font-size:19px;
    font-weight:650;
    line-height:1.2;
  }
  .handle{
    margin-top:3px;
    color:var(--muted);
    font-size:13px;
  }
  .bio{
    margin:14px 0 0;
    color:#3f3d4c;
    font-size:14px;
    line-height:1.5;
  }
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
  .action{
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:12px 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .message{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
  }
  .following{
    border:1px solid #d9d1ed;
    background:var(--accent-soft);
    color:#5430ad;
  }
  .since{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }
  .preference{
    margin-top:18px;
    padding:14px;
    border:1px solid #e1dde9;
    border-radius:12px;
    background:#f8f7fa;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:13px;
  }
  .preference-copy{
    min-width:0;
  }
  .preference .label{
    font-size:14px;
    font-weight:600;
  }
  .preference .sub{
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }
  .switch{
    position:relative;
    flex:none;
    width:44px;
    height:26px;
    border-radius:13px;
    background:#d5d2db;
  }
  .switch span{
    position:absolute;
    top:3px;
    left:3px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
    border:1px solid #cbc7d2;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="stats">
        <div class="stat"><strong>1,248</strong><span>Followers</span></div>
        <div class="stat"><strong>7</strong><span>Shared boards</span></div>
      </div>

      <div class="who">
        <div class="avatar">MT</div>
        <div>
          <div class="name">Marisol Trent</div>
          <div class="handle">@marisol · Northwind Studio</div>
        </div>
      </div>

      <p class="bio">Keeps the release calendar and weekly planning notes in Cadence. Shares a public digest every Friday.</p>

      <div class="actions">
        <button class="action message" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
          </svg>
          Message
        </button>
        <button class="action following" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          Following
        </button>
      </div>
      <div class="since">Following since March 4, 2025</div>

      <div class="preference">
        <div class="preference-copy">
          <div class="label">Fewer interruptions</div>
          <div class="sub">Only alert me when Marisol posts to a board we both use.</div>
        </div>
        <div class="switch" aria-label="Notifications off"><span></span></div>
      </div>
    </div>
  </div>
</body>
</html>
