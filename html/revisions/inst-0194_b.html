<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d7dde2;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #17232d;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      background: #eef2f4;
    }

    .accent-line {
      width: 100%;
      height: 6px;
      background: #59b9e7;
    }

    .identity {
      margin: 118px auto 0;
      text-align: center;
    }

    .brand-mark {
      width: 80px;
      height: 80px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      background: #59b9e7;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(36, 128, 170, 0.2);
    }

    .brand-mark svg {
      display: block;
      width: 44px;
      height: 44px;
    }

    .brand-name {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.9px;
    }

    .brand-category {
      margin: 9px 0 0;
      color: #687680;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    .entry-panel {
      margin: 126px 20px 0;
      padding: 28px 26px 26px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(30, 48, 61, 0.09);
    }

    .entry-panel h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -0.35px;
    }

    .entry-panel p {
      margin: 9px 0 0;
      color: #687680;
      font-size: 14px;
      line-height: 1.55;
    }

    .continue-action {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 17px;
      border-radius: 8px;
      background: #59b9e7;
      color: #102630;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-decoration: none;
    }

    .continue-action:focus-visible {
      outline: 3px solid rgba(23, 35, 45, 0.28);
      outline-offset: 3px;
    }

    .arrow {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      font-size: 17px;
      line-height: 1;
    }

    .session-note {
      margin: 13px 0 0;
      color: #7a8790;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen" aria-label="Nestward app launch screen">
    <div class="accent-line" aria-hidden="true"></div>

    <header class="identity">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 30V22.5C8 21.6716 8.67157 21 9.5 21H14.5C15.3284 21 16 21.6716 16 22.5V30" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <path d="M17 30V16.5C17 15.6716 17.6716 15 18.5 15H23.5C24.3284 15 25 15.6716 25 16.5V30" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <path d="M26 30V10.5C26 9.67157 26.6716 9 27.5 9H32.5C33.3284 9 34 9.67157 34 10.5V30" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <path d="M7 34H35" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="brand-name">Nestward</h1>
      <p class="brand-category">Personal finance</p>
    </header>

    <main class="entry-panel">
      <h2>Your financial home</h2>
      <p>See your accounts, monthly plan, and progress at a glance.</p>
      <a class="continue-action" href="#overview">
        <span>Continue to overview</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <p class="session-note">You can connect accounts after entering the app.</p>
    </main>
  </div>
</body>
</html>
