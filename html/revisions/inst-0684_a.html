<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your sign-in — Northline Stays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e9e9e7;
    font-family:'Manrope', system-ui, sans-serif;
    color:#26292c;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    padding:28px 24px;
    background:#f4f4f2;
  }
  .card{
    border:1px solid #dcdcda;
    border-radius:4px;
    background:#ffffff;
  }
  .media{
    position:relative;
    border-radius:4px 4px 0 0;
  }
  .hero{
    width:100%;
    height:96px;
    object-fit:cover;
    display:block;
    background:#d5d5d2;
    border-radius:4px 4px 0 0;
  }
  /* frosted white pill-circle over the photo corner */
  .back{
    position:absolute;
    top:10px;
    left:10px;
    width:32px;
    height:32px;
    box-sizing:border-box;
    border-radius:50%;
    background:rgba(255,255,255,.93);
    border:1px solid rgba(38,41,44,.10);
    box-shadow:0 1px 3px rgba(20,22,24,.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .back .chev{
    width:8px;
    height:8px;
    border-left:2px solid #26292c;
    border-bottom:2px solid #26292c;
    transform:rotate(45deg);
    margin-left:-2px;
  }
  .body{padding:20px;}
  .ctx{
    padding-bottom:18px;
    border-bottom:1px solid #e6e6e4;
  }
  .ctx-name{
    font-size:15px;
    font-weight:700;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ctx-meta{
    margin-top:4px;
    font-size:13px;
    line-height:18px;
    color:#6d7175;
  }
  .verify{padding-top:18px;}
  .eyebrow{
    font-size:12px;
    line-height:16px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#7b7f83;
  }
  h1{
    margin:6px 0 0;
    font-size:20px;
    line-height:26px;
    font-weight:700;
  }
  .sub{
    margin:8px 0 0;
    font-size:14px;
    line-height:20px;
    color:#5f6367;
  }
  .otp{
    display:flex;
    gap:7px;
    margin-top:20px;
  }
  .digit{
    width:44px;
    height:52px;
    box-sizing:border-box;
    border:1px solid #d3d3d0;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    color:#26292c;
    background:#fbfbfa;
  }
  .digit.filled{background:#ffffff;border-color:#b6b7b4;}
  .digit.active{border-color:#3d4247;background:#ffffff;}
  .caret{width:1px;height:22px;background:#3d4247;}
  .btn{
    margin-top:20px;
    height:46px;
    border-radius:4px;
    background:#3d4247;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .foot{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    font-size:13px;
    line-height:18px;
    color:#6d7175;
  }
  .foot .link{
    color:#3d4247;
    font-weight:700;
    text-decoration:underline;
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="media">
        <img class="hero" src="https://loremflickr.com/342/96/hotel?lock=9121" width="342" height="96" alt="Harbor-side hotel building where the held reservation is booked">
        <div class="back" role="button" aria-label="Back to sign-in"><span class="chev"></span></div>
      </div>
      <div class="body">
        <div class="ctx">
          <div class="ctx-name">Harbor View Suites, Lisbon</div>
          <div class="ctx-meta">Mar 14–16 · 2 guests · Hold expires in 9 minutes</div>
        </div>
        <div class="verify">
          <div class="eyebrow">Step 2 of 2</div>
          <h1>Enter your verification code</h1>
          <p class="sub">We texted a 6-digit code to the phone ending in 4182.</p>
          <div class="otp">
            <div class="digit filled">4</div>
            <div class="digit filled">8</div>
            <div class="digit filled">2</div>
            <div class="digit filled">1</div>
            <div class="digit active"><span class="caret"></span></div>
            <div class="digit"></div>
          </div>
          <div class="btn">Verify and continue</div>
          <div class="foot">
            <span>Resend code in 0:26</span>
            <span class="link">Use email instead</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
