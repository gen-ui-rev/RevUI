<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfarer Loft — Shuttle Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#C07310;
    --ink:#1E1A15;
    --muted:#7B7365;
    --line:#E4DFD4;
  }
  html,body{margin:0;}
  body{
    background:#EAE7E1;
    font-family:'Source Sans 3',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 0;
    -webkit-font-smoothing:antialiased;
  }
  *{box-sizing:border-box;}
  .screen{
    width:390px;
    height:560px;
    padding:10px 0;
    background:#F2F0EC;
  }
  .card{
    width:334px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
  }
  .card img{
    width:332px;
    height:148px;
    display:block;
    object-fit:cover;
    background:#DCD6CB;
    border-radius:13px 13px 0 0;
  }
  .body{padding:14px 18px 15px;}
  .eyebrow{
    margin:0 0 3px;
    color:var(--amber);
    font-size:11px;
    font-weight:600;
    letter-spacing:.11em;
    text-transform:uppercase;
  }
  h1{
    margin:0 0 2px;
    font-family:'Playfair Display',Georgia,serif;
    font-size:20px;
    line-height:1.25;
    font-weight:600;
  }
  .sub{
    margin:0 0 10px;
    color:var(--muted);
    font-size:13px;
  }
  .countdown-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .clock{
    font-family:'Playfair Display',Georgia,serif;
    font-size:42px;
    line-height:1;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    white-space:nowrap;
  }
  .pause{
    padding:7px 8px;
    border:1px solid var(--amber);
    border-radius:10px;
    background:#FFF8EE;
    color:var(--amber);
    font-family:'Source Sans 3',system-ui,sans-serif;
    font-size:11px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .track{
    height:5px;
    margin:10px 0 9px;
    border-radius:999px;
    background:#EFEBE3;
  }
  .fill{
    width:62%;
    height:5px;
    border-radius:999px;
    background:var(--amber);
  }
  .schedule{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    border:1px solid var(--line);
    border-radius:11px;
    background:#FAF8F4;
  }
  .time{
    padding:8px 6px;
    text-align:center;
    color:var(--muted);
    font-size:10px;
    line-height:1.2;
  }
  .time + .time{border-left:1px solid var(--line);}
  .time strong{
    display:block;
    margin-top:2px;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  .time.arrival strong{color:var(--amber);}
  .timer-tools{
    display:flex;
    justify-content:flex-end;
    margin-top:8px;
  }
  .reset{
    padding:5px 8px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-family:'Source Sans 3',system-ui,sans-serif;
    font-size:11px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .driver-panel{
    margin-top:9px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:12px;
  }
  .driver-head{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .avatar{
    width:34px;
    height:34px;
    flex:0 0 auto;
    border-radius:50%;
    background:#F7F0E5;
    color:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:600;
  }
  .driver-copy{
    min-width:0;
    flex:1;
  }
  .driver-copy strong{
    display:block;
    font-size:13px;
    font-weight:600;
  }
  .driver-copy span{
    display:block;
    color:var(--muted);
    font-size:11px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .status{
    padding:4px 7px;
    border-radius:999px;
    background:#F3F0E9;
    color:#625A4D;
    font-size:10px;
    font-weight:600;
  }
  .driver-buttons{
    display:flex;
    gap:7px;
    margin-top:8px;
  }
  .driver-buttons button{
    flex:1;
    padding:7px 5px;
    border-radius:9px;
    font-family:'Source Sans 3',system-ui,sans-serif;
    font-size:11px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .message{
    border:1px solid var(--amber);
    background:var(--amber);
    color:#fff;
  }
  .call{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img src="https://loremflickr.com/332/148/hotel?lock=5583" width="332" height="148" alt="Front drive of the Wayfarer Loft where the airport shuttle boards">
      <div class="body">
        <p class="eyebrow">Next airport shuttle</p>
        <h1>Terminal 2 airport shuttle</h1>
        <p class="sub">Meet at the lobby entrance, bay 3</p>

        <div class="countdown-row">
          <div class="clock">01:12:38</div>
          <button class="pause" type="button">
            <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
              <rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
            </svg>
            Pause
          </button>
        </div>

        <div class="track"><div class="fill"></div></div>

        <div class="schedule">
          <div class="time">
            Departs
            <strong>4:45 PM</strong>
          </div>
          <div class="time">
            Ride length
            <strong>25 min</strong>
          </div>
          <div class="time arrival">
            Terminal 2
            <strong>5:10 PM</strong>
          </div>
        </div>

        <div class="timer-tools">
          <button class="reset" type="button">
            <svg width="13" height="13" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.2 9a5.8 5.8 0 1 0 1.9-4.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M3 2.6V6h3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reset timer
          </button>
        </div>

        <div class="driver-panel">
          <div class="driver-head">
            <div class="avatar">DR</div>
            <div class="driver-copy">
              <strong>Della Roque</strong>
              <span>Your driver · Confirmed for 2 guests</span>
            </div>
            <span class="status">Ready</span>
          </div>
          <div class="driver-buttons">
            <button class="message" type="button">
              <svg width="13" height="13" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M3 3.5h12v8.8H7.2L3 15V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
              Message Della
            </button>
            <button class="call" type="button">
              <svg width="13" height="13" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M5.2 2.8 7.1 6 5.8 7.4c1 2 2.7 3.7 4.8 4.8l1.4-1.3 3.2 1.9-.5 2.3c-.2.7-.8 1.1-1.5 1-5.8-.8-10.5-5.5-11.3-11.3-.1-.7.3-1.3 1-1.5l2.3-.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
              Call
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
