<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Savings Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 12px 18px;
      background: #f8fafc;
    }

    .edit-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(36, 112, 232, 0.11);
    }

    .header-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: rgba(36, 112, 232, 0.15);
      color: #2470e8;
    }

    .header-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: #195fc5;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #52627a;
      font-size: 13px;
      line-height: 1.3;
    }

    form {
      margin-top: 10px;
    }

    .form-section {
      padding: 10px;
      border: 1px solid #dce5f0;
      border-radius: 8px;
      background: #ffffff;
    }

    .form-section + .form-section {
      margin-top: 8px;
    }

    .funding-section {
      border-color: #d8e6df;
      background: #f4f9f6;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 8px;
      color: #29374b;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }

    .section-mark {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #2470e8;
    }

    .funding-section .section-mark {
      background: #2e8b62;
    }

    .field + .field {
      margin-top: 7px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #536176;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0 11px;
      border-radius: 6px;
      background: #edf3fb;
    }

    .funding-section .control,
    .funding-section .account-control {
      background: #e7f1eb;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #172033;
      font: 500 14px/1.3 'Roboto', system-ui, sans-serif;
    }

    .with-prefix input {
      padding-left: 17px;
    }

    .with-icon input {
      padding-right: 28px;
    }

    .prefix {
      position: absolute;
      left: 11px;
      color: #52627a;
      font-size: 14px;
      font-weight: 500;
    }

    .control-icon {
      position: absolute;
      right: 11px;
      width: 17px;
      height: 17px;
      color: #4d6382;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .progress-block {
      margin-top: 7px;
    }

    .progress-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #52627a;
      font-size: 11px;
      line-height: 1.25;
    }

    .progress-copy strong {
      color: #195fc5;
      font-weight: 700;
    }

    .progress-track {
      height: 6px;
      margin-top: 5px;
      border-radius: 999px;
      background: #dbe5f3;
    }

    .progress-fill {
      width: 42.5%;
      height: 6px;
      border-radius: 999px;
      background: #2470e8;
    }

    .account-control {
      width: 100%;
      min-height: 36px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      border-radius: 6px;
      color: #172033;
      font: 500 14px/1.3 'Roboto', system-ui, sans-serif;
      text-align: left;
    }

    .account-name {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-control svg {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      fill: none;
      stroke: #4d6382;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 9px;
      margin-top: 10px;
    }

    .actions button {
      min-height: 42px;
      padding: 0 13px;
      border: 0;
      border-radius: 6px;
      font: 500 14px/1 'Roboto', system-ui, sans-serif;
    }

    .cancel {
      background: #e8eef7;
      color: #31547f;
    }

    .save {
      background: #2470e8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="edit-goal-title">
      <div class="edit-header">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7.5"></circle>
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2.5v2M21.5 12h-2M12 21.5v-2M2.5 12h2"></path>
          </svg>
        </div>
        <div class="header-copy">
          <h1 id="edit-goal-title">Edit emergency fund</h1>
          <p class="subtitle">Review the goal and transfer plan.</p>
        </div>
      </div>

      <form>
        <section class="form-section" aria-labelledby="goal-details-heading">
          <h2 class="section-heading" id="goal-details-heading">
            <span class="section-mark" aria-hidden="true"></span>
            Goal details
          </h2>

          <div class="field">
            <label for="a-goal-name">Goal name</label>
            <div class="control">
              <input id="a-goal-name" type="text" value="Emergency fund">
            </div>
          </div>

          <div class="field">
            <label for="a-target-amount">Target amount</label>
            <div class="control with-prefix">
              <span class="prefix" aria-hidden="true">$</span>
              <input id="a-target-amount" type="text" inputmode="decimal" value="18,000.00">
            </div>
            <div class="progress-block" aria-label="$7,650 saved, 42.5 percent of target">
              <div class="progress-copy">
                <span><strong>$7,650 saved</strong> of $18,000</span>
                <span>42.5%</span>
              </div>
              <div class="progress-track" aria-hidden="true">
                <div class="progress-fill"></div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="a-target-date">Target date</label>
            <div class="control with-icon">
              <input id="a-target-date" type="text" value="September 30, 2026">
              <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
                <path d="M8 3.5v4M16 3.5v4M3.5 10h17"></path>
              </svg>
            </div>
          </div>
        </section>

        <section class="form-section funding-section" aria-labelledby="funding-setup-heading">
          <h2 class="section-heading" id="funding-setup-heading">
            <span class="section-mark" aria-hidden="true"></span>
            Funding setup
          </h2>

          <div class="field">
            <label for="a-monthly-transfer">Monthly transfer</label>
            <div class="control with-prefix">
              <span class="prefix" aria-hidden="true">$</span>
              <input id="a-monthly-transfer" type="text" inputmode="decimal" value="450.00">
            </div>
          </div>

          <div class="field">
            <label id="a-funding-account-label">Funding account</label>
            <button class="account-control" type="button" aria-labelledby="a-funding-account-label">
              <span class="account-name">Everyday Checking · 1842</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 10 4 4 4-4"></path>
              </svg>
            </button>
          </div>
        </section>

        <div class="actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="save" type="submit">Save changes</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
