<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge earned — Fernwood Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    background:#DCDDE0;
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#FFFFFF;
    border-radius:38px;
    padding:14px 16px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    overflow:hidden;
  }
  .eyebrow{
    font-size:9px;
    font-weight:700;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:#1D4ED8;
    margin:0 0 9px;
    line-height:1;
  }
  .art{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:50%;
    background:#1D4ED8;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 0 8px;
  }
  h1{
    font-size:15px;
    line-height:1.15;
    font-weight:600;
    color:#101114;
    margin:0 0 2px;
    letter-spacing:-.01em;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .meta{
    font-size:9.5px;
    line-height:1.2;
    font-weight:500;
    color:#6C6F76;
    margin:0;
  }
  .rule{
    width:100%;
    height:1px;
    background:#E3E4E7;
    margin:8px 0;
  }
  .next-head{
    width:100%;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .next-label{
    font-size:10.5px;
    font-weight:600;
    color:#101114;
    margin:0;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .count{
    font-size:10.5px;
    font-weight:700;
    color:#1D4ED8;
    margin:0;
    flex:0 0 auto;
  }
  .track{
    width:100%;
    height:5px;
    border-radius:3px;
    background:#E3E4E7;
    margin:7px 0 6px;
  }
  .fill{
    width:66.6%;
    height:100%;
    border-radius:3px;
    background:#1D4ED8;
  }
  .hint{
    font-size:9px;
    line-height:1.3;
    color:#6C6F76;
    margin:0;
  }
  .foot{
    width:100%;
    box-sizing:border-box;
    margin-top:auto;
    height:30px;
    border-radius:15px;
    background:#1D4ED8;
    color:#FFFFFF;
    font-size:10.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
  }
  .foot svg{flex:0 0 auto;}
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Badge earned</p>

    <div class="art">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 3l1.9 3.9 4.3.6-3.1 3 .8 4.3L10 12.8l-3.9 2 .8-4.3-3.1-3 4.3-.6L10 3z" fill="#FFFFFF"/>
      </svg>
    </div>
    <h1>Trusted Reviewer</h1>
    <p class="meta">Earned Mar 14 · 50 helpful</p>

    <div class="rule"></div>

    <div class="next-head">
      <p class="next-label">Community Guide</p>
      <p class="count">4/6</p>
    </div>
    <div class="track"><div class="fill"></div></div>
    <p class="hint">2 photo reviews to unlock</p>

    <div class="foot">
      All 11 badges
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M5 3l4 4-4 4" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
