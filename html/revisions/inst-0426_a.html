<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop Photo — Roamstead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8dde3;
      color: #172033;
      font-family: 'Inter', system-ui, sans-serif;
    }

    button {
      font: inherit;
      cursor: default;
    }

    .screen {
      position: relative;
      width: 768px;
      height: 1024px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #cbd2da;
      overflow: hidden;
    }

    /* ---------- top bar ---------- */
    .topbar {
      display: grid;
      grid-template-columns: 130px 1fr 130px;
      align-items: center;
      padding: 20px 28px;
      border-bottom: 1px solid #e3e7eb;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      color: #172033;
    }

    .text-button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #536174;
      font-size: 16px;
      line-height: 28px;
      font-weight: 500;
      text-align: left;
    }

    .save-button {
      justify-self: end;
      border: 0;
      border-radius: 10px;
      padding: 11px 24px;
      background: #475569;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .asset-context {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      border-bottom: 1px solid #e3e7eb;
      font-size: 13px;
      line-height: 20px;
    }

    .asset-name {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 600;
      color: #344154;
    }

    .asset-count {
      margin-left: 20px;
      flex: 0 0 auto;
      color: #788493;
    }

    /* ---------- workspace: canvas + side panel ---------- */
    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      background: #202a38;
    }

    .photo-wrap {
      position: relative;
      width: 400px;
      height: 640px;
      background: #6b7280;
    }

    .photo-wrap img {
      width: 400px;
      height: 640px;
      display: block;
      object-fit: cover;
      background: #7a8490;
    }

    .shade {
      position: absolute;
      background: rgba(15, 23, 42, 0.58);
      pointer-events: none;
    }

    .shade-top {
      top: 0;
      left: 0;
      width: 400px;
      height: 150px;
    }

    .shade-bottom {
      top: 490px;
      left: 0;
      width: 400px;
      height: 150px;
    }

    .shade-left {
      top: 150px;
      left: 0;
      width: 30px;
      height: 340px;
    }

    .shade-right {
      top: 150px;
      left: 370px;
      width: 30px;
      height: 340px;
    }

    .crop-frame {
      position: absolute;
      top: 150px;
      left: 30px;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(255, 255, 255, 0.92);
    }

    .grid-v,
    .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.44);
    }

    .grid-v {
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .grid-v.one {
      left: 33.333%;
    }

    .grid-v.two {
      left: 66.666%;
    }

    .grid-h {
      left: 0;
      right: 0;
      height: 1px;
    }

    .grid-h.one {
      top: 33.333%;
    }

    .grid-h.two {
      top: 66.666%;
    }

    .handle {
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: #ffffff;
      border-style: solid;
    }

    .handle.tl {
      top: -3px;
      left: -3px;
      border-width: 4px 0 0 4px;
    }

    .handle.tr {
      top: -3px;
      right: -3px;
      border-width: 4px 4px 0 0;
    }

    .handle.bl {
      bottom: -3px;
      left: -3px;
      border-width: 0 0 4px 4px;
    }

    .handle.br {
      right: -3px;
      bottom: -3px;
      border-width: 0 4px 4px 0;
    }

    .stage-caption {
      margin: 14px 0 0;
      color: #b6c0cd;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }

    /* ---------- side panel ---------- */
    .sidebar {
      width: 300px;
      flex: 0 0 300px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 24px 20px;
      border-left: 1px solid #dfe4e9;
      background: #ffffff;
    }

    .panel-label {
      display: block;
      margin-bottom: 12px;
      color: #7c8896;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-item {
      position: relative;
      display: block;
      width: 100%;
      border: 1px solid #e2e7ec;
      border-radius: 10px;
      padding: 12px 14px 12px 20px;
      background: #ffffff;
      color: #5c6879;
      font-size: 15px;
      line-height: 20px;
      font-weight: 500;
      text-align: left;
    }

    .tool-item.active {
      border-color: #cbd4de;
      background: #f1f4f8;
      color: #263243;
      font-weight: 700;
    }

    .tool-item.active::before {
      content: "";
      position: absolute;
      top: 11px;
      bottom: 11px;
      left: 8px;
      width: 3px;
      border-radius: 3px;
      background: #475569;
    }

    .ratio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ratio {
      border: 1px solid #d8dee5;
      border-radius: 10px;
      padding: 12px 8px;
      background: #ffffff;
      color: #647184;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .ratio.active {
      border-color: #475569;
      background: #475569;
      color: #ffffff;
    }

    .control-block {
      margin-bottom: 18px;
    }

    .control-block:last-child {
      margin-bottom: 0;
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .control-name {
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: #344154;
    }

    .control-value {
      color: #697587;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
    }

    .slider {
      position: relative;
      height: 22px;
    }

    .slider-track {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 3px;
      background: #d7dde4;
    }

    .slider-fill {
      position: absolute;
      top: 10px;
      left: 0;
      height: 3px;
      border-radius: 3px;
      background: #475569;
    }

    .slider-center {
      position: absolute;
      top: 6px;
      left: 50%;
      width: 1px;
      height: 11px;
      background: #9da7b4;
    }

    .slider-knob {
      position: absolute;
      top: 1px;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      border: 2px solid #475569;
      border-radius: 50%;
      background: #ffffff;
    }

    .sidebar-footer {
      margin-top: auto;
    }

    .icon-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid #d8dee5;
      border-radius: 12px;
      padding: 0;
      background: #ffffff;
      color: #536174;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reset-button {
      width: 100%;
      border: 1px solid #d8dee5;
      border-radius: 12px;
      padding: 13px 0;
      background: #ffffff;
      color: #475569;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="text-button" type="button">Cancel</button>
      <h1 class="topbar-title">Crop Photo</h1>
      <button class="save-button" type="button">Save</button>
    </header>

    <div class="asset-context">
      <span class="asset-name">Harborview Stay · Gallery photo</span>
      <span class="asset-count">Photo 2 of 6 · JPEG 4032 × 3024</span>
    </div>

    <div class="workspace">
      <section class="stage">
        <div class="photo-wrap">
          <img src="https://loremflickr.com/400/640/cityscape?lock=5930" width="400" height="640" alt="Waterfront city view selected for the Harborview Stay gallery">
          <div class="shade shade-top"></div>
          <div class="shade shade-bottom"></div>
          <div class="shade shade-left"></div>
          <div class="shade shade-right"></div>
          <div class="crop-frame" aria-hidden="true">
            <span class="grid-v one"></span>
            <span class="grid-v two"></span>
            <span class="grid-h one"></span>
            <span class="grid-h two"></span>
            <span class="handle tl"></span>
            <span class="handle tr"></span>
            <span class="handle bl"></span>
            <span class="handle br"></span>
          </div>
        </div>
        <p class="stage-caption">Crop 1:1 · exports at 2048 × 2048 px</p>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <span class="panel-label">Tool</span>
          <div class="tool-list" role="group" aria-label="Photo editing tools">
            <button class="tool-item active" type="button">Crop</button>
            <button class="tool-item" type="button">Adjust</button>
            <button class="tool-item" type="button">Perspective</button>
          </div>
        </div>

        <div class="panel">
          <span class="panel-label">Aspect</span>
          <div class="ratio-grid">
            <button class="ratio" type="button">Free</button>
            <button class="ratio active" type="button">1:1</button>
            <button class="ratio" type="button">4:3</button>
            <button class="ratio" type="button">16:9</button>
          </div>
        </div>

        <div class="panel">
          <span class="panel-label">Geometry</span>

          <div class="control-block">
            <div class="control-head">
              <span class="control-name">Straighten</span>
              <span class="control-value">−1.5°</span>
            </div>
            <div class="slider" aria-label="Straighten set to negative 1.5 degrees">
              <span class="slider-track"></span>
              <span class="slider-fill" style="width:46%;"></span>
              <span class="slider-center"></span>
              <span class="slider-knob" style="left:46%;"></span>
            </div>
          </div>

          <div class="control-block">
            <div class="control-head">
              <span class="control-name">Zoom</span>
              <span class="control-value">112%</span>
            </div>
            <div class="slider" aria-label="Zoom set to 112 percent">
              <span class="slider-track"></span>
              <span class="slider-fill" style="width:38%;"></span>
              <span class="slider-knob" style="left:38%;"></span>
            </div>
          </div>

          <div class="control-block">
            <div class="control-head">
              <span class="control-name">Vertical</span>
              <span class="control-value">0</span>
            </div>
            <div class="slider" aria-label="Vertical perspective set to zero">
              <span class="slider-track"></span>
              <span class="slider-fill" style="width:50%;"></span>
              <span class="slider-center"></span>
              <span class="slider-knob" style="left:50%;"></span>
            </div>
          </div>

          <div class="control-block">
            <div class="control-head">
              <span class="control-name">Horizontal</span>
              <span class="control-value">+2</span>
            </div>
            <div class="slider" aria-label="Horizontal perspective set to positive 2">
              <span class="slider-track"></span>
              <span class="slider-fill" style="width:54%;"></span>
              <span class="slider-center"></span>
              <span class="slider-knob" style="left:54%;"></span>
            </div>
          </div>
        </div>

        <div class="sidebar-footer">
          <span class="panel-label">Transform</span>
          <div class="icon-tools">
            <button class="icon-button" type="button" aria-label="Rotate left">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8V3m0 0h5M4 3l4 4"></path>
                <path d="M5.5 15.5a8 8 0 1 0 1.1-9.8"></path>
              </svg>
            </button>
            <button class="icon-button" type="button" aria-label="Rotate right">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 8V3m0 0h-5m5 0-4 4"></path>
                <path d="M18.5 15.5a8 8 0 1 1-1.1-9.8"></path>
              </svg>
            </button>
            <button class="icon-button" type="button" aria-label="Flip horizontally">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v18"></path>
                <path d="M9 6 3 12l6 6V6Z"></path>
                <path d="m15 6 6 6-6 6V6Z"></path>
              </svg>
            </button>
          </div>
          <button class="reset-button" type="button">Reset crop</button>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
