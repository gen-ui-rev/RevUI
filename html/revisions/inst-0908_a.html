<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Pickup Point — Parcelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e8;
      color: #202330;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f7;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 56px;
      align-items: center;
      padding: 13px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e8e9ee;
    }

    .icon-button,
    .text-button,
    .clear-button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .text-button {
      padding: 7px 0;
      text-align: right;
      color: #4f46c7;
      font-size: 14px;
      font-weight: 500;
    }

    .intro {
      padding: 15px 20px 16px;
      background: #ffffff;
    }

    .intro h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .intro p {
      margin: 4px 0 0;
      color: #666b78;
      font-size: 14px;
      line-height: 21px;
    }

    .content {
      flex: 1;
      min-height: 0;
      padding: 16px 18px;
    }

    .search-field {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: #ffffff;
      border: 2px solid #4f46c7;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(28, 31, 45, 0.08);
      color: #4f46c7;
    }

    .search-field svg {
      flex: 0 0 auto;
    }

    .search-field input {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202330;
      font-size: 15px;
      font-weight: 500;
    }

    .clear-button {
      width: 28px;
      height: 28px;
      padding: 5px;
      display: grid;
      place-items: center;
      color: #767b88;
    }

    .location-button {
      width: 100%;
      margin-top: 12px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dfe1e8;
      border-radius: 10px;
      background: #ffffff;
      color: #4f46c7;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      cursor: pointer;
    }

    .section {
      margin-top: 18px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 8px;
    }

    .section-title {
      margin: 0;
      color: #555a67;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .section-count {
      color: #7b808c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      margin: 0 2px 10px;
    }

    .chip {
      padding: 5px 12px;
      border: 1px solid #dfe1e8;
      border-radius: 999px;
      background: #ffffff;
      color: #555a67;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: #4f46c7;
      border-color: #4f46c7;
      color: #ffffff;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e7e8ed;
      border-radius: 10px;
    }

    .result-row,
    .saved-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #eceef2;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .result-row:last-child,
    .saved-row:last-child {
      border-bottom: 0;
    }

    .result-row {
      padding: 10px 14px;
    }

    .saved-row {
      padding: 10px 14px 11px;
    }

    .row-title {
      display: block;
      color: #252834;
      font-size: 14px;
      line-height: 21px;
      font-weight: 500;
    }

    .row-detail {
      display: block;
      margin-top: 1px;
      color: #747986;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .saved-label {
      display: block;
      margin-bottom: 1px;
      color: #4f46c7;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 10px 8px;
      background: #ffffff;
      border-top: 1px solid #dedfe5;
    }

    .tab {
      min-width: 0;
      padding: 1px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #7b808c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .tab.active {
      color: #4f46c7;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="topbar">
        <button class="icon-button" type="button" aria-label="Go back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="topbar-title">Pickup point</p>
        <button class="text-button" type="button">Cancel</button>
      </div>

      <div class="intro">
        <h1>Where should we hold your parcel?</h1>
        <p>Search a postcode, street, or shop name.</p>
      </div>
    </header>

    <main class="content">
      <label class="search-field">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20.2 20.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" value="Bristol BS1" aria-label="Search pickup points">
        <button class="clear-button" type="button" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="#E9EAF0"/>
            <path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </label>

      <button class="location-button" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.5V5M12 19V21.5M2.5 12H5M19 12H21.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Use my current location
      </button>

      <section class="section" aria-labelledby="matches-title">
        <div class="section-head">
          <h2 class="section-title" id="matches-title">Pickup points</h2>
          <span class="section-count">3 within 1 mi</span>
        </div>
        <div class="filter-chips" role="group" aria-label="Filter pickup points">
          <button class="chip active" type="button" aria-pressed="true">All</button>
          <button class="chip" type="button" aria-pressed="false">Lockers</button>
          <button class="chip" type="button" aria-pressed="false">Parcel shops</button>
          <button class="chip" type="button" aria-pressed="false">Open 24/7</button>
        </div>
        <div class="panel">
          <button class="result-row" type="button">
            <span class="row-title">Redcliffe Street Locker</span>
            <span class="row-detail">Locker · 0.4 mi · Open 24/7</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Cornerhouse News &amp; Post</span>
            <span class="row-detail">Parcel shop · 0.6 mi · Closes 8 PM</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Harbourside Locker Point</span>
            <span class="row-detail">Locker · 0.9 mi · Open 24/7</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="saved-title">
        <div class="section-head">
          <h2 class="section-title" id="saved-title">Saved pickup points</h2>
          <span class="section-count">Edit</span>
        </div>
        <div class="panel">
          <button class="saved-row" type="button">
            <span class="saved-label">Near home</span>
            <span class="row-title">Willow Lane Locker, Bristol BS1 4TR</span>
          </button>
          <button class="saved-row" type="button">
            <span class="saved-label">Near work</span>
            <span class="row-title">Quayside Post Point, 12 Prince St</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Parcelo navigation">
      <button class="tab active" type="button" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12L20 5L13.5 20L11.4 13.6L4 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Send</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3.2L19.5 7.4V16.6L12 20.8L4.5 16.6V7.4L12 3.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4.5 7.4L12 11.8M12 11.8L19.5 7.4M12 11.8V20.8" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Track</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 20C6.2 16.8 8.6 15 12 15C15.4 15 17.8 16.8 18.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Account</span>
      </button>
    </nav>
  </div>
</body>
</html>
