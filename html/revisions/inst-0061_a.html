<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Book Damage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e6e5e1;
      color: #17233c;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #f4eddd;
    }

    .report-card {
      width: 100%;
      padding: 20px;
      background: #fffaf0;
      border: 1px solid #17233c;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      color: #17233c;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.18;
    }

    .institution {
      margin: 4px 2px 13px 0;
      color: #526079;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
      text-align: right;
      letter-spacing: 0.03em;
    }

    .intro {
      margin: 0 0 15px;
      color: #4f5663;
      font-size: 14px;
      line-height: 1.45;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 8px;
      padding: 0;
      color: #17233c;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .damage-list {
      background: #fff8e9;
      border: 1px solid #17233c;
      border-radius: 8px;
    }

    .damage-option {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      color: #202a40;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .damage-option + .damage-option {
      border-top: 1px solid #17233c;
    }

    .damage-option.selected,
    .damage-option:has(input:checked) {
      background: #eaf4fb;
    }

    .damage-option:first-child {
      border-radius: 7px 7px 0 0;
    }

    .damage-option:last-child {
      border-radius: 0 0 7px 7px;
    }

    .damage-option input {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: #17233c;
    }

    .boundary-note {
      margin: 12px 0 0;
      color: #5d6470;
      font-size: 12.5px;
      line-height: 1.4;
    }

    .submit-button {
      width: 100%;
      margin-top: 13px;
      padding: 10px 17px;
      border: 1px solid #17233c;
      border-radius: 8px;
      background: #17233c;
      color: #fffaf0;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="report-card" aria-labelledby="report-title">
      <h1 id="report-title">Report damage to a borrowed book</h1>
      <p class="institution">Cloverline Public Library</p>
      <p class="intro">Choose the type of damage you found so library staff can arrange the right care.</p>

      <form>
        <fieldset>
          <legend>Damage type</legend>
          <div class="damage-list">
            <label class="damage-option selected">
              <input type="radio" name="damage" checked>
              <span>Torn or missing pages</span>
            </label>
            <label class="damage-option">
              <input type="radio" name="damage">
              <span>Water or liquid damage</span>
            </label>
            <label class="damage-option">
              <input type="radio" name="damage">
              <span>Writing, highlighting, or stains</span>
            </label>
            <label class="damage-option">
              <input type="radio" name="damage">
              <span>Damaged cover or binding</span>
            </label>
          </div>
        </fieldset>

        <p class="boundary-note">Please keep the book. A library staff member will contact you with return instructions.</p>
        <button class="submit-button" type="submit">Send damage report</button>
      </form>
    </main>
  </div>
</body>
</html>
