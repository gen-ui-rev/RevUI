<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vellum Audio Achievement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e4;
      color: #242126;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 28px;
      background: #f8f7f5;
    }

    .achievement {
      width: 100%;
      border: 1px solid #d6d1d9;
      background: #ffffff;
    }

    .accent {
      width: 100%;
      height: 6px;
      background: #7040a8;
    }

    .intro {
      padding: 22px 22px 20px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }

    .eyebrow {
      margin: 0;
      color: #7040a8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border: 1px solid #7040a8;
      background: #f3edf8;
      color: #7040a8;
    }

    h1 {
      margin: 0 0 10px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 31px;
      line-height: 1.08;
      font-weight: 700;
      color: #241d29;
    }

    .description {
      margin: 0;
      color: #5e5862;
      font-size: 15px;
      line-height: 1.45;
    }

    .hero {
      width: 332px;
      height: 128px;
      object-fit: cover;
      display: block;
      background: #d8d3d9;
    }

    .details {
      padding: 18px 22px 20px;
      border-top: 1px solid #d6d1d9;
    }

    .milestone {
      margin: 0 0 5px;
      color: #2b272d;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 600;
    }

    .earned {
      margin: 0;
      color: #716b73;
      font-size: 14px;
      line-height: 1.4;
    }

    .rarity-panel {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #e3d8ef;
      border-left: 3px solid #7040a8;
      background: #f7f3fb;
    }

    .rarity-stats {
      display: flex;
      gap: 12px;
      margin: 0;
    }

    .rarity-stats > div {
      flex: 1 1 0;
      min-width: 0;
    }

    .rarity-stats dt {
      margin: 0 0 2px;
      color: #8d8497;
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rarity-stats dd {
      margin: 0;
      color: #2b272d;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      white-space: nowrap;
    }

    .rarity-stats dd.tier {
      color: #7040a8;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="achievement" aria-labelledby="achievement-title">
      <div class="accent"></div>

      <div class="intro">
        <div class="label-row">
          <p class="eyebrow">Achievement earned</p>
          <div class="badge-mark" aria-hidden="true">
            <svg width="26" height="30" viewBox="0 0 26 30" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 2H19V13C19 16.3137 16.3137 19 13 19C9.68629 19 7 16.3137 7 13V2Z" stroke="currentColor" stroke-width="1.8"/>
              <path d="M7 5H3V9C3 12.3137 5.68629 15 9 15" stroke="currentColor" stroke-width="1.8"/>
              <path d="M19 5H23V9C23 12.3137 20.3137 15 17 15" stroke="currentColor" stroke-width="1.8"/>
              <path d="M13 19V24M8 28H18M10 24H16V28H10V24Z" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </div>
        </div>

        <h1 id="achievement-title">The Night Listener</h1>
        <p class="description">You logged 100 hours of listening between midnight and 5:00 AM.</p>
      </div>

      <img class="hero" src="https://loremflickr.com/332/128/concert?lock=6230" width="332" height="128" alt="Purple-lit musicians performing at a late-night concert">

      <div class="details">
        <p class="milestone">100 late-night listening hours</p>
        <p class="earned">Earned February 18, 2025</p>

        <div class="rarity-panel">
          <dl class="rarity-stats">
            <div>
              <dt>Rarity tier</dt>
              <dd class="tier">Rare</dd>
            </div>
            <div>
              <dt>Earned by</dt>
              <dd>2.4%</dd>
            </div>
            <div>
              <dt>Holders</dt>
              <dd>2,418</dd>
            </div>
          </dl>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
