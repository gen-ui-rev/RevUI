<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      background: #e9e7e4;
      color: #2b2928;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      display: flex;
      align-items: center;
      padding: 42px 24px;
      background: #f7f6f4;
    }

    .confirmation-card {
      width: 100%;
      padding: 26px 26px 28px;
      background: #eeece8;
      border: 1px solid #d8d4cf;
      border-radius: 14px;
      box-shadow: 0 3px 0 rgba(66, 57, 52, 0.05);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      padding-bottom: 18px;
      color: #9b292d;
      border-bottom: 1px solid #d5d0ca;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      color: #ffffff;
      background: #be272d;
      border-radius: 50%;
    }

    .status-mark svg {
      display: block;
      width: 13px;
      height: 13px;
    }

    .content-row {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .package-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      color: #be272d;
      background: #ffffff;
      border: 1px solid #d8d4cf;
      border-radius: 8px;
    }

    .package-mark svg {
      display: block;
      width: 34px;
      height: 34px;
    }

    .copy {
      min-width: 0;
      padding-top: 2px;
    }

    h1 {
      margin: 0;
      color: #252322;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
    }

    .description {
      margin: 10px 0 0;
      color: #625d5b;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .note {
      margin: 22px 0 0;
      padding: 14px 16px;
      color: #55504d;
      background: rgba(255, 255, 255, 0.62);
      border-left: 3px solid #be272d;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="confirmation-card" role="status" aria-live="polite" aria-label="Confirming cart availability">
      <p class="status">
        <span class="status-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M8 3V8L11 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </span>
        Checking availability
      </p>

      <div class="content-row">
        <div class="package-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M7 14.5L22 7L37 14.5V30L22 37L7 30V14.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
            <path d="M7 14.5L22 22L37 14.5M22 22V37M15 10.5L30 18" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
          </svg>
        </div>
        <div class="copy">
          <h1>Confirming your cart</h1>
          <p class="description">Morrow Market is verifying seller inventory and delivery options.</p>
        </div>
      </div>

      <p class="note">Keep this page open while your cart is confirmed.</p>
    </section>
  </div>
</body>
</html>
