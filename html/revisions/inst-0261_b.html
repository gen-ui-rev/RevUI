<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your number</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7ebe9;
      color: #17211d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px 22px;
      background: #f4f6f5;
    }

    .verification-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d8dfdc;
      border-radius: 6px;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #176b4c;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .service-mark {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .service .step {
      margin-left: auto;
      padding: 0 8px;
      border: 1px solid #cfdad5;
      border-radius: 999px;
      color: #62716a;
      font-size: 11px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: 26px;
      font-weight: 600;
      line-height: 32px;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 0;
      color: #53615b;
      font-size: 14px;
      line-height: 20px;
    }

    .recipient {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 9px 12px;
      border: 1px solid #d8dfdc;
      border-radius: 6px;
      background: #f7faf8;
    }

    .recipient svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: #176b4c;
    }

    .recipient .number {
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      letter-spacing: 0.3px;
    }

    .recipient .change {
      margin-left: auto;
      color: #176b4c;
      font-size: 13px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .code-section {
      margin-top: 20px;
    }

    .code-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
    }

    .code-inputs {
      display: flex;
      gap: 7px;
    }

    .code-inputs input {
      width: 43px;
      height: 50px;
      padding: 0;
      border: 1px solid #b9c5c0;
      border-radius: 6px;
      background: #ffffff;
      color: #17211d;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      line-height: 50px;
      outline: none;
      caret-color: #176b4c;
    }

    .code-inputs input:last-child {
      border: 2px solid #19865e;
      line-height: 48px;
    }

    .carrier-notice {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid #ecdcae;
      border-left: 3px solid #c9962c;
      border-radius: 6px;
      background: #fdf7e7;
    }

    .carrier-notice p {
      margin: 0;
      color: #6a5623;
      font-size: 12.5px;
      line-height: 18px;
    }

    .carrier-notice strong {
      color: #4d3d13;
      font-weight: 700;
    }

    .verify-button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 1px solid #176b4c;
      border-radius: 6px;
      background: #176b4c;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #e0e5e3;
    }

    .resend-button {
      padding: 9px 12px;
      border: 1px solid #9aaba3;
      border-radius: 6px;
      background: #ffffff;
      color: #26342e;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
    }

    .method-link {
      color: #176b4c;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="verification-card" aria-labelledby="verification-title">
      <div class="service">
        <svg class="service-mark" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="5.5" y="2.5" width="9" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.6 15.2h2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Gatherlane Driver</span>
        <span class="step">SMS step</span>
      </div>

      <h1 id="verification-title">Verify your mobile</h1>
      <p class="intro">Enter the six-digit code from your texts.</p>

      <div class="recipient">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 5.2A2.2 2.2 0 0 1 5.2 3h1l1 2.4-1.3 1a7.4 7.4 0 0 0 3.7 3.7l1-1.3 2.4 1v1a2.2 2.2 0 0 1-2.2 2.2A9 9 0 0 1 3 5.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <span class="number">+1 (•••) •••-4417</span>
        <a class="change" href="#">Change</a>
      </div>

      <section class="code-section" aria-labelledby="code-label">
        <span class="code-label" id="code-label">Text message code</span>
        <div class="code-inputs" role="group" aria-label="Six-digit verification code">
          <input type="text" inputmode="numeric" value="8" maxlength="1" aria-label="Digit 1">
          <input type="text" inputmode="numeric" value="2" maxlength="1" aria-label="Digit 2">
          <input type="text" inputmode="numeric" value="4" maxlength="1" aria-label="Digit 3">
          <input type="text" inputmode="numeric" value="1" maxlength="1" aria-label="Digit 4">
          <input type="text" inputmode="numeric" value="9" maxlength="1" aria-label="Digit 5">
          <input type="text" inputmode="numeric" value="3" maxlength="1" aria-label="Digit 6">
        </div>
      </section>

      <div class="carrier-notice">
        <p><strong>Carrier delays are common.</strong> Texts can take up to 3 minutes to arrive.</p>
      </div>

      <button class="verify-button" type="button">Confirm number</button>

      <div class="footer-actions">
        <button class="resend-button" type="button">Resend text</button>
        <a class="method-link" href="#">Call me instead</a>
      </div>
    </main>
  </div>
</body>
</html>
