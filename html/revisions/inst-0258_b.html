<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e8e6;
      color: #252729;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f5f5f3;
    }

    .block-result {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #d7d8d6;
      border-radius: 10px;
    }

    .result-mark {
      width: 40px;
      height: 40px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #b1720f;
      color: #ffffff;
    }

    .result-mark svg {
      width: 22px;
      height: 22px;
    }

    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 29px;
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .summary {
      margin: 12px 0 0;
      color: #5f6264;
      font-size: 16px;
      line-height: 1.45;
    }

    .boundary-note {
      margin: 18px 0 0;
      padding-top: 17px;
      border-top: 1px solid #e0e1df;
      color: #5f6264;
      font-size: 14px;
      line-height: 1.45;
    }

    .boundary-note strong {
      color: #343638;
      font-weight: 600;
    }

    /* Contact detail is demoted to a quiet footnote, read last. */
    .who {
      margin-top: 18px;
    }

    .who-label {
      margin: 0 0 6px;
      color: #8d908f;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #f3f3f1;
    }

    .monogram {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #e2e3e1;
      color: #63676a;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .person-copy {
      min-width: 0;
    }

    .person-name {
      margin: 0;
      color: #45484a;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 600;
    }

    .person-detail {
      margin: 2px 0 0;
      color: #838688;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
    }

    .secondary {
      border: 1px solid #cfd0ce;
      background: #ffffff;
      color: #3f4244;
    }

    .primary {
      border: 1px solid #4e5255;
      background: #4e5255;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="block-result" aria-labelledby="result-title">
      <div class="result-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6.5 12.2 10.1 16l7.4-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="result-title">Maren Quill is blocked</h1>
      <p class="summary">Maren can no longer message you or request payments in Northline.</p>

      <p class="boundary-note"><strong>Blocking is not a report.</strong> If a transfer looks unfamiliar, open it and choose Get help.</p>

      <section class="who">
        <p class="who-label">Blocked contact</p>
        <div class="person">
          <div class="monogram" aria-hidden="true">MQ</div>
          <div class="person-copy">
            <p class="person-name">Maren Quill</p>
            <p class="person-detail">Contact ending in 1842 · Blocked today</p>
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="secondary" type="button">Unblock</button>
        <button class="primary" type="button">Done</button>
      </div>
    </main>
  </div>
</body>
</html>
