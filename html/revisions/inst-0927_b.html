<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Recipes Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #1f2a22;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid #e3ebe4;
      background: #f4f7f2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      margin: 0;
      color: #3f6b4b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count-badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: #e2ece3;
      color: #3f6b4b;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .body-area {
      padding: 20px 24px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    h1 {
      margin: 0;
      color: #1f2a22;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 10px 0 0;
      color: #61705f;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    .hero {
      width: 342px;
      height: 140px;
      margin: 18px 0 0;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      background: #dfe7df;
    }

    .action-row {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .primary-action {
      width: 188px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #3f6b4b;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }

    .steps {
      margin: auto 0 0;
      padding: 16px 0 0;
      border-top: 1px solid #eef2ee;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .steps li {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #48584a;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }

    .step-num {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #e2ece3;
      color: #3f6b4b;
      font-size: 11px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <p class="brand">Pantry Notes · Saved recipes</p>
      <span class="count-badge">0 saved</span>
    </div>
    <section class="body-area" aria-labelledby="empty-title">
      <h1 id="empty-title">No recipes in your cookbook yet</h1>
      <p class="description">Everything you save lands here, ready for grocery day or a slow Sunday in the kitchen.</p>
      <img
        class="hero"
        src="https://loremflickr.com/342/140/studio?lock=12270"
        width="342"
        height="140"
        alt="Chopped vegetables and mixing bowls on a wooden kitchen table"
      >
      <div class="action-row">
        <button class="primary-action" type="button">Find a recipe</button>
      </div>
      <ul class="steps">
        <li><span class="step-num">1</span>Browse tonight's dinner ideas</li>
        <li><span class="step-num">2</span>Tap the bookmark to save a dish</li>
        <li><span class="step-num">3</span>Cook from your list, even offline</li>
      </ul>
    </section>
  </div>
</body>
</html>
