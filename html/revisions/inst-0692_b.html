<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightwave — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { background: #e6e7ea; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 0;
    margin: 0;
    background: #e6e7ea;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 46px 24px;
    background: #e6e7ea;
  }
  .banner {
    padding: 17px 18px 19px;
    border: 1px solid #d9dde2;
    border-radius: 10px;
    background: #ffffff;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mark {
    display: block;
    flex: none;
  }
  .app {
    color: #0369a1;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .state {
    margin-left: auto;
    color: #78808c;
    font-size: 12px;
  }
  .episode {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-top: 16px;
  }
  .art {
    width: 76px;
    height: 76px;
    display: block;
    flex: none;
    border-radius: 8px;
    background: #d4d6db;
    object-fit: cover;
  }
  .meta {
    min-width: 0;
    padding-top: 1px;
  }
  .title {
    margin: 0;
    color: #14181f;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.2;
  }
  .show {
    margin: 7px 0 0;
    color: #5d6570;
    font-size: 14px;
    line-height: 1.35;
  }
  .summary {
    margin: 14px 0 0;
    padding: 7px 10px;
    border-left: 3px solid #38a3d7;
    border-radius: 0 5px 5px 0;
    background: #f3f8fb;
    color: #53606c;
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .host {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 12px;
  }
  .mono {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    border-radius: 50%;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 12px;
    font-weight: 600;
  }
  .host-copy {
    min-width: 0;
    color: #66707b;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track {
    height: 6px;
    margin-top: 19px;
    border-radius: 6px;
    background: #e4e6ea;
  }
  .fill {
    width: 58%;
    height: 6px;
    border-radius: 6px;
    background: #0284c7;
  }
  .time-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: 9px;
  }
  .elapsed {
    padding-bottom: 2px;
    color: #78808c;
    font-size: 12px;
  }
  .remaining {
    text-align: right;
  }
  .remaining-label {
    display: block;
    color: #78808c;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }
  .remaining-time {
    display: block;
    margin-top: 3px;
    color: #0369a1;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="banner">
      <div class="head">
        <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="7" fill="none" stroke="#0284c7" stroke-width="1.5"/>
          <circle cx="8" cy="8" r="2" fill="#0284c7"/>
        </svg>
        <span class="app">Nightwave</span>
        <span class="state">Now playing</span>
      </div>

      <div class="episode">
        <img class="art" src="https://loremflickr.com/76/76/vinyl?lock=9261" width="76" height="76" alt="Episode artwork: a record spinning on a turntable">
        <div class="meta">
          <h1 class="title">The Long Way Around</h1>
          <p class="show">Slow Static · Season 3, Episode 8</p>
        </div>
      </div>

      <p class="summary">Marta follows an old highway and the voices that still echo along its route.</p>

      <div class="host">
        <div class="mono">MH</div>
        <span class="host-copy">Hosted by Marta Held</span>
      </div>

      <div class="track"><div class="fill"></div></div>
      <div class="time-row">
        <span class="elapsed">24:18 elapsed</span>
        <div class="remaining">
          <span class="remaining-label">Time remaining</span>
          <strong class="remaining-time">17:34</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
