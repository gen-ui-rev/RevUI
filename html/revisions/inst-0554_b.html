<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Roboto', system-ui, sans-serif;
    background:#e9ebee;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#e9ebee;
    padding:36px 0;
    box-sizing:border-box;
  }
  .card{
    margin:0 24px;
    background:#fff;
    border-radius:6px;
    box-shadow:0 2px 10px rgba(23,28,33,.12);
    padding:22px 20px 18px;
  }
  h1{
    font-size:19px;
    font-weight:700;
    color:#171c21;
    margin:0 0 6px;
    letter-spacing:-.1px;
  }
  .subject{
    font-size:13px;
    color:#6c757d;
    margin:0 0 14px;
    line-height:1.45;
  }
  .subject strong{
    font-weight:500;
    color:#3d454d;
  }
  .origin{
    background:#f6f7f8;
    border-left:3px solid #c2c7cc;
    border-radius:4px;
    padding:9px 12px 10px;
    margin-bottom:6px;
  }
  .origin-label{
    display:block;
    font-size:11px;
    font-weight:500;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:#9aa1a8;
    margin-bottom:5px;
  }
  .origin-row{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .origin-name{
    flex:1 1 auto;
    min-width:0;
    font-size:14px;
    font-weight:500;
    color:#5a6169;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .origin-count{
    flex:0 0 auto;
    font-size:12px;
    color:#9aa1a8;
  }
  .connector{
    display:flex;
    justify-content:center;
    margin:0 0 6px;
  }
  .label{
    font-size:12px;
    font-weight:500;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:#8a9199;
    margin:0 0 8px;
  }
  ul{list-style:none;margin:0;padding:0;}
  li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 10px;
    border-radius:6px;
    border:1px solid transparent;
  }
  li + li{margin-top:2px;}
  li.selected{
    border-color:#00a6c4;
    background:#f2fbfd;
  }
  .glyph{flex:0 0 auto;display:block;}
  .meta{min-width:0;flex:1 1 auto;}
  .name{
    font-size:15px;
    font-weight:500;
    color:#171c21;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .count{
    font-size:12px;
    color:#8a9199;
    margin-top:2px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1 1 0;
    text-align:center;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    padding:11px 0;
    border-radius:6px;
    box-sizing:border-box;
  }
  .cancel{
    color:#5a6169;
    background:#fff;
    border:1px solid #d8dbdf;
  }
  .confirm{
    color:#fff;
    background:#00a6c4;
    border:1px solid #00a6c4;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1>Move to folder</h1>
      <p class="subject">Moving <strong>Kitchen &amp; Cooking</strong> — 42 cards</p>

      <div class="origin">
        <span class="origin-label">Currently in</span>
        <div class="origin-row">
          <svg class="glyph" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a7adb4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.2h8a1.5 1.5 0 0 1 1.5 1.5v8.3a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 18V7.5z"/></svg>
          <span class="origin-name">Spanish Basics</span>
          <span class="origin-count">6 decks</span>
        </div>
      </div>

      <div class="connector">
        <svg width="18" height="20" viewBox="0 0 24 24" fill="none" stroke="#c2c7cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14"/><path d="M6.5 13l5.5 5.5L17.5 13"/></svg>
      </div>

      <p class="label">Move to</p>
      <ul>
        <li>
          <svg class="glyph" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a9199" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.2h8a1.5 1.5 0 0 1 1.5 1.5v8.3a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 18V7.5z"/></svg>
          <div class="meta">
            <div class="name">Grammar Drills</div>
            <div class="count">4 decks</div>
          </div>
        </li>
        <li class="selected">
          <svg class="glyph" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00a6c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.2h8a1.5 1.5 0 0 1 1.5 1.5v8.3a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 18V7.5z"/></svg>
          <div class="meta">
            <div class="name">Travel &amp; Everyday</div>
            <div class="count">2 decks</div>
          </div>
          <svg class="glyph" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00a6c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.5 5-5.3"/></svg>
        </li>
        <li>
          <svg class="glyph" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a9199" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.2h8a1.5 1.5 0 0 1 1.5 1.5v8.3a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 18V7.5z"/></svg>
          <div class="meta">
            <div class="name">Verbs &amp; Tenses</div>
            <div class="count">3 decks</div>
          </div>
        </li>
      </ul>

      <div class="actions">
        <span class="btn cancel">Cancel</span>
        <span class="btn confirm">Move here</span>
      </div>
    </div>
  </div>
</body>
</html>
