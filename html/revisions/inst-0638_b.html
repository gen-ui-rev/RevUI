<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Standings — Porchlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #eceae6;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #221e1b;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    background: #fffefd;
    padding: 24px;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    line-height: 14px;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: #a2988f;
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.15;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px;
    line-height: 17px;
    color: #7d746d;
    margin: 0;
  }

  .standing {
    margin-top: 14px;
    background: #d6336c;
    border-radius: 14px;
    padding: 13px 16px 11px;
    color: #fff;
  }
  .standing .label {
    font-size: 12px;
    font-weight: 600;
    line-height: 14px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #f8ccdb;
    margin: 0 0 2px;
  }
  .standing .line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .standing .rank {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
  }
  .standing .pts {
    font-size: 16px;
    font-weight: 600;
    line-height: 1;
  }
  .standing .gap {
    font-size: 13px;
    line-height: 16px;
    color: #fadbe6;
    margin: 5px 0 0;
  }

  .sec {
    font-size: 12px;
    font-weight: 600;
    line-height: 14px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #8f857d;
    margin: 14px 0 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #221e1b;
  }
  .row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 9px 0;
    line-height: 20px;
    border-bottom: 1px solid #e8e3de;
  }
  .row .n {
    width: 20px;
    flex: none;
    font-size: 14px;
    font-weight: 600;
    color: #a2988f;
    font-variant-numeric: tabular-nums;
  }
  .row .name {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .score {
    flex: none;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    margin: 14px 0 0;
    padding: 11px 14px;
    border: 1.5px solid #221e1b;
    border-radius: 10px;
    background: transparent;
    font-family: inherit;
    color: #221e1b;
    text-align: left;
    cursor: pointer;
  }
  .cta .cta-t {
    display: block;
    font-size: 15px;
    font-weight: 600;
    line-height: 20px;
  }
  .cta .cta-s {
    display: block;
    font-size: 12px;
    font-weight: 400;
    line-height: 16px;
    color: #7d746d;
  }
  .cta .chev {
    flex: none;
    font-size: 22px;
    line-height: 1;
    color: #d6336c;
  }

  .foot {
    margin: 12px 0 0;
    font-size: 13px;
    line-height: 17px;
    color: #8f857d;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Porchlight</p>
    <h1>Weekly Standings</h1>
    <p class="sub">Hill &amp; Vine circle · 42 members</p>

    <div class="standing">
      <p class="label">Your rank</p>
      <div class="line">
        <span class="rank">4th</span>
        <span class="pts">1,284 pts</span>
      </div>
      <p class="gap">62 behind Nadia · 83 ahead of Owen</p>
    </div>

    <p class="sec">Ahead of you</p>
    <div class="row">
      <span class="n">1</span>
      <span class="name">Nadia Oyelaran</span>
      <span class="score">1,612</span>
    </div>
    <div class="row">
      <span class="n">2</span>
      <span class="name">Theo Marchetti</span>
      <span class="score">1,455</span>
    </div>
    <div class="row">
      <span class="n">3</span>
      <span class="name">Priya Raghunathan</span>
      <span class="score">1,346</span>
    </div>

    <p class="sec">Behind you</p>
    <div class="row">
      <span class="n">5</span>
      <span class="name">Owen Delacroix</span>
      <span class="score">1,201</span>
    </div>

    <button type="button" class="cta">
      <span>
        <span class="cta-t">Open the full ranking</span>
        <span class="cta-s">All 42 members, ranks 1–42</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>

    <p class="foot">Scores lock Sunday at 11:59 PM.</p>
  </div>
</body>
</html>
