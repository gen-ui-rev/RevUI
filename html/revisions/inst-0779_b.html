<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Saved List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8eae6;
      color: #20231d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 768px;
      height: 1024px;
      padding: 40px 48px 48px;
      display: flex;
      flex-direction: column;
      background: #f8f9f6;
      box-shadow: 0 18px 50px rgba(26, 31, 39, 0.08);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 30px;
    }

    .brand {
      color: #172132;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .saved-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid #dde1d8;
      border-radius: 999px;
      background: #ffffff;
      color: #565d51;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 500;
    }

    .saved-label svg {
      width: 17px;
      height: 17px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .empty-state {
      width: 100%;
    }

    .visual {
      padding: 70px 32px;
      border-radius: 28px;
      background: #172132;
    }

    .visual svg {
      display: block;
      width: 220px;
      height: 190px;
      margin: 0 auto;
    }

    .content {
      max-width: 610px;
      margin: 38px auto 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #172132;
      font-size: 32px;
      line-height: 1.28;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .description {
      max-width: 520px;
      margin: 0 auto;
      color: #686e62;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 400;
    }

    .search-form {
      margin-top: 28px;
    }

    .search-label {
      display: block;
      margin-bottom: 10px;
      color: #40463c;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      text-align: left;
    }

    .search-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid #dce0d7;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(32, 35, 29, 0.06);
    }

    .input-wrap {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 12px;
    }

    .input-wrap svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #7a8175;
    }

    .search-field {
      min-width: 0;
      width: 100%;
      padding: 13px 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #20231d;
      font: inherit;
      font-size: 14px;
    }

    .search-field::placeholder {
      color: #92988d;
    }

    .cta {
      min-height: 52px;
      padding: 13px 24px;
      border: 0;
      border-radius: 13px;
      background: #b5e83e;
      color: #1d2411;
      cursor: pointer;
      white-space: nowrap;
      font: inherit;
      font-size: 14px;
      line-height: 22px;
      font-weight: 600;
    }

    .helper {
      margin: 13px 0 0;
      color: #8a9085;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">Morrow Market</div>
      <div class="saved-label">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 4.5H17.5V20L12 16.5L6.5 20V4.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Saved
      </div>
    </header>

    <main>
      <section class="empty-state" aria-labelledby="empty-title">
        <div class="visual" aria-hidden="true">
          <svg viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg">
            <rect x="40" y="63" width="140" height="112" rx="25" fill="#FFFFFF"/>
            <path d="M75 69V49C75 29.7 90.7 14 110 14C129.3 14 145 29.7 145 49V69" fill="none" stroke="#B5E83E" stroke-width="12" stroke-linecap="round"/>
            <circle cx="78" cy="104" r="8" fill="#172132"/>
            <circle cx="142" cy="104" r="8" fill="#172132"/>
            <path d="M87 128C93 137 100.5 142 110 142C119.5 142 127 137 133 128" fill="none" stroke="#B5E83E" stroke-width="8" stroke-linecap="round"/>
            <circle cx="183" cy="48" r="21" fill="#B5E83E"/>
            <path d="M183 37V59M172 48H194" stroke="#172132" stroke-width="5.5" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="content">
          <h1 id="empty-title">Your saved list is empty</h1>
          <p class="description">Keep products you want to revisit in one place while you shop Morrow Market.</p>

          <form class="search-form" action="#" method="get" role="search">
            <label class="search-label" for="product-search-b">Find something to save</label>
            <div class="search-control">
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
                  <path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <input class="search-field" id="product-search-b" name="query" type="search" placeholder="Search products or categories">
              </div>
              <button class="cta" type="submit">Browse products</button>
            </div>
          </form>

          <p class="helper">Search the market, then save favorites for later.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
