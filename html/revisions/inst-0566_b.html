<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonight’s Running Order — Marlowe Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#B4740E;
    --amber-soft:#FDF6EA;
    --line:#E3DFD8;
    --ink:#1E1B16;
    --muted:#777066;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#E7E4DF;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:28px 24px;
    background:#EFEDE9;
  }
  .card{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 18px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:22px;
    line-height:1.2;
    margin:0 0 6px;
  }
  .sub{
    font-size:14px;
    line-height:1.4;
    color:var(--muted);
    margin:0 0 16px;
  }
  ul{list-style:none;margin:0;padding:0;}
  li{
    display:grid;
    grid-template-columns:46px 52px minmax(0,1fr) 16px;
    align-items:center;
    column-gap:10px;
    padding:9px 8px;
    border-left:3px solid transparent;
    border-radius:4px;
  }
  li + li{
    margin-top:2px;
    border-top:1px solid #F0EDE8;
  }
  li.lifted{
    border-left-color:var(--amber);
    background:var(--amber-soft);
  }
  .time{
    font-size:13px;
    line-height:1.15;
    font-weight:600;
    color:var(--muted);
  }
  li.lifted .time{color:var(--amber);}
  img{
    display:block;
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:50%;
    background:#DDD8D1;
  }
  .info{min-width:0;}
  .name{
    display:block;
    font-size:15px;
    font-weight:600;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .handle{
    color:#A9A29A;
    display:block;
  }
  li.lifted .handle{color:var(--amber);}
  .foot{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:14px;
  }
  .save{
    grid-column:1;
    grid-row:1;
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:14px;
    font-weight:600;
    color:#FFFFFF;
    background:var(--amber);
    border:1px solid var(--amber);
    border-radius:6px;
    padding:9px 16px;
  }
  .status{
    grid-column:2;
    grid-row:1;
    min-width:0;
    font-size:13px;
    line-height:1.3;
    color:var(--muted);
    text-align:right;
  }
  .status strong{
    display:block;
    color:var(--ink);
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">The Courtyard Stage</p>
      <h1>Tonight’s Running Order</h1>
      <p class="sub">Set the performance schedule for Friday night at Marlowe Market.</p>

      <ul>
        <li>
          <span class="time">7:30<br>PM</span>
          <img src="https://loremflickr.com/52/52/furniture?lock=7580" width="52" height="52" alt="Promotional image for Halden House">
          <span class="info">
            <span class="name">Halden House</span>
            <span class="meta">30-minute set</span>
          </span>
          <svg class="handle" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6" cy="3" r="1.4" fill="currentColor"/><circle cx="10" cy="3" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="8" r="1.4" fill="currentColor"/><circle cx="10" cy="8" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="13" r="1.4" fill="currentColor"/><circle cx="10" cy="13" r="1.4" fill="currentColor"/>
          </svg>
        </li>
        <li class="lifted">
          <span class="time">8:15<br>PM</span>
          <img src="https://loremflickr.com/52/52/sneakers?lock=7581" width="52" height="52" alt="Promotional image for The Corbins">
          <span class="info">
            <span class="name">The Corbins</span>
            <span class="meta">40-minute set</span>
          </span>
          <svg class="handle" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6" cy="3" r="1.4" fill="currentColor"/><circle cx="10" cy="3" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="8" r="1.4" fill="currentColor"/><circle cx="10" cy="8" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="13" r="1.4" fill="currentColor"/><circle cx="10" cy="13" r="1.4" fill="currentColor"/>
          </svg>
        </li>
        <li>
          <span class="time">9:10<br>PM</span>
          <img src="https://loremflickr.com/52/52/fashion?lock=7582" width="52" height="52" alt="Promotional image for Reed Avery">
          <span class="info">
            <span class="name">Reed Avery</span>
            <span class="meta">55-minute set</span>
          </span>
          <svg class="handle" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6" cy="3" r="1.4" fill="currentColor"/><circle cx="10" cy="3" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="8" r="1.4" fill="currentColor"/><circle cx="10" cy="8" r="1.4" fill="currentColor"/>
            <circle cx="6" cy="13" r="1.4" fill="currentColor"/><circle cx="10" cy="13" r="1.4" fill="currentColor"/>
          </svg>
        </li>
      </ul>

      <div class="foot">
        <button class="save" type="button">Confirm order</button>
        <span class="status"><strong>Ends at 10:05 PM</strong>Includes 15-minute changeovers</span>
      </div>
    </div>
  </div>
</body>
</html>
