<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete listing — Marketmoss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#334155;
    --slate-soft:#64748b;
    --rule:#d7dbe0;
    --ink:#1c2430;
    --soft:#f4f6f7;
    --live:#216e50;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceef0;
    font-family:'Nunito Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#ffffff;
    padding:24px 26px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    line-height:1.3;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--slate);
  }
  .eyebrow svg{display:block;}
  h1{
    margin:8px 0 4px;
    font-size:24px;
    line-height:1.2;
    font-weight:700;
  }
  .lede{
    margin:0 0 11px;
    font-size:13px;
    line-height:1.45;
    color:var(--slate-soft);
  }
  .item{
    display:flex;
    gap:13px;
    align-items:center;
    padding:10px 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .item img{
    display:block;
    width:72px;
    height:72px;
    object-fit:cover;
    background:#dfe3e7;
    flex:0 0 auto;
  }
  .item-body{min-width:0;}
  .item-title{
    margin:0 0 3px;
    font-size:14px;
    line-height:1.3;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-price{
    margin:0 0 4px;
    font-size:14px;
    line-height:1.3;
    font-weight:600;
    color:var(--slate);
  }
  .item-meta{
    margin:0;
    font-size:12px;
    line-height:1.4;
    color:var(--slate-soft);
  }
  .activity{
    margin:11px 0;
    padding:9px 11px;
    background:var(--soft);
  }
  .activity-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:5px;
  }
  .activity-title{
    margin:0;
    font-size:12px;
    line-height:1.3;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--slate);
  }
  .live-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    line-height:1.3;
    font-weight:700;
    color:var(--live);
  }
  .live-label::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--live);
  }
  .activity-main{
    margin:0 0 2px;
    font-size:16px;
    line-height:1.25;
    font-weight:700;
  }
  .activity-detail{
    margin:0;
    font-size:12px;
    line-height:1.4;
    color:var(--slate-soft);
  }
  fieldset{
    min-width:0;
    margin:0 0 11px;
    padding:0;
    border:0;
  }
  legend{
    width:100%;
    margin:0 0 6px;
    padding:0;
    font-size:13px;
    line-height:1.35;
    font-weight:700;
  }
  .record-option{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:7px 9px;
    border:1px solid var(--rule);
    cursor:pointer;
  }
  .record-option + .record-option{
    border-top:0;
  }
  .record-option.selected{
    background:var(--soft);
    border-color:var(--slate);
  }
  .record-option input{
    width:15px;
    height:15px;
    margin:2px 0 0;
    accent-color:var(--slate);
    flex:0 0 auto;
  }
  .option-title{
    display:block;
    font-size:12px;
    line-height:1.3;
    font-weight:700;
  }
  .option-copy{
    display:block;
    font-size:11px;
    line-height:1.3;
    color:var(--slate-soft);
  }
  .btn{
    display:block;
    width:100%;
    border:1px solid var(--slate);
    border-radius:0;
    background:var(--slate);
    color:#ffffff;
    font-family:inherit;
    font-size:14px;
    line-height:1.2;
    font-weight:700;
    padding:11px 10px;
    text-align:center;
    cursor:pointer;
  }
  .btn-cancel{
    margin-top:7px;
    background:#ffffff;
    color:var(--slate);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="eyebrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
      </svg>
      Seller tools
    </div>

    <h1>Remove this listing?</h1>
    <p class="lede">Review current buyer activity and choose what to retain.</p>

    <div class="item">
      <img src="https://loremflickr.com/72/72/sneakers?lock=6981" width="72" height="72" alt="Gray low-top running sneaker listed for sale">
      <div class="item-body">
        <p class="item-title">Ash Gray Trail Runner, Size 9</p>
        <p class="item-price">$68.00</p>
        <p class="item-meta">214 total views · 12 saves</p>
      </div>
    </div>

    <section class="activity" aria-label="Live buyer activity">
      <div class="activity-head">
        <p class="activity-title">Buyer activity</p>
        <span class="live-label">Live</span>
      </div>
      <p class="activity-main">3 buyers active in the last 10 minutes</p>
      <p class="activity-detail">One buyer saved it 2 minutes ago · 1 open offer</p>
    </section>

    <fieldset>
      <legend>After deleting, keep:</legend>
      <label class="record-option selected">
        <input type="radio" name="records" checked>
        <span>
          <span class="option-title">Photos and price history</span>
          <span class="option-copy">Stored privately in your seller records.</span>
        </span>
      </label>
      <label class="record-option">
        <input type="radio" name="records">
        <span>
          <span class="option-title">Nothing</span>
          <span class="option-copy">Erase the listing and its seller records.</span>
        </span>
      </label>
    </fieldset>

    <button type="button" class="btn">Delete and save private record</button>
    <button type="button" class="btn btn-cancel">Keep listing active</button>
  </div>
</body>
</html>
