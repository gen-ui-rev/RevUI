<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Book Damage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e4e5e3;
      color: #13213a;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 25px 22px;
      background: #f7efdf;
    }

    .report-card {
      width: 100%;
      padding: 20px;
      background: #fffbf2;
      border: 1px solid #182742;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #d9cfbb;
    }

    h1 {
      margin: 0;
      max-width: 285px;
      color: #13213a;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.16;
    }

    .institution {
      margin: 5px 1px 12px 0;
      color: #647087;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.35;
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .book-summary {
      margin-bottom: 14px;
      padding: 9px 11px;
      background: #f3ead8;
      border-left: 3px solid #182742;
    }

    .book-label {
      margin: 0 0 1px;
      color: #667085;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .book-title {
      margin: 0;
      color: #202a3e;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 8px;
      padding: 0;
      color: #13213a;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .damage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .damage-tile {
      position: relative;
      display: flex;
      min-width: 0;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      background: #fff7e8;
      border: 1px solid #182742;
      border-radius: 7px;
      color: #202a3e;
      font-size: 13px;
      line-height: 1.3;
      cursor: pointer;
    }

    .damage-tile.selected,
    .damage-tile:has(input:checked) {
      background: #e9f4fb;
      box-shadow: inset 0 0 0 1px #182742;
    }

    .damage-tile input {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      margin: 1px 0 0;
      accent-color: #182742;
    }

    .guidance {
      margin: 13px 0 0;
      padding-top: 10px;
      border-top: 1px solid #182742;
      color: #596273;
      font-size: 12.5px;
      line-height: 1.4;
    }

    .action-row {
      display: flex;
      gap: 9px;
      margin-top: 13px;
    }

    button {
      padding: 10px 12px;
      border: 1px solid #182742;
      border-radius: 7px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      cursor: pointer;
    }

    .cancel-button {
      flex: 0 0 auto;
      background: #fff7e8;
      color: #182742;
    }

    .submit-button {
      flex: 1;
      background: #182742;
      color: #fffaf0;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="report-card" aria-labelledby="report-title">
      <h1 id="report-title">Tell us about book damage</h1>
      <p class="institution">Cloverline Public Library</p>

      <section class="book-summary" aria-label="Borrowed book">
        <p class="book-label">Borrowed item</p>
        <p class="book-title">The Garden at Dusk · Copy 2</p>
      </section>

      <form>
        <fieldset>
          <legend>What was damaged?</legend>
          <div class="damage-grid">
            <label class="damage-tile">
              <input type="radio" name="damage">
              <span>Cover or spine</span>
            </label>
            <label class="damage-tile selected">
              <input type="radio" name="damage" checked>
              <span>Pages torn or loose</span>
            </label>
            <label class="damage-tile">
              <input type="radio" name="damage">
              <span>Water damage</span>
            </label>
            <label class="damage-tile">
              <input type="radio" name="damage">
              <span>Marks or stains</span>
            </label>
          </div>
        </fieldset>

        <p class="guidance">Do not repair the book yourself. Bring it to the service desk on your next visit.</p>

        <div class="action-row">
          <button class="cancel-button" type="button">Cancel</button>
          <button class="submit-button" type="submit">Report damage</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
