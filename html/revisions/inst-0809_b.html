<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northnote Focus Activity</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdedb;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 10px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f100f;
      border-radius: 30px;
      text-align: center;
    }

    .service-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      background: #f47721;
      border-radius: 50%;
    }

    .service-name {
      margin: 0;
      overflow: hidden;
      color: #b8bbb7;
      font-size: 8px;
      font-weight: 700;
      line-height: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dial {
      width: 78px;
      height: 78px;
      margin-top: 6px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(#f47721 0 68%, #393b39 68% 100%);
    }

    .dial-inner {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      align-content: center;
      border-radius: 50%;
      background: #0f100f;
    }

    .timer {
      margin: 0;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .end-time {
      margin: 0;
      color: #8b8e8a;
      font-size: 8px;
      font-weight: 600;
      line-height: 11px;
      letter-spacing: 0.04em;
    }

    .task-name {
      margin: 7px 0 0;
      max-width: 100%;
      overflow: hidden;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      line-height: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: 100%;
      margin: 2px 0 0;
      min-width: 0;
    }

    .project-mark {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      color: #f47721;
    }

    .project-mark svg {
      width: 5px;
      height: 5px;
      display: block;
    }

    .project-text {
      margin: 0;
      overflow: hidden;
      color: #a9aca8;
      font-size: 9px;
      font-weight: 600;
      line-height: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      width: 100%;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .action {
      width: 100%;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .action svg {
      width: 9px;
      height: 9px;
      display: block;
    }

    .action-pause {
      border: 1px solid #5a5d59;
      background: transparent;
      color: #f0f1ef;
    }

    .action-end {
      height: 26px;
      border: 0;
      border-radius: 13px;
      background: #f47721;
      color: #111211;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="service-strip">
      <span class="live-dot" aria-hidden="true"></span>
      <p class="service-name">Northnote Focus · Live</p>
    </div>

    <div class="dial" role="progressbar" aria-label="Focus block progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
      <div class="dial-inner">
        <p class="timer" aria-label="24 minutes and 18 seconds remaining">24:18</p>
        <p class="end-time">Ends 3:30 PM</p>
      </div>
    </div>

    <h1 class="task-name">Draft project brief</h1>
    <div class="project-line">
      <span class="project-mark" aria-hidden="true">
        <svg viewBox="0 0 6 6" fill="none">
          <rect width="6" height="6" fill="currentColor"/>
        </svg>
      </span>
      <p class="project-text">Atlas Rebrand · Phase 2</p>
    </div>

    <div class="actions">
      <button class="action action-pause" type="button">
        <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="2" y="1.5" width="3.5" height="11" fill="currentColor"/>
          <rect x="8.5" y="1.5" width="3.5" height="11" fill="currentColor"/>
        </svg>
        Pause
      </button>
      <button class="action action-end" type="button">End session</button>
    </div>
  </div>
</body>
</html>
