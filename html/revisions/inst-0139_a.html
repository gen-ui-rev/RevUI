<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete sleep session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ECEDEF;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 36px 24px;
    background: #ECEDEF;
  }
  .card {
    background: #ffffff;
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(24, 26, 32, 0.10);
    padding: 24px 22px 22px;
  }
  /* the session row now sits at the very top of the card as a header strip */
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: -24px -22px 20px;
    padding: 14px 22px;
    border-radius: 6px 6px 0 0;
    background: #F5F6F8;
    border-bottom: 1px solid #E7E9ED;
  }
  .thumb {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    background: #C9D3E4;
    flex: none;
  }
  .entry-text {
    min-width: 0;
  }
  .entry-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #8A8F99;
  }
  .entry-title {
    font-size: 14px;
    font-weight: 600;
    color: #16181D;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .entry-meta {
    font-size: 12px;
    color: #6B707A;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mark {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    background: #FFE9EE;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    line-height: 1.35;
    color: #16181D;
    margin: 16px 0 0;
    letter-spacing: -0.2px;
  }
  .body {
    font-size: 14px;
    line-height: 1.55;
    color: #5C616B;
    margin: 8px 0 0;
  }
  .body strong {
    font-weight: 600;
    color: #16181D;
  }
  .actions {
    margin-top: 20px;
  }
  .btn {
    display: block;
    width: 100%;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 12px;
    text-align: center;
    border: 0;
  }
  .btn-danger {
    background: #D42C55;
    color: #ffffff;
  }
  .btn-quiet {
    background: #ffffff;
    color: #3D424B;
    border: 1px solid #DCDEE3;
    margin-top: 10px;
  }
  .note {
    font-size: 12px;
    line-height: 1.5;
    color: #8A8F99;
    text-align: center;
    margin: 14px 4px 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="entry">
        <div class="thumb"></div>
        <div class="entry-text">
          <div class="entry-label">Selected session</div>
          <div class="entry-title">Tuesday, March 12</div>
          <div class="entry-meta">11:42 PM – 6:58 AM · 7h 16m · Score 81</div>
        </div>
      </div>

      <div class="mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#D42C55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"></path>
          <path d="M9.5 7V4.8h5V7"></path>
          <path d="M6.2 7l.8 12.2h10L17.8 7"></path>
          <path d="M10.4 10.7v5.6M13.6 10.7v5.6"></path>
        </svg>
      </div>

      <h1>Delete this sleep session?</h1>
      <p class="body">The session and its heart rate readings are removed from every device you use with Nightwell. This <strong>cannot</strong> be undone.</p>

      <div class="actions">
        <button class="btn btn-danger" type="button">Delete permanently</button>
        <button class="btn btn-quiet" type="button">Keep session</button>
      </div>

      <p class="note">To hide a session without deleting it, move it to Archive instead.</p>
    </div>
  </div>
</body>
</html>
