<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Hold Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9e7e7;
      color: #292426;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 12px;
      border: 1px solid #d8d1d3;
      border-radius: 38px;
      background: #f7f5f5;
      box-shadow: 0 12px 28px rgba(49, 39, 42, 0.12);
    }

    .watch-content {
      width: 100%;
    }

    .service {
      margin: 0;
      color: #a43f60;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-align: center;
      text-transform: uppercase;
    }

    .timer {
      margin-top: 7px;
      text-align: center;
    }

    .timer-label {
      margin: 0;
      color: #70676a;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timer-value {
      margin: 0;
      color: #b43f65;
      font-size: 44px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
    }

    .timer-detail {
      margin: 1px 0 0;
      color: #70676a;
      font-size: 10px;
      line-height: 1.3;
      font-weight: 500;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e3dddf;
    }

    .actions img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      display: block;
      object-fit: cover;
      border-radius: 18px;
      background: #e5e1df;
    }

    .button-stack {
      min-width: 0;
      flex: 1;
    }

    button {
      width: 100%;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout {
      padding: 9px 5px;
      border: 1px solid #ad3d61;
      background: #ad3d61;
      color: #ffffff;
      font-size: 11px;
      line-height: 1.4;
    }

    .release {
      margin-top: 5px;
      padding: 5px 3px;
      border: 1px solid #ddd6d8;
      background: #ffffff;
      color: #70676a;
      font-size: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="watch-content" aria-label="Nooklane Market cart hold">
      <p class="service">Nooklane Market</p>

      <section class="timer" aria-label="Eight minutes and forty-two seconds remaining">
        <p class="timer-label">Time remaining</p>
        <p class="timer-value">08:42</p>
        <p class="timer-detail">Reserved until 3:18 PM</p>
      </section>

      <div class="actions">
        <img src="https://loremflickr.com/72/72/furniture?lock=4870" width="72" height="72" alt="Cream upholstered lounge chair">
        <div class="button-stack">
          <button class="checkout" type="button">Checkout</button>
          <button class="release" type="button">Release</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
