<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint progress — Draftline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: #d8d8d4;
    color: #292927;
    font-family: 'Source Sans 3', system-ui, sans-serif;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 8px;
    background: #e7e7e4;
  }
  .card {
    padding: 10px 11px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 2px 9px rgba(30, 30, 28, 0.12);
  }
  .eyebrow {
    margin: 0 0 2px;
    color: #85857f;
    font-size: 9px;
    line-height: 1.2;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.15;
  }
  .score {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    margin-top: 7px;
  }
  .number {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  .number span { font-size: 15px; }
  .summary {
    margin: 0 0 2px;
    color: #6f6f69;
    font-size: 10px;
    line-height: 1.2;
    text-align: right;
  }
  .track {
    margin-top: 6px;
    padding: 2px;
    background: #ecece8;
    border-radius: 6px;
  }
  .fill {
    width: 68%;
    padding-top: 4px;
    background: #4a4a45;
    border-radius: 4px;
  }
  .track-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
    color: #85857f;
    font-size: 8px;
    line-height: 1.2;
  }
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 8px;
    padding: 7px 0;
    border-top: 1px solid #e9e9e5;
    border-bottom: 1px solid #e9e9e5;
  }
  .fact + .fact {
    padding-left: 10px;
    border-left: 1px solid #e9e9e5;
  }
  .key {
    margin: 0;
    color: #85857f;
    font-size: 9px;
    line-height: 1.1;
  }
  .val {
    margin: 2px 0 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.1;
  }
  .current {
    margin-top: 8px;
  }
  .current-label {
    margin: 0 0 4px;
    color: #85857f;
    font-size: 9px;
    line-height: 1.1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .indicator {
    width: 5px;
    align-self: stretch;
    flex: none;
    min-height: 25px;
    border-radius: 3px;
    background: #4a4a45;
  }
  .task-copy { min-width: 0; }
  .task {
    margin: 0;
    overflow: hidden;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .owner {
    margin: 1px 0 0;
    overflow: hidden;
    color: #85857f;
    font-size: 9px;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <main class="card">
      <header>
        <p class="eyebrow">Draftline · Sprint 14</p>
        <h1>Editor handoff</h1>
      </header>

      <section aria-label="Completion summary">
        <div class="score">
          <div class="number">68<span>%</span></div>
          <p class="summary">17 of 25 tasks<br>due Mar 21</p>
        </div>
        <div class="track" aria-hidden="true">
          <div class="fill"></div>
        </div>
        <div class="track-labels">
          <span>Sprint progress</span>
          <span>4 days left</span>
        </div>
      </section>

      <section class="facts" aria-label="Sprint details">
        <div class="fact">
          <p class="key">Open review</p>
          <p class="val">3 docs</p>
        </div>
        <div class="fact">
          <p class="key">Owner</p>
          <p class="val">Marta</p>
        </div>
      </section>

      <section class="current" aria-label="Current sprint task">
        <p class="current-label">Focus now</p>
        <div class="task-row">
          <span class="indicator" aria-hidden="true"></span>
          <div class="task-copy">
            <p class="task">Drafting chapters</p>
            <p class="owner">Copy edit follows Mar 19</p>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
