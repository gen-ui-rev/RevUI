<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aster — Focus block activity</title>
<style>
  :root {
    --rose: #f4436f;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d9d9d7;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 16px;
    background: #0b0b0c;
    color: #fff;
    border-radius: 38px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
  }
  .source-image {
    display: none;
  }
  .remaining-label {
    color: var(--rose);
    font-size: 11px;
    line-height: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .clock {
    margin-top: 2px;
    font-size: 46px;
    line-height: 52px;
    font-weight: 700;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
  }
  .progress {
    height: 5px;
    margin-top: 10px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.16);
  }
  .progress span {
    display: block;
    width: 68%;
    height: 100%;
    border-radius: inherit;
    background: var(--rose);
  }
  .event {
    margin-top: 14px;
    padding-top: 11px;
    border-top: 1px solid rgba(255, 255, 255, 0.13);
  }
  .eyebrow {
    color: rgba(255, 255, 255, 0.58);
    font-size: 10px;
    line-height: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .title {
    margin-top: 2px;
    font-size: 16px;
    line-height: 19px;
    font-weight: 650;
  }
  .details {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-top: 7px;
    color: rgba(255, 255, 255, 0.62);
    font-size: 10px;
    line-height: 15px;
  }
  .who {
    min-width: 0;
    color: rgba(255, 255, 255, 0.86);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ends {
    flex: none;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="source-image" src="https://loremflickr.com/48/48/meeting?lock=1203" width="48" height="48" alt="">
    <main>
      <div class="remaining-label">Remaining</div>
      <div class="clock">12:48</div>
      <div class="progress" aria-label="Focus block progress"><span></span></div>

      <section class="event">
        <div class="eyebrow">Aster · Focus block</div>
        <div class="title">Design review<br>Room 2</div>
        <div class="details">
          <span class="who">Notes with Dana Whitlock</span>
          <span class="ends">2:15 PM</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
