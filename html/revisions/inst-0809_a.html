<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northnote Focus Activity</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dcdedb;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 9px 12px 10px;
      display: flex;
      flex-direction: column;
      background: #111211;
      border-top: 3px solid #f47721;
    }

    .activity-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid #353735;
    }

    .service {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 5px;
    }

    .service-mark {
      width: 12px;
      height: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #f47721;
    }

    .service-mark svg {
      width: 12px;
      height: 12px;
      display: block;
    }

    .service-name {
      margin: 0;
      overflow: hidden;
      color: #f0f1ef;
      font-size: 10px;
      font-weight: 600;
      line-height: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-state {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      color: #b8bbb7;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: #f47721;
    }

    .focus-copy {
      margin-top: 9px;
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: #a9aca8;
      font-size: 8px;
      font-weight: 700;
      line-height: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .timer {
      margin: 1px 0 0;
      color: #f47721;
      font-size: 34px;
      font-weight: 600;
      line-height: 36px;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .task-name {
      margin: 1px 0 0;
      overflow: hidden;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      line-height: 15px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-list {
      margin-top: 8px;
      border-top: 1px solid #2a2c2a;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px solid #2a2c2a;
    }

    .detail-label {
      margin: 0;
      flex: 0 0 auto;
      color: #8b8e8a;
      font-size: 8px;
      font-weight: 700;
      line-height: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail-value {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      color: #e7e8e6;
      font-size: 10px;
      font-weight: 600;
      line-height: 13px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-block {
      margin-top: 9px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      color: #b8bbb7;
      font-size: 8px;
      font-weight: 600;
      line-height: 11px;
      letter-spacing: 0.04em;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: #393b39;
    }

    .progress-value {
      width: 68%;
      height: 3px;
      background: #f47721;
    }

    .activity-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }

    .pause-control {
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #5a5d59;
      border-radius: 0;
      background: transparent;
      color: #ffffff;
    }

    .pause-control svg {
      width: 11px;
      height: 11px;
      display: block;
    }

    .end-control {
      flex: 1 1 auto;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #f47721;
      color: #111211;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="activity-header">
      <div class="service">
        <span class="service-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M4 3.5h12v3H7v3h7v3H7v4H4v-13Z" fill="currentColor"/>
          </svg>
        </span>
        <p class="service-name">Northnote Focus</p>
      </div>
      <div class="live-state">
        <span class="live-dot" aria-hidden="true"></span>
        Live
      </div>
    </header>

    <div class="focus-copy">
      <p class="eyebrow">Focus block</p>
      <p class="timer" aria-label="24 minutes and 18 seconds remaining">24:18</p>
      <h1 class="task-name">Draft project brief</h1>
    </div>

    <div class="detail-list">
      <div class="detail-row">
        <p class="detail-label">Project</p>
        <p class="detail-value">Atlas Rebrand</p>
      </div>
      <div class="detail-row">
        <p class="detail-label">Phase</p>
        <p class="detail-value">Client brief</p>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-meta">
        <span>68% complete</span>
        <span>Ends 3:30 PM</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Focus block progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
        <div class="progress-value"></div>
      </div>
    </div>

    <footer class="activity-footer">
      <button class="pause-control" type="button" aria-label="Pause focus block">
        <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <rect x="2" y="1.5" width="3.5" height="11" fill="currentColor"/>
          <rect x="8.5" y="1.5" width="3.5" height="11" fill="currentColor"/>
        </svg>
      </button>
      <button class="end-control" type="button">End session</button>
    </footer>
  </div>
</body>
</html>
