<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reservation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e5e0;
      color: #24221f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      background: #fbfaf7;
    }

    .mark {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2f6248;
      background: #dcebe1;
      border-radius: 4px;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .intro {
      margin: 0;
      color: #66615a;
      font-size: 14px;
      line-height: 1.5;
    }

    .reservation {
      margin-top: 16px;
      padding: 13px 0;
      border-top: 1px solid #d8d4cd;
      border-bottom: 1px solid #d8d4cd;
    }

    .reservation-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .reservation img {
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
      object-fit: cover;
      display: block;
      background: #d3cec5;
      border-radius: 4px;
    }

    .reservation-copy {
      min-width: 0;
    }

    .reservation-copy h2 {
      margin: 0 0 4px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reservation-copy p {
      margin: 0;
      color: #66615a;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      margin-top: 18px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .keep-button {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #2f6248;
      border-radius: 4px;
      background: #2f6248;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .helper {
      margin: 8px 0 0;
      text-align: center;
      color: #5c766a;
      font-size: 12px;
      line-height: 1.5;
    }

    .or-label {
      margin: 18px 0 0;
      color: #7a746c;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .modify-list {
      margin-top: 8px;
      border: 1px solid #ddd8d0;
      border-radius: 4px;
      overflow: hidden;
    }

    .modify-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 12px;
      border: 0;
      background: transparent;
      color: #24221f;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      text-align: left;
    }

    .modify-row + .modify-row {
      border-top: 1px solid #e4e0d9;
    }

    .modify-row .value {
      margin-left: auto;
      color: #6d6760;
      font-size: 12.5px;
      font-weight: 400;
      white-space: nowrap;
    }

    .modify-row svg {
      flex: 0 0 auto;
      color: #98918a;
    }

    .cancel-link {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #8a5b4b;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="manage-title">
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="manage-title">Keep your 8:00 PM table?</h1>
      <p class="intro">Nothing has changed yet. The terrace table is still held under Arden Cole.</p>

      <section class="reservation" aria-label="Reserved table">
        <div class="reservation-row">
          <img src="https://loremflickr.com/60/60/restaurant?lock=11230" width="60" height="60" alt="Terrace tables set for dinner at Morrow Kitchen">
          <div class="reservation-copy">
            <h2>Morrow Kitchen — Terrace</h2>
            <p>Table for 4 · Arden Cole</p>
            <p>Sunday, October 18 · 8:00 PM</p>
          </div>
        </div>
      </section>

      <div class="actions">
        <button class="keep-button" type="button">Keep this reservation</button>
        <p class="helper">We hold your table 20 minutes past 8:00 PM.</p>
      </div>

      <p class="or-label">Rather adjust it?</p>
      <div class="modify-list">
        <button class="modify-row" type="button">
          Change date &amp; time
          <span class="value">Sun, Oct 18 · 8:00 PM</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="modify-row" type="button">
          Change party size
          <span class="value">4 guests</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button class="cancel-link" type="button">Cancel reservation instead</button>
    </main>
  </div>
</body>
</html>
