<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathnest Upload Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8e9;
      color: #272326;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #f8f7f7;
    }

    .upload-panel {
      width: 100%;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #ded9dc;
      border-radius: 10px;
    }

    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 5px 0 0;
      color: #70696d;
      font-size: 13px;
      line-height: 1.45;
    }

    .upload-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #d6cfd2;
      border-radius: 50%;
      background: #ffffff;
      color: #c92f72;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(54, 39, 46, 0.08);
    }

    .upload-mark:focus-visible {
      outline: 3px solid rgba(201, 47, 114, 0.22);
      outline-offset: 2px;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 20px;
      padding: 16px;
      background: #faf4f7;
      border: 1px solid #eedce4;
      border-radius: 8px;
    }

    .progress-ring {
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background: conic-gradient(#d4377b 0 68%, #eadfe4 68% 100%);
    }

    .progress-ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #ffffff;
    }

    .ring-value {
      position: relative;
      z-index: 1;
      color: #302b2e;
      font-size: 21px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .progress-copy {
      min-width: 0;
    }

    .progress-copy strong {
      display: block;
      color: #302b2e;
      font-size: 14px;
      line-height: 1.4;
    }

    .progress-copy p {
      margin: 5px 0 0;
      color: #766f73;
      font-size: 12px;
      line-height: 1.5;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding-bottom: 17px;
      border-bottom: 1px solid #e7e1e3;
    }

    .file-row img {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      object-fit: cover;
      display: block;
      background: #e5e1e2;
      border-radius: 8px;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      margin: 0;
      overflow: hidden;
      color: #302b2e;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-detail {
      margin: 5px 0 0;
      color: #766f73;
      font-size: 12px;
      line-height: 1.4;
    }

    .file-status {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 8px;
      color: #a3275e;
      background: #fbeaf2;
      border-radius: 12px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
    }

    .support-note {
      margin: 15px 0 0;
      color: #766f73;
      font-size: 12px;
      line-height: 1.5;
    }

    .cancel-button {
      width: 100%;
      margin-top: 17px;
      padding: 10px 16px;
      border: 1px solid #d6cfd2;
      border-radius: 6px;
      background: #ffffff;
      color: #4f484c;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="upload-panel" aria-labelledby="upload-title">
      <div class="top-row">
        <div class="title-block">
          <h1 id="upload-title">Uploading trip photos</h1>
          <p class="intro">Adding photos to your Lisbon itinerary.</p>
        </div>
        <button class="upload-mark" type="button" aria-label="Pause upload" title="Pause upload">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 6V18M16 6V18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="progress-card">
        <div class="progress-ring" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68">
          <span class="ring-value">68%</span>
        </div>
        <div class="progress-copy">
          <strong>Almost there</strong>
          <p>2 files are complete. The final photo is uploading now.</p>
        </div>
      </div>

      <div class="file-row">
        <img src="https://loremflickr.com/72/72/cityscape?lock=8970" width="72" height="72" alt="Lisbon cityscape photo being uploaded">
        <div class="file-info">
          <p class="file-name">lisbon-overlook.jpg</p>
          <p class="file-detail">8.4 MB of 12.3 MB uploaded</p>
          <span class="file-status">File 3 of 3</span>
        </div>
      </div>

      <p class="support-note">Uploaded files are added to this trip, not to offline downloads.</p>

      <button class="cancel-button" type="button">Cancel upload</button>
    </section>
  </div>
</body>
</html>
