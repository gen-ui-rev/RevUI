<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Meetup Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 40px 0;
      background: #e5e5e2;
      color: #202321;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #fafaf8;
    }

    .component {
      width: 100%;
    }

    .heading {
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #656a66;
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202321;
      font-size: 27px;
      font-weight: 700;
      line-height: 32px;
    }

    .event-photo {
      width: 342px;
      height: 64px;
      display: block;
      object-fit: cover;
      background: #d4d4cf;
    }

    .event-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 9px 0 11px;
      border-bottom: 1px solid #d9dad6;
    }

    .event-copy {
      min-width: 0;
    }

    .event-name {
      margin: 0;
      overflow: hidden;
      color: #202321;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-group,
    .attendance {
      margin: 1px 0 0;
      color: #747974;
      font-size: 12px;
      line-height: 16px;
    }

    .attendance {
      flex-shrink: 0;
      margin: 0;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .step {
      position: relative;
      padding-left: 34px;
    }

    .step-badge {
      position: absolute;
      left: 0;
      top: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #292d2a;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      line-height: 22px;
      text-align: center;
    }

    .step--date::after {
      content: "";
      position: absolute;
      left: 11px;
      top: 40px;
      bottom: -9px;
      width: 1px;
      background: #cfd1cd;
    }

    .date-fieldset {
      padding-top: 13px;
      padding-bottom: 14px;
      border-bottom: 1px solid #d9dad6;
    }

    legend {
      width: 100%;
      padding: 0;
      color: #202321;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .date-options {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .choice-input {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .date-option {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid #cfd1cd;
      background: #fafaf8;
      color: #555a56;
      cursor: pointer;
      text-align: center;
    }

    .date-day {
      display: block;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
    }

    .date-value {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 18px;
    }

    .choice-input:checked + .date-option {
      border-color: #292d2a;
      background: #292d2a;
      color: #ffffff;
    }

    .time-fieldset {
      padding-top: 13px;
    }

    .time-options {
      margin-top: 5px;
      border-top: 1px solid #d9dad6;
    }

    .time-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #d9dad6;
      cursor: pointer;
    }

    .time-copy {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .time-value {
      color: #202321;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .time-note {
      color: #747974;
      font-size: 12px;
      line-height: 16px;
    }

    .radio-mark {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border: 1px solid #aeb2ae;
      border-radius: 50%;
      background: #fafaf8;
    }

    .choice-input:checked + .time-option .radio-mark {
      border: 5px solid #292d2a;
    }

    .confirm-button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #292d2a;
      border-radius: 0;
      background: #292d2a;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component">
      <header class="heading">
        <p class="eyebrow">Meetup scheduling &middot; 2 steps</p>
        <h1>Choose a meetup time</h1>
      </header>

      <img
        class="event-photo"
        src="https://loremflickr.com/342/64/cafe?lock=10510"
        width="342"
        height="64"
        alt="Tables and chairs inside the cafe selected for the meetup"
      >

      <section class="event-meta" aria-label="Meetup details">
        <div class="event-copy">
          <p class="event-name">Coffee and New Connections</p>
          <p class="event-group">Hosted by Harbor Circle</p>
        </div>
        <p class="attendance">8 attending</p>
      </section>

      <form>
        <fieldset class="step step--date date-fieldset">
          <legend>Step 1 &mdash; Pick a date</legend>
          <span class="step-badge" aria-hidden="true">1</span>
          <div class="date-options">
            <input class="choice-input" type="radio" name="date" id="date-17">
            <label class="date-option" for="date-17">
              <span class="date-day">Friday</span>
              <span class="date-value">Oct 17</span>
            </label>

            <input class="choice-input" type="radio" name="date" id="date-18" checked>
            <label class="date-option" for="date-18">
              <span class="date-day">Saturday</span>
              <span class="date-value">Oct 18</span>
            </label>

            <input class="choice-input" type="radio" name="date" id="date-19">
            <label class="date-option" for="date-19">
              <span class="date-day">Sunday</span>
              <span class="date-value">Oct 19</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="step step--time time-fieldset">
          <legend>Step 2 &mdash; Pick a time</legend>
          <span class="step-badge" aria-hidden="true">2</span>
          <div class="time-options">
            <input class="choice-input" type="radio" name="time" id="time-10">
            <label class="time-option" for="time-10">
              <span class="time-copy">
                <span class="time-value">10:00 AM</span>
                <span class="time-note">6 spots</span>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>

            <input class="choice-input" type="radio" name="time" id="time-1130" checked>
            <label class="time-option" for="time-1130">
              <span class="time-copy">
                <span class="time-value">11:30 AM</span>
                <span class="time-note">4 spots</span>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>

            <input class="choice-input" type="radio" name="time" id="time-1">
            <label class="time-option" for="time-1">
              <span class="time-copy">
                <span class="time-value">1:00 PM</span>
                <span class="time-note">7 spots</span>
              </span>
              <span class="radio-mark" aria-hidden="true"></span>
            </label>
          </div>
        </fieldset>

        <button class="confirm-button" type="button">Confirm Saturday at 11:30 AM</button>
      </form>
    </main>
  </div>
</body>
</html>
