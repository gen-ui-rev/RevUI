<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickup Point — Driftly Car Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe2e8;
      color: #202330;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f7;
    }

    .topbar {
      display: grid;
      grid-template-columns: 40px 1fr 56px;
      align-items: center;
      padding: 13px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e8e9ee;
    }

    .icon-button,
    .text-button,
    .clear-button,
    .reset-button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 6px;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
    }

    .text-button {
      padding: 7px 0;
      text-align: right;
      color: #4f46c7;
      font-size: 14px;
      font-weight: 500;
    }

    .intro {
      padding: 15px 20px 16px;
      background: #ffffff;
    }

    .intro h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .intro p {
      margin: 4px 0 0;
      color: #666b78;
      font-size: 14px;
      line-height: 21px;
    }

    .content {
      flex: 1;
      min-height: 0;
      padding: 16px 18px;
    }

    .search-field {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: #ffffff;
      border: 2px solid #4f46c7;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(28, 31, 45, 0.08);
      color: #4f46c7;
    }

    .search-field svg {
      flex: 0 0 auto;
    }

    .search-field input {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202330;
      font-size: 15px;
      font-weight: 500;
    }

    .clear-button {
      width: 28px;
      height: 28px;
      padding: 5px;
      display: grid;
      place-items: center;
      color: #767b88;
    }

    .location-button {
      width: 100%;
      margin-top: 12px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dfe1e8;
      border-radius: 10px;
      background: #ffffff;
      color: #4f46c7;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      cursor: pointer;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      margin: 0 0 8px 2px;
      color: #555a67;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .results-head {
      margin-bottom: 10px;
    }

    .results-head-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 8px;
    }

    .results-head-top .section-title {
      margin: 0;
    }

    .results-count {
      color: #7b808c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
    }

    .filter-select {
      flex: 1;
      min-width: 0;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid #d3d5df;
      border-radius: 9px;
      background: #ffffff;
      color: #252834;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-select.applied {
      border-color: #4f46c7;
      background: #f1f0fc;
      color: #3b34a8;
    }

    .fs-key {
      color: #7b808c;
      font-size: 12px;
      font-weight: 400;
    }

    .filter-select.applied .fs-key {
      color: #6a63cf;
    }

    .fs-value {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filter-note {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 2px 0;
      color: #747986;
      font-size: 12px;
      line-height: 18px;
    }

    .reset-button {
      padding: 0;
      color: #4f46c7;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      white-space: nowrap;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #e7e8ed;
      border-radius: 10px;
    }

    .result-row,
    .saved-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #eceef2;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .result-row:last-child,
    .saved-row:last-child {
      border-bottom: 0;
    }

    .result-row {
      padding: 10px 14px;
    }

    .saved-row {
      padding: 10px 14px 11px;
    }

    .row-title {
      display: block;
      color: #252834;
      font-size: 14px;
      line-height: 21px;
      font-weight: 500;
    }

    .row-detail {
      display: block;
      margin-top: 1px;
      color: #747986;
      font-size: 12px;
      line-height: 18px;
      font-weight: 400;
    }

    .saved-label {
      display: block;
      margin-bottom: 1px;
      color: #4f46c7;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
    }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 9px 10px 8px;
      background: #ffffff;
      border-top: 1px solid #dedfe5;
    }

    .tab {
      min-width: 0;
      padding: 1px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: #7b808c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
    }

    .tab.active {
      color: #4f46c7;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="topbar">
        <button class="icon-button" type="button" aria-label="Go back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="topbar-title">Pickup point</p>
        <button class="text-button" type="button">Cancel</button>
      </div>

      <div class="intro">
        <h1>Where do you want to pick up?</h1>
        <p>Search a station, street, or parking garage.</p>
      </div>
    </header>

    <main class="content">
      <label class="search-field">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.7" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20.2 20.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="text" value="Berlin Mitte" aria-label="Search pickup points">
        <button class="clear-button" type="button" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="#E9EAF0"/>
            <path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </label>

      <button class="location-button" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.5V5M12 19V21.5M2.5 12H5M19 12H21.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Use my current location
      </button>

      <section class="section" aria-labelledby="matches-title">
        <div class="results-head">
          <div class="results-head-top">
            <h2 class="section-title" id="matches-title">Pickup points</h2>
            <span class="results-count">12 of 34</span>
          </div>
          <div class="filter-bar" role="group" aria-label="Filter pickup points">
            <button class="filter-select applied" type="button">
              <span class="fs-key">Car</span>
              <span class="fs-value">Compact</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="filter-select" type="button">
              <span class="fs-key">Sort</span>
              <span class="fs-value">Nearest</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p class="filter-note">
            <span>Compact cars free after 4 PM today</span>
            <button class="reset-button" type="button">Reset</button>
          </p>
        </div>
        <div class="panel">
          <button class="result-row" type="button">
            <span class="row-title">Rosenthaler Str. Garage</span>
            <span class="row-detail">Garage · 0.3 km · 6 cars available</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Alexanderplatz Station, Bay 4</span>
            <span class="row-detail">Street bay · 0.8 km · 2 cars available</span>
          </button>
          <button class="result-row" type="button">
            <span class="row-title">Hackescher Markt Parkhaus</span>
            <span class="row-detail">Garage · 1.1 km · 4 cars available</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="recent-title">
        <h2 class="section-title" id="recent-title">Recent pickups</h2>
        <div class="panel">
          <button class="saved-row" type="button">
            <span class="saved-label">Last trip</span>
            <span class="row-title">Torstrasse 88 Garage, 10119 Berlin</span>
          </button>
          <button class="saved-row" type="button">
            <span class="saved-label">Airport run</span>
            <span class="row-title">BER Terminal 1, Level P2 Bay 11</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Driftly navigation">
      <button class="tab active" type="button" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 14.5V12L6.8 7.9C7.1 7.2 7.7 6.8 8.4 6.8H15.6C16.3 6.8 16.9 7.2 17.2 7.9L19 12V14.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4.6 14.5H19.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="8.2" cy="17" r="1.6" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="15.8" cy="17" r="1.6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span>Cars</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="6.5" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M9 6.5V5.2C9 4.5 9.5 4 10.2 4H13.8C14.5 4 15 4.5 15 5.2V6.5M4 11H20" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <span>Trips</span>
      </button>
      <button class="tab" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 20C6.2 16.8 8.6 15 12 15C15.4 15 17.8 16.8 18.5 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Account</span>
      </button>
    </nav>
  </div>
</body>
</html>
