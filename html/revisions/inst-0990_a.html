<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d8dcda;
      color: #17372e;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      position: relative;
      width: 1024px;
      height: 768px;
      background: #eef1ef;
      box-shadow: 0 18px 50px rgba(27, 54, 45, 0.13);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
      border-bottom: 1px solid #d9dfdc;
      background: rgba(255, 255, 255, 0.55);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #123c30;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .mini-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
    }

    .status {
      color: #68766f;
      font-size: 14px;
      line-height: 1.4;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 128px 80px 0;
    }

    .splash {
      width: 792px;
      padding: 58px 64px;
      display: grid;
      grid-template-columns: 168px 1px minmax(0, 1fr);
      align-items: center;
      column-gap: 52px;
      background: #ffffff;
      border: 1px solid #e0e6e3;
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(27, 54, 45, 0.1);
    }

    .brand-mark {
      display: block;
      width: 108px;
      height: 108px;
      margin: 0 auto;
    }

    .vertical-divider {
      width: 1px;
      align-self: stretch;
      background: #d9e4df;
    }

    .content {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      color: #123c30;
      font-size: 46px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.9px;
    }

    .service-type {
      margin: 10px 0 0;
      color: #0b7b5a;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
    }

    .divider {
      width: 42px;
      height: 2px;
      margin: 24px 0 20px;
      background: #15906b;
    }

    .description {
      max-width: 390px;
      margin: 0;
      color: #68766f;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 30px;
    }

    .primary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 154px;
      padding: 12px 20px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      text-decoration: none;
      background: #0f8763;
      border: 1px solid #0f8763;
      border-radius: 5px;
    }

    .support-note {
      color: #718078;
      font-size: 14px;
      line-height: 1.4;
    }

    .footer {
      position: absolute;
      right: 40px;
      bottom: 26px;
      left: 40px;
      display: flex;
      justify-content: space-between;
      color: #7b8982;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="mini-mark" viewBox="0 0 68 68" aria-hidden="true">
          <rect x="2" y="2" width="64" height="64" rx="6" fill="#0F8763"/>
          <circle cx="22" cy="24" r="6" fill="#FFFFFF"/>
          <circle cx="46" cy="24" r="6" fill="#FFFFFF"/>
          <circle cx="34" cy="45" r="6" fill="#FFFFFF"/>
          <path d="M27 27.5L31 39M41 27.5L37 39M28 24H40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span>Gatherline</span>
      </div>
      <span class="status">Desktop workspace</span>
    </header>

    <div class="stage">
      <main class="splash" aria-label="Gatherline team workspace">
        <svg class="brand-mark" viewBox="0 0 68 68" role="img" aria-label="Gatherline mark">
          <rect x="2" y="2" width="64" height="64" rx="6" fill="#0F8763"/>
          <circle cx="22" cy="24" r="6" fill="#FFFFFF"/>
          <circle cx="46" cy="24" r="6" fill="#FFFFFF"/>
          <circle cx="34" cy="45" r="6" fill="#FFFFFF"/>
          <path d="M27 27.5L31 39M41 27.5L37 39M28 24H40" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        </svg>

        <div class="vertical-divider" aria-hidden="true"></div>

        <div class="content">
          <h1 class="brand-name">Gatherline</h1>
          <p class="service-type">Team workspace</p>
          <div class="divider" aria-hidden="true"></div>
          <p class="description">Notes, decisions, and schedules in one shared place.</p>
          <div class="actions">
            <a class="primary-action" href="#">Open workspace</a>
            <span class="support-note">Ready for your team</span>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer">
      <span>Shared work, kept clear.</span>
      <span>Gatherline workspace</span>
    </footer>
  </div>
</body>
</html>
