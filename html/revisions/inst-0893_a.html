<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe to Meal Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfdf;
      color: #272929;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 22px;
      background: #f5f5f3;
    }

    .move-panel {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
    }

    .panel-heading {
      padding: 16px;
      background: #e8e9e8;
      border-radius: 14px;
    }

    .heading-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #676a69;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 700;
    }

    .helper {
      margin: 8px 0 0;
      color: #5f6261;
      font-size: 13px;
      line-height: 1.45;
    }

    .close-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: #d9dbda;
      color: #454847;
    }

    .close-button svg {
      width: 18px;
      height: 18px;
    }

    .recipe-preview {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 12px;
      padding: 12px;
      background: #f0f1f0;
      border-radius: 14px;
    }

    .recipe-preview img {
      width: 64px;
      height: 64px;
      flex: 0 0 64px;
      object-fit: cover;
      display: block;
      background: #d4d6d5;
      border-radius: 14px;
    }

    .recipe-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .recipe-title {
      margin: 0;
      overflow: hidden;
      color: #2d2f2e;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recipe-meta {
      margin: 4px 0 0;
      overflow: hidden;
      color: #737675;
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time-chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 9px;
      background: #e2e4e3;
      color: #4b4e4d;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .time-chip svg {
      width: 11px;
      height: 11px;
      flex: 0 0 11px;
    }

    .slot-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 14px 2px 8px;
      color: #4e5150;
      font-size: 13px;
      font-weight: 700;
    }

    .slot-label span {
      color: #828584;
      font-size: 11px;
      font-weight: 600;
    }

    .slot-list {
      display: grid;
      gap: 8px;
    }

    .slot {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 0;
      border-radius: 14px;
      background: #f0f1f0;
      color: #2e302f;
      text-align: left;
      cursor: default;
    }

    .slot.selected {
      background: #dfe1e0;
    }

    .slot-name {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-count {
      flex: 0 0 auto;
      color: #717473;
      font-size: 12px;
      font-weight: 500;
    }

    .selected-mark {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #5d6160;
      color: #ffffff;
    }

    .selected-mark svg {
      width: 14px;
      height: 14px;
    }

    .move-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #555958;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="move-panel" aria-labelledby="move-title">
      <header class="panel-heading">
        <div class="heading-top">
          <div>
            <p class="eyebrow">Commonroom recipes</p>
            <h1 id="move-title">Add to meal plan</h1>
          </div>
          <button class="close-button" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="helper">Pick a meal slot for this recipe. Servings stay at four and can be changed later.</p>
      </header>

      <div class="recipe-preview">
        <img src="https://loremflickr.com/64/64/pasta?lock=11830" width="64" height="64" alt="Bowl of lemon garlic pasta from the saved recipe">
        <div class="recipe-copy">
          <p class="recipe-title">Lemon garlic butter pasta</p>
          <p class="recipe-meta">By Rowan Mercer · Serves 4</p>
          <div class="time-chips">
            <span class="time-chip">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 19h16M7 19V9l5-4 5 4v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Prep 15 min
            </span>
            <span class="time-chip">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/>
                <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Cook 40 min
            </span>
          </div>
        </div>
      </div>

      <p class="slot-label">Meal slot <span>Week of May 19</span></p>

      <div class="slot-list" role="listbox" aria-label="Choose a meal slot">
        <button class="slot selected" type="button" role="option" aria-selected="true">
          <span class="slot-name">Tonight · Dinner</span>
          <span class="selected-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5L9.2 16.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
        <button class="slot" type="button" role="option" aria-selected="false">
          <span class="slot-name">Wednesday · Lunch</span>
          <span class="slot-count">2 recipes</span>
        </button>
        <button class="slot" type="button" role="option" aria-selected="false">
          <span class="slot-name">Saturday · Breakfast</span>
          <span class="slot-count">1 recipe</span>
        </button>
      </div>

      <button class="move-button" type="button">Add to tonight's dinner</button>
    </main>
  </div>
</body>
</html>
