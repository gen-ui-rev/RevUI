<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e1e3e5;
      color: #17202a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 184px;
      height: 224px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 38px;
      box-shadow: 0 12px 30px rgba(30, 41, 59, 0.16);
    }

    .activity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .service {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      font-size: 11px;
      line-height: 1.5;
      font-weight: 700;
    }

    .service svg {
      flex: 0 0 auto;
      color: #0284c7;
    }

    .service-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #0369a1;
      font-size: 9px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .live-label::before {
      width: 6px;
      padding-top: 6px;
      border-radius: 50%;
      background: #0ea5e9;
      content: "";
    }

    .hero {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-ring {
      flex: 0 0 auto;
      width: 76px;
      padding: 7px;
      border-radius: 50%;
      background: conic-gradient(#0284c7 0 76%, #dbe7ee 76% 100%);
    }

    .ring-center {
      padding: 16px 0;
      border-radius: 50%;
      background: #f8fafc;
      color: #075985;
      text-align: center;
    }

    .ring-center strong {
      display: block;
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
    }

    .ring-center span {
      display: block;
      margin-top: 3px;
      color: #64748b;
      font-size: 8px;
      line-height: 1.1;
      font-weight: 700;
      text-transform: uppercase;
    }

    .eta {
      min-width: 0;
    }

    .eta-label {
      margin: 0;
      color: #64748b;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .eta h1 {
      margin: 2px 0;
      color: #0f172a;
      font-size: 25px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.05em;
      white-space: nowrap;
    }

    .eta-unit {
      margin: 0;
      color: #334155;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
    }

    .delivery-card {
      margin-top: 9px;
      padding: 8px 9px;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      background: #f0f9ff;
    }

    .delivery-card strong {
      display: block;
      color: #075985;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
    }

    .delivery-card span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: #475569;
      font-size: 9px;
      line-height: 1.3;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .updated {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 9px;
      line-height: 1.3;
      text-align: center;
    }

    .updated time {
      color: #0f172a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="activity-head">
      <div class="service">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 8.5h14v10.25A1.25 1.25 0 0 1 17.75 20H6.25A1.25 1.25 0 0 1 5 18.75V8.5Z" fill="currentColor"/>
          <path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="service-name">Clover Cart</span>
      </div>
      <span class="live-label">Live</span>
    </header>

    <main aria-label="Delivery status">
      <div class="hero">
        <div class="progress-ring" role="progressbar" aria-label="Delivery progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="76">
          <div class="ring-center">
            <strong>76%</strong>
            <span>Complete</span>
          </div>
        </div>

        <div class="eta">
          <p class="eta-label">Arriving in</p>
          <h1>18–24</h1>
          <p class="eta-unit">minutes</p>
        </div>
      </div>

      <div class="delivery-card">
        <strong>Your order is 6 stops away</strong>
        <span>Order CC-4821 · Courier Mara Tate</span>
      </div>

      <p class="updated">Last updated <time datetime="10:42">10:42 AM</time></p>
    </main>
  </div>
</body>
</html>
