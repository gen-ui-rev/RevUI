<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Actions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #27272a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 24px;
      background: #f4f4f5;
    }

    .action-sheet {
      width: 100%;
      padding: 23px 22px 20px;
      background: #ffffff;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
    }

    .service-name {
      margin: 0 0 5px;
      color: #52525b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #18181b;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.18;
    }

    .account-summary {
      margin: 9px 0 18px;
      color: #71717a;
      font-size: 14px;
      line-height: 1.4;
    }

    .action-list {
      border-top: 1px solid #e4e4e7;
    }

    .action {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 0;
      border: 0;
      border-bottom: 1px solid #e4e4e7;
      background: transparent;
      color: #27272a;
      text-align: left;
      cursor: pointer;
    }

    .action-copy {
      min-width: 0;
      flex: 1;
    }

    .action-title {
      display: block;
      margin-bottom: 1px;
      color: #27272a;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .action-detail {
      display: block;
      color: #71717a;
      font-size: 13px;
      line-height: 1.35;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #a1a1aa;
    }

    .destructive-group {
      margin-top: 17px;
      padding-top: 15px;
      border-top: 1px solid #d4d4d8;
    }

    .destructive-label {
      margin: 0 0 9px;
      color: #71717a;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .destructive-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border: 1px solid #dc2626;
      border-radius: 7px;
      background: #dc2626;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
    }

    .trash-icon {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .destructive-button .action-title {
      color: #ffffff;
    }

    .destructive-button .action-detail {
      color: #fee2e2;
    }

    .destructive-button .chevron {
      color: #ffffff;
    }

    .confirmation-note {
      margin: 8px 1px 0;
      color: #71717a;
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-sheet" aria-labelledby="action-title">
      <p class="service-name">Cedarline</p>
      <h1 id="action-title">Manage Everyday Cash</h1>
      <p class="account-summary">Account ending in 4821 · Available balance $4,286.19</p>

      <nav class="action-list" aria-label="Routine account actions">
        <button class="action" type="button">
          <span class="action-copy">
            <span class="action-title">Transfer money</span>
            <span class="action-detail">Move funds to or from this account</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="action" type="button">
          <span class="action-copy">
            <span class="action-title">View account details</span>
            <span class="action-detail">See routing, limits, and ownership</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </nav>

      <section class="destructive-group" aria-labelledby="destructive-title">
        <h2 class="destructive-label" id="destructive-title">Destructive action</h2>
        <button class="destructive-button" type="button">
          <svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="action-copy">
            <span class="action-title">Disconnect account</span>
            <span class="action-detail">Remove it from Cedarline</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="confirmation-note">You’ll be asked to confirm before the account is removed.</p>
      </section>
    </section>
  </div>
</body>
</html>
