<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern — Guided setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1a17;
    --muted:#6f6d66;
    --line:#e3e1da;
    --accent:#f5c518;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#f1f0ec;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:24px;
    background:#f1f0ec;
  }
  .card{
    width:342px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .hero{
    display:block;
    width:340px;
    height:72px;
    object-fit:cover;
    background:#d9d7d0;
    border-radius:4px 4px 0 0;
  }
  .body{
    padding:18px;
  }
  .step{
    font-size:12px;
    line-height:16px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
  }
  .step em{
    font-style:normal;
    color:var(--ink);
    border-bottom:2px solid var(--accent);
    padding-bottom:1px;
  }
  h1{
    font-size:19px;
    line-height:26px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  .lede{
    font-size:14px;
    line-height:20px;
    color:var(--muted);
    margin:0 0 18px;
  }
  .sub{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 10px;
  }
  .list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    height:40px;
  }
  .row + .row{margin-top:8px;}
  .thumb{
    display:block;
    width:40px;
    height:40px;
    object-fit:cover;
    background:#d9d7d0;
    border-radius:4px;
    flex:none;
  }
  .rt{min-width:0;flex:1;}
  .name{
    font-size:14px;
    line-height:18px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:12px;
    line-height:16px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .check{
    flex:none;
    width:20px;
    height:20px;
    border-radius:10px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .browse{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    height:44px;
    margin-top:12px;
    padding:0 14px;
    border:1.5px solid var(--accent);
    border-radius:4px;
    background:#fffdf3;
  }
  .browse .bl{
    font-size:14px;
    line-height:18px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .browse .br{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
  }
  .browse .count{
    font-size:12px;
    line-height:16px;
    font-weight:600;
    color:var(--muted);
  }
  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .dots{display:flex;gap:4px;align-items:center;}
  .dots span{
    display:block;
    width:18px;
    height:3px;
    background:#e3e1da;
    border-radius:4px;
  }
  .dots span.on{background:var(--accent);}
  .acts{display:flex;align-items:center;gap:8px;}
  .skip{
    font-size:14px;
    line-height:40px;
    font-weight:500;
    color:var(--muted);
    padding:0 8px;
  }
  .next{
    height:40px;
    line-height:40px;
    padding:0 20px;
    background:var(--accent);
    color:#1b1a17;
    font-size:14px;
    font-weight:700;
    border-radius:4px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/340/72/friends?lock=8060" width="340" height="72" alt="Four friends talking together on a stoop">
      <div class="body">
        <p class="step"><em>Step 2</em> of 4</p>
        <h1>Pick your first circle</h1>
        <p class="lede">Every post lands in one circle.</p>

        <p class="sub">Suggested near Oak Park</p>
        <ul class="list">
          <li class="row">
            <img class="thumb" src="https://loremflickr.com/40/40/cafe?lock=8061" width="40" height="40" alt="Counter of a neighborhood coffee shop">
            <div class="rt">
              <div class="name">Morning Coffee Crew</div>
              <div class="meta">312 members · 2 posts today</div>
            </div>
            <span class="check" aria-label="Selected">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 6.4L4.7 9 10 3.4" stroke="#1b1a17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </li>
          <li class="row">
            <img class="thumb" src="https://loremflickr.com/40/40/street?lock=8062" width="40" height="40" alt="Tree-lined residential street at dusk">
            <div class="rt">
              <div class="name">Oak Park Walkers</div>
              <div class="meta">148 members · 6 posts today</div>
            </div>
          </li>
          <li class="row">
            <img class="thumb" src="https://loremflickr.com/40/40/party?lock=8063" width="40" height="40" alt="Crowd at a small live music night">
            <div class="rt">
              <div class="name">Friday Live Music</div>
              <div class="meta">526 members · 4 posts today</div>
            </div>
          </li>
        </ul>

        <div class="browse">
          <span class="bl">Browse all circles</span>
          <span class="br">
            <span class="count">48 nearby</span>
            <svg width="7" height="12" viewBox="0 0 7 12" fill="none" aria-hidden="true">
              <path d="M1.2 1.2L5.6 6l-4.4 4.8" stroke="#1b1a17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>

        <div class="footer">
          <div class="dots" aria-label="Step 2 of 4">
            <span class="on"></span><span class="on"></span><span></span><span></span>
          </div>
          <div class="acts">
            <span class="skip">Skip</span>
            <span class="next">Next</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
