<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Accounts | Tallyoak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe1dc;
      color: #22251f;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #f3f4f1;
    }

    .topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      padding: 12px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e1e3dd;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #30342c;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      justify-self: end;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #6f782f;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      padding: 18px 20px 12px;
    }

    .intro {
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #6f782f;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 7px;
      max-width: 320px;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .intro-copy {
      margin: 0;
      max-width: 340px;
      color: #676b62;
      font-size: 14px;
      line-height: 21px;
    }

    .account-section + .account-section {
      margin-top: 18px;
    }

    .section-heading {
      margin: 0 0 8px;
      color: #52574d;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
    }

    .account-list {
      background: #ffffff;
      border: 1px solid #e0e2dc;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(41, 46, 34, 0.07);
    }

    .account-row {
      width: 100%;
      margin: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto 24px;
      gap: 11px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid #e8e9e4;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .account-row:last-child {
      border-bottom: 0;
    }

    .account-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #eceee7;
      color: #515844;
      font-size: 13px;
      font-weight: 700;
    }

    .account-copy {
      min-width: 0;
    }

    .account-name {
      display: block;
      overflow: hidden;
      color: #252821;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-meta {
      display: block;
      margin-top: 1px;
      color: #74786f;
      font-size: 12px;
      line-height: 17px;
      font-weight: 400;
    }

    .balance {
      color: #353930;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .account-row:not(.selected) .balance {
      color: #93978c;
    }

    .check {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border: 1.5px solid #a6aaa0;
      border-radius: 6px;
      color: transparent;
      background: #ffffff;
    }

    .account-row.selected .check {
      border-color: #6f782f;
      background: #6f782f;
      color: #ffffff;
    }

    .action-area {
      flex: 0 0 auto;
      padding: 12px 20px;
      background: #ffffff;
      border-top: 1px solid #e1e3dd;
    }

    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #e6e8e1;
    }

    .total-block {
      min-width: 0;
    }

    .total-block.excluded {
      text-align: right;
      border-left: 1px solid #eceee7;
      padding-left: 12px;
    }

    .total-label {
      display: block;
      color: #74786f;
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
    }

    .total-block.excluded .total-label {
      color: #8d9187;
    }

    .total-value {
      display: block;
      margin-top: 1px;
      color: #2f3527;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .total-block.excluded .total-value {
      color: #9a9e93;
      font-weight: 500;
    }

    .primary-button {
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #646d29;
      border-radius: 6px;
      background: #6f782f;
      color: #ffffff;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      text-align: center;
    }

    .tabbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px 10px;
      background: #ffffff;
      border-top: 1px solid #dfe1db;
    }

    .tab {
      min-width: 0;
      padding: 2px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #777b72;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab.active {
      color: #6f782f;
      font-weight: 700;
    }

    .tab svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="topbar-title">Select accounts</p>
      <div class="brand-mark" aria-label="Tallyoak">TO</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">NET WORTH</p>
        <h1 id="page-title">Choose accounts to include</h1>
        <p class="intro-copy">Select the balances counted in your overview.</p>
      </section>

      <section class="account-section" aria-labelledby="banking-heading">
        <h2 class="section-heading" id="banking-heading">Everyday banking</h2>
        <div class="account-list">
          <button class="account-row selected" type="button" aria-pressed="true">
            <span class="account-mark">NC</span>
            <span class="account-copy">
              <span class="account-name">Daily Checking</span>
              <span class="account-meta">North Creek • 4821</span>
            </span>
            <span class="balance">$4,286.14</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15">
                <path d="m6.8 12.3 3.2 3.2 7.2-7.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="account-row selected" type="button" aria-pressed="true">
            <span class="account-mark">NC</span>
            <span class="account-copy">
              <span class="account-name">Rainy Day Savings</span>
              <span class="account-meta">North Creek • 1057</span>
            </span>
            <span class="balance">$12,940.00</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15">
                <path d="m6.8 12.3 3.2 3.2 7.2-7.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="account-row" type="button" aria-pressed="false">
            <span class="account-mark">HB</span>
            <span class="account-copy">
              <span class="account-name">Household Checking</span>
              <span class="account-meta">Harbor Bend • 7714</span>
            </span>
            <span class="balance">$2,118.63</span>
            <span class="check" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <section class="account-section" aria-labelledby="investing-heading">
        <h2 class="section-heading" id="investing-heading">Investing</h2>
        <div class="account-list">
          <button class="account-row selected" type="button" aria-pressed="true">
            <span class="account-mark">FH</span>
            <span class="account-copy">
              <span class="account-name">Brokerage Cash</span>
              <span class="account-meta">Fieldhouse • 3309</span>
            </span>
            <span class="balance">$8,604.52</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15">
                <path d="m6.8 12.3 3.2 3.2 7.2-7.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="account-row" type="button" aria-pressed="false">
            <span class="account-mark">FH</span>
            <span class="account-copy">
              <span class="account-name">Roth IRA</span>
              <span class="account-meta">Fieldhouse • 9126</span>
            </span>
            <span class="balance">$31,275.80</span>
            <span class="check" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>

    <div class="action-area">
      <div class="totals">
        <div class="total-block">
          <span class="total-label">Included · 3 accounts</span>
          <span class="total-value">$25,830.66</span>
        </div>
        <div class="total-block excluded">
          <span class="total-label">Left out · 2 accounts</span>
          <span class="total-value">$33,394.43</span>
        </div>
      </div>
      <button class="primary-button" type="button">Add 3 accounts to net worth</button>
    </div>

    <nav class="tabbar" aria-label="Primary navigation">
      <div class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.2 12 4l8 7.2v8.3H14v-5h-4v5H4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        <span>Overview</span>
      </div>
      <div class="tab active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M3.5 9.5h17M7.5 14h3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Accounts</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 18V9m7 9V5m7 13v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Plan</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 19c.7-3.3 3-5 6.5-5s5.8 1.7 6.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Profile</span>
      </div>
    </nav>
  </div>
</body>
</html>
