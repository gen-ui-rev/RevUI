<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf0;
      color: #17232d;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px;
      background: #f8fafb;
    }

    .success-card {
      padding: 22px 24px 24px;
      text-align: center;
      background: #ffffff;
      border: 2px solid #8ed0ed;
      border-top: 6px solid #188fc8;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(37, 76, 96, 0.08);
    }

    .celebration {
      display: block;
      width: 76px;
      margin: 0 auto 6px;
    }

    .status-label {
      margin: 0 0 5px;
      color: #117fb5;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    h1 {
      margin: 0;
      color: #172f3c;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .lesson-name {
      margin: 17px 0 0;
      color: #304752;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
    }

    .saved-note {
      margin: 5px auto 0;
      max-width: 250px;
      color: #60717b;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 400;
    }

    .completion {
      margin-top: 20px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #eaf7fc;
      border-left: 4px solid #188fc8;
      border-radius: 6px;
      text-align: left;
    }

    .completion-label {
      color: #58707d;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
    }

    .completion-value {
      flex: 0 0 auto;
      color: #0d709f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .primary-action {
      width: 100%;
      margin-top: 20px;
      padding: 14px 18px;
      border: 0;
      border-radius: 6px;
      background: #188fc8;
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="success-card" aria-labelledby="success-title">
      <svg class="celebration" viewBox="0 0 104 94" role="img" aria-label="Lesson completed successfully">
        <path d="M18 27L11 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M86 27L93 21" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M29 12L26 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <path d="M75 12L78 4" fill="none" stroke="#31A6DE" stroke-width="4" stroke-linecap="round"/>
        <circle cx="8" cy="48" r="3" fill="#7DC9EB"/>
        <circle cx="96" cy="48" r="3" fill="#7DC9EB"/>
        <path d="M17 68L9 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
        <path d="M87 68L95 72" fill="none" stroke="#7DC9EB" stroke-width="4" stroke-linecap="round"/>
        <circle cx="52" cy="50" r="34" fill="#31A6DE"/>
        <path d="M36 50L47 61L69 38" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <p class="status-label">Completed</p>
      <h1 id="success-title">Lesson complete</h1>

      <p class="lesson-name">Ordering at a Café</p>
      <p class="saved-note">Your lesson is finished and your Northword course has been updated.</p>

      <div class="completion">
        <span class="completion-label">Course progress</span>
        <span class="completion-value">8 of 10</span>
      </div>

      <button class="primary-action" type="button">Continue learning</button>
    </section>
  </div>
</body>
</html>
