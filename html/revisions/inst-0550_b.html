<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e6e2;
      color: #242422;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f2f1ed;
    }

    .action-sheet {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d8d7d2;
      border-top: 4px solid #30312f;
      border-radius: 10px;
      padding: 22px 22px 8px;
    }

    .sheet-header {
      padding-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #62625e;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #242422;
      font-size: 22px;
      line-height: 1.18;
      font-weight: 600;
    }

    .post-context {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .post-context img {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      object-fit: cover;
      display: block;
      background: #d5d2ca;
      border-radius: 6px;
      opacity: 0.9;
    }

    .post-copy {
      min-width: 0;
    }

    .post-title {
      margin: 0;
      color: #55554f;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .post-facts {
      margin-top: 14px;
      border: 1px solid #dcdbd5;
      border-radius: 8px;
      background: #f4f3ef;
      padding: 12px 14px;
    }

    .fact {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid #e2e1db;
    }

    .fact:last-child {
      border-bottom: 0;
    }

    .fact-label {
      color: #85847e;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      flex: 0 0 auto;
    }

    .fact-value {
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      text-align: right;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      border-top: 1px solid #d8d7d2;
    }

    .action {
      width: 100%;
      display: block;
      padding: 11px 0;
      border: 0;
      border-bottom: 1px solid #deddd8;
      background: transparent;
      color: #242422;
      text-align: left;
      font: inherit;
      cursor: default;
    }

    .action:last-child {
      border-bottom: 0;
    }

    .action-name {
      display: block;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
    }

    .action-detail {
      display: block;
      margin-top: 2px;
      color: #6b6a65;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-sheet" aria-labelledby="post-options-title">
      <header class="sheet-header">
        <p class="eyebrow">Your post</p>
        <h1 id="post-options-title">Choose what to do</h1>
        <div class="post-context">
          <img src="https://loremflickr.com/44/44/cafe?lock=7410" width="44" height="44" alt="Coffee and notebooks on a cafe table">
          <div class="post-copy">
            <p class="post-title">Saturday at Willow Cafe</p>
          </div>
        </div>

        <dl class="post-facts">
          <div class="fact">
            <dt class="fact-label">Audience</dt>
            <dd class="fact-value">Cedar Circle &middot; private</dd>
          </div>
          <div class="fact">
            <dt class="fact-label">Posted</dt>
            <dd class="fact-value">June 8, 9:42 AM</dd>
          </div>
          <div class="fact">
            <dt class="fact-label">Activity</dt>
            <dd class="fact-value">14 likes, 3 comments</dd>
          </div>
        </dl>
      </header>

      <div class="actions" role="menu" aria-label="Available post actions">
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Edit post</span>
          <span class="action-detail">Update the text or photo</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Change audience</span>
          <span class="action-detail">Choose who can see this post</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Delete post</span>
          <span class="action-detail">Remove it from Cedar Circle</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
