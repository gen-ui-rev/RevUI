<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence — Meeting buffer</title>
<style>
  :root{
    --accent:#8A7864;
    --ink:#211f1c;
    --muted:#6E6862;
    --line:#E2DDD6;
  }
  html,body{margin:0;}
  body{
    background:#ECEAE6;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    background:#F5F3F0;
    padding:44px 32px;
  }
  .card{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px 20px 20px;
  }
  .title{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin:0;
    letter-spacing:-0.1px;
  }
  .sub{
    font-size:14px;
    font-weight:400;
    color:var(--muted);
    margin:6px 0 0;
    line-height:1.45;
  }
  .valuerow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:24px;
  }
  .value{
    font-size:40px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:-1px;
    line-height:1;
  }
  .value .unit{
    font-size:16px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0;
    margin-left:6px;
  }
  /* Steppers: quiet, borderless tone — soft tinted circles, muted glyphs.
     The minus reads dimmer since 15 min is one step above the floor. */
  .steppers{
    display:flex;
    gap:10px;
  }
  .step{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F1EEE9;
  }
  .step.minus{
    background:#F6F4F1;
  }
  .step-hint{
    margin:14px 0 0;
    font-size:12px;
    color:#9A938B;
    text-align:right;
    letter-spacing:0.1px;
  }
  .slider{
    position:relative;
    height:22px;
    margin:16px 11px 0;
  }
  .track{
    position:absolute;
    left:0;right:0;top:9px;
    height:4px;
    border-radius:2px;
    background:#E8E4DE;
  }
  .fill{
    position:absolute;
    left:0;top:9px;
    width:50%;
    height:4px;
    border-radius:2px;
    background:var(--accent);
  }
  .knob{
    position:absolute;
    top:0;
    left:50%;
    margin-left:-11px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--accent);
    box-sizing:content-box;
  }
  .knob .core{
    position:absolute;
    left:5px;top:5px;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--accent);
  }
  .ends{
    display:flex;
    justify-content:space-between;
    margin:10px 11px 0;
    font-size:12px;
    color:var(--muted);
  }
  .note{
    margin:22px 0 0;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
  }
  .note strong{
    font-weight:600;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1 class="title">Buffer after meetings</h1>
      <p class="sub">Cadence holds this gap open at the end of every event you accept.</p>

      <div class="valuerow">
        <div class="value">15<span class="unit">minutes</span></div>
        <div class="steppers">
          <div class="step minus" aria-label="Decrease">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2.5 7h9" stroke="#B3ABA1" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="step plus" aria-label="Increase">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 2.5v9M2.5 7h9" stroke="#7C746B" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <p class="step-hint">Adjusts in 5 minute steps</p>

      <div class="slider">
        <div class="track"></div>
        <div class="fill"></div>
        <div class="knob"><span class="core"></span></div>
      </div>
      <div class="ends">
        <span>None</span>
        <span>30 min</span>
      </div>

      <p class="note">Applies to <strong>Design Weekly</strong> and 6 other recurring events on your work calendar.</p>
    </div>
  </div>
</body>
</html>
