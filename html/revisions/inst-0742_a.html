<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medication reminder schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:#dfe0dc;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#1c1d1a;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:1024px;
    height:768px;
    padding:52px;
    background:#e9e9e5;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    width:920px;
    background:#ffffff;
    border-radius:10px;
    box-shadow:0 8px 28px rgba(30,31,26,.11);
  }
  .card-header{
    padding:27px 34px 23px;
    border-bottom:1px solid #e8e9e3;
  }
  .eyebrow{
    margin:0 0 5px;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:#5f6b33;
    font-weight:700;
  }
  h1{
    margin:0;
    font-size:24px;
    font-weight:700;
    line-height:1.28;
  }
  .family{
    margin:6px 0 0;
    color:#717568;
    font-size:14px;
  }
  .columns{
    display:grid;
    grid-template-columns:390px 1fr;
  }
  .left{
    padding:26px 24px 30px;
    border-right:1px solid #e8e9e3;
  }
  .hero{
    display:block;
    width:342px;
    height:90px;
    object-fit:cover;
    background:#d6d7cf;
    border-radius:7px;
  }
  .time-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-top:25px;
  }
  .time-label{
    margin:0 0 4px;
    color:#74786b;
    font-size:13px;
    font-weight:500;
  }
  .time{
    font-size:48px;
    font-weight:700;
    line-height:1.05;
    letter-spacing:-.04em;
    color:#5f6b33;
  }
  .sub{
    margin:7px 0 0;
    font-size:13px;
    color:#767a6d;
  }
  .toggle{
    width:52px;
    height:30px;
    border-radius:8px;
    background:#5f6b33;
    padding:4px;
    display:flex;
    justify-content:flex-end;
    flex:none;
  }
  .knob{
    width:22px;
    height:22px;
    border-radius:6px;
    background:#ffffff;
    box-shadow:0 1px 3px rgba(0,0,0,.16);
  }
  .right{
    padding:27px 30px 30px;
  }
  .section-title{
    margin:0 0 12px;
    font-size:13px;
    font-weight:700;
    color:#383b33;
  }
  .days{
    display:flex;
    gap:8px;
  }
  .day{
    flex:1 1 0;
    height:42px;
    border-radius:7px;
    background:#f1f2ed;
    color:#888c7d;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .day.on{
    background:#5f6b33;
    color:#ffffff;
  }
  .note{
    margin:10px 0 22px;
    font-size:12px;
    line-height:1.45;
    color:#767a6d;
  }
  .settings{
    padding:16px 18px 4px;
    border-radius:8px;
    background:#f2f3ed;
  }
  .settings-heading{
    margin:0 0 5px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#687044;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:13px 0;
    border-top:1px solid #dfe1d8;
    font-size:14px;
  }
  .row:first-of-type{border-top:0;}
  .row .val{
    color:#686d5f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:500;
  }
  .save{
    margin-top:18px;
    height:46px;
    border-radius:7px;
    background:#5f6b33;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="card-header">
        <p class="eyebrow">Medication reminder</p>
        <h1>Evening medication reminder</h1>
        <p class="family">For Elena Martinez</p>
      </div>

      <div class="columns">
        <section class="left" aria-label="Reminder time">
          <img class="hero" src="https://loremflickr.com/342/90/study?lock=9883" width="342" height="90" alt="Notebook and Spanish textbook open on a study desk">
          <div class="time-row">
            <div>
              <p class="time-label">Dose time</p>
              <div class="time">7:30 PM</div>
              <p class="sub">Local time · Chicago</p>
            </div>
            <div class="toggle" aria-label="Reminder enabled"><div class="knob"></div></div>
          </div>
        </section>

        <section class="right" aria-label="Repeat schedule and settings">
          <p class="section-title">Repeat schedule</p>
          <div class="days">
            <div class="day on">M</div>
            <div class="day on">T</div>
            <div class="day on">W</div>
            <div class="day on">T</div>
            <div class="day on">F</div>
            <div class="day">S</div>
            <div class="day">S</div>
          </div>
          <p class="note">Repeats weekdays · next reminder Wednesday, March 12</p>

          <div class="settings">
            <p class="settings-heading">Reminder settings</p>
            <div class="row">
              <span>Alert style</span>
              <span class="val">Push and email</span>
            </div>
            <div class="row">
              <span>Missed dose follow-up</span>
              <span class="val">On</span>
            </div>
          </div>

          <div class="save">Save reminder</div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
