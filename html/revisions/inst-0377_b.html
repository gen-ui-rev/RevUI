<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wanderline — Lisbon on Foot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#ff4b43;
    --ink:#f8f8f8;
    --muted:#aaaeb4;
    --panel:#25282c;
    --rule:#393c41;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#d5d6d8;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  .screen{
    width:184px;
    height:224px;
    position:relative;
    padding:7px 9px 9px;
    background:#15171a;
    color:var(--ink);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .iconbtn{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .route{
    max-width:104px;
    font-size:9px;
    font-weight:700;
    line-height:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .heading{
    margin-top:2px;
    text-align:center;
  }
  .heading h1{
    margin:0;
    font-size:15px;
    line-height:19px;
    letter-spacing:-.02em;
  }
  .heading p{
    margin:1px 0 0;
    color:var(--muted);
    font-size:8px;
    font-weight:500;
    line-height:11px;
  }
  .current{
    margin-top:7px;
    text-align:center;
  }
  .eyebrow{
    color:var(--accent);
    font-size:8px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .current h2{
    margin:3px auto 0;
    max-width:158px;
    font-size:12px;
    line-height:15px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    margin-top:7px;
  }
  .side{
    width:42px;
    color:var(--muted);
    font-size:8px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .side:first-child{text-align:right;}
  .play{
    width:44px;
    height:44px;
    flex:none;
    border:0;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .progress{
    height:3px;
    margin:7px 12px 0;
    border-radius:2px;
    background:#3b3e43;
  }
  .progress span{
    display:block;
    width:46%;
    height:3px;
    border-radius:2px;
    background:var(--accent);
  }
  .queue{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
    padding:7px 8px;
    border:1px solid var(--rule);
    border-radius:9px;
    background:var(--panel);
  }
  .queueicon{
    width:22px;
    height:22px;
    flex:none;
    border-radius:6px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
  }
  .queuebody{
    flex:1;
    min-width:0;
  }
  .queuelabel{
    color:var(--muted);
    font-size:7px;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
  }
  .queuetitle{
    margin-top:1px;
    font-size:9px;
    line-height:12px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .queuetime{
    color:var(--muted);
    font-size:8px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div class="route">Wanderline Audio</div>
      <div class="iconbtn" aria-label="More options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18.5" r="1.6"/></svg>
      </div>
    </div>

    <div class="heading">
      <h1>Lisbon on Foot</h1>
      <p>47 min walk · Stop 3 of 8</p>
    </div>

    <div class="current">
      <div class="eyebrow">Now playing</div>
      <h2>The grid the earthquake built</h2>
    </div>

    <div class="player">
      <div class="side">3:15</div>
      <button class="play" aria-label="Resume current stop">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>
      </button>
      <div class="side">7:04</div>
    </div>

    <div class="progress" aria-label="46 percent played"><span></span></div>

    <div class="queue">
      <div class="queueicon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/></svg>
      </div>
      <div class="queuebody">
        <div class="queuelabel">Next · Stop 04</div>
        <div class="queuetitle">Riding the Santa Justa lift</div>
      </div>
      <div class="queuetime">5:47</div>
    </div>
  </div>
</body>
</html>
