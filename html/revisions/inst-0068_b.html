<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Episode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dfe0e3;
      color: #202126;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 20px;
      background: #f1f1f3;
    }

    .save-card {
      width: 100%;
      padding: 24px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(28, 28, 33, 0.10);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #cc167f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .episode {
      margin: 8px 0 0;
      color: #5e6068;
      font-size: 14px;
      line-height: 1.5;
    }

    .primary-save {
      width: 100%;
      margin-top: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 4px;
      background: #cc167f;
      color: #ffffff;
      text-align: left;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .primary-copy {
      flex: 1;
      min-width: 0;
    }

    .primary-title {
      display: block;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .primary-sub {
      display: block;
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .primary-arrow {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 600;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
      color: #70717a;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      height: 1px;
      flex: 1;
      background: #e2e2e7;
      content: "";
    }

    .alt-save {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #dedee3;
      border-radius: 4px;
      background: #ffffff;
      text-align: left;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .alt-save + .alt-save {
      margin-top: 8px;
    }

    .alt-copy {
      flex: 1;
      min-width: 0;
    }

    .alt-name {
      display: block;
      color: #2d2e34;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alt-meta {
      display: block;
      margin-top: 2px;
      color: #70717a;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alt-action {
      flex: 0 0 auto;
      color: #cc167f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .note {
      margin: 14px 0 0;
      color: #70717a;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="save-card" aria-labelledby="save-title">
      <p class="eyebrow">Fablewave</p>
      <h1 id="save-title">Save episode</h1>
      <p class="episode">“Signals After Dark” from The Quiet Frequency</p>

      <button class="primary-save" type="button">
        <span class="primary-copy">
          <span class="primary-title">Save to Listen later</span>
          <span class="primary-sub">Your default list · 12 episodes</span>
        </span>
        <span class="primary-arrow" aria-hidden="true">→</span>
      </button>

      <p class="divider">Or save straight to</p>

      <button class="alt-save" type="button">
        <span class="alt-copy">
          <span class="alt-name">Evening podcasts</span>
          <span class="alt-meta">8 episodes · added Tuesday</span>
        </span>
        <span class="alt-action">Save</span>
      </button>
      <button class="alt-save" type="button">
        <span class="alt-copy">
          <span class="alt-name">Research interviews</span>
          <span class="alt-meta">23 episodes · 15 hr 05 min</span>
        </span>
        <span class="alt-action">Save</span>
      </button>

      <p class="note">One tap saves the episode — nothing is pinned to Home.</p>
    </main>
  </div>
</body>
</html>
