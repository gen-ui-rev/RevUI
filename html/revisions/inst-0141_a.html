<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiobook Actions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8e4e3;
      color: #292426;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 24px;
      background: #f8f6f5;
    }

    .audiobook-menu {
      width: 100%;
    }

    .service-name {
      margin: 0 0 8px;
      color: #766d70;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #b63862;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.28;
    }

    .book-title {
      margin: 16px 0 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .book-author {
      margin: 3px 0 0;
      color: #766d70;
      font-size: 13px;
      line-height: 1.45;
    }

    .progress-panel {
      margin-top: 15px;
      padding: 13px 14px;
      border: 1px solid #ddd5d4;
      border-radius: 10px;
      background: #ffffff;
    }

    .progress-heading,
    .progress-detail {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    .progress-heading {
      font-weight: 700;
    }

    .progress-detail {
      margin-top: 7px;
      color: #766d70;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      margin-top: 9px;
      border-radius: 99px;
      background: #e8e1e1;
    }

    .progress-value {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #b63862;
    }

    .action-list {
      margin-top: 18px;
      border-top: 1px solid #d9d3d2;
    }

    .action {
      width: 100%;
      margin: 0;
      padding: 12px 0;
      display: block;
      border: 0;
      border-bottom: 1px solid #d9d3d2;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .action-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .action-detail {
      display: block;
      margin-top: 2px;
      color: #766d70;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="audiobook-menu" aria-labelledby="action-title">
      <p class="service-name">Vela Audio</p>
      <h1 id="action-title">Choose a book action</h1>

      <p class="book-title">The Cartographer's Daughter</p>
      <p class="book-author">Written by Eliza Hart</p>

      <div class="progress-panel">
        <div class="progress-heading">
          <span>Chapter 7 of 18</span>
          <span>42%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Audiobook progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42">
          <div class="progress-value"></div>
        </div>
        <div class="progress-detail">
          <span>18:42 into chapter</span>
          <span>5 hr 14 min left</span>
        </div>
      </div>

      <div class="action-list" role="menu" aria-label="Audiobook actions">
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Continue listening</span>
          <span class="action-detail">Resume Chapter 7 from 18:42</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">View chapters</span>
          <span class="action-detail">Browse the table of contents</span>
        </button>
        <button class="action" type="button" role="menuitem">
          <span class="action-name">Download audiobook</span>
          <span class="action-detail">Save all remaining chapters offline</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
