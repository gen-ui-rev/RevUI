<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Listing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e7e6e2;
      color: #22211f;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      background: #f7f6f3;
      border: 1px solid #d9d6d0;
      box-shadow: 0 18px 50px rgba(45, 41, 35, 0.12);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 34px;
      background: #ffffff;
      border-bottom: 1px solid #dedbd5;
    }

    .brand {
      color: #282622;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }

    .section-label {
      color: #77726b;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }

    .workspace {
      min-height: 0;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px;
    }

    .report-card {
      width: 824px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #dedbd5;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(49, 43, 35, 0.07);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .heading-block {
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #e96818;
      background: #fff3e9;
      border-radius: 12px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .intro {
      margin: 8px 0 0 48px;
      color: #66625c;
      font-size: 14px;
      line-height: 20px;
    }

    .listing {
      min-width: 270px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      background: #f7f6f3;
      border: 1px solid #e3e0da;
      border-radius: 12px;
    }

    .listing img {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      background: #ddd8cf;
      border-radius: 10px;
    }

    .listing-copy {
      min-width: 0;
    }

    .listing-name {
      max-width: 190px;
      margin: 0;
      overflow: hidden;
      color: #292724;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .seller-name {
      margin: 2px 0 0;
      color: #77726b;
      font-size: 12px;
      line-height: 16px;
    }

    .divider {
      margin: 26px 0;
      border: 0;
      border-top: 1px solid #e5e2dc;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin: 0 0 14px;
      padding: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 500;
    }

    .reason-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .reason {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 15px;
      border: 1px solid #dedbd5;
      border-radius: 12px;
      color: #34312e;
      background: #ffffff;
      font-size: 14px;
      line-height: 20px;
      cursor: pointer;
    }

    .reason.selected {
      border-color: #e96818;
      background: #fff9f4;
      box-shadow: inset 0 0 0 1px #e96818;
    }

    .reason input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 1px 0 0;
      accent-color: #e96818;
      cursor: pointer;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      margin-top: 22px;
    }

    .boundary-note {
      margin: 0;
      color: #6d6862;
      font-size: 12px;
      line-height: 18px;
    }

    .submit-button {
      min-width: 172px;
      padding: 12px 22px;
      border: 1px solid #e96818;
      border-radius: 10px;
      background: #e96818;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
    }

    .submit-button:focus-visible,
    .reason:focus-within {
      outline: 3px solid rgba(233, 104, 24, 0.22);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">Marketplace</div>
      <div class="section-label">Trust &amp; safety</div>
    </header>

    <div class="workspace">
      <main class="report-card" aria-labelledby="report-title">
        <div class="card-header">
          <div class="heading-block">
            <div class="title-row">
              <span class="flag-mark" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M6 21V4.5M6 5H16.4C17.45 5 18.25 5.94 18.08 6.98L17.45 10.78C17.32 11.55 16.65 12.12 15.87 12.12H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <h1 id="report-title">Report this listing</h1>
            </div>
            <p class="intro">Choose the issue that best describes it.</p>
          </div>

          <div class="listing" aria-label="Listing being reported">
            <img src="https://loremflickr.com/48/48/furniture?lock=12770" width="48" height="48" alt="Oak side table listed for sale">
            <div class="listing-copy">
              <p class="listing-name">Oakline Side Table</p>
              <p class="seller-name">Cedar Lane Shop</p>
            </div>
          </div>
        </div>

        <hr class="divider">

        <form>
          <fieldset>
            <legend>What is wrong with this listing?</legend>
            <div class="reason-list">
              <label class="reason selected">
                <input type="radio" name="reason" checked>
                <span>Counterfeit or misleading item</span>
              </label>
              <label class="reason">
                <input type="radio" name="reason">
                <span>Prohibited or unsafe item</span>
              </label>
              <label class="reason">
                <input type="radio" name="reason">
                <span>Spam or duplicate listing</span>
              </label>
            </div>
          </fieldset>

          <div class="form-footer">
            <p class="boundary-note">A report requests a review. It does not block Cedar Lane Shop.</p>
            <button class="submit-button" type="button">Submit report</button>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
