<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Threadwell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e6e3;
      color: #27231f;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffdfb;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 14px 18px;
      background: #fffdfb;
    }

    .back-button {
      width: 40px;
      height: 40px;
      padding: 8px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: #fff0e6;
      color: #b84b13;
      cursor: pointer;
    }

    .brand {
      margin: 0;
      text-align: center;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .top-spacer {
      width: 40px;
    }

    main {
      padding: 28px 24px 0;
    }

    .recovery-section {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .recovery-mark {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 6px;
      background: #fff0e6;
      color: #dd5d19;
    }

    h1 {
      margin: 0;
      max-width: 310px;
      font-size: 30px;
      line-height: 37px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .intro {
      margin: 12px 0 26px;
      max-width: 330px;
      color: #68615b;
      font-size: 15px;
      line-height: 23px;
    }

    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    label {
      color: #37312c;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .saved-flag {
      color: #8a8079;
      font-size: 12px;
      line-height: 18px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .email-input {
      width: 100%;
      padding: 15px 16px;
      border: 0;
      border-radius: 6px;
      outline: none;
      background: #fff0e6;
      color: #27231f;
      font-size: 16px;
      line-height: 22px;
      caret-color: #1c2b4b;
      text-overflow: ellipsis;
    }

    .email-input::placeholder {
      color: #91877f;
      opacity: 1;
    }

    .clear-saved {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #dfd6cd;
      border-radius: 6px;
      background: #fffdfb;
      color: #4a423c;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
    }

    .clear-saved svg {
      flex: 0 0 auto;
      color: #8b8078;
    }

    .send-button {
      width: 100%;
      margin-top: 14px;
      padding: 15px 18px;
      border: 0;
      border-radius: 6px;
      background: #1c2b4b;
      color: #ffffff;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .security-note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 16px 0 0;
      padding: 14px;
      border-radius: 6px;
      background: #fff6f0;
      color: #6f6259;
      font-size: 14px;
      line-height: 20px;
    }

    .security-note svg {
      flex: 0 0 auto;
      margin-top: 1px;
      color: #c65217;
    }

    .sign-in {
      margin: 26px 0 0;
      text-align: center;
      color: #6d655f;
      font-size: 14px;
      line-height: 21px;
    }

    .sign-in a {
      color: #bd4d14;
      font-weight: 500;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar" aria-label="App navigation">
      <button class="back-button" type="button" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15.5 5L8.5 12L15.5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="brand">Threadwell</p>
      <span class="top-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <section class="recovery-section" aria-labelledby="recovery-title">
        <div class="recovery-mark" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
            <rect x="4.5" y="8" width="27" height="20" rx="2" stroke="currentColor" stroke-width="2.2"/>
            <path d="M6 10L18 19L30 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M23.5 25.5L27 22L30.5 25.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1 id="recovery-title">Reset your password</h1>
        <p class="intro">Enter the email connected to your account. We’ll send a secure link so you can choose a new password.</p>

        <form>
          <div class="field-head">
            <label for="recovery-email">Email address</label>
            <span class="saved-flag">Saved on this device</span>
          </div>
          <input
            class="email-input"
            id="recovery-email"
            name="email"
            type="email"
            autocomplete="email"
            value="nora.bell@example.com"
            aria-describedby="security-note"
          >

          <button class="clear-saved" type="button">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M3.5 6h13M8 6V4.5h4V6M6 6l.7 9.5h6.6L14 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Clear saved address
          </button>

          <button class="send-button" type="submit">Send reset link</button>

          <p class="security-note" id="security-note">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 2.5L16 5V9.4C16 13.1 13.6 16.2 10 17.5C6.4 16.2 4 13.1 4 9.4V5L10 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M10 7V10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="10" cy="13" r="0.9" fill="currentColor"/>
            </svg>
            <span>The link expires after 30 minutes and can only be used once.</span>
          </p>
        </form>

        <p class="sign-in">Remembered your password? <a href="#">Return to sign in</a></p>
      </section>
    </main>
  </div>
</body>
</html>
