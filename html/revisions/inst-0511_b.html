<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nourish Thread Subscription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e6e6e3;
      color: #242726;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 24px 32px;
      background: #f8f8f6;
    }

    .switch-card {
      padding: 12px 14px;
      border: 1px solid #dcded9;
      border-radius: 8px;
      background: #eef0ec;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .switch-copy {
      min-width: 0;
    }

    .switch-state {
      margin: 0;
      color: #2c302e;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }

    .switch-note {
      margin: 2px 0 0;
      color: #6b6f6c;
      font-size: 12px;
      line-height: 1.45;
    }

    .toggle {
      width: 50px;
      height: 30px;
      flex: 0 0 50px;
      padding: 3px;
      border: 0;
      border-radius: 6px;
      background: #4f5452;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font: inherit;
      cursor: pointer;
    }

    .toggle-knob {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: #f8f8f6;
      display: block;
    }

    .eyebrow {
      margin: 22px 0 8px;
      color: #6f7472;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 320px;
      color: #252827;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 8px 0 0;
      color: #606462;
      font-size: 14px;
      line-height: 1.5;
    }

    .facts {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #dcded9;
    }

    .facts li {
      padding: 9px 0;
      border-bottom: 1px solid #dcded9;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .fact-label {
      color: #74786; 
      color: #747875;
      font-weight: 500;
      white-space: nowrap;
    }

    .fact-value {
      color: #2d3130;
      font-weight: 500;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .preview {
      margin: 20px 0 0;
    }

    .preview img {
      width: 342px;
      height: 120px;
      display: block;
      object-fit: cover;
      border-radius: 6px;
      background: #d5d6d2;
    }

    .preview figcaption {
      margin-top: 10px;
      color: #656966;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="subscription-heading">
      <section class="switch-card" aria-label="Subscription preference">
        <div class="switch-copy">
          <p class="switch-state">Subscribed</p>
          <p class="switch-note">Weekly email is on</p>
        </div>
        <button class="toggle" type="button" role="switch" aria-checked="true" aria-label="Turn off weekly email subscription">
          <span class="toggle-knob" aria-hidden="true"></span>
        </button>
      </section>

      <p class="eyebrow">Nourish Thread Series</p>
      <h1 id="subscription-heading">Get Balanced Plate weekly</h1>
      <p class="intro">A practical meal guide plus a seasonal recipe.</p>

      <ul class="facts">
        <li><span class="fact-label">Delivery</span><span class="fact-value">Every Tuesday, 7am</span></li>
        <li><span class="fact-label">Sent to</span><span class="fact-value">casey.arden@example.com</span></li>
      </ul>

      <figure class="preview">
        <img src="https://loremflickr.com/342/120/salad?lock=6950" width="342" height="120" alt="A colorful prepared salad featured in the weekly meal guide">
        <figcaption>This week’s guide: building a satisfying lunch.</figcaption>
      </figure>
    </main>
  </div>
</body>
</html>
