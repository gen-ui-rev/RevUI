<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily protein target</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 24px 0;
    background: #e9e7e4;
    font-family: 'Roboto', system-ui, sans-serif;
    color: #f5f5f4;
  }
  .screen {
    width: 184px;
    height: 224px;
    background: #0f0f0e;
    border-radius: 46px;
    padding: 18px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .eyebrow {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #a8a29e;
    margin: 0 0 12px;
    text-align: center;
  }
  .dial {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }
  .step {
    flex: none;
    width: 34px;
    height: 34px;
    border: 1px solid #44403c;
    border-radius: 50%;
    background: #1c1917;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e7e5e4;
  }
  .value {
    flex: 1;
    text-align: center;
  }
  .value .num {
    display: block;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.03em;
  }
  .value .unit {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #a8a29e;
    margin-top: 4px;
  }
  .track {
    position: relative;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: #292524;
    margin-top: 16px;
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 46.9%;
    border-radius: 3px;
    background: #d6d3d1;
  }
  .knob {
    position: absolute;
    top: -4px;
    left: 46.9%;
    transform: translateX(-50%);
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #fafaf9;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    width: 100%;
    margin-top: 8px;
    font-size: 9px;
    color: #78716c;
  }
  .note {
    width: 100%;
    margin: 12px 0 0;
    font-size: 10px;
    line-height: 1.2;
    color: #d6d3d1;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note strong { font-weight: 500; color: #fafaf9; }
  .save {
    width: 100%;
    margin-top: auto;
    border-radius: 18px;
    background: #f5f5f4;
    color: #1c1917;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .02em;
    padding: 10px 0;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="eyebrow">Protein target</p>

    <div class="dial">
      <span class="step" aria-label="Decrease by 5 grams">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9"/></svg>
      </span>
      <span class="value">
        <span class="num">135</span>
        <span class="unit">grams / day</span>
      </span>
      <span class="step" aria-label="Increase by 5 grams">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5h9M7.5 3v9"/></svg>
      </span>
    </div>

    <div class="track">
      <div class="fill"></div>
      <div class="knob"></div>
    </div>
    <div class="scale">
      <span>60 g</span>
      <span>220 g</span>
    </div>

    <p class="note">Suggested <strong>120&ndash;150 g</strong></p>

    <div class="save">Save target</div>
  </div>
</body>
</html>
