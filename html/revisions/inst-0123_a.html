<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinned Stay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      background: #dde1e5;
      color: #202328;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 768px;
      height: 1024px;
      padding: 64px 56px;
      background: #f1f3f5;
    }

    .pin-card {
      padding: 38px 40px 36px;
      background: #ffffff;
      border: 1px solid #e6e8eb;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(31, 35, 40, 0.08);
    }

    .context {
      margin: 0 0 24px;
      color: #6e737b;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      color: #a96100;
    }

    .status svg {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
    }

    .status h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.25;
    }

    .stay {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 36px;
      align-items: center;
      padding: 26px 0;
      border-top: 1px solid #e3e5e8;
      border-bottom: 1px solid #e3e5e8;
    }

    .stay-copy {
      min-width: 0;
    }

    .stay h2 {
      margin: 0 0 8px;
      color: #202328;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
    }

    .property-type {
      margin: 0;
      color: #656a72;
      font-size: 14px;
      line-height: 1.55;
    }

    .booking-summary {
      text-align: right;
    }

    .dates {
      margin: 0 0 6px;
      color: #656a72;
      font-size: 14px;
      line-height: 1.5;
    }

    .price {
      margin: 0;
      color: #202328;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
    }

    .note {
      margin: 24px 0 28px;
      max-width: 540px;
      color: #555b63;
      font-size: 14px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      padding-top: 24px;
      border-top: 1px solid #eceef0;
    }

    button {
      min-height: 48px;
      padding: 13px 22px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
    }

    .details-button {
      border: 1px solid #cfd3d8;
      background: #ffffff;
      color: #34383e;
    }

    .remove-button {
      border: 1px solid #d68a15;
      background: #fff8eb;
      color: #8a5100;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="pin-card" aria-labelledby="pin-title">
      <p class="context">Northpath · Lisbon trip</p>

      <div class="status">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8.2 3.75h7.6l-1.05 5.1 2.65 2.8v1.6H6.6v-1.6l2.65-2.8-1.05-5.1Z" fill="#E49A24" stroke="#A96100" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 13.25v7" stroke="#A96100" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <h1 id="pin-title">Pinned to the top</h1>
      </div>

      <div class="stay">
        <div class="stay-copy">
          <h2>Alder House Alfama</h2>
          <p class="property-type">Apartment · 2 guests</p>
        </div>
        <div class="booking-summary">
          <p class="dates">June 14–18</p>
          <p class="price">$684 total before taxes</p>
        </div>
      </div>

      <p class="note">Only you can see this pin. It changes the order of your options without saving the stay or sending a public like.</p>

      <div class="actions" aria-label="Stay actions">
        <button class="details-button" type="button">View stay details</button>
        <button class="remove-button" type="button">Remove pin</button>
      </div>
    </section>
  </div>
</body>
</html>
