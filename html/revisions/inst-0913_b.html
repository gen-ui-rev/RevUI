<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Performance</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e3e5e8;
      color: #20252b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px 16px;
      background: #f4f5f7;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: #1d2630;
      font-size: 25px;
      line-height: 1.18;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #69717a;
      font-size: 13px;
      line-height: 1.4;
    }

    .week {
      flex: 0 0 auto;
      margin: 4px 0 0;
      padding: 5px 9px;
      color: #505861;
      background: #ffffff;
      border: 1px solid #dfe2e5;
      border-radius: 20px;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
      white-space: nowrap;
    }

    .rank-panel {
      margin-top: 13px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      color: #ffffff;
      background: #27384c;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(30, 45, 62, 0.16);
    }

    .rank-label {
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      opacity: 0.72;
    }

    .rank-value {
      margin-top: 1px;
      font-size: 46px;
      line-height: 0.98;
      font-weight: 850;
      letter-spacing: -1.5px;
    }

    .rank-gap {
      margin-top: 7px;
      color: #dfe8f1;
      font-size: 13px;
      line-height: 1.35;
    }

    .rank-gap strong {
      color: #ffffff;
      font-weight: 800;
    }

    .section-heading {
      margin: 15px 2px 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: #30363d;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 800;
    }

    .section-heading span {
      color: #858b92;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 650;
    }

    .rep-list {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
      list-style: none;
    }

    .rep-row {
      padding: 8px 10px 9px;
      background: #ffffff;
      border: 1px solid #e5e7ea;
      border-radius: 11px;
      box-shadow: 0 2px 7px rgba(30, 36, 43, 0.04);
    }

    .rep-row.current {
      background: #fff8e7;
      border-color: #e9c970;
    }

    .rep-main {
      display: grid;
      grid-template-columns: 24px 29px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
    }

    .position {
      color: #6e747b;
      font-size: 13px;
      line-height: 1;
      font-weight: 800;
    }

    .initials {
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4f5964;
      background: #edf0f3;
      border-radius: 50%;
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
    }

    .current .initials {
      color: #ffffff;
      background: #cc8a12;
    }

    .rep-name {
      min-width: 0;
      overflow: hidden;
      color: #2c3238;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .you {
      margin-left: 4px;
      color: #9a6408;
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .amount {
      color: #20272e;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 800;
      white-space: nowrap;
    }

    .bar-track {
      margin: 6px 0 0 65px;
      height: 4px;
      background: #eceff1;
      border-radius: 3px;
    }

    .bar {
      width: var(--bar-width);
      height: 4px;
      background: #71859a;
      border-radius: 3px;
    }

    .current .bar-track {
      background: #f1e4bf;
    }

    .current .bar {
      background: #d49420;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topline">
      <div>
        <h1>Closed revenue</h1>
        <p class="subtitle">Enterprise sales team</p>
      </div>
      <p class="week">Mar 3–9</p>
    </header>

    <section class="rank-panel" aria-label="Your weekly standing">
      <span class="rank-label">Your current rank</span>
      <span class="rank-value">#4</span>
      <span class="rank-gap"><strong>$18.4K</strong> to overtake third place</span>
    </section>

    <div class="section-heading">
      <h2>Team comparison</h2>
      <span>Weekly closed</span>
    </div>

    <ol class="rep-list" aria-label="Representatives ranked by weekly closed revenue">
      <li class="rep-row" style="--bar-width: 100%;">
        <div class="rep-main">
          <span class="position">1</span>
          <span class="initials" aria-hidden="true">MV</span>
          <span class="rep-name">Mara Venn</span>
          <span class="amount">$128.6K</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div class="bar"></div></div>
      </li>

      <li class="rep-row" style="--bar-width: 87%;">
        <div class="rep-main">
          <span class="position">2</span>
          <span class="initials" aria-hidden="true">ER</span>
          <span class="rep-name">Ellis Rowe</span>
          <span class="amount">$112.4K</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div class="bar"></div></div>
      </li>

      <li class="rep-row" style="--bar-width: 75%;">
        <div class="rep-main">
          <span class="position">3</span>
          <span class="initials" aria-hidden="true">ND</span>
          <span class="rep-name">Nolan Dune</span>
          <span class="amount">$96.8K</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div class="bar"></div></div>
      </li>

      <li class="rep-row current" style="--bar-width: 61%;" aria-current="true">
        <div class="rep-main">
          <span class="position">4</span>
          <span class="initials" aria-hidden="true">CS</span>
          <span class="rep-name">Casey Stone <span class="you">You</span></span>
          <span class="amount">$78.4K</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div class="bar"></div></div>
      </li>

      <li class="rep-row" style="--bar-width: 56%;">
        <div class="rep-main">
          <span class="position">5</span>
          <span class="initials" aria-hidden="true">AL</span>
          <span class="rep-name">Arden Lake</span>
          <span class="amount">$72.1K</span>
        </div>
        <div class="bar-track" aria-hidden="true"><div class="bar"></div></div>
      </li>
    </ol>
  </div>
</body>
</html>
