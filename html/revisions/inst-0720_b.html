<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #24232a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    /* The card becomes a bottom sheet: flush to the left, right and bottom
       edges of the screen, content kept inset. */
    .screen {
      position: relative;
      width: 390px;
      height: 560px;
      padding: 0;
      overflow: hidden;
      background: #f3f4f6;
    }

    .context {
      padding: 0;
    }

    .context-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e7e6eb;
    }

    .context-title {
      font-size: 15px;
      font-weight: 700;
    }

    .context-edit {
      color: #7152b8;
      font-size: 14px;
      font-weight: 700;
    }

    .context-group {
      margin: 10px 20px 0;
      color: #8b8894;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .scrim {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 28, 42, 0.4);
    }

    .move-card {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      width: 100%;
      padding: 20px 24px 24px;
      background: #ffffff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 28px rgba(32, 29, 43, 0.22);
    }

    .grabber {
      width: 40px;
      height: 4px;
      margin: 0 auto 14px;
      border-radius: 2px;
      background: #dcdae1;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #7152b8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .balance {
      margin: 5px 0 0;
      color: #55535d;
      font-size: 14px;
      font-weight: 500;
    }

    .guidance {
      margin: 14px 0 14px;
      color: #696771;
      font-size: 14px;
      line-height: 1.55;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
      padding: 0;
      color: #3f3d46;
      font-size: 14px;
      font-weight: 700;
    }

    .destination-list {
      border: 1px solid #dedde3;
      border-radius: 6px;
    }

    .destination {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
    }

    .destination + .destination {
      border-top: 1px solid #e5e4e9;
    }

    .destination:has(input:checked) {
      background: #f4f0fb;
    }

    .destination:first-child {
      border-radius: 5px 5px 0 0;
    }

    .destination:last-child {
      border-radius: 0 0 5px 5px;
    }

    .destination input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: #7152b8;
    }

    .destination-copy {
      min-width: 0;
    }

    .destination-name {
      display: block;
      color: #29272f;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
    }

    .destination-count {
      display: block;
      margin-top: 2px;
      color: #77747e;
      font-size: 12px;
      line-height: 1.35;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 6px;
      font: 700 14px 'Manrope', system-ui, sans-serif;
      cursor: pointer;
    }

    .cancel {
      flex: 0 0 auto;
      border: 1px solid #d7d5dc;
      background: #ffffff;
      color: #4c4953;
    }

    .confirm {
      flex: 1;
      border: 1px solid #7152b8;
      background: #7152b8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="context">
      <div class="context-bar">
        <span class="context-title">Accounts</span>
        <span class="context-edit">Edit</span>
      </div>
      <p class="context-group">SAVINGS GOALS</p>
    </div>

    <div class="scrim"></div>

    <form class="move-card">
      <div class="grabber"></div>
      <p class="eyebrow">MOVE ACCOUNT</p>
      <h1>Move Rainy Day Fund</h1>
      <p class="balance">$8,420.16 balance</p>

      <p class="guidance">
        The account keeps its position inside the group.
      </p>

      <fieldset>
        <legend>Destination</legend>
        <div class="destination-list">
          <label class="destination">
            <input type="radio" name="destination" checked>
            <span class="destination-copy">
              <span class="destination-name">Savings goals</span>
              <span class="destination-count">3 accounts</span>
            </span>
          </label>
          <label class="destination">
            <input type="radio" name="destination">
            <span class="destination-copy">
              <span class="destination-name">Everyday money</span>
              <span class="destination-count">2 accounts</span>
            </span>
          </label>
          <label class="destination">
            <input type="radio" name="destination">
            <span class="destination-copy">
              <span class="destination-name">Long-term investing</span>
              <span class="destination-count">4 accounts</span>
            </span>
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <button class="cancel" type="button">Cancel</button>
        <button class="confirm" type="submit">Move account</button>
      </div>
    </form>
  </div>
</body>
</html>
