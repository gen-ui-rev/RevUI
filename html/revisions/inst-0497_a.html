<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Photo Estimates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e7e3;
      color: #25292d;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 24px;
      background: #f5f4f1;
    }

    .feature-card {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 6px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #5d6770;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #4f5962;
      font-size: 26px;
      font-weight: 700;
      line-height: 32px;
    }

    .intro {
      margin: 8px 0 14px;
      color: #555b60;
      font-size: 15px;
      font-weight: 400;
      line-height: 21px;
    }

    .hero {
      width: 310px;
      height: 144px;
      display: block;
      object-fit: cover;
      background: #d8dbdc;
      border-radius: 6px;
    }

    .how-it-works {
      margin-top: 12px;
      padding: 12px;
      background: #eceeef;
      border-radius: 6px;
    }

    .how-it-works h2 {
      margin: 0 0 4px;
      color: #353b40;
      font-size: 15px;
      font-weight: 700;
      line-height: 20px;
    }

    .how-it-works p {
      margin: 0;
      color: #596067;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }

    .confirm {
      width: 100%;
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #3c5a4a;
      color: #ffffff;
      font: 500 15px/20px 'Roboto', system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .lens {
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .permission-note {
      margin: 8px 0 0;
      color: #6d757c;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="feature-card" aria-labelledby="feature-title">
      <p class="eyebrow">Meal photo estimates</p>
      <h1 id="feature-title">Estimate nutrition from a photo</h1>
      <p class="intro">Nourish Lane identifies visible foods and drafts an editable estimate.</p>

      <img
        class="hero"
        src="https://loremflickr.com/310/144/salad?lock=6790"
        width="310"
        height="144"
        alt="A prepared salad with vegetables ready to be photographed"
      >

      <div class="how-it-works">
        <h2>For a clearer estimate</h2>
        <p>Fill the frame with the full plate.</p>
      </div>

      <button class="confirm" type="button"><span class="lens" aria-hidden="true"></span>Open camera</button>
      <p class="permission-note">Nothing is saved until you confirm.</p>
    </article>
  </div>
</body>
</html>
