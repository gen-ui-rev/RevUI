<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #ebe8ea;
      color: #282326;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    /* Whole leaderboard panel lifted off the page as one rounded card */
    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 24px;
      background: #fcfafb;
      border-radius: 26px;
      box-shadow:
        0 0 0 1px rgba(40, 35, 38, 0.05),
        0 1px 2px rgba(40, 35, 38, 0.06),
        0 6px 14px rgba(40, 35, 38, 0.07),
        0 18px 38px rgba(40, 35, 38, 0.10);
    }

    .service-name {
      margin: 0 0 6px;
      color: #8a747f;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .course-period {
      margin: 7px 0 0;
      color: #74676e;
      font-size: 14px;
      line-height: 1.5;
    }

    .standing {
      margin-top: 22px;
    }

    .standing-label {
      margin: 0;
      color: #74676e;
      font-size: 14px;
      line-height: 1.5;
    }

    .place {
      margin: 1px 0 0;
      color: #ad1766;
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.08;
    }

    .standing-detail {
      margin: 4px 0 0;
      color: #51464c;
      font-size: 14px;
      line-height: 1.5;
    }

    .ranking {
      margin-top: 24px;
      border-top: 1px solid #d9d1d5;
    }

    .ranking-heading {
      margin: 15px 0 8px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
    }

    .column-headings,
    .rank-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .column-headings {
      padding: 0 10px 6px;
      color: #8a747f;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }

    .column-headings span:last-child {
      text-align: right;
    }

    .rank-row {
      padding: 11px 10px;
      border-bottom: 1px solid #e4dde0;
      font-size: 16px;
      line-height: 1.5;
    }

    .rank-row:last-child {
      border-bottom: 0;
    }

    .rank-row.current {
      border-bottom-color: transparent;
      border-radius: 14px;
      background: #f7e2ee;
      color: #8f1254;
    }

    .rank {
      color: #74676e;
      font-weight: 600;
    }

    .current .rank {
      color: #ad1766;
    }

    .learner {
      min-width: 0;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      color: #51464c;
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }

    .current .score {
      color: #8f1254;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="leaderboard-title">
      <header>
        <p class="service-name">Cedar Languages</p>
        <h1 id="leaderboard-title">Weekly leaderboard</h1>
        <p class="course-period">Spanish Foundations · May 12–18</p>
      </header>

      <section class="standing" aria-labelledby="standing-label">
        <p class="standing-label" id="standing-label">Your weekly standing</p>
        <p class="place">3rd place</p>
        <p class="standing-detail">1,840 points · 260 behind 2nd place</p>
      </section>

      <section class="ranking" aria-labelledby="ranking-heading">
        <h2 class="ranking-heading" id="ranking-heading">Class standings</h2>

        <div class="column-headings" aria-hidden="true">
          <span>Rank</span>
          <span>Learner</span>
          <span>Points</span>
        </div>

        <div role="list" aria-label="Weekly class rankings">
          <div class="rank-row" role="listitem">
            <span class="rank">1</span>
            <span class="learner">Rowan Hale</span>
            <span class="score">2,460</span>
          </div>
          <div class="rank-row" role="listitem">
            <span class="rank">2</span>
            <span class="learner">Claire Wren</span>
            <span class="score">2,100</span>
          </div>
          <div class="rank-row current" role="listitem" aria-current="true">
            <span class="rank">3</span>
            <span class="learner">Jamie Calder (You)</span>
            <span class="score">1,840</span>
          </div>
          <div class="rank-row" role="listitem">
            <span class="rank">4</span>
            <span class="learner">Miles Dune</span>
            <span class="score">1,620</span>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
