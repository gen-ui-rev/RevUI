<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ececf0;
      color: #202026;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #ffffff;
    }

    .component {
      width: 100%;
    }

    .intro h1 {
      margin: 0;
      color: #6840c6;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.4px;
    }

    .intro p {
      margin: 5px 0 0;
      color: #686873;
      font-size: 13px;
      line-height: 1.5;
    }

    .add-method {
      width: 100%;
      margin-top: 14px;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      background: #6840c6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      cursor: pointer;
    }

    .methods {
      margin-top: 18px;
    }

    .section-title {
      margin: 0 0 8px;
      color: #303038;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .method-group + .method-group {
      margin-top: 10px;
    }

    .group-title {
      margin: 0 0 5px;
      color: #74747e;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .group-panel {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid #dedee5;
      border-radius: 8px;
      background: #ffffff;
    }

    .preferred-panel {
      border-color: #cfc2ee;
      background: #f7f4fd;
    }

    .method-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }

    .method-row + .method-row {
      border-top: 1px solid #e5e5eb;
    }

    .method-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: #f1edfb;
      color: #6840c6;
    }

    .preferred-panel .method-icon {
      background: #6840c6;
      color: #ffffff;
    }

    .method-icon svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    .method-copy {
      min-width: 0;
      flex: 1;
    }

    .method-name {
      margin: 0;
      overflow: hidden;
      color: #24242a;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .method-meta {
      margin: 1px 0 0;
      overflow: hidden;
      color: #74747e;
      font-size: 11px;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preferred-label {
      flex: 0 0 auto;
      padding: 3px 7px;
      border-radius: 5px;
      background: #e9e1fa;
      color: #6840c6;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
    }

    .default-button {
      flex: 0 0 auto;
      padding: 5px 7px;
      border: 1px solid #b9a5e5;
      border-radius: 5px;
      background: #ffffff;
      color: #6840c6;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="component" aria-labelledby="payment-title">
      <section class="intro">
        <h1 id="payment-title">Payment methods</h1>
        <p>Manage how you pay for stays and receive refunds from Wayfound.</p>
        <button class="add-method" type="button">Add card or bank account</button>
      </section>

      <section class="methods" aria-labelledby="saved-methods-title">
        <h2 class="section-title" id="saved-methods-title">Saved methods</h2>

        <section class="method-group" aria-labelledby="preferred-title-a">
          <h3 class="group-title" id="preferred-title-a">Preferred method</h3>
          <ul class="group-panel preferred-panel">
            <li class="method-row">
              <div class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="2.5" y="5" width="19" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M3 9H21" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M6 15H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="method-copy">
                <p class="method-name">Northline •••• 1842</p>
                <p class="method-meta">Expires 08/27</p>
              </div>
              <span class="preferred-label">Preferred</span>
            </li>
          </ul>
        </section>

        <section class="method-group" aria-labelledby="other-title-a">
          <h3 class="group-title" id="other-title-a">Other methods</h3>
          <ul class="group-panel">
            <li class="method-row">
              <div class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="2.5" y="5" width="19" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M3 9H21" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M6 15H10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="method-copy">
                <p class="method-name">Cedar Debit •••• 6071</p>
                <p class="method-meta">Expires 11/28</p>
              </div>
              <button class="default-button" type="button" aria-label="Make Cedar debit card ending in 6071 the preferred method">Make default</button>
            </li>

            <li class="method-row">
              <div class="method-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M3 9L12 4L21 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M5 10V18M9.5 10V18M14.5 10V18M19 10V18" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M3 20H21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="method-copy">
                <p class="method-name">Harbor Checking •••• 2910</p>
                <p class="method-meta">Verified bank account</p>
              </div>
              <button class="default-button" type="button" aria-label="Make Harbor checking account ending in 2910 the preferred method">Make default</button>
            </li>
          </ul>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
