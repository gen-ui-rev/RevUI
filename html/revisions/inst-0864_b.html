<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite friends — Northbeam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0d8b80;
    --ink:#16201f;
    --muted:#6b7573;
    --line:#e6e8e8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Roboto', system-ui, sans-serif;
    background:#eceeef;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#f2f3f5;
    padding:24px;
  }
  .card{
    width:342px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(22,32,31,.08);
    overflow:hidden;
  }
  .card + .card{margin-top:12px;}

  .hero{
    width:342px;
    height:100px;
    display:block;
    object-fit:cover;
    background:#cfd6d5;
  }
  .body{padding:16px 20px 18px;}
  h1{
    font-size:20px;
    font-weight:700;
    line-height:26px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    line-height:18px;
    color:var(--muted);
    margin:0 0 14px;
  }

  /* The action leads: one full-width Copy button, code reduced to fine print. */
  .copy-primary{
    width:100%;
    height:50px;
    border:0;
    border-radius:12px;
    background:var(--teal);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:500;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 2px 6px rgba(13,139,128,.28);
    cursor:pointer;
  }
  .copy-primary svg{display:block;}
  .fine{
    margin-top:12px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .fine p{
    margin:0;
    min-width:0;
    font-size:12px;
    line-height:18px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fine p b{
    font-weight:500;
    color:var(--ink);
    letter-spacing:.6px;
  }
  .share{
    background:none;
    border:0;
    padding:0;
    font-family:inherit;
    font-size:12px;
    line-height:18px;
    font-weight:500;
    color:var(--teal);
    white-space:nowrap;
    cursor:pointer;
  }

  .list{padding:14px 20px;}
  .list-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .list-head h2{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    margin:0;
    line-height:18px;
  }
  .list-head span{
    font-size:12px;
    line-height:18px;
    color:var(--muted);
  }
  .bar{
    margin:10px 0 6px;
    height:6px;
    border-radius:10px;
    background:#e6e8e8;
  }
  .bar i{
    display:block;
    height:6px;
    width:60%;
    border-radius:10px;
    background:var(--teal);
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:6px 0;
    border-top:1px solid var(--line);
  }
  .row:first-of-type{border-top:0;}
  .mono{
    width:32px;
    height:32px;
    flex:0 0 32px;
    border-radius:10px;
    background:#e3efed;
    color:var(--teal);
    font-size:13px;
    font-weight:500;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .who{flex:1;min-width:0;}
  .who b{
    display:block;
    font-size:14px;
    font-weight:500;
    line-height:18px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .who span{
    display:block;
    font-size:12px;
    line-height:16px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .amount{
    font-size:14px;
    font-weight:500;
    color:var(--teal);
    white-space:nowrap;
  }
  .waiting{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img class="hero" src="https://loremflickr.com/342/100/city?lock=11461" width="342" height="100" alt="City skyline at dusk above the invite offer">
      <div class="body">
        <h1>Give $25, get $25</h1>
        <p class="sub">Your friend funds $100 — you both earn $25.</p>
        <button class="copy-primary" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
          Copy invite code
        </button>
        <div class="fine">
          <p>Code <b>MARA4K92</b> · expires Jun 30</p>
          <button class="share" type="button">Share link</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="list">
        <div class="list-head">
          <h2>Your invites</h2>
          <span>3 of 5 accepted</span>
        </div>
        <div class="bar"><i></i></div>
        <div class="row">
          <div class="mono">DR</div>
          <div class="who">
            <b>Dana Reyes</b>
            <span>Funded Mar 4</span>
          </div>
          <div class="amount">+$25.00</div>
        </div>
        <div class="row">
          <div class="mono">TO</div>
          <div class="who">
            <b>Theo Okafor</b>
            <span>Funded Feb 27</span>
          </div>
          <div class="amount">+$25.00</div>
        </div>
        <div class="row">
          <div class="mono">SL</div>
          <div class="who">
            <b>Simone Lattimer</b>
            <span>Needs $100 deposit</span>
          </div>
          <div class="waiting">Pending</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
