<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — Room Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1c1a;
    --muted:#6b6f68;
    --line:#dedcd5;
    --accent:#1f7a45;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f0ec;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
  }
  .screen{
    width:390px;
    height:560px;
    padding:18px 28px;
    background:#f1f0ec;
  }
  .card{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--paper);
  }
  .summary{
    padding:14px 18px 12px;
    text-align:center;
  }
  .kicker{
    margin:0 0 2px;
    color:var(--accent);
    font-size:12px;
    font-weight:600;
    line-height:1.3;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .clock{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin:0 0 4px;
  }
  .clock .time{
    font-size:62px;
    font-weight:700;
    line-height:1;
    letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
  }
  .clock .unit{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  h1{
    margin:0 0 10px;
    color:#393b37;
    font-size:16px;
    font-weight:600;
    line-height:1.25;
  }
  .track{
    height:6px;
    overflow:hidden;
    border-radius:10px;
    background:#e9e8e2;
  }
  .track span{
    display:block;
    width:62%;
    height:100%;
    background:var(--accent);
  }
  .meta{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:6px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.35;
  }
  .meta span + span{
    position:relative;
    padding-left:16px;
  }
  .meta span + span::before{
    content:"";
    position:absolute;
    top:50%;
    left:0;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#a6a79f;
    transform:translateY(-50%);
  }
  .card img{
    display:block;
    width:100%;
    height:150px;
    object-fit:cover;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#d8d6cf;
  }
  .lower{padding:12px 18px 15px;}
  .host{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mono{
    width:38px;
    height:38px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #cfe0d5;
    border-radius:50%;
    background:#eaf2ec;
    color:var(--accent);
    font-size:14px;
    font-weight:700;
  }
  .host-copy{min-width:0;}
  .host .name{
    font-size:14px;
    font-weight:600;
    line-height:1.25;
  }
  .host .sub{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.3;
  }
  .host .status{
    margin-left:auto;
    color:var(--accent);
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
  }
  .controls{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .btn{
    flex:1;
    padding:9px 7px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--paper);
    color:var(--ink);
    text-align:center;
    font-size:14px;
    font-weight:600;
    line-height:1.35;
  }
  .btn.primary{
    border-color:var(--accent);
    background:var(--accent);
    color:#ffffff;
  }
  .note{
    margin:9px 1px 0;
    color:var(--muted);
    font-size:11.5px;
    line-height:1.4;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="summary">
        <p class="kicker">Room closes in</p>
        <div class="clock">
          <span class="time">12:45</span>
          <span class="unit">min left</span>
        </div>
        <h1>Late Night Listening — Side B</h1>
        <div class="track"><span></span></div>
        <div class="meta">
          <span>Started 10:22 PM</span>
          <span>24 listening</span>
        </div>
      </div>
      <img src="https://loremflickr.com/334/150/party?lock=10321" width="334" height="150" alt="Crowd in a dim room during a late night listening session">
      <div class="lower">
        <div class="host">
          <div class="mono">MR</div>
          <div class="host-copy">
            <div class="name">Maya Reyes</div>
            <div class="sub">Room host</div>
          </div>
          <div class="status">2 extensions left</div>
        </div>
        <div class="controls">
          <div class="btn">Pause</div>
          <div class="btn primary">Add 5 minutes</div>
        </div>
        <p class="note">At zero, the room locks and the clip is saved to your history.</p>
      </div>
    </div>
  </div>
</body>
</html>
