<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Daily — Team Step Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#E4610F;
    --accent-08:rgba(228,97,15,.09);
    --accent-20:rgba(228,97,15,.22);
    --ink:#241a14;
    --muted:#6d6058;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e7e6e3;
    font-family:'Nunito Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:184px;
    height:224px;
    padding:13px 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fffaf6;
    border:1px solid #d7d0ca;
    border-radius:30px;
    box-shadow:0 8px 22px rgba(36,26,20,.12);
  }
  .widget{
    width:100%;
    display:flex;
    flex-direction:column;
  }
  .kicker{
    margin:0;
    color:var(--accent);
    font-size:10px;
    line-height:14px;
    font-weight:700;
    letter-spacing:.07em;
    text-transform:uppercase;
  }
  .title{
    margin:1px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:17px;
    font-weight:600;
  }
  .value{
    margin:2px 0 0;
    color:var(--ink);
    font-size:36px;
    line-height:39px;
    font-weight:700;
    letter-spacing:-.03em;
  }
  .bar{
    width:100%;
    height:7px;
    margin-top:5px;
    overflow:hidden;
    background:var(--accent-20);
    border-radius:999px;
  }
  .bar span{
    display:block;
    width:68%;
    height:7px;
    background:var(--accent);
    border-radius:999px;
  }
  .meta{
    margin:5px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:16px;
  }
  .meta b{
    color:var(--ink);
    font-weight:700;
  }
  .foot{
    margin:5px 0 0;
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:10px;
    line-height:15px;
  }
  .foot svg{
    display:block;
    flex:none;
  }
  .standings{
    width:100%;
    margin-top:8px;
    padding:8px 10px;
    display:block;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    line-height:16px;
    font-weight:700;
    text-align:center;
    text-decoration:none;
  }
  .shot{display:none;}
</style>
</head>
<body>
  <div class="screen">
    <div class="widget">
      <p class="kicker">Stride Daily · Work</p>
      <p class="title">Team Step Challenge</p>
      <p class="value">68%</p>
      <div class="bar" aria-label="Team goal 68 percent complete"><span></span></div>
      <p class="meta">Team rank <b>#3 of 12</b></p>
      <p class="foot">
        <svg width="12" height="12" viewBox="0 0 13 13" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5.5" fill="none" stroke="#E4610F" stroke-width="1.4"/>
          <path d="M6.5 3.6V6.7l2.2 1.3" fill="none" stroke="#E4610F" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Updated 4:12 PM
      </p>
      <a class="standings" href="/standings">View full standings</a>
      <img class="shot" src="https://loremflickr.com/132/165/running?lock=11603" width="132" height="165" alt="Runner on a park path during an evening workout">
    </div>
  </div>
</body>
</html>
