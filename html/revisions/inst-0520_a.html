<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskgrove Recommendation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9dad6;
      color: #252620;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #e8e9e6;
    }

    .recommendation {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dedfd9;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(31, 33, 27, 0.09);
    }

    .hero {
      margin: 0;
    }

    .media {
      width: 342px;
      height: 130px;
      display: block;
      object-fit: cover;
      background: #d7d8d2;
    }

    .caption {
      margin: 0;
      padding: 12px 20px;
      background: #f1f2ec;
      border-left: 3px solid #6f773f;
      border-bottom: 1px solid #e4e5df;
      color: #35372f;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 500;
    }

    .caption-label {
      display: block;
      margin-bottom: 4px;
      color: #6f773f;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .card-body {
      padding: 20px;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .monogram {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #e4e5df;
      color: #515347;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .author-details {
      min-width: 0;
    }

    .author-name {
      margin: 0 0 3px;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    .author-meta {
      margin: 0;
      color: #707268;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audience-pill {
      margin-left: auto;
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid #cfd2c2;
      border-radius: 999px;
      background: #f4f5ef;
      color: #5c6141;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      white-space: nowrap;
    }

    h1 {
      margin: 14px 0 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 8px 0 0;
      color: #55574e;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .reaction-area {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e4e5df;
    }

    .public-reactions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .reaction-faces {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .reaction-faces .monogram {
      width: 28px;
      height: 28px;
      flex-basis: 28px;
      font-size: 12px;
    }

    .reaction-copy {
      min-width: 0;
      margin: 0;
      color: #55574e;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 400;
    }

    .reaction-copy strong {
      color: #303129;
      font-weight: 600;
    }

    .recommend-button {
      width: 100%;
      margin-top: 14px;
      padding: 0;
      display: flex;
      align-items: stretch;
      border: 0;
      border-radius: 4px;
      background: #6f773f;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      line-height: 1;
      font-weight: 600;
    }

    .button-label {
      min-height: 46px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
    }

    .button-label svg,
    .button-share svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      stroke: currentColor;
    }

    .button-share {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border-left: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 14px;
    }

    .button-count {
      min-width: 50px;
      display: grid;
      place-items: center;
      padding: 0 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="recommendation" aria-labelledby="proposal-title">
      <figure class="hero">
        <img
          class="media"
          src="https://loremflickr.com/342/130/notebook?lock=7050"
          width="342"
          height="130"
          alt="Open planning notebook beside a laptop on a desk"
        >
        <figcaption class="caption">
          <span class="caption-label">Attached draft</span>
          Shared agenda prepared for the Northwind client review
        </figcaption>
      </figure>

      <div class="card-body">
        <div class="author">
          <div class="monogram" aria-hidden="true">MV</div>
          <div class="author-details">
            <p class="author-name">Mara Venn</p>
            <p class="author-meta">Planning · 10:42 AM</p>
          </div>
          <span class="audience-pill">Client partners</span>
        </div>

        <h1 id="proposal-title">Move weekly planning to one client agenda</h1>
        <p class="summary">A shared agenda keeps client decisions, owners, and follow-ups visible without duplicate notes.</p>

        <div class="reaction-area">
          <div class="public-reactions">
            <div class="reaction-faces" aria-hidden="true">
              <div class="monogram">PR</div>
              <div class="monogram">TD</div>
            </div>
            <p class="reaction-copy"><strong>7 client partners recommend this</strong><br>Priya Raman and 6 others</p>
          </div>

          <button class="recommend-button" type="button" aria-label="Recommend this proposal, 7 recommendations, or share it with client partners">
            <span class="button-label">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="m6.5 10.5 5.5-5.5 5.5 5.5"></path>
              </svg>
              Recommend
            </span>
            <span class="button-share">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 16V4"></path>
                <path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path>
                <path d="M5 14v5h14v-5"></path>
              </svg>
              Share
            </span>
            <span class="button-count">7</span>
          </button>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
