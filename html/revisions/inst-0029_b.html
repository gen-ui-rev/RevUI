<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Note Sticker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #eae7e6;
      color: #302a2c;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 20px;
      background: #f7f4f3;
    }

    .tray {
      padding: 20px;
      background: #ffffff;
      border-radius: 6px;
    }

    .heading {
      margin: 0;
      color: #a83e61;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .subheading {
      margin: 6px 0 0;
      color: #746b6e;
      font-size: 14px;
      line-height: 1.5;
    }

    .target {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 16px;
      padding: 12px;
      background: #fbecf1;
      border-radius: 6px;
    }

    .target-icon {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      padding: 8px;
      place-items: center;
      color: #a83e61;
      background: #f4d8e2;
      border-radius: 6px;
    }

    .target-icon svg,
    .sticker-icon svg,
    .check svg {
      display: block;
      width: 100%;
    }

    .target-copy {
      min-width: 0;
    }

    .target-label {
      margin: 0;
      color: #8a757c;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
    }

    .target-name {
      margin: 2px 0 0;
      overflow: hidden;
      color: #3c3034;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      margin-top: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .section-title {
      margin: 0;
      color: #51484b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .sort {
      display: flex;
      flex: none;
      gap: 4px;
    }

    .sort-btn {
      padding: 3px 8px;
      border: 0;
      border-radius: 5px;
      color: #7c7275;
      background: #f1eeee;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
    }

    .sort-btn.on {
      color: #8f3151;
      background: #f3d5df;
    }

    .head-note {
      flex: none;
      color: #8a757c;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sticker {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 11px;
      border: 0;
      border-radius: 6px;
      color: #554b4e;
      background: #fcf3f6;
      text-align: left;
      cursor: pointer;
    }

    .sticker.selected {
      color: #8f3151;
      background: #f3d5df;
    }

    .sticker-icon {
      display: grid;
      flex: 0 0 28px;
      width: 28px;
      padding: 6px;
      place-items: center;
      color: #b2476a;
      background: rgba(190, 73, 111, 0.12);
      border-radius: 6px;
    }

    .sticker-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .check {
      position: absolute;
      top: 6px;
      right: 6px;
      display: grid;
      width: 17px;
      padding: 4px;
      place-items: center;
      color: #ffffff;
      background: #ad4164;
      border-radius: 6px;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      padding: 8px 0;
      place-items: center;
      border: 0;
      border-radius: 6px;
      color: #983958;
      background: #f0cfda;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    .all-team {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      color: #8f3151;
      background: #f7e3ea;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      cursor: pointer;
    }

    .all-team svg {
      display: block;
      flex: none;
      width: 14px;
      height: 14px;
    }

    .all-team span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-names {
      margin: 7px 0 0;
      overflow: hidden;
      color: #8a757c;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-top: 18px;
    }

    .action {
      padding: 11px 14px;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      cursor: pointer;
    }

    .cancel {
      color: #665c5f;
      background: #f1eeee;
    }

    .apply {
      color: #ffffff;
      background: #ad4164;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="tray">
      <header>
        <h1 class="heading">Choose a note sticker</h1>
        <p class="subheading">Add one clear marker for your team in Morrowpad.</p>
      </header>

      <div class="target">
        <span class="target-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 3.75h7.8L19 7.95v12.3H7V3.75Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M14.5 3.75v4.5H19M10 12h6M10 15.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="target-copy">
          <p class="target-label">Adding to</p>
          <p class="target-name">Launch planning notes</p>
        </div>
      </div>

      <section class="section" aria-labelledby="project-stickers">
        <div class="section-head">
          <h2 class="section-title" id="project-stickers">Project stickers</h2>
          <div class="sort">
            <button class="sort-btn on" type="button" aria-pressed="true">Recent</button>
            <button class="sort-btn" type="button" aria-pressed="false">A–Z</button>
          </div>
        </div>
        <div class="sticker-grid">
          <button class="sticker" type="button" aria-pressed="false">
            <span class="sticker-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="m12 3.75 2.45 4.96 5.47.8-3.96 3.85.94 5.44L12 16.23 7.1 18.8l.94-5.44-3.96-3.85 5.47-.8L12 3.75Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="sticker-name">Priority</span>
          </button>

          <button class="sticker" type="button" aria-pressed="false">
            <span class="sticker-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/>
                <path d="m8.5 12.2 2.25 2.2 4.75-4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="sticker-name">Resolved</span>
          </button>

          <button class="sticker selected" type="button" aria-pressed="true">
            <span class="sticker-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 4.25 20 18H4L12 4.25Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M12 9v4.5M12 16.5v.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="sticker-name">Needs review</span>
            <span class="check" aria-hidden="true">
              <svg viewBox="0 0 12 12" fill="none">
                <path d="m2.25 6.1 2.3 2.25 5.2-5.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <button class="sticker" type="button" aria-pressed="false">
            <span class="sticker-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 4.5h10v15l-5-3-5 3v-15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M10 9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="sticker-name">Decision</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="mention-stickers">
        <div class="section-head">
          <h2 class="section-title" id="mention-stickers">Mention a teammate</h2>
          <p class="head-note">Recently mentioned</p>
        </div>
        <div class="team-row">
          <button class="avatar" type="button" aria-label="Mention Avery Mota">AM</button>
          <button class="avatar" type="button" aria-label="Mention Jordan Lee">JL</button>
          <button class="avatar" type="button" aria-label="Mention Riley Park">RP</button>
          <button class="avatar" type="button" aria-label="Mention Devon Kaur">DK</button>
          <button class="all-team" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="3.2" stroke="currentColor" stroke-width="2"/>
              <path d="M3.6 19c.7-2.9 2.8-4.5 5.4-4.5S13.7 16.1 14.4 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 6.3a3 3 0 0 1 0 5.5M17.4 14.7c2 .6 3.2 2.2 3.5 4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>All 12 teammates</span>
          </button>
        </div>
        <p class="team-names">Avery Mota, Jordan Lee, Riley Park, Devon Kaur</p>
      </section>

      <div class="actions">
        <button class="action cancel" type="button">Cancel</button>
        <button class="action apply" type="button">Apply sticker</button>
      </div>
    </div>
  </div>
</body>
</html>
