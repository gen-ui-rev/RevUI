<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfare Stays — check-in activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{
    box-sizing:border-box;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#dedbd6;
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:48px 25px;
    background:#eceae7;
  }
  .island{
    width:340px;
    margin:0 auto;
    padding:20px;
    background:#faf9f7;
    border:1px solid #d8d5d0;
    border-radius:24px;
    box-shadow:0 12px 28px rgba(38,34,28,.12);
  }
  .kicker{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:15px;
    border-bottom:1px solid #e4e1dc;
  }
  .who{
    display:flex;
    align-items:center;
    gap:7px;
    color:#575b5d;
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .dot{
    display:block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#527a70;
  }
  .state{
    padding:3px 8px;
    color:#42675e;
    background:#e5eeea;
    border-radius:12px;
    font-size:12px;
  }
  .main{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:17px;
  }
  .main img{
    display:block;
    flex:none;
    width:52px;
    height:52px;
    border-radius:10px;
    object-fit:cover;
    background:#d7d5d1;
  }
  .who-block{
    min-width:0;
    flex:1;
  }
  .place{
    color:#202527;
    font-size:18px;
    font-weight:700;
    line-height:1.2;
  }
  .sub{
    margin-top:4px;
    color:#686c6e;
    font-size:13px;
    line-height:1.3;
  }
  .time{
    margin-top:17px;
    padding:11px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    color:#42504d;
    background:#eef2f0;
    border-radius:9px;
  }
  .time-label{
    font-size:13px;
  }
  .time-value{
    flex:none;
    color:#294c44;
    font-size:14px;
    font-weight:700;
  }
  .card{
    margin-top:12px;
    padding:13px 12px;
    background:#fff;
    border:1px solid #e2dfda;
    border-radius:10px;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .label{
    color:#202527;
    font-size:14px;
    font-weight:600;
  }
  .pct{
    color:#42675e;
    font-size:13px;
    font-weight:700;
  }
  .track{
    display:flex;
    gap:4px;
    margin-top:10px;
  }
  .segment{
    flex:1;
    height:6px;
    background:#dce7e2;
    border-radius:6px;
  }
  .segment.done{
    background:#527a70;
  }
  .segment.current{
    background:linear-gradient(to right, #527a70 72%, #dce7e2 72%);
  }
  .stage{
    margin-top:9px;
    color:#6f6e75;
    font-size:12px;
  }
  .steps{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:11px;
    padding-top:10px;
    border-top:1px solid #ebe8e3;
    color:#777a7b;
    font-size:11px;
  }
  .steps .complete{
    color:#42675e;
  }
  .steps .next{
    text-align:right;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="kicker">
        <span class="who"><span class="dot"></span>Wayfare Stays</span>
        <span class="state">Moving along</span>
      </div>

      <div class="main">
        <img src="https://loremflickr.com/52/52/hotel?lock=6283" width="52" height="52" alt="Front terrace of Coastal Pine Lodge">
        <div class="who-block">
          <div class="place">Coastal Pine Lodge</div>
          <div class="sub">Room ready at 3:00 PM</div>
        </div>
      </div>

      <div class="time">
        <span class="time-label">Your room is on track</span>
        <span class="time-value">About 42 min</span>
      </div>

      <div class="card">
        <div class="card-top">
          <span class="label">Check-in preparation</span>
          <span class="pct">Stage 3 of 4</span>
        </div>
        <div class="track">
          <span class="segment done"></span>
          <span class="segment done"></span>
          <span class="segment current"></span>
          <span class="segment"></span>
        </div>
        <div class="stage">In progress · Fresh linens and final checks</div>
        <div class="steps">
          <span class="complete">Cleaning complete</span>
          <span class="next">Next: Room release</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
