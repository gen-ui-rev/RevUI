<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Closed Revenue Leaderboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e6e6e9;
      color: #202027;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px 18px;
      background: #f2f2f5;
    }

    .leaderboard {
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 28, 40, 0.09);
    }

    .heading-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    h1 {
      margin: 0;
      color: #235d51;
      font-size: 23px;
      line-height: 1.22;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .team {
      margin: 4px 0 0;
      color: #686b70;
      font-size: 14px;
      line-height: 1.4;
    }

    .period {
      flex: 0 0 auto;
      margin: 3px 0 0;
      color: #74777c;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 650;
      white-space: nowrap;
    }

    .rank-summary {
      margin-top: 14px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #e8f5f1;
      border-left: 4px solid #2b7b69;
      border-radius: 12px;
    }

    .summary-label {
      color: #4f625d;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    .summary-rank {
      margin-top: 1px;
      color: #185f50;
      font-size: 38px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .summary-gap {
      margin-top: 5px;
      color: #4e5b58;
      font-size: 13px;
      line-height: 1.35;
    }

    .summary-gap strong {
      color: #253b36;
      font-weight: 750;
    }

    .list-heading {
      margin: 15px 0 6px;
      display: grid;
      grid-template-columns: 28px 40px minmax(0, 1fr) auto;
      align-items: center;
      color: #85888b;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .list-heading .revenue-label {
      grid-column: 4;
      text-align: right;
    }

    .rank-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .rank-row {
      padding: 9px 0;
      display: grid;
      grid-template-columns: 28px 40px minmax(0, 1fr) auto;
      align-items: center;
      border-top: 1px solid #eceef0;
    }

    .rank-row.current {
      margin: 0 -7px;
      padding: 9px 7px;
      background: #edf8f5;
      border-top-color: #cce8e1;
      border-radius: 8px;
    }

    .rank {
      color: #696d70;
      font-size: 14px;
      line-height: 1;
      font-weight: 750;
    }

    .monogram {
      width: 31px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9eaec;
      border-radius: 10px;
      color: #505358;
      font-size: 11px;
      line-height: 1;
      font-weight: 750;
    }

    .current .monogram {
      background: #287563;
      color: #ffffff;
    }

    .name-wrap {
      min-width: 0;
      padding-right: 8px;
    }

    .name {
      display: block;
      overflow: hidden;
      color: #292c2e;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .you {
      margin-left: 4px;
      color: #1f6d5c;
      font-size: 11px;
      font-weight: 800;
    }

    .revenue {
      color: #29312f;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 750;
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <div class="heading-row">
        <div>
          <h1 id="leaderboard-title">Weekly closed revenue</h1>
          <p class="team">North America sales</p>
        </div>
        <p class="period">Mar 3–9</p>
      </div>

      <div class="rank-summary">
        <span class="summary-label">Your current rank</span>
        <span class="summary-rank">#4</span>
        <span class="summary-gap"><strong>$18.4K</strong> behind third place</span>
      </div>

      <div class="list-heading" aria-hidden="true">
        <span>Rank</span>
        <span class="revenue-label">Closed</span>
      </div>

      <ol class="rank-list" aria-label="Sales representative rankings by weekly closed revenue">
        <li class="rank-row">
          <span class="rank">1</span>
          <span class="monogram" aria-hidden="true">MV</span>
          <span class="name-wrap"><span class="name">Mara Venn</span></span>
          <span class="revenue">$128.6K</span>
        </li>
        <li class="rank-row">
          <span class="rank">2</span>
          <span class="monogram" aria-hidden="true">ER</span>
          <span class="name-wrap"><span class="name">Ellis Rowe</span></span>
          <span class="revenue">$112.4K</span>
        </li>
        <li class="rank-row">
          <span class="rank">3</span>
          <span class="monogram" aria-hidden="true">ND</span>
          <span class="name-wrap"><span class="name">Nolan Dune</span></span>
          <span class="revenue">$96.8K</span>
        </li>
        <li class="rank-row current" aria-current="true">
          <span class="rank">4</span>
          <span class="monogram" aria-hidden="true">CS</span>
          <span class="name-wrap"><span class="name">Casey Stone <span class="you">You</span></span></span>
          <span class="revenue">$78.4K</span>
        </li>
        <li class="rank-row">
          <span class="rank">5</span>
          <span class="monogram" aria-hidden="true">AL</span>
          <span class="name-wrap"><span class="name">Arden Lake</span></span>
          <span class="revenue">$72.1K</span>
        </li>
      </ol>
    </section>
  </div>
</body>
</html>
