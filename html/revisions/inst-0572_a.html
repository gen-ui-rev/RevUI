<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Episode</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d9d9dc;
      color: #f7f6f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 560px;
      padding: 18px;
      background:
        radial-gradient(circle at 82% 10%, rgba(154, 101, 255, 0.24), transparent 34%),
        linear-gradient(155deg, #19181d 0%, #111115 100%);
    }

    .brand-line {
      display: flex;
      margin-bottom: 16px;
      align-items: center;
      gap: 9px;
      color: #d6d2dc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 9px;
      height: 9px;
      background: #c9ff4a;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(201, 255, 74, 0.12);
    }

    .share-sheet {
      position: relative;
      width: 100%;
      background: rgba(35, 33, 40, 0.96);
      border: 1px solid #46424d;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    .sheet-header {
      padding: 23px 58px 15px 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #c9ff4a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.16;
    }

    .helper {
      margin: 8px 0 0;
      color: #aaa5b0;
      font-size: 13px;
      line-height: 1.4;
    }

    .close-button {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      color: #d8d4dc;
      background: #312e37;
      border: 1px solid #4a4651;
      border-radius: 50%;
      cursor: pointer;
    }

    .close-button svg {
      width: 17px;
      height: 17px;
    }

    .episode-preview {
      display: flex;
      margin: 0 14px 16px;
      padding: 13px;
      align-items: center;
      gap: 13px;
      background: #17161b;
      border: 1px solid #3b3841;
      border-radius: 14px;
    }

    .cover {
      position: relative;
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      background:
        linear-gradient(135deg, transparent 44%, rgba(255,255,255,0.18) 45%, rgba(255,255,255,0.18) 48%, transparent 49%),
        linear-gradient(155deg, #9f6cff, #54369a);
      border-radius: 10px;
    }

    .cover::after {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 16px;
      height: 16px;
      content: "";
      background: #c9ff4a;
      border: 3px solid #17161b;
      border-radius: 50%;
    }

    .episode-copy {
      min-width: 0;
    }

    .episode-title {
      margin: 0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
    }

    .episode-meta {
      margin: 4px 0 0;
      color: #918c99;
      font-size: 12px;
      line-height: 1.35;
    }

    .share-options {
      padding: 0 14px 14px;
    }

    .share-option {
      display: flex;
      width: 100%;
      margin-top: 8px;
      padding: 11px 12px;
      align-items: center;
      gap: 12px;
      text-align: left;
      color: #f7f6f8;
      background: #2d2a32;
      border: 1px solid #44404a;
      border-radius: 12px;
      cursor: pointer;
    }

    .option-icon {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      color: #151419;
      background: #c9ff4a;
      border-radius: 10px;
    }

    .option-icon svg {
      width: 18px;
      height: 18px;
    }

    .option-copy {
      min-width: 0;
      flex: 1;
    }

    .option-title {
      display: block;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.25;
    }

    .option-detail {
      display: block;
      margin-top: 2px;
      color: #99949f;
      font-size: 11px;
      line-height: 1.3;
    }

    .chevron {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      color: #77717e;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="brand-line">
      <span class="brand-mark" aria-hidden="true"></span>
      Morrow Play
    </div>

    <div class="share-sheet" role="dialog" aria-labelledby="share-title-a" aria-describedby="share-help-a">
      <button class="close-button" type="button" aria-label="Close share sheet">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <header class="sheet-header">
        <p class="eyebrow">Episode ready</p>
        <h1 id="share-title-a">Send it your way</h1>
        <p class="helper" id="share-help-a">Choose where this listening recommendation goes.</p>
      </header>

      <div class="episode-preview">
        <div class="cover" aria-hidden="true"></div>
        <div class="episode-copy">
          <p class="episode-title">The Quiet Work of Memory</p>
          <p class="episode-meta">Field Notes with Nora Vale · 38 min</p>
        </div>
      </div>

      <div class="share-options" aria-label="Share options">
        <button class="share-option" type="button">
          <span class="option-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M16 20V18.5C16 16.57 14.21 15 12 15H7C4.79 15 3 16.57 3 18.5V20M9.5 11C11.43 11 13 9.43 13 7.5S11.43 4 9.5 4 6 5.57 6 7.5 7.57 11 9.5 11ZM17 8H22M19.5 5.5V10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="option-copy">
            <span class="option-title">Morrow Play listener</span>
            <span class="option-detail">Send inside the app</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="share-option" type="button">
          <span class="option-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 15.5C20 17.43 18.21 19 16 19H9L4 21V8.5C4 6.57 5.79 5 8 5H16C18.21 5 20 6.57 20 8.5V15.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="option-copy">
            <span class="option-title">Messages</span>
            <span class="option-detail">Text the episode directly</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="share-option" type="button">
          <span class="option-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M10 13.5L14 9.5M8 16L6.5 17.5C5.12 18.88 2.88 18.88 1.5 17.5C.12 16.12.12 13.88 1.5 12.5L5.5 8.5C6.88 7.12 9.12 7.12 10.5 8.5M14 8L15.5 6.5C16.88 5.12 19.12 5.12 20.5 6.5C21.88 7.88 21.88 10.12 20.5 11.5L16.5 15.5C15.12 16.88 12.88 16.88 11.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="option-copy">
            <span class="option-title">Copy link</span>
            <span class="option-detail">Paste it anywhere</span>
          </span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
