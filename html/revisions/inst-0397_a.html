<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfarer Loft — Shuttle Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#C07310;
    --ink:#1E1A15;
    --muted:#7B7365;
    --line:#E4DFD4;
  }
  html,body{margin:0;}
  body{
    background:#EAE7E1;
    font-family:'Source Sans 3',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 0;
    -webkit-font-smoothing:antialiased;
  }
  *{box-sizing:border-box;}
  .screen{
    width:390px;
    height:560px;
    padding:18px 0;
    background:#F2F0EC;
  }
  .card{
    width:334px;
    margin:0 auto;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:14px;
  }
  .card img{
    width:332px;
    height:148px;
    display:block;
    object-fit:cover;
    background:#DCD6CB;
    border-radius:13px 13px 0 0;
  }
  .body{padding:15px 20px 16px;}
  .eyebrow{
    margin:0 0 4px;
    color:var(--amber);
    font-size:12px;
    font-weight:600;
    letter-spacing:.10em;
    text-transform:uppercase;
  }
  h1{
    margin:0 0 3px;
    font-family:'Playfair Display',Georgia,serif;
    font-size:21px;
    line-height:1.25;
    font-weight:600;
  }
  .sub{
    margin:0 0 11px;
    color:var(--muted);
    font-size:14px;
  }
  .clock{
    margin:0 0 3px;
    font-family:'Playfair Display',Georgia,serif;
    font-size:46px;
    line-height:1;
    font-weight:700;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .clock small{
    margin-left:7px;
    color:var(--muted);
    font-family:'Source Sans 3',system-ui,sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    vertical-align:6px;
  }
  .track{
    height:6px;
    margin:12px 0 7px;
    background:#EFEBE3;
    border-radius:999px;
  }
  .fill{
    width:62%;
    height:6px;
    background:var(--amber);
    border-radius:999px;
  }
  .time-labels{
    display:flex;
    justify-content:space-between;
    gap:14px;
    margin-bottom:13px;
    color:var(--muted);
    font-size:12px;
    line-height:1.25;
  }
  .time-labels div{flex:1;}
  .time-labels div:last-child{text-align:right;}
  .time-labels strong{
    display:block;
    color:var(--ink);
    font-weight:600;
  }
  .controls{
    display:flex;
    gap:9px;
  }
  button{
    font-family:'Source Sans 3',system-ui,sans-serif;
    cursor:default;
  }
  .primary{
    flex:1;
    padding:10px 0;
    border:1px solid var(--amber);
    border-radius:12px;
    background:var(--amber);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
  }
  .reset{
    width:44px;
    padding:0;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .driver{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .avatar{
    width:34px;
    height:34px;
    flex:0 0 auto;
    border:1px solid var(--line);
    border-radius:50%;
    background:#F7F4EE;
    color:var(--amber);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:600;
  }
  .driver-copy{
    min-width:0;
    flex:1;
    font-size:12px;
    line-height:1.25;
    color:var(--muted);
  }
  .driver-copy strong{
    display:block;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
  }
  .driver-actions{
    display:flex;
    gap:5px;
    flex:0 0 auto;
  }
  .driver-action{
    min-width:42px;
    padding:6px 5px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:10px;
    line-height:1;
  }
  .driver-action svg{color:var(--amber);}
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <img src="https://loremflickr.com/332/148/hotel?lock=5583" width="332" height="148" alt="Front drive of the Wayfarer Loft where the airport shuttle boards">
      <div class="body">
        <p class="eyebrow">Shuttle countdown</p>
        <h1>Terminal 2 airport shuttle</h1>
        <p class="sub">Wayfarer Loft · Lobby entrance, bay 3</p>

        <div class="clock">01:12:38<small>left</small></div>

        <div class="track"><div class="fill"></div></div>
        <div class="time-labels">
          <div>
            Departs <strong>4:45 PM</strong>
          </div>
          <div>
            25 min ride <strong>Arrives T2 at 5:10 PM</strong>
          </div>
        </div>

        <div class="controls">
          <button class="primary" type="button">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
              <rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"/>
            </svg>
            Pause countdown
          </button>
          <button class="reset" type="button" aria-label="Reset countdown">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.2 9a5.8 5.8 0 1 0 1.9-4.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M3 2.6V6h3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="driver">
          <div class="avatar">DR</div>
          <div class="driver-copy">
            <strong>Della Roque</strong>
            Confirmed · 2 guests
          </div>
          <div class="driver-actions">
            <button class="driver-action" type="button">
              <svg width="14" height="14" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M5.2 2.8 7.1 6 5.8 7.4c1 2 2.7 3.7 4.8 4.8l1.4-1.3 3.2 1.9-.5 2.3c-.2.7-.8 1.1-1.5 1-5.8-.8-10.5-5.5-11.3-11.3-.1-.7.3-1.3 1-1.5l2.3-.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
              Call
            </button>
            <button class="driver-action" type="button">
              <svg width="14" height="14" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M3 3.5h12v8.8H7.2L3 15V3.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
              Text
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
