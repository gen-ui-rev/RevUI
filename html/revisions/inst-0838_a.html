<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circleloom Badge Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e5e8;
      color: #29252a;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px 16px;
      background: #f4f1f4;
    }

    .tray {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(41, 31, 38, 0.07);
    }

    .intro {
      padding: 14px;
      background: rgba(207, 20, 133, 0.10);
      border-radius: 10px;
    }

    .intro h1 {
      margin: 0;
      color: #b71375;
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
    }

    .intro p {
      margin: 4px 0 0;
      color: #665d64;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
    }

    .filter-section {
      margin-top: 14px;
    }

    .section-label {
      display: block;
      margin-bottom: 6px;
      color: #5f575e;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .chip {
      overflow: hidden;
      padding: 8px 6px;
      border: 0;
      border-radius: 8px;
      background: #f2eff1;
      color: #686066;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip.active {
      background: rgba(207, 20, 133, 0.12);
      color: #b71375;
    }

    .badge-section {
      margin-top: 14px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.35;
      font-weight: 700;
    }

    .section-heading span {
      color: #81777f;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .badge {
      position: relative;
      padding: 10px 8px;
      border: 0;
      border-radius: 10px;
      background: rgba(207, 20, 133, 0.08);
      color: #a8106a;
      text-align: center;
    }

    .badge.selected {
      background: rgba(207, 20, 133, 0.16);
    }

    .badge svg {
      display: block;
      width: 38px;
      height: 38px;
      margin: 0 auto 6px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge-name {
      display: block;
      overflow: hidden;
      color: #40383e;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-meaning {
      display: block;
      margin: 4px 0 0;
      color: #6f6570;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 600;
    }

    .selected-mark {
      position: absolute;
      top: 7px;
      right: 7px;
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border-radius: 50%;
      background: #c8157d;
      color: #ffffff;
    }

    .selected-mark svg {
      width: 11px;
      height: 11px;
      margin: 0;
      stroke-width: 2.2;
    }

    .add-button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #c8157d;
      color: #ffffff;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }

    .footnote {
      margin: 8px 0 0;
      color: #857b83;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="tray" aria-label="Classroom feedback badge picker">
      <header class="intro">
        <h1>Award a feedback badge</h1>
        <p>Maya R. · Grade 4 reading group</p>
      </header>

      <section class="filter-section" aria-labelledby="area-label">
        <span class="section-label" id="area-label">Step 1 · Feedback area</span>
        <div class="filter-row">
          <button class="chip active" type="button" aria-pressed="true">Effort</button>
          <button class="chip" type="button">Teamwork</button>
          <button class="chip" type="button">Growth</button>
          <button class="chip" type="button">Habits</button>
        </div>
      </section>

      <section class="badge-section" aria-labelledby="badge-heading">
        <div class="section-heading">
          <h2 id="badge-heading">Step 2 · Pick a badge</h2>
          <span>4 in Effort</span>
        </div>

        <div class="badge-grid">
          <button class="badge selected" type="button" aria-label="Great Effort, selected">
            <span class="selected-mark" aria-hidden="true">
              <svg viewBox="0 0 16 16">
                <path d="M3.5 8.2 6.4 11l6.1-6.3"></path>
              </svg>
            </span>
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="18" r="11"></circle>
              <path d="M20 17.5l3.9-4.2 4 4.2"></path>
              <path d="M17 27 13 42l11-6 11 6-4-15"></path>
            </svg>
            <span class="badge-name">Great Effort</span>
            <span class="badge-meaning">Student sees: “You worked hard and kept going.”</span>
          </button>

          <button class="badge" type="button" aria-label="Deep Focus">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="15"></circle>
              <circle cx="24" cy="24" r="8"></circle>
              <circle cx="24" cy="24" r="2"></circle>
            </svg>
            <span class="badge-name">Deep Focus</span>
          </button>

          <button class="badge" type="button" aria-label="Kept Trying">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M8 40h32"></path>
              <path d="M12 40v-9h8v9M24 40V21h8v19"></path>
              <path d="M34 12h6v6"></path>
              <path d="M40 12 29 23"></path>
            </svg>
            <span class="badge-name">Kept Trying</span>
          </button>

          <button class="badge" type="button" aria-label="Careful Work">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M15 8h18a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z"></path>
              <path d="m16 21 4 4 8-9"></path>
              <path d="M17 32h14M17 37h9"></path>
            </svg>
            <span class="badge-name">Careful Work</span>
          </button>
        </div>
      </section>

      <button class="add-button" type="button">Award badge to Maya R.</button>
      <p class="footnote">Badges appear in the Friday family digest.</p>
    </main>
  </div>
</body>
</html>
