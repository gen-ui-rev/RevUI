<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e5;
      color: #272328;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 16px 24px;
      background: #f5f3f2;
    }

    .move-panel {
      position: relative;
      width: 100%;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #d9d4d7;
      border-radius: 10px;
    }

    .context-label {
      margin: 0 40px 3px 0;
      color: #a20f60;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 40px 0 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.2;
    }

    .close-button {
      position: absolute;
      top: 14px;
      right: 14px;
      display: grid;
      place-items: center;
      width: 32px;
      padding: 7px;
      color: #5e575c;
      background: #ffffff;
      border: 1px solid #d9d4d7;
      border-radius: 10px;
      cursor: default;
    }

    .close-button svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .item-context {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 0;
    }

    .item-context img {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: block;
      object-fit: cover;
      background: #ddd8d5;
      border-radius: 10px;
    }

    .item-copy {
      min-width: 0;
    }

    .item-name {
      margin: 0;
      overflow: hidden;
      color: #272328;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-origin {
      margin: 3px 0 0;
      overflow: hidden;
      color: #756e73;
      font-size: 13.5px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    fieldset {
      min-width: 0;
      margin: 16px 0 0;
      padding: 0;
      border: 0;
    }

    legend {
      display: block;
      width: 100%;
      padding: 0;
      color: #3d373c;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .head-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .field-note {
      color: #857e83;
      font-size: 12px;
      font-weight: 400;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 7px 10px;
      background: #faf8f8;
      border: 1px solid #d9d4d7;
      border-radius: 10px;
    }

    .search svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      display: block;
      color: #8d868b;
    }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 0;
      color: #272328;
      background: transparent;
      border: 0;
      outline: none;
      font-size: 14px;
      line-height: 1.35;
    }

    .search input::placeholder {
      color: #948d92;
    }

    .destination-list {
      margin-top: 8px;
      border: 1px solid #d9d4d7;
      border-radius: 10px;
    }

    .destination {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: #332e32;
      cursor: default;
    }

    .destination + .destination {
      border-top: 1px solid #e3dfe1;
    }

    .destination:has(input:checked) {
      color: #971058;
      background: #fff3f9;
    }

    .destination input {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin: 0;
      appearance: none;
      background: #ffffff;
      border: 1px solid #aaa3a7;
      border-radius: 50%;
    }

    .destination input:checked {
      border: 5px solid #b51268;
    }

    .folder-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: block;
      color: #9b9398;
    }

    .destination:has(input:checked) .folder-icon {
      color: #c2437f;
    }

    .destination-copy {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .destination-name {
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination-meta {
      margin-top: 2px;
      overflow: hidden;
      color: #7b7479;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .destination:has(input:checked) .destination-meta {
      color: #a25b85;
    }

    .new-folder {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      margin-top: 10px;
      padding: 9px 12px;
      color: #971058;
      background: #ffffff;
      border: 1px dashed #d3a3c0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      cursor: default;
    }

    .plus {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: #ffffff;
      background: #b51268;
      border-radius: 50%;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }

    .move-button {
      width: 100%;
      margin-top: 14px;
      padding: 9px 16px;
      color: #ffffff;
      background: #b51268;
      border: 1px solid #b51268;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="move-panel" aria-labelledby="move-title">
      <button class="close-button" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <p class="context-label">Vela Market · Team drive</p>
      <h1 id="move-title">Move document</h1>

      <div class="item-context">
        <img src="https://loremflickr.com/56/56/fashion?lock=2810" width="56" height="56" alt="Autumn lookbook cover">
        <div class="item-copy">
          <p class="item-name">Autumn lookbook v4.pdf</p>
          <p class="item-origin">In Drafts · Edited by Mara T.</p>
        </div>
      </div>

      <form>
        <fieldset>
          <legend>
            <span class="head-row">
              <span>Move to a shared folder</span>
              <span class="field-note">9 folders</span>
            </span>
          </legend>

          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Search project folders" aria-label="Search project folders">
          </div>

          <div class="destination-list">
            <label class="destination">
              <input type="radio" name="destination" checked>
              <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5v-10Z" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <span class="destination-copy">
                <span class="destination-name">Campaign assets</span>
                <span class="destination-meta">Q4 Launch · 6 members · 14 docs</span>
              </span>
            </label>
            <label class="destination">
              <input type="radio" name="destination">
              <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5v-10Z" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <span class="destination-copy">
                <span class="destination-name">Retail rollout</span>
                <span class="destination-meta">Store ops · 4 members · 9 docs</span>
              </span>
            </label>
            <label class="destination">
              <input type="radio" name="destination">
              <svg class="folder-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5v-10Z" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <span class="destination-copy">
                <span class="destination-name">Brand library</span>
                <span class="destination-meta">Design · 11 members · 22 docs</span>
              </span>
            </label>
          </div>
        </fieldset>

        <button class="new-folder" type="button">
          <span class="plus" aria-hidden="true">+</span>
          Create a new shared folder
        </button>

        <button class="move-button" type="button">Move to Campaign assets</button>
      </form>
    </main>
  </div>
</body>
</html>
