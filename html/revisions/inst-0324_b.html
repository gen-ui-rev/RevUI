<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedar Market Dish Photo Finish</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e4e6e7;
      color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 12px;
      background: #f0f0ed;
    }

    .workspace {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(26, 31, 35, 0.11);
    }

    .workspace-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .workspace-header p {
      margin: 0;
      color: #a33f2e;
      font-size: 11px;
      font-weight: 700;
      line-height: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .workspace-header h1 {
      margin: 1px 0 0;
      color: #252a2d;
      font-size: 21px;
      font-weight: 700;
      line-height: 25px;
    }

    .photo-count {
      margin-top: 2px;
      padding: 3px 6px;
      border: 1px solid #cfd4d6;
      color: #697176;
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
    }

    .hero-stage {
      position: relative;
      width: 338px;
      margin-top: 8px;
      padding-left: 8px;
      background: #252a2d;
    }

    .hero-stage img {
      width: 322px;
      height: 144px;
      object-fit: cover;
      display: block;
      background: #d9dce2;
    }

    .dish-label {
      position: absolute;
      left: 8px;
      bottom: 0;
      padding: 6px 9px;
      background: rgba(24, 28, 29, 0.88);
      color: #ffffff;
    }

    .dish-label strong {
      display: block;
      font-size: 13px;
      line-height: 17px;
    }

    .dish-label span {
      display: block;
      color: #daddde;
      font-size: 11px;
      line-height: 15px;
    }

    .section {
      margin-top: 10px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .section h2 {
      margin: 0;
      color: #303538;
      font-size: 14px;
      font-weight: 700;
      line-height: 18px;
    }

    .section-title span {
      color: #858b8e;
      font-size: 11px;
      line-height: 16px;
    }

    .finish-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .finish-option {
      min-width: 0;
      height: 60px;
      padding: 0;
      display: flex;
      align-items: center;
      border: 1px solid #d9dddf;
      background: #ffffff;
      color: #596064;
      text-align: left;
      cursor: default;
    }

    .finish-option img {
      width: 70px;
      height: 60px;
      object-fit: cover;
      display: block;
      flex: 0 0 auto;
      background: #d9dce2;
    }

    .finish-option span {
      min-width: 0;
      padding: 0 8px;
      font-size: 12px;
      line-height: 16px;
    }

    .finish-option.selected {
      border: 2px solid #a33f2e;
      color: #8d3022;
      font-weight: 700;
    }

    .finish-option.selected img {
      width: 70px;
      height: 56px;
    }

    .badge-list {
      display: grid;
      grid-template-columns: repeat(3, 102px);
      gap: 8px;
      margin-top: 6px;
    }

    .badge-option {
      height: 38px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid #d7dbdc;
      background: #f8f8f6;
      color: #43494c;
      font-size: 11px;
      cursor: default;
    }

    .badge-option svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      color: #a33f2e;
    }

    .publish-button {
      width: 100%;
      height: 38px;
      margin-top: 10px;
      border: 1px solid #a33f2e;
      background: #a33f2e;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="workspace" aria-label="Restaurant dish photo finishing workspace">
      <header class="workspace-header">
        <div>
          <p>Menu photo</p>
          <h1>Finish this dish</h1>
        </div>
        <span class="photo-count">Entrées</span>
      </header>

      <div class="hero-stage">
        <img src="https://loremflickr.com/322/144/sneakers?lock=4770" width="322" height="144" alt="Featured entrée photo preview">
        <div class="dish-label">
          <strong>Herb-roasted chicken</strong>
          <span>Dinner · $24</span>
        </div>
      </div>

      <section class="section" aria-labelledby="finish-b-heading">
        <div class="section-title">
          <h2 id="finish-b-heading">Choose a finish</h2>
          <span>Previewed above</span>
        </div>
        <div class="finish-grid">
          <button class="finish-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4771" width="70" height="60" alt="True color finish preview">
            <span>True color</span>
          </button>
          <button class="finish-option selected" type="button" aria-pressed="true">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4772" width="70" height="60" alt="Fresh finish preview">
            <span>Fresh</span>
          </button>
          <button class="finish-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4773" width="70" height="60" alt="Golden finish preview">
            <span>Golden</span>
          </button>
          <button class="finish-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4774" width="70" height="60" alt="Evening finish preview">
            <span>Evening</span>
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="badges-b-heading">
        <div class="section-title">
          <h2 id="badges-b-heading">Optional callout</h2>
          <span>One badge max</span>
        </div>
        <div class="badge-list">
          <button class="badge-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Best seller</span>
          </button>
          <button class="badge-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h10l6 6-8 8-8-8V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="9" cy="10" r="1.4" fill="currentColor"/>
            </svg>
            <span>Special</span>
          </button>
          <button class="badge-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h11v9H3V7zm11 3h3l3 3v3h-6v-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="7" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>Takeout</span>
          </button>
        </div>
      </section>

      <button class="publish-button" type="button">Use on menu</button>
    </main>
  </div>
</body>
</html>
