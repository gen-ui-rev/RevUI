<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved places</title>
<style>
  :root{
    --ink:#f4f4f5;
    --muted:#8b8b93;
    --line:#26262b;
    --accent:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#e6e6e3;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:184px;
    height:224px;
    border-radius:30px;
    background:#0e0e11;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .head{
    padding:13px 13px 9px;
    border-bottom:1px solid var(--line);
  }
  .kicker{
    font-size:8px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 3px;
  }
  .head h1{
    font-size:13px;
    font-weight:600;
    margin:0;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list{flex:1;}
  .row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 13px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0;}
  .row.pinned{background:rgba(255,255,255,.06);}
  .info{min-width:0;flex:1;}
  .name{
    font-size:12.5px;
    font-weight:600;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    font-size:9.5px;
    color:var(--muted);
    line-height:1.3;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pin{
    flex:none;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid #34343a;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pin.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#0e0e11;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="head">
      <p class="kicker">Milepost</p>
      <h1>Saved · Lisbon</h1>
    </div>

    <div class="list">
      <div class="row pinned">
        <div class="info">
          <div class="name">Alfama Terrace</div>
          <div class="meta">$164 · pinned</div>
        </div>
        <div class="pin on" aria-label="Unpin Alfama Terrace">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z" fill="currentColor"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>

      <div class="row">
        <div class="info">
          <div class="name">Casa Belém</div>
          <div class="meta">$121 · 2 nights</div>
        </div>
        <div class="pin" aria-label="Pin Casa Belém">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>

      <div class="row">
        <div class="info">
          <div class="name">Estrela Flat</div>
          <div class="meta">$98 · saved Mar 14</div>
        </div>
        <div class="pin" aria-label="Pin Estrela Flat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.5 3.5l5 5-2 .6-3.4 3.4.5 3.3-1.4 1.4-7.4-7.4 1.4-1.4 3.3.5 3.4-3.4z"/>
            <path d="M6.8 17.2L3.5 20.5"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
