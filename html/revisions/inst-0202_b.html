<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateful — Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#c2405f;
    --rose-dark:#9f304a;
    --rose-soft:rgba(194,64,95,0.11);
    --rose-softer:rgba(194,64,95,0.06);
    --ink:#221c1e;
    --muted:#6f676a;
    --line:#e9e1e3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    padding:28px 0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#dfdcda;
    color:var(--ink);
    font-family:'Source Sans 3', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:768px;
    height:1024px;
    padding:32px;
    background:#f3f1f0;
  }
  .card{
    width:704px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 12px 34px rgba(50,39,42,.08);
  }
  .intro{
    display:grid;
    grid-template-columns:300px 404px;
  }
  .hero{
    width:300px;
    height:390px;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:18px 0 0 0;
  }
  .intro-copy{
    padding:32px 30px 28px;
  }
  .eyebrow{
    margin:0;
    color:var(--rose);
    font-size:13px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .track{
    display:flex;
    gap:6px;
    margin:11px 0 28px;
  }
  .seg{
    height:6px;
    flex:1;
    border-radius:10px;
    background:var(--rose-soft);
  }
  .seg.on{background:var(--rose);}
  h2{
    margin:0 0 13px;
    font-family:'Playfair Display', Georgia, serif;
    font-size:32px;
    font-weight:700;
    line-height:1.15;
  }
  .lede{
    margin:0;
    color:var(--muted);
    font-size:17px;
    line-height:1.52;
  }
  .coming{
    padding:27px 28px 25px;
    border-top:1px solid var(--line);
  }
  .coming-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .next-label{
    margin:0;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .coming-note{
    color:#91878a;
    font-size:13px;
  }
  .thumbs{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:16px;
  }
  .next-step{
    min-width:0;
    padding:10px;
    background:var(--rose-softer);
    border:1px solid rgba(194,64,95,.14);
    border-radius:15px;
  }
  .next-step img{
    width:338px;
    height:190px;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:11px;
  }
  .next-step span{
    display:block;
    margin:9px 2px 1px;
    color:var(--ink);
    font-size:16px;
    font-weight:600;
    line-height:1.25;
  }
  .later-steps{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
  }
  .later-step{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .later-step img{
    width:112px;
    height:78px;
    flex:0 0 auto;
    display:block;
    object-fit:cover;
    background:#d9d2d3;
    border-radius:10px;
  }
  .later-step span{
    min-width:0;
    color:var(--muted);
    font-size:14px;
    line-height:1.25;
  }
  .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:23px 28px 27px;
    border-top:1px solid var(--line);
  }
  button{
    appearance:none;
    border:0;
    font:inherit;
    cursor:default;
  }
  .back{
    min-height:50px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:0 20px;
    color:var(--rose-dark);
    background:var(--rose-softer);
    border:1px solid rgba(194,64,95,.3);
    border-radius:12px;
    box-shadow:inset 0 -2px 0 rgba(194,64,95,.08), 0 2px 5px rgba(66,40,47,.06);
    font-size:15px;
    font-weight:600;
  }
  .next{
    min-height:52px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:0 27px;
    color:#fff;
    background:var(--rose);
    border-radius:12px;
    box-shadow:0 6px 14px rgba(194,64,95,.24);
    font-size:16px;
    font-weight:600;
  }
  .count{
    color:var(--muted);
    font-size:14px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="intro">
        <img class="hero" src="https://loremflickr.com/300/390/salad?lock=3380" width="300" height="390" alt="A plate of green salad with grains photographed from above">
        <div class="intro-copy">
          <p class="eyebrow">Step 2 of 4</p>
          <div class="track" aria-label="Tour progress: step 2 of 4">
            <div class="seg on"></div>
            <div class="seg on"></div>
            <div class="seg"></div>
            <div class="seg"></div>
          </div>
          <h2>Log a meal from one photo</h2>
          <p class="lede">Point the camera at your plate. Plateful estimates each portion and fills in calories and protein — you only correct what looks off.</p>
        </div>
      </div>

      <div class="coming">
        <div class="coming-head">
          <p class="next-label">Coming up</p>
          <span class="coming-note">A quick look at the rest of your tour</span>
        </div>

        <div class="thumbs">
          <div class="next-step">
            <img src="https://loremflickr.com/338/190/fruit?lock=3381" width="338" height="190" alt="Bowl of mixed fruit used for the barcode scanning step">
            <span>Next: Scan groceries</span>
          </div>

          <div class="later-steps">
            <div class="later-step">
              <img src="https://loremflickr.com/112/78/gym?lock=3382" width="112" height="78" alt="Gym weights for the workout syncing step">
              <span>Sync workouts</span>
            </div>
            <div class="later-step">
              <img src="https://loremflickr.com/112/78/running?lock=3383" width="112" height="78" alt="Runner on a path for the weekly goal step">
              <span>Set week goals</span>
            </div>
          </div>
        </div>
      </div>

      <div class="foot">
        <button class="back" type="button">
          <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M8.5 3L4.5 7l4 4" stroke="#9f304a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>
        <span class="count">2 of 4 done</span>
        <button class="next" type="button">
          Next
          <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5.5 3l4 4-4 4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
