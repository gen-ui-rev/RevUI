<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cedar Market Menu Photo Studio</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e5e7eb;
      color: #20231f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 12px;
      background: #eceeea;
    }

    .photo-editor {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(36, 42, 34, 0.10);
    }

    .editor-header h1 {
      margin: 0;
      color: #24432d;
      font-size: 22px;
      font-weight: 700;
      line-height: 26px;
    }

    .editor-header p {
      margin: 2px 0 0;
      color: #687067;
      font-size: 13px;
      line-height: 18px;
    }

    .photo-focus {
      width: 325px;
      margin: 10px auto 0;
      border-left: 3px solid #c56f2b;
      background: #dde0db;
    }

    .photo-focus img {
      width: 322px;
      height: 144px;
      object-fit: cover;
      display: block;
      background: #dde0db;
    }

    .item-summary {
      width: 325px;
      margin: 0 auto;
      padding: 6px 10px;
      border-left: 3px solid #c56f2b;
      background: #f5f1e9;
    }

    .item-summary strong {
      display: block;
      color: #293329;
      font-size: 14px;
      line-height: 18px;
    }

    .item-summary span {
      display: block;
      color: #74776e;
      font-size: 12px;
      line-height: 16px;
    }

    .section {
      margin-top: 12px;
    }

    .section.compact {
      margin-top: 10px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .section h2 {
      margin: 0;
      color: #30372f;
      font-size: 14px;
      font-weight: 700;
      line-height: 18px;
    }

    .section-heading span {
      color: #858b82;
      font-size: 11px;
      line-height: 16px;
    }

    .filter-list {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      gap: 14px;
      margin-top: 6px;
    }

    .filter-option {
      width: 70px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #687067;
      text-align: center;
      cursor: default;
    }

    .filter-option img {
      width: 70px;
      height: 60px;
      object-fit: cover;
      display: block;
      background: #dde0db;
    }

    .filter-option span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 17px;
    }

    .filter-option.selected img {
      outline: 3px solid #c56f2b;
      outline-offset: -3px;
    }

    .filter-option.selected span {
      color: #9a4d17;
      font-weight: 700;
    }

    .sticker-list {
      display: grid;
      grid-template-columns: repeat(3, 102px);
      gap: 8px;
      margin-top: 6px;
    }

    .sticker-option {
      height: 40px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid #d7dbd3;
      background: #ffffff;
      color: #41483f;
      font-size: 12px;
      cursor: default;
    }

    .sticker-option svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: #c56f2b;
    }

    .apply-button {
      width: 100%;
      height: 40px;
      margin-top: 12px;
      border: 1px solid #24432d;
      background: #24432d;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="photo-editor" aria-label="Restaurant menu photo editor">
      <header class="editor-header">
        <h1>Menu photo studio</h1>
        <p>Prepare a polished image for your online menu.</p>
      </header>

      <div class="photo-focus">
        <img src="https://loremflickr.com/322/144/sneakers?lock=4770" width="322" height="144" alt="Main menu item photo preview">
      </div>

      <div class="item-summary">
        <strong>Roasted mushroom toast</strong>
        <span>Brunch menu · Photo ready to style</span>
      </div>

      <section class="section" aria-labelledby="filters-a-heading">
        <div class="section-heading">
          <h2 id="filters-a-heading">Food-friendly finish</h2>
          <span>Color only</span>
        </div>
        <div class="filter-list">
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4771" width="70" height="60" alt="Natural photo finish preview">
            <span>Natural</span>
          </button>
          <button class="filter-option selected" type="button" aria-pressed="true">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4772" width="70" height="60" alt="Bright photo finish preview">
            <span>Bright</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4773" width="70" height="60" alt="Warm photo finish preview">
            <span>Warm</span>
          </button>
          <button class="filter-option" type="button" aria-pressed="false">
            <img src="https://loremflickr.com/70/60/sneakers?lock=4774" width="70" height="60" alt="Moody photo finish preview">
            <span>Moody</span>
          </button>
        </div>
      </section>

      <section class="section compact" aria-labelledby="badges-a-heading">
        <h2 id="badges-a-heading">Menu badge</h2>
        <div class="sticker-list">
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8L12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Chef pick</span>
          </button>
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h10l6 6-8 8-8-8V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="9" cy="10" r="1.4" fill="currentColor"/>
            </svg>
            <span>Special</span>
          </button>
          <button class="sticker-option" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h11v9H3V7zm11 3h3l3 3v3h-6v-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="7" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="17" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>Delivery</span>
          </button>
        </div>
      </section>

      <button class="apply-button" type="button">Save menu photo</button>
    </main>
  </div>
</body>
</html>
