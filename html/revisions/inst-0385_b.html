<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save to list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C2265B;
    --accent-8:rgba(194,38,91,0.08);
    --accent-14:rgba(194,38,91,0.14);
    --ink:#231d1f;
    --muted:#7c7176;
    --gray:#4a4446;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#eceaea;
    font-family:'Source Sans 3', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:560px;
    background:#fdfcfc;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:700;
    font-size:26px;
    line-height:1.15;
    margin:0;
    flex:1 1 auto;
  }
  .close{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border:1px solid #ddd8d8;
    border-radius:50%;
    padding:0;
    background:#f6f4f4;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sub{
    font-size:14px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--accent-8);
    border-radius:6px;
    padding:12px;
    margin-bottom:28px;
  }
  .thumb{
    width:56px;
    height:66px;
    border-radius:6px;
    background:var(--accent-14);
    flex:0 0 auto;
  }
  .item-name{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
    margin:0 0 3px;
  }
  .item-meta{
    font-size:13px;
    color:var(--muted);
    margin:0;
  }
  .item-price{
    margin-left:auto;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
  }
  .labelbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:1px solid #eae6e6;
  }
  .label{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
    flex:1 1 auto;
  }
  .newlist{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    white-space:nowrap;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:6px;
    background:#f3f1f1;
    margin-bottom:10px;
  }
  .row.on{background:var(--accent-14);}
  .row-name{
    font-size:15px;
    font-weight:600;
  }
  .row-count{
    margin-left:auto;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .mark{flex:0 0 auto;}
  .dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#e0dcdc;
    flex:0 0 auto;
  }
  .save{
    display:block;
    width:100%;
    background:var(--accent);
    color:#fff;
    border:0;
    border-radius:6px;
    padding:15px 0;
    margin-top:auto;
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:16px;
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="titlebar">
      <h1>Save to a list</h1>
      <button class="close" type="button" aria-label="Close without saving">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="#4a4446" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p class="sub">Pick where this piece belongs.</p>

    <div class="item">
      <div class="thumb"></div>
      <div>
        <p class="item-name">Linen Wrap Dress</p>
        <p class="item-meta">Clay · Size 6</p>
      </div>
      <div class="item-price">$128.00</div>
    </div>

    <div class="labelbar">
      <p class="label">Your lists</p>
      <span class="newlist">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 3v10M3 8h10" fill="none" stroke="#C2265B" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New list
      </span>
    </div>

    <div class="row on">
      <svg class="mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M3.5 9.6l3.4 3.4L14.5 5.4" fill="none" stroke="#C2265B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="row-name">Spring Capsule</span>
      <span class="row-count">14 items</span>
    </div>

    <div class="row">
      <span class="dot"></span>
      <span class="row-name">Gift Ideas</span>
      <span class="row-count">6 items</span>
    </div>

    <div class="row">
      <span class="dot"></span>
      <span class="row-name">Watching Prices</span>
      <span class="row-count">9 items</span>
    </div>

    <button class="save" type="button">Save to Spring Capsule</button>
  </div>
</body>
</html>
