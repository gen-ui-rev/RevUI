<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Recipes Empty State</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7eb;
      color: #3b2a1d;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 34px 28px;
      background: #fffdf7;
      display: flex;
      flex-direction: column;
    }

    .empty-state {
      width: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .context {
      margin: 0;
      color: #b4552d;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .rule {
      width: 100%;
      margin: 12px 0 22px;
      border: 0;
      border-top: 1px solid #ecdcc4;
    }

    h1 {
      margin: 0;
      color: #3b2a1d;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 12px 0 0;
      color: #7c6a58;
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.6;
    }

    .hero {
      width: 334px;
      height: 140px;
      margin: 24px 0 0;
      border-radius: 4px;
      object-fit: cover;
      display: block;
      background: #ecdcc4;
    }

    .action-row {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    .primary-action {
      width: 196px;
      padding: 13px 18px;
      border: 1px solid #b4552d;
      border-radius: 999px;
      background: #b4552d;
      color: #fffdf7;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }

    .collections {
      margin-top: auto;
      padding-top: 20px;
      text-align: center;
    }

    .collections-label {
      margin: 0;
      color: #a99683;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .chips {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chips li {
      padding: 6px 11px;
      border: 1px solid #ecdcc4;
      border-radius: 999px;
      background: #fff8ec;
      color: #8a6a4b;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.25;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="empty-state" aria-labelledby="empty-title">
      <p class="context">Golden Hour Kitchen · Saved recipes</p>
      <hr class="rule">
      <h1 id="empty-title">Your recipe box is empty</h1>
      <p class="description">Save the dishes you want to cook again and they wait here with your notes and shopping lists.</p>
      <img
        class="hero"
        src="https://loremflickr.com/334/140/studio?lock=12270"
        width="334"
        height="140"
        alt="Fresh ingredients and pans laid out on a kitchen counter"
      >
      <div class="action-row">
        <button class="primary-action" type="button">Browse recipes</button>
      </div>
      <div class="collections">
        <p class="collections-label">Cooks are saving from</p>
        <ul class="chips">
          <li>Weeknight dinners</li>
          <li>Baking</li>
          <li>One pan</li>
        </ul>
      </div>
    </section>
  </div>
</body>
</html>
