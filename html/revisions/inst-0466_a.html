<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halden Market — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{
    box-sizing:border-box;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#DCDCDF;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:844px;
    background:#EFEFF1;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .storybar{
    background:#121114;
    padding:14px 16px;
    flex:0 0 auto;
  }
  .segments{
    display:flex;
    gap:5px;
  }
  .seg{
    flex:1;
    height:3px;
    background:rgba(255,255,255,.28);
  }
  .seg span{
    display:block;
    height:3px;
    background:#E20FA0;
  }
  .head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .mono{
    width:40px;
    height:40px;
    background:#FFFFFF;
    color:#121114;
    font-size:15px;
    font-weight:600;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .who{
    min-width:0;
    flex:1;
  }
  .who .name{
    color:#FFFFFF;
    font-size:15px;
    font-weight:500;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .who .meta{
    color:rgba(255,255,255,.62);
    font-size:12px;
    line-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .story-controls{
    display:flex;
    align-items:center;
    gap:4px;
    flex:0 0 auto;
  }
  .pause,
  .close{
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pause{
    border:1px solid rgba(255,255,255,.28);
    border-radius:50%;
  }

  .stage{
    flex:1;
    min-height:0;
    position:relative;
    background:#C9C9CE;
  }
  .stage img.hero{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#C9C9CE;
  }

  .card{
    position:absolute;
    left:16px;
    right:16px;
    bottom:16px;
    background:#FFFFFF;
    box-shadow:0 6px 20px rgba(18,17,20,.18);
  }
  .product-group{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
  }
  .product-group img{
    width:64px;
    height:64px;
    object-fit:cover;
    display:block;
    background:#DDDDE1;
    flex:0 0 auto;
  }
  .product-copy{
    min-width:0;
    flex:1;
  }
  .kicker{
    color:#E20FA0;
    font-size:11px;
    font-weight:600;
    letter-spacing:.5px;
    line-height:16px;
  }
  .title{
    color:#121114;
    font-size:15px;
    font-weight:500;
    line-height:21px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .note{
    color:#8A8A93;
    font-size:12px;
    line-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .purchase-group{
    border-top:1px solid #ECECEF;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .pricing{
    min-width:0;
    flex:1;
  }
  .price{
    color:#121114;
    font-size:16px;
    font-weight:600;
    line-height:21px;
  }
  .was{
    color:#8A8A93;
    font-size:11px;
    line-height:16px;
  }
  .was s{
    margin-left:4px;
  }
  .cta{
    width:132px;
    background:#E20FA0;
    color:#FFFFFF;
    font-size:14px;
    font-weight:500;
    line-height:42px;
    text-align:center;
    flex:0 0 auto;
  }

  .tabs{
    display:flex;
    background:#FFFFFF;
    border-top:1px solid #E3E3E7;
    padding:9px 0 11px;
    flex:0 0 auto;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#8A8A93;
    font-size:12px;
    line-height:16px;
  }
  .tab.active{
    color:#E20FA0;
    font-weight:500;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="storybar">
      <div class="segments">
        <div class="seg"><span style="width:100%"></span></div>
        <div class="seg"><span style="width:100%"></span></div>
        <div class="seg"><span style="width:42%"></span></div>
      </div>

      <div class="head">
        <div class="mono">MF</div>
        <div class="who">
          <div class="name">Marlowe &amp; Field</div>
          <div class="meta">Fall Layering Drop &middot; 2h ago</div>
        </div>
        <div class="story-controls">
          <div class="pause" aria-label="Pause story">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M4.5 3v8M9.5 3v8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="square"/>
            </svg>
          </div>
          <div class="close" aria-label="Close story">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M2 2 L16 16 M16 2 L2 16" stroke="#FFFFFF" stroke-width="1.6"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div class="stage">
      <img class="hero" src="https://loremflickr.com/390/691/fashion?lock=6400" width="390" height="691" alt="Model wearing a wool overcoat over a knit sweater on a city street">

      <div class="card">
        <div class="product-group">
          <img src="https://loremflickr.com/64/64/product?lock=6403" width="64" height="64" alt="Folded charcoal wool overcoat product shot">
          <div class="product-copy">
            <div class="kicker">LOOK 03 OF 03</div>
            <div class="title">Aster Wool Overcoat</div>
            <div class="note">Free returns through Nov 30</div>
          </div>
        </div>
        <div class="purchase-group">
          <div class="pricing">
            <div class="price">$248.00</div>
            <div class="was">Sale price <s>$310.00</s></div>
          </div>
          <div class="cta">View item</div>
        </div>
      </div>
    </div>

    <nav class="tabs">
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M3 9.2 11 3l8 6.2V19H3z" stroke="#8A8A93" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        Home
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="6.2" stroke="#8A8A93" stroke-width="1.5"/>
          <path d="M14.6 14.6 19 19" stroke="#8A8A93" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Search
      </div>
      <div class="tab active">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="8.2" stroke="#E20FA0" stroke-width="1.5"/>
          <circle cx="11" cy="11" r="3.4" stroke="#E20FA0" stroke-width="1.5"/>
        </svg>
        Stories
      </div>
      <div class="tab">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M4 6.5h14L17 19H5z" stroke="#8A8A93" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M8.2 8.4V5.8a2.8 2.8 0 0 1 5.6 0v2.6" stroke="#8A8A93" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Bag
      </div>
    </nav>
  </div>
</body>
</html>
