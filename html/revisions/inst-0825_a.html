<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Actions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e4e4e7;
      color: #27272a;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px 24px;
      background: #f4f4f5;
    }

    .action-sheet,
    .danger-sheet {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
    }

    .action-sheet {
      padding: 22px 22px 7px;
    }

    .service-name {
      margin: 0 0 5px;
      color: #52525b;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #18181b;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.18;
    }

    .account-summary {
      margin: 9px 0 17px;
      color: #71717a;
      font-size: 14px;
      line-height: 1.4;
    }

    .action-list {
      border-top: 1px solid #e4e4e7;
    }

    .action {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border: 0;
      border-bottom: 1px solid #e4e4e7;
      background: transparent;
      color: #27272a;
      text-align: left;
      cursor: pointer;
    }

    .action:last-child {
      border-bottom: 0;
    }

    .action-copy {
      min-width: 0;
      flex: 1;
    }

    .action-title {
      display: block;
      margin-bottom: 1px;
      color: #27272a;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }

    .action-detail {
      display: block;
      color: #71717a;
      font-size: 13px;
      line-height: 1.35;
    }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #a1a1aa;
    }

    .danger-sheet {
      margin-top: 14px;
      padding: 16px 22px 7px;
      border-color: #fecaca;
      background: #fffafa;
    }

    .danger-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 4px;
      color: #991b1b;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .warning-icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .danger-note {
      margin: 0 0 6px;
      color: #7f1d1d;
      font-size: 13px;
      line-height: 1.35;
    }

    .danger-action {
      border-top: 1px solid #fecaca;
      color: #b91c1c;
    }

    .danger-action .action-title,
    .danger-action .chevron {
      color: #b91c1c;
    }

    .danger-action .action-detail {
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="action-sheet" aria-labelledby="action-title">
      <p class="service-name">Cedarline</p>
      <h1 id="action-title">Manage Everyday Cash</h1>
      <p class="account-summary">Account ending in 4821 · Available balance $4,286.19</p>

      <nav class="action-list" aria-label="Routine account actions">
        <button class="action" type="button">
          <span class="action-copy">
            <span class="action-title">Transfer money</span>
            <span class="action-detail">Move funds to or from this account</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="action" type="button">
          <span class="action-copy">
            <span class="action-title">View account details</span>
            <span class="action-detail">See routing, limits, and ownership</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </nav>
    </section>

    <section class="danger-sheet" aria-labelledby="danger-title">
      <h2 class="danger-heading" id="danger-title">
        <svg class="warning-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8v5m0 3.5v.1M10.3 4.7 3.1 17.2A2 2 0 0 0 4.8 20h14.4a2 2 0 0 0 1.7-2.8L13.7 4.7a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Danger zone
      </h2>
      <p class="danger-note">This removes the account from your Cedarline profile.</p>
      <button class="action danger-action" type="button">
        <span class="action-copy">
          <span class="action-title">Disconnect account</span>
          <span class="action-detail">Review the impact before continuing</span>
        </span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>
  </div>
</body>
</html>
