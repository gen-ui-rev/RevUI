<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfare Stays — check-in activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{
    box-sizing:border-box;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#dedbd6;
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:60px 0;
    background:#eceae7;
  }
  .island{
    width:340px;
    margin:0 auto;
    padding:18px 20px 20px;
    background:#0b0b0c;
    border-radius:40px;
    box-shadow:0 14px 30px rgba(20,16,10,.22);
  }
  .kicker{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .who{
    display:flex;
    align-items:center;
    gap:7px;
    color:#a5a4aa;
    font-size:12px;
    letter-spacing:.02em;
  }
  .dot{
    display:block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#6f9f88;
  }
  .state{
    color:#8eb59f;
    font-size:12px;
  }
  .main{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .main img{
    display:block;
    flex:none;
    width:52px;
    height:52px;
    border-radius:6px;
    object-fit:cover;
    background:#3a3a3d;
  }
  .who-block{
    min-width:0;
    flex:1;
  }
  .place{
    color:#fff;
    font-size:17px;
    font-weight:600;
    line-height:1.25;
  }
  .sub{
    margin-top:3px;
    color:#aaa9ae;
    font-size:13px;
    line-height:1.3;
  }
  .count{
    flex:none;
    text-align:right;
  }
  .count .big{
    color:#9bc2ad;
    font-size:22px;
    font-weight:700;
    line-height:1.1;
  }
  .count .cap{
    margin-top:2px;
    color:#8f8e94;
    font-size:12px;
  }
  .card{
    margin-top:16px;
    padding:12px 14px 13px;
    background:#fff;
    border-radius:8px;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .label{
    color:#17171a;
    font-size:14px;
    font-weight:600;
  }
  .pct{
    color:#517b68;
    font-size:14px;
    font-weight:600;
  }
  .track{
    height:6px;
    margin-top:10px;
    background:#e3e7e4;
    border-radius:6px;
  }
  .fill{
    width:68%;
    height:6px;
    background:#6f9f88;
    border-radius:6px;
  }
  .stage{
    margin-top:9px;
    color:#6f6e75;
    font-size:12px;
  }
  .note{
    margin-top:4px;
    color:#6f6e75;
    font-size:12px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="kicker">
        <span class="who"><span class="dot"></span>Wayfare Stays</span>
        <span class="state">On schedule</span>
      </div>

      <div class="main">
        <img src="https://loremflickr.com/52/52/hotel?lock=6283" width="52" height="52" alt="Front terrace of Coastal Pine Lodge">
        <div class="who-block">
          <div class="place">Coastal Pine Lodge</div>
          <div class="sub">Room ready at 3:00 PM</div>
        </div>
        <div class="count">
          <div class="big">42m</div>
          <div class="cap">to go</div>
        </div>
      </div>

      <div class="card">
        <div class="card-top">
          <span class="label">Room preparation</span>
          <span class="pct">68%</span>
        </div>
        <div class="track"><div class="fill"></div></div>
        <div class="stage">In progress · Final room refresh</div>
        <div class="note">Room 512 · Bay view, floor 5</div>
      </div>
    </div>
  </div>
</body>
</html>
