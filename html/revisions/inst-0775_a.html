<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Your Health Record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d9dfdc;
      color: #20342f;
      font-family: 'Source Sans 3', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 34px 28px 30px;
      background: #fbfaf4;
      border-top: 5px solid #397668;
      box-shadow: 0 12px 34px rgba(35, 55, 49, 0.12);
    }

    .service {
      margin: 0 0 10px;
      color: #397668;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.09em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #173e36;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
    }

    .intro {
      margin: 13px 0 0;
      color: #536761;
      font-size: 15px;
      line-height: 1.48;
    }

    form {
      margin-top: 22px;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #294a42;
      font-size: 15px;
      font-weight: 600;
    }

    .code-fields {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }

    .code-fields input {
      width: 100%;
      padding: 10px 0 9px;
      border: 1px solid #91aaa3;
      border-radius: 5px;
      outline: none;
      background: #ffffff;
      color: #173e36;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      caret-color: #397668;
    }

    .code-fields input:focus {
      border-color: #397668;
      box-shadow: 0 0 0 2px rgba(57, 118, 104, 0.17);
    }

    .expiry {
      margin: 9px 0 0;
      color: #667771;
      font-size: 13px;
      line-height: 1.4;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 18px;
      border: 1px solid #276456;
      border-radius: 5px;
      background: #276456;
      color: #ffffff;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
    }

    .alternate {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #ccd6d1;
    }

    .alternate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .alternate p {
      flex: 1;
      margin: 0;
      color: #60716b;
      font-size: 13px;
      line-height: 1.35;
    }

    .text-button {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #6e948a;
      border-radius: 4px;
      background: transparent;
      color: #276456;
      font-family: 'Source Sans 3', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main aria-labelledby="verification-title">
      <p class="service">Harborview Secure Health Records</p>
      <h1 id="verification-title">Access your health record</h1>
      <p class="intro">Enter the secure code sent to m•••••@harbormail.com before viewing your care information.</p>

      <form>
        <label class="field-label" for="code-a-1">6-digit verification code</label>
        <div class="code-fields" aria-label="Six-digit verification code">
          <input id="code-a-1" type="text" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Digit 2">
          <input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 3">
          <input type="text" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 4">
          <input type="text" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 5">
          <input type="text" inputmode="numeric" maxlength="1" value="6" aria-label="Digit 6">
        </div>
        <p class="expiry">For your security, this code expires in 7 minutes.</p>
        <button class="primary-button" type="submit">Open patient portal</button>
      </form>

      <section class="alternate" aria-label="Alternate verification option">
        <div class="alternate-row">
          <p>No email? Check spam or request another secure code.</p>
          <button class="text-button" type="button">Resend code</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
