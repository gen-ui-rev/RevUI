<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Permission — Rooknote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e6e2;
      color: #231f1d;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f5f3f0;
    }

    .permission-card {
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d5d0ca;
      border-radius: 4px;
    }

    .permission-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: #b72b2b;
      background: #fff5f4;
      border: 1px solid #e2b8b4;
      border-radius: 4px;
    }

    .permission-icon svg {
      width: 22px;
      height: 22px;
    }

    .heading-group {
      margin-top: 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #b72b2b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 11px 0 0;
      color: #5f5853;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
    }

    .privacy-note {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid #ddd8d2;
      color: #5f5853;
      font-size: 14px;
      line-height: 1.45;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      margin: 0;
      padding: 11px 16px;
      border-radius: 4px;
      font: 600 16px/1.35 'Source Serif 4', Georgia, serif;
      cursor: pointer;
    }

    .allow {
      color: #ffffff;
      background: #b72b2b;
      border: 1px solid #b72b2b;
    }

    .deny {
      color: #3b3531;
      background: #ffffff;
      border: 1px solid #cfc9c2;
    }

    .later-note {
      margin: 14px 0 0;
      color: #7a736d;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .later-note .path {
      color: #4b443f;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission-card" aria-labelledby="permission-title">
      <div class="permission-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8.2 6.5 9.5 4.7h5l1.3 1.8H19a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="12.8" r="3.3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>

      <div class="heading-group">
        <p class="eyebrow">Camera permission</p>
        <h1 id="permission-title">Allow Rooknote to use your camera?</h1>
      </div>

      <p class="description">
        Scan handwritten pages straight into your team notes.
      </p>

      <p class="privacy-note">
        The camera runs only when you tap “Scan page.” It is never used in the background.
      </p>

      <div class="actions" aria-label="Camera permission choices">
        <button class="allow" type="button">Allow camera access</button>
        <button class="deny" type="button">Don’t allow</button>
      </div>

      <p class="later-note">
        Prefer to decide later? Turn the camera on any time in
        <span class="path">Settings › Rooknote</span>.
      </p>
    </section>
  </div>
</body>
</html>
