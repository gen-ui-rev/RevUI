<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancel order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6633e0;
    --violet-soft:rgba(102,51,224,0.10);
    --violet-softer:rgba(102,51,224,0.06);
    --ink:#17151f;
    --muted:#5f5b6b;
    --line:#e4e0ed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ebeaee;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .dialog{
    width:334px;
    background:#fff;
    border-radius:14px;
    padding:20px 22px;
  }
  .mark{
    width:38px;
    height:38px;
    border-radius:13px;
    background:var(--violet-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
  }
  h1{
    font-size:21px;
    line-height:1.25;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.2px;
  }
  .body{
    font-size:13px;
    line-height:1.45;
    color:var(--muted);
    margin:0 0 14px;
  }
  .item{
    background:var(--violet-soft);
    border-radius:14px;
    padding:10px;
    display:flex;
    gap:11px;
    align-items:center;
  }
  .item img{
    width:64px;
    height:64px;
    border-radius:13px;
    object-fit:cover;
    display:block;
    background:#d9d7de;
    flex:none;
  }
  .item-text{min-width:0;}
  .item-name{
    font-size:14px;
    font-weight:600;
    line-height:1.35;
    margin:0 0 4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    font-size:12px;
    color:var(--muted);
    margin:0;
    line-height:1.4;
  }
  .refund{
    margin-top:10px;
    background:var(--violet-softer);
    border-radius:14px;
    padding:11px 14px 12px;
  }
  .refund-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:baseline;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
  }
  .refund-row .amount{
    color:var(--ink);
    font-weight:500;
    white-space:nowrap;
  }
  .refund-row.shipping{
    color:var(--violet);
    font-weight:600;
  }
  .refund-row.shipping .amount{color:var(--violet);}
  .refund-total{
    margin-top:7px;
    padding-top:8px;
    border-top:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:baseline;
  }
  .refund-total span{
    font-size:13px;
    color:var(--ink);
    font-weight:600;
  }
  .refund-total strong{
    font-size:16px;
    color:var(--violet);
  }
  .actions{margin-top:16px;}
  .btn{
    display:block;
    width:100%;
    border:0;
    border-radius:14px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:13px 12px;
    text-align:center;
  }
  .btn-primary{background:var(--violet);color:#fff;}
  .btn-ghost{
    background:var(--violet-soft);
    color:var(--violet);
    margin-top:8px;
  }
  .note{
    margin:10px 0 0;
    font-size:11px;
    line-height:1.4;
    color:#8a8694;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dialog">
      <div class="mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6633e0" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </div>

      <h1>Cancel this order?</h1>
      <p class="body">Order #48-20713 has not shipped. Cancellation is final and the item may sell out.</p>

      <div class="item">
        <img src="https://loremflickr.com/64/64/sneakers?lock=10141" width="64" height="64" alt="Low-top canvas sneakers in the order being canceled">
        <div class="item-text">
          <p class="item-name">Halden Court Low-Top Sneakers</p>
          <p class="item-meta">Size 9.5 · Bone White · Qty 1</p>
        </div>
      </div>

      <div class="refund" aria-label="Refund breakdown">
        <div class="refund-row">
          <span>Merchandise</span>
          <span class="amount">$120.00</span>
        </div>
        <div class="refund-row shipping">
          <span>Original shipping included</span>
          <span class="amount">+$8.00</span>
        </div>
        <div class="refund-total">
          <span>Refund to Visa · 4417</span>
          <strong>$128.00</strong>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary">Yes, cancel order</button>
        <button type="button" class="btn btn-ghost">No, keep it</button>
      </div>

      <p class="note">Refunds post within 3–5 business days.</p>
    </div>
  </div>
</body>
</html>
