<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence Spanish — Lesson activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e9e9ea;
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    box-sizing:border-box;
    padding:56px 0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .island{
    width:342px;
    box-sizing:border-box;
    background:#0d0d0e;
    border:1px solid rgba(255,255,255,.12);
    border-radius:36px;
    padding:16px 18px 18px;
    color:#f4f4f5;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:7px;
    color:#8d8d93;
    font-size:12px;
    font-weight:400;
    letter-spacing:.02em;
  }
  .brand svg{display:block;flex:none}
  .brand .sep{color:#4c4c51}
  .main{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:13px;
  }
  .thumb{
    width:48px;
    height:48px;
    border-radius:14px;
    object-fit:cover;
    display:block;
    background:#26262a;
    flex:none;
  }
  .info{min-width:0;flex:1}
  .info h1{
    margin:0;
    font-size:15px;
    font-weight:500;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .info p{
    margin:2px 0 0;
    font-size:12px;
    font-weight:400;
    color:#8d8d93;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .clock{text-align:right;flex:none}
  .clock .val{
    font-size:17px;
    font-weight:500;
    line-height:1.15;
    letter-spacing:.01em;
  }
  .clock .lbl{
    font-size:12px;
    font-weight:400;
    color:#8d8d93;
    margin-top:1px;
  }
  .track{
    margin-top:15px;
    height:6px;
    background:#2b2b2f;
    border-radius:3px;
  }
  .fill{
    width:60%;
    height:100%;
    background:#3ddc97;
    border-radius:3px;
  }
  .stats{
    margin-top:12px;
    display:flex;
    align-items:stretch;
  }
  .stat{
    flex:1;
    min-width:0;
    padding:0 10px;
    border-left:1px solid rgba(255,255,255,.10);
    text-align:center;
  }
  .stat:first-child{
    border-left:0;
    padding-left:0;
    text-align:left;
  }
  .stat:last-child{
    padding-right:0;
    text-align:right;
  }
  .stat .num{
    font-size:14px;
    font-weight:500;
    line-height:1.2;
    color:#eaeaee;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat .cap{
    margin-top:2px;
    font-size:11px;
    font-weight:400;
    color:#8d8d93;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="island">
      <div class="brand">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
          <path d="M1.5 2.5h4a1.5 1.5 0 0 1 1.5 1.5v7a1.2 1.2 0 0 0-1.2-1.2H1.5z" stroke="#8d8d93" stroke-width="1.1" stroke-linejoin="round"/>
          <path d="M11.5 2.5h-4A1.5 1.5 0 0 0 6 4v7a1.2 1.2 0 0 1 1.2-1.2h4.3z" stroke="#8d8d93" stroke-width="1.1" stroke-linejoin="round"/>
        </svg>
        <span>Cadence Spanish</span>
        <span class="sep">·</span>
        <span>Lesson in progress</span>
      </div>

      <div class="main">
        <img class="thumb" src="https://loremflickr.com/48/48/books?lock=4183" width="48" height="48" alt="Spanish grammar workbook used in this lesson">
        <div class="info">
          <h1>Past Tense Verbs</h1>
          <p>Unit 4 · Speaking drill</p>
        </div>
        <div class="clock">
          <div class="val">8:35</div>
          <div class="lbl">remaining</div>
        </div>
      </div>

      <div class="track"><div class="fill"></div></div>

      <div class="stats">
        <div class="stat">
          <div class="num">3 of 5</div>
          <div class="cap">Step</div>
        </div>
        <div class="stat">
          <div class="num">14 / 20</div>
          <div class="cap">Cards</div>
        </div>
        <div class="stat">
          <div class="num">92%</div>
          <div class="cap">Accuracy</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
