<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Achievement — After Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#087f78;
    --teal-soft:#e7f5f3;
    --ink:#171a1f;
    --muted:#687078;
    --line:#e5e8e9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e8eaec;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:28px 24px;
    background:#f2f3f4;
  }
  .card{
    background:#ffffff;
    border:1px solid #e2e5e7;
    border-radius:10px;
    box-shadow:0 8px 22px rgba(24,29,33,.08);
  }
  .hero{
    position:relative;
  }
  .hero img{
    width:100%;
    height:160px;
    object-fit:cover;
    display:block;
    background:#cfd3d8;
    border-radius:9px 9px 0 0;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:9px 9px 0 0;
    background:linear-gradient(to bottom, transparent 45%, rgba(8,17,24,.62));
    pointer-events:none;
  }
  .category{
    position:absolute;
    left:16px;
    bottom:14px;
    z-index:1;
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 9px;
    color:#ffffff;
    background:rgba(10,18,24,.58);
    border:1px solid rgba(255,255,255,.28);
    border-radius:20px;
    font-size:11px;
    line-height:1;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .body{
    padding:20px 20px 18px;
  }
  .title-line{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }
  .eyebrow{
    margin:0 0 5px;
    font-size:11px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--teal);
  }
  h1{
    margin:0;
    font-size:23px;
    line-height:1.2;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .seal{
    width:38px;
    height:38px;
    flex:0 0 38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--teal);
    background:var(--teal-soft);
    border-radius:50%;
  }
  .desc{
    margin:9px 0 0;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    margin-top:16px;
    border:1px solid var(--line);
    border-radius:7px;
  }
  .stat{
    padding:10px 7px;
    text-align:center;
    border-right:1px solid var(--line);
  }
  .stat:last-child{
    border-right:0;
  }
  .stat-value{
    display:block;
    font-size:14px;
    line-height:1.25;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }
  .stat-label{
    display:block;
    margin-top:3px;
    font-size:10px;
    line-height:1.3;
    color:var(--muted);
    white-space:nowrap;
  }
  .next{
    margin-top:15px;
    padding:12px 13px;
    background:var(--teal-soft);
    border-radius:7px;
  }
  .next-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
  }
  .next-title{
    min-width:0;
    font-size:12px;
    line-height:1.4;
    font-weight:700;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .next-count{
    font-size:11px;
    line-height:1.4;
    font-weight:600;
    color:var(--teal);
    white-space:nowrap;
  }
  .next-copy{
    margin:5px 0 0;
    font-size:11px;
    line-height:1.45;
    color:#4f6664;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <div class="hero">
        <img src="https://loremflickr.com/342/160/architecture?lock=1122" width="342" height="160" alt="City towers at dusk, the featured photograph for the After Dark badge">
        <div class="category">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/>
            <circle cx="12" cy="13" r="3.5"/>
          </svg>
          Urban photography
        </div>
      </div>

      <div class="body">
        <div class="title-line">
          <div>
            <p class="eyebrow">Challenge completed</p>
            <h1>After Dark</h1>
          </div>
          <div class="seal" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 3h6l1 3h3v14H5V6h3l1-3z"/>
              <circle cx="12" cy="13" r="4"/>
              <path d="M17.5 9.5h.01"/>
            </svg>
          </div>
        </div>

        <p class="desc">You captured a complete nighttime city series with ten approved photographs.</p>

        <div class="stats">
          <div class="stat">
            <span class="stat-value">10</span>
            <span class="stat-label">Photos</span>
          </div>
          <div class="stat">
            <span class="stat-value">4</span>
            <span class="stat-label">Districts</span>
          </div>
          <div class="stat">
            <span class="stat-value">Mar 14</span>
            <span class="stat-label">Completed</span>
          </div>
        </div>

        <div class="next">
          <div class="next-top">
            <span class="next-title">Next assignment: Blue Hour</span>
            <span class="next-count">3 of 8</span>
          </div>
          <p class="next-copy">Submit five more dawn or dusk photographs.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
