<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode options — Tidepool Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 0;
    margin: 0;
    background: #d8d8d5;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #f5f3ff;
  }
  .screen {
    width: 390px;
    height: 560px;
    padding: 24px 22px;
    background: #0a0b16;
  }
  .sheet { width: 100%; }

  .episode {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 14px;
    background: #131526;
    border: 1px solid #292b45;
  }
  .episode img {
    width: 72px;
    height: 72px;
    display: block;
    flex: none;
    object-fit: cover;
    background: #28293a;
  }
  .episode-copy { min-width: 0; }
  .eyebrow {
    margin: 0 0 4px;
    color: #aaa8d8;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .episode h1 {
    margin: 0 0 5px;
    overflow: hidden;
    color: #ffffff;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .episode .sub {
    margin: 0;
    color: #9295aa;
    font-size: 13px;
  }

  .progress-card {
    margin-top: 16px;
    padding: 18px;
    background: #19152c;
    border: 1px solid #332b52;
  }
  .progress-label {
    margin: 0;
    color: #b9a8f5;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }
  .progress-summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-top: 5px;
  }
  .progress-summary strong {
    color: #ffffff;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    line-height: 1.2;
  }
  .progress-summary span {
    color: #aaa4c2;
    font-size: 14px;
  }
  .track {
    width: 100%;
    height: 8px;
    margin-top: 12px;
    background: #3a3550;
  }
  .fill {
    width: 66%;
    height: 100%;
    background: #a98cff;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    color: #9791ad;
    font-size: 12px;
  }
  .resume {
    margin-top: 14px;
    padding: 12px 16px;
    background: #a98cff;
    color: #11101a;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
  }

  .more-label {
    margin: 17px 0 8px;
    color: #777a90;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .options {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid #25283b;
  }
  .options li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 15px;
    border-top: 1px solid #25283b;
    background: #111320;
    color: #dedee8;
    font-size: 15px;
    font-weight: 600;
  }
  .options li:first-child { border-top: 0; }
  .options .meta {
    flex: none;
    color: #797d91;
    font-size: 13px;
    font-weight: 400;
  }
  .cancel {
    margin-top: 13px;
    padding: 11px;
    color: #8f92a5;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="episode">
        <img src="https://loremflickr.com/72/72/vinyl?lock=4121" width="72" height="72" alt="Cover art for the episode: a record on a turntable">
        <div class="episode-copy">
          <p class="eyebrow">Studio Hours</p>
          <h1>The Analog Years</h1>
          <p class="sub">Episode · 48 min · Feb 14, 2025</p>
        </div>
      </div>

      <div class="progress-card">
        <p class="progress-label">Your listening progress</p>
        <div class="progress-summary">
          <strong>66% complete</strong>
          <span>16 min left</span>
        </div>
        <div class="track" aria-label="66 percent of the episode completed">
          <div class="fill"></div>
        </div>
        <div class="time-row">
          <span>31:42 listened</span>
          <span>48:00 total</span>
        </div>
        <div class="resume">Resume from 31:42</div>
      </div>

      <p class="more-label">More options</p>
      <ul class="options">
        <li>
          <span>Add to queue</span>
          <span class="meta">6 waiting</span>
        </li>
        <li>
          <span>Download</span>
          <span class="meta">62 MB</span>
        </li>
      </ul>

      <div class="cancel">Cancel</div>
    </div>
  </div>
</body>
</html>
