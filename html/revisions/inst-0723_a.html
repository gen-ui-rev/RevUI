<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verba Daily — Listening Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --screen:#0b0d0f;
    --panel:#15191d;
    --panel-2:#1d2328;
    --accent:#ffd84d;
    --ink:#ffffff;
    --muted:#d3d8dc;
    --line:#3d464d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    background:#d7d7d5;
    font-family:'Manrope', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;}
  .screen{
    width:390px;
    height:560px;
    padding:20px 0;
    background:var(--screen);
  }
  .card{
    width:346px;
    margin:0 auto;
    padding:18px;
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:8px;
  }
  .eyebrow{
    margin:0 0 10px;
    color:var(--accent);
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .head{
    display:flex;
    align-items:flex-start;
    gap:16px;
  }
  .art{
    display:block;
    width:132px;
    height:132px;
    flex:0 0 132px;
    object-fit:cover;
    border:2px solid #fff;
    border-radius:6px;
    background:#343a3f;
  }
  .meta{
    min-width:0;
    padding-top:1px;
  }
  .unit{
    margin:0 0 6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  h1{
    margin:0 0 10px;
    font-size:20px;
    line-height:1.22;
    font-weight:700;
  }
  .credit-run{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px 7px;
    margin:0;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    font-weight:700;
  }
  .credit-run .course,
  .credit-run .narrator{
    color:#fff;
  }
  .credit-run .dot{
    color:var(--accent);
  }
  .progress{margin-top:18px;}
  .track{
    height:6px;
    position:relative;
    border:1px solid #59636b;
    border-radius:4px;
    background:#2d343a;
  }
  .fill{
    position:absolute;
    top:-1px;
    bottom:-1px;
    left:-1px;
    width:66%;
    border-radius:4px;
    background:var(--accent);
  }
  .knob{
    position:absolute;
    top:-5px;
    left:66%;
    width:14px;
    height:14px;
    margin-left:-7px;
    border:2px solid var(--screen);
    border-radius:50%;
    background:var(--accent);
  }
  .times{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    color:#fff;
    font-size:12px;
    font-weight:700;
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
  }
  .ghost{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border:1px solid transparent;
    background:none;
    color:#fff;
    font-size:13px;
    font-weight:700;
  }
  .side{
    width:42px;
    height:34px;
    border-color:var(--line);
    border-radius:5px;
    background:var(--panel-2);
  }
  .speed{
    color:var(--accent);
  }
  .play{
    width:52px;
    height:52px;
    border:2px solid #fff;
    border-radius:6px;
    background:var(--accent);
    color:#111;
  }
  .up{
    width:346px;
    margin:16px auto 0;
  }
  .up h2{
    margin:0 0 8px;
    padding:0 2px;
    color:#fff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.11em;
    text-transform:uppercase;
  }
  .rows{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:8px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 12px;
    border-bottom:2px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .thumb{
    display:block;
    width:44px;
    height:44px;
    flex:0 0 44px;
    object-fit:cover;
    border:1px solid #fff;
    border-radius:5px;
    background:#343a3f;
  }
  .rtext{
    min-width:0;
    flex:1;
  }
  .rtitle{
    margin:0 0 2px;
    overflow:hidden;
    color:#fff;
    font-size:13px;
    font-weight:700;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rsub{
    margin:0;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
  }
  .dur{
    flex:0 0 auto;
    color:var(--accent);
    font-size:12px;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <p class="eyebrow">Now playing</p>

      <div class="head">
        <img class="art" src="https://loremflickr.com/132/132/library?lock=9640" width="132" height="132" alt="Library reading room used as the lesson artwork">
        <div class="meta">
          <p class="unit">Unit 7 · Track 3 of 5</p>
          <h1>Ordering at the Market</h1>
          <p class="credit-run">
            <span class="course">Spanish B1</span>
            <span class="dot">•</span>
            <span>with</span>
            <span class="narrator">Rosa Calderón</span>
          </p>
        </div>
      </div>

      <div class="progress">
        <div class="track">
          <div class="fill"></div>
          <div class="knob"></div>
        </div>
        <div class="times">
          <span>12:04</span>
          <span>−6:11</span>
        </div>
      </div>

      <div class="controls">
        <button class="ghost side" type="button" aria-label="Show transcript">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 11h16M4 16h10"></path>
          </svg>
        </button>
        <button class="ghost" type="button" aria-label="Back 15 seconds">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5v5h5"></path>
            <path d="M4.6 10a7.6 7.6 0 1 1 1.4 6.6"></path>
            <text x="12" y="15.5" font-family="Manrope, sans-serif" font-size="7" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <button class="ghost play" type="button" aria-label="Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="7" y="5" width="3.6" height="14" rx="1"></rect>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1"></rect>
          </svg>
        </button>
        <button class="ghost" type="button" aria-label="Forward 15 seconds">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 5v5h-5"></path>
            <path d="M19.4 10a7.6 7.6 0 1 0-1.4 6.6"></path>
            <text x="12" y="15.5" font-family="Manrope, sans-serif" font-size="7" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">15</text>
          </svg>
        </button>
        <button class="ghost side speed" type="button" aria-label="Playback speed">1.25x</button>
      </div>
    </div>

    <div class="up">
      <h2>Next in this unit</h2>
      <div class="rows">
        <div class="row">
          <img class="thumb" src="https://loremflickr.com/44/44/books?lock=9641" width="44" height="44" alt="Stack of workbooks for the vocabulary drill track">
          <div class="rtext">
            <p class="rtitle">Vocabulary Drill: Weights</p>
            <p class="rsub">Track 4 · Repeat after speaker</p>
          </div>
          <span class="dur">9:42</span>
        </div>
        <div class="row">
          <img class="thumb" src="https://loremflickr.com/44/44/study?lock=9642" width="44" height="44" alt="Desk with notes for the closing review track">
          <div class="rtext">
            <p class="rtitle">Review and Shadowing</p>
            <p class="rsub">Track 5 · Ends Unit 7</p>
          </div>
          <span class="dur">14:20</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
