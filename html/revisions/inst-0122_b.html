<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice picking microphone access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d9dcdd;
    font-family: 'Nunito Sans', system-ui, sans-serif;
    color: #ffffff;
  }
  .screen {
    width: 184px;
    height: 224px;
    padding: 15px 14px;
    background: #13252b;
    border: 2px solid #263b42;
    border-radius: 30px;
    box-shadow: 0 9px 26px rgba(11, 25, 30, 0.24);
    text-align: center;
  }
  .hero {
    display: none;
    width: 342px;
    height: 156px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.13;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .body {
    margin: 7px 0 0;
    color: #b8c6c9;
    font-size: 11px;
    line-height: 15px;
    white-space: nowrap;
  }
  .actions {
    margin-top: 16px;
  }
  .btn {
    display: block;
    border: 0;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    padding: 18px 8px;
    border-radius: 28px;
    background: #b9ec58;
    color: #102026;
    font-size: 18px;
    line-height: 22px;
    font-weight: 700;
    text-align: center;
    box-shadow: inset 0 -3px 0 rgba(45, 73, 10, 0.25);
  }
  .btn-primary svg {
    display: inline-block;
    margin-right: 5px;
    vertical-align: -2px;
  }
  .btn-secondary {
    width: auto;
    margin: 18px auto 0;
    padding: 0;
    background: transparent;
    color: #a9b8bc;
    font-size: 11px;
    line-height: 14px;
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="screen">
    <img class="hero" src="https://loremflickr.com/342/156/study?lock=2463" width="342" height="156" alt="A learner practicing spoken English aloud at a desk with an open notebook">

    <h1>Keep picking while you speak</h1>
    <p class="body">Speak picks. Keep moving.</p>

    <div class="actions">
      <button class="btn btn-primary" type="button">
        <svg width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true">
          <rect x="4" y="1" width="6" height="10" rx="3" stroke="currentColor" stroke-width="1.7"/>
          <path d="M1.8 8.5a5.2 5.2 0 0 0 10.4 0M7 13.7V17M4.5 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Allow mic
      </button>
      <button class="btn btn-secondary" type="button">Continue without voice</button>
    </div>
  </div>
</body>
</html>
