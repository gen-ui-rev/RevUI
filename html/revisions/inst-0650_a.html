<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamstead Billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dededb;
      color: #23272a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px 24px;
      background: #f7f7f5;
    }

    .billing {
      width: 100%;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .heading {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .service-name {
      margin-top: 2px;
      color: #70777c;
      font-size: 14px;
      line-height: 1.45;
    }

    .billing-overview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-card {
      padding: 14px;
      border-radius: 7px;
      background: #e6e9eb;
    }

    .payment-card {
      background: #eceeed;
    }

    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .eyebrow {
      color: #596269;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .summary-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #66717a;
    }

    .amount {
      margin-top: 12px;
      color: #465159;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .charge-date {
      margin-top: 5px;
      color: #596168;
      font-size: 12px;
      line-height: 1.4;
    }

    .card-number {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .card-meta {
      margin-top: 5px;
      color: #747a7e;
      font-size: 12px;
      line-height: 1.4;
    }

    .section {
      margin-top: 20px;
    }

    h2 {
      margin-bottom: 9px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .invoice-list {
      display: grid;
      gap: 6px;
    }

    .invoice-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 30px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #eceeed;
      border-radius: 6px;
    }

    .invoice-copy {
      min-width: 0;
    }

    .invoice-date {
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .invoice-number {
      margin-top: 1px;
      color: #777d81;
      font-size: 12px;
      line-height: 1.4;
    }

    .invoice-amount {
      color: #454b4f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      white-space: nowrap;
    }

    .download {
      width: 30px;
      height: 30px;
      padding: 5px;
      border: 0;
      border-radius: 6px;
      background: #dde1e2;
      color: #626b70;
      font: inherit;
      cursor: pointer;
    }

    .download svg {
      display: block;
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="billing" aria-labelledby="billing-title">
      <header class="heading">
        <h1 id="billing-title">Billing</h1>
        <p class="service-name">Roamstead Explorer plan</p>
      </header>

      <div class="billing-overview">
        <section class="summary-card" aria-labelledby="next-charge-label-a">
          <div class="summary-top">
            <p class="eyebrow" id="next-charge-label-a">Next charge</p>
            <svg class="summary-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12H4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 13h2M14 13h2M8 16.5h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="amount">$24.00</p>
          <p class="charge-date">May 18, 2026<br>Monthly</p>
        </section>

        <section class="summary-card payment-card" aria-labelledby="payment-title-a">
          <div class="summary-top">
            <p class="eyebrow" id="payment-title-a">Payment</p>
            <svg class="summary-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 9h18M7 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="card-number">Card •••• 4832</p>
          <p class="card-meta">Expires 09/28<br>Default method</p>
        </section>
      </div>

      <section class="section" aria-labelledby="invoice-title-a">
        <h2 id="invoice-title-a">Invoice history</h2>
        <div class="invoice-list">
          <article class="invoice-row">
            <div class="invoice-copy">
              <p class="invoice-date">April 18, 2026</p>
              <p class="invoice-number">Invoice RS-10482</p>
            </div>
            <p class="invoice-amount">$24.00</p>
            <button class="download" type="button" aria-label="Download invoice RS-10482">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v10M8.5 11l3.5 3.5 3.5-3.5M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </article>

          <article class="invoice-row">
            <div class="invoice-copy">
              <p class="invoice-date">March 18, 2026</p>
              <p class="invoice-number">Invoice RS-10361</p>
            </div>
            <p class="invoice-amount">$24.00</p>
            <button class="download" type="button" aria-label="Download invoice RS-10361">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v10M8.5 11l3.5 3.5 3.5-3.5M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </article>

          <article class="invoice-row">
            <div class="invoice-copy">
              <p class="invoice-date">February 18, 2026</p>
              <p class="invoice-number">Invoice RS-10247</p>
            </div>
            <p class="invoice-amount">$24.00</p>
            <button class="download" type="button" aria-label="Download invoice RS-10247">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v10M8.5 11l3.5 3.5 3.5-3.5M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </article>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
