<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Fund Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dedfd9;
      color: #25271f;
      font-family: 'Nunito Sans', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #f5f4ef;
    }

    .progress-card {
      width: 100%;
      padding: 22px 24px;
      border: 1px solid #d4d5cb;
      border-radius: 4px;
      background: #fbfaf6;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #6f762f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
    }

    .goal-note {
      margin: 7px 0 0;
      color: #696b62;
      font-size: 13px;
      line-height: 1.5;
    }

    .ring-wrap {
      position: relative;
      width: 140px;
      margin: 16px auto 12px;
    }

    .ring-wrap svg {
      display: block;
      width: 140px;
      height: 140px;
    }

    .ring-track {
      fill: none;
      stroke: #e2e2d8;
      stroke-width: 12;
    }

    .ring-value {
      fill: none;
      stroke: #747b35;
      stroke-width: 12;
      stroke-linecap: butt;
      stroke-dasharray: 239 352;
      transform: rotate(-90deg);
      transform-origin: 70px 70px;
    }

    .ring-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .amount {
      font-size: 26px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .amount-sub {
      margin-top: 6px;
      color: #696b62;
      font-size: 12px;
      line-height: 1.2;
    }

    .percent-pill {
      display: inline-block;
      margin: 0 0 16px;
      padding: 6px 14px;
      border: 1px solid #cfd2b8;
      border-radius: 999px;
      background: #f0f1e4;
      color: #56592d;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .fact-list {
      margin: 0;
      padding: 0;
      border-top: 1px solid #d4d5cb;
      text-align: left;
      list-style: none;
    }

    .fact-list li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e5db;
    }

    .fact-list li:last-child {
      border-bottom: 0;
      padding-bottom: 2px;
    }

    .fact-label {
      color: #696b62;
      font-size: 13px;
      line-height: 1.3;
    }

    .fact-value {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="progress-card" aria-labelledby="goal-title">
      <p class="eyebrow">Cedar Ledger goal</p>
      <h1 id="goal-title">Emergency fund</h1>
      <p class="goal-note">Build six months of essential expenses.</p>

      <div class="ring-wrap" role="img" aria-label="8,160 dollars saved of a 12,000 dollar goal, 68 percent complete">
        <svg viewBox="0 0 140 140" aria-hidden="true">
          <circle class="ring-track" cx="70" cy="70" r="56"></circle>
          <circle class="ring-value" cx="70" cy="70" r="56"></circle>
        </svg>
        <div class="ring-copy">
          <div class="amount">$8,160</div>
          <div class="amount-sub">of $12,000</div>
        </div>
      </div>

      <p class="percent-pill">68% of goal saved</p>

      <ul class="fact-list">
        <li>
          <span class="fact-label">Target date</span>
          <span class="fact-value">November 2026</span>
        </li>
        <li>
          <span class="fact-label">Remaining</span>
          <span class="fact-value">$3,840</span>
        </li>
        <li>
          <span class="fact-label">Monthly transfer</span>
          <span class="fact-value">$320</span>
        </li>
      </ul>
    </section>
  </div>
</body>
</html>
