<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#B45309;
    --ink:#1B1B1B;
    --muted:#767676;
    --rule:#E6E4E1;
    --warm:#FDF6EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#EFEDEA;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:560px;
    background:#FFFFFF;
    padding:22px 0;
  }
  .sheet{padding:0 22px;}
  .topline{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .heading{min-width:0;}
  .title{
    margin:0;
    font-size:21px;
    line-height:26px;
    font-weight:600;
    letter-spacing:-0.25px;
  }
  .subtitle{
    margin:3px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .selected-count{
    flex:0 0 auto;
    margin-top:2px;
    padding:5px 8px;
    border-radius:12px;
    background:var(--warm);
    color:var(--accent);
    font-size:11px;
    line-height:14px;
    font-weight:600;
  }
  .search{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:15px;
    padding:10px 12px;
    border:1px solid transparent;
    border-radius:7px;
    background:#F4F3F1;
  }
  .search svg{flex:0 0 18px;}
  .search input{
    min-width:0;
    width:100%;
    padding:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--ink);
    font:400 14px/19px 'Inter',system-ui,sans-serif;
  }
  .search input::placeholder{color:#85817D;}
  .recipients{
    margin-top:12px;
    border:1px solid var(--rule);
    border-radius:8px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 11px;
  }
  .row + .row{border-top:1px solid var(--rule);}
  .avatar{
    width:33px;
    height:33px;
    flex:0 0 33px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    background:#F3F1EE;
  }
  .avatar.team{background:#F7EEE3;}
  .who{min-width:0;flex:1;}
  .name{
    font-size:14px;
    line-height:18px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    color:var(--muted);
    font-size:12px;
    line-height:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pick{
    width:20px;
    height:20px;
    flex:0 0 20px;
    border:1.5px solid #C9C6C2;
    border-radius:4px;
  }
  .pick.on{
    display:flex;
    align-items:center;
    justify-content:center;
    border-color:var(--accent);
    background:var(--accent);
  }
  .channel-line{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:14px;
  }
  .channel-label{
    margin-right:auto;
    color:var(--muted);
    font-size:12px;
    line-height:16px;
    font-weight:500;
  }
  .channel{
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;
    height:32px;
    border:1px solid var(--rule);
    border-radius:50%;
    background:#FFFFFF;
    color:#6F6B67;
  }
  .send-panel{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .send{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 12px;
    border:0;
    border-radius:7px;
    background:var(--accent);
    color:#FFFFFF;
    font:600 15px/18px 'Inter',system-ui,sans-serif;
  }
  .note{
    margin:9px 0 0;
    color:var(--muted);
    font-size:11px;
    line-height:16px;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="sheet">
      <div class="topline">
        <div class="heading">
          <h1 class="title">Share note</h1>
          <p class="subtitle">Q3 Planning Retro &middot; Harbor Studio</p>
        </div>
        <div class="selected-count">2 selected</div>
      </div>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#77736F" stroke-width="1.7" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="5.8"></circle>
          <path d="M15 15l4.5 4.5"></path>
        </svg>
        <input type="search" aria-label="Search recipients" placeholder="Find a person or team">
      </label>

      <div class="recipients">
        <div class="row">
          <div class="avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#85817D" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Dana Whitfield</div>
            <div class="meta">Design &middot; Can edit</div>
          </div>
          <div class="pick on">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#85817D" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
          </div>
          <div class="who">
            <div class="name">Miles Okafor</div>
            <div class="meta">Engineering &middot; Can comment</div>
          </div>
          <div class="pick on">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>

        <div class="row">
          <div class="avatar team">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9A6A3D" stroke-width="1.5" stroke-linecap="round"><path d="M4 18.5c0-3.6 3.6-6 8-6s8 2.4 8 6"/><circle cx="12" cy="7" r="3.5"/><path d="M9 21h6"/></svg>
          </div>
          <div class="who">
            <div class="name">Product Guild</div>
            <div class="meta">Team &middot; 14 members</div>
          </div>
          <div class="pick"></div>
        </div>
      </div>

      <div class="channel-line">
        <div class="channel-label">Share another way</div>
        <div class="channel" aria-label="Copy link">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
        </div>
        <div class="channel" aria-label="Email">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4.5 7.5l7.5 5.5 7.5-5.5"/></svg>
        </div>
        <div class="channel" aria-label="Message">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.2c0 3.8-3.6 6.8-8 6.8-1 0-2-.2-2.9-.5L4.5 20l1.2-3.3A6.5 6.5 0 0 1 4 12.2C4 8.4 7.6 5.4 12 5.4s8 3 8 6.8Z"/></svg>
        </div>
      </div>

      <div class="send-panel">
        <button class="send" type="button">
          Share with 2 recipients
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m14 7 5 5-5 5"/></svg>
        </button>
        <p class="note">Selected recipients will be granted access.</p>
      </div>
    </div>
  </div>
</body>
</html>
