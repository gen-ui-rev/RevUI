<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rooftop Crew — Full-Screen Shared View</title>
<style>
  :root{
    --ink:#f7f5f2;
    --sub:#bdb8b1;
    --line:rgba(255,255,255,.16);
    --panel:rgba(27,26,24,.88);
    --accent:#e2661a;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#d7d4cf;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:844px;
    position:relative;
    background:#151412;
  }
  .topbar{
    position:absolute;
    z-index:2;
    top:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px;
    background:linear-gradient(to bottom,rgba(18,17,15,.95),rgba(18,17,15,.72));
    border-bottom:1px solid var(--line);
  }
  .iconbtn{
    width:36px;
    height:36px;
    border:1px solid var(--line);
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:rgba(255,255,255,.08);
  }
  .titlewrap{flex:1 1 auto;min-width:0;}
  .title{
    font-size:16px;
    font-weight:600;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    margin-top:2px;
    color:var(--sub);
    font-size:12px;
    line-height:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dot{
    display:inline-block;
    width:6px;
    height:6px;
    margin-right:5px;
    border-radius:50%;
    background:var(--accent);
    vertical-align:middle;
  }
  .viewer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:86px 17px 202px;
    background:#151412;
  }
  .shared{
    width:356px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    background:#201f1c;
    box-shadow:0 20px 45px rgba(0,0,0,.34);
  }
  .shared img{
    width:356px;
    height:310px;
    display:block;
    object-fit:cover;
    background:#34312d;
    border-radius:11px 11px 0 0;
  }
  .caption{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-top:1px solid var(--line);
  }
  .mono{
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:rgba(255,255,255,.1);
    color:#fff;
    font-size:13px;
    font-weight:700;
  }
  .capcopy{min-width:0;}
  .capname{
    font-size:14px;
    font-weight:600;
    line-height:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .capsub{
    margin-top:1px;
    color:var(--sub);
    font-size:12px;
    line-height:16px;
  }
  .quality{
    margin-left:auto;
    padding:4px 7px;
    border:1px solid var(--line);
    border-radius:7px;
    color:#d7d2cb;
    font-size:11px;
    white-space:nowrap;
  }
  .controls{
    position:absolute;
    z-index:2;
    right:12px;
    bottom:16px;
    left:12px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:18px;
    background:var(--panel);
    box-shadow:0 16px 35px rgba(0,0,0,.32);
  }
  .ctrlrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .ctrl{
    width:70px;
    text-align:center;
  }
  .circle{
    width:58px;
    height:58px;
    margin:0 auto;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.08);
  }
  .circle.on{
    border-color:rgba(226,102,26,.65);
    background:rgba(226,102,26,.2);
  }
  .clabel{
    margin-top:6px;
    color:#d6d1ca;
    font-size:11px;
    line-height:14px;
    white-space:nowrap;
  }
  .leave{
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    line-height:20px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-label="Close full-screen view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7f5f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </div>
      <div class="titlewrap">
        <div class="title">Nadia’s shared view</div>
        <div class="subtitle"><span class="dot"></span>Rooftop Crew · 12:47</div>
      </div>
      <div class="iconbtn" aria-label="View participants">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f7f5f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19v-1a5.5 5.5 0 0 1 11 0v1"></path><circle cx="17.5" cy="9" r="2.2"></circle><path d="M16 14.7a4.5 4.5 0 0 1 4.5 4.3"></path></svg>
      </div>
    </div>

    <div class="viewer">
      <div class="shared">
        <img src="https://loremflickr.com/356/310/street?lock=2741" width="356" height="310" alt="Live camera view of the evening street below the rooftop">
        <div class="caption">
          <div class="mono">NF</div>
          <div class="capcopy">
            <div class="capname">Nadia Ferreira</div>
            <div class="capsub">Sharing rear camera</div>
          </div>
          <div class="quality">1080p</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrlrow">
        <div class="ctrl">
          <div class="circle on">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f08a49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"></rect><path d="M15.5 11l6-3.5v9L15.5 13z"></path></svg>
          </div>
          <div class="clabel">Camera on</div>
        </div>
        <div class="ctrl">
          <div class="circle on">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f08a49" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><line x1="12" y1="17.5" x2="12" y2="21"></line></svg>
          </div>
          <div class="clabel">Mic on</div>
        </div>
        <div class="ctrl">
          <div class="circle">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f7f5f2" stroke-width="1.8" stroke-linecap="round"><circle cx="5.5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18.5" cy="12" r="1.4"></circle></svg>
          </div>
          <div class="clabel">More</div>
        </div>
        <div class="ctrl">
          <div class="circle">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f7f5f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path><path d="M16 9.5a4 4 0 0 1 0 5"></path><path d="M18.5 7a7.5 7.5 0 0 1 0 10"></path></svg>
          </div>
          <div class="clabel">Speaker</div>
        </div>
      </div>
      <div class="leave">Leave call</div>
    </div>
  </div>
</body>
</html>
