<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Review Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8ecef;
      color: #18303d;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px 24px;
      background: #f5f7f8;
    }

    .booking {
      width: 100%;
      padding: 20px;
      background: #ffffff;
      border-radius: 4px;
    }

    .service-label {
      margin: 0;
      color: #0782b5;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 0;
      color: #152d39;
      font-size: 27px;
      font-weight: 600;
      line-height: 35px;
      letter-spacing: -0.02em;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pnum {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #dfe7eb;
      color: #7b8d96;
      font-size: 10px;
      font-weight: 600;
      line-height: 18px;
    }

    .pnum svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .progress-step.done .pnum {
      background: #0787ba;
      color: #ffffff;
    }

    .progress-step.current .pnum {
      border: 2px solid #0787ba;
      background: #ffffff;
      color: #0787ba;
    }

    .plabel {
      color: #96a4ab;
      font-size: 11px;
      font-weight: 600;
      line-height: 18px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-step.done .plabel {
      color: #0782b5;
    }

    .progress-step.current .plabel {
      color: #17495e;
    }

    .ptrack {
      flex: 1 1 auto;
      height: 2px;
      border-radius: 1px;
      background: #dfe7eb;
    }

    .ptrack.filled {
      background: #8dd0ea;
    }

    .step-card {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #e2eaee;
      border-radius: 4px;
      background: #ffffff;
    }

    .step-card.done {
      background: #f6fafc;
    }

    .step-card.current {
      border-color: #a9dcef;
      box-shadow: inset 3px 0 0 #0787ba;
    }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #4f7484;
      font-size: 12px;
      font-weight: 600;
      line-height: 21px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .summary-title svg {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      fill: none;
      stroke: #0787ba;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .summary-value {
      margin-left: auto;
      color: #17495e;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
      white-space: nowrap;
    }

    .change {
      padding: 0;
      border: 0;
      background: none;
      color: #0787ba;
      font-size: 12px;
      font-weight: 600;
      line-height: 21px;
      text-decoration: underline;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    h2 {
      margin: 0;
      color: #29424e;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .step-tag {
      flex: 0 0 auto;
      color: #7b8d96;
      font-size: 10px;
      font-weight: 600;
      line-height: 21px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .step-card.current .step-tag {
      color: #0787ba;
    }

    button {
      font-family: inherit;
      cursor: default;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .time-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 10px;
      border: 0;
      border-radius: 4px;
      background: #eef3f5;
      color: #415761;
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
    }

    .time-option.selected {
      background: #d9f1fb;
      color: #087dac;
    }

    .time-option svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .final-line {
      margin: 4px 0 0;
      color: #62737c;
      font-size: 13px;
      font-weight: 500;
      line-height: 21px;
    }

    .confirm {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      border: 0;
      border-radius: 4px;
      background: #0787ba;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="booking" aria-labelledby="booking-title">
      <p class="service-label">Morrowmint Advisory</p>
      <h1 id="booking-title">Choose your review time</h1>

      <div class="progress" aria-label="Booking steps">
        <div class="progress-step done">
          <span class="pnum" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M4 10.5l3.5 3.5L16 5.5"></path></svg>
          </span>
          <span class="plabel">Date</span>
        </div>
        <span class="ptrack filled" aria-hidden="true"></span>
        <div class="progress-step current">
          <span class="pnum" aria-hidden="true">2</span>
          <span class="plabel">Time</span>
        </div>
        <span class="ptrack" aria-hidden="true"></span>
        <div class="progress-step">
          <span class="pnum" aria-hidden="true">3</span>
          <span class="plabel">Confirm</span>
        </div>
      </div>

      <section class="step-card done">
        <div class="summary-row">
          <span class="summary-title">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5"></path></svg>
            Step 1 Date
          </span>
          <span class="summary-value">Thu, Jun 18</span>
          <button class="change" type="button">Change</button>
        </div>
      </section>

      <section class="step-card current" aria-labelledby="time-heading">
        <div class="card-head">
          <h2 id="time-heading">Pick a time</h2>
          <span class="step-tag">Step 2 of 3</span>
        </div>
        <div class="time-options" role="group" aria-labelledby="time-heading">
          <button class="time-option" type="button" aria-pressed="false">9:00 AM</button>
          <button class="time-option selected" type="button" aria-pressed="true">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 10.5l3.5 3.5L16 5.5"></path>
            </svg>
            10:30 AM
          </button>
          <button class="time-option" type="button" aria-pressed="false">1:00 PM</button>
          <button class="time-option" type="button" aria-pressed="false">2:30 PM</button>
        </div>
      </section>

      <section class="step-card" aria-labelledby="confirm-heading">
        <div class="card-head">
          <h2 id="confirm-heading">Confirm and book</h2>
          <span class="step-tag">Step 3 of 3</span>
        </div>
        <p class="final-line">Jun 18, 2026 · 10:30 AM · 30 min with Dorian Hale</p>
        <button class="confirm" type="button">Confirm appointment</button>
      </section>
    </main>
  </div>
</body>
</html>
