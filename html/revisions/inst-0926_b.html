<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interval timer — Northline Run Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ebeceb;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    color: #34231a;
  }
  .screen {
    width: 184px;
    height: 224px;
    box-sizing: border-box;
    padding: 10px 13px 8px;
    background: #fdf4ea;
    border-radius: 46px;
    overflow: hidden;
    box-shadow: 0 8px 22px rgba(60, 34, 20, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    text-align: left;
  }
  .head img {
    display: block;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #ecdccb;
    border: 1.5px solid #e6d0bb;
  }
  .head-text {
    min-width: 0;
  }
  .eyebrow {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #b4491f;
    margin: 0 0 1px;
  }
  .session {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 11px;
    line-height: 1.15;
    margin: 0;
    color: #3d2a1f;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dial {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    margin: 6px 0 0;
    background: conic-gradient(#b4491f 0 30%, #ecd9c6 30% 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .dial-inner {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: #fdf4ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .clock {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0;
    color: #3d2a1f;
  }
  .sub {
    font-size: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #997f6c;
    margin: 3px 0 0;
  }
  .elapsed {
    font-size: 9px;
    color: #8a7261;
    margin: 5px 0 0;
  }
  .btn {
    box-sizing: border-box;
    font-family: inherit;
    text-align: center;
    border-radius: 999px;
  }
  .btn.primary {
    width: 100%;
    margin-top: 6px;
    padding: 8px 6px;
    font-size: 13px;
    font-weight: 600;
    background: #b4491f;
    color: #fff6ee;
    border: none;
  }
  .btn.minor {
    width: 62%;
    margin-top: 5px;
    padding: 4px 4px;
    font-size: 9.5px;
    font-weight: 600;
    color: #b4491f;
    background: transparent;
    border: 1px solid #e0c3ac;
  }
  .next {
    margin: 6px 0 0;
    font-size: 8.5px;
    line-height: 1.3;
    color: #8a7261;
  }
  .next strong {
    font-weight: 600;
    color: #3d2a1f;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="head">
      <img src="https://loremflickr.com/36/36/running?lock=12263" width="36" height="36" alt="Runner on a park path during a tempo interval">
      <div class="head-text">
        <p class="eyebrow">Interval 3 / 5</p>
        <h1 class="session">Tempo Ladder Wk 6</h1>
      </div>
    </div>
    <div class="dial">
      <div class="dial-inner">
        <p class="clock">4:12</p>
        <p class="sub">of 6:00</p>
      </div>
    </div>
    <p class="elapsed">1:48 elapsed</p>
    <div class="btn primary">Pause</div>
    <div class="btn minor">Skip interval</div>
    <p class="next">Next: <strong>Recovery walk 2:00</strong></p>
  </div>
</body>
</html>
