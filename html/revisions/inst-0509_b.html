<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#e8e9ea;
    font-family:'Inter', system-ui, sans-serif;
  }
  .screen{
    width:184px;
    height:224px;
    box-sizing:border-box;
    background:#1e2023;
    border-radius:30px;
    padding:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    overflow:hidden;
  }
  .status{
    font-size:15px;
    font-weight:600;
    line-height:18px;
    color:#f3f4f6;
    margin:0;
  }
  .time{
    margin:2px 0 0;
    font-size:34px
    ;font-weight:700;
    line-height:38px;
    letter-spacing:-0.02em;
    color:#22d3ee;
  }
  .time span{
    font-size:12px;
    font-weight:500;
    color:#9aa0a8;
    margin-left:2px;
  }
  .caption{
    margin:1px 0 0;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#9aa0a8;
  }
  .pips{
    display:flex;
    gap:4px;
    margin-top:12px;
    width:100%;
  }
  .pips i{
    flex:1;
    height:8px;
    border-radius:2px;
    background:#3a3e44;
  }
  .pips i.done{background:#22d3ee}
  .pips i.now{background:#22d3ee;opacity:0.45}
  .progress{
    margin:9px 0 0;
    font-size:12px;
    font-weight:600;
    color:#f3f4f6;
  }
  .progress b{
    font-weight:400;
    color:#9aa0a8;
  }
  .rule{
    width:100%;
    height:1px;
    background:#34383e;
    margin:11px 0 10px;
  }
  .drop{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    text-align:left;
  }
  .drop img{
    display:block;
    width:36px;
    height:36px;
    object-fit:cover;
    background:#3a3e44;
    border-radius:9px;
    flex:none;
  }
  .drop .text{min-width:0}
  .drop .name{
    margin:0;
    font-size:11px;
    font-weight:600;
    color:#f3f4f6;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .drop .addr{
    margin:2px 0 0;
    font-size:10px;
    font-weight:400;
    color:#9aa0a8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .footer{
    margin-top:auto;
    padding-top:8px;
    font-size:10px;
    font-weight:500;
    color:#9aa0a8;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="status">On route</p>
    <p class="time">4:35<span>PM</span></p>
    <p class="caption">Next drop</p>

    <div class="pips">
      <i class="done"></i><i class="done"></i><i class="done"></i>
      <i class="done"></i><i class="done"></i><i class="done"></i>
      <i class="now"></i><i></i><i></i>
    </div>
    <p class="progress">Stop 7 of 9 <b>· 3 left</b></p>

    <div class="rule"></div>

    <div class="drop">
      <img src="https://loremflickr.com/36/36/furniture?lock=6921" width="36" height="36" alt="Alder lounge chair on the delivery van">
      <div class="text">
        <p class="name">Alder Lounge Chair</p>
        <p class="addr">12 Rowan St · Apt 4</p>
      </div>
    </div>

    <div class="footer">Run ends 5:20 PM</div>
  </div>
</body>
</html>
