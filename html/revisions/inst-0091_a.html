<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access requests — Planora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9e7e7;
      color: #292426;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px 20px;
      background: #f8f6f6;
    }

    .panel {
      padding: 24px 20px 20px;
      background: #ffffff;
      border-radius: 6px;
    }

    .header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .summary {
      margin: 6px 0 0;
      color: #756b6f;
      font-size: 14px;
      line-height: 1.45;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      background: rgba(190, 58, 95, 0.09);
    }

    .search svg {
      width: 18px;
      aspect-ratio: 1;
      flex: 0 0 auto;
      color: #9f5268;
    }

    .search input {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #292426;
      font: 400 14px/1.4 'Inter', system-ui, sans-serif;
    }

    .search input::placeholder {
      color: #8d7e83;
      opacity: 1;
    }

    .group + .group {
      margin-top: 14px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      color: #9f5268;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .group-title .count {
      color: #a79ba0;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .group.done .group-title {
      color: #7e7377;
    }

    .person {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
    }

    .person + .person {
      border-top: 1px solid #f0ebed;
    }

    .avatar {
      width: 44px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(190, 58, 95, 0.13);
      color: #a22f51;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
    }

    .group.done .avatar {
      background: rgba(41, 36, 38, 0.07);
      color: #6c6367;
    }

    .identity {
      min-width: 0;
    }

    .access {
      margin: 0;
      overflow: hidden;
      color: #9e3151;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group.done .access {
      color: #7e7377;
    }

    .name {
      margin: 2px 0 0;
      overflow: hidden;
      color: #292426;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      min-width: 86px;
      padding: 9px 11px;
      border: 0;
      border-radius: 6px;
      font: 600 12px/1.2 'Inter', system-ui, sans-serif;
      cursor: pointer;
    }

    .approve {
      background: #b9375d;
      color: #ffffff;
    }

    .approved {
      background: rgba(41, 36, 38, 0.06);
      color: #6c6367;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="panel" aria-labelledby="requests-title">
      <header class="header">
        <h1 id="requests-title">Access requests</h1>
        <p class="summary">4 people asked to join the Planora workspace.</p>
      </header>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input type="search" aria-label="Find a requester" placeholder="Find a requester">
      </label>

      <section class="group" aria-label="Pending requests">
        <h2 class="group-title">Pending <span class="count">2</span></h2>

        <article class="person">
          <div class="avatar" aria-hidden="true">AM</div>
          <div class="identity">
            <p class="access">Editor · Q3 Roadmap</p>
            <p class="name">Avery Morgan</p>
          </div>
          <button class="approve" type="button">Approve</button>
        </article>

        <article class="person">
          <div class="avatar" aria-hidden="true">JL</div>
          <div class="identity">
            <p class="access">Admin · Design System</p>
            <p class="name">Jordan Lane</p>
          </div>
          <button class="approve" type="button">Approve</button>
        </article>
      </section>

      <section class="group done" aria-label="Approved requests">
        <h2 class="group-title">Approved <span class="count">2</span></h2>

        <article class="person">
          <div class="avatar" aria-hidden="true">CK</div>
          <div class="identity">
            <p class="access">Viewer · Client Billing</p>
            <p class="name">Casey Kim</p>
          </div>
          <button class="approved" type="button">Approved</button>
        </article>

        <article class="person">
          <div class="avatar" aria-hidden="true">RT</div>
          <div class="identity">
            <p class="access">Editor · Research Hub</p>
            <p class="name">Riley Turner</p>
          </div>
          <button class="approved" type="button">Approved</button>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
