<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circleline Room Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e7e7e3;
      color: #171714;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 1024px;
      height: 768px;
      display: grid;
      grid-template-columns: 304px minmax(0, 1fr);
      background: #fafaf7;
      border: 1px solid #d3d3cc;
      box-shadow: 0 20px 52px rgba(30, 30, 26, 0.1);
    }

    .room-header {
      min-width: 0;
      padding: 44px 34px 40px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #d8d8d1;
      background: #f2f2ed;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #706f67;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #171714;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.22;
    }

    .session-time {
      margin: 14px 0 0;
      color: #65645d;
      font-size: 13px;
      line-height: 1.5;
    }

    .participant-block {
      margin-top: 46px;
      padding-top: 24px;
      border-top: 1px solid #d3d3cb;
    }

    .participant-heading {
      margin: 0 0 15px;
      color: #44443e;
      font-size: 13px;
      font-weight: 600;
    }

    .participant-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .people {
      display: flex;
      align-items: center;
    }

    .monogram {
      width: 40px;
      height: 40px;
      margin-left: -8px;
      display: grid;
      place-items: center;
      border: 2px solid #f2f2ed;
      border-radius: 50%;
      background: #2d2d29;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .monogram:first-child {
      margin-left: 0;
      background: #6c634b;
    }

    .more-count {
      color: #66655e;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    button {
      min-height: 48px;
      border-radius: 5px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: default;
    }

    .invite {
      width: 100%;
      margin-top: 22px;
      padding: 0 16px;
      border: 1px solid #d5aa00;
      background: #f4c62f;
      color: #171714;
    }

    .host-note {
      margin: auto 0 0;
      color: #77766e;
      font-size: 12px;
      line-height: 1.55;
    }

    .timer {
      min-width: 0;
      padding: 38px 46px 40px;
      display: flex;
      flex-direction: column;
      background: #20201d;
      color: #ffffff;
    }

    .timer-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .timer-label {
      margin: 0;
      color: #d1d0c8;
      font-size: 15px;
      font-weight: 500;
    }

    .live-badge {
      padding: 7px 10px;
      border: 1px solid #4a4a44;
      border-radius: 4px;
      color: #d7d6ce;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .timer-stage {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 0 14px;
      text-align: center;
    }

    .timer-ring {
      position: relative;
      width: 356px;
      height: 356px;
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      width: 356px;
      height: 356px;
      transform: rotate(-90deg);
    }

    .timer-value {
      position: relative;
      color: #ffffff;
      font-size: 82px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .timer-status {
      margin: 17px 0 0;
      color: #aaa9a1;
      font-size: 13px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 24px;
      border-top: 1px solid #41413c;
    }

    .pause {
      border: 1px solid #e2b600;
      background: #f4c62f;
      color: #171714;
    }

    .end {
      border: 1px solid #6a6962;
      background: transparent;
      color: #f2f2ed;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="room-header">
      <div>
        <p class="eyebrow">Circleline room</p>
        <h1>Neighborhood introductions</h1>
        <p class="session-time">Started at 7:30 PM<br>Hosted by Mara and Owen</p>
      </div>

      <div class="participant-block">
        <p class="participant-heading">Participants</p>
        <div class="participant-row">
          <div class="people" aria-label="Mara and Owen are in the room">
            <div class="monogram" aria-hidden="true">MR</div>
            <div class="monogram" aria-hidden="true">OK</div>
          </div>
          <span class="more-count">6 joined</span>
        </div>
        <button class="invite" type="button">Invite participants</button>
      </div>

      <p class="host-note">Share an invitation link to bring more neighbors into this conversation.</p>
    </header>

    <main class="timer">
      <div class="timer-topline">
        <p class="timer-label">Conversation ends in</p>
        <span class="live-badge">In session</span>
      </div>

      <div class="timer-stage">
        <div>
          <div class="timer-ring" role="img" aria-label="18 minutes and 24 seconds remaining, 68 percent">
            <svg viewBox="0 0 356 356" aria-hidden="true">
              <circle cx="178" cy="178" r="156" fill="none" stroke="#3a3a35" stroke-width="18"></circle>
              <circle cx="178" cy="178" r="156" fill="none" stroke="#f4c62f" stroke-width="18" stroke-linecap="round" stroke-dasharray="666.4 980.2"></circle>
            </svg>
            <div class="timer-value">18:24</div>
          </div>
          <p class="timer-status">About 18 minutes remain in this room</p>
        </div>
      </div>

      <div class="controls" aria-label="Timer controls">
        <button class="pause" type="button">Pause timer</button>
        <button class="end" type="button">End session</button>
      </div>
    </main>
  </div>
</body>
</html>
