<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Activity Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e8eb;
      color: #25313b;
      font-family: 'Poppins', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 20px;
      background: #f1f3f5;
    }

    .chart-card {
      width: 100%;
      padding: 19px 20px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(33, 47, 59, 0.09);
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #74818b;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #202b33;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
    }

    .period-control {
      position: relative;
      margin-top: 8px;
    }

    .period-control select {
      width: 100%;
      height: 34px;
      padding: 0 36px 0 11px;
      border: 1px solid #d8dee3;
      border-radius: 7px;
      outline: none;
      appearance: none;
      background: #f8f9fa;
      color: #53616b;
      font: 500 12px/1 'Poppins', system-ui, sans-serif;
      cursor: pointer;
    }

    .period-control select:focus {
      border-color: #e56b54;
      box-shadow: 0 0 0 3px rgba(229, 107, 84, 0.13);
    }

    .period-control::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 13px;
      width: 7px;
      height: 7px;
      border-right: 2px solid #74818b;
      border-bottom: 2px solid #74818b;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .summary {
      margin-top: 12px;
    }

    .total {
      margin: 0;
      color: #e56b54;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.2;
    }

    .total-label {
      margin: 2px 0 0;
      color: #53616b;
      font-size: 13px;
      line-height: 1.5;
    }

    .comparison {
      color: #cf624f;
      font-weight: 500;
    }

    .chart {
      margin-top: 15px;
    }

    .plot-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      column-gap: 8px;
    }

    .axis {
      height: 164px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 1px;
      color: #8a959d;
      font-size: 11px;
      line-height: 1;
      text-align: right;
    }

    .plot {
      position: relative;
      height: 164px;
      border-bottom: 1px solid #cfd6db;
    }

    .grid-line {
      position: absolute;
      right: 0;
      left: 0;
      height: 1px;
      background: #e7ebee;
    }

    .grid-line.one {
      top: 0;
    }

    .grid-line.two {
      top: 33.33%;
    }

    .grid-line.three {
      top: 66.66%;
    }

    .bars {
      position: absolute;
      inset: 0 4px;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .bar-column {
      width: 25px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .stack {
      width: 22px;
      display: flex;
      flex-direction: column-reverse;
    }

    .segment {
      width: 100%;
    }

    .posts {
      background: #e56b54;
    }

    .replies {
      background: #f0aa58;
    }

    .reactions {
      background: #f7dca1;
    }

    .day-labels {
      margin: 7px 0 0 42px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
      color: #68757e;
      font-size: 11px;
      line-height: 1.4;
    }

    .day-labels span {
      width: 25px;
      text-align: center;
    }

    .legend {
      margin-top: 13px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #53616b;
      font-size: 11px;
      line-height: 1.4;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-mark {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 2px;
    }

    .chart-note {
      margin: 13px 0 0;
      padding-top: 11px;
      border-top: 1px solid #e5e9ec;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: #53616b;
      font-size: 13px;
      line-height: 1.5;
    }

    .chart-note strong {
      color: #25313b;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="chart-card" aria-labelledby="activity-title-a">
      <header>
        <p class="eyebrow">Commonfield Community</p>
        <h1 id="activity-title-a">Member activity</h1>
        <div class="period-control">
          <label for="activity-period-a" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Select activity date range</label>
          <select id="activity-period-a" name="activity-period">
            <option>May 19–25, 2025</option>
            <option selected>May 12–18, 2025</option>
            <option>May 5–11, 2025</option>
            <option>April 28–May 4, 2025</option>
          </select>
        </div>
      </header>

      <div class="summary">
        <p class="total">4,286</p>
        <p class="total-label">Total interactions · <span class="comparison">12% above last week</span></p>
      </div>

      <div class="chart" role="img" aria-label="Stacked bar chart of posts, replies, and reactions from Monday through Sunday. Friday had the highest activity with 820 interactions.">
        <div class="plot-row">
          <div class="axis" aria-hidden="true">
            <span>900</span>
            <span>600</span>
            <span>300</span>
            <span>0</span>
          </div>

          <div class="plot" aria-hidden="true">
            <div class="grid-line one"></div>
            <div class="grid-line two"></div>
            <div class="grid-line three"></div>

            <div class="bars">
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:29px;"></div>
                  <div class="segment replies" style="height:44px;"></div>
                  <div class="segment reactions" style="height:56px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:23px;"></div>
                  <div class="segment replies" style="height:34px;"></div>
                  <div class="segment reactions" style="height:38px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:34px;"></div>
                  <div class="segment replies" style="height:49px;"></div>
                  <div class="segment reactions" style="height:60px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:25px;"></div>
                  <div class="segment replies" style="height:37px;"></div>
                  <div class="segment reactions" style="height:48px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:37px;"></div>
                  <div class="segment replies" style="height:52px;"></div>
                  <div class="segment reactions" style="height:64px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:21px;"></div>
                  <div class="segment replies" style="height:29px;"></div>
                  <div class="segment reactions" style="height:36px;"></div>
                </div>
              </div>
              <div class="bar-column">
                <div class="stack">
                  <div class="segment posts" style="height:20px;"></div>
                  <div class="segment replies" style="height:28px;"></div>
                  <div class="segment reactions" style="height:36px;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="day-labels" aria-hidden="true">
          <span>Mon</span>
          <span>Tue</span>
          <span>Wed</span>
          <span>Thu</span>
          <span>Fri</span>
          <span>Sat</span>
          <span>Sun</span>
        </div>

        <div class="legend" aria-label="Chart legend">
          <span class="legend-item">
            <span class="legend-mark posts"></span>
            Posts
          </span>
          <span class="legend-item">
            <span class="legend-mark replies"></span>
            Replies
          </span>
          <span class="legend-item">
            <span class="legend-mark reactions"></span>
            Reactions
          </span>
        </div>
      </div>

      <p class="chart-note">
        <strong>Friday · 820</strong>
        <span>Most active day</span>
      </p>
    </section>
  </div>
</body>
</html>
