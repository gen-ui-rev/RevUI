<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cancel physio appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#D97706;
    --ink:#1B1917;
    --value:#484440;
    --muted:#6E6862;
    --line:#E2DED8;
    --panel:#F3F2F0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#E9E7E3;
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    padding:18px 24px;
    background:#EFEDE9;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .dialog{
    width:342px;
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .dialog img{
    width:100%;
    height:150px;
    display:block;
    object-fit:cover;
    background:#D8D3CC;
    border-radius:7px 7px 0 0;
  }
  .body{padding:18px 20px 16px;}
  .kicker{
    display:flex;
    align-items:center;
    gap:6px;
    margin:0 0 8px;
    color:var(--amber);
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .kicker svg{display:block;flex:0 0 auto;}
  h1{
    margin:0 0 8px;
    font-size:21px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.01em;
  }
  p{
    margin:0;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .facts{
    margin:14px 0 0;
    padding:6px 12px;
    background:var(--panel);
    border-radius:7px;
  }
  .fact{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    padding:8px 0;
    font-size:13px;
    line-height:1.4;
  }
  .fact dt{color:var(--muted);}
  .fact dd{
    margin:0;
    color:var(--value);
    font-weight:600;
    text-align:right;
  }
  .actions{
    padding:0 20px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .btn{
    border-radius:6px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn-primary{
    display:block;
    width:100%;
    padding:12px 16px;
    border:1px solid var(--amber);
    background:var(--amber);
    color:#FFFFFF;
  }
  .btn-text{
    width:auto;
    padding:9px 8px;
    border:0;
    background:transparent;
    color:#7B3128;
    text-decoration:underline;
    text-underline-offset:3px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="dialog">
      <img src="https://loremflickr.com/342/150/gym?lock=8381" width="342" height="150" alt="Rehabilitation equipment at the clinic for the upcoming physio appointment">
      <div class="body">
        <p class="kicker">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="6" stroke="#D97706" stroke-width="1.4"/>
            <path d="M7 4v3.4l2.1 1.3" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Northside Physio
        </p>
        <h1>Cancel your physio appointment?</h1>
        <p>If you cancel now, the clinic’s late-cancellation policy will apply.</p>
        <dl class="facts">
          <div class="fact">
            <dt>Scheduled</dt>
            <dd>Tue, March 4 · 6:30 PM</dd>
          </div>
          <div class="fact">
            <dt>Late-cancellation fee</dt>
            <dd>$35.00</dd>
          </div>
        </dl>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary">Keep appointment</button>
        <button type="button" class="btn btn-text">Cancel appointment</button>
      </div>
    </div>
  </div>
</body>
</html>
