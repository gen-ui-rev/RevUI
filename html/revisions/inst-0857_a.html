<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification permission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
    margin: 0;
    background: #ebeae7;
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 390px;
    height: 560px;
    background: #ffffff;
    padding: 28px;
  }
  .step {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8579;
    margin: 0 0 16px;
  }
  .mark {
    display: block;
    line-height: 0;
    color: #b57400;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 23px;
    line-height: 1.24;
    font-weight: 700;
    color: #1b1a17;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .lede {
    font-size: 15px;
    line-height: 1.55;
    color: #55524b;
    margin: 0 0 18px;
    font-weight: 400;
  }
  /* filled panel: page beige behind the rows, inset from the text column edges */
  .detail {
    background: #ebeae7;
    padding: 2px 18px;
  }
  .detail .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid #cfccc4;
  }
  .detail .row:last-child { border-bottom: 0; }
  .row .k {
    font-size: 14px;
    font-weight: 500;
    color: #1b1a17;
  }
  .row .v {
    font-size: 14px;
    font-weight: 400;
    color: #6d6961;
    white-space: nowrap;
  }
  .actions { margin-top: 18px; }
  .allow {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 0;
    background: #e2960b;
    color: #241a00;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 12px;
    cursor: pointer;
  }
  .later {
    display: block;
    width: 100%;
    margin-top: 4px;
    border: 0;
    background: none;
    color: #55524b;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    padding: 13px 12px;
    cursor: pointer;
  }
  .foot {
    font-size: 12px;
    line-height: 1.5;
    color: #8a8579;
    margin: 12px 0 0;
  }
</style>
</head>
<body>
  <div class="screen">
    <p class="step">Setup · Step 3 of 4</p>

    <span class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8.5a6 6 0 0 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5"/>
        <path d="M10.2 19a2 2 0 0 0 3.6 0"/>
      </svg>
    </span>

    <h1>Allow notifications to get dose reminders</h1>
    <p class="lede">Marrow Health only alerts you when a dose is due and confirms what you logged.</p>

    <div class="detail">
      <div class="row">
        <span class="k">Dose reminders</span>
        <span class="v">8:00 AM, 9:30 PM</span>
      </div>
      <div class="row">
        <span class="k">Missed dose follow-up</span>
        <span class="v">30 min after</span>
      </div>
      <div class="row">
        <span class="k">Weekly adherence recap</span>
        <span class="v">Sundays</span>
      </div>
    </div>

    <div class="actions">
      <button class="allow" type="button">Allow notifications</button>
      <button class="later" type="button">Not now</button>
    </div>

    <p class="foot">Change reminder times anytime in Settings.</p>
  </div>
</body>
</html>
