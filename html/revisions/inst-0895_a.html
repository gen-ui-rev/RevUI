<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Audio Recording</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e7e7ea;
      color: #17151c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }

    .topbar {
      min-height: 64px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      border-bottom: 1px solid #e8e6eb;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: #29262f;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .topbar-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 22px;
      font-weight: 600;
    }

    .content {
      flex: 1;
      padding: 20px 20px 0;
    }

    .recording-main {
      text-align: center;
    }

    .recording-state {
      margin: 0 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6d35b4;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6d35b4;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .recording-title {
      margin: 0;
      max-width: 218px;
      overflow: hidden;
      padding-bottom: 3px;
      border-bottom: 1px dashed #c4bccd;
      font-size: 24px;
      line-height: 31px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .rename-button {
      height: 30px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #d5cde0;
      border-radius: 15px;
      background: #f8f4fc;
      color: #6830aa;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
    }

    .rename-button svg {
      width: 14px;
      height: 14px;
    }

    .timer {
      margin: 14px 0 0;
      color: #4f1d8c;
      font-size: 44px;
      line-height: 50px;
      font-weight: 600;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .waveform {
      position: relative;
      height: 104px;
      margin-top: 12px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 14px;
      background: linear-gradient(180deg, #f7f2fc 0%, #ffffff 100%);
    }

    .waveform::before {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      top: 50%;
      height: 1px;
      background: #e5d9f2;
    }

    .waveform span {
      position: relative;
      width: 10px;
      height: var(--h);
      min-height: 12px;
      border-radius: 5px;
      background: linear-gradient(180deg, #a678e0 0%, #5b2596 100%);
    }

    .audio-caption {
      margin: 9px 0 0;
      color: #77717d;
      font-size: 13px;
      line-height: 18px;
    }

    .recording-controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
    }

    .control-button {
      min-height: 54px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border-radius: 6px;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .control-button svg {
      width: 19px;
      height: 19px;
      flex: none;
    }

    .pause-button {
      border: 1px solid #c9c5ce;
      background: #ffffff;
      color: #302c35;
    }

    .finish-button {
      border: 1px solid #6830aa;
      background: #6830aa;
      color: #ffffff;
    }

    .section {
      margin-top: 22px;
      border-top: 1px solid #dedbe2;
      padding-top: 16px;
    }

    .section-header {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      margin: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .text-action {
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #6830aa;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    .timeline {
      position: relative;
      margin: 0;
      padding: 4px 0 0 24px;
      list-style: none;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: #e8dff3;
    }

    .tl-item {
      position: relative;
      padding-bottom: 14px;
    }

    .tl-item:last-child {
      padding-bottom: 0;
    }

    .tl-item::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #c9b6e2;
      background: #ffffff;
    }

    .tl-summary::before {
      border-radius: 3px;
      border-color: #8d63c4;
    }

    .tl-current::before {
      border-color: #6830aa;
      background: #6830aa;
    }

    .tl-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .tl-time {
      flex: none;
      min-width: 56px;
      color: #6830aa;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .tl-text {
      min-width: 0;
      overflow: hidden;
      color: #29262f;
      font-size: 14px;
      line-height: 20px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tl-current .tl-text {
      color: #4f1d8c;
      font-weight: 600;
    }

    .tl-heading {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: #29262f;
    }

    .tl-sub {
      margin: 2px 0 0;
      color: #77717d;
      font-size: 13px;
      line-height: 18px;
    }

    .tabbar {
      min-height: 74px;
      padding: 7px 8px 9px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: stretch;
      border-top: 1px solid #dedbe2;
      background: #ffffff;
    }

    .tab {
      min-width: 0;
      padding: 3px 2px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #77717d;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }

    .tab svg {
      width: 22px;
      height: 22px;
    }

    .tab.active {
      color: #6830aa;
      font-weight: 600;
    }

    .tab-active-mark {
      width: 22px;
      height: 3px;
      margin-bottom: 1px;
      border-radius: 2px;
      background: #6830aa;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="topbar-title">Trip audio</h1>
      <button class="icon-button" type="button" aria-label="More options">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="1.7"/>
          <circle cx="19" cy="12" r="1.7"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <section class="recording-main" aria-labelledby="recording-title">
        <p class="recording-state"><span class="state-dot"></span>Recording</p>
        <div class="title-row">
          <h2 class="recording-title" id="recording-title">Coastal trail note</h2>
          <button class="rename-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 20H8L19 9L15 5L4 16V20Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            Rename
          </button>
        </div>
        <p class="timer">04:18</p>

        <div class="waveform" role="img" aria-label="Live audio waveform">
          <span style="--h:28px"></span>
          <span style="--h:44px"></span>
          <span style="--h:60px"></span>
          <span style="--h:36px"></span>
          <span style="--h:72px"></span>
          <span style="--h:84px"></span>
          <span style="--h:52px"></span>
          <span style="--h:40px"></span>
          <span style="--h:68px"></span>
          <span style="--h:88px"></span>
          <span style="--h:56px"></span>
          <span style="--h:42px"></span>
          <span style="--h:76px"></span>
          <span style="--h:50px"></span>
          <span style="--h:32px"></span>
          <span style="--h:64px"></span>
          <span style="--h:80px"></span>
          <span style="--h:46px"></span>
        </div>

        <p class="audio-caption">Microphone audio · High quality</p>

        <div class="recording-controls">
          <button class="control-button pause-button" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1"/>
              <rect x="14" y="5" width="4" height="14" rx="1"/>
            </svg>
            Pause
          </button>
          <button class="control-button finish-button" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="1"/>
            </svg>
            Finish recording
          </button>
        </div>
      </section>

      <section class="section" aria-labelledby="timeline-heading">
        <div class="section-header">
          <h2 class="section-title" id="timeline-heading">Trip timeline</h2>
          <button class="text-action" type="button">Add marker</button>
        </div>
        <ol class="timeline">
          <li class="tl-item tl-summary">
            <p class="tl-heading">Juniper Bay weekend</p>
            <p class="tl-sub">North Bluff Trail · May 18, 2025</p>
          </li>
          <li class="tl-item">
            <div class="tl-line">
              <span class="tl-time">2:36 PM</span>
              <span class="tl-text">Recording started</span>
            </div>
          </li>
          <li class="tl-item">
            <div class="tl-line">
              <span class="tl-time">01:12</span>
              <span class="tl-text">Marker · Trail junction</span>
            </div>
          </li>
          <li class="tl-item">
            <div class="tl-line">
              <span class="tl-time">03:47</span>
              <span class="tl-text">Marker · Viewpoint access</span>
            </div>
          </li>
          <li class="tl-item tl-current">
            <div class="tl-line">
              <span class="tl-time">04:18</span>
              <span class="tl-text">Recording in progress</span>
            </div>
          </li>
        </ol>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7.5H10L12 9.5H20V18.5H4V7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4 7.5V5.5H9L11 7.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Trips
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6L9 4L15 6L20 4V18L15 20L9 18L4 20V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M9 4V18M15 6V20" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        Map
      </button>
      <button class="tab active" type="button" aria-current="page">
        <div class="tab-active-mark"></div>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="8" y="3.5" width="8" height="12" rx="4" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 11.5C5.5 15.1 8.4 18 12 18C15.6 18 18.5 15.1 18.5 11.5M12 18V21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        Record
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 4.5H18V20L12 16.5L6 20V4.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Saved
      </button>
    </nav>
  </div>
</body>
</html>
