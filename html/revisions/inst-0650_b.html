<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamstead Billing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #dededb;
      color: #23272a;
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 26px 24px;
      background: #f7f7f5;
    }

    .billing {
      width: 100%;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .heading {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .service-name {
      margin-top: 2px;
      color: #70777c;
      font-size: 14px;
      line-height: 1.45;
    }

    .billing-summary {
      padding: 15px 16px;
      border-radius: 7px;
      background: #e6e9eb;
    }

    .payment-strip {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 13px;
      border-bottom: 1px solid #cfd4d6;
    }

    .payment-icon {
      width: 34px;
      height: 34px;
      padding: 6px;
      flex: 0 0 auto;
      border-radius: 6px;
      background: #d9dddf;
      color: #667078;
    }

    .payment-copy {
      min-width: 0;
      flex: 1;
    }

    .payment-label {
      color: #697177;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .payment-value {
      margin-top: 2px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .expiry {
      color: #687077;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .charge-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
      padding-top: 13px;
    }

    .eyebrow {
      color: #596269;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .charge-date {
      margin-top: 3px;
      color: #596168;
      font-size: 13px;
      line-height: 1.45;
    }

    .amount {
      color: #465159;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .section {
      margin-top: 19px;
    }

    h2 {
      margin-bottom: 9px;
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
    }

    .invoice-list {
      display: grid;
      gap: 6px;
    }

    .invoice-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      background: #eceeed;
      border-radius: 6px;
    }

    .invoice-icon {
      width: 38px;
      height: 38px;
      padding: 9px;
      border-radius: 6px;
      background: #dde1e2;
      color: #626b70;
    }

    .invoice-copy {
      min-width: 0;
    }

    .invoice-date {
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
    }

    .invoice-number {
      margin-top: 1px;
      color: #777d81;
      font-size: 12px;
      line-height: 1.4;
    }

    .invoice-end {
      text-align: right;
    }

    .invoice-amount {
      color: #454b4f;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      white-space: nowrap;
    }

    .download-link {
      margin-top: 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #697278;
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="billing" aria-labelledby="billing-title">
      <header class="heading">
        <h1 id="billing-title">Billing</h1>
        <p class="service-name">Roamstead Explorer plan</p>
      </header>

      <section class="billing-summary" aria-label="Payment and upcoming charge">
        <div class="payment-strip">
          <svg class="payment-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3 9h18M7 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <div class="payment-copy">
            <p class="payment-label">Payment method</p>
            <p class="payment-value">Card ending in 4832</p>
          </div>
          <p class="expiry">Exp. 09/28</p>
        </div>

        <div class="charge-strip">
          <div>
            <p class="eyebrow">Upcoming charge</p>
            <p class="charge-date">May 18, 2026 · Monthly</p>
          </div>
          <p class="amount">$24.00</p>
        </div>
      </section>

      <section class="section" aria-labelledby="invoice-title-b">
        <h2 id="invoice-title-b">Invoice history</h2>
        <div class="invoice-list">
          <article class="invoice-row">
            <svg class="invoice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 3h7l4 4v14H7V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M14 3v5h5M10 13h5M10 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <div class="invoice-copy">
              <p class="invoice-date">April 18, 2026</p>
              <p class="invoice-number">RS-10482</p>
            </div>
            <div class="invoice-end">
              <p class="invoice-amount">$24.00</p>
              <button class="download-link" type="button" aria-label="Download invoice RS-10482">Download</button>
            </div>
          </article>

          <article class="invoice-row">
            <svg class="invoice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 3h7l4 4v14H7V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M14 3v5h5M10 13h5M10 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <div class="invoice-copy">
              <p class="invoice-date">March 18, 2026</p>
              <p class="invoice-number">RS-10361</p>
            </div>
            <div class="invoice-end">
              <p class="invoice-amount">$24.00</p>
              <button class="download-link" type="button" aria-label="Download invoice RS-10361">Download</button>
            </div>
          </article>

          <article class="invoice-row">
            <svg class="invoice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7 3h7l4 4v14H7V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M14 3v5h5M10 13h5M10 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <div class="invoice-copy">
              <p class="invoice-date">February 18, 2026</p>
              <p class="invoice-number">RS-10247</p>
            </div>
            <div class="invoice-end">
              <p class="invoice-amount">$24.00</p>
              <button class="download-link" type="button" aria-label="Download invoice RS-10247">Download</button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
