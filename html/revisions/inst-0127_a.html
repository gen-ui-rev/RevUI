<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening Location</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #d8d4d0;
      color: #241f1c;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      background: #fffdfb;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #ded8d3;
    }

    .back-button {
      width: 40px;
      padding: 3px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border: 0;
      background: transparent;
      cursor: default;
    }

    .back-button svg {
      width: 24px;
      height: 24px;
    }

    .top-title {
      margin: 0;
      text-align: center;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    main {
      padding: 15px 20px 0;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: #6c584c;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 0;
      color: #514944;
      font-size: 14px;
      line-height: 20px;
    }

    .address-search {
      margin-top: 16px;
      padding: 7px 7px 7px 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #afa39b;
      border-radius: 9px;
      background: #ffffff;
    }

    .search-symbol {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #5b4b42;
    }

    .address-search input {
      min-width: 0;
      flex: 1;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #241f1c;
      font-size: 14px;
      line-height: 22px;
    }

    .address-search input::placeholder {
      color: #675e58;
      opacity: 1;
    }

    .search-submit {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: #332923;
      color: #ffffff;
      cursor: default;
    }

    .search-submit svg {
      width: 18px;
      height: 18px;
    }

    .search-note {
      margin: 6px 1px 0;
      color: #675e58;
      font-size: 12px;
      line-height: 17px;
    }

    .section {
      margin-top: 18px;
    }

    .saved-section {
      margin-top: 20px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      line-height: 22px;
      font-weight: 700;
    }

    .location-action {
      width: 100%;
      margin-top: 9px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      border: 1px solid #b8ada5;
      border-radius: 9px;
      background: #f6f2ef;
      cursor: default;
    }

    .location-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #6f5a4e;
      color: #ffffff;
    }

    .location-icon svg {
      width: 19px;
      height: 19px;
    }

    .action-copy {
      min-width: 0;
    }

    .action-title {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .action-detail {
      display: block;
      color: #5f5650;
      font-size: 12px;
      line-height: 17px;
    }

    .saved-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .add-button {
      padding: 3px 0;
      border: 0;
      background: transparent;
      color: #5f493d;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      cursor: default;
    }

    .saved-list {
      display: grid;
      gap: 8px;
    }

    .saved-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 10px 10px 10px 13px;
      border: 1px solid #d0c7c1;
      border-radius: 9px;
      background: #f8f5f2;
    }

    .saved-card.selected {
      border-color: #332923;
      background: #332923;
      color: #ffffff;
    }

    .saved-choice {
      min-width: 0;
      padding: 0;
      text-align: left;
      border: 0;
      background: transparent;
      cursor: default;
    }

    .saved-name-line {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .saved-name {
      min-width: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 700;
    }

    .active-badge {
      flex: 0 0 auto;
      padding: 1px 7px;
      border-radius: 99px;
      background: #ffffff;
      color: #332923;
      font-size: 10px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .saved-address {
      display: block;
      color: #625a54;
      font-size: 12px;
      line-height: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selected .saved-address {
      color: #e4dcd7;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .icon-action {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid #c4b9b2;
      border-radius: 7px;
      background: #ffffff;
      color: #4b403a;
      cursor: default;
    }

    .selected .icon-action {
      border-color: #75675f;
      background: #4b3f38;
      color: #ffffff;
    }

    .icon-action svg {
      width: 15px;
      height: 15px;
    }

    .tab-bar {
      margin-top: auto;
      padding: 9px 12px 13px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      border-top: 1px solid #ded8d3;
      background: #f3efec;
    }

    .tab {
      padding: 9px 3px;
      border: 0;
      background: transparent;
      color: #5f5752;
      font-size: 14px;
      line-height: 20px;
      cursor: default;
    }

    .tab.active {
      border-radius: 8px;
      background: #332923;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="top-bar">
      <button class="back-button" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="top-title">Listening location</p>
      <span aria-hidden="true"></span>
    </header>

    <main>
      <p class="eyebrow">Morrowcast account</p>
      <h1>Choose your location</h1>
      <p class="intro">Set the regional catalog and nearby live sessions you hear.</p>

      <form class="address-search" action="#">
        <svg class="search-symbol" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input type="text" aria-label="Search for an address" placeholder="Street address or ZIP code">
        <button class="search-submit" type="submit" aria-label="Search address">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12H19M14 7L19 12L14 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="search-note">A full address gives the most accurate results.</p>

      <section class="section" aria-labelledby="current-location-title">
        <h2 class="section-title" id="current-location-title">Use your device</h2>
        <button class="location-action" type="button">
          <span class="location-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-title">Use my current location</span>
            <span class="action-detail">Allow access for this visit</span>
          </span>
        </button>
      </section>

      <section class="saved-section" aria-labelledby="saved-locations-title">
        <div class="saved-heading">
          <h2 class="section-title" id="saved-locations-title">Saved locations</h2>
          <button class="add-button" type="button">+ Add address</button>
        </div>

        <div class="saved-list">
          <div class="saved-card selected">
            <button class="saved-choice" type="button" aria-label="Home, selected location">
              <span class="saved-name-line">
                <span class="saved-name">Home</span>
                <span class="active-badge">Selected</span>
              </span>
              <span class="saved-address">1847 Alder Lane, Portland, OR 97205</span>
            </button>
            <span class="row-actions">
              <button class="icon-action" type="button" aria-label="Edit Home">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4 14.8L4.7 11.7L12.8 3.6L16.4 7.2L8.3 15.3L5.2 16L4 14.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                  <path d="M11.7 4.7L15.3 8.3" stroke="currentColor" stroke-width="1.4"/>
                </svg>
              </button>
              <button class="icon-action" type="button" aria-label="Remove Home">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5.5 6.5L6.2 16H13.8L14.5 6.5M4 6.5H16M7.5 6.5V4H12.5V6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </span>
          </div>

          <div class="saved-card">
            <button class="saved-choice" type="button" aria-label="Select Studio">
              <span class="saved-name">Studio</span>
              <span class="saved-address">620 Mercer Street, Seattle, WA 98109</span>
            </button>
            <span class="row-actions">
              <button class="icon-action" type="button" aria-label="Edit Studio">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4 14.8L4.7 11.7L12.8 3.6L16.4 7.2L8.3 15.3L5.2 16L4 14.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                  <path d="M11.7 4.7L15.3 8.3" stroke="currentColor" stroke-width="1.4"/>
                </svg>
              </button>
              <button class="icon-action" type="button" aria-label="Remove Studio">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5.5 6.5L6.2 16H13.8L14.5 6.5M4 6.5H16M7.5 6.5V4H12.5V6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </span>
          </div>

          <div class="saved-card">
            <button class="saved-choice" type="button" aria-label="Select Weekend place">
              <span class="saved-name">Weekend place</span>
              <span class="saved-address">92 Harbor Road, Astoria, OR 97103</span>
            </button>
            <span class="row-actions">
              <button class="icon-action" type="button" aria-label="Edit Weekend place">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4 14.8L4.7 11.7L12.8 3.6L16.4 7.2L8.3 15.3L5.2 16L4 14.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                  <path d="M11.7 4.7L15.3 8.3" stroke="currentColor" stroke-width="1.4"/>
                </svg>
              </button>
              <button class="icon-action" type="button" aria-label="Remove Weekend place">
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M5.5 6.5L6.2 16H13.8L14.5 6.5M4 6.5H16M7.5 6.5V4H12.5V6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </span>
          </div>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab" type="button">Listen</button>
      <button class="tab" type="button">Discover</button>
      <button class="tab" type="button">Library</button>
      <button class="tab active" type="button" aria-current="page">Account</button>
    </nav>
  </div>
</body>
</html>
