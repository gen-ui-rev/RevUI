<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #deddd9;
      color: #242321;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 24px;
      background: #fbfaf8;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #a74a14;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #242321;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 7px 0 0;
      color: #6d6862;
      font-size: 13px;
      line-height: 1.4;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f0ece5;
      color: #57524c;
      font-size: 12px;
      line-height: 1.3;
    }

    .summary strong {
      color: #242321;
      font-size: 13px;
      font-weight: 700;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin: 0;
      padding: 0;
      color: #34312e;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    input[type="radio"] {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .time-section {
      margin-top: 18px;
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .time-choice > span {
      display: block;
      padding: 10px 5px;
      border: 1px solid #cec9c1;
      border-radius: 6px;
      background: #ffffff;
      color: #383532;
      text-align: center;
      cursor: pointer;
    }

    .time-value {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    .time-label {
      display: block;
      margin-top: 3px;
      color: #817b74;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
    }

    .time-choice input:checked + span {
      border-color: #c8500b;
      background: #c8500b;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(133, 58, 15, 0.2);
    }

    .time-choice input:checked + span .time-label {
      color: #fff2e9;
    }

    .date-section {
      margin-top: 17px;
    }

    .date-options {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .date-choice > span {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid #d5d1ca;
      border-radius: 6px;
      background: transparent;
      color: #35322f;
      cursor: pointer;
    }

    .day {
      min-width: 92px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }

    .date {
      color: #77716b;
      font-size: 12px;
      line-height: 1.3;
    }

    .date-state {
      margin-left: auto;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .date-choice input:checked + span {
      border-color: #2d2a27;
      background: #2d2a27;
      color: #ffffff;
    }

    .date-choice input:checked + span .date {
      color: #dcd7d1;
    }

    .date-choice input:not(:checked) + span .date-state {
      display: none;
    }

    .time-choice input:focus-visible + span,
    .date-choice input:focus-visible + span {
      outline: 2px solid #242321;
      outline-offset: 2px;
    }

    .note {
      margin: 12px 0 0;
      color: #6d6862;
      font-size: 12px;
      line-height: 1.35;
    }

    .primary-action {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 0;
      border-radius: 6px;
      background: #242321;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
    }

    .primary-action:focus-visible {
      outline: 2px solid #c8500b;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <p class="eyebrow">Pineledger transfer</p>
      <h1>Choose an arrival window</h1>
      <p class="intro">First choose a time, then pick the day that works best.</p>
      <div class="summary">
        <span>Transfer amount</span>
        <strong>$1,250.00</strong>
      </div>
    </header>

    <form>
      <fieldset class="time-section">
        <legend>What time should it arrive?</legend>
        <div class="time-options">
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>
              <span class="time-value">9:30 AM</span>
              <span class="time-label">Available</span>
            </span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time" checked>
            <span>
              <span class="time-value">10:30 AM</span>
              <span class="time-label">Your time</span>
            </span>
          </label>
          <label class="time-choice">
            <input type="radio" name="delivery-time">
            <span>
              <span class="time-value">11:30 AM</span>
              <span class="time-label">Available</span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset class="date-section">
        <legend>Now choose the delivery day</legend>
        <div class="date-options">
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="day">Monday</span>
              <span class="date">June 16</span>
              <span class="date-state">✓ Chosen</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date" checked>
            <span>
              <span class="day">Tuesday</span>
              <span class="date">June 17</span>
              <span class="date-state">✓ Chosen</span>
            </span>
          </label>
          <label class="date-choice">
            <input type="radio" name="delivery-date">
            <span>
              <span class="day">Wednesday</span>
              <span class="date">June 18</span>
              <span class="date-state">✓ Chosen</span>
            </span>
          </label>
        </div>
      </fieldset>

      <p class="note">Later transfers may arrive on the next business day.</p>
      <button class="primary-action" type="button">Confirm Tuesday at 10:30 AM</button>
    </form>
  </div>
</body>
</html>
