<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Trip Widget</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 0;
      background: #e8e5e4;
      color: #252122;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 36px 24px;
      background: #f3f1f0;
    }

    .trip-widget {
      width: 100%;
      padding: 22px 22px 18px;
      background: #241f22;
      border: 1px solid #241f22;
      border-radius: 18px;
      box-shadow: 0 14px 28px -18px rgba(36, 31, 34, 0.65);
    }

    .widget-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow,
    .countdown,
    .detail-label {
      font-size: 11px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: #9d9296;
    }

    .countdown {
      padding: 4px 10px;
      background: #b73e60;
      border-radius: 999px;
      color: #fff2f5;
      white-space: nowrap;
    }

    h1 {
      margin: 14px 0 0;
      color: #fbf5f6;
      font-size: 36px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .trip-date {
      margin: 4px 0 0;
      color: #ada2a5;
      font-size: 14px;
      line-height: 1.45;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: #e6dfe1;
      font-size: 11px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #59b98a;
    }

    .dot.pending {
      background: #d9a441;
    }

    .trip-details {
      margin-top: 18px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 10px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    .detail-group {
      min-width: 0;
    }

    .detail-group:last-child {
      text-align: right;
    }

    .detail-label {
      display: block;
      color: #8b8083;
    }

    .detail-value {
      display: block;
      margin-top: 2px;
      color: #f4eeef;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="screen">
    <article class="trip-widget" aria-labelledby="trip-destination">
      <header class="widget-heading">
        <span class="eyebrow">Next trip</span>
        <span class="countdown">In 12 days</span>
      </header>

      <h1 id="trip-destination">Lisbon</h1>
      <p class="trip-date">May 18–22, 2026</p>

      <div class="status-line" aria-label="Confirmation status">
        <span class="status-chip"><span class="dot" aria-hidden="true"></span>Flight confirmed</span>
        <span class="status-chip"><span class="dot pending" aria-hidden="true"></span>Stay pending</span>
      </div>

      <section class="trip-details" aria-label="Trip details">
        <div class="detail-row">
          <div class="detail-group">
            <span class="detail-label">Departure</span>
            <span class="detail-value">JFK · 8:40 PM</span>
          </div>
          <div class="detail-group">
            <span class="detail-label">Flight</span>
            <span class="detail-value">PV 218</span>
          </div>
        </div>

        <div class="detail-row">
          <div class="detail-group">
            <span class="detail-label">Stay</span>
            <span class="detail-value">Ribeira House</span>
          </div>
          <div class="detail-group">
            <span class="detail-label">Length</span>
            <span class="detail-value">4 nights</span>
          </div>
        </div>
      </section>
    </article>
  </div>
</body>
</html>
