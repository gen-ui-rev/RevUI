<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Member Removal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e5e7e1;
      color: #181a16;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 42px 32px;
      background: #f7f8f3;
    }

    .confirmation {
      width: 100%;
    }

    .eyebrow {
      display: block;
      margin: 0 0 12px;
      color: #5d7800;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.18;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .monogram {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #c9f34a;
      color: #1b2208;
      font-size: 18px;
      font-weight: 700;
    }

    .member-copy {
      min-width: 0;
    }

    .member-name {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.3;
    }

    .member-detail {
      margin: 0;
      color: #65685f;
      font-size: 14px;
      line-height: 1.4;
    }

    .explanation {
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid #d9dbd3;
    }

    .explanation-label {
      display: block;
      margin: 0 0 10px;
      color: #65685f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .facts {
      margin: 0;
      border-bottom: 1px solid #d9dbd3;
    }

    .fact {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid #e3e5dd;
    }

    .fact:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .fact dt {
      margin: 0;
      color: #50534c;
      font-size: 14px;
      line-height: 1.4;
    }

    .fact dd {
      margin: 0;
      flex: 0 0 auto;
      color: #23261f;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      text-align: right;
      white-space: nowrap;
    }

    .fact dd.yes {
      padding: 2px 10px;
      border-radius: 999px;
      background: #c9f34a;
      color: #1b2208;
      font-size: 13px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: 'Roboto', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
    }

    .confirm {
      border: 1px solid #b6dc3e;
      background: #c9f34a;
      color: #182000;
    }

    .cancel {
      border: 1px solid #bfc2b8;
      background: transparent;
      color: #33362f;
    }
  </style>
</head>
<body>
  <div class="screen">
    <main class="confirmation" aria-labelledby="confirmation-title">
      <span class="eyebrow">Confirm member removal</span>
      <h1 id="confirmation-title">Remove Avery Cole?</h1>

      <div class="member">
        <div class="monogram" aria-hidden="true">AC</div>
        <div class="member-copy">
          <p class="member-name">Avery Cole</p>
          <p class="member-detail">Neighborhood Makers on Circlenook</p>
        </div>
      </div>

      <section class="explanation">
        <span class="explanation-label">What removal does</span>
        <dl class="facts">
          <div class="fact">
            <dt>Access to the community</dt>
            <dd>Ends now</dd>
          </div>
          <div class="fact">
            <dt>Past posts and replies</dt>
            <dd>Stay visible</dd>
          </div>
          <div class="fact">
            <dt>Can be invited back</dt>
            <dd class="yes">Yes, anytime</dd>
          </div>
        </dl>
      </section>

      <div class="actions" aria-label="Removal confirmation">
        <button class="confirm" type="button">Yes, remove Avery</button>
        <button class="cancel" type="button">No, keep member</button>
      </div>
    </main>
  </div>
</body>
</html>
