<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rooftop Crew — Shared View Focus</title>
<style>
  :root{
    --ink:#1b1a18;
    --sub:#79736b;
    --line:#e5e2dd;
    --accent:#e2661a;
    --tint:#fdf1e8;
    --viewer:#24221f;
  }
  *{box-sizing:border-box;}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 0;
    margin:0;
    background:#d7d4cf;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  .screen{
    width:390px;
    height:844px;
    display:flex;
    flex-direction:column;
    background:#fff;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .iconbtn{
    width:36px;
    height:36px;
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:#fff;
  }
  .titlewrap{flex:1 1 auto;min-width:0;}
  .title{
    font-size:16px;
    font-weight:600;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    margin-top:2px;
    color:var(--sub);
    font-size:12px;
    line-height:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .live{
    display:inline-block;
    width:6px;
    height:6px;
    margin-right:5px;
    border-radius:50%;
    background:var(--accent);
    vertical-align:middle;
  }
  .viewer{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:18px 17px;
    background:var(--viewer);
  }
  .viewlabel{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    color:#f4f1ed;
  }
  .viewtitle{
    font-size:13px;
    font-weight:600;
    line-height:18px;
  }
  .viewmeta{
    padding:3px 7px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:7px;
    color:#c9c4bd;
    font-size:11px;
    line-height:15px;
  }
  .photo{
    width:356px;
    border-radius:11px;
    background:#35322e;
    box-shadow:0 14px 30px rgba(0,0,0,.24);
  }
  .photo img{
    width:356px;
    height:310px;
    display:block;
    object-fit:cover;
    background:#cfcac3;
    border-radius:11px;
  }
  .speaker{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    color:#fff;
  }
  .mono{
    width:34px;
    height:34px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:12px;
    font-weight:700;
  }
  .speakertext{min-width:0;}
  .speakername{
    font-size:13px;
    font-weight:600;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .speakerstate{
    margin-top:1px;
    color:#bbb6ae;
    font-size:11px;
    line-height:15px;
  }
  .people{
    margin-left:auto;
    color:#bbb6ae;
    font-size:11px;
    line-height:15px;
    white-space:nowrap;
  }
  .dock{
    padding:15px 16px 20px;
    border-top:1px solid var(--line);
    background:#fff;
  }
  .ctrlrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:14px;
  }
  .ctrl{
    width:70px;
    text-align:center;
  }
  .circle{
    width:60px;
    height:60px;
    margin:0 auto;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }
  .circle.on{
    border-color:#f2d3b8;
    background:var(--tint);
  }
  .clabel{
    margin-top:6px;
    color:var(--sub);
    font-size:11px;
    line-height:14px;
    white-space:nowrap;
  }
  .actions{
    display:flex;
    gap:10px;
  }
  .collapse{
    flex:0 0 112px;
    padding:12px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    line-height:20px;
    background:#fff;
  }
  .leave{
    flex:1 1 auto;
    padding:12px 14px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    line-height:20px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="iconbtn" aria-label="Return to call layout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </div>
      <div class="titlewrap">
        <div class="title">Rooftop Crew</div>
        <div class="subtitle"><span class="live"></span>Full-screen shared view · 12:47</div>
      </div>
      <div class="iconbtn" aria-label="Invite someone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"></path><circle cx="9" cy="7.5" r="3.2"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>
      </div>
    </div>

    <div class="viewer">
      <div class="viewlabel">
        <div class="viewtitle">Shared rear camera</div>
        <div class="viewmeta">1080p</div>
      </div>
      <div class="photo">
        <img src="https://loremflickr.com/356/310/street?lock=2741" width="356" height="310" alt="Live camera view of the evening street below the rooftop">
      </div>
      <div class="speaker">
        <div class="mono">NF</div>
        <div class="speakertext">
          <div class="speakername">Nadia Ferreira</div>
          <div class="speakerstate">Sharing with everyone</div>
        </div>
        <div class="people">5 in call</div>
      </div>
    </div>

    <div class="dock">
      <div class="ctrlrow">
        <div class="ctrl">
          <div class="circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path><path d="M16 9.5a4 4 0 0 1 0 5"></path><path d="M18.5 7a7.5 7.5 0 0 1 0 10"></path></svg>
          </div>
          <div class="clabel">Speaker</div>
        </div>
        <div class="ctrl">
          <div class="circle on">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2661a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><line x1="12" y1="17.5" x2="12" y2="21"></line></svg>
          </div>
          <div class="clabel">Mic on</div>
        </div>
        <div class="ctrl">
          <div class="circle on">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2661a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"></rect><path d="M15.5 11l6-3.5v9L15.5 13z"></path></svg>
          </div>
          <div class="clabel">Camera on</div>
        </div>
        <div class="ctrl">
          <div class="circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1a18" stroke-width="1.8" stroke-linecap="round"><circle cx="5.5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18.5" cy="12" r="1.4"></circle></svg>
          </div>
          <div class="clabel">More</div>
        </div>
      </div>
      <div class="actions">
        <div class="collapse">Exit full screen</div>
        <div class="leave">Leave call</div>
      </div>
    </div>
  </div>
</body>
</html>
