<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#5533cc;
    --danger:#ad2929;
    --ink:#1a1720;
    --muted:#5d5866;
    --rule:#d9d5e0;
    --soft:#f5f3f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#eceaef;
    font-family:'Source Serif 4', Georgia, serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:390px;
    height:560px;
    background:#fff;
    padding:30px 24px 24px;
  }
  .wrap{
    width:342px;
    margin:0 auto;
  }
  .eyebrow{
    margin:0 0 12px;
    color:var(--violet);
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .shot{
    width:342px;
    height:168px;
    display:block;
    object-fit:cover;
    background:#cfcbd6;
    border-radius:4px;
  }
  .meta{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 0 13px;
  }
  .mono{
    width:30px;
    height:30px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    background:#efecf8;
    color:var(--violet);
    font-size:14px;
    font-weight:700;
  }
  .meta p{
    min-width:0;
    margin:0;
    color:var(--muted);
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  hr{
    margin:0;
    border:0;
    border-top:1px solid var(--rule);
  }
  h1{
    margin:18px 0 7px;
    font-size:24px;
    line-height:1.25;
    font-weight:700;
  }
  .body{
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .action-panel{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:16px;
    padding:12px;
    border-radius:5px;
    background:var(--soft);
  }
  .cancel{
    flex:0 0 auto;
    padding:8px 4px;
    border:0;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .delete{
    min-width:156px;
    padding:10px 14px;
    border:1px solid var(--danger);
    border-radius:4px;
    background:#fff;
    color:var(--danger);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    line-height:1.25;
    text-align:center;
    cursor:pointer;
  }
  .cancel:focus,
  .delete:focus{
    outline:2px solid var(--violet);
    outline-offset:2px;
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="wrap">
      <p class="eyebrow">Shared post</p>

      <img class="shot" src="https://loremflickr.com/342/168/party?lock=2027" width="342" height="168" alt="Friends around a table at the rooftop dinner post being deleted">

      <div class="meta">
        <span class="mono" aria-hidden="true">MW</span>
        <p>Posted by Mara Whitfield &middot; March 4</p>
      </div>

      <hr>

      <h1>Delete this post?</h1>
      <p class="body">The photo, caption, and 24 comments will disappear from the Rooftop Club for all 61 members. Deletion is permanent.</p>

      <hr>

      <div class="action-panel" aria-label="Post deletion actions">
        <button class="cancel" type="button">Keep post</button>
        <button class="delete" type="button">Delete permanently</button>
      </div>
    </div>
  </div>
</body>
</html>
