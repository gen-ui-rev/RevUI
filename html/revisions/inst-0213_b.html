<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Savings Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e9edf2;
      color: #172033;
      font-family: 'Roboto', system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 14px 18px;
      background: #f8fafc;
    }

    .edit-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-bottom: 11px;
      border-bottom: 1px solid #dce3ec;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e5eefc;
      color: #2470e8;
    }

    .header-icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-copy {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: #172033;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #637086;
      font-size: 13px;
      line-height: 1.3;
    }

    form {
      margin-top: 10px;
    }

    .target-review {
      padding: 11px 12px;
      border-radius: 9px;
      background: #173f78;
      color: #ffffff;
    }

    .review-heading {
      margin: 0 0 8px;
      color: #d9e7fb;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .target-row {
      display: grid;
      grid-template-columns: 1fr 136px;
      align-items: end;
      gap: 14px;
    }

    .saved-label {
      display: block;
      margin-bottom: 3px;
      color: #c4d8f5;
      font-size: 11px;
      line-height: 1.2;
    }

    .saved-amount {
      display: block;
      font-size: 23px;
      line-height: 1.05;
      font-weight: 700;
    }

    .target-review label {
      display: block;
      margin-bottom: 3px;
      color: #d9e7fb;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 500;
    }

    .target-control {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 34px;
      padding: 0 9px;
      border-radius: 6px;
      background: #ffffff;
    }

    .target-control .prefix {
      position: absolute;
      left: 9px;
      color: #52627a;
      font-size: 13px;
      font-weight: 500;
    }

    .target-control input {
      padding-left: 15px;
      color: #172033;
    }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      color: #d9e7fb;
      font-size: 11px;
      line-height: 1.2;
    }

    .progress-track {
      height: 6px;
      margin-top: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .progress-fill {
      width: 42.5%;
      height: 6px;
      border-radius: 999px;
      background: #70d4ad;
    }

    .details-section {
      margin-top: 10px;
    }

    .funding-section {
      margin-top: 10px;
      padding: 10px 11px;
      border-left: 4px solid #2e8b62;
      border-radius: 0 8px 8px 0;
      background: #eef6f1;
    }

    .section-heading {
      margin: 0 0 7px;
      color: #29374b;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }

    .section-description {
      margin: -3px 0 8px;
      color: #657387;
      font-size: 11px;
      line-height: 1.3;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.25fr;
      gap: 8px;
    }

    .field + .field {
      margin-top: 7px;
    }

    .detail-grid .field + .field {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #536176;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 500;
    }

    .control {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #dce4ee;
      border-radius: 6px;
      background: #ffffff;
    }

    .funding-section .control,
    .funding-section .account-control {
      border-color: #d2e5da;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #172033;
      font: 500 13px/1.3 'Roboto', system-ui, sans-serif;
    }

    .with-prefix input {
      padding-left: 16px;
    }

    .with-icon input {
      padding-right: 24px;
      font-size: 12px;
    }

    .prefix {
      position: absolute;
      left: 10px;
      color: #52627a;
      font-size: 13px;
      font-weight: 500;
    }

    .control-icon {
      position: absolute;
      right: 9px;
      width: 16px;
      height: 16px;
      color: #4d6382;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .account-control {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid;
      border-radius: 6px;
      background: #ffffff;
      color: #172033;
      font: 500 13px/1.3 'Roboto', system-ui, sans-serif;
      text-align: left;
    }

    .account-name {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-control svg {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      fill: none;
      stroke: #4d6382;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 9px;
      margin-top: 10px;
    }

    .actions button {
      min-height: 42px;
      padding: 0 13px;
      border: 0;
      border-radius: 6px;
      font: 500 14px/1 'Roboto', system-ui, sans-serif;
    }

    .cancel {
      background: #e7ebf0;
      color: #42536b;
    }

    .save {
      background: #2470e8;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section aria-labelledby="edit-goal-title">
      <div class="edit-header">
        <div class="header-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7.5"></circle>
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2.5v2M21.5 12h-2M12 21.5v-2M2.5 12h2"></path>
          </svg>
        </div>
        <div class="header-copy">
          <h1 id="edit-goal-title">Emergency fund</h1>
          <p class="subtitle">Edit goal settings and funding.</p>
        </div>
      </div>

      <form>
        <section class="target-review" aria-labelledby="target-review-heading">
          <h2 class="review-heading" id="target-review-heading">Target progress</h2>
          <div class="target-row">
            <div>
              <span class="saved-label">Currently saved</span>
              <strong class="saved-amount">$7,650</strong>
            </div>
            <div>
              <label for="b-target-amount">Target amount</label>
              <div class="target-control">
                <span class="prefix" aria-hidden="true">$</span>
                <input id="b-target-amount" type="text" inputmode="decimal" value="18,000.00">
              </div>
            </div>
          </div>
          <div class="progress-copy">
            <span>42.5% complete</span>
            <span>$10,350 remaining</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill"></div>
          </div>
        </section>

        <section class="details-section" aria-labelledby="b-goal-details-heading">
          <h2 class="section-heading" id="b-goal-details-heading">Goal details</h2>
          <div class="detail-grid">
            <div class="field">
              <label for="b-goal-name">Goal name</label>
              <div class="control">
                <input id="b-goal-name" type="text" value="Emergency fund">
              </div>
            </div>

            <div class="field">
              <label for="b-target-date">Target date</label>
              <div class="control with-icon">
                <input id="b-target-date" type="text" value="September 30, 2026">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect>
                  <path d="M8 3.5v4M16 3.5v4M3.5 10h17"></path>
                </svg>
              </div>
            </div>
          </div>
        </section>

        <section class="funding-section" aria-labelledby="b-funding-heading">
          <h2 class="section-heading" id="b-funding-heading">Funding setup</h2>
          <p class="section-description">Choose how this goal receives monthly deposits.</p>

          <div class="field">
            <label for="b-monthly-transfer">Monthly transfer</label>
            <div class="control with-prefix">
              <span class="prefix" aria-hidden="true">$</span>
              <input id="b-monthly-transfer" type="text" inputmode="decimal" value="450.00">
            </div>
          </div>

          <div class="field">
            <label id="b-funding-account-label">Transfer from</label>
            <button class="account-control" type="button" aria-labelledby="b-funding-account-label">
              <span class="account-name">Everyday Checking · 1842</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 10 4 4 4-4"></path>
              </svg>
            </button>
          </div>
        </section>

        <div class="actions">
          <button class="cancel" type="button">Cancel</button>
          <button class="save" type="submit">Save changes</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
