<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Permission — Rooknote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #e8e6e2;
      color: #231f1d;
      font-family: 'Source Serif 4', Georgia, serif;
    }

    .screen {
      width: 390px;
      height: 560px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      background: #f5f3f0;
    }

    .permission-card {
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d5d0ca;
      border-radius: 4px;
    }

    .permission-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: #b72b2b;
      background: #fff5f4;
      border: 1px solid #e2b8b4;
      border-radius: 4px;
    }

    .permission-icon svg {
      width: 21px;
      height: 21px;
    }

    .heading-group {
      margin-top: 14px;
      padding-left: 10px;
      border-left: 2px solid #e2b8b4;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: #b72b2b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 11px 0 0;
      color: #5f5853;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
    }

    .privacy-note {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid #ddd8d2;
      color: #5f5853;
      font-size: 14px;
      line-height: 1.45;
    }

    .actions {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      margin: 0;
      padding: 11px 16px;
      border-radius: 4px;
      font: 600 16px/1.35 'Source Serif 4', Georgia, serif;
      cursor: pointer;
    }

    .allow {
      color: #ffffff;
      background: #b72b2b;
      border: 1px solid #b72b2b;
    }

    .deny {
      color: #3b3531;
      background: #ffffff;
      border: 1px solid #cfc9c2;
    }

    .settings-hint {
      margin-top: auto;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 13px 14px;
      background: #efece7;
      border: 1px dashed #cdc6be;
      border-radius: 4px;
    }

    .settings-hint svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      margin-top: 1px;
      color: #7a736d;
    }

    .settings-hint p {
      margin: 0;
      color: #5f5853;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .settings-hint strong {
      display: block;
      color: #3b3531;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="permission-card" aria-labelledby="permission-title">
      <div class="permission-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8.2 6.5 9.5 4.7h5l1.3 1.8H19a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="12.8" r="3.3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>

      <div class="heading-group">
        <p class="eyebrow">Camera permission</p>
        <h1 id="permission-title">Allow Rooknote to use your camera?</h1>
      </div>

      <p class="description">
        Scan handwritten pages straight into your team notes.
      </p>

      <p class="privacy-note">
        The camera runs only when you tap “Scan page.” It is never used in the background.
      </p>

      <div class="actions" aria-label="Camera permission choices">
        <button class="allow" type="button">Allow camera access</button>
        <button class="deny" type="button">Don’t allow</button>
      </div>
    </section>

    <aside class="settings-hint">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3.2v2.4M12 18.4v2.4M3.2 12h2.4M18.4 12h2.4M5.8 5.8l1.7 1.7M16.5 16.5l1.7 1.7M18.2 5.8l-1.7 1.7M7.5 16.5l-1.7 1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <p>
        <strong>Not now is fine</strong>
        Camera access can be turned on later in Settings › Rooknote › Permissions.
      </p>
    </aside>
  </div>
</body>
</html>
